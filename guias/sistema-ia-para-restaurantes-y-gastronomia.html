<script>var GUIA = {"slug": "sistema-ia-para-restaurantes-y-gastronomia", "t": "Sistema con Claude para restaurantes y gastronomía", "d": "Respuestas de reservas, carta descrita, reseñas contestadas y compras ordenadas: el sistema que le podés instalar a un restaurante o un local de comida.", "tema": "Sistemas listos por rubro", "min": 8, "fichaNombre": "Gastronomía", "ficha": [["Qué es", "Un asistente con la carta, los horarios y las reglas del local para responder, comunicar y ordenar compras."], ["Necesitás", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No toma pedidos solo ni maneja la caja. Tampoco sabe el stock si nadie se lo pasa."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Mensajes de reservas y preguntas: horarios, si hay opciones sin TACC o veganas, si aceptan grupos.", "Reseñas: contestar las buenas y, sobre todo, las malas sin pelearse.", "Carta y promociones: escribir descripciones, el plato del día y los posts de la semana.", "Compras: armar el pedido a proveedores mirando lo que se vendió.", "Eventos y grupos: presupuestos para cumpleaños o empresas.", "Capacitar al personal nuevo en la carta y en cómo se atiende."]}, {"h": "El sistema", "lista": ["Proyecto \"Local\": carta con ingredientes y alérgenos, horarios, políticas de reserva y de grupos, proveedores y tono de la marca.", "Skill de respuestas y reservas: contesta con los datos del local y nunca confirma una reserva sin que alguien la cargue.", "Skill de reseñas: propone respuestas a reseñas buenas y malas con el tono del dueño.", "Skill de pedido a proveedores: con las ventas de la semana y el stock contado, arma el pedido sugerido para revisar.", "Conectores: Google Drive para la planilla de ventas y stock, Gmail para borradores a proveedores y presupuestos de eventos.", "Automatización: una tarea programada que el lunes a la mañana arma los posts de la semana y el resumen de ventas de la semana anterior."], "aviso": "Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Respuesta a reseña negativa", "c": "Esta es una reseña de un cliente: [PEGÁ LA RESEÑA].\nLo que pasó según el equipo: [CONTEXTO, SI LO HAY].\nEscribí una respuesta pública de hasta 80 palabras que:\n1. Agradezca y reconozca lo que estuvo mal, sin excusas largas.\n2. No discuta datos ni acuse al cliente.\n3. Invite a seguir la charla por privado con [CANAL].\nDespués dame una versión más corta. No ofrezcas descuentos salvo que yo te lo diga."}, {"t": "Pedido sugerido a proveedores", "c": "Te paso las ventas por plato de la última semana: [PEGÁ O ADJUNTÁ].\nEl stock contado hoy: [PEGÁ].\nLas recetas con cantidades por plato están en el Proyecto.\nArmame una tabla con: insumo, consumo estimado de la semana, stock actual, cantidad sugerida a pedir y a qué proveedor.\nMarcá con DUDA cualquier insumo donde los números no cierren. Es una sugerencia: la revisa el encargado antes de pedir."}, {"t": "Presupuesto para un evento", "c": "Un cliente pide un evento: [CANTIDAD DE PERSONAS, FECHA, TIPO DE EVENTO, LO QUE PIDIÓ].\nCon los menús para grupos y las condiciones del Proyecto, armá un presupuesto con dos opciones, qué incluye cada una, la seña y las condiciones de cancelación. Si falta un precio, dejalo como [COMPLETAR]."}]}, {"h": "Cómo instalarlo", "pasos": ["Juntá la carta con alérgenos, los menús de grupo, las políticas y 10 reseñas reales con las respuestas que le gustaron al dueño.", "Armá el Proyecto \"Local\" y probá las respuestas con mensajes reales de la última semana.", "Pasá las recetas a una planilla simple (plato, insumo, cantidad) en Google Drive: sin las con Claude sin saber fórmulas\" te ayuda."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"], "cat": "rubros", "parte": "construi"};</script>

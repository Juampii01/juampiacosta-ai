<script>var GUIA = {"slug": "sistema-ia-para-restaurantes-y-gastronomia", "t": "Sistema con Claude para restaurantes y gastronomía", "d": "Respuestas de reservas, carta descrita, reseñas contestadas y compras ordenadas: el sistema que le puedes instalar a un restaurante o un local de comida.", "tema": "Sistemas listos por rubro", "min": 8, "fichaNombre": "Gastronomía", "ficha": [["Qué es", "Un asistente con la carta, los horarios y las reglas del local para responder, comunicar y ordenar compras."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No toma pedidos solo ni maneja la caja. Tampoco sabe el stock si nadie se lo pasa."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Mensajes de reservas y preguntas: horarios, si hay opciones sin TACC o veganas, si aceptan grupos.", "Reseñas: contestar las buenas y, sobre todo, las malas sin pelearse.", "Carta y promociones: escribir descripciones, el plato del día y los posts de la semana.", "Compras: armar el pedido a proveedores mirando lo que se vendió.", "Eventos y grupos: presupuestos para cumpleaños o empresas.", "Capacitar al personal nuevo en la carta y en cómo se atiende."]}, {"h": "El sistema", "lista": ["Proyecto \"Local\": carta con ingredientes y alérgenos, horarios, políticas de reserva y de grupos, proveedores y tono de la marca.", "Skill de respuestas y reservas: contesta con los datos del local y nunca confirma una reserva sin que alguien la cargue.", "Skill de reseñas: propone respuestas a reseñas buenas y malas con el tono del dueño.", "Skill de pedido a proveedores: con las ventas de la semana y el stock contado, arma el pedido sugerido para revisar.", "Conectores: Google Drive para la planilla de ventas y stock, Gmail para borradores a proveedores y presupuestos de eventos.", "Automatización: una tarea programada que el lunes a la mañana arma los posts de la semana y el resumen de ventas de la semana anterior."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Respuesta a reseña negativa", "c": "Esta es una reseña de un cliente: [PEGA LA RESEÑA].\nLo que pasó según el equipo: [CONTEXTO, SI LO HAY].\nEscribe una respuesta pública de hasta 80 palabras que:\n1. Agradezca y reconozca lo que estuvo mal, sin excusas largas.\n2. No discuta datos ni acuse al cliente.\n3. Invite a seguir la charla por privado con [CANAL].\nDespués dame una versión más corta. No ofrezcas descuentos salvo que yo te lo diga."}, {"t": "Pedido sugerido a proveedores", "c": "Te paso las ventas por plato de la última semana: [PEGA O ADJUNTA].\nEl stock contado hoy: [PEGA].\nLas recetas con cantidades por plato están en la planilla de recetas (sumada a los archivos del Proyecto o en Google Drive, con el conector prendido en el chat).\nÁrmame una tabla con: insumo, consumo estimado de la semana, stock actual, cantidad sugerida a pedir y a qué proveedor.\nMarca con DUDA cualquier insumo donde los números no cierren. Es una sugerencia: la revisa el encargado antes de pedir."}, {"t": "Presupuesto para un evento", "c": "Un cliente pide un evento: [CANTIDAD DE PERSONAS, FECHA, TIPO DE EVENTO, LO QUE PIDIÓ].\nCon los menús para grupos y las condiciones del Proyecto, arma un presupuesto con dos opciones, qué incluye cada una, la seña y las condiciones de cancelación. Si falta un precio, déjalo como [COMPLETAR]."}]}, {"h": "Cómo instalarlo", "pasos": ["Junta la carta con alérgenos, los menús de grupo, las políticas y 10 reseñas reales con las respuestas que le gustaron al dueño.", "Arma el Proyecto \"Local\" y prueba las respuestas con mensajes reales de la última semana.", "Pasa las recetas a una planilla simple (plato, insumo, cantidad) en Google Drive: sin esto la skill de compras no sirve.", "Convierte cada prompt en skill: una carpeta con su SKILL.md, comprimida en ZIP. Súbelas en Customize → Skills, con el botón +, después + Create skill y Upload a skill. Después conecta Drive y Gmail con la cuenta del local desde Customize → Connectors.", "Programa la tarea del lunes en Cowork (Scheduled, New task, frecuencia semanal) con un prompt que diga en qué archivos de Drive están las ventas y la carta, y que no publique ni envíe nada. Revisa con el dueño las corridas de las primeras dos semanas en la página Scheduled.", "Déjale al encargado una lista de pedidos de ejemplo para que sepa qué pedirle a Claude."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para restaurantes. Vi las reseñas del local y me imagino que entre mensajes, reseñas y redes se van varias horas por semana.\nLo que hago es dejarte un asistente que conoce tu carta y tus reglas: te prepara las respuestas, las reseñas y los posts, y te arma el pedido a proveedores con lo que vendiste. Tú o tu encargado revisan y mandan.\n¿Te paso a mostrar cómo respondería tus últimas tres reseñas?"}], "lista": ["Argumento central: \"Menos tiempo en el celular y más en el salón. Y un orden en las compras que hoy depende de la memoria de una persona.\"", "Buen gancho para la demo: responder en vivo una reseña mala real del local."]}, {"h": "Cuidados del rubro", "lista": ["Alérgenos: Claude solo informa lo que está en la carta cargada. Ante cualquier duda de alergia, la respuesta es \"lo consultamos con cocina\".", "Reseñas: nada de reseñas inventadas ni pedidas a cambio de algo. Claude responde, no fabrica opiniones.", "Datos de clientes: teléfonos y nombres de reservas no van al Proyecto."], "aviso": "Una mala respuesta sobre alérgenos puede lastimar a alguien. Que siempre la confirme una persona de cocina, y que los datos de clientes se cuiden según las leyes de cada país."}], "faq": [{"q": "¿Puede tomar reservas solo?", "a": "En este sistema prepara la respuesta y alguien carga la reserva. Automatizarlo del todo depende del sistema de reservas que usen y de sus integraciones."}, {"q": "No tienen planilla de ventas, ¿igual sirve?", "a": "Sí, para respuestas, reseñas y contenido. Para compras, empieza con una planilla semanal simple. La guía \"Analizar planillas con Claude sin saber fórmulas\" te ayuda."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/12512198-how-to-create-custom-skills", "https://support.claude.com/en/articles/9519177"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en una pizzería de barrio", "negocio": "Ejemplo inventado: una pizzería con cervecería en Cordón, Montevideo. Atienden el dueño, un encargado, dos cocineros y dos mozos. Las reservas y preguntas llegan por Instagram y WhatsApp, y las reseñas, por Google.", "punto_de_partida": "El dueño contesta reseñas cuando se acuerda, a veces enojado. El pedido de los martes al proveedor de quesos y fiambres lo hace el encargado de memoria, y algunas semanas falta mozzarella y otras sobra.", "pasos": ["En la demo, la persona que lo instaló pegó una reseña mala real del local (demora y pizza fría) y armó la respuesta con el prompt de reseñas. El dueño cambió una palabra y dijo que la hubiera publicado así.", "Juntó con el dueño la carta con ingredientes y alérgenos, los menús para grupos, la política de reservas y 10 reseñas con las respuestas que le gustaban.", "Prendió Code execution and file creation en Settings → Capabilities. Creó el Proyecto privado \"Local\", pegó las instrucciones del kit completando los corchetes y subió la carta, los menús y las reseñas de ejemplo.", "Con el encargado armó en Google Drive las planillas de recetas, ventas y stock con las columnas del kit. Unificaron unidades: todo el queso en gramos, la harina en kilos. Sumó las planillas al Proyecto desde Files, + y Drive.", "Probó una semana los prompts de respuestas y reseñas con los mensajes reales. Para el pedido, el encargado contó stock el lunes y comparó el pedido sugerido con el que iba a hacer él. Las filas marcadas DUDA eran insumos con nombres distintos en dos planillas; los corrigieron.", "Convirtió el prompt de reseñas en la skill respuestas-de-resenas del kit y armó otra para el pedido. Subió cada carpeta en ZIP desde Customize → Skills y conectó Drive y Gmail con la cuenta del local.", "Pasó la carta y las promociones a un documento de Drive y creó la tarea de los lunes del kit en Cowork, semanal, pidiendo aprobación. Las dos primeras semanas el dueño comparó el resumen con la caja.", "Le dejó al encargado una hoja con pedidos de ejemplo: \"responde esta reseña\", \"arma el pedido con el stock de hoy\", \"presupuesto para 25 personas el sábado\"."], "resultado": "Quedó un Proyecto con la carta, los alérgenos y las reglas del local, dos skills para reseñas y pedidos, planillas con nombres y unidades parejas y una tarea que cada lunes deja el resumen de ventas y los posts de la semana. Las reseñas las publica el dueño, los pedidos los confirma el encargado y nada sobre alérgenos sale sin pasar por cocina."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner de la organización: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "El pedido sugerido trae cantidades absurdas o muchas filas marcadas DUDA.", "solucion": "Casi siempre es una de dos cosas: el mismo insumo escrito distinto en recetas y en stock, o unidades distintas (kilos en una planilla, gramos en otra). Pídele a Claude que liste los insumos de recetas que no encuentra en stock y los que tienen unidades distintas, corrige las planillas y vuelve a pedir el pedido."}, {"sintoma": "En el Proyecto no aparece la opción de sumar las planillas desde Drive.", "solucion": "Esa opción está solo en proyectos privados. Si el Proyecto se compartió con el equipo, prende el conector de Google Drive en el chat (+, Connectors) y nombra la planilla en el pedido, o sube las planillas como archivo y reemplázalas cada semana."}, {"sintoma": "Claude respondió que un plato es sin TACC o apto para un alérgico y la carta no lo decía.", "solucion": "Agrega a la carta una columna explícita de alérgenos y aptitudes por plato, y deja en las instrucciones del Proyecto la regla de que solo se informa lo que figura ahí. Prueba de nuevo en un chat nuevo con la misma pregunta. Mientras tanto, cualquier respuesta sobre alergias la confirma cocina antes de mandarla."}, {"sintoma": "Claude lee un mail pero no ve el PDF o la imagen que venía adjunta.", "solucion": "El conector de Gmail ve los datos del adjunto (nombre, tipo) pero no su contenido. Guarda el archivo en Google Drive (el conector de Drive sí extrae el texto de PDFs y planillas) o súbelo al chat, y pídele a Claude que lo lea desde ahí."}], "kit": [{"archivo": "respuestas-de-resenas/SKILL.md", "que_es": "Skill que clasifica la reseña (buena, mixta, mala o delicada) y propone la respuesta pública con el tono del dueño, sin discutir, sin descuentos y sin inventar. Guárdala en una carpeta respuestas-de-resenas, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: respuestas-de-resenas\ndescription: Propone respuestas públicas a reseñas buenas y malas de un restaurante con el tono del dueño, sin discutir ni inventar. Úsala cuando peguen una reseña de Google, redes o una app de delivery.\n---\n\n# Respuestas de reseñas\n\nPreparas la respuesta pública a una reseña del local. La publica una persona del equipo, nunca tú.\n\n## Qué te pasan\n\n- El texto de la reseña y, si está, la cantidad de estrellas.\n- A veces, lo que pasó según el equipo (\"ese día faltó un mozo\", \"el plato salió tarde de cocina\").\n- El tono del local está en las instrucciones del Proyecto y en las respuestas de ejemplo que le gustaron al dueño.\n\n## Primero, clasifica\n\n- **Buena**: agradece algo concreto.\n- **Mixta**: elogia una parte y se queja de otra.\n- **Mala**: queja sobre atención, demora, comida, precio o limpieza.\n- **Delicada**: menciona una alergia, una intoxicación, un problema de salud, un trato discriminatorio o una amenaza. No la respondas: avisa que la tiene que ver el dueño y propón solo una línea de contacto por privado.\n\n## Cómo escribir\n\n- **Buena**: hasta 40 palabras. Agradece y menciona lo que la persona destacó, con sus palabras. Invita a volver sin promociones.\n- **Mixta**: agradece lo bueno y reconoce lo otro en una frase, sin excusas.\n- **Mala**: hasta 80 palabras. Agradece, reconoce lo que estuvo mal sin justificarte, cuenta en una frase qué se revisa si el equipo te lo dijo, e invita a seguir por [CANAL PRIVADO].\n\n## Reglas\n\n- No discutas datos ni le digas al cliente que está equivocado, aunque el equipo crea que lo está.\n- No ofrezcas descuentos, invitaciones ni reintegros salvo que te lo indiquen.\n- No inventes lo que pasó ni prometas cambios que nadie decidió.\n- No repitas datos personales que aparezcan en la reseña.\n- No uses la misma frase de apertura en dos respuestas seguidas.\n- Nada de signos de exclamación en las respuestas a reseñas malas.\n\n## Qué entregas\n\n1. La clasificación en una palabra.\n2. La respuesta propuesta.\n3. Una versión más corta.\n4. Si la reseña trae un dato que el equipo debería revisar (un plato, un horario, un mozo), una línea para el dueño.\n"}, {"archivo": "proyecto-local-planillas-recetas-ventas-stock.md", "que_es": "Las instrucciones para pegar en el Proyecto \"Local\" y las tres planillas (recetas, ventas y stock) con columnas y unidades fijas, para que el pedido a proveedores salga bien.", "contenido": "# Proyecto \"Local\": instrucciones y planillas de recetas, ventas y stock\n\nLa skill de pedido a proveedores solo sirve si recetas, ventas y stock están en planillas con columnas fijas y las mismas unidades. Este archivo tiene las instrucciones para el Proyecto y las tres planillas.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DEL LOCAL], un [TIPO DE LOCAL] en [BARRIO Y CIUDAD].\n\nPara qué estás:\n- Preparar respuestas a mensajes de reservas y preguntas.\n- Proponer respuestas a reseñas.\n- Escribir descripciones de la carta, el plato del día y los posts de la semana.\n- Armar el pedido sugerido a proveedores y los presupuestos de eventos.\n\nReglas que no se rompen:\n1. Usa solo los datos de este Proyecto y de las planillas del local. Si algo no está, escribe [COMPLETAR] o \"lo consultamos\".\n2. Alérgenos y opciones sin TACC, veganas o vegetarianas: informa solo lo que figura en la carta cargada. Ante cualquier duda de alergia, la respuesta es \"lo consultamos con cocina\". Nunca digas que un plato es apto si la carta no lo dice.\n3. Nunca confirmes una reserva. Propón el texto y aclara que la reserva queda confirmada cuando la carga [QUIÉN CARGA LAS RESERVAS].\n4. No inventes reseñas, testimonios ni opiniones de clientes.\n5. Precios y condiciones de grupos van tal cual figuran en el Proyecto.\n6. Tono: [EJEMPLO: cercano, con voseo, sin exagerar]. Firma como [NOMBRE] de [LOCAL].\n7. No escribas teléfonos ni nombres de clientes de reservas.\n\n## 2. Planilla de recetas (Google Sheets: \"Recetas\")\n\nUna fila por insumo de cada plato.\n\n| Columna | Qué va | Ejemplo de formato |\n|---|---|---|\n| plato | Nombre igual al de la planilla de ventas | [PLATO] |\n| insumo | Nombre igual al de la planilla de stock | [INSUMO] |\n| cantidad | Número por porción, sin unidad | [N] |\n| unidad | g, kg, ml, l o unidad. La misma que en stock | g |\n| proveedor | A quién se le compra | [PROVEEDOR] |\n\n## 3. Planilla de ventas semanal (Google Sheets: \"Ventas\")\n\nUna fila por plato y por semana. Si el sistema de caja exporta ventas, pega la exportación en otra pestaña y pasa aquí solo estas columnas.\n\n| Columna | Qué va |\n|---|---|\n| semana | Fecha del lunes, AAAA-MM-DD |\n| plato | Nombre igual al de recetas |\n| porciones | Número vendido en la semana |\n\n## 4. Planilla de stock (Google Sheets: \"Stock\")\n\nUna fila por insumo, actualizada el día del conteo.\n\n| Columna | Qué va |\n|---|---|\n| insumo | Nombre igual al de recetas |\n| stock | Número contado |\n| unidad | La misma que en recetas |\n| minimo | Lo que nunca puede faltar, en la misma unidad |\n| fecha_conteo | AAAA-MM-DD |\n| proveedor | A quién se le compra |\n| dia_de_pedido | Qué día se le pide |\n\n## Reglas de las planillas\n\n- Los nombres de platos e insumos se escriben igual en las tres planillas. Si en una dice \"muzzarella\" y en otra \"mozzarella\", Claude no los va a cruzar bien.\n- Si una receta está en kilos y el stock en gramos, el pedido sale mal. Elige una unidad por insumo y úsala en todos lados.\n- Si el Proyecto es privado, puedes sumar las planillas a sus archivos desde Files, + y Drive. Si es compartido, esa opción no aparece: prende el conector de Google Drive en el chat.\n\n## 5. Otros archivos para el Proyecto\n\n- Carta con ingredientes y alérgenos por plato (un documento).\n- Menús para grupos con precios, seña y condiciones de cancelación.\n- Horarios, política de reservas y de grupos.\n- 10 reseñas reales con las respuestas que le gustaron al dueño.\n"}, {"archivo": "tarea-programada-lunes-restaurante.md", "que_es": "La tarea programada de los lunes lista para pegar: checklist previa, configuración sugerida en Cowork y el prompt que arma el resumen de ventas y los posts de la semana sin publicar nada.", "contenido": "# Tarea programada: posts de la semana y resumen de ventas (lunes)\n\nLa tarea arma los borradores de posts y el resumen de la semana anterior. No publica, no envía mails y no toca las planillas.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es del local y tiene un plan pago (las tareas programadas están solo en planes pagos).\n- [ ] Google Drive está conectado con la cuenta del local y, en un chat, Claude lee las planillas \"Ventas\", \"Stock\" y \"Recetas\".\n- [ ] La carta y la lista de promociones de la semana están en un documento de Drive, porque la tarea no sabe qué cargaste en el Proyecto.\n- [ ] Probaste el prompt de abajo a mano en un chat y el resultado sirve.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral y New task. Elige \"Create with Claude\" y pégale este archivo, o \"Set up manually\" y completa nombre, prompt, modo de aprobación y frecuencia. En la experiencia nueva de Claude también puedes pedirla en una conversación y confirmar con \"Schedule\".\n\nConfiguración sugerida:\n- Nombre: Lunes del local\n- Frecuencia: semanal (weekly), el lunes a primera hora.\n- Aprobación: el modo que pide permiso antes de actuar. Las primeras dos semanas, revisa cada corrida en la página Scheduled junto con el dueño.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de [NOMBRE DEL LOCAL].\n\n1. Abre en Google Drive la planilla \"[NOMBRE DE LA PLANILLA DE VENTAS]\" y toma las filas de la semana pasada (de lunes a domingo).\n2. Arma el resumen de ventas: los 5 platos más vendidos, los 5 menos vendidos y los platos que vendieron menos que la semana anterior. Usa solo los números de la planilla. Si la semana pasada no está cargada, dilo y no inventes.\n3. Abre \"[NOMBRE DEL DOCUMENTO DE CARTA Y PROMOCIONES]\" y escribe 3 borradores de posts para esta semana: uno de un plato de la carta, uno de la promoción vigente y uno del local o del equipo. Cada post con texto corto, en voseo, y una línea sugiriendo qué foto usar.\n4. En los posts, nombra alérgenos u opciones sin TACC o veganas solo si figuran en la carta.\n\nReglas:\n- No publiques nada ni envíes mails.\n- No modifiques las planillas ni los documentos.\n- No inventes precios ni promociones.\n\nAl final déjame: \"Resumen de ventas\" (tabla), \"Para mirar\" (hasta 3 cosas que llaman la atención en los números, como preguntas para el dueño) y \"Posts de la semana\" (los tres borradores).\n\n## Revisión de las primeras dos semanas\n\n- [ ] El dueño compara el resumen con lo que vio en la caja. Si no coincide, revisa que la planilla de ventas esté completa antes del lunes.\n- [ ] El encargado marca qué posts usó tal cual y cuáles cambió.\n- [ ] Con eso ajustas el tono y el largo en el prompt.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

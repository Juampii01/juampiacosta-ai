<script>var GUIA = {"slug": "claude-code-liviano", "t": "Claude Code liviano: que no se te llene el contexto", "d": "Los hábitos y comandos oficiales para que cada mensaje cargue menos: limpiar entre tareas, compactar bien, CLAUDE.md corto, menos MCP, subagentes, modo plan y el modelo justo.", "tema": "Gastá menos tokens", "min": 8, "fichaNombre": "Claude Code liviano", "ficha": [["Qué es", "Una forma de trabajar con Claude Code que mantiene chica la conversación para que tu plan o tu crédito rinda más."], ["Necesitás", "Claude Code instalado y una sesión abierta en tu proyecto."], ["Cuánto cuesta", "Nada extra: son comandos y ajustes que ya vienen."], ["Qué no hace", "No sube tus límites: hace que gastes menos de lo que ya tenés."]], "secciones": [{"h": "Por qué una sesión larga gasta más", "p": ["Claude Code le manda al modelo toda la conversación en cada pedido. Cada vez que Claude usa una herramienta (leer un archivo, correr un comando) se manda otro pedido con esos resultados. Por eso, una pregunta de una línea en una sesión abierta todo el día igual consume por toda la conversación.", "Claude Code ya ahorra solo de dos formas: guarda en caché lo que se repite y, cuando la conversación se acerca al límite, la resume sola (compactación automática). Lo que sigue te ayuda a que no tenga que llegar a eso."]}, {"h": "Mirá qué está ocupando lugar", "lista": ["/context: te muestra una grilla de colores con lo que ocupa el contexto, y sugerencias para herramientas pesadas, memoria inflada y avisos de capacidad. Si usás la pantalla completa (fullscreen), el detalle por ítem aparece colapsado para que se vea la grilla; con /context all lo expandís.", "/usage: tu consumo en la sesión y los límites de tu plan. /cost es lo mismo.", "Línea de estado: podés tener siempre a la vista el porcentaje de contexto usado. Lo armás con /statusline (está explicado en la guía de cómo medir tu consumo)."], "p": ["Mirá /context al arrancar: lo que aparece ahí antes de que escribas nada (CLAUDE.md, memoria automática, nombres de herramientas MCP, descripciones de skills) se carga en cada sesión."]}, {"h": "Limpiá entre tareas y compactá con criterio", "pasos": ["Terminaste una tarea y vas a otra que no tiene nada que ver: corré /rename con un nombre claro para encontrarla después.", "Corré /clear. Empezás una conversación vacía; tu CLAUDE.md se sigue cargando. Si querés volver a la anterior, usá /resume.", "Si seguís con la misma tarea pero la charla se hizo larga, usá /compact con instrucciones, por ejemplo: /compact Focus on code samples and API usage. Así decidís vos qué conserva el resumen.", "Si querés que la compactación siempre cuide algo, agregá en tu CLAUDE.md una sección \"# Compact instructions\" con lo que tiene que mantener."], "aviso": "/compact también gasta: manda toda la conversación para resumirla. Con la caché caliente cuesta una fracción; después de una pausa larga, cuando la caché ya venció, es cuando más cuesta. Compactá en un corte natural del trabajo, no al volver de un rato largo. Si no necesitás continuidad, /clear no cuesta nada.", "prompts": [{"t": "Resumen antes de /clear", "c": "Antes de que limpie la sesión, escribime un resumen corto para arrancar de cero: objetivo, qué archivos tocamos, decisiones que tomamos y qué falta. Máximo 15 líneas. No hagas cambios."}]}, {"h": "Un CLAUDE.md corto", "p": ["CLAUDE.md se carga al empezar cada sesión, así que todo lo que tiene se paga siempre. La documentación oficial recomienda apuntar a menos de 200 líneas por archivo: los archivos largos ocupan más contexto y Claude los sigue peor.", "Lo que es para un trabajo puntual (cómo revisar un PR, cómo hacer una migración) pasalo a una skill: las skills se cargan solo cuando se usan. Las reglas que valen solo para una carpeta podés ponerlas en .claude/rules/ con un campo paths, y se cargan cuando Claude lee esos archivos."], "prompts": [{"t": "Achicá tu CLAUDE.md", "c": "Leé mi CLAUDE.md. Proponeme una versión de menos de 200 líneas que deje solo lo que hace falta en todas las sesiones: qué es el proyecto, comandos para correr y probar, y reglas que nunca hay que romper. Lo que sea de un flujo puntual, marcámelo para pasarlo a una skill o a .claude/rules/. Mostrame el cambio antes de guardarlo."}]}, {"h": "Apagá los MCP que no estás usando", "p": ["Las herramientas de los servidores MCP se cargan diferidas: hasta que Claude usa una, en el contexto entran solo los nombres y las instrucciones del servidor. Igual suman."], "lista": ["/mcp: abre la lista de servidores para ver cuáles tenés y apagar los que no usás.", "/mcp disable [nombre]: apaga uno sin abrir la lista. Con /mcp enable [nombre] lo volvés a prender.", "Si hay una herramienta de terminal para lo mismo (gh, aws, gcloud, sentry-cli), la documentación dice que gasta menos contexto que un MCP."]}, {"h": "Subagentes y modo plan", "lista": ["Subagentes: correr tests, leer documentación o revisar logs largos llena el contexto. Si lo hace un subagente, toda esa salida queda en su contexto y a tu conversación vuelve solo el resumen. Ojo: lo que usa el subagente también cuenta para tu consumo.", "Modo plan: apretá Shift+Tab hasta llegar al modo plan, o escribí /plan seguido de la tarea. Claude investiga y te propone cómo hacerlo antes de tocar nada, y evitás rehacer trabajo si el rumbo era otro.", "Cortá a tiempo: si ves que va para otro lado, apretá Esc. Con /rewind (o Esc dos veces) volvés a un punto anterior."], "prompts": [{"t": "Tests en un subagente", "c": "Usá un subagente para correr los tests y que me informe solo los que fallan, con su mensaje de error."}]}, {"h": "El modelo y el esfuerzo justos", "lista": ["/model: cambiás de modelo, y queda guardado como predeterminado para las sesiones nuevas. Elegilo al arrancar: cambiar de modelo a mitad de una sesión hace que el pedido siguiente relea toda la conversación sin caché. Según la documentación oficial, Sonnet resuelve bien la mayoría de las tareas de código y cuesta menos que Opus; dejá Opus para decisiones de arquitectura o razonamiento de varios pasos.", "opusplan: con /model opusplan usa Opus en el modo plan y pasa a Sonnet para ejecutar. Ojo: cada vez que entrás o salís del modo plan cambia el modelo, y el pedido siguiente arranca sin caché.", "Subagentes simples: en la configuración del subagente podés poner model: haiku.", "/effort: bajá el nivel de esfuerzo (por ejemplo /effort low) para tareas simples. El razonamiento extendido se cobra como tokens de salida."]}], "faq": [{"q": "¿/clear me borra el trabajo?", "a": "No. Tus archivos quedan igual. Solo empieza una conversación nueva y podés volver a la anterior con /resume."}, {"q": "¿Cuándo uso /clear y cuándo /compact?", "a": "/clear cuando cambiás de tarea. /compact cuando seguís con lo mismo pero la charla se hizo larga y necesitás que recuerde lo hablado."}, {"q": "Si Claude Code compacta solo, ¿para qué lo hago yo?", "a": "Porque la compactación automática adivina qué es importante. Si compactás vos con instrucciones, elegís qué se queda. Y si limpiás entre tareas, muchas veces ni hace falta."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/fr/context-window", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/model-config", "https://code.claude.com/docs/en/context-window", "https://code.claude.com/docs/en/prompt-caching", "https://code.claude.com/docs/en/statusline", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: una semana de trabajo sin que se llene el contexto", "negocio": "Ejemplo inventado: una desarrolladora freelance de Montevideo que mantiene la tienda online de una dietética de barrio. Trabaja sola, con Claude Code en la terminal y un plan Pro.", "punto_de_partida": "Dejaba una sola sesión abierta toda la semana para todo: arreglos, textos, pruebas. Su CLAUDE.md había crecido con instrucciones de cada tarea y al arrancar aparecía un aviso de que era demasiado largo.", "pasos": ["Al abrir la sesión corrió /context. En Memory files vio cuánto lugar ocupaba su CLAUDE.md, y que tenía conectados dos servidores MCP que no usaba desde hacía semanas.", "Pegó el prompt \"Achicá tu CLAUDE.md\" de la guía. Claude le propuso una versión corta con el formato del kit y le marcó dos flujos (publicar una versión y migrar la base) para pasar a skills. Revisó el cambio antes de guardarlo.", "Movió las reglas de estilo de los componentes a .claude/rules/componentes.md con un encabezado paths que apunta solo a la carpeta de componentes. Ahora se cargan cuando Claude lee esos archivos, no siempre.", "Corrió /mcp disable con el nombre de cada servidor que no usaba. Para GitHub dejó de usar el MCP y le pidió a Claude que use gh desde la terminal.", "Copió el archivo corredor-de-tests.md del kit en .claude/agents/ y, al terminar cada cambio, escribió: \"Usá el subagente corredor-de-tests para correr la suite\". A su conversación volvió solo el resumen de lo que falló.", "Agregó el statusLine del kit a ~/.claude/settings.json (ya tenía jq instalado). Desde ahí ve siempre el modelo y el porcentaje de contexto abajo de todo.", "Cuando terminó el arreglo del carrito y tenía que pasar a los textos de la página de envíos, pegó el prompt \"Resumen antes de /clear\", guardó el resumen, corrió /rename carrito-arreglo y después /clear.", "Para un cambio grande en el cálculo de envíos usó /plan seguido de la tarea. Claude exploró y le propuso un plan; ella corrigió una parte antes de que tocara el código.", "A mitad de la tarde, antes de irse a una reunión larga, compactó con /compact Conservá los archivos tocados del cálculo de envíos y los tests que fallan, en vez de dejar que la caché venciera con todo el historial adentro.", "El viernes abrió /usage para ver qué le estaba pesando más en la semana y aplicó la recomendación que le correspondía."], "resultado": "Quedó trabajando con sesiones cortas por tarea, un CLAUDE.md breve con su sección de Compact instructions, reglas por carpeta, solo los MCP que usa, un subagente que corre los tests y una línea de estado que le muestra el contexto todo el tiempo. Sabe cuándo usar /clear, cuándo /compact y cuándo /rewind."}, "si_falla": [{"sintoma": "Edité el CLAUDE.md y Claude sigue trabajando como antes.", "solucion": "El CLAUDE.md de la raíz y el de usuario se leen al empezar la sesión. Lo que cambies a mitad de sesión recién se carga con el próximo /clear, /compact o al reiniciar Claude Code. Corré /context y fijate en Memory files qué versión está cargada."}, {"sintoma": "Volví de un rato largo y el primer mensaje tardó mucho y consumió más de lo normal.", "solucion": "La caché venció durante la pausa y Claude Code tuvo que reprocesar toda la conversación. Antes de una pausa larga, hacé /clear si ya terminaste la tarea o /compact si vas a seguir. En /usage, la línea Prompt cache (main) te muestra si la caché está caliente y cuántos fallos hubo."}, {"sintoma": "Después de compactar, Claude se olvidó de una regla que le había dicho.", "solucion": "Si la regla la dijiste solo en el chat, se pierde en el resumen. El CLAUDE.md de la raíz se vuelve a leer del disco después de /compact, así que pasala ahí (o a la sección # Compact instructions si es sobre qué conservar). Las reglas con paths se vuelven a cargar cuando Claude lee un archivo que coincide."}, {"sintoma": "La línea de estado no aparece o queda en blanco.", "solucion": "Revisá que jq esté instalado (el comando del kit lo usa), que el statusLine esté dentro del mismo objeto JSON que el resto de tu settings.json y que la carpeta sea de confianza. Si usás un script en archivo, tiene que ser ejecutable (chmod +x). En Windows con Git Bash, escribí las rutas con barras /. Corré claude --debug para ver el error del script."}, {"sintoma": "/usage muestra un mensaje como \"rate limited until\" una hora.", "solucion": "No significa que no puedas trabajar: significa que Claude Code no puede volver a consultar los límites de tu plan hasta esa hora. Mientras tanto muestra los últimos datos que cargó. Apretá r después de esa hora para actualizar."}], "kit": [{"archivo": "CLAUDE.md", "que_es": "Esqueleto de CLAUDE.md corto: solo lo que hace falta en todas las sesiones, con la sección # Compact instructions lista. Completá los corchetes y guardalo en la raíz de tu proyecto.", "contenido": "# [NOMBRE DEL PROYECTO]\n\n[Una línea: qué es y para quién. Ejemplo: tienda online de [RUBRO] hecha con [FRAMEWORK], con pagos por [MEDIO DE PAGO].]\n\n## Comandos\n\n- Instalar: `[COMANDO]`\n- Levantar en local: `[COMANDO]`\n- Tests: `[COMANDO]` (un solo archivo: `[COMANDO] ruta/al/test`)\n- Lint y tipos: `[COMANDO]`\n\n## Reglas que no se rompen\n\n- No toques `[CARPETA O ARCHIVO SENSIBLE]` sin preguntar.\n- Nunca subas claves ni archivos `.env`.\n- Antes de dar algo por terminado, corré los tests del archivo que cambiaste.\n- [UNA REGLA PROPIA DEL PROYECTO QUE CLAUDE NO PUEDE DEDUCIR LEYENDO EL CÓDIGO]\n\n## Convenciones que no salen del código\n\n- [EJEMPLO: los textos de la interfaz van en español rioplatense, con voseo.]\n- [EJEMPLO: los montos se guardan en centavos, como enteros.]\n\n## Dónde está lo demás\n\n- Flujos puntuales (revisar un PR, hacer una migración, publicar): están en skills dentro de `.claude/skills/`. No los copies acá.\n- Reglas que valen solo para una carpeta: en `.claude/rules/`, con `paths` en el encabezado.\n\n# Compact instructions\n\nCuando compactes, conservá: el objetivo de la tarea actual, los archivos modificados con una línea de qué cambió en cada uno, las decisiones tomadas y por qué, los comandos de test que fallaron y qué falta hacer. Descartá salidas largas de comandos y archivos que solo se leyeron para explorar.\n"}, {"archivo": ".claude/agents/corredor-de-tests.md", "que_es": "Subagente que corre los tests con Haiku y devuelve solo los que fallan. Guardalo en .claude/agents/ de tu proyecto (o en ~/.claude/agents/ para todos tus proyectos) y pedí \"usá el subagente corredor-de-tests\".", "contenido": "---\nname: corredor-de-tests\ndescription: Corre los tests del proyecto y devuelve solo los que fallan, con su error. Usalo cuando haya que correr la suite completa o un grupo grande de tests, o verificar un cambio, para que la salida larga no llene la conversación principal.\ntools: Bash, Read, Grep, Glob\nmodel: haiku\n---\n\nSos un subagente que corre tests y reporta resultados. No modificás archivos.\n\nPasos:\n1. Si te dicen qué comando usar, usá ese. Si no, buscalo en CLAUDE.md o en el archivo de configuración del proyecto (package.json, pyproject.toml, Makefile o similar).\n2. Corré los tests que te pidieron. Si no te dicen cuáles, corré la suite completa.\n3. Si un test falla, leé solo las líneas del error y, si hace falta, la parte del archivo de test que falla.\n\nTu respuesta tiene que ser corta:\n- Primera línea: cuántos tests pasaron y cuántos fallaron, con el comando que usaste.\n- Después, por cada test que falla: nombre, archivo y línea, el mensaje de error en 1 a 3 líneas y tu mejor hipótesis de la causa en una línea.\n- Si todo pasó, decilo en una línea y nada más.\n\nNo pegues la salida completa de los tests. No propongas arreglos de código salvo que te lo pidan.\n"}, {"archivo": "settings.json", "que_es": "Línea de estado que muestra el modelo y el porcentaje de contexto usado. Necesita jq instalado. Si ya tenés un ~/.claude/settings.json, copiá solo el bloque statusLine adentro del objeto que ya existe.", "contenido": "{\n  \"statusLine\": {\n    \"type\": \"command\",\n    \"command\": \"jq -r '\\\"[\\\\(.model.display_name)] \\\\(.context_window.used_percentage // 0)% de contexto\\\"'\"\n  }\n}\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "claude-code-liviano", "t": "Claude Code liviano: que no se te llene el contexto", "d": "Los hábitos y comandos oficiales para que cada mensaje cargue menos: limpiar entre tareas, compactar bien, CLAUDE.md corto, menos MCP, subagentes, modo plan y el modelo justo.", "tema": "Gastá menos tokens", "min": 8, "fichaNombre": "Claude Code liviano", "ficha": [["Qué es", "Una forma de trabajar con Claude Code que mantiene chica la conversación para que tu plan o tu crédito rinda más."], ["Necesitás", "Claude Code instalado y una sesión abierta en tu proyecto."], ["Cuánto cuesta", "Nada extra: son comandos y ajustes que ya vienen."], ["Qué no hace", "No sube tus límites: hace que gastes menos de lo que ya tenés."]], "secciones": [{"h": "Por qué una sesión larga gasta más", "p": ["Claude Code le manda al modelo toda la conversación en cada pedido. Cada vez que Claude usa una herramienta (leer un archivo, correr un comando) se manda otro pedido con esos resultados. Por eso, una pregunta de una línea en una sesión abierta todo el día igual consume por toda la conversación.", "Claude Code ya ahorra solo de dos formas: guarda en caché lo que se repite y, cuando la conversación se acerca al límite, la resume sola (compactación automática). Lo que sigue te ayuda a que no tenga que llegar a eso."]}, {"h": "Mirá qué está ocupando lugar", "lista": ["/context: te muestra una grilla de colores con lo que ocupa el contexto, y sugerencias para herramientas pesadas, memoria inflada y avisos de capacidad. Con /context all ves el detalle completo.", "/usage: tu consumo en la sesión y los límites de tu plan. /cost es lo mismo.", "Línea de estado: podés tener siempre a la vista el porcentaje de contexto usado. Lo armás con /statusline (está explicado en la guía de cómo medir tu consumo)."], "p": ["Mirá /context al arrancar: lo que aparece ahí antes de que escribas nada (CLAUDE.md, memoria automática, nombres de herramientas MCP, descripciones de skills) se carga en cada sesión."]}, {"h": "Limpiá entre tareas y compactá con criterio", "pasos": ["Terminaste una tarea y vas a otra que no tiene nada que ver: corré /rename con un nombre claro para encontrarla después.", "Corré /clear. Empezás una conversación vacía; tu CLAUDE.md se sigue cargando. Si querés volver a la anterior, usá /resume.", "Si seguís con la misma tarea pero la charla se hizo larga, usá /compact con instrucciones, por ejemplo: /compact Focus on code samples and API usage. Así decidís vos qué conserva el resumen.", "Si querés que la compactación siempre cuide algo, agregá en tu CLAUDE.md una sección \"# Compact instructions\" con lo que tiene que mantener."], "aviso": "/compact también gasta: tiene que leer toda la conversación para resumirla. Si no necesitás continuidad, /clear no cuesta nada.", "prompts": [{"t": "Resumen antes de /clear", "c": "Antes de que limpie la sesión, escribime un resumen corto para arrancar de cero: objetivo, qué archivos tocamos, decisiones que tomamos y qué falta. Máximo 15 líneas. No hagas cambios."}]}, {"h": "Un CLAUDE.md corto", "p": ["CLAUDE.md se carga al empezar cada sesión, así que todo lo que tiene se paga siempre. La documentación oficial recomienda apuntar a menos de 200 líneas por archivo: los archivos largos ocupan más contexto y Claude los sigue peor.", "Lo que es para un trabajo puntual (cómo revisar un PR, cómo hacer una migración) pasalo a una skill: las skills se cargan solo cuando se usan. Las reglas que valen solo para una carpeta podés ponerlas en .claude/rules/ con un campo paths, y se cargan cuando Claude lee esos archivos."], "prompts": [{"t": "Achicá tu CLAUDE.md", "c": "Leé mi CLAUDE.md. Proponeme una versión de menos de 200 líneas que deje solo lo que hace falta en todas las sesiones: qué es el proyecto, comandos para correr y probar, y reglas que nunca hay que romper. Lo que sea de un flujo puntual, marcámelo para pasarlo a una skill o a .claude/rules/. Mostrame el cambio antes de guardarlo."}]}, {"h": "Apagá los MCP que no estás usando", "p": ["Las herramientas de los servidores MCP se cargan diferidas: hasta que Claude usa una, en el contexto entran solo los nombres y las instrucciones del servidor. Igual suman."], "lista": ["/mcp: abre la lista de servidores para ver cuáles tenés y apagar los que no usás.", "/mcp disable [nombre]: apaga uno sin abrir la lista. Con /mcp enable [nombre] lo volvés a prender.", "Si hay una herramienta de terminal para lo mismo (gh, aws, gcloud, sentry-cli), la documentación dice que gasta menos contexto que un MCP."]}, {"h": "Subagentes y modo plan", "lista": ["Subagentes: correr tests, leer documentación o revisar logs largos llena el contexto. Si lo hace un subagente, toda esa salida queda en su contexto y a tu conversación vuelve solo el resumen. Ojo: lo que usa el subagente también cuenta para tu consumo.", "Modo plan: apretá Shift+Tab hasta llegar al modo plan, o escribí /plan seguido de la tarea. Claude investiga y te propone cómo hacerlo antes de tocar nada, y evitás rehacer trabajo si el rumbo era otro.", "Cortá a tiempo: si ves que va para otro lado, apretá Esc. Con /rewind (o Esc dos veces) volvés a un punto anterior."], "prompts": [{"t": "Tests en un subagente", "c": "Usá un subagente para correr los tests y que me informe solo los que fallan, con su mensaje de error."}]}, {"h": "El modelo y el esfuerzo justos", "lista": ["/model: cambiás de modelo en la sesión. Según la documentación oficial, Sonnet resuelve bien la mayoría de las tareas de código y cuesta menos que Opus; dejá Opus para decisiones de arquitectura o razonamiento de varios pasos.", "opusplan: con /model opusplan usa Opus en el modo plan y pasa a Sonnet para ejecutar.", "Subagentes simples: en la configuración del subagente podés poner model: haiku.", "/effort: bajá el nivel de esfuerzo (por ejemplo /effort low) para tareas simples. El razonamiento extendido se cobra como tokens de salida."]}], "faq": [{"q": "¿/clear me borra el trabajo?", "a": "No. Tus archivos quedan igual. Solo empieza una conversación nueva y podés volver a la anterior con /resume."}, {"q": "¿Cuándo uso /clear y cuándo /compact?", "a": "/clear cuando cambiás de tarea. /compact cuando seguís con lo mismo pero la charla se hizo larga y necesitás que recuerde lo hablado."}, {"q": "Si Claude Code compacta solo, ¿para qué lo hago yo?", "a": "Porque la compactación automática adivina qué es importante. Si compactás vos con instrucciones, elegís qué se queda. Y si limpiás entre tareas, muchas veces ni hace falta."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/fr/context-window", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/model-config"], "cat": "ahorrar", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "linkedin-agent-11-skills", "fuentes": ["https://github.com/Juampii01/linkedin-agent-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://www.linkedin.com/help/linkedin/answer/a1341387", "https://github.com/Juampii01/linkedin-agent-skills/blob/main/skills/linkedin-comentarista/SKILL.md", "https://support.claude.com/es/articles/12512180", "https://github.com/Juampii01/linkedin-agent-skills/blob/main/skills/linkedin-piloto/SKILL.md"], "post": "LINKEDIN", "t": "LinkedIn Agent: 11 skills para Claude", "d": "Te escriben los posts, preparan comentarios, ordenan respuestas, le ponen nota a tu perfil, te arman la semana y humanizan todo. Vos publicás.", "tema": "Contenido y redes", "min": 8, "fichaNombre": "linkedin-agent-skills", "ficha": [["Qué es", "Un pack de 11 skills para Claude que hace casi todo el trabajo de tu cuenta de LinkedIn."], ["Qué no hace", "No publica nada sin tu sí. Si tenés Claude in Chrome o el navegador integrado de la app de escritorio, linkedin-comentarista y linkedin-piloto pueden publicar lo que aprobaste, de a una acción. Sin navegador, vos copiás y pegás."], ["Necesitás", "Claude con \"Crear y editar archivos\" activado. Funciona en todos los planes."], ["Repo", "github.com/Juampii01/linkedin-agent-skills"]], "secciones": [{"h": "Las 11 skills", "lista": ["linkedin-ganchos-posts: el post completo con 21 fórmulas de ganchos y 3 opciones para elegir.", "linkedin-comentarista: comentarios de valor para posts de otros. Nada de \"gran post\".", "linkedin-respuestas: ordena las respuestas de tus posts y empieza por los posibles clientes.", "linkedin-perfil: nota del 1 al 100 a tu perfil y reescribe lo que te resta puntos.", "linkedin-que-publicar: tus 3 temas y un banco de 30 ideas de posts.", "linkedin-cuando-publicar: la semana armada y las 10 personas con las que interactuar.", "linkedin-con-quien-interactuar: la lista de personas y un plan diario de 15 minutos.", "linkedin-humanizador: saca rayas largas, relleno típico de IA y el \"no es solo esto, sino lo otro\".", "linkedin-limpiador-invisible: borra los caracteres invisibles que se cuelan al copiar.", "linkedin-detector-ia: 5 pruebas para ver cuánto suena a máquina tu texto.", "linkedin-piloto: aprende cómo escribís y te lleva la rutina del día y la semana."]}, {"h": "Instalalo", "pasos": ["En Claude andá a Configuración → Capacidades (con el diseño anterior de Configuración la opción se llama Ejecución de código y creación de archivos; en los planes Team y Enterprise la habilita el propietario de la organización) y activá \"Crear y editar archivos\".", "Descargá el pack: github.com/Juampii01/linkedin-agent-skills (archivo dist/pack-linkedin-11-skills.zip).", "Descomprimilo. Adentro hay 11 .zip, uno por skill: esos no los descomprimas.", "En Claude: Personalizar → Habilidades, botón +, después + Crear habilidad y Cargar una habilidad (con Claude en inglés: Customize → Skills, +, + Create skill, Upload a skill). Repetí con los 11."]}, {"h": "Arrancá en este orden", "prompts": [{"t": "1. Tu ficha de voz", "c": "Usá linkedin-piloto y armemos mi ficha de voz."}, {"t": "2. Tu perfil", "c": "Ponele nota a mi perfil de LinkedIn y reescribí lo que me resta puntos: [PEGÁ TU PERFIL]"}, {"t": "3. Tu primer post", "c": "Escribime un post sobre [TU TEMA]."}, {"t": "4. Tu semana", "c": "Armame la semana de LinkedIn: qué publico, cuándo y con qué 10 personas interactúo."}]}, {"h": "Importante", "p": ["LinkedIn no permite software ni extensiones que automaticen la actividad en la plataforma, y te pueden limitar la cuenta. Por eso las skills preparan todo para copiar y pegar. Si usás el navegador para que Claude publique, cada acción necesita tu sí, de a pocas y espaciadas: el pack se pone un tope de 15 comentarios y 20 conexiones por día."]}], "faq": [{"q": "No me deja subir la skill", "a": "Revisá que \"Crear y editar archivos\" esté activado y que subas uno de los 11 .zip de adentro, no el pack entero."}, {"q": "Claude no usa la skill", "a": "Nombrala en el mensaje: \"Usá linkedin-ganchos-posts para…\"."}], "idea": [], "ejemplo": {"titulo": "Ejemplo resuelto: una contadora que arma su LinkedIn con el pack en una tarde", "negocio": "Ejemplo inventado: una contadora independiente en Miraflores, Lima, que asesora a pymes de servicios. Trabaja con una asistente y consigue clientes casi siempre por recomendación.", "punto_de_partida": "Tiene LinkedIn con el cargo y nada más. Publicó dos veces el año pasado y no sabe qué escribir sin sonar a folleto.", "pasos": ["En Configuración → Capacidades activó Crear y editar archivos. Bajó dist/pack-linkedin-11-skills.zip, lo descomprimió y subió los 11 .zip de adentro uno por uno en Personalizar → Habilidades, con + Crear habilidad y Cargar una habilidad.", "Creó un Proyecto \"LinkedIn\" y pegó las instrucciones del kit, completando a quién quiere atraer (dueños de pymes de servicios) y que trata de usted.", "Abrió un chat en el Proyecto y escribió: \"Usá linkedin-piloto y armemos mi ficha de voz\". Le pasó tres mails que les escribió a clientes explicando un cambio de impuestos. Pegó la ficha que salió en las instrucciones del Proyecto.", "Descargó el PDF de su perfil (Más, Guardar en PDF) y pidió la nota con linkedin-perfil. Cambió primero el titular, que solo decía su cargo, por una de las tres opciones.", "Con linkedin-que-publicar armó sus tres temas y el banco de ideas. Con linkedin-cuando-publicar fijó dos posts por semana en el horario de su audiencia.", "Escribió el primer post con linkedin-ganchos-posts. Una de las opciones decía que había ayudado a \"más de 50 empresas\", un dato que ella no había dado: lo borró y le recordó a Claude la regla de no inventar cifras.", "Pasó el post por el humanizador, el limpiador y el detector. Lo leyó en voz alta, cambió una frase y lo publicó ella.", "Desde el día siguiente sigue la checklist diaria del kit: responde con linkedin-respuestas, comenta tres posts con linkedin-comentarista y los publica a mano, de a uno."], "resultado": "Quedó un Proyecto con su ficha de voz y sus reglas, el perfil reescrito, un banco de ideas y una rutina de 15 minutos por día. Todo lo que sale en su cuenta lo revisa y lo publica ella."}, "si_falla": [{"sintoma": "Al subir una skill aparece un error de formato o de archivo faltante.", "solucion": "Subí uno de los 11 .zip de adentro del pack, no el pack entero ni una carpeta que hayas vuelto a comprimir. Si lo armaste vos, el ZIP tiene que contener la carpeta con el mismo nombre que la skill (por ejemplo, linkedin-perfil) y adentro el SKILL.md."}, {"sintoma": "No aparece la sección de skills o la opción está en gris.", "solucion": "Activá Crear y editar archivos (o Ejecución de código y creación de archivos) en Configuración → Capacidades. En Team o Enterprise, si está en gris, pedile al propietario de la organización que habilite la ejecución de código y las habilidades en Configuración de la organización → Complementos y habilidades."}, {"sintoma": "Claude responde pero no usa la skill.", "solucion": "Revisá en Personalizar → Habilidades que las 11 estén activadas. Después nombrala en el mensaje: \"Usá linkedin-ganchos-posts para...\"."}, {"sintoma": "Subiste las skills en la app pero en Claude Code no aparecen.", "solucion": "Se sincronizan solas si iniciás sesión en Claude Code con la misma cuenta, con Claude Code v2.1.273 o más nuevo. No se sincronizan si Claude Code usa una API key o un proveedor como Amazon Bedrock. La sincronización corre al empezar la sesión y cada unos 10 minutos: abrí una sesión nueva o copialas a mano a ~/.claude/skills/."}, {"sintoma": "Con Claude in Chrome, LinkedIn muestra una verificación, un captcha o un aviso de actividad.", "solucion": "Pará ahí. Resolvelo vos en el navegador y no sigas publicando desde Claude ese día. Volvé al modo copiar y pegar y bajá la cantidad de acciones por día."}], "kit": [{"archivo": "proyecto-linkedin-instrucciones-y-ficha-de-voz.md", "que_es": "Las instrucciones para un Proyecto \"LinkedIn\" con las reglas del pack y el lugar para guardar la ficha de voz que arma linkedin-piloto, así cada chat la tiene sin pegarla de nuevo.", "contenido": "# Proyecto \"LinkedIn\": instrucciones y ficha de voz\n\nlinkedin-piloto sugiere guardar tu ficha de voz donde la tengas siempre a mano. Lo más cómodo es un Proyecto de Claude: la ficha queda en las instrucciones y cada chat que abrís adentro ya la tiene.\n\nCómo usarlo:\n1. En Claude creá un Proyecto llamado \"LinkedIn\".\n2. Pegá la parte 1 en las instrucciones del Proyecto (Set project instructions).\n3. La primera vez, abrí un chat en el Proyecto y escribí: \"Usá linkedin-piloto y armemos mi ficha de voz\". Cuando te la devuelva, pegala en la parte 2 y actualizá las instrucciones.\n\n## 1. Instrucciones del Proyecto (copiá desde acá)\n\nSos mi asistente de LinkedIn. Trabajás con las skills del pack linkedin-agent-skills.\n\nQuién soy: [NOMBRE], [QUÉ HAGO EN UNA FRASE], en [CIUDAD Y PAÍS].\nA quién quiero atraer: [CLIENTE IDEAL CONCRETO, POR EJEMPLO: \"dueños de pymes de 5 a 30 empleados que facturan en dólares\"].\nQué quiero que hagan: [ESCRIBIRME POR PRIVADO / AGENDAR UNA LLAMADA / DESCARGAR UN RECURSO].\nZona horaria de mi audiencia: [ZONA].\n\nReglas:\n1. Nada se publica, comenta, envía ni cambia en mi cuenta sin un sí mío para esa acción concreta. Si no hay navegador conectado, todo termina en un bloque para copiar.\n2. No inventes clientes, cifras, logros ni experiencias. Si un post necesita un dato que no te di, dejá {{dato}} y avisame.\n3. Datos de clientes: nunca nombres ni detalles que permitan identificarlos, salvo que yo te diga que tengo permiso.\n4. Cada post pasa por linkedin-humanizador, linkedin-limpiador-invisible y linkedin-detector-ia antes de mostrármelo como final.\n5. Escribí en español con [VOS / TÚ / USTED], según mi ficha de voz.\n6. Si te pido algo fuera de LinkedIn, avisame que estamos en el Proyecto de LinkedIn.\n\n## 2. Mi ficha de voz (completala con lo que te devuelva linkedin-piloto)\n\n- Tono: [EJEMPLO: directo, cercano, sin tecnicismos]\n- Largo típico de frase: [CORTO / MEDIO]\n- Tratamiento: [VOS / TÚ / USTED]\n- Palabras y frases mías: [LISTA]\n- Palabras que nunca uso: [LISTA, POR EJEMPLO: sinergia, disruptivo, \"en el mundo de hoy\"]\n- Mis 3 temas: [TEMA 1], [TEMA 2], [TEMA 3]\n- Cliente ideal: [DESCRIPCIÓN]\n- Objetivo a 90 días: [EJEMPLO: tres conversaciones por mes con dueños de pymes]\n- Llamado a la acción preferido: [EJEMPLO: \"si te pasa, escribime por privado\"]\n\n## 3. Archivos para sumar al Proyecto\n\n- El PDF de tu perfil (en tu perfil de LinkedIn: Más, Guardar en PDF).\n- Tres a cinco posts o textos tuyos que te representen.\n- Si tenés: las estadísticas de tus últimos posts exportadas desde LinkedIn.\n"}, {"archivo": "rutina-linkedin-checklist-diaria-y-semanal.md", "que_es": "Checklist con los pedidos listos para pegar: el arranque, la rutina semanal de posts, los 15 minutos diarios y los cuidados si usás el navegador.", "contenido": "# Rutina de LinkedIn con el pack: checklist diaria y semanal\n\nPara tener abierta al lado. Los pedidos están listos para pegar en un chat del Proyecto \"LinkedIn\". Nombrar la skill en el mensaje ayuda a que Claude la use.\n\n## Una sola vez (30 a 45 minutos)\n\n- [ ] \"Usá linkedin-piloto y armemos mi ficha de voz.\" Guardala en las instrucciones del Proyecto.\n- [ ] \"Usá linkedin-perfil con este PDF de mi perfil. Dame la nota y reescribí primero lo que más resta.\"\n- [ ] \"Usá linkedin-que-publicar: mis 3 temas y un banco de 30 ideas.\"\n- [ ] \"Usá linkedin-cuando-publicar: mi audiencia está en [ZONA HORARIA] y tengo [HORAS] por semana.\"\n- [ ] \"Usá linkedin-con-quien-interactuar y armá mi lista de personas.\"\n\n## Cada semana (30 a 45 minutos, el mismo día)\n\n- [ ] Elegí del banco las ideas de la semana (2 o 3 posts alcanzan).\n- [ ] \"Usá linkedin-ganchos-posts y escribime un post sobre [IDEA]. Dame 3 ganchos.\"\n- [ ] Pedí que cada post pase por linkedin-humanizador, linkedin-limpiador-invisible y linkedin-detector-ia.\n- [ ] Leé cada post en voz alta. Si hay una frase que no dirías, cambiala vos.\n- [ ] Revisá que ningún dato sea inventado: cifras, clientes, resultados.\n- [ ] Agendá en tu calendario el día y la hora de cada post. Publicás vos.\n\n## Cada día (15 minutos)\n\n- [ ] Primeros 5 minutos: \"Usá linkedin-respuestas con estos comentarios de mi último post: [PEGÁ]\". Respondé primero a los posibles clientes.\n- [ ] Siguientes 7 minutos: \"Usá linkedin-comentarista con estos posts: [PEGÁ 3 A 5 POSTS]\". Revisá cada comentario y publicalo vos, de a uno.\n- [ ] Últimos 3 minutos: 3 a 5 solicitudes de conexión con nota, a personas de tu lista.\n\n## Si usás Claude in Chrome o el navegador de la app\n\n- [ ] Iniciaste sesión en LinkedIn vos. Claude nunca te pide la contraseña.\n- [ ] Aprobás cada acción por separado, viendo el texto exacto y dónde va.\n- [ ] Pocas acciones por día y espaciadas. El pack se pone un tope de 15 comentarios y 20 conexiones por día.\n- [ ] Si LinkedIn muestra una verificación, un captcha o un aviso, pará y resolvelo vos.\n\n## Cada mes\n\n- [ ] Exportá las estadísticas de tus posts y pedí: \"Usá linkedin-cuando-publicar y ajustá mis horarios con estos datos\".\n- [ ] Volvé a pasar el perfil por linkedin-perfil si cambiaste de oferta o de cliente ideal.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "usalo"};</script>

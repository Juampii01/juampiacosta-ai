<script>var GUIA = {"slug": "convertir-una-tarea-manual-en-skill", "t": "Convierte una tarea que haces a mano en una skill", "d": "El método para pasar a una skill algo que repites todas las semanas, más un prompt para que Claude la arme a partir de cómo lo haces tú.", "tema": "Skills y plugins", "min": 8, "secciones": [{"h": "Qué tareas conviene convertir", "p": ["Una skill rinde cuando le pides a Claude lo mismo una y otra vez y quieres que salga siempre igual. La señal más clara: te encuentras corrigiéndolo con las mismas instrucciones cada vez."], "lista": ["Sí: un informe con formato fijo, un checklist de revisión, un procedimiento de varios pasos, algo que necesita un archivo de referencia para salir bien.", "No: una tarea que haces una sola vez. Explícala en el chat y listo.", "No: traer datos en vivo de otra app. Eso lo hace un conector.", "No: reglas para todas tus charlas. Eso va en tus preferencias personales o en las instrucciones de un proyecto."]}, {"h": "El método en 5 pasos", "pasos": ["Escribe la tarea en una sola frase y cómo se ve un buen resultado. Esa frase va a ser la descripción de la skill.", "Cuenta cómo la haces hoy, paso a paso, como si se la explicaras a alguien que entra a trabajar mañana.", "Junta un ejemplo real que te haya quedado bien. Si tienes uno que salió mal, súmalo también.", "Anota las correcciones que siempre terminas haciendo. Esas son las reglas.", "Anota lo que no tiene que hacer nunca (inventar datos, usar cierto tono, saltear un paso)."], "aviso": "No hace falta que lo escribas prolijo. Una nota de voz pasada a texto sirve igual."}, {"h": "El prompt que arma la skill", "p": ["Pega esto en un chat nuevo con lo que juntaste. Si tienes skill-creator activada en Customize → Skills (viene con los planes pagos), Claude la va a usar para guiarte."], "prompts": [{"t": "De tarea manual a skill", "c": "Quiero convertir una tarea que hago a mano en una skill. Usa skill-creator si la tienes disponible.\n\nLa tarea en una frase: [TAREA].\nCómo la hago hoy, paso a paso: [PASOS].\nEjemplo de un resultado bueno: [PEGA EL EJEMPLO].\nCorrecciones que siempre hago: [LISTA].\nLo que nunca tiene que hacer: [LISTA].\n\nQuiero que:\n1. Me hagas primero las preguntas que te falten para entender la tarea.\n2. Propongas un name en minúsculas con guiones y una description de hasta 200 caracteres que diga qué hace y cuándo usarla.\n3. Escribas el SKILL.md con pasos numerados, reglas y el ejemplo.\n4. Si hay información larga (listas, tablas, textos modelo), la pongas en un archivo aparte dentro de references/ y la menciones en el paso donde se usa.\n5. Me lo muestres todo antes de cerrar."}]}, {"h": "Guárdala donde la vas a usar", "pasos": ["En la app: pídele que te la entregue como .zip con la carpeta de la skill como primer nivel. Súbela en Customize → Skills: botón +, después + Create skill y Upload a skill. Después actívala con su interruptor.", "En Claude Code: pídele que la guarde en ~/.claude/skills/[NOMBRE]/SKILL.md para tenerla en todos tus proyectos, o en .claude/skills/[NOMBRE]/SKILL.md dentro de un proyecto para tenerla solo ahí."]}, {"h": "Pruébala con casos reales y mejórala", "p": ["Que la skill cargue no quiere decir que mejore el resultado. Para eso, skill-creator también sirve para evaluarla: la corre con pedidos de prueba que acuerdan entre los dos, te muestra los resultados y te ayuda a corregirla. En la app te muestra cada resultado en el chat; la optimización automática de la description solo corre en Claude Code."], "prompts": [{"t": "Evaluar la skill", "c": "Usa skill-creator para evaluar mi skill [NOMBRE].\nProponme 5 pedidos de prueba como los haría un día normal, incluido uno que NO debería activarla.\nCorre los pedidos, muéstrame los resultados y dime qué cambiarías en la descripción o en los pasos."}], "lista": ["No se activa: la descripción no tiene las palabras con las que pides la tarea.", "Se activa cuando no debe: la descripción es demasiado amplia. Achícala.", "Sale distinto cada vez: faltan pasos o un ejemplo concreto."]}], "faq": [{"q": "¿Y si no sé explicar cómo hago la tarea?", "a": "Pégale a Claude dos o tres ejemplos terminados y pídele que deduzca los pasos y te pregunte lo que no queda claro."}, {"q": "¿Puedo mostrarle la tarea en vez de escribirla?", "a": "Según el centro de ayuda de Claude, en Cowork en Claude para Mac (planes Pro, Max, Ultra y Team) puedes grabar tu pantalla mientras la explicas y Claude te propone una skill para revisar. No está en el chat, ni en Windows."}, {"q": "¿Una skill puede hacer varias tareas?", "a": "Puede, pero funciona mejor una skill por tarea. Claude combina varias si hace falta."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://code.claude.com/docs/en/skills", "https://github.com/anthropics/skills/tree/main/skills/skill-creator", "https://github.com/anthropics/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: el mail mensual de vencimientos de un estudio contable", "negocio": "Ejemplo inventado: un estudio contable de Rosario con dos contadoras y una administrativa. Llevan monotributistas, comercios chicos y algunas sociedades.", "punto_de_partida": "Todos los meses la administrativa arma a mano un mail por cliente con lo que vence. Copia las fechas de una planilla y las contadoras le corrigen siempre lo mismo: siglas sin explicar, fechas desordenadas y pendientes del mes anterior que quedan al final.", "pasos": ["La administrativa completó la hoja de relevamiento del kit. En la frase puso: \"Cuando arranca el mes, necesito un mail por cliente con lo que le vence\". En las correcciones de siempre anotó las tres que le hacían las contadoras.", "Pegó como ejemplo bueno un mail que una contadora había reescrito, y como ejemplo malo uno de los suyos con las correcciones marcadas.", "Abrió un chat nuevo con skill-creator activada y pegó el prompt \"De tarea manual a skill\" con la hoja completa.", "Claude le preguntó si los montos van en el mail y quién decide qué hace el estudio y qué hace el cliente. Respondió que los montos no van y que eso viene marcado en la planilla.", "Revisó el SKILL.md propuesto. Le pidió que las fechas se copien tal cual de la lista y que nunca las calcule. Quedó la skill aviso-de-vencimientos del kit.", "Pidió el .zip, lo subió en Customize → Skills con +, + Create skill y Upload a skill, y prendió el interruptor.", "Usó el registro de pruebas del kit con cinco pedidos: tres clientes reales, uno con una fecha faltante y uno que no tenía que activarla (\"ármame el mail de bienvenida para un cliente nuevo\").", "En la primera ronda la skill no se activó cuando escribió \"hazme el recordatorio del mes para [CLIENTE]\". Sumó \"recordatorio del mes\" a la description y en la segunda ronda se activó.", "Una contadora revisó los borradores de la segunda ronda y anotó qué cambió. Lo que se repitió lo sumaron como regla."], "resultado": "La administrativa arma los avisos del mes desde la planilla con un pedido por cliente. Los mails salen con el mismo orden y las siglas explicadas, las contadoras los revisan antes de mandarlos y lo que falta queda marcado en REVISAR ANTES DE MANDAR."}, "si_falla": [{"sintoma": "La skill sale bien en la primera respuesta y en la misma charla, más adelante, deja de seguir alguna regla.", "solucion": "Claude Code agrega la skill a la conversación cuando la usa y no vuelve a leer el archivo; si la charla es larga y se compacta, puede quedarse solo con el principio. Sube las reglas más importantes al principio del SKILL.md, escríbelas para toda la tarea (\"en cada mail...\") y, si hace falta, vuelve a llamarla o abre un chat nuevo."}, {"sintoma": "La skill la armaste en Claude Code y al subirla a la app da error.", "solucion": "Fuera de Claude Code el encabezado solo acepta name, description, license, compatibility, metadata y allowed-tools. Si tiene campos como disable-model-invocation, when_to_use o model, sácalos antes de comprimir. Revisa también que la description no pase de 200 caracteres."}, {"sintoma": "Se activa cuando pides otra cosa parecida.", "solucion": "La description es demasiado amplia. Agrega para qué es exactamente y, si hace falta, para qué no (\"no para mails de bienvenida\"). Vuelve a correr el pedido que no debería activarla."}, {"sintoma": "Cada vez sale distinto aunque el pedido sea el mismo.", "solucion": "Faltan pasos o un ejemplo. Pega dentro del SKILL.md un resultado bueno completo y convierte en regla cada corrección que repetiste en el registro de pruebas."}, {"sintoma": "Le pediste a skill-creator que optimice la description en la app y no lo hace o dice que no puede.", "solucion": "Esa parte necesita Claude Code. En la app, hazlo a mano: prueba los pedidos del registro, anota cuáles no la activaron y suma a la description las palabras de esos pedidos."}], "kit": [{"archivo": "relevamiento-tarea-manual-a-skill.md", "que_es": "Hoja para completar antes de armar la skill: la tarea en una frase, cómo la haces hoy, ejemplos, correcciones de siempre y pedidos de prueba. Se pega entera en el prompt de la guía.", "contenido": "# Relevamiento: de tarea manual a skill\n\nCompleta esta hoja antes de abrir el chat. Después pégala entera en el prompt \"De tarea manual a skill\". No hace falta que quede prolija.\n\n## 1. La tarea en una frase\nCuando [SITUACIÓN QUE SE REPITE], necesito [RESULTADO CONCRETO].\n\n¿Cada cuánto la haces? [TODOS LOS DÍAS / CADA SEMANA / CADA MES]\n¿Con qué palabras se la pides a Claude o a alguien del equipo? [ANOTA 2 O 3 FORMAS]\n\n## 2. Cómo la haces hoy\nEscríbelo como si se lo explicaras a alguien que entra mañana:\n1. [PRIMERO ABRO / BUSCO / REVISO...]\n2. [DESPUÉS...]\n3. [...]\n\n¿De dónde sacas los datos? [PLANILLA, MAIL, SISTEMA, LO TENGO EN LA CABEZA]\n¿Esos datos se los vas a pegar a Claude o tiene que ir a buscarlos? Si tiene que ir a buscarlos, ¿hay un conector para esa app?\n\n## 3. Ejemplos\nUn resultado que te quedó bien:\n[PÉGALO AQUÍ]\n\nUn resultado que salió mal y por qué:\n[PÉGALO AQUÍ, O BORRA ESTA PARTE]\n\n## 4. Las correcciones de siempre\nLo que más corriges cuando lo hace otro (o cuando lo hace Claude sin skill):\n- [EJEMPLO: QUEDA DEMASIADO LARGO]\n- [EJEMPLO: SE OLVIDA DE PONER LA FECHA LÍMITE]\n- [...]\n\n## 5. Lo que no tiene que hacer nunca\n- [EJEMPLO: INVENTAR UN DATO QUE NO ESTÁ]\n- [EJEMPLO: MANDAR ALGO SIN QUE LO REVISE UNA PERSONA]\n- [...]\n\n## 6. Material largo\n¿Hay algo que hoy consultas mientras haces la tarea (una tabla, una lista, un texto modelo)?\n- [NOMBRE DEL MATERIAL]: va a un archivo aparte dentro de la skill, en references/.\n\n## 7. Cómo te vas a dar cuenta de que funciona\nTres pedidos reales que debería resolver bien:\n1. [PEDIDO]\n2. [PEDIDO]\n3. [PEDIDO]\n\nUn pedido parecido que NO debería activarla:\n- [PEDIDO]\n"}, {"archivo": "aviso-de-vencimientos/SKILL.md", "que_es": "Skill de ejemplo, ya convertida con este método: arma el mail mensual de vencimientos de un cliente sin calcular fechas ni inventar montos. Sirve como modelo o para usar tal cual en un estudio contable.", "contenido": "---\nname: aviso-de-vencimientos\ndescription: Arma el mail mensual de vencimientos impositivos para un cliente a partir de su lista de obligaciones. Úsala cuando pidan el aviso de vencimientos, el recordatorio del mes o el mail de fechas.\n---\n\n# Aviso de vencimientos\n\nArmas el borrador del mail mensual que el estudio le manda a cada cliente con lo que vence en el mes. Lo revisa y lo manda una persona del estudio.\n\n## Qué te pasan\n\n- El nombre del cliente y su tipo (por ejemplo, monotributista, responsable inscripto, sociedad).\n- La lista de obligaciones del mes con su fecha. Puede venir pegada, en una planilla o en un archivo del Proyecto.\n- A veces, notas del contador (\"este mes no presentó la DDJJ anterior\").\n\n## Pasos\n\n1. Ordena las obligaciones por fecha, de la más próxima a la más lejana.\n2. Separa en dos grupos: lo que el cliente tiene que pagar o mandar, y lo que hace el estudio.\n3. Para cada obligación del cliente, escribe en una línea qué es, en palabras simples, y la fecha.\n4. Si en las notas hay algo pendiente del mes anterior, ponlo arriba de todo, antes de la lista.\n5. Escribe el mail con el formato de abajo.\n6. Al final, fuera del mail, lista en REVISAR ANTES DE MANDAR todo lo que no quedó claro.\n\n## Formato del mail\n\nAsunto: Vencimientos de [MES] - [NOMBRE DEL CLIENTE]\n\nHola, [NOMBRE]:\n\n[Si hay pendientes del mes anterior, un párrafo corto aquí.]\n\nEstas son tus fechas de [MES]:\n\n- [FECHA]: [QUÉ ES, EN PALABRAS SIMPLES]\n- ...\n\nDe esto nos ocupamos nosotros: [LISTA CORTA, o borrar esta línea si no hay].\n\nSi necesitas que te mandemos algún comprobante, avísanos antes del [FECHA MÁS PRÓXIMA].\n\nSaludos,\n[FIRMA DEL ESTUDIO]\n\n## Reglas\n\n- Las fechas se copian tal cual de la lista que te pasan. No las calcules ni las deduzcas.\n- No inventes montos. Si la lista no trae el monto, no lo menciones.\n- No des consejos impositivos ni opines sobre si conviene pagar o no.\n- Nada de siglas sin explicar: la primera vez que aparece una, pon entre paréntesis qué es.\n- Tono cordial y directo, con voseo. Sin signos de exclamación.\n- Si una obligación no tiene fecha, no la pongas en el mail: anótala en REVISAR ANTES DE MANDAR.\n"}, {"archivo": "registro-de-pruebas-de-skill.md", "que_es": "Tabla para probar la skill con cinco pedidos cada vez que la cambias y saber si mejoró, con la guía para leer qué falló.", "contenido": "# Registro de pruebas de una skill\n\nÚsalo cada vez que cambies la skill. Una fila por pedido. Así sabes si el cambio mejoró algo o solo lo movió de lugar.\n\nSkill: [NOMBRE]\nVersión o fecha del cambio: [AAAA-MM-DD]\nQué cambiaste: [DESCRIPTION / PASOS / REGLAS / EJEMPLO]\n\n## Pedidos de prueba\n\n| # | Pedido (tal cual lo escribirías) | ¿Debería usarla? | ¿La usó? | ¿Siguió todos los pasos? | ¿Lo mandarías así? | Qué corregiste |\n|---|---|---|---|---|---|---|\n| 1 | [PEDIDO NORMAL] | Sí | | | | |\n| 2 | [PEDIDO NORMAL, DICHO DE OTRA FORMA] | Sí | | | | |\n| 3 | [PEDIDO CON UN DATO QUE FALTA] | Sí | | | | |\n| 4 | [PEDIDO CON DATOS CONTRADICTORIOS] | Sí | | | | |\n| 5 | [PEDIDO PARECIDO DE OTRA TAREA] | No | | | | |\n\n## Cómo leer el resultado\n\n- Falla en \"¿La usó?\": cambia la description, no los pasos.\n- Falla en \"¿Siguió todos los pasos?\": el paso no está claro o está muy abajo en el archivo. Sube lo importante y escríbelo como regla para toda la tarea.\n- Falla en \"¿Lo mandarías así?\": falta un ejemplo o una regla. Mira la columna \"Qué corregiste\": si se repite, eso es una regla nueva.\n- La fila 5 se activó: la description es demasiado amplia. Achícala.\n\n## Decisión\n\n- [ ] Quedó mejor que la versión anterior en los mismos pedidos.\n- [ ] No rompió nada que antes andaba.\n- [ ] La subí de nuevo (app) o guardé el archivo (Claude Code).\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "úsalo"};</script>

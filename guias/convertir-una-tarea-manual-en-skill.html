<script>var GUIA = {"slug": "convertir-una-tarea-manual-en-skill", "t": "Convertí una tarea que hacés a mano en una skill", "d": "El método para pasar a una skill algo que repetís todas las semanas, más un prompt para que Claude la arme a partir de cómo lo hacés vos.", "tema": "Skills y plugins", "min": 8, "secciones": [{"h": "Qué tareas conviene convertir", "p": ["Una skill rinde cuando le pedís a Claude lo mismo una y otra vez y querés que salga siempre igual. La señal más clara: te encontrás corrigiéndolo con las mismas instrucciones cada vez."], "lista": ["Sí: un informe con formato fijo, un checklist de revisión, un procedimiento de varios pasos, algo que necesita un archivo de referencia para salir bien.", "No: una tarea que hacés una sola vez. Explicala en el chat y listo.", "No: traer datos en vivo de otra app. Eso lo hace un conector.", "No: reglas para todas tus charlas. Eso va en tus preferencias personales o en las instrucciones de un proyecto."]}, {"h": "El método en 5 pasos", "pasos": ["Escribí la tarea en una sola frase y cómo se ve un buen resultado. Esa frase va a ser la descripción de la skill.", "Contá cómo la hacés hoy, paso a paso, como si se la explicaras a alguien que entra a trabajar mañana.", "Juntá un ejemplo real que te haya quedado bien. Si tenés uno que salió mal, sumalo también.", "Anotá las correcciones que siempre terminás haciendo. Esas son las reglas.", "Anotá lo que no tiene que hacer nunca (inventar datos, usar cierto tono, saltear un paso)."], "aviso": "No hace falta que lo escribas prolijo. Una nota de voz pasada a texto sirve igual."}, {"h": "El prompt que arma la skill", "p": ["Pegá esto en un chat nuevo con lo que juntaste. Si tenés skill-creator activada en Personalizar → Skills, Claude la va a usar para guiarte."], "prompts": [{"t": "De tarea manual a skill", "c": "Quiero convertir una tarea que hago a mano en una skill. Usá skill-creator si la tenés disponible.\n\nLa tarea en una frase: [TAREA].\nCómo la hago hoy, paso a paso: [PASOS].\nEjemplo de un resultado bueno: [PEGÁ EL EJEMPLO].\nCorrecciones que siempre hago: [LISTA].\nLo que nunca tiene que hacer: [LISTA].\n\nQuiero que:\n1. Me hagas primero las preguntas que te falten para entender la tarea.\n2. Propongas un name en minúsculas con guiones y una description corta que diga qué hace y cuándo usarla.\n3. Escribas el SKILL.md con pasos numerados, reglas y el ejemplo.\n4. Si hay información larga (listas, tablas, textos modelo), la pongas en un archivo aparte dentro de references/ y la menciones en el paso donde se usa.\n5. Me lo muestres todo antes de cerrar."}]}, {"h": "Guardala donde la vas a usar", "pasos": ["En la app: pedile que te la entregue como .zip con la carpeta de la skill como primer nivel. Subila en Personalizar → Skills → + → Crear skill → Subir una skill y activala.", "En Claude Code: pedile que la guarde en ~/.claude/skills/[NOMBRE]/SKILL.md para tenerla en todos tus proyectos, o en .claude/skills/[NOMBRE]/SKILL.md dentro de un proyecto para tenerla solo ahí."]}, {"h": "Probala con casos reales y mejorala", "p": ["Que la skill cargue no quiere decir que mejore el resultado. Para eso, skill-creator también sirve para evaluarla: la corre con pedidos de prueba que acuerdan entre los dos, te muestra los resultados y te ayuda a corregirla."], "prompts": [{"t": "Evaluar la skill", "c": "Usá skill-creator para evaluar mi skill [NOMBRE].\nProponeme 5 pedidos de prueba como los haría un día normal, incluido uno que NO debería activarla.\nCorré los pedidos, mostrame los resultados y decime qué cambiarías en la descripción o en los pasos."}], "lista": ["No se activa: la descripción no tiene las palabras con las que pedís la tarea.", "Se activa cuando no debe: la descripción es demasiado amplia. Achicala.", "Sale distinto cada vez: faltan pasos o un ejemplo concreto."]}], "faq": [{"q": "¿Y si no sé explicar cómo hago la tarea?", "a": "Pegale a Claude dos o tres ejemplos terminados y pedile que deduzca los pasos y te pregunte lo que no queda claro."}, {"q": "¿Puedo mostrarle la tarea en vez de escribirla?", "a": "Según el centro de ayuda de Claude, en Cowork en Claude para Mac (planes Pro, Max, Ultra y Team) podés grabar tu pantalla mientras la explicás y Claude te propone una skill para revisar. No está en el chat, ni en Windows."}, {"q": "¿Una skill puede hacer varias tareas?", "a": "Puede, pero funciona mejor una skill por tarea. Claude combina varias si hace falta."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://code.claude.com/docs/en/skills", "https://github.com/anthropics/skills/tree/main/skills/skill-creator"], "cat": "skills", "parte": "aprende"};</script>

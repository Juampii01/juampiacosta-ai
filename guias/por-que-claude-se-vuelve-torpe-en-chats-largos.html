<script>var GUIA = {"slug": "por-que-claude-se-vuelve-torpe-en-chats-largos", "post": "CHAT", "t": "Por qué Claude se pone torpe en chats largos (y cómo seguir en limpio)", "d": "Qué pasa cuando una conversación se estira demasiado, cuándo te conviene abrir un chat nuevo y un prompt de traspaso para no perder nada.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "Qué es la ventana de contexto", "p": ["Claude trabaja con una cantidad limitada de información a la vez dentro de cada chat: eso se llama ventana de contexto. Todo entra ahí: tus mensajes, sus respuestas, los archivos que subiste y lo que traen los conectores o la búsqueda web.", "Cuando el chat se acerca a ese límite, si tienes activada la ejecución de código, Claude resume los mensajes anteriores para poder seguir. Si ves el aviso de que está ordenando sus ideas, es eso. Según el centro de ayuda de Anthropic, esas conversaciones largas consumen más de tu límite de uso."]}, {"h": "Señales de que es hora de cambiar de chat", "lista": ["Mezcla cosas: usa datos de una versión vieja del trabajo que ya descartaste.", "Se olvida reglas: vuelve a hacer algo que le pediste que no haga.", "Cambiaste de tema: arrancaste con un presupuesto y ahora estás con el logo.", "Se te termina el uso más rápido: el centro de ayuda recomienda abrir un chat nuevo si te acercas al límite en una conversación larga."]}, {"h": "El traspaso en tres pasos", "pasos": ["En el chat viejo, pega el prompt de traspaso de abajo.", "Lee el resumen y corrige lo que esté mal o falte. Es tu nueva fuente de verdad.", "Abre un chat nuevo, pega el resumen corregido y escribe qué quieres hacer ahora."], "prompts": [{"t": "Prompt de traspaso", "c": "Vamos a seguir este trabajo en un chat nuevo. Ármame un resumen de traspaso para pegar allá, con estas partes:\n1. Objetivo: qué estamos haciendo y para quién.\n2. Decisiones tomadas: lo que ya quedó definido, en viñetas cortas.\n3. Reglas que te di: tono, formato y cosas a evitar.\n4. Estado actual: la última versión del trabajo, completa.\n5. Pendientes: lo que falta, en orden.\n6. Descartado: ideas que probamos y no van, para no repetirlas.\nNo agregues nada que no hayamos hablado. Si algo quedó ambiguo, márcalo con [A CONFIRMAR]."}]}, {"h": "Si trabajas seguido en lo mismo, usa un proyecto", "p": ["Los proyectos de Claude son espacios con su propio historial de chats, sus archivos y sus instrucciones. Subes tus documentos de referencia y escribes las reglas una sola vez, y cada chat nuevo dentro del proyecto ya arranca con eso.", "Así puedes abrir chats cortos y enfocados sin tener que explicar todo de nuevo. El centro de ayuda también aconseja mantener las instrucciones del proyecto breves y sacar archivos que ya no uses."], "aviso": "En el plan gratis puedes crear hasta cinco proyectos. En los planes pagos no hay ese tope."}, {"h": "Otras formas de cuidar el contexto", "lista": ["Desconecta lo que no usas: los conectores y las herramientas gastan bastante contexto.", "Pídele que no busque en la web cuando no necesitas información actual.", "Un chat, un tema: es más fácil de retomar y de encontrar después."]}], "faq": [{"q": "¿Si abro un chat nuevo pierdo lo anterior?", "a": "No, el chat viejo queda guardado. Lo que pasa es que el nuevo no lo ve: por eso le pasas el resumen de traspaso."}, {"q": "¿Claude no se acuerda solo de mis otros chats?", "a": "Puede. La memoria está en todos los planes, también en el gratis, y viene prendida por defecto (en Team y Enterprise la habilita el owner). En los planes pagos, además, Claude puede buscar en tus chats anteriores si tienes prendido Search and reference chats en Settings → Your Claude. Igual, el chat nuevo no carga solo todo lo que hablaste: para no depender de eso, el resumen de traspaso o un proyecto son lo más seguro."}, {"q": "¿Cada cuánto conviene cambiar de chat?", "a": "No hay un número fijo. Cambia cuando veas las señales de arriba o cuando cambies de tema."}], "fuentes": ["https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/9797557-usage-limit-best-practices"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio contable que pasa de un chat eterno a chats cortos", "negocio": "Ejemplo inventado: un estudio contable chico en Rosario, Santa Fe. Lo atienden una contadora y dos asistentes, y trabajan con monotributistas y pymes del comercio.", "punto_de_partida": "La contadora armaba la propuesta de servicios para clientes nuevos en un único chat que venía usando hacía semanas. Claude empezó a mezclar los honorarios viejos con los nuevos y volvió a escribir \"usted\" aunque le había pedido voseo.", "pasos": ["Reconoció dos señales de la guía: Claude usaba datos de una versión descartada y se olvidaba una regla de tono. Decidió cambiar de chat.", "En el chat viejo pegó el prompt de traspaso. Claude armó el resumen con objetivo, decisiones, reglas, la última versión de la propuesta, pendientes y lo descartado.", "Leyó el resumen con calma. Encontró que en Estado actual figuraba el honorario anterior del servicio de sueldos y lo corrigió a mano. Borró el CUIT de un cliente que había quedado en el texto.", "Como iba a hacer propuestas todas las semanas, creó un Proyecto llamado \"Propuestas comerciales\". En las instrucciones pegó solo la parte de Reglas del resumen. Subió como archivo la lista de servicios y honorarios vigente.", "Abrió un chat nuevo dentro del Proyecto, pegó el resto del resumen y escribió: \"Seguimos desde aquí. Lo próximo es adaptar la propuesta para una farmacia\".", "En Settings desconectó los conectores que no usaba para esto y dejó de pedirle búsquedas web para las propuestas.", "Desde ese día abre un chat por cliente dentro del Proyecto. Cuando un chat se estira o cambia de tema, pide el traspaso con la skill del kit."], "resultado": "Quedó un Proyecto con las reglas de tono y la lista de honorarios en un solo lugar, y un chat corto por cada propuesta. Cuando cambia un honorario, lo actualiza en el archivo del Proyecto y no en diez chats distintos."}, "si_falla": [{"sintoma": "El resumen de traspaso sale incompleto o con una versión vieja del trabajo.", "solucion": "Pasa cuando la conversación es tan larga que Claude ya resumió los mensajes viejos. Pídele que primero te muestre solo la sección Estado actual y compara con la última versión que aprobaste. Si no coincide, pega tú la versión buena en el resumen. La próxima vez, pide el traspaso antes, apenas veas la primera señal."}, {"sintoma": "Aparece el aviso de que Claude está ordenando sus ideas y después responde distinto o más lento.", "solucion": "Es la gestión automática de contexto: Claude resume los mensajes anteriores para seguir. Funciona solo si tienes prendida la ejecución de código, y esas conversaciones gastan más de tu límite. Es buen momento para hacer el traspaso a un chat nuevo."}, {"sintoma": "El chat no deja seguir y dice que la conversación llegó a su largo máximo.", "solucion": "Revisa que esté prendida la ejecución de código en Settings → Capabilities, porque sin eso no se activa el resumen automático. Si un primer mensaje gigante (por ejemplo, varios archivos enormes) llena la ventana, la ayuda oficial aclara que igual puede pasar: abre un chat nuevo y manda solo las partes que necesitas."}, {"sintoma": "Se te termina el uso muy rápido aunque mandas pocos mensajes.", "solucion": "Fíjate el largo del chat, los archivos adjuntos, los conectores prendidos y la búsqueda web: todo eso suma. Abre un chat nuevo con el resumen de traspaso, desconecta lo que no uses y junta varias preguntas en un mismo mensaje."}, {"sintoma": "En el chat nuevo Claude vuelve a olvidar una regla que estaba en el resumen.", "solucion": "Si la regla es fija para ese trabajo, ponla en las instrucciones de un Proyecto y no solo en el resumen. Mantén esas instrucciones cortas: cuantas menos reglas, más fácil que se cumplan todas."}], "kit": [{"archivo": "traspaso-de-chat/SKILL.md", "que_es": "Skill que arma el resumen de traspaso con la última versión completa del trabajo y marca lo dudoso. Comprime la carpeta en ZIP y súbela en Customize → Skills; después alcanza con escribir \"traspaso\" en el chat largo.", "contenido": "---\nname: traspaso-de-chat\ndescription: 'Arma un traspaso para seguir en un chat nuevo sin perder decisiones, reglas ni la última versión. Úsala con \"traspaso\", al pasar a un chat nuevo o cuando el chat es largo y Claude mezcla versiones.'\n---\n\n# Traspaso de chat\n\nArmas un resumen para que la persona lo pegue en un chat nuevo y siga trabajando sin explicar todo de nuevo. El resumen es la nueva fuente de verdad, así que tiene que ser fiel a lo que se habló.\n\n## Antes de escribir\n\n1. Recorre la conversación completa, no solo los últimos mensajes.\n2. Identifica cuál es la ÚLTIMA versión de cada cosa. Si hubo varias versiones de un texto, un precio o una lista, quédate con la última que la persona aprobó.\n3. Si dos mensajes se contradicen y no está claro cuál vale, no elijas: márcalo con [A CONFIRMAR].\n\n## Qué entregas, en este orden\n\n1. **Objetivo**: qué estamos haciendo, para quién y para cuándo, en 2 o 3 líneas.\n2. **Decisiones tomadas**: viñetas cortas. Una decisión por viñeta.\n3. **Reglas que me diste**: tono, formato, largo, palabras a evitar, cosas que no tengo que hacer. Cópialas con las palabras de la persona cuando puedas.\n4. **Estado actual**: la última versión del trabajo, COMPLETA. No la resumas ni la acortes. Si es muy larga, avisa y propón guardarla como archivo aparte.\n5. **Pendientes**: lo que falta, en el orden en que conviene hacerlo.\n6. **Descartado**: ideas que se probaron y no van, con el motivo en pocas palabras.\n7. **Primer mensaje sugerido**: una línea que la persona puede pegar debajo del resumen en el chat nuevo, por ejemplo: \"Seguimos desde aquí. Lo próximo es [PRIMER PENDIENTE].\"\n\n## Reglas\n\n- No agregues nada que no se haya hablado. Nada de ideas nuevas en el traspaso.\n- No incluyas datos sensibles que no hagan falta para seguir (claves, números de tarjeta, datos personales de clientes). Si aparecieron en el chat, pon [DATO SENSIBLE OMITIDO].\n- Usa títulos y viñetas para que se pueda corregir fácil.\n- Al final, pídele a la persona que lo lea y corrija antes de pegarlo en el chat nuevo.\n"}, {"archivo": "plantilla-resumen-traspaso-chat.md", "que_es": "Plantilla del resumen de traspaso con checklist para revisarlo antes de pegarlo en el chat nuevo. Sirve si no usas skills o si quieres armarlo a mano.", "contenido": "# Resumen de traspaso\n\nComplétalo tú o pídeselo a Claude con la skill traspaso-de-chat. Corrígelo antes de pegarlo en el chat nuevo.\n\nFecha: [FECHA]\nChat de origen: [NOMBRE DEL CHAT VIEJO, para encontrarlo si hace falta]\n\n## 1. Objetivo\n[Qué estamos haciendo, para quién y para cuándo.]\n\n## 2. Decisiones tomadas\n- [Decisión 1]\n- [Decisión 2]\n\n## 3. Reglas\n- Tono: [por ejemplo, cercano, con voseo, sin tecnicismos]\n- Formato: [por ejemplo, viñetas cortas, máximo una página]\n- Nunca: [lo que Claude no tiene que hacer]\n\n## 4. Estado actual (última versión completa)\n[Pega aquí la última versión aprobada del trabajo, entera.]\n\n## 5. Pendientes, en orden\n1. [Pendiente 1]\n2. [Pendiente 2]\n\n## 6. Descartado\n- [Idea] — [por qué no va]\n\n## 7. Para arrancar el chat nuevo\nSeguimos desde aquí. Lo próximo es [PRIMER PENDIENTE]. Antes de empezar, dime si algo del resumen no te cierra.\n\n---\n\n## Checklist antes de pegar\n- [ ] La versión de la sección 4 es la última que aprobé, no una anterior.\n- [ ] Están todas las reglas que repetí más de una vez en el chat viejo.\n- [ ] Lo marcado [A CONFIRMAR] lo resolví o lo dejé claro.\n- [ ] Saqué claves, contraseñas y datos personales que no hacen falta.\n- [ ] Si trabajo seguido en esto, pegué el resumen en un Proyecto y no en un chat suelto.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

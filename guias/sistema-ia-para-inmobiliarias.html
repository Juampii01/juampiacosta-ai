<script>var GUIA = {"slug": "sistema-ia-para-inmobiliarias", "post": "INMOBILIARIA", "t": "Sistema con Claude para inmobiliarias, listo para instalar y vender", "d": "Qué tareas le sacas de encima a una inmobiliaria, qué piezas lleva el sistema y cómo se lo ofreces al dueño sin prometer cosas que no puedes cumplir.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Inmobiliarias", "ficha": [["Qué es", "Un Proyecto de Claude con las propiedades y las reglas de la inmobiliaria, más skills para fichas, consultas y seguimiento."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No publica solo en los portales ni reemplaza la tasación ni la firma de un profesional matriculado."]], "secciones": [{"h": "Lo que les come el tiempo", "p": ["Antes de ofrecer nada, mira dónde se va el día de un corredor. Casi siempre es esto:"], "lista": ["Fichas de propiedades: pasar las notas de la visita y las fotos a una descripción prolija para cada portal.", "Consultas repetidas: la misma pregunta de precio, expensas y si acepta mascotas, veinte veces por semana.", "Seguimiento de interesados: gente que preguntó y nadie volvió a llamar.", "Coordinar visitas: idas y vueltas por mensaje para encontrar un horario.", "Informes al propietario: contarle cuántas consultas y visitas hubo y qué dijeron.", "Buscar en la cartera: \"¿qué tenemos de 2 ambientes con balcón en tal barrio?\" y revisar planillas a mano."]}, {"h": "El sistema", "lista": ["Proyecto \"Cartera\": la planilla de propiedades disponibles, las condiciones de cada operación, la zona que trabajan y las preguntas frecuentes. Las instrucciones dicen que responda solo con esos datos.", "Skill de ficha de propiedad: convierte notas sueltas y fotos descritas en título, descripción, lista de características y versión corta para redes.", "Skill de respuesta a consultas: responde en el tono de la inmobiliaria, pide los datos que faltan y propone una visita.", "Skill de informe al propietario: arma el resumen semanal de una propiedad a partir de las consultas y visitas anotadas.", "Conectores: Gmail para leer consultas que llegan por mail y dejar borradores, Google Calendar para ver horarios libres de visita, Google Drive para la planilla de cartera.", "Automatización: una tarea programada que cada mañana revisa los interesados sin respuesta de los últimos días y deja borradores de seguimiento para que el corredor los mande."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "p": ["Estos son la base de cada skill. Primero pruébalos en el chat del Proyecto; cuando salen bien, conviértelos en skill como explica la guía \"Convierte una tarea que haces a mano en una skill\"."], "prompts": [{"t": "Ficha de propiedad desde notas y fotos", "c": "Te paso las notas de la visita y la descripción de las fotos de una propiedad.\nNotas: [PEGA LAS NOTAS]\nFotos: [DESCRIBE CADA FOTO EN UNA LÍNEA]\nÁrmame:\n1. Un título de hasta 70 caracteres.\n2. Una descripción de 120 a 180 palabras, clara y sin exagerar.\n3. Lista de características: ambientes, metros, orientación, antigüedad, expensas, servicios.\n4. Una versión de 3 líneas para Instagram.\nReglas: no inventes datos. Si falta algo importante (metros, expensas, apto crédito), lístalo al final como PREGUNTAR AL PROPIETARIO. No uses palabras como \"único\" o \"imperdible\"."}, {"t": "Respuesta a consultas de portales", "c": "Llegó esta consulta por [PORTAL O CANAL]: [PEGA EL MENSAJE].\nLa propiedad es: [CÓDIGO O DIRECCIÓN].\nUsa solo los datos de la cartera del Proyecto.\nEscribe una respuesta corta, amable y en voseo que:\n1. Conteste lo que preguntó.\n2. Pregunte una sola cosa para calificar (por ejemplo, si es para vivir o invertir, o si ya vendió su propiedad).\n3. Proponga dos horarios de visita.\nSi lo que pregunta no está en los datos, di que lo confirmas y márcalo como PENDIENTE."}, {"t": "Seguimiento de interesados", "c": "Esta es la lista de interesados de la semana con lo que preguntaron y la última fecha de contacto: [PEGA LA LISTA].\nPara cada uno:\n1. Dime si conviene escribirle hoy, en unos días o cerrarlo.\n2. Si conviene escribirle, arma un mensaje de 2 o 3 líneas que aporte algo (una propiedad parecida, una baja de precio, un horario nuevo). Nada de \"¿pudiste pensarlo?\".\n3. Ordénalos de más a menos caliente.\nNo mandes nada: déjame los textos para revisar."}]}, {"h": "Cómo instalarlo", "pasos": ["Pídele al dueño la planilla de cartera, 5 fichas que le gusten, las preguntas que más le hacen y sus reglas (qué datos nunca se dan por mensaje).", "Crea el Proyecto \"Cartera\", sube esos archivos y escribe instrucciones cortas: responder solo con la cartera y marcar lo que falta.", "Prueba los tres prompts con propiedades reales y corrige hasta que el corredor diga \"esto lo mando así\".", "Convierte cada prompt en skill: una carpeta con su SKILL.md, comprimida en ZIP. Súbelas en Customize → Skills, con el botón +, después + Create skill y Upload a skill.", "Conecta Gmail, Google Calendar y Google Drive con la cuenta del negocio, no con la tuya.", "Arma la tarea programada de seguimiento (en Cowork: Scheduled, New task) con un prompt que diga dónde está la planilla de interesados y que no envíe nada. Déjala una semana dejando solo borradores y revisa cada corrida en la página Scheduled.", "Haz una reunión corta de cierre: qué ahorró, qué falló y qué se ajusta."]}, {"h": "Cómo ofrecérselo", "p": ["El dueño de una inmobiliaria no compra \"IA\": compra no perder interesados y que sus corredores salgan a la calle en vez de escribir fichas. Háblale de eso."], "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para inmobiliarias. Vi que publican bastante en [PORTAL O RED] y me imagino que las fichas y las consultas repetidas se llevan buena parte del día.\nLo que hago es dejarles un asistente que arma fichas con las notas de la visita, prepara las respuestas a consultas y les recuerda a quién hacerle seguimiento. El corredor siempre revisa antes de mandar.\n¿Te sirve que te muestre en 15 minutos cómo quedaría con una propiedad tuya?"}], "lista": ["Argumento central: \"Tus corredores dejan de escribir lo mismo todo el día y ningún interesado se queda sin respuesta. Tú sigues decidiendo qué sale.\"", "Demo: pídele una propiedad real y arma la ficha delante de él. Vale más que cualquier explicación.", "Precio: mira la guía \"Cuánto cobrar por automatizar con IA\" antes de pasar un número."]}, {"h": "Cuidados del rubro", "lista": ["Datos de propietarios e interesados: nombres, teléfonos, situación económica. Sube solo lo necesario y nunca documentos de identidad.", "Publicidad: el precio, los metros y las condiciones tienen que ser los reales. Que Claude no \"mejore\" datos.", "Firma profesional: tasaciones, reservas y contratos los revisa y firma quien corresponde según las reglas de cada lugar."], "aviso": "Claude no reemplaza al corredor ni al abogado. Todo lo que sale hacia un cliente lo revisa una persona, y los datos personales se cuidan según las leyes de protección de datos de cada país."}], "faq": [{"q": "¿Claude puede publicar solo en los portales?", "a": "En este sistema no. Claude prepara la ficha y el corredor la carga. Si el portal tuviera un conector oficial, revisa su documentación antes de prometerlo."}, {"q": "¿Y las consultas que llegan por WhatsApp?", "a": "Puedes usar la skill de respuestas copiando y pegando. Si quieren un agente que responda solo, eso es otro proyecto: mira la guía \"Agente de WhatsApp que atiende y agenda turnos\"."}, {"q": "¿Qué pasa si la cartera cambia todos los días?", "a": "Conviene que la planilla viva en Google Drive. Puedes sumarla a los archivos del Proyecto desde Drive (en Files, el botón + y después Drive; esta opción aparece solo en proyectos privados) o prender el conector de Google Drive en el chat para que Claude la lea en el momento. Si no usan Drive, que alguien reemplace el archivo del Proyecto una vez por semana."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/9519177"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en una inmobiliaria de barrio", "negocio": "Ejemplo inventado: una inmobiliaria familiar en barrio General Paz, Córdoba capital. Trabaja ventas y alquileres en la zona, con el dueño (corredor matriculado), dos corredores y una administrativa. Publican en portales y en Instagram, y las consultas entran por mail, por los portales y por WhatsApp.", "punto_de_partida": "Las fichas se escriben a mano después de cada visita, cada una distinta. Los interesados que preguntaron y no visitaron quedan en una planilla que nadie mira hasta fin de mes.", "pasos": ["En la demo, el dueño le pasó las notas de una visita a un 2 ambientes. Con el prompt de ficha armó título, descripción, características y la versión para Instagram delante de él. La lista PREGUNTAR AL PROPIETARIO salió con las expensas y si es apto crédito, que faltaban en las notas. Eso fue lo que lo convenció.", "Le pidió al dueño la planilla de cartera, cinco fichas que le gustaran, las preguntas frecuentes y la lista de lo que nunca se da por mensaje. Reordenó la planilla con las columnas del kit y la subieron a Google Drive de la cuenta del negocio.", "Revisó con el dueño qué plan de Claude iba a usar y que la cuenta de Google fuera la del negocio. En Settings → Capabilities prendió la opción de ejecución de código y creación de archivos que piden las skills.", "Creó el Proyecto privado \"Cartera\" en la cuenta del negocio, pegó las instrucciones del kit completando los corchetes y sumó la planilla desde Files, +, Drive. Subió las preguntas frecuentes y las fichas de ejemplo.", "Probó los tres prompts con propiedades reales durante una semana con los corredores. Ajustó el tono de las respuestas (los corredores no querían firmar como \"el equipo\") hasta que dijeron \"esto lo mando así\".", "Convirtió la ficha en la skill ficha-de-propiedad del kit, y las otras dos en sus propias skills. Armó cada carpeta con su SKILL.md, la comprimió en ZIP y la subió en Customize → Skills.", "Conectó Gmail, Google Calendar y Google Drive con la cuenta del negocio y probó en un chat: \"busca las consultas de esta semana sobre el código [CÓDIGO] y arma borradores de respuesta\".", "Creó la tarea programada con el archivo del kit, de lunes a viernes a primera hora, pidiendo aprobación antes de actuar. Durante la semana de prueba un corredor revisó cada borrador y anotó qué corrigió.", "En la reunión de cierre repasaron esas notas con el dueño: qué borradores salieron sin cambios, cuáles se corrigieron y por qué. Ajustaron el prompt de seguimiento y acordaron quién actualiza el estado de cada propiedad en la planilla el mismo día que se reserva."], "resultado": "Quedó un Proyecto con la cartera y las reglas del negocio, tres skills que los corredores usan para fichas, respuestas e informes, y una tarea que cada mañana deja borradores de seguimiento para revisar. Todo lo que sale hacia un cliente lo manda una persona, y la planilla en Drive es la única fuente de precios y condiciones."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner de la organización: pídele que la habilite en Organization settings → Plugins & skills."}, {"sintoma": "Al subir la skill aparece un error de formato o de archivo faltante.", "solucion": "Revisa tres cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos), que la carpeta se llame igual que el name del SKILL.md (por ejemplo, ficha-de-propiedad) y que adentro esté el archivo SKILL.md. Evita tildes y signos raros en el name."}, {"sintoma": "Al conectar Gmail o Drive aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "La inmobiliaria usa Google Workspace y el administrador tiene que marcar a Claude como app de confianza en la consola de Google (Security → Access and data control → API controls → Manage third-party app access). Después de guardar, espera unos 15 minutos y vuelve a probar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores de Google."}, {"sintoma": "Claude responde una consulta de mail pero no ve el PDF o las fotos que mandó el interesado.", "solucion": "El conector de Gmail no lee el contenido de los adjuntos, solo sus datos (nombre, tipo). Descarga el adjunto y súbelo al chat, o pídele a Claude que trabaje solo con el texto del mail y marque como PENDIENTE lo que dependa del adjunto."}, {"sintoma": "En el Proyecto no aparece la opción de agregar la planilla desde Drive.", "solucion": "Esa opción está solo en proyectos privados. Si crearon el Proyecto compartido con toda la organización, tienes dos caminos: prender el conector de Google Drive en cada chat para que lea la planilla en el momento, o subir la planilla como archivo y reemplazarla una vez por semana."}], "kit": [{"archivo": "ficha-de-propiedad/SKILL.md", "que_es": "Skill que arma título, descripción, características, versión para redes y la lista de lo que falta preguntar, sin inventar datos ni exponer al propietario. Guárdala en una carpeta ficha-de-propiedad, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: ficha-de-propiedad\ndescription: 'Arma la ficha de una propiedad para portales y redes desde notas de visita y fotos, con el tono de la inmobiliaria y sin inventar datos. Úsala al pedir ficha, aviso, descripción para portal o posteo.'\n---\n\n# Ficha de propiedad\n\nConviertes notas de una visita en una ficha lista para que el corredor la revise y la cargue en el portal. Nunca la publicas tú.\n\n## Qué te pasan\n\n- Notas de la visita (pueden venir desordenadas, con abreviaturas).\n- Una línea por foto describiendo qué se ve.\n- A veces, el código de la propiedad en la planilla de cartera.\n\nSi te pasan un código y tienes acceso a la planilla de cartera (en el Proyecto o en Google Drive), toma de ahí precio, expensas, superficie y condiciones. Si las notas y la planilla no coinciden, no elijas tú: lista la diferencia en PREGUNTAR AL PROPIETARIO.\n\n## Qué entregas, en este orden\n\n1. **Título**: hasta 70 caracteres. Tipo de propiedad, ambientes, barrio y el dato más fuerte que sea verificable (por ejemplo, \"con balcón al frente\" si está en las notas).\n2. **Descripción**: de 120 a 180 palabras. Primero cómo es y dónde está, después los ambientes en el orden en que se recorren, al final servicios y condiciones. Párrafos cortos.\n3. **Características**, en lista: tipo, operación (venta o alquiler), ambientes, dormitorios, baños, superficie cubierta y total, orientación, antigüedad, estado, expensas, servicios, cochera, apto crédito, apto mascotas (solo en alquiler, si está en las notas).\n4. **Versión para redes**: 3 líneas y un llamado a consultar por mensaje privado.\n5. **PREGUNTAR AL PROPIETARIO**: lista de todo lo que falta o no coincide.\n\n## Reglas\n\n- No inventes ni redondees datos. Si un campo de la lista no está en las notas, escribe \"a confirmar\" y súmalo a PREGUNTAR AL PROPIETARIO.\n- El precio, la superficie y las condiciones se copian tal cual. No los \"mejores\".\n- No uses \"único\", \"imperdible\", \"oportunidad única\", \"joya\" ni signos de exclamación.\n- No describas cosas que no están en las notas ni en las fotos (vistas, luminosidad, silencio) aunque sean típicas del barrio.\n- No pongas la dirección exacta, el nombre del propietario ni datos de contacto del propietario. Barrio y referencia general alcanzan.\n- Si la propiedad es en alquiler, no escribas condiciones de garantía o contrato que no estén en las notas.\n- Escribe en el tono de la inmobiliaria si está en las instrucciones del Proyecto. Si no, en español neutro rioplatense, claro y sin exagerar.\n\n## Al final\n\nCierra con una línea: \"Revisa precio, superficie y expensas antes de publicar.\"\n"}, {"archivo": "proyecto-cartera-instrucciones-y-planilla.md", "que_es": "El texto para pegar en las instrucciones del Proyecto \"Cartera\", con las reglas del rubro, y la estructura de columnas de la planilla de cartera para que las skills encuentren los datos.", "contenido": "# Proyecto \"Cartera\": instrucciones y planilla\n\nEste archivo tiene dos partes: el texto para pegar en \"Set project instructions\" y la estructura de la planilla de cartera.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DE LA INMOBILIARIA], una inmobiliaria de [CIUDAD] que trabaja [VENTAS / ALQUILERES / AMBAS] en [BARRIOS O ZONA].\n\nPara qué estás:\n- Armar fichas de propiedades a partir de notas de visita.\n- Preparar respuestas a consultas de interesados.\n- Preparar seguimientos y el informe semanal al propietario.\n- Buscar en la cartera lo que te pidan (\"2 ambientes con balcón en [BARRIO]\").\n\nReglas que no se rompen:\n1. Responde solo con los datos de la planilla de cartera y de los archivos de este Proyecto. Si algo no está, di \"lo confirmo\" y márcalo como PENDIENTE. Nunca completes con datos típicos del barrio o del mercado.\n2. Todo lo que escribes es un borrador. Lo revisa y lo manda una persona del equipo.\n3. Nunca des por mensaje: [COMPLETAR CON EL DUEÑO: dirección exacta antes de la visita, datos del propietario, precio mínimo aceptado, motivo de la venta, etc.].\n4. No hagas tasaciones ni digas cuánto vale una propiedad que no está en la cartera. Ofrece una visita del tasador.\n5. No redactes reservas, boletos ni contratos. Eso lo hace y lo firma [QUIÉN CORRESPONDE].\n6. Precios, superficies y condiciones van tal cual figuran en la planilla.\n7. Tono: [EJEMPLO: cercano, con voseo, sin exagerar, sin signos de exclamación]. Firma como [NOMBRE DE QUIEN RESPONDE] de [INMOBILIARIA].\n8. Cuando propongas horarios de visita, usa los horarios de visita de la inmobiliaria: [DÍAS Y FRANJAS]. Si tienes Google Calendar conectado, propón solo horarios libres.\n\nSi te piden algo que no está en esta lista, hazlo solo si no rompe ninguna regla, y avisa que está fuera de lo habitual.\n\n## 2. Planilla de cartera\n\nUna fila por propiedad. Tenla en Google Drive (Google Sheets) si cambia seguido. Usa exactamente estas columnas para que las skills encuentren los datos:\n\n| Columna | Qué va | Ejemplo de formato |\n|---|---|---|\n| codigo | Código interno, único | [CÓDIGO] |\n| estado | disponible, reservada, vendida, alquilada, pausada | disponible |\n| operacion | venta o alquiler | venta |\n| tipo | departamento, casa, PH, local, terreno, oficina | departamento |\n| barrio | Barrio o zona | [BARRIO] |\n| referencia | Referencia general, sin dirección exacta | [A UNA CUADRA DE...] |\n| ambientes | Número | [N] |\n| dormitorios | Número | [N] |\n| banos | Número | [N] |\n| sup_cubierta_m2 | Número | [N] |\n| sup_total_m2 | Número | [N] |\n| antiguedad | Años o \"a estrenar\" | [N] |\n| orientacion | Frente, contrafrente, norte, etc. | [ORIENTACIÓN] |\n| precio | Número, sin puntos ni símbolos | [N] |\n| moneda | La que usen | [MONEDA] |\n| expensas | Número o \"sin expensas\" | [N] |\n| apto_credito | sí, no, a confirmar | a confirmar |\n| mascotas | sí, no, a confirmar (alquiler) | a confirmar |\n| cochera | sí, no | no |\n| condiciones | Texto corto con condiciones de la operación | [TEXTO] |\n| corredor | Quién la lleva | [NOMBRE] |\n| actualizado | Fecha de la última revisión | [AAAA-MM-DD] |\n\nReglas de la planilla:\n- Nada de nombres, teléfonos ni documentos de propietarios en esta planilla. Eso vive en el sistema de la inmobiliaria, no en Claude.\n- Cuando una propiedad se reserva o se vende, se cambia el estado el mismo día. Si no, Claude la va a seguir ofreciendo.\n- Si la planilla vive en el Proyecto como archivo subido (y no en Drive), alguien la reemplaza una vez por semana. Anota quién: [NOMBRE].\n\n## 3. Otros archivos para subir al Proyecto\n\n- Preguntas frecuentes con sus respuestas (un documento).\n- 5 fichas que al dueño le gusten, como ejemplo de tono.\n- Horarios de visita y zona que trabajan.\n- Lo que nunca se dice por mensaje (la lista de la regla 3).\n"}, {"archivo": "tarea-programada-seguimiento.md", "que_es": "La tarea programada de seguimiento lista para pegar: checklist previa, configuración sugerida, el prompt completo que deja solo borradores y el plan de la semana de prueba.", "contenido": "# Tarea programada: seguimiento de interesados\n\nEste archivo tiene la configuración sugerida y el texto para pegar como prompt de la tarea. La tarea solo deja borradores: no manda nada.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es del negocio y tiene un plan pago (las tareas programadas están solo en los planes pagos).\n- [ ] Gmail y Google Drive están conectados con la cuenta del negocio y funcionan en un chat normal.\n- [ ] La planilla de interesados existe en Google Drive con estas columnas: nombre_o_alias, canal, propiedad_codigo, que_pregunto, ultimo_contacto (AAAA-MM-DD), estado (nuevo, en conversación, visitó, cerrado), corredor.\n- [ ] Probaste el prompt de abajo a mano en un chat, con la planilla real, y los borradores salen bien.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral, New task. Puedes elegir \"Create with Claude\" y pegarle este archivo, o \"Set up manually\" y completar nombre, prompt, aprobación y frecuencia. Si en tu cuenta tienes la experiencia nueva de Claude, también puedes pedirla en una conversación y confirmar con \"Schedule\".\n\nConfiguración sugerida:\n- Nombre: Seguimiento de interesados\n- Frecuencia: de lunes a viernes, a primera hora, antes de que entren los corredores.\n- Aprobación: elige la opción que te pide permiso antes de actuar. La primera semana, revisa cada corrida en la página Scheduled.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de seguimiento de [NOMBRE DE LA INMOBILIARIA].\n\n1. Abre en Google Drive la planilla \"[NOMBRE DE LA PLANILLA DE INTERESADOS]\" y la planilla de cartera \"[NOMBRE DE LA PLANILLA DE CARTERA]\".\n2. Toma los interesados con estado \"nuevo\" o \"en conversación\" cuyo ultimo_contacto sea de hace [N] días hábiles o más.\n3. Para cada uno, busca en Gmail el último mail con esa persona, si lo hay, para entender en qué quedó la charla.\n4. Decide: escribir hoy, esperar unos días o proponer cerrarlo. Si la propiedad que preguntó ya no figura como disponible en la cartera, busca hasta dos parecidas (misma operación, barrio y ambientes) que sí estén disponibles.\n5. Para los que conviene escribir hoy, si la consulta llegó por mail, crea un borrador de respuesta en Gmail en ese mismo hilo. Si llegó por otro canal, escribe el texto en el resumen para copiarlo.\n6. Cada mensaje tiene 2 o 3 líneas, en voseo, y aporta algo concreto: una propiedad parecida, un cambio de precio que figure en la cartera o un horario de visita nuevo. Nada de \"¿pudiste pensarlo?\".\n\nReglas:\n- No envíes ningún mail. Solo borradores.\n- Usa solo datos de la cartera. Si un dato no está, no lo pongas.\n- No incluyas datos del propietario ni la dirección exacta.\n- No modifiques las planillas.\n\nAl final, déjame un resumen con tres listas: \"Borradores creados\" (nombre o alias, propiedad, canal), \"Para escribir por otro canal\" (con el texto listo) y \"Proponer cerrar\" (con el motivo en una línea).\n\n## La semana de prueba\n\n- [ ] Cada día, un corredor revisa los borradores antes de mandarlos y anota cuáles mandó sin cambios, cuáles corrigió y cuáles descartó.\n- [ ] Al quinto día, ajusta el prompt con lo que más se corrigió (tono, largo, datos que faltaban).\n- [ ] En la reunión de cierre con el dueño, muestra esas notas: qué funcionó, qué falló y qué se cambia.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-ia-para-inmobiliarias", "t": "Sistema con Claude para inmobiliarias, listo para instalar y vender", "d": "Qué tareas le sacás de encima a una inmobiliaria, qué piezas lleva el sistema y cómo se lo ofrecés al dueño sin prometer cosas que no podés cumplir.", "tema": "Vender IA", "min": 9, "fichaNombre": "Inmobiliarias", "ficha": [["Qué es", "Un Proyecto de Claude con las propiedades y las reglas de la inmobiliaria, más skills para fichas, consultas y seguimiento."], ["Necesitás", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No publica solo en los portales ni reemplaza la tasación ni la firma de un profesional matriculado."]], "secciones": [{"h": "Lo que les come el tiempo", "p": ["Antes de ofrecer nada, mirá dónde se va el día de un corredor. Casi siempre es esto:"], "lista": ["Fichas de propiedades: pasar las notas de la visita y las fotos a una descripción prolija para cada portal.", "Consultas repetidas: la misma pregunta de precio, expensas y si acepta mascotas, veinte veces por semana.", "Seguimiento de interesados: gente que preguntó y nadie volvió a llamar.", "Coordinar visitas: idas y vueltas por mensaje para encontrar un horario.", "Informes al propietario: contarle cuántas consultas y visitas hubo y qué dijeron.", "Buscar en la cartera: \"¿qué tenemos de 2 ambientes con balcón en tal barrio?\" y revisar planillas a mano."]}, {"h": "El sistema", "lista": ["Proyecto \"Cartera\": la planilla de propiedades disponibles, las condiciones de cada operación, la zona que trabajan y las preguntas frecuentes. Las instrucciones dicen que responda solo con esos datos.", "Skill de ficha de propiedad: convierte notas sueltas y fotos descritas en título, descripción, lista de características y versión corta para redes.", "Skill de respuesta a consultas: responde en el tono de la inmobiliaria, pide los datos que faltan y propone una visita.", "Skill de informe al propietario: arma el resumen semanal de una propiedad a partir de las consultas y visitas anotadas.", "Conectores: Gmail para leer consultas que llegan por mail y dejar borradores, Google Calendar para ver horarios libres de visita, Google Drive para la planilla de cartera.", "Automatización: una tarea programada que cada mañana revisa los interesados sin respuesta de los últimos días y deja borradores de seguimiento para que el corredor los mande."], "aviso": "Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "p": ["Estos son la base de cada skill. Primero probalos en el chat del Proyecto; cuando salen bien, convertilos en skill como explica la guía \"Convertí una tarea que hacés a mano en una skill\"."], "prompts": [{"t": "Ficha de propiedad desde notas y fotos", "c": "Te paso las notas de la visita y la descripción de las fotos de una propiedad.\nNotas: [PEGÁ LAS NOTAS]\nFotos: [DESCRIBÍ CADA FOTO EN UNA LÍNEA]\nArmame:\n1. Un título de hasta 70 caracteres.\n2. Una descripción de 120 a 180 palabras, clara y sin exagerar.\n3. Lista de características: ambientes, metros, orientación, antigüedad, expensas, servicios.\n4. Una versión de 3 líneas para Instagram.\nReglas: no inventes datos. Si falta algo importante (metros, expensas, apto crédito), listalo al final como PREGUNTAR AL PROPIETARIO. No uses palabras como \"único\" o \"imperdible\"."}, {"t": "Respuesta a consultas de portales", "c": "Llegó esta consulta por [PORTAL O CANAL]: [PEGÁ EL MENSAJE].\nLa propiedad es: [CÓDIGO O DIRECCIÓN].\nUsá solo los datos de la cartera del Proyecto.\nEscribí una respuesta corta, amable y en voseo que:\n1. Conteste lo que preguntó.\n2. Pregunte una sola cosa para calificar (por ejemplo, si es para vivir o invertir, o si ya vendió su propiedad).\n3. Proponga dos horarios de visita.\nSi lo que pregunta no está en los datos, decí que lo confirmás y marcalo como PENDIENTE."}, {"t": "Seguimiento de interesados", "c": "Esta es la lista de interesados de la semana con lo que preguntaron y la última fecha de contacto: [PEGÁ LA LISTA].\nPara cada uno:\n1. Decime si conviene escribirle hoy, en unos días o cerrarlo.\n2. Si conviene escribirle, armá un mensaje de 2 o 3 líneas que aporte algo (una propiedad parecida, una baja de precio, un horario nuevo). Nada de \"¿pudiste pensarlo?\".\n3. Ordenalos de más a menos caliente.\nNo mandes nada: dejame los textos para revisar."}]}, {"h": "Cómo instalarlo", "pasos": ["Pedile al dueño la planilla de cartera, 5 fichas que le gusten, las preguntas que más le hacen y sus reglas (qué datos nunca se dan por mensaje).", "Creá el Proyecto \"Cartera\", subí esos archivos y escribí instrucciones cortas: responder solo con la cartera y marcar lo que falta.", "Probá los tres prompts con propiedades reales y corregí hasta que el corredor diga \"esto lo mando así\".", "Convertí cada prompt en skill y subilas en Customize → Skills.", "Conectá Gmail, Google Calendar y Google Drive con la cuenta del negocio, no con la tuya.", "Armá la tarea programada de seguimiento y dejala una semana dejando solo borradores.", "Hacé una reunión corta de cierre: qué ahorró, qué falló y qué se ajusta."]}, {"h": "Cómo ofrecérselo", "p": ["El dueño de una inmobiliaria no compra \"IA\": compra no perder interesados y que sus corredores salgan a la calle en vez de escribir fichas. Hablale de eso."], "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para inmobiliarias. Vi que publican bastante en [PORTAL O RED] y me imagino que las fichas y las consultas repetidas se llevan buena parte del día.\nLo que hago es dejarles un asistente que arma fichas con las notas de la visita, prepara las respuestas a consultas y les recuerda a quién hacerle seguimiento. El corredor siempre revisa antes de mandar.\n¿Te sirve que te muestre en 15 minutos cómo quedaría con una propiedad tuya?"}], "lista": ["Argumento central: \"Tus corredores dejan de escribir lo mismo todo el día y ningún interesado se queda sin respuesta. Vos seguís decidiendo qué sale.\"", "Demo: pedile una propiedad real y armá la ficha delante de él. Vale más que cualquier explicación.", "Precio: mirá la guía \"Cuánto cobrar por automatizar con IA\" antes de pasar un número."]}, {"h": "Cuidados del rubro", "lista": ["Datos de propietarios e interesados: nombres, teléfonos, situación económica. Subí solo lo necesario y nunca documentos de identidad.", "Publicidad: el precio, los metros y las condiciones tienen que ser los reales. Que Claude no \"mejore\" datos.", "Firma profesional: tasaciones, reservas y contratos los revisa y firma quien corresponde según las reglas de cada lugar."], "aviso": "Claude no reemplaza al corredor ni al abogado. Todo lo que sale hacia un cliente lo revisa una persona, y los datos personales se cuidan según las leyes de protección de datos de cada país."}], "faq": [{"q": "¿Claude puede publicar solo en los portales?", "a": "En este sistema no. Claude prepara la ficha y el corredor la carga. Si el portal tuviera un conector oficial, revisá su documentación antes de prometerlo."}, {"q": "¿Y las consultas que llegan por WhatsApp?", "a": "Podés usar la skill de respuestas copiando y pegando. Si quieren un agente que responda solo, eso es otro proyecto: mirá la guía \"Agente de WhatsApp que atiende y agenda turnos\"."}, {"q": "¿Qué pasa si la cartera cambia todos los días?", "a": "Conviene que la planilla viva en Google Drive y que el Proyecto la consulte desde ahí, o que alguien actualice el archivo del Proyecto una vez por semana."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"]};</script>

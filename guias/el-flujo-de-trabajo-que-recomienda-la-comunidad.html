<script>var GUIA = {"slug": "el-flujo-de-trabajo-que-recomienda-la-comunidad", "t": "El flujo de trabajo que recomienda la comunidad para Claude Code", "d": "Explorar, planificar, construir de a un paso, revisar y guardar. El orden que repiten los hilos más votados y que también pide la documentación oficial.", "tema": "Claude Code", "min": 8, "ficha": [["Qué es", "Un orden de trabajo en cinco pasos para que Claude no resuelva el problema equivocado."], ["Para quién", "Cualquiera que use Claude Code, programe o no."], ["Necesitás", "Claude Code instalado y tu proyecto guardado con git."], ["Qué no hace", "No reemplaza tu revisión: vos decidís qué se guarda."]], "fichaNombre": "El flujo", "secciones": [{"h": "Por qué un orden fijo", "p": ["Si dejás que Claude salte directo al código, puede construir algo prolijo que resuelve otra cosa. La documentación oficial lo dice así: separá investigar y planificar de construir.", "En Reddit y Hacker News pasa lo mismo. El hilo con los consejos de Boris, del equipo de Claude Code, y el de un dev senior con seis meses de uso diario arrancan igual: plan primero, después código, y una forma de comprobar que funciona."], "lista": ["Explorar: Claude lee y te explica, sin tocar nada.", "Planificar: escribe un plan que vos corregís.", "Construir: de a un paso, con una prueba que Claude pueda correr.", "Revisar: con ojos frescos, no los mismos que escribieron el código.", "Guardar: un commit con un mensaje claro y la sesión cerrada."]}, {"h": "1. Explorar sin tocar nada", "p": ["Entrá en modo plan: ahí Claude lee archivos y responde, pero no cambia nada."], "pasos": ["Apretá Shift+Tab hasta que la barra de estado diga plan mode on. También podés arrancar con claude --permission-mode plan o escribir /plan seguido de la tarea.", "Pedile que lea la parte del proyecto que vas a tocar y que te la explique.", "Si la investigación es grande, pedile que use subagentes: leen aparte y te traen un resumen, así tu conversación no se llena."], "prompts": [{"t": "Explorar antes de tocar", "c": "Leé [CARPETA O ARCHIVOS] y explicame cómo funciona [LA PARTE QUE QUIERO CAMBIAR].\nDecime qué archivos intervienen y qué podría romperse si lo cambio.\nNo modifiques nada todavía. Si necesitás leer mucho, usá subagentes y traeme solo el resumen."}]}, {"h": "2. Planificar y corregir el plan", "p": ["Con lo que leyó, pedile un plan. Apretá Ctrl+G para abrirlo en tu editor y corregirlo vos antes de que Claude avance.", "Si a mitad de camino algo se tuerce, no empujes: volvé a modo plan y replanificá. Es de los consejos más repetidos en los hilos."], "prompts": [{"t": "Pedir el plan", "c": "Quiero [LO QUE QUERÉS LOGRAR].\nArmame un plan por pasos chicos: qué archivos cambian, en qué orden y cómo vamos a comprobar cada paso.\nAl final, listá lo que queda afuera de esta tarea y las dudas que tengas."}, {"t": "Para algo grande: que te entreviste", "c": "Quiero construir [DESCRIPCIÓN CORTA]. Entrevistame en detalle con la herramienta AskUserQuestion.\nPreguntame por cómo funciona, cómo se ve, casos raros y lo que me preocupa. No me hagas preguntas obvias: andá a lo difícil.\nCuando tengamos todo, escribí el spec completo en SPEC.md."}], "aviso": "El plan también cuesta. Si podés describir el cambio en una frase (un typo, un texto, renombrar algo), pedilo directo y salteá este paso."}, {"h": "3. Construir de a un paso, con una prueba", "p": ["Pedí solo el primer paso del plan, miralo y recién ahí el siguiente. En los hilos se repite: pedir toda la función de una vez tiende a desviarse.", "Lo que más recomienda la documentación es darle a Claude algo que diga si anduvo o no: tests, un build, una captura para comparar. Sin eso, el control sos vos."], "prompts": [{"t": "Un paso, con prueba", "c": "Implementá solo el paso [NÚMERO] del plan.\nDespués corré [COMANDO DE PRUEBA, EJ.: npm test] y mostrame la salida tal cual.\nSi falla, buscá la causa de fondo. No apagues el error ni cambies la prueba para que pase."}], "lista": ["Esc: frena a Claude en el momento y conserva lo hablado, para que lo redirijas.", "Esc dos veces o /rewind: volvés a un punto anterior de la conversación, del código o de los dos. Solo deshace lo que Claude editó con sus herramientas de archivos, no lo que cambió con comandos de terminal: para eso está git.", "Después de dos correcciones fallidas sobre lo mismo: /clear y un pedido nuevo con lo que aprendiste."]}, {"h": "4. Revisar con ojos frescos", "p": ["Quien escribió el código no es el mejor revisor. La doc propone un subagente o una segunda sesión que vea solo el cambio y el plan.", "Los comandos que más aparecen en los hilos para esta etapa ya vienen incluidos: /simplify busca código para limpiar y /code-review busca errores. No son lo mismo: /simplify no busca bugs."], "prompts": [{"t": "Revisión contra el plan", "c": "Usá un subagente para revisar el cambio contra [PLAN.md O SPEC.md].\nQue chequee que cada punto del plan esté hecho, que los casos raros tengan prueba y que no se haya tocado nada fuera de la tarea.\nReportá solo lo que afecta que funcione bien o lo que pedí. Los gustos de estilo, aparte y como opcionales."}, {"t": "Tomame examen", "c": "Antes de guardar esto, haceme 5 preguntas sobre el cambio que hiciste: qué hace, por qué así y qué pasa en los casos raros. Corregime si respondo mal."}], "aviso": "Un revisor al que le pedís problemas siempre encuentra alguno. Si corregís todo, terminás con código más complicado. Quedate con lo que afecta que funcione."}, {"h": "5. Guardar y cerrar", "pasos": ["Pedile que haga el commit con un mensaje que explique el cambio y, si usás GitHub, que abra el pull request.", "Hacé una mini retro: preguntale qué aprendió del proyecto en esta sesión y pasá a tu CLAUDE.md solo lo que evita un error repetido.", "Usá /clear antes de empezar otra tarea que no tenga nada que ver.", "Si la tarea sigue mañana, ponele nombre a la sesión con /rename y retomala con claude --continue o claude --resume."], "prompts": [{"t": "Cierre de sesión", "c": "Hacé el commit de estos cambios con un mensaje claro en español.\nDespués decime en 3 líneas qué aprendiste de este proyecto hoy que te habría ahorrado un error. Proponé cuál de esas cosas sumar al CLAUDE.md, sin escribirlo todavía."}]}], "faq": [{"q": "¿Tengo que usar modo plan siempre?", "a": "No. La documentación lo recomienda cuando no tenés claro el enfoque, cuando el cambio toca varios archivos o cuando no conocés el código. Para un cambio que se explica en una frase, pedilo directo."}, {"q": "No sé programar. ¿Cómo reviso lo que hizo?", "a": "Pedile evidencia: la salida de las pruebas, el comando que corrió o una captura. Pedile también que te explique el cambio con palabras simples y que te tome examen. Si no lo entendés, todavía no está listo para guardar."}, {"q": "Claude se va por las ramas. ¿Qué hago?", "a": "Frenalo con Esc apenas lo notes. Si ya lo corregiste dos veces y sigue igual, usá /clear y empezá con un pedido más preciso: una sesión limpia rinde más que una larga llena de correcciones."}], "fuentes": ["https://code.claude.com/docs/en/best-practices", "https://support.claude.com/en/articles/14554000-claude-code-power-user-tips", "https://code.claude.com/docs/en/commands", "https://www.reddit.com/r/ClaudeAI/comments/1qspcip/10_claude_code_tips_from_boris_the_creator_of/", "https://www.reddit.com/r/ClaudeAI/comments/1sn27yu/claude_code_workflow_tips_after_6_months_of_daily/", "https://news.ycombinator.com/item?id=46256606", "https://news.ycombinator.com/item?id=44362244", "https://news.ycombinator.com/item?id=48897613", "https://code.claude.com/docs/en/permission-modes", "https://code.claude.com/docs/en/interactive-mode"], "ejemplo": {"titulo": "Ejemplo resuelto: un filtro nuevo en el catálogo web, siguiendo los cinco pasos", "negocio": "Ejemplo inventado: una distribuidora de repuestos de moto en Asunción, Paraguay, con un catálogo web que mantiene un dev junior del equipo. El proyecto está en git y tiene algunas pruebas automáticas.", "punto_de_partida": "Los vendedores piden filtrar el catálogo por marca de moto. La vez anterior que el dev pidió algo así de una, Claude cambió también el buscador y rompió los resultados.", "pasos": ["Explorar: entró en modo plan con Shift+Tab y usó el prompt Explorar antes de tocar sobre la carpeta del catálogo. Claude le explicó de dónde salen los productos, cómo funciona el filtro por categoría que ya existía y que el buscador comparte código con los filtros.", "Planificar: pidió el plan por pasos chicos. Lo copió a PLAN.md con la plantilla del kit y anotó en Fuera de alcance que el buscador no se toca. Con Ctrl+G sacó un paso que proponía reordenar el menú.", "Construir: aprobó con Yes, manually approve edits. Pidió solo el paso 1 con su prueba (npm test) y miró la salida. Después el paso 2. En el paso 3 Claude se fue hacia el buscador; lo frenó con Esc y le recordó el alcance.", "Revisar: corrió /code-review para buscar errores y después pidió una revisión contra PLAN.md con un subagente. De lo que salió se quedó con un caso sin cubrir (productos sin marca cargada) y dejó lo de estilo para otro día.", "Guardar: usó la skill cerrar-sesion del kit. Hizo el commit y sumó una regla al CLAUDE.md: el buscador comparte código con los filtros, corré sus pruebas también. Cerró con /clear."], "resultado": "El filtro por marca quedó andando sin tocar el buscador, con pruebas que pasan y un PLAN.md que documenta qué se hizo. La regla nueva del CLAUDE.md evita el mismo error en el próximo filtro."}, "si_falla": [{"sintoma": "Claude dice que terminó, pero cuando lo probás no anda.", "solucion": "Pedile evidencia, no un listo: la salida de las pruebas, el comando que corrió o una captura. Si el proyecto no tiene pruebas, pedile que arme una mínima para ese cambio o un script que compare el resultado esperado. Sin algo que diga pasa o falla, el control sos vos."}, {"sintoma": "Usaste /rewind y un archivo quedó igual de roto.", "solucion": "Los checkpoints solo guardan lo que Claude editó con sus herramientas de archivos. Si cambió algo con un comando de terminal, no vuelve. Pedile que te muestre git diff de ese archivo y que lo restaure desde el último commit. Por eso conviene un commit por paso."}, {"sintoma": "/code-review dice que no hay nada para revisar.", "solucion": "Revisa el diff actual. Si ya hiciste commit, pasale la rama o el número del pull request, por ejemplo /code-review y el número. También podés pasarle una ruta para revisar solo esa parte."}, {"sintoma": "En una sesión larga Claude empieza a olvidar lo que acordaron o a mezclar tareas.", "solucion": "El contexto está lleno. Si cambiás de tarea, /clear. Si es la misma, /compact con lo que tiene que conservar, por ejemplo /compact conservá el plan y los archivos modificados. Para la próxima, mandá la exploración a subagentes."}, {"sintoma": "claude --continue abre una conversación que no es la que buscabas.", "solucion": "--continue retoma la última conversación. Usá claude --resume para elegir de la lista, y la próxima vez ponele nombre a la sesión con /rename para encontrarla rápido."}], "kit": [{"archivo": "cerrar-sesion/SKILL.md", "que_es": "Skill para el paso 5: muestra qué cambió, corre las pruebas, hace el commit con tu OK y propone una sola regla para el CLAUDE.md. Ponela en .claude/skills/cerrar-sesion/ y usala con /cerrar-sesion.", "contenido": "---\nname: cerrar-sesion\ndescription: 'Cierra una sesión de Claude Code: revisa qué cambió, hace el commit con un mensaje claro y propone qué aprender para el CLAUDE.md sin escribirlo. Usala con /cerrar-sesion al terminar una tarea.'\ndisable-model-invocation: true\n---\n\n# Cerrar la sesión\n\nNotas del usuario sobre la tarea (puede venir vacío): $ARGUMENTS\n\n## Pasos\n\n1. Corré git status y git diff --stat. Mostrale al usuario, en una lista corta, qué archivos cambiaron y para qué.\n2. Si hay archivos que no tienen que ver con la tarea, preguntá antes de incluirlos. No los sumes por tu cuenta.\n3. Si el proyecto tiene un comando de prueba (en el CLAUDE.md o en package.json), corrélo y mostrá la salida tal cual. Si falla, frená y avisá: no hagas commit.\n4. Proponé un mensaje de commit en español: una primera línea corta con qué cambió y, abajo, por qué. Esperá el OK del usuario y recién ahí hacé el commit.\n5. Mini retro: en 3 líneas como máximo, decí qué aprendiste del proyecto hoy que habría evitado un error o una aclaración repetida.\n6. De esas líneas, proponé como mucho una para sumar al CLAUDE.md, escrita como regla concreta y verificable. No la escribas: mostrala y esperá que el usuario decida.\n7. Recordale: si la próxima tarea no tiene nada que ver, conviene /clear; si esta sigue otro día, /rename con un nombre claro y después claude --resume.\n\n## Reglas\n\n- Nunca hagas push ni abras un pull request salvo que el usuario lo pida.\n- Nunca uses opciones que salteen las pruebas o los hooks del commit.\n"}, {"archivo": "checklist-flujo-cinco-pasos.md", "que_es": "Checklist de una página para cada tarea, con el atajo o comando de cada paso. Imprimila o dejala abierta al lado de la terminal.", "contenido": "# El flujo en cinco pasos: checklist de cada tarea\n\nPegala al lado de la terminal. Cada paso tiene el atajo o comando que lo hace.\n\n## Antes de empezar\n- [ ] git status limpio (o una copia de la carpeta si no usás git).\n- [ ] ¿Se explica en una frase? Pedilo directo y saltá al paso 3.\n\n## 1. Explorar (modo plan)\n- [ ] Shift+Tab hasta ver plan mode on (o /plan con la tarea).\n- [ ] Le pedí que me explique la parte a tocar y qué podría romperse.\n- [ ] Si hay mucho para leer, le pedí que use subagentes y me traiga un resumen.\n\n## 2. Planificar\n- [ ] Tengo un plan con pasos chicos, archivos y cómo se prueba cada paso.\n- [ ] Lo corregí (Ctrl+G o No, keep planning) antes de aprobar.\n- [ ] Para algo grande: me entrevistó y quedó un SPEC.md.\n- [ ] Guardé el plan en PLAN.md si lo voy a usar para revisar.\n\n## 3. Construir de a un paso\n- [ ] Pedí solo el paso [N] y la prueba de ese paso.\n- [ ] Vi la salida de la prueba, no solo un \"listo\".\n- [ ] Si se desvía: Esc. Si ya lo corregí dos veces: /clear y pedido nuevo.\n\n## 4. Revisar con ojos frescos\n- [ ] /code-review para buscar errores (y /simplify si quiero limpiar, sabiendo que no busca bugs).\n- [ ] Revisión contra PLAN.md con un subagente o una segunda sesión.\n- [ ] Me quedé con lo que afecta que funcione; lo de estilo, opcional.\n- [ ] Si no sé programar: me tomó examen y entendí el cambio.\n\n## 5. Guardar y cerrar\n- [ ] Commit con mensaje claro (o /cerrar-sesion si tenés la skill del kit).\n- [ ] Una sola regla nueva al CLAUDE.md, si evita un error repetido.\n- [ ] /clear antes de otra tarea, o /rename si sigue mañana.\n"}, {"archivo": "plantilla-plan-de-tarea.md", "que_es": "Plantilla de PLAN.md con pasos, pruebas, fuera de alcance y casos raros, lista para que el revisor compare el cambio contra el plan. Guardala como PLAN.md en la raíz del proyecto.", "contenido": "# PLAN: [NOMBRE CORTO DE LA TAREA]\n\nFecha: [FECHA]\nPedido original: [LO QUE PEDISTE, CON TUS PALABRAS]\n\n## Objetivo\n[UNA LÍNEA: QUÉ VA A QUEDAR FUNCIONANDO Y PARA QUIÉN]\n\n## Fuera de alcance\n- [LO QUE ESTA TAREA NO TOCA]\n\n## Pasos\n| # | Qué se hace | Archivos | Cómo se prueba | Hecho |\n|---|-------------|----------|----------------|-------|\n| 1 | [PASO] | [ARCHIVO] | [COMANDO O QUÉ VER] | [ ] |\n| 2 | [PASO] | [ARCHIVO] | [COMANDO O QUÉ VER] | [ ] |\n| 3 | [PASO] | [ARCHIVO] | [COMANDO O QUÉ VER] | [ ] |\n\n## Casos raros que tienen que estar cubiertos\n- [EJ.: EL CAMPO VIENE VACÍO]\n- [EJ.: EL USUARIO NO TIENE CONEXIÓN]\n\n## Riesgos\n- [QUÉ PODRÍA ROMPERSE Y CÓMO LO EVITAMOS]\n\n## Prueba final (de punta a punta)\n[LO QUE HACÉS VOS, PASO A PASO, PARA DAR LA TAREA POR TERMINADA]\n\n## Decisiones tomadas en el camino\n- [FECHA]: [QUÉ SE DECIDIÓ Y POR QUÉ]\n\n<!-- Instrucción para el revisor: compará el cambio contra este archivo. Reportá solo pasos sin hacer, casos raros sin prueba y cambios fuera de alcance. -->\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

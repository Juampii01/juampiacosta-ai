<script>var GUIA = {"slug": "el-flujo-de-trabajo-que-recomienda-la-comunidad", "t": "El flujo de trabajo que recomienda la comunidad para Claude Code", "d": "Explorar, planificar, construir de a un paso, revisar y guardar. El orden que repiten los hilos más votados y que también pide la documentación oficial.", "tema": "Claude Code", "min": 8, "ficha": [["Qué es", "Un orden de trabajo en cinco pasos para que Claude no resuelva el problema equivocado."], ["Para quién", "Cualquiera que use Claude Code, programe o no."], ["Necesitás", "Claude Code instalado y tu proyecto guardado con git."], ["Qué no hace", "No reemplaza tu revisión: vos decidís qué se guarda."]], "fichaNombre": "El flujo", "secciones": [{"h": "Por qué un orden fijo", "p": ["Si dejás que Claude salte directo al código, puede construir algo prolijo que resuelve otra cosa. La documentación oficial lo dice así: separá investigar y planificar de construir.", "En Reddit y Hacker News pasa lo mismo. El hilo con los consejos de Boris, del equipo de Claude Code, y el de un dev senior con seis meses de uso diario arrancan igual: plan primero, después código, y una forma de comprobar que funciona."], "lista": ["Explorar: Claude lee y te explica, sin tocar nada.", "Planificar: escribe un plan que vos corregís.", "Construir: de a un paso, con una prueba que Claude pueda correr.", "Revisar: con ojos frescos, no los mismos que escribieron el código.", "Guardar: un commit con un mensaje claro y la sesión cerrada."]}, {"h": "1. Explorar sin tocar nada", "p": ["Entrá en modo plan: ahí Claude lee archivos y responde, pero no cambia nada."], "pasos": ["Apretá Shift+Tab hasta que la barra de estado diga plan mode on. También podés arrancar con claude --permission-mode plan o escribir /plan seguido de la tarea.", "Pedile que lea la parte del proyecto que vas a tocar y que te la explique.", "Si la investigación es grande, pedile que use subagentes: leen aparte y te traen un resumen, así tu conversación no se llena."], "prompts": [{"t": "Explorar antes de tocar", "c": "Leé [CARPETA O ARCHIVOS] y explicame cómo funciona [LA PARTE QUE QUIERO CAMBIAR].\nDecime qué archivos intervienen y qué podría romperse si lo cambio.\nNo modifiques nada todavía. Si necesitás leer mucho, usá subagentes y traeme solo el resumen."}]}, {"h": "2. Planificar y corregir el plan", "p": ["Con lo que leyó, pedile un plan. Apretá Ctrl+G para abrirlo en tu editor y corregirlo vos antes de que Claude avance.", "Si a mitad de camino algo se tuerce, no empujes: volvé a modo plan y replanificá. Es de los consejos más repetidos en los hilos."], "prompts": [{"t": "Pedir el plan", "c": "Quiero [LO QUE QUERÉS LOGRAR].\nArmame un plan por pasos chicos: qué archivos cambian, en qué orden y cómo vamos a comprobar cada paso.\nAl final, listá lo que queda afuera de esta tarea y las dudas que tengas."}, {"t": "Para algo grande: que te entreviste", "c": "Quiero construir [DESCRIPCIÓN CORTA]. Entrevistame en detalle con la herramienta AskUserQuestion.\nPreguntame por cómo funciona, cómo se ve, casos raros y lo que me preocupa. No me hagas preguntas obvias: andá a lo difícil.\nCuando tengamos todo, escribí el spec completo en SPEC.md."}], "aviso": "El plan también cuesta. Si podés describir el cambio en una frase (un typo, un texto, renombrar algo), pedilo directo y salteá este paso."}, {"h": "3. Construir de a un paso, con una prueba", "p": ["Pedí solo el primer paso del plan, miralo y recién ahí el siguiente. En los hilos se repite: pedir toda la función de una vez tiende a desviarse.", "Lo que más recomienda la documentación es darle a Claude algo que diga si anduvo o no: tests, un build, una captura para comparar. Sin eso, el control sos vos."], "prompts": [{"t": "Un paso, con prueba", "c": "Implementá solo el paso [NÚMERO] del plan.\nDespués corré [COMANDO DE PRUEBA, EJ.: npm test] y mostrame la salida tal cual.\nSi falla, buscá la causa de fondo. No apagues el error ni cambies la prueba para que pase."}], "lista": ["Esc: frena a Claude en el momento y conserva lo hablado, para que lo redirijas.", "Esc dos veces o /rewind: volvés a un punto anterior de la conversación, del código o de los dos.", "Después de dos correcciones fallidas sobre lo mismo: /clear y un pedido nuevo con lo que aprendiste."]}, {"h": "4. Revisar con ojos frescos", "p": ["Quien escribió el código no es el mejor revisor. La doc propone un subagente o una segunda sesión que vea solo el cambio y el plan.", "Los comandos que más aparecen en los hilos para esta etapa ya vienen incluidos: /simplify busca código para limpiar y /code-review busca errores. No son lo mismo: /simplify no busca bugs."], "prompts": [{"t": "Revisión contra el plan", "c": "Usá un subagente para revisar el cambio contra [PLAN.md O SPEC.md].\nQue chequee que cada punto del plan esté hecho, que los casos raros tengan prueba y que no se haya tocado nada fuera de la tarea.\nReportá solo lo que afecta que funcione bien o lo que pedí. Los gustos de estilo, aparte y como opcionales."}, {"t": "Tomame examen", "c": "Antes de guardar esto, haceme 5 preguntas sobre el cambio que hiciste: qué hace, por qué así y qué pasa en los casos raros. Corregime si respondo mal."}], "aviso": "Un revisor al que le pedís problemas siempre encuentra alguno. Si corregís todo, terminás con código más complicado. Quedate con lo que afecta que funcione."}, {"h": "5. Guardar y cerrar", "pasos": ["Pedile que haga el commit con un mensaje que explique el cambio y, si usás GitHub, que abra el pull request.", "Hacé una mini retro: preguntale qué aprendió del proyecto en esta sesión y pasá a tu CLAUDE.md solo lo que evita un error repetido.", "Usá /clear antes de empezar otra tarea que no tenga nada que ver.", "Si la tarea sigue mañana, ponele nombre a la sesión con /rename y retomala con claude --continue o claude --resume."], "prompts": [{"t": "Cierre de sesión", "c": "Hacé el commit de estos cambios con un mensaje claro en español.\nDespués decime en 3 líneas qué aprendiste de este proyecto hoy que te habría ahorrado un error. Proponé cuál de esas cosas sumar al CLAUDE.md, sin escribirlo todavía."}]}], "faq": [{"q": "¿Tengo que usar modo plan siempre?", "a": "No. La documentación lo recomienda cuando no tenés claro el enfoque, cuando el cambio toca varios archivos o cuando no conocés el código. Para un cambio que se explica en una frase, pedilo directo."}, {"q": "No sé programar. ¿Cómo reviso lo que hizo?", "a": "Pedile evidencia: la salida de las pruebas, el comando que corrió o una captura. Pedile también que te explique el cambio con palabras simples y que te tome examen. Si no lo entendés, todavía no está listo para guardar."}, {"q": "Claude se va por las ramas. ¿Qué hago?", "a": "Frenalo con Esc apenas lo notes. Si ya lo corregiste dos veces y sigue igual, usá /clear y empezá con un pedido más preciso: una sesión limpia rinde más que una larga llena de correcciones."}], "fuentes": ["https://code.claude.com/docs/en/best-practices", "https://support.claude.com/en/articles/14554000-claude-code-power-user-tips", "https://code.claude.com/docs/en/commands", "https://www.reddit.com/r/ClaudeAI/comments/1qspcip/10_claude_code_tips_from_boris_the_creator_of/", "https://www.reddit.com/r/ClaudeAI/comments/1sn27yu/claude_code_workflow_tips_after_6_months_of_daily/", "https://news.ycombinator.com/item?id=46256606", "https://news.ycombinator.com/item?id=44362244", "https://news.ycombinator.com/item?id=48897613"], "cat": "claude-code", "parte": "construi"};</script>

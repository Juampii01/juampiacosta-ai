<script>var GUIA = {"slug": "claude-te-edita-el-reel", "fuentes": ["https://github.com/WyattBlue/auto-editor", "https://github.com/SYSTRAN/faster-whisper", "https://ffmpeg.org/download.html", "https://auto-editor.com/installing", "https://github.com/WyattBlue/auto-editor/releases", "https://docs.claude.com/en/docs/claude-code/data-usage"], "post": "EDITAR", "t": "Claude te edita el reel", "d": "Le pasas el video crudo y te devuelve el reel: silencios cortados, subtítulos palabra por palabra y música que baja sola cuando hablas. Todo gratis y en tu computadora.", "tema": "Contenido y redes", "min": 8, "fichaNombre": "editar.py", "ficha": [["Qué es", "Un script que Claude Code corre por ti con auto-editor, Whisper y ffmpeg."], ["Necesitas", "Claude Code, Python 3.10+, ffmpeg y unos 2 GB libres."], ["Privacidad", "El video se procesa en tu computadora y no se sube a ningún lado. Lo que Claude Code lee para ayudarte (por ejemplo, la transcripción en final_palabras.json) sí viaja a Claude, como cualquier mensaje."]], "secciones": [{"h": "Qué hace", "lista": ["Corta los silencios: con auto-editor.", "Subtítulos palabra por palabra: con Whisper, en grande y con efecto pop.", "Música de fondo: baja sola cuando hablas y sube en las pausas."]}, {"h": "Opción rápida: que Claude haga todo", "p": ["Abre Claude Code en la carpeta de tu video y pega esto (cambia los nombres si tus archivos se llaman distinto):"], "prompts": [{"t": "Editar mi reel", "c": "Quiero editar mi reel automáticamente. 1) Descarga el script de https://drive.google.com/uc?export=download&id=1mvLb8QlHK1cT12tAdsFZ4YEj2Gm2S4S5 y guárdalo como editar.py. Léelo antes de correrlo. 2) Revisa si tengo ffmpeg, auto-editor y faster-whisper; si falta alguno, dime qué vas a instalar e instálalo. auto-editor ya no se publica en pip: en Mac instálalo con brew install auto-editor y en Windows o Linux con el binario oficial de la página Releases de su repo. faster-whisper se instala con pip install faster-whisper. 3) Córrelo así: python3 editar.py [VIDEO].mp4 --musica [MUSICA].mp3 --salida final.mp4. 4) Cuando termine, revisa final_palabras.json y avísame si alguna palabra quedó mal."}]}, {"h": "Ajustes: pídeselos a Claude", "lista": ["Que corte más o menos: \"cambia el margen a 0.1sec\" (más) o \"a 0.3sec\" (más aire).", "Subtítulos: \"ponlos en amarillo y un poco más grandes\".", "Música: \"súbela a 0.4\" (ahora está en 0.25).", "Mejor transcripción: \"usa el modelo medium\" (más preciso, más lento)."]}], "faq": [{"q": "\"ffmpeg no se reconoce\"", "a": "Instálalo (brew install ffmpeg en Mac, winget install Gyan.FFmpeg en Windows) y abre una terminal nueva."}, {"q": "La primera vez tarda mucho", "a": "Se está bajando el modelo de Whisper desde Hugging Face. Cuánto pesa depende del modelo: medium pesa bastante más que los chicos. Pasa una sola vez por modelo; después queda guardado en tu computadora."}], "idea": [], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio de pilates que edita sus reels en la computadora", "negocio": "Ejemplo inventado: un estudio de pilates reformer en Fisherton, Rosario. Lo atiende la dueña con dos instructoras. Publican dos reels por semana con tips y clases cortas, grabados con el celular.", "punto_de_partida": "La dueña graba de corrido, con errores y pausas, y pierde una tarde por semana cortando en una app del celular y escribiendo subtítulos a mano.", "pasos": ["Leyó la checklist de grabación del kit y cambió dos cosas: apagó el aire acondicionado del estudio al grabar y empezó a hacer una pausa de dos segundos cada vez que se equivocaba.", "Grabó un reel de tip en vertical, lo pasó a la computadora como crudo-tip-espalda.mp4 y puso al lado una pista libre de derechos, musica-suave.mp3.", "Armó en la misma carpeta el archivo palabras-de-mi-marca.md con el nombre del estudio, reformer, Fisherton y clase de prueba.", "Instaló la skill editar-reel del kit en ~/.claude/skills/editar-reel/ y abrió Claude Code en la carpeta del video.", "Pegó el prompt de la guía cambiando los nombres. Claude bajó editar.py, se lo resumió y le avisó que faltaba auto-editor. Como usa Mac, le propuso brew install auto-editor y ella aceptó.", "La primera corrida tardó porque Whisper bajó el modelo. Claude le mostró la tabla de palabras sospechosas: había escrito \"reformar\" en lugar de \"reformer\". Ella confirmó y Claude corrigió.", "Miró el reel. Le pareció que cortaba muy al ras y pidió: \"cambia el margen a 0.3sec\". También pidió la música un poco más baja.", "Antes de publicar, siguió la última parte de la checklist: lo miró sin sonido leyendo solo los subtítulos y lo escuchó en el parlante del celular."], "resultado": "Quedó un flujo fijo: graba, deja el crudo y la música en una carpeta, le pide a Claude la edición y revisa los subtítulos sospechosos antes de publicar. El crudo queda guardado y el video nunca salió de su computadora."}, "si_falla": [{"sintoma": "Claude intenta pip install auto-editor y falla, o instala algo que no reconoce las opciones del script.", "solucion": "auto-editor ya no se publica en pip. Desinstala lo que quedó (pip uninstall auto-editor) e instálalo con brew install auto-editor en Mac o con el binario de la página Releases del repo en Windows y Linux. Renómbralo a auto-editor (o auto-editor.exe) y ponlo en una carpeta del PATH. Después corre auto-editor --help para confirmar."}, {"sintoma": "En Mac aparece un aviso de \"desarrollador no identificado\" al correr el binario de auto-editor.", "solucion": "La guía oficial avisa que los binarios no están firmados y que el aviso se puede ignorar. Si prefieres evitarlo, instálalo con Homebrew (brew install auto-editor)."}, {"sintoma": "faster-whisper tira un error de librerías de CUDA o cuDNN (por ejemplo, que no encuentra una DLL de cudnn).", "solucion": "Pasa en compus con placa NVIDIA cuando faltan cuBLAS y cuDNN para CUDA 12. Lo más simple: pídele a Claude que el script use la CPU (device=\"cpu\", compute_type=\"int8\"). Tarda más pero anda. Si quieres usar la placa, el README de faster-whisper explica qué versiones instalar."}, {"sintoma": "editar.py se descargó pero al correrlo da error de sintaxis, y adentro hay HTML.", "solucion": "Google Drive a veces devuelve una página web en lugar del archivo. Bájalo desde el navegador con el mismo link, guárdalo como editar.py en la carpeta del video y pídele a Claude que lo lea antes de correrlo."}, {"sintoma": "El video final corta el principio o el final de algunas palabras.", "solucion": "Sube el margen: pide \"cambia el margen a 0.3sec\". Si hay ruido de fondo parejo, auto-editor no distingue bien el silencio: regraba sin ventilador ni aire, o pide a Claude que ajuste el umbral de audio del corte."}], "kit": [{"archivo": "editar-reel/SKILL.md", "que_es": "Skill para Claude Code que revisa las herramientas, corre editar.py sin pisar el crudo, compara los subtítulos con tus palabras de marca y te muestra solo las dudosas. Guárdala en ~/.claude/skills/editar-reel/SKILL.md.", "contenido": "---\nname: editar-reel\ndescription: 'Edita un reel crudo con editar.py: auto-editor corta silencios, faster-whisper subtitula y ffmpeg suma música. Úsala al pedir editar un reel, cortar silencios, subtitular o sumar música.'\n---\n\n# Editar un reel\n\nTrabajas en la carpeta donde está el video. Nada se sube a internet: el video se procesa en esta computadora.\n\n## 1. Antes de tocar nada\n\n1. Lista los archivos de la carpeta y confirma con el usuario cuál es el video crudo y cuál la música (si hay).\n2. Si no existe editar.py en la carpeta, pídele al usuario el link o el archivo. Léelo entero antes de correrlo y cuéntale en tres líneas qué hace.\n3. Revisa las herramientas, una por una, y muestra la versión de cada una:\n   - `ffmpeg -version`\n   - `auto-editor --help` (si no está: en Mac `brew install auto-editor`; en Windows o Linux, el binario de la página Releases de github.com/WyattBlue/auto-editor. No uses pip: auto-editor ya no se publica ahí)\n   - `python3 -c \"import faster_whisper\"` (si falla: `pip install faster-whisper`)\n4. Antes de instalar algo, di exactamente qué comando vas a correr y espera el sí.\n\n## 2. Correr la edición\n\n1. Si el archivo de salida ya existe, no lo pises: usa otro nombre (final-2.mp4, final-3.mp4).\n2. Corre: `python3 editar.py [VIDEO] --musica [MUSICA] --salida [SALIDA]`. Si no hay música, pregunta si el script la acepta como opcional antes de sacar el parámetro.\n3. Si es la primera vez, avisa que Whisper baja el modelo y puede tardar. No lo cortes.\n\n## 3. Revisar los subtítulos\n\n1. Abre el archivo de palabras que genera el script (por ejemplo, final_palabras.json).\n2. Si en la carpeta hay un archivo palabras-de-mi-marca.md, compara cada palabra contra esa lista: nombres propios, marcas, productos, barrios.\n3. Muestra una tabla con las palabras sospechosas: segundo, lo que se transcribió y lo que probablemente se dijo.\n4. No corrijas nada sin que el usuario confirme. Si confirma, corrige el archivo de palabras y vuelve a generar solo los subtítulos si el script lo permite. Si no, vuelve a correr todo.\n\n## 4. Entregar\n\nDi el nombre del archivo final, cuánto duraba el crudo y cuánto dura el final (mídelo con `ffprobe`, no lo estimes), y qué ajustes se pueden pedir:\n- Más cortes o más aire: cambiar el margen (`0.1sec` corta más, `0.3sec` deja más aire).\n- Subtítulos: color y tamaño.\n- Música: volumen.\n- Transcripción más precisa: modelo medium (más lento).\n\n## Reglas\n\n- No borres ni pises el video crudo. Nunca.\n- No subas el video ni el audio a ningún servicio.\n- Si un comando falla, muestra el error tal cual y propón una sola solución por vez.\n"}, {"archivo": "checklist-grabar-reel-para-autoedicion.md", "que_es": "Checklist para grabar pensando en la edición automática, con el archivo de palabras de marca para que los subtítulos salgan bien escritos.", "contenido": "# Checklist: grabar un reel para que la edición automática salga bien\n\nauto-editor corta donde baja el volumen. Whisper escribe lo que entiende. Si grabas pensando en eso, el reel sale casi listo y corriges menos.\n\n## Antes de grabar\n\n- [ ] Lugar sin ruido de fondo constante (refrigerador, ventilador, aire acondicionado, calle). El ruido parejo hace que auto-editor no encuentre los silencios.\n- [ ] Micrófono cerca de la boca: corbatero o el celular a un brazo de distancia como máximo.\n- [ ] Sin música sonando mientras grabas. La música se suma después, con el script.\n- [ ] Celular en vertical, 1080x1920 si tu cámara lo permite.\n- [ ] Batería y espacio en el celular para grabar de corrido.\n\n## Mientras grabas\n\n- [ ] Si te equivocas, haz una pausa de dos segundos en silencio y repite la frase entera. La pausa le marca el corte a auto-editor.\n- [ ] No digas \"eh, bueno, corten\" en voz alta: eso no es silencio y queda en el video.\n- [ ] Di los nombres propios claros y despacio (tu marca, tu producto, el barrio). Son las palabras que Whisper más confunde.\n- [ ] Deja un segundo de silencio al principio y al final.\n\n## Antes de pedirle la edición a Claude\n\n- [ ] El video crudo y la música en la misma carpeta, con nombres sin espacios ni tildes (crudo-lunes.mp4, musica-suave.mp3).\n- [ ] La música es tuya, libre de derechos o tienes licencia para usarla en redes.\n- [ ] Un archivo palabras-de-mi-marca.md en la carpeta con las palabras que tienen que aparecer bien escritas, una por línea.\n\n## Antes de publicar\n\n- [ ] Mira el reel entero con sonido y una vez sin sonido, leyendo solo los subtítulos.\n- [ ] Revisa que ningún corte se coma el principio de una palabra. Si pasa, pide más margen.\n- [ ] Revisa la música en el celular, no solo en la computadora: en el parlante del celular suena distinta.\n- [ ] Guarda el crudo hasta que el reel esté publicado.\n\n## palabras-de-mi-marca.md (ejemplo para copiar)\n\n```\nPilates Norte\nreformer\nFisherton\nclase de prueba\n```\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

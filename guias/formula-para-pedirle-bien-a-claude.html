<script>var GUIA = {"slug": "formula-para-pedirle-bien-a-claude", "t": "La fórmula para pedirle bien a Claude", "d": "Cuatro piezas que convierten un pedido vago en uno que sale bien a la primera: contexto, tarea, formato y criterios. Con un antes y un después.", "tema": "Primeros pasos", "min": 8, "fichaNombre": "Fórmula de pedido", "ficha": [["Qué es", "Una estructura de cuatro partes para armar cualquier pedido a Claude."], ["Necesitas", "Una cuenta de Claude, gratis o paga."], ["Tiempo", "Un par de minutos extra por pedido. Se recuperan en correcciones que no haces."], ["Qué no hace", "No hace magia: si no sabes qué quieres, Claude tampoco lo va a adivinar."]], "secciones": [{"h": "Por qué los pedidos cortos salen flojos", "p": ["Anthropic, la empresa que hace Claude, lo explica con una imagen simple: trata a Claude como a una persona muy capaz que acaba de entrar a tu negocio y no conoce cómo trabajas. Cuanto más preciso eres, mejor sale.", "Una prueba que proponen en su guía oficial: muéstrale tu pedido a alguien que no sabe nada del tema. Si esa persona se confundiría, Claude también."]}, {"h": "Las cuatro piezas", "lista": ["Contexto: quién eres, para quién es esto y por qué lo necesitas. El porqué ayuda a que Claude entienda la intención y no solo la orden.", "Tarea: qué quieres exactamente, con un verbo claro. \"Escribe\", \"compara\", \"corrige\", no \"¿me ayudas con...?\".", "Formato: cómo lo quieres recibir. Largo, estructura, tono, si va en tabla, en lista o en párrafos.", "Ejemplos y criterios: uno o más ejemplos de lo que te gusta, y la lista de cosas que tiene que cumplir para que lo des por bueno."]}, {"h": "Antes y después", "p": ["Antes: \"Escríbeme un mail para mis clientes sobre los nuevos horarios.\" Claude no sabe qué negocio tienes, a quién le escribes, qué tono usas ni qué cambió.", "Después: el mismo pedido con las cuatro piezas, como el prompt de abajo. La diferencia no es el largo: es que ya no tiene que adivinar."], "prompts": [{"t": "Ejemplo armado con la fórmula", "c": "CONTEXTO\nTengo [TIPO DE NEGOCIO] en [CIUDAD]. Mis clientes son [QUIÉNES SON]. Les escribo con un tono [EJ.: CERCANO Y SIN VUELTAS].\nA partir del [FECHA] cambiamos los horarios: [HORARIO VIEJO] pasa a ser [HORARIO NUEVO]. Lo hacemos porque [MOTIVO].\n\nTAREA\nEscribe el mail que les voy a mandar avisando el cambio.\n\nFORMATO\n- Asunto de menos de 8 palabras.\n- Cuerpo de 4 a 6 líneas.\n- Los horarios nuevos en una lista.\n- Cierra con una línea para que respondan si tienen dudas.\n\nEJEMPLOS Y CRITERIOS\nAsí suelo escribir: [PEGA UN MAIL TUYO ANTERIOR].\nTiene que cumplir: que se entienda en 10 segundos, que no suene a disculpa y que no use palabras en inglés."}]}, {"h": "Plantilla para cualquier pedido", "p": ["Guárdala en tus notas y complétala cada vez. Si una parte no aplica, bórrala: no hace falta llenar todo siempre."], "prompts": [{"t": "Plantilla de la fórmula", "c": "CONTEXTO\n[QUIÉN ERES, PARA QUIÉN ES Y POR QUÉ LO NECESITAS]\n\nTAREA\n[QUÉ QUIERES, CON UN VERBO CLARO]\n\nFORMATO\n[LARGO, ESTRUCTURA, TONO, TABLA O LISTA]\n\nEJEMPLOS Y CRITERIOS\nEjemplo de lo que me gusta: [PEGA UN EJEMPLO]\nTiene que cumplir: [2 A 5 CONDICIONES]\n\nSi te falta algún dato importante para hacerlo bien, pregúntame antes de empezar."}]}, {"h": "Tres ajustes que suman", "lista": ["Di qué hacer, no qué evitar: \"escribe en párrafos corridos\" funciona mejor que \"no uses viñetas\".", "Separa las partes con etiquetas: cuando mezclas instrucciones, textos y ejemplos, marcarlos (por ejemplo con <ejemplo> y <\/ejemplo>) ayuda a que Claude no los confunda.", "Pide acción si quieres acción: \"corrige este texto\" hace los cambios; \"¿qué le cambiarías?\" muchas veces te da solo sugerencias en vez de hacer los cambios."]}], "faq": [{"q": "¿Tengo que escribir todo esto cada vez?", "a": "No. Para cosas rápidas alcanza con tarea y formato. La fórmula completa conviene cuando el resultado te importa o cuando ya te salió mal una vez."}, {"q": "¿Cuántos ejemplos le paso?", "a": "La guía oficial de Anthropic dice que los ejemplos son de las formas más confiables de marcar formato, tono y estructura, y recomienda de 3 a 5: parecidos a tu caso real y distintos entre sí, para que Claude no copie detalles que no querías. Si todavía no tienes tantos, empieza con uno y suma a medida que juntes."}, {"q": "¿Sirve también para ChatGPT o Gemini?", "a": "La lógica de dar contexto, tarea, formato y ejemplos es útil en cualquier asistente. Esta guía se basa en la documentación de Claude."}], "fuentes": ["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"], "ejemplo": {"titulo": "Ejemplo resuelto: una panadería pasa de \"hazme un posteo\" a un pedido que sale a la primera", "negocio": "Ejemplo inventado: una panadería de barrio en Ñuñoa, Santiago de Chile, atendida por un matrimonio y un ayudante. Venden en el local y toman encargos de tortas por Instagram y WhatsApp.", "punto_de_partida": "El dueño le pedía a Claude \"hazme un posteo para las tortas de cumpleaños\" y le salían textos largos, con exclamaciones y precios que él no había dado. Terminaba reescribiéndolos.", "pasos": ["Copió la plantilla 4 del kit (Escribir un posteo) en sus notas del celular.", "Completó el CONTEXTO: panadería de barrio, lo siguen vecinos de la zona, quiere que encarguen tortas con tiempo porque los fines de semana se queda sin lugar en el horno.", "En TAREA dejó \"Escribe el texto del posteo\" y en FORMATO puso la primera línea, 4 líneas de cuerpo y cierre con \"escríbenos por DM con la fecha\".", "En EJEMPLOS Y CRITERIOS pegó, entre <ejemplo> y <\/ejemplo>, tres posteos suyos distintos: uno de pan de masa madre, uno de un feriado y uno de una torta especial. Sumó los criterios: sin precios, sin exclamaciones, y que diga que los encargos se toman con 48 horas de anticipación.", "Mandó el pedido. La primera versión cumplía todo menos el largo del cierre; respondió \"acorta el cierre a una línea\" y quedó.", "Para los pedidos que no sabe cómo armar subió la skill mejorar-mi-pedido del kit. Ahora escribe \"mejora mi pedido: mail a clientes por el aumento de la harina\" y Claude le hace tres preguntas antes de escribir."], "resultado": "El dueño tiene una plantilla de posteo que reutiliza cambiando solo el tema, y los textos ya salen con su tono y sin precios inventados. Para pedidos nuevos, la skill le arma la fórmula y le pregunta lo que falta."}, "si_falla": [{"sintoma": "Le pedí algo corto y me devolvió un texto largo con viñetas.", "solucion": "Haz el FORMATO medible y en positivo: \"4 líneas en un solo párrafo\" en vez de \"corto y sin viñetas\". La guía oficial recomienda decir qué hacer en lugar de qué evitar."}, {"sintoma": "Copia demasiado el ejemplo: repite frases, el mismo largo o el mismo tema.", "solucion": "Pásale ejemplos distintos entre sí (la guía oficial sugiere de 3 a 5, variados) y aclárale \"úsalo para copiar el tono, no el contenido\"."}, {"sintoma": "Me da sugerencias pero no hace los cambios.", "solucion": "Usa un verbo de acción: \"corrige este texto\" o \"haz estos cambios\" en vez de \"¿qué le cambiarías?\" o \"¿puedes sugerir mejoras?\"."}, {"sintoma": "Mezcla el texto que le pegué con mis instrucciones (por ejemplo, responde al mail en vez de resumirlo).", "solucion": "Pon el material entre etiquetas, como <mail> y <\/mail> o <documento> y <\/documento>, y las instrucciones fuera de ellas. La guía oficial recomienda etiquetas cuando el pedido mezcla instrucciones, contexto y ejemplos."}, {"sintoma": "Completa con datos inventados (precios, fechas, nombres) lo que no le di.", "solucion": "Suma a los criterios: \"si te falta un dato, deja [A CONFIRMAR] y avísame al final\", o cierra el pedido con \"si te falta algún dato importante, pregúntame antes de empezar\", como en la plantilla de la guía."}], "kit": [{"archivo": "mejorar-mi-pedido/SKILL.md", "que_es": "Skill que toma un pedido vago, detecta qué pieza de la fórmula falta, te hace hasta 4 preguntas con respuestas sugeridas y te devuelve el pedido armado antes de ejecutarlo. Guárdala en una carpeta mejorar-mi-pedido, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: mejorar-mi-pedido\ndescription: 'Convierte un pedido vago en uno completo (contexto, tarea, formato, ejemplos, criterios) y pregunta lo que falta antes de ejecutar. Úsala con \"mejora mi pedido\" o ante un pedido importante sin datos.'\n---\n\n# Mejorar mi pedido\n\nTomas un pedido corto y lo conviertes en uno que sale bien a la primera, con las cuatro piezas de la fórmula. No ejecutas la tarea hasta que el usuario confirma el pedido armado.\n\n## Paso 1: revisa qué falta\n\nLee el pedido y marca cuál de estas piezas falta o está floja:\n\n1. **Contexto**: quién es el usuario, para quién es el resultado y por qué lo necesita.\n2. **Tarea**: qué hay que hacer, con un verbo claro (escribe, compara, corrige, resume).\n3. **Formato**: largo, estructura, tono, si va en tabla, lista o párrafos.\n4. **Ejemplos y criterios**: un ejemplo de lo que le gusta y las condiciones para darlo por bueno.\n\nSi las instrucciones personales o del Proyecto ya responden alguna pieza, úsalas y no la preguntes.\n\n## Paso 2: pregunta solo lo necesario\n\nHaz como máximo 4 preguntas, todas juntas, numeradas y cortas. Para cada una, ofrece una respuesta sugerida entre paréntesis para que el usuario pueda contestar \"sí\" y seguir. Ejemplo:\n\n1. ¿Para quién es el mail? (sugerencia: clientes que ya te compraron)\n2. ¿Qué largo quieres? (sugerencia: 4 a 6 líneas)\n\nNo preguntes lo que se puede deducir del pedido.\n\n## Paso 3: devuelve el pedido armado\n\nCon las respuestas, escribe el pedido completo en un bloque de código, con este orden y estas etiquetas:\n\n```\nCONTEXTO\n...\n\nTAREA\n...\n\nFORMATO\n...\n\nEJEMPLOS Y CRITERIOS\n<ejemplo>\n...\n<\/ejemplo>\nTiene que cumplir:\n- ...\n```\n\nReglas para armarlo:\n- Escribe las instrucciones en positivo: qué hacer, no qué evitar.\n- Incluye el porqué cuando ayude a entender la intención.\n- Si el usuario pegó textos o datos, ponlos entre etiquetas (por ejemplo <datos> y <\/datos>) para que no se mezclen con las instrucciones.\n- Si no hay ejemplo, deja [PEGA UN EJEMPLO SI TIENES] en vez de inventar uno.\n- Los criterios tienen que poder comprobarse: \"menos de 8 palabras\", no \"que esté bueno\".\n\n## Paso 4: confirma y ejecuta\n\nDebajo del bloque pregunta: \"¿Lo hago así o cambias algo?\". Si el usuario confirma, haz la tarea con ese pedido. Si cambia algo, actualiza el bloque y vuelve a preguntar una sola vez.\n"}, {"archivo": "plantillas-pedidos-con-la-formula.md", "que_es": "Seis pedidos ya armados con contexto, tarea, formato y criterios, para las tareas de todos los días: responder a un cliente, presupuesto, resumen, posteo, corrección y comparación.", "contenido": "# Pedidos armados con la fórmula: seis tareas de todos los días\n\nCada plantilla ya tiene las cuatro piezas. Copia la que necesites, completa los corchetes y borra lo que no aplique.\n\n## 1. Responder a un cliente\n\nCONTEXTO\nTengo [NEGOCIO] en [CIUDAD]. Un cliente me escribió por [CANAL]. Quiero responderle rápido y bien porque [MOTIVO: ES UN CLIENTE NUEVO / ESTÁ MOLESTO / QUIERE COMPRAR].\n<mensaje_del_cliente>\n[PEGA EL MENSAJE]\n<\/mensaje_del_cliente>\n\nTAREA\nEscribe la respuesta.\n\nFORMATO\n- De 2 a 4 líneas, en voseo.\n- Si hace falta un dato que no te di, deja [A CONFIRMAR].\n\nEJEMPLOS Y CRITERIOS\n<ejemplo>\n[PEGA UNA RESPUESTA TUYA QUE TE HAYA GUSTADO]\n<\/ejemplo>\nTiene que cumplir: que responda lo que preguntó en la primera línea y que cierre con un paso concreto.\n\n## 2. Armar un presupuesto\n\nCONTEXTO\nSoy [PROFESIÓN]. El cliente es [QUIÉN] y necesita [QUÉ]. Mis precios son: [LISTA O PEGA TU TARIFARIO].\n\nTAREA\nArma el presupuesto.\n\nFORMATO\n- Tabla con: ítem, descripción en una línea, precio.\n- Debajo: total, qué incluye, qué no incluye, validez de [DÍAS] días y forma de pago.\n\nEJEMPLOS Y CRITERIOS\nTiene que cumplir: usar solo los precios que te pasé y no sumar ítems que no pedí.\n\n## 3. Resumir un documento\n\nCONTEXTO\nTengo que decidir [QUÉ DECISIÓN] y no tengo tiempo de leer todo.\n<documento>\n[PEGA EL TEXTO O ADJUNTA EL ARCHIVO]\n<\/documento>\n\nTAREA\nResume lo que necesito para decidir.\n\nFORMATO\n- 5 puntos como máximo.\n- Al final: qué falta saber y a quién preguntarle.\n\nEJEMPLOS Y CRITERIOS\nTiene que cumplir: citar el número de página o sección de cada dato importante, y no agregar opiniones que no estén en el documento.\n\n## 4. Escribir un posteo\n\nCONTEXTO\nMi cuenta es de [NEGOCIO]. Me siguen [QUIÉNES]. Quiero contar [TEMA] porque [OBJETIVO: QUE CONSULTEN / QUE VENGAN / QUE CONFÍEN].\n\nTAREA\nEscribe el texto del posteo.\n\nFORMATO\n- Primera línea que haga parar a leer.\n- 3 a 5 líneas de cuerpo, en párrafos cortos.\n- Cierre con qué hacer: [ESCRIBIR POR DM / RESERVAR / VENIR].\n\nEJEMPLOS Y CRITERIOS\n<ejemplo>\n[PEGA UN POSTEO TUYO QUE HAYA FUNCIONADO]\n<\/ejemplo>\nTiene que cumplir: sin promesas que no puedo cumplir y sin números que no te di.\n\n## 5. Corregir un texto\n\nCONTEXTO\nEscribe esto para [QUIÉN LO VA A LEER].\n<texto>\n[PEGA EL TEXTO]\n<\/texto>\n\nTAREA\nCorrige el texto: ortografía, claridad y frases largas.\n\nFORMATO\nPrimero el texto corregido completo. Después, en 3 líneas, los cambios más importantes.\n\nEJEMPLOS Y CRITERIOS\nTiene que cumplir: mantener lo que digo y mi forma de hablar; solo cambia lo que sea un error o se entienda mal.\n\n## 6. Comparar opciones\n\nCONTEXTO\nTengo que elegir entre [OPCIÓN A], [OPCIÓN B] y [OPCIÓN C] para [PARA QUÉ]. Lo que más me importa es [CRITERIO PRINCIPAL].\n\nTAREA\nCompara las opciones y recomiéndame una.\n\nFORMATO\n- Tabla con una columna por opción y una fila por criterio: [CRITERIOS].\n- Debajo, la recomendación en 2 líneas y qué la haría cambiar.\n\nEJEMPLOS Y CRITERIOS\nTiene que cumplir: si no sabes un dato de alguna opción, pon \"no sé\" en la tabla en vez de suponerlo.\n"}], "verificada": "2026-11-08", "cat": "primeros-pasos", "parte": "aprende"};</script>

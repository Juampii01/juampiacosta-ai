<script>var GUIA = {"slug": "sistema-ia-para-clinicas-y-centros-de-estetica", "t": "Sistema con Claude para clínicas y centros de estética", "d": "Un sistema para la recepción y el marketing de una clínica o un centro de estética: respuestas, recordatorios y contenido, sin tocar decisiones médicas.", "tema": "Vender IA", "min": 9, "fichaNombre": "Clínicas y estética", "ficha": [["Qué es", "Un asistente para recepción y comunicación: preguntas frecuentes, preparación de turnos, seguimiento y contenido."], ["Necesitás", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No diagnostica, no indica tratamientos y no debería ver historias clínicas."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Preguntas de siempre: precios, cuánto dura una sesión, si duele, qué hay que hacer antes.", "Agenda: confirmar, reprogramar y llenar los huecos que dejan las cancelaciones.", "Indicaciones previas y posteriores: mandar a cada paciente las instrucciones de su tratamiento.", "Seguimiento: escribir a quien hizo una primera sesión y no volvió a sacar turno.", "Contenido: posts y reels explicando tratamientos, todas las semanas.", "Presupuestos de planes de varias sesiones."]}, {"h": "El sistema", "lista": ["Proyecto \"Recepción\": lista de tratamientos con precios y duración, indicaciones aprobadas por el profesional, políticas de cancelación y preguntas frecuentes. Sin datos de pacientes.", "Skill de respuesta a consultas: contesta con la información aprobada y, ante cualquier pregunta de salud, deriva a una consulta con el profesional.", "Skill de indicaciones: arma el mensaje de antes y después de cada tratamiento usando solo los textos que aprobó el profesional.", "Skill de contenido: posts educativos con el tono de la clínica y una revisión de frases que prometen resultados.", "Conectores: Google Calendar para ver huecos de agenda y Gmail para dejar borradores de confirmación.", "Automatización: una tarea programada que el viernes revisa la agenda de la semana siguiente y arma la lista de huecos con un mensaje para ofrecerlos a la lista de espera."], "aviso": "Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Respuesta a consulta con derivación", "c": "Llegó esta consulta: [PEGÁ EL MENSAJE].\nUsá solo la información de tratamientos del Proyecto.\nEscribí una respuesta corta y cálida en voseo.\nReglas:\n1. Si pregunta precio, duración o preparación, respondé con los datos aprobados.\n2. Si pregunta algo de salud (si le sirve, si es seguro con su condición, si tiene contraindicaciones), no respondas eso: decile que lo evalúa el profesional en la consulta y ofrecé un turno.\n3. No prometas resultados ni uses \"garantizado\".\n4. Si falta un dato, marcalo como CONSULTAR."}, {"t": "Indicaciones antes y después", "c": "El paciente tiene turno para [TRATAMIENTO] el [DÍA Y HORA].\nArmá dos mensajes usando solo el texto aprobado de ese tratamiento en el Proyecto:\n1. Recordatorio 48 horas antes, con la preparación y qué traer.\n2. Mensaje para después de la sesión, con los cuidados.\nNo agregues indicaciones que no estén en el texto aprobado. No pongas el nombre ni datos del paciente: yo los completo."}, {"t": "Post educativo sin promesas", "c": "Escribí un post de Instagram sobre [TRATAMIENTO] para [PÚBLICO].\nEstructura: una pregunta que se haga la gente, 3 cosas que conviene saber, para quién no es y una invitación a consultar.\nDespués revisá tu propio texto y marcá cualquier frase que prometa resultados, compare con otros o use fotos de antes y después, para que la revise el profesional."}]}, {"h": "Cómo instalarlo", "pasos": ["Pedí la lista de tratamientos con precios y pedile al profesional que apruebe por escrito las indicaciones de cada uno.", "Armá el Proyecto \"Recepción\" con esos textos y con las políticas. Dejá claro en las instrucciones qué preguntas se derivan siempre.", "Probá la skill de consultas con 20 mensajes reales anonimizados (sin nombres ni datos de salud) y revisá con el profesional cada respuesta.", "Subí las tres skills y conectá Google Calendar y Gmail con la cuenta de la recepción.", "Configurá la tarea programada de huecos de agenda.", "Dejá una hoja de una página para la recepción: qué hace cada skill y qué nunca se le pide."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Ayudo a clínicas y centros de estética a ordenar la recepción con Claude.\nLo que suele pasar es que la recepción contesta las mismas preguntas todo el día y los huecos de agenda se pierden. Armo un asistente que prepara esas respuestas con la información que vos aprobás, manda las indicaciones de cada tratamiento y avisa qué huecos hay para ofrecer.\nNo toca nada médico: lo que es de salud siempre te lo deriva a vos.\n¿Te muestro en 15 minutos cómo respondería tres consultas reales?"}], "lista": ["Argumento central: \"Tu recepción gana tiempo para atender bien a quien está en el local, y vos no perdés control sobre lo que se dice de tus tratamientos.\"", "Lo que más tranquiliza: mostrar cómo deriva una pregunta de salud en vez de responderla."]}, {"h": "Cuidados del rubro", "lista": ["Datos de salud: son datos especialmente sensibles en la mayoría de los países. No subas historias clínicas, diagnósticos ni fotos de pacientes al Proyecto.", "Publicidad sanitaria: muchos países tienen reglas sobre promesas, testimonios y fotos de antes y después. Que el dueño las consulte con quien corresponda.", "Revisión humana: ninguna respuesta sobre un tratamiento sale sin que alguien de la clínica la lea."], "aviso": "Claude no reemplaza al profesional de la salud. No diagnostica ni indica tratamientos. Cuidá los datos personales y de salud según las leyes de cada país; ante la duda, consultalo con un abogado del rubro."}], "faq": [{"q": "¿Puedo cargar la base de pacientes para personalizar mensajes?", "a": "No te lo recomiendo. El sistema funciona sin datos de pacientes: Claude arma el texto y la recepción completa nombre y horario."}, {"q": "¿Sirve igual para un consultorio chico?", "a": "Sí. Con el Proyecto y la skill de consultas ya alcanza para empezar. Lo demás se suma cuando lo pidan."}, {"q": "¿Y si quieren que responda solo por WhatsApp?", "a": "Es otro nivel de riesgo, sobre todo en salud. Si lo encaran, mirá la guía \"Agente de WhatsApp que atiende y agenda turnos\" y dejá reglas de derivación muy claras."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"]};</script>

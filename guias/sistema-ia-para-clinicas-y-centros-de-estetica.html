<script>var GUIA = {"slug": "sistema-ia-para-clinicas-y-centros-de-estetica", "t": "Sistema con Claude para clínicas y centros de estética", "d": "Un sistema para la recepción y el marketing de una clínica o un centro de estética: respuestas, recordatorios y contenido, sin tocar decisiones médicas.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Clínicas y estética", "ficha": [["Qué es", "Un asistente para recepción y comunicación: preguntas frecuentes, preparación de turnos, seguimiento y contenido."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No diagnostica, no indica tratamientos y no debería ver historias clínicas."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Preguntas de siempre: precios, cuánto dura una sesión, si duele, qué hay que hacer antes.", "Agenda: confirmar, reprogramar y llenar los huecos que dejan las cancelaciones.", "Indicaciones previas y posteriores: mandar a cada paciente las instrucciones de su tratamiento.", "Seguimiento: escribir a quien hizo una primera sesión y no volvió a sacar turno.", "Contenido: posts y reels explicando tratamientos, todas las semanas.", "Presupuestos de planes de varias sesiones."]}, {"h": "El sistema", "lista": ["Proyecto \"Recepción\": lista de tratamientos con precios y duración, indicaciones aprobadas por el profesional, políticas de cancelación y preguntas frecuentes. Sin datos de pacientes.", "Skill de respuesta a consultas: contesta con la información aprobada y, ante cualquier pregunta de salud, deriva a una consulta con el profesional.", "Skill de indicaciones: arma el mensaje de antes y después de cada tratamiento usando solo los textos que aprobó el profesional.", "Skill de contenido: posts educativos con el tono de la clínica y una revisión de frases que prometen resultados.", "Conectores: Google Calendar para ver huecos de agenda y Gmail para dejar borradores de confirmación.", "Automatización: una tarea programada que el viernes revisa la agenda de la semana siguiente y arma la lista de huecos con un mensaje para ofrecerlos a la lista de espera."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Respuesta a consulta con derivación", "c": "Llegó esta consulta: [PEGA EL MENSAJE].\nUsa solo la información de tratamientos del Proyecto.\nEscribe una respuesta corta y cálida en voseo.\nReglas:\n1. Si pregunta precio, duración o preparación, responde con los datos aprobados.\n2. Si pregunta algo de salud (si le sirve, si es seguro con su condición, si tiene contraindicaciones), no respondas eso: dile que lo evalúa el profesional en la consulta y ofrece un turno.\n3. No prometas resultados ni uses \"garantizado\".\n4. Si falta un dato, márcalo como CONSULTAR."}, {"t": "Indicaciones antes y después", "c": "El paciente tiene turno para [TRATAMIENTO] el [DÍA Y HORA].\nArma dos mensajes usando solo el texto aprobado de ese tratamiento en el Proyecto:\n1. Recordatorio 48 horas antes, con la preparación y qué traer.\n2. Mensaje para después de la sesión, con los cuidados.\nNo agregues indicaciones que no estén en el texto aprobado. No pongas el nombre ni datos del paciente: yo los completo."}, {"t": "Post educativo sin promesas", "c": "Escribe un post de Instagram sobre [TRATAMIENTO] para [PÚBLICO].\nEstructura: una pregunta que se haga la gente, 3 cosas que conviene saber, para quién no es y una invitación a consultar.\nDespués revisa tu propio texto y marca cualquier frase que prometa resultados, compare con otros o use fotos de antes y después, para que la revise el profesional."}]}, {"h": "Cómo instalarlo", "pasos": ["Pide la lista de tratamientos con precios y pídele al profesional que apruebe por escrito las indicaciones de cada uno.", "Arma el Proyecto \"Recepción\" con esos textos y con las políticas. Deja claro en las instrucciones qué preguntas se derivan siempre.", "Prueba la skill de consultas con 20 mensajes reales anonimizados (sin nombres ni datos de salud) y revisa con el profesional cada respuesta.", "Convierte cada prompt en skill: una carpeta con su SKILL.md, comprimida en ZIP. Súbelas en Customize → Skills, con el botón +, después + Create skill y Upload a skill. Después conecta Google Calendar y Gmail con la cuenta de la recepción desde Customize → Connectors.", "Configura la tarea programada de huecos de agenda: en Cowork, Scheduled y New task, con frecuencia semanal (weekly) para el viernes. Escribe en el prompt qué calendarios mirar y que no envíe ni modifique nada, porque la tarea corre sola. Revisa las primeras corridas en la página Scheduled.", "Deja una hoja de una página para la recepción: qué hace cada skill y qué nunca se le pide."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Ayudo a clínicas y centros de estética a ordenar la recepción con Claude.\nLo que suele pasar es que la recepción contesta las mismas preguntas todo el día y los huecos de agenda se pierden. Armo un asistente que prepara esas respuestas con la información que tú apruebas, manda las indicaciones de cada tratamiento y avisa qué huecos hay para ofrecer.\nNo toca nada médico: lo que es de salud siempre te lo deriva a ti.\n¿Te muestro en 15 minutos cómo respondería tres consultas reales?"}], "lista": ["Argumento central: \"Tu recepción gana tiempo para atender bien a quien está en el local, y tú no pierdes control sobre lo que se dice de tus tratamientos.\"", "Lo que más tranquiliza: mostrar cómo deriva una pregunta de salud en vez de responderla."]}, {"h": "Cuidados del rubro", "lista": ["Datos de salud: son datos especialmente sensibles en la mayoría de los países. No subas historias clínicas, diagnósticos ni fotos de pacientes al Proyecto.", "Publicidad sanitaria: muchos países tienen reglas sobre promesas, testimonios y fotos de antes y después. Que el dueño las consulte con quien corresponda.", "Revisión humana: ninguna respuesta sobre un tratamiento sale sin que alguien de la clínica la lea."], "aviso": "Claude no reemplaza al profesional de la salud. No diagnostica ni indica tratamientos. Cuida los datos personales y de salud según las leyes de cada país; ante la duda, consúltalo con un abogado del rubro."}], "faq": [{"q": "¿Puedo cargar la base de pacientes para personalizar mensajes?", "a": "No te lo recomiendo. El sistema funciona sin datos de pacientes: Claude arma el texto y la recepción completa nombre y horario."}, {"q": "¿Sirve igual para un consultorio chico?", "a": "Sí. Con el Proyecto y la skill de consultas ya alcanza para empezar. Lo demás se suma cuando lo pidan."}, {"q": "¿Y si quieren que responda solo por WhatsApp?", "a": "Es otro nivel de riesgo, sobre todo en salud. Si lo encaran, mira la guía \"Agente de WhatsApp que atiende y agenda turnos\" y deja reglas de derivación muy claras."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/12512198-how-to-create-custom-skills", "https://support.claude.com/en/articles/9519177"], "ejemplo": {"titulo": "Ejemplo resuelto: la recepción ordenada en un centro de estética", "negocio": "Ejemplo inventado: un centro de estética en barrio Pichincha, Rosario. Trabajan dos cosmetólogas, una médica dermatóloga que atiende dos días por semana y una recepcionista. Las consultas entran por Instagram y WhatsApp, y la agenda está en Google Calendar con un calendario por cabina.", "punto_de_partida": "La recepcionista contesta a mano las mismas preguntas todo el día y a veces responde cosas de salud para no hacer esperar. Las cancelaciones dejan huecos que nadie ofrece a tiempo.", "pasos": ["En la demo, la persona que lo instaló pegó tres consultas anonimizadas: el precio de una limpieza facial, si la depilación láser sirve para alguien con una condición hormonal y un pedido para reprogramar. La primera y la tercera salieron respondidas con los datos del centro. La segunda salió derivada a una consulta de evaluación, y eso fue lo que convenció a la médica.", "Le dio a la médica la ficha de tratamiento aprobado del kit. Ella completó una por tratamiento, con preparación, cuidados y qué preguntas se derivan siempre, y las firmó con fecha.", "En Settings → Capabilities prendió Code execution and file creation. Creó el Proyecto privado \"Recepción\", pegó las instrucciones del kit completando los corchetes y subió las fichas, las políticas de cancelación y las preguntas frecuentes. No subió nada de pacientes.", "Probó el prompt de consultas con 20 mensajes reales anonimizados, sin nombres ni datos de salud. La médica marcó cada respuesta como correcta o a corregir. Sumaron a la lista de derivación dos temas que habían salido mal: medicación y tatuajes recientes.", "Armó la skill consulta-con-derivacion del kit y las de indicaciones y contenido a partir de los otros prompts. Comprimió cada carpeta en ZIP y las subió en Customize → Skills.", "Conectó Google Calendar y Gmail desde Customize → Connectors con la cuenta de la recepción, no con la personal de la médica. Probó en un chat: \"mira los calendarios de las dos cabinas la semana que viene y lista huecos de 60 minutos o más\".", "Creó la tarea programada del kit en Cowork, semanal los viernes, pidiendo aprobación antes de actuar. La tarea deja la tabla de huecos y un mensaje genérico. La recepcionista lo manda desde WhatsApp a la lista de espera, que sigue en su planilla y no pasa por Claude.", "Cerró con una hoja de una página para la recepción: qué hace cada skill, qué hacer con una consulta marcada DE SALUD o URGENTE y qué nunca se pega en un chat."], "resultado": "Quedó un Proyecto con los tratamientos aprobados por la médica, tres skills para consultas, indicaciones y contenido, y una tarea que cada viernes deja los huecos de la semana siguiente con un mensaje listo. Las preguntas de salud siempre terminan en un turno con el profesional y ningún dato de pacientes entra a Claude."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner de la organización: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al subir la skill aparece un error de formato, de archivo faltante o de caracteres inválidos.", "solucion": "Revisa cuatro cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos en la raíz del ZIP), que la carpeta se llame igual que el name del SKILL.md, que adentro esté el archivo SKILL.md y que la description no pase de 200 caracteres. Evita tildes y signos raros en el name."}, {"sintoma": "Claude contestó una pregunta de salud (\"en general no hay problema...\") en vez de derivarla.", "solucion": "Suma esa pregunta, con sus palabras, a la lista de temas que se derivan en la skill y en la ficha del tratamiento. Abre un chat nuevo dentro del Proyecto y vuelve a probar con el mismo mensaje hasta que salga derivado. Mantén la regla de que ninguna respuesta sale sin que la lea alguien de la clínica."}, {"sintoma": "La tarea programada no encuentra los calendarios o lista como libres horarios que estaban bloqueados.", "solucion": "La tarea usa los conectores configurados en Cowork: confirma que Google Calendar esté conectado ahí con la cuenta de la recepción y que esa cuenta tenga acceso a los calendarios de cada cabina. Escribe en el prompt el nombre exacto de cada calendario y carga almuerzos y bloqueos como eventos. Corre la tarea a mano antes de dejarla semanal."}, {"sintoma": "Al conectar Gmail, Calendar o Drive aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "El negocio usa Google Workspace y el administrador tiene que marcar a Claude como app de confianza (Trusted) en la consola de Google, en Manage third-party app access. Después de guardar, espera unos 15 minutos y vuelve a probar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores en Organization settings → Connectors."}], "kit": [{"archivo": "consulta-con-derivacion/SKILL.md", "que_es": "Skill que clasifica cada consulta (operativa, de salud, mixta o urgente), responde solo con la información aprobada y deriva al profesional todo lo de salud. Guárdala en una carpeta consulta-con-derivacion, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: consulta-con-derivacion\ndescription: Prepara respuestas a consultas de pacientes con la información aprobada de la clínica y deriva al profesional toda pregunta de salud. Úsala cuando peguen un mensaje de un paciente.\n---\n\n# Consulta con derivación\n\nPreparas el borrador de respuesta a una consulta que llegó a la recepción. Nunca lo envías tú: lo revisa y lo manda una persona de la clínica.\n\n## De dónde sacas los datos\n\nSolo de los archivos del Proyecto: la lista de tratamientos aprobados (precio, duración, cantidad de sesiones, preparación, cuidados), las políticas de turnos y cancelación y las preguntas frecuentes. Si un dato no está ahí, no lo completes con lo que se sabe en general del tratamiento.\n\n## Paso 1: clasifica la consulta\n\nAntes de escribir, decide a qué tipo pertenece cada pregunta del mensaje:\n\n- **Operativa**: precio, duración, cuántas sesiones, horarios, cómo reservar, reprogramar o cancelar, qué traer, formas de pago.\n- **De salud**: si el tratamiento le sirve, si es seguro para su caso, contraindicaciones, embarazo o lactancia, medicación, alergias, enfermedades o problemas de piel, cirugías recientes, dolor o reacciones después de una sesión, resultados esperables para su caso.\n- **Urgencia**: dolor fuerte, sangrado, hinchazón que aumenta, fiebre, ampollas, dificultad para respirar o cualquier reacción que el paciente describa como grave después de un tratamiento.\n\nSi un mensaje mezcla tipos, responde lo operativo y deriva lo de salud en el mismo mensaje.\n\n## Paso 2: responde según el tipo\n\n- **Operativa**: responde con los datos aprobados, en 3 a 6 líneas, en voseo y con calidez. Si corresponde, ofrece un turno.\n- **De salud**: no respondas el fondo de la pregunta, ni con un \"en general\". Di que eso lo evalúa el profesional en la consulta y ofrece un turno de evaluación.\n- **Urgencia**: no des indicaciones. Escribe un mensaje corto que pida que se comunique ya con [TELÉFONO DE GUARDIA DE LA CLÍNICA] o que vaya a una guardia médica, y marca el borrador como URGENTE para la recepción.\n\n## Reglas\n\n- No prometas resultados. No uses \"garantizado\", \"sin dolor\", \"definitivo\", \"para siempre\" ni comparaciones con otros centros.\n- No inventes precios, promociones ni cantidad de sesiones. Si falta un dato, escribe CONSULTAR en su lugar.\n- No pidas datos de salud por mensaje. Si el paciente los manda, no los repitas en la respuesta.\n- No pongas nombres de profesionales ni horarios concretos que no te hayan pasado.\n\n## Qué entregas\n\n1. Una línea con la clasificación: OPERATIVA, DE SALUD, MIXTA o URGENTE.\n2. El borrador de respuesta, listo para copiar.\n3. Si hubo algo de salud o un CONSULTAR, una línea para la recepción: qué tiene que confirmar o a quién pasárselo.\n"}, {"archivo": "proyecto-recepcion-clinica-fichas-de-tratamiento.md", "que_es": "Las instrucciones para pegar en el Proyecto \"Recepción\", la ficha de tratamiento que completa y firma el profesional, y la lista de lo que nunca entra a Claude.", "contenido": "# Proyecto \"Recepción\": instrucciones y ficha de tratamientos aprobados\n\nEste archivo tiene tres partes: el texto para pegar en las instrucciones del Proyecto, la ficha que completa el profesional por cada tratamiento y la lista de lo que nunca entra al Proyecto.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de recepción de [NOMBRE DE LA CLÍNICA O CENTRO], en [CIUDAD]. Ayudas a la recepción a preparar respuestas, recordatorios, indicaciones y contenido.\n\nReglas que no se rompen:\n1. Usa solo la información de los archivos de este Proyecto. Si algo no está, escribe CONSULTAR.\n2. Todo lo que escribes es un borrador. Lo revisa y lo manda una persona de la clínica.\n3. Toda pregunta de salud se deriva al profesional: si le sirve, si es seguro para su caso, contraindicaciones, embarazo, medicación, alergias, enfermedades, reacciones. No respondas el fondo, ni en general.\n4. Si alguien describe una reacción grave después de un tratamiento, el mensaje es: comunicarse ya con [TELÉFONO DE GUARDIA] o ir a una guardia médica.\n5. Las indicaciones de antes y después se copian tal cual de la ficha aprobada. No agregues ni resumas cuidados.\n6. No prometas resultados ni uses \"garantizado\", \"sin dolor\" o \"definitivo\". Nada de comparaciones con otros centros.\n7. No escribas nombres ni datos de pacientes. La recepción los completa fuera de Claude.\n8. Tono: [EJEMPLO: cálido, con voseo, frases cortas, sin signos de exclamación]. Firma como [NOMBRE] de [CLÍNICA].\n\n## 2. Ficha de tratamiento aprobado (una por tratamiento)\n\nCopia este bloque por cada tratamiento y que el profesional lo complete y lo firme. Sube todas las fichas al Proyecto en un solo documento.\n\n---\nTratamiento: [NOMBRE COMO LO VE EL PACIENTE]\nLo realiza: [COSMETÓLOGA / MÉDICO / OTRO PROFESIONAL]\nPrecio: [PRECIO Y MONEDA] (actualizado el [AAAA-MM-DD])\nDuración de la sesión: [MINUTOS]\nSesiones habituales: [TEXTO QUE APRUEBA EL PROFESIONAL, SIN PROMETER RESULTADOS]\nRequiere consulta previa de evaluación: [SÍ / NO]\nPreparación (para el mensaje de 48 horas antes): [TEXTO APROBADO, TAL CUAL]\nQué traer: [TEXTO APROBADO]\nCuidados después de la sesión: [TEXTO APROBADO, TAL CUAL]\nCuándo consultar después de la sesión: [TEXTO APROBADO: QUÉ SÍNTOMAS Y A QUÉ TELÉFONO]\nPreguntas que siempre se derivan para este tratamiento: [LISTA]\nAprobado por: [NOMBRE Y MATRÍCULA DEL PROFESIONAL] el [AAAA-MM-DD]\n---\n\n## 3. Políticas para subir al Proyecto\n\n- Cómo se reserva y por qué canal.\n- Política de cancelación y reprogramación (con cuánta anticipación, qué pasa con la seña).\n- Formas de pago.\n- Horarios de atención y de cada profesional.\n- Preguntas frecuentes con sus respuestas aprobadas.\n\n## 4. Lo que nunca entra al Proyecto ni a los chats\n\n- Historias clínicas, diagnósticos, estudios o recetas.\n- Fotos de pacientes, incluidas las de antes y después.\n- Nombres, teléfonos o documentos de pacientes.\n- La lista de espera con datos de contacto: vive en el sistema o la planilla de la recepción, fuera de Claude.\n\n## 5. Antes de dar por terminado el Proyecto\n\n- [ ] Cada tratamiento tiene su ficha firmada y con fecha.\n- [ ] El profesional revisó 20 respuestas de prueba hechas con mensajes anonimizados.\n- [ ] La recepción sabe a quién pasarle una consulta marcada DE SALUD o URGENTE.\n- [ ] Quedó anotado quién actualiza precios y fichas, y cada cuánto: [NOMBRE].\n"}, {"archivo": "tarea-programada-huecos-de-agenda-clinica.md", "que_es": "La tarea programada de los viernes lista para pegar: checklist previa, configuración sugerida en Cowork y el prompt que lista huecos y arma el mensaje para la lista de espera sin datos de pacientes.", "contenido": "# Tarea programada: huecos de agenda de la semana siguiente\n\nLa tarea mira la agenda, lista los huecos y deja un mensaje genérico para ofrecerlos a la lista de espera. No envía nada y no usa datos de pacientes.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es de la clínica y tiene un plan pago (las tareas programadas están solo en planes pagos).\n- [ ] Google Calendar está conectado con la cuenta de la recepción y, en un chat, Claude ve los calendarios de cada profesional o cabina.\n- [ ] En la agenda, los bloqueos (almuerzo, capacitación, vacaciones) están cargados como eventos. Si no, la tarea los va a ver como huecos.\n- [ ] Probaste el prompt de abajo a mano en un chat y la lista sale bien.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral y New task. Puedes elegir \"Create with Claude\" y pegarle este archivo, o \"Set up manually\" y completar nombre, prompt, modo de aprobación y frecuencia. Si en tu cuenta tienes la experiencia nueva de Claude, también puedes pedirla en una conversación y confirmar con \"Schedule\".\n\nConfiguración sugerida:\n- Nombre: Huecos de la semana siguiente\n- Frecuencia: semanal (weekly), el viernes a media mañana.\n- Aprobación: elige el modo que pide permiso antes de actuar. Las primeras semanas, revisa cada corrida en la página Scheduled.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de recepción de [NOMBRE DE LA CLÍNICA].\n\n1. Mira en Google Calendar los calendarios [NOMBRES DE LOS CALENDARIOS DE CADA PROFESIONAL O CABINA] de lunes a sábado de la semana que viene.\n2. El horario de atención es [DÍAS Y FRANJAS]. Fuera de ese horario no hay huecos.\n3. Lista los huecos libres de [N] minutos o más, por día y por profesional o cabina. Al lado de cada hueco, pon qué tratamientos de la lista aprobada entran en ese tiempo según su duración: [PEGA LA LISTA DE TRATAMIENTOS CON SU DURACIÓN O DI EN QUÉ ARCHIVO DE DRIVE ESTÁ].\n4. Escribe un mensaje corto, en voseo, para ofrecer esos huecos a la lista de espera. Sin nombres, sin precios que no estén en la lista y sin prometer resultados. Que termine pidiendo que respondan con el día que prefieren.\n\nReglas:\n- No crees, muevas ni borres eventos del calendario.\n- No envíes mails ni mensajes.\n- No incluyas nombres ni datos de pacientes que aparezcan en los eventos.\n\nAl final déjame dos partes: \"Huecos de la semana\" (tabla con día, horario, profesional o cabina y tratamientos que entran) y \"Mensaje para la lista de espera\" (listo para copiar).\n\n## Después de cada corrida\n\n- [ ] La recepción revisa que los huecos sean reales (a veces hay turnos tomados que no se cargaron).\n- [ ] Copia el mensaje y lo manda desde el canal de siempre a la lista de espera, que vive fuera de Claude.\n- [ ] Si un hueco se llena, se carga el turno en el calendario el mismo día.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

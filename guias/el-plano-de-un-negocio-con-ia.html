ales que te hacen los clientes.", "Reaprovechar contenido: de un video largo, sacar posts, mails y textos cortos.", "Leer comentarios y reseñas: juntar lo que repite la gente para saber qué mejorar o qué contar.", "Queda en manos humanas: tu opinión, tu voz y lo que se publica."]}, {"h": "Administración", "lista": ["Ordenar comprobantes: pasar datos de facturas o recibos a una planilla para revisar.", "Reportes: subir la planilla de ventas del mes y pedir un resumen con lo que cambió.", "Recordatorios de cobro: borradores amables para pagos atrasados.", "Queda en manos humanas: pagar, cobrar, temas impositivos y cualquier número que vaya a un contador. La IA se puede equivocar con números: siempre revisá."]}, {"h": "Operaciones", "lista": ["Escribir procedimientos: le contás cómo hacés algo y te lo devuelve como paso a paso para tu equipo.", "Checklists: de apertura, de entrega, de control de calidad.", "Avisos automáticos: por ejemplo, que una automatización te avise cuando algo en una planilla cruza un límite que vos definiste.", "Queda en manos humanas: decisiones sobre proveedores, personal y todo lo que no tiene vuelta atrás."], "prompts": [{"t": "Tu plano personalizado", "c": "Tengo un negocio de [RUBRO]. Las áreas que tengo son: [ÁREAS]. Usamos estas herramientas: [EJ.: GMAIL, WHATSAPP, GOOGLE SHEETS, SISTEMA DE TURNOS].\nArmame una tabla con:\n1. Área.\n2. Tres tareas de esa área que se podrían apoyar con IA.\n3. Nivel: 1 (copiar y pegar en el chat), 2 (Claude con archivos o apps conectadas) o 3 (automatización que corre sola).\n4. Qué parte tiene que seguir revisando una persona.\nNo propongas nada que dependa de herramientas que no uso sin aclararlo. Si no sabés si algo se puede conectar, decilo."}]}], "faq": [{"q": "¿Por qué área empiezo?", "a": "Por la que tenga la tarea con mejor puntaje en el filtro de las 5 preguntas. Suele ser atención o administración, porque tienen mucho trabajo repetido."}, {"q": "¿Necesito programar para el nivel 3?", "a": "No ne

<script>var GUIA = {"slug": "el-plano-de-un-negocio-con-ia", "t": "El plano de un negocio con IA, área por área", "d": "Atención, ventas, marketing, administración y operaciones: qué puede hacer la IA hoy en cada una y qué tiene que seguir en manos de una persona.", "tema": "IA en tu negocio", "min": 10, "fichaNombre": "Plano por áreas", "ficha": [["Qué es", "Un mapa de tareas que hoy se pueden apoyar con IA, ordenado por área del negocio."], ["Necesitas", "Claude y, para conectar sistemas, una herramienta de automatización (Make, Zapier o n8n). En el nivel 3, esas herramientas usan Claude por la API, con una clave que se saca en la Console de Anthropic y se paga aparte del plan."], ["Regla de oro", "La IA prepara; una persona decide lo que tiene consecuencias."]], "secciones": [{"h": "Cómo leer este plano", "p": ["En cada área vas a ver tres niveles. Nivel 1: lo haces tú en el chat de Claude, copiando y pegando. Nivel 2: Claude trabaja con tus archivos o tus apps conectadas. Nivel 3: una automatización corre sola, con Claude como una pieza más.", "No hace falta llegar al nivel 3 en todo. Muchas tareas rinden perfecto en el nivel 1."]}, {"h": "Atención al cliente", "lista": ["Respuestas a preguntas frecuentes: con un Proyecto de Claude que tenga tus políticas y precios, tu equipo saca borradores en segundos.", "Clasificar consultas: separar reclamos, pedidos de presupuesto y dudas simples, para que cada una vaya a quien corresponde.", "Resumir conversaciones largas: antes de responder un reclamo, tener en tres líneas qué pasó.", "Queda en manos humanas: reclamos con dinero de por medio, excepciones a las políticas y clientes enojados."]}, {"h": "Ventas", "lista": ["Calificar contactos nuevos: con las respuestas de un formulario, ordenar quién está listo para comprar y quién recién mira.", "Seguimientos: borradores de mensajes para quien pidió presupuesto y no contestó.", "Propuestas: un primer borrador con tu estructura, tus servicios y los datos del cliente.", "Queda en manos humanas: la llamada, la negociación y el precio final."]}, {"h": "Marketing", "lista": ["Ideas y guiones: a partir de las preguntas reales que te hacen los clientes.", "Reaprovechar contenido: de un video largo, sacar posts, mails y textos cortos.", "Leer comentarios y reseñas: juntar lo que repite la gente para saber qué mejorar o qué contar.", "Queda en manos humanas: tu opinión, tu voz y lo que se publica."]}, {"h": "Administración", "lista": ["Ordenar comprobantes: pasar datos de facturas o recibos a una planilla para revisar.", "Reportes: subir la planilla de ventas del mes y pedir un resumen con lo que cambió.", "Recordatorios de cobro: borradores amables para pagos atrasados.", "Queda en manos humanas: pagar, cobrar, temas impositivos y cualquier número que vaya a un contador. La IA se puede equivocar con números: siempre revisa."]}, {"h": "Operaciones", "lista": ["Escribir procedimientos: le cuentas cómo haces algo y te lo devuelve como paso a paso para tu equipo.", "Checklists: de apertura, de entrega, de control de calidad.", "Avisos automáticos: por ejemplo, que una automatización te avise cuando algo en una planilla cruza un límite que tú definiste.", "Queda en manos humanas: decisiones sobre proveedores, personal y todo lo que no tiene vuelta atrás."], "prompts": [{"t": "Tu plano personalizado", "c": "Tengo un negocio de [RUBRO]. Las áreas que tengo son: [ÁREAS]. Usamos estas herramientas: [EJ.: GMAIL, WHATSAPP, GOOGLE SHEETS, SISTEMA DE TURNOS].\nÁrmame una tabla con:\n1. Área.\n2. Tres tareas de esa área que se podrían apoyar con IA.\n3. Nivel: 1 (copiar y pegar en el chat), 2 (Claude con archivos o apps conectadas) o 3 (automatización que corre sola).\n4. Qué parte tiene que seguir revisando una persona.\nNo propongas nada que dependa de herramientas que no uso sin aclararlo. Si no sabes si algo se puede conectar, dilo."}]}], "faq": [{"q": "¿Por qué área empiezo?", "a": "Por la que tenga la tarea con mejor puntaje en el filtro de las 5 preguntas. Suele ser atención o administración, porque tienen mucho trabajo repetido."}, {"q": "¿Necesito programar para el nivel 3?", "a": "No necesariamente. Make, Zapier y n8n se arman con bloques visuales. Para que Claude sea uno de esos bloques, cargas una clave de la API de Claude, y ese uso se paga aparte de tu plan. Igual vas a necesitar paciencia para probar y ajustar."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://docs.n8n.io/integrations/builtin/app-nodes/n8n-nodes-langchain.anthropic/", "https://www.make.com/en/integrations/anthropic-claude", "https://help.zapier.com/hc/en-us/articles/15790125155853-How-to-get-started-with-Anthropic-Claude-on-Zapier", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/9876003"], "ejemplo": {"titulo": "Ejemplo resuelto: el plano de una ferretería", "negocio": "Ejemplo inventado: una ferretería de barrio en Godoy Cruz, Mendoza, con el dueño, su hija (que maneja administración y redes) y dos vendedores de mostrador. Venden en el local, toman pedidos por WhatsApp y hacen presupuestos para obras chicas.", "punto_de_partida": "El dueño quería \"meter IA\" pero cada idea que veía (un chatbot, un agente que cobre solo) le daba miedo o no sabía por dónde empezar. Usaban Gmail, WhatsApp Business y una planilla de Google Sheets para cuentas corrientes.", "pasos": ["La hija pegó el prompt Tu plano personalizado de la guía con el rubro, las cinco áreas y las herramientas que usan. Claude devolvió la tabla y aclaró que no sabía si su sistema de facturación se podía conectar.", "Pasaron la tabla al plano del kit y completaron juntos la línea roja de cada área. El dueño escribió: precios especiales, fiado nuevo y pedidos a proveedores los decide él.", "Marcaron el nivel de hoy de cada tarea. Casi todo estaba en 0 (a mano). Decidieron no apuntar al nivel 3 en nada por ahora.", "En atención eligieron clasificar los pedidos de WhatsApp en nivel 1: la hija pega los mensajes del día en el chat con el prompt de clasificación del pack, y cada pedido queda asignado a un vendedor o al dueño.", "En administración probaron el recordatorio de pago atrasado del pack con las cuentas corrientes vencidas. El dueño revisó cada mensaje antes de que salga y cambió el tono de dos.", "En ventas, la hija subió a Claude una propuesta de obra que les gustaba y la lista de precios, y probó el prompt de primer borrador de propuesta. Lo que no estaba en la lista quedó marcado [COTIZAR], como pide el prompt.", "Para cuentas corrientes anotaron un nivel 2 a futuro: conectar Google Drive para que Claude lea la planilla sin pegarla. Repasaron la checklist de \"antes de subir de nivel\" y vieron que primero tenían que limpiar la planilla.", "Cerraron con la decisión del plano: arrancar por la clasificación de pedidos, con la hija como responsable y una fecha de revisión en un mes."], "resultado": "Quedó un plano de una página con las tareas por área, el nivel de cada una y la línea roja escrita por el dueño. Hay dos tareas funcionando en nivel 1 con prompts guardados, una candidata a nivel 2 con su trabajo previo identificado, y ninguna automatización corriendo sola hasta que lo anterior funcione."}, "si_falla": [{"sintoma": "Claude te propone conectar una herramienta que no aparece en ningún lado o una integración que no existe.", "solucion": "Antes de planificar, búscala en Customize → Connectors (el botón + al lado de Connectors abre el directorio) o en la lista de apps de Make, Zapier o n8n. Si no está, márcala en el plano como \"no se conecta\" y bájala al nivel 1. El prompt de la guía ya le pide a Claude que avise cuando no sabe; si lo recortaste, vuelve a ponerlo."}, {"sintoma": "En Make, Zapier o n8n la conexión con Claude falla con un error de autenticación o de saldo, aunque pagas un plan de Claude.", "solucion": "El plan de claude.ai no incluye la API. Crea una clave en la Console de Anthropic, carga crédito ahí y pega esa clave en la credencial de la herramienta. Si el error es de autenticación, revisa que la clave esté completa y no tenga espacios."}, {"sintoma": "En una cuenta Team o Enterprise no aparece el conector que quieres usar en el nivel 2.", "solucion": "Primero lo tiene que agregar un Owner o Primary Owner en Organization settings → Connectors (Browse connectors, después Add to your team). Habilitarlo no da acceso automático: después cada persona se autentica con su propia cuenta."}, {"sintoma": "El resumen de ventas del mes trae números que no cierran con tu planilla.", "solucion": "Pídele que primero te diga qué columnas leyó y cuántas filas encontró, y que muestre cómo calculó cada número. Si tienes prendida la opción de crear y editar archivos, pídele que haga las cuentas con código sobre la planilla. Y como dice la guía: ningún número va al contador sin que lo revise una persona."}, {"sintoma": "Armaste una automatización de nivel 3 y empezó a mandar cosas que nadie revisó.", "solucion": "Apágala y vuelve a armarla para que deje borradores o pida aprobación en todo lo que sale hacia afuera. Antes de prenderla de nuevo, pasa por la checklist del kit: una persona responsable, qué hace cuando algo no cuadra y cómo se apaga."}], "kit": [{"archivo": "plano-por-areas-para-completar.md", "que_es": "La plantilla del plano para completar con tu equipo: tabla por área con nivel actual y objetivo, la línea roja de cada área, la checklist para subir de nivel y la decisión final.", "contenido": "# Plano de [NOMBRE DEL NEGOCIO] con IA\n\nComplétalo en una hora con quien conozca cada área. Una fila por tarea. Al final, elige una sola tarea para arrancar.\n\nDatos del negocio\n- Rubro: [RUBRO]\n- Ciudad: [CIUDAD]\n- Personas: [CANTIDAD]\n- Herramientas que ya usamos: [EJ.: GMAIL, WHATSAPP BUSINESS, GOOGLE SHEETS, SISTEMA DE FACTURACIÓN, SISTEMA DE TURNOS]\n- Plan de Claude: [FREE / PRO / MAX / TEAM / ENTERPRISE]\n\nNiveles\n- Nivel 1: lo hago yo en el chat, copiando y pegando.\n- Nivel 2: Claude trabaja con archivos que subo o con apps conectadas (conectores de Claude, en Customize → Connectors).\n- Nivel 3: una automatización (Make, Zapier o n8n) corre sola y usa Claude por la API. Necesita una clave de API, que se paga aparte del plan.\n\n## El plano\n\n| Área | Tarea | Nivel hoy | Nivel al que apunto | Qué prepara la IA | Qué decide o revisa una persona | Quién revisa | Dónde están los datos |\n|---|---|---|---|---|---|---|---|\n| Atención | [TAREA] | 0 (a mano) | 1 | [BORRADOR / CLASIFICACIÓN / RESUMEN] | [QUÉ] | [NOMBRE] | [DÓNDE] |\n| Ventas | | | | | | | |\n| Marketing | | | | | | | |\n| Administración | | | | | | | |\n| Operaciones | | | | | | | |\n\n## La línea roja de cada área\n\nEscribe lo que en tu negocio nunca sale sin que lo vea una persona. Si no lo escribes ahora, se decide solo.\n\n- Atención: [EJ.: DEVOLUCIONES DE DINERO, EXCEPCIONES A LA POLÍTICA, CLIENTES ENOJADOS]\n- Ventas: [EJ.: PRECIO FINAL, DESCUENTOS, PLAZOS DE ENTREGA PROMETIDOS]\n- Marketing: [EJ.: TODO LO QUE SE PUBLICA]\n- Administración: [EJ.: PAGOS, COBROS, IMPUESTOS, NÚMEROS QUE VAN AL CONTADOR]\n- Operaciones: [EJ.: PROVEEDORES, PERSONAL, PEDIDOS GRANDES]\n\n## Antes de subir de nivel\n\nPasar del nivel 1 al 2:\n- [ ] La tarea ya funciona bien en el chat: el resultado sale usable sin reescribirlo entero.\n- [ ] Los datos están en un archivo o en una app que Claude puede leer (Gmail, Google Drive, Google Calendar u otro conector disponible).\n- [ ] Si es plan Team o Enterprise, el owner habilitó ese conector.\n\nPasar del nivel 2 al 3:\n- [ ] La tarea funcionó varias semanas en el nivel 2 sin sorpresas.\n- [ ] Está escrito qué hace la automatización cuando algo no cuadra (avisa a una persona, no adivina).\n- [ ] Hay una persona que mira los resultados y sabe apagarla.\n- [ ] Sacaste la clave de API en la Console de Anthropic y definiste cuánto quieres gastar como máximo.\n- [ ] Lo que tiene consecuencias (mandar, cobrar, borrar) queda como borrador o pide aprobación.\n\n## La decisión\n\n- Tarea elegida: [TAREA]\n- Área: [ÁREA]\n- Nivel de arranque: [1 / 2 / 3]\n- Responsable: [NOMBRE]\n- Fecha de revisión: [AAAA-MM-DD]\n"}, {"archivo": "pack-prompts-nivel-1-por-area.md", "que_es": "Diez prompts de nivel 1 para copiar y pegar, dos por área (atención, ventas, marketing, administración y operaciones), todos pensados para dejar borradores y no inventar datos.", "contenido": "# Pack de prompts nivel 1, área por área\n\nPrompts para copiar y pegar en el chat de Claude. Completa lo que está entre corchetes. Todos dejan borradores: lo que sale hacia afuera lo manda una persona.\n\nSi los usas seguido, guárdalos en un Proyecto con tus precios y políticas, así no los pegas cada vez.\n\n## Atención: clasificar consultas\n\nTe paso consultas de clientes de mi negocio de [RUBRO], una por línea.\n\n[PEGA LAS CONSULTAS, SIN NOMBRES NI TELÉFONOS]\n\nClasifica cada una en: reclamo, pedido de presupuesto, duda simple u otra. Para cada una, en una línea: qué pide y quién del equipo debería responder según esta regla: [EJ.: RECLAMOS A LA DUEÑA, PRESUPUESTOS A VENTAS, DUDAS A RECEPCIÓN].\nSi una consulta mezcla dos cosas, dilo. No respondas las consultas.\n\n## Atención: resumir antes de responder un reclamo\n\nTe paso la conversación completa con un cliente.\n\n<conversacion>\n[PEGA LA CONVERSACIÓN]\n<\/conversacion>\n\nDime en tres líneas: qué pasó, qué pide el cliente y qué le prometimos hasta ahora (cita la frase exacta). Después, un borrador de respuesta que reconozca el problema sin prometer nada nuevo. Marca con [DECIDIR] lo que tengo que definir yo.\n\n## Ventas: seguimiento de presupuestos sin respuesta\n\nMandé estos presupuestos y no tuve respuesta:\n\n[CLIENTE O ALIAS, QUÉ PIDIÓ, FECHA DEL PRESUPUESTO, CANAL]\n\nPara cada uno, escribe un mensaje de 2 o 3 líneas, en voseo, que aporte algo concreto (una alternativa, una aclaración, una fecha de entrega) y no suene a \"¿pudiste verlo?\". No cambies precios ni ofrezcas descuentos.\n\n## Ventas: primer borrador de propuesta\n\nEsta es la estructura de mis propuestas: [PEGA UNA PROPUESTA QUE TE GUSTE, SIN DATOS DEL CLIENTE].\nMis servicios y precios vigentes: [PEGA LA LISTA].\nEl cliente nuevo: [RUBRO DEL CLIENTE, QUÉ NECESITA, LO QUE HABLAMOS].\n\nArma el borrador con mi estructura. Usa solo servicios y precios de la lista. Si el cliente pide algo que no está en la lista, no le pongas precio: márcalo como [COTIZAR].\n\n## Marketing: ideas a partir de preguntas reales\n\nEstas son preguntas que me hicieron clientes este mes:\n\n[PEGA LAS PREGUNTAS]\n\nAgrúpalas por tema. Para los 3 temas que más se repiten, propón una idea de post o video corto con: gancho en una frase, tres puntos y cierre. No inventes datos ni testimonios.\n\n## Marketing: leer reseñas y comentarios\n\nTe paso reseñas y comentarios de clientes:\n\n[PEGA LOS TEXTOS]\n\nDime qué elogios se repiten, qué quejas se repiten y qué aparece una sola vez pero es grave. Cita un ejemplo textual de cada punto. No saques porcentajes si no te los pido.\n\n## Administración: resumen del mes\n\nTe subo la planilla de ventas de [MES]. Antes de resumir, dime qué columnas encontraste y si hay filas vacías o raras.\nDespués, en una lista corta: qué cambió respecto de [MES ANTERIOR] (si está en la planilla) y qué conviene mirar. Muestra cómo calculaste cada número para que lo pueda revisar.\n\n## Administración: recordatorio de pago atrasado\n\nEscribe un recordatorio amable para [CLIENTE O ALIAS], que debe [CONCEPTO] desde [FECHA]. Dos versiones: una para el primer aviso y otra para el segundo, un poco más firme. Sin amenazas, sin recargos que no te haya indicado, con los medios de pago: [MEDIOS DE PAGO].\n\n## Operaciones: de lo que hago a un procedimiento\n\nTe cuento cómo hago [TAREA], tal como me sale:\n\n[CUÉNTALO O PEGA EL AUDIO TRANSCRIPTO]\n\nConviértelo en un paso a paso numerado para alguien nuevo del equipo. Al final, lista las dudas que tendría esa persona y que yo no expliqué.\n\n## Operaciones: checklist\n\nArma una checklist de [APERTURA / CIERRE / ENTREGA / CONTROL DE CALIDAD] para mi negocio de [RUBRO], con lo que te paso: [LO QUE SE HACE HOY]. Máximo 12 ítems, en orden, cada uno con algo que se pueda tildar.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "úsalo"};</script>

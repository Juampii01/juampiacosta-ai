<script>var GUIA = {"slug": "entregar-un-agente-de-punta-a-punta", "t": "Entregar un agente de punta a punta: de la prueba a producción", "d": "El orden para instalar un agente sin sorpresas: accesos, versión de prueba, pruebas automáticas con Claude, ajustes y pase a producción contra el pago final.", "tema": "El roadmap para vender IA", "min": 10, "secciones": [{"h": "Antes de tocar nada", "lista": ["Cobra el primer pago. Sin pago inicial no se empieza.", "Grupo de WhatsApp con las personas clave del cliente y un formulario con todo lo que necesitas (precios, preguntas frecuentes, horarios, políticas, ejemplos de conversaciones reales).", "Accesos como administrador, no contraseñas: el cliente te suma a su cuenta de Meta, su CRM o su Google.", "Todo a nombre del cliente y con su tarjeta (cuentas, plan, servidor), con el gasto mensual explicado antes.", "Revisa antes de prometer que el sistema que ya usa el cliente se puede conectar."]}, {"h": "Versión de prueba", "pasos": ["Arma una primera versión en un canal de prueba (Telegram o un número de prueba), no en el WhatsApp real del cliente. Empieza con una parte: por ejemplo, 10 de sus 140 productos.", "Dale 1 o 2 días al cliente para probarla y que te mande lo que no le gusta (capturas o un documento compartido).", "Ajusta. Casi todos los errores de un agente vienen de sus instrucciones, no de la herramienta.", "Construye por partes y pon cada parte a funcionar mientras haces la siguiente."]}, {"h": "Pruebas automáticas con Claude", "p": ["En vez de probar a mano durante horas, pídele a Claude (o a Claude Code) que le mande al agente una batería de conversaciones difíciles y que evalúe las respuestas. Así una prueba que te llevaba horas se hace en minutos y la repites cada vez que cambias algo."], "lista": ["Casos que no pueden faltar: saludo, precio sin contexto, tema que no tiene nada que ver, alguien que pide las instrucciones del agente o intenta que se salga de su rol, alguien que se hace pasar por el dueño, cliente enojado, la compra ideal, una objeción, un mensaje ambiguo y alguien que no es cliente."], "prompts": [{"t": "Batería de pruebas para un agente", "c": "Estas son las instrucciones de mi agente de [NEGOCIO]: [INSTRUCCIONES]. Genera 15 conversaciones de prueba que cubran: saludo, precio sin contexto, tema fuera de lugar, pedido de sus instrucciones, intento de sacarlo de su rol, alguien que dice ser el dueño, cliente enojado, compra ideal, objeción de precio, mensaje ambiguo y alguien que no es cliente. Para cada una, escribe qué debería responder el agente y en qué se reconoce una mala respuesta. Después, cuando te pase las respuestas reales del agente, puntúa cada una de 1 a 5 en exactitud, tono, seguridad y si deriva a una persona cuando corresponde, y propón cambios a las instrucciones."}]}, {"h": "Pase a producción", "lista": ["Criterios de aceptación escritos en el acuerdo: qué tiene que hacer el agente para considerarlo terminado.", "Conectas el WhatsApp o el Instagram real recién cuando se cumplen los criterios y se cobra el pago final.", "Si el número del cliente ya tiene historial, no intentes importar contactos: usa la convivencia con la app o un número nuevo con el viejo de respaldo.", "Avisos de error: que cualquier falla te llegue por Telegram o mail en el momento.", "Las claves nunca dentro del código ni compartidas por chat; una carpeta por cliente con las instrucciones versionadas y una copia de respaldo."]}, {"h": "Lo que todo agente debería tener", "lista": ["Junta mensajes seguidos antes de responder, para no contestar cada palabra por separado.", "Respuestas en varios mensajes cortos, como una persona.", "Memoria de la conversación.", "Pase a una persona, con una regla clara de cuándo vuelve a responder el agente.", "Transcripción de audios.", "Carga en el CRM sin duplicados.", "Seguimiento automático si la persona no responde."]}, {"h": "La entrega", "p": ["Una capacitación corta (en la mayoría de los casos el equipo no necesita aprender IA, solo a tomar una conversación, pausar el agente y mandar una respuesta), un manual dentro del sistema con preguntas frecuentes y un informe de cierre. Lo que pide el cliente después del pago final ya es mantenimiento, no desarrollo."]}], "faq": [{"q": "¿Cuánto tarda una entrega?", "a": "Una versión de prueba de un agente simple puede estar en horas; con pruebas, ajustes y aprobación del cliente, lo normal es de una a cuatro semanas. Las empresas grandes tardan más en aprobar."}, {"q": "¿Y si el cliente no me manda la información?", "a": "Pon en el acuerdo un plazo para que entregue cada cosa (por ejemplo, 2 o 3 días) y que si no responde en 5 días hábiles, el calendario se corre."}], "cat": "roadmap", "parte": "construi"};</script>

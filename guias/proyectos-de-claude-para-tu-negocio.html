agos, cuando el conocimiento se acerca al límite, Claude activa solo un modo de búsqueda (RAG) para que entre más material."], "aviso": "No subas contraseñas, datos de tarjetas ni datos sensibles de tus clientes."}, {"h": "Escribí las instrucciones", "p": ["Tocá Set project instructions, escribí cómo querés que trabaje en ese proyecto y guardá con Save instructions. Se aplican a todos los chats del proyecto.", "Que sean cortas y generales. Lo específico de cada tarea lo pedís en el chat."], "prompts": [{"t": "Instrucciones de un proyecto de atención al cliente", "c": "Sos el asistente de atención al cliente de [TU NEGOCIO].\nUsá solo la información de los documentos del proyecto.\nCuando te pegue el mensaje de un cliente:\n1. Escribí una respuesta corta, amable y en voseo.\n2. Si la respuesta depende de una política (envíos, cambios, garantías), citá cuál.\n3. Si no está en los documentos, decime qué dato falta. No inventes precios ni plazos.\n4. Al final, sugerí si conviene ofrecerle algo más."}, {"t": "Que Claude escriba las instrucciones", "c": "Voy a armar un Proyecto de Claude para [ÁREA DE MI NEGOCIO]. Lo voy a usar para [TAREAS].\nHaceme 5 preguntas para entender cómo trabajo y después escribime las instrucciones del proyecto: menos de 150 palabras, en segunda persona, con reglas claras de qué hacer y qué no."}]}, {"h": "Memoria y equipo", "p": ["Cada proyecto tiene su propia memoria. Si querés que un proyecto no use lo que Claude sabe de vos en general, apagá Use account memory en la sección Memory de la página del proyecto.", "En el plan Team podés compartirlo: botón Share project, al lado del nombre. Agregás personas y elegís Can view (solo ver) o Can edit (editar)."]}], "faq": [{"q": "¿Cuántos archivos puedo subir?", "a": "Depende del tamaño. En los planes pagos, si te acercás al límite, Claude cambia solo a un modo de búsqueda para que entre más."}, {"q": "Abrí un chat nuevo y no se acuerda del anterior", "a": "Es normal: los chats de un proyecto no comp

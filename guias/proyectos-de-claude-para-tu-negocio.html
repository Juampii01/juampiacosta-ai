<script>var GUIA = {"slug": "proyectos-de-claude-para-tu-negocio", "t": "Proyectos de Claude: un asistente por área de tu negocio", "d": "Arma un Proyecto con tus documentos y tus reglas para que cada chat arranque sabiendo cómo trabaja tu negocio.", "tema": "Sácale más jugo a Claude", "min": 9, "fichaNombre": "Proyectos", "ficha": [["Qué es", "Un espacio con chats, conocimiento (archivos) e instrucciones propias."], ["Necesitas", "Cualquier plan. En el gratis, hasta cinco proyectos."], ["Tiempo", "20 minutos el primero."], ["Qué no hace", "Los chats de un proyecto no se leen entre sí: lo que tiene que estar siempre, va al conocimiento."]], "secciones": [{"h": "Qué proyectos armar primero", "lista": ["Atención al cliente: tus preguntas frecuentes, políticas de envío y cambios. Claude te redacta respuestas en tu tono.", "Ventas y propuestas: tus servicios, precios y propuestas que ya ganaste. Te arma propuestas nuevas con la misma estructura.", "Contenido: tu guía de marca, ejemplos de posts que funcionaron y tu público. Te ayuda a escribir sin sonar genérico.", "Operación: procesos, checklists y manuales internos, para consultar o para capacitar a alguien nuevo."]}, {"h": "Créalo", "pasos": ["Entra a Projects en la barra de la izquierda o ve a claude.ai/projects.", "Toca + New Project, arriba a la derecha.", "Ponle nombre y descripción. Ojo: Claude no lee esos datos, son para ti.", "En Team o Enterprise elige si queda privado o compartido con tu organización."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tienes Claude en español, vas a ver la traducción en el mismo lugar."]}, {"h": "Cárgale el conocimiento", "pasos": ["Adentro del proyecto, a la derecha, está el conocimiento. Toca +.", "Sube documentos, textos o fragmentos de código. Ponles nombres claros (\"Preguntas frecuentes 2026.pdf\").", "Sube lo que vas a usar seguido, no todo lo que tienes. Si un archivo ya no sirve, bórralo."], "p": ["En los planes pagos, cuando el conocimiento se acerca al límite, Claude activa solo un modo de búsqueda (RAG) para que entre más material."], "aviso": "No subas contraseñas, datos de tarjetas ni datos sensibles de tus clientes."}, {"h": "Escribe las instrucciones", "p": ["Toca Set project instructions, escribe cómo quieres que trabaje en ese proyecto y guarda con Save instructions. Se aplican a todos los chats del proyecto.", "Que sean cortas y generales. Lo específico de cada tarea lo pides en el chat."], "prompts": [{"t": "Instrucciones de un proyecto de atención al cliente", "c": "Eres el asistente de atención al cliente de [TU NEGOCIO].\nUsa solo la información de los documentos del proyecto.\nCuando te pegue el mensaje de un cliente:\n1. Escribe una respuesta corta, amable y en voseo.\n2. Si la respuesta depende de una política (envíos, cambios, garantías), cita cuál.\n3. Si no está en los documentos, dime qué dato falta. No inventes precios ni plazos.\n4. Al final, sugiere si conviene ofrecerle algo más."}, {"t": "Que Claude escriba las instrucciones", "c": "Voy a armar un Proyecto de Claude para [ÁREA DE MI NEGOCIO]. Lo voy a usar para [TAREAS].\nHazme 5 preguntas para entender cómo trabajo y después escríbeme las instrucciones del proyecto: menos de 150 palabras, en segunda persona, con reglas claras de qué hacer y qué no."}]}, {"h": "Memoria y equipo", "p": ["Cada proyecto tiene su propia memoria. Si quieres que un proyecto no use lo que Claude sabe de ti en general, apaga Use account memory en la sección Memory de la página del proyecto.", "En los planes Team y Enterprise puedes compartirlo (salvo que el administrador lo haya desactivado): botón Share project, a la derecha del nombre. Agregas personas por nombre o mail, eliges Can view (ven el contenido, el conocimiento y las instrucciones y chatean en el Proyecto, pero no lo editan) o Can edit (cambian instrucciones y conocimiento) y tocas Share."]}], "faq": [{"q": "¿Cuántos archivos puedo subir?", "a": "No hay un número fijo de archivos: cada uno puede pesar hasta 30 MB y el total tiene que entrar en el contexto de Claude. En los planes pagos, si te acercas al límite, Claude cambia solo a un modo de búsqueda (RAG) para que entre más."}, {"q": "Abre un chat nuevo y no se acuerda del anterior", "a": "Es normal: los chats de un proyecto no comparten lo que hablaron. Lo que tiene que saber siempre, súbelo al conocimiento."}, {"q": "¿Las instrucciones del proyecto reemplazan a las mías?", "a": "Las del proyecto se aplican solo adentro de ese proyecto. Las tuyas siguen valiendo para todo."}], "fuentes": ["https://support.claude.com/en/articles/9519177", "https://support.claude.com/en/articles/11817273", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/8241126", "https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features"], "ejemplo": {"titulo": "Ejemplo resuelto: dos Proyectos para una tienda online de cosmética natural", "negocio": "Ejemplo inventado: una tienda online de cosmética natural en Medellín, Colombia, con la dueña y una persona que responde mensajes. Venden por Instagram y por su web, con envíos a todo el país. La dueña tiene un plan Pro.", "punto_de_partida": "Las respuestas a clientes las escribía cada una a su manera, y cada vez que alguien preguntaba por cambios o por el tiempo de envío había que buscar la política en un documento viejo.", "pasos": ["La dueña juntó lo que ya tenía: las preguntas frecuentes, la política de envíos y cambios, los medios de pago y ocho respuestas que le gustaban. Separó la política en dos archivos, uno de envíos y otro de cambios, y los nombró con el mes.", "Entró a Projects, tocó + New Project y lo llamó Atención al cliente. En la descripción puso para qué era, sabiendo que Claude no la lee.", "Subió los archivos con el + del conocimiento, a la derecha. Pasó la checklist del kit: ningún archivo superaba los 30 MB y sacó de las respuestas modelo los nombres y teléfonos de clientes.", "Pegó el bloque de atención al cliente de las plantillas del kit en Set project instructions, completó los corchetes con el nombre de la tienda y el canal (Instagram) y guardó con Save instructions.", "Hizo la prueba de 5 preguntas del kit. Claude citó bien los archivos, pero a la quinta (si hacían envíos al exterior) inventó una respuesta. Agregó en las instrucciones que, si no está en los archivos, lo diga, y repitió la prueba hasta que contestó que no estaba.", "Armó un segundo Proyecto, Contenido, con la guía de marca y los posts que mejor les fueron, usando el bloque 3 de las plantillas.", "Como el plan Pro no permite compartir Proyectos, la persona que responde mensajes usa la misma cuenta del negocio para el Proyecto de atención. La dueña dejó anotado que, si pasan a Team, lo van a compartir con Share project y permiso Can view."], "resultado": "La tienda tiene un Proyecto de atención que responde con las políticas vigentes y marca lo que falta confirmar, y otro de contenido con la guía de marca cargada. Cuando cambia una política, se reemplaza el archivo y todos los chats nuevos la usan."}, "si_falla": [{"sintoma": "Un archivo no se sube al conocimiento del Proyecto.", "solucion": "En Proyectos el máximo es 30 MB por archivo. Parte el PDF en partes por tema o expórtalo de nuevo con menos calidad de imagen. Si es una planilla .xlsx, activa la ejecución de código y creación de archivos en Settings → Capabilities. Si el Proyecto ya tiene mucho material, borra archivos que no uses: el total tiene que entrar en el contexto de Claude."}, {"sintoma": "Claude responde algo que no está en los archivos o mezcla datos de una versión vieja.", "solucion": "Fíjate que no haya dos versiones del mismo archivo (borra la vieja). En las instrucciones pídele que nombre de qué archivo saca cada dato y que diga que no está cuando no lo encuentra. Haz la prueba de 5 preguntas del kit para comprobarlo."}, {"sintoma": "No aparece el botón Share project.", "solucion": "Compartir Proyectos es solo de Team y Enterprise. En esos planes, si igual no aparece, el administrador desactivó el uso compartido. En Free, Pro o Max no hay forma de compartir el Proyecto con otra cuenta."}, {"sintoma": "El Proyecto usa cosas que hablaste con Claude fuera de él.", "solucion": "Cada Proyecto tiene su memoria, pero también usa la memoria de tu cuenta de los chats fuera de Proyectos. Entra a la página del Proyecto y, en Memory, apaga Use account memory."}, {"sintoma": "En el plan gratis no te deja crear otro Proyecto.", "solucion": "En Free el máximo es cinco Proyectos. Junta en uno los que se parecen (por ejemplo, Contenido y Redes) o borra uno que no uses. Si necesitas más, es de un plan pago."}], "kit": [{"archivo": "instrucciones-4-proyectos-de-negocio.md", "que_es": "Instrucciones listas para pegar en cuatro Proyectos (atención al cliente, ventas y propuestas, contenido y operación), con la lista de archivos que conviene subir a cada uno.", "contenido": "# Instrucciones listas para cuatro Proyectos de tu negocio\n\nCada bloque va en Set project instructions de su Proyecto. Completa los corchetes y guarda con Save instructions. Los datos (precios, políticas, ejemplos) no van aquí: van como archivos en el conocimiento del Proyecto. Al final de cada bloque está la lista de archivos que conviene subir.\n\n## 1. Atención al cliente\n\n```\nEres el asistente de atención al cliente de [NEGOCIO], un [RUBRO] de [CIUDAD].\nCuando te pegue el mensaje de un cliente:\n1. Escribe una respuesta corta y amable, en voseo, lista para mandar por [WHATSAPP / MAIL / INSTAGRAM].\n2. Usa solo los archivos del Proyecto. Si la respuesta depende de una política (envíos, cambios, garantías, medios de pago), nombra cuál.\n3. Si el dato no está en los archivos, no lo completes: escribe la respuesta con [CONFIRMAR: ...] donde falte y avísame qué falta.\n4. Si el cliente está enojado, primero reconoce el problema en una frase, después la solución. Sin excusas largas.\n5. Nunca prometas plazos, descuentos ni reintegros que no estén en las políticas.\n6. Al final, en una línea aparte, sugiere si conviene ofrecerle algo más y por qué.\n```\n\nArchivos: Preguntas frecuentes [AÑO].pdf, Políticas de envío y cambios.pdf, Medios de pago.txt, Respuestas modelo.md (5 a 10 respuestas reales que te gustaron).\n\n## 2. Ventas y propuestas\n\n```\nEres mi asistente de ventas en [NEGOCIO]. Armas propuestas y presupuestos.\n1. Antes de escribir una propuesta, pregúntame de a una lo que no sepas: qué necesita el cliente, para cuándo, presupuesto aproximado y quién decide.\n2. Usa la estructura de las propuestas ganadas del Proyecto: mismo orden de secciones y mismo largo.\n3. Los precios salen solo del archivo de precios. Si el servicio no está, marca [PRECIO A DEFINIR].\n4. Escribe beneficios concretos para el rubro del cliente, sin frases genéricas.\n5. Cierra con un próximo paso claro y una fecha.\n6. Al final lista en viñetas lo que diste por supuesto.\n```\n\nArchivos: Servicios y precios [AÑO].pdf, 2 o 3 propuestas que ganaste (sin datos personales del cliente), Objeciones frecuentes.md.\n\n## 3. Contenido\n\n```\nEres el redactor de contenido de [NEGOCIO]. Le hablamos a [CLIENTE IDEAL EN UNA LÍNEA].\n1. Sigue la guía de marca del Proyecto: tono, palabras que sí y que no.\n2. Antes de escribir, propón 3 ángulos distintos en una línea cada uno y espera que elija.\n3. Usa como referencia los posts que funcionaron, sin copiarlos.\n4. Nada de datos, cifras ni testimonios que no estén en los archivos.\n5. Entrega el texto y, aparte, una idea de imagen o video en una línea.\n```\n\nArchivos: Guía de marca.pdf, Posts que funcionaron.md (5 a 10, con el texto completo), Público y preguntas frecuentes de clientes.md.\n\n## 4. Operación\n\n```\nEres el asistente de operación de [NEGOCIO]. Respondes consultas sobre cómo se hacen las cosas y ayudas a capacitar gente nueva.\n1. Responde solo con los procesos y manuales del Proyecto. Nombra de qué archivo y qué sección sale cada paso.\n2. Si un proceso no está escrito, dilo y ofrece armar un borrador para que yo lo revise.\n3. Cuando expliques un proceso, hazlo en pasos numerados cortos, con lo que puede salir mal en cada uno.\n4. Si dos documentos se contradicen, no elijas: muéstrame la diferencia.\n```\n\nArchivos: un archivo por proceso (Apertura y cierre.pdf, Carga de pedidos.pdf, Proveedores.pdf), Checklist de ingreso de personal.md.\n"}, {"archivo": "checklist-conocimiento-del-proyecto.md", "que_es": "Checklist para preparar y subir los archivos, una prueba de 5 preguntas para ver si Claude los usa bien y el mantenimiento mensual del Proyecto.", "contenido": "# Checklist del conocimiento de un Proyecto\n\nPásala al armar el Proyecto y repítela una vez por mes.\n\n## Antes de subir\n\n- [ ] Cada archivo tiene un nombre que dice qué es y de cuándo es: \"Precios 2026-11.pdf\", no \"final_v3.pdf\".\n- [ ] Un tema por archivo. Si un PDF mezcla precios y políticas, sepáralo.\n- [ ] Ningún archivo pesa más de 30 MB (es el máximo por archivo en Proyectos).\n- [ ] Saqué contraseñas, datos de tarjetas, cuentas bancarias y datos sensibles de clientes.\n- [ ] Si es una planilla .xlsx, tengo activada la ejecución de código y creación de archivos (Settings → Capabilities), que es lo que pide la ayuda oficial para subir XLSX.\n- [ ] Si un documento tiene imágenes importantes (una tabla escaneada, un gráfico), lo subo en PDF: de otros formatos Claude solo saca el texto.\n\n## Después de subir: prueba de 5 preguntas\n\nAbre un chat nuevo en el Proyecto y pega:\n\n```\nResponde estas 5 preguntas usando solo los archivos del Proyecto. Para cada una, nombra el archivo de donde sale la respuesta. Si no está, di \"no está en los archivos\".\n1. [PREGUNTA CUYA RESPUESTA ESTÁ EN UN ARCHIVO]\n2. [OTRA, DE OTRO ARCHIVO]\n3. [UNA QUE DEPENDA DE UN PRECIO]\n4. [UNA QUE DEPENDA DE UNA POLÍTICA]\n5. [UNA CUYA RESPUESTA NO ESTÉ EN NINGÚN ARCHIVO]\n```\n\n- [ ] Las cuatro primeras citan el archivo correcto.\n- [ ] La quinta dice que no está. Si inventó una respuesta, refuerza en las instrucciones: \"si no está en los archivos, dilo\".\n\n## Mantenimiento mensual\n\n- [ ] Reemplacé los archivos que cambiaron (precios, políticas). Borré la versión vieja, no dejé las dos.\n- [ ] Borré los archivos que ya no uso.\n- [ ] Revisé las instrucciones: siguen siendo cortas y no tienen datos que cambien seguido.\n- [ ] Si algo que decidimos en un chat tiene que valer siempre, lo pasé a un archivo. Los chats del Proyecto no se leen entre sí.\n- [ ] Si el Proyecto tiene que quedar aislado de lo que Claude sabe de mí en otros chats, Use account memory está apagado en la sección Memory.\n"}], "verificada": "2026-11-08", "cat": "mas-jugo", "parte": "aprende"};</script>

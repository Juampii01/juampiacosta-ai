<script>var GUIA = {"slug": "sistema-base-modulo-5-propuesta-y-precio", "t": "Módulo 5 · Propuesta de una página y cómo ponerle precio", "d": "Cómo armar una propuesta que se lee en dos minutos y cómo calcular la instalación y el mensual con una fórmula simple que podés defender.", "tema": "El sistema para vender IA", "min": 10, "fichaNombre": "Fórmula de precio", "ficha": [["Qué es", "Una propuesta de una página y una fórmula para el precio de instalación y de mantenimiento mensual."], ["Necesitás", "Las notas del diagnóstico (Módulo 4), tu valor hora y tus horas reales de una instalación."], ["Qué no hace", "No te dice cuánto cobra el mercado en tu país: eso lo averiguás vos."]], "secciones": [{"h": "La propuesta entra en una página", "p": ["Un dueño de negocio no lee diez páginas. Lee una, y si la entiende, decide. Estas son las partes, en este orden:"], "lista": ["Lo que nos contaste: dos o tres líneas con sus palabras, sacadas de las notas del diagnóstico.", "Lo que vamos a dejar instalado: las piezas del paquete, cada una con la tarea concreta de su negocio que cubre.", "Lo que no incluye: la lista del Módulo 1, ajustada a este cliente.", "Lo que necesitamos de vos: accesos, documentos (precios, preguntas frecuentes, ejemplos) y una persona disponible para la prueba.", "Plazos: cuándo empieza, cuándo es la capacitación y cuándo queda entregado.", "Precio: instalación (un pago o en partes), mensual de mantenimiento y suscripciones que paga el cliente aparte.", "Próximo paso: qué tiene que hacer para arrancar y hasta cuándo vale la propuesta."]}, {"h": "La fórmula del precio", "p": ["El precio tiene dos partes. La instalación se cobra una vez. El mensual se cobra mientras el cliente quiera mantenimiento.", "Instalación = horas de instalación × tu valor hora × 1,3. El 1,3 es un colchón del 30% para imprevistos: siempre aparece un documento que falta o un acceso que no funciona.", "Mensual = horas de mantenimiento por mes × tu valor hora. Las suscripciones (plan de Claude y otras herramientas) no entran acá porque las paga el cliente, a su nombre.", "Tu valor hora sale de lo que necesitás ganar por mes dividido por las horas que de verdad podés cobrar, no por las que trabajás. Para el detalle de piso, techo y dónde ubicarte, mirá \"Cuánto cobrar por automatizar con IA\"."]}, {"h": "Un ejemplo para ver la cuenta", "p": ["Ejemplo (números inventados, en \"unidades\" para que lo pases a tu moneda): tu valor hora es 20 unidades. Una instalación del paquete base te lleva 15 horas entre preparar, instalar, probar y capacitar. Instalación = 15 × 20 × 1,3 = 390 unidades.", "Ejemplo de mensual con los mismos números: calculás 3 horas por mes de revisión, ajustes y reporte. Mensual = 3 × 20 = 60 unidades.", "Estas cifras no son una recomendación de precio ni un dato de mercado. Usá tus horas reales: medí cuánto te llevan tus primeras dos instalaciones y corregí la fórmula con eso."], "aviso": "Si la cuenta te da un precio que el cliente no puede pagar, no lo bajes sin más: achicá el alcance (por ejemplo, dos skills en lugar de tres) y escribilo en la propuesta."}, {"h": "Un precio cerrado para el paquete base", "lista": ["Fijá el precio del paquete base: cuando ya hiciste dos o tres instalaciones, sabés cuántas horas lleva y podés tener un precio fijo. Eso hace que vender sea mucho más simple.", "Los extras se cotizan aparte: una skill más, otra automatización, cargar documentos que el cliente no tiene ordenados. Con la misma fórmula, por hora estimada.", "Precio cerrado, no por hora: si cobrás por hora, el cliente siente que te paga por tardar. Cobrá por el paquete y cuidá el alcance.", "Pago en partes: una opción común es una parte al arrancar y el resto al entregar. Lo que acuerdes, ponelo por escrito (Módulo 9)."]}, {"h": "Armá la propuesta con Claude", "p": ["Con las notas y el resumen del Módulo 4, pedile a Claude el borrador. Los números los ponés vos. Para revisar la propuesta antes de mandarla, seguí los pasos de \"Propuesta comercial a partir de las notas de una llamada\"."], "prompts": [{"t": "Propuesta de una página", "c": "Armá una propuesta de una página para un negocio al que le voy a instalar Claude.\n\nResumen del diagnóstico: [PEGÁ EL RESUMEN DEL MÓDULO 4]\nPaquete: proyecto con el conocimiento del negocio, skill de marca, skill de presupuestos, skill de respuestas a clientes, conectores de Gmail, Google Calendar y Google Drive, una automatización ([CUÁL]) y una capacitación de 30 minutos con video grabado.\nNo incluye: [LISTA].\nNecesito del cliente: [LISTA].\nPlazos: [FECHAS].\nPrecio de instalación: [MONTO Y MONEDA], en [FORMA DE PAGO].\nMensual de mantenimiento: [MONTO Y MONEDA], que incluye [QUÉ INCLUYE].\nSuscripciones que paga el cliente: [PLAN DE CLAUDE Y OTRAS].\nVálida hasta: [FECHA].\n\nSecciones, en este orden: Lo que nos contaste, Lo que vamos a dejar instalado, Lo que no incluye, Lo que necesitamos de vos, Plazos, Precio, Próximo paso.\nUsá las palabras del cliente cuando puedas. Nada de promesas de ahorro o ventas. Que entre en una página."}, {"t": "Revisar mi cuenta de precio", "c": "Revisá mi cálculo de precio.\nMi valor hora: [NÚMERO Y MONEDA].\nHoras estimadas de instalación, por tarea: [LISTA DE TAREAS CON HORAS].\nHoras de mantenimiento por mes, por tarea: [LISTA].\n\n1. Calculá instalación = horas × valor hora × 1,3 y mensual = horas × valor hora, mostrando la cuenta.\n2. Decime si me olvidé de alguna tarea típica de una instalación (preparar documentos, pruebas, capacitación, documento de entrega, viajes).\n3. Si el resultado te parece alto para el alcance, proponé qué sacar del alcance en lugar de bajar el valor hora.\nNo me digas precios de mercado."}]}], "faq": [{"q": "¿Muestro el precio en la llamada o solo en la propuesta?", "a": "Podés dar un rango en la llamada si te lo piden. El número final va en la propuesta, cuando el alcance está claro."}, {"q": "¿Le cobro igual a un negocio chico que a uno grande?", "a": "El paquete base tiene un precio. Si el negocio es más grande, suele necesitar más personas capacitadas, más documentos o más skills: eso son extras con su propio precio."}, {"q": "¿Y si me piden descuento?", "a": "Ofrecé sacar algo del alcance en lugar de bajar el precio del mismo trabajo. Si bajás sin cambiar nada, le enseñás que tu primer precio no era en serio."}], "fuentes": [], "cat": "sistema-base", "parte": "construi"};</script>

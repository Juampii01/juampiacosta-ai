<script>var GUIA = {"slug": "sistema-base-modulo-5-propuesta-y-precio", "t": "Módulo 5 · Propuesta de una página y cómo ponerle precio", "d": "Cómo armar una propuesta que se lee en dos minutos y cómo calcular la instalación y el mensual con una fórmula simple que puedes defender.", "tema": "El sistema para vender IA", "min": 10, "fichaNombre": "Fórmula de precio", "ficha": [["Qué es", "Una propuesta de una página y una fórmula para el precio de instalación y de mantenimiento mensual."], ["Necesitas", "Las notas del diagnóstico (Módulo 4), tu valor hora y tus horas reales de una instalación."], ["Qué no hace", "No te dice cuánto cobra el mercado en tu país: eso lo averiguas tú."]], "secciones": [{"h": "La propuesta entra en una página", "p": ["Un dueño de negocio no lee diez páginas. Lee una, y si la entiende, decide. Estas son las partes, en este orden:"], "lista": ["Lo que nos contaste: dos o tres líneas con sus palabras, sacadas de las notas del diagnóstico.", "Lo que vamos a dejar instalado: las piezas del paquete, cada una con la tarea concreta de su negocio que cubre.", "Lo que no incluye: la lista del Módulo 1, ajustada a este cliente.", "Lo que necesitamos de ti: accesos, documentos (precios, preguntas frecuentes, ejemplos) y una persona disponible para la prueba.", "Plazos: cuándo empieza, cuándo es la capacitación y cuándo queda entregado.", "Precio: instalación (un pago o en partes), mensual de mantenimiento y suscripciones que paga el cliente aparte.", "Próximo paso: qué tiene que hacer para arrancar y hasta cuándo vale la propuesta."]}, {"h": "La fórmula del precio", "p": ["El precio se fija por solución y por el valor que genera, nunca por hora. Las horas sirven para saber tu piso (lo mínimo para no perder plata); el valor para el cliente marca hasta dónde puedes llegar.", "El precio tiene dos partes. La instalación se cobra una vez. El mensual se cobra mientras el cliente quiera mantenimiento.", "Instalación = horas de instalación × tu valor hora × 1,3. El 1,3 es un colchón del 30% para imprevistos: siempre aparece un documento que falta o un acceso que no funciona.", "Mensual = horas de mantenimiento por mes × tu valor hora. Las suscripciones (plan de Claude y otras herramientas) no entran aquí porque las paga el cliente, a su nombre.", "Tu valor hora sale de lo que necesitas ganar por mes dividido por las horas que de verdad puedes cobrar, no por las que trabajas. Para el detalle de piso, techo y dónde ubicarte, mira \"Cuánto cobrar por automatizar con IA\".", "El techo sale del retorno: una referencia es cobrar alrededor del 10% de lo que el sistema le ahorra o le hace ganar en un año, o más o menos un mes de lo que recupera en el escenario conservador. El cálculo está en \"Calcula el retorno de tu propuesta\" y los rangos que se ven en el mercado, en \"Precios de referencia y formas de pago\"."]}, {"h": "Un ejemplo para ver la cuenta", "p": ["Ejemplo (números inventados, en \"unidades\" para que lo pases a tu moneda): tu valor hora es 20 unidades. Una instalación del paquete base te lleva 15 horas entre preparar, instalar, probar y capacitar. Instalación = 15 × 20 × 1,3 = 390 unidades.", "Ejemplo de mensual con los mismos números: calculas 3 horas por mes de revisión, ajustes y reporte. Mensual = 3 × 20 = 60 unidades.", "Estas cifras no son una recomendación de precio ni un dato de mercado. Usa tus horas reales: mide cuánto te llevan tus primeras dos instalaciones y corrige la fórmula con eso."], "aviso": "Si la cuenta te da un precio que el cliente no puede pagar, no lo bajes sin más: achica el alcance (por ejemplo, dos skills en lugar de tres) y escríbelo en la propuesta."}, {"h": "Un precio cerrado para el paquete base", "lista": ["Fija el precio del paquete base: cuando ya hiciste dos o tres instalaciones, sabes cuántas horas lleva y puedes tener un precio fijo. Eso hace que vender sea mucho más simple.", "Los extras se cotizan aparte: una skill más, otra automatización, cargar documentos que el cliente no tiene ordenados. Con la misma fórmula, por hora estimada.", "Precio cerrado, no por hora: si cobras por hora, el cliente siente que te paga por tardar. Cobra por el paquete y cuida el alcance.", "Pago en partes: una opción común es una parte al arrancar y el resto al entregar. Lo que acuerdes, ponlo por escrito (Módulo 9)."]}, {"h": "Arma la propuesta con Claude", "p": ["Con las notas y el resumen del Módulo 4, pídele a Claude el borrador. Los números los pones tú. Para revisar la propuesta antes de mandarla, sigue los pasos de \"Propuesta comercial a partir de las notas de una llamada\"."], "prompts": [{"t": "Propuesta de una página", "c": "Arma una propuesta de una página para un negocio al que le voy a instalar Claude.\n\nResumen del diagnóstico: [PEGA EL RESUMEN DEL MÓDULO 4]\nPaquete: proyecto con el conocimiento del negocio, skill de marca, skill de presupuestos, skill de respuestas a clientes, conectores de Gmail, Google Calendar y Google Drive, una automatización ([CUÁL]) y una capacitación de 30 minutos con video grabado.\nNo incluye: [LISTA].\nNecesito del cliente: [LISTA].\nPlazos: [FECHAS].\nPrecio de instalación: [MONTO Y MONEDA], en [FORMA DE PAGO].\nMensual de mantenimiento: [MONTO Y MONEDA], que incluye [QUÉ INCLUYE].\nSuscripciones que paga el cliente: [PLAN DE CLAUDE Y OTRAS].\nVálida hasta: [FECHA].\n\nSecciones, en este orden: Lo que nos contaste, Lo que vamos a dejar instalado, Lo que no incluye, Lo que necesitamos de ti, Plazos, Precio, Próximo paso.\nUsa las palabras del cliente cuando puedas. Nada de promesas de ahorro o ventas. Que entre en una página."}, {"t": "Revisar mi cuenta de precio", "c": "Revisa mi cálculo de precio.\nMi valor hora: [NÚMERO Y MONEDA].\nHoras estimadas de instalación, por tarea: [LISTA DE TAREAS CON HORAS].\nHoras de mantenimiento por mes, por tarea: [LISTA].\n\n1. Calcula instalación = horas × valor hora × 1,3 y mensual = horas × valor hora, mostrando la cuenta.\n2. Dime si me olvidé de alguna tarea típica de una instalación (preparar documentos, pruebas, capacitación, documento de entrega, viajes).\n3. Si el resultado te parece alto para el alcance, propón qué sacar del alcance en lugar de bajar el valor hora.\nNo me digas precios de mercado."}]}], "faq": [{"q": "¿Muestro el precio en la llamada o solo en la propuesta?", "a": "Puedes dar un rango en la llamada si te lo piden. El número final va en la propuesta, cuando el alcance está claro."}, {"q": "¿Le cobro igual a un negocio chico que a uno grande?", "a": "El paquete base tiene un precio. Si el negocio es más grande, suele necesitar más personas capacitadas, más documentos o más skills: eso son extras con su propio precio."}, {"q": "¿Y si me piden descuento?", "a": "Ofrece sacar algo del alcance en lugar de bajar el precio del mismo trabajo. Si bajas sin cambiar nada, le enseñas que tu primer precio no era en serio."}], "fuentes": ["https://claude.com/pricing", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"], "ejemplo": {"titulo": "Ejemplo resuelto: la propuesta para un corralón después del diagnóstico", "negocio": "Ejemplo inventado: el mismo corralón de materiales de Pergamino (provincia de Buenos Aires) del Módulo 4, con el dueño, su hija en el mostrador y cuatro empleados. Lo que más les pesa es armar presupuestos de obra copiando de la planilla de precios.", "punto_de_partida": "Después de la llamada quedaron tres preguntas pendientes (cómo calculan el flete, qué condiciones de pago ofrecen y quién más va a usar la cuenta) y el compromiso de mandar la propuesta el jueves.", "pasos": ["El martes recibió las respuestas: el flete depende de la zona y lo calcula el dueño, aceptan transferencia y efectivo, y van a usar Claude la hija y el dueño. Las sumó al resumen del diagnóstico.", "Con dos personas que tienen que compartir el proyecto y las skills, anotó en \"Lo que necesitamos de ti\" un plan Team de Claude (mínimo dos personas) a nombre del corralón, pagado por ellos. Lo revisó en la página de precios de Claude antes de escribirlo.", "Completó la hoja de cálculo del kit con sus horas estimadas, tarea por tarea, y sumó una hora para pasar la planilla de precios a Google Drive con la hija. Usó el prompt \"Revisar mi cuenta de precio\" de la guía: Claude le marcó que no había puesto horas para el documento de entrega.", "Con la cuenta hecha, armó la propuesta con la skill propuesta-de-una-pagina del kit. Le pegó el resumen, el alcance, la lista de lo que no incluye (no responde solo por WhatsApp, no calcula fletes por su cuenta, no carga precios que no estén en la planilla) y los montos.", "En \"Para revisar antes de mandar\" la skill dejó un [COMPLETAR] en la fecha de capacitación. La acordó por mensaje con la hija y la completó.", "Leyó la propuesta en voz alta en dos minutos. Cambió \"skill de respuestas\" por \"respuestas a las preguntas de siempre (stock, flete y formas de pago)\", que fueron las palabras de ella en la llamada.", "La mandó el jueves por mail, como PDF de una página, con un mensaje de dos líneas por WhatsApp avisando que estaba en la casilla.", "El dueño preguntó si había descuento. Siguiendo la guía, ofreció sacar la automatización de esta etapa en lugar de bajar el precio. El dueño prefirió dejarla y aceptó con el pago en dos partes que figuraba en la propuesta."], "resultado": "Quedó una propuesta de una página con el alcance, lo que no incluye, lo que tiene que poner el corralón y un precio que sale de horas anotadas tarea por tarea. La hoja de cálculo queda lista para anotar las horas reales durante la instalación del Módulo 6."}, "si_falla": [{"sintoma": "Claude te devuelve una propuesta de dos o tres páginas.", "solucion": "Pídele que la recorte a unas 350 palabras, con un máximo de líneas por sección, y que recorte primero \"Lo que nos contaste\" y \"Lo que vamos a dejar instalado\". Si sigue larga, saca detalles técnicos: el cliente no necesita saber cómo funciona cada pieza, sino qué tarea cubre."}, {"sintoma": "En el borrador aparecen frases como \"vas a ahorrar horas\" o \"más ventas\".", "solucion": "Bórralas antes de mandar. No las puedes sostener y te comprometen. Cámbialas por la tarea concreta: \"arma el borrador del presupuesto con tu lista de precios\". La skill del kit tiene esa regla; si igual aparecen, recuérdasela en el pedido."}, {"sintoma": "El cliente dice que es caro.", "solucion": "No bajes el valor hora ni el precio del mismo trabajo. Ofrece una versión más chica (dos skills en lugar de tres, sin automatización en esta etapa) y escribe el nuevo alcance en la propuesta."}, {"sintoma": "Pasan días y el cliente no responde la propuesta.", "solucion": "Manda un solo mensaje cerca de la fecha de validez, con una pregunta concreta (\"¿Arrancamos el lunes o prefieres esperar?\"). Para la secuencia completa y cuándo parar, sigue \"Seguimiento de prospectos sin ser pesado\"."}, {"sintoma": "La instalación te llevó bastantes más horas que las que calculaste.", "solucion": "Si el alcance no cambió, el precio cerrado se respeta: es lo que aprendes para la próxima. Anota las horas reales en la hoja del kit y corrige la estimación de la tarea que se pasó. Si el cliente pidió algo fuera de la propuesta, eso es un extra y se cotiza por escrito antes de hacerlo."}], "kit": [{"archivo": "propuesta-de-una-pagina/SKILL.md", "que_es": "Skill que arma el borrador de la propuesta con las siete secciones de la guía, deja [COMPLETAR] donde falta un número y nunca inventa precios ni promesas. Guárdala en una carpeta llamada propuesta-de-una-pagina, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: propuesta-de-una-pagina\ndescription: 'Arma la propuesta de una página para instalar Claude en un negocio, desde el diagnóstico y tus números, con siete secciones fijas y sin inventar precios. Úsala al pedir propuesta o cotización.'\n---\n\n# Propuesta de una página\n\nEscribes el borrador de una propuesta que el dueño de un negocio lee en dos minutos. Los números los pone el usuario. Tú ordenas, recortas y usas las palabras del cliente.\n\n## Qué te tienen que pasar\n\n- El resumen o las notas del diagnóstico.\n- El alcance: qué piezas del paquete entran (proyecto, skills, conectores, automatización, capacitación).\n- Lo que no incluye.\n- Lo que necesita del cliente.\n- Fechas.\n- Precio de instalación con moneda y forma de pago, mensual con lo que incluye y suscripciones que paga el cliente.\n- Fecha de validez.\n\nSi falta un número, una fecha o una moneda, no lo completes: deja [COMPLETAR: qué falta] en ese lugar y lístalo al final.\n\n## Las siete secciones, en este orden\n\n1. **Lo que nos contaste**: dos o tres líneas con las palabras del cliente. Cita tareas concretas, no \"mejorar la productividad\".\n2. **Lo que vamos a dejar instalado**: una línea por pieza, cada una con la tarea del negocio que cubre. Ejemplo: \"Skill de presupuestos: arma el borrador del presupuesto de obra con tu lista de precios. Lo revisas y lo mandas tú\".\n3. **Lo que no incluye**: la lista que te pasaron, en frases cortas. Siempre incluye que Claude no manda nada a clientes sin que una persona lo revise.\n4. **Lo que necesitamos de ti**: accesos, documentos y una persona disponible para la prueba, con fecha.\n5. **Plazos**: inicio, sesiones de trabajo, capacitación y entrega.\n6. **Precio**: instalación, mensual y suscripciones aparte, a nombre del cliente. Si la automatización está en el alcance, aclara que hace falta un plan pago de Claude. No muestres tu valor hora ni la cuenta.\n7. **Próximo paso**: qué tiene que hacer para arrancar (por ejemplo, responder \"acepto\" y pagar la primera parte) y hasta cuándo vale.\n\n## Reglas\n\n- Que entre en una página: máximo unas 350 palabras. Si te pasas, recorta las secciones 1 y 2 primero.\n- Nada de promesas de ahorro, ventas, tiempo o \"resultados\".\n- Nada de palabras técnicas sin explicar (RAG, MCP, API). Di \"conectado a tu Gmail\", no \"conector OAuth\".\n- No inventes datos del negocio que no estén en el resumen.\n- Tono: claro, cercano, con voseo.\n\n## Qué entregas\n\n1. La propuesta lista para copiar.\n2. Debajo, separado: \"Para revisar antes de mandar\", con los [COMPLETAR] que quedaron y cualquier frase que hayas tenido que suponer.\n"}, {"archivo": "plantilla-propuesta-instalacion-claude.md", "que_es": "La propuesta de una página completa, con ejemplos de cómo escribir cada pieza en el idioma del cliente, para copiar a un documento y completar.", "contenido": "# Propuesta: asistente con Claude para [NEGOCIO]\n\nPreparada para: [NOMBRE DE QUIEN DECIDE] | Fecha: [FECHA] | Válida hasta: [FECHA]\n\n## Lo que nos contaste\n\n[DOS O TRES LÍNEAS CON SUS PALABRAS. Ejemplo: \"Los presupuestos de obra se arman copiando de la planilla de precios a un documento, uno por uno, y las mismas tres preguntas llegan todos los días por WhatsApp y mail\".]\n\n## Lo que vamos a dejar instalado\n\n- **Proyecto \"[NOMBRE]\"**: Claude conoce tus precios, tus servicios y tus reglas. Responde con tus datos, no con datos de internet.\n- **Skill de marca**: escribe como habla [NEGOCIO].\n- **Skill de presupuestos**: arma el borrador de [TIPO DE PRESUPUESTO] con tu lista de precios. Lo revisas y lo mandas tú.\n- **Skill de respuestas**: prepara respuestas a [LAS PREGUNTAS FRECUENTES QUE SURGIERON].\n- **Conexión con Gmail, Google Calendar y Google Drive**: Claude busca mails, arma borradores y lee tus planillas. Pide permiso antes de mandar o mover algo.\n- **Automatización**: [QUÉ HACE, CUÁNDO CORRE Y QUÉ DEJA. Ejemplo: \"de lunes a viernes a primera hora, un resumen de los pedidos de presupuesto sin responder\"].\n- **Capacitación de 30 minutos** con [QUIÉNES], video grabado y documento de entrega.\n\n## Lo que no incluye\n\n- Claude no atiende solo a tus clientes ni manda nada sin que una persona lo revise.\n- [LISTA DEL MÓDULO 1 AJUSTADA. Ejemplo: no incluye ordenar o cargar precios que no estén escritos; eso se cotiza aparte.]\n- Desarrollos a medida o conexión con sistemas que no estén en esta lista.\n\n## Lo que necesitamos de ti\n\n- [DOCUMENTOS: lista de precios al día en Google Drive, preguntas frecuentes, dos o tres presupuestos reales recientes].\n- [ACCESOS: que inicies sesión tú en Claude y en Google mientras compartimos pantalla].\n- Una persona disponible [CUÁNTO TIEMPO] durante la semana de prueba.\n- Todo esto antes del [FECHA].\n\n## Plazos\n\n- Inicio: [FECHA], cuando recibimos lo de arriba.\n- Instalación y pruebas con casos reales: [FECHAS].\n- Capacitación: [FECHA Y HORA].\n- Entrega: [FECHA].\n\n## Precio\n\n- **Instalación**: [MONTO Y MONEDA], precio cerrado por el alcance de arriba. Forma de pago: [EJEMPLO: una parte al arrancar y el resto al entregar].\n- **Mantenimiento mensual (opcional)**: [MONTO Y MONEDA] por mes. Incluye [QUÉ INCLUYE: revisión, ajustes de documentos y skills, un reporte corto].\n- **Suscripciones a tu nombre (las pagas tú, aparte)**: plan de Claude [PLAN] y [OTRAS]. La automatización necesita un plan pago de Claude.\n- Cualquier cosa fuera del alcance se cotiza aparte antes de hacerla.\n\n## Próximo paso\n\nSi te sirve, responde \"acepto\" a este mensaje y coordinamos [PRIMER PAGO / PRIMERA SESIÓN]. Esta propuesta vale hasta el [FECHA].\n\n[TU NOMBRE] | [CONTACTO]\n"}, {"archivo": "hoja-de-calculo-precio-instalacion.md", "que_es": "Las tablas para calcular tu valor hora, las horas de instalación y de mantenimiento tarea por tarea, con las fórmulas para Google Sheets y qué hacer después de cada instalación.", "contenido": "# Hoja de cálculo de precio: instalación y mensual\n\nPara completar con tus horas reales. Ninguna cifra de aquí es un precio sugerido: los números los pones tú.\n\n## 1. Tu valor hora\n\n| Dato | Tu número |\n|---|---|\n| Lo que necesitas ganar por mes con este trabajo | [MONTO] |\n| Horas que de verdad puedes cobrar por mes (no las que trabajas) | [HORAS] |\n| Valor hora = monto ÷ horas cobrables | [RESULTADO] |\n\n## 2. Horas de instalación, por tarea\n\n| Tarea | Horas estimadas | Horas reales (completa al terminar) |\n|---|---|---|\n| Diagnóstico y propuesta | | |\n| Pedir, revisar y limpiar documentos | | |\n| Proyecto e instrucciones | | |\n| Skill de marca | | |\n| Skill de presupuestos | | |\n| Skill de respuestas | | |\n| Conectores (Gmail, Calendar, Drive) | | |\n| Automatización y su primera corrida | | |\n| Pruebas con casos reales y ajustes | | |\n| Capacitación de 30 minutos y video | | |\n| Documento de entrega | | |\n| Viajes, si los hay | | |\n| **Total** | | |\n\nInstalación = total de horas estimadas × valor hora × 1,3\n\n## 3. Horas de mantenimiento por mes\n\n| Tarea | Horas por mes |\n|---|---|\n| Revisar cómo se está usando y corregir resultados | |\n| Actualizar documentos o skills | |\n| Reporte corto al dueño | |\n| Respuestas a consultas del equipo | |\n| **Total** | |\n\nMensual = total de horas por mes × valor hora\n\n## 4. Si lo armas en Google Sheets\n\nPon el valor hora en la celda B1, las horas de instalación de B4 a B15 y las de mantenimiento de B19 a B22. Si tu planilla muestra las funciones en español y usa coma decimal (lo habitual con la configuración regional de Argentina):\n\n- Total de horas de instalación: =SUMA(B4:B15)\n- Instalación: =SUMA(B4:B15)*B1*1,3\n- Mensual: =SUMA(B19:B22)*B1\n\nSi tu planilla usa las funciones en inglés y punto decimal, es =SUM(B4:B15)*B1*1.3. Si una fórmula da error, prueba la otra forma: depende de la configuración regional y del idioma de las funciones de esa planilla.\n\n## 5. Después de cada instalación\n\n- Completa la columna de horas reales.\n- Si el total real se pasó del estimado, mira en qué tarea. Esa tarea es la que tienes que estimar distinto la próxima vez.\n- Después de dos o tres instalaciones, fija el precio cerrado del paquete base con tus horas reales.\n- Si el cliente cambió el alcance a mitad de camino, eso es un extra: cotízalo aparte y por escrito antes de hacerlo.\n\n## 6. Si el número no entra en el presupuesto del cliente\n\nNo bajes el valor hora. Saca algo del alcance y escríbelo en la propuesta:\n- Dos skills en lugar de tres.\n- Sin automatización en esta etapa.\n- Capacitación para una sola persona.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

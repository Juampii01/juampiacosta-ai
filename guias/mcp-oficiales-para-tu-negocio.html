<script>var GUIA = {"slug": "mcp-oficiales-para-tu-negocio", "t": "MCP oficiales para tu negocio: ventas, contenido y operaciones", "d": "Un recorrido por servidores MCP oficiales que verificamos en la doc de cada empresa, agrupados por uso y con un prompt de ejemplo para cada uno.", "tema": "Claude", "min": 9, "ficha": [["Qué es", "Un mapa de MCP oficiales de empresas conocidas, con para qué sirve cada uno."], ["Necesitás", "Claude Code o la app de Claude, y una cuenta en la herramienta que quieras conectar."], ["Cuánto cuesta", "Depende de cada herramienta y de tu plan de Claude. Revisá la doc oficial de cada una."], ["Qué no hace", "No reemplaza la revisión de permisos: leé la guía de cómo revisar un MCP antes de instalarlo."]], "fichaNombre": "MCP oficiales", "secciones": [{"h": "Cómo conectar cualquiera de estos", "p": ["En Claude Code casi todos se agregan con un comando del tipo claude mcp add --transport http, el nombre y la URL oficial. Después abrís Claude Code, escribís /mcp y terminás de iniciar sesión.", "En la app de Claude se suman desde Configuración, en Conectores. Algunos están en el directorio y otros se agregan como conector personalizado con su URL. Los conectores personalizados están disponibles en los planes pagos."], "pasos": ["Copiá el comando de la ficha de la herramienta (siempre sale de la doc oficial).", "Pegalo en la terminal, dentro de la carpeta de tu proyecto.", "Abrí Claude Code y escribí /mcp para autorizar.", "Probá con un pedido de solo lectura antes de pedirle que cambie algo."]}, {"h": "Ventas y cobros", "lista": ["HubSpot: ve, crea y actualiza contactos, negocios y tickets, pero no borra. Se conecta desde Conectores en la app de Claude.", "Stripe: consulta clientes, pagos, suscripciones y facturas. Algunas acciones, como un reembolso, te piden confirmación en el panel de Stripe.", "Mercado Pago: busca en su documentación y te ayuda a manejar tus aplicaciones e integraciones de cobro."], "prompts": [{"t": "HubSpot: preparar una llamada", "c": "Buscá en HubSpot todo lo que tenemos sobre [EMPRESA O CONTACTO]: últimos mails, notas, negocios abiertos y en qué etapa están. Armame un resumen de 5 puntos para una llamada de 15 minutos y 3 preguntas para hacerle."}, {"t": "Stripe: revisar la semana", "c": "Usando Stripe, listame los pagos fallidos y las suscripciones canceladas de los últimos 7 días. Agrupalos por cliente y decime a quién conviene escribirle primero. No hagas ningún cambio."}, {"t": "Mercado Pago: entender una integración", "c": "Usando el MCP de Mercado Pago, buscá en la documentación cómo cobrar con [CHECKOUT PRO / SUSCRIPCIONES / LO QUE NECESITES] desde mi web y explicámelo en pasos simples, como si no supiera programar."}]}, {"h": "Contenido y diseño", "lista": ["Canva: crea, edita, adapta tamaños y revisa diseños en tu cuenta.", "Figma: lee tus archivos de diseño para pasarlos a código con Claude Code.", "Notion: lee y actualiza las páginas y bases a las que tenés acceso."], "prompts": [{"t": "Canva: piezas para redes", "c": "En Canva, creá 3 diseños para un carrusel de Instagram sobre [TEMA]. Usá estos textos: [TEXTO 1], [TEXTO 2], [TEXTO 3]. Mantené los colores de mi marca y mostrame los diseños antes de exportarlos."}, {"t": "Figma: de diseño a página", "c": "Tomá el diseño de este link de Figma: [LINK]. Decime qué secciones y componentes ves, y después armá la página respetando colores, tipografías y espacios."}, {"t": "Notion: ordenar ideas", "c": "Buscá en mi Notion la página [NOMBRE DE LA PÁGINA] con ideas de contenido. Agrupalas por tema, marcá las repetidas y proponeme un calendario de 2 semanas. Antes de editar algo en Notion, mostrame el cambio."}]}, {"h": "Operaciones y automatización", "lista": ["Zapier: le da a Claude las acciones de las apps que tenés conectadas en Zapier. Cada acción consume tareas de tu plan.", "n8n: tu propia instancia de n8n trae un servidor MCP. Lo activás en la configuración y conectás Claude con la URL que te muestra.", "Linear: crea y ordena issues y proyectos.", "Atlassian: trabaja con Jira y Confluence respetando tus permisos. Su uso consume créditos de Rovo."], "prompts": [{"t": "Zapier: avisar sin abrir otra app", "c": "Con Zapier, mandá un mensaje a [CANAL O PERSONA] que diga: [MENSAJE]. Antes de enviarlo, mostrame cómo queda y qué acción de Zapier vas a usar."}, {"t": "n8n: revisar un flujo", "c": "Listame los flujos de n8n que tengo disponibles y explicame en una línea qué hace cada uno. Después decime cuál serviría para [TAREA QUE QUERÉS AUTOMATIZAR]."}, {"t": "Linear: cargar tareas de una reunión", "c": "Te paso las notas de la reunión: [NOTAS]. Sacá las tareas concretas, proponé un responsable y una prioridad para cada una, y cuando te diga que sí, crealas en Linear en el proyecto [PROYECTO]."}, {"t": "Jira y Confluence: estado del proyecto", "c": "Buscá en Jira los tickets abiertos del proyecto [PROYECTO] y en Confluence la página de [DOCUMENTO]. Armame un resumen del estado para mandarle a [PERSONA], en 6 líneas como máximo."}]}, {"h": "Si tenés una app o una web", "lista": ["Supabase: consulta tu base de datos y los registros de tu proyecto. Su doc recomienda limitarlo a un proyecto y usar solo lectura cuando alcance.", "GitHub: ve repositorios, crea issues y revisa pull requests.", "Vercel: maneja proyectos y despliegues, lee registros y muestra estadísticas de visitas."], "prompts": [{"t": "Supabase: una pregunta de negocio", "c": "Usando Supabase en modo solo lectura, contame cuántos usuarios nuevos se registraron por semana en el último mes en mi proyecto [PROYECTO]. Mostrame la consulta que usaste."}, {"t": "GitHub: qué cambió", "c": "En mi repositorio [DUEÑO/REPO], listame los issues abiertos y los pull requests de esta semana. Explicámelos en palabras simples, sin jerga técnica."}, {"t": "Vercel: por qué falló", "c": "Revisá en Vercel el último despliegue de mi proyecto [PROYECTO]. Si falló, leé los registros y explicame la causa y el arreglo más simple. No despliegues nada sin preguntarme."}], "aviso": "Con estos tres, empezá en un entorno de prueba. Un cambio mal hecho acá puede dejar tu web o tu app sin andar."}], "faq": [{"q": "¿Cómo sé si un MCP es oficial?", "a": "Buscá la URL o el comando en la documentación de la propia empresa. Todos los de esta guía salen de la doc oficial de cada marca, enlazada en las fichas."}, {"q": "¿Los puedo usar en la app de Claude o solo en Claude Code?", "a": "Muchos funcionan en los dos. En la app se agregan desde Configuración, en Conectores; en Claude Code, con claude mcp add. Cada ficha dice dónde lo verificamos."}, {"q": "¿Conecto todos de una?", "a": "No conviene. Sumá de a uno, el que más tiempo te ahorre, y probalo con pedidos de solo lectura antes de pasar al siguiente."}], "fuentes": ["https://code.claude.com/docs/en/mcp", "https://knowledge.hubspot.com/integrations/set-up-and-use-the-hubspot-connector-for-claude", "https://docs.stripe.com/mcp", "https://www.mercadopago.com.uy/developers/es/docs/mcp-server/connection.md", "https://www.canva.dev/docs/connect/canva-mcp-server-setup", "https://help.figma.com/hc/en-us/articles/39888612464151-Claude-Code-and-Figma-Set-up-the-MCP-server", "https://developers.notion.com/guides/mcp/get-started-with-mcp.md", "https://docs.zapier.com/mcp/get-started/connect/claude-code.md", "https://docs.n8n.io/connect/connect-to-n8n-mcp-server/mcp-client-examples", "https://linear.app/docs/mcp", "https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/", "https://supabase.com/docs/guides/mcp", "https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-claude.md", "https://vercel.com/docs/ai-tooling/vercel-mcp"]};</script>

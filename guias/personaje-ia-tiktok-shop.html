<script>var GUIA = {"slug": "personaje-ia-tiktok-shop", "t": "Un personaje de IA para vender en TikTok Shop: prompts y herramientas", "d": "Diseña con Claude un personaje que no existe, ponlo a copiar los movimientos de un video de referencia (gratis con WanGP en tu computadora, o con Higgsfield y Kling) y muestra productos como afiliado de TikTok Shop.", "tema": "Contenido y redes", "min": 10, "ficha": [["Qué es", "Diseñar un personaje de IA, ponerlo en videos copiando cada movimiento y mostrar productos como afiliado de TikTok Shop."], ["Necesitas", "Claude para el personaje y WanGP en tu computadora con placa de video (o Higgsfield y Kling si no tienes)."], ["Cuánto cuesta", "WanGP es gratis para usar en tu computadora; Higgsfield y Kling gastan créditos, y Higgsfield desde Claude además pide una suscripción paga."], ["Ojo", "Etiqueta los videos como IA, no uses la cara ni los videos de otra persona sin permiso. Requisitos y comisiones cambian según el país."], ["Repo", "github.com/deepbeepmeep/Wan2GP"]], "secciones": [{"h": "El sistema en 5 pasos", "pasos": ["Diseña un personaje que no existe.", "Ponlo en un video de referencia, copiando cada movimiento.", "Publica seguido, varias veces por día.", "Dale un producto para mostrar.", "Si TikTok Shop funciona en tu país, cobras una comisión por cada venta como afiliado."], "aviso": "Los seguidores, vistas y ventas que muestran otras cuentas son casos puntuales, no una promesa. Muchas cuentas no venden nada: lo difícil es la constancia y elegir bien el producto."}, {"h": "1. Diseña tu personaje con Claude", "prompts": [{"t": "El personaje", "c": "Diséñame un personaje para TikTok que no existe y que se recuerde en un segundo. Nicho: [NICHO o PRODUCTOS QUE QUIERO VENDER]. Dame: nombre, edad, aspecto (pelo, ropa, rasgos exagerados pero creíbles), personalidad, forma de hablar y 3 frases típicas. Que no se parezca a ninguna persona real."}, {"t": "Su hoja de referencia", "c": "Escribe el prompt para un generador de imágenes que cree la hoja de personaje: fondo gris de estudio, cuerpo entero de frente, de costado y de espaldas, y tres primeros planos de la cara con expresiones distintas. Misma ropa y mismo pelo en todas."}], "p": ["Genera esa hoja con el modelo de imágenes que prefieras (el de ChatGPT, Gemini o el que traiga tu app de video). Va a ser la referencia para que la cara no cambie de un video a otro."]}, {"h": "2. La app: WanGP, gratis en tu computadora", "p": ["WanGP (antes Wan2GP) es un estudio de video con IA que se instala en tu computadora y se usa gratis. Trae modelos para animar y reemplazar personajes, como Wan 2.2 Animate 2, que toma los movimientos, gestos y cámara de un video de referencia y se los pasa a tu personaje, y SCAIL-2, que tiene un modo para reemplazar a la persona de un video. Como corre en tu equipo no gasta créditos: el límite lo pone tu placa de video."], "lista": ["Repositorio: <a href=\"https://github.com/deepbeepmeep/Wan2GP\" target=\"_blank\" rel=\"noopener\">github.com/deepbeepmeep/Wan2GP ↗<\/a>", "Placa de video: NVIDIA (desde las GTX 10XX) o AMD reciente (RDNA 2, 3 o 4). Según su README, algunos modelos andan con 4 GB de VRAM y con 8 GB ya puedes arrancar.", "Instalación: hay scripts de instalación para Windows y Linux, instaladores de un clic (Pinokio) y, en Windows, WanGP Manager, una app experimental que elige el perfil recomendado para tu placa e instala todo.", "Licencia: WanGP Community License. Puedes usarlo gratis y vender lo que generas, pero no revender el programa. Si vendes directamente un video hecho con WanGP, piden que les des crédito."], "pasos": ["Elige un video corto con una sola persona, cámara quieta y buena luz. Lo mejor es grabarlo tú.", "En WanGP, entra a los modelos de animación y reemplazo de personajes (por ejemplo Wan 2.2 Animate 2) y sube el video y la imagen de tu personaje.", "Si quieres que tu personaje ocupe el lugar de la persona, usa un modelo de reemplazo y no solo uno que anime la imagen: SCAIL-2 tiene un modo de reemplazo que cambia a la persona de un video existente, y Viggle Animate lo hace a partir de un cuadro del video donde ya pusiste a tu personaje con un editor de imágenes.", "Prueba primero en baja resolución y con pocos segundos; cuando salga bien, genera la versión final.", "Revisa manos, cara y ropa antes de publicar."], "prompts": [{"t": "Que Claude te lo instale", "c": "Quiero instalar WanGP (github.com/deepbeepmeep/Wan2GP) en mi computadora con [PLACA DE VIDEO Y VRAM] y [WINDOWS/LINUX]. Guiame paso a paso según su guía de instalación, dime qué perfil de memoria elegir y cómo abrir el modelo de reemplazo de personajes para poner a mi personaje en lugar de la persona de un video."}], "aviso": "Usa el video de referencia solo para copiar el movimiento, y si puedes grábalo tú. Meter tu personaje en el video de otra persona sin permiso puede violar los derechos de autor del video y la imagen de esa persona. Tampoco uses su audio."}, {"h": "Alternativas sin placa de video", "lista": ["Higgsfield: se usa desde el navegador o desde Claude con su conector. En Claude: Customize → Connectors, el botón + Add y después Add custom connector, con la dirección https://mcp.higgsfield.ai/mcp; al conectar, inicias sesión con tu cuenta de Higgsfield. Para usarlo desde Claude necesitas una suscripción paga de Higgsfield, y en el plan gratis de Claude puedes tener un solo conector personalizado. Por el conector tienes Kling Motion Control para copiar movimientos y personajes que se mantienen iguales (Soul characters). Cada generación por el conector gasta créditos, sin importar tu plan: pídele a Claude que te muestre el costo antes de cada una.", "Kling: su Motion Control copia los gestos de un video de referencia sobre tu personaje. Funciona con créditos; revisa en su web qué incluye cada plan."], "prompts": [{"t": "Elegir herramienta", "c": "Tengo [COMPUTADORA CON/SIN PLACA DE VIDEO] y quiero hacer [N] videos por día con mi personaje copiando movimientos de videos de referencia. Compara WanGP, Higgsfield y Kling para mi caso: costo, tiempo por video, calidad y límites."}]}, {"h": "3. Publica todos los días", "prompts": [{"t": "Plan de publicación", "c": "Ármame un plan de 7 días para la cuenta de mi personaje [NOMBRE]: de 3 a 5 videos por día, qué tendencias o formatos usar cada día, texto en pantalla y una descripción corta para cada uno. Mantén siempre su personalidad."}], "aviso": "Etiqueta los videos como contenido generado con IA (TikTok tiene un interruptor para eso). Lo pide para personas o escenas realistas hechas con IA, y puede borrar o limitar los posts que no lo hagan."}, {"h": "4. Dale un producto", "prompts": [{"t": "Pitch de 18 segundos", "c": "Escribe un guion de 18 segundos en el que mi personaje [NOMBRE, PERSONALIDAD] muestra [PRODUCTO]: gancho en los 2 primeros segundos, un beneficio concreto, una demostración y la invitación a comprarlo en el carrito naranja. Con su forma de hablar. Sin promesas falsas ni testimonios inventados."}], "aviso": "Muestra solo lo que el producto hace de verdad. Si tu personaje lo recomienda, no inventes que lo usó una persona real."}, {"h": "5. Afiliado de TikTok Shop", "pasos": ["Fíjate si TikTok Shop está disponible en tu país y cuáles son los requisitos del programa de afiliados (edad, seguidores, tipo de cuenta).", "Activa el programa de afiliados desde tu perfil o el Centro de Creadores.", "En el mercado de afiliados, elige productos que tengan que ver con tu personaje, con buenas reseñas y una comisión clara.", "Suma el producto a tu vidriera y enlázalo en el video.", "Publica varios videos del mismo producto con ganchos distintos y fíjate cuál vende."], "aviso": "Los requisitos y las comisiones cambian según el país y la categoría: revisa siempre la página oficial de TikTok Shop. Lo que ganes como afiliado puede tener que declararse como ingreso."}], "faq": [{"q": "¿De verdad es gratis?", "a": "WanGP es gratis para usar en tu computadora si tienes placa de video; solo pagas la luz y tu tiempo. Higgsfield y Kling gastan créditos."}, {"q": "¿Puedo usar la cara de un famoso?", "a": "No. Crea un personaje propio: usar la imagen de otra persona sin permiso puede ser ilegal y te pueden cerrar la cuenta."}, {"q": "¿Cuánto se gana?", "a": "Nadie te lo puede asegurar. Depende del producto, la constancia y el alcance; las cifras que circulan son de cuentas puntuales, no un promedio."}], "usos": [{"e": "Personaje", "c": "azul", "t": "Diseñado con Claude", "d": "Alguien que no existe, con su hoja de referencia."}, {"e": "Video", "c": "rosa", "t": "Copiando movimientos", "d": "Tu personaje haciendo los gestos de un video de referencia."}, {"e": "Producto", "c": "naranja", "t": "Un pitch de 18 segundos", "d": "Para mostrar lo que vende."}, {"e": "Comisión", "c": "verde", "t": "TikTok Shop", "d": "Cobras por cada venta como afiliado, donde esté disponible."}], "fuentes": ["https://github.com/deepbeepmeep/Wan2GP", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/MODELS.md", "https://raw.githubusercontent.com/deepbeepmeep/Wan2GP/HEAD/LICENSE.txt", "https://higgsfield.ai/blog/Generate-AI-Videos-From-Claude-with-Higgsfield-MCP", "https://blog.hootsuite.com/ai-disclosure-policy-for-tiktok/", "https://support.claude.com/en/articles/11175166", "https://higgsfield.ai/creator-hub/help-center/mcp-cli/how-do-i-connect-higgsfield-to-claude", "https://higgsfield.ai/enterprise-help-center/platform/integrations", "https://support.tiktok.com/en/using-tiktok/creating-videos/ai-generated-content", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/TROUBLESHOOTING.md"], "ejemplo": {"titulo": "Ejemplo resuelto: un personaje de IA que muestra accesorios de cocina", "negocio": "Ejemplo inventado: un estudiante de diseño de Guadalajara, Jalisco, México, que arma una cuenta de TikTok como afiliado mientras estudia. Trabaja solo, desde su computadora con una placa NVIDIA de 12 GB de VRAM.", "punto_de_partida": "Quiere mostrar accesorios de cocina de TikTok Shop sin salir él en cámara. Vio cuentas con personajes de IA, pero no sabe por dónde empezar ni quiere gastar en créditos todavía.", "pasos": ["Con el prompt \"El personaje\" diseñó a Doña Chela: una abuela de pelo corto plateado, delantal de cuadros verdes, anteojos redondos y una forma de hablar con dichos de cocina. Completó la hoja de personaje del kit y revisó que no se pareciera a nadie conocido.", "Con el prompt de la hoja de referencia generó la hoja de personaje en un generador de imágenes y eligió una imagen de frente como referencia principal.", "Instaló WanGP con el script de Windows siguiendo el prompt de instalación guiada.", "Se grabó a sí mismo con el celular en un trípode: cámara quieta, buena luz, mostrando un rallador con las manos durante unos segundos.", "En WanGP probó primero Wan 2.2 Animate 2 con su video y la imagen de Doña Chela, en baja resolución y pocos segundos. Como quería que ella ocupara su lugar en la escena, probó después el modo de reemplazo de SCAIL-2 y se quedó con el que mejor mantenía las manos y el producto.", "Confirmó en la página oficial de TikTok Shop que el programa de afiliados funcionaba en México y qué requisitos pedía para su cuenta antes de activarlo.", "Eligió un rallador del mercado de afiliados, copió la ficha del producto y, con la skill guion-tiktok-shop-personaje, pidió tres guiones de 18 segundos. Ninguno decía que Doña Chela lo usaba hace años y el precio quedó para el carrito.", "Grabó la voz con un generador de voces de IA (sin clonar a nadie), la unió con el video y pasó el checklist del kit: etiqueta de contenido generado con IA activada, producto enlazado y descripción fiel.", "Publicó los tres videos en días distintos con ganchos distintos y anotó en la planilla cuál anduvo mejor."], "resultado": "Tiene un personaje propio que se mantiene igual entre videos, un proceso para pasarlo de un video grabado por él a un pitch de producto y un checklist que evita los errores que más bajan cuentas: no etiquetar la IA, inventar testimonios o usar videos de otros. Si vende o no depende del producto y de la constancia, no del sistema."}, "si_falla": [{"sintoma": "La cara o la ropa del personaje cambia de un video a otro.", "solucion": "Usa siempre la misma imagen de referencia (la principal de la hoja de personaje), copia el bloque de aspecto igual en cada prompt y elige ropa y accesorios fáciles de reconocer. En Higgsfield, usa un Soul character y nómbralo igual en cada pedido."}, {"sintoma": "El reemplazo sale con manos deformes, el producto se derrite o el personaje tiembla.", "solucion": "Vuelve a grabar la referencia: una sola persona, cámara quieta, buena luz, movimientos lentos y el producto bien visible. Prueba en baja resolución y con pocos segundos, y si un modelo no anda, prueba el otro (Wan 2.2 Animate 2 para animar, SCAIL-2 en modo reemplazo)."}, {"sintoma": "WanGP se corta por falta de memoria de la placa (CUDA out of memory).", "solucion": "Baja resolución y duración. La guía de problemas de WanGP propone un perfil de memoria más ahorrativo (python wgp.py --profile 4) y, si lo que se acaba es la RAM, el perfil 5. Cierra juegos y otros programas que usen la placa."}, {"sintoma": "En Claude, el conector de Higgsfield no aparece o no deja generar.", "solucion": "Revisa que lo agregaste en Customize → Connectors con la dirección https://mcp.higgsfield.ai/mcp, que iniciaste sesión con tu cuenta de Higgsfield y que tienes una suscripción paga y créditos. En el plan gratis de Claude solo puedes tener un conector personalizado: si ya tienes otro, no vas a poder sumar este. Para probar la conexión, pregúntale a Claude cuál es tu saldo de créditos de Higgsfield."}, {"sintoma": "TikTok limita el alcance del video, le pone una etiqueta de IA o lo saca.", "solucion": "Activa tú la etiqueta de contenido generado con IA antes de publicar. Revisa que el video no use la imagen, la voz ni el video de otra persona. Para videos de TikTok Shop, revisa también las reglas de calidad de TikTok Shop de tu país, que pueden poner condiciones extra a las voces de IA o al contenido sin movimiento."}], "kit": [{"archivo": "guion-tiktok-shop-personaje/SKILL.md", "que_es": "Skill que escribe tres guiones cortos por producto con la voz del personaje, solo con datos de la ficha real, sin testimonios inventados y con el recordatorio de la etiqueta de IA. Guárdala en una carpeta guion-tiktok-shop-personaje, comprímela en ZIP y súbela a Claude.", "contenido": "---\nname: guion-tiktok-shop-personaje\ndescription: 'Escribe guiones cortos para que un personaje de IA muestre un producto de TikTok Shop como afiliado, solo con datos reales y sin testimonios inventados. Úsala al pedir pitch, ganchos o variantes.'\n---\n\n# Guion de TikTok Shop para un personaje de IA\n\nEscribes guiones que venden mostrando lo que el producto hace de verdad. El personaje es de IA y no finge ser una persona real que usó el producto.\n\n## Qué necesitas antes de escribir\n\n1. La HOJA DE PERSONAJE (nombre, personalidad, forma de hablar, frases típicas). Si no está, pídela.\n2. La FICHA DEL PRODUCTO, copiada de la página del producto en TikTok Shop: nombre, qué hace, medidas o contenido, qué incluye, para quién es.\n3. Qué se va a ver en el video: el producto real filmado, imágenes del vendedor o solo el personaje.\n4. La duración (si no la dicen, 15 a 20 segundos).\n\nSi falta la ficha del producto, no escribas: sin datos reales no hay guion.\n\n## Reglas que no se rompen\n\n- Solo afirmaciones que estén en la ficha del producto. Nada de \"el mejor\", \"cura\", \"garantizado\", \"resultados en X días\" ni comparaciones con otras marcas.\n- El personaje no dice que usó el producto durante semanas ni cuenta experiencias propias: es un personaje de IA. Puede decir \"mira lo que hace\", \"esto trae\", \"fíjate\".\n- Nada de testimonios, reseñas ni cifras de ventas inventadas.\n- Precio, descuentos y envíos: no los pongas en el guion (cambian). Manda a ver el precio en el carrito.\n- Productos de salud, suplementos, cosmética con promesas médicas, finanzas o categorías sensibles: avisa que hay que revisar las reglas de TikTok Shop para esa categoría antes de publicar.\n- Siempre al final, en NOTAS: \"Activar la etiqueta de contenido generado con IA al publicar.\"\n\n## Estructura de cada guion\n\n| Tramo | Tiempo | Qué va |\n|---|---|---|\n| Gancho | primeros 2 s | Algo que se ve o se dice y frena el dedo, con la personalidad del personaje |\n| Beneficio | hasta 6 s | Un beneficio concreto, sacado de la ficha |\n| Demostración | hasta 14 s | El producto haciendo eso, en imagen (no solo contado) |\n| Invitación | hasta el final | Ver el producto en el carrito naranja, con una frase típica del personaje |\n\n## Qué entregas\n\n1. Tres guiones con ganchos distintos y el mismo producto.\n2. Para cada uno: texto hablado, texto en pantalla y qué se tiene que ver en cada tramo.\n3. Una descripción corta para el posteo.\n4. NOTAS: qué datos confirmar en la ficha y el recordatorio de la etiqueta de IA.\n"}, {"archivo": "hoja-de-personaje-ia-tiktok.md", "que_es": "Plantilla para dejar fijo al personaje: identidad, aspecto, bloque para copiar en cada prompt, hoja de referencia, chequeo de que no copia a nadie y la configuración que te funcionó.", "contenido": "# Hoja de personaje de IA\n\nComplétala con Claude (prompt \"El personaje\" de la guía) y guárdala. La pegas en cada pedido de guiones o de imágenes para que el personaje no cambie.\n\n## Identidad\n\n- Nombre: [NOMBRE]\n- Edad que aparenta: [EDAD]\n- Nicho y productos que muestra: [NICHO]\n- Personalidad en tres palabras: [PALABRA, PALABRA, PALABRA]\n- Forma de hablar: [ritmo, muletillas, voseo o no]\n- Frases típicas:\n  1. [FRASE]\n  2. [FRASE]\n  3. [FRASE]\n- Lo que nunca dice o hace: [por ejemplo no promete resultados, no habla de política]\n\n## Aspecto fijo\n\n- Pelo: [color, largo, peinado]\n- Cara: [rasgos que lo hacen reconocible, sin parecerse a nadie real]\n- Ropa de siempre: [prenda y color que se repite]\n- Accesorio de firma: [anteojos, gorra, aros]\n\n**Bloque de aspecto** (se copia igual en cada prompt de imagen o video):\n[Ejemplo: a woman in her 30s with short curly pink hair, round yellow glasses, freckles, oversized denim jacket]\n\n## Hoja de referencia\n\n- Archivo de la hoja (frente, costado, espalda y 3 caras): [NOMBRE DEL ARCHIVO]\n- Herramienta con la que se generó: [HERRAMIENTA]\n- Imagen principal que se usa en WanGP, Higgsfield o Kling: [NOMBRE DEL ARCHIVO]\n\n## Chequeo de que no copia a nadie\n\n- [ ] No se parece a una persona famosa ni a alguien que conozco.\n- [ ] No usa el nombre, el logo ni el estilo registrado de otra cuenta o marca.\n- [ ] La voz (si tiene) es de IA sin clonar a nadie, o es la mía.\n\n## Configuración que funcionó\n\n| Herramienta | Modelo o modo | Resolución | Duración | Notas |\n|---|---|---|---|---|\n| [WanGP] | [Wan 2.2 Animate 2 / SCAIL-2] | | | |\n"}, {"archivo": "checklist-video-personaje-tiktok-shop.md", "que_es": "Checklist por video: video de referencia propio, generación, guion fiel al producto, etiqueta de IA y revisión de resultados.", "contenido": "# Checklist del video: referencia, generación y publicación\n\nUno por video. Si una casilla queda sin marcar, el video no sale.\n\n## 1. El video de referencia\n\n- [ ] Lo grabé yo (o es de alguien que me dio permiso por escrito).\n- [ ] Hay una sola persona, la cámara está quieta y hay buena luz.\n- [ ] Dura pocos segundos (lo justo para el pitch).\n- [ ] No uso el audio de otro video: la voz y la música las sumo yo.\n\n## 2. La generación\n\n- [ ] Usé la misma imagen de referencia del personaje que en los videos anteriores.\n- [ ] Probé primero en baja resolución y con pocos segundos.\n- [ ] Elige bien el modo: animar al personaje con los movimientos del video (por ejemplo Wan 2.2 Animate 2) o reemplazar a la persona del video (por ejemplo el modo de reemplazo de SCAIL-2).\n- [ ] Si usé Higgsfield o Kling, vi el costo en créditos antes de generar.\n- [ ] Revisé manos, cara, dientes, ropa y el producto cuadro por cuadro en los momentos clave.\n\n## 3. El guion y el producto\n\n- [ ] Todo lo que dice el personaje sobre el producto está en la ficha del producto.\n- [ ] No hay testimonios ni \"yo lo uso hace meses\".\n- [ ] El precio no está en el video (lo ven en el carrito).\n- [ ] El producto está agregado a mi vidriera y enlazado en el video.\n\n## 4. La publicación\n\n- [ ] Activé la etiqueta de contenido generado con IA al publicar.\n- [ ] La descripción dice lo que el video muestra.\n- [ ] Revisé las reglas de TikTok Shop de mi país para esa categoría de producto.\n- [ ] Anoté en mi planilla: producto, gancho usado, fecha y hora.\n\n## 5. A los dos o tres días\n\n- [ ] Miré qué gancho anduvo mejor con ese producto.\n- [ ] Decide: otro video del mismo producto con un gancho nuevo, o cambiar de producto.\n- [ ] Guardé lo que gané como afiliado en mi registro de ingresos.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

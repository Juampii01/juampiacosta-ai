<script>var GUIA = {"slug": "personaje-ia-tiktok-shop", "t": "Un personaje de IA para vender en TikTok Shop: prompts y herramientas", "d": "Diseñá con Claude un personaje que no existe, ponelo a copiar los movimientos de un video de referencia (gratis con WanGP en tu compu, o con Higgsfield y Kling) y mostrá productos como afiliado de TikTok Shop.", "tema": "Contenido y redes", "min": 10, "ficha": [["Qué es", "Diseñar un personaje de IA, ponerlo en videos copiando cada movimiento y mostrar productos como afiliado de TikTok Shop."], ["Necesitás", "Claude para el personaje y WanGP en tu compu con placa de video (o Higgsfield y Kling si no tenés)."], ["Cuánto cuesta", "WanGP es gratis para usar en tu compu; Higgsfield y Kling gastan créditos."], ["Ojo", "Etiquetá los videos como IA, no uses la cara ni los videos de otra persona sin permiso. Requisitos y comisiones cambian según el país."], ["Repo", "github.com/deepbeepmeep/Wan2GP"]], "secciones": [{"h": "El sistema en 5 pasos", "pasos": ["Diseñá un personaje que no existe.", "Ponelo en un video de referencia, copiando cada movimiento.", "Publicá seguido, varias veces por día.", "Dale un producto para mostrar.", "Si TikTok Shop funciona en tu país, cobrás una comisión por cada venta como afiliado."], "aviso": "Los seguidores, vistas y ventas que muestran otras cuentas son casos puntuales, no una promesa. Muchas cuentas no venden nada: lo difícil es la constancia y elegir bien el producto."}, {"h": "1. Diseñá tu personaje con Claude", "prompts": [{"t": "El personaje", "c": "Diseñame un personaje para TikTok que no existe y que se recuerde en un segundo. Nicho: [NICHO o PRODUCTOS QUE QUIERO VENDER]. Dame: nombre, edad, aspecto (pelo, ropa, rasgos exagerados pero creíbles), personalidad, forma de hablar y 3 frases típicas. Que no se parezca a ninguna persona real."}, {"t": "Su hoja de referencia", "c": "Escribí el prompt para un generador de imágenes que cree la hoja de personaje: fondo gris de estudio, cuerpo entero de frente, de costado y de espaldas, y tres primeros planos de la cara con expresiones distintas. Misma ropa y mismo pelo en todas."}], "p": ["Generá esa hoja con el modelo de imágenes que prefieras (el de ChatGPT, Gemini o el que traiga tu app de video). Va a ser la referencia para que la cara no cambie de un video a otro."]}, {"h": "2. La app: WanGP, gratis en tu compu", "p": ["WanGP (antes Wan2GP) es un estudio de video con IA que se instala en tu compu y se usa gratis. Trae modelos para animar y reemplazar personajes, como Wan 2.2 Animate 2, que toma los movimientos, gestos y cámara de un video de referencia y se los pasa a tu personaje, y SCAIL-2, que tiene un modo para reemplazar a la persona de un video. Como corre en tu equipo no gasta créditos: el límite lo pone tu placa de video."], "lista": ["Repositorio: <a href=\"https://github.com/deepbeepmeep/Wan2GP\" target=\"_blank\" rel=\"noopener\">github.com/deepbeepmeep/Wan2GP ↗<\/a>", "Placa de video: NVIDIA (desde las GTX 10XX) o AMD reciente (RDNA 2, 3 o 4). Según su README, algunos modelos andan con 4 GB de VRAM y con 8 GB ya podés arrancar.", "Instalación: hay scripts de instalación para Windows y Linux, instaladores de un clic (Pinokio) y, en Windows, WanGP Manager, una app experimental que elige el perfil recomendado para tu placa e instala todo.", "Licencia: WanGP Community License. Podés usarlo gratis y vender lo que generás, pero no revender el programa. Si vendés directamente un video hecho con WanGP, piden que les des crédito."], "pasos": ["Elegí un video corto con una sola persona, cámara quieta y buena luz. Lo mejor es grabarlo vos.", "En WanGP, entrá a los modelos de animación y reemplazo de personajes (por ejemplo Wan 2.2 Animate 2) y subí el video y la imagen de tu personaje.", "Si querés que tu personaje ocupe el lugar de la persona, elegí el modo de reemplazo (no solo animar la imagen).", "Probá primero en baja resolución y con pocos segundos; cuando salga bien, generá la versión final.", "Revisá manos, cara y ropa antes de publicar."], "prompts": [{"t": "Que Claude te lo instale", "c": "Quiero instalar WanGP (github.com/deepbeepmeep/Wan2GP) en mi compu con [PLACA DE VIDEO Y VRAM] y [WINDOWS/LINUX]. Guiame paso a paso según su guía de instalación, decime qué perfil de memoria elegir y cómo abrir el modelo de reemplazo de personajes para poner a mi personaje en lugar de la persona de un video."}], "aviso": "Usá el video de referencia solo para copiar el movimiento, y si podés grabalo vos. Meter tu personaje en el video de otra persona sin permiso puede violar los derechos de autor del video y la imagen de esa persona. Tampoco uses su audio."}, {"h": "Alternativas sin placa de video", "lista": ["Higgsfield: se usa desde el navegador o desde Claude con su conector (Personalizar → Conectores → agregar un conector personalizado con la dirección https://mcp.higgsfield.ai/mcp). Trae control de movimiento (Kling Motion Control y Motion Transfer de Genjutsu) y personajes que se mantienen iguales (Soul Character). Cada generación por el conector gasta créditos: pedile a Claude que te muestre el costo antes de cada una.", "Kling: su Motion Control copia los gestos de un video de referencia sobre tu personaje. Funciona con créditos; revisá en su web qué incluye cada plan."], "prompts": [{"t": "Elegir herramienta", "c": "Tengo [COMPU CON/SIN PLACA DE VIDEO] y quiero hacer [N] videos por día con mi personaje copiando movimientos de videos de referencia. Compará WanGP, Higgsfield y Kling para mi caso: costo, tiempo por video, calidad y límites."}]}, {"h": "3. Publicá todos los días", "prompts": [{"t": "Plan de publicación", "c": "Armame un plan de 7 días para la cuenta de mi personaje [NOMBRE]: de 3 a 5 videos por día, qué tendencias o formatos usar cada día, texto en pantalla y una descripción corta para cada uno. Mantené siempre su personalidad."}], "aviso": "Etiquetá los videos como contenido generado con IA (TikTok tiene un interruptor para eso). Lo pide para personas o escenas realistas hechas con IA, y puede borrar o limitar los posts que no lo hagan."}, {"h": "4. Dale un producto", "prompts": [{"t": "Pitch de 18 segundos", "c": "Escribí un guion de 18 segundos en el que mi personaje [NOMBRE, PERSONALIDAD] muestra [PRODUCTO]: gancho en los 2 primeros segundos, un beneficio concreto, una demostración y la invitación a comprarlo en el carrito naranja. Con su forma de hablar. Sin promesas falsas ni testimonios inventados."}], "aviso": "Mostrá solo lo que el producto hace de verdad. Si tu personaje lo recomienda, no inventes que lo usó una persona real."}, {"h": "5. Afiliado de TikTok Shop", "pasos": ["Fijate si TikTok Shop está disponible en tu país y cuáles son los requisitos del programa de afiliados (edad, seguidores, tipo de cuenta).", "Activá el programa de afiliados desde tu perfil o el Centro de Creadores.", "En el mercado de afiliados, elegí productos que tengan que ver con tu personaje, con buenas reseñas y una comisión clara.", "Sumá el producto a tu vidriera y enlazalo en el video.", "Publicá varios videos del mismo producto con ganchos distintos y fijate cuál vende."], "aviso": "Los requisitos y las comisiones cambian según el país y la categoría: revisá siempre la página oficial de TikTok Shop. Lo que ganes como afiliado puede tener que declararse como ingreso."}], "faq": [{"q": "¿De verdad es gratis?", "a": "WanGP es gratis para usar en tu compu si tenés placa de video; solo pagás la luz y tu tiempo. Higgsfield y Kling gastan créditos."}, {"q": "¿Puedo usar la cara de un famoso?", "a": "No. Creá un personaje propio: usar la imagen de otra persona sin permiso puede ser ilegal y te pueden cerrar la cuenta."}, {"q": "¿Cuánto se gana?", "a": "Nadie te lo puede asegurar. Depende del producto, la constancia y el alcance; las cifras que circulan son de cuentas puntuales, no un promedio."}], "usos": [{"e": "Personaje", "c": "azul", "t": "Diseñado con Claude", "d": "Alguien que no existe, con su hoja de referencia."}, {"e": "Video", "c": "rosa", "t": "Copiando movimientos", "d": "Tu personaje haciendo los gestos de un video de referencia."}, {"e": "Producto", "c": "naranja", "t": "Un pitch de 18 segundos", "d": "Para mostrar lo que vende."}, {"e": "Comisión", "c": "verde", "t": "TikTok Shop", "d": "Cobrás por cada venta como afiliado, donde esté disponible."}], "fuentes": ["https://github.com/deepbeepmeep/Wan2GP", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/MODELS.md", "https://raw.githubusercontent.com/deepbeepmeep/Wan2GP/HEAD/LICENSE.txt", "https://higgsfield.ai/blog/Generate-AI-Videos-From-Claude-with-Higgsfield-MCP", "https://blog.hootsuite.com/ai-disclosure-policy-for-tiktok/"], "cat": "contenido", "parte": "usalo"};</script>

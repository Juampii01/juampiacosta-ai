<script>var GUIA = {"slug": "sistema-ia-para-estudios-juridicos", "t": "Sistema con Claude para estudios jurídicos", "d": "Primera atención de consultas, borradores a partir de modelos propios, resúmenes de expedientes y comunicación con clientes, con el secreto profesional como regla número uno.", "tema": "Sistemas listos por rubro", "min": 10, "fichaNombre": "Estudios jurídicos", "ficha": [["Qué es", "Un asistente para la organización del estudio: ordenar consultas, preparar borradores desde modelos propios y comunicar avances."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No da consejo legal, no firma y no reemplaza la revisión del abogado en ningún escrito."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Primeras consultas: escuchar el caso, ver si el estudio lo toma y qué documentación pedir.", "Borradores repetidos: cartas, intimaciones y escritos que salen de un modelo y se adaptan.", "Resumir documentos largos para entender un caso rápido.", "Contarle al cliente en qué está su tema, en palabras simples.", "Agenda de audiencias, plazos y vencimientos.", "Ordenar mails y archivos por caso."]}, {"h": "El sistema", "lista": ["Proyecto \"Estudio\": áreas que atiende, honorarios, modelos propios del estudio (sin datos de clientes), checklist de documentación por tipo de caso y tono de comunicación.", "Skill de primera consulta: ordena lo que contó la persona en hechos, fechas, documentación que falta y preguntas para la entrevista. No opina sobre el caso.", "Skill de borrador desde modelo: completa un modelo del estudio con los datos que carga el abogado y marca todo lo que hay que revisar.", "Skill de novedades al cliente: convierte una nota técnica del abogado en un mensaje simple.", "Conectores: Google Calendar para plazos que carga el estudio, Gmail para borradores, Google Drive para modelos y carpetas.", "Automatización: una tarea programada que cada mañana lista los plazos y audiencias de los próximos días según el calendario del estudio."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización, desde Organization settings → Plugins & skills. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "p": ["Para revisar contratos puntuales, mira también la guía \"Revisar contratos con Claude (sin reemplazar a tu abogado)\"."], "prompts": [{"t": "Ordenar una primera consulta", "c": "Esto es lo que contó una persona en la primera consulta (sin nombres ni datos que la identifiquen): [PEGA LAS NOTAS].\nÁrea: [ÁREA].\nOrdénalo así:\n1. Hechos en orden cronológico.\n2. Fechas que pueden importar para plazos (márcalas para que las revise el abogado).\n3. Documentación que habría que pedir, según el checklist del Proyecto.\n4. Diez preguntas para la próxima entrevista.\nNo des opinión sobre quién tiene razón ni sobre qué conviene hacer."}, {"t": "Borrador desde modelo del estudio", "c": "Usa el modelo [NOMBRE DEL MODELO] del Proyecto.\nDatos que carga el abogado: [DATOS].\nCompleta el modelo sin cambiar su estructura ni agregar cláusulas o argumentos nuevos.\nMarca entre corchetes [REVISAR] cada lugar donde tuviste que interpretar algo, y al final lista lo que falta.\nEsto es un borrador: lo revisa y firma el abogado."}, {"t": "Novedades para el cliente", "c": "Nota técnica del abogado sobre el estado del caso: [PEGA].\nEscribe un mensaje para el cliente de hasta 150 palabras: qué pasó, qué sigue y si tiene que hacer algo. Sin tecnicismos y sin prometer resultados ni plazos que no estén en la nota."}]}, {"h": "Cómo instalarlo", "pasos": ["Lo primero es la conversación sobre confidencialidad: el estudio decide por escrito qué información puede pasar por Claude y cuál no. El plan cambia las reglas. En los planes individuales (Free, Pro y Max), las conversaciones pueden usarse para entrenar modelos si está prendida la mejora del modelo (Model Improvement) en la configuración de privacidad: el estudio tiene que revisarla y decidir. En los planes comerciales (Team y Enterprise), Anthropic dice que por defecto no entrena con esos datos, y el owner además controla conectores y permisos de la organización. En los dos casos, el feedback que se manda con los botones de pulgar puede guardarse junto con la conversación.", "Junta los modelos del estudio, limpios de datos de clientes, y los checklists de documentación.", "Arma el Proyecto y escribe instrucciones que prohíban opinar sobre el fondo de los casos.", "Prueba cada skill con casos viejos anonimizados y que un abogado revise todo.", "Conecta Calendar, Gmail y Drive con la cuenta del estudio. Los plazos los sigue cargando una persona.", "Arma la tarea programada de plazos y aclárale al equipo que es un recordatorio, no el control oficial."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para estudios jurídicos.\nNo es para que la IA haga el trabajo del abogado. Es para lo de alrededor: ordenar las primeras consultas, completar borradores desde los modelos del estudio y contarle al cliente en qué está su tema en palabras simples. Todo pasa por la revisión del abogado y se arma pensando en el secreto profesional desde el día uno.\n¿Te muestro en 15 minutos cómo ordenaría una primera consulta?"}], "lista": ["Argumento central: \"Los abogados dedican su tiempo a pensar el caso, no a copiar y pegar modelos ni a explicar lo mismo diez veces.\"", "Abre con la confidencialidad antes de que te la pregunten. En este rubro, eso es lo que define si te escuchan."]}, {"h": "Cuidados del rubro", "lista": ["Secreto profesional: es la regla número uno. Nada de datos que identifiquen a un cliente sin que el estudio lo haya autorizado.", "Datos sensibles: causas penales, de familia o de salud tienen un cuidado extra. Lo más seguro es no cargarlas.", "Citas legales: Claude puede equivocarse con leyes, artículos o fallos. Todo lo que cite, el abogado lo verifica en la fuente.", "Publicidad: muchas jurisdicciones limitan cómo se promociona un abogado. Que el estudio lo revise antes de publicar contenido."], "aviso": "Claude no da consejo legal ni reemplaza al abogado. Nada sale del estudio sin revisión profesional, y los datos personales se cuidan según las leyes y las normas de ética de cada país."}], "faq": [{"q": "¿Claude puede buscar jurisprudencia?", "a": "Puede ayudar a ordenar una búsqueda, pero puede equivocarse con citas. No lo vendas como buscador jurídico: lo que cite, se verifica en la fuente oficial."}, {"q": "¿Cómo trato la información de los clientes en las pruebas?", "a": "Usa casos viejos con nombres, fechas y lugares cambiados. Y deja por escrito con el estudio qué se puede cargar."}, {"q": "¿Qué es lo primero que conviene instalar?", "a": "La skill de primera consulta. Ahorra tiempo sin tocar el fondo del trabajo legal."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://privacy.claude.com/en/articles/10023580", "https://privacy.claude.com/en/articles/7996868"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en un estudio laboral chico", "negocio": "Ejemplo inventado: un estudio de derecho laboral y civil en Mendoza capital, con dos abogadas socias, un abogado junior y una secretaria. Atienden consultas que llegan por mail, por teléfono y por recomendación, y usan Google Workspace.", "punto_de_partida": "Las primeras consultas se toman en un cuaderno y cada socia las ordena a su manera. Las cartas e intimaciones se arman copiando un modelo viejo y cambiando datos a mano, y los clientes preguntan seguido en qué está su tema.", "pasos": ["Antes de mostrar nada, se sentó con las socias a completar la política de uso del kit. Decidieron qué se carga (modelos limpios, checklists, notas anonimizadas) y qué no (causas de familia y cualquier dato identificatorio). Revisaron la opción de mejora del modelo en la configuración de privacidad de la cuenta y la dejaron como decidieron.", "En la demo usó una consulta vieja con los datos cambiados por roles. Con la skill de primera consulta salieron los hechos ordenados, las fechas para revisar y las preguntas para la entrevista. Probaron también pegar notas con un nombre real, para ver que la skill frenara y pidiera anonimizar.", "Juntó los modelos del estudio, los limpió de datos con [CORCHETES] y armó un checklist de documentación por tipo de caso con la secretaria.", "Prendió Code execution and file creation en Settings → Capabilities. Creó el Proyecto \"Estudio\" con áreas, honorarios publicados, modelos y checklists, y escribió en las instrucciones que Claude no opina sobre el fondo ni cita normativa sin marcarla para revisar.", "Armó la carpeta primera-consulta-juridica con el SKILL.md del kit, la comprimió en ZIP y la subió en Customize → Skills. Después hizo las skills de borrador desde modelo y de novedades al cliente.", "Durante una semana, el abogado junior probó las tres skills con casos viejos anonimizados y una socia revisó cada salida. Ajustaron el tono de las novedades al cliente para que no sonara a escrito judicial.", "Conectó Google Calendar, Gmail y Drive con la cuenta del estudio. En Customize → Connectors dejó en Needs approval las herramientas que crean o modifican eventos y las que envían mails.", "La secretaria pasó los plazos al formato de título del kit (tipo, código interno, qué vence, sin nombres). Recién ahí crearon la tarea de días hábiles.", "La primera semana, la secretaria comparó cada mañana el resumen con la agenda oficial del estudio y anotó las diferencias, que se corrigieron en la carga de los eventos."], "resultado": "Quedó una política de uso firmada, un Proyecto con los modelos y checklists del estudio, tres skills que preparan borradores internos y una tarea que cada mañana resume plazos y audiencias como recordatorio extra. Ningún escrito ni mensaje sale sin revisión de una abogada, y el control oficial de plazos sigue siendo el de siempre."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Claude cita un artículo, una ley o un fallo que no existe o que no dice lo que afirma.", "solucion": "Es un error conocido de los modelos de lenguaje. Deja en las instrucciones del Proyecto que no cite normativa ni jurisprudencia, o que la marque como NORMATIVA: la revisa el abogado. Cualquier cita que aparezca se verifica en la fuente oficial antes de usarla, sin excepción."}, {"sintoma": "El resumen de plazos de la mañana no coincide con la agenda del estudio.", "solucion": "Revisa la carga, no el prompt: eventos con títulos fuera de formato, cargados en otro calendario o sin fecha correcta. La tarea solo muestra lo que está en el calendario que le indicaste. Si cambiaste el nombre del calendario, actualízalo en el prompt de la tarea."}, {"sintoma": "Claude responde un mail de un cliente pero no ve el escrito o el PDF que vino adjunto.", "solucion": "El conector de Gmail no lee el contenido de los adjuntos, solo sus datos. Si el estudio autorizó cargar ese documento, descárgalo, anonimizalo y súbelo al chat. Si no, trabaja solo con el texto del mail y marca como PENDIENTE lo que dependa del adjunto."}, {"sintoma": "Al conectar Gmail, Drive o Calendar aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "La cuenta es de Google Workspace y el administrador tiene que marcar a Claude como app de confianza en admin.google.com (Security → Access and data control → API controls → Manage third-party app access, buscar Claude y ponerla en Trusted). Después espera unos 15 minutos y vuelve a conectar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores de Google en Organization settings → Connectors."}], "kit": [{"archivo": "primera-consulta-juridica/SKILL.md", "que_es": "Skill que ordena una primera consulta en hechos, fechas para revisar, documentación que falta y preguntas para la entrevista, y frena si las notas traen datos que identifican personas. Guárdala en una carpeta primera-consulta-juridica, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: primera-consulta-juridica\ndescription: 'Ordena notas de una primera consulta de un estudio jurídico en hechos, fechas a revisar, documentación faltante y preguntas, sin opinar sobre el caso. Úsala con notas o mails de una consulta.'\n---\n\n# Primera consulta\n\nOrdenas lo que contó una persona en una primera consulta para que el abogado prepare la entrevista. No opinas sobre el fondo, no das consejo legal y no dices si el estudio toma el caso.\n\n## Antes de empezar\n\nRevisa si las notas traen datos que identifican a alguien: nombre y apellido, documento, domicilio, teléfono, mail, nombre de empresas, número de expediente. Si los traen, no sigas: responde \"Estas notas tienen datos que identifican a personas. Reemplázalos por iniciales o roles (CONSULTANTE, EMPLEADOR, LOCADOR) y vuelve a pegarlas.\" Esto vale salvo que las instrucciones del Proyecto digan que el estudio autorizó cargar esos datos.\n\n## Qué entregas, en este orden\n\n1. **Resumen en tres líneas**: quién consulta (por rol), sobre qué y qué quiere lograr, con sus palabras.\n2. **Hechos en orden cronológico**: una línea por hecho, con fecha si la hay. Si una fecha es aproximada, escríbela como la dijo la persona (\"a fines de marzo\") y no la conviertas en una fecha exacta.\n3. **FECHAS PARA REVISAR**: toda fecha que pueda importar para un plazo (notificaciones, despidos, vencimientos, firmas, hechos dañosos). No calcules plazos ni digas si algo venció: solo lístalas para que el abogado las revise.\n4. **Documentación que falta**: según el checklist del área en el Proyecto. Si el Proyecto no tiene checklist para esa área, dilo y lista solo lo que la persona mencionó que tiene.\n5. **Preguntas para la entrevista**: hasta diez, abiertas, ordenadas de la más importante a la menos. Que sirvan para completar los huecos de los hechos.\n6. **Contradicciones o dudas**: lo que no cierra en el relato, sin juzgar a la persona.\n\n## Reglas\n\n- No digas quién tiene razón, qué conviene hacer ni qué probabilidad hay de ganar.\n- No cites leyes, artículos ni fallos. Si el área lo pide, escribe \"NORMATIVA: la revisa el abogado\".\n- No calcules montos, indemnizaciones ni honorarios.\n- No agregues hechos que no estén en las notas.\n- Si la consulta parece de un área que el estudio no atiende según el Proyecto, ponlo en la primera línea: \"ÁREA NO LISTADA EN EL ESTUDIO\".\n- Si aparece un tema penal, de violencia o de salud, ponlo en la primera línea: \"TEMA SENSIBLE: LO VE EL ABOGADO PRIMERO\", y no sigas ordenando esa parte.\n\n## Al final\n\nCierra con: \"Borrador interno. No se comparte con el consultante sin revisión del abogado.\"\n"}, {"archivo": "politica-uso-claude-estudio-juridico.md", "que_es": "Plantilla de política interna para completar y firmar con el titular antes de instalar: plan y privacidad, qué se carga y qué no, cómo se anonimiza, revisión humana y permisos de cada conector.", "contenido": "# Política de uso de Claude en el estudio\n\nEste documento lo completa y lo firma el titular del estudio antes de instalar nada. Es la respuesta escrita a \"qué puede pasar por Claude y qué no\". Guárdalo en el Proyecto y en la carpeta del estudio.\n\nEstudio: [NOMBRE DEL ESTUDIO]\nResponsable de la política: [NOMBRE DEL ABOGADO TITULAR]\nFecha: [AAAA-MM-DD]\nPróxima revisión: [AAAA-MM-DD]\n\n## 1. Cuenta y plan\n\n- [ ] La cuenta de Claude es del estudio, no personal de un integrante.\n- [ ] Plan: [Free / Pro / Max / Team / Enterprise].\n- [ ] Si es un plan individual (Free, Pro o Max): revisamos la opción de mejora del modelo (Model Improvement) en la configuración de privacidad de la cuenta y decidimos cómo dejarla: [PRENDIDA / APAGADA]. Quién la revisa cada tanto: [NOMBRE].\n- [ ] Si es Team o Enterprise: el owner revisó la configuración de la organización (conectores habilitados, permisos de las herramientas, quién puede compartir Proyectos y skills).\n- [ ] Nadie del estudio usa los botones de pulgar arriba o abajo con chats que tengan información de casos, porque ese feedback puede quedar guardado junto con la conversación.\n\n## 2. Qué SÍ se carga\n\n- Modelos del estudio sin datos de clientes (con [CORCHETES] donde van los datos).\n- Checklists de documentación por tipo de caso.\n- Áreas que atiende el estudio, forma de trabajo y tono de comunicación.\n- Notas de consultas con los datos reemplazados por iniciales o roles.\n- [OTROS QUE AUTORICE EL ESTUDIO]\n\n## 3. Qué NO se carga nunca\n\n- Nombre completo, documento, domicilio, teléfono o mail de clientes o contrapartes.\n- Números de expediente vinculados a nombres.\n- Causas penales, de familia, de violencia o con datos de salud. [O: solo con autorización escrita del titular, caso por caso.]\n- Documentos firmados, poderes, escritos ya presentados con datos reales.\n- Claves, accesos a sistemas judiciales o portales.\n- [OTROS]\n\n## 4. Cómo se anonimiza\n\nRegla del estudio: [EJEMPLO: CONSULTANTE, CONTRAPARTE, EMPLEADOR; ciudades por \"ciudad A\"; fechas reales solo cuando importan para el plazo y nunca junto a nombres].\n\n## 5. Revisión humana\n\n- Ningún borrador sale del estudio sin revisión y firma de un abogado.\n- Toda cita de ley, artículo o fallo que aparezca se verifica en la fuente oficial antes de usarla.\n- Los plazos se controlan en [SISTEMA O AGENDA OFICIAL DEL ESTUDIO]. Lo que arma Claude es un recordatorio extra, no el control.\n\n## 6. Conectores\n\n| Conector | Para qué | Con qué cuenta | Puede escribir |\n|---|---|---|---|\n| Google Calendar | Leer plazos y audiencias | [CUENTA DEL ESTUDIO] | [SÍ / NO] |\n| Gmail | Borradores a clientes | [CUENTA DEL ESTUDIO] | Solo borradores; envío con aprobación |\n| Google Drive | Modelos y checklists | [CUENTA DEL ESTUDIO] | [SÍ / NO] |\n\nEn Customize → Connectors, en cada conector, revisamos los permisos de las herramientas (Tool permissions) y dejamos en Needs approval o Blocked lo que no queremos que haga solo.\n\n## 7. Si algo sale mal\n\nSi se cargó un dato que no debía: [QUÉ SE HACE: borrar la conversación, avisar al titular, registrar qué pasó].\n\nFirma del titular: ____________________\n"}, {"archivo": "tarea-programada-plazos-del-estudio.md", "que_es": "La tarea de días hábiles que resume plazos y audiencias desde Google Calendar, con el formato de carga de eventos y el prompt que no modifica nada.", "contenido": "# Tarea programada: plazos y audiencias de los próximos días\n\nLa tarea solo lee el calendario y arma un resumen. No crea, mueve ni borra eventos, y no reemplaza el control oficial de plazos del estudio.\n\n## Antes de crearla\n\n- [ ] Plan pago de Claude en la cuenta del estudio (las tareas programadas están solo en planes pagos).\n- [ ] Google Calendar conectado con la cuenta del estudio.\n- [ ] En Customize → Connectors → Google Calendar, las herramientas que crean, modifican o borran eventos están en Needs approval o Blocked.\n- [ ] Los eventos de plazos y audiencias se cargan con un formato fijo en el título (ver abajo) y sin nombres de clientes.\n- [ ] Probaste el prompt a mano en un chat y el resumen coincide con la agenda.\n\n## Formato de los eventos (lo carga una persona)\n\nTítulo: [TIPO] [CÓDIGO INTERNO DEL CASO] [QUÉ VENCE O QUÉ SE HACE]\nTipos: PLAZO, AUDIENCIA, VENCIMIENTO, REUNIÓN.\nEjemplo de formato: PLAZO [CÓDIGO] contestar traslado\nDescripción del evento: abogado responsable y, si aplica, la fecha de notificación. Sin datos de clientes.\n\n## Cómo crearla\n\nEn Cowork: Scheduled, New task. Con \"Set up manually\": nombre, prompt, aprobación y frecuencia en días hábiles (en inglés figura como weekdays). Con \"Create with Claude\", pégale este archivo y pídele que corra en días hábiles a primera hora.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de agenda de [NOMBRE DEL ESTUDIO].\n\n1. Lee en Google Calendar el calendario \"[NOMBRE DEL CALENDARIO]\" desde hoy hasta dentro de [N] días hábiles.\n2. Toma solo los eventos cuyo título empiece con PLAZO, AUDIENCIA o VENCIMIENTO.\n3. Arma un resumen con tres bloques: \"Hoy\", \"Próximos 2 días hábiles\" y \"Resto del período\". En cada línea: fecha, tipo, código del caso, qué vence y abogado responsable.\n4. Marca con REVISAR cualquier evento sin abogado responsable o con un título que no siga el formato.\n\nReglas:\n- No crees, modifiques ni borres eventos.\n- No calcules plazos ni digas si algo está vencido: solo muestras lo que está cargado.\n- No busques información de los casos en otros lados.\n\nCierra el resumen con: \"Recordatorio interno. El control oficial de plazos es [SISTEMA O AGENDA OFICIAL].\"\n\n## La primera semana\n\n- [ ] Cada mañana, quien controla los plazos compara el resumen con la agenda oficial y anota diferencias.\n- [ ] Si aparece una diferencia, se corrige la carga del evento, no el prompt.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

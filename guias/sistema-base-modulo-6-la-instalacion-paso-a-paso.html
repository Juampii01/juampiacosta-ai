<script>var GUIA = {"slug": "sistema-base-modulo-6-la-instalacion-paso-a-paso", "t": "Módulo 6 · La instalación paso a paso", "d": "El checklist para dejar todo armado en el negocio del cliente: cuentas a su nombre, proyecto, skills, conectores, automatización y pruebas con casos reales.", "tema": "El sistema para vender IA", "min": 12, "fichaNombre": "Checklist de instalación", "ficha": [["Qué es", "El orden en que se instala el paquete, con lo que hay que revisar en cada paso."], ["Necesitás", "La propuesta aceptada, los documentos del cliente y una o dos sesiones con alguien del negocio."], ["Regla de oro", "El cliente es dueño de sus cuentas y de sus datos. Vos configurás, no te quedás con nada."], ["Qué no hace", "No cubre agentes que hablen solos con clientes ni desarrollos a medida."]], "secciones": [{"h": "Antes de empezar: cuentas y datos son del cliente", "p": ["La cuenta de Claude, la de Google y cualquier otra herramienta se crean con el mail del negocio y las paga el negocio. Si mañana dejás de trabajar con ellos, todo tiene que seguir funcionando sin vos.", "Elegí el plan con el cliente según cuántas personas lo van a usar. Si es una sola, puede alcanzar con un plan individual pago (Pro, Max o Ultra): el plan Free tiene proyectos (hasta cinco), skills y conectores, pero no tareas programadas, y la automatización del paquete es una tarea programada. Si el equipo tiene que compartir el proyecto y las skills, hace falta un plan Team (mínimo dos personas) o Enterprise, porque compartir proyectos es una función de esos planes.", "Revisá con el cliente cómo se usan sus datos. En los planes individuales (Free, Pro, Max) la opción está en Settings → Privacy y define si los chats nuevos se usan para mejorar los modelos; el cliente decide cómo dejarla. En los planes comerciales como Team y Enterprise, por defecto no se usan para entrenar. En los dos casos hay una excepción: si alguien manda feedback con el pulgar arriba o abajo, esa conversación se guarda y se puede usar. En Team y Enterprise, el owner puede apagar ese feedback con la opción Rate chats, en Organization settings → Data and Privacy."], "aviso": "Nunca te pasen contraseñas por chat, por mail ni por el chat de Claude. Lo ideal es que el cliente inicie sesión él mismo mientras comparten pantalla. Si necesitás acceso propio, que te sume como miembro y te saque al terminar."}, {"h": "Paso 1: preparar el material", "pasos": ["Pedí con tiempo los documentos que figuran en la propuesta: lista de precios, servicios, preguntas frecuentes, políticas (cambios, pagos, horarios), ejemplos de presupuestos y de respuestas buenas.", "Sacá de los documentos datos sensibles que no hacen falta: datos personales de clientes, números de cuenta, contraseñas.", "Juntá el manual de marca o, si no hay, publicaciones y mensajes que muestren cómo habla el negocio.", "Pasá todo por Claude en tu propia cuenta solo si el cliente está de acuerdo. Si no, ordenalo directo en la cuenta del cliente."]}, {"h": "Paso 2: proyecto y skills", "pasos": ["Creá el proyecto en la cuenta del cliente con un nombre claro (\"Asistente de [NEGOCIO]\").", "Subí los documentos a la base de conocimiento del proyecto.", "Escribí las instrucciones del proyecto: quién es el negocio, cómo habla, qué no tiene que hacer nunca (por ejemplo, inventar precios) y cuándo tiene que decir \"esto lo tiene que ver una persona\".", "Activá la ejecución de código y creación de archivos: en planes individuales está en Settings > Capabilities; en Team y Enterprise lo activa el dueño de la organización en la configuración de Plugins & skills.", "Subí las tres skills (marca, presupuestos y respuestas) como .zip desde Customize > Skills > + > Create skill > Upload a skill. Cada una se arma como explican las guías de skills de marca, presupuestos y respuestas.", "Si es plan Team, compartí el proyecto con el botón Share project, al lado del nombre del proyecto: Can view deja usarlo y chatear sin editar, y Can edit deja cambiar instrucciones y documentos. Las skills que subiste las podés compartir con colegas o grupos (les llegan de solo lectura), o el owner las puede dejar disponibles para toda la organización."]}, {"h": "Paso 3: conectores y automatización", "pasos": ["Conectá Gmail, Google Calendar y Google Drive con la cuenta de Google del negocio. Lo hace el cliente iniciando sesión: cada persona conecta su propia cuenta y Claude solo ve lo que esa cuenta ya puede ver.", "En Team o Enterprise, el dueño de la organización tiene que habilitar los conectores antes. Si usan Google Workspace y la conexión está bloqueada, su administrador de Google puede tener que marcar a Claude como aplicación de confianza.", "Explicale al cliente que, por defecto, Claude pide aprobación antes de enviar, responder o reenviar mails y antes de compartir, mover o mandar a la papelera archivos de Drive. En Team y Enterprise, el owner decide si los miembros pueden saltear esa aprobación. Recomendá dejarla prendida.", "Armá la automatización acordada como tarea programada: en Cowork, Scheduled en la barra lateral y New task arriba a la derecha. Elegí la frecuencia (cada hora, cada día, cada semana, en días hábiles o manual). La tarea corre de forma remota aunque la compu esté dormida, salvo que use archivos o apps de la computadora: en ese caso solo corre ahí. En Team y Enterprise, el acceso a Cowork lo habilita un admin. Ejemplo: \"Todos los días hábiles a las 8, revisá los mails sin responder y armá un resumen con los urgentes\".", "Corré la tarea una vez a mano desde la página Scheduled (tiene la opción de correrla en el momento) y revisá el resultado con el cliente. Cada corrida queda en su propia sesión de Cowork, y en Scheduled se ven las corridas anteriores y las próximas."]}, {"h": "Paso 4: probar con casos reales", "p": ["Nada se entrega sin probar con pedidos reales del negocio. Pedile al cliente cinco consultas reales de clientes y tres pedidos de presupuesto recientes."], "pasos": ["Pasá cada caso por la skill que corresponde y compará con lo que el negocio respondió de verdad.", "Anotá cada error: dato inventado, tono raro, precio mal calculado, algo que tendría que haber derivado.", "Corregí documentos, instrucciones o skills, y volvé a probar los casos que fallaron.", "Probá un caso que no tenga respuesta en los documentos: Claude tiene que decir que no sabe, no inventar.", "Cuando todo pasa, completá el checklist con Claude (prompt de abajo) y guardalo para el documento de entrega."], "prompts": [{"t": "Checklist de instalación completado", "c": "Armame el checklist de instalación de Claude para este cliente, marcando lo hecho y lo pendiente.\nNegocio: [NOMBRE]. Plan de Claude: [PLAN]. Personas que lo usan: [NOMBRES Y ROLES].\nDatos que te paso:\n- Proyecto: [NOMBRE, DOCUMENTOS SUBIDOS]\n- Skills instaladas: [LISTA]\n- Conectores conectados y con qué cuenta: [LISTA]\n- Automatización: [QUÉ HACE Y FRECUENCIA]\n- Casos probados y resultado: [LISTA]\n- Ajustes hechos: [LISTA]\n\nSecciones: Cuentas (a nombre del cliente), Privacidad, Proyecto, Skills, Conectores, Automatización, Pruebas, Accesos.\nPara cada ítem: Hecho / Pendiente / No aplica, y una nota corta.\nEn Accesos, verificá que no quede ningún acceso mío sin fecha de baja.\nNo inventes nada que no te haya pasado: si falta un dato, marcalo como Pendiente."}]}], "faq": [{"q": "¿Lo hago en persona o a distancia?", "a": "Las dos funcionan. A distancia, con pantalla compartida y el cliente iniciando sesión él mismo. En persona es más fácil la primera vez, sobre todo para los conectores."}, {"q": "¿Qué hago si el cliente no tiene sus precios escritos?", "a": "Frenás la instalación de la skill de presupuestos hasta tenerlos. Podés ayudarlo a escribirlos como extra, pero sin datos reales la skill va a inventar."}, {"q": "¿Puedo armar todo en mi cuenta y después pasárselo?", "a": "Podés preparar las skills en tu cuenta porque son archivos .zip que se suben. El proyecto, los conectores y la tarea programada armalos directo en la cuenta del cliente."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/9266767-what-is-the-team-plan", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training", "https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-settings", "https://claude.com/pricing"], "ejemplo": {"titulo": "Ejemplo resuelto: la instalación en un corralón de materiales", "negocio": "Ejemplo inventado: el corralón de Pergamino (provincia de Buenos Aires) de los módulos anteriores. Lo van a usar el dueño y su hija, que atiende el mostrador. Tienen un Gmail personal del corralón (no Google Workspace) y aceptaron la propuesta con plan Team.", "punto_de_partida": "La planilla de precios estaba solo en la compu del dueño. Antes de la primera sesión la subieron a Google Drive y mandaron dos presupuestos de obra reales, las preguntas que llegan siempre y algunos mensajes viejos para ver cómo hablan.", "pasos": ["Antes de la sesión, borró de los presupuestos de ejemplo los nombres y teléfonos de los clientes. Armó las tres skills en su propia compu como carpetas con su SKILL.md y las comprimió en ZIP, sin datos del corralón adentro.", "Primera sesión, en el local: el dueño creó la cuenta Team con el mail del corralón y la pagó él. Invitó a su hija. Martín no pidió asiento: trabajó en la compu del corralón con el dueño al lado.", "El dueño, como owner, prendió la ejecución de código en Organization settings → Plugins & skills, pestaña Policy, y habilitó los conectores de Google en Organization settings → Connectors. Revisaron juntos que el feedback con pulgares se puede apagar con Rate chats y decidieron dejarlo apagado.", "Crearon el proyecto \"Asistente del corralón\" con \"Keep it private\", pegaron las instrucciones del kit completadas con el dueño y subieron la planilla de precios, las preguntas frecuentes y los presupuestos de ejemplo. Lo compartieron con la hija con Can edit, porque ella actualiza precios.", "Subieron las tres skills en Customize → Skills y el dueño las compartió con su hija. Cada uno conectó Gmail, Calendar y Drive con su propia sesión de Google. Como no es Workspace, no apareció ningún bloqueo de administrador.", "Crearon la tarea en Cowork: Scheduled, New task, de lunes a viernes a primera hora, con el prompt \"Buscá en Gmail los pedidos de presupuesto de las últimas 24 horas sin responder y armá una lista con quién pidió, qué materiales y si falta algún dato. No respondas ni mandes nada\". La corrieron a mano desde Scheduled y revisaron el resultado juntos.", "Segunda sesión, pruebas: pasaron cinco consultas reales y tres pedidos de presupuesto con la planilla de casos del kit. En un presupuesto, Claude sumó un flete con un monto que no estaba en ningún documento. Lo anotaron como \"dato inventado\".", "Corrigieron la skill de presupuestos con una regla: el flete siempre va como \"a confirmar por [NOMBRE DEL DUEÑO]\". Volvieron a probar los tres presupuestos y el flete salió marcado como pendiente.", "Probaron el caso sin respuesta (\"¿hacen corte de chapa a medida?\", que no está en los documentos) y Claude respondió que no figuraba y lo marcó como PENDIENTE. Probaron pedirle que mandara un mail a una casilla del propio corralón y pidió aprobación antes.", "Completaron el checklist con el prompt de la guía. En Accesos quedó anotado que Martín no tiene cuenta en la organización y que no quedó ninguna sesión suya abierta."], "resultado": "Quedó todo a nombre del corralón: cuenta Team, proyecto con sus precios, tres skills compartidas, conectores con las cuentas de cada uno y una tarea que cada mañana deja la lista de pedidos sin responder. El checklist completo y la planilla de casos son la base del documento de entrega del Módulo 7."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Falta la ejecución de código. En planes individuales, prendé \"Code execution and file creation\" (o \"Create and edit files\") en Settings → Capabilities. En Team o Enterprise, el owner la prende en Organization settings → Plugins & skills, en la pestaña Policy."}, {"sintoma": "Al subir una skill aparece un error de formato o de archivo faltante.", "solucion": "Revisá que el ZIP contenga la carpeta (no los archivos sueltos), que la carpeta se llame igual que el name del SKILL.md, que adentro esté el SKILL.md y que el name y la description no tengan caracteres raros. Si el ZIP es muy pesado, sacá archivos que no hagan falta."}, {"sintoma": "Al conectar Google aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "La cuenta es de Google Workspace. El administrador tiene que entrar en la consola de Google a Security → Access and data control → API controls → Manage third-party app access, buscar Claude y marcarlo como Trusted. Esperá unos 15 minutos y volvé a conectar."}, {"sintoma": "No aparece Scheduled o no se puede crear la tarea.", "solucion": "Revisá el plan: las tareas programadas están solo en planes pagos. En Team o Enterprise, el acceso a Cowork lo habilita un admin. Si la cuenta es la correcta y el plan también, abrí la app de escritorio de Claude y buscalo en Cowork."}, {"sintoma": "Aparece \"Please try again. You may need to reconnect with your Google Drive account\".", "solucion": "Andá a Customize → Connectors, abrí el conector de Google, tocá Disconnect y confirmá. La próxima vez que uses Drive, Claude te pide volver a iniciar sesión: hacelo con la cuenta del negocio."}], "kit": [{"archivo": "checklist-instalacion-paquete-base.md", "que_es": "La checklist completa de la instalación, en el orden de la guía, con los nombres de menús verificados en la ayuda oficial y una casilla por cosa a revisar en la sesión con el cliente.", "contenido": "# Checklist de instalación del paquete base\n\nUna línea por cosa a revisar. Marcá cada casilla en la sesión con el cliente. Los nombres de menús están como aparecen en Claude (en inglés).\n\nNegocio: [NOMBRE] | Plan de Claude: [PLAN] | Personas que lo usan: [NOMBRES Y ROLES] | Fecha: [FECHA]\n\n## 0. Antes de la primera sesión\n\n- [ ] La propuesta está aceptada por escrito.\n- [ ] Recibí los documentos de la lista: precios, servicios, preguntas frecuentes, políticas, ejemplos de presupuestos y de respuestas.\n- [ ] Saqué de los documentos datos personales de clientes, números de cuenta y contraseñas.\n- [ ] Sé si la cuenta de Google es personal o de Google Workspace, y quién es el administrador si es Workspace.\n\n## 1. Cuentas y privacidad\n\n- [ ] La cuenta de Claude está creada con el mail del negocio y la paga el negocio.\n- [ ] El plan sirve para el alcance: si hay automatización, es un plan pago (el Free no tiene tareas programadas). Si comparten proyecto y skills, es Team (mínimo dos personas) o Enterprise.\n- [ ] En planes individuales: el cliente revisó Settings → Privacy y decidió cómo deja la opción de mejora de modelos.\n- [ ] En Team o Enterprise: el owner sabe que el feedback con pulgar arriba o abajo se guarda y que puede apagarlo con Rate chats, en Organization settings → Data and Privacy.\n- [ ] Ninguna contraseña pasó por chat, mail ni por el chat de Claude.\n\n## 2. Capacidades\n\n- [ ] Planes individuales: Settings → Capabilities, prendida \"Code execution and file creation\" (en el diseño nuevo se llama \"Create and edit files\").\n- [ ] Team o Enterprise: el owner la prendió en Organization settings → Plugins & skills, pestaña Policy.\n\n## 3. Proyecto\n\n- [ ] Creado desde Projects → + New Project, con el nombre \"Asistente de [NEGOCIO]\".\n- [ ] En Team: elegida la visibilidad (\"Keep it private\" o compartido con la organización).\n- [ ] Instrucciones pegadas en Set project instructions (plantilla del kit) y guardadas con Save instructions.\n- [ ] Documentos subidos a la base de conocimiento con el botón +.\n- [ ] Probado en un chat dentro del proyecto: \"¿Cuánto sale [PRODUCTO]?\" responde con el precio del documento.\n- [ ] En Team: compartido con Share project. Can view para quien solo lo usa; Can edit para quien actualiza documentos.\n\n## 4. Skills\n\n- [ ] Cada skill es una carpeta con el mismo nombre que su name, con SKILL.md adentro, comprimida en ZIP.\n- [ ] Subidas en Customize → Skills → + → + Create skill → Upload a skill.\n- [ ] Las tres aparecen prendidas en Customize → Skills.\n- [ ] En Team: compartidas con las personas que las usan (les llegan de solo lectura), o provisionadas por el owner para toda la organización.\n\n## 5. Conectores\n\n- [ ] En Team o Enterprise: el owner habilitó Gmail, Google Calendar y Google Drive antes de que cada persona se conecte.\n- [ ] Cada persona conectó su propia cuenta de Google, iniciando sesión ella.\n- [ ] Si es Workspace y aparece \"Access blocked\", el administrador marcó a Claude como app de confianza y pasaron unos 15 minutos.\n- [ ] Probado: \"Buscá los últimos 3 mails sobre [TEMA]\" y \"¿Qué tengo en el calendario mañana?\".\n- [ ] La aprobación antes de mandar mails y de compartir, mover o mandar a la papelera archivos de Drive quedó prendida.\n\n## 6. Automatización\n\n- [ ] Creada en Cowork: Scheduled → New task, con el prompt completo (qué leer, qué hacer, qué no hacer nunca).\n- [ ] En Team o Enterprise: Cowork está habilitado por un admin.\n- [ ] Frecuencia elegida con el cliente.\n- [ ] Si usa archivos o apps de la compu, el cliente sabe que solo corre en esa computadora.\n- [ ] Corrida una vez a mano desde Scheduled y revisado el resultado con el cliente.\n\n## 7. Pruebas\n\n- [ ] Cinco consultas reales de clientes, comparadas con lo que el negocio respondió de verdad.\n- [ ] Tres pedidos de presupuesto recientes, comparados con los presupuestos reales.\n- [ ] Un caso sin respuesta en los documentos: Claude dice que no sabe y no inventa.\n- [ ] Un pedido de mandar un mail: Claude pide aprobación antes.\n- [ ] Cada error anotado, corregido y vuelto a probar.\n\n## 8. Accesos al cerrar\n\n- [ ] No quedó ninguna sesión mía abierta en la compu del cliente.\n- [ ] Si me sumaron como miembro, tengo fecha de baja escrita.\n- [ ] El cliente sabe cómo sacarme el acceso.\n"}, {"archivo": "instrucciones-proyecto-asistente-negocio.md", "que_es": "El texto para pegar en Set project instructions: con qué datos trabaja, cómo habla el negocio, lo que no hace nunca y cuándo tiene que derivar a una persona.", "contenido": "# Instrucciones del proyecto \"Asistente de [NEGOCIO]\"\n\nCopiá desde \"Sos el asistente\" y pegalo en Set project instructions. Completá los corchetes con el dueño, no solo.\n\n---\n\nSos el asistente de [NEGOCIO], [QUÉ HACE EL NEGOCIO EN UNA LÍNEA] en [CIUDAD]. Ayudás a [QUIÉNES: nombres y roles] con su trabajo diario. No hablás con clientes: preparás borradores que una persona revisa y manda.\n\n## Con qué datos trabajás\n\n- Precios, servicios y condiciones: solo los de los documentos de este proyecto ([NOMBRE DEL ARCHIVO DE PRECIOS], actualizado el [FECHA]).\n- Si un precio, un plazo o un dato no está en los documentos, decí \"esto no está en los documentos, lo tiene que confirmar [QUIÉN]\" y marcalo como PENDIENTE. Nunca lo completes con datos típicos o de internet.\n- Si dos documentos se contradicen, no elijas: avisá cuál dice qué.\n\n## Cómo habla [NEGOCIO]\n\n- [EJEMPLO: con voseo, cercano, frases cortas, sin signos de exclamación de más].\n- Firma como [CÓMO FIRMAN].\n- Palabras que usan: [LISTA]. Palabras que no usan: [LISTA].\n\n## Lo que no hacés nunca\n\n1. Inventar precios, stock, plazos de entrega o condiciones.\n2. Prometer algo en nombre del negocio (descuentos, fechas, garantías) que no esté en los documentos.\n3. Dar por mensaje: [LISTA DEL DUEÑO, por ejemplo datos de otros clientes, márgenes, datos bancarios].\n4. Mandar, reenviar o borrar algo sin que la persona lo apruebe.\n\n## Cuándo decís \"esto lo tiene que ver una persona\"\n\n- Reclamos, enojos o problemas con un pedido.\n- Pedidos fuera de lo habitual: [EJEMPLOS DEL RUBRO].\n- Cualquier tema de plata que no sea un precio de la lista: deudas, devoluciones, financiación.\n- Cuando no estás seguro.\n\n## Formato\n\n- Borradores de respuesta: listos para copiar, sin explicaciones alrededor.\n- Al final de cada borrador, si hay algo para revisar, una línea que empiece con \"REVISAR:\".\n"}, {"archivo": "planilla-casos-de-prueba-instalacion.md", "que_es": "La planilla para probar diez casos reales antes de entregar, con los tipos de error, dónde se corrige cada uno y los prompts para el caso sin respuesta y la prueba de aprobación.", "contenido": "# Planilla de casos de prueba\n\nCompletala en la sesión de pruebas. Ningún paquete se entrega con un caso en \"falla\" sin volver a probar.\n\n## Casos\n\n| # | Tipo | Pedido que se hizo (real) | Qué respondió el negocio de verdad | Qué respondió Claude | Resultado | Qué se corrigió |\n|---|---|---|---|---|---|---|\n| 1 | Consulta | | | | ok / falla | |\n| 2 | Consulta | | | | | |\n| 3 | Consulta | | | | | |\n| 4 | Consulta | | | | | |\n| 5 | Consulta | | | | | |\n| 6 | Presupuesto | | | | | |\n| 7 | Presupuesto | | | | | |\n| 8 | Presupuesto | | | | | |\n| 9 | Sin respuesta en documentos | | (no aplica) | | | |\n| 10 | Pedido de mandar mail | | (no aplica) | | | |\n\n## Tipos de error para anotar\n\n- Dato inventado: precio, stock, plazo o condición que no está en los documentos.\n- Cuenta mal hecha: suma, cantidad o recargo.\n- Tono raro: no suena al negocio.\n- No derivó: algo que tendría que haber dicho \"lo ve una persona\".\n- Se salteó la aprobación.\n\n## Dónde se corrige cada error\n\n- Dato inventado o viejo: el documento del proyecto (o falta el dato).\n- Tono: la skill de marca o las instrucciones del proyecto.\n- Cuenta mal hecha: la skill de presupuestos (reglas de cálculo).\n- No derivó: la lista de \"Cuándo decís esto lo tiene que ver una persona\" en las instrucciones.\n\n## Prompts para la sesión\n\nCaso sin respuesta:\n\"¿Hacen [ALGO QUE EL NEGOCIO NO HACE O QUE NO ESTÁ EN LOS DOCUMENTOS]? ¿Cuánto sale?\"\nEsperado: dice que no está en los documentos y lo marca como PENDIENTE.\n\nPrueba de aprobación:\n\"Respondele a [MAIL DE PRUEBA DEL PROPIO NEGOCIO] que su pedido sale mañana.\"\nEsperado: arma el borrador y pide aprobación antes de enviar. Usá una casilla del negocio, nunca la de un cliente real.\n\nComparación:\n\"Te paso una consulta real y la respuesta que mandamos: [PEGAR]. Respondé vos la misma consulta usando la skill de respuestas. Después decime en qué se diferencian y qué dato te faltó.\"\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

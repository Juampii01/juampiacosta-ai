<script>var GUIA = {"slug": "pasate-de-chatgpt-a-claude", "t": "Pasate de ChatGPT a Claude sin empezar de cero", "d": "Llevate tu memoria, tus instrucciones y tus GPTs armados a Claude en una tarde, para que te conozca desde el primer día.", "tema": "Primeros pasos", "min": 8, "fichaNombre": "Mudanza a Claude", "ficha": [["Qué es", "Una mudanza en tres partes: memoria, instrucciones y asistentes armados."], ["Necesitás", "Tu cuenta de ChatGPT y una de Claude. La importación de memoria está en todos los planes, en la web y en la app de escritorio."], ["Tiempo", "Entre 20 y 40 minutos."]], "secciones": [{"h": "Qué te llevás y adónde va", "lista": ["Lo que ChatGPT recuerda de vos: a la memoria de Claude, con la función de importar.", "Tus instrucciones personales: al campo Instructions de Claude.", "Tus GPTs personalizados: a Proyectos de Claude (instrucciones + archivos).", "Conversaciones viejas importantes: resumidas, al conocimiento de un Proyecto."]}, {"h": "1. Sacá tu memoria de ChatGPT", "p": ["Abrí un chat en ChatGPT y pegale el prompt de abajo. Antes de copiar el resultado, leelo y sacá lo que no quieras llevar."], "prompts": [{"t": "Pedile a ChatGPT tu memoria", "c": "Necesito una copia completa de todo lo que tenés guardado sobre mí en tu memoria. Listá cada dato que recordás, tal cual lo tenés guardado, sin resumir ni agregar nada: quién soy, mi trabajo, mis proyectos, mis preferencias y cómo me gusta que me respondas.\nPonelo todo junto en un solo bloque de código para que lo pueda copiar."}], "aviso": "Revisá el texto antes de pegarlo en Claude y borrá datos sensibles (salud, dinero, datos de terceros)."}, {"h": "2. Importala en Claude", "pasos": ["En Claude andá a Settings → Your Claude (en la versión anterior: Settings → Memory o Settings → Capabilities).", "Tocá Start import. También puede aparecerte en la pantalla de inicio la tarjeta Import memory to Claude: tocá Get started.", "Pegá el texto y tocá Add to memory.", "Revisá lo que guardó y tocá See what Claude learned about you para ver qué entendió."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tenés Claude en español, vas a ver la traducción en el mismo lugar."]}, {"h": "3. Pasá tus instrucciones y tus GPTs", "pasos": ["Copiá lo que tenías como instrucciones o personalización en ChatGPT y pegalo en Settings → Your Claude → Instructions.", "Por cada GPT que usabas, creá un Proyecto en Claude: sus instrucciones van en Set project instructions y sus archivos al conocimiento.", "Para chats viejos que te importan, pedile a ChatGPT un resumen de cada uno y subí esos resúmenes a un Proyecto."], "prompts": [{"t": "Adaptar instrucciones para Claude", "c": "Estas son las instrucciones que usaba en otro asistente:\n[PEGÁ TUS INSTRUCCIONES]\nReescribilas para vos, Claude: sacá lo repetido, ordenalas por prioridad y dejalas en menos de 200 palabras. Si alguna es confusa, preguntame antes de cambiarla."}]}, {"h": "4. Corregí lo que no quedó bien", "p": ["En Settings → Your Claude, tocá Manage al lado de Your memory. Ahí podés escribir qué cambiar o borrar, o pedírselo directo en un chat.", "La importación todavía es experimental: puede que Claude no use todo lo que pegaste. Y se enfoca en lo laboral, así que datos personales que no tienen que ver con tu trabajo pueden quedar afuera. Si tenés la memoria anterior, los cambios pueden tardar hasta 24 horas en verse."]}], "faq": [{"q": "¿Puedo hacer lo mismo al revés, de Claude a otro asistente?", "a": "Sí. En Settings → Your Claude → Manage ves tu memoria, o le pedís a Claude que te la escriba tal cual. Guardala en un archivo como respaldo."}, {"q": "¿Se pasan mis conversaciones viejas?", "a": "La importación pasa la memoria, no los chats. Para conversaciones clave, usá resúmenes en un Proyecto."}, {"q": "Claude no tiene en cuenta algo que importé", "a": "Decíselo en el chat (\"acordate de que...\") o corregilo en Manage. La función todavía está en desarrollo."}], "fuentes": ["https://support.claude.com/en/articles/12123587-import-and-export-your-memory-from-other-ai-providers", "https://support.claude.com/en/articles/11817273", "https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features", "https://support.claude.com/en/articles/9519177", "https://support.claude.com/en/articles/12123587"], "ejemplo": {"titulo": "Ejemplo resuelto: una diseñadora freelance muda sus asistentes en una tarde", "negocio": "Ejemplo inventado: una diseñadora gráfica freelance en Montevideo que hace identidad de marca para emprendimientos gastronómicos. Usaba ChatGPT hace dos años, con dos GPTs propios: uno para escribir propuestas y otro para responder consultas de clientes.", "punto_de_partida": "Quería probar Claude pero no quería volver a explicar quién es, cómo cobra y cómo escribe. Tenía además una conversación larga en ChatGPT donde había definido sus paquetes de servicios.", "pasos": ["Completó la tabla del inventario del kit. Decidió mudar los dos GPTs y la conversación de los paquetes, y dejar afuera un GPT de recetas que no usaba.", "En ChatGPT pegó el prompt 1 del pack. Leyó el resultado y borró dos líneas con datos de una clienta y una sobre un tema de salud.", "En Claude fue a Settings → Your Claude, tocó Start import, pegó el texto y tocó Add to memory. Después tocó See what Claude learned about you y vio que no había guardado su hobby de fotografía, lo que es esperable porque la importación se enfoca en lo laboral.", "Pegó sus instrucciones de personalización de ChatGPT en el prompt Adaptar instrucciones para Claude, revisó el resultado y lo guardó en Settings → Your Claude → Instructions.", "Para el GPT de propuestas usó el prompt 2 del pack, después el prompt 4 en Claude, y creó el Proyecto \"Propuestas\": pegó las instrucciones en Set project instructions y subió desde su compu los PDF de propuestas viejas que había cargado en el GPT.", "Hizo lo mismo con el GPT de consultas, en el Proyecto \"Consultas de clientes\".", "Resumió la conversación de los paquetes con el prompt 3 y subió el resumen al Proyecto \"Propuestas\".", "Probó cada Proyecto con tres pedidos típicos que el prompt 2 le había devuelto y ajustó una instrucción sobre el formato de los precios."], "resultado": "Claude la conoce desde el primer chat, sus dos asistentes viven en Proyectos con sus instrucciones y archivos, y la definición de sus paquetes quedó como documento de referencia. El inventario quedó como respaldo de qué se mudó y qué no."}, "si_falla": [{"sintoma": "ChatGPT me devuelve un resumen corto en vez de toda la memoria.", "solucion": "Pedile de nuevo que liste cada dato tal cual, uno por línea, sin resumir ni agrupar. Si sigue corto, pedíselo por partes (trabajo, proyectos, preferencias) y revisá también la lista de memorias guardadas en la configuración de personalización de ChatGPT."}, {"sintoma": "En Settings no veo Start import.", "solucion": "Tenés el diseño anterior. Buscalo en Settings → Memory, o en Settings → Capabilities, o usá Get started en la tarjeta Import memory to Claude de la pantalla de inicio. La importación está en la web y en la app de escritorio: si estás en el celular, hacela desde la compu."}, {"sintoma": "Claude no guardó cosas personales que estaban en lo que pegué.", "solucion": "Es esperable: la memoria de Claude se enfoca en temas de trabajo y puede dejar afuera datos personales que no tienen que ver. Si querés que recuerde algo puntual, agregalo a mano en Manage, al lado de Your memory, o decíselo en un chat."}, {"sintoma": "Importé la memoria pero no veo ningún cambio.", "solucion": "Si tenés la memoria anterior (legacy), los cambios pueden tardar hasta 24 horas en verse. Si pasó ese tiempo, revisá que Generate memory from chats esté prendido en Settings → Your Claude."}, {"sintoma": "No tengo los archivos que había cargado en mi GPT.", "solucion": "Buscá las versiones originales en tu compu, tu mail o tu Drive y subilas al Proyecto. Si no los encontrás, usá el prompt 2 del pack para listar al menos qué archivos eran y reconstruí lo importante."}], "kit": [{"archivo": "prompts-mudanza-chatgpt-a-claude.md", "que_es": "Cinco prompts en orden: exportar la memoria con fechas, sacar las instrucciones de cada GPT, resumir conversaciones viejas, adaptarlas a un Proyecto de Claude y comprobar la mudanza.", "contenido": "# Pack de prompts para mudarte de ChatGPT a Claude\n\nCinco prompts en el orden en que los vas a usar. Los primeros tres van en ChatGPT, los dos últimos en Claude. Cambiá los corchetes.\n\n## 1. En ChatGPT: tu memoria, completa y con fechas\n\nMe estoy pasando a otro asistente y necesito exportar todo lo que tenés guardado sobre mí.\nListá cada dato de tu memoria tal cual lo tenés guardado, uno por línea, con la fecha en que lo guardaste si la tenés.\nIncluí: quién soy, mi trabajo, mis clientes, mis proyectos, las herramientas que uso, mis preferencias y cómo me gusta que me respondas.\nNo resumas, no agrupes y no agregues nada que no esté guardado.\nPoné todo en un solo bloque de código.\nAl final, decime si hay datos que no pudiste incluir.\n\n## 2. En ChatGPT: cada GPT personalizado\n\n(Abrí un chat con el GPT que querés mudar y pegá esto. Si el GPT es tuyo, también podés copiar sus instrucciones desde el editor del GPT.)\n\nVoy a recrear este asistente en otra herramienta. Escribí en un bloque de código:\n1. Para qué sirve, en una línea.\n2. Las instrucciones que seguís, lo más completas que puedas.\n3. La lista de archivos de conocimiento que tenés cargados, solo los nombres.\n4. Tres pedidos típicos que te hacen y cómo los respondés.\nNo inventes nada: si no sabés algo, escribí \"no lo sé\".\n\n## 3. En ChatGPT: una conversación vieja que te importa\n\n(Abrí esa conversación y pegá esto al final.)\n\nResumí esta conversación para guardarla como documento de referencia:\n- De qué se trató, en 2 líneas.\n- Las decisiones que tomamos, en lista.\n- Los datos concretos que aparecieron (nombres, números, fechas, enlaces), tal cual.\n- Lo que quedó pendiente.\nTítulo sugerido para el documento: una línea.\n\n## 4. En Claude: adaptar las instrucciones de un GPT a un Proyecto\n\nEstas son las instrucciones de un asistente que usaba en otra herramienta:\n<instrucciones_viejas>\n[PEGÁ LO QUE TE DEVOLVIÓ EL PROMPT 2]\n<\/instrucciones_viejas>\nReescribilas como instrucciones de un Proyecto de Claude: sacá lo repetido, ordenalas por prioridad, pasá las prohibiciones a instrucciones positivas cuando se pueda y dejalas en menos de 300 palabras. Si alguna es confusa o se contradice con otra, preguntame antes de cambiarla.\n\n## 5. En Claude: comprobar la mudanza\n\nSin buscar en internet:\n1. ¿Qué sabés de mí y de mi trabajo?\n2. ¿Cómo te pedí que me respondas?\n3. ¿Qué te falta saber para ayudarme mejor?\nSi algo de lo que digas no coincide con la realidad, lo corrijo en el momento.\n"}, {"archivo": "inventario-mudanza-chatgpt-a-claude.md", "que_es": "Checklist y tablas para planificar la mudanza: memoria, instrucciones, cada GPT con su Proyecto y las conversaciones a resumir.", "contenido": "# Inventario de la mudanza de ChatGPT a Claude\n\nCompletalo antes de empezar. Te sirve para no olvidarte nada y para saber cuándo terminaste.\n\n## 1. Memoria\n\n- [ ] Exporté la memoria de ChatGPT con el prompt 1 del pack.\n- [ ] La leí entera y borré lo sensible (salud, dinero, documentos, datos de terceros).\n- [ ] La pegué en Claude: Settings → Your Claude → Start import → Add to memory.\n- [ ] Toqué See what Claude learned about you y revisé la respuesta.\n- [ ] Corregí lo que faltaba en Manage, al lado de Your memory.\n\n## 2. Instrucciones personales\n\n- [ ] Copié mis instrucciones o personalización de ChatGPT.\n- [ ] Las adapté (prompt Adaptar instrucciones para Claude de la guía).\n- [ ] Las pegué en Settings → Your Claude → Instructions.\n\n## 3. GPTs personalizados → Proyectos\n\nUna fila por GPT. Si no lo usaste en el último mes, probablemente no haga falta mudarlo.\n\n| GPT | ¿Lo sigo usando? | Proyecto en Claude | Instrucciones pegadas | Archivos subidos | Probado con 3 pedidos |\n|---|---|---|---|---|---|\n| [NOMBRE] | sí / no | [NOMBRE DEL PROYECTO] | [ ] | [ ] | [ ] |\n| [NOMBRE] | sí / no | [NOMBRE DEL PROYECTO] | [ ] | [ ] | [ ] |\n| [NOMBRE] | sí / no | [NOMBRE DEL PROYECTO] | [ ] | [ ] | [ ] |\n\nRecordá: en el plan Free podés tener hasta cinco proyectos.\n\n## 4. Conversaciones importantes\n\n| Conversación | Resumen hecho | Subido al Proyecto |\n|---|---|---|\n| [TEMA] | [ ] | [NOMBRE DEL PROYECTO] |\n| [TEMA] | [ ] | [NOMBRE DEL PROYECTO] |\n\n## 5. Cierre\n\n- [ ] Usé Claude una semana para las tareas de siempre.\n- [ ] Anoté lo que extrañé de ChatGPT y lo agregué a instrucciones, memoria o a un Proyecto.\n- [ ] Guardé un respaldo de mi memoria de Claude en un archivo (Manage, o pedile que la escriba tal cual).\n"}], "verificada": "2026-11-08", "cat": "primeros-pasos", "parte": "aprende"};</script>

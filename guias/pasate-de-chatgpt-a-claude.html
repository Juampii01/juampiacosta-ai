<script>var GUIA = {"slug": "pasate-de-chatgpt-a-claude", "t": "Pasate de ChatGPT a Claude sin empezar de cero", "d": "Llevate tu memoria, tus instrucciones y tus GPTs armados a Claude en una tarde, para que te conozca desde el primer día.", "tema": "Primeros pasos", "min": 8, "fichaNombre": "Mudanza a Claude", "ficha": [["Qué es", "Una mudanza en tres partes: memoria, instrucciones y asistentes armados."], ["Necesitás", "Tu cuenta de ChatGPT y una de Claude. La importación de memoria está en todos los planes, en la web y en la app de escritorio."], ["Tiempo", "Entre 20 y 40 minutos."]], "secciones": [{"h": "Qué te llevás y adónde va", "lista": ["Lo que ChatGPT recuerda de vos: a la memoria de Claude, con la función de importar.", "Tus instrucciones personales: al campo Instructions de Claude.", "Tus GPTs personalizados: a Proyectos de Claude (instrucciones + archivos).", "Conversaciones viejas importantes: resumidas, al conocimiento de un Proyecto."]}, {"h": "1. Sacá tu memoria de ChatGPT", "p": ["Abrí un chat en ChatGPT y pegale el prompt de abajo. Antes de copiar el resultado, leelo y sacá lo que no quieras llevar."], "prompts": [{"t": "Pedile a ChatGPT tu memoria", "c": "Necesito una copia completa de todo lo que tenés guardado sobre mí en tu memoria. Listá cada dato que recordás, tal cual lo tenés guardado, sin resumir ni agregar nada: quién soy, mi trabajo, mis proyectos, mis preferencias y cómo me gusta que me respondas.\nPonelo todo junto en un solo bloque de código para que lo pueda copiar."}], "aviso": "Revisá el texto antes de pegarlo en Claude y borrá datos sensibles (salud, dinero, datos de terceros)."}, {"h": "2. Importala en Claude", "pasos": ["En Claude andá a Settings → Your Claude (en la versión anterior: Settings → Memory o Settings → Capabilities).", "Tocá Start import. También puede aparecerte la tarjeta Import memory to Claude en la pantalla de inicio.", "Pegá el texto y tocá Add to memory.", "Revisá lo que guardó y tocá See what Claude learned about you para ver qué entendió."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tenés Claude en español, vas a ver la traducción en el mismo lugar."]}, {"h": "3. Pasá tus instrucciones y tus GPTs", "pasos": ["Copiá lo que tenías como instrucciones o personalización en ChatGPT y pegalo en Settings → Your Claude → Instructions.", "Por cada GPT que usabas, creá un Proyecto en Claude: sus instrucciones van en Set project instructions y sus archivos al conocimiento.", "Para chats viejos que te importan, pedile a ChatGPT un resumen de cada uno y subí esos resúmenes a un Proyecto."], "prompts": [{"t": "Adaptar instrucciones para Claude", "c": "Estas son las instrucciones que usaba en otro asistente:\n[PEGÁ TUS INSTRUCCIONES]\nReescribilas para vos, Claude: sacá lo repetido, ordenalas por prioridad y dejalas en menos de 200 palabras. Si alguna es confusa, preguntame antes de cambiarla."}]}, {"h": "4. Corregí lo que no quedó bien", "p": ["En Settings → Your Claude, tocá Manage al lado de Your memory. Ahí podés escribir qué cambiar o borrar, o pedírselo directo en un chat.", "La importación todavía es experimental: puede que Claude no use todo lo que pegaste. Y se enfoca en lo laboral, así que datos personales que no tienen que ver con tu trabajo pueden quedar afuera. Si tenés la memoria anterior, los cambios pueden tardar hasta 24 horas en verse."]}], "faq": [{"q": "¿Puedo hacer lo mismo al revés, de Claude a otro asistente?", "a": "Sí. En Settings → Your Claude → Manage ves tu memoria, o le pedís a Claude que te la escriba tal cual. Guardala en un archivo como respaldo."}, {"q": "¿Se pasan mis conversaciones viejas?", "a": "La importación pasa la memoria, no los chats. Para conversaciones clave, usá resúmenes en un Proyecto."}, {"q": "Claude no tiene en cuenta algo que importé", "a": "Decíselo en el chat (\"acordate de que...\") o corregilo en Manage. La función todavía está en desarrollo."}], "fuentes": ["https://support.claude.com/en/articles/12123587-import-and-export-your-memory-from-other-ai-providers", "https://support.claude.com/en/articles/11817273", "https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features", "https://support.claude.com/en/articles/9519177"], "cat": "primeros-pasos", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "sistema-base-modulo-9-contrato-y-cuidados", "t": "Módulo 9 · Un acuerdo simple por escrito y los cuidados", "d": "Qué tiene que decir el acuerdo con tu cliente: alcance, plazos, pagos, datos personales y quién paga las suscripciones. Una base para revisar con un profesional.", "tema": "El sistema para vender IA", "min": 8, "secciones": [{"h": "Antes que nada", "p": ["Esto no es asesoramiento legal. Es una lista de temas que conviene dejar por escrito para que nadie se lleve sorpresas. Las reglas sobre contratos, facturación y datos personales cambian según el país. Antes de usar un acuerdo con clientes, revísalo con un abogado o contador de tu país y, si vendes a otro país, también con alguien que conozca las reglas de allá.", "Un acuerdo simple es mejor que ninguno. Puede ser la propuesta del Módulo 5 con estas cláusulas sumadas y firmada por las dos partes, o un mail donde el cliente confirma que acepta."], "aviso": "No uses este texto como contrato final. Úsalo para llegar con las preguntas claras a un profesional."}, {"h": "Lo que tiene que decir", "lista": ["Partes: quién eres tú y quién es el cliente, con sus datos.", "Alcance: qué incluye la instalación, pieza por pieza, y qué no incluye. Copia las listas de la propuesta.", "Plazos: cuándo arranca, cuándo se entrega y qué pasa si el cliente demora en mandar documentos o accesos.", "Pagos: monto, moneda, forma y fechas de la instalación y del mensual. Qué pasa si un pago se atrasa.", "Mantenimiento: qué cubre el mensual, cuántos cambios entran, tiempo de respuesta, cómo se da de baja y con cuánto aviso.", "Suscripciones: el plan de Claude y otras herramientas los contrata y paga el cliente, a su nombre. Si sus precios o funciones cambian, no depende de ti.", "Cuentas y datos: todas las cuentas y los datos son del cliente. Tú accedes solo para trabajar y te sacas al terminar. Antes de salir, compartes con el cliente todo lo que creaste (proyectos con permiso de edición y skills subidas desde una cuenta del negocio), porque si te sacan de la organización tus proyectos privados dejan de estar accesibles para ellos.", "Cambios de alcance: cualquier cosa nueva se cotiza y se acepta por escrito antes de hacerla."]}, {"h": "Datos personales y uso de la IA", "p": ["El negocio va a cargar en Claude información de sus clientes: mails, nombres, pedidos. Eso lo hace responsable de cuidarlos según las leyes de su país. Tu parte es configurarlo con cuidado y avisarle lo que corresponde."], "lista": ["Configuración de privacidad: en planes individuales, el cliente elige si sus conversaciones pueden usarse para mejorar los modelos, en Settings → Privacy, opción Help Improve our AI models. En planes comerciales como Team y Enterprise, por defecto no se usan para entrenar, con una excepción: si alguien manda feedback con el pulgar arriba o abajo, esa conversación sí se puede usar. El owner puede apagar ese envío en Organization settings → Data and Privacy, opción Rate chats. Deja escrito qué plan eligió y cómo quedó cada opción.", "Datos mínimos: sube al proyecto solo lo que hace falta. Nada de contraseñas, números de tarjeta ni datos que no aportan.", "Revisión humana: el acuerdo dice que Claude arma borradores y que una persona del negocio revisa antes de mandar algo a un cliente.", "Transparencia: el cliente sabe qué hace la IA y qué no, y decide si le cuenta a sus clientes que la usa.", "Confidencialidad: tú no usas ni compartes sus datos, ni para mostrar casos, sin permiso por escrito."]}, {"h": "Arma el borrador con Claude", "prompts": [{"t": "Borrador de acuerdo para revisar", "c": "Ayúdame a armar un borrador de acuerdo simple con un cliente. Lo voy a revisar con un profesional de [PAÍS] antes de usarlo, así que no lo presentes como contrato final.\nYo: [NOMBRE O EMPRESA, PAÍS].\nCliente: [NEGOCIO, PAÍS].\nServicio: instalación de Claude en su negocio. Incluye: [LISTA]. No incluye: [LISTA].\nPlazos: [FECHAS].\nPagos: instalación [MONTO, MONEDA, FORMA]; mensual [MONTO, MONEDA, QUÉ INCLUYE].\nSuscripciones: las contrata y paga el cliente a su nombre: [LISTA].\n\nCláusulas: Partes, Alcance, Plazos, Pagos, Mantenimiento y baja, Suscripciones, Cuentas y datos (todo es del cliente y yo saco mis accesos al terminar), Datos personales y privacidad, Revisión humana de lo que arma la IA, Confidencialidad, Cambios de alcance.\nLenguaje simple. Al final, lista las preguntas que tendría que hacerle al profesional, por ejemplo sobre facturación, leyes de datos personales y qué ley aplica si estamos en países distintos."}]}], "faq": [{"q": "¿Necesito una empresa para vender esto?", "a": "Depende de tu país y de cómo vas a facturar. Es una de las primeras preguntas para hacerle a un contador."}, {"q": "¿Alcanza con un mail?", "a": "Un mail donde el cliente acepta la propuesta con todo escrito es mucho mejor que un acuerdo de palabra. Si sirve como contrato en tu país, pregúntalo a un profesional."}, {"q": "¿Qué hago si el cliente quiere que yo pague las suscripciones?", "a": "Evítalo. Si las pagas tú, las cuentas quedan atadas a ti y el cliente no es dueño de su sistema. Si no hay otra opción, ponlo por escrito y súmalo al precio."}], "fuentes": ["https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training", "https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training", "https://support.claude.com/en/articles/9266767-what-is-the-team-plan", "https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-setting", "https://support.claude.com/en/articles/12053672-what-happens-to-a-user-s-data-when-they-are-removed-from-a-team-or-enterprise-organization"], "ejemplo": {"titulo": "Ejemplo resuelto: el acuerdo de una instalación para un estudio contable", "negocio": "Ejemplo inventado: un estudio contable en Mendoza capital, con dos contadoras socias y tres empleados. Atienden monotributistas y pymes chicas. La instaladora es una freelancer de la misma ciudad que les va a armar un proyecto con las respuestas a consultas frecuentes de clientes y una skill para redactar mails de vencimientos.", "punto_de_partida": "Las socias aceptaron la propuesta por WhatsApp con un \"dale, arrancamos\". No hay nada firmado, nadie definió quién paga Claude y la idea inicial era cargar en el proyecto la planilla completa de clientes con CUIT, claves fiscales y facturación.", "pasos": ["La instaladora frenó el arranque y les mandó la propuesta por mail con el pedido de que respondieran aceptándola. Ese mail fue la base del acuerdo mientras armaba el borrador.", "Corrió el prompt de la guía con sus datos, los del estudio, el alcance de la propuesta y las suscripciones (plan Team de Claude a nombre del estudio, pagado con la tarjeta del estudio).", "Repasó el borrador con la checklist del kit. Faltaba qué pasaba si el estudio demoraba en mandar las preguntas frecuentes: sumó que el plazo se corre los mismos días.", "En la llamada de arranque completaron juntas el anexo de privacidad. Como es plan Team, anotaron que por defecto no se entrena con sus conversaciones y decidieron apagar Rate chats en Organization settings → Data and Privacy para que nadie mande feedback por error.", "En el punto de datos mínimos acordaron que las claves fiscales y la planilla con CUIT y montos no se suben nunca. Al proyecto va solo un documento de preguntas frecuentes y un calendario de vencimientos sin datos de clientes.", "Anotaron en el anexo que Claude redacta los mails de vencimientos y que una de las socias los revisa antes de mandarlos.", "Las socias llevaron el borrador y la lista de preguntas del final a su propio asesor legal. Volvió con dos cambios: la ley aplicable y cómo se actualiza el mensual. La instaladora los sumó y firmaron las dos partes.", "El día de la entrega completaron el acta del kit: el proyecto quedó compartido con Can edit para las dos socias, la skill subida desde la cuenta de una de ellas y la lista de accesos de la instaladora, que quedó como miembro solo para el mantenimiento."], "resultado": "El estudio tiene un acuerdo revisado por su profesional, con el alcance, los pagos y la baja por escrito. El anexo de privacidad dice qué plan usan, cómo quedó cada opción y qué datos no se cargan nunca. El acta de entrega dice qué es de quién y qué hace la instaladora el día que deje de trabajar con ellas."}, "si_falla": [{"sintoma": "No encuentras dónde se elige si las conversaciones se usan para entrenar.", "solucion": "En planes individuales está en Settings → Privacy (o en claude.ai/settings/data-privacy-controls), bajo Help Improve our AI models. En Team y Enterprise esa opción no aparece igual porque por defecto no se entrena: lo que sí puede apagar el owner es el envío de feedback, en Organization settings → Data and Privacy, opción Rate chats."}, {"sintoma": "El cliente apagó la opción de entrenamiento pero pregunta qué pasa con lo que ya habló antes.", "solucion": "Según la ayuda oficial, al apagarla las conversaciones nuevas no se usan para entrenar, y las anteriores quedan fuera de entrenamientos futuros; lo que ya se usó en un entrenamiento empezado no se saca. Anótalo en el anexo con la fecha en que se apagó."}, {"sintoma": "El cliente te sacó de la organización y ya no ve un proyecto que armaste tú.", "solucion": "Los proyectos privados de un usuario removido quedan inaccesibles para el resto. Pídele que te vuelva a sumar, comparte el proyecto con Can edit para alguien del negocio y recién ahí sal. Por eso el acta de entrega pide el traspaso antes de sacar accesos."}, {"sintoma": "El cliente acepta por WhatsApp o por llamada y quiere arrancar ya.", "solucion": "Mándale la propuesta completa por mail y pídele que responda que la acepta. No es un contrato firmado, pero deja por escrito alcance, plazos y pagos mientras el acuerdo pasa por su profesional y el tuyo."}, {"sintoma": "El cliente quiere que la suscripción de Claude quede en tu tarjeta para simplificar.", "solucion": "Que cree su propia cuenta u organización y la pague con un medio de pago del negocio desde el principio. Si ya quedó a tu nombre, arma el sistema de nuevo en la cuenta del cliente y usa tu copia de instrucciones y skills; no des por hecho que la cuenta se puede transferir."}], "kit": [{"archivo": "checklist-acuerdo-instalacion-ia.md", "que_es": "Checklist de las once cláusulas que tiene que cubrir el acuerdo, con las preguntas para llevarle al abogado o contador. Marca cada punto en el borrador antes de la reunión.", "contenido": "# Checklist del acuerdo de instalación de IA (para llevar al profesional)\n\nEsto no es un contrato ni asesoramiento legal. Es la lista de lo que tu acuerdo tendría que cubrir y de las preguntas que conviene llevarle a un abogado o contador de tu país (y del país del cliente, si es otro).\n\nMarca cada punto cuando esté escrito en el borrador.\n\n## 1. Partes\n- [ ] Mis datos: nombre o razón social, documento o identificación fiscal, país, domicilio, mail.\n- [ ] Datos del cliente: los mismos, más quién firma y con qué cargo.\n\n## 2. Alcance\n- [ ] Lista de lo que incluye la instalación, pieza por pieza (copiada de la propuesta).\n- [ ] Lista de lo que NO incluye.\n- [ ] Qué se considera \"entregado\" (por ejemplo: probado con casos reales y aceptado por mail).\n\n## 3. Plazos\n- [ ] Fecha de inicio y de entrega.\n- [ ] Qué pasa si el cliente demora documentos o accesos (el plazo se corre los mismos días).\n\n## 4. Pagos\n- [ ] Monto, moneda y forma de pago de la instalación (por ejemplo, anticipo y saldo a la entrega).\n- [ ] Monto, moneda, fecha y forma de pago del mensual.\n- [ ] Qué pasa si un pago se atrasa (por ejemplo, se pausa el mantenimiento).\n- [ ] Cómo se actualiza el precio y con cuánto aviso.\n\n## 5. Mantenimiento y baja\n- [ ] Qué cubre el mensual y cuántos cambios chicos entran.\n- [ ] Canal de soporte y tiempo de respuesta.\n- [ ] Cómo se da de baja, con cuánto aviso y qué hago yo al irme (traspaso y salida de accesos).\n\n## 6. Suscripciones\n- [ ] Lista de herramientas que contrata y paga el cliente a su nombre (plan de Claude, Google Workspace, automatizaciones, etc.).\n- [ ] Frase: los precios, límites y funciones de esas herramientas los define cada proveedor y pueden cambiar.\n\n## 7. Cuentas y datos\n- [ ] Todas las cuentas y los datos son del cliente.\n- [ ] Accedo solo para trabajar, con el acceso mínimo necesario.\n- [ ] Al terminar: comparto con el cliente todo lo que creé (proyectos, skills, archivos) y después saco mis accesos.\n\n## 8. Datos personales y privacidad\n- [ ] Qué plan de Claude se usa y cómo quedó la opción de entrenamiento (completar el anexo de privacidad).\n- [ ] Datos mínimos: qué NO se sube nunca (contraseñas, tarjetas, datos de salud si no hace falta, etc.).\n- [ ] El cliente es responsable de los datos de sus clientes según la ley de su país.\n\n## 9. Revisión humana\n- [ ] Claude arma borradores; una persona del negocio revisa antes de mandar algo a un cliente.\n\n## 10. Confidencialidad\n- [ ] No uso ni comparto sus datos ni lo muestro como caso sin permiso por escrito.\n\n## 11. Cambios de alcance\n- [ ] Todo lo nuevo se cotiza y se acepta por escrito antes de hacerlo.\n\n## Preguntas para el profesional\n\n1. ¿Necesito una figura legal o inscripción para facturar este servicio? ¿Y para facturarle a un cliente de otro país?\n2. ¿Qué impuestos o retenciones aplican si cobro desde el exterior o en otra moneda?\n3. ¿Un mail donde el cliente acepta la propuesta tiene valor como acuerdo en mi país? ¿Qué le falta?\n4. ¿Qué ley de datos personales aplica al negocio del cliente y qué tendría que decir el acuerdo sobre eso?\n5. Si estamos en países distintos, ¿qué ley y qué jurisdicción conviene poner?\n6. ¿Conviene limitar mi responsabilidad si una herramienta de terceros falla o cambia? ¿Cómo se escribe?\n7. ¿Qué pasa si el cliente no paga: qué puedo hacer y qué no (por ejemplo, no puedo retener sus cuentas)?\n"}, {"archivo": "anexo-privacidad-y-datos-claude.md", "que_es": "Anexo para completar con el cliente el día de la instalación: plan, opción de entrenamiento, feedback, datos que nunca se suben, accesos y revisión humana. Se adjunta al acuerdo.", "contenido": "# Anexo: configuración de privacidad y datos del sistema con Claude\n\nComplétalo junto con el cliente el día de la instalación y adjúntalo al acuerdo. Revísalo de nuevo si cambian de plan.\n\nNegocio: ____________________   Fecha: __________\nCompletado por: ____________________ (instalador) y ____________________ (cliente)\n\n## 1. Plan de Claude\n\n- Plan contratado: [ ] Free  [ ] Pro  [ ] Max  [ ] Team  [ ] Enterprise  [ ] Otro: ________\n- Titular de la cuenta o de la organización (debe ser el negocio): ____________________\n- Quién paga la suscripción (debe ser el negocio): ____________________\n\n## 2. Uso de las conversaciones para entrenar modelos\n\nCompleta solo el bloque que corresponde al plan.\n\n**Planes individuales (Free, Pro, Max y similares)**\n- Dónde se revisa: Settings → Privacy (o claude.ai/settings/data-privacy-controls), opción \"Help Improve our AI models\".\n- Estado elegido por el cliente: [ ] Prendida  [ ] Apagada\n- Lo eligió el cliente, informado de que, si la apaga, las conversaciones nuevas no se usan para entrenar.\n\n**Planes comerciales (Team, Enterprise)**\n- Por defecto, Anthropic no usa las entradas ni las salidas para entrenar modelos.\n- Excepción: si alguien manda feedback (pulgar arriba o abajo), esa conversación se puede usar. El owner puede apagar el envío de feedback en Organization settings → Data and Privacy, opción \"Rate chats\".\n- Estado de \"Rate chats\": [ ] Prendida  [ ] Apagada\n\nEn todos los planes: las conversaciones marcadas por los sistemas de seguridad se pueden usar para tareas de seguridad, sin importar la opción.\n\n## 3. Datos que se cargan en Claude\n\n- Datos que SÍ se suben al proyecto: ______________________________________\n- Datos que NUNCA se suben: contraseñas, números de tarjeta, ______________________\n- Dónde vive la fuente de verdad (planilla, Drive, sistema): ____________________\n\n## 4. Accesos\n\n| Persona | Rol (dueño, empleado, instalador) | A qué accede | Desde cuándo | Hasta cuándo |\n|---|---|---|---|---|\n| | | | | |\n| | | | | |\n\n## 5. Revisión humana\n\n- Qué arma Claude: ______________________________________\n- Quién revisa antes de mandar a un cliente: ____________________\n\n## 6. Transparencia con los clientes del negocio\n\n- [ ] El negocio decidió si avisa a sus clientes que usa IA. Decisión: ____________________\n\n## 7. Al terminar el trabajo o dar de baja el mensual\n\n- [ ] Los proyectos que creó el instalador quedaron compartidos con el negocio con permiso para editar.\n- [ ] Las skills quedaron subidas en una cuenta del negocio.\n- [ ] Se sacaron los accesos del instalador. Fecha: __________\n\nFirma instalador: ______________   Firma cliente: ______________\n"}, {"archivo": "acta-entrega-y-traspaso-de-accesos.md", "que_es": "Acta para el día de la entrega y el día de la baja: qué queda funcionando, a nombre de quién, qué se traspasó y qué accesos sacaste. Se manda por mail y el cliente responde conforme.", "contenido": "# Acta de entrega y traspaso de accesos\n\nÚsala dos veces: al entregar la instalación y el día que termina el trabajo (fin del mensual o baja). Mandala por mail y pide que el cliente responda \"conforme\".\n\nNegocio: ____________________   Fecha: __________   Motivo: [ ] Entrega  [ ] Baja del mensual\n\n## 1. Qué queda funcionando\n\n| Pieza | Dónde está | A nombre de | Probado con |\n|---|---|---|---|\n| Proyecto [NOMBRE] | Claude, cuenta del negocio | [DUEÑO] | [CASO] |\n| Skill [NOMBRE] | Customize → Skills | [CUENTA DEL NEGOCIO] | [CASO] |\n| Conector [NOMBRE] | Customize → Connectors | [CUENTA DEL NEGOCIO] | [PRUEBA] |\n| Tarea programada [NOMBRE] | Scheduled | [CUENTA DEL NEGOCIO] | [CORRIDA REVISADA] |\n| Automatización [NOMBRE] | [HERRAMIENTA] | [CUENTA DEL NEGOCIO] | [PRUEBA] |\n\n## 2. Copias fuera de Claude\n\n- [ ] Instrucciones de cada proyecto, copiadas en: ____________________\n- [ ] Carpetas de cada skill (SKILL.md y archivos), guardadas en: ____________________\n- [ ] Prompts de las tareas programadas, guardados en: ____________________\n\n## 3. Traspaso (antes de sacar accesos)\n\n- [ ] Cada proyecto que creé yo está compartido con [PERSONA DEL NEGOCIO] con Can edit, o con toda la organización.\n- [ ] Las skills que subí yo están subidas también desde una cuenta del negocio.\n- [ ] Las automatizaciones y cuentas externas tienen como dueño a alguien del negocio.\n\n## 4. Accesos que saco hoy\n\n| Herramienta | Mi acceso | Lo sacó | Confirmado por el cliente |\n|---|---|---|---|\n| Claude (organización o proyecto) | [ROL] | [ ] | [ ] |\n| Google / Drive | [ROL] | [ ] | [ ] |\n| [OTRA] | [ROL] | [ ] | [ ] |\n\n## 5. Pendientes que quedan del lado del negocio\n\n- ______________________________________\n\n## 6. Qué revisar cada mes si lo mantienen ustedes\n\n1. Que precios, servicios y políticas en el proyecto estén al día.\n2. Que los conectores sigan conectados (Customize → Connectors).\n3. Que la tarea programada haya corrido (Scheduled).\n4. Que solo tengan acceso las personas que siguen en el equipo (botón Share de cada proyecto).\n\nInstalador: ______________   Cliente: ______________ (conforme por mail el __________)\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

<script>var GUIA = {"slug": "youtube-skills-claude", "post": "YOUTUBE", "t": "Claude te ayuda con tu canal de YouTube: 11 skills gratis", "d": "Guiones con 21 fórmulas de gancho, título y miniatura pensados juntos, qué cortar, el segundo exacto en que se va la gente y qué funciona en tu nicho. Gratis y de código abierto.", "tema": "Contenido y redes", "min": 7, "fichaNombre": "youtube-agent-skill", "ficha": [["Qué es", "Un paquete de 11 skills para Claude que te ayuda con tu canal: guion, título y miniatura, cortes, retención y más."], ["Necesitas", "Claude Code o la pestaña Code de la app de escritorio. Sin eso funciona a medias."], ["Cuánto cuesta", "El paquete es gratis (licencia MIT). Claude Code viene con los planes pagos de Claude."], ["Qué no hace", "No publica nada: el video lo subes tú."], ["Repo", "github.com/Jakeschincariol/youtube-agent-skill"]], "secciones": [{"h": "Qué es", "p": ["youtube-agent-skill junta 11 skills para Claude pensadas para manejar un canal de YouTube. Es gratis, tiene licencia MIT y no te pide registrarte, conseguir una clave de API ni conectar tu cuenta.", "Algo importante: no publica nada. Las skills escriben y analizan; el video lo subes tú."]}, {"h": "Instálalo en un minuto", "p": ["La forma más fácil es pegar esto en Claude Code (o en la pestaña Code de la app de escritorio):"], "prompts": [{"t": "Instalar", "c": "https://github.com/Jakeschincariol/youtube-agent-skill\n\nInstala esta skill y después comprueba que /yt-script funcione."}], "lista": ["Como plugin, dentro de Claude Code: /plugin marketplace add Jakeschincariol/youtube-agent-skill y después /plugin install youtube-agent@youtube-agent-skill. Instalado así, los comandos llevan el nombre del plugin adelante: /youtube-agent:yt-script en lugar de /yt-script.", "A mano, en la terminal: git clone https://github.com/Jakeschincariol/youtube-agent-skill.git y después cp -r youtube-agent-skill/skills/yt-* ~/.claude/skills/"], "aviso": "Sin Claude Code funciona a medias: pegas el SKILL.md de una skill al principio de un chat, pero pierdes las herramientas que hacen los cálculos (gancho, retención y cortes)."}, {"h": "Primero, tu voz", "p": ["Todas las skills leen un archivo, voice.md, con tu forma de hablar. Es el paso que más cambia el resultado, porque después el guion lo dices tú en voz alta."], "prompts": [{"t": "Tu voice.md", "c": "Te paso 3 videos míos (o sus transcripciones). Con eso, escribe mi voice.md siguiendo la plantilla del paquete de YouTube: cómo hablo, las frases que uso, lo que nunca diría y mi ritmo."}]}, {"h": "Las 11 skills", "lista": ["/yt-script: de una idea a un guion. Cinco ganchos armados con 21 fórmulas, con puntaje, y el guion con los momentos de retención marcados.", "/yt-package: título y miniatura como pareja. Revisa que no se corten, que no repitan lo mismo y que no sean vagos.", "/yt-edit: de la transcripción a una lista de cortes (silencios, muletillas y tomas repetidas) con su minuto. Necesita una transcripción con tiempos (.srt, .vtt o el JSON de Whisper). Las muletillas que detecta solo son en inglés (um, so, like): las de español (eh, este, o sea) pídele a Claude que las marque aparte.", "/yt-retention: lee la retención que exportas de YouTube Studio y te dice el segundo exacto en que se va la gente y qué estabas diciendo.", "/yt-viral: qué está funcionando en tu nicho, ordenado por cuánto supera cada video al promedio de su propio canal.", "/yt-shorts: los Shorts que ya hay adentro de un video largo, con una primera frase nueva para cada uno.", "/yt-comment: ordena los comentarios en cuatro grupos, responde con tu voz y te dice cuál fijar.", "/yt-plan: una semana que entra en tus horas reales: un video principal, uno más simple y tres Shorts.", "/yt-seo: la descripción, las etiquetas que sí valen la pena y las tres búsquedas que debería ganar.", "/yt-chapters: capítulos armados desde la transcripción, que cumplen las reglas de YouTube.", "/yt-audit: revisa el canal entero y termina en UNA mejora, no en veinte."]}, {"h": "La mejor: de lo que funciona a tu guion", "prompts": [{"t": "Virales a guiones", "c": "/yt-viral Busca qué está funcionando en mi nicho [NICHO] en las últimas semanas. Después toma los 3 videos que más superan el promedio de su canal y conviértelos en guiones míos con /yt-script, usando mi voice.md. No copies frases: usa la estructura."}]}, {"h": "Un flujo por video", "pasos": ["/yt-script con tu idea.", "/yt-package para el título y la miniatura.", "Grabas.", "/yt-edit con la transcripción para saber qué cortar.", "/yt-chapters y /yt-seo antes de subirlo.", "A la semana, /yt-retention con los datos del video."]}, {"h": "Lo que conviene saber", "lista": ["El puntaje del gancho es una guía, no una predicción: un puntaje bajo es motivo para revisarlo y uno alto no garantiza nada. Además se calcula con listas de palabras en inglés (you, why, lose): con un gancho en español, tómalo como referencia mínima.", "/yt-viral solo lee listados públicos: nunca entra con tu cuenta.", "Si a una skill le falta un dato, te lo pide; no inventa números.", "Es un proyecto de terceros: revisa lo que instalas."]}], "faq": [{"q": "¿Cuesta algo?", "a": "El paquete es gratis. Necesitas Claude y, para la versión completa, Claude Code, que viene con los planes pagos."}, {"q": "¿Sube los videos por mí?", "a": "No. Todo termina en un bloque para copiar y la pregunta: ¿lo publicas o lo cambias?"}, {"q": "¿De dónde saco la retención?", "a": "En YouTube Studio abre el video, entra a Analytics (Estadísticas), pestaña Engagement (Participación), y busca en el gráfico de retención la opción de descarga. Pásale ese archivo junto con la transcripción. Si no encuentras cómo exportarlo, una captura del gráfico también sirve, con menos precisión."}], "usos": [{"e": "Guion", "c": "rosa", "t": "De una idea a un guion", "d": "Cinco ganchos con puntaje, armados con 21 fórmulas, y el guion con los momentos de retención marcados."}, {"e": "Miniatura", "c": "morado", "t": "Título y miniatura juntos", "d": "Los revisa como pareja: que no se corten, no repitan lo mismo y no sean vagos."}, {"e": "Datos", "c": "verde", "t": "El segundo en que se va la gente", "d": "Lee la retención de YouTube Studio y te dice qué decías justo en ese momento."}, {"e": "Ideas", "c": "naranja", "t": "Lo que funciona en tu nicho", "d": "Videos que superan el promedio de su propio canal, listos para convertirlos en tus guiones."}], "fuentes": ["https://github.com/Jakeschincariol/youtube-agent-skill", "https://code.claude.com/docs/en/discover-plugins", "https://code.claude.com/docs/en/skills", "https://support.google.com/youtube/answer/9884579", "https://support.google.com/youtube/answer/9717005", "https://github.com/Jakeschincariol/youtube-agent-skill/blob/main/skills/yt-edit/SKILL.md", "https://github.com/Jakeschincariol/youtube-agent-skill/blob/main/skills/yt-script/hookscore.py", "https://github.com/Jakeschincariol/youtube-agent-skill/blob/main/skills/yt-retention/SKILL.md"], "ejemplo": {"titulo": "Ejemplo resuelto: un electricista que arma cada video de su canal con las skills", "negocio": "Ejemplo inventado: un electricista matriculado de Ñuñoa, Santiago de Chile, que trabaja solo y tiene un canal de YouTube con tutoriales cortos de arreglos domésticos. Sube un video por semana, grabado con el celular.", "punto_de_partida": "Graba de corrido, edita a ojo, el título y la miniatura los piensa a último momento y nunca miró la retención de sus videos.", "pasos": ["Instaló el paquete a mano en Claude Code y armó la carpeta del canal con el CLAUDE.md del kit: escribió para quién es el canal y agregó la regla de decir siempre cuándo conviene llamar a un profesional.", "Le pasó a Claude las transcripciones de tres videos suyos para escribir el voice.md y lo guardó en ~/.claude/youtube/voice.md.", "Para el video de la semana (cambiar un tomacorriente) corrió /yt-script con la idea. De los cinco ganchos eligió uno por lo que decía, no por el número, porque el puntaje se calcula con palabras en inglés.", "Con /yt-package probó tres pares de título y miniatura. Se quedó con el que no repetía en la miniatura lo que ya decía el título.", "Grabó, sacó la transcripción con tiempos en .srt y corrió /yt-edit. Le pidió a Claude que también marcara sus \"este\" y \"o sea\", que la herramienta no detecta sola.", "Antes de subir corrió /yt-chapters y /yt-seo, y tildó la checklist del kit: el primer capítulo en 00:00, al menos tres y ninguno de menos de 10 segundos.", "A la semana descargó la retención desde Analytics, pestaña Engagement, y corrió /yt-retention con el CSV y la transcripción. La caída más fuerte coincidía con una explicación larga antes de mostrar el tablero: la anotó para el próximo guion."], "resultado": "Quedó un flujo por video con una carpeta ordenada (idea, guion, transcripción, retención y publicación) y un control fijo antes de subir. Él sube cada video y decide qué cambios aplica."}, "si_falla": [{"sintoma": "Escribes /yt-script y Claude Code no lo reconoce.", "solucion": "Si instalaste como plugin, el comando es /youtube-agent:yt-script. Escribe / y busca youtube-agent en la lista. Si copiaste a mano, confirma que exista ~/.claude/skills/yt-script/SKILL.md. Si la carpeta ~/.claude/skills no existía cuando abriste la sesión, corre /reload-skills."}, {"sintoma": "/yt-edit o /yt-chapters te piden una transcripción y no sabes de dónde sacarla.", "solucion": "Necesitan tiempos, no solo texto. Puedes generarla en tu computadora con faster-whisper (pídele a Claude que te arme el .srt) o subir el video como no listado y bajar la pista de subtítulos automáticos que genera YouTube."}, {"sintoma": "YouTube no muestra los capítulos aunque los pegaste en la descripción.", "solucion": "Revisa las tres reglas de la ayuda oficial: el primer tiempo tiene que ser 00:00, tiene que haber al menos tres en orden y cada capítulo tiene que durar 10 segundos o más. Corre /yt-chapters, que las valida antes de que las pegues."}, {"sintoma": "/yt-retention dice que no pudo leer el CSV.", "solucion": "La herramienta necesita al menos 8 puntos con dos columnas: posición (porcentaje o segundos) y retención. Abre el archivo y fíjate que no sea otro reporte. Si exportaste una tabla con muchas columnas, pídele a Claude que deje solo esas dos. Si no hay forma, pásale una captura del gráfico."}, {"sintoma": "En Windows, al correr una herramienta aparece la Microsoft Store o \"python3 no se reconoce\".", "solucion": "Las herramientas son scripts de Python 3 sin dependencias. Instala Python desde python.org (marca Add python.exe to PATH) y pídele a Claude que use python en lugar de python3."}], "kit": [{"archivo": "claude-md-canal-youtube.md", "que_es": "Un CLAUDE.md para la carpeta de tu canal: dónde va cada archivo de cada video, el orden de las skills y los ajustes para trabajar en español. Cópialo como CLAUDE.md en esa carpeta y completa los corchetes.", "contenido": "# CLAUDE.md del canal\n\nCopia este archivo como CLAUDE.md en la carpeta donde trabajas tu canal y completa los corchetes. Claude Code lo lee al abrir la carpeta, así no repites lo mismo en cada pedido.\n\n## El canal\n\n- Canal: [NOMBRE DEL CANAL]\n- De qué trata: [TEMA EN UNA FRASE]\n- Para quién: [UNA PERSONA CONCRETA, POR EJEMPLO: \"dueño de casa que quiere arreglar algo eléctrico chico sin llamar a nadie, y saber cuándo sí llamar\"]\n- Idioma: español. Responde siempre en español rioplatense, con voseo, aunque las skills estén escritas en inglés.\n- Horas por semana que tengo para el canal: [N]\n\n## Dónde está cada cosa\n\n- Mi voz: ~/.claude/youtube/voice.md (la leen todas las skills del paquete).\n- Un video por carpeta, con este nombre: videos/AAAA-MM-DD-tema-corto/\n- Adentro de cada carpeta:\n  - idea.md: la idea en una frase y para quién es.\n  - guion.md: lo que sale de /yt-script.\n  - transcripcion.srt: la transcripción con tiempos del video grabado.\n  - retencion.csv o retencion.png: lo que exporté o capturé de YouTube Studio.\n  - publicacion.md: título, miniatura, descripción, capítulos y etiquetas finales.\n\n## Cómo trabajamos\n\n1. Para un video nuevo, crea la carpeta y el idea.md antes de escribir el guion.\n2. Usa las skills en este orden: /yt-script, /yt-package, (grabo), /yt-edit, /yt-chapters, /yt-seo. A la semana, /yt-retention.\n3. Guarda cada resultado en el archivo que corresponde. No pises versiones: si cambia el guion, guion-v2.md.\n4. Las herramientas del paquete leen palabras en inglés. Con textos en español:\n   - En /yt-edit marca aparte las muletillas en español: eh, este, o sea, bueno, nada, viste.\n   - El puntaje del gancho es solo una referencia mínima. Explica por qué un gancho es mejor, no solo el número.\n5. Si instalé el paquete como plugin, los comandos son /youtube-agent:yt-script, /youtube-agent:yt-package, etc.\n\n## Reglas\n\n- No inventes datos, cifras ni experiencias mías. Si falta algo, pregunta o deja {{dato}}.\n- No subas nada ni entres a mi cuenta de YouTube. Todo termina en un bloque para copiar.\n- No prometas resultados de seguridad eléctrica ni de normativa: [AJUSTA ESTA LÍNEA A TU RUBRO].\n- Capítulos: el primero en 00:00, al menos tres, cada uno de 10 segundos o más.\n"}, {"archivo": "checklist-antes-de-subir-video-youtube.md", "que_es": "Checklist para tildar antes de publicar: título y miniatura, descripción, las reglas oficiales de capítulos, el video y lo que haces a la semana.", "contenido": "# Checklist: antes de subir un video a YouTube\n\nPara tildar con el archivo publicacion.md abierto. Lo que está marcado como regla de YouTube viene de la ayuda oficial; el resto son buenas prácticas.\n\n## Título y miniatura (/yt-package)\n\n- [ ] El título se entiende solo, sin la miniatura.\n- [ ] La miniatura no repite el título: suma otra cosa (una imagen, un resultado, una pregunta).\n- [ ] Lo importante del título está al principio, por si se corta en el celular.\n- [ ] La miniatura se lee en chiquito: mírala al tamaño de una miniatura en el celular.\n- [ ] Lo que promete el título pasa en el video, y pasa temprano.\n\n## Descripción y búsqueda (/yt-seo)\n\n- [ ] Las primeras dos líneas de la descripción dicen de qué trata el video con las palabras que busca tu audiencia.\n- [ ] Links y llamados a la acción después de esas dos líneas.\n- [ ] Etiquetas: pocas y solo si son variantes reales de cómo se busca el tema.\n\n## Capítulos (/yt-chapters). Regla de YouTube\n\n- [ ] El primer capítulo empieza en 00:00.\n- [ ] Hay al menos tres marcas de tiempo, en orden de menor a mayor.\n- [ ] Cada capítulo dura 10 segundos o más.\n- [ ] Cada título de capítulo es una promesa corta, no una lista de palabras clave.\n- [ ] Si no quieres poner capítulos a mano, revisa en YouTube Studio la opción de capítulos automáticos (en la página del video, Mostrar más).\n\n## El video\n\n- [ ] Miraste el primer minuto entero sin cortar. Es donde más gente se va.\n- [ ] Aplicaste los cortes de /yt-edit que te convencieron, no todos por obligación.\n- [ ] Subtítulos revisados: nombres propios, marcas y términos técnicos bien escritos.\n- [ ] Si muestras algo con riesgo (electricidad, herramientas, químicos), dijiste cuándo conviene llamar a un profesional.\n\n## Después de publicar\n\n- [ ] Anota en publicacion.md la fecha y la hora en que subiste el video.\n- [ ] A la semana: exporta o captura la retención y corre /yt-retention con la transcripción.\n- [ ] Responde los comentarios con /yt-comment y fija el que te sugiera, si te convence.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "api-mas-barata-cache-y-lotes", "t": "La API de Claude más barata: caché, lotes y contar tokens", "d": "Para quien programa con la API: elegir el modelo justo, contar tokens antes de mandar, usar prompt caching y mandar en lote lo que no es urgente. Con los descuentos oficiales.", "tema": "Gasta menos tokens", "min": 9, "ficha": [["Qué es", "Cuatro formas oficiales de pagar menos por la API de Claude."], ["Necesitas", "Una cuenta en la Claude Console con clave de API, y el SDK oficial de Claude para tu lenguaje (los ejemplos son en Python)."], ["Cuánto cuesta", "Contar tokens es gratis. El caché y los lotes bajan el precio de lo que ya mandabas."], ["Qué no hace", "No sirve para la suscripción Pro o Max: es solo para quien paga la API por uso."]], "secciones": [{"h": "Qué es lo que pagas", "p": ["En la API pagas por token: lo que mandas (entrada) y lo que Claude responde (salida). La salida es más cara que la entrada, y el precio cambia mucho según el modelo. El razonamiento extendido se cobra como salida.", "Algunos precios de la tabla oficial, por millón de tokens (precios a noviembre de 2026, revísalos en la página oficial):"], "lista": ["Claude Opus 5.5: US$4 de entrada y US$20 de salida.", "Claude Sonnet 5.5: US$2 de entrada y US$10 de salida.", "Claude Haiku 5.5 (pedidos de hasta 100.000 tokens): US$0,10 de entrada y US$0,50 de salida."]}, {"h": "Elige el modelo justo", "pasos": ["Escribe 10 o 20 ejemplos reales de lo que le vas a pedir, con la respuesta que esperas.", "Pruébalos primero con el modelo más barato que creas que puede hacerlo.", "Si falla en algo importante, sube un escalón y vuelve a probar.", "Quédate con el más barato que pase tus ejemplos. Repite la prueba cuando salgan modelos nuevos."]}, {"h": "Cuenta los tokens antes de mandar", "p": ["El endpoint POST /v1/messages/count_tokens te dice cuántos tokens de entrada tiene un mensaje antes de mandarlo. Es gratis, tiene sus propios límites por minuto (no te gasta los de mensajes) y el número es una estimación que puede variar un poco.", "Sirve para saber cuánto te va a costar un documento largo, o para cortar la entrada antes de pasarte."], "prompts": [{"t": "Contar tokens en Python", "c": "import anthropic\n\nclient = anthropic.Anthropic()\n\nresponse = client.messages.count_tokens(\n    model=\"claude-opus-5-5\",\n    system=\"You are a scientist\",\n    messages=[{\"role\": \"user\", \"content\": \"Hello, Claude\"}],\n)\n\nprint(response.json())"}]}, {"h": "Prompt caching: no pagues dos veces lo mismo", "p": ["Si mandas muchas veces el mismo comienzo (instrucciones largas, un documento, las herramientas), el caché hace que la API retome desde ahí en vez de procesarlo todo otra vez. El orden importa: primero herramientas, después system y después mensajes. Lo que cambie al principio rompe el caché de todo lo que viene después.", "La forma más simple es el caché automático: un solo cache_control en la raíz del pedido, y la API va moviendo el punto de corte a medida que crece la conversación. Si quieres control fino, pones cache_control en bloques puntuales."], "lista": ["Duración: por defecto, 5 minutos, y se renueva gratis cada vez que se usa. Si no te alcanza, hay una opción de 1 hora con \"ttl\": \"1h\".", "Precio de escribir en caché: 1,25 veces el precio de entrada (5 minutos) o 2 veces (1 hora).", "Precio de leer del caché: 0,1 veces el precio de entrada. En algunos modelos es todavía menos: 0,05 veces en Opus 5.5 y Sonnet 5.5.", "Mínimo: si lo que quieres cachear es más corto que el mínimo del modelo (512 tokens en Opus 5.5, Sonnet 5.5 y Haiku 5.5), no se cachea y no te avisa con un error.", "Cómo saber si funcionó: en la respuesta, usage trae cache_creation_input_tokens y cache_read_input_tokens. Si los dos son 0, no se cacheó.", "Qué lo rompe: cambiar las definiciones de herramientas invalida todo el caché. Agregar o sacar imágenes, cambiar tool_choice o cambiar el valor de effort invalida la parte de mensajes. Cambiar la configuración de razonamiento invalida siempre la parte de mensajes, y en algunos modelos también la de herramientas y system."], "prompts": [{"t": "Caché automático en Python", "c": "import anthropic\n\nclient = anthropic.Anthropic()\n\nresponse = client.messages.create(\n    model=\"claude-opus-5-5\",\n    max_tokens=1024,\n    cache_control={\"type\": \"ephemeral\"},\n    system=\"You are a helpful assistant that remembers our conversation.\",\n    messages=[{\"role\": \"user\", \"content\": \"My name is Alex. I work on machine learning.\"}],\n)\nprint(response.usage.model_dump_json())"}]}, {"h": "Message Batches: la mitad de precio si puedes esperar", "p": ["Si no necesitas la respuesta en el momento (clasificar mil mails, resumir un catálogo, evaluar respuestas), mándalo en lote. Todo lo que pasa por la API de lotes se cobra al 50% del precio normal, en entrada y en salida."], "lista": ["Tiempo: la mayoría de los lotes terminan en menos de una hora. Si no terminan en 24 horas, vencen.", "Tamaño: hasta 100.000 pedidos o 256 MB por lote, lo que llegue primero.", "Resultados: los puedes bajar durante 29 días.", "Se combina con el caché: los dos descuentos se suman, pero en lotes los aciertos de caché no están garantizados."], "prompts": [{"t": "Crear un lote en Python", "c": "import anthropic\nfrom anthropic.types.message_create_params import MessageCreateParamsNonStreaming\nfrom anthropic.types.messages.batch_create_params import Request\n\nclient = anthropic.Anthropic()\n\nmessage_batch = client.messages.batches.create(\n    requests=[\n        Request(\n            custom_id=\"my-first-request\",\n            params=MessageCreateParamsNonStreaming(\n                model=\"claude-opus-5-5\",\n                max_tokens=1024,\n                messages=[\n                    {\n                        \"role\": \"user\",\n                        \"content\": \"Hello, world\",\n                    }\n                ],\n            ),\n        ),\n    ]\n)\n\nprint(message_batch)"}]}, {"h": "Pídele a Claude que revise tu código", "prompts": [{"t": "Auditoría de costos de mi integración", "c": "Revisa cómo uso la API de Claude en [ARCHIVO O CARPETA]. Dime:\n1) qué modelo uso en cada llamada y si alguna podría ir con uno más barato,\n2) qué parte de mis pedidos se repite siempre y conviene cachear (y dónde poner cache_control),\n3) qué llamadas no necesitan respuesta inmediata y podrían ir por Message Batches,\n4) dónde conviene contar tokens antes de mandar.\nNo cambies nada todavía: primero muéstrame el plan. Usa solo lo que dice la documentación oficial de Claude; si no estás seguro de algo, dímelo."}]}], "faq": [{"q": "¿Contar tokens me cobra?", "a": "No. Es gratis, aunque tiene un límite de pedidos por minuto según tu nivel de uso."}, {"q": "¿El caché sirve si mando un pedido cada media hora?", "a": "Con la duración normal de 5 minutos, no llega. Puedes usar la opción de 1 hora, que es más cara al escribir. Haz la cuenta con tus números."}, {"q": "¿Puedo usar lotes para un chat con clientes?", "a": "No conviene: un lote puede tardar hasta 24 horas. Es para trabajos que pueden esperar."}], "fuentes": ["https://platform.claude.com/docs/en/about-claude/pricing", "https://platform.claude.com/docs/en/build-with-claude/token-counting", "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "https://code.claude.com/docs/en/costs", "https://platform.claude.com/docs/en/about-claude/models/overview"], "ejemplo": {"titulo": "Ejemplo resuelto: clasificar las consultas del día sin pagar precio completo", "negocio": "Ejemplo inventado: una tienda online de repuestos de motos en Guadalajara, con un desarrollador a medio tiempo. Reciben consultas por mail y por el formulario de la web, y una persona las reparte entre ventas, garantías y envíos.", "punto_de_partida": "El desarrollador había armado un script que mandaba cada consulta a la API apenas llegaba, con el modelo más grande y unas instrucciones largas con las categorías y ejemplos. Nadie necesitaba la clasificación en el momento: la persona las reparte a la mañana.", "pasos": ["Juntó 20 consultas reales ya clasificadas a mano y las usó como prueba. Probó primero con Haiku 5.5; en las que falló, revisó si el error era del modelo o de las instrucciones, y ajustó las instrucciones antes de subir de modelo.", "Corrió el estimador del kit con sus instrucciones y una consulta típica para ver cuántos tokens tenía la parte fija y cuánto costaba cada modelo, normal y en lote.", "Vio que las instrucciones pasaban los 512 tokens, así que se podían cachear. Sacó de las instrucciones la fecha del día, que cambiaba en cada pedido y no dejaba aprovechar el caché.", "Cambió el envío inmediato por un lote nocturno con el script del kit: junta las consultas del día en un CSV con id y texto, y manda todo con las instrucciones idénticas y caché de 1 hora.", "En la primera corrida revisó las columnas cache_leido y cache_escrito del resultado para confirmar que el caché se estaba usando.", "Agregó al script de la mañana un paso que reintenta las filas que volvieron como errored o expired.", "Pasó la checklist del kit antes de dejarlo corriendo y puso un límite de gasto en el workspace de la Claude Console."], "resultado": "Quedó un proceso que clasifica de noche, en lote y con las instrucciones cacheadas, con el modelo más barato que pasó sus pruebas. A la mañana la persona encuentra las consultas repartidas y una lista de las que hay que reintentar."}, "si_falla": [{"sintoma": "En usage, cache_creation_input_tokens y cache_read_input_tokens dan 0.", "solucion": "No se cacheó y la API no avisa con error. Revisa que la parte a cachear pase el mínimo del modelo (512 tokens en Opus 5.5, Sonnet 5.5 y Haiku 5.5) y que cache_control esté en el pedido, en la raíz o en el último bloque de la parte fija."}, {"sintoma": "El primer pedido escribe en caché, pero los siguientes vuelven a escribir en vez de leer.", "solucion": "Algo cambia al principio del pedido o se venció el caché. Busca fechas, horas o ids metidos en las instrucciones, cambios en las herramientas, en tool_choice, en effort o en la configuración de razonamiento. Si entre pedidos pasan más de 5 minutos, usa \"ttl\": \"1h\" o haz la cuenta de si conviene."}, {"sintoma": "Un pedido del lote vuelve como errored.", "solucion": "Si el error es invalid_request_error, hay que corregir el cuerpo antes de reenviar: por ejemplo, stream no se acepta en lotes, max_tokens tiene que ser 1 o más y el custom_id solo admite letras, números, - y _ (hasta 64) y no se puede repetir. Los otros errores se pueden reintentar tal cual. Los pedidos con error no se cobran."}, {"sintoma": "Al crear el lote aparece un error 413 request_too_large.", "solucion": "El lote pasa los 256 MB. Pártelo en varios lotes más chicos. El otro tope es de 100.000 pedidos por lote."}, {"sintoma": "count_tokens te da bastantes más tokens que antes para el mismo texto.", "solucion": "Desde Claude 4.7 los modelos usan un tokenizador nuevo que, según la documentación, genera cerca de un 30% más de tokens para el mismo texto que los modelos anteriores. Vuelve a contar con el modelo que vas a usar y ajusta tus límites."}], "kit": [{"archivo": "estimar_costo_api.py", "que_es": "Script en Python que cuenta los tokens de tu pedido con count_tokens (gratis) y te muestra cuánto costaría con Opus 5.5, Sonnet 5.5 y Haiku 5.5: normal, en lote y con caché. No manda mensajes al modelo.", "contenido": "\"\"\"Estima cuánto te cuesta un pedido a la API de Claude antes de mandarlo.\n\nUso:\n    pip install anthropic\n    export ANTHROPIC_API_KEY=\"tu-clave\"\n    python estimar_costo_api.py instrucciones.txt documento.txt 800 1000\n\nArgumentos:\n    1) archivo con las instrucciones (system)\n    2) archivo con el texto que va en el mensaje del usuario\n    3) tokens de salida que esperas por respuesta, razonamiento incluido\n       (míralo en usage.output_tokens de una prueba real)\n    4) cuántas veces vas a mandar este pedido (por ejemplo, por mes)\n\nContar tokens es gratis. El script no manda ningún mensaje al modelo.\n\"\"\"\nimport sys\n\nimport anthropic\n\n# Precios en US$ por millón de tokens, de la tabla oficial a noviembre de 2026:\n# https://platform.claude.com/docs/en/about-claude/pricing\n# Cambian: revísalos antes de decidir con estos números.\nPRECIOS = {\n    \"claude-opus-5-5\": {\"entrada\": 4.00, \"salida\": 20.00, \"escritura_5m\": 5.00, \"lectura\": 0.20},\n    \"claude-sonnet-5-5\": {\"entrada\": 2.00, \"salida\": 10.00, \"escritura_5m\": 2.50, \"lectura\": 0.10},\n    # Haiku 5.5 tiene dos tramos según el largo total de la entrada.\n    \"claude-haiku-5-5\": {\"entrada\": 0.10, \"salida\": 0.50, \"escritura_5m\": 0.125, \"lectura\": 0.01},\n    \"claude-haiku-5-5 (mas de 100.000 tokens)\": {\"entrada\": 0.50, \"salida\": 2.50, \"escritura_5m\": 0.625, \"lectura\": 0.05},\n}\nMINIMO_CACHE = 512  # tokens, para Opus 5.5, Sonnet 5.5 y Haiku 5.5\n\n\ndef leer(ruta):\n    with open(ruta, encoding=\"utf-8\") as f:\n        return f.read()\n\n\ndef main():\n    if len(sys.argv) != 5:\n        print(__doc__)\n        sys.exit(1)\n\n    system = leer(sys.argv[1])\n    usuario = leer(sys.argv[2])\n    salida = int(sys.argv[3])\n    veces = int(sys.argv[4])\n\n    client = anthropic.Anthropic()\n\n    print(f\"Pedido repetido {veces} veces, con {salida} tokens de salida cada uno.\\n\")\n    for modelo in [\"claude-opus-5-5\", \"claude-sonnet-5-5\", \"claude-haiku-5-5\"]:\n        # Cada modelo puede contar distinto: se cuenta con el modelo que vas a usar.\n        total = client.messages.count_tokens(\n            model=modelo,\n            system=system,\n            messages=[{\"role\": \"user\", \"content\": usuario}],\n        ).input_tokens\n        fijo = client.messages.count_tokens(\n            model=modelo,\n            system=system,\n            messages=[{\"role\": \"user\", \"content\": \".\"}],\n        ).input_tokens\n\n        clave = modelo\n        if modelo == \"claude-haiku-5-5\" and total > 100_000:\n            clave = \"claude-haiku-5-5 (mas de 100.000 tokens)\"\n        p = PRECIOS[clave]\n\n        normal = veces * (total * p[\"entrada\"] + salida * p[\"salida\"]) / 1_000_000\n        lote = normal * 0.5\n\n        print(f\"== {clave}\")\n        print(f\"   Tokens de entrada por pedido: {total} (la parte fija de instrucciones: unos {fijo})\")\n        print(f\"   Normal: US$ {normal:,.4f}\")\n        print(f\"   En lote (50% menos): US$ {lote:,.4f}\")\n\n        if fijo >= MINIMO_CACHE:\n            # Primer pedido escribe el caché; los demás lo leen, si llegan antes de que venza.\n            variable = total - fijo\n            con_cache = (\n                fijo * p[\"escritura_5m\"]\n                + (veces - 1) * fijo * p[\"lectura\"]\n                + veces * variable * p[\"entrada\"]\n                + veces * salida * p[\"salida\"]\n            ) / 1_000_000\n            print(f\"   Con caché de 5 minutos, si los pedidos llegan seguidos: US$ {con_cache:,.4f}\")\n        else:\n            print(f\"   Caché: las instrucciones tienen menos de {MINIMO_CACHE} tokens, no se cachean.\")\n        print()\n\n    print(\"Son estimaciones: el conteo puede variar un poco y el caché depende de que los pedidos\")\n    print(\"lleguen antes de que venza. Confirma con los campos usage de respuestas reales.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"archivo": "lote_con_cache.py", "que_es": "Script en Python que manda un CSV de textos por Message Batches con las mismas instrucciones cacheadas una hora, espera el resultado y lo guarda en otro CSV con cuánto se leyó del caché.", "contenido": "\"\"\"Manda en lote muchos textos con las mismas instrucciones, con caché de 1 hora.\n\nEjemplo de uso: clasificar los mails de consulta del día.\n\n    pip install anthropic\n    export ANTHROPIC_API_KEY=\"tu-clave\"\n    python lote_con_cache.py instrucciones.txt consultas.csv resultados.csv\n\n- instrucciones.txt: las instrucciones fijas (categorías, reglas, ejemplos). Para que se\n  cacheen tienen que pasar los 512 tokens.\n- consultas.csv: columnas id y texto. El id solo puede tener letras, números, - y _\n  (hasta 64 caracteres) y no se puede repetir.\n- resultados.csv: lo que escribe el script al terminar.\n\nEl lote cuesta la mitad del precio normal. Puede tardar: la mayoría termina en menos\nde una hora y vence a las 24 horas.\n\"\"\"\nimport csv\nimport re\nimport sys\nimport time\n\nimport anthropic\nfrom anthropic.types.message_create_params import MessageCreateParamsNonStreaming\nfrom anthropic.types.messages.batch_create_params import Request\n\nMODELO = \"claude-haiku-5-5\"  # cámbialo por el más barato que pase tus pruebas\n# max_tokens incluye el razonamiento del modelo, si lo usa: deja margen y míralo en usage.\nMAX_TOKENS = 2000\nID_VALIDO = re.compile(r\"^[a-zA-Z0-9_-]{1,64}$\")\n\n\ndef main():\n    if len(sys.argv) != 4:\n        print(__doc__)\n        sys.exit(1)\n    ruta_instr, ruta_csv, ruta_salida = sys.argv[1:]\n\n    with open(ruta_instr, encoding=\"utf-8\") as f:\n        instrucciones = f.read()\n\n    with open(ruta_csv, encoding=\"utf-8\", newline=\"\") as f:\n        filas = list(csv.DictReader(f))\n\n    vistos = set()\n    for fila in filas:\n        if not ID_VALIDO.match(fila[\"id\"]) or fila[\"id\"] in vistos:\n            sys.exit(f\"id inválido o repetido: {fila['id']!r}\")\n        vistos.add(fila[\"id\"])\n\n    # Las instrucciones van idénticas en todos los pedidos, con caché de 1 hora:\n    # un lote puede tardar más de 5 minutos.\n    system = [\n        {\n            \"type\": \"text\",\n            \"text\": instrucciones,\n            \"cache_control\": {\"type\": \"ephemeral\", \"ttl\": \"1h\"},\n        }\n    ]\n\n    client = anthropic.Anthropic()\n    lote = client.messages.batches.create(\n        requests=[\n            Request(\n                custom_id=fila[\"id\"],\n                params=MessageCreateParamsNonStreaming(\n                    model=MODELO,\n                    max_tokens=MAX_TOKENS,\n                    system=system,\n                    messages=[{\"role\": \"user\", \"content\": fila[\"texto\"]}],\n                ),\n            )\n            for fila in filas\n        ]\n    )\n    print(f\"Lote creado: {lote.id}. Esperando que termine...\")\n\n    while True:\n        lote = client.messages.batches.retrieve(lote.id)\n        if lote.processing_status == \"ended\":\n            break\n        print(f\"  {lote.request_counts.processing} en proceso...\")\n        time.sleep(60)\n\n    escritos = 0\n    with open(ruta_salida, \"w\", encoding=\"utf-8\", newline=\"\") as f:\n        w = csv.writer(f)\n        w.writerow([\"id\", \"estado\", \"respuesta\", \"cache_leido\", \"cache_escrito\"])\n        # Los resultados pueden venir en otro orden: se unen por custom_id.\n        for item in client.messages.batches.results(lote.id):\n            if item.result.type == \"succeeded\":\n                msg = item.result.message\n                texto = \"\".join(b.text for b in msg.content if b.type == \"text\")\n                w.writerow([\n                    item.custom_id,\n                    \"ok\",\n                    texto.strip(),\n                    msg.usage.cache_read_input_tokens,\n                    msg.usage.cache_creation_input_tokens,\n                ])\n            else:\n                # errored, canceled o expired: no se cobran. Revisa y reintenta esos.\n                w.writerow([item.custom_id, item.result.type, \"\", 0, 0])\n            escritos += 1\n\n    print(f\"Listo: {escritos} resultados en {ruta_salida}.\")\n    print(\"Si cache_leido da 0 en casi todas las filas, el caché no se aprovechó: revisa el largo\")\n    print(\"de las instrucciones y que sean idénticas en todos los pedidos.\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"archivo": "checklist-costos-api-produccion.md", "que_es": "Checklist para revisar una integración con la API antes de dejarla en producción: modelo, tamaño de entrada y salida, caché, lotes y control de gasto.", "contenido": "# Checklist: antes de pasar una integración con Claude a producción\n\nMarca cada punto. Lo que quede sin marcar es dinero que puede estar yéndose.\n\n## Modelo\n- [ ] Tengo entre 10 y 20 ejemplos reales con la respuesta esperada, guardados en un archivo.\n- [ ] Probé primero con el modelo más barato y sube solo si falló en algo que importa.\n- [ ] Cada llamada del código dice qué modelo usa y por qué (un comentario alcanza).\n- [ ] Tengo anotado cuándo vuelvo a probar con modelos nuevos.\n\n## Tamaño de la entrada\n- [ ] Conté los tokens de un pedido típico con count_tokens, con el modelo que voy a usar.\n- [ ] Hay un límite en el código: si la entrada pasa de [N] tokens, se corta o se resume antes de mandar.\n- [ ] Si cambié de un modelo viejo a uno nuevo, volví a contar: el tokenizador puede ser otro.\n\n## Salida\n- [ ] max_tokens está puesto según lo que de verdad necesito, no al máximo por las dudas.\n- [ ] Si pido un formato (JSON, una sola palabra, una lista), está dicho en las instrucciones.\n\n## Caché\n- [ ] Lo que se repite en todos los pedidos (herramientas, instrucciones, documentos fijos) va al principio, en ese orden: herramientas, system, mensajes.\n- [ ] Nada que cambie en cada pedido (fecha, hora, nombre del cliente, un id) quedó metido en esa parte fija.\n- [ ] La parte fija pasa el mínimo de tokens del modelo (512 en Opus 5.5, Sonnet 5.5 y Haiku 5.5).\n- [ ] En respuestas reales, cache_read_input_tokens es mayor que 0 a partir del segundo pedido.\n- [ ] Si los pedidos llegan con más de 5 minutos de distancia, hice la cuenta de si conviene el caché de 1 hora.\n\n## Lotes\n- [ ] Separé lo que el usuario espera en el momento de lo que puede esperar horas.\n- [ ] Lo que puede esperar va por Message Batches, con custom_id único por pedido.\n- [ ] El código une los resultados por custom_id, no por orden.\n- [ ] Hay un proceso para reintentar los pedidos que vuelven como errored o expired.\n- [ ] Bajo los resultados antes de que pasen 29 días desde que creé el lote.\n\n## Control\n- [ ] Miro el uso y el gasto en la Claude Console al menos una vez por semana.\n- [ ] Tengo un límite de gasto puesto en el workspace.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

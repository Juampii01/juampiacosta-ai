<script>var GUIA = {"slug": "skill-de-tu-marca", "t": "Skill de tu marca: que todo salga con tu tono y tus colores", "d": "Guardá tu tono, tus colores, tus tipografías y tus reglas en una skill, y Claude las aplica cada vez que le pidas algo para tu marca.", "tema": "Skills y plugins", "min": 9, "fichaNombre": "mi-marca", "ficha": [["Qué es", "Una skill con tu manual de marca, más tu logo en una carpeta aparte."], ["Necesitás", "En la app, la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files) prendida en Settings → Capabilities; en Team o Enterprise la habilita el owner. O Claude Code. Y tu manual, aunque sea informal."], ["Tiempo", "Entre 20 y 40 minutos."]], "secciones": [{"h": "Qué resuelve", "p": ["Sin skill, cada vez que pedís un post o una presentación tenés que volver a explicar cómo hablás y qué colores usás. Con la skill lo explicás una vez: cuando el pedido tiene que ver con tu marca, Claude la carga y sigue tus reglas.", "Anthropic tiene una skill de ejemplo parecida (brand-guidelines) en su repositorio oficial. Esta es una versión propia pensada para un negocio chico, con más foco en el tono."]}, {"h": "Juntá tu manual", "pasos": ["Qué hacés, a quién le hablás y qué te diferencia, en una línea cada uno.", "Cómo hablás: tratamiento (vos, tú o usted), frases que usás y palabras que evitás.", "Tus colores con código hex. Lo mejor es sacarlos del archivo original del logo o del programa donde se diseñó. Si no lo tenés, pasale el logo a Claude y pedile que lea los colores del archivo con código (con la ejecución de código prendida puede hacerlo); si solo mira la imagen, el resultado es una aproximación. Confirmalos antes de guardarlos.", "Tus tipografías para títulos y texto.", "Tu logo en versión color y en versión blanca."]}, {"h": "El SKILL.md", "p": ["Copialo y completá lo que está entre corchetes. La carpeta se tiene que llamar mi-marca, igual que el name."], "prompts": [{"t": "mi-marca/SKILL.md", "c": "---\nname: mi-marca\ndescription: Aplica el manual de marca de [TU MARCA] (tono, colores, tipografías y reglas) a textos, posts, presentaciones y documentos. Usala siempre que pida algo con mi marca.\n---\n\n# Manual de marca de [TU MARCA]\n\n## Cuándo usarla\n- Cuando escriba o diseñe algo que va a salir con mi marca: posts, textos para la web, mails, presentaciones, documentos.\n- Cuando te pida que revises si algo respeta la marca.\n\n## Quiénes somos\n- Qué hacemos: [EN UNA LÍNEA].\n- A quién le hablamos: [TU CLIENTE IDEAL].\n- Qué nos diferencia: [EN UNA LÍNEA].\n\n## Tono\n- [EJ.: DIRECTO Y CERCANO, SIN VUELTAS].\n- Tratamiento: [VOS | TÚ | USTED].\n- Oraciones cortas. Una idea por párrafo.\n\nFrases que sí usamos:\n- [FRASE 1]\n- [FRASE 2]\n\nFrases y palabras que no usamos:\n- [EJ.: \"REVOLUCIONARIO\", \"INCREÍBLE\"]\n- [EJ.: SIGNOS DE EXCLAMACIÓN DOBLES]\n\n## Colores\n- Principal: [#HEX] ([PARA QUÉ SE USA]).\n- Secundario: [#HEX] ([PARA QUÉ SE USA]).\n- Acento: [#HEX] (solo botones y detalles).\n- Fondo: [#HEX].\n- Texto: [#HEX].\n\n## Tipografías\n- Títulos: [NOMBRE DE LA FUENTE], negrita.\n- Texto: [NOMBRE DE LA FUENTE], normal.\n\n## Logo\n- Archivos en assets/. Usá [ARCHIVO-LOGO-COLOR] sobre fondos claros y [ARCHIVO-LOGO-BLANCO] sobre fondos oscuros.\n- No lo deformes, no le cambies los colores y dejale aire alrededor.\n\n## Antes de entregar\nRevisá que el resultado cumpla tono, colores y tipografías. Si algo no se puede cumplir (por ejemplo, una fuente que no está disponible), avisame qué cambiaste."}]}, {"h": "Armala a partir de lo que ya publicaste", "p": ["Si no tenés manual escrito, Claude lo puede sacar de tus piezas."], "prompts": [{"t": "Sacar el manual de tus piezas", "c": "Te paso [CANTIDAD] textos que publiqué y que me representan: [PEGALOS].\nTambién te adjunto mi logo.\n1. Describí mi tono en 5 reglas, con frases que sí y frases que no, sacadas de mis textos.\n2. Decime los colores de mi logo en hex.\n3. Completá con eso esta plantilla de skill: [PEGÁ EL SKILL.MD DE ARRIBA].\n4. Lo que no puedas deducir, dejalo entre corchetes y preguntámelo.\nAl final entregame la carpeta mi-marca como .zip, con mi logo dentro de assets/."}]}, {"h": "Instalala y probala", "pasos": ["Revisá que quede así: mi-marca/SKILL.md y mi-marca/assets/ con tus logos.", "En la app: comprimí la carpeta mi-marca entera y subila en Personalizar → Skills → + → Crear skill → Subir una skill. Activala.", "En Claude Code: copiá la carpeta a ~/.claude/skills/. Ahí queda para todos tus proyectos en esa compu, pero no llega a Cowork ni a la app: en la app la subís aparte, como en el paso anterior.", "Probala con un pedido real, por ejemplo: \"Escribime un post sobre [TEMA] para mi marca\"."], "prompts": [{"t": "Revisar una pieza con tu marca", "c": "Usá mi-marca y revisá este texto. Decime qué no respeta el tono o las reglas y pasame la versión corregida: [PEGÁ EL TEXTO]."}]}], "faq": [{"q": "¿Sirve para imágenes?", "a": "Sirve para que Claude use tus colores y tipografías en lo que arma (presentaciones, documentos, páginas). Para piezas de diseño finales, revisalas igual."}, {"q": "¿Puedo tener una skill por cada marca que manejo?", "a": "Sí. Usá un nombre distinto para cada una (marca-cliente-a, marca-cliente-b) y en la descripción poné el nombre de la marca, así Claude elige la correcta."}, {"q": "¿Mi equipo puede usarla?", "a": "En planes Team y Enterprise podés compartirla desde Personalizar → Skills, en el menú de tres puntos → Compartir, si tu organización lo tiene habilitado."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://github.com/anthropics/skills/tree/main/skills/brand-guidelines", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: la skill de marca de una panadería de barrio", "negocio": "Ejemplo inventado: una panadería artesanal en Barrio Italia, Santiago de Chile, con la dueña, dos panaderos y una persona en el mostrador. Publica en Instagram y manda un mail mensual a sus clientes.", "punto_de_partida": "Cada post lo escribía quien tuviera tiempo, a veces con tú y a veces con usted, y los colores de las placas cambiaban según la plantilla que encontraban.", "pasos": ["La dueña completó el cuestionario del kit en una tarde: trato de tú, cercano, sin palabras como \"delicioso\" ni \"el mejor\", nada de dos signos de exclamación seguidos. Los colores los sacó del archivo que le había dejado la diseñadora del logo.", "En Settings → Capabilities prendió la opción de ejecución de código y creación de archivos.", "Abrió un chat, pegó el prompt \"Sacar el manual de tus piezas\" con cinco posts que le gustaban, el cuestionario respondido y el logo en color y en blanco. Claude le preguntó lo que faltaba (la tipografía de reemplazo) y le entregó la carpeta como .zip.", "Revisó el SKILL.md: la carpeta y el name decían panaderia-barrio-italia, en minúsculas y con guiones, y la description nombraba la panadería. Dentro de assets/ estaban los dos logos con los nombres que figuraban en el SKILL.md.", "Lo subió en Personalizar → Skills → + → Crear skill → Subir una skill y lo activó.", "En un chat nuevo corrió las pruebas del kit. La prueba de \"no inventar\" falló: puso un horario que no existía. Sumó al SKILL.md una sección con horario y dirección reales, volvió a subirla y repitió la prueba."], "resultado": "Quedó una skill que cualquiera del equipo usa pidiendo \"un post para la panadería sobre el pan de masa madre\". Los posts salen con tú, sin las palabras prohibidas, con los colores del logo y con el horario real."}, "si_falla": [{"sintoma": "No aparece la sección Skills en Personalizar, o se ve en gris.", "solucion": "Prendé Code execution and file creation (o Create and edit files) en Settings → Capabilities. En Team o Enterprise, si sigue en gris, el owner tiene que habilitar la ejecución de código y Skills en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al subir el .zip aparece un error de formato o de archivo faltante.", "solucion": "El ZIP tiene que tener la carpeta mi-marca adentro, no los archivos sueltos. En Mac o Linux, parado en la carpeta que contiene mi-marca, corré zip -r mi-marca.zip mi-marca/ y comprobá con unzip -l mi-marca.zip que todo empiece con mi-marca/. El name tiene que ser igual al nombre de la carpeta, solo con minúsculas, números y guiones, sin tildes ni eñes."}, {"sintoma": "Pedís un post para tu marca y Claude no usa la skill.", "solucion": "Revisá en Personalizar → Skills que esté activada. Después mejorá la description: que diga el nombre de tu marca y las palabras que usás al pedir (post, historia, mail, presentación). Mientras tanto, nombrala en el pedido: \"Usá mi-marca y escribime...\". En Claude Code también podés escribir /mi-marca."}, {"sintoma": "El documento o la presentación sale con otra tipografía.", "solucion": "Tu fuente no está instalada donde Claude arma el archivo. Sumá en la sección Tipografías una fuente de reemplazo parecida y pedile que avise cuándo la usa. Para la pieza final, cambiá la fuente vos en el programa donde la abras."}, {"sintoma": "Claude usa el logo equivocado o dice que no lo encuentra.", "solucion": "Fijate que los archivos estén dentro de mi-marca/assets/ y que el SKILL.md los nombre exactamente igual, con la extensión (por ejemplo logo-color.png y logo-blanco.png). Evitá espacios y tildes en los nombres de archivo."}], "kit": [{"archivo": "cuestionario-manual-de-marca.md", "que_es": "Veinte preguntas para juntar tu manual de marca aunque no tengas uno escrito. Respondelo y pegalo en el prompt \"Sacar el manual de tus piezas\" de la guía.", "contenido": "# Cuestionario para armar tu manual de marca\n\nRespondelo en 20 a 40 minutos. Lo que no sepas, dejalo en blanco: después se lo pasás a Claude junto con la plantilla del SKILL.md y te lo pregunta.\n\n## 1. Quiénes son\n\n1. ¿Qué hacés, en una línea que entienda tu abuela?\n2. ¿A quién le hablás? Describí a tu cliente típico: qué hace, dónde está, qué le preocupa.\n3. ¿Qué te diferencia de los otros de tu rubro en tu ciudad? Una línea, algo que se pueda comprobar.\n4. ¿Qué no sos? (Ejemplo: \"no somos baratos\", \"no somos una cadena\".)\n\n## 2. Cómo hablás\n\n5. ¿Tratás de vos, de tú o de usted? ¿Siempre, o depende del canal?\n6. Copiá tres frases que hayas escrito y que te representen.\n7. Copiá una frase que hayas visto en la competencia y que nunca dirías.\n8. ¿Usás emojis, signos de exclamación, mayúsculas para remarcar? ¿Cuánto?\n9. Palabras que siempre usás (de tu rubro o de tu zona).\n10. Palabras que nunca usás.\n11. Si tu marca fuera una persona, ¿cómo la describirían tus clientes en tres palabras?\n\n## 3. Cómo se ve\n\n12. Colores con su código hex. Si no los tenés, sacalos del archivo original del logo (en el programa donde se diseñó, o con un cuentagotas) y anotá también para qué usás cada uno.\n13. Tipografía de títulos y de texto. Si no sabés el nombre, preguntale a quien diseñó el logo.\n14. Una tipografía de reemplazo por si la tuya no está disponible (por ejemplo, una de Google Fonts parecida).\n15. Archivos del logo que tenés: versión color, versión blanca, solo el ícono. Formato (PNG, SVG).\n16. ¿Qué no se hace nunca con el logo? (Estirarlo, ponerle sombra, cambiarle el color.)\n\n## 4. Reglas del negocio\n\n17. Datos que siempre tienen que ir bien: dirección, horarios, teléfono, web, redes.\n18. Promesas que no se hacen nunca (plazos, precios, resultados).\n19. Temas que no se tocan en tus piezas.\n20. Una pieza que te haya quedado como querías, para usar de ejemplo.\n\n## Qué hacés con esto\n\nPegá este cuestionario respondido en el prompt \"Sacar el manual de tus piezas\" de la guía, junto con tus textos y el logo. Pedile a Claude que complete el SKILL.md y que te pregunte lo que quedó en blanco.\n"}, {"archivo": "pruebas-skill-de-marca.md", "que_es": "Nueve pruebas para comprobar que tu skill se activa cuando corresponde, respeta tono y colores, y no inventa datos. Con una tabla para anotar qué cambiaste.", "contenido": "# Pruebas para tu skill de marca\n\nUsalas apenas subís la skill y cada vez que la cambies. Probá en un chat nuevo, sin explicar tu marca: la gracia es ver si la skill sola alcanza. Reemplazá [TU MARCA] por el nombre que pusiste en la description.\n\n## 1. ¿Se activa sola?\n\nEstos pedidos deberían cargar la skill sin que la nombres:\n\n1. \"Escribime un post para Instagram de [TU MARCA] sobre [TEMA].\"\n2. \"Armame una presentación de cinco diapositivas para mostrarle [TU MARCA] a un cliente nuevo.\"\n3. \"Redactá el mail de bienvenida que le mandamos a los clientes de [TU MARCA].\"\n\nSi en alguno no la usa, sumá a la description las palabras que usaste en ese pedido.\n\n## 2. ¿No se activa cuando no corresponde?\n\nEstos pedidos NO deberían usarla:\n\n4. \"Explicame qué es el IVA.\"\n5. \"Resumime este artículo: [PEGÁ UN ARTÍCULO CUALQUIERA].\"\n\nSi la usa, la description es demasiado amplia: aclará que es solo para piezas que salen con tu marca.\n\n## 3. ¿Respeta el tono?\n\n6. \"Escribí tres versiones de una promo de [TU MARCA] para [FECHA].\"\n   - [ ] Usa el tratamiento correcto (vos, tú o usted).\n   - [ ] No aparece ninguna de tus palabras prohibidas.\n   - [ ] Respeta tu regla de emojis y exclamaciones.\n7. \"Usá la skill de marca y revisá este texto: [PEGÁ UN TEXTO QUE NO RESPETE TU TONO A PROPÓSITO].\"\n   - [ ] Detecta cada cosa que no respeta y la explica.\n   - [ ] Devuelve la versión corregida.\n\n## 4. ¿Respeta lo visual?\n\n8. \"Armame un documento de una página con los servicios de [TU MARCA].\"\n   - [ ] Usa tus colores hex, no unos parecidos.\n   - [ ] Usa tus tipografías o avisa cuál reemplazó.\n   - [ ] Usa el logo correcto según el fondo.\n\n## 5. ¿Avisa en vez de inventar?\n\n9. \"Escribí un post con el horario de atención y la dirección de [TU MARCA].\"\n   - [ ] Si esos datos no están en la skill, los deja marcados para completar en vez de inventarlos.\n\n## Registro\n\n| Fecha | Prueba | ¿Pasó? | Qué cambié en la skill |\n|---|---|---|---|\n| [AAAA-MM-DD] | [NÚMERO] | [SÍ / NO] | [CAMBIO] |\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "usalo"};</script>

<script>var GUIA = {"slug": "skill-de-tu-marca", "t": "Skill de tu marca: que todo salga con tu tono y tus colores", "d": "Guarda tu tono, tus colores, tus tipografías y tus reglas en una skill, y Claude las aplica cada vez que le pidas algo para tu marca.", "tema": "Skills y plugins", "min": 9, "fichaNombre": "mi-marca", "ficha": [["Qué es", "Una skill con tu manual de marca, más tu logo en una carpeta aparte."], ["Necesitas", "En la app, la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files) prendida en Settings → Capabilities; en Team o Enterprise la habilita el owner. O Claude Code. Y tu manual, aunque sea informal."], ["Tiempo", "Entre 20 y 40 minutos."]], "secciones": [{"h": "Qué resuelve", "p": ["Sin skill, cada vez que pides un post o una presentación tienes que volver a explicar cómo hablas y qué colores usas. Con la skill lo explicas una vez: cuando el pedido tiene que ver con tu marca, Claude la carga y sigue tus reglas.", "Anthropic tiene una skill de ejemplo parecida (brand-guidelines) en su repositorio oficial. Esta es una versión propia pensada para un negocio chico, con más foco en el tono."]}, {"h": "Junta tu manual", "pasos": ["Qué haces, a quién le hablas y qué te diferencia, en una línea cada uno.", "Cómo hablas: tratamiento (tú, tú o usted), frases que usas y palabras que evitas.", "Tus colores con código hex. Lo mejor es sacarlos del archivo original del logo o del programa donde se diseñó. Si no lo tienes, pásale el logo a Claude y pídele que lea los colores del archivo con código (con la ejecución de código prendida puede hacerlo); si solo mira la imagen, el resultado es una aproximación. Confírmalos antes de guardarlos.", "Tus tipografías para títulos y texto.", "Tu logo en versión color y en versión blanca."]}, {"h": "El SKILL.md", "p": ["Cópialo y completa lo que está entre corchetes. La carpeta se tiene que llamar mi-marca, igual que el name."], "prompts": [{"t": "mi-marca/SKILL.md", "c": "---\nname: mi-marca\ndescription: Aplica el manual de marca de [TU MARCA] (tono, colores, tipografías y reglas) a textos, posts, presentaciones y documentos. Úsala siempre que pida algo con mi marca.\n---\n\n# Manual de marca de [TU MARCA]\n\n## Cuándo usarla\n- Cuando escriba o diseñe algo que va a salir con mi marca: posts, textos para la web, mails, presentaciones, documentos.\n- Cuando te pida que revises si algo respeta la marca.\n\n## Quiénes somos\n- Qué hacemos: [EN UNA LÍNEA].\n- A quién le hablamos: [TU CLIENTE IDEAL].\n- Qué nos diferencia: [EN UNA LÍNEA].\n\n## Tono\n- [EJ.: DIRECTO Y CERCANO, SIN VUELTAS].\n- Tratamiento: [TÚ | TÚ | USTED].\n- Oraciones cortas. Una idea por párrafo.\n\nFrases que sí usamos:\n- [FRASE 1]\n- [FRASE 2]\n\nFrases y palabras que no usamos:\n- [EJ.: \"REVOLUCIONARIO\", \"INCREÍBLE\"]\n- [EJ.: SIGNOS DE EXCLAMACIÓN DOBLES]\n\n## Colores\n- Principal: [#HEX] ([PARA QUÉ SE USA]).\n- Secundario: [#HEX] ([PARA QUÉ SE USA]).\n- Acento: [#HEX] (solo botones y detalles).\n- Fondo: [#HEX].\n- Texto: [#HEX].\n\n## Tipografías\n- Títulos: [NOMBRE DE LA FUENTE], negrita.\n- Texto: [NOMBRE DE LA FUENTE], normal.\n\n## Logo\n- Archivos en assets/. Usa [ARCHIVO-LOGO-COLOR] sobre fondos claros y [ARCHIVO-LOGO-BLANCO] sobre fondos oscuros.\n- No lo deformes, no le cambies los colores y déjale aire alrededor.\n\n## Antes de entregar\nRevisa que el resultado cumpla tono, colores y tipografías. Si algo no se puede cumplir (por ejemplo, una fuente que no está disponible), avísame qué cambiaste."}]}, {"h": "Ármala a partir de lo que ya publicaste", "p": ["Si no tienes manual escrito, Claude lo puede sacar de tus piezas."], "prompts": [{"t": "Sacar el manual de tus piezas", "c": "Te paso [CANTIDAD] textos que publiqué y que me representan: [PÉGALOS].\nTambién te adjunto mi logo.\n1. Describe mi tono en 5 reglas, con frases que sí y frases que no, sacadas de mis textos.\n2. Dime los colores de mi logo en hex.\n3. Completa con eso esta plantilla de skill: [PEGA EL SKILL.MD DE ARRIBA].\n4. Lo que no puedas deducir, déjalo entre corchetes y pregúntamelo.\nAl final entrégame la carpeta mi-marca como .zip, con mi logo dentro de assets/."}]}, {"h": "Instálala y pruébala", "pasos": ["Revisa que quede así: mi-marca/SKILL.md y mi-marca/assets/ con tus logos.", "En la app: comprime la carpeta mi-marca entera y súbela en Personalizar → Skills → + → Crear skill → Subir una skill. Actívala.", "En Claude Code: copia la carpeta a ~/.claude/skills/. Ahí queda para todos tus proyectos en esa computadora, pero no llega a Cowork ni a la app: en la app la subes aparte, como en el paso anterior.", "Pruébala con un pedido real, por ejemplo: \"Escríbeme un post sobre [TEMA] para mi marca\"."], "prompts": [{"t": "Revisar una pieza con tu marca", "c": "Usa mi-marca y revisa este texto. Dime qué no respeta el tono o las reglas y pásame la versión corregida: [PEGA EL TEXTO]."}]}], "faq": [{"q": "¿Sirve para imágenes?", "a": "Sirve para que Claude use tus colores y tipografías en lo que arma (presentaciones, documentos, páginas). Para piezas de diseño finales, revísalas igual."}, {"q": "¿Puedo tener una skill por cada marca que manejo?", "a": "Sí. Usa un nombre distinto para cada una (marca-cliente-a, marca-cliente-b) y en la descripción pon el nombre de la marca, así Claude elige la correcta."}, {"q": "¿Mi equipo puede usarla?", "a": "En planes Team y Enterprise puedes compartirla desde Personalizar → Skills, en el menú de tres puntos → Compartir, si tu organización lo tiene habilitado."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://github.com/anthropics/skills/tree/main/skills/brand-guidelines", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: la skill de marca de una panadería de barrio", "negocio": "Ejemplo inventado: una panadería artesanal en Barrio Italia, Santiago de Chile, con la dueña, dos panaderos y una persona en el mostrador. Publica en Instagram y manda un mail mensual a sus clientes.", "punto_de_partida": "Cada post lo escribía quien tuviera tiempo, a veces con tú y a veces con usted, y los colores de las placas cambiaban según la plantilla que encontraban.", "pasos": ["La dueña completó el cuestionario del kit en una tarde: trato de tú, cercano, sin palabras como \"delicioso\" ni \"el mejor\", nada de dos signos de exclamación seguidos. Los colores los sacó del archivo que le había dejado la diseñadora del logo.", "En Settings → Capabilities prendió la opción de ejecución de código y creación de archivos.", "Abrió un chat, pegó el prompt \"Sacar el manual de tus piezas\" con cinco posts que le gustaban, el cuestionario respondido y el logo en color y en blanco. Claude le preguntó lo que faltaba (la tipografía de reemplazo) y le entregó la carpeta como .zip.", "Revisó el SKILL.md: la carpeta y el name decían panaderia-barrio-italia, en minúsculas y con guiones, y la description nombraba la panadería. Dentro de assets/ estaban los dos logos con los nombres que figuraban en el SKILL.md.", "Lo subió en Personalizar → Skills → + → Crear skill → Subir una skill y lo activó.", "En un chat nuevo corrió las pruebas del kit. La prueba de \"no inventar\" falló: puso un horario que no existía. Sumó al SKILL.md una sección con horario y dirección reales, volvió a subirla y repitió la prueba."], "resultado": "Quedó una skill que cualquiera del equipo usa pidiendo \"un post para la panadería sobre el pan de masa madre\". Los posts salen con tú, sin las palabras prohibidas, con los colores del logo y con el horario real."}, "si_falla": [{"sintoma": "No aparece la sección Skills en Personalizar, o se ve en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files) en Settings → Capabilities. En Team o Enterprise, si sigue en gris, el owner tiene que habilitar la ejecución de código y Skills en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al subir el .zip aparece un error de formato o de archivo faltante.", "solucion": "El ZIP tiene que tener la carpeta mi-marca adentro, no los archivos sueltos. En Mac o Linux, parado en la carpeta que contiene mi-marca, corre zip -r mi-marca.zip mi-marca/ y comprueba con unzip -l mi-marca.zip que todo empiece con mi-marca/. El name tiene que ser igual al nombre de la carpeta, solo con minúsculas, números y guiones, sin tildes ni eñes."}, {"sintoma": "Pides un post para tu marca y Claude no usa la skill.", "solucion": "Revisa en Personalizar → Skills que esté activada. Después mejora la description: que diga el nombre de tu marca y las palabras que usas al pedir (post, historia, mail, presentación). Mientras tanto, nómbrala en el pedido: \"Usa mi-marca y escríbeme...\". En Claude Code también puedes escribir /mi-marca."}, {"sintoma": "El documento o la presentación sale con otra tipografía.", "solucion": "Tu fuente no está instalada donde Claude arma el archivo. Suma en la sección Tipografías una fuente de reemplazo parecida y pídele que avise cuándo la usa. Para la pieza final, cambia la fuente tú en el programa donde la abras."}, {"sintoma": "Claude usa el logo equivocado o dice que no lo encuentra.", "solucion": "Fíjate que los archivos estén dentro de mi-marca/assets/ y que el SKILL.md los nombre exactamente igual, con la extensión (por ejemplo logo-color.png y logo-blanco.png). Evita espacios y tildes en los nombres de archivo."}], "kit": [{"archivo": "cuestionario-manual-de-marca.md", "que_es": "Veinte preguntas para juntar tu manual de marca aunque no tengas uno escrito. Respóndelo y pégalo en el prompt \"Sacar el manual de tus piezas\" de la guía.", "contenido": "# Cuestionario para armar tu manual de marca\n\nRespóndelo en 20 a 40 minutos. Lo que no sepas, déjalo en blanco: después se lo pasas a Claude junto con la plantilla del SKILL.md y te lo pregunta.\n\n## 1. Quiénes son\n\n1. ¿Qué haces, en una línea que entienda tu abuela?\n2. ¿A quién le hablas? Describe a tu cliente típico: qué hace, dónde está, qué le preocupa.\n3. ¿Qué te diferencia de los otros de tu rubro en tu ciudad? Una línea, algo que se pueda comprobar.\n4. ¿Qué no eres? (Ejemplo: \"no somos baratos\", \"no somos una cadena\".)\n\n## 2. Cómo hablas\n\n5. ¿Tratas de ti, de tú o de usted? ¿Siempre, o depende del canal?\n6. Copia tres frases que hayas escrito y que te representen.\n7. Copia una frase que hayas visto en la competencia y que nunca dirías.\n8. ¿Usas emojis, signos de exclamación, mayúsculas para remarcar? ¿Cuánto?\n9. Palabras que siempre usas (de tu rubro o de tu zona).\n10. Palabras que nunca usas.\n11. Si tu marca fuera una persona, ¿cómo la describirían tus clientes en tres palabras?\n\n## 3. Cómo se ve\n\n12. Colores con su código hex. Si no los tienes, sácalos del archivo original del logo (en el programa donde se diseñó, o con un cuentagotas) y anota también para qué usas cada uno.\n13. Tipografía de títulos y de texto. Si no sabes el nombre, pregúntale a quien diseñó el logo.\n14. Una tipografía de reemplazo por si la tuya no está disponible (por ejemplo, una de Google Fonts parecida).\n15. Archivos del logo que tienes: versión color, versión blanca, solo el ícono. Formato (PNG, SVG).\n16. ¿Qué no se hace nunca con el logo? (Estirarlo, ponerle sombra, cambiarle el color.)\n\n## 4. Reglas del negocio\n\n17. Datos que siempre tienen que ir bien: dirección, horarios, teléfono, web, redes.\n18. Promesas que no se hacen nunca (plazos, precios, resultados).\n19. Temas que no se tocan en tus piezas.\n20. Una pieza que te haya quedado como querías, para usar de ejemplo.\n\n## Qué haces con esto\n\nPega este cuestionario respondido en el prompt \"Sacar el manual de tus piezas\" de la guía, junto con tus textos y el logo. Pídele a Claude que complete el SKILL.md y que te pregunte lo que quedó en blanco.\n"}, {"archivo": "pruebas-skill-de-marca.md", "que_es": "Nueve pruebas para comprobar que tu skill se activa cuando corresponde, respeta tono y colores, y no inventa datos. Con una tabla para anotar qué cambiaste.", "contenido": "# Pruebas para tu skill de marca\n\nÚsalas apenas subes la skill y cada vez que la cambies. Prueba en un chat nuevo, sin explicar tu marca: la gracia es ver si la skill sola alcanza. Reemplaza [TU MARCA] por el nombre que pusiste en la description.\n\n## 1. ¿Se activa sola?\n\nEstos pedidos deberían cargar la skill sin que la nombres:\n\n1. \"Escríbeme un post para Instagram de [TU MARCA] sobre [TEMA].\"\n2. \"Ármame una presentación de cinco diapositivas para mostrarle [TU MARCA] a un cliente nuevo.\"\n3. \"Redacta el mail de bienvenida que le mandamos a los clientes de [TU MARCA].\"\n\nSi en alguno no la usa, suma a la description las palabras que usaste en ese pedido.\n\n## 2. ¿No se activa cuando no corresponde?\n\nEstos pedidos NO deberían usarla:\n\n4. \"Explícame qué es el IVA.\"\n5. \"Resúmeme este artículo: [PEGA UN ARTÍCULO CUALQUIERA].\"\n\nSi la usa, la description es demasiado amplia: aclara que es solo para piezas que salen con tu marca.\n\n## 3. ¿Respeta el tono?\n\n6. \"Escribe tres versiones de una promo de [TU MARCA] para [FECHA].\"\n   - [ ] Usa el tratamiento correcto (tú, tú o usted).\n   - [ ] No aparece ninguna de tus palabras prohibidas.\n   - [ ] Respeta tu regla de emojis y exclamaciones.\n7. \"Usa la skill de marca y revisa este texto: [PEGA UN TEXTO QUE NO RESPETE TU TONO A PROPÓSITO].\"\n   - [ ] Detecta cada cosa que no respeta y la explica.\n   - [ ] Devuelve la versión corregida.\n\n## 4. ¿Respeta lo visual?\n\n8. \"Ármame un documento de una página con los servicios de [TU MARCA].\"\n   - [ ] Usa tus colores hex, no unos parecidos.\n   - [ ] Usa tus tipografías o avisa cuál reemplazó.\n   - [ ] Usa el logo correcto según el fondo.\n\n## 5. ¿Avisa en vez de inventar?\n\n9. \"Escribe un post con el horario de atención y la dirección de [TU MARCA].\"\n   - [ ] Si esos datos no están en la skill, los deja marcados para completar en vez de inventarlos.\n\n## Registro\n\n| Fecha | Prueba | ¿Pasó? | Qué cambié en la skill |\n|---|---|---|---|\n| [AAAA-MM-DD] | [NÚMERO] | [SÍ / NO] | [CAMBIO] |\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "úsalo"};</script>

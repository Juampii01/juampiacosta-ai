<script>var GUIA = {"slug": "pedidos-que-salen-a-la-primera", "post": "PEDIDO", "t": "Pedidos que salen a la primera: menos ida y vuelta, más plan", "d": "Cinco hábitos para que cada pedido a Claude salga bien de entrada: planificar, juntar, ser específico, releer y editar el mensaje original en vez de mandar correcciones.", "tema": "Gasta menos tokens", "min": 6, "secciones": [{"h": "Por qué la ida y vuelta te sale cara", "p": ["Cada mensaje de aclaración y cada corrección alarga el chat. Y según el centro de ayuda de Anthropic, el largo de la conversación es una de las cosas que más mueven tu consumo.", "Las piezas de un buen pedido (contexto, tarea, formato, criterios) están en \"La fórmula para pedirle bien a Claude\". Esta guía es sobre el proceso: qué hacer antes de mandar y qué hacer cuando la respuesta no sirvió."]}, {"h": "1. Planifica antes de abrir el chat", "pasos": ["Escribe en una línea qué necesitas al final (\"un mail para el cliente\", \"una tabla con los gastos del mes\").", "Anota todas las preguntas que tienes sobre ese tema.", "Fíjate cuáles van juntas: casi siempre son varias partes de lo mismo.", "Junta el material: textos, datos, ejemplos. Así no lo mandas de a pedazos."]}, {"h": "2. Junta todo en un solo mensaje", "p": ["La ayuda oficial recomienda agrupar en un mensaje las tareas parecidas, mandar el texto completo cuando quieres que lo edite (no por partes) y, en análisis, poner todos los datos en un mensaje bien ordenado."], "prompts": [{"t": "Tres pedidos en uno", "c": "Te paso tres cosas sobre [TEMA]. Resuelve cada una por separado, con un título para cada parte:\n1. [PRIMER PEDIDO]\n2. [SEGUNDO PEDIDO]\n3. [TERCER PEDIDO]\nMaterial para las tres:\n[PEGA EL TEXTO O LOS DATOS]\nSi te falta algo, pregúntame todo junto antes de empezar."}]}, {"h": "3. Sé específico (y no repitas)", "lista": ["Di para quién es: no es lo mismo un mail para un cliente enojado que para un proveedor.", "Di el formato: tabla, viñetas, un párrafo, cuántas palabras.", "Di qué es \"bien hecho\": qué tiene que tener sí o sí y qué no quieres.", "No pegues dos veces lo mismo: en un chat donde ya está el material, la ayuda recomienda referirte a lo anterior (\"el texto que te pasé arriba\") en vez de repetirlo."]}, {"h": "4. Relee antes de mandar", "p": ["La ayuda oficial lo pone como un paso más: revisa tu pedido antes de mandarlo. Treinta segundos de lectura te ahorran una vuelta entera."], "pasos": ["¿Se entiende qué quieres al final?", "¿Está todo el material o falta algo que después vas a tener que mandar?", "¿Dijiste el formato y el largo?", "¿Hay algo ambiguo? Si alguien que no conoce tu negocio no lo entendería, Claude tampoco."]}, {"h": "5. Edita el mensaje original en vez de corregir", "p": ["Cuando la respuesta no sirvió porque tu pedido estaba flojo, lo natural es mandar \"no, así no, hazlo de nuevo con...\". Eso suma dos mensajes más al chat: tu corrección y la respuesta nueva, encima del intento que no sirvió.", "La otra opción es editar tu mensaje original. Según el centro de ayuda, editar un mensaje anterior crea otra versión del chat, con sus propios artifacts, y la versión anterior queda guardada. Así sigues trabajando sobre el pedido bien armado y no sobre el intento fallido."], "pasos": ["Busca tu mensaje original en el chat y usa la opción para editarlo.", "Corrige lo que faltaba: el contexto, el formato o el dato que no estaba.", "Mándalo. Claude responde de nuevo desde ese punto, en una versión nueva del chat.", "Si quieres comparar, la versión anterior sigue guardada."], "aviso": "En la nueva experiencia de Claude, donde chat y Cowork están unidos, la ayuda indica que no está disponible ramificar una conversación desde un punto anterior. Si no ves la opción de editar, corrige en un solo mensaje completo, no en varios chiquitos."}], "faq": [{"q": "Si edito un mensaje, ¿pierdo la respuesta anterior?", "a": "No. Según la ayuda, editar un mensaje anterior crea otra versión del chat y la anterior queda guardada."}, {"q": "¿Conviene que Claude me haga preguntas antes de empezar?", "a": "Sí, si se las pides todas juntas en un mismo mensaje. Así es una sola vuelta de aclaraciones y no cinco."}, {"q": "¿Mandar todo junto no confunde a Claude?", "a": "No, si lo ordenas: numera los pedidos, separa el material y di qué quieres para cada parte."}], "fuentes": ["https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them", "https://support.claude.com/en/articles/16761823-claude-cowork-and-chat-are-one-claude", "https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context"], "ejemplo": {"titulo": "Ejemplo resuelto: los recordatorios de un consultorio, en un solo pedido", "negocio": "Ejemplo inventado: un consultorio odontológico de dos profesionales en Asunción, Paraguay. La secretaria maneja la agenda, los recordatorios por WhatsApp y las respuestas a consultas. Usa Claude Pro en la computadora del consultorio.", "punto_de_partida": "Para cada tanda de mensajes iba y venía: primero pedía un recordatorio, después \"más corto\", después \"agrega que traigan los estudios\", después otro para los pacientes que faltaron. Terminaba con chats largos y textos que no terminaban de cerrarle.", "pasos": ["Antes de abrir el chat escribió en una línea lo que quería al final: los tres mensajes de WhatsApp que se mandan todas las semanas.", "Anotó las preguntas que siempre le surgían y vio que eran partes de lo mismo: el recordatorio del día anterior, el aviso de que traigan estudios previos y el mensaje para quien faltó sin avisar.", "Juntó el material: horarios del consultorio, la dirección como la dicen ellos, la regla de cancelación y dos mensajes viejos que le gustaban.", "Subió la skill armar-pedido-completo y le pegó todo de una. La skill le devolvió cuatro preguntas juntas (tono, largo, si se tutea o se trata de usted, si los mensajes llevan el nombre del profesional) con una sugerencia en cada una. Las respondió en un solo mensaje.", "Antes de mandar pasó la checklist de 30 segundos. Vio que no había dicho que no quería emojis y lo sumó.", "La primera respuesta trajo los tres mensajes, pero el de pacientes que faltaron le pareció duro. En vez de mandar \"más amable\", editó su mensaje original agregando \"el de ausentes, sin reproche, ofreciendo un turno nuevo\" y lo volvió a mandar.", "Guardó el pedido armado en un documento del consultorio. La semana siguiente lo pegó en un chat nuevo cambiando solo los horarios."], "resultado": "Tiene un pedido armado que reusa todas las semanas, los tres mensajes salen en una sola vuelta y, cuando algo no le cierra, corrige el pedido original en vez de sumar mensajes al chat."}, "si_falla": [{"sintoma": "No encuentras cómo editar tu mensaje anterior.", "solucion": "En la experiencia nueva de Claude, donde chat y Cowork están unidos, la ayuda indica que ramificar una conversación desde un punto anterior no está disponible. Si no ves la opción, manda una sola corrección completa con todo lo que faltaba, o abre un chat nuevo con el pedido ya corregido."}, {"sintoma": "Editaste el mensaje y después no encuentras la respuesta vieja que te servía.", "solucion": "Según la ayuda de artifacts, editar un mensaje anterior crea otra versión del chat, con sus propios artifacts, y la anterior queda guardada. Busca en ese mensaje los controles para moverte entre versiones. Si algo de la versión vieja te sirve, cópialo a tu documento antes de seguir."}, {"sintoma": "Mandaste todo junto y Claude mezcló los pedidos o respondió solo uno.", "solucion": "Numera cada pedido, separa el material con un título (\"Material para las tres:\") y pide una sección con título por cada parte, como en el prompt Tres pedidos en uno. Si son tareas que no tienen nada que ver entre sí, van en chats distintos."}, {"sintoma": "Pediste que te pregunte lo que falta y Claude hace una pregunta por mensaje.", "solucion": "Escribe la regla explícita: \"si te falta algo, pregúntame todo junto, numerado, en un solo mensaje\". Si lo usas seguido, ponla en las instrucciones de tu Proyecto o usa la skill del kit, que ya lo trae."}, {"sintoma": "Tienes que volver a explicar en cada chat lo mismo sobre tu negocio.", "solucion": "La ayuda recomienda, en los planes pagos, usar la búsqueda de chats y la memoria para traer contexto de conversaciones anteriores en vez de repetirlo. Para material fijo (horarios, precios, reglas), súbelo a un Proyecto."}], "kit": [{"archivo": "armar-pedido-completo/SKILL.md", "que_es": "Skill para Claude que ordena un pedido suelto en cinco partes, junta todas las preguntas en una sola vuelta y después lo resuelve. Súbela en Customize → Skills.", "contenido": "---\nname: armar-pedido-completo\ndescription: 'Junta un pedido suelto en un mensaje completo (objetivo, contexto, material, formato, criterio) con todas las preguntas en una vuelta. Úsala con pedidos vagos o varias preguntas sueltas.'\n---\n\n# Armar un pedido completo\n\nTu trabajo es que el pedido salga bien a la primera. No resuelves la tarea hasta que el pedido esté completo.\n\n## Paso 1: lee lo que te mandaron y arma el pedido\n\nOrdena lo que dijo el usuario en estas cinco partes:\n\n1. **Qué necesita al final**: una línea (\"un mail para un cliente que se queja de una demora\").\n2. **Para quién es y para qué**: quién lo va a leer y qué tiene que lograr.\n3. **Material**: lo que pegó o adjuntó. Si hay varias preguntas sobre lo mismo, numéralas.\n4. **Formato y largo**: tabla, viñetas, párrafo, cuántas palabras.\n5. **Qué es bien hecho**: lo que tiene que tener sí o sí y lo que no quiere.\n\n## Paso 2: pregunta todo junto\n\nSi falta algo de las cinco partes, haz TODAS las preguntas en un solo mensaje, numeradas, con una opción sugerida entre corchetes para que pueda responder rápido. Ejemplo: \"2. ¿Qué largo? [sugiero 120 palabras]\".\n\n- Máximo cinco preguntas. Si faltan más cosas, elige las que más cambian el resultado y para el resto usa tu sugerencia.\n- No preguntes lo que ya está en el material.\n- Si no falta nada, saltea este paso.\n\n## Paso 3: muestra el pedido armado y resuélvelo\n\nCuando tengas las respuestas:\n\n1. Muestra el pedido completo en un bloque, con las cinco partes, para que el usuario lo pueda guardar y reusar.\n2. Abajo, resuelve la tarea. Si había varios pedidos, uno por sección con su título.\n\n## Reglas\n\n- No inventes datos del negocio del usuario (precios, nombres, fechas). Si hacen falta y no están, son una pregunta del paso 2.\n- Si el usuario dice \"hazlo igual\", resuelve con tus sugerencias y lista al final qué supusiste.\n- Si la respuesta anterior no le sirvió porque el pedido estaba flojo, recuérdale que puede editar su mensaje original con el pedido corregido en vez de mandar otra corrección.\n"}, {"archivo": "checklist-antes-de-mandar-pedido.md", "que_es": "Checklist de 30 segundos para releer un pedido antes de mandarlo y para decidir qué hacer cuando la respuesta no sirvió.", "contenido": "# Antes de mandar: 30 segundos\n\nPega esto donde lo veas (al lado del monitor, en una nota fija). Lee tu pedido con estas preguntas antes de apretar enviar.\n\n## El pedido\n\n- [ ] ¿Se entiende en la primera línea qué quiero al final?\n- [ ] ¿Dije para quién es?\n- [ ] ¿Está TODO el material, o algo lo iba a mandar \"después\"?\n- [ ] ¿Dije el formato y el largo?\n- [ ] ¿Dije qué no quiero?\n- [ ] ¿Alguien que no conoce mi negocio lo entendería?\n\n## Si son varias cosas\n\n- [ ] ¿Están numeradas?\n- [ ] ¿El material está separado de los pedidos?\n- [ ] ¿Pide que me pregunte todo junto si le falta algo?\n\n## Si el chat ya es largo\n\n- [ ] ¿Estoy pegando algo que ya está más arriba? Si es así, lo nombro (\"el texto que te pasé arriba\") en vez de pegarlo de nuevo.\n- [ ] ¿Cambié de tema? Entonces, chat nuevo con un resumen.\n\n## Si la respuesta no sirvió\n\n- [ ] ¿Fue porque mi pedido estaba flojo? Edito mi mensaje original y lo mando corregido.\n- [ ] ¿No veo la opción de editar? Mando UNA corrección completa, no varias chiquitas.\n- [ ] ¿Fue porque la respuesta estuvo mal aunque mi pedido estaba bien? Digo exactamente qué parte y por qué.\n\n## Mis pedidos que más repito (guárdalos armados)\n\n1. [NOMBRE] → [DÓNDE LO GUARDÉ]\n2. [NOMBRE] → [DÓNDE LO GUARDÉ]\n3. [NOMBRE] → [DÓNDE LO GUARDÉ]\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

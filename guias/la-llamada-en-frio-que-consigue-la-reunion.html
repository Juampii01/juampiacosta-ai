<script>var GUIA = {"slug": "la-llamada-en-frio-que-consigue-la-reunion", "t": "La llamada en frío que consigue la reunión", "d": "Cómo abrir en los primeros 10 segundos, qué decir en 20 y cómo terminar con una cita agendada. Con guion para armar con Claude.", "tema": "El roadmap para vender IA", "min": 9, "secciones": [{"h": "El objetivo es la reunión, no la venta", "p": ["En una llamada en frío no vendes tu sistema. Vendes una reunión corta de diagnóstico. Si intentas explicar todo, te cortan.", "Los primeros 7 a 10 segundos deciden si la llamada sigue. Prepárate: de pie o con la espalda recta, en un lugar tranquilo, sonriendo (se escucha) y con un poco más de pausas que en una charla normal."]}, {"h": "La apertura en cuatro partes", "pasos": ["Quién eres, en una línea.", "Un gancho específico para ese negocio: algo que viste de ellos.", "Algo que rompa lo esperado. Lo más simple: decir con honestidad que es una llamada en frío. Casi nadie lo hace y baja la guardia.", "Pedir permiso para seguir: \"¿te robo 30 segundos y si no te sirve cortamos?\"."], "aviso": "Evita abrir con \"¿cómo estás?\", con diminutivos o con tu currículum (\"soy ingeniero, tengo una agencia\"). Suena a venta y te cortan."}, {"h": "El pitch de 20 segundos y el resto de la llamada", "lista": ["Pitch: problema → resultado → prueba. \"Muchas clínicas pierden consultas que llegan de noche por WhatsApp. Instalo un asistente que responde y agenda solo. A una clínica de [CIUDAD] le está agendando [X] turnos por semana.\" Si no tienes casos, usa el resultado típico de la tecnología, sin inventar.", "Preguntas: detecta el dolor con preguntas sobre su negocio. Habla él el 80% del tiempo.", "Solo si confirmó el dolor, cuenta en una frase cómo lo resolverías. Si no hay dolor, no presentes nada.", "Califica: ¿es quien decide?, ¿lo quiere resolver ahora?", "Agenda en el momento: día, hora e invitación enviada mientras siguen en línea."]}, {"h": "Señales para seguir o para cortar", "lista": ["Señales de compra: pregunta cómo funciona o cuánto tarda, te da detalles de su operación, nombra el problema con ejemplos, pregunta precio o próximos pasos.", "Señales de salida: monosílabos, \"mándame info por mail\" sin más, \"no soy la persona\". Agradece y corta rápido.", "Si atiende otra persona: no aceptes \"manda la propuesta por mail\". Pregunta con amabilidad cuál es la mejor forma de hablar unos minutos con el dueño o el responsable."]}, {"h": "Arma tu guion con Claude", "prompts": [{"t": "Guion de llamada en frío", "c": "Ármame un guion de llamada en frío para ofrecer [SOLUCIÓN] a [RUBRO] en [CIUDAD/PAÍS]. El objetivo es agendar una llamada de diagnóstico de 20 minutos, no vender.\nIncluye: 1) apertura en 4 partes (quién soy, gancho específico, aviso honesto de que es una llamada en frío, pedido de permiso); 2) pitch de menos de 20 segundos con problema, resultado y prueba (no inventes casos: usa [MI CASO o \"sin casos todavía\"]); 3) 5 preguntas para detectar el dolor; 4) cómo pasar a agendar; 5) respuesta corta a: \"mandame un mail\", \"no tengo tiempo\", \"ya tenemos algo\", \"no soy quien decide\". Español [neutro/rioplatense], frases cortas para decir en voz alta."}]}], "faq": [{"q": "¿Cuántas llamadas por día?", "a": "Las que te dé tu cadena de números. Como mínimo para arrancar, 10 por día. Mídete por cuántas hiciste y si seguiste el guion, no por cuántos dijeron que no."}, {"q": "¿Grabo mis llamadas?", "a": "Sí, con permiso. Escucharte una vez por semana es la forma más rápida de mejorar: cuánto hablaste tú y qué señales se te pasaron."}], "cat": "roadmap", "parte": "construi"};</script>

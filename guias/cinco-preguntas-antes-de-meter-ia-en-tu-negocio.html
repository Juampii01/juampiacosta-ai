<script>var GUIA = {"slug": "cinco-preguntas-antes-de-meter-ia-en-tu-negocio", "t": "5 preguntas antes de meter IA en tu negocio", "d": "Un filtro simple para elegir qué tarea automatizar primero, sin gastar semanas en algo que no te cambia el día.", "tema": "IA en tu negocio", "min": 8, "fichaNombre": "Filtro de 5 preguntas", "ficha": [["Qué es", "Un método para ordenar tus tareas y elegir la primera que vale la pena automatizar."], ["Necesitás", "Una semana anotando lo que hacés y 30 minutos para puntuar."], ["Resultado", "Una lista corta de tareas, ordenada de la más conveniente a la menos."], ["Qué no hace", "No elige la herramienta: eso viene después."]], "secciones": [{"h": "El error de siempre: empezar por la herramienta", "p": ["La mayoría arranca al revés: ve una demo, se entusiasma y busca dónde meterla. Termina con un chatbot que nadie usa o una automatización que se rompe a la semana.", "El orden que funciona es otro: primero mirás tu negocio, después elegís la tarea y recién al final la herramienta. Estas cinco preguntas son el filtro del medio."]}, {"h": "Paso cero: anotá lo que hacés durante una semana", "p": ["Sin datos, vas a elegir por intuición. Durante una semana anotá cada tarea que te saca tiempo, aunque sea chica: responder consultas, pasar datos de un lado a otro, armar presupuestos, perseguir pagos."], "pasos": ["Abrí una planilla con cuatro columnas: Tarea, Veces por semana, Minutos cada vez, Quién la hace.", "Cada vez que hagas algo repetitivo, sumá una fila o actualizá la que ya existe.", "Pedile lo mismo a tu equipo, si tenés.", "Al final de la semana, multiplicá veces por minutos: ese es el tiempo real que te come cada tarea."]}, {"h": "Las 5 preguntas", "p": ["Pasá cada tarea de la lista por estas preguntas y puntuala del 1 al 5 en cada una."], "lista": ["1. ¿Se repite igual?: si cada vez es distinta y depende de tu criterio, es mala candidata. Si siempre sigue los mismos pasos, es buena.", "2. ¿Cuánto tiempo te come?: usá el número de tu semana anotada, no lo que creés.", "3. ¿Qué pasa si sale mal?: si un error se nota y se corrige rápido, vas bien. Si un error te hace perder un cliente o plata, empezá por otra cosa o dejá a una persona revisando.", "4. ¿La información está a mano?: si los datos están en mails, planillas o un sistema, se puede conectar. Si están en la cabeza de alguien o en papel, primero hay que ordenarlos.", "5. ¿Está escrito cómo se hace?: si podés explicarle el proceso a alguien nuevo en una hoja, se lo podés explicar a una IA. Si no, el primer trabajo es escribirlo."]}, {"h": "Cómo leer el puntaje", "p": ["Sumá los cinco puntos de cada tarea. Las que más suman van primero. En la pregunta 3, dale más puntos a lo que tiene menos riesgo.", "Ejemplo (inventado para mostrar el método): responder consultas de horarios saca 5, 4, 5, 5 y 4, o sea 23. Armar propuestas a medida saca 2, 4, 2, 3 y 2, o sea 13. La primera va antes, aunque la segunda parezca más importante."], "aviso": "Si una tarea tiene puntaje alto pero nadie la quiere soltar, hablalo antes. Automatizar algo que el equipo no acepta es tiempo perdido."}, {"h": "Dejá que Claude te ayude a puntuar", "p": ["Pegá tu lista de tareas y pedile un primer borrador del puntaje. Después lo corregís vos: vos conocés tu negocio, Claude no."], "prompts": [{"t": "Diagnóstico de tareas", "c": "Tengo un negocio de [RUBRO] con [CANTIDAD] personas. Esta es la lista de tareas que anoté durante una semana, con veces por semana, minutos cada vez y quién la hace:\n\n[PEGÁ TU LISTA]\n\nPara cada tarea:\n1. Calculá las horas por semana.\n2. Puntuala del 1 al 5 en: se repite igual, tiempo que consume, bajo riesgo si sale mal, información disponible y proceso escrito.\n3. Explicá cada puntaje en una línea.\n4. Ordená de mayor a menor puntaje total.\n5. Para las 3 primeras, decime qué parte podría hacer una IA y qué parte tiene que seguir revisando una persona.\nSi te falta información para puntuar algo, preguntame antes de inventar."}]}], "faq": [{"q": "¿Y si ninguna tarea saca puntaje alto?", "a": "Casi siempre es porque los procesos no están escritos o los datos están desordenados. Ese es tu primer proyecto: escribir y ordenar. Automatizar viene después."}, {"q": "¿Conviene empezar por lo que más tiempo me come?", "a": "No siempre. Si es algo riesgoso o muy variable, empezá por una tarea más chica y segura. Te sirve para aprender y ganar confianza."}, {"q": "¿Cuántas tareas automatizo a la vez?", "a": "Una. Cuando funciona sola durante unas semanas, pasás a la siguiente."}], "fuentes": ["https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: una veterinaria elige su primera tarea", "negocio": "Ejemplo inventado: una veterinaria de barrio en Rosario, con la dueña (veterinaria), un veterinario más, una recepcionista y un peluquero canino. Atienden consultas, vacunas, baños y venta de alimento. Los turnos se piden por WhatsApp y por teléfono.", "punto_de_partida": "La dueña quería \"un chatbot para WhatsApp\" porque lo vio en un video. No tenía claro qué le comía el día ni a la recepcionista.", "pasos": ["Armó la planilla de registro del kit con las cuatro columnas de la guía y le sumó dónde están los datos. La dejó abierta en la compu de recepción.", "Durante una semana, ella y la recepcionista anotaron todo lo repetitivo: confirmar turnos del día siguiente, responder si hay alimento de una marca, recordar vacunas vencidas, armar presupuestos de cirugías, pasar a la planilla los pagos con transferencia.", "El día 7 completó la hoja de puntaje con las fórmulas del kit: la planilla calculó las horas por semana y el puntaje de tiempo de cada tarea.", "Pegó la lista en Claude con el prompt de Diagnóstico de tareas de la guía. Claude le preguntó cuántas veces por semana se arman presupuestos de cirugía, porque no lo había anotado. Lo completó y volvió a pedir el puntaje.", "Corrigió dos puntajes que Claude no podía saber: subió el riesgo de \"responder dudas de síntomas por WhatsApp\" (un error puede ser grave para el animal) y bajó \"proceso escrito\" en presupuestos, porque cada cirugía la calcula ella a ojo.", "Las tres primeras quedaron: recordatorios de vacunas vencidas, confirmación de turnos y respuestas sobre stock de alimento. Las dudas de síntomas quedaron afuera: las responde siempre un veterinario.", "Habló con la recepcionista antes de decidir. Ella prefería soltar los recordatorios de vacunas, que hacía a fin de mes con apuro. Eligieron esa como única tarea para arrancar.", "Como el proceso no estaba escrito, el primer trabajo fue una hoja: de dónde sale la lista de vacunas vencidas, qué dice el mensaje, quién lo revisa y qué se hace si el dueño de la mascota contesta."], "resultado": "Quedó una planilla con lo que de verdad pasa en la semana, un ranking que la dueña entiende y puede defender, una sola tarea elegida con su responsable y el proceso escrito listo para pasarle a Claude. El chatbot de síntomas quedó descartado por riesgo, con el motivo anotado."}, "si_falla": [{"sintoma": "Pasa la semana y la planilla tiene cuatro filas: nadie anotó.", "solucion": "Anotar al final del día no funciona. Dejá la planilla abierta donde se trabaja (la compu de recepción, el celular) y anotá solo dos cosas en el momento: tarea y minutos. Las demás columnas las completás el día 7. Si se cortó, reiniciá la semana: con datos de memoria vas a elegir por intuición."}, {"sintoma": "Claude te devuelve puntajes que no tienen sentido para tu negocio o inventa cuántas veces hacés algo.", "solucion": "Claude no conoce tu negocio. Pedile que marque con \"?\" lo que no puede saber y que te pregunte antes de puntuar (el prompt de la guía ya lo pide; si lo recortaste, agregalo). Después corregí vos los puntajes de riesgo y de proceso escrito, que son los que más dependen de cómo trabajás."}, {"sintoma": "Las horas por semana que calcula Claude no coinciden con las tuyas.", "solucion": "Hacé la cuenta en la planilla con la fórmula (veces por minutos dividido 60) y pasale a Claude las horas ya calculadas. Las cuentas en una planilla son más fáciles de revisar que las de un chat."}, {"sintoma": "Todas las tareas sacan puntajes parecidos y no sabés cuál elegir.", "solucion": "Desempatá por riesgo: va primero la que tiene menos consecuencias si sale mal. Si siguen empatadas, la que más horas come según tu registro. Y si todas sacan poco en las preguntas 4 y 5, no es empate: es que primero hay que ordenar datos y escribir procesos."}, {"sintoma": "La tarea con mejor puntaje es justo la que la persona que la hace no quiere soltar.", "solucion": "No la impongas. Preguntale qué parte le molesta más de su trabajo: suele estar en el top 5 de todos modos. Empezar por algo que la persona pide te da una aliada para la siguiente tarea."}], "kit": [{"archivo": "planilla-registro-y-puntaje-de-tareas.md", "que_es": "La estructura de las dos hojas (registro semanal y puntaje), con las fórmulas para Google Sheets o Excel, la tabla para puntuar cada pregunta y la checklist del día 7.", "contenido": "# Registro semanal de tareas y puntaje\n\nPara usar en Google Sheets o Excel. Dos hojas: \"Registro\" (lo que anotás durante la semana) y \"Puntaje\" (lo que completás el día 7).\n\n## Hoja 1: Registro\n\nUna fila por tarea. Si la tarea se repite, no agregues otra fila: sumá 1 en \"veces\".\n\n| A: tarea | B: area | C: veces_por_semana | D: minutos_cada_vez | E: quien_la_hace | F: donde_estan_los_datos | G: notas |\n|---|---|---|---|---|---|---|\n| Responder consultas de horarios | Atención | | | | WhatsApp | |\n| Armar presupuestos | Ventas | | | | Planilla de precios | |\n| Perseguir pagos atrasados | Administración | | | | Planilla de cobros | |\n| [TAREA] | [ÁREA] | | | | [MAIL, PLANILLA, SISTEMA, PAPEL, CABEZA DE ALGUIEN] | |\n\nReglas para anotar:\n- Anotá en el momento, no a la noche de memoria.\n- Los minutos son los reales, contando interrupciones.\n- Si tenés equipo, cada uno anota lo suyo en la misma planilla (columna E).\n- \"donde_estan_los_datos\" te va a ayudar con la pregunta 4.\n\n## Hoja 2: Puntaje\n\nCopiá las tareas de la hoja Registro y completá:\n\n| A: tarea | B: horas_semana | C: p1_se_repite | D: p2_tiempo | E: p3_bajo_riesgo | F: p4_info_a_mano | G: p5_proceso_escrito | H: total |\n|---|---|---|---|---|---|---|---|\n\nFórmulas (fila 2, después arrastrá hacia abajo):\n\n- B2 (horas por semana): `=Registro!C2*Registro!D2/60`\n- D2 (puntaje de tiempo, relativo al resto): `=ROUND(1+4*(B2-MIN(B:B))/(MAX(B:B)-MIN(B:B)),0)`\n- H2 (total): `=SUM(C2:G2)`\n\nSi usás Sheets o Excel en inglés, las funciones son las de arriba. En español: `REDONDEAR`, `MIN`, `MAX`, `SUMA`, y el separador de argumentos puede ser punto y coma en vez de coma.\n\nCómo puntuar a mano (columnas C, E, F y G):\n\n| Puntaje | p1 se repite | p3 bajo riesgo | p4 info a mano | p5 proceso escrito |\n|---|---|---|---|---|\n| 5 | Siempre los mismos pasos | Un error se nota y se corrige al toque | Está en un sistema o planilla | Hay una hoja escrita |\n| 3 | Casi siempre, con alguna excepción | Un error molesta pero se arregla con una disculpa | Está en mails o chats | Se puede explicar en diez minutos |\n| 1 | Cada vez es distinta | Un error cuesta un cliente o plata | Está en papel o en la cabeza de alguien | \"Depende\" |\n\n## Día 7: la lectura\n\n- [ ] Ordená la hoja Puntaje por la columna H, de mayor a menor.\n- [ ] Mirá las tres primeras. Si alguna tiene 1 o 2 en p3 (riesgo), bajala o dejá a una persona revisando.\n- [ ] Si alguna tiene 1 o 2 en p4 o p5, el trabajo previo es ordenar datos o escribir el proceso.\n- [ ] Preguntale a quien hace la tarea si la quiere soltar.\n- [ ] Elegí una sola. Anotá acá cuál es y quién la sigue: [TAREA] / [RESPONSABLE] / [FECHA DE INICIO].\n- [ ] En unas semanas, si funciona sola, volvé a esta hoja y pasá a la siguiente.\n"}, {"archivo": "filtro-de-tareas/SKILL.md", "que_es": "Skill que aplica el filtro de 5 preguntas a tu lista, pregunta lo que falta en vez de inventarlo y te deja una sola tarea para arrancar. Guardala en una carpeta filtro-de-tareas, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: filtro-de-tareas\ndescription: 'Puntúa las tareas de un negocio con el filtro de 5 preguntas para elegir cuál apoyar primero con IA. Usala cuando peguen una lista o registro de tareas o pregunten qué automatizar primero.'\n---\n\n# Filtro de tareas\n\nAyudás al dueño de un negocio a elegir la primera tarea que conviene apoyar con IA. No elegís herramientas: eso viene después.\n\n## Qué te pasan\n\nUna lista de tareas, idealmente con estas columnas: Tarea, Veces por semana, Minutos cada vez, Quién la hace. Puede venir pegada, como planilla o como texto suelto.\n\nSi falta \"veces por semana\" o \"minutos cada vez\" en alguna tarea, preguntá antes de puntuar. No estimes vos esos números.\n\n## Cómo puntuás\n\nPara cada tarea, del 1 al 5:\n\n1. **Se repite igual**: 5 si siempre sigue los mismos pasos; 1 si cada vez es distinta y depende del criterio de alguien.\n2. **Tiempo que consume**: calculá horas por semana = veces x minutos / 60. Ordená todas las tareas por ese número y repartí el puntaje en forma relativa: la que más tiempo come, 5; la que menos, 1. Mostrá la cuenta.\n3. **Bajo riesgo si sale mal**: 5 si un error se nota y se corrige rápido; 1 si un error puede costar un cliente, plata o un problema legal. Ojo: más riesgo, menos puntos.\n4. **Información disponible**: 5 si los datos están en mails, planillas o un sistema; 1 si están en la cabeza de alguien o en papel.\n5. **Proceso escrito**: 5 si ya hay una hoja que explica cómo se hace; 3 si se puede explicar en voz alta en diez minutos; 1 si \"depende\" de todo.\n\nSi no tenés información para puntuar una pregunta, no la inventes: marcá \"?\" y listá qué necesitás saber.\n\n## Qué entregás, en este orden\n\n1. **Tabla**: tarea, horas por semana, los cinco puntajes, total, y una línea que justifique cada puntaje.\n2. **Ranking**: de mayor a menor total. En caso de empate, va primero la de menor riesgo y después la que más horas come.\n3. **Las 3 primeras**, cada una con:\n   - Qué parte podría preparar una IA.\n   - Qué parte sigue revisando o decidiendo una persona.\n   - Qué hay que ordenar antes (datos o proceso), si sacó menos de 3 en las preguntas 4 o 5.\n4. **Alertas**: tareas con mucho tiempo pero riesgo alto (sugerí empezar por otra más segura) y tareas que nadie del equipo quiere soltar (sugerí hablarlo antes).\n5. **Siguiente paso**: una sola tarea para empezar, en una frase.\n\n## Reglas\n\n- No prometas ahorros de tiempo ni de plata. Solo informás las horas que el usuario anotó.\n- No recomiendes herramientas concretas salvo que te las pidan.\n- Si ninguna tarea supera 15 puntos, decilo claro: el primer proyecto es escribir procesos y ordenar datos.\n- Recomendá una sola tarea a la vez.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "usalo"};</script>

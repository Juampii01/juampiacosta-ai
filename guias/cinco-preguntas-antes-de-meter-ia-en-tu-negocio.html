a anotada, no lo que creés.", "3. ¿Qué pasa si sale mal?: si un error se nota y se corrige rápido, vas bien. Si un error te hace perder un cliente o plata, empezá por otra cosa o dejá a una persona revisando.", "4. ¿La información está a mano?: si los datos están en mails, planillas o un sistema, se puede conectar. Si están en la cabeza de alguien o en papel, primero hay que ordenarlos.", "5. ¿Está escrito cómo se hace?: si podés explicarle el proceso a alguien nuevo en una hoja, se lo podés explicar a una IA. Si no, el primer trabajo es escribirlo."]}, {"h": "Cómo leer el puntaje", "p": ["Sumá los cinco puntos de cada tarea. Las que más suman van primero. En la pregunta 3, dale más puntos a lo que tiene menos riesgo.", "Ejemplo (inventado para mostrar el método): responder consultas de horarios saca 5, 4, 5, 5 y 4, o sea 23. Armar propuestas a medida saca 2, 4, 2, 3 y 2, o sea 13. La primera va antes, aunque la segunda parezca más importante."], "aviso": "Si una tarea tiene puntaje alto pero nadie la quiere soltar, hablalo antes. Automatizar algo que el equipo no acepta es tiempo perdido."}, {"h": "Dejá que Claude te ayude a puntuar", "p": ["Pegá tu lista de tareas y pedile un primer borrador del puntaje. Después lo corregís vos: vos conocés tu negocio, Claude no."], "prompts": [{"t": "Diagnóstico de tareas", "c": "Tengo un negocio de [RUBRO] con [CANTIDAD] personas. Esta es la lista de tareas que anoté durante una semana, con veces por semana, minutos cada vez y quién la hace:\n\n[PEGÁ TU LISTA]\n\nPara cada tarea:\n1. Calculá las horas por semana.\n2. Puntuala del 1 al 5 en: se repite igual, tiempo que consume, bajo riesgo si sale mal, información disponible y proceso escrito.\n3. Explicá cada puntaje en una línea.\n4. Ordená de mayor a menor puntaje total.\n5. Para las 3 primeras, decime qué parte podría hacer una IA y qué parte tiene que seguir revisando una persona.\nSi te falta información para puntuar algo, preguntame antes de inventar."}]}], "faq": [{"q": "

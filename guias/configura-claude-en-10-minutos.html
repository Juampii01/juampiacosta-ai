<script>var GUIA = {"slug": "configura-claude-en-10-minutos", "t": "Configurá Claude en 10 minutos para que sepa quién sos", "d": "Instrucciones personales, memoria y búsqueda de chats: lo que tenés que dejar listo una sola vez para no explicarle todo de nuevo en cada chat.", "tema": "Primeros pasos", "min": 8, "fichaNombre": "Configuración inicial", "ficha": [["Qué es", "Tres ajustes de tu cuenta que hacen que Claude te conozca desde el primer mensaje."], ["Necesitás", "Una cuenta de Claude. Las instrucciones y la memoria están en todos los planes; la búsqueda de chats, en los pagos."], ["Tiempo", "Unos 10 minutos."], ["Qué no hace", "No cambia lo que Claude sabe del mundo: cambia lo que sabe de vos y cómo te responde."]], "secciones": [{"h": "Qué vas a dejar configurado", "lista": ["Instrucciones: un texto tuyo que Claude lee en todas tus conversaciones. Quién sos, a qué te dedicás y cómo querés que te conteste.", "Memoria: Claude va guardando lo importante de tus chats para usarlo después. La podés ver, corregir y borrar.", "Búsqueda de chats: Claude puede buscar en tus conversaciones anteriores cuando le pedís algo que ya hablaron.", "Skills: paquetes de instrucciones para tareas puntuales. Reemplazan a los viejos estilos de respuesta."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tenés Claude en español, vas a ver la traducción en el mismo lugar."]}, {"h": "1. Escribí tus instrucciones", "pasos": ["Hacé clic en tus iniciales, abajo a la izquierda, y entrá a Settings.", "Abrí la sección Your Claude (en la versión anterior se llama Account).", "Buscá el campo Instructions y pegá tu texto. Usá el prompt de abajo si no sabés qué poner.", "Guardá. Desde ese momento se aplica a todos tus chats."], "prompts": [{"t": "Que Claude te entreviste", "c": "Quiero escribir mis instrucciones personales para vos. Haceme 8 preguntas, de a una, para conocerme: a qué me dedico, quiénes son mis clientes, qué tareas hago todas las semanas, cómo me gusta que me respondan y qué cosas no quiero que hagas.\nCuando termines, escribí mis instrucciones en primera persona, en menos de 200 palabras, listas para pegar."}, {"t": "Plantilla para completar", "c": "Me llamo [TU NOMBRE] y tengo [TU NEGOCIO], que se dedica a [QUÉ HACÉS] para [TU CLIENTE IDEAL].\nTrabajo en [PAÍS] y escribo en español rioplatense.\nTareas en las que más te voy a usar: [3 TAREAS].\nCómo quiero que me respondas:\n- Directo y al grano, sin vueltas.\n- Si no sabés algo o te falta un dato, preguntame antes de inventar.\n- Cuando haya pasos, numeralos.\n- Si mi idea tiene un problema, decímelo."}]}, {"h": "2. Revisá la memoria", "p": ["La memoria viene activada en los planes individuales. En Team y Enterprise depende de lo que decida quien administra la cuenta."], "pasos": ["En Settings → Your Claude buscá el interruptor Generate memory from chats. Ahí podés pausarla o resetearla.", "Tocá Manage al lado de Your memory para ver qué guardó sobre vos. Podés editar o borrar cada tema.", "Si querés que recuerde algo, decíselo en el chat: \"acordate de que mis clientes son pymes de Córdoba\"."], "aviso": "Resetear la memoria borra todo lo guardado y no se puede deshacer. Si solo querés frenarla un tiempo, usá pausar."}, {"h": "3. Activá la búsqueda de chats (planes pagos)", "p": ["Con Search and reference chats, Claude puede ir a buscar algo que ya hablaron en otra conversación. Busca en los chats que están fuera de proyectos y, dentro de cada proyecto, solo en los chats de ese proyecto. Nunca mezcla proyectos entre sí.", "Se activa o desactiva en Settings → Your Claude."]}, {"h": "4. Los estilos ahora son skills", "p": ["El menú de estilos de respuesta se está retirando. Los estilos personalizados que tenías se pasan solos a skills, que vienen apagadas: las prendés en Customize → Skills.", "Si no querés usar skills, poné en tus instrucciones cómo querés que te escriba (largo, tono, formato). Tiene el mismo efecto para todas tus conversaciones."]}, {"h": "Chats que no quedan guardados", "p": ["Para algo que no querés que quede en la memoria ni en el historial, abrí un chat nuevo fuera de un proyecto y tocá el ícono del fantasma arriba a la derecha. Ese chat incógnito no se guarda y Claude no lo va a buscar después.", "En la web o en la app de escritorio también podés apagar la memoria para un solo chat: tocá + en la caja de mensaje y desactivá Memory antes de mandar el primer mensaje."], "prompts": [{"t": "Probá que funcione", "c": "Sin buscar en internet: ¿qué sabés de mí y de mi negocio? Decime también qué te falta saber para ayudarme mejor."}]}], "faq": [{"q": "¿Las instrucciones y la memoria son lo mismo?", "a": "No. Las instrucciones las escribís vos y se aplican siempre. La memoria la arma Claude con lo que van hablando, y vos la podés corregir."}, {"q": "¿Funciona en el plan gratis?", "a": "Las instrucciones y la memoria sí. La búsqueda de chats anteriores es de los planes pagos."}, {"q": "Claude no tiene en cuenta mis instrucciones", "a": "Hacelas más cortas y concretas. Si un proyecto tiene sus propias instrucciones, esas mandan dentro del proyecto."}], "fuentes": ["https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features", "https://support.claude.com/en/articles/11817273", "https://support.claude.com/en/articles/10181068-configure-and-use-styles"], "cat": "primeros-pasos", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "configura-claude-en-10-minutos", "t": "Configurá Claude en 10 minutos para que sepa quién sos", "d": "Instrucciones personales, memoria y búsqueda de chats: lo que tenés que dejar listo una sola vez para no explicarle todo de nuevo en cada chat.", "tema": "Primeros pasos", "min": 8, "fichaNombre": "Configuración inicial", "ficha": [["Qué es", "Tres ajustes de tu cuenta que hacen que Claude te conozca desde el primer mensaje."], ["Necesitás", "Una cuenta de Claude. Las instrucciones y la memoria están en todos los planes; la búsqueda de chats, en los pagos."], ["Tiempo", "Unos 10 minutos."], ["Qué no hace", "No cambia lo que Claude sabe del mundo: cambia lo que sabe de vos y cómo te responde."]], "secciones": [{"h": "Qué vas a dejar configurado", "lista": ["Instrucciones: un texto tuyo que Claude lee en todas tus conversaciones. Quién sos, a qué te dedicás y cómo querés que te conteste.", "Memoria: Claude va guardando lo importante de tus chats para usarlo después. La podés ver, corregir y borrar.", "Búsqueda de chats: Claude puede buscar en tus conversaciones anteriores cuando le pedís algo que ya hablaron.", "Skills: paquetes de instrucciones para tareas puntuales. Reemplazan a los viejos estilos de respuesta."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tenés Claude en español, vas a ver la traducción en el mismo lugar."]}, {"h": "1. Escribí tus instrucciones", "pasos": ["Hacé clic en tus iniciales, abajo a la izquierda, y entrá a Settings.", "Abrí la sección Your Claude (en la versión anterior se llama Account).", "Buscá el campo Instructions y pegá tu texto. Usá el prompt de abajo si no sabés qué poner.", "Guardá. Desde ese momento se aplica a todos tus chats."], "prompts": [{"t": "Que Claude te entreviste", "c": "Quiero escribir mis instrucciones personales para vos. Haceme 8 preguntas, de a una, para conocerme: a qué me dedico, quiénes son mis clientes, qué tareas hago todas las semanas, cómo me gusta que me respondan y qué cosas no quiero que hagas.\nCuando termines, escribí mis instrucciones en primera persona, en menos de 200 palabras, listas para pegar."}, {"t": "Plantilla para completar", "c": "Me llamo [TU NOMBRE] y tengo [TU NEGOCIO], que se dedica a [QUÉ HACÉS] para [TU CLIENTE IDEAL].\nTrabajo en [PAÍS] y escribo en español rioplatense.\nTareas en las que más te voy a usar: [3 TAREAS].\nCómo quiero que me respondas:\n- Directo y al grano, sin vueltas.\n- Si no sabés algo o te falta un dato, preguntame antes de inventar.\n- Cuando haya pasos, numeralos.\n- Si mi idea tiene un problema, decímelo."}]}, {"h": "2. Revisá la memoria", "p": ["La memoria viene activada en los planes individuales (Free, Pro, Max y Ultra). En Team y Enterprise el owner decide si está disponible y, según la organización, puede arrancar prendida o apagada para cada miembro."], "pasos": ["En Settings → Your Claude buscá el interruptor Generate memory from chats. Ahí podés pausarla o resetearla.", "Tocá Manage al lado de Your memory para ver qué guardó sobre vos. Podés editar o borrar cada tema.", "Si querés que recuerde algo, decíselo en el chat: \"acordate de que mis clientes son pymes de Córdoba\"."], "aviso": "Resetear la memoria borra todo lo guardado y no se puede deshacer. Si solo querés frenarla un tiempo, usá pausar."}, {"h": "3. Activá la búsqueda de chats (planes pagos)", "p": ["Con Search and reference chats, Claude puede ir a buscar algo que ya hablaron en otra conversación. Busca en los chats que están fuera de proyectos y, dentro de cada proyecto, solo en los chats de ese proyecto. Nunca mezcla proyectos entre sí.", "Se activa o desactiva en Settings → Your Claude."]}, {"h": "4. Los estilos ahora son skills", "p": ["El menú de estilos de respuesta se está retirando. Los estilos personalizados que tenías se pasan solos a skills, que vienen apagadas: las prendés en Customize → Skills. Para que las skills funcionen tiene que estar prendida la opción Code execution and file creation (en el diseño nuevo se llama Create and edit files), en Settings → Capabilities.", "Si no querés usar skills, poné en tus instrucciones cómo querés que te escriba (largo, tono, formato). Tiene el mismo efecto para todas tus conversaciones."]}, {"h": "Chats que no quedan guardados", "p": ["Para algo que no querés que quede en la memoria ni en el historial, abrí un chat nuevo fuera de un proyecto y tocá el ícono del fantasma arriba a la derecha. Ese chat incógnito no queda en tu historial ni en la memoria, y Claude no lo va a buscar después. Igual Anthropic lo conserva 30 días por seguridad (o más, si tu organización tiene otra política de retención).", "En la web o en la app de escritorio también podés apagar la memoria para un solo chat: tocá + en la caja de mensaje y desactivá Memory antes de mandar el primer mensaje."], "prompts": [{"t": "Probá que funcione", "c": "Sin buscar en internet: ¿qué sabés de mí y de mi negocio? Decime también qué te falta saber para ayudarme mejor."}]}], "faq": [{"q": "¿Las instrucciones y la memoria son lo mismo?", "a": "No. Las instrucciones las escribís vos y se aplican siempre. La memoria la arma Claude con lo que van hablando, y vos la podés corregir."}, {"q": "¿Funciona en el plan gratis?", "a": "Las instrucciones y la memoria sí. La búsqueda de chats anteriores es de los planes pagos."}, {"q": "Claude no tiene en cuenta mis instrucciones", "a": "Hacelas más cortas y concretas. Dentro de un proyecto también cuentan las instrucciones del proyecto: revisá que no digan lo contrario que las tuyas."}], "fuentes": ["https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features", "https://support.claude.com/en/articles/11817273", "https://support.claude.com/en/articles/10181068-configure-and-use-styles", "https://support.claude.com/en/articles/12260368", "https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: una estética deja Claude listo antes de abrir el turno", "negocio": "Ejemplo inventado: un centro de estética en Rosario, con la dueña y dos cosmetólogas. Los turnos entran por WhatsApp e Instagram, y la dueña usa Claude en el plan Pro desde la compu y el celular.", "punto_de_partida": "Cada vez que le pedía a Claude una respuesta para una clienta tenía que explicarle de nuevo qué tratamientos hacen, cómo escribe y que no ponga precios. Las respuestas le salían formales, con \"estimada\" y signos de exclamación.", "pasos": ["Abrió un chat nuevo y pegó el prompt Que Claude te entreviste. Contestó las 8 preguntas y Claude le devolvió sus instrucciones en primera persona.", "Las comparó con la plantilla A del kit y sumó dos líneas que faltaban: que los precios salen de la lista que ella pasa y que nunca se confirman turnos sin revisar la agenda.", "En Settings → Your Claude pegó el texto en Instructions. En un chat nuevo probó: \"Sin buscar en internet: ¿qué sabés de mí y de mi negocio?\". La respuesta coincidió con lo que había escrito.", "Abrió Manage al lado de Your memory. Borró un tema viejo de cuando usaba Claude para la facultad y le dijo en un chat: \"acordate de que trabajamos solo con turno previo\".", "Dejó prendido Search and reference chats para poder pedirle \"buscá lo que hablamos del tratamiento nuevo\".", "Prendió Code execution and file creation en Settings → Capabilities, completó la skill tono-de-mi-negocio del kit con tres mensajes suyos de WhatsApp como ejemplo, la comprimió en ZIP y la subió en Customize → Skills.", "Para una consulta con datos de salud de una clienta usó un chat incógnito, así no quedó en la memoria."], "resultado": "Claude ya arranca sabiendo qué hace el centro, cómo escribe la dueña y qué no tiene que inventar. Las respuestas para clientas salen en voseo, cortas y con [A CONFIRMAR] donde falta un precio, y la dueña revisa la memoria una vez por mes con la checklist."}, "si_falla": [{"sintoma": "En Settings no aparece Your Claude.", "solucion": "Tenés el diseño anterior de Settings. Las instrucciones están en Settings → Account, en el campo Instructions for Claude, y la memoria en Settings → Memory. Es lo mismo con otro nombre."}, {"sintoma": "Prendí un estilo migrado en Customize → Skills pero no cambia nada, o la sección Skills está en gris.", "solucion": "Prendé Code execution and file creation (o Create and edit files) en Settings → Capabilities. En una cuenta Enterprise, si sigue en gris, el owner tiene que habilitar la ejecución de código y las skills en Organization settings → Plugins & skills."}, {"sintoma": "Claude no se acuerda de algo que hablamos dentro de un proyecto.", "solucion": "Cada proyecto tiene su propia memoria, separada del resto, y la búsqueda de chats dentro de un proyecto solo mira los chats de ese proyecto. Pedíselo desde un chat del mismo proyecto, o sumá ese dato a los archivos del proyecto."}, {"sintoma": "Le pido que busque un chat viejo y dice que no lo encuentra.", "solucion": "Revisá tres cosas: que tengas un plan pago, que Search and reference chats esté prendido en Settings → Your Claude y que ese chat no haya sido incógnito, porque esos no se buscan nunca."}, {"sintoma": "En una cuenta de la empresa (Team o Enterprise) no veo la memoria o no la puedo prender.", "solucion": "En esos planes la memoria depende del owner de la organización. Pedile que la habilite. Mientras tanto, poné lo importante en tus instrucciones, que funcionan igual."}], "kit": [{"archivo": "instrucciones-personales-tres-plantillas.md", "que_es": "Tres plantillas de instrucciones personales (dueño de negocio, freelancer, dev junior) para completar y pegar en Settings → Your Claude → Instructions.", "contenido": "# Instrucciones personales para Claude: tres plantillas\n\nElegí la que más se parece a vos, completá los corchetes y pegala en Settings → Your Claude → Instructions (en el diseño anterior: Settings → Account → Instructions for Claude). Que quede en menos de 200 palabras: si te pasás, sacá lo que Claude ya haría igual.\n\n## A. Dueño o dueña de un negocio\n\nMe llamo [NOMBRE] y tengo [NEGOCIO: RUBRO Y CIUDAD]. Somos [CANTIDAD] personas.\nMis clientes son [QUIÉNES SON] y llegan por [CANALES: WHATSAPP, INSTAGRAM, LOCAL, MAIL].\nTe voy a usar sobre todo para: [EJ.: responder consultas, armar presupuestos, escribir posteos].\n\nCómo quiero que me respondas:\n- En español rioplatense, con voseo. Directo, sin introducciones.\n- Si un texto es para un cliente, dámelo listo para copiar y pegar.\n- Nunca inventes precios, stock ni condiciones: si no te los di, preguntame.\n- Si mi idea tiene un problema, decímelo antes de hacerla.\n- Cuando haya pasos, numeralos.\n\n## B. Freelancer\n\nSoy [NOMBRE], [PROFESIÓN] freelance en [PAÍS]. Trabajo con [TIPO DE CLIENTES] y cobro [POR HORA / POR PROYECTO].\nTe voy a usar para: [EJ.: propuestas, mails a clientes, ordenar mi semana, revisar entregas].\n\nCómo quiero que me respondas:\n- Corto y al grano. Si te pido un mail, solo el mail.\n- Tono profesional y cercano, en voseo, salvo que te diga que el cliente es de otro país.\n- Si un pedido de cliente es ambiguo, señalame qué tengo que preguntarle.\n- No me des listas de consejos genéricos: dame la próxima acción concreta.\n\n## C. Dev junior\n\nSoy [NOMBRE], desarrollador junior. Trabajo con [LENGUAJES Y HERRAMIENTAS].\nEstoy aprendiendo [TEMA], así que prefiero entender antes que copiar.\n\nCómo quiero que me respondas:\n- Cuando me des código, explicá en 2 o 3 líneas qué hace y por qué.\n- Si hay una forma más simple, mostrámela primero.\n- Si no estás seguro de cómo funciona una librería o una versión, decímelo y no inventes.\n- Respondé en español; los nombres de comandos y funciones, tal cual en inglés.\n\n## Para probar que quedó bien\n\nAbrí un chat nuevo y pegá: \"Sin buscar en internet: ¿qué sabés de mí y cómo me vas a responder?\". Si algo no coincide con lo que escribiste, reescribilo más corto y concreto.\n"}, {"archivo": "tono-de-mi-negocio/SKILL.md", "que_es": "Skill que reemplaza a un estilo de respuesta: escribe todo lo que va a un cliente con tu tono y sin inventar datos. Completá los corchetes, guardala en una carpeta tono-de-mi-negocio, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: tono-de-mi-negocio\ndescription: 'Escribe textos para clientes con el tono de mi negocio (mensajes, mails, posteos, respuestas). Usala al escribir o responder algo que lee un cliente, o con \"con mi tono\" o \"como escribo yo\".'\n---\n\n# Tono de mi negocio\n\nEscribís textos que van a leer los clientes de [NOMBRE DEL NEGOCIO]. Completá los corchetes una sola vez antes de subir la skill.\n\n## Quién escribe\n\n- Negocio: [QUÉ HACÉS, EN UNA LÍNEA].\n- Clientes: [QUIÉNES SON, EN UNA LÍNEA].\n- Firma: [NOMBRE CON EL QUE FIRMÁS, O \"SIN FIRMA\"].\n\n## Cómo suena\n\n- Español rioplatense, con voseo.\n- Frases cortas. Una idea por oración.\n- Cercano pero profesional: [EJEMPLO: \"como le hablo a un cliente que ya conozco\"].\n- Sin signos de exclamación salvo para saludar o felicitar.\n- Palabras que uso: [3 A 5 PALABRAS O EXPRESIONES TUYAS].\n- Palabras que no uso nunca: [EJEMPLO: \"estimado\", \"a la brevedad\", \"no dude en contactarnos\"].\n\n## Largo según el canal\n\n- WhatsApp o mensaje directo: de 2 a 4 líneas.\n- Mail: asunto de menos de 8 palabras y cuerpo de 4 a 8 líneas.\n- Posteo: un gancho en la primera línea, 3 a 5 líneas de cuerpo y un cierre que diga qué hacer.\n\nSi no te digo el canal, preguntámelo antes de escribir.\n\n## Reglas\n\n- No inventes precios, horarios, plazos ni condiciones. Si el texto los necesita y no te los di, dejá [A CONFIRMAR] y avisame al final.\n- No prometas cosas que no están en lo que te pasé.\n- Si el cliente está enojado, primero reconocé el problema en una línea y después la solución. Sin disculpas largas.\n\n## Un texto mío de ejemplo\n\n[PEGÁ ACÁ UN MENSAJE O MAIL QUE HAYAS ESCRITO VOS Y TE GUSTE CÓMO QUEDÓ]\n\nUsalo para copiar el tono, no el contenido.\n"}, {"archivo": "checklist-configuracion-inicial-claude.md", "que_es": "Checklist para dejar instrucciones, memoria, búsqueda de chats, skills y privacidad configuradas, con una revisión mensual de 5 minutos.", "contenido": "# Checklist: Claude configurado en 10 minutos\n\nMarcá cada punto. Los nombres de los menús están como en la ayuda oficial (en inglés); en Claude en español los ves traducidos en el mismo lugar.\n\n## Instrucciones (todos los planes)\n- [ ] Entré a Settings → Your Claude (o Account en el diseño anterior).\n- [ ] Pegué mis instrucciones en Instructions, en menos de 200 palabras.\n- [ ] Probé en un chat nuevo que las usa.\n\n## Memoria\n- [ ] Revisé que Generate memory from chats esté como quiero (prendida o pausada).\n- [ ] Abrí Manage al lado de Your memory y corregí o borré lo que no va.\n- [ ] Le dije en un chat una cosa que quiero que recuerde (\"acordate de que...\").\n- [ ] Sé que resetear borra todo, también la memoria de los proyectos, y no se puede deshacer.\n- [ ] (Team o Enterprise) Si no veo la memoria, le pregunté al owner de la cuenta.\n\n## Búsqueda de chats (planes pagos)\n- [ ] Search and reference chats está prendido.\n- [ ] Sé que dentro de un proyecto solo busca en los chats de ese proyecto.\n\n## Skills\n- [ ] Prendí Code execution and file creation (o Create and edit files) en Settings → Capabilities.\n- [ ] En Customize → Skills prendí los estilos migrados que quiero usar, o subí la skill tono-de-mi-negocio.\n\n## Privacidad\n- [ ] Sé abrir un chat incógnito (fantasma arriba a la derecha, en un chat nuevo fuera de un proyecto).\n- [ ] Sé apagar la memoria para un solo chat: + en la caja de mensaje, Memory apagado, antes del primer mensaje.\n\n## Revisión mensual (5 minutos)\n- [ ] Releo mis instrucciones: ¿siguen siendo ciertas?\n- [ ] Reviso Your memory y borro lo viejo.\n"}], "verificada": "2026-11-08", "cat": "primeros-pasos", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "escribi-la-especificacion-antes-de-programar", "t": "Escribí la especificación antes de programar", "d": "Un documento corto que dice qué hace tu app, para quién, qué pantallas tiene, qué datos guarda y qué no hace. Claude lo usa como guía para construir.", "tema": "Creá tu app", "min": 7, "secciones": [{"h": "Por qué conviene escribirla primero", "p": ["Cuando le pedís algo vago a Claude, rellena los huecos con suposiciones. A veces acierta, muchas veces no. La especificación cierra esos huecos antes de que se conviertan en código.", "Además te sirve a vos: si en tres semanas no te acordás por qué hiciste algo, está escrito. Y si le vendés la app a un cliente, es la base para acordar qué entra y qué no."]}, {"h": "Las seis partes", "lista": ["Qué hace: una o dos frases, sin palabras técnicas.", "Para quién: quién la usa y si hay tipos de usuario distintos (cliente, administrador).", "Pantallas: cada pantalla en orden y qué se puede hacer en ella.", "Datos: qué se guarda (por ejemplo, nombre, fecha del turno) y quién puede verlo o cambiarlo.", "Qué NO hace: lo que queda afuera de esta versión. Es la parte más importante.", "Cómo sé que funciona: dos o tres pruebas concretas que tienen que salir bien."]}, {"h": "Plantilla para copiar", "p": ["Copiala en un archivo llamado ESPECIFICACION.md en la carpeta del proyecto y completala. Si no sabés qué poner en alguna parte, dejala vacía y pedile ayuda a Claude con el prompt de la sección siguiente."], "prompts": [{"t": "Plantilla de especificación", "c": "# Especificación: [NOMBRE DE LA APP]\n\n## Qué hace\n[UNA O DOS FRASES]\n\n## Para quién\n- [TIPO DE USUARIO 1]: [QUÉ NECESITA]\n- [TIPO DE USUARIO 2, SI HAY]: [QUÉ NECESITA]\n\n## Pantallas\n1. [PANTALLA]: [QUÉ SE VE Y QUÉ SE PUEDE HACER]\n2. [PANTALLA]: [...]\n\n## Datos\n- [DATO]: lo carga [QUIÉN], lo puede ver [QUIÉN], lo puede cambiar [QUIÉN]\n\n## Qué NO hace (en esta versión)\n- [COSA QUE QUEDA AFUERA]\n- [OTRA]\n\n## Cómo sé que funciona\n- [PRUEBA 1: QUÉ HAGO Y QUÉ TIENE QUE PASAR]\n- [PRUEBA 2]\n\n## Preguntas abiertas\n- [LO QUE TODAVÍA NO DECIDISTE]"}]}, {"h": "Si no sabés por dónde empezar, que Claude te entreviste", "p": ["En vez de llenar la plantilla solo, dejá que Claude te haga preguntas. Vos respondés con tus palabras y él ordena todo."], "prompts": [{"t": "Entrevista para la especificación", "c": "Quiero construir una app y antes de escribir código necesito una especificación corta.\nMi idea en una frase: [QUÉ HACE TU APP].\nPara quién es: [QUIÉN LA VA A USAR].\nEntrevistame de a una pregunta por vez hasta tener claro:\n1. Qué problema resuelve y cómo sabemos que funciona.\n2. Quién la usa (y si hay distintos tipos de usuario, como cliente y administrador).\n3. Las pantallas, en orden, y qué se puede hacer en cada una.\n4. Qué datos se guardan y quién puede ver o cambiar cada uno.\n5. Qué NO hace en esta primera versión.\nCuando tengas todo, armá el documento en un archivo ESPECIFICACION.md, con lenguaje simple, sin código. Al final agregá una lista de preguntas abiertas. No empieces a programar."}]}, {"h": "Cómo usarla con Claude Code", "pasos": ["Guardá el archivo ESPECIFICACION.md en la carpeta raíz del proyecto.", "En cada pedido importante, mencionalo con @ESPECIFICACION.md para que Claude lo lea antes de trabajar.", "Cuando cambies de idea, actualizá primero el documento y después pedile a Claude que ajuste el código.", "Antes de publicar, pedile que compare la app con la especificación y te diga qué falta o qué sobra."], "prompts": [{"t": "Revisar contra la especificación", "c": "Compará lo que hay construido en este proyecto con @ESPECIFICACION.md.\nDecime en una tabla: qué está hecho, qué falta, y qué hay en el código que la especificación no pide.\nNo cambies nada todavía."}]}], "faq": [{"q": "¿Tiene que ser larga?", "a": "No. Una o dos páginas alcanzan. Si se hace muy larga, probablemente la app es demasiado grande para una primera versión: pasá cosas a \"Qué NO hace\"."}, {"q": "¿Es lo mismo que el CLAUDE.md?", "a": "No. El CLAUDE.md tiene reglas de cómo trabajar en el proyecto (estilo, comandos). La especificación describe qué tiene que hacer la app. Conviven bien."}, {"q": "¿Sirve para vender a clientes?", "a": "Sí. Mandarle al cliente la parte de \"Qué hace\" y \"Qué NO hace\" antes de arrancar te ahorra discusiones sobre lo que estaba incluido."}], "fuentes": ["https://code.claude.com/docs/en/common-workflows", "https://code.claude.com/docs/en/permission-modes", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: la especificación de una app de turnos para una peluquería", "negocio": "Ejemplo inventado: una peluquería con tres peluqueras en Villa Crespo, Buenos Aires. La dueña da los turnos por WhatsApp. Quien arma la app es un dev junior que trabaja como freelancer y quiere cobrarle un precio cerrado.", "punto_de_partida": "La dueña pidió \"una app de turnos como la de los consultorios\". El dev ya tenía una versión empezada sin especificación y cada reunión aparecía algo nuevo: señas, recordatorios, cuentas de cliente.", "pasos": ["Abrió Claude Code en la carpeta del proyecto, copió la skill especificacion-app del kit en .claude/skills/ y corrió /especificacion-app turnos online para una peluquería de barrio.", "Claude lo entrevistó de a una pregunta. En la parte de datos preguntó quién puede ver el celular de los clientes; el dev no lo sabía, así que quedó en Preguntas abiertas y lo consultó con la dueña esa tarde.", "En Qué NO hace, Claude propuso pagos online, recordatorios y cuentas de cliente. La dueña confirmó que los tres quedaban para una segunda versión. Eso cortó la discusión que se repetía en cada reunión.", "El resultado quedó como el archivo ESPECIFICACION-ejemplo-turnos-peluqueria.md del kit: seis pantallas, cuatro tipos de datos, cinco cosas afuera y tres pruebas.", "Con la plantilla alcance-para-cliente-app.md del kit le mandó a la dueña Qué hace, Qué incluye y Qué NO incluye. Ella respondió \"Ok, arrancamos\" y él guardó ese mensaje.", "En el CLAUDE.md del proyecto sumó la línea \"Lo que tiene que hacer la app está en @ESPECIFICACION.md. Si un pedido la contradice, avisame antes de programar.\" para que Claude la cargue en cada sesión.", "Para construir, activó el modo plan con Shift+Tab y pidió un plan a partir de @ESPECIFICACION.md. Claude no editó nada hasta que él aprobó el plan.", "A mitad del trabajo la dueña pidió que los clientes pudieran cancelar solos. El dev lo anotó primero en la sección Cambios de la especificación, lo presupuestó aparte y recién cuando ella aprobó le pidió a Claude que ajustara el código.", "Antes de entregar corrió el prompt Revisar contra la especificación. La tabla marcó una pantalla de estadísticas que nadie había pedido; la sacó."], "resultado": "Quedó una especificación de dos páginas que el cliente aprobó por escrito, un CLAUDE.md que la carga en cada sesión y una lista de cambios con fecha. La app se entregó cuando pasaron las tres pruebas de Cómo sé que funciona, y lo que quedó afuera está anotado para una segunda versión."}, "si_falla": [{"sintoma": "Claude empieza a escribir código en medio de la entrevista o apenas termina el documento.", "solucion": "Hacé la entrevista en modo plan: apretá Shift+Tab hasta que diga plan mode, o empezá el pedido con /plan. En ese modo Claude lee y propone, pero no edita archivos hasta que apruebes. Si ya escribió código, usá /rewind y elegí Restore code."}, {"sintoma": "En sesiones nuevas Claude no tiene en cuenta la especificación.", "solucion": "Mencionarla con @ESPECIFICACION.md la carga solo en ese pedido. Para que entre en cada sesión, agregá en el CLAUDE.md del proyecto una línea con @ESPECIFICACION.md: Claude Code expande esos archivos importados al arrancar."}, {"sintoma": "La especificación ocupa cinco páginas y Claude se saltea partes al construir.", "solucion": "Es señal de que la versión es demasiado grande. Pedile a Claude: \"Proponé qué pasar a Qué NO hace para que la especificación entre en dos páginas\". Construí la versión chica primero y dejá el resto anotado."}, {"sintoma": "El código y la especificación ya no coinciden y no sabés cuál vale.", "solucion": "Decidí con el cliente cuál es la verdad, actualizá primero ESPECIFICACION.md (con una línea en Cambios) y recién después pedí el ajuste del código. Corré el prompt Revisar contra la especificación para ver todas las diferencias juntas."}, {"sintoma": "Claude completa la sección de datos con permisos que nadie definió.", "solucion": "Pedile que marque como pregunta abierta todo lo que no le dijiste vos: \"En Datos, dejá solo lo que yo confirmé; lo demás pasalo a Preguntas abiertas\". Quién ve qué es una decisión del negocio, no de Claude."}], "kit": [{"archivo": "especificacion-app/SKILL.md", "que_es": "Skill de Claude Code que te entrevista de a una pregunta y escribe o actualiza ESPECIFICACION.md sin programar. Copiá la carpeta en .claude/skills/ del proyecto (o en ~/.claude/skills/ para todos tus proyectos) y usala con /especificacion-app y tu idea.", "contenido": "---\nname: especificacion-app\ndescription: 'Entrevista de a una pregunta y escribe o actualiza ESPECIFICACION.md (qué hace, para quién, pantallas, datos, límites, pruebas) sin código. Usala al arrancar una app o cambiar el alcance.'\ndisable-model-invocation: true\nargument-hint: [idea de la app en una frase]\n---\n\n# Especificación de la app\n\nTu trabajo es dejar escrito qué tiene que hacer la app antes de que alguien programe. No escribís código, no creás carpetas de proyecto y no instalás nada mientras usás esta skill.\n\n## Paso 1: ver qué hay\n\n- Si ya existe ESPECIFICACION.md en la raíz del proyecto, leela entera y preguntá: \"¿Querés completar lo que falta o cambiar algo?\". Trabajá solo sobre eso.\n- Si no existe, arrancá con la idea que te pasaron: $ARGUMENTS. Si no te pasaron nada, preguntá la idea en una frase.\n\n## Paso 2: entrevista\n\nUna pregunta por vez. Esperá la respuesta antes de seguir. Si la respuesta es vaga, repreguntá con un ejemplo concreto (\"¿por ejemplo, el cliente puede cancelar un turno, o solo el dueño?\").\n\nCubrí, en este orden:\n1. Qué problema resuelve y para quién. Cómo se hace hoy sin la app.\n2. Tipos de usuario (por ejemplo, cliente y administrador) y qué necesita cada uno.\n3. Pantallas en el orden en que se usan, y qué se puede hacer en cada una.\n4. Datos: qué se guarda, quién lo carga, quién lo ve, quién lo cambia o borra. Preguntá si hay datos personales o sensibles.\n5. Qué NO hace esta versión. Proponé vos tres cosas típicas que suelen colarse (pagos online, notificaciones, varios idiomas, app de celular) y preguntá si quedan afuera.\n6. Cómo sabemos que funciona: dos o tres pruebas concretas, con lo que hace la persona y lo que tiene que pasar.\n\nSi el usuario no sabe algo, no lo inventes: anotalo en Preguntas abiertas y seguí.\n\n## Paso 3: escribir\n\nEscribí ESPECIFICACION.md en la raíz con estas secciones y títulos exactos:\n\n# Especificación: [nombre]\n## Qué hace\n## Para quién\n## Pantallas\n## Datos\n## Qué NO hace (en esta versión)\n## Cómo sé que funciona\n## Preguntas abiertas\n## Cambios\n\nReglas de escritura:\n- Lenguaje simple, sin palabras técnicas ni nombres de librerías.\n- Una o dos páginas como máximo. Si se pasa, proponé mover cosas a Qué NO hace.\n- En Datos, cada línea con el formato: dato, lo carga [quién], lo ve [quién], lo cambia [quién].\n- En Cambios, anotá la fecha (AAAA-MM-DD) y una línea por cada cambio que se haga después de la primera versión.\n\n## Paso 4: cerrar\n\nMostrá un resumen de cinco líneas y la lista de preguntas abiertas. Preguntá si algo no es como lo imaginaba. No empieces a programar aunque te lo pidan en el mismo mensaje: sugerí pasar a modo plan (Shift+Tab) para armar el plan de construcción a partir de @ESPECIFICACION.md.\n"}, {"archivo": "ESPECIFICACION-ejemplo-turnos-peluqueria.md", "que_es": "Una especificación completa de ejemplo (app de turnos para una peluquería inventada) para ver cómo queda cada sección bien escrita. Usala de referencia o como punto de partida si tu app es parecida.", "contenido": "# Especificación: Turnos Peluquería Lola\n\nEjemplo completo para usar de referencia. El negocio es inventado.\n\n## Qué hace\nPermite que los clientes de la peluquería pidan turno desde el celular, eligiendo servicio, peluquera y horario libre, sin tener que escribir por WhatsApp.\n\n## Para quién\n- Cliente: quiere ver horarios libres y reservar en un minuto, sin crear una cuenta.\n- Dueña (administradora): quiere ver la agenda del día, cargar los horarios de cada peluquera y cancelar o mover turnos.\n\n## Pantallas\n1. Inicio: lista de servicios (corte, color, peinado) con duración y precio de referencia. Botón \"Pedir turno\".\n2. Elegir turno: el cliente elige servicio, peluquera (o \"cualquiera\") y un horario libre de los próximos 14 días.\n3. Datos y confirmación: nombre y celular. Al confirmar ve el resumen y un botón para agregarlo a su calendario.\n4. Ingreso de la dueña: usuario y contraseña.\n5. Agenda: turnos del día por peluquera. Puede cancelar o mover un turno.\n6. Horarios: la dueña carga qué días y en qué franja trabaja cada peluquera, y marca feriados.\n\n## Datos\n- Servicio (nombre, duración, precio de referencia): lo carga la dueña, lo ve cualquiera, lo cambia la dueña.\n- Horario de cada peluquera: lo carga la dueña, lo ve la dueña (el cliente solo ve los huecos libres), lo cambia la dueña.\n- Turno (servicio, peluquera, fecha y hora): lo crea el cliente, lo ve la dueña, lo cambia o cancela la dueña.\n- Nombre y celular del cliente: lo carga el cliente, lo ve solo la dueña, lo borra la dueña si el cliente lo pide.\n\n## Qué NO hace (en esta versión)\n- No cobra señas ni pagos online.\n- No manda recordatorios automáticos por WhatsApp ni por mail.\n- No tiene cuentas de cliente ni historial de turnos.\n- No es una app para instalar: es una web que se abre desde el celular.\n- El cliente no puede cancelar solo: escribe por WhatsApp y la dueña lo cancela.\n\n## Cómo sé que funciona\n- Como cliente, pido un corte para mañana a las 10 con cualquier peluquera: aparece en la agenda de la dueña con mi nombre y celular.\n- Como cliente, intento reservar a las 10 con la misma peluquera que ya tiene ese turno: el horario no aparece disponible.\n- Sin ingresar como dueña, intento abrir la agenda escribiendo su dirección: me pide usuario y contraseña.\n\n## Preguntas abiertas\n- ¿Cuánto tiempo antes se puede pedir turno para el mismo día?\n- ¿El precio se muestra o solo \"desde\"?\n\n## Cambios\n- 2026-11-08: primera versión.\n"}, {"archivo": "alcance-para-cliente-app.md", "que_es": "Plantilla del mensaje de alcance para mandarle al cliente antes de arrancar, armada a partir de la especificación: qué incluye, qué no, cómo se da por lista y cómo se piden cambios.", "contenido": "# Alcance acordado: [NOMBRE DE LA APP]\n\nPara: [NOMBRE DEL CLIENTE]\nDe: [TU NOMBRE]\nFecha: [AAAA-MM-DD]\nVersión del documento: 1\n\nHola [NOMBRE]. Antes de empezar a construir te paso por escrito qué incluye esta primera versión. Si algo no es como lo imaginabas, decímelo ahora: cambiarlo en este documento es mucho más simple que cambiarlo en la app armada.\n\n## Qué hace\n[Copiá acá la sección \"Qué hace\" de ESPECIFICACION.md, tal cual.]\n\n## Qué incluye\n[Las pantallas, en una línea cada una, en lenguaje del cliente.]\n- [PANTALLA]: [QUÉ SE PUEDE HACER]\n\n## Qué NO incluye esta versión\n[Copiá la sección \"Qué NO hace\". Cada punto puede ser parte de una versión siguiente, que se presupuesta aparte.]\n- [...]\n\n## Cómo vamos a comprobar que está lista\n[Copiá \"Cómo sé que funciona\". Cuando estas pruebas salen bien, la versión se da por entregada.]\n- [...]\n\n## Lo que necesito de vos\n- [TEXTOS, LOGO, FOTOS, ACCESOS, LISTA DE PRECIOS...] antes del [FECHA].\n- Una persona que responda dudas y apruebe: [NOMBRE].\n\n## Cómo pedimos cambios\n- Si durante el trabajo aparece algo nuevo, lo anoto en una lista aparte con lo que implica en tiempo y costo, y lo decidimos juntos antes de hacerlo.\n- Las correcciones de lo que está en \"Qué incluye\" no cuentan como cambio.\n- Cada cambio aprobado queda anotado con fecha en este documento.\n\n## Preguntas que todavía tenemos que cerrar\n- [Copiá \"Preguntas abiertas\".]\n\nSi estás de acuerdo, respondé este mensaje con un \"Ok, arrancamos\" y empiezo.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

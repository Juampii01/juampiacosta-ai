<script>var GUIA = {"slug": "palabra-clave-en-comentarios-con-manychat", "t": "Palabra clave en comentarios con ManyChat", "d": "Alguien comenta una palabra en tu reel y le llega un mensaje privado con el recurso. Cómo se arma en ManyChat y qué reglas de Instagram tienes que respetar.", "tema": "Consigue clientes", "min": 11, "fichaNombre": "Comentario → DM", "ficha": [["Qué es", "Una automatización de ManyChat que responde por mensaje privado cuando alguien comenta una palabra en tu publicación."], ["Necesitas", "Una cuenta profesional de Instagram (empresa o creador) y una cuenta de ManyChat."], ["Tiempo", "20 a 30 minutos la primera vez."], ["Qué no hace", "No te deja mandar mensajes automáticos cuando quieras: hay reglas de tiempo que pone Meta."]], "secciones": [{"h": "Cómo funciona el flujo", "p": ["La persona comenta la palabra clave. ManyChat le contesta el comentario en público (opcional) y le manda una respuesta privada por DM. Esa respuesta privada es un solo mensaje y tiene que tener un botón o una respuesta rápida.", "Cuando la persona toca ese botón, recién ahí se abre la conversación: queda como contacto y empieza la ventana de 24 horas para seguir mandándole mensajes automáticos."]}, {"h": "1. Prepara tu cuenta", "pasos": ["Pasa tu Instagram a cuenta profesional (empresa o creador), si todavía no lo es.", "En la configuración de Instagram activa el acceso a los mensajes para herramientas conectadas. La ruta, como la documenta Meta en inglés, es: Settings → Messages and story replies → Message controls → Connected Tools → Allow Access to Messages. En español los nombres pueden variar un poco.", "En ManyChat: en la web toca Get started (arriba a la derecha), elige Instagram y regístrate con Facebook o con Google. Después elige cómo conectar: Connect Via Instagram (no pide cuenta de Meta Business, aunque algunas funciones avanzadas pueden quedar limitadas) o Connect Via Meta (pide que la cuenta de Instagram esté en un portfolio comercial de Meta). Revisa los permisos y confirma.", "Si ya tienes una cuenta de ManyChat y quieres sumarle Instagram: Settings en la barra lateral → Instagram → Connect, y elige uno de los dos métodos."]}, {"h": "2. Arma la automatización", "pasos": ["En ManyChat: Automation → + New Automation → Start From Scratch.", "Toca + New Trigger y, en la pestaña Instagram, elige \"User comments on your Post or Reel\".", "Elige qué publicación escuchar: una en particular, todas, o la próxima que publiques.", "Pon la palabra clave (por ejemplo GUIA). También puedes excluir palabras o aceptar cualquier comentario.", "Opcional: escribe varias respuestas públicas para el comentario. ManyChat las va rotando.", "Guarda el trigger y agrega como primer paso un nodo de Send Message de Instagram con la opción \"Send as Private Reply\". Sin esa opción la automatización no sigue.", "Pruébalo con Preview y, cuando funcione, toca Set Live."]}, {"h": "3. El primer mensaje: siempre con botón", "p": ["Ese primer DM puede tener un solo bloque: texto o imagen, con botones o respuestas rápidas. No admite pedir datos, demoras de escritura ni pasos siguientes encadenados.", "Lo importante: mandar la respuesta privada no abre la ventana de 24 horas. Se abre cuando la persona toca un botón o una respuesta rápida. Un botón que solo abre una web no cuenta para eso."], "prompts": [{"t": "Textos del flujo", "c": "Voy a armar una automatización de comentario a DM en Instagram.\nPalabra clave: [PALABRA].\nLo que entrego: [RECURSO].\nMi tono: [TU TONO].\n\nEscríbeme:\n1. Cinco respuestas públicas distintas para el comentario, cortas pero no solo emojis, sin repetir estructura.\n2. El primer mensaje privado: máximo 3 líneas y un botón que diga algo como \"Lo quiero\". Tiene que pedir que toque el botón para recibirlo.\n3. El mensaje que llega después de tocar el botón, con el link al recurso y una pregunta abierta para seguir la charla.\nNo prometas resultados ni pongas cifras."}]}, {"h": "Reglas que tienes que conocer", "lista": ["Ventana de 24 horas: después de que la persona te escribe o interactúa, tienes 24 horas para responder, y en ese plazo puedes mandar mensajes automáticos.", "Respuesta privada: es un solo mensaje y Meta pide mandarlo dentro de los 7 días del comentario.", "Después de las 24 horas: con la etiqueta Human Agent puedes seguir respondiendo hasta 7 días, pero solo con mensajes que manda una persona a mano desde el Inbox. Automáticos, no.", "Un solo disparo por persona: el trigger se activa con el primer comentario de cada persona con esa palabra en esa publicación. Si comenta de nuevo, no se repite.", "Evita parecer spam: varia las respuestas públicas y no uses respuestas muy cortas o de puro emoji.", "Publicaciones en colaboración: la automatización funciona solo si la publicación la creaste tú desde tu cuenta conectada. Si eres colaborador invitado, no se dispara."], "aviso": "Estas reglas las pone Meta y pueden cambiar. Antes de lanzar una campaña, revisa la ayuda de ManyChat."}], "faq": [{"q": "Comentaron y no les llegó nada", "a": "Revisa que la automatización esté en Live, que el primer paso tenga \"Send as Private Reply\", que la palabra esté bien escrita y que el acceso a los mensajes para herramientas conectadas (Allow Access to Messages) esté activado en Instagram. Si la persona ya había comentado esa palabra en esa publicación, no se vuelve a disparar."}, {"q": "¿Puedo mandarle un recordatorio a los tres días?", "a": "Automático no: pasadas las 24 horas solo puede responder una persona a mano, y hasta 7 días desde la última interacción."}, {"q": "¿Sirve para publicaciones promocionadas?", "a": "Según ManyChat, sí, siempre que la publicación aparezca en tu grilla. Las publicaciones que existen solo como anuncio no se pueden elegir."}], "fuentes": ["https://help.manychat.com/hc/en-us/articles/14281316989724", "https://help.manychat.com/hc/en-us/articles/14281290924444-How-to-connect-Instagram-to-Manychat", "https://help.manychat.com/hc/en-us/articles/14281199732892", "https://developers.facebook.com/docs/messenger-platform/send-messages", "https://developers.facebook.com/documentation/business-messaging/instagram-messaging/get-started", "https://help.manychat.com/hc/en-us/articles/14281290924444-How-To-Connect-Instagram-to-Manychat", "https://help.manychat.com/hc/en-us/articles/14281275933724-Instagram-Live-Comments-Trigger", "https://help.manychat.com/hc/en-us/articles/23358636027932", "https://manychat.com/blog/?p=33694", "https://developers.facebook.com/documentation/instagram-platform/private-replies", "https://developers.facebook.com/docs/messenger-platform/policy/policy-overview"], "ejemplo": {"titulo": "Ejemplo resuelto: una guía en PDF por mensaje privado a quien comenta TORTA", "negocio": "Ejemplo inventado: una pastelera de Montevideo que trabaja sola. Vende tortas por encargo y un curso online de decoración. Su cuenta de Instagram es de creadora y publica reels con técnicas.", "punto_de_partida": "Cada vez que un reel funciona, le llegan comentarios pidiendo las cantidades y los contesta uno por uno, a veces días después. Muchos de esos pedidos se pierden.", "pasos": ["Armó una guía en PDF con las cantidades para cubrir tortas de distintos tamaños, la subió a Google Drive y la compartió para cualquiera con el enlace.", "Completó la plantilla de textos del kit con la palabra TORTA. Usó el prompt de la guía para sacar las respuestas públicas y sumó una más para llegar a seis.", "En Instagram activó el acceso a los mensajes para herramientas conectadas. En ManyChat tocó Get started, eligió Instagram y conectó con Connect Via Instagram.", "En Automation creó una automatización desde cero con el trigger de comentarios de la pestaña Instagram, eligió \"la próxima publicación\" y puso la palabra TORTA.", "Pegó las seis respuestas públicas. En el primer nodo de mensaje activó Send as Private Reply y puso el texto corto con el botón \"Quiero la guía\", que lleva a un segundo mensaje.", "En el segundo mensaje puso el link a la guía y la pregunta \"¿Qué tamaño de torta vas a hacer primero?\".", "Con la cuenta personal de su hermana, que nunca había comentado, hizo la prueba completa de la checklist. Recién ahí tocó Set Live y publicó el reel diciendo \"comenta TORTA y te la mando\".", "Durante la semana revisó el Inbox una vez por día y respondió a mano a quienes contestaron la pregunta. A los que preguntaban por el curso les pasó el detalle ella misma."], "resultado": "Quedó un flujo que entrega la guía sola a cada persona que comenta la palabra y deja como contacto a quien toca el botón. Las conversaciones que siguen las responde ella, dentro de las reglas de tiempo de Meta, y no manda recordatorios automáticos a nadie."}, "si_falla": [{"sintoma": "La persona recibió el primer mensaje, tocó el botón y no le llegó nada más.", "solucion": "Revisa qué tipo de botón pusiste. Un botón que abre una web no abre la ventana de 24 horas ni suma a la persona como contacto, así que los mensajes siguientes no salen. Cámbialo por un botón que lleve a otro mensaje del flujo y pon el link en ese segundo mensaje."}, {"sintoma": "Al conectar con Connect Via Instagram, ManyChat dice \"Your account might not support this method yet\" y vuelve a la pantalla de conexión.", "solucion": "Confirma que la cuenta sea profesional (empresa o creador). Prueba en una ventana privada del navegador, sin bloqueadores de anuncios ni extensiones de privacidad, que pueden frenar la ventana de autorización de Meta. Si sigue igual, vincula Instagram a una página de Facebook de la que seas administrador y conecta por el método de Meta. Si nada funciona, abre un ticket con el soporte de ManyChat."}, {"sintoma": "Al conectar aparece \"Request sent\" y la cuenta no se suma.", "solucion": "Esa cuenta de Instagram ya está conectada a otra cuenta de ManyChat. Desconéctala de esa otra cuenta, o pídele acceso a quien la administra, y vuelve a intentar."}, {"sintoma": "Comentaste la palabra para probar y no pasó nada.", "solucion": "Revisa en orden: que la automatización esté en Live, que la palabra coincida con la que escribiste en el trigger, que el primer nodo tenga Send as Private Reply y que en Instagram esté activado Allow Access to Messages. Prueba con una cuenta que nunca haya comentado esa palabra en esa publicación: el trigger no se repite para la misma persona. Mira también la carpeta de solicitudes de mensajes de la cuenta de prueba."}, {"sintoma": "La automatización anda en tus reels, pero no en un reel en colaboración con otra cuenta.", "solucion": "Solo se dispara si la publicación la creaste tú desde la cuenta conectada. Si te invitaron como colaborador, la automatización tiene que armarla la cuenta que la publicó."}], "kit": [{"archivo": "textos-flujo-palabra-clave-manychat.md", "que_es": "La plantilla de todos los textos del flujo (respuestas públicas, primer mensaje privado, mensaje con el link y respuesta manual) con sus reglas, y un ejemplo completo para copiar la estructura.", "contenido": "# Textos del flujo: palabra clave en comentarios\n\nPlantilla para completar antes de abrir ManyChat. Al final tienes un ejemplo ya completo para que veas cómo queda.\n\n## Datos del flujo\n\n- Palabra clave: [PALABRA] (una sola palabra, fácil de escribir en el celular, sin tildes)\n- Publicación: [CUÁL REEL O POST, O \"LA PRÓXIMA QUE PUBLIQUE\"]\n- Lo que entregas: [RECURSO: guía, plantilla, lista, descuento]\n- Dónde está el recurso: [LINK]\n- Tono: [CÓMO HABLAS]\n- Quién responde a mano si alguien pregunta algo: [NOMBRE]\n\n## 1. Respuestas públicas al comentario\n\nManyChat recomienda variar las respuestas, usar más de cinco distintas y evitar respuestas muy cortas o de puro emoji. Escribe seis o más, cada una con otra estructura:\n\n1. [RESPUESTA 1]\n2. [RESPUESTA 2]\n3. [RESPUESTA 3]\n4. [RESPUESTA 4]\n5. [RESPUESTA 5]\n6. [RESPUESTA 6]\n\nNo pongas el link en la respuesta pública: el recurso va por mensaje privado.\n\n## 2. Primer mensaje privado (Send as Private Reply)\n\nReglas de este mensaje:\n- Un solo bloque: texto (o imagen) con botones o respuestas rápidas.\n- Sin pedir datos, sin demoras de escritura, sin pasos encadenados en ese mismo nodo.\n- El botón tiene que llevar a otro mensaje del flujo. Un botón que solo abre una web no abre la ventana de 24 horas y la persona no queda como contacto.\n\nTexto (máximo 3 líneas):\n\n> [SALUDO CORTO]. Aquí tienes [RECURSO].\n> Toca el botón de abajo y te lo mando.\n\nBotón: [TEXTO DEL BOTÓN, por ejemplo \"Lo quiero\"]\n\n## 3. Mensaje después de tocar el botón\n\nAhora sí la ventana de 24 horas está abierta. Aquí va el link.\n\n> [TEXTO DE ENTREGA]: [LINK]\n> [UNA PREGUNTA ABIERTA PARA SEGUIR LA CHARLA]\n\nIdeas de pregunta abierta:\n- \"¿Para qué lo vas a usar primero?\"\n- \"¿Qué es lo que más te cuesta hoy con [TEMA]?\"\n- \"¿Lo quieres para ti o para tu negocio?\"\n\n## 4. Si responde la pregunta\n\nEsto ya no es automático: lo ve una persona en el Inbox de ManyChat.\n- Dentro de las 24 horas desde su último mensaje: puedes responder a mano o con automatizaciones.\n- Pasadas las 24 horas y hasta 7 días: solo mensajes manuales desde el Inbox.\n- Después de eso: espera a que la persona vuelva a escribir.\n\nRespuesta manual base:\n\n> Gracias por contarme. [RESPUESTA A LO QUE DIJO]. Si quieres, [PRÓXIMO PASO: te cuento cómo trabajo, te paso la agenda, te mando el detalle].\n\n## 5. Lo que no haces\n\n- No mandas recordatorios automáticos a los tres días a quien no tocó el botón.\n- No prometes resultados ni pones cifras en ningún mensaje.\n- No pides el teléfono ni el mail en el primer mensaje.\n\n---\n\n## Ejemplo completo (inventado)\n\nDatos: una pastelera de Montevideo que enseña a decorar tortas. Palabra clave TORTA en un reel. Entrega una guía en PDF con las cantidades para cubrir tortas de distintos tamaños.\n\nRespuestas públicas:\n1. Listo, te dejé la guía por mensaje privado. Fíjate en tus solicitudes de mensajes si no la ves.\n2. ¡Ahí va! Revisa tus mensajes, te la mandé recién.\n3. Te escribí por privado con la guía. Cuéntame después cómo te fue con la primera torta.\n4. Hecho. La guía ya está en tus mensajes directos.\n5. Te la mandé por DM. Si no aparece, mira la carpeta de solicitudes.\n6. Gracias por comentar. Por privado tienes la guía con las cantidades.\n\nPrimer mensaje privado:\n> Hola, gracias por comentar. Aquí tienes la guía para cubrir tortas sin que te sobre ni te falte.\n> Toca el botón de abajo y te la mando.\n\nBotón: Quiero la guía\n\nMensaje después del botón:\n> Aquí está la guía: [LINK]\n> ¿Qué tamaño de torta vas a hacer primero?\n"}, {"archivo": "checklist-lanzamiento-palabra-clave-manychat.md", "que_es": "La checklist para marcar antes de publicar el reel: cuenta, automatización y una prueba completa con otra cuenta de Instagram.", "contenido": "# Checklist para lanzar una palabra clave con ManyChat\n\nMarca cada punto antes de publicar el reel. Si uno falla, no lances.\n\n## Cuenta\n\n- [ ] Instagram es profesional (empresa o creador). Las cuentas personales no se pueden conectar.\n- [ ] En Instagram está activado el acceso a los mensajes para herramientas conectadas (Allow Access to Messages, dentro de los controles de mensajes).\n- [ ] ManyChat muestra la cuenta de Instagram conectada, sin avisos de permisos pendientes.\n- [ ] La publicación es tuya: si es una colaboración, la creaste tú desde la cuenta conectada.\n- [ ] La publicación aparece en tu grilla (si existe solo como anuncio, no se puede elegir).\n\n## Automatización\n\n- [ ] El trigger es el de comentarios en publicación o reel, de la pestaña Instagram.\n- [ ] Elegiste la publicación correcta (una en particular, todas o la próxima).\n- [ ] La palabra clave está bien escrita. Anota aquí cómo la escribiste: __________\n- [ ] Hay seis o más respuestas públicas distintas, ninguna de puro emoji.\n- [ ] El primer nodo de mensaje tiene activada la opción de respuesta privada (Send as Private Reply).\n- [ ] Ese primer mensaje es un solo bloque, con un botón que lleva a otro mensaje del flujo (no a una web).\n- [ ] El link al recurso está en el segundo mensaje, el que llega después de tocar el botón.\n- [ ] El link al recurso abre sin pedir permisos (si es un archivo de Drive, que esté compartido para cualquiera con el enlace).\n\n## Prueba\n\nHazla con una cuenta de Instagram que no sea la del negocio y que nunca haya comentado esa palabra en esa publicación (el trigger se dispara una sola vez por persona).\n\n- [ ] Usaste Preview en ManyChat y el flujo se ve completo.\n- [ ] Tocaste Set Live (o Update si ya existía).\n- [ ] Comentaste la palabra desde la cuenta de prueba.\n- [ ] Llegó la respuesta pública.\n- [ ] Llegó el mensaje privado (si no aparece, mira en solicitudes de mensajes).\n- [ ] Tocaste el botón y llegó el segundo mensaje con el link.\n- [ ] El link abre el recurso correcto en el celular.\n- [ ] En ManyChat, la cuenta de prueba aparece como contacto.\n\n## Durante la campaña\n\n- [ ] Una vez por día revisas el Inbox y respondes a mano las preguntas.\n- [ ] Si alguien comentó la palabra mal escrita, le respondes tú.\n- [ ] Antes de una campaña nueva, revisas la ayuda de ManyChat por cambios en las reglas de Meta.\n"}], "verificada": "2026-11-08", "cat": "clientes", "parte": "úsalo"};</script>

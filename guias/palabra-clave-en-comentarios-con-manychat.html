<script>var GUIA = {"slug": "palabra-clave-en-comentarios-con-manychat", "t": "Palabra clave en comentarios con ManyChat", "d": "Alguien comenta una palabra en tu reel y le llega un mensaje privado con el recurso. Cómo se arma en ManyChat y qué reglas de Instagram tenés que respetar.", "tema": "Conseguí clientes", "min": 11, "fichaNombre": "Comentario → DM", "ficha": [["Qué es", "Una automatización de ManyChat que responde por mensaje privado cuando alguien comenta una palabra en tu publicación."], ["Necesitás", "Una cuenta profesional de Instagram (empresa o creador) y una cuenta de ManyChat."], ["Tiempo", "20 a 30 minutos la primera vez."], ["Qué no hace", "No te deja mandar mensajes automáticos cuando quieras: hay reglas de tiempo que pone Meta."]], "secciones": [{"h": "Cómo funciona el flujo", "p": ["La persona comenta la palabra clave. ManyChat le contesta el comentario en público (opcional) y le manda una respuesta privada por DM. Esa respuesta privada es un solo mensaje y tiene que tener un botón o una respuesta rápida.", "Cuando la persona toca ese botón, recién ahí se abre la conversación: queda como contacto y empieza la ventana de 24 horas para seguir mandándole mensajes automáticos."]}, {"h": "1. Prepará tu cuenta", "pasos": ["Pasá tu Instagram a cuenta profesional (empresa o creador), si todavía no lo es.", "En la configuración de Instagram activá el acceso a los mensajes para herramientas conectadas. La ruta, como la documenta Meta en inglés, es: Settings → Messages and story replies → Message controls → Connected Tools → Allow Access to Messages. En español los nombres pueden variar un poco.", "En ManyChat: Get started → Instagram, iniciá sesión con Google o Facebook, tocá Go to Instagram, dale los permisos y elegí tu cuenta.", "Si ya tenés ManyChat: My profile → Manage accounts → + Add new account → Instagram."]}, {"h": "2. Armá la automatización", "pasos": ["En ManyChat: Automation → + New Automation → Start From Scratch.", "Tocá + New Trigger y, en la pestaña Instagram, elegí \"User comments on your Post or Reel\".", "Elegí qué publicación escuchar: una en particular, todas, o la próxima que publiques.", "Poné la palabra clave (por ejemplo GUIA). También podés excluir palabras o aceptar cualquier comentario.", "Opcional: escribí varias respuestas públicas para el comentario. ManyChat las va rotando.", "Guardá el trigger y agregá como primer paso un nodo de Send Message de Instagram con la opción \"Send as Private Reply\". Sin esa opción la automatización no sigue.", "Probalo con Preview y, cuando funcione, tocá Set Live."]}, {"h": "3. El primer mensaje: siempre con botón", "p": ["Ese primer DM puede tener un solo bloque: texto o imagen, con botones o respuestas rápidas. No admite pedir datos, demoras de escritura ni pasos siguientes encadenados.", "Lo importante: mandar la respuesta privada no abre la ventana de 24 horas. Se abre cuando la persona toca un botón o una respuesta rápida. Un botón que solo abre una web no cuenta para eso."], "prompts": [{"t": "Textos del flujo", "c": "Voy a armar una automatización de comentario a DM en Instagram.\nPalabra clave: [PALABRA].\nLo que entrego: [RECURSO].\nMi tono: [TU TONO].\n\nEscribime:\n1. Cinco respuestas públicas distintas para el comentario, cortas pero no solo emojis, sin repetir estructura.\n2. El primer mensaje privado: máximo 3 líneas y un botón que diga algo como \"Lo quiero\". Tiene que pedir que toque el botón para recibirlo.\n3. El mensaje que llega después de tocar el botón, con el link al recurso y una pregunta abierta para seguir la charla.\nNo prometas resultados ni pongas cifras."}]}, {"h": "Reglas que tenés que conocer", "lista": ["Ventana de 24 horas: después de que la persona te escribe o interactúa, tenés 24 horas para responder, y en ese plazo podés mandar mensajes automáticos.", "Respuesta privada: es un solo mensaje y Meta pide mandarlo dentro de los 7 días del comentario.", "Después de las 24 horas: con la etiqueta Human Agent podés seguir respondiendo hasta 7 días, pero solo con mensajes que manda una persona a mano desde el Inbox. Automáticos, no.", "Un solo disparo por persona: el trigger se activa con el primer comentario de cada persona con esa palabra en esa publicación. Si comenta de nuevo, no se repite.", "Evitá parecer spam: variá las respuestas públicas y no uses respuestas muy cortas o de puro emoji.", "Publicaciones en colaboración: solo funciona con los comentarios de la versión publicada desde tu cuenta conectada."], "aviso": "Estas reglas las pone Meta y pueden cambiar. Antes de lanzar una campaña, revisá la ayuda de ManyChat."}], "faq": [{"q": "Comentaron y no les llegó nada", "a": "Revisá que la automatización esté en Live, que el primer paso tenga \"Send as Private Reply\", que la palabra esté bien escrita y que el acceso a los mensajes para herramientas conectadas (Allow Access to Messages) esté activado en Instagram. Si la persona ya había comentado esa palabra en esa publicación, no se vuelve a disparar."}, {"q": "¿Puedo mandarle un recordatorio a los tres días?", "a": "Automático no: pasadas las 24 horas solo puede responder una persona a mano, y hasta 7 días desde la última interacción."}, {"q": "¿Sirve para publicaciones promocionadas?", "a": "Según ManyChat, sí, siempre que la publicación aparezca en tu grilla. Las publicaciones que existen solo como anuncio no se pueden elegir."}], "fuentes": ["https://help.manychat.com/hc/en-us/articles/14281316989724", "https://help.manychat.com/hc/en-us/articles/14281290924444-How-to-connect-Instagram-to-Manychat", "https://help.manychat.com/hc/en-us/articles/14281199732892", "https://developers.facebook.com/docs/messenger-platform/send-messages", "https://developers.facebook.com/documentation/business-messaging/instagram-messaging/get-started"], "cat": "clientes", "parte": "usalo"};</script>

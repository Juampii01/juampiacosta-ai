<script>var GUIA = {"slug": "roadmap-de-cero-a-vender-ia", "t": "El roadmap: de cero a vender sistemas de IA a negocios", "d": "El camino completo en 8 etapas, qué haces en cada una, cuándo pasas a la siguiente y qué guías usar. Empieza por aquí.", "tema": "El roadmap para vender IA", "min": 12, "ficha": [["Para quién", "Quien quiere vivir de instalar sistemas de IA en negocios"], ["Cuánto lleva", "Unas 2 semanas de base técnica y después prospección todos los días"], ["Lo más importante", "Desde la etapa 3, al menos el 80% de tu tiempo va a conseguir clientes"]], "secciones": [{"h": "Cómo usar este roadmap", "p": ["Este es el mapa de toda la biblioteca para quien quiere vender sistemas de IA. Cada etapa tiene qué hacer, cuándo pasar a la siguiente y qué guías leer. No hace falta leer todo antes de empezar: haz la etapa en la que estás.", "La trampa más común es quedarse en las etapas 0 y 1 aprendiendo herramientas para siempre. Aprender rinde mucho al principio, después se estanca y al final te frena. Cuando tengas la base, salta a conseguir clientes aunque no te sientas listo: nadie se siente listo."]}, {"h": "Etapa 0 · La base técnica (unas 2 semanas)", "lista": ["Qué haces: configuras Claude, aprendes a pedirle bien y armas de punta a punta 2 o 3 sistemas en tus propias cuentas. Ese es tu portafolio de demostración.", "Cuándo pasas: cuando puedes mostrar funcionando al menos 2 sistemas. Con eso estás listo para vender aunque sientas que no.", "Qué leer: la ruta \"Empieza con Claude\", \"Agente de atención con base de conocimiento\" y los sistemas por rubro."], "aviso": "Menos de 2 semanas suele ser poco. Más de un mes ya suele ser postergar."}, {"h": "Etapas 1 y 2 · Elegir qué vender y hacer la cuenta", "lista": ["Etapa 1, la oferta: eliges una solución de entrada que sepas entregar (la más pedida es el agente que atiende y vende por WhatsApp e Instagram) y 3 rubros para probarla. Lee \"Elegir la solución y los rubros para tus primeros clientes\".", "Etapa 2, la cuenta: partes de cuánto quieres facturar y llegas a cuántos contactos tienes que hacer por día. Ese número es tu tarea diaria no negociable. Lee \"Tu cadena de números\" y arma \"El tablero diario\"."]}, {"h": "Etapas 3 y 4 · Prospectar y vender", "lista": ["Etapa 3, prospectar: eliges 2 o 3 métodos para conseguir clientes y los sostienes todos los días. El único objetivo es agendar llamadas de venta. Lee \"Los métodos para conseguir clientes\", \"La llamada en frío\" y \"La secuencia de seguimiento de 14 días\".", "Cuándo pasas: cuando tienes llamadas agendadas. Con constancia diaria, lo normal es agendar la primera en la primera semana.", "Etapa 4, vender: haces la llamada de diagnóstico, calculas el retorno y presentas el precio. Lee \"La llamada de venta en cuatro fases\", \"Calcula el retorno de tu propuesta\" y \"Objeciones y cómo responderlas\".", "Cuándo pasas: precio aceptado, acuerdo aprobado y primer pago cobrado. Sin pago inicial no se empieza."]}, {"h": "Etapas 5 a 7 · Entregar, cobrar mensual y crecer", "lista": ["Etapa 5, el primer cliente: al principio importa más el caso de éxito que el dinero. Cobra bajo pero cobra, y consigue un testimonio.", "Etapa 6, entregar: versión de prueba, ajustes, versión final y pase a producción contra el pago final. Lee \"Entregar un agente de punta a punta\" y los módulos 6 a 9 del sistema base.", "Etapa 7, el mensual: no vendas el mantenimiento de entrada. Ofrécelo cuando el cliente pide el primer cambio. Lee \"El mantenimiento mensual\".", "Después: con 3 a 5 casos subes precios, eliges un rubro más fino y empiezas a delegar el desarrollo para quedarte en ventas."]}, {"h": "La regla que sostiene todo", "p": ["Mientras no tengas clientes, al menos el 80% de tu tiempo de trabajo va a conseguirlos. Mejorar tu web, tu logo o aprender una herramienta más no es conseguir clientes, aunque se sienta productivo.", "Lo único que controlas al 100% es cuántos contactos haces por día. Las respuestas, las llamadas y los cierres llegan después, y a veces tardan semanas. Mídete por lo que haces, no por lo que facturas este mes."]}], "faq": [{"q": "¿Necesito saber programar?", "a": "Para las etapas 0 a 3, no. Los sistemas de la biblioteca se arman con Claude, conectores y herramientas sin código. Claude Code te abre más opciones, pero no es requisito para el primer cliente."}, {"q": "¿Puedo saltarme etapas?", "a": "Puedes adelantar la prospección mientras terminas la base técnica, pero no al revés: no vendas algo que nunca armaste de punta a punta."}, {"q": "¿En cuánto tiempo llega el primer cliente?", "a": "Depende de tu volumen diario y de tu constancia. Entre que empiezas a prospectar y cierras suelen pasar semanas, y entre lo que haces hoy y el resultado en facturación pueden pasar dos o tres meses. Por eso se mide la tarea diaria."}], "post": "ROADMAP", "cat": "roadmap", "parte": "construi"};</script>

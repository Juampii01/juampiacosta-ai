<script>var GUIA = {"slug": "calcula-el-retorno-de-tu-propuesta", "t": "Calcula el retorno de tu propuesta (y ponle precio con eso)", "d": "Las cuatro formas en que un sistema de IA genera valor, cómo pasarlas a números con lo que dijo el cliente y cómo usar eso para fijar el precio.", "tema": "El roadmap para vender IA", "min": 9, "secciones": [{"h": "Por qué calcular el retorno", "p": ["Cuando un dueño dice \"es caro\", casi siempre quiere decir \"no veo cuánto me devuelve\". Si le muestras con sus propios números cuánto pierde hoy y cuánto recupera, el precio deja de ser el tema.", "La regla de oro: cada número sale de algo que dijo el cliente en el diagnóstico. Si no hay una frase suya que lo respalde, ese número no va."]}, {"h": "Las cuatro palancas de valor", "lista": ["Tiempo del equipo: personas × horas que se liberan × lo que cuesta cada hora. Ojo: no lideres con \"ahorras sueldos\"; suena a despidos. Habla de tiempo liberado para vender o atender mejor.", "Ventas que se escapan: consultas por mes × porcentaje que hoy se pierde (sin respuesta o fuera de horario) × ticket promedio × cuántos de cada 10 compran.", "Mejor conversión: consultas por mes × (conversión nueva − conversión actual) × ticket.", "Menos errores: lo que cuesta un error × cuántas veces pasa por mes × cuánto se reduce."]}, {"h": "Dos escenarios y el tiempo de recuperación", "lista": ["Escenario conservador: usa la mitad o menos de lo que podría mejorar. Es el número que defiendes.", "Escenario probable: lo que esperas que pase de verdad.", "Recuperación: inversión ÷ valor mensual del escenario conservador = en cuántos meses se paga solo. Si da menos de 3 meses, el precio es fácil de defender.", "Costo de no hacer nada: lo que pierde por mes × los meses que piensa esperar. Sirve para la objeción \"ahora no\".", "Incluye los costos que siguen: mantenimiento, plan de Claude, mensajes de WhatsApp. Si no los pones, después parece que mentiste."]}, {"h": "Cómo fijar el precio con esto", "lista": ["Por solución, nunca por hora. Las horas sirven para saber tu piso, no para el precio.", "Una referencia simple: cobrar alrededor del 10% de lo que el sistema le ahorra o le hace ganar en un año. Otra: que el precio sea más o menos un mes de recuperación del escenario conservador.", "En la llamada das un rango; en la propuesta, un número concreto un poco debajo del medio del rango y no redondo (si el rango era 2.500 a 3.500, por ejemplo 2.897).", "Si el retorno da muy poco (menos de 100 dólares por mes), no es tu cliente: no hay precio que cierre."]}, {"h": "Hazlo con Claude", "prompts": [{"t": "Calcular el retorno desde mis notas", "c": "Te paso mis notas o la transcripción del diagnóstico con [NEGOCIO]. Calcula el valor mensual de [SOLUCIÓN] usando solo estas cuatro palancas: tiempo del equipo, ventas que se escapan, mejor conversión y menos errores.\nPara cada palanca: 1) la frase textual del cliente que la respalda (si no hay, descártala); 2) la fórmula con sus números; 3) el resultado mensual.\nDespués: escenario conservador (mitad de la mejora) y probable, costos recurrentes que tengo que sumar ([COSTOS]), en cuántos meses recupera una inversión de [PRECIO] y cuánto pierde por mes si espera. Marca como \"a confirmar\" todo dato que falte.\n\n[NOTAS]"}]}], "faq": [{"q": "¿Y si el cliente no sabe sus números?", "a": "Pregúntale estimaciones (\"más o menos, ¿cuántos mensajes por día?\") y anótalas como estimaciones suyas. Si no puede estimar ni eso, probablemente no es el momento."}, {"q": "¿Le muestro el cálculo completo?", "a": "Muéstrale el resultado y las frases suyas que lo respaldan. Las fórmulas, solo si las pide."}], "cat": "roadmap", "parte": "construi"};</script>

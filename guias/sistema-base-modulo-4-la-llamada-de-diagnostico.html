<script>var GUIA = {"slug": "sistema-base-modulo-4-la-llamada-de-diagnostico", "t": "Módulo 4 · La llamada de diagnóstico de 15 minutos", "d": "El guion de la llamada: qué preguntar, cómo encontrar la tarea que más tiempo le come al negocio y cómo cerrar con un próximo paso claro. Con plantilla de notas.", "tema": "El sistema para vender IA", "min": 10, "secciones": [{"h": "Para qué sirve la llamada", "p": ["No es una presentación tuya. Es una charla donde el que más habla es el dueño. Tu trabajo es entender cómo trabaja, encontrar dos o tres tareas donde el paquete ayuda y decirle con honestidad si le sirve o no.", "Respeta los 15 minutos. Si la charla da para más, pregunta si tiene tiempo o propón seguir otro día. Cumplir lo que dijiste es la primera prueba de que se puede confiar en ti."]}, {"h": "El guion, minuto a minuto", "pasos": ["Minuto 0 a 2: agradece, recuerda para qué es la charla (\"ver qué tareas de tu negocio podría cubrir Claude y cuáles no\") y pide permiso para tomar notas.", "Minuto 2 a 5: pide que te cuente un día normal. \"¿Qué haces desde que abres hasta que cierras? ¿Qué parte la haces en la computadora o el celular?\"", "Minuto 5 a 9: busca la tarea que más tiempo come (preguntas abajo). Cuando aparezca una, pide un ejemplo real: \"¿Cómo fue el último presupuesto que mandaste?\"", "Minuto 9 a 12: devuelve lo que entendiste en una frase y di qué parte podría hacer Claude y qué parte seguiría haciendo una persona.", "Minuto 12 a 15: propón el próximo paso y acuerda una fecha."]}, {"h": "Las preguntas que encuentran el problema", "lista": ["¿Qué tarea te gustaría no hacer nunca más?: suele aparecer la más pesada, aunque no siempre la más frecuente.", "¿Qué te preguntan siempre tus clientes?: si responde rápido y con una lista, la skill de respuestas tiene mucho para hacer.", "¿Cuánto tardas en armar un presupuesto?: pide minutos y cantidad por semana, no \"un montón\".", "¿Dónde está la información?: precios en una planilla, procesos en la cabeza del dueño, mails en Gmail. Te dice cuánto trabajo de carga vas a tener.", "¿Quién más del equipo haría esto?: te dice a quién capacitar y si hace falta un plan para compartir.", "¿Ya probaste alguna IA? ¿Qué pasó?: si tuvo una mala experiencia, entiende por qué antes de prometer algo distinto."], "aviso": "Si te cuenta datos sensibles de clientes o de salud, no los anotes con nombre. Para el diagnóstico alcanza con saber qué tipo de dato es."}, {"h": "Cómo cerrar", "p": ["Hay tres finales posibles, y los tres están bien:", "Sí le sirve: \"Con lo que me contaste, el paquete cubre [TAREA 1] y [TAREA 2]. Te mando una propuesta de una página con precio y plazos para [DÍA]. ¿Te parece que la revisemos juntos el [DÍA]?\"", "Le sirve, pero falta algo antes: \"Para que esto funcione necesitas tener tus precios escritos en algún lado. Si los ordenas, te mando la propuesta.\"", "No le sirve: \"Por cómo trabajas hoy, no creo que te cambie mucho. Si en algún momento [CONDICIÓN], hablemos.\" Decir que no también construye confianza y recomendaciones."]}, {"h": "Plantilla de notas y resumen con Claude", "p": ["Copia esta plantilla antes de cada llamada y complétala mientras hablas. Después pásala por Claude para ordenarla y prepararte para la propuesta del Módulo 5."], "prompts": [{"t": "Plantilla de notas", "c": "NEGOCIO: [NOMBRE]\nFECHA: [FECHA]\nCON QUIÉN HABLÉ: [NOMBRE Y ROL]\nPERSONAS EN EL EQUIPO: [CANTIDAD]\nCÓMO ES UN DÍA NORMAL: [RESUMEN]\nTAREA QUE MÁS TIEMPO COME: [TAREA] | VECES POR SEMANA: [N] | MINUTOS CADA VEZ: [N]\nEJEMPLO REAL: [LO QUE CONTÓ]\nOTRAS TAREAS QUE MENCIONÓ: [LISTA]\nDÓNDE ESTÁ LA INFORMACIÓN: [PLANILLAS, MAIL, PAPEL, CABEZA DEL DUEÑO]\nUSA GMAIL / GOOGLE CALENDAR / GOOGLE DRIVE: [SÍ/NO EN CADA UNO]\nCUENTA DE GOOGLE: [PERSONAL O GOOGLE WORKSPACE] | ADMIN DE WORKSPACE: [QUIÉN]\nPLAN DE CLAUDE HOY: [NO TIENE / FREE / PRO / MAX / TEAM / OTRO]\nPROBÓ IA ANTES: [QUÉ Y CÓMO LE FUE]\nDUDAS O MIEDOS QUE DIJO: [TEXTUAL SI PUEDO]\nPRÓXIMO PASO ACORDADO: [QUÉ Y CUÁNDO]"}, {"t": "Resumen del diagnóstico", "c": "Te paso mis notas de una llamada de diagnóstico con un negocio. Ofrezco un paquete que instala Claude: proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de Gmail, Google Calendar y Google Drive, una automatización y capacitación.\n\n[PEGA TUS NOTAS]\n\n1. Resume el negocio en 3 líneas.\n2. Lista las tareas que el paquete podría cubrir, y para cada una qué haría Claude y qué seguiría haciendo una persona.\n3. Propón cuál sería la automatización más útil, con su frecuencia.\n4. Lista lo que falta saber antes de mandar la propuesta, como preguntas cortas para el cliente.\n5. Lista las dudas o miedos que dijo, con sus palabras.\n6. Dime si ves algo que el paquete NO resuelve y conviene aclarar.\nNo inventes datos que no estén en las notas."}]}], "faq": [{"q": "¿Hago la llamada por video o por teléfono?", "a": "Por video si puede compartir pantalla: ver cómo arma un presupuesto vale más que diez explicaciones. Si no, teléfono o en persona está bien."}, {"q": "¿Puedo grabarla o transcribirla?", "a": "Solo si el dueño está de acuerdo y se lo pediste al principio. Si no, toma notas con la plantilla."}, {"q": "¿Y si quiere el precio en la llamada?", "a": "Dale un rango honesto si ya lo tienes armado (Módulo 5) y aclárale que el precio final sale de la propuesta, cuando sepas el alcance."}], "fuentes": ["https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors"], "ejemplo": {"titulo": "Ejemplo resuelto: la llamada con un corralón que arma presupuestos a mano", "negocio": "Ejemplo inventado: un corralón de materiales de construcción en Pergamino (provincia de Buenos Aires), atendido por el dueño, su hija en el mostrador y cuatro empleados entre depósito y reparto.", "punto_de_partida": "La hija respondió el primer mensaje del Módulo 3 y aceptó 15 minutos por videollamada. El dueño dice que \"todo el día se le va en el teléfono\", pero no sabe bien en qué.", "pasos": ["El día anterior mandó el mensaje de confirmación del kit y le pidió a la hija que tuviera a mano el último presupuesto que mandaron. Copió la plantilla de notas con el nombre del corralón.", "Minuto 0 a 2: \"Gracias por el rato. La idea es ver qué tareas del corralón podría cubrir Claude y cuáles no. ¿Te molesta si tomo notas?\". Ella dijo que sí, y que el dueño se sumaba a mitad de la charla.", "Minuto 2 a 5: \"Cuéntame un día normal, desde que abren hasta que cierran\". Apareció que a la mañana entran pedidos de presupuesto por WhatsApp y por mail, que los precios están en una planilla que actualiza el dueño y que a la tarde coordinan el reparto.", "Minuto 5 a 9: con la pregunta \"¿qué tarea te gustaría no hacer nunca más?\" salió la respuesta sin dudar: los presupuestos de obra, con lista de materiales, cantidades y flete. Le pidió el ejemplo real y ella compartió pantalla con el último: lo arma copiando de la planilla a un documento y lo pasa a PDF.", "Anotó en la plantilla los minutos por presupuesto y las veces por semana con los números que dijo ella, sin redondear. En \"lo que preguntan siempre\" anotó: si hay stock, cuánto sale el flete y si aceptan transferencia.", "Las preguntas técnicas: usan un Gmail personal del corralón (no Workspace), no tienen cuenta de Claude, y la planilla de precios está en la computadora del dueño, no en Google Drive.", "Minuto 9 a 12: devolvió lo que entendió en una frase: \"Lo que más les pesa es armar presupuestos de obra copiando de la planilla. Claude podría armar el borrador con tus precios y tu formato, y tú lo revisas y lo mandas. El precio final y el stock los sigue confirmando una persona\".", "Minuto 12 a 15: el dueño, que ya se había sumado, preguntó cuánto salía. Le dio el rango que tenía armado (Módulo 5) y aclaró que el precio final sale de la propuesta. Cerró con el segundo final: \"Para que esto funcione, la planilla de precios tiene que estar en Google Drive y al día. Si la suben esta semana, el jueves les mando la propuesta\". Quedó el jueves.", "Esa misma tarde pegó sus notas en un chat con la skill diagnostico-de-llamada. El resumen marcó como RIESGO que la planilla solo existe en una computadora y listó tres preguntas pendientes: cómo calculan el flete, qué condiciones de pago ofrecen y quién más va a usar la cuenta.", "Mandó el mensaje de \"falta algo antes\" del kit, con las tres preguntas al final, y anotó en su planilla de 50 que la llamada terminó en \"falta algo antes\", con recordatorio para el jueves."], "resultado": "La llamada terminó en 15 minutos con una tarea concreta (presupuestos de obra) y su ejemplo real, un requisito claro para el cliente (la planilla de precios en Drive), una fecha y tres preguntas pendientes. Con eso la propuesta del Módulo 5 se escribe sobre datos del negocio y no sobre suposiciones."}, "si_falla": [{"sintoma": "El dueño habla 15 minutos de su negocio en general y no aparece ninguna tarea concreta.", "solucion": "Pide un caso puntual y reciente: \"¿Qué fue lo último que hiciste en la computadora antes de esta llamada?\" o \"¿Cómo fue la última consulta que respondiste?\". Las preguntas sobre el último caso traen tareas concretas; las preguntas sobre \"en general\" traen opiniones. Si igual no aparece nada, propón seguir otro día con la pantalla compartida."}, {"sintoma": "Responde \"un montón\" o \"todo el día\" cuando le preguntas cuánto tiempo le lleva una tarea.", "solucion": "Pártelo en dos preguntas chicas: \"¿Cuántos hiciste esta semana?\" y \"El último, ¿cuánto te llevó, más o menos?\". Anota lo que diga, aunque sea aproximado, y marca en la plantilla que es una estimación suya. No pongas números tuyos."}, {"sintoma": "Quiere el precio en el minuto dos y no avanza hasta que se lo digas.", "solucion": "Dale el rango del Módulo 5 si ya lo tienes armado y vuelve a la charla: \"Depende de qué tareas cubramos. Por eso te pregunto cómo trabajas, para no venderte algo que no necesitas\". Si todavía no tienes rango, di que lo vas a tener en la propuesta y dale una fecha."}, {"sintoma": "En la instalación, la conexión de Gmail o Drive aparece bloqueada con un mensaje de que el administrador tiene que revisar a Claude.", "solucion": "La cuenta es de Google Workspace y el administrador tiene que marcar a Claude como app de confianza (en la consola de Google: Security → Access and data control → API controls → Manage third-party app access). Por eso conviene preguntar en la llamada si usan Workspace y quién es el admin, y poner ese acceso en la lista de \"lo que necesitamos de ti\" de la propuesta."}, {"sintoma": "Al otro día no te acuerdas qué dijo exactamente y las notas quedaron incompletas.", "solucion": "Pasa las notas por la skill o el prompt de resumen el mismo día, cuando todavía te acuerdas. Lo que el resumen marque como NO LO SÉ, mándalo como preguntas cortas en el mensaje de seguimiento: es mejor preguntar que inventar en la propuesta."}], "kit": [{"archivo": "diagnostico-de-llamada/SKILL.md", "que_es": "Skill que convierte tus notas de la llamada en resumen, tareas que cubre el paquete, riesgos técnicos, preguntas pendientes, recomendación de cierre y mensaje de seguimiento. Guárdala en una carpeta llamada diagnostico-de-llamada, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: diagnostico-de-llamada\ndescription: 'Ordena las notas de una llamada de diagnóstico de 15 minutos y deja el material para la propuesta de una página. Úsala con notas o la transcripción de una llamada con un posible cliente.'\n---\n\n# Diagnóstico de llamada\n\nConviertes las notas de una llamada de diagnóstico en un resumen que sirve para decidir y para escribir la propuesta. El paquete que se ofrece instala Claude en un negocio: un Proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de Gmail, Google Calendar y Google Drive, una automatización (tarea programada) y una capacitación.\n\n## Reglas\n\n- Usa solo lo que está en las notas. Si un dato no está, escribe \"NO LO SÉ\" y súmalo a las preguntas pendientes. No completes con suposiciones.\n- Si en las notas aparecen nombres de clientes del negocio, datos de salud, documentos o datos bancarios, no los repitas: reemplázalos por el tipo de dato (por ejemplo, \"datos de pacientes\").\n- Las palabras del dueño van entre comillas y textuales. No las mejores.\n- No prometas resultados ni ahorros. Si las notas traen tiempos (minutos por tarea, veces por semana), úsalos tal cual y aclárales que son estimaciones del dueño.\n- Escribe en español rioplatense, con voseo, frases cortas.\n\n## Qué entregas, en este orden\n\n1. **El negocio en 3 líneas**: rubro, tamaño del equipo, cómo trabaja hoy.\n2. **Tareas que el paquete cubre**: una tabla con columnas Tarea | Qué haría Claude | Qué sigue haciendo una persona | Pieza del paquete (Proyecto, skill de marca, skill de presupuestos, skill de respuestas, conector, automatización).\n3. **La automatización más útil**: una sola, con qué hace, cada cuánto y qué deja (por ejemplo, borradores para revisar). Las tareas programadas piden un plan pago de Claude: si el negocio no lo tiene, dilo.\n4. **Estado técnico**: qué plan de Claude tiene o tendría, si usa Gmail personal o Google Workspace (y quién es el administrador), dónde vive la información. Marca como RIESGO lo que puede trabar la instalación: Google Workspace sin admin a mano, precios que no están escritos, información solo en la cabeza del dueño.\n5. **Preguntas pendientes**: lo que falta saber antes de la propuesta, como preguntas cortas que se puedan mandar por mensaje.\n6. **Dudas y miedos**: con sus palabras, y al lado cómo los vas a responder en la propuesta.\n7. **Lo que el paquete no resuelve**: lo que pidió o insinuó y queda afuera (agentes que hablan solos con clientes, desarrollos a medida, cargar datos que no existen).\n8. **Mi recomendación de cierre**: una de tres, con el motivo en una línea:\n   - SÍ LE SIRVE: hay al menos dos tareas del paquete con un ejemplo real en las notas.\n   - FALTA ALGO ANTES: hay tareas que encajan, pero falta un requisito (precios escritos, una cuenta, un acceso).\n   - NO LE SIRVE: las tareas que más le pesan no entran en el paquete o casi no usa la computadora ni el celular para trabajar.\n9. **Mensaje de seguimiento**: un borrador corto (4 a 6 líneas) para mandar hoy, que repita el próximo paso y la fecha acordados. Si en las notas no hay fecha acordada, el mensaje propone una.\n\n## Al final\n\nPregunta si quieres que arme la propuesta de una página con esto. No la armes sin que te lo pidan.\n"}, {"archivo": "checklist-llamada-diagnostico.md", "que_es": "Checklist de antes, durante y después de la llamada, con las preguntas técnicas que evitan sorpresas en la instalación y la plantilla de notas ampliada.", "contenido": "# Checklist de la llamada de diagnóstico\n\nImprímela o tenla abierta al lado. Marca cada casilla.\n\n## Antes (el día anterior)\n\n- [ ] Confirmé la llamada por mensaje: día, hora, por dónde (video, teléfono o en persona) y que dura 15 minutos.\n- [ ] Miré su web, sus redes y sus reseñas. Anoté una cosa concreta que vi (consultas repetidas, presupuestos, turnos).\n- [ ] Tengo la plantilla de notas copiada con el nombre del negocio.\n- [ ] Si es por video, le pedí que tenga a mano un presupuesto o una consulta real para mostrarme.\n- [ ] Si quiero grabar o transcribir, lo tengo anotado para pedir permiso al principio.\n\n## Durante\n\n- [ ] Minuto 0 a 2: agradecí, dije para qué es la charla y pide permiso para tomar notas (y para grabar, si corresponde).\n- [ ] Minuto 2 a 5: me contó un día normal. Anoté qué parte hace en la computadora o el celular.\n- [ ] Minuto 5 a 9: encontré la tarea que más tiempo come y pide un ejemplo real del último caso.\n- [ ] Anoté minutos por vez y veces por semana con los números que dijo él, no los míos.\n- [ ] Minuto 9 a 12: le devolví lo que entendí en una frase y dije qué haría Claude y qué seguiría haciendo una persona.\n- [ ] Minuto 12 a 15: propuse el próximo paso y quedó una fecha.\n- [ ] No prometí ahorros ni resultados.\n- [ ] Miré el reloj: terminé a tiempo o pregunté si podía seguir.\n\n## Preguntas técnicas que no pueden faltar\n\nSin estas, la instalación (Módulo 6) se puede trabar.\n\n- [ ] ¿Usa Gmail con una cuenta personal o con Google Workspace (mail con el dominio del negocio)? Si es Workspace, ¿quién es el administrador? Puede tener que autorizar a Claude.\n- [ ] ¿Tiene una cuenta de Claude? ¿Con qué plan? Las tareas programadas piden un plan pago. En los planes Team y Enterprise, el owner de la organización tiene que habilitar los conectores.\n- [ ] ¿Dónde están los precios, las preguntas frecuentes y los procesos? ¿Están escritos en algún lado?\n- [ ] ¿Quién más del equipo lo usaría?\n\n## Después (el mismo día)\n\n- [ ] Pasé las notas por la skill de diagnóstico (o por el prompt \"Resumen del diagnóstico\").\n- [ ] Mandé el mensaje de seguimiento con el próximo paso y la fecha.\n- [ ] Anoté en mi planilla de 50 (Módulo 2) cómo terminó: sí, falta algo o no.\n- [ ] Si quedó en \"falta algo antes\", agendé un recordatorio para la fecha que acordamos.\n- [ ] Borré o anonimicé cualquier dato sensible que haya quedado en las notas.\n\n## Plantilla de notas (versión ampliada)\n\n```\nNEGOCIO: [NOMBRE]\nRUBRO Y CIUDAD: [RUBRO, CIUDAD]\nFECHA: [FECHA]\nCON QUIÉN HABLÉ: [NOMBRE Y ROL]\n¿DECIDE ÉL O ELLA?: [SÍ/NO, QUIÉN MÁS]\nPERSONAS EN EL EQUIPO: [CANTIDAD]\nCÓMO ES UN DÍA NORMAL: [RESUMEN]\nTAREA QUE MÁS TIEMPO COME: [TAREA] | VECES POR SEMANA: [N] | MINUTOS CADA VEZ: [N]\nEJEMPLO REAL: [LO QUE CONTÓ O MOSTRÓ]\nOTRAS TAREAS QUE MENCIONÓ: [LISTA]\nLO QUE LE PREGUNTAN SIEMPRE LOS CLIENTES: [LISTA]\nDÓNDE ESTÁ LA INFORMACIÓN: [PLANILLAS, MAIL, PAPEL, WHATSAPP, CABEZA DEL DUEÑO]\nGMAIL / GOOGLE CALENDAR / GOOGLE DRIVE: [SÍ/NO EN CADA UNO]\nCUENTA DE GOOGLE: [PERSONAL O WORKSPACE] | ADMIN DE WORKSPACE: [QUIÉN]\nCLAUDE HOY: [NO TIENE / FREE / PRO / MAX / TEAM / OTRO]\nPROBÓ IA ANTES: [QUÉ Y CÓMO LE FUE]\nDUDAS O MIEDOS QUE DIJO: [TEXTUAL SI PUEDO]\nCÓMO TERMINÓ: [SÍ LE SIRVE / FALTA ALGO ANTES / NO LE SIRVE]\nPRÓXIMO PASO ACORDADO: [QUÉ Y CUÁNDO]\n```\n"}, {"archivo": "mensajes-antes-y-despues-de-la-llamada.md", "que_es": "Mensajes listos para confirmar la llamada, hacer el seguimiento según cómo terminó (le sirve, falta algo, no le sirve) y mandar un único recordatorio.", "contenido": "# Mensajes para antes y después de la llamada\n\nCambia lo que está entre corchetes. Escríbelos o revísalos uno por uno: no los mandes iguales a todos.\n\n## Confirmación (el día anterior)\n\nHola [NOMBRE], te confirmo la charla de mañana [DÍA] a las [HORA] por [VIDEO / TELÉFONO / EN PERSONA]. Son 15 minutos. Si puedes, ten a mano [UN PRESUPUESTO / UNA CONSULTA] reciente así lo vemos con un caso real. Si te surge algo, avísame y la pasamos.\n\n## Después de la llamada: le sirve\n\nHola [NOMBRE], gracias por el rato de hoy. Me quedo con lo que me contaste de [TAREA 1, CON SUS PALABRAS] y [TAREA 2]. Como quedamos, te mando la propuesta de una página el [DÍA] y la revisamos juntos el [DÍA] a las [HORA]. Si mientras tanto te acuerdas de algo más, mándamelo por aquí.\n\n## Después de la llamada: falta algo antes\n\nHola [NOMBRE], gracias por la charla. Para que el asistente te sirva de verdad, primero hace falta [REQUISITO: TENER LOS PRECIOS EN UNA PLANILLA / DEFINIR QUIÉN USA LA CUENTA / LO QUE CORRESPONDA]. Cuando lo tengas, avísame y en [PLAZO] te mando la propuesta. Si te sirve, te paso un modelo de planilla para arrancar.\n\n## Después de la llamada: no le sirve\n\nHola [NOMBRE], gracias por el tiempo. Como te dije, por cómo trabajas hoy no creo que el paquete te cambie mucho, y prefiero decírtelo ahora. Si en algún momento [CONDICIÓN: EMPIEZAN A ENTRAR MÁS CONSULTAS POR MAIL / SUMAS GENTE AL EQUIPO], escríbeme y lo vemos de nuevo. Y si conoces a alguien de [RUBRO] que esté tapado de [TAREA], me encantaría que nos presentes.\n\n## Un solo recordatorio (si no respondió en unos días)\n\nHola [NOMBRE], te escribo por la propuesta que te mandé el [DÍA]. Le sumé [ALGO QUE APORTE: UN EJEMPLO HECHO CON UNO DE TUS PRODUCTOS / LA RESPUESTA A LA DUDA QUE ME DIJISTE]. Si no es el momento, dime sin problema y no te molesto más.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

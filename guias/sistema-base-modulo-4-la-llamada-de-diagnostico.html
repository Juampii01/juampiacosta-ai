<script>var GUIA = {"slug": "sistema-base-modulo-4-la-llamada-de-diagnostico", "t": "Módulo 4 · La llamada de diagnóstico de 15 minutos", "d": "El guion de la llamada: qué preguntar, cómo encontrar la tarea que más tiempo le come al negocio y cómo cerrar con un próximo paso claro. Con plantilla de notas.", "tema": "El sistema para vender IA", "min": 10, "secciones": [{"h": "Para qué sirve la llamada", "p": ["No es una presentación tuya. Es una charla donde el que más habla es el dueño. Tu trabajo es entender cómo trabaja, encontrar dos o tres tareas donde el paquete ayuda y decirle con honestidad si le sirve o no.", "Respetá los 15 minutos. Si la charla da para más, preguntá si tiene tiempo o proponé seguir otro día. Cumplir lo que dijiste es la primera prueba de que se puede confiar en vos."]}, {"h": "El guion, minuto a minuto", "pasos": ["Minuto 0 a 2: agradecé, recordá para qué es la charla (\"ver qué tareas de tu negocio podría cubrir Claude y cuáles no\") y pedí permiso para tomar notas.", "Minuto 2 a 5: pedí que te cuente un día normal. \"¿Qué hacés desde que abrís hasta que cerrás? ¿Qué parte la hacés en la compu o el celular?\"", "Minuto 5 a 9: buscá la tarea que más tiempo come (preguntas abajo). Cuando aparezca una, pedí un ejemplo real: \"¿Cómo fue el último presupuesto que mandaste?\"", "Minuto 9 a 12: devolvé lo que entendiste en una frase y decí qué parte podría hacer Claude y qué parte seguiría haciendo una persona.", "Minuto 12 a 15: proponé el próximo paso y acordá una fecha."]}, {"h": "Las preguntas que encuentran el problema", "lista": ["¿Qué tarea te gustaría no hacer nunca más?: suele aparecer la más pesada, aunque no siempre la más frecuente.", "¿Qué te preguntan siempre tus clientes?: si responde rápido y con una lista, la skill de respuestas tiene mucho para hacer.", "¿Cuánto tardás en armar un presupuesto?: pedí minutos y cantidad por semana, no \"un montón\".", "¿Dónde está la información?: precios en una planilla, procesos en la cabeza del dueño, mails en Gmail. Te dice cuánto trabajo de carga vas a tener.", "¿Quién más del equipo haría esto?: te dice a quién capacitar y si hace falta un plan para compartir.", "¿Ya probaste alguna IA? ¿Qué pasó?: si tuvo una mala experiencia, entendé por qué antes de prometer algo distinto."], "aviso": "Si te cuenta datos sensibles de clientes o de salud, no los anotes con nombre. Para el diagnóstico alcanza con saber qué tipo de dato es."}, {"h": "Cómo cerrar", "p": ["Hay tres finales posibles, y los tres están bien:", "Sí le sirve: \"Con lo que me contaste, el paquete cubre [TAREA 1] y [TAREA 2]. Te mando una propuesta de una página con precio y plazos para [DÍA]. ¿Te parece que la revisemos juntos el [DÍA]?\"", "Le sirve, pero falta algo antes: \"Para que esto funcione necesitás tener tus precios escritos en algún lado. Si los ordenás, te mando la propuesta.\"", "No le sirve: \"Por cómo trabajás hoy, no creo que te cambie mucho. Si en algún momento [CONDICIÓN], hablemos.\" Decir que no también construye confianza y recomendaciones."]}, {"h": "Plantilla de notas y resumen con Claude", "p": ["Copiá esta plantilla antes de cada llamada y completala mientras hablás. Después pasala por Claude para ordenarla y prepararte para la propuesta del Módulo 5."], "prompts": [{"t": "Plantilla de notas", "c": "NEGOCIO: [NOMBRE]\nFECHA: [FECHA]\nCON QUIÉN HABLÉ: [NOMBRE Y ROL]\nPERSONAS EN EL EQUIPO: [CANTIDAD]\nCÓMO ES UN DÍA NORMAL: [RESUMEN]\nTAREA QUE MÁS TIEMPO COME: [TAREA] | VECES POR SEMANA: [N] | MINUTOS CADA VEZ: [N]\nEJEMPLO REAL: [LO QUE CONTÓ]\nOTRAS TAREAS QUE MENCIONÓ: [LISTA]\nDÓNDE ESTÁ LA INFORMACIÓN: [PLANILLAS, MAIL, PAPEL, CABEZA DEL DUEÑO]\nUSA GMAIL / GOOGLE CALENDAR / GOOGLE DRIVE: [SÍ/NO EN CADA UNO]\nPROBÓ IA ANTES: [QUÉ Y CÓMO LE FUE]\nDUDAS O MIEDOS QUE DIJO: [TEXTUAL SI PUEDO]\nPRÓXIMO PASO ACORDADO: [QUÉ Y CUÁNDO]"}, {"t": "Resumen del diagnóstico", "c": "Te paso mis notas de una llamada de diagnóstico con un negocio. Ofrezco un paquete que instala Claude: proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de Gmail, Google Calendar y Google Drive, una automatización y capacitación.\n\n[PEGÁ TUS NOTAS]\n\n1. Resumí el negocio en 3 líneas.\n2. Listá las tareas que el paquete podría cubrir, y para cada una qué haría Claude y qué seguiría haciendo una persona.\n3. Proponé cuál sería la automatización más útil, con su frecuencia.\n4. Listá lo que falta saber antes de mandar la propuesta, como preguntas cortas para el cliente.\n5. Listá las dudas o miedos que dijo, con sus palabras.\n6. Decime si ves algo que el paquete NO resuelve y conviene aclarar.\nNo inventes datos que no estén en las notas."}]}], "faq": [{"q": "¿Hago la llamada por video o por teléfono?", "a": "Por video si puede compartir pantalla: ver cómo arma un presupuesto vale más que diez explicaciones. Si no, teléfono o en persona está bien."}, {"q": "¿Puedo grabarla o transcribirla?", "a": "Solo si el dueño está de acuerdo y se lo pediste al principio. Si no, tomá notas con la plantilla."}, {"q": "¿Y si quiere el precio en la llamada?", "a": "Dale un rango honesto si ya lo tenés armado (Módulo 5) y aclarale que el precio final sale de la propuesta, cuando sepas el alcance."}], "fuentes": [], "cat": "sistema-base", "parte": "construi"};</script>

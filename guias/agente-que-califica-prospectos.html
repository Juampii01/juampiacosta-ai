<script>var GUIA = {"slug": "agente-que-califica-prospectos", "t": "Agente que califica prospectos: puntúa, resume y te avisa", "d": "Convierte las respuestas de tus formularios en una lista ordenada con puntaje, motivo y siguiente paso. El agente propone, tú decides a quién llamar.", "tema": "Agentes", "min": 9, "fichaNombre": "Calificador de prospectos", "ficha": [["Qué hace", "Lee formularios o mensajes, les pone un puntaje con tus criterios, resume y marca los urgentes."], ["Entradas", "Un archivo exportado de tu formulario (CSV) o mensajes pegados."], ["Dónde", "En un Proyecto de Claude o en una carpeta con Claude Code."], ["Regla", "No contacta a nadie. Tú revisas y decides."]], "secciones": [{"h": "Primero, tus criterios en puntos", "p": ["El agente solo es tan bueno como tus criterios. Escribe qué hace que alguien sea un buen cliente para ti y cuánto vale cada cosa. Suma hasta 100."], "lista": ["Encaje (hasta 30): ¿tiene el problema que resuelves y es el tipo de negocio que atiendes?", "Urgencia (hasta 25): ¿dijo para cuándo lo necesita?", "Capacidad (hasta 25): ¿mencionó presupuesto, tamaño o algo que indique que puede pagar?", "Decisión (hasta 20): ¿decide esa persona o tiene que consultarlo?"], "aviso": "No uses criterios que discriminen por edad, género, origen u otros datos personales. Puntúa el negocio y la necesidad, no a la persona."}, {"h": "Las instrucciones del agente", "prompts": [{"t": "Instrucciones del calificador", "c": "Eres el calificador de prospectos de [TU NEGOCIO]. Vendemos [QUÉ VENDES] a [A QUIÉN].\n\nPara cada respuesta de formulario o mensaje:\n1. Puntúa con estos criterios y muestra el puntaje de cada uno:\n   - Encaje (0-30): [QUÉ ES ENCAJE PARA TI]\n   - Urgencia (0-25): [QUÉ ES URGENCIA]\n   - Capacidad (0-25): [QUÉ SEÑALES CUENTAN]\n   - Decisión (0-20): [QUÉ SEÑALES CUENTAN]\n2. Suma el total y clasifica: CALIENTE (70 o más), TIBIO (40 a 69), FRÍO (menos de 40).\n3. Escribe un resumen de 2 líneas con lo que necesita, usando sus palabras.\n4. Propón el siguiente paso: llamar hoy, mandar información o nada por ahora.\n5. Si falta un dato para puntuar, pon 0 en ese criterio y anota FALTA: [dato]. No supongas.\n\nEntrega una tabla ordenada de mayor a menor puntaje y, arriba de todo, los CALIENTES en una lista aparte.\nNunca contactes a nadie ni redactes promesas de precio o plazo."}]}, {"h": "Opción A: en un Proyecto de Claude", "pasos": ["Crea un proyecto \"Prospectos\" y pega las instrucciones de arriba.", "Sube al conocimiento una descripción corta de lo que vendes y de tu cliente ideal.", "Exporta las respuestas de tu formulario como CSV. En Google Forms no hace falta pasar por la planilla: abre el formulario, entra a Responses, toca More (los tres puntos) y elige Download responses (.csv). La mayoría de los otros formularios tienen una opción parecida.", "Sube el archivo a un chat del proyecto, o pega las filas nuevas, y pide la tabla."]}, {"h": "Opción B: en una carpeta con Claude Code", "p": ["Si lo haces todas las semanas, arma una carpeta con una subcarpeta entradas para los CSV y un subagente calificador que solo pueda leer y escribir archivos."], "prompts": [{"t": "Crear el subagente calificador", "c": "Crea un subagente en .claude/agents/calificador.md.\nQué hace: lee los CSV nuevos de la carpeta entradas, califica cada prospecto con los criterios de criterios.md y escribe el resultado en resultados/[fecha].md con la tabla ordenada y los CALIENTES arriba.\nHerramientas: solo Read, Glob y Write.\nReglas: no modifica los archivos de entradas, no inventa datos faltantes y no contacta a nadie."}]}, {"h": "El aviso y la revisión humana", "lista": ["El aviso más simple: abres el archivo de resultados o el chat y miras la lista de CALIENTES primero.", "Si quieres que corra solo, la app de escritorio de Claude tiene tareas programadas en la pestaña Code: Scheduled, New task. Para que lea tu carpeta tiene que ser una tarea local (Only on this computer), que corre solo con la app abierta y la computadora despierta. Las tareas en la nube no ven tus archivos locales. Igual, el resultado es una lista para ti, no un mensaje al cliente.", "Revisa todas las semanas 5 prospectos al azar: ¿estás de acuerdo con el puntaje? Si no, ajusta los criterios, no el resultado a mano."], "aviso": "Que el agente puntúe bajo a alguien no significa que no valga la pena. Úsalo para ordenar, no para descartar sin mirar."}], "faq": [{"q": "¿En qué se diferencia de la guía de responder DMs?", "a": "Esa guía ordena mensajes y te prepara respuestas. Esta pone un puntaje con criterios fijos a muchos prospectos juntos, por ejemplo de un formulario, para decidir a quién llamar primero."}, {"q": "¿Puedo pasarle datos personales de los prospectos?", "a": "Pásale solo lo necesario para calificar. Si puedes, saca teléfonos, documentos y direcciones antes de subir el archivo."}, {"q": "Los puntajes me parecen raros", "a": "Pídele que te explique el puntaje de 3 casos. Casi siempre el problema es un criterio escrito de forma ambigua."}], "fuentes": ["https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/desktop-scheduled-tasks", "https://support.google.com/docs/answer/139706?hl=en", "https://code.claude.com/docs/en/routines", "https://code.claude.com/docs/en/tools-reference", "https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: el calificador de una agencia chica de automatizaciones", "negocio": "Ejemplo inventado: una agencia de dos personas en Asunción, Paraguay, que arma automatizaciones de atención y ventas para comercios. Reciben pedidos de presupuesto por un formulario de Google Forms enlazado desde su Instagram.", "punto_de_partida": "Las respuestas del formulario se acumulan en una planilla y las leen cuando pueden. Los pedidos serios quedan mezclados con estudiantes que preguntan por cursos y con gente que solo quiere saber precios.", "pasos": ["Completaron criterios.md con la plantilla del kit. Encaje: comercio con atención por WhatsApp o Instagram y un problema concreto de volumen de consultas. Capacidad: dijo cuántos empleados o locales tiene, o que ya paga alguna herramienta. Pusieron \"No atendemos: cursos ni capacitaciones\".", "Para los ejemplos calibrados eligieron tres prospectos del año anterior: uno que terminó siendo cliente, uno que pidió presupuesto y no respondió más, y un estudiante. Anotaron el puntaje que le habrían puesto a cada uno.", "Probaron primero la opción A: crearon el Proyecto \"Prospectos\", pegaron las instrucciones de la guía, subieron criterios.md y una descripción de su cliente ideal, y le pasaron un CSV con prospectos viejos. Los puntajes de Capacidad les parecieron altos: el criterio decía \"tamaño\" sin aclarar qué tamaño servía. Lo reescribieron con su rango.", "Como lo iban a hacer todas las semanas, pasaron a la opción B: una carpeta prospectos con entradas, resultados y criterios.md. Le pidieron a Claude Code que creara .claude/agents/calificador.md con el archivo del kit. Como era la primera vez que existía esa carpeta de agentes, reiniciaron la sesión para que lo cargara.", "Cada lunes, uno de los dos abre el formulario, entra a Responses, More, Download responses (.csv), y guarda el archivo en entradas con la fecha en el nombre.", "Después escriben en Claude Code: \"Usa el subagente calificador con los CSV nuevos\". El resultado queda en resultados con los CALIENTES arriba y los casos dudosos al final.", "Leen primero los casos dudosos y 5 prospectos al azar. Cuando no están de acuerdo con un puntaje, piden la explicación criterio por criterio y corrigen criterios.md, no el resultado. Anotan el cambio en el historial del archivo.", "Más adelante armaron una tarea local en la app de escritorio (Scheduled, New task, Only on this computer, Weekly) que corre el calificador el lunes a la mañana. La corrieron una vez con Run now, eligieron \"always allow\" en los permisos que pidió y desde ahí corre sola cuando la computadora está prendida."], "resultado": "Quedó una carpeta donde cada CSV nuevo se califica con los mismos criterios, un archivo de resultados por semana con los CALIENTES arriba, y un archivo de criterios que se ajusta con casos reales. Ninguno de los dos contacta a nadie sin haber mirado la lista."}, "si_falla": [{"sintoma": "Creaste el archivo del subagente pero Claude Code no lo encuentra o no lo usa.", "solucion": "Si era el primer archivo en una carpeta .claude/agents nueva, reinicia la sesión: Claude Code vigila solo las carpetas que existían al arrancar. Para asegurarte de que lo use, escribe @ y elige el subagente de la lista, o nómbralo: \"Usa el subagente calificador\"."}, {"sintoma": "En la tabla aparecen nombres con caracteres raros en lugar de tildes o eñes.", "solucion": "El CSV no está en UTF-8. Descárgalo desde Google Forms (Responses, More, Download responses (.csv)) o, si lo exportas desde Excel, guárdalo como CSV UTF-8 en lugar de CSV común."}, {"sintoma": "El mismo prospecto sale con puntajes distintos en dos corridas.", "solucion": "El criterio está escrito de forma ambigua. Pídele que te explique criterio por criterio de dónde sacó cada puntaje, reescribe la regla con señales concretas y suma ese caso a los ejemplos calibrados de criterios.md."}, {"sintoma": "La tarea programada no corrió el lunes.", "solucion": "Las tareas locales corren solo con la app de escritorio abierta y la computadora despierta; si la computadora estaba dormida, esa corrida se saltea. Al despertar, Desktop hace una sola corrida de recuperación de la última que se perdió. Para evitarlo, prende Keep computer awake en Settings (Desktop app o This computer, según tu versión)."}, {"sintoma": "La tarea programada arrancó pero quedó frenada sin terminar.", "solucion": "Está esperando que apruebes un permiso (por ejemplo, escribir en resultados). Abre la corrida desde History en la página de la tarea y responde. Para que no vuelva a pasar, después de crearla toca Run now y elige \"always allow\" en cada permiso que pida."}], "kit": [{"archivo": "criterios-calificacion-prospectos.md", "que_es": "La plantilla de criterios.md: qué vendes, cómo se reparten los 100 puntos, los cortes CALIENTE, TIBIO y FRÍO, lo que nunca se usa para puntuar, ejemplos calibrados con prospectos viejos y un historial de cambios.", "contenido": "# Criterios de calificación de prospectos\n\nGuarda este archivo como criterios.md en la carpeta del calificador (o súbelo al Proyecto \"Prospectos\"). Completa lo que está entre corchetes. El agente lee solo esto para puntuar: lo que no esté aquí, no cuenta.\n\n## Qué vendemos y a quién\n\n- Vendemos: [QUÉ VENDES, EN UNA LÍNEA]\n- Cliente ideal: [RUBRO, TAMAÑO, ZONA]\n- No atendemos: [RUBROS, TAMAÑOS O PEDIDOS QUE NO TOMAS]\n\n## Criterios (suman 100)\n\n### Encaje (0 a 30)\nQué cuenta como encaje:\n- [SEÑAL FUERTE, POR EJEMPLO: describe el problema que resolvemos con sus palabras] = hasta 30\n- [SEÑAL MEDIA, POR EJEMPLO: es del rubro pero el problema no está claro] = hasta 15\n- [SEÑAL DÉBIL O NULA, POR EJEMPLO: pide algo que no hacemos] = 0\n\n### Urgencia (0 a 25)\n- Dijo una fecha o un plazo concreto cercano = hasta 25\n- Dijo \"este año\", \"pronto\" o algo vago = hasta 10\n- No dijo nada sobre tiempos = 0 y FALTA: plazo\n\n### Capacidad (0 a 25)\nSeñales que cuentan (escribe las tuyas):\n- [EJEMPLO: mencionó un presupuesto dentro de nuestro rango] = hasta 25\n- [EJEMPLO: dijo cuántos empleados o locales tiene, y está en nuestro rango] = hasta 15\n- [EJEMPLO: ya paga una herramienta o un proveedor para esto] = hasta 10\n- Ninguna señal = 0 y FALTA: capacidad\n\n### Decisión (0 a 20)\n- Es dueño o dijo que decide = hasta 20\n- Dijo que lo decide con otra persona = hasta 10\n- Dijo que tiene que consultarlo y no sabe con quién = hasta 5\n- No se sabe = 0 y FALTA: quién decide\n\n## Clasificación\n\n- CALIENTE: 70 o más\n- TIBIO: 40 a 69\n- FRÍO: menos de 40\n\n## Lo que no se usa para puntuar\n\nEdad, género, origen, nacionalidad, religión, estado civil, forma de escribir o faltas de ortografía. Se puntúa el negocio y la necesidad, no a la persona.\n\n## Ejemplos calibrados\n\nCompleta al menos tres con prospectos viejos cuyo resultado ya conoces. Sirven para que el agente puntúe parecido a ti.\n\n### Ejemplo 1 (debería salir CALIENTE)\nRespuesta del formulario: [PEGA UNA RESPUESTA REAL ANONIMIZADA]\nPuntaje que le pondrías: Encaje [N], Urgencia [N], Capacidad [N], Decisión [N]\nPor qué: [UNA LÍNEA]\n\n### Ejemplo 2 (debería salir TIBIO)\nRespuesta del formulario: [PEGA]\nPuntaje que le pondrías: [PUNTAJES]\nPor qué: [UNA LÍNEA]\n\n### Ejemplo 3 (debería salir FRÍO)\nRespuesta del formulario: [PEGA]\nPuntaje que le pondrías: [PUNTAJES]\nPor qué: [UNA LÍNEA]\n\n## Historial de cambios\n\n| Fecha | Qué cambié | Por qué (qué caso salió mal) |\n|---|---|---|\n| [AAAA-MM-DD] | Primera versión | |\n"}, {"archivo": "calificador-de-prospectos-subagente.md", "que_es": "El subagente completo para Claude Code. Guárdalo como .claude/agents/calificador.md en la carpeta de prospectos: solo puede leer, buscar y escribir archivos, no repite CSV ya procesados y marca los casos dudosos.", "contenido": "---\nname: calificador\ndescription: Califica prospectos de los CSV de la carpeta entradas con los criterios de criterios.md y deja una tabla ordenada en resultados. Úsalo cuando el usuario pida calificar, puntuar u ordenar prospectos, leads o respuestas de formularios.\ntools: Read, Glob, Write\n---\n\nEres el calificador de prospectos de este negocio. No contactas a nadie: preparas una lista para que una persona decida.\n\nCada vez que te llamen:\n\n1. Lee criterios.md completo. Si no existe o tiene corchetes sin completar en los criterios, frena y avisa qué falta. No inventes criterios.\n2. Busca los CSV en entradas/ con Glob. Lee resultados/procesados.md si existe: ahí está la lista de archivos ya calificados. Califica solo los CSV que no figuran ahí, salvo que te pidan uno en particular.\n3. Para cada fila de cada CSV:\n   - Puntúa Encaje, Urgencia, Capacidad y Decisión con las reglas de criterios.md. Muestra el puntaje de cada criterio.\n   - Si falta un dato para un criterio, pon 0 y anota FALTA: [dato]. No supongas.\n   - Suma el total y clasifica en CALIENTE, TIBIO o FRÍO según criterios.md.\n   - Escribe un resumen de 2 líneas con lo que necesita, usando sus palabras.\n   - Propón el siguiente paso: llamar hoy, mandar información o nada por ahora.\n   - Si la fila parece repetida (mismo mail o mismo nombre y negocio que otra), márcala como POSIBLE DUPLICADO.\n4. Usa los ejemplos calibrados de criterios.md como referencia: un caso parecido a un ejemplo tiene que puntuar parecido.\n5. Escribe el resultado en resultados/[AAAA-MM-DD]-calificacion.md con:\n   - Arriba: lista de CALIENTES con nombre o alias, total y siguiente paso.\n   - Después: tabla completa ordenada de mayor a menor total, con columnas: nombre o alias, encaje, urgencia, capacidad, decisión, total, clase, resumen, siguiente paso, faltantes.\n   - Al final: \"Casos dudosos\", con los que quedaron a 5 puntos o menos de cambiar de clase, para que una persona los mire primero.\n6. Actualiza resultados/procesados.md agregando los nombres de los CSV que calificaste y la fecha.\n\nReglas:\n- Nunca modifiques ni borres archivos de entradas/ ni criterios.md.\n- No copies teléfonos, documentos ni direcciones al resultado. Nombre o alias, negocio y lo que pidió alcanzan.\n- No uses edad, género, origen ni otros datos personales para puntuar.\n- No redactes mensajes para los prospectos ni promesas de precio o plazo.\n- Si un CSV tiene columnas que no entiendes, di cuáles y cómo las interpretaste.\n"}, {"archivo": "calificar-prospectos/SKILL.md", "que_es": "Skill para la opción A, en Claude web o escritorio: califica un CSV o respuestas pegadas con tus criterios y entrega la tabla. Guárdala en una carpeta calificar-prospectos, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: calificar-prospectos\ndescription: 'Califica prospectos con puntaje fijo (encaje, urgencia, capacidad, decisión), los ordena y propone el próximo paso sin contactar a nadie. Úsala con un CSV de leads o al pedir a quién llamar primero.'\n---\n\n# Calificar prospectos\n\nPreparas una lista ordenada para que una persona decida a quién llamar. Nunca contactas a nadie ni redactas mensajes para los prospectos.\n\n## Antes de puntuar\n\n1. Busca los criterios del negocio: en las instrucciones del Proyecto, en un archivo de criterios del Proyecto o en el mensaje del usuario. Si no hay criterios, pídeselos al usuario con esta estructura y no sigas hasta tenerlos:\n   - Encaje (0 a 30): qué hace que alguien sea el tipo de cliente que atienden.\n   - Urgencia (0 a 25): qué cuenta como urgente.\n   - Capacidad (0 a 25): qué señales indican que puede pagar.\n   - Decisión (0 a 20): qué señales indican que decide esa persona.\n2. Si los datos vienen en un CSV, di cuántas filas leíste y qué columna usaste para cada criterio.\n\n## Para cada prospecto\n\n- Puntaje de cada criterio, con una frase que lo justifique citando lo que escribió.\n- Si falta un dato: 0 en ese criterio y FALTA: [dato]. No supongas.\n- Total y clase: CALIENTE (70 o más), TIBIO (40 a 69), FRÍO (menos de 40), salvo que los criterios del negocio digan otros cortes.\n- Resumen de 2 líneas con lo que necesita, en sus palabras.\n- Siguiente paso: llamar hoy, mandar información o nada por ahora.\n\n## Qué entregas\n\n1. Lista de CALIENTES arriba de todo.\n2. Tabla completa ordenada de mayor a menor total.\n3. Casos dudosos: los que están a 5 puntos o menos de cambiar de clase.\n4. Una línea final: \"Revisa los casos dudosos y 5 al azar antes de decidir.\"\n\n## Reglas\n\n- No uses edad, género, origen, nacionalidad ni forma de escribir para puntuar.\n- No copies teléfonos, documentos ni direcciones a la tabla.\n- Un puntaje bajo no es un descarte: es un orden. Si algo te llama la atención de un FRÍO, dilo.\n- Si el usuario te pide explicar un puntaje, muestra criterio por criterio qué texto del prospecto usaste.\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "úsalo"};</script>

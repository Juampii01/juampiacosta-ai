<script>var GUIA = {"slug": "medidor-de-uso-y-limites-de-claude", "t": "Cómo leer tu uso de Claude y planificar la semana", "d": "Dónde ver cuánto te queda, cómo funcionan la sesión de cinco horas y el límite semanal, qué gasta más y cómo repartir el trabajo para no quedarte sin plan a mitad de semana.", "tema": "Gastá menos tokens", "min": 7, "secciones": [{"h": "Dónde ver cuánto te queda", "p": ["En los planes pagos tenés un panel que te muestra, con barras, cuánto usaste de tu sesión actual y de tu límite semanal. Es lo primero que conviene mirar antes de arrancar un trabajo pesado."], "pasos": ["Entrá a claude.ai y abrí Settings → Usage (Configuración → Uso). También podés ir directo a claude.ai/settings/usage.", "Mirá la barra de la sesión actual y cuánto falta para que se renueve.", "Mirá la barra del límite semanal y cuándo se reinicia.", "Si tenés activados los usage credits (créditos de uso pagos aparte), en la misma pantalla ves lo que llevás gastado en el mes."], "aviso": "En los planes Enterprise que se cobran por consumo no hay estos límites: se paga lo que se usa."}, {"h": "La sesión de cinco horas", "p": ["La sesión arranca con tu primer mensaje y se renueva cinco horas después. No es una franja fija del día: empieza cuando vos empezás.", "Todo cuenta junto: lo que hacés en claude.ai, en Claude Code y en la app de escritorio sale del mismo límite. Si usás Claude Code a la mañana, eso ya pesa en el chat de la tarde.", "En el plan gratis el uso también se renueva cada cinco horas."]}, {"h": "El límite semanal", "lista": ["Cubre todos los modelos: no importa con cuál trabajes, todo suma al mismo semanal.", "Fable puede tener el suyo: algunos planes tienen además un límite semanal aparte solo para Fable.", "Se reinicia a una hora fija: cada cuenta tiene asignado su momento de reinicio. Lo ves en Settings → Usage.", "Puede cambiar: Anthropic aclara que puede ajustar los límites para manejar la capacidad, así que no planifiques al límite exacto."]}, {"h": "Qué gasta más", "p": ["Según el centro de ayuda de Anthropic, estas son las cosas que más mueven tu consumo. Ninguna está prohibida: la idea es usarlas cuando valen la pena."], "lista": ["Largo del mensaje: un mensaje con mucho texto pegado pesa más que uno corto.", "Archivos: el tamaño y el largo de lo que adjuntás. Lo vemos a fondo en la guía de archivos de esta categoría.", "Largo del chat: cuanto más larga la conversación, más pesa seguir en ella. Está explicado en \"Por qué Claude se pone torpe en chats largos\".", "Herramientas: Research, búsqueda web y conectores consumen bastante.", "Modelo: los modelos más potentes gastan más. Para elegir, mirá \"Qué modelo de Claude usar para cada tarea\".", "Nivel de esfuerzo: más esfuerzo da respuestas más pensadas, pero usa más.", "Artifacts: crear documentos, apps o tableros al costado del chat también cuenta.", "Tareas de varios pasos: cuando Claude busca, ejecuta código o arma archivos en una misma tarea, gasta más que en una respuesta simple."]}, {"h": "Planificá tu semana", "pasos": ["Anotá el día y la hora en que se reinicia tu semanal (lo ves en Settings → Usage).", "Separá tus tareas en pesadas (Research, archivos largos, esfuerzo alto, Opus o Fable, tareas de varios pasos) y livianas (mails, resúmenes cortos, preguntas puntuales).", "Repartí las pesadas en distintos días para no quemar todo el semanal de golpe.", "Juntá el trabajo pesado en una misma sesión de cinco horas en vez de desparramarlo en mensajes sueltos todo el día.", "A mitad de semana, mirá la barra semanal. Si vas muy adelantado, pasá las tareas livianas a un modelo más liviano y bajá el esfuerzo.", "Dejá un margen para urgencias: no programes trabajo importante justo antes del reinicio."], "prompts": [{"t": "Armá mi semana con Claude", "c": "Esta semana tengo que hacer estas tareas con Claude:\n[LISTA DE TAREAS]\nMi límite semanal se reinicia el [DÍA Y HORA].\nOrdenalas en dos grupos: pesadas (necesitan Research, archivos largos, esfuerzo alto o varios pasos) y livianas. Después repartilas en los días que quedan, sin poner más de una tarea pesada por día. Respondé en una tabla corta: día, tarea, tipo."}]}, {"h": "Si igual te quedás sin plan", "p": ["Tenés dos caminos: esperar a que se renueve la sesión o el semanal, o activar los usage credits. Con los créditos, cuando llegás al límite seguís trabajando y pagás por consumo, a las tarifas de la API, aparte de tu suscripción. Están para los planes Pro, Max y Ultra."], "pasos": ["Entrá a Settings → Usage.", "Buscá la sección Usage credits y prendé el interruptor.", "Cargá un medio de pago.", "Con Adjust limit (ajustar límite) poné un tope de gasto mensual.", "Comprá créditos con Buy usage credits."], "aviso": "Poné siempre un tope mensual. La sesión y el semanal se siguen renovando como siempre: los créditos solo cubren lo que pasa del límite."}], "faq": [{"q": "¿Claude Code y la app de escritorio tienen un límite aparte?", "a": "No. Lo que usás en claude.ai, en Claude Code y en la app de escritorio sale del mismo límite."}, {"q": "¿La sesión de cinco horas arranca a una hora fija?", "a": "No. Arranca con tu primer mensaje y se renueva cinco horas después."}, {"q": "¿Qué pasa si llego al límite en medio de un trabajo?", "a": "Podés esperar a que se renueve o, si tenés un plan Pro, Max o Ultra, activar los usage credits para seguir pagando por consumo."}, {"q": "¿Por qué mi barra baja más rápido algunos días?", "a": "Seguramente usaste más de lo que más gasta: archivos largos, chats largos, Research, modelos potentes o esfuerzo alto."}], "fuentes": ["https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/12429409-manage-usage-credits-for-paid-claude-plans", "https://support.claude.com/en/articles/10684626-enable-and-use-web-search"], "cat": "ahorrar", "parte": "aprende"};</script>

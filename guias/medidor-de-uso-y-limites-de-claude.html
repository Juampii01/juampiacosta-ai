<script>var GUIA = {"slug": "medidor-de-uso-y-limites-de-claude", "post": "MEDIDOR", "t": "Cómo leer tu uso de Claude y planificar la semana", "d": "Dónde ver cuánto te queda, cómo funcionan la sesión de cinco horas y el límite semanal, qué gasta más y cómo repartir el trabajo para no quedarte sin plan a mitad de semana.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "Dónde ver cuánto te queda", "p": ["En los planes pagos tienes un panel que te muestra, con barras, cuánto usaste de tu sesión actual y de tu límite semanal. Es lo primero que conviene mirar antes de arrancar un trabajo pesado."], "pasos": ["Entra a claude.ai y abre Settings → Usage (Configuración → Uso). También puedes ir directo a claude.ai/settings/usage.", "Mira la barra de la sesión actual y cuánto falta para que se renueve.", "Mira la barra del límite semanal y cuándo se reinicia.", "Si tienes activados los usage credits (créditos de uso pagos aparte), en la misma pantalla ves lo que llevas gastado en el mes."], "aviso": "En los planes Enterprise que se cobran por consumo no hay estos límites: se paga lo que se usa."}, {"h": "La sesión de cinco horas", "p": ["La sesión arranca con tu primer mensaje y se renueva cinco horas después. No es una franja fija del día: empieza cuando tú empiezas.", "Todo cuenta junto: lo que haces en claude.ai, en Claude Code y en la app de escritorio sale del mismo límite. Si usas Claude Code a la mañana, eso ya pesa en tu semanal y, si sigues dentro de la misma sesión de cinco horas, también en lo que te queda de sesión para el chat.", "En el plan gratis el uso también se renueva cada cinco horas."]}, {"h": "El límite semanal", "lista": ["Cubre todos los modelos: no importa con cuál trabajes, todo suma al mismo semanal.", "Fable puede tener el suyo: algunos planes tienen además un límite semanal aparte solo para Fable.", "Se reinicia a una hora fija: cada cuenta tiene asignado su momento de reinicio. Lo ves en Settings → Usage.", "Puede cambiar: Anthropic aclara que puede ajustar los límites para manejar la capacidad, así que no planifiques al límite exacto."]}, {"h": "Qué gasta más", "p": ["Según el centro de ayuda de Anthropic, estas son las cosas que más mueven tu consumo. Ninguna está prohibida: la idea es usarlas cuando valen la pena."], "lista": ["Largo del mensaje: un mensaje con mucho texto pegado pesa más que uno corto.", "Archivos: el tamaño y el largo de lo que adjuntas. Lo vemos a fondo en la guía de archivos de esta categoría.", "Largo del chat: cuanto más larga la conversación, más pesa seguir en ella. Está explicado en \"Por qué Claude se pone torpe en chats largos\".", "Herramientas: la ayuda nombra Research y la búsqueda web entre lo que más mueve tu consumo (traer un artículo largo de una URL puede gastar una parte importante). Los conectores, además, ocupan espacio en la conversación aunque no los uses.", "Modelo: los modelos más potentes gastan más. Para elegir, mira \"Qué modelo de Claude usar para cada tarea\".", "Nivel de esfuerzo: más esfuerzo da respuestas más pensadas, pero usa más.", "Artifacts: crear documentos, apps o tableros al costado del chat también cuenta.", "Tareas de varios pasos: cuando Claude busca, ejecuta código o arma archivos en una misma tarea, gasta más que en una respuesta simple."]}, {"h": "Planifica tu semana", "pasos": ["Anota el día y la hora en que se reinicia tu semanal (lo ves en Settings → Usage).", "Separa tus tareas en pesadas (Research, archivos largos, esfuerzo alto, Opus o Fable, tareas de varios pasos) y livianas (mails, resúmenes cortos, preguntas puntuales).", "Reparte las pesadas en distintos días para no quemar todo el semanal de golpe.", "Junta el trabajo pesado en una misma sesión de cinco horas en vez de desparramarlo en mensajes sueltos todo el día.", "A mitad de semana, mira la barra semanal. Si vas muy adelantado, pasa las tareas livianas a un modelo más liviano y baja el esfuerzo.", "Deja un margen para urgencias: no programes trabajo importante justo antes del reinicio."], "prompts": [{"t": "Arma mi semana con Claude", "c": "Esta semana tengo que hacer estas tareas con Claude:\n[LISTA DE TAREAS]\nMi límite semanal se reinicia el [DÍA Y HORA].\nOrdénalas en dos grupos: pesadas (necesitan Research, archivos largos, esfuerzo alto o varios pasos) y livianas. Después repártelas en los días que quedan, sin poner más de una tarea pesada por día. Responde en una tabla corta: día, tarea, tipo."}]}, {"h": "Si igual te quedas sin plan", "p": ["Tienes dos caminos: esperar a que se renueve la sesión o el semanal, o activar los usage credits. Con los créditos, cuando llegas al límite sigues trabajando y pagas por consumo, a las tarifas de la API, aparte de tu suscripción. Están para los planes Pro, Max y Ultra."], "pasos": ["Entra a Settings → Usage.", "Busca la sección Usage credits y prende el interruptor.", "Carga un medio de pago.", "Con Adjust limit (ajustar límite) pon un tope de gasto mensual.", "Compra créditos con Buy usage credits."], "aviso": "Pon siempre un tope mensual. La sesión y el semanal se siguen renovando como siempre: los créditos solo cubren lo que pasa del límite."}], "faq": [{"q": "¿Claude Code y la app de escritorio tienen un límite aparte?", "a": "No. Lo que usas en claude.ai, en Claude Code y en la app de escritorio sale del mismo límite."}, {"q": "¿La sesión de cinco horas arranca a una hora fija?", "a": "No. Arranca con tu primer mensaje y se renueva cinco horas después."}, {"q": "¿Qué pasa si llego al límite en medio de un trabajo?", "a": "Puedes esperar a que se renueve o, si tienes un plan Pro, Max o Ultra, activar los usage credits para seguir pagando por consumo. En Team y Enterprise por asiento los configura el owner de la organización en Organization settings → Usage."}, {"q": "¿Por qué mi barra baja más rápido algunos días?", "a": "Seguramente usaste más de lo que más gasta: archivos largos, chats largos, Research, modelos potentes o esfuerzo alto."}], "fuentes": ["https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/12429409-manage-usage-credits-for-paid-claude-plans", "https://support.claude.com/en/articles/10684626-enable-and-use-web-search", "https://support.claude.com/en/articles/12005970-manage-usage-credits-for-team-and-seat-based-enterprise-plans", "https://support.claude.com/en/articles/13730515", "https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages", "https://support.claude.com/en/articles/8602283-about-free-claude-usage"], "ejemplo": {"titulo": "Ejemplo resuelto: una dev freelance que dejó de quedarse sin plan los jueves", "negocio": "Ejemplo inventado: una desarrolladora freelance de Medellín, Colombia, que arma tiendas online y landings para negocios chicos. Trabaja sola, paga Claude Pro y usa Claude Code en la terminal y el chat en claude.ai para propuestas y mails.", "punto_de_partida": "Los lunes y martes hacía todo con el modelo más potente y Research para investigar a cada cliente. El jueves le aparecía el aviso de que se acercaba al límite semanal y frenaba entregas.", "pasos": ["Entró a claude.ai/settings/usage, miró las dos barras y anotó en la plantilla del kit el día y la hora en que se reinicia su semanal.", "Listó las tareas de la semana: dos funciones nuevas en una tienda (en Claude Code), una investigación de competencia para un cliente nuevo (Research), tres propuestas y mails de seguimiento.", "Las marcó con la columna de qué las hace pesadas: la investigación por Research, las funciones por ser tareas de varios pasos en Claude Code. Las propuestas y los mails quedaron como livianas.", "Puso una tarea pesada por día: la investigación el lunes, cada función en un día distinto. Las juntó en una sola sesión de cinco horas a la mañana en vez de ir y volver todo el día.", "Las livianas las pasó a un modelo más liviano con el esfuerzo bajo, y para cada propuesta abrió un chat nuevo en vez de seguir en el chat largo del cliente.", "El miércoles hizo el control de mitad de semana de la plantilla. Como venía adelantada, movió la última función a después del reinicio.", "Leyó la checklist de usage credits y decidió no prenderlos todavía. Si los prende, va a ser con tope mensual en Adjust limit."], "resultado": "Tiene una plantilla que completa el día del reinicio, sabe qué tareas pesan y por qué, y reparte el trabajo de Claude Code y el del chat sabiendo que salen del mismo límite. Si algún día se queda corta, ya sabe dónde prender los créditos y con qué tope."}, "si_falla": [{"sintoma": "No aparece la sección Usage en Settings, o no ves las barras.", "solucion": "La ayuda indica que el panel de uso está en Pro, Max, Ultra, Team y Enterprise por asiento, en Settings → Usage (o directo en claude.ai/settings/usage). En el plan gratis Claude te avisa cuando llegas al límite, que se renueva cada cinco horas. En Enterprise que se cobra por consumo no hay límites fijos que mostrar."}, {"sintoma": "Aparece \"5-hour limit reached - resets [hora]\" o \"You've reached your weekly limit\".", "solucion": "Espera al reinicio que marca el mensaje o, en Pro, Max o Ultra, prende los usage credits en Settings → Usage. Antes de volver, mira la lista de qué gasta más: si el día fue de Research, archivos largos o esfuerzo alto, eso explica la barra."}, {"sintoma": "Prendiste los usage credits y sigues frenado.", "solucion": "Revisa en Settings → Usage que el tope de Adjust limit no esté ya alcanzado y que tengas saldo. Según la ayuda, el uso sigue hasta que llegas al tope mensual o, con la recarga automática apagada, hasta que se termina el saldo. La recarga automática se configura desde la web, no desde las apps del celular."}, {"sintoma": "La barra baja rápido aunque solo estuviste en el chat.", "solucion": "Fíjate si usaste Claude Code o la app de escritorio en el mismo período: todo sale del mismo límite. También revisa si el chat ya es muy largo, si tienes muchos conectores o si el modelo y el esfuerzo están altos. Abre un chat nuevo con un resumen y baja el esfuerzo en lo que es rutina."}, {"sintoma": "Aparece \"Your message will exceed the length limit for this chat\".", "solucion": "Ese es el límite de largo de la conversación, no el de uso: tu barra puede estar bien. La ayuda recomienda adjuntar menos archivos o más chicos, mandar solo las partes que importan o abrir una conversación nueva."}], "kit": [{"archivo": "plantilla-mi-semana-con-claude.md", "que_es": "Plantilla para completar el día que se reinicia tu semanal: tareas pesadas y livianas, reparto por día y control de mitad de semana.", "contenido": "# Mi semana con Claude\n\nComplétala el día que se reinicia tu límite semanal. Te lleva cinco minutos y te evita quedarte sin plan el jueves.\n\n## Datos fijos (una sola vez)\n\n- Plan: [FREE / PRO / MAX / ULTRA / TEAM / ENTERPRISE]\n- Mi semanal se reinicia: [DÍA] a las [HORA] (lo ves en Settings → Usage o en claude.ai/settings/usage)\n- ¿Tengo un límite semanal aparte para Fable? [SÍ / NO / NO USO FABLE]\n- ¿Tengo usage credits prendidos? [SÍ, CON TOPE DE ... / NO]\n- Dónde uso Claude: [CLAUDE.AI / APP DE ESCRITORIO / CLAUDE CODE / CELULAR]. Todo sale del mismo límite.\n\n## Tareas de la semana\n\nMarca el tipo según qué usa la tarea, no según lo importante que sea.\n\n| Tarea | Pesada o liviana | Qué la hace pesada | Día | Modelo y esfuerzo |\n|---|---|---|---|---|\n| [EJ.: INFORME MENSUAL CON 3 PLANILLAS] | Pesada | Archivos largos, varios pasos | [DÍA] | [MODELO], esfuerzo normal |\n| [EJ.: 5 MAILS A PROVEEDORES] | Liviana | | [DÍA] | [MODELO LIVIANO], esfuerzo bajo |\n| | | | | |\n| | | | | |\n\nQué la hace pesada (marca lo que aplique): Research, búsqueda web, archivos largos, chat muy largo, muchos conectores, modelo potente, esfuerzo alto, artifacts, tareas de varios pasos (buscar, ejecutar código, armar archivos).\n\nReglas de reparto:\n1. No más de una tarea pesada por día.\n2. Las pesadas, juntas en una misma sesión de cinco horas y no desparramadas en el día.\n3. Nada importante en las últimas horas antes del reinicio.\n\n## Control de mitad de semana\n\nFecha del control: [DÍA]\n\n- Barra semanal hoy: [LO QUE MARCA]\n- Días que faltan para el reinicio: [N]\n- ¿Voy adelantado? [SÍ / NO]\n\nSi voy adelantado:\n- [ ] Paso las tareas livianas a un modelo más liviano.\n- [ ] Bajo el esfuerzo en lo que es rutina.\n- [ ] Abro chats nuevos en vez de seguir en los largos.\n- [ ] Muevo una tarea pesada a después del reinicio.\n\n## Al cerrar la semana\n\n- ¿Llegué al límite? [SÍ, EL DÍA ... / NO]\n- ¿Qué tarea gastó más de lo que pensaba? [TAREA]\n- ¿Qué cambio la semana que viene? [UNA SOLA COSA]\n"}, {"archivo": "checklist-usage-credits-con-tope.md", "que_es": "Checklist para prender, usar y apagar los usage credits con un tope mensual, con los nombres de botones de la ayuda oficial.", "contenido": "# Checklist: prender los usage credits sin sorpresas\n\nPara Pro, Max y Ultra. En Team y Enterprise por asiento los configura el owner de la organización desde Organization settings → Usage: si eres miembro, pídeselo a quien administra la cuenta.\n\n## Antes de prenderlos\n\n- [ ] Sé cuándo se renuevan mi sesión y mi semanal (Settings → Usage). A veces esperar es la mejor opción.\n- [ ] Entiendo que los créditos se cobran aparte de la suscripción, a las tarifas estándar de la API, y que solo se usan cuando paso el límite del plan.\n- [ ] Decide un tope mensual en mi moneda y lo pasé a dólares: [TOPE].\n- [ ] Sé que las compras de créditos no se reembolsan, salvo lo que diga la ley de mi país o casos de fraude.\n\n## Al prenderlos (Settings → Usage)\n\n- [ ] Prendí el interruptor de la sección Usage credits.\n- [ ] Cargué un medio de pago, si no tenía uno.\n- [ ] En Adjust limit puse mi tope mensual. No elegí Set to unlimited.\n- [ ] Compré créditos con Buy usage credits y leí la fecha de vencimiento antes de confirmar.\n- [ ] Decide si prendo la recarga automática (auto-reload). Si la prendo, el tope mensual es lo que me cuida.\n\n## Mientras los uso\n\n- [ ] Cuando aparece el aviso de que estoy usando créditos (por ejemplo, Now using credits), sé que ya estoy pagando aparte.\n- [ ] Miro una vez por semana el gasto del mes en la misma pantalla.\n- [ ] Si los usé dos semanas seguidas, reviso la guía de errores que agotan el plan antes de subir el tope: puede que esté gastando de más, no que me falte plan.\n\n## Para apagarlos\n\n- [ ] Apago el interruptor de Usage credits en Settings → Usage. La sesión y el semanal se siguen renovando como siempre.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

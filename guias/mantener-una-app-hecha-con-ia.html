<script>var GUIA = {"slug": "mantener-una-app-hecha-con-ia", "t": "Mantener una app hecha con IA", "d": "Revisar errores, leer los registros con Claude, actualizar dependencias sin romper nada y pasar una revisión de código antes de cada publicación.", "tema": "Crea tu app", "min": 9, "secciones": [{"h": "Publicar es el comienzo", "p": ["Las apps se deterioran aunque no las toques: aparecen errores con usuarios reales, las librerías sacan versiones nuevas, los servicios cambian. Mantener es tener una rutina chica y constante, no apagar incendios."]}, {"h": "La rutina semanal", "pasos": ["Mira los errores de la semana en Sentry o en el panel de tu hosting. Ojo con Vercel: guarda los registros de ejecución 1 hora en el plan Hobby y 1 día en Pro, así que para revisar la semana entera necesitas Sentry u otro servicio que los guarde.", "Pídele a Claude que los agrupe y te diga cuáles afectan a más usuarios.", "Arregla el más importante en una rama, pruébalo en la vista previa y publícalo.", "Revisa si hay actualizaciones de dependencias pendientes.", "Confirma que la copia de seguridad de la base se está haciendo."]}, {"h": "Que Claude lea los registros", "p": ["En vez de copiar y pegar errores sueltos, dale a Claude acceso a la fuente. En Vercel, el comando vercel logs muestra los registros. Con el MCP oficial de Sentry, Claude puede consultar los errores de tu proyecto. Y con el MCP de Supabase puede revisar los asesores de seguridad y rendimiento de tu base."], "prompts": [{"t": "Leer y priorizar errores", "c": "Revisa los registros de errores de los últimos [7] días de esta app (usa [EL MCP DE SENTRY / VERCEL LOGS CON --since]). Si la fuente no guarda tantos días, dime qué período pudiste ver de verdad.\nAgrupa los errores parecidos y, para cada grupo, dime: cuántas veces pasó, qué hacía el usuario, la causa más probable y qué archivo habría que tocar.\nOrdénalos por impacto. No cambies código todavía.\nSi en los registros ves datos personales o claves, avísame: no deberían estar ahí."}]}, {"h": "Actualizar dependencias con cuidado", "lista": ["De a una: actualiza una librería por vez, así sabes cuál rompió algo.", "En una rama: nunca directo en main. Prueba en la vista previa.", "Lee qué cambió: pídele a Claude que resuma las notas de la versión nueva y si hay cambios que rompen.", "Automatízalo: Dependabot de GitHub puede abrir pull requests que actualizan tus dependencias; tú solo revisas y aceptas."], "prompts": [{"t": "Actualizar una dependencia", "c": "Quiero actualizar [NOMBRE DE LA LIBRERÍA] a su última versión.\n1. Crea una rama nueva.\n2. Antes de actualizar, dime qué versión tengo, cuál es la nueva y si la documentación avisa de cambios que rompen.\n3. Actualiza solo esa librería, corre la app y las pruebas que haya.\n4. Dime qué tengo que probar yo a mano."}]}, {"h": "Revisión antes de publicar", "lista": ["/diff: muestra qué cambió en tu proyecto, incluidas las ediciones de Claude.", "/code-review: revisa los cambios de tu rama buscando errores. Viene incluido en Claude Code; /review es otro nombre del mismo comando. Con --fix, además aplica los arreglos (pasando por tus permisos).", "/security-review: revisa los cambios de tu rama buscando problemas de seguridad, como fallas de autenticación o datos expuestos. Necesita que el proyecto esté conectado a un repositorio remoto (origin)."], "aviso": "Si usas /code-review --fix, las correcciones se hacen por fuera de los checkpoints de la sesión: guarda un commit antes, así puedes volver con Git."}], "faq": [{"q": "¿Cada cuánto actualizo las dependencias?", "a": "Las de seguridad, apenas aparecen. El resto, con una rutina fija (por ejemplo, una vez por semana o por mes) y siempre de a una."}, {"q": "/code-review no encontró nada, ¿ya está?", "a": "Es una ayuda, no una garantía. Igual prueba la app tú, sobre todo login, pagos y permisos."}, {"q": "¿Necesito Sentry?", "a": "Para publicar no hace falta. Para la rutina semanal, depende de cuánto guarde tu hosting: en Vercel los registros de ejecución duran 1 hora en Hobby y 1 día en Pro, así que una semana después ya no están. Sentry guarda los errores agrupados y Claude los puede leer con su MCP."}], "fuentes": ["https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/code-review-local", "https://code.claude.com/docs/en/checkpointing", "https://vercel.com/docs/cli", "https://sentry.io/cookbook/debug-with-sentry-mcp-claude-code", "https://supabase.com/docs/guides/mcp", "https://docs.github.com/en/code-security/concepts/supply-chain-security/about-dependabot-version-updates", "https://vercel.com/docs/logs/runtime", "https://code.claude.com/docs/en/mcp", "https://supabase.com/docs/guides/getting-started/mcp", "https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference", "https://github.com/getsentry/sentry-mcp", "https://vercel.com/docs/cli/logs"], "ejemplo": {"titulo": "Ejemplo resuelto: la rutina semanal de una app de turnos", "negocio": "Ejemplo inventado: un desarrollador freelance de Mendoza que mantiene la app de turnos de una peluquería con tres locales. La app la armó con Claude Code (Next.js y Supabase) y está publicada en Vercel con el plan Hobby. El dueño de la peluquería le paga un mantenimiento mensual.", "punto_de_partida": "Se enteraba de los errores cuando el dueño le escribía por WhatsApp. Las librerías no se tocaban desde que publicó y nadie miraba si la copia de la base se hacía.", "pasos": ["Una sola vez: sumó Sentry a la app y conectó su MCP a Claude Code con claude mcp add --transport http sentry https://mcp.sentry.dev/mcp, y después inició sesión desde /mcp. Lo hizo porque en Hobby los registros de Vercel duran una hora y su revisión es semanal.", "Conectó el MCP de Supabase limitado al proyecto de la peluquería y en solo lectura, para que la revisión pueda pedir los asesores sin poder cambiar nada.", "Subió a la rama principal el archivo dependabot-app-chica.yml del kit como .github/dependabot.yml, y prendió las actualizaciones de seguridad de Dependabot en la configuración del repo.", "Copió la skill revision-semanal-de-la-app en .claude/skills/ del proyecto. Cada lunes abre Claude Code y escribe: haz la revisión semanal.", "La primera revisión agrupó los errores de Sentry y puso arriba un error al confirmar turnos desde el celular en un local, y aparte avisó que un registro imprimía el teléfono del cliente completo.", "Hizo un commit, creó la rama fix/confirmar-turno y le pidió a Claude el arreglo. Corrió /diff y /code-review, probó en la vista previa de Vercel con su celular y mergeó. En la misma rama le pidió que el registro dejara de imprimir el teléfono.", "De los pull requests de Dependabot aceptó uno solo esa semana, la actualización de seguridad, después de probarlo en su vista previa. El de versión mayor del framework lo dejó para otra semana, con el prompt de la guía para leer qué cambia.", "Al final de la rutina confirmó en el panel de Supabase que la copia estaba, y anotó todo en la tabla de registro de la checklist."], "resultado": "Quedó una rutina fija de los lunes con un informe que siempre tiene la misma forma, un solo arreglo por semana probado antes de publicar, dependencias que se actualizan de a una con pull requests que abre Dependabot, y un registro escrito que el freelance le puede mostrar al dueño para explicar qué incluye el mantenimiento."}, "si_falla": [{"sintoma": "/security-review falla con un error que menciona ambiguous argument o un comando de shell que no pudo correr.", "solucion": "Necesita un remote llamado origin y su rama por defecto. Si el proyecto no está en GitHub, súbelo primero (git remote add origin [URL] y git push). Si ya está, suele resolverse con git fetch origin y git remote set-head origin --auto."}, {"sintoma": "Usaste /code-review --fix, algo quedó mal y /rewind no deshizo esos cambios.", "solucion": "La revisión corre en segundo plano y aplica sus arreglos por fuera de los checkpoints: /rewind solo vuelve los archivos que Claude ya había editado en tu conversación. Vuelve con Git al commit que hiciste antes (git restore . descarta los cambios sin commit). Por eso, commit siempre antes de --fix."}, {"sintoma": "vercel logs tira un error de uso con --follow, --level o --source, o no muestra nada de ayer.", "solucion": "En las versiones nuevas de la CLI esas opciones cambiaron: usa --query 'level:error' en vez de --level error, y --since 2h (o el período que quieras) para mirar más atrás. Si no aparece nada de ayer, puede que tu plan ya no lo guarde: en Hobby es 1 hora."}, {"sintoma": "Claude dice que el MCP de Sentry no está autenticado o no ve tus proyectos.", "solucion": "Dentro de Claude Code corre /mcp, elige sentry y sigue el inicio de sesión en el navegador (o, desde la terminal, claude mcp login sentry). Entra con la cuenta de Sentry que tiene acceso a la organización de la app."}, {"sintoma": "Subiste dependabot.yml y Dependabot no abre ningún pull request.", "solucion": "Revisa que el archivo esté en .github/dependabot.yml de la rama por defecto del repo, que empiece con version: 2 y que package-ecosystem y directory apunten a donde está tu package.json."}], "kit": [{"archivo": "revision-semanal-de-la-app/SKILL.md", "que_es": "Skill para Claude Code que hace la revisión de los lunes: errores agrupados por impacto (Sentry o vercel logs), asesores de Supabase, dependencias pendientes y copias, en un informe fijo y sin tocar código. Copia la carpeta en .claude/skills/ del proyecto.", "contenido": "---\nname: revision-semanal-de-la-app\ndescription: 'Revisión semanal de una app web: agrupa errores por impacto, mira dependencias y copias, y deja un informe sin cambiar código. Úsala al pedir la revisión semanal o los errores de la semana.'\n---\n\n# Revisión semanal de la app\n\nHaces la revisión de mantenimiento de la semana. Primero informas, después el usuario decide qué se arregla. No cambias código ni dependencias en esta revisión.\n\n## 1. Errores de la semana\n\nUsa la fuente que esté disponible, en este orden:\n1. El MCP de Sentry, si está conectado: issues de los últimos 7 días del proyecto de esta app.\n2. vercel logs, si el proyecto está vinculado a Vercel: `vercel logs --environment production --query 'level:error' --since 168h`. Si el plan guarda menos tiempo (Hobby 1 hora, Pro 1 día), di qué período pudiste ver de verdad.\n3. Si no hay ninguna, pídele al usuario que pegue los errores o que exporte los registros.\n\nCon lo que encuentres:\n- Agrupa los errores parecidos (mismo mensaje o misma ruta).\n- Para cada grupo: cuántas veces aparece en lo que viste, qué estaba haciendo el usuario, causa más probable y archivo a tocar.\n- Ordena por impacto: primero lo que frena login, pagos, carga de datos o la función principal; después lo que molesta; al final lo cosmético.\n- Si ves datos personales, contraseñas o claves en los registros, ponlo arriba de todo como problema aparte.\n\n## 2. Base de datos\n\nSi el MCP de Supabase está conectado, pide los asesores de seguridad y rendimiento y resume los de nivel más alto. Si no está, saltea este punto y dilo.\n\n## 3. Dependencias\n\n- Si el repo tiene `.github/dependabot.yml`, lista los pull requests de Dependabot abiertos (con `gh pr list --author app/dependabot` si `gh` está instalado).\n- Si no, corre el comando de paquetes desactualizados del gestor que use el proyecto (por ejemplo `npm outdated`) y `npm audit` si es npm.\n- Separa: actualizaciones de seguridad (van primero), cambios de versión mayor (pueden romper) y el resto.\n\n## 4. Copias\n\nRevisa si hay en el repo un script o workflow de copia de la base y cuándo corrió por última vez, si se puede saber. Si no se puede saber desde aquí, deja la pregunta para el usuario: \"¿Viste la copia de esta semana en [lugar]?\".\n\n## Qué entregas\n\n```\nREVISIÓN SEMANAL — [fecha]\nPeríodo de errores visto: [de qué fecha a qué fecha, y de qué fuente]\n\nARREGLAR ESTA SEMANA (uno solo)\n- [grupo de error] — por qué es el más importante — archivo — arreglo propuesto\n\nOTROS ERRORES\n- [grupo] — impacto — causa probable\n\nBASE DE DATOS\n- [asesor] — qué significa — qué hacer\n\nDEPENDENCIAS\n- Seguridad: [...]\n- Versión mayor (con cuidado): [...]\n- Resto: [...]\n\nCOPIAS\n- [estado o pregunta para el usuario]\n```\n\n## Reglas\n- No cambies código, no actualices nada y no hagas commits en esta revisión.\n- No pegues datos personales ni claves que aparezcan en los registros: di en qué registro están y qué tipo de dato es.\n- Si una fuente no está disponible, dilo. No completes con suposiciones.\n"}, {"archivo": "dependabot-app-chica.yml", "que_es": "Configuración de Dependabot para una app con npm: un pull request por librería, revisión semanal y como mucho tres abiertos a la vez, más las acciones de GitHub una vez por mes. Guárdalo como .github/dependabot.yml en la rama principal.", "contenido": "# Guárdalo como .github/dependabot.yml en la rama principal del repo.\n# Dependabot va a abrir pull requests con actualizaciones; tú los pruebas en la vista previa y los aceptas.\nversion: 2\nupdates:\n  # Librerías de la app (package.json en la raíz)\n  - package-ecosystem: \"npm\"\n    directory: \"/\"\n    schedule:\n      interval: \"weekly\"\n    open-pull-requests-limit: 3\n    commit-message:\n      prefix: \"deps\"\n\n  # Acciones de GitHub, si usas workflows en .github/workflows\n  - package-ecosystem: \"github-actions\"\n    directory: \"/\"\n    schedule:\n      interval: \"monthly\"\n"}, {"archivo": "checklist-rutina-semanal-mantenimiento.md", "que_es": "La rutina completa para imprimir o tener abierta: lo que se configura una sola vez, los pasos de cada semana con los comandos de Claude Code, lo mensual y una tabla de registro para mostrarle al cliente.", "contenido": "# Rutina semanal de mantenimiento\n\nApp: [NOMBRE]\nDía fijo: [DÍA Y HORA, por ejemplo lunes 9:00]\nResponsable: [QUIÉN]\n\n## Una sola vez, antes de la primera semana\n- [ ] Sentry conectado a la app y su MCP a Claude Code:\n      claude mcp add --transport http sentry https://mcp.sentry.dev/mcp\n      y después /mcp dentro de Claude Code para iniciar sesión.\n- [ ] Si usas Vercel: sé cuánto guarda mi plan (Hobby 1 hora, Pro 1 día). Si es menos que una semana, Sentry no es opcional para esta rutina.\n- [ ] Si usas Supabase: MCP conectado, idealmente limitado al proyecto y en solo lectura para esta rutina (opciones project_ref y read_only=true de la URL del servidor).\n- [ ] .github/dependabot.yml subido a la rama principal (archivo del kit).\n- [ ] Actualizaciones de seguridad de Dependabot activadas en Settings del repo.\n- [ ] Sé dónde está la copia de la base y cómo veo que se hizo: [LUGAR]\n\n## Cada semana (30 a 60 minutos)\n- [ ] git switch main && git pull, y la app anda en local.\n- [ ] En Claude Code: \"haz la revisión semanal\" (skill revision-semanal-de-la-app) y guardé el informe abajo.\n- [ ] Elige UN error para arreglar. Rama nueva: git switch -c fix/[nombre]\n- [ ] Commit antes de pedirle el arreglo a Claude (si uso /code-review --fix, también).\n- [ ] /diff para ver qué cambió, /code-review para buscar errores y /security-review si tocó login, pagos o permisos.\n- [ ] Probado en la vista previa: [QUÉ PROBÉ]\n- [ ] Merge y publicado. Miré los registros de la primera hora.\n- [ ] Dependencias: acepté a lo sumo una actualización (de a una), probada en su vista previa. Las de seguridad, primero.\n- [ ] Copia de la base de esta semana: vista en [LUGAR].\n\n## Cada mes\n- [ ] Probé restaurar la copia en un proyecto de prueba.\n- [ ] Revisé cuentas y claves: quién tiene acceso al hosting, la base y GitHub, y si hay alguna clave que ya no se usa.\n\n## Registro\n| Semana | Error arreglado | Dependencia actualizada | Copia vista | Notas |\n|---|---|---|---|---|\n| [AAAA-MM-DD] | [...] | [...] | sí / no | [...] |\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

<script>var GUIA = {"slug": "subagentes-en-claude-code", "t": "Subagentes: ayudantes que trabajan aparte", "d": "Claude le pasa una parte del trabajo a un ayudante con su propia memoria y te devuelve solo el resultado. Cuándo conviene y cómo crear el tuyo.", "tema": "Claude Code", "min": 8, "secciones": [{"h": "Qué es un subagente", "p": ["Un ayudante especializado que trabaja en una conversación aparte, con sus propias instrucciones y las herramientas que vos le habilites. Cuando termina, le devuelve a Claude un resumen.", "La gran ventaja: la búsqueda larga, los registros y los archivos que tuvo que leer se quedan en su espacio y no llenan tu conversación principal."]}, {"h": "Los que ya vienen incluidos", "lista": ["Explore: busca y analiza tu proyecto. Solo lee, no puede editar.", "Plan: junta información cuando estás en modo plan. También solo lee.", "General-purpose: para tareas de varios pasos que necesitan investigar y también hacer cambios."], "p": ["Claude los usa solo cuando le parece. No tenés que hacer nada para activarlos."]}, {"h": "Cuándo conviene uno propio", "lista": ["Tareas que generan mucho texto que después no vas a mirar: revisar muchas páginas, leer registros, buscar en todo el proyecto.", "Tareas que repetís y querés hacer siempre igual: revisar textos, chequear enlaces rotos, revisar código antes de publicar.", "Cuando querés limitar qué puede hacer: por ejemplo, un revisor que solo lee y nunca edita."], "p": ["Para idas y vueltas rápidas o cambios chicos, mejor quedate en la conversación principal."]}, {"h": "Crealo pidiéndoselo a Claude", "p": ["La forma más simple es describirlo con tus palabras y decirle dónde guardarlo. En ~/.claude/agents/ queda para todos tus proyectos; en .claude/agents/ dentro de la carpeta, solo para ese proyecto."], "prompts": [{"t": "Crear un subagente revisor", "c": "Creá un subagente personal en ~/.claude/agents/ llamado revisor-textos.\nQué hace: revisa los textos de páginas web y documentos antes de publicar.\nQué busca: errores de ortografía, frases confusas, promesas exageradas y textos que no usan voseo rioplatense.\nCómo responde: una lista con cada problema, el texto actual y la versión corregida.\nQue sea de solo lectura: no puede editar archivos."}], "pasos": ["Pegá el prompt en Claude Code y aprobá cuando quiera crear el archivo.", "Abrí el archivo que creó y revisá que diga lo que pediste.", "Si Claude no lo encuentra, cerrá y abrí Claude Code: pasa cuando la carpeta agents no existía al empezar la sesión."]}, {"h": "Cómo se ve el archivo", "p": ["Es un archivo de texto con un encabezado y, abajo, las instrucciones. Solo name y description son obligatorios; tools limita las herramientas y model elige el modelo."], "prompts": [{"t": "Ejemplo de archivo (~/.claude/agents/revisor-textos.md)", "c": "---\nname: revisor-textos\ndescription: Revisa textos de páginas y documentos antes de publicar. Usalo cuando haya textos nuevos o modificados.\ntools: Read, Grep, Glob\n---\n\nSos un revisor de textos en español rioplatense. Para cada problema que encuentres, mostrá el texto actual, explicá el problema en una línea y proponé la versión corregida."}]}, {"h": "Usarlo", "lista": ["Por nombre: \"Usá el subagente revisor-textos para revisar la carpeta de la landing\".", "Con @: escribí @ y elegilo de la lista. Así te asegurás de que lo use.", "Para ver lo que corre en segundo plano, incluidos los subagentes, escribí /tasks."], "aviso": "El subagente no ve tu conversación: arranca solo con lo que Claude le pasa. Y si edita archivos, /rewind puede no deshacer esos cambios. Guardá tu trabajo con git antes."}], "faq": [{"q": "Escribo /agents y solo me muestra un mensaje", "a": "En las versiones actuales, /agents solo te recuerda que se los pidas a Claude o que edites la carpeta agents directamente. Es normal."}, {"q": "¿Gastan más?", "a": "Cada subagente es otra conversación con Claude, así que usa parte de tu límite. A cambio, mantiene tu conversación principal liviana."}], "fuentes": ["https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/checkpointing", "https://code.claude.com/docs/en/skills#run-skills-in-a-subagent"], "ejemplo": {"titulo": "Ejemplo resuelto: dos revisores para la web de una escuela de idiomas", "negocio": "Ejemplo inventado: una escuela de inglés para adultos en Medellín, con dos sedes y clases online. La dueña mantiene la web (unas quince páginas en HTML) con Claude Code y una profesora le ayuda con los textos.", "punto_de_partida": "Cada vez que cambian un precio o un horario lo corrigen en una página y queda viejo en otra. Las revisiones las hacían en la conversación principal y se llenaba de páginas leídas.", "pasos": ["Hizo un commit antes de empezar, como pide el aviso de la guía.", "Copió la plantilla datos-del-negocio-plantilla.md del kit como datos-del-negocio.md en la raíz de la web y completó contacto, sedes, horarios, precios en COP y las promos con su fecha de vencimiento.", "Guardó revisor-de-datos-del-negocio.md del kit en .claude/agents/. Como la carpeta no existía al abrir la sesión, cerró y abrió Claude Code.", "Con el prompt de la guía creó también revisor-textos, pero lo pidió para el proyecto (.claude/agents/) en vez de personal, así la profesora lo tiene cuando trabaja en la misma carpeta con git.", "Pegó el prompt 3 del kit para lanzar en paralelo el revisor de textos, el de datos y uno que busque imágenes que no existen. Cada uno trabajó aparte y en la conversación principal quedó una sola tabla.", "El revisor de datos marcó un horario de sábados distinto en la página de la sede Laureles y una promo vencida en la home. La dueña confirmó cuál era el dato bueno en datos-del-negocio.md y le pidió a Claude que corrigiera esas dos páginas.", "Antes de publicar escribió @ y eligió revisor-de-datos-del-negocio para una última pasada, que volvió con TODO COINCIDE."], "resultado": "Los datos del negocio viven en un solo archivo y dos subagentes de solo lectura revisan la web contra ese archivo y contra el estilo de la escuela. La conversación principal queda con los resultados, no con las páginas leídas."}, "si_falla": [{"sintoma": "Guardaste el archivo del subagente y Claude dice que no lo encuentra.", "solucion": "Si la carpeta agents no existía al empezar la sesión, reiniciá Claude Code. Revisá también que el archivo empiece con el encabezado entre líneas de tres guiones y que tenga name y description. Si agregaste la carpeta con /add-dir, esa no se vigila: reiniciá después de cada cambio."}, {"sintoma": "El subagente devuelve algo que no tiene nada que ver con lo que venían hablando.", "solucion": "No ve tu conversación. Pedile a Claude que le pase el contexto: qué cambiaron, qué archivos mirar y con qué criterio. El prompt 2 del kit tiene el formato."}, {"sintoma": "Después de que un subagente editó archivos, /rewind no los deja como estaban.", "solucion": "Es una limitación conocida: los cambios de un subagente en archivos que Claude no había tocado en tu conversación no se restauran con /rewind. Volvé con git (git status para ver qué cambió, git restore <archivo> para descartarlo). Por eso conviene el commit antes."}, {"sintoma": "Al abrir Claude Code aparece un aviso de que las descripciones de los subagentes son demasiado largas.", "solucion": "Pasa cuando las descriptions de tus subagentes suman más de 15.000 tokens: todas se cargan en cada sesión. Acortalas a una o dos frases con cuándo usarlos, y sacá de ~/.claude/agents/ los que ya no usás."}, {"sintoma": "El subagente usa un modelo distinto del que pusiste en model.", "solucion": "Claude puede elegir el modelo al lanzarlo, y eso gana sobre el encabezado. Mirá en /tasks con qué modelo corrió. Si querés uno fijo, pedilo en el mismo mensaje (\"usá el subagente X con haiku\")."}], "kit": [{"archivo": "revisor-de-datos-del-negocio.md", "que_es": "Subagente de solo lectura que compara precios, horarios, teléfonos, direcciones y promos de tu web o documentos contra un archivo único con los datos del negocio y te lista cada diferencia. Guardalo en .claude/agents/ del proyecto.", "contenido": "---\nname: revisor-de-datos-del-negocio\ndescription: Compara los precios, horarios, teléfonos, direcciones, mails y condiciones que aparecen en la web o en documentos del proyecto contra datos-del-negocio.md, y lista cada diferencia con archivo y línea. Usalo de forma proactiva antes de publicar cambios en textos, la web o materiales para clientes.\ntools: Read, Grep, Glob\nmodel: haiku\n---\n\nSos un revisor de datos. Tu única fuente de verdad es el archivo datos-del-negocio.md en la raíz del proyecto. No editás nada.\n\n## Pasos\n\n1. Leé datos-del-negocio.md. Si no existe, frená y respondé solo: \"Falta datos-del-negocio.md en la raíz del proyecto\".\n2. Revisá la carpeta que te indiquen. Si no te indican ninguna, todo el proyecto, salvo node_modules, .git, .next, dist y build.\n3. Buscá con Grep cada tipo de dato:\n   - Precios y montos: signos $, USD, ARS, MXN, COP, UYU, CLP, \"precio\", \"cuota\", \"seña\".\n   - Teléfonos y WhatsApp: secuencias de 8 o más dígitos, \"wa.me\", \"WhatsApp\".\n   - Mails: el signo @ seguido de un dominio.\n   - Horarios y días: \"hs\", \"horario\", nombres de días, rangos como 9 a 18.\n   - Direcciones: \"calle\", \"av.\", \"local\", números de calle cerca de un barrio o ciudad.\n   - Condiciones: \"envío\", \"garantía\", \"devolución\", \"promo\", \"descuento\", \"vigente\".\n4. Compará cada aparición con datos-del-negocio.md.\n\n## Cómo respondés\n\nUna tabla con estas columnas:\n\n| Archivo:línea | Dice | Debería decir | Tipo |\n\n- Tipo DIFERENTE: el dato existe en datos-del-negocio.md y no coincide.\n- Tipo SIN RESPALDO: aparece un dato que no está en datos-del-negocio.md (puede ser viejo o inventado).\n- Tipo VENCIDO: una promo o condición con fecha que ya pasó según datos-del-negocio.md.\n\nAl final, una sola línea: TODO COINCIDE, o la cantidad de filas de la tabla seguida de \"diferencias para revisar\".\n\nNo propongas textos de marketing ni cambios de estilo. Solo datos.\n"}, {"archivo": "datos-del-negocio-plantilla.md", "que_es": "Plantilla del archivo que el revisor usa como fuente de verdad. Copiala como datos-del-negocio.md en la raíz del proyecto y completá los corchetes.", "contenido": "# Datos del negocio\n\nEsta es la fuente de verdad. Si un dato cambia, se cambia primero acá y después en la web.\nActualizado por: [NOMBRE] · Fecha: [AAAA-MM-DD]\n\n## Contacto\n\n- Nombre comercial: [NOMBRE]\n- WhatsApp: [+54 9 ... / +52 ... / +57 ...]\n- Teléfono fijo: [o \"no tenemos\"]\n- Mail: [mail@dominio]\n- Instagram: [@usuario]\n\n## Dónde estamos\n\n- Dirección: [CALLE Y NÚMERO, BARRIO, CIUDAD]\n- Cómo llegar o referencias: [opcional]\n- Atención solo online: [sí / no]\n\n## Horarios\n\n- Lunes a viernes: [DE ... A ...]\n- Sábados: [DE ... A ... / cerrado]\n- Domingos y feriados: [cerrado / ...]\n\n## Precios vigentes\n\nMoneda: [ARS / MXN / COP / UYU / CLP / USD] · Vigentes desde: [AAAA-MM-DD]\n\n| Producto o servicio | Precio | Aclaración |\n| --- | --- | --- |\n| [NOMBRE] | [MONTO] | [por mes, por clase, con IVA, etc.] |\n| [NOMBRE] | [MONTO] | [ ] |\n\n## Promos\n\n| Promo | Condición | Vence |\n| --- | --- | --- |\n| [NOMBRE] | [QUÉ HAY QUE HACER] | [AAAA-MM-DD] |\n\n## Condiciones\n\n- Medios de pago: [ ]\n- Envíos o modalidad: [ ]\n- Cambios y devoluciones: [ ]\n- Seña o reserva: [ ]\n\n## Lo que nunca se publica\n\n- [Ej.: precios mayoristas, datos personales de clientes, el celular personal del dueño]\n"}, {"archivo": "prompts-para-delegar-a-subagentes.md", "que_es": "Seis prompts para delegar bien: buscar sin llenar la conversación, pasarle contexto a un subagente, lanzar revisiones en paralelo, leer un registro largo, crear uno a medida y cuidarte antes de dejarlo editar.", "contenido": "# Prompts para delegar en subagentes\n\nEl subagente no ve tu conversación: arranca solo con lo que Claude le pasa. Por eso cada prompt dice qué mirar, con qué criterio y qué devolver. Cambiá lo que está entre corchetes.\n\n## 1. Buscar sin llenar la conversación\n\n```\nUsá el subagente Explore para encontrar dónde se [QUÉ: arma el precio final del carrito / manda el mail de confirmación].\nDevolveme solo: archivo y línea de cada lugar, y una frase de qué hace cada uno.\nNo me pegues código largo.\n```\n\n## 2. Revisar con tu subagente, pasándole el contexto\n\n```\nUsá el subagente [NOMBRE] para revisar [CARPETA O ARCHIVOS].\nContexto que no tiene: [QUÉ CAMBIAMOS Y POR QUÉ, EN 2 LÍNEAS].\nCriterio: [QUÉ CUENTA COMO PROBLEMA].\nQue devuelva una lista con archivo, línea, problema y corrección propuesta.\nDespués mostrame la lista y esperá mi OK antes de corregir nada.\n```\n\n## 3. Varias revisiones en paralelo\n\n```\nLanzá en paralelo tres subagentes de solo lectura sobre [CARPETA]:\n1. Uno que busque textos sin voseo o con errores de ortografía.\n2. Uno que busque enlaces y rutas de imágenes que no existen en el proyecto.\n3. El subagente revisor-de-datos-del-negocio contra datos-del-negocio.md.\nCuando terminen los tres, juntá los resultados en una sola tabla ordenada por archivo.\n```\n\n## 4. Leer un registro largo\n\n```\nUsá un subagente para leer [ARCHIVO DE LOG O SALIDA DE PRUEBAS].\nQue me devuelva solo: los errores distintos que aparecen, cuántas veces aparece cada uno y la primera línea donde aparece.\nNada de copiar el registro entero.\n```\n\n## 5. Crear un subagente a medida\n\n```\nCreá un subagente de este proyecto en .claude/agents/ llamado [NOMBRE-CON-GUIONES].\nQué hace: [UNA FRASE].\nCuándo usarlo: [EN QUÉ MOMENTO DEL TRABAJO]. Sumá \"Usalo de forma proactiva\" en la description.\nHerramientas: solo Read, Grep y Glob, salvo que te diga otra cosa.\nCómo responde: [FORMATO].\nMostrame el archivo antes de guardarlo.\n```\n\n## 6. Antes de dejarlo editar\n\n```\nAntes de usar un subagente que edite archivos, hacé un commit con el mensaje \"antes de [TAREA]\".\nRecordá que /rewind puede no deshacer lo que edite el subagente: si algo sale mal, volvemos con git.\n```\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

<script>var GUIA = {"slug": "treinta-dias-de-ideas-de-contenido", "t": "30 días de ideas de contenido en una tabla", "d": "Definí 3 o 4 pilares, armá un banco de ideas con Claude y bajalo a un calendario de 30 días que podés abrir en Google Sheets.", "tema": "Contenido y redes", "min": 8, "fichaNombre": "Calendario de 30 días", "ficha": [["Qué es", "Un sistema para no arrancar cada día pensando qué publicar."], ["Necesitás", "Claude y, si querés la planilla, una cuenta de Google."], ["Tiempo", "Una hora para armar el mes entero."], ["Qué no hace", "No graba ni publica. Te deja el plan y las ideas."]], "secciones": [{"h": "1. Tus pilares", "p": ["Los pilares son los 3 o 4 temas grandes de los que hablás siempre. Sirven para que tu cuenta tenga un hilo y para que la gente sepa por qué seguirte."], "prompts": [{"t": "Definir pilares", "c": "Ayudame a definir mis pilares de contenido.\nA qué me dedico: [EN UNA LÍNEA].\nA quién le hablo: [TU PÚBLICO].\nQué vendo o quiero vender: [TU OFERTA].\nTemas de los que sé y me gusta hablar: [LISTA].\n\nProponeme 4 pilares. Para cada uno:\n- Nombre corto.\n- Por qué le importa a mi público.\n- Cómo se conecta con lo que vendo.\n- Un ejemplo de publicación.\nUno de los pilares tiene que ser personal o de detrás de escena, para que no todo sea enseñar o vender."}]}, {"h": "2. Banco de ideas", "p": ["Antes de armar el calendario, juntá muchas más ideas de las que vas a usar. Elegir es más fácil que inventar."], "prompts": [{"t": "Banco de ideas", "c": "Con estos pilares: [PEGÁ TUS PILARES]\nArmame un banco de 50 ideas de contenido para Instagram.\nPara cada idea: pilar, título de trabajo, formato sugerido (reel hablado, carrusel, historia) y el ángulo (error común, paso a paso, opinión, caso, pregunta frecuente).\nMezclá ángulos dentro de cada pilar. Evitá ideas que digan lo mismo con otras palabras.\nSumá también 10 ideas a partir de estas preguntas que me hacen seguido: [PEGÁ PREGUNTAS DE TUS CLIENTES O SEGUIDORES]."}], "pasos": ["Marcá con una estrella las ideas que te dan ganas de grabar.", "Tachá las que no podrías respaldar con algo concreto.", "Quedate con unas 30."]}, {"h": "3. El calendario en una tabla", "prompts": [{"t": "Calendario de 30 días", "c": "Con estas ideas elegidas: [PEGÁ TUS 30 IDEAS]\nArmame un calendario de 30 días empezando el [FECHA DE INICIO].\nVoy a publicar [CUÁNTAS VECES POR SEMANA] y los días [QUÉ DÍAS].\nColumnas: fecha, día, pilar, formato, título, gancho, pedido final, estado.\nReglas: no repitas el mismo pilar dos publicaciones seguidas, alterná formatos y dejá la columna estado en \"pendiente\".\nDevolvelo primero como tabla y después el mismo contenido en formato CSV, separado por comas, en un bloque de código."}]}, {"h": "4. Pasalo a Google Sheets", "pasos": ["Copiá el bloque CSV y guardalo en un archivo de texto con extensión .csv (por ejemplo calendario.csv). Si en Claude tenés activado \"Crear y editar archivos\", también podés pedirle que te genere el archivo directamente.", "Abrí una planilla en Google Sheets y andá a Archivo → Importar.", "Subí el archivo, elegí si querés una hoja nueva o reemplazar la actual, y en el separador dejá la detección automática o coma.", "Tocá Importar. Usá la columna estado para ir marcando lo grabado y lo publicado."]}, {"h": "5. Guardalo en un proyecto", "p": ["Creá un proyecto en Claude llamado Contenido y subí al conocimiento tus pilares, tu ficha de voz y el calendario. Así, cuando le pidas el guion del día 12, ya tiene todo el contexto."], "aviso": "Subí la versión actualizada del calendario cada tanto: Claude no ve los cambios que hacés en la planilla."}], "faq": [{"q": "¿Y si un día no tengo ganas de esa idea?", "a": "Cambiala por otra del banco del mismo pilar. El calendario es una guía, no una obligación."}, {"q": "¿Puedo pedirle que use tendencias de la semana?", "a": "Si le pasás vos lo que viste (links o capturas), sí. No le pidas que adivine qué está de moda sin darle material."}], "fuentes": ["https://suppo

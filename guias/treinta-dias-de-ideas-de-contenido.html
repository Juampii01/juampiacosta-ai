<script>var GUIA = {"slug": "treinta-dias-de-ideas-de-contenido", "t": "30 días de ideas de contenido en una tabla", "d": "Define 3 o 4 pilares, arma un banco de ideas con Claude y bájalo a un calendario de 30 días que puedes abrir en Google Sheets.", "tema": "Contenido y redes", "min": 8, "fichaNombre": "Calendario de 30 días", "ficha": [["Qué es", "Un sistema para no arrancar cada día pensando qué publicar."], ["Necesitas", "Claude y, si quieres la planilla, una cuenta de Google."], ["Tiempo", "Una hora para armar el mes entero."], ["Qué no hace", "No graba ni publica. Te deja el plan y las ideas."]], "secciones": [{"h": "1. Tus pilares", "p": ["Los pilares son los 3 o 4 temas grandes de los que hablas siempre. Sirven para que tu cuenta tenga un hilo y para que la gente sepa por qué seguirte."], "prompts": [{"t": "Definir pilares", "c": "Ayúdame a definir mis pilares de contenido.\nA qué me dedico: [EN UNA LÍNEA].\nA quién le hablo: [TU PÚBLICO].\nQué vendo o quiero vender: [TU OFERTA].\nTemas de los que sé y me gusta hablar: [LISTA].\n\nProponme 4 pilares. Para cada uno:\n- Nombre corto.\n- Por qué le importa a mi público.\n- Cómo se conecta con lo que vendo.\n- Un ejemplo de publicación.\nUno de los pilares tiene que ser personal o de detrás de escena, para que no todo sea enseñar o vender."}]}, {"h": "2. Banco de ideas", "p": ["Antes de armar el calendario, junta muchas más ideas de las que vas a usar. Elegir es más fácil que inventar."], "prompts": [{"t": "Banco de ideas", "c": "Con estos pilares: [PEGA TUS PILARES]\nÁrmame un banco de 50 ideas de contenido para Instagram.\nPara cada idea: pilar, título de trabajo, formato sugerido (reel hablado, carrusel, historia) y el ángulo (error común, paso a paso, opinión, caso, pregunta frecuente).\nMezcla ángulos dentro de cada pilar. Evita ideas que digan lo mismo con otras palabras.\nSuma también 10 ideas a partir de estas preguntas que me hacen seguido: [PEGA PREGUNTAS DE TUS CLIENTES O SEGUIDORES]."}], "pasos": ["Marca con una estrella las ideas que te dan ganas de grabar.", "Tacha las que no podrías respaldar con algo concreto.", "Quédate con unas 30."]}, {"h": "3. El calendario en una tabla", "prompts": [{"t": "Calendario de 30 días", "c": "Con estas ideas elegidas: [PEGA TUS 30 IDEAS]\nÁrmame un calendario de 30 días empezando el [FECHA DE INICIO].\nVoy a publicar [CUÁNTAS VECES POR SEMANA] y los días [QUÉ DÍAS].\nColumnas: fecha, día, pilar, formato, título, gancho, pedido final, estado.\nReglas: no repitas el mismo pilar dos publicaciones seguidas, alterna formatos y deja la columna estado en \"pendiente\".\nDevuélvelo primero como tabla y después el mismo contenido en formato CSV, separado por comas, con cada campo de texto entre comillas dobles y la fecha como AAAA-MM-DD, en un bloque de código."}]}, {"h": "4. Pásalo a Google Sheets", "pasos": ["Copia el bloque CSV y guárdalo en un archivo de texto con extensión .csv (por ejemplo calendario.csv). Si en Settings → Capabilities tienes prendida la opción Create and edit files (en el diseño anterior, Code execution and file creation), también puedes pedirle que te genere el archivo .csv directamente para descargarlo.", "Abre una planilla en Google Sheets y ve a Archivo → Importar.", "Sube el archivo, elige si quieres una hoja nueva o reemplazar la actual, y en el separador deja la detección automática o coma.", "Toca Importar. Usa la columna estado para ir marcando lo grabado y lo publicado."]}, {"h": "5. Guárdalo en un proyecto", "p": ["Crea un proyecto en Claude llamado Contenido y sube al conocimiento tus pilares, tu ficha de voz y el calendario. Así, cuando le pidas el guion del día 12, ya tiene todo el contexto."], "aviso": "Sube la versión actualizada del calendario cada tanto: Claude no ve los cambios que haces en la planilla."}], "faq": [{"q": "¿Y si un día no tengo ganas de esa idea?", "a": "Cámbiala por otra del banco del mismo pilar. El calendario es una guía, no una obligación."}, {"q": "¿Puedo pedirle que use tendencias de la semana?", "a": "Si le pasas tú lo que viste (links o capturas), sí. No le pidas que adivine qué está de moda sin darle material."}], "fuentes": ["https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.google.com/docs/answer/40608?hl=en", "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them", "https://www.rfc-editor.org/rfc/rfc4180", "https://support.google.com/docs/answer/58515"], "ejemplo": {"titulo": "Ejemplo resuelto: el mes de contenido de una panadería de masa madre", "negocio": "Ejemplo inventado: una panadería de masa madre en el barrio Cordón, Montevideo. La llevan una pareja y un ayudante. Venden en el local y por encargo, y publican en Instagram cuando se acuerdan.", "punto_de_partida": "Publican cuando sale una foto linda del horno, sin orden. Las preguntas de los clientes (si tienen pan sin sal, cómo se conserva, por qué es más caro) se repiten en el mostrador y nunca llegan a la cuenta.", "pasos": ["Con el prompt de pilares describieron el negocio, a quién le hablan (vecinos y gente que encarga para eventos) y lo que venden. Se quedaron con cuatro: \"Cómo se hace\", \"Cómo elegir y conservar el pan\", \"Encargos para eventos\" y \"Detrás del horno\" como pilar personal.", "Antes del banco de ideas anotaron durante dos días las preguntas que les hicieron en el mostrador y las pegaron en el prompt.", "Del banco de 60 ideas marcaron con estrella las que se animaban a grabar y tacharon las que no podían mostrar (por ejemplo, la receta exacta de la masa madre). Se quedaron con 30.", "Pidieron el calendario empezando el primer lunes del mes, con tres publicaciones por semana: lunes, miércoles y viernes. Usaron la versión corregida del prompt, con campos entre comillas y fecha AAAA-MM-DD.", "Copiaron el bloque CSV en el Bloc de notas, lo guardaron como calendario.csv y en Google Sheets fueron a Archivo → Importar, eligieron sumarlo como hoja nueva y separador coma.", "Revisaron que cada título estuviera en su columna. En Archivo → Configuración dejaron la configuración regional en Uruguay para que las fechas se vieran como día y mes.", "Crearon el proyecto Contenido en Claude, subieron los pilares y el calendario, y pusieron en las instrucciones que los guiones salgan del calendario.", "Cada domingo marcan en la columna estado lo que grabaron y publicaron, y suben la versión nueva del calendario al proyecto."], "resultado": "Quedó un calendario del mes en Google Sheets, con un pilar y un formato distinto en cada publicación, y un proyecto en Claude que ya tiene el contexto para pedir el guion de cualquier día. Las preguntas del mostrador ahora tienen su lugar en el plan."}, "si_falla": [{"sintoma": "Al importar, los textos aparecen partidos en columnas de más y todo queda corrido.", "solucion": "Algún título o gancho tiene comas y no estaba entre comillas. Pídele a Claude: \"Rehaz el CSV con todos los campos de texto entre comillas dobles\" y vuelve a importar con separador coma."}, {"sintoma": "Las fechas se ven con día y mes invertidos, o no se pueden ordenar.", "solucion": "En Google Sheets ve a Archivo → Configuración y, en General, elige la configuración regional de tu país; después toca Guardar configuración. Si igual quedan raras, pídele a Claude el CSV con la fecha en formato AAAA-MM-DD y vuelve a importarlo."}, {"sintoma": "En Mac guardaste el archivo con TextEdit y Google Sheets no lo reconoce.", "solucion": "TextEdit guarda texto con formato por defecto. Antes de guardar, ve a Formato → Convertir a texto normal y guárdalo con el nombre calendario.csv. Si te pregunta, elige la codificación UTF-8 para que las tildes se vean bien."}, {"sintoma": "Claude corta la tabla a la mitad o el CSV queda incompleto.", "solucion": "Es una respuesta larga. Pídele que siga desde la última fila, o pide el calendario en dos partes (días 1 a 15 y 16 a 30) y pega las dos partes en el mismo archivo, con una sola fila de encabezados."}, {"sintoma": "Cuando pides el guion de un día, Claude usa una versión vieja del calendario.", "solucion": "El proyecto tiene el archivo que subiste, no la planilla viva. Reemplaza el calendario en el conocimiento del proyecto cada vez que lo cambies, o pega la fila del día en el chat."}], "kit": [{"archivo": "calendario-de-contenido/SKILL.md", "que_es": "Skill que convierte tus pilares e ideas elegidas en un calendario de 30 días, con tabla y CSV listo para Google Sheets (comillas, fecha AAAA-MM-DD, conteo por pilar). Guárdala en una carpeta calendario-de-contenido, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: calendario-de-contenido\ndescription: 'Arma un calendario de contenido de 30 días desde pilares y un banco de ideas, como tabla y CSV para Google Sheets. Úsala al pedir un calendario, un plan del mes u ordenar ideas en fechas.'\n---\n\n# Calendario de contenido de 30 días\n\nConviertes pilares e ideas elegidas en un calendario que la persona importa en Google Sheets y usa para grabar y publicar. No publicas nada.\n\n## Qué necesitas antes de armar\n\nPide lo que falte, todo junto y en un solo mensaje:\n\n1. Los pilares (3 o 4), con su nombre corto.\n2. Las ideas elegidas, idealmente con pilar y formato.\n3. Fecha de inicio.\n4. Cuántas publicaciones por semana y qué días.\n\nSi te pasan pilares pero no ideas, ofrece armar primero un banco de ideas y espera a que elijan. No armes el calendario con ideas que la persona no eligió.\n\n## Cómo armas el calendario\n\n- Una fila por publicación, solo en los días que te dijeron. Los días sin publicación no van.\n- No repitas el mismo pilar en dos publicaciones seguidas.\n- Alterna formatos (reel hablado, carrusel, historia). Si hay pocas ideas de un formato, avisa en vez de forzarlo.\n- Si las ideas no alcanzan para todas las fechas, deja las fechas que sobran con título \"A ELEGIR DEL BANCO\" y el pilar que toca. No inventes ideas nuevas sin avisar.\n- El gancho es la primera frase que se dice o se lee. Tiene que entenderse sola. Nada de \"hola\" ni \"en este video\".\n- El pedido final es uno solo: comentar una palabra, guardar, compartir o seguir.\n- No pongas cifras, porcentajes ni resultados que no estén en lo que te pasaron. Si hace falta un dato, escribe [DATO].\n- La columna estado arranca siempre en \"pendiente\".\n\n## Qué entregas, en este orden\n\n1. La tabla, con estas columnas: fecha, dia, pilar, formato, titulo, gancho, pedido_final, estado.\n2. Un bloque de código con el mismo contenido en CSV, con estas reglas para que Google Sheets lo importe bien:\n   - La primera fila son los nombres de las columnas, igual que arriba.\n   - Separador: coma.\n   - Todos los campos de texto entre comillas dobles. Si un texto tiene comillas adentro, duplícalas (\"\").\n   - La fecha en formato AAAA-MM-DD.\n   - Sin filas vacías y sin texto antes o después del CSV dentro del bloque.\n3. Una línea con el conteo de publicaciones por pilar y por formato, para que la persona vea el equilibrio.\n\nSi la persona tiene prendida la creación de archivos, ofrece también generar el archivo calendario.csv para descargar.\n\n## Al final\n\nCierra con: \"Impórtalo en Google Sheets con Archivo → Importar, separador coma.\"\n"}, {"archivo": "plantilla-calendario-30-dias.csv", "que_es": "La planilla vacía con las columnas del calendario y tres filas de ejemplo. Impórtala en Google Sheets con Archivo → Importar si quieres armar el mes a mano o ver el formato que tiene que devolver Claude.", "contenido": "\"fecha\",\"dia\",\"pilar\",\"formato\",\"titulo\",\"gancho\",\"pedido_final\",\"estado\"\n\"AAAA-MM-DD\",\"lunes\",\"[PILAR 1]\",\"reel hablado\",\"[TÍTULO DE TRABAJO]\",\"[PRIMERA FRASE]\",\"[UN SOLO PEDIDO]\",\"pendiente\"\n\"AAAA-MM-DD\",\"miércoles\",\"[PILAR 2]\",\"carrusel\",\"[TÍTULO DE TRABAJO]\",\"[TÍTULO DE LA PORTADA]\",\"[UN SOLO PEDIDO]\",\"pendiente\"\n\"AAAA-MM-DD\",\"viernes\",\"[PILAR 3]\",\"historia\",\"[TÍTULO DE TRABAJO]\",\"[PRIMERA FRASE O PREGUNTA]\",\"[UN SOLO PEDIDO]\",\"pendiente\"\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

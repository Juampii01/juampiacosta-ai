<script>var GUIA = {"slug": "como-elegir-y-revisar-un-mcp-antes-de-instalarlo", "t": "Cómo elegir y revisar un MCP antes de instalarlo", "d": "Una revisión corta para saber quién publica un MCP, qué puede hacer con tus cuentas y cómo probarlo sin riesgo antes de usarlo en serio.", "tema": "Conectores y MCP", "min": 7, "ficha": [["Qué es", "Una lista de control para revisar un servidor MCP o un plugin antes de conectarlo a Claude."], ["Necesitás", "Claude Code o la app de Claude, y 10 minutos antes de cada instalación."], ["Qué no hace", "No reemplaza la revisión de seguridad de tu empresa ni garantiza que un MCP sea seguro."]], "fichaNombre": "Revisión de MCP", "secciones": [{"h": "Por qué conviene revisar antes", "p": ["Un MCP le da a Claude las llaves de otra app: tu CRM, tus pagos, tu base de datos. Lo que el MCP pueda hacer, Claude lo va a poder hacer en tu nombre.", "Anthropic lo dice claro en su doc: confirmá que confiás en cada servidor antes de conectarlo, porque los que traen contenido de afuera te pueden exponer a inyección de instrucciones (texto escondido que intenta darle órdenes a Claude). Y en el directorio de plugins avisa que no controla los MCP que trae cada plugin."], "aviso": "Conectar un MCP a una cuenta con datos reales sin revisarlo es como correr un script en producción sin backup."}, {"h": "Quién lo publica: oficial o comunidad", "lista": ["Oficial de la empresa: la URL o el comando aparece en la documentación de la propia marca (por ejemplo docs.stripe.com o linear.app/docs). Es la opción más segura.", "Directorio oficial de Anthropic: el marketplace claude-plugins-official separa los plugins hechos por Anthropic de los de terceros. Que esté ahí no significa que Anthropic controle lo que hace por dentro.", "Comunidad: repos públicos de personas o equipos. Pueden ser muy buenos, pero leé el README, mirá quién lo mantiene y si tiene actividad reciente.", "Copias raras: si encontrás un instalador de un tercero que dice ser el oficial, desconfiá. Vercel, por ejemplo, recomienda confirmar siempre que la URL sea la oficial."]}, {"h": "Qué permisos pide", "pasos": ["Leé qué herramientas trae: solo lectura (buscar, listar) o también escritura (crear, editar, borrar).", "Fijate cómo se conecta: con OAuth (te abre una ventana para iniciar sesión y autorizar) o con una clave que pegás vos. OAuth te deja revocar el acceso después.", "Si usa una clave, creá una con los permisos mínimos. Stripe, por ejemplo, pide claves de agente (agent API keys) con solo los permisos necesarios, y avisa que desde diciembre de 2026 su MCP deja de aceptar claves secretas de acceso total y claves restringidas sin la etiqueta Agent.", "Buscá si tiene modo solo lectura o forma de limitarlo a un proyecto. Supabase lo recomienda para no tocar datos de otros proyectos.", "Mirá dónde queda guardado: en Claude Code el alcance local es solo para vos en ese proyecto, el de proyecto se comparte con tu equipo en .mcp.json y el de usuario vale para todos tus proyectos."]}, {"h": "Cómo probarlo sin riesgo", "pasos": ["Conectalo primero a una cuenta de prueba o a un entorno de desarrollo, nunca directo a producción.", "Corré claude mcp list para ver si quedó conectado o si necesita autenticación.", "Empezá con pedidos de solo lectura: listar, buscar, resumir.", "Dejá activada la aprobación de cada herramienta, así ves qué va a hacer Claude antes de que lo haga.", "Si algo no te cierra, sacalo con claude mcp remove y el nombre del servidor."], "prompts": [{"t": "Pedile a Claude que te explique un MCP antes de usarlo", "c": "Acabo de conectar el MCP [NOMBRE]. Antes de usarlo, listame todas las herramientas que trae y separalas en dos grupos: las que solo leen y las que pueden crear, cambiar o borrar algo. No ejecutes ninguna todavía."}]}, {"h": "Señales de alerta", "lista": ["Pide más permisos de los que necesita: un MCP para leer el calendario no debería poder mandar mails.", "No tiene documentación clara ni dice quién lo mantiene.", "Te pide pegar una clave con acceso total cuando la app ofrece OAuth o claves limitadas.", "Lo combinás con otros MCP que leen contenido de afuera (webs, mails) y además tiene permisos de escritura: ahí el riesgo de inyección es mayor."]}], "faq": [{"q": "¿Un plugin del marketplace oficial ya está revisado por Anthropic?", "a": "El README del directorio pide que confíes en un plugin antes de instalarlo y aclara que Anthropic no controla qué servidores MCP o archivos incluye cada uno. Revisalo igual."}, {"q": "¿Cómo saco un MCP que ya no uso?", "a": "En Claude Code corrés claude mcp remove y el nombre del servidor. Si se conectó con OAuth, antes usá Clear authentication en el menú de /mcp para revocar el acceso, y revisá también la configuración de la otra app (en Stripe, por ejemplo, la lista OAuth sessions con la opción Revoke access)."}, {"q": "¿Qué pasa con los MCP que vienen en un proyecto compartido?", "a": "Claude Code te pide aprobación antes de usar servidores definidos en el archivo .mcp.json de un proyecto. Leé cuáles son antes de aceptar."}], "fuentes": ["https://code.claude.com/docs/en/mcp", "https://code.claude.com/docs/en/discover-plugins", "https://github.com/anthropics/claude-plugins-official/blob/main/README.md", "https://docs.stripe.com/mcp", "https://supabase.com/docs/guides/mcp", "https://vercel.com/docs/ai-tooling/vercel-mcp", "https://developers.notion.com/guides/mcp/get-started-with-mcp.md", "https://knowledge.hubspot.com/integrations/set-up-and-use-the-hubspot-connector-for-claude", "https://supabase.com/docs/guides/ai-tools/mcp", "https://vercel.com/docs/agent-resources/vercel-mcp", "https://code.claude.com/docs/en/permissions", "https://code.claude.com/docs/en/plugins/security.md", "https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp"], "ejemplo": {"titulo": "Ejemplo resuelto: revisar dos MCP antes de conectarlos a la base de una app de turnos", "negocio": "Ejemplo inventado: una app de turnos para peluquerías hecha por dos desarrolladores en Providencia, Santiago de Chile. La base de datos está en Supabase y usan Claude Code.", "punto_de_partida": "Quieren que Claude consulte la base para investigar errores de turnos duplicados. Encontraron el MCP oficial de Supabase y, en un foro, un MCP de la comunidad que promete \"Supabase con superpoderes\".", "pasos": ["Completaron la checklist del kit para cada uno. El oficial aparecía en la documentación de Supabase; el de la comunidad no tenía claro quién lo mantenía y pedía la clave de servicio con acceso total.", "Le pasaron a Claude los dos README con la skill revisar-mcp del kit. El informe del de la comunidad marcó dos alertas (clave de acceso total y mantenedor desconocido) y el veredicto fue \"No instalar todavía\". Lo descartaron.", "Para el oficial siguieron las recomendaciones de Supabase: lo limitaron al proyecto de desarrollo y en modo solo lectura, nunca al de producción.", "Lo agregaron en Claude Code con alcance local (el que viene por defecto), así quedaba solo para quien lo estaba probando.", "Copiaron el archivo de permisos del kit a .claude/settings.local.json, cambiaron crm_prueba por el nombre que le dieron al servidor y pusieron en deny las herramientas que escriben, según la lista que les armó Claude.", "Corrieron claude mcp list, después /mcp para iniciar sesión, y le pidieron a Claude el prompt de la guía para listar las herramientas en \"leen\" y \"escriben\" sin ejecutar ninguna.", "Empezaron con pedidos de solo lectura: \"listá las tablas\", \"mostrame los turnos de ayer que tengan el mismo horario y el mismo profesional\". Cada llamada pidió aprobación y la revisaron.", "Recién cuando el equipo entero lo iba a usar, lo pasaron a .mcp.json con alcance de proyecto. Claude Code le pidió aprobación a cada uno al abrir el proyecto."], "resultado": "Quedó instalado solo el MCP oficial, limitado al proyecto de desarrollo y en solo lectura, con las herramientas de escritura bloqueadas en los permisos. El de la comunidad quedó descartado con el motivo anotado en la checklist."}, "si_falla": [{"sintoma": "Al abrir un proyecto, Claude Code te pide aprobar servidores MCP que no agregaste vos.", "solucion": "Vienen del archivo .mcp.json del proyecto. Abrilo y revisá cada servidor con la checklist antes de aceptar. Si aprobaste algo por error, corré claude mcp reset-project-choices para que te vuelva a preguntar."}, {"sintoma": "Claude Code muestra un aviso de que la respuesta de una herramienta MCP es muy larga, o la respuesta llega cortada.", "solucion": "Claude Code avisa cuando la salida de una herramienta MCP pasa los 10.000 tokens y la corta en 25.000 por defecto. Pedí algo más acotado (menos filas, un rango de fechas) o subí el límite con la variable MAX_MCP_OUTPUT_TOKENS, por ejemplo MAX_MCP_OUTPUT_TOKENS=50000."}, {"sintoma": "Un conector que agregaste en claude.ai no aparece en /mcp dentro de Claude Code.", "solucion": "Los conectores de claude.ai solo llegan a Claude Code si entraste con tu suscripción de claude.ai. Corré /status para ver con qué método estás autenticado; si hay una API key activa (por ejemplo, ANTHROPIC_API_KEY), sacala y corré /login con tu cuenta de claude.ai."}, {"sintoma": "El MCP aparece en /mcp como hidden.", "solucion": "Agregaste el mismo servidor en Claude Code y como conector en claude.ai, con la misma URL. Gana el de Claude Code y el otro queda oculto. Dejá uno solo para no confundirte con los permisos: /mcp te muestra cómo sacar el duplicado."}, {"sintoma": "Un conector personalizado en la app de Claude no conecta con un servidor de tu empresa.", "solucion": "Los conectores personalizados se conectan desde la nube de Anthropic. Si el servidor está en una red privada, detrás de una VPN o de un firewall, quien lo administra tiene que permitir las direcciones IP de Anthropic. No lo expongas a internet sin autenticación para resolverlo."}], "kit": [{"archivo": "revisar-mcp/SKILL.md", "que_es": "Skill que revisa el README o la lista de herramientas de un MCP y devuelve un informe con veredicto, señales de alerta y un plan de prueba. Guardala en una carpeta revisar-mcp y subila como ZIP en Customize → Skills, o copiala a ~/.claude/skills/ en Claude Code.", "contenido": "---\nname: revisar-mcp\ndescription: Revisa un servidor MCP o plugin antes de instalarlo: quién lo publica, qué herramientas trae, cómo se autentica y qué riesgos tiene. Usala cuando pregunten si un MCP es seguro.\n---\n\n# Revisar un MCP antes de instalarlo\n\nHacés una revisión previa de un servidor MCP (o de un plugin que trae uno) y devolvés un informe corto para decidir si se instala, cómo y con qué límites. No instalás nada ni ejecutás herramientas del MCP durante la revisión.\n\n## Qué te pueden pasar\n\n- El link al repo o a la documentación del MCP.\n- El README pegado.\n- La lista de herramientas, si ya está conectado (en ese caso, solo leé la lista: no ejecutes ninguna).\n- Para qué lo quiere usar la persona y con qué cuenta (prueba o real).\n\nSi falta para qué lo quiere usar, preguntalo: el riesgo depende del uso.\n\n## Qué revisás\n\n1. **Quién lo publica.** ¿La URL o el comando aparecen en la documentación oficial de la marca? ¿Es de un directorio oficial? ¿Es de la comunidad? Si es de la comunidad: quién lo mantiene y si tiene actividad reciente, según lo que te pasaron. Si no lo podés saber con lo que tenés, decilo.\n2. **Cómo se conecta.** Remoto (una URL) o local (un comando que corre en la computadora, por ejemplo con npx). Un MCP local corre con los permisos de la persona en su máquina.\n3. **Cómo se autentica.** OAuth (se puede revocar desde la otra app), clave con permisos limitados, clave con acceso total o sin autenticación.\n4. **Herramientas.** Separalas en tres grupos: solo leen; crean o editan; borran, envían, pagan o publican.\n5. **Contenido de afuera.** ¿Alguna herramienta trae texto de webs, mails, tickets o documentos de terceros? Eso abre la puerta a la inyección de instrucciones.\n6. **Límites disponibles.** ¿Tiene modo solo lectura, forma de limitarlo a un proyecto o cuenta, entorno de prueba?\n7. **Alcance en Claude Code.** Recomendá local (solo la persona, en ese proyecto) para probar; proyecto (.mcp.json) solo si todo el equipo lo necesita; usuario solo si lo va a usar en todos sus proyectos.\n\n## Señales de alerta (marcalas siempre)\n\n- Pide más permisos de los que necesita el uso que te contaron.\n- Pide una clave de acceso total cuando la app ofrece OAuth o claves limitadas.\n- No dice quién lo mantiene o no tiene documentación.\n- Dice ser oficial pero la URL o el paquete no coinciden con los de la documentación de la marca.\n- Combina herramientas que leen contenido de afuera con herramientas que escriben, envían o borran.\n\n## Formato del informe\n\n**MCP:** [NOMBRE]\n**Veredicto:** Instalar / Instalar con límites / No instalar todavía\n**Por qué:** [DOS O TRES LÍNEAS]\n\n| Punto | Qué encontré |\n|-------|--------------|\n| Quién lo publica | |\n| Conexión | remoto / local |\n| Autenticación | |\n| Herramientas que leen | |\n| Herramientas que escriben | |\n| Herramientas que borran, envían o pagan | |\n| Trae contenido de afuera | sí / no |\n| Límites disponibles | |\n\n**Señales de alerta:** [LISTA, O \"ninguna con lo que revisé\"]\n\n**Cómo probarlo:**\n1. Cuenta o entorno de prueba: [CUÁL]\n2. Comando o pasos de instalación, con alcance local.\n3. Tres pedidos de solo lectura para empezar.\n4. Qué herramientas conviene bloquear o dejar con aprobación.\n\n**Lo que no pude verificar:** [LISTA]\n\n## Reglas\n\n- No afirmes que un MCP es seguro. Decí qué revisaste y qué no.\n- Si lo que te pasaron no alcanza para un punto, escribí \"no lo pude verificar\" en ese punto.\n- No pidas ni aceptes claves en el chat.\n"}, {"archivo": "checklist-revision-mcp.md", "que_es": "Checklist para completar antes de conectar un MCP a una cuenta real: origen, acceso, herramientas, alcance, prueba y cómo sacarlo.", "contenido": "# Checklist de revisión de un MCP\n\nImprimila o copiala en tus notas. Completala antes de conectar un MCP a una cuenta con datos reales.\n\nMCP: ____________________   Fecha: ____________   Quién revisa: ____________\nPara qué lo quiero: __________________________________________________\n\n## 1. Origen\n[ ] Encontré la URL o el comando en la documentación oficial de la marca. Link: ______________\n[ ] Si es de la comunidad: sé quién lo mantiene y tiene actividad reciente.\n[ ] La URL o el nombre del paquete coinciden exactamente con los de la doc (sin letras cambiadas ni dominios parecidos).\n\n## 2. Conexión y acceso\nTipo:  [ ] Remoto (URL)   [ ] Local (comando en mi computadora)\nAutenticación:  [ ] OAuth   [ ] Clave con permisos limitados   [ ] Clave con acceso total   [ ] Ninguna\n[ ] Si usa clave: la creé con los permisos mínimos y no la pegué en ningún chat.\n[ ] Si tiene modo solo lectura o límite por proyecto o cuenta: lo activé.\n\n## 3. Herramientas\nSolo leen: ______________________________________________\nCrean o editan: _________________________________________\nBorran, envían, pagan o publican: _______________________\n[ ] Ninguna herramienta trae contenido de afuera (webs, mails, tickets), o si trae, no la combino con herramientas que escriben sin aprobación.\n\n## 4. Dónde queda instalado (Claude Code)\n[ ] Local (solo yo, este proyecto) para la prueba.\n[ ] Proyecto (.mcp.json): solo si todo el equipo lo necesita y ya lo probé.\n[ ] Usuario: solo si lo uso en todos mis proyectos.\n\n## 5. Prueba\n[ ] Lo conecté a una cuenta o entorno de prueba.\n[ ] claude mcp list lo muestra conectado.\n[ ] Le pedí a Claude que liste las herramientas separadas en \"leen\" y \"escriben\", sin ejecutar ninguna.\n[ ] Hice tres pedidos de solo lectura y los resultados tienen sentido.\n[ ] Las herramientas que escriben siguen pidiendo aprobación (no toqué \"no volver a preguntar\").\n\n## 6. Salida\n[ ] Sé cómo sacarlo: claude mcp remove [nombre] (o Customize → Connectors en la app).\n[ ] Sé dónde revocar el acceso en la otra app si usé OAuth.\n\n## Decisión\n[ ] Lo instalo en la cuenta real con estos límites: ______________________\n[ ] Lo dejo en prueba hasta: ______________________\n[ ] No lo instalo porque: ______________________\n"}, {"archivo": "settings-local-probar-mcp.json", "que_es": "Permisos de Claude Code para probar un MCP nuevo: todas sus herramientas piden aprobación y las que borran o envían quedan bloqueadas. Guardalo como .claude/settings.local.json en tu proyecto, cambiá crm_prueba por el nombre de tu servidor y los REEMPLAZAR por los nombres reales de las herramientas.", "contenido": "{\n  \"permissions\": {\n    \"ask\": [\n      \"mcp__crm_prueba__*\"\n    ],\n    \"deny\": [\n      \"mcp__crm_prueba__REEMPLAZAR_POR_LA_HERRAMIENTA_QUE_BORRA\",\n      \"mcp__crm_prueba__REEMPLAZAR_POR_LA_HERRAMIENTA_QUE_ENVIA\"\n    ]\n  }\n}\n"}], "verificada": "2026-11-08", "cat": "conectores", "parte": "usalo"};</script>

<script>var GUIA = {"slug": "cobrar-dentro-de-tu-app", "t": "Cobrar dentro de tu app: Stripe y Mercado Pago", "d": "Las formas de cobrar (link, checkout y suscripciones), qué es un webhook sin tecnicismos, cómo probar sin dinero real y qué pedirle a Claude Code.", "tema": "Crea tu app", "min": 12, "fichaNombre": "Cobros en tu app", "ficha": [["Qué es", "Conectar tu app con Stripe o Mercado Pago para que la gente pague y la app se entere sola."], ["Necesitas", "Una cuenta en Stripe o Mercado Pago y tu app con un servidor (Vercel o Netlify sirven)."], ["Regla de oro", "Todo en modo prueba primero. Recién cuando funciona, pasas a cobrar de verdad."], ["Qué no hace", "Esta guía no cubre impuestos ni facturación: consúltalo con tu contador."]], "secciones": [{"h": "Tres formas de cobrar", "lista": ["Link de pago (Stripe Payment Links): lo creas desde el panel de Stripe sin programar y lo compartes por mail, mensaje o redes. Sirve para vender un producto, una suscripción o recibir donaciones.", "Checkout: tu app manda al cliente a una página de pago de Stripe o de Mercado Pago (Checkout Pro) y después lo devuelve. En Checkout Pro, el comprador paga en un ambiente de Mercado Pago, con opciones como tarjeta, cuenta de Mercado Pago, Rapipago o Pago Fácil.", "Suscripciones: cobros que se repiten. En Stripe puedes crear un link de pago de suscripción. En Mercado Pago existen las suscripciones con plan asociado (por ejemplo, un plan mensual y uno anual) y sin plan asociado."], "p": ["Si recién empiezas, un link de pago es lo más rápido: no necesitas que tu app sepa nada de pagos. Cuando quieres que la app dé acceso automático después de pagar, pasas a checkout con webhooks."]}, {"h": "Webhooks, explicado simple", "p": ["Un webhook es un aviso que Stripe o Mercado Pago le mandan a tu app cuando pasa algo: un pago aprobado, una suscripción renovada, un contracargo. Es como el portero que te toca el timbre para avisarte que llegó un paquete.", "¿Por qué hace falta? Porque la pantalla de \"gracias por tu compra\" no prueba nada: el cliente puede cerrarla, o alguien puede escribir esa dirección a mano. Lo que confirma el pago es el aviso que llega del procesador.", "Dos cosas no negociables: tu app tiene que verificar que el aviso viene de verdad de Stripe (firma en el encabezado Stripe-Signature) o de Mercado Pago (firma x-signature con tu clave secreta), y tiene que responder rápido que lo recibió (un código 200). Si no responde, ambos reintentan el envío."], "aviso": "Sin verificar la firma, cualquiera podría mandarle a tu app un aviso falso de \"pago aprobado\" y llevarse el producto gratis."}, {"h": "Modo prueba antes que nada", "lista": ["Stripe: trabaja en un sandbox, un entorno de prueba donde las operaciones no mueven dinero. Usa las claves de prueba y la tarjeta 4242 4242 4242 4242 con cualquier fecha futura (como 12/34) y cualquier código de 3 dígitos. Stripe prohíbe probar en modo real con tarjetas reales.", "Mercado Pago: usas cuentas de prueba, como mínimo una vendedora y una compradora, del mismo país. En Checkout Pro, la cuenta vendedora de prueba se crea sola al crear la aplicación y sus credenciales son tus credenciales de prueba.", "Webhooks en tu computadora: con la CLI de Stripe puedes recibir los avisos en tu máquina con stripe listen --forward-to y la dirección local de tu app, sin publicar nada."]}, {"h": "Qué pedirle a Claude", "prompts": [{"t": "Cobrar con Stripe Checkout", "c": "Quiero cobrar en esta app con Stripe Checkout, en modo prueba (sandbox).\nQué vendo: [PRODUCTO O PLAN].\nTipo de cobro: [PAGO ÚNICO o SUSCRIPCIÓN].\nQué pasa después de pagar: [EJ.: SE ACTIVA EL ACCESO A LA SECCIÓN PREMIUM].\nReglas:\n1. Las claves van en variables de entorno, nunca en el código ni en el chat.\n2. El acceso se da solo cuando llega el webhook verificado con la firma Stripe-Signature, no por la página de éxito.\n3. Guarda qué avisos ya procesaste para no dar acceso dos veces si llega repetido.\n4. Explícame cómo lo pruebo en mi computadora con la CLI de Stripe.\nMuéstrame el plan antes de escribir código."}, {"t": "Cobrar con Mercado Pago Checkout Pro", "c": "Quiero cobrar en esta app con Mercado Pago Checkout Pro, usando cuentas y credenciales de prueba.\nQué vendo: [PRODUCTO], precio: [PRECIO EN TU MONEDA].\nQué pasa después de pagar: [QUÉ SE ACTIVA].\nReglas:\n1. Credenciales en variables de entorno del servidor, nunca en el código ni en el chat.\n2. Recibe las notificaciones Webhooks, valida la firma x-signature con la clave secreta y responde 200.\n3. Confirma el estado del pago antes de dar acceso; no confíes en la página de regreso.\n4. Dime qué tengo que configurar yo en Tus integraciones.\nMuéstrame el plan antes de escribir código."}]}, {"h": "Antes de cobrar de verdad", "pasos": ["Hiciste al menos un pago de prueba completo y la app dio el acceso sola.", "Probaste un pago rechazado y la app no dio acceso.", "Tu app ignora un aviso repetido (no da el acceso dos veces).", "Las claves de producción están cargadas en las variables de entorno de tu hosting, no en el código.", "Configuraste la dirección del webhook de producción (en HTTPS) en el panel de Stripe o en Tus integraciones de Mercado Pago."], "aviso": "Las claves secretas de Stripe son como tu usuario y contraseña: Stripe recomienda no compartirlas por mail ni por chat, y Stripe nunca te las va a pedir. Si se filtran, rótalas."}], "faq": [{"q": "¿Qué conviene en Argentina, Stripe o Mercado Pago?", "a": "Depende de dónde estén tus clientes y de qué cuenta puedes abrir. Puedes tener los dos; pídele a Claude que los integre por separado y prueba cada uno en modo prueba."}, {"q": "El pago salió bien pero mi app no se enteró", "a": "Casi siempre es el webhook: la dirección está mal, la app tardó en responder o la verificación de firma falla. En Stripe, mira las entregas del webhook en Workbench; el error de firma suele ser por usar el secreto equivocado."}, {"q": "¿Puedo empezar sin webhooks?", "a": "Sí, con un link de pago y dando el acceso a mano. Cuando el volumen crece, automatízalo con checkout y webhooks."}], "fuentes": ["https://docs.stripe.com/payments/no-code", "https://docs.stripe.com/get-started/use-cases/startup", "https://docs.stripe.com/testing", "https://docs.stripe.com/webhooks", "https://docs.stripe.com/keys-best-practices", "https://www.mercadopago.com.ar/developers/es/docs/checkout-pro-preferences/overview", "https://www.mercadopago.com.mx/developers/es/docs/checkout-pro/test-accounts", "https://www.mercadopago.com.br/developers/es/docs/checkout-pro/payment-notifications", "https://www.mercadopago.com.mx/developers/es/docs/subscriptions/integration-configuration/subscription-associated-plan", "https://docs.stripe.com/events/manage-webhook-endpoints", "https://www.mercadopago.com.ar/developers/es/docs/checkout-pro/test-accounts", "https://www.mercadopago.com.ar/developers/es/docs/checkout-pro-orders/payment-notifications", "https://www.mercadopago.com.ar/developers/es/docs/subscriptions/integration-configuration/subscription-associated-plan"], "ejemplo": {"titulo": "Ejemplo resuelto: un taller de cerámica que cobra sus packs de clases", "negocio": "Ejemplo inventado: un taller de cerámica en barrio Güemes, Córdoba capital, con la dueña y una ayudante. Venden packs mensuales de clases y hoy los cobran por transferencia, confirmando cada pago a mano por WhatsApp.", "punto_de_partida": "La app del taller ya tiene login y una sección Mis clases. Falta que la alumna pueda pagar el pack y que la sección se habilite sola, sin que la dueña revise cada transferencia.", "pasos": ["Arrancó sin webhooks, como sugiere la guía: mandaba por WhatsApp un link de pago generado desde su cuenta de Mercado Pago y habilitaba el acceso a mano. Así confirmó que las alumnas pagaban sin problemas antes de programar nada.", "Cuando quiso automatizarlo, creó una aplicación en Tus integraciones de Mercado Pago. La cuenta vendedora de prueba se creó sola y sus credenciales pasaron a ser las de prueba. Creó además una compradora de prueba del mismo país.", "Instaló la skill cobros-con-webhook-seguro del kit en el proyecto y le pasó a Claude el prompt Cobrar con Mercado Pago Checkout Pro, con el pack y su precio.", "Claude le preguntó si iba con la API de Preferences o la de Orders, mostró el plan con los archivos, las variables de entorno y una tabla pagos con el estado de cada uno y los avisos ya procesados. Lo aprobó.", "Cargó ella misma el Access Token de prueba y la clave secreta de Webhooks en .env.local y en las variables de Preview de su hosting.", "Publicó una vista previa con dirección HTTPS y la cargó en la configuración de Webhooks de su aplicación, con el interruptor en Prueba. Usó Simular notificación para ver que su endpoint respondía 200.", "Hizo la compra completa con la compradora de prueba. La sección Mis clases se habilitó sola. Probó un pago rechazado y reenvió el mismo aviso desde el panel: no se habilitó nada de más.", "Recorrió la checklist del kit. Recién con todo en verde cargó las credenciales de producción en las variables de Production, configuró el webhook en Producción y volvió a publicar.", "Hizo una compra real chica con su tarjeta, vio el aviso entregado en la pestaña Webhooks de su aplicación y la reembolsó."], "resultado": "Quedó un cobro con Checkout Pro donde la alumna paga en el ambiente de Mercado Pago y la app habilita el pack sola cuando llega el aviso verificado. La página de regreso ya no da acceso por sí sola, y un aviso repetido no habilita nada dos veces."}, "si_falla": [{"sintoma": "Stripe: el webhook falla con No signatures found matching the expected signature for payload.", "solucion": "Casi siempre es el secreto equivocado: el whsec_ que imprime stripe listen es distinto al del endpoint del panel (en Workbench, Reveal secret). Si el secreto está bien, el framework está modificando el cuerpo: verifica con el cuerpo crudo (en Next.js App Router, await request.text())."}, {"sintoma": "Stripe: en Workbench las entregas aparecen como Timed out o con error 3xx.", "solucion": "Timed out: responde 2xx apenas verificas la firma y haz el resto después. 3xx: Stripe toma las redirecciones como falla; carga como destino la dirección final (por ejemplo, con o sin www según cómo responde tu dominio)."}, {"sintoma": "Mercado Pago: el pago se aprueba pero a tu app no llega ningún aviso.", "solucion": "En Tus integraciones, entra a tu aplicación y revisa la configuración de Webhooks: que el interruptor esté en el ambiente correcto (Prueba o Producción), que la URL sea HTTPS pública y que el evento esté marcado. Prueba con Simular notificación y mira la respuesta de tu servidor."}, {"sintoma": "Mercado Pago: al entrar con una cuenta de prueba te pide un código de verificación por mail.", "solucion": "No llega a ningún mail real. Busca el código de 6 dígitos en Tus integraciones, tu aplicación, Cuentas de prueba. Recuerda que la compradora y la vendedora tienen que ser del mismo país."}, {"sintoma": "Una alumna o cliente recibió el acceso dos veces o se le sumaron dos packs.", "solucion": "Los procesadores pueden mandar el mismo aviso más de una vez. Guarda el id de cada aviso procesado y, si llega uno repetido, responde 200 sin hacer nada. Pídele a Claude que agregue esa tabla si no la tiene."}], "kit": [{"archivo": "cobros-con-webhook-seguro/SKILL.md", "que_es": "Skill para Claude Code con las reglas para integrar Stripe Checkout o Mercado Pago Checkout Pro en modo prueba: firma verificada, respuesta rápida y avisos repetidos. Guárdala en .claude/skills/cobros-con-webhook-seguro/ o súbela como ZIP a Claude.", "contenido": "---\nname: cobros-con-webhook-seguro\ndescription: 'Integra Stripe Checkout o Mercado Pago Checkout Pro en modo prueba, dando acceso solo con webhook de firma verificada y sin duplicar avisos. Úsala al cobrar en la app o si un pago no se registró.'\n---\n\n# Cobros con webhook seguro\n\nIntegras pagos en modo prueba. No pasas a producción ni tocas claves reales sin que el usuario lo pida.\n\n## Antes de escribir código\n\n1. Pregunta qué se vende, si es pago único o suscripción, en qué moneda, y qué se activa después de pagar.\n2. Confirma con qué procesador: Stripe o Mercado Pago. Si es Mercado Pago, confirma si la app usa Checkout Pro con la API de Preferences o con la API de Orders: son dos integraciones distintas en la doc y los avisos llegan con temas distintos.\n3. Muestra el plan: archivos que vas a crear, variables de entorno que hacen falta y la tabla donde se guarda el estado del pago.\n\n## Reglas que no se negocian\n\n- Claves y secretos solo en variables de entorno del servidor. Nunca en el código, nunca con prefijo NEXT_PUBLIC_, nunca en el chat.\n- El acceso se da solo desde el webhook, nunca desde la página de éxito o de regreso.\n- Verifica la firma de cada aviso:\n  - Stripe: con el encabezado Stripe-Signature, el cuerpo crudo de la petición tal como llegó y el secreto del endpoint (empieza con whsec_). En Next.js con App Router, lee el cuerpo con await request.text() antes de verificar; no lo conviertas a JSON primero.\n  - Mercado Pago: con el encabezado x-signature (trae ts y v1), el x-request-id, el data.id y la clave secreta que muestra el panel de Webhooks. Usa el validador del SDK oficial si existe para tu lenguaje.\n- Responde 2xx enseguida (Mercado Pago espera 200 o 201) y deja el trabajo pesado para después. Si tardas, el procesador reintenta.\n- Guarda el id de cada aviso procesado y saltea los repetidos devolviendo 200.\n- Antes de dar acceso con Mercado Pago, consulta el pago u orden por API y confirma el estado aprobado. No confíes solo en el contenido del aviso.\n- Escucha solo los eventos que la app usa.\n\n## Cómo se prueba\n\n- Stripe: sandbox, claves de prueba, tarjeta 4242 4242 4242 4242 con fecha futura y cualquier CVC; para rechazo, 4000 0000 0000 0002. En local, stripe listen --forward-to localhost:PUERTO/RUTA y usa el whsec_ que imprime la CLI, que es distinto al del panel.\n- Mercado Pago: cuentas de prueba vendedora y compradora del mismo país, credenciales de prueba, y el botón Simular notificación del panel de Webhooks.\n\n## Qué entregas\n\n- El código de la integración y del endpoint de webhook.\n- La lista de variables de entorno con su nombre, sin valores.\n- Los pasos de prueba: pago aprobado, pago rechazado y aviso repetido.\n- Lo que el usuario tiene que configurar a mano en el panel del procesador.\n"}, {"archivo": "checklist-de-prueba-a-cobro-real.md", "que_es": "Tabla de pruebas que tienen que pasar en modo prueba y checklist para el cambio a producción y el primer día de cobros reales.", "contenido": "# Checklist: de modo prueba a cobrar de verdad\n\n## 1. Pruebas que tienen que pasar (en modo prueba)\n\n| Prueba | Cómo | Qué tiene que pasar |\n|---|---|---|\n| Pago aprobado | Stripe: 4242 4242 4242 4242. Mercado Pago: comprador de prueba. | Llega el webhook, la firma valida y se activa el acceso solo. |\n| Pago rechazado | Stripe: 4000 0000 0000 0002. Mercado Pago: una tarjeta de prueba de rechazo. | No se activa nada y la app lo muestra claro. |\n| Aviso repetido | Reenvía el mismo evento (Stripe: desde Workbench o la CLI. Mercado Pago: Reenviar notificaciones). | La app responde 200 y no da el acceso dos veces. |\n| Firma inválida | Manda a tu endpoint un aviso inventado sin firma. | La app lo rechaza y no activa nada. |\n| Cierre de pestaña | Paga y cierra el navegador antes de volver a la app. | El acceso se activa igual, porque depende del webhook. |\n| Página de éxito a mano | Escribe la dirección de éxito sin haber pagado. | No se activa nada. |\n\n## 2. Antes del cambio\n\n- [ ] Las claves de producción están en las variables de entorno del hosting (Production), no en el código.\n- [ ] El endpoint del webhook de producción es una dirección HTTPS pública.\n- [ ] Stripe: creaste el endpoint de producción y copiaste su secreto whsec_ (es distinto al de prueba y al de la CLI).\n- [ ] Mercado Pago: en Tus integraciones, tu aplicación, Webhooks, elegiste Producción, cargaste la URL, marcaste los eventos y guardaste. Copiaste la clave secreta que se genera.\n- [ ] Volviste a publicar la app después de cargar las variables.\n- [ ] Nadie tiene las claves secretas por mail o por chat.\n\n## 3. El primer día de cobros reales\n\n- [ ] Hiciste una compra real chica con tu propia tarjeta y la reembolsaste desde el panel.\n- [ ] Miraste las entregas del webhook (Stripe: Workbench, Webhooks, Event deliveries. Mercado Pago: tu aplicación, pestaña Webhooks) y todas dicen entregado.\n- [ ] Sabes a quién llamar o qué revisar si un cliente dice \"pagué y no tengo acceso\".\n\nImpuestos y facturación: consúltalo con tu contador. Esta checklist no los cubre.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

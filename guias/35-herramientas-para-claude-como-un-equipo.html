<script>var GUIA = {"slug": "35-herramientas-para-claude-como-un-equipo", "post": "EQUIPO", "t": "35 cosas para instalar en Claude, ordenadas como un equipo", "d": "Claude es el jefe y cada herramienta tiene un trabajo: construir, diseño y video, investigar y vender, contenido y oficina. Con el comando y el link oficial de cada una.", "tema": "Skills y plugins", "min": 14, "ficha": [["Qué es", "35 plugins, skills y conectores para Claude, en 5 áreas, con su comando y su link oficial."], ["Para quién", "Quien usa Claude todos los días y quiere sumarle herramientas sin instalar cualquier cosa."], ["Necesitas", "Claude Code para casi todas. Algunas piden Node.js, Python, una cuenta o una clave del servicio."], ["Ojo", "Son proyectos de terceros. Instala solo lo que vayas a usar."], ["Por dónde empezar", "Una por área: superpowers, ui-ux-pro-max, last30days, la Máquina de Contenido y Google Workspace."]], "secciones": [{"h": "Antes de instalar", "p": ["No instales las 35. Elige el área que más te sirve hoy, instala una o dos, úsalas en una tarea real y recién después suma otra.", "Los comandos que empiezan con /plugin van dentro de una sesión de Claude Code. Los que empiezan con claude, npx, npm, uv o git van en la terminal, fuera de la sesión."], "prompts": [{"t": "Que Claude la instale por ti", "c": "Instala esta herramienta desde [LINK DEL REPO O DE LA DOCUMENTACIÓN]. Lee su README, usa el método que recomienda, dime qué necesita (cuentas, claves, programas) y pruébala con un ejemplo chico."}], "aviso": "Cada skill suma su descripción a todas tus sesiones y algunos plugins traen procesos que corren solos. Si algo no lo usaste en dos semanas, sácalo."}, {"h": "Área 1 · Construir y probar", "p": ["Planifica, construye y prueba antes de que lo vea nadie."], "lista": ["<b>superpowers<\/b> (jefe de proyecto): planifica y depura antes de escribir código. Instalación: <code>/plugin install superpowers@claude-plugins-official<\/code> <a href=\"https://github.com/obra/superpowers\" target=\"_blank\" rel=\"noopener\">github.com/obra/superpowers ↗<\/a>", "<b>gstack<\/b> (equipo de desarrollo): producto, arquitectura, diseño y revisión en una sola instalación. Necesita Git y Bun 1.4.2 o más nuevo. Instalación: <code>git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git ~/.claude/skills/gstack<\/code> y después <code>cd ~/.claude/skills/gstack && ./setup<\/code> <a href=\"https://github.com/garrytan/gstack\" target=\"_blank\" rel=\"noopener\">github.com/garrytan/gstack ↗<\/a>", "<b>codex<\/b> (segundo revisor): el plugin oficial de OpenAI para pasarle tareas o revisiones a Codex. Necesita Node.js 18.18 o más nuevo y la CLI de Codex con sesión iniciada (cuenta de ChatGPT o clave de OpenAI). Instalación: <code>/plugin marketplace add openai/codex-plugin-cc<\/code>, <code>/plugin install codex@openai-codex<\/code> y <code>/codex:setup<\/code> <a href=\"https://github.com/openai/codex-plugin-cc\" target=\"_blank\" rel=\"noopener\">github.com/openai/codex-plugin-cc ↗<\/a>", "<b>Playwright<\/b> (tester): un navegador de verdad: Claude hace clic, completa formularios y prueba tu web. Instalación: <code>claude mcp add --scope user playwright -- npx @playwright/mcp@latest<\/code> <a href=\"https://github.com/microsoft/playwright-mcp\" target=\"_blank\" rel=\"noopener\">github.com/microsoft/playwright-mcp ↗<\/a>", "<b>Context7<\/b> (bibliotecario): documentación actualizada para que Claude no programe con información vieja. Instalación: <code>claude mcp add --scope user --transport http context7 https://mcp.context7.com/mcp<\/code> <a href=\"https://github.com/upstash/context7\" target=\"_blank\" rel=\"noopener\">github.com/upstash/context7 ↗<\/a>", "<b>Supabase<\/b> (base de datos): el MCP oficial de Supabase para consultar tu base y manejar tu proyecto. Limítalo a un proyecto y usa modo solo lectura cuando puedas. Instalación: sigue el comando de <a href=\"https://supabase.com/docs/guides/mcp\" target=\"_blank\" rel=\"noopener\">supabase.com/docs/guides/mcp ↗<\/a> (te arma el link con tu proyecto).", "<b>claude-mem<\/b> (memoria): guarda en tu computadora lo que hizo Claude y lo vuelve a traer en la próxima sesión. Trae estadísticas de uso anónimas activadas: se apagan con <code>npx claude-mem telemetry disable<\/code>. Instalación: <code>npx claude-mem install<\/code> <a href=\"https://github.com/thedotmack/claude-mem\" target=\"_blank\" rel=\"noopener\">github.com/thedotmack/claude-mem ↗<\/a>"]}, {"h": "Área 2 · Diseño y video", "p": ["Que no se vea hecho con IA, y que se mueva."], "lista": ["<b>frontend-design<\/b> (director de arte): plugin oficial de Anthropic para interfaces con estilo propio. Instalación: <code>/plugin install frontend-design@claude-plugins-official<\/code> <a href=\"https://github.com/anthropics/claude-plugins-official\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/claude-plugins-official ↗<\/a>", "<b>ui-ux-pro-max<\/b> (diseñador UX): criterio de diseño, paletas y tipografías. Su buscador de estilos usa Python 3. Instalación: <code>/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill<\/code> y <code>/plugin install ui-ux-pro-max@ui-ux-pro-max-skill<\/code> <a href=\"https://github.com/nextlevelbuilder/ui-ux-pro-max-skill\" target=\"_blank\" rel=\"noopener\">github.com/nextlevelbuilder/ui-ux-pro-max-skill ↗<\/a>", "<b>impeccable<\/b> (guardián de estilo): señalas una parte de tu web, dices qué no te gusta y la pule. Instalación: en la carpeta del proyecto, <code>npx impeccable install<\/code> y después <code>/impeccable init<\/code> <a href=\"https://github.com/pbakaus/impeccable\" target=\"_blank\" rel=\"noopener\">github.com/pbakaus/impeccable ↗<\/a>", "<b>taste-skill<\/b> (buen gusto): webs de empresa que se ven profesionales en lugar de una plantilla. Necesita Node 22 o más nuevo y Chrome, Edge o Chromium. Instalación: <code>/plugin marketplace add Leonxlnx/taste-skill<\/code> y <code>/plugin install taste-skill@taste-skill<\/code> <a href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener\">github.com/Leonxlnx/taste-skill ↗<\/a>", "<b>hyperframes<\/b> (motion): escribes HTML y sale un video MP4. Necesita Node.js 22 o más nuevo y FFmpeg. Instalación: <code>claude plugin marketplace add heygen-com/hyperframes<\/code> y <code>claude plugin install hyperframes@hyperframes<\/code> <a href=\"https://github.com/heygen-com/hyperframes\" target=\"_blank\" rel=\"noopener\">github.com/heygen-com/hyperframes ↗<\/a>", "<b>gsap<\/b> (animador): animación web profesional, con las skills oficiales de GSAP. Instalación: <code>npx skills add https://github.com/greensock/gsap-skills<\/code> <a href=\"https://github.com/greensock/gsap-skills\" target=\"_blank\" rel=\"noopener\">github.com/greensock/gsap-skills ↗<\/a>", "<b>Canva<\/b> (diseñador gráfico): el conector oficial de Canva para crear y editar diseños en tu cuenta. Instalación: <code>claude mcp add --transport http Canva https://mcp.canva.com/mcp<\/code>. En la app de Claude (planes pagos): Administrar conectores → Canva → Conectar."]}, {"h": "Área 3 · Investigar y vender", "p": ["Ojos en toda la web y textos que suenan a ti."], "lista": ["<b>last30days<\/b> (radar de tendencias): qué se dijo en internet en los últimos 30 días sobre un tema. Instalación: <code>/plugin marketplace add mvanhorn/last30days-skill<\/code> y <code>/plugin install last30days<\/code> <a href=\"https://github.com/mvanhorn/last30days-skill\" target=\"_blank\" rel=\"noopener\">github.com/mvanhorn/last30days-skill ↗<\/a>", "<b>Firecrawl<\/b> (lector de webs): saca el contenido de cualquier página en texto limpio. Te pide iniciar sesión en Firecrawl. Instalación: <code>claude mcp add --scope user --transport http firecrawl https://mcp.firecrawl.dev/v2/mcp-oauth<\/code> <a href=\"https://github.com/firecrawl/firecrawl-mcp-server\" target=\"_blank\" rel=\"noopener\">github.com/firecrawl/firecrawl-mcp-server ↗<\/a>", "<b>Exa<\/b> (buscador): busca en la web y trae el contenido de las páginas. Funciona sin cuenta con límites, o con una clave para más. Instalación: <code>claude plugin install exa@claude-plugins-official<\/code> <a href=\"https://github.com/exa-labs/exa-mcp-server\" target=\"_blank\" rel=\"noopener\">github.com/exa-labs/exa-mcp-server ↗<\/a>", "<b>agent-browser<\/b> (asistente web): Claude maneja un navegador paso a paso. Instalación: <code>npm install -g agent-browser<\/code>, <code>agent-browser install<\/code> y <code>npx skills add vercel-labs/agent-browser<\/code> <a href=\"https://github.com/vercel-labs/agent-browser\" target=\"_blank\" rel=\"noopener\">github.com/vercel-labs/agent-browser ↗<\/a>", "<b>marketingskills<\/b> (equipo de marketing): skills de SEO, conversión, textos y anuncios. Instalación: <code>npx skills add coreyhaines31/marketingskills --list<\/code> para ver la lista y después <code>npx skills add coreyhaines31/marketingskills --skill NOMBRE<\/code> <a href=\"https://github.com/coreyhaines31/marketingskills\" target=\"_blank\" rel=\"noopener\">github.com/coreyhaines31/marketingskills ↗<\/a>", "<b>humanizer<\/b> (corrector): saca el tono de IA de tus textos. Instalación: <code>/plugin marketplace add blader/humanizer<\/code> y <code>/plugin install humanizer@humanizer<\/code> <a href=\"https://github.com/blader/humanizer\" target=\"_blank\" rel=\"noopener\">github.com/blader/humanizer ↗<\/a>", "<b>knowledge-work-plugins<\/b> (vendedor): plugins oficiales de Anthropic por área: ventas, marketing, atención y más. Instalación: <code>claude plugin marketplace add anthropics/knowledge-work-plugins<\/code> y <code>claude plugin install sales@knowledge-work-plugins<\/code> <a href=\"https://github.com/anthropics/knowledge-work-plugins\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/knowledge-work-plugins ↗<\/a>"]}, {"h": "Área 4 · Contenido", "p": ["Reels, carruseles y documentos, sin hoja en blanco."], "lista": ["<b>Máquina de Contenido<\/b> (estratega): busca qué funciona en tu nicho, te escribe guiones con tu voz y te edita el video. La hice yo y es gratis. Instalación: descárgala desde <a href=\"/maquina\">la Máquina de Contenido<\/a> y sigue los pasos de esa página.", "<b>Instagram Agent<\/b> (community manager): 13 skills para reels, captions, carruseles, stories y perfil. Paso a paso en la guía <a href=\"/guias/instagram-skills-claude\">Claude te ayuda con tu Instagram<\/a>. Instalación: <code>/plugin marketplace add Jakeschincariol/instagram-agent-skill<\/code> y <code>/plugin install instagram-agent<\/code> <a href=\"https://github.com/Jakeschincariol/instagram-agent-skill\" target=\"_blank\" rel=\"noopener\">github.com/Jakeschincariol/instagram-agent-skill ↗<\/a>", "<b>YouTube Agent<\/b> (productor): 11 skills: guion, título y miniatura, cortes y retención. Paso a paso en la guía <a href=\"/guias/youtube-skills-claude\">YouTube<\/a>. Instalación: <code>/plugin marketplace add Jakeschincariol/youtube-agent-skill<\/code> y <code>/plugin install youtube-agent<\/code> <a href=\"https://github.com/Jakeschincariol/youtube-agent-skill\" target=\"_blank\" rel=\"noopener\">github.com/Jakeschincariol/youtube-agent-skill ↗<\/a>", "<b>LinkedIn Agent<\/b> (redactor): 11 skills para tus posts, comentarios y plan semanal. Lo hice yo y es gratis. Instalación: sigue la guía <a href=\"/guias/linkedin-agent-11-skills\">LinkedIn Agent<\/a> (se descarga como ZIP).", "<b>remotion<\/b> (editor con código): videos hechos con código, sin línea de tiempo (skills oficiales de Remotion). Instalación: <code>npx skills add remotion-dev/skills<\/code> <a href=\"https://github.com/remotion-dev/skills\" target=\"_blank\" rel=\"noopener\">github.com/remotion-dev/skills ↗<\/a>", "<b>document-skills<\/b> (armador de archivos): Word, Excel, PowerPoint y PDF de verdad (skills oficiales de Anthropic). Instalación: <code>/plugin marketplace add anthropics/skills<\/code> y <code>/plugin install document-skills@anthropic-agent-skills<\/code> <a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/skills ↗<\/a>", "<b>MarkItDown<\/b> (lector de archivos): Claude lee tus PDF, Word y Excel gastando menos tokens. Instalación: sigue la guía <a href=\"/guias/markitdown-para-ahorrar-tokens\">MarkItDown<\/a> (5 minutos). <a href=\"https://github.com/microsoft/markitdown\" target=\"_blank\" rel=\"noopener\">github.com/microsoft/markitdown ↗<\/a>"]}, {"h": "Área 5 · Oficina", "p": ["Lo administrativo que nadie quiere hacer."], "lista": ["<b>Google Workspace<\/b> (secretario): Gmail, Drive, Calendar, Docs y Sheets desde un solo lugar. Antes necesitas un cliente OAuth gratis en Google Cloud Console, y el servidor tiene que estar corriendo. Instalación: <code>uvx workspace-mcp --transport streamable-http --tool-tier core<\/code> y después <code>claude mcp add --transport http workspace-mcp http://localhost:8000/mcp<\/code> <a href=\"https://github.com/taylorwilsdon/google_workspace_mcp\" target=\"_blank\" rel=\"noopener\">github.com/taylorwilsdon/google_workspace_mcp ↗<\/a>", "<b>Notion<\/b> (jefe de gabinete): lee y escribe tus páginas de Notion. Instalación: <code>claude mcp add --transport http notion https://mcp.notion.com/mcp<\/code> y después <code>/mcp<\/code> para iniciar sesión", "<b>Zapier<\/b> (integrador): ejecuta acciones en las apps que conectaste en Zapier. Cada llamada consume dos tareas de tu plan de Zapier. Instalación: <code>claude mcp add --transport http \"Zapier-MCP\" https://mcp.zapier.com/api/v1/connect<\/code>", "<b>n8n-mcp<\/b> (automatizador): la documentación de los nodos de n8n para que Claude arme tus flujos. Instalación: <code>claude mcp add n8n-mcp -e MCP_MODE=stdio -e LOG_LEVEL=error -e DISABLE_CONSOLE_OUTPUT=true -- npx n8n-mcp<\/code> <a href=\"https://github.com/czlonkowski/n8n-mcp\" target=\"_blank\" rel=\"noopener\">github.com/czlonkowski/n8n-mcp ↗<\/a>", "<b>Mercado Pago<\/b> (cobrador): el MCP oficial para integrar cobros sin perderte en la documentación. Instalación: <code>claude mcp add --transport http mercadopago https://mcp.mercadopago.com/mcp<\/code> y después <code>/mcp<\/code>", "<b>caveman<\/b> (ahorrador): Claude responde corto y gasta muchos menos tokens. Instalación: <code>/plugin marketplace add JuliusBrussee/caveman<\/code> y <code>/plugin install caveman@caveman<\/code> <a href=\"https://github.com/JuliusBrussee/caveman\" target=\"_blank\" rel=\"noopener\">github.com/JuliusBrussee/caveman ↗<\/a>", "<b>skill-creator<\/b> (capacitador): crea skills nuevas y mide si mejoran el resultado. Instalación: <code>/plugin install skill-creator@claude-plugins-official<\/code> <a href=\"https://github.com/anthropics/claude-plugins-official\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/claude-plugins-official ↗<\/a>"]}, {"h": "Cómo sacar lo que no uses", "lista": ["Plugins: <code>claude plugin uninstall NOMBRE@MARKETPLACE<\/code>.", "Skills instaladas con npx: <code>npx skills remove NOMBRE<\/code>.", "Conectores: <code>claude mcp remove NOMBRE<\/code>."]}], "faq": [{"q": "¿Son todas gratis?", "a": "Los repos son gratis. Algunos conectores usan un servicio con su propia cuenta o plan (Zapier, Canva, Firecrawl, Supabase) y codex usa tu cuenta de ChatGPT."}, {"q": "¿Funcionan en la app de Claude sin Claude Code?", "a": "Unas pocas sí (Canva, Zapier y otros conectores se agregan desde la app). La mayoría pide Claude Code."}], "fuentes": ["https://code.claude.com/docs/en/discover-plugins", "https://code.claude.com/docs/en/mcp", "https://code.claude.com/docs/en/skills"], "cat": "skills", "parte": "úsalo"};</script>

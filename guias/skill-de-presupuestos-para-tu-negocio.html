<script>var GUIA = {"slug": "skill-de-presupuestos-para-tu-negocio", "t": "Skill de presupuestos para tu negocio", "d": "Una skill que arma presupuestos con tu formato, tus precios y tus condiciones. Le pasás el pedido y te devuelve el presupuesto listo para revisar.", "tema": "Skills y plugins", "min": 10, "fichaNombre": "presupuestos", "ficha": [["Qué es", "Una skill con tu formato de presupuesto y un archivo aparte con tu lista de precios."], ["Necesitás", "En la app, la opción Code execution and file creation prendida en Settings → Capabilities (en el diseño nuevo se llama Create and edit files). O Claude Code. Y tu lista de precios al día."], ["Tiempo", "Unos 30 minutos para dejarla andando."], ["Qué no hace", "No manda el presupuesto ni actualiza los precios sola. Vos revisás y enviás."]], "secciones": [{"h": "Qué va a hacer", "p": ["Le escribís algo como \"presupuesto para Laura, 3 cajas del producto A y una instalación\" y la skill busca los precios en tu lista, hace las cuentas, aplica tus condiciones y lo arma con tu formato. Si un ítem no está en la lista, no lo inventa: te lo marca para que lo confirmes."], "lista": ["SKILL.md: el procedimiento, las reglas y el formato.", "references/precios.md: tu lista de precios. Está aparte para que la actualices sin tocar el resto."]}, {"h": "Prepará tus datos", "pasos": ["Tu lista de precios: código, nombre, unidad y precio de cada cosa que vendés.", "Tus condiciones: validez del presupuesto, formas de pago, descuentos, cómo mostrás los impuestos.", "Los datos de tu negocio para el encabezado.", "Un presupuesto real que ya hayas mandado, para copiar el tono y el cierre."]}, {"h": "El SKILL.md", "p": ["Copialo y reemplazá todo lo que está entre corchetes. La carpeta se tiene que llamar presupuestos, igual que el name."], "prompts": [{"t": "presupuestos/SKILL.md", "c": "---\nname: presupuestos\ndescription: Arma presupuestos para clientes de [TU NEGOCIO] con el formato y la lista de precios del negocio. Usala cuando pidan un presupuesto, una cotización o el precio de un trabajo.\n---\n\n# Presupuestos de [TU NEGOCIO]\n\n## Cuándo usarla\n- Cuando te pida un presupuesto o una cotización para un cliente.\n- Cuando te pase un pedido de un cliente y quiera saber cuánto cobrarle.\n\n## Datos que necesitás antes de empezar\nSi falta alguno, preguntalo. No lo inventes.\n1. Nombre del cliente (y empresa, si tiene).\n2. Qué quiere: productos o servicios y cantidades.\n3. Si hay plazo de entrega o fecha especial.\n\n## Pasos\n1. Leé la lista de precios en references/precios.md.\n2. Buscá cada ítem del pedido en la lista. Si un ítem no está, no le pongas precio: anotalo en \"A confirmar\" y avisame.\n3. Calculá subtotal por ítem (precio x cantidad), el total y, si corresponde, el descuento según las reglas de abajo.\n4. Armá el presupuesto con el formato de abajo.\n5. Al final, mostrame las cuentas paso a paso para que las revise.\n\n## Reglas\n- Moneda: [MONEDA]. Escribí los montos con separador de miles.\n- Validez del presupuesto: [CANTIDAD] días desde la fecha.\n- Formas de pago: [EJ.: TRANSFERENCIA, TARJETA].\n- Descuentos: [EJ.: 10% SI EL TOTAL SUPERA TAL MONTO]. No apliques otros.\n- Impuestos: [CÓMO LOS MOSTRÁS: INCLUIDOS O APARTE].\n- Tono: [EJ.: CORDIAL Y PROFESIONAL, TRATO DE USTED].\n- Nunca prometas fechas de entrega que no te haya confirmado.\n\n## Formato\n**[TU NEGOCIO]** | [CONTACTO]\nPresupuesto N.º [NÚMERO] | Fecha: [FECHA]\nCliente: [NOMBRE]\n\n| Ítem | Cantidad | Precio unitario | Subtotal |\n|------|----------|-----------------|----------|\n\nTotal: [TOTAL]\nA confirmar: [ÍTEMS SIN PRECIO, SI HAY]\nCondiciones: validez, formas de pago y plazo.\nCierre: [TU FRASE DE CIERRE HABITUAL]\n\n## Si me pide el archivo\nSi pido el presupuesto en PDF o Word, armalo con el mismo contenido y formato."}]}, {"h": "La lista de precios", "p": ["Creá dentro de la carpeta una subcarpeta references y adentro este archivo. Cuando cambien tus precios, actualizás solo este."], "prompts": [{"t": "presupuestos/references/precios.md", "c": "# Lista de precios de [TU NEGOCIO]\nActualizada: [FECHA]\n\n| Código | Producto o servicio | Unidad | Precio |\n|--------|---------------------|--------|--------|\n| [A01]  | [NOMBRE]            | [UNIDAD] | [PRECIO] |\n| [A02]  | [NOMBRE]            | [UNIDAD] | [PRECIO] |\n\n## Notas\n- [EJ.: EL ENVÍO SE COTIZA APARTE]\n- [EJ.: PEDIDO MÍNIMO]"}], "aviso": "Si preferís no armarlo a mano, pasale a Claude tu lista en Excel o PDF y pedile que la convierta a esta tabla."}, {"h": "Instalala", "pasos": ["Revisá que quede así: presupuestos/SKILL.md y presupuestos/references/precios.md.", "En la app: comprimí la carpeta presupuestos entera (no los archivos sueltos) en un .zip y subila en Customize → Skills (Personalizar → Skills si tenés Claude en español): botón +, después + Create skill y Upload a skill. Después prendela con su interruptor en la misma lista.", "En Claude Code: copiá la carpeta a ~/.claude/skills/ para tenerla en todos tus proyectos."], "prompts": [{"t": "Que Claude la arme con tus datos", "c": "Armame la skill presupuestos con esta plantilla: [PEGÁ EL SKILL.MD DE ARRIBA].\nCompletala con mis datos:\n- Negocio y contacto: [DATOS].\n- Condiciones: [VALIDEZ, PAGOS, DESCUENTOS, IMPUESTOS].\n- Un presupuesto que ya mandé: [PEGALO].\nCon esta lista de precios armá references/precios.md: [PEGÁ O ADJUNTÁ LA LISTA].\nEntregame la carpeta presupuestos como .zip, con la carpeta como primer nivel."}]}, {"h": "Usala", "prompts": [{"t": "Pedir un presupuesto", "c": "Presupuesto para [CLIENTE]: [CANTIDAD] de [PRODUCTO], [CANTIDAD] de [SERVICIO]. Entrega en [PLAZO]."}, {"t": "En archivo", "c": "Armá el presupuesto para [CLIENTE] con este pedido y dámelo en PDF: [PEGÁ EL PEDIDO]."}], "aviso": "Revisá siempre las cuentas y los precios antes de mandarlo. La skill te muestra el cálculo para que sea rápido."}], "faq": [{"q": "¿Cómo actualizo los precios?", "a": "Editá references/precios.md. En la app, volvé a comprimir la carpeta y subila de nuevo, y revisá en Customize → Skills que quede una sola versión prendida. En Claude Code el cambio se toma en la misma sesión, sin reiniciar."}, {"q": "¿Puede mandarle el presupuesto al cliente?", "a": "Esta skill no lo hace a propósito: te lo deja listo para que lo revises y lo mandes vos."}, {"q": "¿Y si vendo cosas con precio variable?", "a": "Poné en la lista un precio base y en las reglas cómo se calcula el ajuste. Si no hay regla, la skill lo deja en \"A confirmar\"."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://claude.com/docs/skills/overview", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: presupuestos de cortinas roller en el día", "negocio": "Ejemplo inventado: un taller de cortinas roller y toldos en Godoy Cruz, Mendoza. Son la dueña, que atiende y cotiza, y dos colocadores. Las consultas entran por WhatsApp e Instagram.", "punto_de_partida": "La dueña arma cada presupuesto en un Word viejo, busca los precios en un Excel del proveedor y tarda en contestar los días de mucha colocación. A veces se le pasa cobrar la colocación aparte.", "pasos": ["Juntó lo que pide la guía: el Excel de precios, sus condiciones (validez, formas de pago, cómo cobra la colocación) y un presupuesto que ya había mandado y le gustaba.", "Prendió en Settings → Capabilities la opción Code execution and file creation, que piden las skills.", "Pegó en un chat el prompt de la guía \"Que Claude la arme con tus datos\" con el Excel adjunto. Revisó que cada precio de precios.md coincidiera con el Excel y que la colocación figurara como ítem propio, por unidad.", "En la sección Reglas dejó escrito que la colocación se cobra siempre aparte y que las medidas fuera de las que tiene en la lista van a \"A confirmar\".", "Descargó el .zip, comprobó que adentro estuviera la carpeta presupuestos con SKILL.md y references/precios.md, y lo subió en Customize → Skills → + → + Create skill → Upload a skill.", "Corrió las pruebas del kit con productos reales. La de unidad distinta falló: le pidió una cortina en metros cuadrados y la lista estaba por medida estándar. Agregó la regla \"No conviertas medidas: si no coincide con la lista, a confirmar\", volvió a subir la skill y repitió la prueba.", "Desde ese día, cuando entra una consulta copia el pedido del cliente en un chat (\"Presupuesto para Rodrigo, 3 roller blackout de [MEDIDA] con colocación\") y revisa las cuentas que la skill muestra al final antes de mandar el PDF por WhatsApp.", "Cuando el proveedor le manda la lista nueva, usa la skill lista-de-precios del kit para generar el precios.md actualizado, mira la sección Cambios y vuelve a subir la carpeta."], "resultado": "Quedó una skill que arma los presupuestos con su formato, cobra la colocación aparte, deja en \"A confirmar\" lo que no está en la lista y muestra las cuentas. La dueña revisa y manda cada presupuesto ella."}, "si_falla": [{"sintoma": "No aparece la sección Skills o no deja prender la skill.", "solucion": "Prendé Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En Team o Enterprise, si está bloqueado, pedile al owner que lo habilite en Organization settings → Plugins & skills, en la pestaña Policy."}, {"sintoma": "Al subir el .zip aparece un error.", "solucion": "Revisá cuatro cosas: que el ZIP tenga adentro la carpeta presupuestos y no los archivos sueltos, que la carpeta se llame igual que el name del SKILL.md, que el SKILL.md empiece con las tres rayas --- en la primera línea y que el name y la description no tengan caracteres raros. La ayuda oficial también lista ZIPs demasiado grandes como causa."}, {"sintoma": "Pedís un presupuesto y Claude no usa la skill: contesta con precios genéricos o te pregunta la lista.", "solucion": "Revisá que esté prendida en Customize → Skills. Después mirá la description: tiene que decir qué hace y cuándo usarla, y en la app tiene un máximo de 200 caracteres. Mientras tanto, nombrala en el pedido: \"Usá la skill presupuestos: ...\"."}, {"sintoma": "El presupuesto sale con un precio viejo.", "solucion": "En la app, la skill usa el precios.md que estaba en el último ZIP que subiste. Actualizá el archivo, volvé a comprimir la carpeta, subila otra vez y comprobá en Customize → Skills que no te quede la versión anterior prendida."}, {"sintoma": "En Claude Code la skill no aparece.", "solucion": "La ruta tiene que ser ~/.claude/skills/presupuestos/SKILL.md. Si la carpeta skills no existía cuando abriste la sesión, corré /reload-skills. Si el YAML del encabezado tiene un error, la skill carga sin name ni description: revisá las tres rayas y los dos puntos."}], "kit": [{"archivo": "lista-de-precios/SKILL.md", "que_es": "Skill que convierte la lista de tu proveedor (Excel, PDF o texto) al formato de references/precios.md y te muestra qué precios cambiaron. Guardala en una carpeta lista-de-precios, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: lista-de-precios\ndescription: Convierte una lista de precios en Excel, PDF o texto al formato de references/precios.md y marca qué cambió contra la versión anterior. Usala al actualizar precios.\n---\n\n# Lista de precios\n\nTu trabajo es dejar la lista de precios del negocio en una tabla limpia que la skill presupuestos pueda leer. No inventás precios ni redondeás nada.\n\n## Qué te pasan\n\n- La lista nueva: un Excel, un PDF, una foto legible o texto pegado.\n- Opcional: el precios.md actual, para comparar.\n\n## Pasos\n\n1. Leé la lista nueva entera antes de escribir nada.\n2. Armá una fila por producto o servicio con cuatro columnas: Código, Producto o servicio, Unidad, Precio.\n3. Si un ítem no tiene código, proponé uno con el patrón que ya usa el negocio (por ejemplo, A01, A02) y marcalo con (nuevo) al lado del nombre.\n4. Copiá el precio tal cual figura. No conviertas monedas, no sumes impuestos y no redondees. Si en la lista hay precios con y sin impuestos, preguntá cuál va antes de seguir.\n5. Si una fila no se lee bien o le falta el precio, no la completes: ponela en la sección \"Para revisar\".\n6. Si te pasaron el precios.md anterior, compará y armá la sección \"Cambios\" con tres listas: ítems nuevos, ítems que ya no están y precios que cambiaron (precio anterior y precio nuevo).\n7. Poné la fecha de hoy en \"Actualizada\".\n\n## Formato de salida\n\nEntregá el archivo completo, listo para reemplazar references/precios.md:\n\n# Lista de precios de [NOMBRE DEL NEGOCIO]\nActualizada: [FECHA]\n\n| Código | Producto o servicio | Unidad | Precio |\n|--------|---------------------|--------|--------|\n\n## Notas\n(las notas que ya tenía el archivo anterior, sin tocarlas)\n\nDespués del archivo, fuera de él:\n\n## Cambios\n- Nuevos:\n- Ya no están:\n- Cambió el precio:\n\n## Para revisar\n- (filas que no pudiste leer o que tienen datos raros)\n\n## Reglas\n\n- Nunca completes un precio que no está en la lista que te pasaron.\n- Si dos filas tienen el mismo código, avisá y no elijas vos.\n- Al final recordale a la persona que, en la app de Claude, tiene que volver a comprimir la carpeta presupuestos y subirla de nuevo para que la skill use los precios nuevos.\n"}, {"archivo": "pruebas-skill-presupuestos.md", "que_es": "Ocho pedidos de prueba para comprobar que la skill no inventa precios, no aplica descuentos de más y no promete fechas, antes de usarla con clientes.", "contenido": "# Pruebas de la skill presupuestos antes de usarla con clientes\n\nCorré estos pedidos en un chat nuevo, con la skill presupuestos activa. Cada uno prueba una regla. Anotá al lado si pasó o qué corregiste en el SKILL.md.\n\nReemplazá [ÍTEM DE LA LISTA] por productos reales de tu references/precios.md.\n\n## 1. Pedido normal\nPedido: \"Presupuesto para Marta Ríos: 2 de [ÍTEM DE LA LISTA] y 1 de [OTRO ÍTEM DE LA LISTA].\"\nTiene que pasar: usa los precios exactos de la lista, multiplica bien, muestra las cuentas al final y respeta tu formato.\n[ ] Pasó   Notas:\n\n## 2. Ítem que no está en la lista\nPedido: \"Presupuesto para Marta Ríos: 1 de [ÍTEM DE LA LISTA] y 1 de algo que no vendés.\"\nTiene que pasar: el segundo ítem va a \"A confirmar\", sin precio. No lo estima.\n[ ] Pasó   Notas:\n\n## 3. Falta el nombre del cliente\nPedido: \"Cotizame 3 de [ÍTEM DE LA LISTA].\"\nTiene que pasar: te pregunta para quién es antes de armarlo.\n[ ] Pasó   Notas:\n\n## 4. Descuento en el límite\nPedido: un pedido cuyo total quede justo por debajo del monto que activa tu descuento, y otro justo por encima.\nTiene que pasar: aplica el descuento solo en el segundo y lo muestra en las cuentas.\n[ ] Pasó   Notas:\n\n## 5. Descuento que no existe\nPedido: \"Presupuesto para Marta Ríos: 2 de [ÍTEM DE LA LISTA], con 20% de descuento porque es amiga.\"\nTiene que pasar: no aplica un descuento que no está en tus reglas. Te avisa y te pregunta.\n[ ] Pasó   Notas:\n\n## 6. Unidad distinta\nPedido: pedí un ítem en otra unidad que la de la lista (por ejemplo, en metros si la lista está por rollo).\nTiene que pasar: no convierte por su cuenta. Lo deja en \"A confirmar\" o te pregunta.\n[ ] Pasó   Notas:\n\n## 7. Fecha de entrega\nPedido: \"Presupuesto para Marta Ríos: 1 de [ÍTEM DE LA LISTA]. Lo necesita para el viernes.\"\nTiene que pasar: no promete el viernes. Pone la fecha como pedido del cliente o te pregunta si la confirmás.\n[ ] Pasó   Notas:\n\n## 8. Archivo\nPedido: \"El mismo presupuesto, en PDF.\"\nTiene que pasar: el PDF tiene los mismos números que el texto. Abrilo y comparalo.\n[ ] Pasó   Notas:\n\n## Si una prueba falla\n\n- Inventó un precio: revisá que el SKILL.md diga que lea references/precios.md y que ese archivo esté dentro del ZIP que subiste.\n- Aplicó un descuento de más: escribí la regla con el monto y la condición exactos, y agregá \"No apliques otros\".\n- No respetó el formato: pegá en la sección Formato un presupuesto real tuyo como ejemplo.\n\nVolvé a subir la skill después de cada cambio y repetí solo las pruebas que fallaron.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "usalo"};</script>

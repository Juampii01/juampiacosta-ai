<script>var GUIA = {"slug": "agente-de-contenido-semanal", "t": "Agente de contenido semanal: ideas y borradores que tú apruebas", "d": "Un asistente que cada semana mira qué se está hablando en tu nicho, te propone ideas con su porqué y te arma borradores con tu tono. Publicar sigue siendo cosa tuya.", "tema": "Agentes", "min": 8, "fichaNombre": "Agente de contenido", "ficha": [["Qué hace", "Investiga temas del momento en tu nicho, propone ideas y escribe borradores."], ["Necesitas", "Un Proyecto de Claude con tu guía de marca y búsqueda web activada."], ["Qué no hace", "No publica. No tiene acceso a tus redes."], ["Tiempo", "Una hora la primera vez; después, 20 minutos por semana."]], "secciones": [{"h": "El flujo de cada semana", "pasos": ["Investigación: busca de qué se habla en tu nicho esta semana, con links.", "Ideas: te propone 8 a 10 ideas, cada una con por qué ahora y para quién.", "Tu filtro: tú eliges 3 o 4. Este paso no se delega.", "Borradores: escribe guiones o textos solo de las que elegiste, con tu tono.", "Tu revisión: corriges, grabas o diseñas y publicas tú."]}, {"h": "Arma el proyecto", "pasos": ["Crea un Proyecto \"Contenido\" en Claude.", "Sube al conocimiento: tu guía de marca o ficha de voz, 5 publicaciones tuyas que funcionaron y una descripción de tu público.", "Pega las instrucciones de abajo.", "En cada chat de la semana, activa la búsqueda web desde el botón + (opción Web search, queda con una tilde). En los planes Team y Enterprise primero la tiene que habilitar un Owner en Organization settings → Capabilities. Si tienes la experiencia nueva de Claude no hay interruptor: Claude busca cuando le sirve, así que en el pedido dile explícitamente que busque en la web."], "prompts": [{"t": "Instrucciones del agente de contenido", "c": "Eres mi asistente de contenido para [TU NICHO]. Mi público es [QUIÉN]. Publico en [REDES] con formato [REELS / CARRUSELES / POSTS].\n\nTrabajas en dos etapas y nunca saltas a la segunda sin mi aprobación:\n\nETAPA 1 - IDEAS\n1. Busca en la web qué se está hablando en mi nicho en los últimos días: novedades, preguntas frecuentes, debates.\n2. Propón 8 ideas. Para cada una: título, por qué es relevante ahora (con link), a quién le sirve y qué formato usarías.\n3. Marca cuáles son tendencia pasajera y cuáles sirven por más tiempo.\n4. Termina preguntándome cuáles elijo.\n\nETAPA 2 - BORRADORES\nSolo de las ideas que elegí: un borrador con gancho, desarrollo y cierre, usando mi tono de los documentos.\n\nReglas:\n- No copies textos de otros creadores: inspírate y escribe algo propio.\n- Si un dato no tiene fuente, no lo uses.\n- No prometas resultados ni ingresos."}]}, {"h": "El pedido de los lunes", "prompts": [{"t": "Arrancar la semana", "c": "Arrancamos la semana. Haz la ETAPA 1.\nEsta semana quiero enfocarme en [TEMA O OBJETIVO, POR EJEMPLO: CONSEGUIR CONSULTAS PARA MI SERVICIO X].\nEvita estos temas que ya usé: [LISTA]."}, {"t": "Pasar a borradores", "c": "Elijo las ideas [NÚMEROS]. Haz la ETAPA 2.\nPara la idea [NÚMERO], dame además 3 ganchos alternativos."}]}, {"h": "¿Y si quiero que corra solo?", "p": ["Claude Code tiene tareas programadas que pueden correr cada semana con la etapa 1 (en la guía de tareas programadas está cómo). Hay dos tipos. La local, desde la app de escritorio (pestaña Code, Scheduled, New task, con Only on this computer prendido), puede dejarte un archivo en una carpeta tuya, pero solo corre con la app abierta y la computadora despierta. La de la nube (claude.ai/code/routines o /schedule) corre aunque apagues la computadora, pero no ve tus archivos locales: el resultado queda en la sesión de cada corrida. Aun así, mantén la regla: la tarea solo investiga y propone. Los borradores y la publicación pasan por ti."], "aviso": "No le des acceso para publicar en tus redes. Un error publicado a tu nombre cuesta mucho más que los 20 minutos que te ahorra."}], "faq": [{"q": "¿Por qué dos etapas y no todo junto?", "a": "Porque elegir qué decir es lo que hace que tu contenido sea tuyo. Y escribir borradores de ideas que vas a descartar es gastar tu límite de uso de más."}, {"q": "Los borradores suenan genéricos", "a": "Suma más ejemplos tuyos al conocimiento del proyecto y pídele que te diga qué rasgos de tu tono detectó. Corrige esa lista."}], "fuentes": ["https://support.claude.com/en/articles/10684626-enable-and-use-web-search", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://code.claude.com/docs/en/routines", "https://code.claude.com/docs/en/desktop-scheduled-tasks"], "ejemplo": {"titulo": "Ejemplo resuelto: la semana de contenido de una nutricionista que trabaja sola", "negocio": "Ejemplo inventado: una licenciada en nutrición en Mendoza capital que atiende en un consultorio compartido y por videollamada. Trabaja sola y publica reels y carruseles en Instagram para conseguir consultas.", "punto_de_partida": "Cada domingo a la noche se sentaba sin saber qué publicar. Terminaba repitiendo temas o subiendo algo que vio en otra cuenta, y casi nunca sonaba a ella.", "pasos": ["Completó la ficha de voz del kit: tratamiento contigo, frases cortas, y una lista de palabras que nunca usa (\"detox\", \"quemar grasa\"). En Límites anotó que no promete kilos ni plazos y que siempre aclara que el contenido no reemplaza una consulta.", "Creó el Proyecto \"Contenido\" y subió la ficha, cinco carruseles que le trajeron consultas por mensaje privado y una descripción de su público: adultos que trabajan muchas horas y comen a deshora.", "Pegó las instrucciones de la guía en Set project instructions y subió la skill contenido-semanal del kit en Customize → Skills.", "El lunes abrió un chat en el Proyecto, prendió Web search desde el + y pegó el pedido de los lunes, con el enfoque \"conseguir consultas para el plan de viandas semanales\" y la lista de temas ya usados.", "Claude devolvió la tabla de 8 ideas con un link en cada una. Descartó dos porque el link era de una cuenta que vende suplementos, y una porque era una tendencia que no tiene que ver con lo que ella hace.", "Eligió tres ideas: una duradera (cómo armar viandas para tres días), una pasajera sobre una novedad de etiquetado que salió en un medio nacional, y una respuesta a la pregunta que más le hacen por mensaje privado.", "Pidió la etapa 2 y 3 ganchos alternativos para el reel. Corrigió dos frases que no diría nunca y anotó en la ficha de voz el rasgo que faltaba: explica con ejemplos de la refrigerador, no con nombres de nutrientes.", "Grabó el reel, armó los carruseles en su editor y los publicó ella. Al final sumó los tres temas a la tabla de temas usados.", "Para el mes siguiente armó la tarea programada local del kit, que cada lunes a primera hora le deja el archivo de ideas en la carpeta contenido/ideas."], "resultado": "Quedó un Proyecto con su ficha de voz, una skill que siempre trabaja en dos etapas y una tarea que le deja las ideas de la semana con sus links. Ella sigue eligiendo, corrigiendo y publicando: Claude no tiene acceso a sus redes."}, "si_falla": [{"sintoma": "No aparece la opción Web search en el botón +.", "solucion": "Si tu cuenta es Team o Enterprise, un Owner tiene que habilitarla en Organization settings → Capabilities. Si usas la experiencia nueva de Claude, no hay interruptor: escribe en el pedido \"busca en la web\" y Claude lo hace solo."}, {"sintoma": "Las ideas no traen links, o traen links que no abren o no dicen lo que Claude afirma.", "solucion": "Revisa que la búsqueda web haya estado activa en ese chat. Después pídele: \"Para cada idea, cita la frase exacta del link que la sostiene. Saca las que no tengan.\" Abre tú los links de las ideas que eliges antes de pasar a borradores."}, {"sintoma": "Claude escribe los borradores de las 8 ideas sin esperar a que elijas.", "solucion": "Revisa que las instrucciones del Proyecto tengan la frase \"nunca saltas a la segunda sin mi aprobación\". Si igual pasa, corta la respuesta y en el pedido de los lunes escribe \"Haz solo la ETAPA 1 y frena\". La skill contenido-semanal del kit ya trae esa regla."}, {"sintoma": "La tarea programada local no corrió el lunes.", "solucion": "Las tareas locales corren solo con la app abierta y la computadora despierta. Prende Keep computer awake en la configuración de la app de escritorio, o pásala a una tarea en la nube. Si quedó trabada esperando un permiso, abre la sesión de esa corrida desde el historial de la tarea y apruébalo con always allow."}, {"sintoma": "Los borradores siguen sonando genéricos aunque subiste ejemplos.", "solucion": "Usa el prompt de la sección 6 de la ficha de voz para que Claude te diga qué rasgos detecta. Corrige la ficha con frases tuyas reales, no con adjetivos como \"cercano\" o \"profesional\", y reemplaza los ejemplos que no se parecen a cómo hablas hoy."}], "kit": [{"archivo": "contenido-semanal/SKILL.md", "que_es": "Skill que trabaja siempre en dos etapas: ideas con link y vida útil, y borradores solo de las que eliges. Guárdala en una carpeta contenido-semanal, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: contenido-semanal\ndescription: 'Plan de contenido semanal en dos etapas: investiga el nicho y propone ideas con link, y después escribe borradores de las elegidas. Úsala con \"arrancamos la semana\" o al pedir ideas o guiones.'\n---\n\n# Contenido semanal\n\nAyudas a una persona a decidir qué publicar esta semana y a escribir los borradores. Nunca publicas nada y nunca saltas a los borradores sin que ella elija.\n\n## Antes de empezar\n\nBusca en el Proyecto o en la conversación:\n- La ficha de voz o guía de marca.\n- Las publicaciones de ejemplo que funcionaron.\n- La descripción del público.\n- La lista de temas ya usados, si existe.\n\nSi falta la ficha de voz o el público, dilo en una línea y sigue con lo que haya. No inventes datos del negocio.\n\n## Etapa 1: ideas\n\n1. Busca en la web qué se habló en el nicho en los últimos 7 días: novedades, preguntas que la gente repite, debates, cambios de reglas o de precios. Si la búsqueda web no está disponible, avisa y pide que la prendan. No propongas ideas \"del momento\" sin haber buscado.\n2. Propón 8 ideas en una tabla con estas columnas:\n   - N\n   - Idea (título de trabajo, una línea)\n   - Por qué ahora (una frase y el link de donde salió)\n   - Para quién (qué parte del público)\n   - Formato (reel, carrusel, post, historia)\n   - Vida útil: \"pasajera\" si deja de servir en dos semanas, \"duradera\" si sirve por meses\n3. Debajo de la tabla, marca las 2 que tú elegirías y por qué, en una línea cada una.\n4. Termina con esta pregunta: \"¿Cuáles eliges? Pásame los números.\"\n\nReglas de la etapa 1:\n- Cada \"por qué ahora\" lleva un link real que abriste. Si no tienes link, la idea no entra.\n- No repitas temas de la lista de usados.\n- Si dos ideas son casi iguales, júntalas.\n- No escribas borradores en esta etapa.\n\n## Etapa 2: borradores\n\nSolo de los números que eligió la persona. Para cada uno:\n\n1. **Gancho**: la primera frase. Concreta, sin preguntas retóricas vacías.\n2. **Desarrollo**: 3 puntos como máximo. Si es reel, en frases para decir en voz alta. Si es carrusel, un punto por lámina.\n3. **Cierre**: qué tiene que hacer quien lo ve (comentar, guardar, escribir por mensaje privado). Uno solo.\n4. **Fuente**: el link que sostiene el dato principal.\n5. **Para revisar**: lo que la persona tiene que confirmar antes de publicar (un dato, un precio, un nombre).\n\nSi te piden ganchos alternativos, da 3 y que cada uno use un ángulo distinto: un dato, un error común, una situación del público.\n\n## Reglas siempre\n\n- Escribe con el tono de la ficha de voz. Si no hay ficha, imita las publicaciones de ejemplo y di qué rasgos tomaste.\n- No copies textos de otros creadores. Puedes tomar el tema, nunca las frases.\n- No uses datos sin fuente. No prometas resultados, ingresos ni plazos.\n- No uses las palabras que la ficha de voz marca como prohibidas.\n- Al final de la etapa 2, cierra con: \"Revisa datos y links antes de publicar.\"\n"}, {"archivo": "ficha-de-voz-y-publico-contenido.md", "que_es": "Plantilla para completar y subir al Proyecto con tu tono, tu público, tus límites y la tabla de temas ya usados, más un prompt para afinarla.", "contenido": "# Ficha de voz y público (para el Proyecto \"Contenido\")\n\nCompleta los corchetes y sube este archivo al conocimiento del Proyecto. Es lo que Claude usa para sonar como tú. Revísalo una vez por mes.\n\n## 1. Quién habla\n\n- Nombre o marca: [NOMBRE]\n- A qué te dedicas, en una frase: [EJEMPLO: ACOMPAÑO A PERSONAS QUE QUIEREN ORDENAR SU ALIMENTACIÓN SIN DIETAS ESTRICTAS]\n- Ciudad o país (para ejemplos y modismos): [CIUDAD / PAÍS]\n- Redes y formatos: [INSTAGRAM: REELS Y CARRUSELES / LINKEDIN: POSTS / ETC.]\n\n## 2. Para quién\n\n- Quién te lee: [EDAD APROXIMADA, SITUACIÓN, QUÉ LE PREOCUPA]\n- Qué ya sabe y qué no hace falta explicarle: [LISTA]\n- Qué te pregunta seguido (copia preguntas reales de mensajes o comentarios):\n  1. [PREGUNTA]\n  2. [PREGUNTA]\n  3. [PREGUNTA]\n- Qué quieres que haga después de verte: [ESCRIBIRTE POR PRIVADO / RESERVAR / GUARDAR EL POSTEO]\n\n## 3. Cómo hablas\n\n- Tratamiento: [TÚ / TÚ / USTED]\n- Largo de frases: [CORTAS / MEDIANAS]\n- Tres rasgos de tu tono, con un ejemplo tuyo cada uno:\n  - [RASGO]: \"[FRASE TUYA REAL]\"\n  - [RASGO]: \"[FRASE TUYA REAL]\"\n  - [RASGO]: \"[FRASE TUYA REAL]\"\n- Palabras y expresiones que sí usas: [LISTA]\n- Palabras que nunca usas: [EJEMPLO: \"INCREÍBLE\", \"TIPS\", \"HACK\", EMOJIS EN EL GANCHO]\n- Cómo cierras tus publicaciones: [EJEMPLO DE CIERRE TUYO]\n\n## 4. Límites\n\n- Temas que no tocas: [LISTA]\n- Promesas que no haces: [EJEMPLO: BAJAR X KILOS, GANAR X DINERO]\n- Lo que siempre aclaras: [EJEMPLO: \"ESTO NO REEMPLAZA UNA CONSULTA\"]\n\n## 5. Temas ya usados (actualízalo cada semana)\n\n| Fecha | Tema | Formato |\n|---|---|---|\n| [AAAA-MM-DD] | [TEMA] | [FORMATO] |\n\n## 6. Prompt para afinar esta ficha\n\nPégalo en un chat del Proyecto cuando los borradores suenen genéricos:\n\n\"Lee mis publicaciones de ejemplo y esta ficha. Dime qué rasgos de mi tono detectas en las publicaciones que no están en la ficha, y qué cosas de la ficha no se ven en las publicaciones. Una lista corta de cada una, con la frase de ejemplo. No cambies nada todavía.\"\n"}, {"archivo": "tarea-programada-ideas-semanales.md", "que_es": "Configuración y prompt de una tarea programada que cada semana te deja un archivo con la etapa 1 lista, sin escribir borradores ni tocar tus redes.", "contenido": "# Tarea programada: ideas de contenido de la semana\n\nPara que la etapa 1 te espere lista el lunes. La tarea solo investiga y propone: no escribe borradores ni toca tus redes.\n\n## Dónde crearla\n\nOpción A, en tu computadora (puede dejarte un archivo):\n1. Abre la app de escritorio de Claude, pestaña Code.\n2. En la barra lateral, Scheduled (en algunas versiones se llama Routines) y después New task (o New routine).\n3. Nombre: ideas-contenido-semanal.\n4. Pega el prompt de abajo en las instrucciones.\n5. En Advanced settings, pestaña General, prende Only on this computer y elige la carpeta donde tienes la ficha de voz.\n6. En Trigger elige Weekly, el día y la hora.\n7. Después de crearla, aprieta Run now una vez y aprueba con \"always allow\" los permisos que pida (búsqueda web, escribir archivos en esa carpeta). Así las próximas corridas no se traban esperando tu aprobación.\n\nOjo: solo corre con la app abierta y la computadora despierta. Si la computadora estaba dormida, corre una vez cuando se despierta.\n\nOpción B, en la nube (claude.ai/code/routines o /schedule en Claude Code): corre aunque tengas la computadora apagada, pero no ve tus archivos locales. Pega la ficha de voz dentro del prompt y lee el resultado en la sesión de cada corrida.\n\n## Carpeta sugerida\n\n```\ncontenido/\n  ficha-de-voz.md\n  ideas/\n```\n\n## Prompt de la tarea (copia desde aquí)\n\nEres mi asistente de contenido. Hoy haces solo la ETAPA 1.\n\n1. Mira la fecha de hoy. Si no es [DÍA] ni el día siguiente, igual haz el trabajo, pero en la primera línea del archivo pon \"Corrida atrasada: [FECHA]\".\n2. Lee contenido/ficha-de-voz.md: mi nicho, mi público, mis formatos y la tabla de temas ya usados.\n3. Busca en la web qué se habló en mi nicho en los últimos 7 días: novedades, preguntas frecuentes, debates.\n4. Escribe el archivo contenido/ideas/ideas-AAAA-MM-DD.md (con la fecha de hoy) con:\n   - Una tabla de 8 ideas: número, idea, por qué ahora (con link), para quién, formato, vida útil (pasajera o duradera).\n   - Las 2 que tú elegirías y por qué, en una línea cada una.\n   - Una lista \"Links que abrí\" con todos los links usados.\n5. No repitas temas de la tabla de temas usados.\n\nReglas:\n- Cada idea lleva un link real. Si no encuentras fuente, la idea no entra.\n- No escribas borradores, guiones ni textos para publicar.\n- No modifiques ningún otro archivo, tampoco la ficha de voz.\n- No te conectes a ninguna red social.\n\n## El lunes\n\n1. Abre el archivo de ideas y elige 3 o 4.\n2. En el Proyecto \"Contenido\", pega: \"Elijo estas ideas: [PEGAS LAS FILAS]. Haz la ETAPA 2.\"\n3. Suma los temas elegidos a la tabla de temas usados de la ficha de voz.\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "úsalo"};</script>

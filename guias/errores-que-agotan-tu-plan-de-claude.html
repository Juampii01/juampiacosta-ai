rtantes y qué falta hacer. Máximo 150 palabras."}]}, {"h": "Error 5: no usar Proyectos (o usarlos mal)", "p": ["Si vas a usar el mismo material muchas veces, subilo a un Proyecto en lugar de pegarlo en cada chat: el contenido que se reutiliza mientras está en caché cuenta menos. Si volvés después de mucho rato sin usarlo, se cuenta completo otra vez.", "Dos cosas para cuidar: instrucciones del proyecto cortas y generales, y sacar los archivos que ya no usás."]}, {"h": "Errores 6 y 7: modelo y herramientas de más", "lista": ["El modelo más potente para todo: Haiku es el que menos gasta y alcanza para resúmenes y tareas simples. Opus y Fable, para lo que de verdad los necesita.", "Esfuerzo alto en tareas de rutina: bajá el nivel de esfuerzo o apagá el razonamiento extendido cuando no hace falta.", "Conectores y búsqueda web siempre prendidos: las herramientas consumen mucho. Apagalas en los chats donde no las usás."]}], "faq": [{"q": "¿Cuántos mensajes tengo por día?", "a": "No hay un número fijo: depende del largo de los mensajes, los archivos, el modelo, el esfuerzo y las herramientas que uses. Mirá Settings → Usage."}, {"q": "Me quedé sin uso en el medio de algo urgente", "a": "En los planes pagos podés usar créditos de uso extra para seguir. Si no, esperá a que se renueve la sesión."}, {"q": "¿Claude Code gasta del mismo límite?", "a": "Sí. El uso se cuenta junto entre claude.ai, Claude Code y la app de escritorio."}], "fuentes": ["https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://claude.com/resources/tutorials/choosing-the-right-claude-model"], "cat": "ahorrar", "parte": "aprende"};</script>

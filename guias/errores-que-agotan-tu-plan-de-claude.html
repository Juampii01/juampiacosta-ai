<script>var GUIA = {"slug": "errores-que-agotan-tu-plan-de-claude", "t": "7 errores que te agotan el plan de Claude", "d": "Chats eternos, archivos que ya no usas, el modelo más potente para todo y conectores prendidos de más. Cómo hacer que tu uso rinda.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "Primero, entiende los dos límites", "lista": ["Límite de uso: cuánto puedes usar Claude en un período. En los planes pagos hay un límite por sesión que se renueva cada cinco horas y otro semanal. Cuenta todo junto: claude.ai, Claude Code y la app de escritorio.", "Límite de largo: cuánto puede crecer una sola conversación. Depende del modelo."], "p": ["Mira cuánto te queda en Settings → Usage: ahí ves la sesión actual, el tiempo que falta y cuándo se renueva lo semanal."]}, {"h": "Errores 1 a 3: cómo pides", "lista": ["Mandar de a una pregunta: si tienes tres cosas relacionadas, mandalas en un solo mensaje.", "Pedir sin contexto: un pedido vago termina en ida y vuelta. Di para quién es, qué formato quieres y qué datos tienes.", "Repetir lo que ya dijiste: en un chat largo, refiérete a lo anterior (\"lo que te pasé arriba\") en vez de volver a pegarlo."], "prompts": [{"t": "Pedido completo en un solo mensaje", "c": "Contexto: [QUIÉN ERES Y PARA QUÉ ES].\nTarea: [QUÉ NECESITAS].\nMaterial: [PEGA TEXTO O DATOS].\nFormato: [EJ.: TABLA, 5 VIÑETAS, MAIL DE 100 PALABRAS].\nSi te falta algo, pregúntame todo junto antes de empezar."}]}, {"h": "Error 4: chats que no terminan nunca", "p": ["Cuanto más largo el chat, más pesa cada mensaje. Si tienes activada la ejecución de código, cuando el chat se acerca al límite de largo Claude resume los mensajes viejos para poder seguir. Eso evita que el chat se corte, pero no lo abarata: la ayuda aclara que las conversaciones más largas usan más de tu límite.", "Cuando cambias de tema o el chat ya está muy largo, abre uno nuevo. Pídele antes un resumen para arrancar limpio."], "prompts": [{"t": "Resumen para pasar a un chat nuevo", "c": "Vamos a seguir en un chat nuevo. Escríbeme un resumen de esta conversación para pegar ahí: objetivo, decisiones que tomamos, datos importantes y qué falta hacer. Máximo 150 palabras."}]}, {"h": "Error 5: no usar Proyectos (o usarlos mal)", "p": ["Si vas a usar el mismo material muchas veces, súbelo a un Proyecto en lugar de pegarlo en cada chat: el contenido que se reutiliza mientras está en caché cuenta menos. Si vuelves después de mucho rato sin usarlo, se cuenta completo otra vez.", "Dos cosas para cuidar: instrucciones del proyecto cortas y generales, y sacar los archivos que ya no usas."]}, {"h": "Errores 6 y 7: modelo y herramientas de más", "lista": ["El modelo más potente para todo: Haiku es el que menos gasta y alcanza para resúmenes y tareas simples. Opus y Fable, para lo que de verdad los necesita.", "Esfuerzo alto en tareas de rutina: baja el nivel de esfuerzo cuando no hace falta. En Claude Opus 5.5 y Sonnet 5.5 el razonamiento está siempre prendido, así que ahí la única perilla es el esfuerzo.", "Conectores y herramientas de más: la búsqueda web y Research cuentan para tu límite, y cada conector ocupa espacio en la conversación aunque no lo uses. Revisa qué tienes conectado en Customize → Connectors y desconecta lo que no usas. En el chat, con el botón + (o escribiendo /), en Connectors → Tool access puedes elegir On demand para que los conectores se carguen solo cuando hacen falta."]}], "faq": [{"q": "¿Cuántos mensajes tengo por día?", "a": "No hay un número fijo: depende del largo de los mensajes, los archivos, el modelo, el esfuerzo y las herramientas que uses. Mira Settings → Usage."}, {"q": "Me quedé sin uso en el medio de algo urgente", "a": "En Pro, Max y Ultra puedes prender los usage credits en Settings → Usage para seguir pagando por consumo, con un tope mensual. En Team y Enterprise por asiento los configura el owner de la organización. Si no, espera a que se renueve la sesión."}, {"q": "¿Claude Code gasta del mismo límite?", "a": "Sí. El uso se cuenta junto entre claude.ai, Claude Code y la app de escritorio."}], "fuentes": ["https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://claude.com/resources/tutorials/choosing-the-right-claude-model", "https://support.claude.com/en/articles/13730515", "https://support.claude.com/en/articles/10684626-enable-and-use-web-search", "https://support.claude.com/en/articles/12429409-manage-usage-credits-for-paid-claude-plans", "https://support.claude.com/en/articles/12005970-manage-usage-credits-for-team-and-seat-based-enterprise-plans", "https://support.claude.com/en/articles/12466728-troubleshoot-claude-error-messages"], "ejemplo": {"titulo": "Ejemplo resuelto: una panadería que dejó de usar un solo chat para todo", "negocio": "Ejemplo inventado: una panadería familiar con tres locales en Guadalajara, México. La dueña maneja las redes, los pedidos para eventos y las promociones. Paga Claude Pro y lo usa desde la computadora y el celular.", "punto_de_partida": "Tenía un chat de meses donde hacía todo: promociones, respuestas a clientes, cuentas de costos. Pegaba la lista de productos en cada pedido y usaba el modelo más potente con varios conectores conectados.", "pasos": ["Hizo la auditoría de 10 minutos del kit. Marcó el chat eterno, la lista de productos pegada una y otra vez, el modelo potente para todo y cinco conectores conectados de los que usaba dos.", "En el chat viejo pidió el resumen de traspaso de la guía y lo guardó. Desde ahí, un chat por tema: uno para las promociones de la semana, otro por cada pedido de evento.", "Creó un Proyecto \"Panadería\", subió la lista de productos y las preguntas frecuentes, y pegó las instrucciones cortas del kit completando los corchetes. Dejó de pegar la lista en cada chat.", "Para los textos de promociones y las respuestas a clientes pasó a un modelo más liviano con el esfuerzo por defecto. El modelo potente quedó para la planilla de costos de fin de mes.", "En Customize → Connectors desconectó los tres conectores que no usaba. En los chats del Proyecto probó el modo On demand de Tool access.", "Juntó las preguntas: en vez de mandar \"¿y para 50 personas?\", \"¿y sin gluten?\" de a una, usó la plantilla de pedido completo con las tres cosas en un mensaje.", "A las dos semanas repitió la auditoría y comparó qué seguía marcando."], "resultado": "Quedó un Proyecto con la lista de productos y reglas cortas, chats separados por tema, un modelo liviano para lo de todos los días y solo los conectores que usa. Sabe mirar Settings → Usage y qué revisar cuando la barra baja más rápido de lo normal."}, "si_falla": [{"sintoma": "Al abrir un chat nuevo aparece un error de que el pedido supera el límite de contexto y te sugiere apagar herramientas o acortar el mensaje.", "solucion": "Pasa cuando hay muchos conectores conectados: cada uno ocupa espacio antes de que escribas nada. Desconecta en Customize → Connectors los que no usas y prueba el modo On demand en + → Connectors → Tool access. Hay reportes de usuarios con muchos conectores en los que solo se resolvió desconectando."}, {"sintoma": "Aparece \"Your message will exceed the length limit for this chat\".", "solucion": "Es el límite de largo, no el de uso. La ayuda recomienda adjuntar menos archivos o más chicos, mandar solo las partes que importan o abrir una conversación nueva. Pide antes el resumen de traspaso para no empezar de cero."}, {"sintoma": "Pusiste todo en un Proyecto y la barra igual baja rápido al volver después de unos días.", "solucion": "Es esperable: la ayuda explica que el contenido del Proyecto cuenta menos mientras está en caché, y que si vuelves después de mucho tiempo sin usarlo se cuenta completo otra vez. Agrupa el trabajo de ese Proyecto en una misma sesión y saca los archivos que ya no usas."}, {"sintoma": "Buscas el interruptor de búsqueda web para apagarlo y no está.", "solucion": "En la experiencia nueva de Claude no hay interruptor: Claude busca cuando le sirve. Si no quieres que busque, dilo en el pedido (\"no busques en la web, usa solo lo que te pasé\"). En la experiencia anterior está en el botón + del chat, en Web search."}, {"sintoma": "Quieres apagar el razonamiento extendido y no encuentras cómo.", "solucion": "En Claude Opus 5.5 y Sonnet 5.5 el razonamiento está siempre prendido. Baja el esfuerzo para las tareas de rutina o pasa esas tareas a un modelo más liviano."}], "kit": [{"archivo": "auditoria-consumo-plan-claude.md", "que_es": "Checklist de 10 minutos para encontrar en qué se te va el plan (chats, archivos, modelo, conectores) y elegir tres cambios para la semana.", "contenido": "# Auditoría de 10 minutos: ¿en qué se me va el plan de Claude?\n\nHazla un día que la barra de Settings → Usage te sorprendió. Marca lo que aplica y quédate con las tres primeras que marcaste.\n\n## 1. Mis chats\n\n- [ ] Tengo un chat que uso hace semanas para todo.\n- [ ] Sigo en el mismo chat aunque cambié de tema.\n- [ ] Vuelvo a pegar textos que ya están más arriba en el chat.\n- [ ] Mando preguntas sueltas de a una sobre lo mismo.\n\nArreglo: un chat por tema. Cuando cambias de tema o el chat está muy largo, pide el resumen de traspaso y abre uno nuevo.\n\n## 2. Mis archivos y Proyectos\n\n- [ ] Pego el mismo documento en cada chat nuevo.\n- [ ] Tengo Proyectos con archivos que ya no uso.\n- [ ] Las instrucciones de mi Proyecto son larguísimas o tienen cosas de un solo caso.\n\nArreglo: lo que usas seguido, en un Proyecto. Saca lo viejo. Instrucciones cortas y generales.\n\n## 3. Modelo y esfuerzo\n\n- [ ] Uso el modelo más potente para todo, incluso mails y resúmenes.\n- [ ] Tengo el esfuerzo alto por defecto.\n\nArreglo: un modelo liviano para resúmenes, extracciones y preguntas cortas. El esfuerzo por defecto alcanza para la mayoría; el alto, para lo difícil. En los modelos donde el razonamiento siempre está prendido, lo que se baja es el esfuerzo.\n\n## 4. Herramientas y conectores\n\n- [ ] Tengo muchos conectores conectados y uso dos o tres.\n- [ ] Le paso URLs de artículos largos para que los lea enteros cuando solo necesito una parte.\n- [ ] Uso Research para preguntas que se responden con una búsqueda simple o sin buscar.\n\nArreglo: desconecta en Customize → Connectors lo que no usas. En el chat, en el botón + → Connectors → Tool access, prueba el modo On demand. Pega solo la parte del artículo que importa.\n\n## 5. Dónde más uso Claude\n\n- [ ] Uso Claude Code o la app de escritorio además del chat.\n\nArreglo: todo sale del mismo límite. Si hoy toca una tarea pesada en Claude Code, que el chat sea liviano.\n\n## Mis tres cambios para esta semana\n\n1.\n2.\n3.\n\nFecha: [FECHA]. Repite la auditoría en dos semanas y compara qué marcaste.\n"}, {"archivo": "instrucciones-proyecto-cortas.md", "que_es": "Plantilla de instrucciones de Proyecto cortas y generales, con un ejemplo completo y el mantenimiento mensual para que el Proyecto no engorde.", "contenido": "# Instrucciones de Proyecto cortas: plantilla y ejemplo\n\nLas instrucciones de un Proyecto se aplican en cada chat de ese Proyecto. Conviene que sean cortas y generales: lo puntual de una tarea va en el mensaje, no aquí.\n\n## Plantilla (copia desde aquí y completa los corchetes)\n\nEres el asistente de [NEGOCIO], [QUÉ HACE EN UNA LÍNEA], en [CIUDAD].\n\nPara qué estás en este Proyecto: [UNA O DOS TAREAS QUE SE REPITEN].\n\nUsa como base los archivos de este Proyecto. Si un dato no está ahí, dilo y no lo completes.\n\nTono: [EJ.: CERCANO, VOSEO, FRASES CORTAS, SIN SIGNOS DE EXCLAMACIÓN].\n\nFormato por defecto: [EJ.: RESPUESTAS DE HASTA 150 PALABRAS, SALVO QUE TE PIDA OTRA COSA].\n\nSi te falta algo para hacer bien la tarea, pregúntame todo junto en un solo mensaje antes de empezar.\n\n## Qué NO poner en las instrucciones\n\n- El texto completo de documentos: eso va como archivo del Proyecto.\n- Casos puntuales (\"para el cliente X haz tal cosa\"): eso va en el mensaje del día.\n- La misma regla dicha tres veces de distintas formas.\n- Listas de precios o datos que cambian seguido: ponlos en un archivo y reemplázalo cuando cambie.\n\n## Ejemplo completo (negocio inventado)\n\nEres el asistente de una panadería con tres locales en Guadalajara.\n\nPara qué estás en este Proyecto: escribir los textos de las promociones de la semana y responder consultas de pedidos para eventos.\n\nUsa como base los archivos de este Proyecto: la lista de productos y la de preguntas frecuentes. Si un precio o un producto no está ahí, di que lo confirmamos y no lo inventes.\n\nTono: cálido y directo, tuteo, frases cortas, sin signos de exclamación.\n\nFormato por defecto: textos de hasta 80 palabras para redes y hasta 120 para mensajes.\n\nSi te falta algo para hacer bien la tarea, pregúntame todo junto en un solo mensaje antes de empezar.\n\n## Mantenimiento (una vez por mes)\n\n- [ ] Saqué del Proyecto los archivos que ya no se usan.\n- [ ] Reemplacé las listas que cambiaron.\n- [ ] Releí las instrucciones y borré lo que se volvió un caso puntual.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

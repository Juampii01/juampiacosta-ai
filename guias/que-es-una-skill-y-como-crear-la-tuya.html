<script>var GUIA = {"slug": "que-es-una-skill-y-como-crear-la-tuya", "t": "Qué es una skill y cómo crear la tuya", "d": "Una skill es una carpeta con instrucciones que Claude carga solo cuando hacen falta. Vas a entender cómo está armada y vas a crear la primera, en la app y en Claude Code.", "tema": "Skills y plugins", "min": 9, "fichaNombre": "Tu primera skill", "ficha": [["Qué es", "Una carpeta con un archivo SKILL.md: instrucciones que Claude sigue cuando tu pedido coincide con la descripción."], ["Necesitás", "Cualquier plan de Claude (Free, Pro, Max, Ultra, Team o Enterprise) con la ejecución de código activada, o Claude Code."], ["Tiempo", "Entre 15 y 30 minutos la primera."], ["Qué no hace", "No trae datos de otras apps. Para eso están los conectores."]], "secciones": [{"h": "Qué es una skill, en simple", "p": ["Pensala como un manual de procedimiento que le dejás a Claude. Adentro dice cómo hacer una tarea puntual: armar un informe con tu formato, revisar un texto con tus reglas, preparar un presupuesto.", "Lo bueno es que Claude no lee todas tus skills en cada charla. Primero ve solo el nombre y la descripción de cada una. Cuando lo que le pedís coincide con una descripción, abre esa skill y sigue las instrucciones. Si la skill menciona otros archivos, los abre recién cuando un paso los necesita."], "lista": ["Skill: un procedimiento para una tarea. Se carga solo cuando la tarea coincide.", "Proyecto: conocimiento de fondo que está siempre cargado en los chats de ese proyecto.", "Instrucciones personales: reglas que aplican a todas tus charlas.", "Conector: le da acceso a otra app o a datos en vivo. Una skill le puede explicar cómo usarlo, pero no se conecta sola."]}, {"h": "Cómo está armada", "p": ["Una skill es una carpeta con el mismo nombre que la skill. El único archivo obligatorio es SKILL.md. Arriba de todo lleva un encabezado entre dos líneas de guiones (---) con dos datos: name y description. Abajo van las instrucciones, escritas como texto común."], "lista": ["name: minúsculas, números y guiones, hasta 64 caracteres. Tiene que ser igual al nombre de la carpeta.", "description: qué hace y cuándo usarla. Es lo único que Claude lee antes de decidir si la usa, así que escribila con las palabras que usarías al pedirla. Para subirla a la app, que no pase de 200 caracteres.", "references/ (opcional): textos largos que Claude lee solo cuando un paso lo pide.", "assets/ (opcional): plantillas, imágenes o tablas que Claude copia o completa.", "scripts/ (opcional): código que Claude corre. Para empezar no lo necesitás."], "prompts": [{"t": "Plantilla de SKILL.md", "c": "---\nname: nombre-de-tu-skill\ndescription: Qué hace esta skill y cuándo usarla, con las palabras que usarías al pedirla.\n---\n\n# Nombre de tu skill\n\n## Cuándo usarla\n- [SITUACIÓN 1]\n- [SITUACIÓN 2]\n\n## Pasos\n1. [PRIMER PASO]\n2. [SEGUNDO PASO]\n3. [TERCER PASO]\n\n## Reglas\n- [REGLA QUE SIEMPRE SE CUMPLE]\n- [COSA QUE NUNCA TIENE QUE HACER]\n\n## Ejemplo de resultado\n[PEGÁ UN EJEMPLO REAL DE CÓMO TIENE QUE QUEDAR]"}], "aviso": "Mantené el SKILL.md corto: la documentación recomienda menos de 500 líneas. Lo largo va en archivos aparte."}, {"h": "Activá las skills en la app", "pasos": ["Abrí Settings → Capabilities (Configuración → Capacidades) y activá Code execution and file creation (ejecución de código y creación de archivos). En el diseño nuevo de Settings se llama Create and edit files.", "Si estás en un plan Team o Enterprise y no ves la opción, la tiene que habilitar un Owner de tu organización en Organization settings → Plugins & skills, pestaña Policy.", "Entrá a Customize → Skills (Personalizar → Skills). Ahí ves tus skills, cada una con su interruptor para prenderla o apagarla. En Team y Enterprise también aparecen las que te compartieron y las de tu organización."]}, {"h": "Creá tu primera skill en la app", "p": ["Tenés dos caminos. El más fácil es que Claude la escriba con vos usando skill-creator, una de las skills de ejemplo de Anthropic que, según su repositorio oficial, ya vienen en los planes pagos de Claude. Buscala en Customize → Skills. El otro es escribirla vos y subirla."], "pasos": ["Activá skill-creator en Customize → Skills.", "Abrí un chat nuevo y pegá el prompt de abajo con tu tarea.", "Respondé las preguntas que te haga y pedile que te entregue la skill como un .zip con la carpeta adentro.", "Subila en Customize → Skills: tocá el botón +, después + Create skill y Upload a skill, y elegí el .zip.", "Activala con el interruptor que aparece al lado."], "prompts": [{"t": "Crear una skill con Claude", "c": "Usá skill-creator y ayudame a crear una skill.\nLa tarea es: [QUÉ QUERÉS QUE HAGA, EN UNA FRASE].\nHoy la hago así: [CONTÁ LOS PASOS COMO LOS HACÉS VOS].\nUn buen resultado se ve así: [PEGÁ UN EJEMPLO].\nAntes de escribirla, haceme las preguntas que necesites. Después armá la carpeta con el SKILL.md (name en minúsculas con guiones, description corta y específica) y entregámela como .zip, con la carpeta de la skill como primer nivel del zip."}]}, {"h": "Creá tu primera skill en Claude Code", "p": ["En Claude Code no hace falta subir nada: alcanza con poner la carpeta en el lugar correcto. Si la ponés en ~/.claude/skills/ la tenés en todos tus proyectos de esa compu."], "pasos": ["Abrí Claude Code y pegá el prompt de abajo.", "Revisá el SKILL.md que te muestra y pedile cambios si hace falta.", "Probala: describí una tarea que coincida con la descripción, o escribí /nombre-de-tu-skill para llamarla directo.", "Claude Code detecta las skills nuevas sin reiniciar. Si la carpeta skills no existía cuando abriste la sesión, escribí /reload-skills."], "prompts": [{"t": "Crear una skill personal en Claude Code", "c": "Creá una skill personal en ~/.claude/skills/[NOMBRE-DE-LA-SKILL]/SKILL.md.\nTiene que hacer esto: [QUÉ HACE].\nSe usa cuando: [EN QUÉ SITUACIONES].\nPasos que sigo yo: [TUS PASOS].\nUsá solo name y description en el encabezado. Mostrame el archivo antes de guardarlo."}]}, {"h": "Probala y ajustala", "lista": ["Probala con pedidos reales: escribí dos o tres pedidos como los harías un día normal.", "Fijate si la cargó: en el razonamiento de Claude vas a ver si abrió la skill.", "Si no la usa: reescribí la descripción con las palabras que usás al pedir esa tarea.", "Una tarea por skill: varias skills chicas funcionan mejor que una gigante, y Claude puede usar más de una en la misma charla."]}], "faq": [{"q": "¿Puedo elegir la skill a mano?", "a": "En la app, Claude elige solo la skill que corresponde. Si querés forzarla, nombrala en el mensaje (por ejemplo, \"usá la skill presupuesto-de-servicio\"), y si no querés que se use, apagala en Customize → Skills. En Claude Code escribí /nombre-de-la-skill."}, {"q": "¿Anthropic revisa las skills que subo o me comparten?", "a": "La ayuda oficial no menciona ninguna revisión de Anthropic para las skills que subís o te comparten. Pide instalarlas solo de fuentes confiables y revisarlas antes de activarlas, porque los riesgos principales son que traigan instrucciones escondidas o que saquen datos. En Enterprise, la organización puede prender un escaneo que revisa las skills de terceros antes de que corran."}, {"q": "¿Pongo mis claves o contraseñas en la skill?", "a": "No. Cualquiera con quien la compartas recibe todos sus archivos. Si necesita entrar a otro servicio, usá un conector."}], "fuentes": ["https://claude.com/docs/skills/overview", "https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512176-what-are-skills", "https://code.claude.com/docs/en/skills", "https://github.com/anthropics/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: una skill para armar presupuestos con el mismo formato siempre", "negocio": "Ejemplo inventado: un estudio de diseño gráfico de dos socias en Montevideo. Hacen logos, piezas para redes y papelería para comercios del barrio. Los pedidos les llegan por WhatsApp y por mail, en mensajes cortos y desordenados.", "punto_de_partida": "Cada presupuesto lo arma la socia que agarró el pedido, con su propio formato. A veces se olvidan de aclarar cuántas rondas de cambios incluye el trabajo y después discuten con el cliente.", "pasos": ["Una de las socias entró a Settings → Capabilities y confirmó que Code execution and file creation estuviera prendida.", "En Customize → Skills buscó skill-creator y la activó.", "Abrió un chat nuevo y pegó el prompt \"Crear una skill con Claude\" de esta guía. En la tarea puso: \"armar un presupuesto de diseño a partir del mensaje del cliente\". En cómo lo hacen hoy pegó tres pasos, y como ejemplo pegó el último presupuesto que les gustó.", "Claude le preguntó qué pasa cuando un ítem no tiene precio en la lista y si querían aclarar las rondas de cambios. Respondió que sin precio quede [PRECIO] y que siempre figuren las rondas incluidas.", "Revisó el SKILL.md que le mostró. Corrigió la description para que dijera \"presupuesto\" y \"cotización\", que son las dos palabras que usan, y verificó que no pasara de 200 caracteres.", "Pidió el .zip con la carpeta presupuesto-de-servicio como primer nivel. Lo subió en Customize → Skills, con +, + Create skill y Upload a skill, y dejó el interruptor prendido.", "En un chat nuevo pegó un mensaje real de un cliente (\"necesito logo y tarjetas para mi panadería, para fin de mes\") y pidió \"armame la cotización\". En el razonamiento de Claude vio que abrió la skill.", "Probó también un pedido que no tenía que activarla (\"escribime un post para Instagram sobre el estudio\") y confirmó que no la usó.", "La otra socia hizo lo mismo en Claude Code: guardó la misma carpeta en ~/.claude/skills/presupuesto-de-servicio/ y la probó con /presupuesto-de-servicio."], "resultado": "Las dos arman los presupuestos con la misma estructura: detalle por ítem, qué no incluye, plazo y forma de pago. Cuando falta un dato, el presupuesto lo marca en lugar de inventarlo, y la que revisa completa los precios antes de mandarlo."}, "si_falla": [{"sintoma": "No aparece la sección Skills en Customize, o las skills se ven en gris.", "solucion": "Prendé Code execution and file creation (o Create and edit files) en Settings → Capabilities. En Team o Enterprise, si no podés, pedile al Owner que habilite Skills y la ejecución de código en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al subir el .zip aparece un error de formato, de nombre o de archivo faltante.", "solucion": "Revisá cuatro cosas: que el .zip tenga la carpeta adentro (no los archivos sueltos), que la carpeta se llame igual que el name, que el SKILL.md arranque con --- en la primera línea y que la description no pase de 200 caracteres. Sacá tildes, ñ y signos raros del name."}, {"sintoma": "La skill está activada pero Claude no la usa.", "solucion": "Casi siempre es la description. Copiá tal cual la frase con la que pediste la tarea y sumá esas palabras a la description. Volvé a probar en un chat nuevo y mirá en el razonamiento de Claude si abrió la skill."}, {"sintoma": "En Claude Code la skill nueva no aparece en /skills.", "solucion": "Revisá la ruta: tiene que quedar ~/.claude/skills/nombre/SKILL.md (no ~/.claude/skills/SKILL.md). Si la carpeta skills no existía cuando abriste la sesión, escribí /reload-skills. Si sigue sin aparecer, abrí Claude Code con claude --debug y buscá el error de esa skill en el registro."}, {"sintoma": "En Claude Code /nombre-de-la-skill funciona, pero Claude nunca la elige solo.", "solucion": "Es probable que el encabezado tenga un error de formato: en ese caso Claude Code carga las instrucciones pero sin la description. Fijate que la primera línea sea --- y que no haya dos puntos sueltos o comillas sin cerrar en la description."}], "kit": [{"archivo": "presupuesto-de-servicio/SKILL.md", "que_es": "Skill lista para usar que arma presupuestos con formato fijo a partir de notas sueltas, sin inventar precios. Guardala en una carpeta presupuesto-de-servicio, comprimila en .zip y subila en Customize → Skills, o copiala a ~/.claude/skills/ en Claude Code.", "contenido": "---\nname: presupuesto-de-servicio\ndescription: Arma un presupuesto de servicio con formato fijo a partir de notas sueltas del pedido. Usala cuando pidan un presupuesto, una cotización o cuánto sale un trabajo.\n---\n\n# Presupuesto de servicio\n\nConvertís las notas de un pedido en un presupuesto listo para revisar y mandar. Nunca lo mandás vos.\n\n## Antes de empezar\n\nSi en el Proyecto o en el chat hay una lista de precios, usala. Si no la hay, no pongas montos: dejá [PRECIO] en cada ítem y avisalo al final.\n\n## Pasos\n\n1. Leé las notas y separá: quién pide, qué pide, para cuándo y cualquier condición que mencione.\n2. Partí el trabajo en ítems concretos que el cliente pueda entender sin explicación (por ejemplo, \"Diseño de logo: 2 propuestas y 2 rondas de cambios\").\n3. A cada ítem ponele el precio de la lista, tal cual figura. Si un ítem no está en la lista, dejá [PRECIO].\n4. Escribí qué incluye y qué no incluye. Lo que no incluye es tan importante como lo que sí.\n5. Armá el presupuesto con el formato de abajo.\n6. Al final, fuera del presupuesto, listá en PREGUNTAR AL CLIENTE todo lo que falte para cerrar el trabajo.\n\n## Formato\n\n**Presupuesto para [NOMBRE DEL CLIENTE]**\nFecha: [FECHA DE HOY]\nValidez: [DÍAS QUE FIGUREN EN LAS REGLAS DEL NEGOCIO, o \"a confirmar\"]\n\n**Qué vamos a hacer**\nUn párrafo de 2 o 3 frases, en el idioma del cliente, sin jerga.\n\n**Detalle**\n| Ítem | Qué incluye | Precio |\n|---|---|---|\n\n**No incluye**\n- ...\n\n**Plazo de entrega**\n[PLAZO, o \"a confirmar\"]\n\n**Forma de pago**\n[LA QUE FIGURE EN LAS REGLAS DEL NEGOCIO, o \"a confirmar\"]\n\n## Reglas\n\n- No inventes precios, plazos, descuentos ni condiciones de pago.\n- No sumes ítems que el cliente no pidió. Si te parece que conviene ofrecer algo más, escribilo aparte como sugerencia para quien revisa.\n- Tono: claro, cordial, con voseo si el negocio usa voseo. Sin signos de exclamación.\n- Si las notas son contradictorias (por ejemplo, dos fechas distintas), no elijas: anotalo en PREGUNTAR AL CLIENTE.\n\n## Al final\n\nCerrá con una línea para quien revisa: \"Revisá precios, plazo y forma de pago antes de mandarlo.\"\n"}, {"archivo": "checklist-primera-skill.md", "que_es": "Checklist para pasar de la idea a una skill instalada y probada, con la tabla de pedidos de prueba para ver si se activa cuando corresponde.", "contenido": "# Checklist: tu primera skill, de la idea a la prueba\n\nUsala en orden. Si un punto no se cumple, no sigas al siguiente.\n\n## 1. La idea\n- [ ] La tarea la pedís seguido (no es de una sola vez).\n- [ ] La podés decir en una frase: \"Cuando [SITUACIÓN], quiero que Claude [RESULTADO]\".\n- [ ] No necesita datos en vivo de otra app. Si los necesita, primero conectá el conector y después la skill le explica cómo usarlo.\n- [ ] Tenés un ejemplo de un resultado que te gustó.\n\n## 2. El SKILL.md\n- [ ] La primera línea del archivo es --- (sin espacios ni líneas vacías antes).\n- [ ] Tiene name: minúsculas, números y guiones. Sin tildes, sin ñ, sin espacios.\n- [ ] El name es igual al nombre de la carpeta.\n- [ ] Tiene description: qué hace y cuándo usarla, en menos de 200 caracteres si la vas a subir a la app.\n- [ ] La description tiene las palabras que usás vos al pedir la tarea (\"presupuesto\", \"cotización\", \"cuánto sale\").\n- [ ] Si la vas a subir a la app, en el encabezado solo hay name y description (otros campos de Claude Code, como disable-model-invocation, hacen fallar la subida).\n- [ ] Debajo del encabezado hay pasos numerados, reglas y un ejemplo.\n- [ ] No hay claves, contraseñas ni datos personales de clientes.\n- [ ] Tiene menos de 500 líneas. Lo largo va en un archivo aparte dentro de la carpeta.\n\n## 3. Instalarla\nEn la app:\n- [ ] Settings → Capabilities: Code execution and file creation (o Create and edit files) prendida.\n- [ ] Comprimiste la carpeta (no los archivos sueltos) en un .zip.\n- [ ] Customize → Skills, botón +, + Create skill, Upload a skill.\n- [ ] La skill aparece con el interruptor prendido.\n\nEn Claude Code:\n- [ ] La carpeta está en ~/.claude/skills/[NOMBRE]/SKILL.md (todos tus proyectos) o en .claude/skills/[NOMBRE]/SKILL.md (un proyecto).\n- [ ] Aparece en /skills. Si no, probá /reload-skills.\n\n## 4. Probarla\nEscribí estos pedidos en chats nuevos y anotá qué pasó:\n\n| Pedido | ¿Debería usarla? | ¿La usó? | ¿El resultado sirve? |\n|---|---|---|---|\n| [UN PEDIDO COMO LO HARÍAS UN DÍA NORMAL] | Sí | | |\n| [EL MISMO PEDIDO, DICHO DE OTRA FORMA] | Sí | | |\n| [UN PEDIDO CON DATOS QUE FALTAN] | Sí | | |\n| [UN PEDIDO PARECIDO PERO DE OTRA COSA] | No | | |\n\n- [ ] Si no la usó cuando debía: sumá a la description las palabras de ese pedido.\n- [ ] Si la usó cuando no debía: hacé la description más específica.\n- [ ] Si la usó pero el resultado no sirve: el problema está en los pasos o falta el ejemplo, no en la description.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "usalo"};</script>

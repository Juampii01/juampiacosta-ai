<script>var GUIA = {"slug": "que-es-una-skill-y-como-crear-la-tuya", "t": "Qué es una skill y cómo crear la tuya", "d": "Una skill es una carpeta con instrucciones que Claude carga solo cuando hacen falta. Vas a entender cómo está armada y vas a crear la primera, en la app y en Claude Code.", "tema": "Skills y plugins", "min": 9, "fichaNombre": "Tu primera skill", "ficha": [["Qué es", "Una carpeta con un archivo SKILL.md: instrucciones que Claude sigue cuando tu pedido coincide con la descripción."], ["Necesitás", "Un plan Pro, Max, Team o Enterprise con la ejecución de código activada, o Claude Code."], ["Tiempo", "Entre 15 y 30 minutos la primera."], ["Qué no hace", "No trae datos de otras apps. Para eso están los conectores."]], "secciones": [{"h": "Qué es una skill, en simple", "p": ["Pensala como un manual de procedimiento que le dejás a Claude. Adentro dice cómo hacer una tarea puntual: armar un informe con tu formato, revisar un texto con tus reglas, preparar un presupuesto.", "Lo bueno es que Claude no lee todas tus skills en cada charla. Primero ve solo el nombre y la descripción de cada una. Cuando lo que le pedís coincide con una descripción, abre esa skill y sigue las instrucciones. Si la skill menciona otros archivos, los abre recién cuando un paso los necesita."], "lista": ["Skill: un procedimiento para una tarea. Se carga solo cuando la tarea coincide.", "Proyecto: conocimiento de fondo que está siempre cargado en los chats de ese proyecto.", "Instrucciones personales: reglas que aplican a todas tus charlas.", "Conector: le da acceso a otra app o a datos en vivo. Una skill le puede explicar cómo usarlo, pero no se conecta sola."]}, {"h": "Cómo está armada", "p": ["Una skill es una carpeta con el mismo nombre que la skill. El único archivo obligatorio es SKILL.md. Arriba de todo lleva un encabezado entre dos líneas de guiones (---) con dos datos: name y description. Abajo van las instrucciones, escritas como texto común."], "lista": ["name: minúsculas, números y guiones, hasta 64 caracteres. Tiene que ser igual al nombre de la carpeta.", "description: qué hace y cuándo usarla. Es lo único que Claude lee antes de decidir si la usa, así que escribila con las palabras que usarías al pedirla.", "references/ (opcional): textos largos que Claude lee solo cuando un paso lo pide.", "assets/ (opcional): plantillas, imágenes o tablas que Claude copia o completa.", "scripts/ (opcional): código que Claude corre. Para empezar no lo necesitás."], "prompts": [{"t": "Plantilla de SKILL.md", "c": "---\nname: nombre-de-tu-skill\ndescription: Qué hace esta skill y cuándo usarla, con las palabras que usarías al pedirla.\n---\n\n# Nombre de tu skill\n\n## Cuándo usarla\n- [SITUACIÓN 1]\n- [SITUACIÓN 2]\n\n## Pasos\n1. [PRIMER PASO]\n2. [SEGUNDO PASO]\n3. [TERCER PASO]\n\n## Reglas\n- [REGLA QUE SIEMPRE SE CUMPLE]\n- [COSA QUE NUNCA TIENE QUE HACER]\n\n## Ejemplo de resultado\n[PEGÁ UN EJEMPLO REAL DE CÓMO TIENE QUE QUEDAR]"}], "aviso": "Mantené el SKILL.md corto: la documentación recomienda menos de 500 líneas. Lo largo va en archivos aparte."}, {"h": "Activá las skills en la app", "pasos": ["Abrí Configuración → Capacidades y activá \"Ejecución de código y creación de archivos\" (en el diseño nuevo puede figurar como \"Crear y editar archivos\").", "Si estás en un plan Team o Enterprise y no ves la opción, la tiene que habilitar un Owner de tu organización.", "Entrá a Personalizar → Skills. En \"Tus skills\" ves las que tenés y en \"Descubrir\" las que podés sumar."]}, {"h": "Creá tu primera skill en la app", "p": ["Tenés dos caminos. El más fácil es que Claude la escriba con vos usando skill-creator, una skill de Anthropic que aparece en Personalizar → Skills. El otro es escribirla vos y subirla."], "pasos": ["Activá skill-creator en Personalizar → Skills.", "Abrí un chat nuevo y pegá el prompt de abajo con tu tarea.", "Respondé las preguntas que te haga y pedile que te entregue la skill como un .zip con la carpeta adentro.", "Subila en Personalizar → Skills → + → Crear skill → Subir una skill.", "Activala con el interruptor que aparece al lado."], "prompts": [{"t": "Crear una skill con Claude", "c": "Usá skill-creator y ayudame a crear una skill.\nLa tarea es: [QUÉ QUERÉS QUE HAGA, EN UNA FRASE].\nHoy la hago así: [CONTÁ LOS PASOS COMO LOS HACÉS VOS].\nUn buen resultado se ve así: [PEGÁ UN EJEMPLO].\nAntes de escribirla, haceme las preguntas que necesites. Después armá la carpeta con el SKILL.md (name en minúsculas con guiones, description corta y específica) y entregámela como .zip, con la carpeta de la skill como primer nivel del zip."}]}, {"h": "Creá tu primera skill en Claude Code", "p": ["En Claude Code no hace falta subir nada: alcanza con poner la carpeta en el lugar correcto. Si la ponés en ~/.claude/skills/ la tenés en todos tus proyectos de esa compu."], "pasos": ["Abrí Claude Code y pegá el prompt de abajo.", "Revisá el SKILL.md que te muestra y pedile cambios si hace falta.", "Probala: describí una tarea que coincida con la descripción, o escribí /nombre-de-tu-skill para llamarla directo.", "Claude Code detecta las skills nuevas sin reiniciar. Si la carpeta skills no existía cuando abriste la sesión, escribí /reload-skills."], "prompts": [{"t": "Crear una skill personal en Claude Code", "c": "Creá una skill personal en ~/.claude/skills/[NOMBRE-DE-LA-SKILL]/SKILL.md.\nTiene que hacer esto: [QUÉ HACE].\nSe usa cuando: [EN QUÉ SITUACIONES].\nPasos que sigo yo: [TUS PASOS].\nUsá solo name y description en el encabezado. Mostrame el archivo antes de guardarlo."}]}, {"h": "Probala y ajustala", "lista": ["Probala con pedidos reales: escribí dos o tres pedidos como los harías un día normal.", "Fijate si la cargó: en el razonamiento de Claude vas a ver si abrió la skill.", "Si no la usa: reescribí la descripción con las palabras que usás al pedir esa tarea.", "Una tarea por skill: varias skills chicas funcionan mejor que una gigante, y Claude puede usar más de una en la misma charla."]}], "faq": [{"q": "¿Puedo elegir la skill a mano?", "a": "Sí. En la app escribí / en el cuadro de mensaje y elegila de la lista. En Claude Code escribí /nombre-de-la-skill."}, {"q": "¿Anthropic revisa las skills que subo o me comparten?", "a": "No. Las que subís vos o te comparten no pasan por una revisión de Anthropic, por eso conviene leer el SKILL.md y sus archivos antes de activarlas."}, {"q": "¿Pongo mis claves o contraseñas en la skill?", "a": "No. Cualquiera con quien la compartas recibe todos sus archivos. Si necesita entrar a otro servicio, usá un conector."}], "fuentes": ["https://claude.com/docs/skills/overview", "https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512176-what-are-skills", "https://code.claude.com/docs/en/skills", "https://github.com/anthropics/skills"], "cat": "skills", "parte": "aprende"};</script>

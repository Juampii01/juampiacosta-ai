<script>var GUIA = {"slug": "carruseles-con-claude-paso-a-paso", "t": "Carruseles con Claude, paso a paso", "d": "De un texto, un reel o una idea suelta a un carrusel de 7 a 10 slides: primero el contenido slide por slide, después el diseño con un artifact o con Canva.", "tema": "Contenido y redes", "min": 9, "fichaNombre": "Carrusel en dos pasos", "ficha": [["Qué es", "Un proceso para separar el texto del diseño: Claude arma el contenido y después lo maqueta."], ["Necesitas", "Claude. Para el camino de Canva, además una cuenta de Canva con un plan que incluya el conector (la ayuda de Canva menciona Pro, Teams, Business y Nonprofit) y el conector de Canva en Claude."], ["Tiempo", "Entre 20 y 40 minutos por carrusel."], ["Qué no hace", "No publica en Instagram. El posteo lo haces tú."]], "secciones": [{"h": "Primero el texto, después el diseño", "p": ["El error más común es pedir el carrusel terminado de una. Sale lindo pero flojo, o con buen contenido metido en un diseño que no se lee.", "Hazlo en dos vueltas: primero cierras qué dice cada slide y después lo pasas a diseño. Así corriges cada cosa por separado."]}, {"h": "1. Arma el guion de slides", "p": ["Puedes partir de un texto largo, la transcripción de un reel, un mail que mandaste o tus notas."], "prompts": [{"t": "Guion del carrusel", "c": "Convierte este material en un carrusel de Instagram de [ENTRE 7 Y 10] slides.\n\n[PEGA EL TEXTO]\n\nReglas:\n- Slide 1: un título que diga qué gana la persona si lo lee. Máximo 10 palabras.\n- Slide 2: por qué le importa (el problema, en una o dos frases).\n- Slides del medio: una idea por slide. Título corto y como máximo 25 palabras de texto.\n- Anteúltima: resumen en una lista de 3 puntos.\n- Última: un solo pedido (guardar, comentar una palabra o seguirme).\nDevuélvelo como tabla con columnas: número, título, texto, idea visual.\nUsa mi tono: [DESCRIBE TU TONO O PÍDELE QUE USE TU FICHA DE VOZ]. No inventes datos."}], "pasos": ["Lee la tabla y saca todo lo que se repite.", "Revisa que cada slide se entienda sola: mucha gente entra por la mitad.", "Recién cuando el texto te cierra, pasa al diseño."]}, {"h": "2A. Diseño con un artifact", "p": ["Los artifacts son piezas que Claude te muestra en una ventana al lado del chat. Entre los tipos que puede armar están páginas HTML y componentes interactivos, así que te puede maquetar todas las slides en una sola vista para revisar."], "prompts": [{"t": "Maquetar en artifact", "c": "Con esta tabla de slides, ármame un artifact HTML que muestre cada slide como una tarjeta vertical, todas del mismo tamaño, una debajo de la otra.\nColores: [TUS COLORES EN HEX]. Tipografía: [TU TIPOGRAFÍA O \"UNA SANS SERIF SIMPLE\"].\nTexto grande y con mucho aire, que se lea desde el celular. Numera cada slide en una esquina.\n\n[PEGA LA TABLA]"}], "aviso": "Si no ves el panel del artifact, ve a Settings → Capabilities y revisa que esté prendida la opción Create and edit files (en el diseño anterior, Code execution and file creation), que es la que necesitan los artifacts. En Team y Enterprise la maneja un admin desde Organization settings → Capabilities."}, {"h": "2B. Diseño con Canva", "p": ["Canva tiene un conector oficial para Claude. Según la documentación de Canva, con el conector Claude puede crear diseños vacíos, autocompletar plantillas, buscar tus diseños y exportarlos como PDF o imagen."], "pasos": ["En Claude, ve a Customize → Connectors (claude.ai/customize/connectors; en la app de escritorio, Customize en la barra lateral y después Connectors) y toca Discover.", "Escribe Canva en Search connectors, abre su página y toca Connect to Claude. En un plan Team o Enterprise, si en lugar del botón ves Request, un Owner de la organización tiene que agregarlo primero.", "Autoriza el acceso a tu cuenta de Canva.", "En un chat nuevo, toca + en el cuadro de mensaje → Connectors y fíjate que Canva esté prendido. Pruébalo con: \"Muéstrame mi último diseño editado en Canva\" y, cuando te pida aprobación, elige Allow once (o Always allow si no quieres que te pregunte más por esa herramienta).", "Pídele que use tu tabla de slides para armar el diseño, y termina los detalles a mano en Canva."], "aviso": "Según la ayuda de Canva, el conector está disponible en los planes Canva Pro, Teams, Business y Nonprofit, y algunas funciones, como autocompletar plantillas, dependen de tu plan. En Teams, Education y Enterprise lo habilita un admin. Si tienes Canva gratis, usa el camino del artifact."}, {"h": "3. Control antes de publicar", "lista": ["Portada: ¿se entiende de qué va sin leer el resto?", "Una idea por slide: si tienes que achicar la letra para que entre, pártela en dos.", "Contraste: texto oscuro sobre fondo claro o al revés. Nada de texto encima de fotos cargadas.", "Pedido final: uno solo y claro.", "Datos: todo número o afirmación tiene que poder respaldarse. Si no, sácalo."]}], "faq": [{"q": "¿Cómo paso el artifact a imágenes?", "a": "La forma simple es sacar una captura de cada tarjeta. Si quieres archivos prolijos, usa el camino de Canva, que exporta como imagen o PDF."}, {"q": "¿Cuántas slides conviene?", "a": "Las que necesite la idea. Arranca con 7 a 10 y saca cualquier slide que no sume nada nuevo."}, {"q": "No me aparece Canva en los conectores", "a": "Búscalo en Customize → Connectors → Discover, con el buscador Search connectors. Si usas Claude en un plan Team o Enterprise y ves Request, un Owner de la organización tiene que agregarlo. Si ya lo conectaste pero no lo ves en el chat, préndelo en + → Connectors."}], "fuentes": ["https://support.claude.com/en/articles/9487310-what-are-artifacts", "https://www.canva.dev/docs/connect/canva-mcp-server-setup", "https://claude.com/docs/connectors/getting-started", "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them", "https://www.canva.com/help/mcp-agent-setup/"], "ejemplo": {"titulo": "Ejemplo resuelto: un carrusel a partir de un mail que se manda siempre", "negocio": "Ejemplo inventado: un contador independiente en Miraflores, Lima, que atiende a emprendedores y pequeños negocios. Trabaja solo, con una asistente part time, y usa Instagram para conseguir clientes nuevos.", "punto_de_partida": "Cada año le manda a sus clientes el mismo mail largo con los papeles que tienen que juntar antes de la declaración. Quiere convertirlo en un carrusel, pero cuando lo pidió de una le salió un diseño lindo con un texto que nadie terminaría de leer.", "pasos": ["Pegó el mail (sin nombres de clientes) en el prompt \"Guion del carrusel\" de la guía, pidiendo 8 slides y su tono: claro, de usted, sin tecnicismos.", "La tabla salió con dos slides que decían casi lo mismo sobre recibos. Las juntó en una y pidió que la portada dijera qué gana el emprendedor: llegar a la fecha sin correr.", "Revisó que cada slide se entendiera sola y que no hubiera montos ni fechas que no estuvieran en el mail. Donde Claude había puesto un plazo, lo cambió por [DATO] y lo completó con el que corresponde a sus clientes.", "Subió la skill carrusel-de-instagram del kit para la próxima vez, así el control antes de diseñar sale solo.", "Como tiene Canva gratis, fue por el camino del artifact. Revisó en Settings → Capabilities que estuviera prendida Create and edit files y pegó el prompt del kit con sus colores en hex y la tipografía que usa en su logo.", "Una slide quedó marcada en rojo porque el texto no entraba. La acortó en la tabla y pidió que actualizara el artifact.", "Bajó las ocho tarjetas con el botón Bajar todas, las revisó en el celular y las subió en orden como un solo carrusel."], "resultado": "Quedó un carrusel de 8 slides con el contenido del mail, una idea por slide y un solo pedido final (guardar el carrusel para la próxima declaración), y una skill que le arma el guion y el control de los próximos."}, "si_falla": [{"sintoma": "Pides el artifact y Claude te devuelve el código en el chat, sin panel al costado.", "solucion": "Prende Create and edit files en Settings → Capabilities (en Team o Enterprise, pídeselo al admin) y vuelve a pedirlo en un chat nuevo, diciendo explícitamente \"ármame un artifact HTML\"."}, {"sintoma": "En el artifact el texto se sale de la tarjeta o queda con letra chiquita.", "solucion": "No achiques la letra: el texto es largo para una slide. Acórtalo en la tabla o parte la slide en dos, y pide que actualice el artifact. Con el prompt del kit, las slides con este problema aparecen marcadas en rojo."}, {"sintoma": "El botón de descarga del artifact no baja nada.", "solucion": "Algunas descargas no funcionan dentro del panel. Pídele que el botón abra la imagen en una pestaña nueva para guardarla a mano, o saca una captura de cada tarjeta con el panel a pantalla completa."}, {"sintoma": "Canva no aparece para conectar, o al usarlo te dice que la función no está disponible.", "solucion": "Revisa tu plan de Canva: según su ayuda, el conector está en Pro, Teams, Business y Nonprofit, y en cuentas de equipo lo tiene que habilitar un admin. Si es una cuenta de Claude Team o Enterprise y ves Request, se lo tienes que pedir al Owner."}, {"sintoma": "Canva arma un diseño que no respeta tu tabla de slides.", "solucion": "Pídele de a una slide por vez, pegando el título y el texto exactos, y dile que no cambie el texto. Para que se vea como tu marca, arranca desde un diseño tuyo en Canva y termina los detalles a mano."}], "kit": [{"archivo": "carrusel-de-instagram/SKILL.md", "que_es": "Skill que convierte cualquier material en el guion de un carrusel de 7 a 10 slides, con una idea por slide, la tabla lista para diseñar y el control antes de pasarlo a diseño. Guárdala en una carpeta carrusel-de-instagram, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: carrusel-de-instagram\ndescription: 'Convierte un texto, reel, mail o notas en el guion de un carrusel de 7 a 10 slides, una idea por slide, sin inventar datos. Úsala al pedir un carrusel o pasar un reel o texto a slides.'\n---\n\n# Carrusel de Instagram\n\nArmas el contenido del carrusel slide por slide. El diseño viene después, en otro paso. No publicas nada.\n\n## Antes de escribir\n\n- Si la persona tiene una ficha de voz o un manual de marca en el proyecto, úsalos.\n- Si el material no alcanza para 7 slides con ideas distintas, dilo y propón menos slides o qué falta. No rellenes.\n\n## La estructura\n\n1. **Slide 1, portada**: qué gana la persona si lo lee. Máximo 10 palabras. Tiene que entenderse sin leer el resto.\n2. **Slide 2**: por qué le importa. El problema en una o dos frases.\n3. **Slides del medio**: una idea por slide. Título corto y como máximo 25 palabras de texto. Cada slide se tiene que entender sola, porque mucha gente entra por la mitad.\n4. **Anteúltima**: resumen en una lista de 3 puntos.\n5. **Última**: un solo pedido (guardar, comentar una palabra, compartir o seguir).\n\n## Reglas\n\n- Nada de cifras, porcentajes, nombres ni resultados que no estén en el material. Si hace falta un dato, escribe [DATO].\n- No repitas la misma idea con otras palabras en dos slides.\n- Sin signos de exclamación seguidos, sin mayúsculas sostenidas, sin \"el secreto que nadie te cuenta\".\n- La idea visual describe algo que se pueda armar: un ícono, una lista, una comparación lado a lado, una captura. Nada de \"imagen impactante\".\n\n## Qué entregas\n\n1. Una tabla con columnas: numero, titulo, texto, idea_visual.\n2. Debajo, el control antes de diseñar, respondido slide por slide solo donde haya un problema:\n   - Portada: ¿se entiende sola?\n   - ¿Alguna slide pasa de 25 palabras?\n   - ¿Alguna repite una idea de otra?\n   - ¿El pedido final es uno solo?\n   - ¿Hay algún dato sin respaldo en el material?\n3. Una línea final: \"Cuando el texto te cierre, pásalo a diseño con el artifact o con Canva.\"\n\n## Si te piden revisar un carrusel ya hecho\n\nAplica el mismo control y devuelve solo los cambios, slide por slide, con el texto nuevo listo para pegar.\n"}, {"archivo": "prompt-artifact-carrusel-descargable.md", "que_es": "El prompt para maquetar la tabla en un artifact con tarjetas 4:5, aviso en rojo cuando un texto no entra y botones para bajar cada slide como PNG, con los pasos para revisarlo y subirlo.", "contenido": "# Prompt: carrusel en artifact, listo para bajar como imágenes\n\nÚsalo cuando ya tienes la tabla de slides cerrada. Pégalo en el mismo chat donde está la tabla, o pega la tabla al final. Necesitas tener prendida la opción Create and edit files en Settings → Capabilities.\n\n## Prompt (copia desde aquí)\n\nCon la tabla de slides de abajo, ármame un artifact HTML para revisar y bajar el carrusel.\n\nDiseño:\n- Cada slide es una tarjeta vertical de proporción 4:5, todas del mismo tamaño, una debajo de la otra, con un espacio entre tarjetas.\n- Colores: fondo [COLOR DE FONDO EN HEX], texto [COLOR DE TEXTO EN HEX], detalle [COLOR DE ACENTO EN HEX]. Si alguna combinación no tiene buen contraste, avísame y propón otra.\n- Tipografía: [TU TIPOGRAFÍA DE GOOGLE FONTS O \"UNA SANS SERIF SIMPLE\"].\n- Título grande y texto con mucho aire, que se lea desde el celular. Si un texto no entra sin achicar la letra, no lo achiques: márcame esa slide en rojo arriba de la tarjeta.\n- El número de slide en una esquina, chico (por ejemplo 3/9).\n- En la última tarjeta, [TU @CUENTA] abajo.\n- Nada de imágenes de internet. Para la idea visual usa formas simples, íconos dibujados con CSS o SVG, o deja un recuadro gris con la descripción para que yo ponga la imagen después.\n\nPara bajarlo:\n- Debajo de cada tarjeta, un botón \"Bajar PNG\" que descargue solo esa tarjeta como imagen, en alta resolución.\n- Arriba de todo, un botón \"Bajar todas\" que descargue las tarjetas una por una, con nombre slide-01.png, slide-02.png, etc.\n- Si necesitas una librería para convertir a imagen, cárgala desde cdnjs.cloudflare.com.\n\nNo cambies ningún texto de la tabla. Si ves un error, dímelo aparte.\n\n[PEGA LA TABLA]\n\n## Después\n\n1. Revisa en el panel que ninguna tarjeta esté marcada en rojo. Si hay, acorta ese texto en la tabla y pide que actualice el artifact.\n2. Prueba \"Bajar PNG\" en una tarjeta. Si el botón no descarga nada, pídele: \"El botón de descarga no funciona en el panel, cámbialo para que abra la imagen en una pestaña nueva y la guardo yo\".\n3. Si el texto se ve distinto en la imagen que en el panel (otra tipografía), pídele que espere a que cargue la fuente antes de generar la imagen.\n4. Sube las imágenes en orden a Instagram como un solo carrusel.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "de-donde-vienen-tus-clientes", "t": "De dónde vienen tus clientes (y cómo saberlo)", "d": "Registra el origen de cada cliente con enlaces etiquetados, una pregunta en el formulario y una planilla simple. Después Claude te dice qué canal rinde.", "tema": "Consigue clientes", "min": 9, "fichaNombre": "Registro de origen", "ficha": [["Qué es", "Un sistema simple para saber qué canal te trae clientes de verdad."], ["Necesitas", "Tus enlaces, una pregunta en tu formulario o tu chat y una planilla."], ["Tiempo", "Una hora para armarlo. Después, un minuto por cliente."]], "secciones": [{"h": "Por qué importa", "p": ["Sin este dato, decides dónde poner tiempo y dinero por sensación. Con el dato, ves qué canal trae consultas, cuál trae ventas y cuál solo te da trabajo."]}, {"h": "1. Etiqueta tus enlaces (UTM)", "p": ["Los parámetros UTM son etiquetas que agregas al final de un enlace para que Google Analytics sepa de dónde vino la visita. Google recomienda usar siempre estos tres:"], "lista": ["utm_source: quién te mandó la visita (instagram, newsletter, google).", "utm_medium: el tipo de canal (social, email, cpc).", "utm_campaign: la campaña o promo (lanzamiento-curso, promo-invierno)."], "prompts": [{"t": "Ejemplo de enlace etiquetado", "c": "https://[TU-WEB].com/?utm_source=instagram&utm_medium=social&utm_campaign=[NOMBRE-CAMPAÑA]"}], "aviso": "Elige una forma de escribir y no la cambies: \"instagram\" e \"Instagram\" quedan como dos fuentes distintas. Usa minúsculas y guiones."}, {"h": "2. Pregúntalo directamente", "p": ["Muchos clientes no llegan por un enlace: te recomendaron, te vieron en un video o te buscaron por el nombre. Por eso suma una pregunta en tu formulario, tu chat o al cerrar la venta."], "lista": ["Pregunta: \"¿Cómo nos conociste?\".", "Opciones cerradas: Instagram, Google, recomendación, YouTube, otro (con espacio para escribir).", "Si es recomendación: pregunta de quién. Te sirve para agradecer y para ver quién te manda clientes."]}, {"h": "3. Lleva una planilla", "pasos": ["Crea una planilla con estas columnas: Fecha, Cliente (o código), Origen según UTM, Origen según el cliente, Compró (sí/no), Importe.", "Carga cada consulta nueva, compre o no.", "Cuando compra, actualiza Compró e Importe.", "Si tienes una automatización, que el formulario cargue la fila solo."]}, {"h": "4. Analízalo con Claude", "p": ["Una vez por mes, exporta la planilla en CSV o Excel y súbela a Claude."], "prompts": [{"t": "Análisis de origen de clientes", "c": "Te adjunto mi registro de consultas y clientes de [PERÍODO]. Columnas: fecha, cliente, origen según UTM, origen según el cliente, compró y importe.\n1. Unifica los nombres de origen que sean lo mismo escrito distinto y muéstrame qué unificaste.\n2. Por cada origen: cantidad de consultas, cantidad de ventas, porcentaje de conversión e importe total.\n3. Muestra dónde no coinciden el origen del enlace y el que dijo el cliente.\n4. Dime los 2 canales que más rinden y el que más consultas trae sin convertir.\n5. Sugiere una sola acción concreta para el mes que viene.\nSi hay pocos datos para sacar conclusiones, dímelo en vez de forzarlas."}]}], "faq": [{"q": "¿Le creo al enlace o a lo que dice el cliente?", "a": "A los dos, sabiendo qué mide cada uno. El enlace dice por dónde entró la última vez. El cliente dice dónde te conoció. Muchas veces son distintos y está bien."}, {"q": "¿Cuántos datos necesito para sacar conclusiones?", "a": "Con muy pocos casos cualquier conclusión es ruido. Junta varias semanas antes de cambiar algo importante, y pídele a Claude que te avise si los datos no alcanzan."}], "fuentes": ["https://support.google.com/analytics/answer/10917952", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude", "https://support.google.com/analytics/answer/9756891?hl=en", "https://whatsapp.com/faq/en/general/26000030", "https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: saber de dónde vienen los alumnos de un estudio de pilates", "negocio": "Ejemplo inventado: un estudio de pilates en barrio Pichincha, Rosario. Lo atiende la dueña con dos instructoras. Publica reels en Instagram, tiene ficha en Google Maps, reparte volantes en el barrio y la mayoría de las consultas le entran por WhatsApp.", "punto_de_partida": "La dueña cree que los alumnos nuevos llegan por Instagram, pero nunca lo anotó. A veces paga promociones de publicaciones y no sabe si le traen inscripciones.", "pasos": ["Completó la convención del kit con sus fuentes: instagram, google-maps, whatsapp y qr para el volante. Dejó fijos los medios social, organic y qr.", "Armó el enlace de la bio con utm_source=instagram&utm_medium=social&utm_campaign=bio-permanente y el de la ficha de Google Maps con utm_source=google-maps&utm_medium=organic&utm_campaign=ficha-maps. Probó cada uno y vio que los utm_ seguían en la barra del navegador.", "Como casi todo entra por WhatsApp, armó tres enlaces wa.me con texto precargado distinto: uno para la bio (\"los vi en Instagram\"), uno para la ficha de Maps y uno para el QR del volante.", "Sumó la pregunta \"¿Cómo nos conociste?\" con opciones cerradas al formulario de clase de prueba. Por WhatsApp la hace con el texto del kit cuando el mensaje no trae el texto precargado.", "Creó la planilla con las columnas del kit en Google Sheets. Cada consulta nueva la carga ese mismo día, y cuando alguien se inscribe actualiza Compró e Importe en la misma fila.", "Subió la skill analisis-origen-de-clientes en Customize → Skills. A fin de mes descargó la planilla en CSV, la subió a Claude y pidió: \"Analiza mi registro de origen de noviembre\".", "Claude unificó \"IG\", \"insta\" e \"Instagram\", mostró la tabla por origen y marcó como \"pocos datos\" al volante y a Google Maps. También listó las alumnas que llegaron recomendadas y por quién.", "Con eso decidió no tocar todavía lo que gasta en promociones, seguir registrando un mes más y mandarles un mensaje de agradecimiento a las alumnas que recomendaron el estudio."], "resultado": "Quedó un registro donde cada consulta tiene dos orígenes, el del enlace y el que dice la persona, y un análisis mensual que se hace en minutos con la misma skill. La dueña ahora decide con datos propios y sabe cuándo esos datos todavía no alcanzan."}, "si_falla": [{"sintoma": "En Google Analytics aparecen \"instagram\", \"Instagram\" e \"IG\" como fuentes separadas.", "solucion": "Los valores de los UTM distinguen mayúsculas. Corrige los enlaces para que usen exactamente los valores de tu convención, en minúsculas. Lo que ya se registró no se arregla en Analytics: unifícalo en la planilla o pídele a Claude que lo unifique en el análisis."}, {"sintoma": "Las visitas con UTM aparecen en el canal \"Unassigned\" de Google Analytics 4.", "solucion": "GA4 asigna canales con reglas fijas y no reconoce cualquier medio. Usa valores que sí reconoce: social para redes sin pagar, email para mails, cpc para anuncios en Google, referral para enlaces en otras webs, organic para la ficha de Google Maps."}, {"sintoma": "Haces clic en tu enlace y los utm_ desaparecen de la dirección, o las visitas figuran como directas.", "solucion": "Algo en el camino está redirigiendo sin pasar los parámetros: un acortador, una página de enlaces en la bio o una redirección de tu web (por ejemplo, de http a https o de sin www a con www). Pon el enlace final, ya con https y la forma exacta de tu dominio, y prueba de nuevo. Si usas una página de enlaces en la bio, etiqueta cada botón de esa página, no solo el enlace de la bio."}, {"sintoma": "Casi todos tus clientes figuran como \"sin enlace\" porque te escriben directo por WhatsApp.", "solucion": "Es normal: WhatsApp no pasa por tu web. Usa enlaces wa.me con texto precargado distinto según el lugar (bio, Google Maps, QR) y anota el origen según ese texto. Igual haz la pregunta de origen, porque la persona puede borrar el texto antes de mandarlo."}, {"sintoma": "Subes la planilla a Claude y no la analiza, o responde sin calcular nada.", "solucion": "Activa Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files) en Settings → Capabilities. En Team y Enterprise lo controla el owner de la organización. Si el Excel tiene varias hojas o celdas combinadas, exporta en CSV solo la hoja del registro. El límite es de 30 MB por archivo."}], "kit": [{"archivo": "convencion-utm-y-pregunta-de-origen.md", "que_es": "El diccionario de tus enlaces: fuentes y medios permitidos (con el canal donde aparecen en GA4), formato de campañas, enlaces de WhatsApp con texto precargado y la pregunta de origen lista para pegar.", "contenido": "# Convención de enlaces y pregunta de origen\n\nEste archivo es tu diccionario. Lo armas una vez, lo dejas a mano y no lo cambias. Si cada enlace se escribe igual, la planilla y Google Analytics te muestran lo mismo todos los meses.\n\n## 1. Reglas de escritura\n\n- Todo en minúsculas. Google Analytics distingue mayúsculas: `instagram` e `Instagram` son dos fuentes distintas.\n- Palabras separadas con guion medio: `promo-verano`, no `promo verano` ni `PromoVerano`.\n- Sin tildes ni eñes en los valores: `campana-dia-madre`, no `campaña-día-madre`.\n- Siempre los tres: `utm_source`, `utm_medium` y `utm_campaign`.\n\n## 2. Fuentes permitidas (utm_source)\n\nCompleta solo las que usas y no inventes otras sobre la marcha.\n\n| Dónde está el enlace | utm_source |\n|---|---|\n| Bio de Instagram, historias, reels | instagram |\n| Perfil de TikTok | tiktok |\n| Canal o descripción de YouTube | youtube |\n| Ficha de Google Maps (perfil de negocio) | google-maps |\n| Newsletter o mail | newsletter |\n| Estado o lista de difusión de WhatsApp | whatsapp |\n| Código QR impreso (volante, local, tarjeta) | qr |\n| [OTRA FUENTE] | [valor] |\n\n## 3. Medios (utm_medium): usa estos y no otros\n\nGoogle Analytics 4 arma sus canales con reglas fijas. Si usas un medio que no reconoce, la visita puede terminar en \"Unassigned\". Estos valores sí los reconoce:\n\n| Tipo de enlace | utm_medium | Canal donde aparece en GA4 |\n|---|---|---|\n| Publicaciones y perfiles en redes, sin pagar | social | Organic Social |\n| Mail o newsletter | email | Email |\n| Anuncio pago en una red social | paid-social | Paid Social (si la fuente es una red social) |\n| Anuncio pago en Google | cpc | Paid Search |\n| Enlace en la web de otro (un socio, un directorio) | referral | Referral |\n| Ficha de Google Maps | organic | Organic Search |\n| Código QR impreso | qr | No tiene canal propio: fíltralo por fuente y medio |\n\n## 4. Campañas (utm_campaign)\n\nFormato: `que-es` + `-` + `mes-o-temporada`. Ejemplos:\n\n- `bio-permanente` (el enlace que vive siempre en la bio)\n- `promo-noviembre`\n- `lanzamiento-[nombre-del-producto]`\n- `sorteo-aniversario`\n\n## 5. Tus enlaces listos\n\nCompleta una fila por lugar donde pones un enlace. Prueba cada uno antes de publicarlo: haz clic y fíjate que en la barra del navegador sigan apareciendo los `utm_`.\n\n| Lugar | Enlace completo |\n|---|---|\n| Bio de Instagram | https://[TU-WEB].com/?utm_source=instagram&utm_medium=social&utm_campaign=bio-permanente |\n| Ficha de Google Maps | https://[TU-WEB].com/?utm_source=google-maps&utm_medium=organic&utm_campaign=ficha-maps |\n| Newsletter | https://[TU-WEB].com/?utm_source=newsletter&utm_medium=email&utm_campaign=[CAMPAÑA] |\n| QR del volante | https://[TU-WEB].com/?utm_source=qr&utm_medium=qr&utm_campaign=[CAMPAÑA] |\n\n## 6. Si la mayoría te escribe por WhatsApp\n\nUna consulta que entra directo a WhatsApp no pasa por tu web, así que Google Analytics no la ve. Lo que sí puedes hacer es usar un enlace de WhatsApp con texto precargado distinto según dónde lo pongas. El formato oficial es:\n\n`https://wa.me/[NÚMERO]?text=[TEXTO-CODIFICADO]`\n\nEl número va con código de país, sin el signo +, sin ceros, espacios ni guiones. En el texto, los espacios se escriben `%20`.\n\n| Lugar | Texto precargado |\n|---|---|\n| Bio de Instagram | Hola,%20los%20vi%20en%20Instagram%20y%20quiero%20info |\n| Ficha de Google Maps | Hola,%20los%20encontré%20en%20Google%20Maps%20y%20quiero%20info |\n| Volante con QR | Hola,%20vi%20su%20volante%20y%20quiero%20info |\n\nLa persona puede borrar el texto antes de mandarlo. Por eso, igual haz la pregunta del punto 7.\n\n## 7. La pregunta de origen\n\nEn el formulario, en el chat o al cerrar la venta, siempre con las mismas opciones:\n\n> ¿Cómo nos conociste?\n> - Instagram\n> - Google o Google Maps\n> - Me lo recomendó alguien\n> - YouTube\n> - Otro: ______\n\nSi elige \"Me lo recomendó alguien\", pregunta: \"¡Qué bueno! ¿Quién te pasó el dato? Así le agradecemos.\" Anótalo en la columna \"Recomendado por\".\n\nPara preguntar por WhatsApp sin que suene a encuesta:\n\n> Antes de pasarte la info, una pregunta rápida: ¿cómo llegaste a nosotros? Nos ayuda a saber dónde seguir mostrándonos.\n\n## 8. Rutina\n\n- Cada consulta nueva: una fila en la planilla, el mismo día, compre o no.\n- Cada venta: actualiza \"Compró\" e \"Importe\" en la fila original (no crees una fila nueva).\n- Una vez por mes: exporta la planilla en CSV y haz el análisis con Claude.\n- Nunca cambies los valores de esta convención a mitad de mes. Si necesitas uno nuevo, súmalo aquí primero.\n"}, {"archivo": "registro-origen-clientes-plantilla.csv", "que_es": "La planilla de registro lista para importar en Google Sheets o Excel, con dos filas de ejemplo que tienes que borrar.", "contenido": "Fecha,Cliente o codigo,Origen segun UTM,Origen segun el cliente,Recomendado por,Compro (si/no),Importe,Notas\n2026-11-03,EJEMPLO-001,instagram / social / bio,Instagram,,si,[IMPORTE],Borra esta fila de ejemplo\n2026-11-04,EJEMPLO-002,(sin enlace),Recomendación,[NOMBRE DE QUIEN RECOMENDÓ],no,,Borra esta fila de ejemplo\n"}, {"archivo": "analisis-origen-de-clientes/SKILL.md", "que_es": "Skill que hace el análisis mensual: unifica orígenes, arma la tabla por canal, compara enlace contra cliente y avisa cuando hay pocos datos. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: analisis-origen-de-clientes\ndescription: Analiza el registro mensual de consultas y ventas por origen. Úsala cuando el usuario suba su planilla de origen de clientes o pregunte qué canal le trae consultas o ventas.\n---\n\n# Análisis de origen de clientes\n\nRecibes un registro de consultas y ventas (CSV, Excel o texto pegado) y le dices a la persona qué canal le trae consultas, cuál le trae ventas y qué hacer el mes que viene. Trabajas solo con los datos del archivo.\n\n## Columnas que esperas\n\nFecha, Cliente o código, Origen según UTM, Origen según el cliente, Recomendado por, Compró (sí/no), Importe, Notas.\n\nSi faltan columnas o tienen otros nombres, di cuáles encontraste, cómo las vas a interpretar y sigue. Si falta \"Compró\", analiza solo consultas y avísalo.\n\n## Pasos, en este orden\n\n1. **Limpieza.** Unifica los orígenes que son lo mismo escrito distinto (por ejemplo \"IG\", \"insta\" e \"Instagram\"). Muestra una tabla con lo que unificaste: valor original y valor final. No unifiques cosas que pueden ser distintas (por ejemplo \"Google\" y \"Google Maps\"): pregunta.\n2. **Tabla por origen.** Usa como origen principal el que dijo el cliente. Por cada origen: consultas, ventas, conversión (ventas sobre consultas, en porcentaje) e importe total. Ordena de mayor a menor por ventas.\n3. **Enlace contra cliente.** Lista las filas donde el origen según UTM y el origen según el cliente no coinciden. Explica en una línea qué suele significar: el enlace muestra por dónde entró la última vez y el cliente dice dónde los conoció.\n4. **Recomendaciones de personas.** Si hay datos en \"Recomendado por\", lista quién recomendó y cuántas consultas y ventas trajo cada uno. Sugiere agradecerles.\n5. **Lectura.** Nombra los dos orígenes que más ventas traen y el que más consultas trae sin convertir.\n6. **Una sola acción** concreta para el mes que viene, ligada a lo que muestran los datos.\n\n## Reglas\n\n- Si un origen tiene muy pocas consultas, márcalo como \"pocos datos\" y no saques conclusiones de ese origen. Si todo el registro tiene pocos datos, dilo al principio y recomienda seguir registrando antes de cambiar algo importante.\n- No inventes datos que no están en el archivo, ni promedios del rubro, ni comparaciones con otros negocios.\n- Muestra cómo calculaste cada porcentaje (ventas / consultas).\n- Si hay filas vacías, duplicadas o con fechas fuera del período, lístalas aparte y no las cuentes.\n- Si te piden un gráfico o una planilla limpia, generala como archivo.\n- Termina con: \"Para el mes que viene, sigue cargando cada consulta el mismo día, compre o no.\"\n"}], "verificada": "2026-11-08", "cat": "clientes", "parte": "úsalo"};</script>

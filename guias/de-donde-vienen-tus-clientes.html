entes."]}, {"h": "3. Llevá una planilla", "pasos": ["Creá una planilla con estas columnas: Fecha, Cliente (o código), Origen según UTM, Origen según el cliente, Compró (sí/no), Importe.", "Cargá cada consulta nueva, compre o no.", "Cuando compra, actualizá Compró e Importe.", "Si tenés una automatización, que el formulario cargue la fila solo."]}, {"h": "4. Analizalo con Claude", "p": ["Una vez por mes, exportá la planilla en CSV o Excel y subila a Claude."], "prompts": [{"t": "Análisis de origen de clientes", "c": "Te adjunto mi registro de consultas y clientes de [PERÍODO]. Columnas: fecha, cliente, origen según UTM, origen según el cliente, compró y importe.\n1. Unificá los nombres de origen que sean lo mismo escrito distinto y mostrame qué unificaste.\n2. Por cada origen: cantidad de consultas, cantidad de ventas, porcentaje de conversión e importe total.\n3. Mostrá dónde no coinciden el origen del enlace y el que dijo el cliente.\n4. Decime los 2 canales que más rinden y el que más consultas trae sin convertir.\n5. Sugerí una sola acción concreta para el mes que viene.\nSi hay pocos datos para sacar conclusiones, decímelo en vez de forzarlas."}]}], "faq": [{"q": "¿Le creo al enlace o a lo que dice el cliente?", "a": "A los dos, sabiendo qué mide cada uno. El enlace dice por dónde entró la última vez. El cliente dice dónde te conoció. Muchas veces son distintos y está bien."}, {"q": "¿Cuántos datos necesito para sacar conclusiones?", "a": "Con muy pocos casos cualquier conclusión es ruido. Juntá varias semanas antes de cambiar algo importante, y pedile a Claude que te avise si los datos no alcanzan."}], "fuentes": ["https://support.google.com/analytics/answer/10917952", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude"], "cat": "clientes", "parte": "usalo"};</script>

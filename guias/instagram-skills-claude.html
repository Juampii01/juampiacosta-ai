s y humanizan."}, {"h": "Primero, tu voz", "p": ["Todas las skills leen un archivo, voice.md, con tu forma de hablar. Diez minutos acá cambian todo lo demás."], "prompts": [{"t": "Tu voice.md", "c": "Te paso 3 reels míos (o sus transcripciones). Con eso, escribí mi voice.md con la plantilla del paquete de Instagram: cómo hablo, las frases que uso, lo que nunca diría y mi ritmo."}]}, {"h": "Las 13 funciones", "lista": ["/ig-reel: de una idea a un reel. Tres ganchos con 26 fórmulas, con puntaje, más el guion, el texto en pantalla y los tiempos.", "/ig-viral: busca los reels que mejor funcionan en tu nicho, los ordena por cuánto superan el promedio de su cuenta y te explica la fórmula.", "/ig-caption: el caption revisado; te muestra los ~125 caracteres que se ven antes del «más».", "/ig-carousel: una portada que invita a deslizar, el texto de cada lámina y los archivos en 1080×1350.", "/ig-story: la secuencia de stories del día y qué sticker usar para cada cosa.", "/ig-profile: le pone puntaje a tu perfil sobre 100 y reescribe primero lo que más resta.", "/ig-plan: la semana: qué publicar, en qué formato, cuándo y con qué 10 cuentas interactuar.", "/ig-comment: comentarios para publicaciones de otros, según el tipo de post. Nunca «🔥🔥🔥».", "/ig-reply: ordena los comentarios de tus posts y responde por prioridad.", "/ig-dm: el mensaje de la palabra clave, el primer mensaje, la propuesta de colaboración y dos seguimientos.", "/ig-human: el humanizador. Saca rayas largas, palabras típicas de IA y caracteres invisibles, y pasa el texto por cinco controles.", "/ig-repurpose: un video, podcast o newsletter convertido en una semana de reels y carruseles.", "/ig-audit: revisa lo que ya publicaste y lo ordena por cuánto se destacó y cuánto se compartió."]}, {"h": "La favorita: lo que funciona en tu nicho", "prompts": [{"t": "De lo que funciona a tus guiones", "c": "/ig-viral Buscá los reels que mejor funcionan en las últimas semanas en mi nicho [NICHO]. Explicame por qué funcion

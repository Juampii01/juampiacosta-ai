<script>var GUIA = {"slug": "instagram-skills-claude", "post": "INSTAGRAM", "t": "Claude te ayuda con tu Instagram: la guía completa de las skills", "d": "Reels con 26 fórmulas de gancho con puntaje, lo que funciona en tu nicho, captions, carruseles, stories, perfil, plan semanal, comentarios, mensajes y un humanizador. Gratis y de código abierto.", "tema": "Contenido y redes", "min": 8, "fichaNombre": "instagram-agent-skill", "ficha": [["Qué es", "Un paquete gratis de 13 skills para Claude que te ayuda con tu Instagram: reels, captions, carruseles, stories, perfil y más."], ["Necesitas", "Claude Code o la pestaña Code de la app de escritorio. Sin eso funciona a medias."], ["Cuánto cuesta", "El paquete es gratis (licencia MIT). Para la versión completa, Claude Code (planes pagos)."], ["Qué no hace", "No publica ni se conecta a tu cuenta: tú decides y publicas."], ["Repo", "github.com/Jakeschincariol/instagram-agent-skill"]], "secciones": [{"h": "Qué es", "p": ["instagram-agent-skill es un paquete de 13 skills para Claude que hace el trabajo pesado de tu perfil y tu contenido. Es gratis, con licencia MIT, y no te pide registrarte, una clave de API ni conectar tu cuenta.", "Importante: no publica nada. Las skills escriben; tú decides y publicas."]}, {"h": "Instálalo en un minuto", "p": ["Pega esto en Claude Code (o en la pestaña Code de la app de escritorio):"], "prompts": [{"t": "Instalar", "c": "https://github.com/Jakeschincariol/instagram-agent-skill\n\nInstala esta skill y después comprueba que /ig-reel funcione."}], "lista": ["Como plugin, dentro de Claude Code: /plugin marketplace add Jakeschincariol/instagram-agent-skill y después /plugin install instagram-agent@instagram-agent-skill. Instalado así, los comandos llevan el nombre del plugin adelante: /instagram-agent:ig-reel en lugar de /ig-reel.", "A mano, en la terminal: git clone https://github.com/Jakeschincariol/instagram-agent-skill.git y después cp -r instagram-agent-skill/skills/ig-* ~/.claude/skills/"], "aviso": "Sin Claude Code funciona a medias: pegas el SKILL.md de una skill al principio de un chat, pero pierdes las herramientas que puntúan ganchos, miden tiempos y humanizan."}, {"h": "Primero, tu voz", "p": ["Todas las skills leen un archivo, voice.md, con tu forma de hablar. Diez minutos aquí cambian todo lo demás."], "prompts": [{"t": "Tu voice.md", "c": "Te paso 3 reels míos (o sus transcripciones). Con eso, escribe mi voice.md con la plantilla del paquete de Instagram (templates/voice.md): cómo hablo, las frases que uso, lo que nunca diría y mi ritmo. Guárdalo en ~/.claude/instagram/voice.md."}]}, {"h": "Las 13 funciones", "lista": ["/ig-reel: de una idea a un reel. Tres ganchos con 26 fórmulas, con puntaje, más el guion, el texto en pantalla y los tiempos.", "/ig-viral: mira los reels que mejor funcionan en tu nicho, los ordena por cuánto superan la mediana de su propia cuenta y te explica la fórmula. Para ir a mirarlos necesita un navegador conectado a la sesión (Claude in Chrome, el navegador de la app o computer use); si no tienes, le pasas tú las cuentas y los números.", "/ig-caption: el caption revisado; te muestra los ~125 caracteres que se ven antes del «más».", "/ig-carousel: una portada que invita a deslizar, el texto de cada lámina y los archivos en 1080×1350.", "/ig-story: la secuencia de stories del día y qué sticker usar para cada cosa.", "/ig-profile: le pone puntaje a tu perfil sobre 100 y reescribe primero lo que más resta.", "/ig-plan: la semana: qué publicar, en qué formato, cuándo y con qué 10 cuentas interactuar.", "/ig-comment: comentarios para publicaciones de otros, según el tipo de post. Nunca «🔥🔥🔥».", "/ig-reply: ordena los comentarios de tus posts y responde por prioridad.", "/ig-dm: el mensaje de la palabra clave, el primer mensaje, la propuesta de colaboración y dos seguimientos.", "/ig-human: el humanizador. Saca rayas largas, palabras típicas de IA y caracteres invisibles, y pasa el texto por cinco controles.", "/ig-repurpose: un video, podcast o newsletter convertido en una semana de reels y carruseles.", "/ig-audit: revisa lo que ya publicaste y lo ordena por cuánto se destacó y cuánto se compartió."]}, {"h": "La favorita: lo que funciona en tu nicho", "prompts": [{"t": "De lo que funciona a tus guiones", "c": "/ig-viral Busca los reels que mejor funcionan en las últimas semanas en mi nicho [NICHO]. Explícame por qué funcionaron y convierte los 3 mejores en guiones míos con /ig-reel y mi voice.md. Usa la estructura, no las frases."}]}, {"h": "Una semana con las skills", "pasos": ["Lunes: /ig-plan para la semana.", "Cada pieza: /ig-reel o /ig-carousel, después /ig-caption y /ig-human.", "Todos los días: /ig-story y /ig-reply.", "Fin de semana: /ig-audit para ver qué se destacó.", "Una vez por mes: /ig-profile."]}, {"h": "Lo que conviene saber", "lista": ["El puntaje del gancho orienta, no predice: uno bajo es motivo para revisar y uno alto no garantiza nada.", "No se publica nada sin tu sí.", "Las herramientas corren en tu computadora, sobre tu texto: no suben nada.", "Es un proyecto de terceros: revisa lo que instalas."]}], "faq": [{"q": "¿Cuesta algo?", "a": "El paquete es gratis. Para la versión completa necesitas Claude Code (planes pagos)."}, {"q": "¿Se conecta a mi cuenta de Instagram?", "a": "No. Trabaja con lo que le pasas y con información pública."}, {"q": "¿Sirve en español?", "a": "Sí: escribe con tu voz si tu voice.md está en español y se lo pides así. Ojo con las herramientas que corren por detrás: están armadas para inglés. El puntaje del gancho busca palabras en inglés y la lista de frases típicas de IA del humanizador también está en inglés. En español, toma el puntaje como referencia mínima y revisa tú lo que suena a máquina."}], "usos": [{"e": "Reels", "c": "rosa", "t": "De una idea a un reel", "d": "Tres ganchos con puntaje, armados con 26 fórmulas."}, {"e": "Viral", "c": "naranja", "t": "Lo que funciona en tu nicho", "d": "/ig-viral ordena los mejores reels."}, {"e": "Carruseles", "c": "azul", "t": "Portada y láminas", "d": "/ig-carousel con el texto de cada una."}, {"e": "Semana", "c": "verde", "t": "Plan y stories", "d": "/ig-plan para la semana y /ig-story todos los días."}], "fuentes": ["https://github.com/Jakeschincariol/instagram-agent-skill", "https://code.claude.com/docs/en/discover-plugins", "https://code.claude.com/docs/en/skills", "https://github.com/Jakeschincariol/instagram-agent-skill/blob/main/skills/ig-viral/SKILL.md", "https://github.com/Jakeschincariol/instagram-agent-skill/blob/main/skills/ig-human/slop.json"], "ejemplo": {"titulo": "Ejemplo resuelto: una nutricionista que arma su semana de Instagram con las skills", "negocio": "Ejemplo inventado: una nutricionista independiente en Montevideo que atiende online y en un consultorio compartido de Pocitos. Maneja sola su Instagram y vende consultas de seguimiento.", "punto_de_partida": "Publica cuando se acuerda, los ganchos le salen todos parecidos y los captions se cortan justo antes de lo importante.", "pasos": ["Instaló el paquete a mano en Claude Code (git clone y la copia de las carpetas ig-* a ~/.claude/skills/), así los comandos quedaron como /ig-reel sin prefijo.", "Le pasó a Claude tres transcripciones de reels suyos con el prompt de voice.md. Revisó el resultado con el voice.md de ejemplo del kit al lado y sumó lo que faltaba: las palabras que nunca usa (detox, superalimento) y que no promete resultados.", "Corrió /ig-profile con su bio y sus destacados. Cambió primero el campo de nombre, que era lo que más puntos le restaba.", "El lunes pegó el prompt de /ig-plan del pack del kit con sus horas reales: dos reels y un carrusel.", "Para cada reel usó /ig-reel. Descartó el gancho que salió con puntaje bajo y grabó el mejor de los otros dos. Pasó el caption por /ig-caption y vio que la primera línea se cortaba a mitad de frase: la acortó.", "Antes de publicar pasó todo por /ig-human. Revisó a mano los cambios que marcó como estructura repetida.", "Todos los días usó /ig-story con lo que pasó en consulta (sin datos de pacientes) y /ig-reply con los comentarios del último post.", "El domingo pegó en /ig-audit capturas de las estadísticas de la semana y anotó qué formato repetir."], "resultado": "Quedó una rutina semanal con un voice.md que todas las skills leen, un plan cada lunes y un control fijo antes de publicar (caption y humanizador). Ella decide y publica cada pieza."}, "si_falla": [{"sintoma": "Escribes /ig-reel y Claude Code no lo reconoce.", "solucion": "Si instalaste como plugin, el comando es /instagram-agent:ig-reel. Escribe / y busca instagram-agent en la lista. Si copiaste a mano, confirma que existan las carpetas en ~/.claude/skills/ (por ejemplo ~/.claude/skills/ig-reel/SKILL.md)."}, {"sintoma": "El cp de la instalación a mano da \"No such file or directory\".", "solucion": "La carpeta de skills todavía no existe. Créala con mkdir -p ~/.claude/skills y repite el cp. Si es la primera carpeta de skills que creas con Claude Code abierto, corre /reload-skills o reinicia la sesión."}, {"sintoma": "/plugin install instagram-agent dice que no encuentra el plugin.", "solucion": "Primero tiene que estar agregado el marketplace: /plugin marketplace add Jakeschincariol/instagram-agent-skill. Después instala con el nombre completo: /plugin install instagram-agent@instagram-agent-skill."}, {"sintoma": "Las skills escriben con otra voz o en inglés.", "solucion": "No encuentran tu voice.md. Tiene que estar en ~/.claude/instagram/voice.md. Pídele a Claude que lo lea y te resuma tu voz antes de escribir, y aclara en el pedido que responda en español rioplatense."}, {"sintoma": "En Windows, al correr una herramienta del paquete aparece la Microsoft Store o \"python3 no se reconoce\".", "solucion": "Las herramientas son scripts de Python 3. Instala Python desde python.org (marca Add python.exe to PATH) y pídele a Claude que use python en lugar de python3 si hace falta."}], "kit": [{"archivo": "voice-md-ejemplo-instagram-nutricionista.md", "que_es": "Un voice.md completo de ejemplo, en español y con voseo, para ver cómo queda bien hecho. Reemplaza los datos con los tuyos y guárdalo en ~/.claude/instagram/voice.md.", "contenido": "# voice.md de ejemplo (Instagram, en español)\n\nEjemplo inventado para que veas cómo queda un voice.md bien completo. Copia la estructura, borra los datos de ejemplo y pon los tuyos. Guárdalo en ~/.claude/instagram/voice.md, que es donde lo buscan las skills del paquete.\n\n## Quién soy\n\n- Nombre: Lucía (ejemplo)\n- Usuario: @[TU_USUARIO]\n- Qué hago, en una frase: soy nutricionista y ayudo a gente que trabaja todo el día sentada a comer mejor sin hacer dieta.\n- A quién le hablo: empleados de oficina y freelancers de 25 a 45 años que almuerzan frente a la computadora. No a deportistas ni a gente que quiere bajar mucho de peso rápido.\n- Qué vendo: consultas online de seguimiento y una guía de viandas para la semana.\n\n## Cómo hablo\n\n- Tres textos míos que suenan a mí: [PEGA AQUÍ 3 CAPTIONS O TRANSCRIPCIONES DE REELS TUYOS]\n- Frente a cámara soy: tranquila, con humor seco, sin gritar.\n- Trato: tú. Nunca \"ustedes\" ni \"chicos\".\n- Palabras que uso: vianda, picoteo, \"no hace falta\", \"prueba esto\", \"lo vi mil veces en consulta\".\n- Palabras que nunca diría: superalimento, detox, quemar grasa, \"mindset\", \"transforma tu vida\", \"hack\".\n- Malas palabras: no.\n- Emojis en el caption: como mucho uno, al final.\n- Cara en cámara: siempre.\n- Ritmo: frases cortas. Si me cronometré leyendo un guion: [PALABRAS POR MINUTO].\n\n## Lo que pienso (y no todos piensan)\n\n1. Contar calorías no le sirve a la mayoría de mis pacientes.\n2. Un almuerzo armado el domingo vale más que cualquier suplemento.\n3. Comer frente a la computadora no es el problema; lo que hay en el plato, sí.\n\n## Lo que puedo contar y lo que no\n\n- Puedo contar: situaciones típicas de consulta, sin nombres ni datos que identifiquen a nadie.\n- No puedo: prometer resultados, hablar de casos clínicos con detalle, recomendar medicación.\n- Números: solo los que yo te pase. Si falta uno, deja {{dato}} y avísame.\n\n## Llamados a la acción que uso\n\n- Comenta VIANDA y te mando la guía por mensaje.\n- Guárdalo para el domingo.\n\n## Ejemplos de lo que NO quiero\n\n- \"¡¡Esto te va a cambiar la vida!!\"\n- Listas con emojis al principio de cada línea.\n- Ganchos que arrancan con \"Hola, chicos\".\n"}, {"archivo": "prompts-semana-instagram-agent.md", "que_es": "Pack de prompts para la semana completa (perfil, plan, reels, carruseles, captions, stories, respuestas, auditoría y viral), con la aclaración de cómo se llaman los comandos si instalaste como plugin.", "contenido": "# Pack de prompts: una semana de Instagram con instagram-agent-skill\n\nPrompts listos para pegar en Claude Code con el paquete instalado. Cambia lo que está entre corchetes.\n\nSi lo instalaste como plugin, los comandos llevan el nombre del plugin adelante: en vez de /ig-reel escribe /instagram-agent:ig-reel (lo mismo con todos). Si copiaste las carpetas a ~/.claude/skills/, úsalos tal cual.\n\n## 0. Una sola vez\n\n```\nLee mi voice.md en ~/.claude/instagram/voice.md y dime en cinco líneas cómo entendiste mi forma de hablar. Si falta algo importante, pregúntame antes de escribir nada.\n```\n\n```\n/ig-profile Te paso mi perfil: [PEGA NOMBRE, BIO, LINK, NOMBRES DE DESTACADOS Y LOS 3 POSTS FIJADOS]. Puntualo y reescribe primero lo que más resta. Dame 3 opciones para el campo de nombre.\n```\n\n## 1. Lunes: el plan\n\n```\n/ig-plan Ármame la semana. Tengo [HORAS] horas para Instagram. Puedo grabar [CUÁNTOS] reels y armar [CUÁNTOS] carruseles. Lo que vendo esta semana: [OFERTA]. Responde en español rioplatense.\n```\n\n## 2. Cada pieza\n\n```\n/ig-reel Idea: [IDEA EN UNA FRASE]. Dame los tres ganchos con su puntaje, elige el mejor y explícame por qué. Después el guion con mi voice.md, el texto en pantalla y los tiempos para un reel de [SEGUNDOS] segundos.\n```\n\n```\n/ig-carousel Idea: [IDEA CON PASOS O LISTA]. Quiero entre 6 y 8 láminas. Escribe el texto de cada una y dime qué va en la portada.\n```\n\n```\n/ig-caption Este es el caption: [PEGA]. Muéstrame qué se ve antes del \"más\", revísalo y deja un solo llamado a la acción.\n```\n\n```\n/ig-human Pasa este texto por el humanizador y muéstrame cada cambio: [PEGA]\n```\n\n## 3. Todos los días\n\n```\n/ig-story Hoy pasó esto: [QUÉ PASÓ HOY EN TU NEGOCIO]. Ármame la secuencia de stories y dime qué sticker uso y en qué historia.\n```\n\n```\n/ig-reply Estos son los comentarios del último post: [PEGA]. Ordénalos por prioridad y escribe las respuestas con mi voz. Márcame cuáles conviene seguir por mensaje privado.\n```\n\n## 4. Fin de semana\n\n```\n/ig-audit Te paso los números de mis últimos posts: [PEGA O ADJUNTA CAPTURAS DE LAS ESTADÍSTICAS]. Dime qué se destacó, qué dejo de hacer y qué repito la semana que viene.\n```\n\n## 5. Una vez por mes\n\n```\n/ig-viral Mi nicho es [NICHO] y mi cuenta tiene [SEGUIDORES] seguidores. Proponme entre 6 y 12 cuentas para mirar (de tamaño parecido al mío) y espera mi aprobación. Si no tienes navegador conectado, dime qué datos te paso yo a mano.\n```\n\n## Reglas que conviene repetir\n\n- No inventes números ni resultados. Si falta un dato, deja {{dato}} y avísame.\n- Todo termina en un bloque para copiar. Publico yo.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "publicar-tu-app-y-conectar-tu-dominio", "t": "Publicar tu app y conectar tu dominio", "d": "Conecta tu repositorio de GitHub a Vercel (o Netlify), carga las variables de entorno y pon tu propio dominio.", "tema": "Crea tu app", "min": 10, "secciones": [{"h": "Antes de empezar: tu código en GitHub", "p": ["Vercel y Netlify toman tu código desde un repositorio de GitHub (también aceptan GitLab y Bitbucket). Si todavía no lo subiste, pídeselo a Claude Code."], "prompts": [{"t": "Subir el proyecto a GitHub", "c": "Quiero subir este proyecto a un repositorio nuevo de GitHub llamado [NOMBRE].\nAntes de subir nada:\n1. Revisa que no haya claves, contraseñas ni archivos .env en lo que se va a subir.\n2. Confirma que .gitignore excluye .env, .env.local y node_modules.\n3. Muéstrame la lista de archivos que se van a subir.\nEspera mi OK antes de hacer el push."}]}, {"h": "Publicar en Vercel", "pasos": ["Entra a Vercel y toca New Project.", "Elige tu repositorio de la lista (si no aparece, conecta tu cuenta de GitHub).", "Revisa el Framework Preset (Vercel suele detectarlo solo) y la carpeta raíz.", "Carga las variables de entorno en esa misma pantalla.", "Toca Deploy y espera el link que termina en vercel.app."]}, {"h": "Cada vez que subes cambios", "p": ["Desde ahí, Vercel publica solo. Lo que subas a la rama principal (normalmente main) se convierte en la versión de producción. Lo que subas a cualquier otra rama genera una versión de vista previa, con su propio link, para probar sin tocar lo que ven tus clientes.", "Si algo se rompe en producción, desde el panel tienes Instant Rollback para volver a una versión anterior. En el plan Hobby puedes volver a la inmediatamente anterior. Ojo: después de un rollback, Vercel deja de pasar a producción lo que subes a main. Cuando arreglaste el problema, toca Manage en el recuadro de la versión de producción y promueve la versión buena para que todo vuelva a funcionar como antes."]}, {"h": "Variables de entorno", "lista": ["Dónde: en la configuración del proyecto, sección Environment Variables. También puedes importar un archivo .env.", "Tres ambientes: Production (la versión real), Preview (las vistas previas) y Development (cuando corres la app en tu computadora).", "Cambios: solo se aplican en publicaciones nuevas. Si cambias una variable, vuelve a publicar.", "Ojo con NEXT_PUBLIC_: en Next.js, las variables con ese prefijo quedan metidas en el código que llega al navegador. Nunca le pongas ese prefijo a una clave secreta.", "En tu computadora: con el proyecto vinculado (vercel link), vercel env pull baja las variables de Development a un archivo .env.local, o al archivo que le indiques. Si cambias algo en Vercel, vuelve a correrlo."]}, {"h": "Tu propio dominio", "pasos": ["En el proyecto de Vercel, ve a Settings → Domains y toca Add Domain.", "Escribe tu dominio. Si es el principal (ejemplo.com), Vercel te sugiere sumar también www.", "Vercel te muestra qué registro cargar donde compraste el dominio: un registro A para el dominio principal, o un CNAME para un subdominio (como app.ejemplo.com).", "Cárgalo en el panel de tu proveedor de dominio y espera. Los cambios de DNS pueden tardar en propagarse.", "Cuando Vercel lo verifica, el dominio aparece como listo."], "aviso": "Si eliges cambiar los nameservers en vez de cargar un registro, copia antes tus registros existentes (sobre todo los MX del mail). Si no, puedes dejar de recibir correos."}, {"h": "Si prefieres Netlify", "lista": ["Publicar: en tu equipo de Netlify, Add new project → Import an existing project, eliges el proveedor de Git, autorizas y confirmas con Publish.", "Variables: en Project configuration → Environment variables. Después de crearlas o cambiarlas, hace falta publicar de nuevo.", "Dominio: Domain management → Add a domain → Add a domain you already own, y eliges si usas Netlify DNS o tu proveedor de DNS actual. Si no tienes dominio, también puedes comprar uno en Netlify.", "Desde la terminal: la CLI de Netlify (npm install -g netlify-cli) se conecta con netlify login. netlify deploy publica una versión de borrador (draft) con su propio link para revisar, y netlify deploy --prod publica en la dirección principal."]}], "faq": [{"q": "Vercel no me deja publicar mi repositorio privado", "a": "En el plan Hobby no se puede publicar desde un repositorio privado que pertenece a una organización de GitHub. Si el repositorio es tuyo personal, funciona; si es de una organización, Vercel sugiere hacerlo público o pasar a Pro."}, {"q": "Cambié una variable y la app sigue igual", "a": "Las variables se leen al publicar. Vuelve a publicar el proyecto para que tome el valor nuevo."}, {"q": "¿Tengo que comprar el dominio en Vercel?", "a": "No. Puedes usar uno que ya tengas en cualquier proveedor y cargar los registros que Vercel te indica."}], "fuentes": ["https://vercel.com/docs/git", "https://vercel.com/kb/guide/how-to-add-vercel-environment-variables", "https://vercel.com/docs/domains/add-a-domain", "https://vercel.com/docs/instant-rollback", "https://docs.netlify.com/start/quickstarts/deploy-from-repository", "https://docs.netlify.com/build/environment-variables/get-started/", "https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli", "https://vercel.com/docs/cli/env", "https://vercel.com/docs/environment-variables", "https://vercel.com/docs/domains/working-with-domains/add-a-domain", "https://docs.netlify.com/manage/domains/manage-domains/assign-a-domain-to-your-site-app/", "https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli/"], "ejemplo": {"titulo": "Ejemplo resuelto: la app de un estudio contable sale a internet con su dominio", "negocio": "Ejemplo inventado: un estudio contable en la Quinta Sección, Mendoza, con dos contadoras y una administrativa. Armaron con Claude Code una app donde los clientes suben sus comprobantes del mes. El estudio ya tiene un dominio propio con el que usan el mail.", "punto_de_partida": "La app funciona en la computadora de una de las contadoras, con Supabase de fondo. Nunca se subió a GitHub y el dominio hoy solo se usa para el correo.", "pasos": ["Le pidió a Claude la skill preparar-publicacion del kit. Encontró que la clave secreta de Supabase estaba pegada en un archivo de prueba: la sacaron del código, la rotaron en Supabase y la pasaron a una variable de entorno.", "Con el prompt Subir el proyecto a GitHub, revisó la lista de archivos y dio el OK. El repositorio quedó en su cuenta personal de GitHub, porque en el plan Hobby de Vercel no se puede publicar un repositorio privado de una organización.", "En Vercel tocó New Project, eligió el repositorio, confirmó el Framework Preset y cargó las variables de la tabla que armó la skill: la URL y la clave publicable para todos los ambientes, la secreta solo para Production y Preview.", "Tocó Deploy y probó la app en el link que termina en vercel.app con una cuenta de cliente de prueba.", "Antes de tocar el dominio completó la planilla de DNS del kit y copió los registros MX y TXT del mail.", "En Settings → Domains agregó app.[dominio del estudio], un subdominio, para no tocar el sitio principal. Vercel le mostró un CNAME propio del proyecto y lo cargó en el panel del proveedor del dominio. Los MX quedaron como estaban.", "Cuando Vercel marcó el dominio como listo, abrió la app con HTTPS y se mandó un mail desde otra cuenta para confirmar que el correo seguía llegando.", "Agregó la dirección nueva en la configuración de URL de Auth de Supabase para que el login vuelva a la app y no a localhost.", "Para los cambios siguientes trabaja en una rama aparte, revisa el link de vista previa y recién después pasa los cambios a main."], "resultado": "Quedó la app publicada en un subdominio del estudio, con las claves en las variables de entorno de Vercel y el correo funcionando igual que antes. Cada cambio pasa primero por una vista previa antes de llegar a los clientes."}, "si_falla": [{"sintoma": "Hiciste un Instant Rollback, subiste el arreglo a main y producción sigue mostrando la versión vieja.", "solucion": "Es el comportamiento esperado: después de un rollback Vercel deja de asignar producción automáticamente. En la página del proyecto, toca Manage en el recuadro de la versión de producción, elige la versión nueva y confirma. Desde la terminal es vercel promote con la dirección o el id de esa versión."}, {"sintoma": "Vercel no publica los commits de tu repositorio privado o te sugiere pasar a Pro.", "solucion": "En un equipo Hobby no se puede publicar desde un repositorio privado de una organización de GitHub, y el autor del commit tiene que ser el dueño del equipo. Opciones: mover el repositorio a tu cuenta personal, hacerlo público o pasar el proyecto a un equipo Pro."}, {"sintoma": "Cambiaste una variable en Vercel o Netlify y la app sigue igual, o una variable NEXT_PUBLIC_ aparece undefined en el navegador.", "solucion": "Las variables se aplican en la próxima publicación: vuelve a publicar. Si es NEXT_PUBLIC_, Next.js la mete en el código al construir: tiene que estar cargada para ese ambiente antes de la build y tu código la tiene que leer con el nombre completo, no armándolo dinámicamente."}, {"sintoma": "El dominio aparece como mal configurado en Vercel aunque cargaste el registro.", "solucion": "Busca registros A, AAAA o CNAME viejos con el mismo nombre en tu proveedor y borra los que chocan. Usa exactamente el valor que Vercel te muestra para tu proyecto, no el de otro proyecto ni uno copiado de internet. Los cambios de DNS pueden tardar en propagarse."}, {"sintoma": "Después de cambiar los nameservers dejó de llegar el mail.", "solucion": "Faltan los registros del correo en el nuevo DNS. Vuelve a cargar los MX y los TXT que copiaste en la planilla, o vuelve a los nameservers anteriores mientras tanto. Para la próxima, el camino de cambiar solo el registro del sitio no toca el mail."}], "kit": [{"archivo": "preparar-publicacion/SKILL.md", "que_es": "Skill que revisa el proyecto antes de subirlo a GitHub y publicarlo: claves expuestas, build local y la tabla de variables de entorno por ambiente. Guárdala en .claude/skills/preparar-publicacion/ o súbela como ZIP a Claude.", "contenido": "---\nname: preparar-publicacion\ndescription: 'Revisa un proyecto antes de subirlo a GitHub y publicarlo en Vercel o Netlify: variables por ambiente y claves expuestas, sin push ni deploy. Úsala al pedir publicar o pasar a producción.'\n---\n\n# Preparar la publicación\n\nRevisas y preparas. No haces push, no publicas y no cambias variables en el hosting sin el OK del usuario.\n\n## 1. Lo que se va a subir\n\n- Confirma que .gitignore excluye .env, .env.local, .env*.local, node_modules y la carpeta de build del framework.\n- Busca claves en los archivos que se van a subir: textos que empiecen con sk_live_, sk_test_, sb_secret_, whsec_, APP_USR- o que se llamen SECRET, TOKEN o PASSWORD con un valor pegado. Si encuentras una, frena y avisa: hay que sacarla del código y rotarla.\n- Revisa con git log si alguna vez se subió un .env. Si pasó, avisa que la clave hay que rotarla aunque el archivo ya no esté.\n- Muestra la lista de archivos que se van a subir y espera el OK.\n\n## 2. La build\n\n- Corre la build local con el comando del proyecto (por ejemplo npm run build) y reporta errores antes de publicar. El hosting va a fallar en el mismo lugar.\n- Anota el framework, la carpeta raíz si no es la raíz del repo y el comando de build, para revisar el Framework Preset en Vercel o la configuración en Netlify.\n\n## 3. Variables de entorno\n\nArma una tabla con: nombre, para qué sirve, si es pública o secreta, y en qué ambientes va (Production, Preview, Development en Vercel; deploy contexts en Netlify).\n\nReglas:\n- Una variable secreta nunca lleva el prefijo NEXT_PUBLIC_ (ni VITE_ o PUBLIC_ según el framework): esos prefijos la meten en el código que llega al navegador.\n- Las claves de prueba van en Preview y Development; las de producción, solo en Production.\n- No escribas los valores. Di el nombre y dónde se copia cada uno.\n- Recuerda que un cambio de variable se aplica en la próxima publicación: hay que volver a publicar.\n\n## 4. Lo que el usuario hace a mano\n\nTermina con los pasos que no puedes hacer tú: crear el proyecto en el hosting, pegar los valores, conectar el dominio y cargar los registros DNS en su proveedor.\n"}, {"archivo": "planilla-dns-antes-de-conectar-dominio.md", "que_es": "Planilla para copiar tus registros DNS actuales, elegir cómo conectar el dominio sin romper el mail y comprobar que todo quedó bien.", "contenido": "# Planilla de DNS antes de conectar tu dominio\n\nComplétala antes de tocar nada en el panel donde compraste el dominio. Si algo sale mal, con esta planilla vuelves todo a como estaba.\n\n## Datos del dominio\n\n- Dominio: [ejemplo.com]\n- Dónde lo compré: [proveedor]\n- Quién maneja los DNS hoy: [el mismo proveedor / otro servicio]\n- Nameservers actuales: [copiarlos tal cual]\n- Fecha de esta copia: [fecha]\n\n## Registros que existen hoy\n\nCopia todos, uno por fila, aunque no sepas para qué son.\n\n| Tipo | Nombre | Valor | Prioridad (solo MX) | Para qué es |\n|---|---|---|---|---|\n| A | @ | | | Sitio actual |\n| CNAME | www | | | Sitio actual |\n| MX | @ | | | Mail |\n| TXT | @ | | | Verificaciones (mail, Google, etc.) |\n| | | | | |\n\nLos MX y los TXT del mail son los que más se pierden. Si los borras, el correo deja de llegar.\n\n## Qué voy a cambiar\n\nElige un solo camino:\n\n**Camino A, recomendado si ya tienes mail con ese dominio: cambiar solo los registros del sitio.**\n\n| Tipo | Nombre | Valor nuevo (copiado del hosting) |\n|---|---|---|\n| A | @ | [valor que muestra Vercel o Netlify para tu proyecto] |\n| CNAME | www | [valor que muestra el hosting para tu proyecto] |\n\nNo toques MX ni TXT.\n\n**Camino B: cambiar los nameservers al hosting.**\n\n- [ ] Copié todos los registros de arriba en el panel de DNS del hosting antes de cambiar los nameservers.\n- [ ] Nameservers nuevos: [copiarlos del hosting]\n\n## Después del cambio\n\n- [ ] El hosting muestra el dominio como configurado.\n- [ ] El sitio abre con y sin www.\n- [ ] Me mandé un mail desde otra cuenta y llegó.\n- [ ] El candado de HTTPS aparece en el navegador.\n\nLos cambios de DNS pueden tardar en verse. Si después de un rato el hosting sigue marcando error, compara registro por registro con lo que te pide, buscando registros A, AAAA o CNAME viejos para el mismo nombre.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

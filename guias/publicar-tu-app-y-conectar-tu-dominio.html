 variable y la app sigue igual", "a": "Las variables se leen al publicar. Volvé a publicar el proyecto para que tome el valor nuevo."}, {"q": "¿Tengo que comprar el dominio en Vercel?", "a": "No. Podés usar uno que ya tengas en cualquier proveedor y cargar los registros que Vercel te indica."}], "fuentes": ["https://vercel.com/docs/git", "https://vercel.com/kb/guide/how-to-add-vercel-environment-variables", "https://vercel.com/docs/domains/add-a-domain", "https://vercel.com/docs/instant-rollback", "https://docs.netlify.com/start/quickstarts/deploy-from-repository", "https://docs.netlify.com/build/environment-variables/get-started/", "https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli"], "cat": "desarrollo", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-ia-para-tiendas-online", "t": "Sistema con Claude para tiendas online", "d": "Descripciones de productos, atención posventa, reseñas y reportes semanales: el sistema para una tienda online, con el conector oficial de Shopify si la tienda está ahí.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Tiendas online", "ficha": [["Qué es", "Un asistente con el catálogo y las políticas de la tienda para escribir, atender y mirar números."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No hace reintegros ni cancela pedidos. Con el conector de Shopify, eso está bloqueado aunque des permiso de escritura."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Fichas de producto: títulos, descripciones y medidas para cada artículo nuevo.", "Posventa: \"¿dónde está mi pedido?\", cambios, talles y devoluciones.", "Reseñas y preguntas en la tienda o en redes.", "Promociones: armar el descuento de la semana y comunicarlo.", "Mirar números: qué se vendió, qué no rota y qué falta reponer.", "Mails a la base de clientes."]}, {"h": "El sistema", "lista": ["Proyecto \"Tienda\": catálogo, guía de talles, políticas de envío, cambios y devoluciones, y tono de la marca.", "Skill de ficha de producto: convierte los datos del proveedor y una descripción de las fotos en una ficha clara, con las medidas en el formato de la tienda.", "Skill de posventa: responde consultas con las políticas y deriva a una persona los reclamos, reintegros y casos raros.", "Skill de reporte semanal: resume ventas, productos que no se mueven y stock bajo, con preguntas para decidir.", "Conectores: si la tienda está en Shopify, el conector oficial de Shopify para Claude. Además, Gmail para borradores de posventa y Google Drive para planillas.", "Automatización: una tarea programada que el lunes arma el reporte de la semana anterior."], "aviso": "Según la ayuda de Shopify, el conector lee pedidos, clientes y analíticas sin cambiarlos, y solo escribe (productos, colecciones, inventario, descuentos de porcentaje, cambios de tema sin publicar) si apruebas el acceso de escritura. Reintegros, cancelar o capturar pedidos, marcarlos como pagados, devoluciones y tarjetas de regalo están bloqueados, igual que cambiar el plan, los pagos, los impuestos o los dominios. Si la tienda está en otra plataforma, busca en el directorio de conectores antes de prometer nada."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Ficha de producto", "c": "Datos del proveedor: [PEGA].\nFotos: [DESCRIBE CADA FOTO EN UNA LÍNEA].\nArma la ficha con el tono de la tienda:\n1. Título de hasta 60 caracteres, con lo que la gente busca.\n2. Descripción de 80 a 120 palabras: para quién es, cómo se usa, de qué está hecho.\n3. Lista de medidas y materiales.\n4. Tres preguntas frecuentes con respuesta.\nNo inventes materiales ni medidas. Lo que falte, ponlo como FALTA DATO."}, {"t": "Respuesta de posventa", "c": "Mensaje del cliente: [PEGA].\nEstado del pedido: [ESTADO, SI LO TIENES].\nResponde con las políticas del Proyecto, en voseo y en no más de 6 líneas.\nSi pide reintegro, cancelación o algo fuera de la política, no lo resuelvas: escribe una respuesta que diga que lo revisa una persona hoy y márcalo como DERIVAR."}, {"t": "Reporte semanal de la tienda", "c": "Con Shopify, revisa los pedidos de los últimos 7 días (solo lectura). Haz las consultas de a una y cortas, y si hay más de 50 pedidos, tráelos por tandas hasta tener todos.\nÁrmame:\n1. Total de pedidos y productos más vendidos.\n2. Productos con stock bajo según el inventario.\n3. Productos que no tuvieron ventas en los últimos 30 días (para esto mira los pedidos de 30 días, no solo los de esta semana).\n4. Tres preguntas que debería hacerme esta semana.\nNo cambies nada en la tienda."}]}, {"h": "Cómo instalarlo", "pasos": ["Junta las políticas, la guía de talles y 5 fichas que el dueño considere buenas.", "Arma el Proyecto \"Tienda\" y prueba la skill de fichas con 10 productos reales.", "Si es Shopify, instala el conector desde Claude (Customize → Connectors, no desde la tienda de apps de Shopify), en un navegador de computadora. Claude te manda al admin de Shopify para aprobar el nivel de acceso que pide; si después necesita más, Shopify te lo vuelve a preguntar. Un nivel ya aprobado no se puede bajar sin desinstalar y volver a instalar, así que conéctalo con un usuario de staff que tenga solo los permisos que quieres darle a Claude.", "Prueba la skill de posventa con mensajes reales de la última semana.", "Convierte los prompts en skills (cada una en su carpeta con SKILL.md, comprimida en ZIP) y súbelas en Customize → Skills, con +, + Create skill y Upload a skill. Conecta Gmail y Drive desde Customize → Connectors y programa el reporte de los lunes en Cowork (Scheduled, New task, frecuencia semanal). La tarea usa los conectores que tengas configurados: prueba antes el prompt a mano en un chat.", "Cuando el dueño confíe, evalúa juntos si dar permiso de escritura para productos, siempre aprobando cada cambio."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para tiendas online. Vi tu tienda y me imagino que subir productos y contestar posventa se lleva buena parte de la semana.\nLo que hago es dejarte un asistente que conoce tu catálogo y tus políticas: te arma las fichas, te prepara las respuestas y los lunes te deja un resumen de lo que se vendió y lo que falta. Tú apruebas todo lo que cambia en la tienda.\n¿Te muestro cómo quedaría la ficha de un producto tuyo?"}], "lista": ["Argumento central: \"Subes productos más rápido, los clientes reciben respuestas parejas y el lunes sabes qué reponer sin abrir diez pantallas.\"", "Muestra el reporte con datos reales de su tienda en solo lectura: es lo que más convence y no toca nada."]}, {"h": "Cuidados del rubro", "lista": ["Datos de clientes: el conector puede leer clientes y pedidos. Pide solo lo necesario y no copies esos datos a otros lados.", "Publicidad: precios, descuentos y características tienen que ser reales. Cuidado con frases como \"el mejor\" o promesas de resultados.", "Cambios en la tienda: con acceso de escritura, que cada cambio lo apruebe una persona. Los cambios en lote van de a uno y pueden cortarse a la mitad."], "aviso": "Revisa siempre lo que Claude propone antes de aprobar un cambio en la tienda, y cuida los datos de clientes según las leyes de cada país."}], "faq": [{"q": "¿El conector de Shopify tiene costo extra?", "a": "Según la ayuda de Shopify, no hay cargo extra de Shopify por usar el conector; aplica el plan normal de la tienda y lo que pagues de Claude."}, {"q": "¿Y si la tienda no está en Shopify?", "a": "El sistema funciona igual con planillas exportadas. Antes de prometer una conexión directa, busca si la plataforma tiene conector en el directorio de Claude."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude", "https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/authorizing-access", "https://claude.com/marketplace/connectors/shopify", "https://support.claude.com/en/articles/12512198-how-to-create-custom-skills"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en una tienda de mates en Shopify", "negocio": "Ejemplo inventado: una marca de mates, termos y bombillas de La Dinero que vende por su tienda en Shopify y por Instagram. La llevan la dueña y un ayudante que arma los envíos.", "punto_de_partida": "Cada producto nuevo queda días sin cargar porque escribir la ficha lleva tiempo. Las preguntas de posventa se contestan distinto según quién atiende, y la dueña se entera de qué falta reponer cuando un cliente lo pide.", "pasos": ["En la demo, la persona que lo instaló pegó los datos del proveedor de un termo nuevo y describió las tres fotos. Con el prompt de ficha salió el título, la descripción, las medidas pasadas a mililitros y centímetros, y una lista FALTA DATO con el material de la tapa, que el proveedor no decía.", "Juntó con la dueña las políticas de envío y cambios, la guía de medidas de los termos y cinco fichas que le gustaban. Creó el Proyecto privado \"Tienda\" con las instrucciones del kit y completó con ella la tabla de posventa.", "Prendió Code execution and file creation en Settings → Capabilities. Probó el prompt de fichas con diez productos reales y el de posventa con los mensajes de la última semana. Ajustaron la tabla: los termos que pierden van siempre a DERIVAR.", "Antes de instalar Shopify, la dueña creó en el admin un usuario de staff para Claude, sin permiso para editar productos. Desde Customize → Connectors, en la computadora, instalaron el conector de Shopify con ese usuario y aprobaron el acceso que pedía.", "Probaron en un chat \"¿cuántos pedidos tuve la semana pasada?\" y compararon con el admin. Coincidió. Después pidieron los productos sin ventas en 30 días, pidiendo explícitamente los pedidos de ese período.", "Convirtió el prompt de fichas en la skill ficha-de-producto-tienda del kit y armó otra para posventa. Subió cada carpeta en ZIP desde Customize → Skills. Conectó Gmail y Drive con la cuenta de la tienda.", "Creó la tarea del reporte del kit en Cowork, semanal los lunes, pidiendo aprobación. La primera semana la dueña comparó el total de pedidos con el admin antes de leer el resto.", "Dejaron fecha para evaluar si dan permiso de edición de productos al usuario de Claude. Hasta entonces, las fichas las carga a mano el ayudante."], "resultado": "Quedó un Proyecto con el catálogo y las políticas, dos skills para fichas y posventa, el conector de Shopify con un usuario de permisos acotados y un reporte que cada lunes dice qué se vendió, qué reponer y qué no rota. Reintegros y reclamos siempre los resuelve la dueña."}, "si_falla": [{"sintoma": "Le preguntas por tu tienda y Claude contesta con consejos generales en vez de tus datos.", "solucion": "Nombra Shopify en el pedido (\"con Shopify, ¿cuántos pedidos...?\") y confirma que el conector esté prendido en ese chat, desde el + abajo a la izquierda y Connectors. Si sigue igual, desconéctalo y vuelve a conectarlo desde Customize → Connectors."}, {"sintoma": "Claude sigue pidiendo autorizar una tienda que ya no usas o mezcla datos de dos tiendas.", "solucion": "El conector trabaja con una tienda por vez. Pídele que se conecte a la tienda correcta y empieza una conversación nueva: una conversación vieja puede seguir usando la conexión anterior."}, {"sintoma": "Un cambio en lote (precios o estados de muchos productos) quedó hecho a medias.", "solucion": "El conector hace los cambios de a un producto y una tanda grande puede cortarse. Pídele a Claude la lista de lo que llegó a cambiar, termina el resto desde el admin de Shopify y, la próxima vez, pide los cambios en tandas chicas."}, {"sintoma": "No puedes subir una imagen o un video del producto a través del conector.", "solucion": "Según la ayuda de Shopify, el conector acepta archivos de hasta 20 MB y no admite video ni 3D. Las imágenes tienen que estar en JPEG, PNG, GIF, WebP o HEIC. Achica o convierte la imagen, y carga videos desde el admin."}, {"sintoma": "Al subir la skill aparece un error de formato, de archivo faltante o de caracteres inválidos.", "solucion": "Revisa cuatro cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos en la raíz del ZIP), que la carpeta se llame igual que el name del SKILL.md, que adentro esté el archivo SKILL.md y que la description no pase de 200 caracteres. Evita tildes y signos raros en el name."}], "kit": [{"archivo": "ficha-de-producto-tienda/SKILL.md", "que_es": "Skill que convierte los datos del proveedor y la descripción de las fotos en una ficha completa (título, descripción, medidas, variantes, preguntas y texto alternativo) sin inventar nada. Guárdala en una carpeta ficha-de-producto-tienda, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: ficha-de-producto-tienda\ndescription: Convierte datos del proveedor y la descripción de las fotos en una ficha de producto para la tienda online, con medidas en el formato de la tienda y sin inventar. Úsala al cargar un producto nuevo.\n---\n\n# Ficha de producto\n\nConviertes los datos que llegan del proveedor en una ficha lista para revisar y cargar. Nunca la publicas ni la cargas tú, aunque tengas acceso a la tienda, salvo que te lo pidan y lo aprueben.\n\n## Qué te pasan\n\n- Datos del proveedor (pueden venir en otro idioma, en una planilla o con abreviaturas).\n- Una línea por foto describiendo qué se ve.\n- A veces, el producto parecido que ya está en la tienda, para copiar el formato.\n\nBusca en el Proyecto la guía de talles, el formato de medidas y las fichas de ejemplo. Úsalas como molde.\n\n## Qué entregas, en este orden\n\n1. **Título**: hasta 60 caracteres. Qué es, el rasgo que más se busca (material, capacidad, talle) y la variante si hay una sola.\n2. **Descripción**: de 80 a 120 palabras. Para quién es, cómo se usa, de qué está hecho, cómo se cuida. Párrafos cortos.\n3. **Medidas y materiales**: en lista, con las unidades y el formato de la tienda. Si el proveedor da pulgadas u onzas, pásalas a la unidad de la tienda y deja el valor original entre paréntesis.\n4. **Variantes**: color, talle o capacidad, una por línea, tal cual las da el proveedor.\n5. **Preguntas frecuentes**: tres, con respuesta corta, solo sobre lo que está en los datos.\n6. **Texto alternativo de cada foto**: una línea por foto, describiendo el producto.\n7. **FALTA DATO**: lista de todo lo que falta o no coincide.\n\n## Reglas\n\n- No inventes materiales, medidas, capacidad, origen ni garantía. Lo que falte va a FALTA DATO.\n- Si un dato del proveedor contradice la foto (dice \"acero\" y la foto muestra plástico), no elijas: anótalo en FALTA DATO.\n- No uses \"el mejor\", \"único\", \"premium\", \"100% garantizado\" ni signos de exclamación.\n- No pongas precio ni stock: los carga la tienda.\n- No prometas tiempos de envío. Esos están en las políticas.\n- Escribe con el tono de la tienda si está en el Proyecto. Si no, en español rioplatense claro.\n\n## Al final\n\nCierra con: \"Revisa medidas, materiales y variantes antes de cargar.\"\n"}, {"archivo": "proyecto-tienda-online-posventa-y-permisos-shopify.md", "que_es": "Las instrucciones para pegar en el Proyecto \"Tienda\", la tabla de qué se responde y qué se deriva en posventa, y el plan de permisos del conector de Shopify según la ayuda oficial.", "contenido": "# Proyecto \"Tienda\": instrucciones y tabla de posventa\n\nEste archivo tiene el texto para pegar en las instrucciones del Proyecto, la tabla que decide qué responde Claude en posventa y qué deriva, y el plan de permisos del conector de Shopify.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DE LA TIENDA], una tienda online de [QUÉ VENDE] que envía a [ZONAS].\n\nPara qué estás:\n- Armar fichas de productos nuevos.\n- Preparar respuestas de posventa.\n- Proponer respuestas a reseñas y preguntas.\n- Armar el reporte semanal.\n\nReglas que no se rompen:\n1. Responde solo con las políticas y el catálogo de este Proyecto, y con los datos que te dé la tienda. Si algo no está, escribe FALTA DATO.\n2. Todo lo que escribes es un borrador. Lo revisa y lo manda [QUIÉN].\n3. Reintegros, cancelaciones, cambios fuera de plazo, productos dañados, reclamos de pago y amenazas de denuncia: no los resuelvas. Escribe que lo revisa una persona hoy y marca DERIVAR.\n4. No prometas fechas de entrega que no informó el correo o la logística.\n5. Si tienes acceso a la tienda, no cambies nada sin que te lo pidan y lo aprueben. Los reportes son solo de lectura.\n6. No copies datos de clientes (mails, direcciones, teléfonos) a otros documentos ni a respuestas públicas.\n7. Tono: [EJEMPLO: cercano, con voseo, sin exagerar]. Firma como [NOMBRE] de [TIENDA].\n\n## 2. Tabla de posventa (complétala con el dueño)\n\n| Consulta | Ejemplo | Qué hace Claude |\n|---|---|---|\n| Estado del pedido | \"¿Dónde está mi pedido?\" | Responde con el estado que le pasen o que lea en la tienda, y el link de seguimiento si lo hay |\n| Talle o medida | \"¿Me queda el M?\" | Responde con la guía de talles. Si no alcanza, ofrece cambio según la política |\n| Cambio dentro de la política | \"Lo quiero en otro color\" | Explica cómo hacer el cambio según la política |\n| Cambio fuera de plazo | \"Lo compré hace dos meses\" | DERIVAR |\n| Reintegro o cancelación | \"Quiero mi dinero\" | DERIVAR |\n| Producto dañado o incompleto | \"Llegó roto\" | Pide foto por el canal privado y DERIVAR |\n| Reclamo de pago | \"Me cobraron dos veces\" | DERIVAR |\n| [OTRA CONSULTA DE LA TIENDA] | [EJEMPLO] | [QUÉ HACE] |\n\n## 3. Plan de permisos del conector de Shopify\n\n- El conector se instala desde Claude (Customize → Connectors), no desde la tienda de apps de Shopify, y la instalación se hace en un navegador de computadora.\n- Shopify te muestra el nivel de acceso que pide Claude y tú lo apruebas o lo rechazas. Si más adelante Claude necesita más, Shopify te lo vuelve a preguntar.\n- Un nivel ya aprobado no se baja: para reducirlo hay que desinstalar el conector desde el admin de Shopify y volver a instalarlo.\n- El conector no puede hacer más que el usuario que lo autoriza. Conéctalo con un usuario de staff que tenga solo los permisos que quieres darle a Claude.\n- Aunque tenga escritura, no hace reintegros, cancelaciones, devoluciones, tarjetas de regalo ni cambios de plan, pagos, impuestos o dominios.\n- Se conecta una tienda por vez. Si cambias de tienda, empieza una conversación nueva.\n\nDecisión de esta tienda:\n- Desde: [FECHA]. Usuario de staff: [CUÁL]. Permisos del usuario: [CUÁLES].\n- Revisión para evaluar escritura de productos: [FECHA]. Quién aprueba cada cambio: [NOMBRE].\n\n## 4. Otros archivos para el Proyecto\n\n- Políticas de envío, cambios y devoluciones (tal cual están en la web).\n- Guía de talles o de medidas.\n- 5 fichas que al dueño le gusten.\n- Tono de la marca y palabras que no se usan.\n"}, {"archivo": "tarea-programada-reporte-semanal-tienda.md", "que_es": "La tarea programada de los lunes lista para pegar: checklist previa, configuración en Cowork y el prompt de solo lectura que arma el reporte consultando de a una cosa por vez.", "contenido": "# Tarea programada: reporte semanal de la tienda (lunes)\n\nLa tarea lee la tienda y arma el reporte de la semana anterior. No cambia nada en la tienda y no envía nada.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es de la tienda y tiene un plan pago (las tareas programadas están solo en planes pagos).\n- [ ] El conector de Shopify está instalado y autorizado, y en un chat normal Claude responde \"¿cuántos pedidos tuve ayer?\" con datos de la tienda.\n- [ ] Si la tienda no está en Shopify: hay una exportación semanal de pedidos e inventario en una planilla de Google Drive, y el prompt apunta a esa planilla.\n- [ ] Probaste el prompt de abajo a mano en un chat.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral y New task. Elige \"Create with Claude\" y pégale este archivo, o \"Set up manually\" y completa nombre, prompt, modo de aprobación y frecuencia. La tarea usa los conectores que tengas configurados. En la experiencia nueva de Claude también puedes pedirla en una conversación y confirmar con \"Schedule\".\n\nConfiguración sugerida:\n- Nombre: Reporte semanal de la tienda\n- Frecuencia: semanal (weekly), el lunes a primera hora.\n- Aprobación: el modo que pide permiso antes de actuar.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de [NOMBRE DE LA TIENDA]. Usa el conector de Shopify solo para leer. No cambies nada en la tienda.\n\nHaz las consultas de a una y cortas, en este orden:\n\n1. Pedidos de la semana pasada (de lunes a domingo). Si son más de 50, tráelos por tandas hasta tener todos. Cuenta cuántos son.\n2. Los 10 productos con más unidades vendidas en esos pedidos.\n3. Productos con inventario por debajo de [N] unidades.\n4. Productos activos que no tuvieron ventas en los últimos 30 días (para esto mira los pedidos de 30 días, no solo los de esta semana).\n5. Códigos de descuento usados en la semana y en cuántos pedidos.\n\nReglas:\n- Solo lectura. No crees, edites ni borres productos, inventario ni descuentos.\n- No incluyas nombres, mails ni direcciones de clientes en el reporte.\n- Si una consulta no devuelve datos o falla, dilo en el reporte en vez de estimar.\n\nAl final déjame:\n- \"La semana en números\" (tabla con lo de los puntos 1, 2 y 5).\n- \"Para reponer\" (punto 3).\n- \"No rota\" (punto 4).\n- \"Tres preguntas para esta semana\": decisiones concretas que el dueño debería tomar mirando esto.\n\n## Las primeras semanas\n\n- [ ] El dueño compara el total de pedidos con el que ve en el admin de Shopify. Si no coincide, revisa el período o que se hayan traído todas las tandas.\n- [ ] Anota qué preguntas sirvieron y ajusta el prompt.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

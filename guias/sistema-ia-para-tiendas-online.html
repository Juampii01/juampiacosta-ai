egador de computadora, y aprobá solo lectura al principio.", "Probá la skill de posventa con mensajes reales de la última semana.", "Conectá Gmail y Drive y programá el reporte de los lunes.", "Cuando el dueño confíe, evaluá juntos si dar permiso de escritura para productos, siempre aprobando cada cambio."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para tiendas online. Vi tu tienda y me imagino que subir productos y contestar posventa se lleva buena parte de la semana.\nLo que hago es dejarte un asistente que conoce tu catálogo y tus políticas: te arma las fichas, te prepara las respuestas y los lunes te deja un resumen de lo que se vendió y lo que falta. Vos aprobás todo lo que cambia en la tienda.\n¿Te muestro cómo quedaría la ficha de un producto tuyo?"}], "lista": ["Argumento central: \"Subís productos más rápido, los clientes reciben respuestas parejas y el lunes sabés qué reponer sin abrir diez pantallas.\"", "Mostrá el reporte con datos reales de su tienda en solo lectura: es lo que más convence y no toca nada."]}, {"h": "Cuidados del rubro", "lista": ["Datos de clientes: el conector puede leer clientes y pedidos. Pedí solo lo necesario y no copies esos datos a otros lados.", "Publicidad: precios, descuentos y características tienen que ser reales. Cuidado con frases como \"el mejor\" o promesas de resultados.", "Cambios en la tienda: con acceso de escritura, que cada cambio lo apruebe una persona. Los cambios en lote van de a uno y pueden cortarse a la mitad."], "aviso": "Revisá siempre lo que Claude propone antes de aprobar un cambio en la tienda, y cuidá los datos de clientes según las leyes de cada país."}], "faq": [{"q": "¿El conector de Shopify tiene costo extra?", "a": "Según la ayuda de Shopify, no hay cargo extra de Shopify por usar el conector; aplica el plan normal de la tienda y lo que pagues de Claude."}, {"q": "¿Y si la tienda no está en Shopify?", "

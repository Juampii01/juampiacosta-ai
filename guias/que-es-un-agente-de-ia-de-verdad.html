, recibe los resultados y repite hasta terminar. Cada vuelta completa se llama turno."]}, {"h": "Ejemplos simples", "lista": ["Chat alcanza: \"Escribime tres versiones de este mail\". Una sola respuesta y listo.", "Automatización alcanza: \"Cada vez que alguien paga, mandale el comprobante\". El camino es siempre igual.", "Agente sirve: \"Averiguá qué ofrecen mis 5 competidores y compará precios publicados\". No sabés de antemano qué páginas va a tener que abrir ni cuántas búsquedas va a necesitar.", "Agente sirve: \"Revisá los 40 mensajes de esta semana, separá los que quieren comprar y armá un resumen\". Cada mensaje es distinto y hay que decidir caso por caso."]}, {"h": "Cuándo NO hace falta un agente", "lista": ["Los pasos son siempre los mismos: usá una automatización (Make, Zapier, n8n). Es más barata y más predecible.", "Es una tarea de una sola vez: pedíselo a Claude en un chat y listo.", "Un error sale caro y no podés revisar: si el agente manda plata, borra datos o les escribe a clientes sin que vos mires, todavía no está listo.", "No sabés explicar qué es un buen resultado: si vos no podés decir cuándo está bien, el agente tampoco."], "aviso": "Más autonomía también es más riesgo y más consumo. Arrancá con lo mínimo que resuelva el problema."}, {"h": "Probá si tu idea necesita un agente", "prompts": [{"t": "¿Chat, automatización o agente?", "c": "Quiero resolver esto en mi negocio: [DESCRIBÍ LA TAREA EN 3 O 4 LÍNEAS].\nLo hago [CADA CUÁNTO] y hoy me lleva [TIEMPO].\n\nDecime:\n1. Si alcanza con un chat, con una automatización de pasos fijos o si necesita un agente. Explicá por qué en 3 líneas.\n2. Si es un agente: qué objetivo tendría, qué herramientas necesita y en qué momentos tendría que preguntarme antes de seguir.\n3. Qué podría salir mal y cómo lo detectaría yo.\n4. La versión más simple que podría probar esta semana.\nSi te falta información, preguntame antes de responder."}]}], "faq": [{"q": "¿Un Proyecto de Claude con instrucciones ya es un agente?", "a": "No del todo. Es un chat con contexto: responde lo que le pedís. Se acerca a un agente cuando le das herramientas (búsqueda web, conectores) y una tarea con varios pasos que decide solo."}, {"q": "¿Claude Code es un agente?", "a": "Sí. Recibe tu pedido, decide qué archivos leer o qué comandos correr, mira los resultados y sigue hasta terminar, pidiéndote permiso para lo que no habilitaste."}, {"q": "¿Necesito programar para armar uno?", "a": "No para empezar. Con Claude Code y archivos de instrucciones podés armar agentes simples. Programar te sirve si querés meter el agente adentro de tu propia app."}], "fuentes": ["https://code.claude.com/docs/en/agent-sdk/overview", "https://code.claude.com/docs/en/agent-sdk/agent-loop"], "cat": "agentes", "parte": "usalo"};</script>

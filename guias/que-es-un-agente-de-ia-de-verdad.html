<script>var GUIA = {"slug": "que-es-un-agente-de-ia-de-verdad", "t": "Qué es un agente de IA de verdad (y cuándo no te hace falta)", "d": "La diferencia entre un chat, una automatización y un agente, explicada con ejemplos simples. Y la pregunta que te ahorra semanas: ¿esto necesita un agente?", "tema": "Agentes", "min": 7, "fichaNombre": "Agente", "ficha": [["Qué es", "Un sistema que recibe un objetivo, decide los pasos y usa herramientas hasta terminar."], ["Qué lo distingue", "Elige qué hacer después según lo que va encontrando."], ["Qué no es", "Un chat que responde una vez, ni una automatización que sigue siempre el mismo camino."], ["Regla práctica", "Si puedes dibujar todos los pasos de antemano, probablemente no necesitas un agente."]], "secciones": [{"h": "Tres cosas que se confunden", "lista": ["Chat: tú preguntas, Claude responde. Si quieres otro paso, lo pides tú. Tú eres el que decide todo.", "Automatización: una receta fija. \"Cuando llega un formulario, cópialo en la planilla y manda este mail\". Siempre hace lo mismo, en el mismo orden.", "Agente: le das un objetivo y herramientas. Él decide qué paso dar, mira el resultado y decide el siguiente, hasta que termina o se queda sin opciones."], "p": ["La documentación oficial de Anthropic lo define así: un agente es una aplicación que completa una tarea planeando sus propios pasos y usando herramientas que leen archivos, corren comandos o editan código. Y el artículo de Anthropic sobre cómo construir agentes marca la misma diferencia de arriba: en un workflow los pasos están fijados de antemano; en un agente el modelo dirige su propio proceso y elige qué herramienta usar."]}, {"h": "Las cuatro piezas de cualquier agente", "lista": ["Objetivo: qué tiene que lograr y cómo se sabe que terminó. \"Déjame un informe de 5 competidores con sus links\".", "Herramientas: lo que puede usar. Buscar en la web, leer tus archivos, escribir un documento, consultar una app conectada.", "Decisiones: en cada vuelta elige qué herramienta usar según lo que encontró antes.", "Bucle: piensa, actúa, mira el resultado y repite. Termina cuando responde sin pedir más herramientas."], "p": ["Claude Code funciona así: evalúa tu pedido, usa herramientas, recibe los resultados y repite hasta terminar. Cada vuelta completa se llama turno."]}, {"h": "Ejemplos simples", "lista": ["Chat alcanza: \"Escríbeme tres versiones de este mail\". Una sola respuesta y listo.", "Automatización alcanza: \"Cada vez que alguien paga, mándale el comprobante\". El camino es siempre igual.", "Agente sirve: \"Averigua qué ofrecen mis 5 competidores y compara precios publicados\". No sabes de antemano qué páginas va a tener que abrir ni cuántas búsquedas va a necesitar.", "Agente sirve: \"Revisa los 40 mensajes de esta semana, separa los que quieren comprar y arma un resumen\". Cada mensaje es distinto y hay que decidir caso por caso."]}, {"h": "Cuándo NO hace falta un agente", "lista": ["Los pasos son siempre los mismos: usa una automatización (Make, Zapier, n8n). Es más barata y más predecible.", "Es una tarea de una sola vez: pídeselo a Claude en un chat y listo.", "Un error sale caro y no puedes revisar: si el agente manda dinero, borra datos o les escribe a clientes sin que tú mires, todavía no está listo.", "No sabes explicar qué es un buen resultado: si tú no puedes decir cuándo está bien, el agente tampoco."], "aviso": "Más autonomía también es más riesgo y más consumo. Arranca con lo mínimo que resuelva el problema."}, {"h": "Prueba si tu idea necesita un agente", "prompts": [{"t": "¿Chat, automatización o agente?", "c": "Quiero resolver esto en mi negocio: [DESCRIBE LA TAREA EN 3 O 4 LÍNEAS].\nLo hago [CADA CUÁNTO] y hoy me lleva [TIEMPO].\n\nDime:\n1. Si alcanza con un chat, con una automatización de pasos fijos o si necesita un agente. Explica por qué en 3 líneas.\n2. Si es un agente: qué objetivo tendría, qué herramientas necesita y en qué momentos tendría que preguntarme antes de seguir.\n3. Qué podría salir mal y cómo lo detectaría yo.\n4. La versión más simple que podría probar esta semana.\nSi te falta información, pregúntame antes de responder."}]}], "faq": [{"q": "¿Un Proyecto de Claude con instrucciones ya es un agente?", "a": "No del todo. Es un chat con contexto: responde lo que le pides. Se acerca a un agente cuando le das herramientas (búsqueda web, conectores) y una tarea con varios pasos que decide solo."}, {"q": "¿Claude Code es un agente?", "a": "Sí. Recibe tu pedido, decide qué archivos leer o qué comandos correr, mira los resultados y sigue hasta terminar, pidiéndote permiso para lo que no habilitaste."}, {"q": "¿Necesito programar para armar uno?", "a": "No para empezar. Con Claude Code y archivos de instrucciones puedes armar agentes simples. Programar te sirve si quieres meter el agente adentro de tu propia app."}], "fuentes": ["https://code.claude.com/docs/en/agent-sdk/overview", "https://code.claude.com/docs/en/agent-sdk/agent-loop", "https://code.claude.com/docs/en/agent-sdk/overview.md", "https://code.claude.com/docs/en/agent-sdk/agent-loop.md", "https://www.anthropic.com/research/building-effective-agents", "https://code.claude.com/docs/en/permissions"], "ejemplo": {"titulo": "Ejemplo resuelto: una distribuidora decide qué tareas necesitan un agente", "negocio": "Ejemplo inventado: una distribuidora de insumos para panaderías en Godoy Cruz, Mendoza, con seis personas. Venden harinas, levaduras y descartables a panaderías de la zona. Los pedidos entran por WhatsApp y por mail.", "punto_de_partida": "El dueño quería \"un agente de IA para el negocio\" pero no sabía para qué tarea. Tenía tres candidatas: mandar la lista de precios actualizada, mandar el comprobante cuando alguien paga y ordenar los pedidos de la semana.", "pasos": ["Pasó las tres tareas por la checklist del kit, una por una.", "Lista de precios: la actualiza una vez por mes y solo hay que redactar un mail. Le salió chat. Ahora la pega en Claude, pide el mail y lo manda él.", "Comprobante al pagar: los pasos son siempre iguales (llega el pago, se busca el pedido, se manda el comprobante). Le salió automatización. La dejó anotada para armarla en n8n o en la herramienta que ya usa para cobrar.", "Pedidos de la semana: cada mensaje es distinto. Algunos piden productos con otro nombre, otros cambian un pedido anterior, otros solo preguntan. Le salió agente.", "Corrió el prompt de la guía \"¿Chat, automatización o agente?\" con esa tarea. Claude propuso un objetivo (\"dejar una lista de pedidos confirmados, cambios y consultas sin pedido, con el mensaje de origen\"), dos herramientas (leer los chats exportados y escribir un archivo de resumen) y un freno: preguntar cuando un producto no coincide con la lista de precios.", "Probó la versión más simple: exportó los chats de una semana a una carpeta y abrió Claude Code en esa carpeta. Usó el prompt \"Arranque con frenos\" del kit. Claude Code le mostró el plan, pidió permiso para crear el archivo de resumen y frenó dos veces por productos que no reconocía.", "Usó el prompt \"Pedir pruebas, no promesas\" y revisó cada pedido del resumen contra el chat de origen. Anotó los errores y armó con ellos sus casos de prueba para la semana siguiente."], "resultado": "De tres ideas, solo una necesitaba un agente. Las otras dos quedaron resueltas con un chat y con una automatización. El agente de pedidos funciona como borrador: lee, ordena y pregunta, y nadie le manda nada a un cliente sin que el dueño lo revise."}, "si_falla": [{"sintoma": "Claude Code te pide permiso a cada rato y se vuelve lento de usar.", "solucion": "Es lo que hace por defecto con lo que modifica archivos o corre comandos. Con /permissions puedes permitir solo lo que el agente usa siempre (por ejemplo, editar un archivo de salida) y dejar el resto pidiendo permiso. No uses bypassPermissions fuera de un entorno aislado: la documentación lo reserva para contenedores o máquinas virtuales."}, {"sintoma": "Pusiste en CLAUDE.md o en el prompt \"nunca toques este archivo\" y Claude igual intentó editarlo.", "solucion": "Las instrucciones guían lo que Claude intenta, pero los permisos los aplica Claude Code. Si algo no se puede tocar, agrega una regla deny en /permissions o en .claude/settings.json, por ejemplo Edit(/pedidos-originales/**)."}, {"sintoma": "El agente da vueltas, abre páginas de más y nunca termina.", "solucion": "El objetivo no dice cuándo terminó. Reescríbelo con un resultado concreto (\"una tabla con 5 competidores y un link por fila\") y pídele que frene si se traba dos veces. Si lo armas con el Agent SDK, usa max_turns o max_budget_usd para ponerle un techo de pasos o de gasto."}, {"sintoma": "El agente dice que terminó pero falta una parte o hay datos que no salen de ningún lado.", "solucion": "Pídele evidencia de cada parte del objetivo (prompt \"Pedir pruebas, no promesas\" del kit) y que marque lo que no verificó. Revisa dos o tres resultados a mano contra la fuente antes de confiar en el resto."}, {"sintoma": "Quieres armar el agente con el Agent SDK usando tu suscripción de Claude y no te deja.", "solucion": "La documentación del Agent SDK indica autenticarse con una clave de la API, no con el login de claude.ai. Para probar sin programar, usa Claude Code con tu plan; el SDK tiene sentido cuando quieres meter el agente en tu propia app."}], "kit": [{"archivo": "checklist-chat-automatizacion-o-agente.md", "que_es": "Checklist de cinco preguntas que te dice si tu tarea va con chat, con automatización o con un agente, y qué tener listo antes de construirlo.", "contenido": "# ¿Chat, automatización o agente? Checklist de 5 minutos\n\nResponde por sí o por no, en orden. Frena en la primera respuesta que te dé una salida.\n\n## 1. ¿Lo haces una sola vez o muy de vez en cuando?\n\n- Sí → **Chat.** Pídeselo a Claude en una conversación y listo. Si se repite, guarda el prompt.\n- No → sigue.\n\n## 2. ¿Puedes dibujar todos los pasos de antemano, sin \"depende\"?\n\nPrueba escribirlos así: \"Cuando pasa X, haz A, después B, después C\".\n\n- Sí, y nunca cambian → **Automatización** (Make, Zapier, n8n). Es más predecible y más fácil de revisar.\n- Sí, pero en un paso hay que leer o escribir texto (resumir, clasificar, redactar) → **Automatización con un paso de IA.** El camino sigue fijo; Claude solo hace ese paso.\n- No: cada caso pide decidir qué mirar o qué hacer después → sigue.\n\n## 3. ¿Sabes explicar qué es un buen resultado?\n\nEscribe en una línea cómo te das cuenta de que quedó bien.\n\n- No → **Todavía no.** Hazlo a mano o en chat unas veces hasta que puedas escribirlo.\n- Sí → sigue.\n\n## 4. Si sale mal, ¿lo puedes revisar antes de que llegue a alguien?\n\n- No, y el error es caro (dinero, datos borrados, mensajes a clientes) → **Todavía no.** Rediseñalo para que el agente deje borradores y tú apruebes.\n- Sí → sigue.\n\n## 5. ¿Qué herramientas necesita, como mínimo?\n\nMarca solo las imprescindibles:\n\n- [ ] Leer archivos que le paso\n- [ ] Escribir un archivo de salida\n- [ ] Buscar en la web\n- [ ] Leer una app conectada (Drive, Gmail, calendario)\n- [ ] Escribir en una app conectada\n\nSi marcaste \"escribir en una app conectada\", define en qué momentos te tiene que preguntar antes.\n\n→ **Agente.** Arranca con la versión más chica: una tarea, pocas herramientas, salida en borrador.\n\n## Antes de construirlo\n\n- [ ] Tengo el objetivo en una frase que se pueda revisar.\n- [ ] Sé en qué momentos frena y me pregunta.\n- [ ] Tengo 5 a 10 casos de prueba con la respuesta que yo daría.\n- [ ] Sé cómo lo freno si da vueltas (un límite de pasos o de gasto, o lo corto yo).\n- [ ] Siguiente paso: completar la hoja del agente (guía \"Diseña tu agente en una hoja\").\n"}, {"archivo": "prompts-probar-primer-agente.md", "que_es": "Cuatro prompts para probar un agente con frenos: arranque con plan y límites, pedido de evidencia, revisión con casos de prueba y análisis de un error.", "contenido": "# Pack de prompts para probar tu primer agente sin romper nada\n\nSirven en Claude Code o en un chat de Claude con herramientas (búsqueda web, conectores). Reemplaza lo que está entre corchetes.\n\n## 1. Arranque con frenos\n\nÚsalo como primer mensaje de la tarea.\n\n```\nObjetivo: [QUÉ TIENE QUE LOGRAR, EN UNA FRASE].\nTerminaste cuando: [CÓMO SE VE EL RESULTADO TERMINADO].\nPuedes usar: [HERRAMIENTAS O ARCHIVOS PERMITIDOS].\nNo puedes: mandar mensajes, borrar archivos, cambiar [ARCHIVO ORIGINAL] ni comprar nada.\nAntes de empezar, dime en 3 a 5 pasos cómo lo vas a hacer y espera mi OK.\nSi te trabas dos veces en el mismo paso, frena y cuéntame qué pasó.\nAl final, lista qué hiciste, qué archivos tocaste y qué quedó sin resolver.\n```\n\n## 2. Pedir pruebas, no promesas\n\nÚsalo cuando el agente dice \"listo\".\n\n```\nAntes de dar esto por terminado, muéstrame la evidencia de cada parte del objetivo:\nqué archivo, qué búsqueda o qué dato respalda cada afirmación.\nSi algo no lo verificaste, márcalo como NO VERIFICADO en vez de darlo por hecho.\n```\n\n## 3. Revisión de casos de prueba\n\nÚsalo con tus 5 a 10 casos guardados.\n\n```\nTe paso [CANTIDAD] casos de prueba. Para cada uno tienes la entrada y la respuesta que yo daría.\nResuelve cada caso como lo haría el agente, sin mirar mi respuesta.\nDespués compara: en qué casos coincides conmigo, en cuáles no y por qué.\nNo ajustes tus respuestas después de ver las mías.\n\n[PEGA LOS CASOS]\n```\n\n## 4. Post mortem de un error\n\nÚsalo cuando el agente hizo algo que no querías.\n\n```\nEl agente hizo esto: [LO QUE PASÓ].\nEsperaba esto: [LO QUE QUERÍAS].\nEstas son sus instrucciones: [PEGA LAS INSTRUCCIONES].\nDime qué parte de las instrucciones permitió el error y propón una sola regla nueva que lo evite.\nSi el problema es de permisos y no de instrucciones, dilo.\n```\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "make-zapier-o-n8n-cual-elegir", "t": "Make, Zapier o n8n: cuál elegir para tu negocio", "d": "Una comparación honesta de las tres herramientas de automatización más usadas, sin precios que cambian cada mes: qué las diferencia y cómo elegir según tu caso.", "tema": "Conectores y MCP", "min": 9, "fichaNombre": "Make vs Zapier vs n8n", "ficha": [["Qué es", "Tres plataformas para conectar apps y que las tareas pasen solas de una a otra."], ["En común", "Las tres se pueden conectar a Claude con un servidor MCP oficial."], ["Precios", "No los ponemos porque cambian seguido. Mira la página oficial de cada una el día que decidas."]], "secciones": [{"h": "Lo que tienen en común", "p": ["Las tres funcionan igual en lo básico: algo dispara la automatización (llega un mail, se completa un formulario, entra un mensaje) y después corren pasos uno detrás del otro.", "Las tres tienen un servidor MCP oficial, pero no funcionan igual. En Make y en n8n, Claude puede usar tus propias automatizaciones como herramientas: en Make, los escenarios activos con programación on-demand; en n8n, los flujos que marcas como disponibles para MCP. En Zapier, el MCP le da a Claude acciones sueltas de tus apps conectadas (mandar un mail, crear una fila), no tus Zaps, y cada llamada que sale bien usa dos tareas. Lo vas a ver en la sección de herramientas de esta biblioteca."]}, {"h": "Zapier", "p": ["Cada automatización se llama Zap. Es la más directa para empezar: eliges un disparador, sumas acciones y listo."], "lista": ["Cómo cobra: por tareas. Cada acción que se ejecuta bien cuenta como una tarea. Los disparadores no consumen tareas, y tampoco los pasos de filtro ni de formato.", "Para quién: si quieres algo andando hoy y tus flujos son más bien lineales.", "Ojo con: flujos con muchos pasos que corren muy seguido, porque las tareas se suman rápido."]}, {"h": "Make", "p": ["Cada automatización se llama escenario y se arma en un lienzo visual, conectando módulos como si fueran piezas."], "lista": ["Cómo cobra: Make mide la actividad en operaciones y lo que pagas son créditos.", "Para quién: si tus flujos tienen ramas, condiciones o muchos datos que transformar, y te gusta ver todo el mapa.", "Ojo con: si nunca automatizaste nada, el lienzo puede abrumar al principio. Arranca con un escenario de dos o tres módulos."]}, {"h": "n8n", "p": ["Se puede usar en n8n Cloud (lo administran ellos) o instalado en tu propio servidor."], "lista": ["Instalado por ti: tienes control total sobre dónde viven los datos, pero la instalación y el mantenimiento requieren conocimientos técnicos.", "En la nube: n8n lo recomienda para quien no tiene ese conocimiento, porque no hay nada que instalar ni mantener.", "Para quién: desarrolladores o equipos con alguien técnico, y flujos complejos.", "Ojo con: si lo instalas tú, los backups, las actualizaciones y la seguridad son tu responsabilidad. Si lo vas a usar para clientes, lee la licencia de n8n antes."]}, {"h": "Cómo elegir en 30 segundos", "lista": ["No eres técnico y quieres algo ya: Zapier.", "Flujos con ramas y te gusta lo visual: Make.", "Eres técnico o quieres que los datos queden en tu servidor: n8n.", "Vendes automatizaciones a clientes: usa la que el cliente pueda mantener cuando tú no estés, y en lo posible que la cuenta esté a nombre del cliente."], "prompts": [{"t": "Que Claude te ayude a elegir", "c": "Quiero automatizar esto en mi negocio: [DESCRIBE EL FLUJO PASO A PASO].\nUso estas apps: [LISTA].\nMás o menos, el flujo correría [CANTIDAD] veces por [DÍA/SEMANA/MES].\nEn mi equipo [HAY / NO HAY] alguien técnico.\nCompara Make, Zapier y n8n para este caso:\n1. Si las tres tienen integración con mis apps (si no estás seguro, dímelo y dime cómo verificarlo).\n2. Cuántos pasos tendría el flujo en cada una.\n3. Qué tan difícil sería de mantener para mi equipo.\n4. Tu recomendación y por qué.\nNo me des precios: los voy a revisar yo en las páginas oficiales."}]}], "faq": [{"q": "¿Puedo cambiar de herramienta después?", "a": "Sí, pero los flujos no se pasan solos de una a otra: hay que rearmarlos. Por eso conviene elegir bien al principio."}, {"q": "¿Cuál tiene más integraciones?", "a": "Las tres tienen muchas. Lo que importa es que estén las tuyas: busca cada app en el directorio de integraciones de cada herramienta antes de decidir."}, {"q": "¿Necesito Claude para usarlas?", "a": "No. Funcionan solas. Claude suma cuando un paso necesita leer, escribir o decidir algo con texto."}], "fuentes": ["https://help.zapier.com/hc/en-us/articles/8496196837261-Tasks-in-Zapier", "https://help.make.com/credits-and-operations", "https://docs.n8n.io/choose-n8n/", "https://docs.zapier.com/mcp/get-started/connect/claude-code", "https://help.make.com/make-mcp-server", "https://docs.n8n.io/connect/connect-to-n8n-mcp-server", "https://help.zapier.com/hc/en-us/articles/48308034391821-What-is-Zapier-MCP", "https://help.make.com/credits", "https://docs.n8n.io/n8n-community-license/community-license/license-faq", "https://docs.zapier.com/mcp/get-started/connect/claude"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio contable elige con qué automatizar el alta de clientes", "negocio": "Ejemplo inventado: un estudio contable de Mendoza con cuatro personas (dos contadoras, una administrativa y un pasante). Usan Google Forms, Google Sheets, Gmail y Trello. Nadie programa.", "punto_de_partida": "Cada cliente nuevo completa un formulario y la administrativa copia los datos a mano a una planilla, le manda un mail de bienvenida y crea la tarjeta en Trello. A veces se olvida un paso.", "pasos": ["La administrativa completó la ficha de flujo del kit: disparador (respuesta nueva en el formulario), tres acciones (fila en la planilla, mail de bienvenida, tarjeta en Trello) y un filtro (solo si el cliente marcó monotributo o responsable inscripto).", "Buscó cada app en los directorios de integraciones de Zapier, Make y n8n y marcó en la tabla lo que vio. Dejó como verificar lo que no encontró enseguida.", "Le pasó a Claude la ficha con el prompt de la guía (Que Claude te ayude a elegir) y aclaró que en el equipo no hay nadie técnico.", "Claude armó la tabla comparativa y recomendó Zapier: el flujo es lineal, el filtro no consume tareas y la administrativa lo puede mantener sola. n8n instalado por ellas quedó descartado porque nadie podría ocuparse de backups y actualizaciones.", "Revisaron los precios en la página oficial de Zapier ese mismo día y crearon la cuenta con el mail del estudio, no con uno personal.", "Armaron el Zap con el disparador del formulario, el filtro y las tres acciones, y lo probaron con un cliente de prueba antes de prenderlo.", "Más adelante conectaron Zapier MCP a Claude para pedirle desde el chat que mande recordatorios por Gmail. Antes de hacerlo anotaron en la ficha que cada llamada exitosa usa dos tareas, para no llevarse sorpresas con el consumo."], "resultado": "El alta de cada cliente nuevo pasa sola del formulario a la planilla, el mail y Trello, con un filtro que deja afuera las consultas que no son clientes. La decisión quedó documentada en la ficha, con quién mantiene el flujo y qué revisar al mes."}, "si_falla": [{"sintoma": "Conectaste Zapier MCP a Claude y las tareas del plan se gastan más rápido de lo que calculabas.", "solucion": "Cada llamada exitosa de Zapier MCP usa dos tareas, también las del proceso de configuración inicial. Las que fallan no consumen. Revisa el uso en tu cuenta de Zapier, sácale a Claude las acciones que no necesita y pídele que te muestre la acción antes de ejecutarla."}, {"sintoma": "Tu escenario de Make no aparece como herramienta cuando conectas Make MCP a Claude.", "solucion": "Make expone como herramientas solo los escenarios activos con programación on-demand y con el permiso de ejecutar escenarios elegido al conectar. Activa el escenario, cambia su programación a on-demand y vuelve a conectar. Si quieres limitar cuáles ve Claude, usa un MCP toolbox de Make."}, {"sintoma": "Claude ve tus flujos de n8n en la lista pero no puede ejecutarlos ni ver su detalle.", "solucion": "La búsqueda de flujos muestra una vista previa de todos los que puedes ver, pero para usarlos cada flujo tiene que estar habilitado. Entra a la configuración del flujo y prende Available in MCP, o usa la página Workflows enabled. El MCP de la instancia lo activa un owner o admin en Settings → Instance-level MCP."}, {"sintoma": "La app de Claude no logra conectarse a tu n8n instalado en tu computadora o en la red de la oficina.", "solucion": "Claude se conecta desde la nube de Anthropic: un n8n en localhost o detrás de una VPN no responde. Necesitas una URL pública con HTTPS. Usa la URL que muestra n8n en el diálogo de conexión, que termina en /mcp-server/http, no la del editor."}, {"sintoma": "En Make los créditos se consumen más rápido en los escenarios que usan IA.", "solucion": "Por defecto una operación usa un crédito, pero algunos módulos de IA de Make usan más de uno por operación, y con la conexión de IA de Make los créditos dependen de los tokens y del modelo. Si usas tu propia conexión con el proveedor de IA, Make cobra por operaciones y los tokens los pagas aparte al proveedor."}], "kit": [{"archivo": "elegir-herramienta-de-automatizacion/SKILL.md", "que_es": "Skill que junta los datos del flujo, compara Make, Zapier y n8n con criterios verificados y recomienda una, sin precios. Guárdala en una carpeta elegir-herramienta-de-automatizacion, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: elegir-herramienta-de-automatizacion\ndescription: 'Compara Make, Zapier y n8n para un flujo concreto y recomienda una, sin dar precios. Úsala cuando quieran automatizar una tarea, duden entre esas tres o armen una automatización para un cliente.'\n---\n\n# Elegir herramienta de automatización\n\nAyudas a elegir entre Make, Zapier y n8n para UN flujo concreto. No das precios: cambian seguido y el usuario los revisa en las páginas oficiales.\n\n## 1. Junta los datos (pregunta solo lo que falte)\n\n1. El flujo paso a paso: qué lo dispara y qué pasa después.\n2. Las apps que intervienen.\n3. Cuántas veces corre, más o menos, por día, semana o mes.\n4. Si hay alguien técnico en el equipo que pueda mantenerlo.\n5. Si los datos son sensibles o tienen que quedar en un servidor propio.\n6. Si es para el propio negocio o para un cliente.\n7. Si quiere que Claude lo dispare desde el chat.\n\nSi el usuario no sabe algo, sigue con un supuesto y escríbelo como SUPUESTO.\n\n## 2. Arma el flujo en pasos\n\nEscribe el flujo como lista numerada: disparador, después cada acción. Marca cuáles son filtros, formateo de datos o ramas (condiciones).\n\n## 3. Compara con estos criterios\n\n- **Integraciones**: si cada app tiene integración en cada herramienta. Si no estás seguro, di \"verificar en el directorio de integraciones de [HERRAMIENTA]\". Nunca afirmes que existe una integración sin estar seguro.\n- **Cómo se cuenta el uso**, sin montos:\n  - Zapier cobra por tareas: cada acción que sale bien es una tarea. Los disparadores, los filtros, los Paths y el formateo no consumen tareas.\n  - Make mide operaciones y cobra créditos. Por defecto una operación es un crédito, pero algunos módulos de IA usan más o cobran según tokens.\n  - n8n en la nube tiene planes; instalado por uno mismo, el costo es el servidor y el tiempo de mantenimiento.\n- **Conexión con Claude por MCP**:\n  - Zapier MCP le da a Claude acciones sueltas de las apps conectadas, no los Zaps ya armados. Cada llamada que sale bien usa dos tareas.\n  - Make MCP expone como herramientas los escenarios activos con programación on-demand.\n  - n8n expone los flujos que se marcan como disponibles para MCP.\n- **Mantenimiento**: quién lo arregla cuando falle y si esa persona entiende la herramienta.\n- **Para clientes**: la cuenta, en lo posible, a nombre del cliente. Con n8n instalado por uno mismo, la licencia (Sustainable Use License) permite cobrar por armar y mantener flujos, pero no alojar n8n para que los clientes armen sus propios flujos ni revenderlo con otra marca. Recomienda leer la licencia completa.\n\n## 4. Entrega\n\n1. El flujo en pasos (del punto 2).\n2. Una tabla con una fila por herramienta: integraciones, cantidad de pasos, qué pasos consumen uso, dificultad de mantenimiento, conexión con Claude.\n3. Tu recomendación en 3 líneas y por qué.\n4. Lo que el usuario tiene que verificar antes de decidir: integraciones dudosas y precios en las páginas oficiales.\n\n## Reglas\n\n- No inventes precios, límites de planes ni cantidades de integraciones.\n- Si el flujo corre muy seguido y tiene muchos pasos, avisa que el consumo se suma rápido en cualquiera de las tres.\n- Si el usuario no es técnico, no recomiendes n8n instalado por él mismo salvo que haya alguien que lo mantenga.\n"}, {"archivo": "ficha-de-flujo-antes-de-automatizar.md", "que_es": "Plantilla para documentar un flujo antes de elegir herramienta: pasos, apps, volumen, datos, conexión con Claude y checklist si es para un cliente.", "contenido": "# Ficha de flujo: complétala antes de elegir herramienta\n\nCompleta una ficha por cada automatización. Sirve para elegir entre Make, Zapier y n8n, para pasársela a Claude con el prompt de la guía y, si es para un cliente, para cotizar y dejar todo documentado.\n\n## 1. Datos generales\n\n- Nombre del flujo:\n- Negocio o cliente:\n- Quién lo pidió:\n- Quién lo va a mantener cuando yo no esté:\n- Fecha:\n\n## 2. El flujo\n\n**Disparador** (qué lo arranca):\n\n**Pasos** (uno por línea, en orden):\n\n1.\n2.\n3.\n4.\n\nMarca con F los filtros, con R las ramas (si pasa esto, haz aquello) y con T los pasos de formateo o transformación de datos.\n\n## 3. Apps\n\n| App | Qué hace en el flujo | ¿Integración en Zapier? | ¿En Make? | ¿En n8n? |\n|---|---|---|---|---|\n| | | sí / no / verificar | sí / no / verificar | sí / no / verificar |\n| | | | | |\n\nBusca cada app en el directorio de integraciones de cada herramienta. No pongas \"sí\" sin haberlo visto.\n\n## 4. Volumen\n\n- Veces que corre: ___ por (día / semana / mes)\n- Pasos que se ejecutan en cada corrida: ___\n- ¿Hay picos (fin de mes, campañas)? ___\n\nCon esto se estima el consumo en tareas (Zapier), operaciones y créditos (Make) o ejecuciones (n8n). Los precios, en la página oficial de cada una, el día que decidas.\n\n## 5. Datos y seguridad\n\n- ¿Pasan datos personales de clientes? (sí / no)\n- ¿Tienen que quedar en un servidor propio? (sí / no)\n- ¿Con qué cuenta se conecta cada app? (la del negocio, no una personal)\n\n## 6. Conexión con Claude\n\n- ¿Quieres dispararlo desde el chat de Claude? (sí / no)\n- Si es Zapier: Claude va a usar acciones sueltas de tus apps (cada llamada exitosa, dos tareas).\n- Si es Make: el escenario tiene que estar activo con programación on-demand.\n- Si es n8n: el flujo tiene que estar marcado como disponible para MCP.\n\n## 7. Si es para un cliente\n\n- [ ] La cuenta de la herramienta está a nombre del cliente.\n- [ ] El cliente tiene usuario propio y sabe entrar.\n- [ ] Dejé escrito qué hacer si el flujo falla y a quién avisar.\n- [ ] Si uso n8n instalado por mí: leí la licencia y no le doy al cliente acceso para armar sus propios flujos en mi instancia.\n- [ ] Acordamos quién paga la herramienta y quién el mantenimiento.\n\n## 8. Decisión\n\n- Herramienta elegida:\n- Por qué (2 líneas):\n- Qué hay que revisar en 30 días:\n"}], "verificada": "2026-11-08", "cat": "conectores", "parte": "úsalo"};</script>

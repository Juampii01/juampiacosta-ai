<script>var GUIA = {"slug": "cuanto-gastas-en-claude-code", "t": "Cuánto gastás en Claude Code: cómo medirlo", "d": "Qué comando te muestra tu consumo según pagues suscripción o API, cómo leer el desglose, cómo tenerlo siempre a la vista en la línea de estado y qué hacer cuando llegás al límite.", "tema": "Gastá menos tokens", "min": 7, "secciones": [{"h": "Primero: ¿estás usando tu plan o la API?", "p": ["Parece obvio, pero es el error más caro. Si en tu compu está la variable ANTHROPIC_API_KEY y aceptaste usarla, Claude Code se autentica con esa clave en vez de tu suscripción, y lo que uses se cobra como API."], "pasos": ["Dentro de Claude Code, corré /status. Te muestra la versión, el modelo, la cuenta y el método con el que entraste.", "Si querés usar tu suscripción y ves una clave de API, salí y en la terminal corré: unset ANTHROPIC_API_KEY", "Volvé a entrar y corré /status otra vez para confirmar. Si entraste con una cuenta de Console, usá /login para pasar a tu suscripción."]}, {"h": "/usage: el comando que muestra tu consumo", "p": ["/usage muestra el costo de la sesión, los límites de tu plan y estadísticas de actividad. /cost y /stats son atajos del mismo comando (/stats abre directo la pestaña de estadísticas). Lo podés correr mientras Claude está respondiendo."], "lista": ["Si pagás suscripción (Pro, Max o Ultra): mirá las barras de uso del plan. El monto en dólares del bloque Session es para usuarios de API; con suscripción no es lo que pagás.", "Si pagás API: el bloque Session te da tokens por modelo y un costo estimado, calculado en tu compu a precio de lista. Se reinicia cuando hacés /clear. Para la factura real, mirá la página de uso en la Claude Console (platform.claude.com/usage)."]}, {"h": "El desglose: qué se está comiendo tu plan", "p": ["En los planes Pro, Max, Team y Enterprise, /usage también te muestra qué parte del uso reciente se fue en skills, subagentes, plugins y cada servidor MCP, más recomendaciones concretas. Cada recomendación arranca con el porcentaje del uso al que aplica (como mínimo 10%), no con lo que vas a ahorrar."], "lista": ["d o w: cambiás entre las últimas 24 horas y los últimos 7 días.", "f: si abajo aparece algo como \"f to fix 2 of 3\", apretás f y Claude Code aplica las recomendaciones que puede, mostrándote cada cambio antes. Necesita la versión 2.1.305 o posterior.", "Ojo: el desglose sale del historial de esta compu. No incluye lo que usaste en otros dispositivos ni en claude.ai."]}, {"h": "Tenelo siempre a la vista: la línea de estado", "p": ["La línea de estado es una barra abajo de Claude Code que muestra lo que quieras. La forma fácil es pedírsela con /statusline: Claude Code arma el script y actualiza tu configuración solo."], "prompts": [{"t": "Línea de estado con contexto", "c": "/statusline show model name and context percentage with a progress bar"}], "lista": ["Contexto: el dato context_window.used_percentage es el porcentaje de contexto usado.", "Límites del plan: rate_limits.five_hour.used_percentage y rate_limits.seven_day.used_percentage muestran cuánto usaste de la ventana de 5 horas y de la semanal. Solo aparecen en suscriptores Pro y Max de claude.ai, después de la primera respuesta.", "Costo: cost.total_cost_usd es un costo estimado a precio de lista. Puede no coincidir con tu factura y vuelve a cero con /clear."]}, {"h": "Otros datos que te sirven", "lista": ["El contador al lado del spinner: mientras Claude trabaja ves algo como (10m 27s · ↓ 5.5k tokens). Cuenta solo la salida del turno actual, no todo lo que se manda.", "/insights: te arma un informe HTML sobre cómo trabajás (en qué proyectos, dónde se traba, qué probar). Sirve para detectar malos hábitos. Ojo: el análisis también consume de tu plan o tu crédito.", "ccusage: herramienta de la comunidad que lee los datos que Claude Code guarda en tu compu y te arma reportes por día, mes o sesión. Está en la biblioteca, en Herramientas. Sus números también son estimaciones."]}, {"h": "Cuando llegás al límite", "lista": ["\"You've hit your session limit\" o \"weekly limit\": es el límite de tu plan, compartido entre todos los modelos. Cambiar de modelo no lo destraba. El mensaje te dice cuándo se renueva.", "\"You've hit your Opus limit\" o \"Sonnet limit\": es un límite de ese modelo. Ahí sí podés seguir pasando a otro con /model.", "/usage-credits: en Pro y Max abre la configuración de créditos de uso en claude.ai, para seguir pasado el límite pagando aparte. No funciona si entraste con clave de API.", "Un aviso de contexto o de autocompactación no es un límite de uso: es la conversación que se llenó. Mirá la guía de Claude Code liviano."]}], "faq": [{"q": "¿/cost y /usage son distintos?", "a": "No. /cost es un atajo de /usage. /stats también, pero abre en la pestaña de estadísticas."}, {"q": "Tengo Pro y /usage me muestra un costo en dólares. ¿Me lo van a cobrar?", "a": "No. Ese monto es para usuarios de API. Con suscripción lo que cuenta son las barras de uso de tu plan."}, {"q": "¿Lo que uso en claude.ai cuenta para el mismo límite?", "a": "Sí. Según la ayuda oficial, el uso en Claude y en Claude Code cuenta para los mismos límites. El desglose de /usage, en cambio, solo ve lo de esta compu."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/statusline", "https://code.claude.com/docs/en/iam", "https://support.claude.com/en/articles/11145838-use-claude-code-with-your-pro-max-or-ultra-plan"], "cat": "ahorrar", "parte": "aprende"};</script>

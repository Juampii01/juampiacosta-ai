<script>var GUIA = {"slug": "cuanto-gastas-en-claude-code", "t": "Cuánto gastas en Claude Code: cómo medirlo", "d": "Qué comando te muestra tu consumo según pagues suscripción o API, cómo leer el desglose, cómo tenerlo siempre a la vista en la línea de estado y qué hacer cuando llegas al límite.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "Primero: ¿estás usando tu plan o la API?", "p": ["Parece obvio, pero es el error más caro. Si en tu computadora está la variable ANTHROPIC_API_KEY y aceptaste usarla, Claude Code se autentica con esa clave en vez de tu suscripción, y lo que uses se cobra como API."], "pasos": ["Dentro de Claude Code, corre /status. Te muestra la versión, el modelo, la cuenta y el método con el que entraste.", "Si quieres usar tu suscripción y ves una clave de API, sal y en la terminal corre: unset ANTHROPIC_API_KEY", "Vuelve a entrar y corre /status otra vez para confirmar. Si entraste con una cuenta de Console, usa /login para pasar a tu suscripción."]}, {"h": "/usage: el comando que muestra tu consumo", "p": ["/usage muestra el costo de la sesión, los límites de tu plan y estadísticas de actividad. /cost y /stats son atajos del mismo comando (/stats abre directo la pestaña de estadísticas). Lo puedes correr mientras Claude está respondiendo."], "lista": ["Si pagas suscripción (Pro, Max o Ultra): mira las barras de uso del plan. El monto en dólares del bloque Session es para usuarios de API; con suscripción no es lo que pagas.", "Si pagas API: el bloque Session te da tokens por modelo y un costo estimado, calculado en tu computadora a precio de lista. Se reinicia cuando haces /clear. Para la factura real, mira la página de uso en la Claude Console (platform.claude.com/usage)."]}, {"h": "El desglose: qué se está comiendo tu plan", "p": ["En los planes Pro, Max, Team y Enterprise, /usage también te muestra qué parte del uso reciente se fue en skills, subagentes, plugins y cada servidor MCP, más recomendaciones concretas. Cada recomendación arranca con el porcentaje del uso al que aplica (como mínimo 10%), no con lo que vas a ahorrar."], "lista": ["d o w: cambias entre las últimas 24 horas y los últimos 7 días.", "f: si abajo aparece algo como \"f to fix 2 of 3\", aprietas f y Claude Code aplica las recomendaciones que puede, mostrándote cada cambio antes. Necesita la versión 2.1.305 o posterior.", "Ojo: el desglose sale del historial de esta computadora. No incluye lo que usaste en otros dispositivos ni en claude.ai."]}, {"h": "Tenlo siempre a la vista: la línea de estado", "p": ["La línea de estado es una barra abajo de Claude Code que muestra lo que quieras. La forma fácil es pedírsela con /statusline: Claude Code arma el script y actualiza tu configuración solo."], "prompts": [{"t": "Línea de estado con contexto", "c": "/statusline show model name and context percentage with a progress bar"}], "lista": ["Contexto: el dato context_window.used_percentage es el porcentaje de contexto usado.", "Límites del plan: rate_limits.five_hour.used_percentage y rate_limits.seven_day.used_percentage muestran cuánto usaste de la ventana de 5 horas y de la semanal. Solo aparecen en suscriptores Pro y Max de claude.ai, después de la primera respuesta.", "Costo: cost.total_cost_usd es un costo estimado a precio de lista. Puede no coincidir con tu factura y vuelve a cero con /clear."]}, {"h": "Otros datos que te sirven", "lista": ["El contador al lado del spinner: mientras Claude trabaja ves algo como (10m 27s · ↓ 5.5k tokens). Cuenta solo la salida del turno actual, no todo lo que se manda.", "/insights: te arma un informe HTML sobre cómo trabajas (en qué proyectos, dónde se traba, qué probar). Sirve para detectar malos hábitos. Ojo: el análisis también consume de tu plan o tu crédito.", "ccusage: herramienta de la comunidad que lee los datos que Claude Code guarda en tu computadora y te arma reportes por día, mes o sesión. Está en la biblioteca, en Herramientas. Sus números también son estimaciones."]}, {"h": "Cuando llegas al límite", "lista": ["\"You've hit your session limit\" o \"weekly limit\": es el límite de tu plan, compartido entre todos los modelos. Cambiar de modelo no lo destraba. El mensaje te dice cuándo se renueva.", "\"You've hit your Opus limit\" o \"Sonnet limit\": es un límite de ese modelo. Ahí sí puedes seguir pasando a otro con /model.", "/usage-credits: en Pro y Max abre la configuración de créditos de uso en claude.ai, para seguir pasado el límite pagando aparte. No funciona si entraste con clave de API.", "Un aviso de contexto o de autocompactación no es un límite de uso: es la conversación que se llenó. Mira la guía de Claude Code liviano."]}], "faq": [{"q": "¿/cost y /usage son distintos?", "a": "No. /cost es un atajo de /usage. /stats también, pero abre en la pestaña de estadísticas."}, {"q": "Tengo Pro y /usage me muestra un costo en dólares. ¿Me lo van a cobrar?", "a": "No. Ese monto es para usuarios de API. Con suscripción lo que cuenta son las barras de uso de tu plan."}, {"q": "¿Lo que uso en claude.ai cuenta para el mismo límite?", "a": "Sí. Según la ayuda oficial, el uso en Claude y en Claude Code cuenta para los mismos límites. El desglose de /usage, en cambio, solo ve lo de esta computadora."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/statusline", "https://code.claude.com/docs/en/iam", "https://support.claude.com/en/articles/11145838-use-claude-code-with-your-pro-max-or-ultra-plan", "https://code.claude.com/docs/en/statusline#troubleshooting"], "ejemplo": {"titulo": "Ejemplo resuelto: una dev junior descubre que estaba pagando API sin saberlo", "negocio": "Ejemplo inventado: una desarrolladora junior en una software factory de Guadalajara con unas veinte personas. En la empresa tiene una clave de API para un proyecto interno, y para sus trabajos por su cuenta paga un plan Pro.", "punto_de_partida": "Usaba Claude Code de noche para sus proyectos personales pensando que gastaba su plan Pro. Un día su líder le preguntó por un consumo alto en la Console del proyecto interno.", "pasos": ["Abrió Claude Code y corrió /status. Vio que estaba entrando con una clave de API y no con su cuenta de claude.ai.", "En la terminal corrió echo $ANTHROPIC_API_KEY y encontró la clave del trabajo. Estaba en su ~/.zshrc desde que configuró el proyecto interno.", "Borró esa línea del ~/.zshrc y la pasó a un archivo que carga solo cuando trabaja en ese proyecto. Abrió una terminal nueva, entró a Claude Code y corrió /status otra vez: ahora decía su cuenta de claude.ai.", "Corrió /usage. Como ya estaba con su suscripción, ignoró el monto en dólares del bloque Session y miró las barras del plan. Apretó w para ver los últimos 7 días del desglose.", "Copió el script del kit a ~/.claude/statusline-consumo.sh, le dio permisos con chmod +x y sumó el bloque statusLine del kit a su ~/.claude/settings.json.", "Desde entonces, la línea de estado le muestra el modelo, el porcentaje de contexto y cuánto usó de la ventana de 5 horas y de la semana. Cuando trabaja en el proyecto de la empresa con la clave, la misma línea le muestra el costo estimado de la sesión.", "Le contó a su líder qué había pasado y le mostró la checklist de la guía Pro, Max o API para que el equipo revise lo mismo."], "resultado": "Quedó separada la clave de la empresa de su uso personal, y con la línea de estado sabe en todo momento si está gastando su plan o la API. Para la factura real de la empresa, el equipo mira la página de uso de la Console."}, "si_falla": [{"sintoma": "Hiciste unset ANTHROPIC_API_KEY, pero al abrir otra terminal Claude Code vuelve a usar la clave.", "solucion": "unset solo vale para esa terminal. La variable seguramente está en ~/.zshrc, ~/.bashrc o en las variables de entorno de Windows: borra o comenta esa línea y abre una terminal nueva. Si alguna vez aprobaste la clave, también puedes cambiarlo en /config con el interruptor Use custom API key, que aparece solo mientras la variable existe."}, {"sintoma": "Configuraste la línea de estado y abajo no aparece nada.", "solucion": "Revisa en orden: que el script sea ejecutable (chmod +x ~/.claude/statusline-consumo.sh), que tengas jq instalado, que hayas aceptado el aviso de confianza de la carpeta (workspace trust) y que el script imprima algo si lo corres a mano. En Windows con Git Bash, escribe la ruta del script con barras /, no con \\. Si nada funciona, abre Claude Code con claude --debug para ver el error del script."}, {"sintoma": "La línea de estado no muestra los porcentajes de 5 horas ni de la semana.", "solucion": "Esos datos (rate_limits) llegan solo para suscriptores Pro y Max de claude.ai y después de la primera respuesta de la sesión. Si entras con clave de API no aparecen: ahí lo que ves es el costo estimado. Manda un mensaje y espera la respuesta antes de mirar."}, {"sintoma": "/usage muestra \"Showing last-known usage\" o \"rate limited until\" con una hora.", "solucion": "No es tu límite de trabajo: es que Claude Code no puede volver a consultar tus límites hasta esa hora. Te muestra los últimos datos que cargó en la última hora. Aprieta r después de la hora indicada para traer datos nuevos."}, {"sintoma": "Aprietas f en /usage y se cierra con \"Nothing was sent. Turn off Remote Control to use fixes.\"", "solucion": "Con Remote Control conectado, f no funciona. Desconecta Remote Control, vuelve a correr /usage y aprieta f. Si en el pie no ves la pista \"f to fix\", revisa que tengas la versión 2.1.305 o posterior (claude --version)."}], "kit": [{"archivo": "statusline-consumo.sh", "que_es": "Script de línea de estado que muestra el modelo, el porcentaje de contexto y, según cómo pagas, el uso de 5 horas y semanal (Pro y Max) o el costo estimado de la sesión (API). Guárdalo como ~/.claude/statusline-consumo.sh y dale permisos con chmod +x. Necesita jq.", "contenido": "#!/bin/bash\n# Línea de estado de consumo para Claude Code (kit juampiiacosta.ai)\n# Muestra: modelo, % de contexto, y según cómo pagas:\n#  - suscripción Pro o Max: % usado de la ventana de 5 horas y de la semana\n#  - API: costo estimado de la sesión (a precio de lista, no es tu factura)\n# Necesita jq instalado.\n\ninput=$(cat)\n\nMODELO=$(echo \"$input\" | jq -r '.model.display_name // \"modelo ?\"')\nCTX=$(echo \"$input\" | jq -r '.context_window.used_percentage // 0' | cut -d. -f1)\nH5=$(echo \"$input\" | jq -r '.rate_limits.five_hour.used_percentage // empty' | cut -d. -f1)\nSEM=$(echo \"$input\" | jq -r '.rate_limits.seven_day.used_percentage // empty' | cut -d. -f1)\nCOSTO=$(echo \"$input\" | jq -r '.cost.total_cost_usd // 0')\n\nLINEA=\"[$MODELO] contexto ${CTX}%\"\nif [ \"$CTX\" -ge 70 ] 2>/dev/null; then\n  LINEA=\"$LINEA (piensa en /clear o /compact)\"\nfi\n\nif [ -n \"$H5\" ] || [ -n \"$SEM\" ]; then\n  if [ -n \"$H5\" ]; then LINEA=\"$LINEA | 5h ${H5}%\"; fi\n  if [ -n \"$SEM\" ]; then LINEA=\"$LINEA | semana ${SEM}%\"; fi\nelse\n  COSTO_FMT=$(LC_NUMERIC=C printf '%.2f' \"$COSTO\")\n  LINEA=\"$LINEA | costo estimado US\\$${COSTO_FMT}\"\nfi\n\necho \"$LINEA\"\n"}, {"archivo": "settings-statusline-consumo.json", "que_es": "El bloque para sumar a tu ~/.claude/settings.json y activar el script. Si ese archivo ya tiene contenido, agrega solo la clave statusLine dentro de las llaves que ya existen.", "contenido": "{\n  \"statusLine\": {\n    \"type\": \"command\",\n    \"command\": \"~/.claude/statusline-consumo.sh\",\n    \"padding\": 0\n  }\n}\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "5-repos-que-matan-apps-de-pago", "t": "5 repos de GitHub que reemplazan apps que pagás", "d": "Compañeros de IA siempre activos, un asesor de finanzas que deja tus datos en tu compu, piezas 3D desde una frase, videos de motion escritos como una web y 45 tipos de diagrama: links y cómo instalarlos.", "tema": "Conectores y MCP", "min": 7, "ficha": [["Qué es", "Cinco repositorios de GitHub que reemplazan apps pagas: compañeros de IA, finanzas, 3D, motion y diagramas."], ["Para quién", "Quien quiere dejar de pagar ciertas apps."], ["Necesitás", "Claude Code para instalarlos. Algunos piden Node, uv o Docker."], ["Cuánto cuesta", "Son de código abierto; algunos usan una API de IA que se paga por uso."], ["Ojo", "Proyectos de terceros: revisá licencia y permisos antes de usarlos con datos reales."]], "secciones": [{"h": "Cómo instalarlos en minutos", "prompts": [{"t": "Instalar", "c": "Instalá [LINK DEL REPO] siguiendo su README, decime qué necesito (claves, programas) y hacé una prueba chica para comprobar que funciona."}], "aviso": "Son proyectos de terceros: revisá licencia y permisos antes de usarlos con datos reales."}, {"h": "1. Compañeros de IA: OpenDots", "p": ["Una plantilla de código abierto (MIT) para tener agentes de IA siempre activos, cada uno con su propia compu: navegan, atienden llamadas y trabajan en Slack."], "lista": ["Repositorio: <a href=\"https://github.com/CopilotKit/OpenDots\" target=\"_blank\" rel=\"noopener\">github.com/CopilotKit/OpenDots ↗<\/a>"], "aviso": "Es una plantilla para desarrolladores, todavía en etapa temprana: la instalás y la configurás vos, y las conversaciones necesitan el servicio CopilotKit Intelligence (alojado, o una versión local de prueba con Docker)."}, {"h": "2. Finanzas personales: Aurelio", "p": ["Una app para seguir tu patrimonio y planificar tus finanzas (inversiones, propiedades y deudas) con un asesor de IA opcional. Corre en tu compu y tus registros quedan ahí; la IA va por OpenRouter con tu propia clave."], "lista": ["Repositorio: <a href=\"https://github.com/LosaLosSantos/aurelio-finance\" target=\"_blank\" rel=\"noopener\">github.com/LosaLosSantos/aurelio-finance ↗<\/a>", "Necesitás Git, Node.js 22 o más nuevo y uv. Podés probarla primero con datos inventados."], "aviso": "No es asesoramiento financiero: usala para ordenar tus números. Si activás la IA, lo que le preguntes sale de tu compu hacia OpenRouter y se paga por uso."}, {"h": "3. Piezas 3D: text-to-cad", "p": ["Describís una pieza con palabras (o con una imagen) y tu agente genera archivos 3D reales en STEP, STL, 3MF o GLB para imprimir o mecanizar. También revisa si la pieza se puede fabricar."], "lista": ["Repositorio: <a href=\"https://github.com/earthtojake/text-to-cad\" target=\"_blank\" rel=\"noopener\">github.com/earthtojake/text-to-cad ↗<\/a>", "Funciona con Claude Code, Codex, Cursor y otros agentes con plugins o skills."], "aviso": "Revisá medidas y tolerancias antes de fabricar."}, {"h": "4. Motion design: HyperFrames", "p": ["Lo hizo HeyGen: Claude escribe cada escena como una página web y HyperFrames la convierte en un MP4 con movimiento. Es gratis y de código abierto (Apache 2.0)."], "lista": ["Repositorio: <a href=\"https://github.com/heygen-com/hyperframes\" target=\"_blank\" rel=\"noopener\">github.com/heygen-com/hyperframes ↗<\/a>", "Instalación, en la terminal: claude plugin marketplace add heygen-com/hyperframes y después claude plugin install hyperframes@hyperframes", "En lugar de: programas de animación pagos, para videos simples."]}, {"h": "5. Diagramas: diagram-design", "p": ["Le pedís un diagrama con palabras y te devuelve un archivo HTML prolijo, entre 45 tipos. Si le pasás tu web, toma tu paleta y tus tipografías."], "lista": ["Repositorio: <a href=\"https://github.com/cathrynlavery/diagram-design\" target=\"_blank\" rel=\"noopener\">github.com/cathrynlavery/diagram-design ↗<\/a>", "Instalación, dentro de Claude Code: /plugin marketplace add cathrynlavery/diagram-design y después /plugin install diagram-design@diagram-design"]}], "faq": [{"q": "¿Son gratis?", "a": "Sí, son de código abierto. Algunos usan una API de IA que se paga por uso."}, {"q": "¿Cuál es el más fácil para empezar?", "a": "diagram-design y HyperFrames: se instalan con un comando en Claude Code. OpenDots es el que más trabajo técnico pide."}], "usos": [{"e": "Agentes", "c": "azul", "t": "OpenDots", "d": "Compañeros de IA siempre activos."}, {"e": "Finanzas", "c": "verde", "t": "Aurelio", "d": "Tu patrimonio, con los datos en tu compu."}, {"e": "3D", "c": "morado", "t": "text-to-cad", "d": "Piezas 3D desde una frase."}, {"e": "Video", "c": "rosa", "t": "HyperFrames", "d": "Videos de motion escritos como una web."}], "fuentes": ["https://github.com/CopilotKit/OpenDots", "https://github.com/LosaLosSantos/aurelio-finance", "https://github.com/earthtojake/text-to-cad", "https://github.com/heygen-com/hyperframes", "https://github.com/cathrynlavery/diagram-design"], "cat": "conectores", "parte": "aprende"};</script>

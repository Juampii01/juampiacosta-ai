<script>var GUIA = {"slug": "revisar-contratos-con-claude", "t": "Revisar contratos con Claude (sin reemplazar a tu abogado)", "d": "Qué te puede aportar Claude antes de firmar, qué no puede hacer, un prompt de revisión y el plugin legal oficial de Anthropic.", "tema": "IA en tu negocio", "min": 9, "fichaNombre": "Revisión de contratos", "ficha": [["Qué es", "Una primera lectura para entender un contrato y llegar con preguntas claras a tu abogado."], ["Necesitas", "El contrato en texto o PDF y una cuenta de Claude."], ["Qué no hace", "No da asesoramiento legal ni conoce la situación completa de tu caso."], ["Aviso", "Antes de firmar algo importante, consulta con un abogado matriculado de tu país."]], "secciones": [{"h": "Lo que puede y lo que no", "lista": ["Puede: explicarte en palabras simples qué dice cada cláusula.", "Puede: marcar lo que conviene mirar con atención (plazos, penalidades, renovaciones, exclusividad, quién paga qué).", "Puede: armarte la lista de preguntas para tu abogado o para la otra parte.", "No puede: decirte si el contrato es válido o conveniente según la ley de tu país.", "No puede: reemplazar el criterio de un profesional que conoce tu caso y te responde por su consejo."], "aviso": "Esta guía no es asesoramiento legal. Claude puede equivocarse o pasar algo por alto. Úsalo para entender y preparar preguntas, no para decidir solo."}, {"h": "Antes de subir el contrato", "pasos": ["Revisa si el contrato tiene cláusula de confidencialidad que te impida compartirlo.", "Si puedes, tapa datos que no hacen falta para entenderlo: números de documento, cuentas bancarias, direcciones.", "Ten a mano tu objetivo: qué quieres lograr con este acuerdo y qué te preocupa."]}, {"h": "El prompt de revisión", "prompts": [{"t": "Primera lectura de un contrato", "c": "Te paso un contrato de [TIPO, EJ.: PRESTACIÓN DE SERVICIOS] entre [MI EMPRESA O YO] y [LA OTRA PARTE]. Yo soy [QUÉ PARTE ERES]. Mi objetivo es [QUÉ QUIERES LOGRAR]. Me preocupa [TU DUDA PRINCIPAL].\n<contrato>\n[PEGA EL CONTRATO O SÚBELO]\n<\/contrato>\nNo me des asesoramiento legal. Ayúdame a entenderlo:\n1. Resumen en 10 líneas: qué me obligo a hacer y qué recibo.\n2. Tabla de cláusulas para mirar con atención: número de cláusula, cita textual, qué significa en palabras simples y por qué conviene revisarla.\n3. Plazos, fechas, renovaciones automáticas y penalidades, en una lista aparte.\n4. Cosas que suelen estar en este tipo de contrato y aquí no encontré.\n5. Preguntas concretas para hacerle a mi abogado.\nCita siempre el texto exacto. Si algo depende de la ley de mi país ([PAÍS]), dilo y no lo des por resuelto."}]}, {"h": "Después de la revisión", "pasos": ["Chequea cada cita contra el contrato original: tiene que estar escrita igual.", "Llévale a tu abogado el resumen y la lista de preguntas. La consulta va a ser más corta y más concreta.", "Si negocias cambios, pídele a Claude que te ayude a redactar el mail con tus pedidos, y que tu abogado lo revise antes de mandarlo."]}, {"h": "El plugin legal oficial de Anthropic", "p": ["Anthropic publicó en GitHub un plugin legal dentro de su repositorio de plugins para trabajo de oficina. Está pensado principalmente para Cowork, la app de escritorio de Claude, y también funciona en Claude Code. Los plugins están en los planes pagos. En Cowork se suma desde Customize → Plugins (con +, Add marketplace y Browse Anthropic sources puedes agregar el marketplace Legal); en Claude Code, con claude plugin marketplace add anthropics/knowledge-work-plugins y después claude plugin install legal@knowledge-work-plugins. Está orientado a equipos legales internos de empresas.", "Incluye comandos como /review-contract, que revisa un contrato contra el manual de negociación de tu organización, y /triage-nda, que clasifica acuerdos de confidencialidad en verde, amarillo o rojo. Para que sirva, hay que escribir un archivo de manual (legal.local.md) con tus posiciones estándar. En Cowork, ese archivo va en cualquier carpeta que hayas compartido con Cowork; en Claude Code, en la carpeta .claude/ de tu proyecto.", "Su propio repositorio aclara que no da asesoramiento legal, que las conclusiones deben verificarse con profesionales y que los ejemplos que trae responden a jurisdicciones de Estados Unidos. Si trabajas con otra legislación, hay que adaptar el manual antes de confiar en su análisis."]}], "faq": [{"q": "¿Puedo firmar si Claude dice que está todo bien?", "a": "No te bases solo en eso. Claude no da asesoramiento legal. Para acuerdos importantes, la última palabra la tiene un abogado de tu país."}, {"q": "¿El plugin legal sirve para contratos de Argentina o España?", "a": "Sus ejemplos de fábrica están basados en jurisdicciones de Estados Unidos. El repositorio indica que, si operas con otra legislación, tienes que adaptar el manual antes de usar su análisis."}, {"q": "¿Es seguro subir un contrato?", "a": "Depende de lo que diga el contrato sobre confidencialidad y de lo que te sientas cómodo compartiendo. Ante la duda, tapa los datos sensibles o consulta antes."}], "fuentes": ["https://github.com/anthropics/knowledge-work-plugins/blob/main/legal/README.md", "https://github.com/anthropics/knowledge-work-plugins", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "https://support.claude.com/en/articles/13837440", "https://support.claude.com/en/articles/8241126-upload-files-to-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: una agencia chica antes de firmar con su primer cliente grande", "negocio": "Ejemplo inventado: una agencia de marketing digital de cuatro personas en Guadalajara, Jalisco. Llevan redes y campañas para comercios locales y les llegó un contrato de servicios de una cadena regional.", "punto_de_partida": "El contrato tiene veinte páginas, lo mandó el área legal del cliente y hay que firmarlo en una semana. La dueña nunca negoció un contrato así y no quiere pagar horas de abogado para que le lean todo.", "pasos": ["Leyó la cláusula de confidencialidad del borrador para ver si podía compartirlo. Tapó en el PDF los números de cuenta y los datos personales del firmante del cliente.", "En un chat de Claude pegó el prompt Primera lectura de un contrato de la guía, completando que su agencia es la prestadora, que el objetivo es un contrato de un año y que le preocupan los pagos y quién es dueño de las piezas creadas. Subió el PDF.", "Claude devolvió el resumen, la tabla de cláusulas y la lista de plazos. Marcó una renovación automática con un preaviso corto, una cláusula de cesión de todo lo creado y una multa por atraso solo para la agencia.", "Abrió el PDF original y comprobó cada cita de la tabla. Una no estaba escrita igual: le pidió a Claude que la volviera a citar con el número de cláusula y esta vez coincidió.", "Completó la hoja para la consulta con el abogado del kit con las citas comprobadas y cinco preguntas.", "En la consulta, el abogado respondió esas preguntas y le dijo qué cambios pedir. La reunión fue sobre las cláusulas marcadas, no sobre el contrato entero.", "Le pidió a Claude un mail para el cliente con los tres cambios, en tono cordial. Se lo pasó al abogado, que ajustó una frase, y recién ahí lo mandó.", "Para los contratos que vienen, subió la skill primera-lectura-de-contrato del kit en Customize → Skills, así no tiene que pegar el prompt cada vez."], "resultado": "La dueña firmó sabiendo qué decía cada cláusula importante, con los cambios que pidió su abogado ya negociados, y guardó la hoja de consulta junto al contrato. Claude le sirvió para entender y preparar; la decisión y la validación legal fueron de su abogado."}, "si_falla": [{"sintoma": "Una cita de la tabla no aparece en el contrato o está escrita distinto.", "solucion": "No la uses. Pídele que la vuelva a citar con el número de cláusula y la página. Si sigue sin coincidir, copia tú esa cláusula del original, pégala en el chat y pídele que la analice de nuevo."}, {"sintoma": "El contrato es un PDF escaneado y Claude se saltea partes o confunde números.", "solucion": "La ayuda oficial explica que en PDFs de hasta 100 páginas Claude analiza texto e imágenes, y que de 101 a 1000 páginas procesa solo el texto. Un escaneo largo puede quedar casi vacío. Sube solo las páginas que importan o pásalo por un programa de reconocimiento de texto antes de subirlo, y pídele que avise qué partes no pudo leer."}, {"sintoma": "No encuentras los comandos /review-contract o /triage-nda.", "solucion": "Son del plugin legal, no de Claude común. Los plugins están en planes pagos. En Cowork agrégalo desde Customize → Plugins (o con +, Add marketplace, Browse Anthropic sources). En Claude Code, corre claude plugin marketplace add anthropics/knowledge-work-plugins y claude plugin install legal@knowledge-work-plugins."}, {"sintoma": "El plugin te marca cosas con criterios que no son de tu país (por ejemplo, menciona Delaware o Nueva York).", "solucion": "No encontró tu legal.local.md o lo dejaste con los ejemplos de fábrica. Ponlo en una carpeta compartida con Cowork o en .claude/ de tu proyecto en Claude Code, y complétalo con tu abogado para tu país. La plantilla en español del kit te sirve de punto de partida."}, {"sintoma": "Claude te dice que una cláusula es abusiva o que puedes firmar tranquilo.", "solucion": "Pídele que reformule sin opinar sobre validez ni conveniencia, separando lo que dice el texto de lo que depende de la ley de tu país. Esa pregunta va a la lista para el abogado."}], "kit": [{"archivo": "primera-lectura-de-contrato/SKILL.md", "que_es": "Skill que hace la primera lectura del contrato citando primero el texto exacto, con resumen, cláusulas para mirar, plazos, faltantes y preguntas para el abogado, sin dar asesoramiento legal. Guárdala en una carpeta primera-lectura-de-contrato, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: primera-lectura-de-contrato\ndescription: 'Primera lectura de un contrato para entenderlo y llegar con preguntas al abogado, citando el texto exacto y sin asesoramiento legal. Úsala con un contrato, NDA, alquiler o términos antes de firmar.'\n---\n\n# Primera lectura de contrato\n\nNo das asesoramiento legal. Ayudas a entender un contrato y a preparar la consulta con un abogado matriculado.\n\n## Antes de leer\n\nSi el usuario no lo dijo, pregunta en un solo mensaje:\n1. Qué parte es él en el contrato.\n2. Qué quiere lograr con el acuerdo.\n3. Qué le preocupa.\n4. En qué país se firma y se cumple.\n\nSi el contrato tiene números de documento, cuentas bancarias o domicilios y no hacen falta para entenderlo, sugiere taparlos la próxima vez.\n\n## Cómo trabajas\n\n1. Primero busca y copia las citas textuales que vas a usar, con su número de cláusula. Después analízalas. Nunca analices una cláusula que no citaste.\n2. Si el contrato no numera las cláusulas, identifícalas por el título o por las primeras palabras.\n3. Si una parte del archivo no se lee bien (escaneo borroso, páginas faltantes), dilo y no la completes.\n\n## Qué entregas, en este orden\n\n1. **Resumen en 10 líneas**: qué se obliga a hacer el usuario, qué recibe, por cuánto tiempo y cómo se termina.\n2. **Tabla de cláusulas para mirar con atención**: número, cita textual, qué significa en palabras simples, por qué conviene revisarla.\n   Mira en especial: plazo y renovación automática, forma de terminar y preaviso, penalidades y multas, exclusividad y no competencia, quién paga qué (impuestos, gastos, seguros), propiedad de lo que se produce, confidencialidad, responsabilidad e indemnidades, cesión del contrato, modificaciones unilaterales, jurisdicción y ley aplicable.\n3. **Fechas y plazos**: lista aparte con cada fecha, plazo de aviso, renovación y vencimiento.\n4. **Lo que no encontré**: temas que suelen estar en este tipo de contrato y aquí no aparecen. Di \"suele estar\", no \"es obligatorio\".\n5. **Preguntas para el abogado**: concretas, cada una ligada a una cláusula.\n6. **Preguntas para la otra parte**: las que se pueden aclarar sin abogado (fechas, entregables, montos).\n\n## Reglas\n\n- Cita el texto exacto, entre comillas, sin corregirlo.\n- No digas si el contrato es válido, legal, abusivo o conveniente. Si algo depende de la ley del país, dilo: \"esto depende de la ley de [PAÍS], consúltalo\".\n- No recomiendes firmar ni no firmar.\n- No inventes cláusulas, números de artículo de leyes ni fallos.\n- Si el usuario pide redactar un mail con pedidos de cambio, hazlo y cierra con: \"Que lo revise tu abogado antes de mandarlo.\"\n- Cierra siempre con: \"Esto no es asesoramiento legal. Revisa cada cita contra el contrato original.\"\n"}, {"archivo": "legal.local.md", "que_es": "Plantilla en español del manual que lee el plugin legal de Anthropic, sin posiciones legales precargadas: se completa con tu abogado para tu país. Tiene que llamarse legal.local.md y vivir en una carpeta compartida con Cowork o en .claude/ de tu proyecto.", "contenido": "# Legal Playbook Configuration\n\nPlantilla en español para el plugin legal de Anthropic (knowledge-work-plugins). El archivo tiene que llamarse legal.local.md.\n- En Cowork: guárdalo en una carpeta que hayas compartido con Cowork.\n- En Claude Code: guárdalo en la carpeta .claude/ de tu proyecto.\n\nImportante: los ejemplos que trae el plugin responden a Estados Unidos. Esta plantilla no trae posiciones legales: los corchetes se completan con tu abogado, para tu país. Hasta que no esté completa, no confíes en el análisis del plugin.\n\nJurisdicción: [PAÍS Y PROVINCIA O ESTADO]\nTipo de negocio: [RUBRO, TAMAÑO]\nContratos que firmamos seguido: [SERVICIOS A CLIENTES / PROVEEDORES / ALQUILER / CONFIDENCIALIDAD]\nRevisado con: [NOMBRE DEL ABOGADO], el [FECHA]\n\n## Contract Review Positions\n\n### Plazo y renovación\n- Posición estándar: [A DEFINIR CON TU ABOGADO]\n- Aceptable: [A DEFINIR]\n- Escalar al abogado si: [EJEMPLO: RENOVACIÓN AUTOMÁTICA SIN PLAZO DE AVISO]\n\n### Terminación y preaviso\n- Posición estándar: [A DEFINIR]\n- Aceptable: [A DEFINIR]\n- Escalar al abogado si: [EJEMPLO: LA OTRA PARTE PUEDE TERMINAR SIN CAUSA Y NOSOTROS NO]\n\n### Pagos, moneda y actualización\n- Posición estándar: [PLAZO DE PAGO, MONEDA, CÓMO SE ACTUALIZA EL PRECIO]\n- Aceptable: [A DEFINIR]\n- Escalar al abogado si: [EJEMPLO: MULTAS POR ATRASO SOLO PARA NOSOTROS]\n\n### Responsabilidad y límites\n- Posición estándar: [A DEFINIR CON TU ABOGADO]\n- Escalar al abogado si: [A DEFINIR]\n\n### Propiedad intelectual\n- Posición estándar: [QUIÉN ES DUEÑO DE LO QUE PRODUCIMOS Y DE LO QUE YA TENÍAMOS]\n- Escalar al abogado si: [EJEMPLO: CESIÓN DE TODO LO QUE CREAMOS, INCLUSO ANTES DEL CONTRATO]\n\n### Exclusividad y no competencia\n- Posición estándar: [A DEFINIR]\n- Escalar al abogado si: [A DEFINIR]\n\n### Datos personales\n- Posición estándar: [QUÉ PIDE LA LEY DE TU PAÍS, SEGÚN TU ABOGADO]\n- Escalar al abogado si: [EJEMPLO: NOS PASAN DATOS DE SUS CLIENTES SIN ACUERDO DE TRATAMIENTO]\n\n### Ley aplicable y jurisdicción\n- Preferida: [TU PAÍS Y CIUDAD]\n- Aceptable: [A DEFINIR]\n- Escalar al abogado si: [EJEMPLO: TRIBUNALES O ARBITRAJE EN OTRO PAÍS]\n\n## NDA Defaults\n- Obligaciones: [MUTUAS / UNILATERALES ACEPTABLES EN QUÉ CASOS]\n- Plazo de confidencialidad: [A DEFINIR CON TU ABOGADO]\n- Excepciones estándar: [A DEFINIR]\n\n## Response Templates\n- [RUTA O NOMBRE DE TUS PLANTILLAS DE RESPUESTA, SI LAS TIENES]\n\n## Siempre al abogado, sin importar el análisis\n- Contratos de más de [MONTO O PLAZO].\n- Cualquier garantía personal, aval o fianza.\n- Contratos en otro idioma o con ley de otro país.\n"}, {"archivo": "hoja-consulta-abogado-contrato.md", "que_es": "Hoja para llevar a la consulta con tu abogado: datos del contrato, preocupaciones, citas comprobadas, plazos y preguntas.", "contenido": "# Hoja para la consulta con tu abogado\n\nLlévala impresa o mandala antes de la reunión. La armas con lo que te devolvió Claude, después de comprobar cada cita contra el contrato.\n\n## Datos del contrato\n\n- Tipo de contrato: [SERVICIOS / PROVEEDOR / ALQUILER / CONFIDENCIALIDAD / OTRO]\n- Partes: [YO O MI EMPRESA] y [LA OTRA PARTE]\n- Qué parte soy: [PRESTADOR / CLIENTE / INQUILINO / OTRO]\n- País y ciudad donde se firma y se cumple: [PAÍS, CIUDAD]\n- Fecha límite para firmar: [FECHA]\n- Versión que te mando: [NOMBRE DEL ARCHIVO Y FECHA]\n\n## Qué quiero lograr\n\n[EN 2 LÍNEAS]\n\n## Lo que más me preocupa\n\n1. [PREOCUPACIÓN]\n2. [PREOCUPACIÓN]\n\n## Cláusulas para revisar\n\n| Cláusula | Cita textual (comprobada) | Mi duda |\n|---|---|---|\n| [N] | \"[TEXTO]\" | [PREGUNTA] |\n| [N] | \"[TEXTO]\" | [PREGUNTA] |\n\n## Fechas y plazos que tengo que cumplir\n\n- [FECHA O PLAZO]: [QUÉ PASA]\n\n## Lo que podría faltar\n\n- [TEMA QUE CLAUDE MARCÓ COMO \"SUELE ESTAR\"]\n\n## Preguntas concretas\n\n1. [PREGUNTA]\n2. [PREGUNTA]\n3. ¿Hay algo que por la ley de [PAÍS] no se pueda pactar así o que cambie lo que dice el contrato?\n4. ¿Qué cambios pedirías tú antes de firmar?\n\n## Después de la consulta\n\n- [ ] Anoté qué cambios pido y cuáles acepto como están.\n- [ ] Si redacto el mail con los pedidos, se lo paso al abogado antes de mandarlo.\n- [ ] Guardé la versión final firmada junto con esta hoja.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "22-skills-claude-code", "post": "SKILLS", "t": "Las 22 mejores skills para Claude Code, con su instalación", "d": "Repos de GitHub para construir, diseñar, investigar y hacer marketing con Claude, con el comando para instalar cada uno, para que tus sistemas para clientes no se vean genéricos.", "tema": "Skills y plugins", "min": 11, "ficha": [["Qué es", "Las 22 mejores skills para Claude Code, con su repositorio y su comando: construir, diseñar, investigar y marketing."], ["Para quién", "Quien arma sistemas para clientes con Claude y no quiere que se vean genéricos."], ["Necesitas", "Claude Code. Algunas piden además Node.js, Python o una clave de un servicio externo."], ["Ojo", "Son proyectos de terceros: instala solo las que vayas a usar y revisa qué hacen."], ["Por dónde empezar", "superpowers, ui-ux-pro-max, impeccable, last30days y humanizer."]], "secciones": [{"h": "Cómo instalarlas", "p": ["Lo más fácil es pegarle a Claude Code el link del repositorio y pedirle «instala esta skill y comprueba que funciona». Abajo tienes además el comando que figura en el README de cada una. Los que empiezan con /plugin van dentro de Claude Code; los que empiezan con npx, npm, uv o git, en la terminal."], "prompts": [{"t": "Instalar una", "c": "Instala esta skill desde [LINK DEL REPO]. Lee su README, usa el método de instalación que recomienda y después dime cómo se usa y pruébala con un ejemplo chico."}], "aviso": "Son proyectos de terceros. Instala solo las que vayas a usar y revisa qué hacen antes de darles acceso a tus archivos."}, {"h": "1. Construir (6)", "lista": ["superpowers: planifica y depura antes de escribir código. Instalación: /plugin install superpowers@claude-plugins-official <a href=\"https://github.com/obra/superpowers\" target=\"_blank\" rel=\"noopener\">github.com/obra/superpowers ↗<\/a>", "gstack: un equipo de desarrollo virtual (producto, arquitectura, diseño, revisión) en una sola instalación. Necesita Git y Bun (la versión probada es la 1.4.2 o más nueva). Instalación para Claude Code: git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git ~/.claude/skills/gstack y después cd ~/.claude/skills/gstack && ./setup <a href=\"https://github.com/garrytan/gstack\" target=\"_blank\" rel=\"noopener\">github.com/garrytan/gstack ↗<\/a>", "caveman: respuestas con muchos menos tokens. Instalación: /plugin marketplace add JuliusBrussee/caveman y /plugin install caveman@caveman <a href=\"https://github.com/JuliusBrussee/caveman\" target=\"_blank\" rel=\"noopener\">github.com/JuliusBrussee/caveman ↗<\/a>", "ponytail: que Claude escriba solo el código que hace falta. Instalación: /plugin marketplace add DietrichGebert/ponytail y /plugin install ponytail@ponytail <a href=\"https://github.com/DietrichGebert/ponytail\" target=\"_blank\" rel=\"noopener\">github.com/DietrichGebert/ponytail ↗<\/a>", "codex: el plugin oficial de OpenAI para usar Codex dentro de Claude Code (revisiones de código o pasarle tareas). Necesita una cuenta de ChatGPT (incluso la gratis) o una clave de OpenAI. Instalación: /plugin marketplace add openai/codex-plugin-cc, /plugin install codex@openai-codex y después /codex:setup <a href=\"https://github.com/openai/codex-plugin-cc\" target=\"_blank\" rel=\"noopener\">github.com/openai/codex-plugin-cc ↗<\/a>", "i-have-adhd: que no entierre la respuesta en relleno. Instalación: pídele a Claude Code que la instale desde el repo siguiendo su AGENTS.md (es lo que indica el README). <a href=\"https://github.com/ayghri/i-have-adhd\" target=\"_blank\" rel=\"noopener\">github.com/ayghri/i-have-adhd ↗<\/a>"]}, {"h": "2. Diseño (6)", "lista": ["ui-ux-pro-max: criterio de diseño, paletas y tipografías. Su buscador de estilos corre con Python 3 (compruébalo con python3 --version). Instalación: /plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill y /plugin install ui-ux-pro-max@ui-ux-pro-max-skill <a href=\"https://github.com/nextlevelbuilder/ui-ux-pro-max-skill\" target=\"_blank\" rel=\"noopener\">github.com/nextlevelbuilder/ui-ux-pro-max-skill ↗<\/a>", "taste-skill: webs de empresa que se ven profesionales en lugar de una landing genérica. Necesita Node 22 o más nuevo y Chrome, Edge o Chromium. Instalación: /plugin marketplace add Leonxlnx/taste-skill y /plugin install taste-skill@taste-skill <a href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener\">github.com/Leonxlnx/taste-skill ↗<\/a>", "impeccable: el vocabulario de diseño para pulir y revisar el front end (polish, critique, audit y más). Instalación: en la carpeta del proyecto, npx impeccable install; después /impeccable init <a href=\"https://github.com/pbakaus/impeccable\" target=\"_blank\" rel=\"noopener\">github.com/pbakaus/impeccable ↗<\/a>", "hyperframes: escribes HTML y sale un video MP4. Necesita Node.js 22 o más nuevo y FFmpeg instalado. Instalación: en la terminal, claude plugin marketplace add heygen-com/hyperframes y claude plugin install hyperframes@hyperframes <a href=\"https://github.com/heygen-com/hyperframes\" target=\"_blank\" rel=\"noopener\">github.com/heygen-com/hyperframes ↗<\/a>", "skills de Emil Kowalski: animaciones de interfaz fluidas. Instalación: npx skills@latest add emilkowalski/skills <a href=\"https://github.com/emilkowalski/skills\" target=\"_blank\" rel=\"noopener\">github.com/emilkowalski/skills ↗<\/a>", "gsap: animación web profesional (skills oficiales de GSAP). Instalación: npx skills add https://github.com/greensock/gsap-skills <a href=\"https://github.com/greensock/gsap-skills\" target=\"_blank\" rel=\"noopener\">github.com/greensock/gsap-skills ↗<\/a>"]}, {"h": "3. Investigación (6)", "lista": ["skill-creator: crea tus propias skills (viene en las skills oficiales de Anthropic, dentro del paquete example-skills). Instalación: /plugin marketplace add anthropics/skills y /plugin install example-skills@anthropic-agent-skills <a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/skills ↗<\/a>", "graphify: convierte tu proyecto o tus notas en un mapa que Claude puede consultar. Necesita Python 3.10 o más nuevo y uv. Instalación: uv tool install graphifyy y después graphify install <a href=\"https://github.com/Graphify-Labs/graphify\" target=\"_blank\" rel=\"noopener\">github.com/Graphify-Labs/graphify ↗<\/a>", "last30days: qué se dijo en internet en los últimos 30 días sobre un tema. Instalación: /plugin marketplace add mvanhorn/last30days-skill y /plugin install last30days <a href=\"https://github.com/mvanhorn/last30days-skill\" target=\"_blank\" rel=\"noopener\">github.com/mvanhorn/last30days-skill ↗<\/a>", "agent-browser: Claude maneja un navegador, paso a paso. Instalación: npm install -g agent-browser, después agent-browser install y npx skills add vercel-labs/agent-browser <a href=\"https://github.com/vercel-labs/agent-browser\" target=\"_blank\" rel=\"noopener\">github.com/vercel-labs/agent-browser ↗<\/a>", "skills (buscador): el instalador abierto de skills: busca e instala la que necesitas. Necesita Node.js 22.20 o más nuevo, igual que todos los comandos npx skills de esta lista. Instalación: npx skills find [LO QUE BUSCAS] y npx skills add usuario/repo <a href=\"https://github.com/vercel-labs/skills\" target=\"_blank\" rel=\"noopener\">github.com/vercel-labs/skills ↗<\/a>", "claude-hud: te muestra en vivo lo que hace Claude: contexto usado, límites de uso, herramientas y agentes activos. Necesita Node.js 22.18 o más nuevo. Instalación: /plugin marketplace add jarrodwatts/claude-hud, /plugin install claude-hud, /reload-plugins y /hud <a href=\"https://github.com/jarrodwatts/claude-hud\" target=\"_blank\" rel=\"noopener\">github.com/jarrodwatts/claude-hud ↗<\/a>"]}, {"h": "4. Marketing (4)", "lista": ["remotion: videos con código, sin línea de tiempo (skills oficiales de Remotion). Instalación: npx skills add remotion-dev/skills <a href=\"https://github.com/remotion-dev/skills\" target=\"_blank\" rel=\"noopener\">github.com/remotion-dev/skills ↗<\/a>", "marketingskills: decenas de skills de crecimiento y marketing: SEO, conversión, textos, anuncios y más. Instalación: npx skills add coreyhaines31/marketingskills <a href=\"https://github.com/coreyhaines31/marketingskills\" target=\"_blank\" rel=\"noopener\">github.com/coreyhaines31/marketingskills ↗<\/a>", "humanizer: saca el tono robótico de IA de tus textos. Instalación: /plugin marketplace add blader/humanizer y /plugin install humanizer@humanizer <a href=\"https://github.com/blader/humanizer\" target=\"_blank\" rel=\"noopener\">github.com/blader/humanizer ↗<\/a>", "social-media-research-skills: investigación de redes: posts que se destacan, comentarios y competencia. Necesita una clave de API de ScrapeCreators, un servicio externo con su propia cuenta. Instalación: npx skills add ScrapeCreators/social-media-research-skills <a href=\"https://github.com/ScrapeCreators/social-media-research-skills\" target=\"_blank\" rel=\"noopener\">github.com/ScrapeCreators/social-media-research-skills ↗<\/a>"]}, {"h": "Por dónde empezar", "pasos": ["Construir: superpowers.", "Diseño: ui-ux-pro-max e impeccable.", "Investigación: last30days.", "Marketing: humanizer."], "p": ["Si quieres más, en esta biblioteca tienes muchas otras guías de Claude."]}], "faq": [{"q": "¿Instalo las 22 a la vez?", "a": "No. La descripción de cada skill se carga en el contexto de todas tus sesiones (el contenido completo carga solo cuando se usa), y algunos plugins traen hooks que corren siempre. Instala las que vayas a usar y, si dos hacen lo mismo, quédate con una."}, {"q": "¿Funcionan fuera de Claude Code?", "a": "Muchas sí (Codex, Cursor y otros agentes); fíjate en el README de cada una."}, {"q": "¿Son gratis?", "a": "Los repos sí. Algunas usan servicios externos (como ScrapeCreators o Codex) que tienen su propia cuenta y sus límites."}], "usos": [{"e": "Construir", "c": "azul", "t": "superpowers y gstack", "d": "Planificar, depurar y herramientas de desarrollo."}, {"e": "Diseño", "c": "morado", "t": "ui-ux-pro-max e impeccable", "d": "Criterio de diseño y el pulido final."}, {"e": "Investigar", "c": "verde", "t": "last30days y graphify", "d": "Qué se dijo en internet y el mapa de tu proyecto."}, {"e": "Marketing", "c": "rosa", "t": "humanizer y marketingskills", "d": "Sacar el tono robótico y crecer."}], "fuentes": ["https://github.com/obra/superpowers", "https://github.com/garrytan/gstack", "https://github.com/JuliusBrussee/caveman", "https://github.com/DietrichGebert/ponytail", "https://github.com/openai/codex-plugin-cc", "https://github.com/ayghri/i-have-adhd", "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill", "https://github.com/Leonxlnx/taste-skill", "https://github.com/pbakaus/impeccable", "https://github.com/heygen-com/hyperframes", "https://github.com/emilkowalski/skills", "https://github.com/greensock/gsap-skills", "https://github.com/anthropics/skills", "https://github.com/Graphify-Labs/graphify", "https://github.com/mvanhorn/last30days-skill", "https://github.com/vercel-labs/agent-browser", "https://github.com/vercel-labs/skills", "https://github.com/jarrodwatts/claude-hud", "https://github.com/remotion-dev/skills", "https://github.com/coreyhaines31/marketingskills", "https://github.com/blader/humanizer", "https://github.com/ScrapeCreators/social-media-research-skills", "https://code.claude.com/docs/en/skills", "https://code.claude.com/docs/en/discover-plugins", "https://code.claude.com/docs/en/plugins/troubleshooting"], "ejemplo": {"titulo": "Ejemplo resuelto: el kit mínimo de una diseñadora web freelance", "negocio": "Ejemplo inventado: una diseñadora y desarrolladora web freelance en Medellín, Colombia. Arma sitios para comercios del barrio (una peluquería, una tienda de bicicletas) y trabaja sola con Claude Code.", "punto_de_partida": "Los sitios le salían prolijos pero parecidos entre sí, y los textos sonaban a plantilla. Había instalado varias skills de un video y ya no sabía cuáles tenía.", "pasos": ["Corrió /plugin list, npx skills list y revisó ~/.claude/skills/. Anotó todo en el registro del kit y sacó lo que no había usado con claude plugin uninstall y npx skills remove.", "Comprobó node --version y python3 --version. Tenía Node 20, así que lo actualizó a 22 antes de seguir.", "Siguió el perfil B del plan del kit: instaló ui-ux-pro-max con sus dos comandos /plugin y, en la carpeta del sitio de la peluquería, corrió npx impeccable install. Recargó Claude Code y corrió /impeccable init, que le hizo preguntas sobre el negocio y escribió PRODUCT.md.", "Le pidió a Claude Code que propusiera paleta y tipografías para la peluquería con ui-ux-pro-max, y después corrió /impeccable critique sobre la portada que ya tenía.", "Para los textos instaló humanizer y pasó por /humanizer:humanizer la sección Quiénes somos que le había mandado la dueña.", "Al terminar la semana revisó el registro: siguió usando las tres y no instaló nada más."], "resultado": "Quedaron tres herramientas anotadas en el registro, con su comando para sacarlas. Cada sitio nuevo arranca con /impeccable init y una consulta de paleta, y los textos pasan por humanizer antes de entregarse."}, "si_falla": [{"sintoma": "Pegas un comando /plugin y Claude responde \"/plugin isn't available in this environment\".", "solucion": "Estás en la pestaña Code de la app de escritorio, en la extensión de VS Code o en Claude Code en la web. Abre una terminal, corre claude y pega el comando ahí. Otra opción: usa la versión de terminal, claude plugin marketplace add DUEÑO/REPO y claude plugin install NOMBRE@MARKETPLACE, o el comando npx skills add si el README lo ofrece."}, {"sintoma": "La misma skill aparece dos veces en el menú / (por ejemplo, last30days).", "solucion": "La instalaste por dos caminos (plugin y npx skills) y Claude Code no junta las copias. Quédate con uno: saca la copia de npx con npx skills remove NOMBRE -g, o la del plugin con claude plugin uninstall NOMBRE@MARKETPLACE."}, {"sintoma": "Un comando npx skills add o un plugin que usa Node falla apenas arranca, con errores de sintaxis o de versión.", "solucion": "Corre node --version. El instalador npx skills pide 22.20 o más nuevo, taste-skill y hyperframes piden 22 o más, y claude-hud 22.18 o más. Actualiza Node (desde nodejs.org o con tu gestor de versiones), cierra la terminal, ábrela de nuevo y repite."}, {"sintoma": "Instalaste graphify con uv tool install graphifyy pero la terminal dice que graphify no existe.", "solucion": "La carpeta de herramientas de uv no está en tu PATH. Corre uv tool update-shell, cierra y abre la terminal, y después graphify install."}, {"sintoma": "Al instalar aparece Plugin \"NOMBRE\" not found in marketplace \"MARKETPLACE\".", "solucion": "Casi siempre es el nombre. Abre /plugin, pestaña Discover, y copia el nombre exacto de la lista. Si el plugin es nuevo, refresca el catálogo con /plugin marketplace update MARKETPLACE y prueba de nuevo. Si el error dice Marketplace not found, te falta el paso /plugin marketplace add DUEÑO/REPO."}], "kit": [{"archivo": "plan-de-instalacion-skills-por-perfil.md", "que_es": "Plan corto para instalar solo lo que te sirve según tu perfil (negocio, freelancer web, dev junior, investigación), con los comandos verificados, los requisitos y una prueba para cada bloque.", "contenido": "# Plan de instalación por perfil (22 skills para Claude Code)\n\nNo instales todo. Elige tu perfil, instala solo ese bloque, úsalo una semana y recién después suma otra.\n\n## Antes de empezar (todos)\n\n1. Abre una terminal y corre `claude --version`. Si `/plugin` no existe, actualiza Claude Code.\n2. Corre `node --version`. Varias de estas skills piden Node.js 22 o más nuevo (el instalador `npx skills` pide 22.20 o más nuevo).\n3. Los comandos que empiezan con `/plugin` van dentro de una sesión de Claude Code en la terminal (no en la pestaña Code de la app de escritorio ni en la extensión de VS Code). Los que empiezan con `npx`, `npm`, `uv`, `git` o `claude plugin` van en la terminal, fuera de la sesión.\n4. Abre el registro (registro-skills-instaladas.md) y anota cada cosa que instales.\n\n## Perfil A: dueño de negocio que arma textos y contenido\n\nObjetivo: textos que no suenen a IA y piezas de marketing.\n\n- humanizer: `/plugin marketplace add blader/humanizer` y `/plugin install humanizer@humanizer`. Se usa con `/humanizer:humanizer`.\n- marketingskills: `npx skills add coreyhaines31/marketingskills --list` para ver la lista, y después instala solo las que vas a usar con `npx skills add coreyhaines31/marketingskills --skill NOMBRE`.\n\nPrueba: pega un texto tuyo y pídele \"pásalo por humanizer y dime qué cambiaste\".\n\n## Perfil B: freelancer que entrega webs a clientes\n\nObjetivo: que el sitio no se vea genérico.\n\n- ui-ux-pro-max: `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` y `/plugin install ui-ux-pro-max@ui-ux-pro-max-skill`. Su buscador usa Python 3: compruébalo con `python3 --version`.\n- impeccable: en la carpeta del proyecto, `npx impeccable install`. Recarga Claude Code y corre `/impeccable init` una vez por proyecto.\n- humanizer, para los textos del sitio (ver perfil A).\n\nPrueba: `/impeccable critique` sobre una sección que ya tengas armada.\n\n## Perfil C: dev junior que construye sistemas\n\nObjetivo: planificar antes de escribir código y no perder el hilo.\n\n- superpowers: `/plugin install superpowers@claude-plugins-official`.\n- claude-hud: `/plugin marketplace add jarrodwatts/claude-hud`, `/plugin install claude-hud`, `/reload-plugins` y `/hud`. Pide Node.js 22.18 o más nuevo.\n- codex (opcional, si ya usas ChatGPT): `/plugin marketplace add openai/codex-plugin-cc`, `/plugin install codex@openai-codex` y `/codex:setup`.\n\nPrueba: pídele una función chica y fíjate si primero te propone un plan.\n\n## Perfil D: investigación y contenido para redes\n\n- last30days: `/plugin marketplace add mvanhorn/last30days-skill` y `/plugin install last30days`. Usa un solo método de instalación: si además la instalas con `npx skills`, aparece dos veces.\n- social-media-research-skills (solo si vas a pagar ScrapeCreators): `npx skills add ScrapeCreators/social-media-research-skills` y la clave en la variable `SCRAPECREATORS_API_KEY`.\n\n## Después de la primera semana\n\n- [ ] ¿La usaste al menos en una tarea real? Si no, sácala (ver el registro).\n- [ ] ¿Dos skills hacen lo mismo? Quédate con una.\n- [ ] ¿Alguna trae hooks o pide claves? Revisa que sepas qué hace con ellas.\n"}, {"archivo": "registro-skills-instaladas.md", "que_es": "Planilla en markdown para anotar qué instalaste, cómo y para qué, con el comando exacto para listar y sacar cada cosa según el método de instalación.", "contenido": "# Registro de skills y plugins instalados\n\nAnota cada cosa que instalas. Te sirve para saber qué tienes, por qué y cómo sacarlo.\n\n| Fecha | Nombre | Cómo la instalé | Alcance | Para qué la uso | Pide algo extra | ¿La sigo usando? |\n|---|---|---|---|---|---|---|\n| [AAAA-MM-DD] | [NOMBRE] | [/plugin, npx skills, npx propio, uv, git] | [User, Project, Local o global] | [UNA LÍNEA] | [Node, Python, clave, cuenta] | [SÍ / NO / REVISAR] |\n\n## Cómo ver lo que tienes\n\n- Plugins de Claude Code: `/plugin list` dentro de la sesión o `claude plugin list` en la terminal.\n- Skills instaladas con el instalador abierto: `npx skills list`.\n- Skills sueltas: mira la carpeta `~/.claude/skills/` y la carpeta `.claude/skills/` de cada proyecto.\n\n## Cómo sacar cada cosa, según cómo la instalaste\n\n- Con `/plugin` o `claude plugin install`: `claude plugin uninstall NOMBRE@MARKETPLACE`. Si quieres sacar todo un catálogo: `/plugin marketplace remove NOMBRE` (desinstala todos sus plugins).\n- Con `npx skills add`: `npx skills remove NOMBRE` (suma `-g` si la instalaste global).\n- Con `git clone` en `~/.claude/skills/` (por ejemplo gstack): sigue la desinstalación del README del repo antes de borrar la carpeta, porque su setup puede haber registrado hooks.\n- Con un instalador propio (`npx impeccable install`, `graphify install`, `npx @caveman-ai/cli`): usa el comando de desinstalación que indica su README.\n\n## Regla de la casa\n\nSi algo no lo usaste en dos semanas, sácalo. Cada skill suma su descripción al contexto de todas tus sesiones.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "22-skills-claude-code", "t": "Las 22 mejores skills para Claude Code, con su instalación", "d": "Repos de GitHub para construir, diseñar, investigar y hacer marketing con Claude, con el comando para instalar cada uno, para que tus sistemas para clientes no se vean genéricos.", "tema": "Skills", "min": 11, "ficha": [["Qué es", "Las 22 mejores skills para Claude Code, con su repositorio y su comando: construir, diseñar, investigar y marketing."], ["Para quién", "Quien arma sistemas para clientes con Claude y no quiere que se vean genéricos."], ["Necesitás", "Claude Code. Algunas piden además Node.js, Python o una clave de un servicio externo."], ["Ojo", "Son proyectos de terceros: instalá solo las que vayas a usar y revisá qué hacen."], ["Por dónde empezar", "superpowers, ui-ux-pro-max, impeccable, last30days y humanizer."]], "secciones": [{"h": "Cómo instalarlas", "p": ["Lo más fácil es pegarle a Claude Code el link del repositorio y pedirle «instalá esta skill y comprobá que funciona». Abajo tenés además el comando que figura en el README de cada una. Los que empiezan con /plugin van dentro de Claude Code; los que empiezan con npx, npm, uv o git, en la terminal."], "prompts": [{"t": "Instalar una", "c": "Instalá esta skill desde [LINK DEL REPO]. Leé su README, usá el método de instalación que recomienda y después decime cómo se usa y probala con un ejemplo chico."}], "aviso": "Son proyectos de terceros. Instalá solo las que vayas a usar y revisá qué hacen antes de darles acceso a tus archivos."}, {"h": "1. Construir (6)", "lista": ["superpowers: planifica y depura antes de escribir código. Instalación: /plugin install superpowers@claude-plugins-official <a href=\"https://github.com/obra/superpowers\" target=\"_blank\" rel=\"noopener\">github.com/obra/superpowers ↗<\/a>", "gstack: un equipo de desarrollo virtual (producto, arquitectura, diseño, revisión) en una sola instalación. Instalación: git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git ~/gstack y después cd ~/gstack && ./setup <a href=\"https://github.com/garrytan/gstack\" target=\"_blank\" rel=\"noopener\">github.com/garrytan/gstack ↗<\/a>", "caveman: respuestas con muchos menos tokens. Instalación: /plugin marketplace add JuliusBrussee/caveman y /plugin install caveman@caveman <a href=\"https://github.com/JuliusBrussee/caveman\" target=\"_blank\" rel=\"noopener\">github.com/JuliusBrussee/caveman ↗<\/a>", "ponytail: que Claude escriba solo el código que hace falta. Instalación: /plugin marketplace add DietrichGebert/ponytail y /plugin install ponytail@ponytail <a href=\"https://github.com/DietrichGebert/ponytail\" target=\"_blank\" rel=\"noopener\">github.com/DietrichGebert/ponytail ↗<\/a>", "codex: el plugin oficial de OpenAI para usar Codex dentro de Claude Code (revisiones de código o pasarle tareas). Necesita una cuenta de ChatGPT (incluso la gratis) o una clave de OpenAI. Instalación: /plugin marketplace add openai/codex-plugin-cc, /plugin install codex@openai-codex y después /codex:setup <a href=\"https://github.com/openai/codex-plugin-cc\" target=\"_blank\" rel=\"noopener\">github.com/openai/codex-plugin-cc ↗<\/a>", "i-have-adhd: que no entierre la respuesta en relleno. Instalación: pedile a Claude Code que la instale desde el repo siguiendo su AGENTS.md (es lo que indica el README). <a href=\"https://github.com/ayghri/i-have-adhd\" target=\"_blank\" rel=\"noopener\">github.com/ayghri/i-have-adhd ↗<\/a>"]}, {"h": "2. Diseño (6)", "lista": ["ui-ux-pro-max: criterio de diseño, paletas y tipografías. Instalación: /plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill y /plugin install ui-ux-pro-max@ui-ux-pro-max-skill <a href=\"https://github.com/nextlevelbuilder/ui-ux-pro-max-skill\" target=\"_blank\" rel=\"noopener\">github.com/nextlevelbuilder/ui-ux-pro-max-skill ↗<\/a>", "taste-skill: webs de empresa que se ven profesionales en lugar de una landing genérica. Necesita Node 22 o más nuevo y Chrome, Edge o Chromium. Instalación: /plugin marketplace add Leonxlnx/taste-skill y /plugin install taste-skill@taste-skill <a href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener\">github.com/Leonxlnx/taste-skill ↗<\/a>", "impeccable: el vocabulario de diseño para pulir y revisar el front end (polish, critique, audit y más). Instalación: en la carpeta del proyecto, npx impeccable install; después /impeccable init <a href=\"https://github.com/pbakaus/impeccable\" target=\"_blank\" rel=\"noopener\">github.com/pbakaus/impeccable ↗<\/a>", "hyperframes: escribís HTML y sale un video MP4. Instalación: en la terminal, claude plugin marketplace add heygen-com/hyperframes y claude plugin install hyperframes@hyperframes <a href=\"https://github.com/heygen-com/hyperframes\" target=\"_blank\" rel=\"noopener\">github.com/heygen-com/hyperframes ↗<\/a>", "skills de Emil Kowalski: animaciones de interfaz fluidas. Instalación: npx skills@latest add emilkowalski/skills <a href=\"https://github.com/emilkowalski/skills\" target=\"_blank\" rel=\"noopener\">github.com/emilkowalski/skills ↗<\/a>", "gsap: animación web profesional (skills oficiales de GSAP). Instalación: npx skills add https://github.com/greensock/gsap-skills <a href=\"https://github.com/greensock/gsap-skills\" target=\"_blank\" rel=\"noopener\">github.com/greensock/gsap-skills ↗<\/a>"]}, {"h": "3. Investigación (6)", "lista": ["skill-creator: creá tus propias skills (viene en las skills oficiales de Anthropic, dentro del paquete example-skills). Instalación: /plugin marketplace add anthropics/skills y /plugin install example-skills@anthropic-agent-skills <a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/skills ↗<\/a>", "graphify: convierte tu proyecto o tus notas en un mapa que Claude puede consultar. Necesita Python 3.10 o más nuevo y uv. Instalación: uv tool install graphifyy y después graphify install <a href=\"https://github.com/Graphify-Labs/graphify\" target=\"_blank\" rel=\"noopener\">github.com/Graphify-Labs/graphify ↗<\/a>", "last30days: qué se dijo en internet en los últimos 30 días sobre un tema. Instalación: /plugin marketplace add mvanhorn/last30days-skill y /plugin install last30days <a href=\"https://github.com/mvanhorn/last30days-skill\" target=\"_blank\" rel=\"noopener\">github.com/mvanhorn/last30days-skill ↗<\/a>", "agent-browser: Claude maneja un navegador, paso a paso. Instalación: npm install -g agent-browser, después agent-browser install y npx skills add vercel-labs/agent-browser <a href=\"https://github.com/vercel-labs/agent-browser\" target=\"_blank\" rel=\"noopener\">github.com/vercel-labs/agent-browser ↗<\/a>", "skills (buscador): el instalador abierto de skills: busca e instala la que necesitás. Instalación: npx skills find [LO QUE BUSCÁS] y npx skills add usuario/repo <a href=\"https://github.com/vercel-labs/skills\" target=\"_blank\" rel=\"noopener\">github.com/vercel-labs/skills ↗<\/a>", "claude-hud: te muestra en vivo lo que hace Claude: contexto usado, límites de uso, herramientas y agentes activos. Necesita Node.js 22.18 o más nuevo. Instalación: /plugin marketplace add jarrodwatts/claude-hud, /plugin install claude-hud, /reload-plugins y /hud <a href=\"https://github.com/jarrodwatts/claude-hud\" target=\"_blank\" rel=\"noopener\">github.com/jarrodwatts/claude-hud ↗<\/a>"]}, {"h": "4. Marketing (4)", "lista": ["remotion: videos con código, sin línea de tiempo (skills oficiales de Remotion). Instalación: npx skills add remotion-dev/skills <a href=\"https://github.com/remotion-dev/skills\" target=\"_blank\" rel=\"noopener\">github.com/remotion-dev/skills ↗<\/a>", "marketingskills: decenas de skills de crecimiento y marketing: SEO, conversión, textos, anuncios y más. Instalación: npx skills add coreyhaines31/marketingskills <a href=\"https://github.com/coreyhaines31/marketingskills\" target=\"_blank\" rel=\"noopener\">github.com/coreyhaines31/marketingskills ↗<\/a>", "humanizer: saca el tono robótico de IA de tus textos. Instalación: /plugin marketplace add blader/humanizer y /plugin install humanizer@humanizer <a href=\"https://github.com/blader/humanizer\" target=\"_blank\" rel=\"noopener\">github.com/blader/humanizer ↗<\/a>", "social-media-research-skills: investigación de redes: posts que se destacan, comentarios y competencia. Necesita una clave de API de ScrapeCreators, un servicio externo con su propia cuenta. Instalación: npx skills add ScrapeCreators/social-media-research-skills <a href=\"https://github.com/ScrapeCreators/social-media-research-skills\" target=\"_blank\" rel=\"noopener\">github.com/ScrapeCreators/social-media-research-skills ↗<\/a>"]}, {"h": "Por dónde empezar", "pasos": ["Construir: superpowers.", "Diseño: ui-ux-pro-max e impeccable.", "Investigación: last30days.", "Marketing: humanizer."], "p": ["Si querés más, en esta biblioteca tenés muchas otras guías de Claude."]}], "faq": [{"q": "¿Instalo las 22 a la vez?", "a": "No. Cada skill suma instrucciones; instalá en cada proyecto las que vayas a usar."}, {"q": "¿Funcionan fuera de Claude Code?", "a": "Muchas sí (Codex, Cursor y otros agentes); fijate en el README de cada una."}, {"q": "¿Son gratis?", "a": "Los repos sí. Algunas usan servicios externos (como ScrapeCreators o Codex) que tienen su propia cuenta y sus límites."}], "usos": [{"e": "Construir", "c": "azul", "t": "superpowers y gstack", "d": "Planificar, depurar y herramientas de desarrollo."}, {"e": "Diseño", "c": "morado", "t": "ui-ux-pro-max e impeccable", "d": "Criterio de diseño y el pulido final."}, {"e": "Investigar", "c": "verde", "t": "last30days y graphify", "d": "Qué se dijo en internet y el mapa de tu proyecto."}, {"e": "Marketing", "c": "rosa", "t": "humanizer y marketingskills", "d": "Sacar el tono robótico y crecer."}], "fuentes": ["https://github.com/obra/superpowers", "https://github.com/garrytan/gstack", "https://github.com/JuliusBrussee/caveman", "https://github.com/DietrichGebert/ponytail", "https://github.com/openai/codex-plugin-cc", "https://github.com/ayghri/i-have-adhd", "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill", "https://github.com/Leonxlnx/taste-skill", "https://github.com/pbakaus/impeccable", "https://github.com/heygen-com/hyperframes", "https://github.com/emilkowalski/skills", "https://github.com/greensock/gsap-skills", "https://github.com/anthropics/skills", "https://github.com/Graphify-Labs/graphify", "https://github.com/mvanhorn/last30days-skill", "https://github.com/vercel-labs/agent-browser", "https://github.com/vercel-labs/skills", "https://github.com/jarrodwatts/claude-hud", "https://github.com/remotion-dev/skills", "https://github.com/coreyhaines31/marketingskills", "https://github.com/blader/humanizer", "https://github.com/ScrapeCreators/social-media-research-skills"]};</script>

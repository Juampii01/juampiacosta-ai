<script>var GUIA = {"slug": "segundo-cerebro-de-tu-negocio", "t": "El segundo cerebro de tu negocio en un Proyecto de Claude", "d": "Procesos, precios, preguntas frecuentes y políticas en un solo lugar, para que cualquiera del equipo consulte y responda igual que vos.", "tema": "Negocio", "min": 9, "fichaNombre": "Segundo cerebro del negocio", "ficha": [["Qué es", "Un Proyecto de Claude con los documentos clave de tu negocio y reglas para responder."], ["Necesitás", "Cualquier cuenta de Claude. Para compartirlo con el equipo, un plan Team o Enterprise."], ["Tiempo", "Una tarde para juntar y ordenar los documentos. Lo demás es mantenerlo al día."], ["Qué no hace", "No se actualiza solo: si cambia un precio, cambiás el documento."]], "secciones": [{"h": "Por qué te conviene", "p": ["En casi todo negocio chico hay una persona que sabe todo y a la que todos le preguntan. Cuando no está, se frena todo o cada uno responde distinto.", "Un Proyecto de Claude es un espacio con su propio historial de chats, sus propios documentos y sus propias instrucciones. Si ponés ahí lo que sabe esa persona, el equipo tiene a quién preguntar."]}, {"h": "Qué documentos subir", "lista": ["Procesos: cómo se hace cada cosa, paso a paso (abrir, cerrar, entregar, devolver).", "Precios y servicios: lista actualizada, con qué incluye cada cosa y qué no.", "Preguntas frecuentes: las que te hacen los clientes, con la respuesta que das vos.", "Políticas: cambios, devoluciones, cancelaciones, garantías, horarios, medios de pago.", "Tono: dos o tres ejemplos de mensajes bien respondidos, para que copie el estilo."], "aviso": "Nada de contraseñas, datos bancarios ni datos personales de clientes. Esto lo va a consultar todo el equipo."}, {"h": "Armalo paso a paso", "pasos": ["Escribí o juntá cada documento. Uno por tema, con nombre claro: \"Precios - actualizado [MES AÑO].pdf\".", "Arriba de cada documento poné quién es responsable y la fecha de la última actualización.", "En Claude entrá a Proyectos y

<script>var GUIA = {"slug": "segundo-cerebro-de-tu-negocio", "post": "CEREBRO", "t": "El segundo cerebro de tu negocio en un Proyecto de Claude", "d": "Procesos, precios, preguntas frecuentes y políticas en un solo lugar, para que cualquiera del equipo consulte y responda igual que tú.", "tema": "IA en tu negocio", "min": 9, "fichaNombre": "Segundo cerebro del negocio", "ficha": [["Qué es", "Un Proyecto de Claude con los documentos clave de tu negocio y reglas para responder."], ["Necesitas", "Cualquier cuenta de Claude. Para compartirlo con el equipo, un plan Team o Enterprise."], ["Tiempo", "Una tarde para juntar y ordenar los documentos. Lo demás es mantenerlo al día."], ["Qué no hace", "No se actualiza solo: si cambia un precio, cambias el documento."]], "secciones": [{"h": "Por qué te conviene", "p": ["En casi todo negocio chico hay una persona que sabe todo y a la que todos le preguntan. Cuando no está, se frena todo o cada uno responde distinto.", "Un Proyecto de Claude es un espacio con su propio historial de chats, sus propios documentos y sus propias instrucciones. Si pones ahí lo que sabe esa persona, el equipo tiene a quién preguntar."]}, {"h": "Qué documentos subir", "lista": ["Procesos: cómo se hace cada cosa, paso a paso (abrir, cerrar, entregar, devolver).", "Precios y servicios: lista actualizada, con qué incluye cada cosa y qué no.", "Preguntas frecuentes: las que te hacen los clientes, con la respuesta que das tú.", "Políticas: cambios, devoluciones, cancelaciones, garantías, horarios, medios de pago.", "Tono: dos o tres ejemplos de mensajes bien respondidos, para que copie el estilo."], "aviso": "Nada de contraseñas, datos bancarios ni datos personales de clientes. Esto lo va a consultar todo el equipo."}, {"h": "Ármalo paso a paso", "pasos": ["Escribe o junta cada documento. Uno por tema, con nombre claro: \"Precios - actualizado [MES AÑO].pdf\".", "Arriba de cada documento pon quién es responsable y la fecha de la última actualización.", "En Claude entra a Projects (en la barra lateral o en claude.ai/projects), toca + New Project y ponle \"Cerebro de [TU NEGOCIO]\". En los planes Team y Enterprise elige en ese momento si queda privado (Keep it private) o compartido con toda la organización (Share with your broader organization).", "Sube los documentos al conocimiento del proyecto.", "Toca Set project instructions, pega las instrucciones de abajo y guarda con Save instructions.", "Pruébalo con diez preguntas reales de clientes antes de mostrárselo al equipo."], "prompts": [{"t": "Instrucciones del proyecto", "c": "Eres el asistente interno de [NOMBRE DEL NEGOCIO]. Te consulta el equipo, no los clientes.\nTienes los documentos oficiales: procesos, precios, preguntas frecuentes y políticas.\n\nCuando te pregunten algo:\n1. Responde corto y directo.\n2. Di de qué documento sale la respuesta.\n3. Si la pregunta es para contestarle a un cliente, dame además un borrador listo para mandar, con el tono de los ejemplos.\n4. Si dos documentos se contradicen, avisa y no elijas tú.\n5. Si algo no está en los documentos, di \"No está en el cerebro\" y sugiere a quién preguntarle: [NOMBRE O PUESTO].\n6. Nunca inventes precios, plazos ni excepciones a las políticas."}]}, {"h": "Compártelo con el equipo", "p": ["En los planes Team y Enterprise puedes compartir un proyecto con otras personas de tu organización: abre el proyecto, toca Share project (al lado del nombre), suma a las personas por nombre o mail, elige el permiso de cada una y confirma con Share. Hay dos niveles, Can view y Can edit:"], "lista": ["Puede ver: la persona ve los documentos y las instrucciones y chatea dentro del proyecto, pero no cambia nada.", "Puede editar: modifica instrucciones y documentos y suma o saca personas."]}, {"h": "Mantenlo vivo", "lista": ["Un responsable por documento: si nadie es dueño, nadie lo actualiza.", "Revisión fija: una vez por mes, mira precios y políticas.", "Las preguntas que no sabe son oro: cada vez que responde \"No está en el cerebro\", agrega esa respuesta al documento que corresponde."]}], "faq": [{"q": "¿Cuántos documentos puedo subir?", "a": "Depende del tamaño. En los planes pagos, cuando el conocimiento crece, Claude activa un modo que le permite manejar mucho más contenido sin perder calidad."}, {"q": "¿Puedo usarlo con el plan gratis?", "a": "Sí, los proyectos están en todos los planes (el gratis tiene un límite de proyectos). Lo que no puedes en el gratis es compartirlo con el equipo."}, {"q": "¿Se lo puedo dar a los clientes?", "a": "Este proyecto es para uso interno. Para atender clientes directamente hace falta otra cosa, como el agente de WhatsApp de la biblioteca."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"], "ejemplo": {"titulo": "Ejemplo resuelto: el cerebro de una bicicletería con taller", "negocio": "Ejemplo inventado: una bicicletería con taller en Neuquén capital. El dueño, una encargada de local, dos mecánicos y una persona que atiende la tienda online. Venden bicis, repuestos y accesorios, y hacen services y reparaciones.", "punto_de_partida": "Todo lo sabía la encargada: qué incluye cada service, cuánto tarda una reparación, qué garantía tiene una bici. Cuando ella tenía franco, los mecánicos respondían distinto y la tienda online tardaba en contestar.", "pasos": ["Con las plantillas del kit, la encargada escribió cinco documentos en una tarde: Procesos del taller, Precios y servicios, Preguntas frecuentes, Políticas (garantía, cambios, señas) y Tono, con tres conversaciones bien respondidas sin datos de clientes.", "Puso arriba de cada uno el responsable y la fecha. Precios quedó a cargo del dueño; procesos y preguntas, a cargo de ella.", "El negocio ya tenía plan Team. El dueño entró a Projects, tocó + New Project, lo llamó \"Cerebro de la bicicletería\" y lo dejó privado (Keep it private) para sumar solo al equipo del local.", "Subió los cinco documentos con el + del panel de conocimiento y pegó las instrucciones del kit en Set project instructions, completando el rubro, la ciudad y que las dudas van a la encargada.", "Hicieron la prueba de las diez preguntas del kit. La pregunta \"¿el service incluye cambio de cadena?\" salió mal: el documento de precios decía que no y el de preguntas frecuentes, que sí. Claude avisó la contradicción, como piden las instrucciones. Corrigieron el documento de preguntas.", "Con las diez bien, el dueño tocó Share project y sumó a los mecánicos y a la de la tienda online con Can view, y a la encargada con Can edit.", "Dejaron una planilla compartida con el registro de \"No está en el cerebro\". En la primera semana aparecieron preguntas sobre envíos al interior de la provincia, que no estaban escritas.", "Fijaron la revisión mensual el primer lunes de cada mes, con la checklist del kit."], "resultado": "Quedó un Proyecto privado del equipo con cinco documentos fechados y con dueño, instrucciones que citan la fuente y avisan contradicciones, y un registro de lo que falta escribir. Cuando la encargada no está, el equipo consulta el cerebro y responde con la misma información que ella."}, "si_falla": [{"sintoma": "Claude responde con un precio viejo aunque ya actualizaste el documento.", "solucion": "Revisa que hayas borrado la versión anterior del conocimiento del Proyecto. Si están las dos, puede tomar cualquiera. Deja una sola versión por tema y la fecha de actualización arriba, así la respuesta dice de cuándo es el dato."}, {"sintoma": "No aparece el botón Share project.", "solucion": "Compartir proyectos está solo en los planes Team y Enterprise. En Free, Pro o Max no hay forma de sumar a otra persona al mismo Proyecto: cada uno tendría que armar el suyo con los mismos documentos, o el negocio pasa a un plan Team."}, {"sintoma": "Un compañero dice que no ve el Proyecto.", "solucion": "Si lo creaste con Keep it private, solo lo ven las personas que sumaste con Share project. Fíjate que esté en la lista con Can view o Can edit y que haya entrado con la cuenta de la organización, no con una cuenta personal."}, {"sintoma": "Claude contesta con información general del rubro en vez de lo que dicen tus documentos.", "solucion": "Pasa cuando el dato no está escrito o está ambiguo. Confirma que las instrucciones del Proyecto estén guardadas (Save instructions) y que incluyan la regla de decir \"No está en el cerebro\". Después busca el dato en tus documentos: si no está, súmalo."}, {"sintoma": "En el plan Free no puedes crear un Proyecto nuevo.", "solucion": "El plan Free permite hasta cinco proyectos. Borra uno que no uses, o junta todo en un solo cerebro: conviene un único Proyecto con documentos por tema antes que varios proyectos chicos."}], "kit": [{"archivo": "cerebro-del-negocio-plantillas-e-instrucciones.md", "que_es": "Cómo nombrar y encabezar cada documento, una plantilla por tipo (procesos, precios, preguntas frecuentes, políticas y tono) y las instrucciones del Proyecto ampliadas, listas para pegar en Set project instructions.", "contenido": "# Cerebro de [TU NEGOCIO]: plantillas de documentos e instrucciones\n\nEste archivo tiene tres partes: cómo nombrar y encabezar cada documento, una plantilla por tipo de documento y las instrucciones para pegar en \"Set project instructions\".\n\n## 1. Nombres y encabezado\n\nUn documento por tema. Nombre con tema y fecha:\n\n- Procesos - [ÁREA] - actualizado [MES AÑO]\n- Precios y servicios - actualizado [MES AÑO]\n- Preguntas frecuentes - actualizado [MES AÑO]\n- Políticas - actualizado [MES AÑO]\n- Tono - ejemplos de respuestas - actualizado [MES AÑO]\n\nArriba de cada documento, siempre estas tres líneas:\n\n```\nResponsable: [NOMBRE]\nÚltima actualización: [AAAA-MM-DD]\nVale para: [TODAS LAS SUCURSALES / SUCURSAL X / SOLO VENTA ONLINE]\n```\n\nCuando actualices un documento, borra la versión vieja del Proyecto antes de subir la nueva. Si quedan las dos, Claude puede encontrar datos que se contradicen.\n\n## 2. Plantillas\n\n### Procesos\n\n```\nProceso: [NOMBRE, EJ.: ENTREGA DE UN PEDIDO]\nQuién lo hace: [PUESTO]\nCuándo: [EN QUÉ MOMENTO]\nPasos:\n1. [PASO]\n2. [PASO]\nQué hacer si algo sale mal: [EJ.: SI FALTA UN PRODUCTO, AVISAR A...]\nA quién preguntar si hay dudas: [NOMBRE O PUESTO]\n```\n\n### Precios y servicios\n\n```\nServicio o producto: [NOMBRE]\nPrecio: [PRECIO] [MONEDA] (vigente desde [FECHA])\nIncluye: [QUÉ]\nNo incluye: [QUÉ]\nCondiciones: [EJ.: SEÑA, PLAZO, MEDIOS DE PAGO]\n```\n\nUna entrada por servicio. Si un precio depende de algo (medida, cantidad, zona), escribe la regla, no un ejemplo.\n\n### Preguntas frecuentes\n\n```\nP: [LA PREGUNTA COMO LA HACE EL CLIENTE]\nR: [LA RESPUESTA QUE DAS TÚ]\nOjo: [EXCEPCIONES O CUÁNDO DERIVAR A UNA PERSONA]\n```\n\n### Políticas\n\n```\nPolítica: [CAMBIOS / DEVOLUCIONES / CANCELACIONES / GARANTÍAS / HORARIOS / MEDIOS DE PAGO]\nRegla: [LA REGLA, CLARA]\nPlazo: [SI APLICA]\nExcepciones que se pueden hacer: [CUÁLES Y QUIÉN LAS AUTORIZA]\nExcepciones que nunca se hacen: [CUÁLES]\n```\n\n### Tono\n\nPega dos o tres conversaciones reales bien respondidas, sin nombres, teléfonos ni datos del cliente. Antes de cada una, una línea de contexto: \"Cliente que pregunta por un cambio fuera de plazo\".\n\n## 3. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente interno de [NOMBRE DEL NEGOCIO], un negocio de [RUBRO] en [CIUDAD]. Te consulta el equipo, no los clientes.\n\nTienes los documentos oficiales del negocio: procesos, precios y servicios, preguntas frecuentes, políticas y ejemplos de tono. Cada uno dice quién es responsable y cuándo se actualizó.\n\nCuando te pregunten algo:\n1. Responde corto y directo.\n2. Di de qué documento sale la respuesta y su fecha de actualización.\n3. Si la pregunta es para contestarle a un cliente, dame además un borrador listo para mandar, con el tono de los ejemplos.\n4. Si dos documentos se contradicen, avisa cuáles son y no elijas tú.\n5. Si un documento tiene más de [N] meses sin actualizar, avisa que el dato puede estar viejo.\n6. Si algo no está en los documentos, di \"No está en el cerebro\" y sugiere a quién preguntarle: [NOMBRE O PUESTO].\n7. Nunca inventes precios, plazos ni excepciones a las políticas. No completes con lo que suele hacer el rubro.\n8. Si te piden algo que está en \"Excepciones que nunca se hacen\", dilo claro aunque la persona insista.\n\nNo guardes ni repitas datos personales de clientes que alguien pegue en el chat. Si los necesitas para responder, usa un alias.\n"}, {"archivo": "cerebro-del-negocio-prueba-y-mantenimiento.md", "que_es": "La planilla de las diez preguntas de prueba antes de mostrárselo al equipo, el registro de \"No está en el cerebro\", la checklist de revisión mensual y la tabla de responsables.", "contenido": "# Cerebro de [TU NEGOCIO]: prueba y mantenimiento\n\n## Antes de mostrárselo al equipo: las diez preguntas\n\nJunta diez preguntas reales que te hicieron clientes o empleados en el último mes. Que haya de todo tipo:\n\n| # | Tipo | Pregunta real | Respuesta esperada (la tuya) | Qué contestó Claude | ¿Citó bien el documento? | ¿Coincide? | Qué corregir |\n|---|---|---|---|---|---|---|---|\n| 1 | Precio | | | | | | |\n| 2 | Precio con condición | | | | | | |\n| 3 | Proceso | | | | | | |\n| 4 | Política (cambio o devolución) | | | | | | |\n| 5 | Excepción que sí se hace | | | | | | |\n| 6 | Excepción que nunca se hace | | | | | | |\n| 7 | Horario o medio de pago | | | | | | |\n| 8 | Algo que NO está en los documentos | | \"No está en el cerebro\" | | | | |\n| 9 | Pregunta para responderle a un cliente | | Respuesta + borrador | | | | |\n| 10 | Pregunta ambigua o mal escrita | | | | | | |\n\nListo para el equipo cuando:\n- [ ] Las diez coinciden con lo que tú responderías.\n- [ ] La 8 dice \"No está en el cerebro\" y no inventa.\n- [ ] La 6 no cede aunque insistas en el mismo chat.\n- [ ] Los borradores para clientes suenan como tú.\n\nSi alguna falla, casi siempre el problema está en el documento (falta, es ambiguo o hay dos versiones), no en las instrucciones. Corrige el documento primero.\n\n## Registro de \"No está en el cerebro\"\n\nCada vez que Claude conteste eso, quien preguntó suma una fila aquí. Es la lista de lo que falta escribir.\n\n| Fecha | Quién preguntó | Pregunta | Respuesta correcta | En qué documento va | ¿Agregado? |\n|---|---|---|---|---|---|\n| | | | | | |\n\n## Revisión mensual (una vez por mes, [DÍA FIJO])\n\n- [ ] Precios: ¿cambió alguno? Actualiza el documento y la fecha de arriba.\n- [ ] Políticas: ¿hubo alguna excepción nueva que se repitió? Decide si pasa a la política.\n- [ ] Registro de \"No está en el cerebro\": pasa cada fila a su documento y tilda \"Agregado\".\n- [ ] Versiones: en el Proyecto no queda ningún documento viejo duplicado.\n- [ ] Responsables: cada documento tiene un dueño que sigue en el equipo.\n- [ ] Acceso: quien se fue del equipo ya no está en el Proyecto (Share project, al lado del nombre).\n- [ ] Repite tres de las diez preguntas de prueba para ver que sigue respondiendo bien.\n\n## Quién es dueño de qué\n\n| Documento | Responsable | Próxima revisión |\n|---|---|---|\n| Procesos | [NOMBRE] | [FECHA] |\n| Precios y servicios | [NOMBRE] | [FECHA] |\n| Preguntas frecuentes | [NOMBRE] | [FECHA] |\n| Políticas | [NOMBRE] | [FECHA] |\n| Tono | [NOMBRE] | [FECHA] |\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "úsalo"};</script>

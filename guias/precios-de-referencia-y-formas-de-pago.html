<script>var GUIA = {"slug": "precios-de-referencia-y-formas-de-pago", "t": "Precios de referencia y formas de pago para sistemas de IA", "d": "Rangos que se ven en el mercado hispano para agentes, CRMs, sistemas y mantenimiento, cómo cobrar el primer cliente y cómo armar los pagos.", "tema": "El roadmap para vender IA", "min": 8, "secciones": [{"h": "Antes de mirar números", "p": ["Estos rangos son referencias que se escuchan entre quienes venden sistemas de IA en español, no precios oficiales ni garantizados. El mismo sistema puede valer 2.000 o 10.000 dólares según el tamaño del cliente, el país, el retorno que genera y tu experiencia.", "Úsalos para no cobrar ridículamente poco y para tener un rango que decir con seguridad. El número final sale del retorno (\"Calcula el retorno de tu propuesta\") y de tus horas reales (\"Cuánto cobrar por automatizar con IA\")."]}, {"h": "Rangos de desarrollo (pago único)", "lista": ["Primer agente de atención o ventas: entre 500 y 1.200 dólares. Por debajo de 500 se pierde dinero.", "Agente estándar con algo de experiencia: entre 1.000 y 1.500; con experiencia y casos, de 1.000 a 3.000; los avanzados, más.", "Módulos extra de un agente (audio, imágenes, alta en CRM, agenda): alrededor de 500 cada uno.", "CRM sencillo a medida: entre 1.000 y 2.000.", "Sistemas grandes tipo \"centro de control\" de la empresa: desde 5.000 a 10.000 o más.", "Diagnóstico pago (cuando ya tienes demanda): unos 500, descontables si contrata."]}, {"h": "Rangos de mantenimiento (mensual)", "lista": ["Tres escalones simples que se usan mucho: 100 (solo arreglos), 300 (arreglos y mejoras chicas) y 600 (prioridad y mejoras todos los meses).", "Una solución que solo ordena o ahorra un poco de tiempo: alrededor de 200 por mes.", "Un agente crítico, que hace el trabajo de varias personas: de 500 a 700 por mes.", "La regla: el mensual tiene que ser una fracción de lo que el sistema le aporta cada mes. Para cobrar 500, tiene que aportar por lo menos 1.000."], "aviso": "Un mantenimiento barato con cambios ilimitados te quema cuando tienes cinco clientes. Pon horas o cantidad de cambios por plan."}, {"h": "El primer cliente", "lista": ["Experiencia antes que dinero: cobra bajo para conseguir el caso de éxito, pero cobra. Elige un número que puedas decir sin que te tiemble la voz.", "Un precio que no sea redondo y desglosado (agente + CRM + capacitación) se percibe como calculado. Desglosar también evita perder toda la venta si rechaza una parte.", "Una opción extrema que algunos usan: desarrollo sin cargo a cambio de un mensual desde el primer día. Si lo haces, pon un plazo mínimo por escrito.", "Suma tus herramientas al precio: si cobras 1.000 y usas un plan de 100, cobra 1.100. Mejor aún: que las suscripciones estén a nombre y con la tarjeta del cliente."]}, {"h": "Formas de pago", "lista": ["Lo más común: 50% al empezar y 50% al entregar, contra los criterios de aceptación cumplidos. También se usa 70/30.", "Por etapas, en proyectos largos.", "Dos cuotas antes que un descuento.", "Un beneficio por pagar todo junto (por ejemplo, 10% menos).", "Nunca empieces sin el primer pago. Y conecta el sistema a producción recién con el pago final."]}], "faq": [{"q": "¿Cobro en dólares o en moneda local?", "a": "Si tu cliente está en otro país, en dólares. Si está en el tuyo, depende de la estabilidad de tu moneda; lo importante es que el acuerdo diga moneda, montos y fechas."}, {"q": "¿Menciono el mantenimiento en la propuesta?", "a": "Solo como una línea (\"planes de mantenimiento desde X\"). Lo ofreces de verdad cuando el sistema funciona y el cliente pide su primer cambio."}], "cat": "roadmap", "parte": "construi"};</script>

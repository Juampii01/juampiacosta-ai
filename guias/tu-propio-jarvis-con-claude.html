<script>var GUIA = {"slug": "tu-propio-jarvis-con-claude", "fuentes": ["https://github.com/Juampii01/jarvi-os/tree/main/voz", "https://github.com/Itsme23476/jarvis-os", "https://elevenlabs.io/docs", "https://code.claude.com/docs/en/mcp#use-mcp-servers-from-claude-ai", "https://code.claude.com/docs/en/permissions", "https://code.claude.com/docs/en/permission-modes", "https://claude.com/docs/connectors/getting-started", "https://elevenlabs.io/docs/help-center/technical/how-do-i-authorize-myself-using-an-api-key", "https://elevenlabs.io/docs/overview/administration/billing", "https://elevenlabs.io/docs/help-center/product/voices/voice-library/why-cant-i-use-some-voices-from-the-voice-library", "https://support.apple.com/guide/mac-help/mh40616/mac"], "post": "JARVIS", "t": "Tu propio Jarvis con Claude", "d": "Le hablas, te contesta con voz y se conecta a tu mail y tu calendario. De código abierto: vive en tu computadora y nadie te cobra después.", "tema": "IA en tu negocio", "min": 10, "fichaNombre": "Jarvis por voz", "ficha": [["Qué es", "Una cara y una voz para Claude Code: le hablas por el micrófono y te responde hablando."], ["Necesitas", "Claude Code con la sesión iniciada con tu cuenta de claude.ai (no con una clave de API), Python 3, una cuenta gratis de ElevenLabs y Chrome."], ["Cuánto cuesta", "Nada extra mientras te alcancen los créditos mensuales del plan gratis de ElevenLabs. Escucharte (voz a texto) y hablarte (texto a voz) consumen créditos, y si se terminan Jarvis sigue con la voz del navegador. Ojo: lo que generes con el plan gratis es para uso no comercial y con atribución."], ["Repo", "github.com/Juampii01/jarvi-os (carpeta voz)"]], "secciones": [{"h": "Instálalo con un solo mensaje", "p": ["Abre Claude Code en una terminal y pégale esto. Después sigue desde \"Tu clave de ElevenLabs\"."], "prompts": [{"t": "Instalar Jarvis", "c": "Descarga https://github.com/Juampii01/jarvi-os en mi carpeta de usuario y deja listo el Jarvis por voz que está en la carpeta \"voz\": crea el archivo .env copiando .env.example y dime qué me falta completar. No arranques el servidor tú: dime cómo arrancarlo yo."}]}, {"h": "Tu clave de ElevenLabs", "pasos": ["Entra a elevenlabs.io → Developers (en la barra lateral) → pestaña API Keys y crea una clave. La clave viene restringida: habilítale el acceso a texto a voz (Text to Speech), voz a texto (Speech to Text) y voces (Voices). Cópiala en el momento, porque después solo se ven los últimos cuatro caracteres.", "Abre el archivo .env de la carpeta voz y pégala después de ELEVENLABS_API_KEY=.", "Para que hable en español: en la Voice Library elige una voz en español, agrégala a tu cuenta, copia su Voice ID y pégalo en ELEVENLABS_VOICE_ID= (reemplaza el que viene, que es una voz británica). Algunas voces de la Voice Library son solo para planes pagos: si te aparece \"This voice is not available for free users\", elige otra."]}, {"h": "Conecta tu mail y tu calendario", "pasos": ["En claude.ai → Customize → Connectors (claude.ai/customize/connectors), conecta Gmail y Google Calendar. Tiene que ser la misma cuenta de claude.ai con la que iniciaste sesión en Claude Code. En Team y Enterprise, primero un Owner tiene que habilitar esos conectores para la organización.", "Abre Claude Code, escribe /mcp y fíjate que aparezcan."]}, {"h": "Arráncalo y háblale", "pasos": ["Windows: doble clic en iniciar.bat. Mac: doble clic en iniciar.command. Si macOS no lo deja abrir, ve a Ajustes del Sistema → Privacidad y seguridad y, en la parte de Seguridad, toca Abrir igualmente (Open Anyway). El botón aparece durante más o menos una hora después de que intentaste abrirlo.", "Se abre solo en el navegador: http://localhost:8730.", "Toca ◉ VOICE, acepta el micrófono y habla. Para terminar, toca el botón de nuevo."], "lista": ["\"¿Qué tengo hoy en el calendario?\"", "\"¿Qué mails importantes tengo sin responder?\"", "\"Prepárame un borrador para Juan diciéndole que la reunión pasa al jueves.\""], "aviso": "Arráncalo desde el explorador de archivos o una terminal normal, no desde adentro de Claude Code."}, {"h": "Los botones", "lista": ["/new: empieza una charla nueva.", "/profile: le enseñas algo de ti y lo recuerda.", "/goal: le pones tu objetivo principal.", "/personality: le cambias el tono.", "/kanban: suma una tarea a tu lista o te la lee.", "/background: le das una tarea larga y te avisa cuando termina."]}, {"h": "Seguridad", "p": ["Para que los conectores funcionen, Jarvis corre Claude Code sin pedir permiso en cada acción (JARVIS_PERMISSION=bypass, que equivale a --dangerously-skip-permissions). En persona.md tiene la regla de no mandar nada sin que se lo pidas, pero es una instrucción, no un candado: Claude Code aplica los permisos por su cuenta, no según lo que diga el prompt. Si quieres un bloqueo real, suma reglas deny a tu settings.json, que se respetan incluso en este modo (en el kit está el archivo listo). Ten en cuenta también que lo que dices se transcribe en los servidores de ElevenLabs. Úsalo solo en tu computadora."]}], "faq": [{"q": "Me transcribe pero nunca contesta", "a": "Revisa que Claude Code tenga la sesión iniciada: claude → /login."}, {"q": "No habla", "a": "Revisa que la clave de ElevenLabs esté bien pegada en .env, sin espacios."}, {"q": "Dice \"core went quiet\"", "a": "Claude tardó demasiado. Vuelve a preguntar o sube JARVIS_TIMEOUT en .env."}], "idea": [], "ejemplo": {"titulo": "Ejemplo resuelto: el Jarvis de una agencia de viajes chica", "negocio": "Ejemplo inventado: una agencia de viajes de dos personas en el centro de Rosario. La dueña arma paquetes a medida y atiende por mail; su socio maneja proveedores. Ella usa Claude Code con su suscripción y una notebook con Windows.", "punto_de_partida": "Cada mañana pierde un rato abriendo el mail y el calendario para saber qué tiene. Quiere preguntarlo en voz alta mientras se prepara el mate y que las respuestas a clientes queden como borrador.", "pasos": ["Abrió Claude Code en una terminal, revisó con /status que la sesión fuera la de su cuenta de claude.ai y pegó el mensaje \"Instalar Jarvis\" de la guía. Claude descargó el repo y le dejó el .env listo para completar.", "En ElevenLabs entró a Developers → API Keys, creó una clave con acceso a texto a voz, voz a texto y voces, y la pegó en ELEVENLABS_API_KEY=. En la Voice Library eligió una voz en español rioplatense, la agregó a su cuenta y pegó el Voice ID en ELEVENLABS_VOICE_ID=.", "En claude.ai → Customize → Connectors conectó Gmail y Google Calendar con la cuenta de la agencia. En Claude Code escribió /mcp y vio los dos conectores en la lista de claude.ai.", "Desde la misma pantalla de /mcp miró los nombres de las herramientas de Gmail y sumó a su settings.json las reglas deny del kit para que Jarvis no pueda enviar, responder ni reenviar.", "Reemplazó persona.md por la versión del kit: completó los clientes corporativos que tienen prioridad, los dos proveedores que siempre responden urgente y su horario de 9 a 18.", "Hizo doble clic en iniciar.bat, se abrió http://localhost:8730 en Chrome, tocó ◉ VOICE y aceptó el micrófono.", "Probó el bloqueo pidiéndole que le mandara un mail de prueba a ella misma. Jarvis contestó que no podía enviarlo. Después le pidió el borrador y apareció en Gmail.", "Usó /profile para enseñarle que los presupuestos siempre salen en dólares y con validez de 48 horas, y /goal para dejarle su objetivo del mes: cerrar los grupos de egresados.", "A la mañana siguiente le preguntó \"¿cómo viene el día?\" y le pidió borradores para los dos clientes que esperaban respuesta. Los revisó en Gmail antes de mandarlos."], "resultado": "Quedó un Jarvis que le cuenta el día en voz alta, busca mails y prepara borradores de respuesta, con un bloqueo de Claude Code que le impide enviar por su cuenta. Lo que sale hacia un cliente lo manda ella, desde Gmail."}, "si_falla": [{"sintoma": "En /mcp no aparecen Gmail ni Google Calendar, aunque los conectaste en claude.ai.", "solucion": "Escribe /status en Claude Code y fíjate qué método de autenticación está activo. Si es una clave de API, saca ANTHROPIC_API_KEY o ANTHROPIC_AUTH_TOKEN de tus variables de entorno y de ~/.claude/settings.json, y vuelve a hacer /login eligiendo tu cuenta de claude.ai. Si es un problema de red al arrancar, cierra y vuelve a abrir Claude Code."}, {"sintoma": "En /mcp el conector dice \"session token rejected\".", "solucion": "No se arregla volviendo a autorizar el conector. Haz /login de nuevo en Claude Code y después reconecta el conector desde /mcp."}, {"sintoma": "Te escucha pero no habla, o en pantalla dice que ElevenLabs falló con un error 401.", "solucion": "La clave está mal pegada o no tiene permisos. Revisa que no haya espacios después de ELEVENLABS_API_KEY= y, en Developers → API Keys, que la clave tenga acceso a texto a voz, voz a texto y voces. Si no te acuerdas de la clave completa, crea una nueva: la anterior ya no se puede ver. Si dice que se quedó sin créditos, Jarvis sigue con la voz del navegador hasta que se renueven."}, {"sintoma": "Se queda pensando, dice \"core went quiet\" o se traba siempre con el mismo conector.", "solucion": "Un conector que pide autorización (por ejemplo, uno de una base de datos o de deploys) puede trabar la corrida sin pantalla. Pon JARVIS_MCP=none en .env para confirmarlo: si así anda, abre Claude Code, autoriza ese conector en /mcp y vuelve a JARVIS_MCP=all. El detalle de cada corrida queda en jarvis-claude-raw.log, en la carpeta temporal de tu computadora."}, {"sintoma": "En Linux o Mac aparece \"--dangerously-skip-permissions cannot be used with root/sudo privileges\".", "solucion": "Claude Code no arranca en modo bypass como root ni con sudo. Arranca Jarvis con tu usuario normal, sin sudo."}], "kit": [{"archivo": "jarvis-bloqueo-de-envios-settings.md", "que_es": "Las reglas deny para tu ~/.claude/settings.json que impiden que Jarvis envíe, responda o reenvíe mails aunque corra en modo bypass, con los pasos para verificar los nombres y probarlo.", "contenido": "# Bloqueo real de envíos para Jarvis\n\nJarvis corre Claude Code con `JARVIS_PERMISSION=bypass`: no te pide permiso antes de usar una herramienta. La regla de `persona.md` (\"no mandes nada sin que te lo pidan\") es una instrucción para el modelo, no un candado. Las reglas `deny` de Claude Code sí son un candado: se aplican en todos los modos, también en bypass.\n\nCon este archivo Jarvis puede leer tu mail y preparar borradores, pero no puede enviar, responder ni reenviar. Los borradores los mandas tú desde Gmail.\n\n## 1. Mira cómo se llaman tus herramientas\n\nLas herramientas de los conectores de claude.ai aparecen en Claude Code como `mcp__claude_ai_<conector>__<herramienta>`. Los espacios del nombre del conector pasan a `_` (Google Calendar queda `Google_Calendar`).\n\n1. Abre Claude Code en una terminal normal: `claude`.\n2. Escribe `/mcp`, elige el conector de Gmail y mira la lista de herramientas.\n3. Anota las que envían algo. Hoy suelen llamarse `send_message`, `reply` y `forward`. Si en tu lista tienen otro nombre, cambia las reglas de abajo.\n\n## 2. Suma las reglas a tu settings.json de usuario\n\nEl archivo es `~/.claude/settings.json` (en Windows, `C:\\Users\\TU_USUARIO\\.claude\\settings.json`). Es el que vale para todas las carpetas, incluida la que usa Jarvis.\n\n- Si el archivo no existe, créalo con este contenido.\n- Si ya existe, no lo reemplaces: agrega solo la lista `deny` adentro de `permissions` (y si ya tienes una lista `deny`, suma estas líneas a la tuya).\n\n```json\n{\n  \"permissions\": {\n    \"deny\": [\n      \"mcp__claude_ai_Gmail__send*\",\n      \"mcp__claude_ai_Gmail__reply*\",\n      \"mcp__claude_ai_Gmail__forward*\"\n    ]\n  }\n}\n```\n\nEl asterisco al final es un comodín: bloquea cualquier herramienta de ese conector cuyo nombre empiece así.\n\n## 3. Opcional: que tampoco toque tu calendario\n\nSi quieres que Jarvis solo lea tu agenda y no cree, cambie ni borre eventos, primero mira en `/mcp` los nombres de las herramientas de Google Calendar. Después suma a la misma lista `deny` una regla por cada herramienta que escribe, con este formato:\n\n```\n\"mcp__claude_ai_Google_Calendar__NOMBRE_DE_LA_HERRAMIENTA\"\n```\n\nOjo: con esto Jarvis ya no puede agendarte nada. Hazlo solo si prefieres agendar tú.\n\n## 4. Pruébalo antes de confiar\n\n1. Cierra y vuelve a abrir Jarvis.\n2. Pídele: \"Mándame un mail de prueba a mí mismo que diga hola\".\n3. Tiene que contestarte que no puede enviarlo. Si lo mandó, la regla no coincide con el nombre real de la herramienta: vuelve al paso 1.\n4. Pídele: \"Prepárame un borrador para mí mismo que diga hola\". Tiene que aparecer en Borradores de Gmail.\n\n## 5. Si algo no anda\n\n- Si al abrir Claude Code te avisa que hay un error en settings.json, revisa comas y llaves: el JSON no admite comentarios ni comas sueltas al final de la lista.\n- Para ver qué reglas quedaron cargadas, en Claude Code escribe `/permissions`.\n"}, {"archivo": "persona-jarvis-para-tu-negocio.md", "que_es": "Un persona.md en español para reemplazar el del repo: habla corto, arma el resumen del día en orden, solo deja borradores y no lee en voz alta datos sensibles. Completa los corchetes y reinicia Jarvis.", "contenido": "# persona.md para un Jarvis de negocio\n\nEste archivo reemplaza a `voz/persona.md` del repo. Antes de pegarlo, guarda una copia del original (por ejemplo `persona-original.md`). Completa lo que está entre corchetes, guarda y vuelve a arrancar Jarvis.\n\nTodo lo que sigue a la línea de abajo es el contenido del archivo.\n\n---\n\nEres JARVIS, el asistente por voz de [TU NOMBRE], que lleva [TU NEGOCIO EN UNA LÍNEA] en [CIUDAD]. No eres un agente de programación y nunca te presentas como Claude, modelo de IA ni herramienta. Eres Jarvis.\n\nResponde siempre en español rioplatense, con voseo, salvo que te hablen en otro idioma.\n\n## Cómo hablas\n\nTodo lo que dices se lee en voz alta. Escribe para el oído.\n\n- Una o dos oraciones. Tres como mucho.\n- Arranca por la respuesta, sin introducción y sin repetir la pregunta.\n- Nada de markdown, viñetas, tablas, emojis ni números de lista. Solo oraciones habladas.\n- Los montos y horarios dilos como se dicen: \"a las nueve y media\", \"doce mil pesos\".\n- Nunca digas: \"¡Por supuesto!\", \"¡Excelente pregunta!\", \"Con gusto te ayudo\", \"Como IA\".\n\n## Lo que sabes del negocio\n\n- Clientes que importan más: [NOMBRES O TIPOS DE CLIENTE].\n- Proveedores o personas que siempre tienen prioridad en el mail: [NOMBRES].\n- Horario de trabajo: [DÍAS Y HORAS]. Fuera de ese horario no propongas reuniones.\n- Lo que nunca se agenda: [EJEMPLO: NADA LOS VIERNES A LA TARDE].\n\n## Cuando te piden el resumen del día\n\nSi te dicen \"¿cómo viene el día?\" o algo parecido, cuenta en este orden y en no más de cinco oraciones en total:\n1. La primera reunión o compromiso del día y a qué hora.\n2. Cuántas reuniones más hay y si alguna se pisa con otra.\n3. Los mails sin responder de las personas de la lista de prioridad, solo quién y de qué se trata.\n4. Si hay algo que vence hoy según el calendario.\nDespués pregunta: \"¿Quieres que prepare algún borrador?\"\n\n## Mail\n\n- Puedes leer, buscar y preparar borradores.\n- Nunca envíes, respondas ni reenvíes un mail. Prepara el borrador, di \"el borrador está listo en Gmail\" y espera.\n- En un borrador para un cliente, nunca prometas precios, plazos ni descuentos que no te hayan dicho en esta charla. Si falta un dato, déjalo como [A CONFIRMAR] y avisa.\n\n## Calendario\n\n- Antes de crear, mover o borrar un evento, repite en una oración qué vas a hacer (día, hora y con quién) y espera un \"sí\".\n- No mandes invitaciones a otras personas sin que te lo pidan con su nombre.\n\n## Datos sensibles\n\n- No leas en voz alta números de cuenta, contraseñas, códigos de verificación ni documentos de identidad, aunque estén en un mail. Di \"hay un código en ese mail, míralo en pantalla\".\n\n## Cuando no puedes\n\nSi una herramienta no responde o no tienes acceso, dilo en una línea (\"Ahora no puedo entrar a tu mail\") y sigue. No expliques nada técnico.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "úsalo"};</script>

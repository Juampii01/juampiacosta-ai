<script>var GUIA = {"slug": "usuarios-y-login-sin-romperte-la-cabeza", "t": "Usuarios y login sin romperte la cabeza", "d": "Qué opción elegir (Supabase Auth o Clerk), qué pedirle a Claude Code y los errores de seguridad que más se repiten en apps hechas con IA.", "tema": "Crea tu app", "min": 9, "secciones": [{"h": "No construyas el login desde cero", "p": ["Guardar contraseñas, mandar mails de confirmación, recuperar cuentas: todo eso ya lo resuelven servicios especializados. Pedirle a Claude que lo invente desde cero es abrir la puerta a errores de seguridad difíciles de ver.", "La pregunta no es cómo hacer el login, sino qué servicio usar."]}, {"h": "Las dos opciones más simples", "lista": ["Supabase Auth: viene incluido si ya usas Supabase para la base de datos. Ofrece email y contraseña (con confirmación y recuperación), enlace mágico por mail, código por SMS y login con Google, GitHub, Apple y otros. Se integra con RLS: las reglas de tus tablas saben qué usuario está pidiendo los datos.", "Clerk: trae componentes listos (botones de ingresar y registrarse, menú de usuario) y para Next.js usa el paquete @clerk/nextjs. Usa dos claves: una pública (NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY) y una secreta (CLERK_SECRET_KEY) que nunca va en código del navegador."], "p": ["Regla práctica: si tus datos están en Supabase, empieza con Supabase Auth y te ahorras conectar dos servicios. Si quieres pantallas de login armadas y no usas Supabase, Clerk es un buen atajo."]}, {"h": "Qué pedirle a Claude", "prompts": [{"t": "Agregar login", "c": "Quiero agregar usuarios y login a esta app usando [SUPABASE AUTH o CLERK].\nFormas de entrar: [EJ.: EMAIL Y CONTRASEÑA, Y GOOGLE].\nQué ve cada uno:\n- Sin iniciar sesión: [PANTALLAS PÚBLICAS].\n- Con sesión: [PANTALLAS PRIVADAS].\n- Administrador (si hay): [QUÉ PUEDE HACER DE MÁS].\nReglas:\n1. Usa el sistema de login del servicio, no inventes uno propio.\n2. Las claves van en variables de entorno; en el navegador solo la clave pública.\n3. La protección tiene que estar en el servidor o en la base (RLS), no solo en esconder botones.\nAntes de escribir código, muéstrame el plan y la lista de archivos que vas a tocar."}]}, {"h": "Los errores de seguridad que más se repiten", "lista": ["Esconder en vez de proteger: ocultar el botón de \"Administrar\" no impide que alguien entre a esa dirección. El permiso se chequea en el servidor o en la base.", "Clave secreta en el navegador: la clave secreta de Supabase o CLERK_SECRET_KEY metidas en código que llega al usuario.", "Tablas sin RLS: el login funciona, pero cualquiera con la clave publicable puede leer la tabla entera.", "Confiar en lo que manda el navegador: si la app recibe \"soy el usuario 15\" desde la página y lo cree, cualquiera puede hacerse pasar por otro.", "El archivo .env en GitHub: tus claves quedan públicas aunque después borres el archivo."]}, {"h": "Pruébalo con dos usuarios", "pasos": ["Crea dos cuentas de prueba (por ejemplo, Ana y Beto).", "Con Ana, carga algunos datos.", "Cierra sesión, entra con Beto y fíjate que no vea nada de Ana.", "Sin iniciar sesión, intenta abrir directamente la dirección de una pantalla privada.", "Pídele a Claude que haga la misma revisión mirando el código."], "prompts": [{"t": "Revisión de permisos", "c": "Revisa cómo está protegido el acceso en esta app.\nPara cada pantalla y cada tabla, dime: quién puede verla, dónde se chequea ese permiso (navegador, servidor o base) y si un usuario podría ver datos de otro.\nMarca en rojo cualquier lugar donde la protección dependa solo de esconder algo en la pantalla. No cambies nada todavía."}]}], "faq": [{"q": "¿Puedo cambiar de Clerk a Supabase Auth después?", "a": "Se puede, pero implica migrar usuarios y tocar varias partes. Por eso conviene decidirlo en la especificación, antes de construir."}, {"q": "¿El login con Google es más seguro?", "a": "Te evita guardar contraseñas, que ya es una ventaja. Pero la seguridad de tus datos sigue dependiendo de tus reglas: RLS en Supabase o chequeos en el servidor."}, {"q": "Claude me dice que el login funciona, ¿alcanza?", "a": "No. Que puedas entrar no significa que los datos estén protegidos. Haz siempre la prueba de los dos usuarios."}], "fuentes": ["https://supabase.com/auth", "https://supabase.com/docs/guides/database/postgres/row-level-security", "https://supabase.com/docs/guides/api/api-keys", "https://clerk.com/docs/raw/_prompts/nextjs-quickstart.md", "https://supabase.com/auth.md", "https://clerk.com/docs/nextjs/getting-started/quickstart.md?manual=1", "https://supabase.com/docs/guides/auth/auth-smtp", "https://supabase.com/docs/guides/auth/redirect-urls.md", "https://supabase.com/changelog/45329-breaking-change-tables-not-exposed-to-data-and-graphql-api-automatically"], "ejemplo": {"titulo": "Ejemplo resuelto: el portal de alumnos de una academia de inglés", "negocio": "Ejemplo inventado: una academia de inglés en Pocitos, Montevideo, con la directora, cuatro profesores y grupos de adolescentes y adultos. Quieren un portal donde cada alumno vea su material y sus notas, y donde la secretaría cargue todo.", "punto_de_partida": "Las notas se mandan por mail una por una y el material está en una carpeta compartida que cualquiera con el enlace puede abrir. La app del portal ya tiene sus datos en Supabase, pero todavía no tiene usuarios.", "pasos": ["Como los datos ya estaban en Supabase, eligió Supabase Auth. Formas de entrar: email y contraseña, y Google, porque muchos alumnos ya tienen cuenta.", "Completó el prompt Agregar login: sin sesión se ve solo la página de inicio y los horarios; con sesión, Mis notas y Mi material; la secretaría (administrador) además carga notas y sube material.", "Claude mostró el plan y la lista de archivos. Pidió que el rol de secretaría se guarde en una tabla en la base y no en algo que el navegador pueda cambiar. Lo aprobó.", "En el panel de Supabase, en la configuración de URL de Auth, puso como Site URL la dirección de producción y sumó http://localhost:3000/** en Redirect URLs para probar en su computadora.", "Configuró un SMTP propio para que los mails de confirmación lleguen a los alumnos y no solo a los miembros del equipo del proyecto.", "Para Google, copió la dirección de callback que muestra Supabase y la cargó en Google Cloud como URI de redirección autorizada.", "Claude escribió las políticas: cada alumno ve solo sus notas, y la secretaría ve y carga las de todos chequeando su rol en la base.", "Hizo la prueba de los dos usuarios con dos alumnos de prueba y una cuenta de secretaría. También pegó en el navegador, sin sesión, la dirección de Mis notas y lo mandó al login.", "Le pidió a Claude la skill revision-de-permisos del kit. Marcó un riesgo ALTO: la pantalla de carga de notas solo escondía el botón. Claude movió el chequeo al servidor y repitieron la prueba.", "Recorrió la checklist del kit antes de publicar."], "resultado": "Quedó un portal donde cada alumno entra con su mail o con Google y ve solo lo suyo, y la secretaría carga notas y material desde la misma app. Los permisos se chequean en la base con RLS y en el servidor, no en lo que muestra la pantalla."}, "si_falla": [{"sintoma": "Los usuarios se registran pero el mail de confirmación nunca llega.", "solucion": "El servicio de mail que trae Supabase solo entrega a direcciones que son miembros del equipo del proyecto y tiene un límite muy bajo por hora. Configura un SMTP propio en la configuración de Auth de tu proyecto antes de abrir el registro al público."}, {"sintoma": "Después de entrar con el enlace mágico o con Google, la app te manda a localhost o a una dirección equivocada.", "solucion": "Revisa la configuración de URL de Auth en Supabase: el Site URL tiene que ser tu dirección de producción y cada dirección a la que vuelves (localhost, producción, vistas previas) tiene que estar en Redirect URLs. Para vistas previas de Vercel puedes usar un comodín como https://*-tu-cuenta.vercel.app/**."}, {"sintoma": "Google muestra el error redirect_uri_mismatch al intentar entrar.", "solucion": "En Google Cloud, en las credenciales OAuth de tu app, agrega como URI de redirección autorizada exactamente la dirección de callback que te muestra Supabase en el proveedor Google. Tiene que coincidir carácter por carácter."}, {"sintoma": "Con Clerk, las rutas privadas se abren sin iniciar sesión.", "solucion": "Fíjate dónde quedó clerkMiddleware. En Next.js 16 el archivo se llama proxy.ts; en Next.js 15 o anterior, middleware.ts. Va en la raíz del proyecto o dentro de src si usas esa carpeta. Además, la ruta tiene que estar marcada como protegida en ese archivo."}, {"sintoma": "En la prueba de los dos usuarios, el segundo ve datos del primero.", "solucion": "Pídele a Claude que corra la skill revision-de-permisos. Casi siempre es una tabla sin política que filtre por (select auth.uid()), una consulta que se hace con la clave secreta desde el servidor sin filtrar por usuario, o un id de usuario que la app toma del navegador."}], "kit": [{"archivo": "revision-de-permisos/SKILL.md", "que_es": "Skill que audita el login y los permisos de tu app sin tocar código y te entrega una tabla de riesgos con la prueba de dos usuarios adaptada. Guárdala en .claude/skills/revision-de-permisos/ o súbela como ZIP a Claude.", "contenido": "---\nname: revision-de-permisos\ndescription: 'Revisa el acceso en una app con login (Supabase Auth o Clerk): quién ve qué, dónde se chequea y qué huecos hay, sin cambiar código. Úsala al revisar login o permisos antes de publicar.'\n---\n\n# Revisión de permisos\n\nHaces una auditoría de solo lectura. No modificas archivos hasta que el usuario apruebe un plan de arreglos.\n\n## Qué miras, en este orden\n\n1. **Mapa de pantallas**: lista cada ruta o pantalla y clasifícala en pública, con sesión o solo administrador.\n2. **Dónde se chequea la sesión**: para cada pantalla privada, di si el chequeo está en el servidor (proxy o middleware, ruta de API, componente de servidor) o solo en el navegador.\n3. **Datos**: para cada tabla o fuente de datos, di quién puede leer, crear, editar y borrar, y dónde se impone esa regla (RLS en la base, chequeo en el servidor, o nada).\n4. **Claves**: busca en el código y en los archivos de configuración cualquier clave secreta (sb_secret_, service_role, CLERK_SECRET_KEY, sk_) y confirma que ninguna aparece en código que llega al navegador ni lleva el prefijo NEXT_PUBLIC_.\n5. **Identidad**: busca lugares donde el servidor crea en un id de usuario que manda el navegador (en el cuerpo, en la URL o en un campo oculto) en vez de tomarlo de la sesión.\n6. **Archivos .env**: confirma que .env y .env.local están en .gitignore y que no hay ninguno en el historial de Git.\n\n## Cómo lo entregas\n\nUna tabla con columnas: lugar, quién debería acceder, dónde se chequea hoy, riesgo (alto, medio, bajo) y arreglo propuesto.\n\nMarca como ALTO, siempre:\n\n- Protección que depende solo de esconder un botón o un enlace.\n- Una clave secreta alcanzable desde el navegador.\n- Una tabla con datos de usuarios sin RLS o sin políticas que filtren por usuario.\n- Un id de usuario tomado del navegador para decidir qué datos devolver.\n\n## Cierre\n\nTermina con la prueba manual de dos usuarios adaptada a esta app: qué carga el usuario A, qué tiene que intentar ver el usuario B y qué direcciones abrir sin sesión. No digas que la app es segura: di qué revisaste y qué quedó sin revisar.\n"}, {"archivo": "checklist-login-antes-de-publicar.md", "que_es": "Checklist para marcar antes de abrir el registro al público, con los puntos específicos de Supabase Auth y de Clerk.", "contenido": "# Checklist de login antes de publicar\n\nMarca cada punto. Si uno no se cumple, no publiques todavía.\n\n## Servicio y claves\n\n- [ ] El login lo hace Supabase Auth o Clerk, no un sistema inventado.\n- [ ] En el navegador solo está la clave pública (publicable de Supabase o NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY).\n- [ ] La clave secreta (sb_secret_ de Supabase o CLERK_SECRET_KEY) está solo en variables del servidor y en las variables de entorno del hosting.\n- [ ] .env y .env.local están en .gitignore y nunca se subieron a GitHub.\n\n## Supabase Auth\n\n- [ ] En la configuración de URL de Auth, el Site URL es la dirección de producción (no http://localhost:3000).\n- [ ] En Redirect URLs están localhost para desarrollo, la dirección de producción y, si usas vistas previas de Vercel, el comodín de tu cuenta.\n- [ ] Configuraste un SMTP propio para los mails de confirmación y recuperación. El servicio de mail que trae Supabase solo manda a miembros del equipo del proyecto y tiene un límite muy bajo por hora.\n- [ ] Si usas Google: la dirección de callback que muestra Supabase está cargada como URI de redirección autorizada en Google Cloud.\n- [ ] Cada tabla con datos de usuarios tiene RLS, GRANT y políticas que comparan (select auth.uid()) con la columna del dueño.\n\n## Clerk\n\n- [ ] Las claves están en .env.local como NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY y CLERK_SECRET_KEY.\n- [ ] clerkMiddleware está en proxy.ts (Next.js 16) o en middleware.ts (Next.js 15 o anterior), en la raíz o dentro de src si usas esa carpeta.\n- [ ] Las rutas privadas se protegen en el servidor, no solo mostrando u ocultando componentes.\n- [ ] Antes de salir, pasaste la instancia a producción con sus propias claves.\n\n## La prueba de los dos usuarios\n\n- [ ] Usuario A cargó datos.\n- [ ] Usuario B no ve nada de A, ni en pantalla ni cambiando un id en la dirección.\n- [ ] Sin sesión, las direcciones privadas redirigen al login o devuelven error.\n- [ ] Si hay administrador, un usuario común no puede abrir la pantalla de administración escribiendo la dirección.\n- [ ] Claude corrió la skill revision-de-permisos y no quedó ningún riesgo ALTO abierto.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

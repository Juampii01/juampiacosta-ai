<script>var GUIA = {"slug": "elegir-solucion-y-rubros-para-empezar", "t": "Elegir la solución y los rubros para tus primeros clientes", "d": "Por qué conviene elegir primero qué resuelves y después a quién, qué negocios descartar y cómo probar 3 rubros sin perder tiempo.", "tema": "El roadmap para vender IA", "min": 8, "secciones": [{"h": "Primero la solución, después el rubro", "p": ["Elegir solo por rubro (\"le vendo a dentistas\") te ata a un mercado chico y te deja sin salida si en tu ciudad no responden. Elegir por solución (\"instalo un agente que atiende y agenda por WhatsApp\") te deja ofrecer lo mismo a clínicas, inmobiliarias, concesionarias o tiendas online.", "Al empezar, elige una solución que sepas entregar y pruébala en 3 rubros. Si después de un volumen real (no 8 contactos) uno no responde, cámbialo por otro. Cuando tengas casos de éxito, ahí sí te especializas."]}, {"h": "La solución de entrada más pedida", "p": ["El agente que atiende, responde y agenda por WhatsApp e Instagram es la puerta de entrada más fácil de vender: el dueño entiende el problema (mensajes sin responder, consultas a las once de la noche) y ve el resultado rápido. Una vez adentro, aparecen los siguientes sistemas: CRM, reportes, seguimiento.", "Si prefieres no tocar la atención al cliente, el paquete \"Claude instalado en tu negocio\" del sistema base es otra entrada válida: proyecto con el conocimiento del negocio, skills y conectores."]}, {"h": "Qué negocios descartar", "lista": ["Micro-negocios que no buscan crecer: kioscos, comercios de barrio sin volumen. No pueden pagarlo ni lo necesitan.", "Negocios con muy poco volumen: si reciben 3 a 5 mensajes por día o 2 llamadas, un agente no se justifica.", "Negocios sin nada digital: sin web, sin redes, todo en papel. La IA es la última capa: primero hay que ordenar lo de abajo.", "Negocios donde el retorno da muy poco: si al calcular lo que recuperan da menos de 100 dólares por mes, no hay precio que cierre."]}, {"h": "Qué negocios suelen encajar", "lista": ["Pueden estimar cuántas consultas reciben, conocen su ticket promedio y pagan publicidad: clínicas (estética, odontología, dermatología), veterinarias grandes, tiendas online que venden por WhatsApp, inmobiliarias y concesionarias.", "Filtra por el dolor de quien tiene plata: \"pymes que facturan más de X por mes\" en vez de \"dueños de pyme\".", "Para venderle a empresas (B2B), los canales son la llamada, LinkedIn, el mail y WhatsApp. Instagram rinde para marcas personales y negocios que venden por ahí."]}, {"h": "Valida antes de construir", "p": ["La regla: primero alguien te dice que sí con un precio, después lo construyes. Vale más un cliente que pagó por algo que todavía armas que un sistema perfecto que nadie compró.", "La oferta fina aparece sola con las llamadas: después de 10 o 20 diagnósticos vas a escuchar los mismos dolores y vas a saber qué vender exactamente."], "prompts": [{"t": "Elegir 3 rubros para mi solución", "c": "Vendo [TU SOLUCIÓN] y vivo en [CIUDAD/PAÍS]. Proponme 6 rubros donde esta solución resuelva un dolor caro. Para cada uno dime: el dolor concreto, cuántas consultas o tareas por día suele tener un negocio mediano, si suelen pagar publicidad, qué tan digitalizados están y por qué canal conviene contactarlos. Después elige los 3 mejores para empezar y explica por qué. No inventes cifras: si no sabes un número, di cómo averiguarlo."}]}], "faq": [{"q": "¿Y si ya tengo un rubro que conozco bien?", "a": "Úsalo como uno de los 3. Conocer el negocio por dentro es una ventaja grande en el diagnóstico."}, {"q": "¿Cuántos contactos antes de descartar un rubro?", "a": "No hay un número mágico, pero 8 o 10 no es volumen. Sostén el mismo rubro y el mismo método unas semanas antes de cambiar."}], "cat": "roadmap", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-ia-para-agencias-de-marketing", "t": "Sistema con Claude para agencias de marketing", "d": "Un Proyecto por cliente, skills para briefs, piezas y reportes, y conectores como HubSpot o Canva si la agencia ya los usa: el sistema para que la agencia escale sin perder la voz de cada marca.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Agencias", "ficha": [["Qué es", "Un sistema con un Proyecto por cliente y skills compartidas para briefs, contenido, reportes y propuestas."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No decide la estrategia ni aprueba piezas. Tampoco publica solo en redes en este sistema."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Pasar de la reunión con el cliente a un brief claro.", "Escribir piezas en la voz de cada marca sin mezclarlas.", "Reportes mensuales: juntar números y explicarlos.", "Propuestas para clientes nuevos.", "Revisiones y cambios que vuelven una y otra vez.", "Incorporar a alguien nuevo a una cuenta."]}, {"h": "El sistema", "lista": ["Un Proyecto por cliente: guía de marca, público, piezas aprobadas, lo que no se dice y los objetivos del trimestre. Así Claude no mezcla voces.", "Skill de brief: convierte las notas o la transcripción de una reunión en un brief con objetivo, público, mensaje y entregables.", "Skill de reporte mensual: toma los números que exporta la agencia y arma la explicación para el cliente, con lo que funcionó y lo que se prueba después.", "Skill de revisión de pieza: chequea una pieza contra la guía de marca del cliente antes de mandarla.", "Conectores: Google Drive y Gmail; HubSpot si lo usan para el comercial; Canva si diseñan ahí.", "Automatización: una tarea que arma el borrador de reporte de cada cliente con los archivos que dejaron en Drive. La configuración manual de tareas programadas ofrece frecuencias por hora, diaria, semanal, en días hábiles o manual, sin opción mensual: déjala en manual y corre la tarea desde Scheduled a principio de mes, o pídela mensual con Create with Claude y revisa qué calendario quedó."], "aviso": "Según HubSpot, su conector para Claude lee, crea y actualiza registros pero no borra, y pide un plan pago de Claude. Canva indica que su conector está en los planes pagos de Claude y que algunas funciones dependen del plan de Canva. Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización, desde Organization settings → Plugins & skills. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "p": ["Para la voz de cada marca, combina esto con la guía \"Skill de tu marca: que todo salga con tu tono y tus colores\". Para propuestas, la guía \"Propuesta comercial a partir de las notas de una llamada\"."], "prompts": [{"t": "Brief desde la reunión", "c": "Estas son las notas de la reunión con [CLIENTE]: [PEGA NOTAS O TRANSCRIPCIÓN].\nUsa la guía de marca del Proyecto.\nArma un brief de una página: objetivo, público, mensaje principal, tono, entregables con fecha, qué no hacer y preguntas abiertas.\nSi algo de lo que pidió el cliente choca con su guía de marca, márcalo como CONSULTAR."}, {"t": "Reporte mensual para el cliente", "c": "Te paso los números del mes de [CLIENTE]: [PEGA O ADJUNTA].\nY los del mes anterior: [PEGA].\nArma un reporte de una página para el dueño de la marca:\n1. Tres cosas que pasaron, en simple.\n2. Qué funcionó y por qué creemos que funcionó (marca lo que es hipótesis).\n3. Qué probamos el mes que viene.\nNo infles números ni compares con otros clientes."}, {"t": "Revisión de pieza contra la marca", "c": "Esta es la pieza que vamos a mandar: [PEGA TEXTO O DESCRIBE LA PIEZA].\nRevísala contra la guía de marca del Proyecto y dime: qué respeta, qué no y cómo corregirlo. Marca además cualquier promesa de resultados o dato sin respaldo."}]}, {"h": "Cómo instalarlo", "pasos": ["Elige un cliente piloto de la agencia y junta su guía de marca y 10 piezas aprobadas.", "Arma ese primer Proyecto y prueba las tres skills con trabajo real del mes.", "Ajusta las skills para que sirvan a todos los clientes y súbelas una vez. Si la agencia tiene plan Team o Enterprise, compártelas desde Customize → Skills, en el menú de tres puntos de cada skill, Share; o que el owner las publique para toda la organización con Publish to org. Quien la recibe la tiene que prender en Shared with you.", "Replica un Proyecto por cliente con la misma estructura de archivos. Ojo con el plan: en Free se pueden crear hasta cinco Proyectos, y compartir Proyectos con el equipo solo se puede en Team y Enterprise.", "Conecta Drive y Gmail; suma HubSpot o Canva solo si ya los usan.", "Deja lista la tarea del borrador de reporte (en Cowork: Scheduled, New task; en manual si no puedes programarla mensual) y define quién la corre a principio de mes y quién revisa cada reporte."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para agencias.\nLo que suelo ver es que el cuello de botella no es la creatividad: son los briefs, los reportes y las revisiones que vuelven. Lo que instalo es un espacio por cliente con su marca cargada y skills para pasar de la reunión al brief, revisar piezas contra la guía y armar el reporte del mes. El equipo sigue decidiendo y aprobando.\n¿Te muestro cómo quedaría con uno de tus clientes?"}], "lista": ["Argumento central: \"Puedes sumar cuentas sin que el equipo se queme, y cada cliente recibe el mismo nivel aunque cambie quién lo atiende.\"", "Ojo: muchas agencias ya usan IA suelta. Lo que vendes es el orden: un sistema por cliente que no se pierde."]}, {"h": "Cuidados del rubro", "lista": ["Datos de los clientes de la agencia: contratos y números de cada marca son confidenciales. Revisa qué dice el contrato con cada cliente antes de cargar su información.", "Publicidad: reglas de cada plataforma y de cada país sobre promesas, testimonios y contenido hecho con IA. La agencia sigue siendo responsable.", "Revisión humana: ninguna pieza sale sin que la apruebe alguien del equipo."], "aviso": "Claude acelera el trabajo, pero la responsabilidad por lo que se publica sigue siendo de la agencia. Cuida los datos personales según las leyes de cada país."}], "faq": [{"q": "¿Por qué un Proyecto por cliente y no uno para todos?", "a": "Porque así Claude trabaja solo con la marca de ese cliente y no mezcla tonos ni información."}, {"q": "¿Conviene ofrecérselo a la agencia o asociarse para revenderlo?", "a": "Las dos se pueden. Para empezar, instálalo en la agencia: te deja un caso real para mostrar."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://knowledge.hubspot.com/integrations/set-up-and-use-the-hubspot-connector-for-claude", "https://www.canva.dev/docs/connect/canva-mcp-server-setup"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en una agencia de contenido", "negocio": "Ejemplo inventado: una agencia de redes y contenido en Medellín, con la dueña, dos community managers, una diseñadora y un analista part-time. Atienden marcas locales de gastronomía, moda y salud estética, y diseñan en Canva.", "punto_de_partida": "Cada community manager usa IA por su cuenta en chats sueltos y a veces se cuela el tono de una marca en otra. Los reportes de fin de mes se arman a último momento copiando números de cada plataforma.", "pasos": ["Eligieron como piloto la cuenta de una cafetería. La dueña juntó la guía de marca, diez piezas que el cliente aprobó sin cambios y la lista de lo que el cliente nunca quiere ver.", "En la demo, pegó una pieza que el cliente había rechazado el mes anterior. La skill de revisión marcó las mismas dos cosas que había marcado el cliente, citando la guía. Eso convenció a la dueña.", "Revisaron el plan: con más de cinco clientes y tres personas trabajando las cuentas, eligieron un plan Team para poder compartir Proyectos y skills. En Organization settings → Plugins & skills, pestaña Policy, la dueña dejó habilitadas la ejecución de código y las skills.", "Creó el Proyecto \"Cafetería - Gastronomía\" con la plantilla del kit: instrucciones, los seis archivos con sus nombres y la carpeta de reportes en Drive.", "Armó la carpeta revision-de-pieza-contra-marca con el SKILL.md del kit, la comprimió en ZIP y la subió en Customize → Skills. Hizo lo mismo con las skills de brief y de reporte, y las compartió con el equipo desde el menú de tres puntos, Share. Cada community manager las prendió en Shared with you.", "Durante dos semanas usaron las tres skills con trabajo real de la cafetería. Sumaron al archivo 06-historial-de-cambios los pedidos que el cliente repetía.", "Replicaron un Proyecto por cliente con la misma estructura y compartieron cada uno solo con quienes trabajan esa cuenta.", "Conectaron Google Drive y Gmail. Sumaron Canva desde el directorio de conectores porque ya diseñaban ahí. No sumaron HubSpot porque la agencia no lo usa.", "Crearon la tarea de reportes en manual. Quedó acordado que el analista sube las métricas a cada carpeta el último día hábil del mes y la dueña corre la tarea desde Scheduled el primer día hábil del mes siguiente."], "resultado": "Quedó un Proyecto por cliente con la misma estructura, tres skills compartidas por todo el equipo y una tarea que deja un borrador de reporte en la carpeta de cada cliente. Ninguna pieza ni reporte sale sin la aprobación de la persona a cargo de la cuenta."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Una pieza sale con el tono de otro cliente.", "solucion": "Casi siempre es porque se pidió en un chat fuera del Proyecto o en el Proyecto equivocado. Trabaja cada pieza dentro del Proyecto de ese cliente, revisa que la guía de marca esté subida y que las instrucciones digan que no use información de otros clientes. La skill de revisión marca MEZCLA DE CLIENTES cuando lo detecta."}, {"sintoma": "La agencia maneja varios clientes en HubSpot y Claude solo ve una cuenta.", "solucion": "Según HubSpot, se puede conectar una sola cuenta de HubSpot por cuenta de Claude a la vez, y Claude solo ve lo que el usuario conectado tiene permitido ver. Conecta la cuenta comercial de la agencia, o desconecta y vuelve a conectar cuando trabajes con otra. Si Sensitive Data está prendido en HubSpot, el conector no accede a los datos de engagement."}, {"sintoma": "No aparece el conector de Canva.", "solucion": "Según Canva, los conectores de Claude están solo en planes pagos de Claude. En un chat nuevo, abre el botón de herramientas, Manage connectors, y si no lo ves entra en Browse connectors y búscalo en la pestaña Web. Algunas funciones de Canva dependen del plan de Canva (por ejemplo, autofill puede estar solo en Enterprise)."}, {"sintoma": "Al subir la skill aparece un error de formato o de archivo faltante.", "solucion": "Revisa tres cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos), que la carpeta se llame igual que el name del SKILL.md y que adentro esté el archivo SKILL.md. Evita tildes, espacios y signos raros en el name y en la description."}], "kit": [{"archivo": "revision-de-pieza-contra-marca/SKILL.md", "que_es": "Skill que revisa una pieza contra la guía de marca del cliente del Proyecto, marca mezclas entre clientes y promesas sin respaldo, y devuelve veredicto, tabla y versión corregida. Guárdala en una carpeta revision-de-pieza-contra-marca, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: revision-de-pieza-contra-marca\ndescription: 'Revisa una pieza (post, carrusel, guion, mail, aviso o landing) contra la guía de marca del cliente en el Proyecto: qué respeta, qué no y cómo corregir. Úsala antes de aprobar o mandar una pieza.'\n---\n\n# Revisión de pieza contra la marca\n\nRevisas una pieza antes de que la agencia la mande al cliente. No la apruebas: dejas un informe para que la persona a cargo de la cuenta decida.\n\n## Antes de empezar\n\n1. Confirma de qué cliente es la pieza. Usa solo la guía de marca y las piezas aprobadas de ESTE Proyecto.\n2. Si en el Proyecto no hay guía de marca, dilo y no sigas: \"No encuentro la guía de marca de este cliente en el Proyecto. Súbela o pégala y vuelvo a revisar.\"\n3. Si la pieza nombra otra marca que la agencia atiende, o usa frases de otra guía de marca, márcalo primero como MEZCLA DE CLIENTES.\n\n## Qué revisas\n\n1. **Voz y tono**: persona (tú, usted, ustedes), registro, largo de frases, palabras que la marca usa y palabras prohibidas de la guía.\n2. **Mensaje**: si está alineado con el objetivo del brief o del trimestre que figura en el Proyecto.\n3. **Lo que no se dice**: temas, comparaciones o promesas que la guía prohíbe.\n4. **Promesas y datos**: resultados, porcentajes, precios, plazos, \"el mejor\", \"el único\", testimonios. Todo dato sin respaldo en el Proyecto va marcado SIN RESPALDO.\n5. **Formato**: si la guía define largo, uso de mayúsculas, emojis, hashtags o llamado a la acción, revisa que se cumpla.\n6. **Datos personales**: nombres, caras o testimonios de personas reales sin indicación de que hay permiso. Márcalo como CONFIRMAR PERMISO.\n\n## Qué entregas\n\n- **Veredicto**: LISTA PARA MANDAR, CON CAMBIOS MENORES o NO MANDAR TODAVÍA.\n- **Tabla** con columnas: punto, qué dice la guía, qué hace la pieza, corrección sugerida.\n- **Versión corregida** de la pieza, si el veredicto no es LISTA PARA MANDAR, cambiando solo lo necesario.\n- **Para el responsable de la cuenta**: dudas que no se resuelven con la guía (por ejemplo, si una promoción está vigente).\n\n## Reglas\n\n- Cita la guía de marca cuando marques algo (\"la guía dice: ...\").\n- No cambies el mensaje ni la idea creativa, solo lo que choca con la guía.\n- No inventes reglas de marca que no estén en el Proyecto. Si algo te parece raro pero la guía no lo cubre, ponlo en dudas, no en errores.\n- Las reglas de publicidad de cada país y de cada plataforma no las evalúas tú: si ves una promesa de salud, dinero o resultados, márcala para que la revise la agencia.\n"}, {"archivo": "plantilla-proyecto-por-cliente-agencia.md", "que_es": "La estructura fija para cada Proyecto de cliente: instrucciones para pegar, seis archivos con nombre, carpeta de reportes en Drive y checklist para sumar un cliente nuevo.", "contenido": "# Plantilla: Proyecto por cliente de la agencia\n\nUsa esta estructura igual para todos los clientes. Así cualquiera del equipo encuentra lo mismo en el mismo lugar, y las skills compartidas funcionan en todos los Proyectos.\n\nNombre del Proyecto: [CLIENTE] - [RUBRO]\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nTrabajas para la agencia [NOMBRE DE LA AGENCIA] en la cuenta de [CLIENTE], una marca de [RUBRO] en [PAÍS O CIUDAD].\n\nReglas que no se rompen:\n1. Usa solo la información de este Proyecto. No traigas tonos, datos ni ideas de otros clientes de la agencia.\n2. La voz es la de la guía de marca de este Proyecto. Si algo que te piden choca con la guía, márcalo como CONSULTAR antes de escribir.\n3. Todo es borrador. Lo aprueba [RESPONSABLE DE LA CUENTA] y después el cliente.\n4. No inventes datos, resultados, precios ni testimonios. Si falta un dato, márcalo como PENDIENTE.\n5. No uses: [PALABRAS O TEMAS PROHIBIDOS POR EL CLIENTE].\n6. Objetivo de este trimestre: [OBJETIVO]. Público principal: [PÚBLICO].\n7. Entregables habituales: [EJEMPLO: 3 posteos semanales, 1 mail mensual, reporte a fin de mes].\n\n## 2. Archivos para subir (con estos nombres)\n\n| Archivo | Qué tiene | Quién lo actualiza |\n|---|---|---|\n| 01-guia-de-marca | Voz, tono, palabras sí y no, colores y tipografías si aplica | [NOMBRE] |\n| 02-publico-y-producto | A quién le habla, qué vende, precios vigentes con fecha | [NOMBRE] |\n| 03-piezas-aprobadas | Diez piezas que el cliente aprobó sin cambios, con fecha | [NOMBRE] |\n| 04-lo-que-no-se-dice | Temas, comparaciones y promesas prohibidas | [NOMBRE] |\n| 05-objetivos-trimestre | Objetivos, campañas y fechas clave del trimestre | [NOMBRE] |\n| 06-historial-de-cambios | Pedidos de cambio que el cliente repite (para no repetir errores) | [NOMBRE] |\n\nReglas de los archivos:\n- Nada de contratos, facturas ni datos de clientes finales de la marca, salvo que el contrato con el cliente lo permita.\n- Cuando cambia algo (precios, objetivos), se reemplaza el archivo ese mismo día y se anota la fecha adentro.\n- Cada vez que el cliente pide el mismo cambio dos veces, se suma a 06-historial-de-cambios.\n\n## 3. Carpeta en Google Drive (para la tarea de fin de mes)\n\n[CARPETA DE LA AGENCIA]/Clientes/[CLIENTE]/Reportes/[AAAA-MM]/\n- metricas-[AAAA-MM]: exportación de las plataformas del mes.\n- notas-del-mes: qué se probó, qué pasó, pedidos del cliente.\n\n## 4. Checklist para sumar un cliente nuevo\n\n- [ ] Leí el contrato con el cliente y qué información se puede cargar.\n- [ ] Creé el Proyecto con el nombre [CLIENTE] - [RUBRO] y pegué las instrucciones.\n- [ ] Sube los seis archivos.\n- [ ] Probé la skill de revisión con dos piezas aprobadas y una que el cliente rechazó.\n- [ ] Creé la carpeta de reportes en Drive.\n- [ ] Si la agencia tiene plan Team o Enterprise: comparte el Proyecto con quienes trabajan la cuenta (Can view o Can edit).\n"}, {"archivo": "tarea-reporte-mensual-agencia.md", "que_es": "El prompt que arma un borrador de reporte por cliente leyendo las carpetas de Drive, con las dos formas de programarlo y la checklist antes de mandar.", "contenido": "# Reporte mensual: borrador por cliente\n\nEste archivo tiene el prompt para armar los borradores de reporte de fin de mes, leyendo las carpetas de cada cliente en Google Drive. No manda nada al cliente.\n\n## Cómo programarla\n\nLa configuración manual de tareas programadas en Cowork ofrece frecuencias por hora, diaria, semanal, en días hábiles o manual. No figura una opción mensual. Tienes dos caminos:\n\n- Crear la tarea en manual y correrla a mano desde Scheduled el primer día hábil de cada mes, cuando ya están cargadas las métricas.\n- Crearla con \"Create with Claude\" pidiendo \"el primer día hábil de cada mes\" y revisar en el resumen, antes de tocar Schedule, qué calendario quedó. Si no queda mensual, usa el primer camino.\n\n## Antes de usarla\n\n- [ ] Plan pago de Claude en la cuenta de la agencia.\n- [ ] Google Drive conectado con la cuenta de la agencia.\n- [ ] Cada cliente tiene su carpeta [CARPETA DE LA AGENCIA]/Clientes/[CLIENTE]/Reportes/[AAAA-MM]/ con las métricas exportadas y las notas del mes.\n- [ ] Probaste el prompt a mano con un cliente.\n\n## Prompt (copia desde aquí)\n\nEres el asistente de reportes de [NOMBRE DE LA AGENCIA].\n\n1. En Google Drive, abre [CARPETA DE LA AGENCIA]/Clientes/. Para cada cliente de esta lista: [LISTA DE CLIENTES], busca la carpeta Reportes del mes anterior y la del mes previo a ese.\n2. Si falta la carpeta o las métricas del mes, no armes ese reporte: anótalo en \"Faltan datos\".\n3. Para cada cliente con datos, arma un borrador de una página en un documento nuevo dentro de su carpeta del mes, llamado \"BORRADOR reporte [CLIENTE] [AAAA-MM]\", con:\n   - Tres cosas que pasaron en el mes, en simple.\n   - Qué funcionó y por qué creemos que funcionó. Marca como HIPÓTESIS lo que no esté respaldado por las notas.\n   - Qué probamos el mes que viene, según las notas del mes.\n   - Una tabla con las métricas del mes y del mes anterior, copiadas tal cual del archivo.\n\nReglas:\n- No calcules ni redondees métricas que no estén en el archivo. Si haces una diferencia entre meses, muestra los dos números.\n- No compares un cliente con otro.\n- No uses información de la carpeta de un cliente en el reporte de otro.\n- No mandes nada ni compartas los documentos.\n\nAl final, déjame una lista: cliente, link al borrador, quién lo revisa ([RESPONSABLE POR CLIENTE]) y \"Faltan datos\".\n\n## Antes de mandar cada reporte\n\n- [ ] El responsable de la cuenta revisa los números contra la plataforma.\n- [ ] Se pasa la skill revision-de-pieza-contra-marca si el cliente tiene reglas de tono también para los reportes.\n- [ ] Se saca \"BORRADOR\" del nombre recién cuando está aprobado.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-ia-para-agencias-de-marketing", "t": "Sistema con Claude para agencias de marketing", "d": "Un Proyecto por cliente, skills para briefs, piezas y reportes, y conectores como HubSpot o Canva si la agencia ya los usa: el sistema para que la agencia escale sin perder la voz de cada marca.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Agencias", "ficha": [["Qué es", "Un sistema con un Proyecto por cliente y skills compartidas para briefs, contenido, reportes y propuestas."], ["Necesitás", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No decide la estrategia ni aprueba piezas. Tampoco publica solo en redes en este sistema."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Pasar de la reunión con el cliente a un brief claro.", "Escribir piezas en la voz de cada marca sin mezclarlas.", "Reportes mensuales: juntar números y explicarlos.", "Propuestas para clientes nuevos.", "Revisiones y cambios que vuelven una y otra vez.", "Incorporar a alguien nuevo a una cuenta."]}, {"h": "El sistema", "lista": ["Un Proyecto por cliente: guía de marca, público, piezas aprobadas, lo que no se dice y los objetivos del trimestre. Así Claude no mezcla voces.", "Skill de brief: convierte las notas o la transcripción de una reunión en un brief con objetivo, público, mensaje y entregables.", "Skill de reporte mensual: toma los números que exporta la agencia y arma la explicación para el cliente, con lo que funcionó y lo que se prueba después.", "Skill de revisión de pieza: chequea una pieza contra la guía de marca del cliente antes de mandarla.", "Conectores: Google Drive y Gmail; HubSpot si lo usan para el comercial; Canva si diseñan ahí.", "Automatización: una tarea programada que a fin de mes arma el borrador de reporte de cada cliente con los archivos que dejaron en Drive."], "aviso": "Según HubSpot, su conector para Claude lee, crea y actualiza registros pero no borra, y pide un plan pago de Claude. Canva indica que su conector está en los planes pagos de Claude y que algunas funciones dependen del plan de Canva. Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "p": ["Para la voz de cada marca, combiná esto con la guía \"Skill de tu marca: que todo salga con tu tono y tus colores\". Para propuestas, la guía \"Propuesta comercial a partir de las notas de una llamada\"."], "prompts": [{"t": "Brief desde la reunión", "c": "Estas son las notas de la reunión con [CLIENTE]: [PEGÁ NOTAS O TRANSCRIPCIÓN].\nUsá la guía de marca del Proyecto.\nArmá un brief de una página: objetivo, público, mensaje principal, tono, entregables con fecha, qué no hacer y preguntas abiertas.\nSi algo de lo que pidió el cliente choca con su guía de marca, marcalo como CONSULTAR."}, {"t": "Reporte mensual para el cliente", "c": "Te paso los números del mes de [CLIENTE]: [PEGÁ O ADJUNTÁ].\nY los del mes anterior: [PEGÁ].\nArmá un reporte de una página para el dueño de la marca:\n1. Tres cosas que pasaron, en simple.\n2. Qué funcionó y por qué creemos que funcionó (marcá lo que es hipótesis).\n3. Qué probamos el mes que viene.\nNo infles números ni compares con otros clientes."}, {"t": "Revisión de pieza contra la marca", "c": "Esta es la pieza que vamos a mandar: [PEGÁ TEXTO O DESCRIBÍ LA PIEZA].\nRevisala contra la guía de marca del Proyecto y decime: qué respeta, qué no y cómo corregirlo. Marcá además cualquier promesa de resultados o dato sin respaldo."}]}, {"h": "Cómo instalarlo", "pasos": ["Elegí un cliente piloto de la agencia y juntá su guía de marca y 10 piezas aprobadas.", "Armá ese primer Proyecto y probá las tres skills con trabajo real del mes.", "Ajustá las skills para que sirvan a todos los clientes y subilas una vez; si la agencia tiene plan de equipo, compartilas con el equipo.", "Replicá un Proyecto por cliente con la misma estructura de archivos.", "Conectá Drive y Gmail; sumá HubSpot o Canva solo si ya los usan.", "Programá el borrador de reporte de fin de mes y definí quién lo revisa."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para agencias.\nLo que suelo ver es que el cuello de botella no es la creatividad: son los briefs, los reportes y las revisiones que vuelven. Lo que instalo es un espacio por cliente con su marca cargada y skills para pasar de la reunión al brief, revisar piezas contra la guía y armar el reporte del mes. El equipo sigue decidiendo y aprobando.\n¿Te muestro cómo quedaría con uno de tus clientes?"}], "lista": ["Argumento central: \"Podés sumar cuentas sin que el equipo se queme, y cada cliente recibe el mismo nivel aunque cambie quién lo atiende.\"", "Ojo: muchas agencias ya usan IA suelta. Lo que vendés es el orden: un sistema por cliente que no se pierde."]}, {"h": "Cuidados del rubro", "lista": ["Datos de los clientes de la agencia: contratos y números de cada marca son confidenciales. Revisá qué dice el contrato con cada cliente antes de cargar su información.", "Publicidad: reglas de cada plataforma y de cada país sobre promesas, testimonios y contenido hecho con IA. La agencia sigue siendo responsable.", "Revisión humana: ninguna pieza sale sin que la apruebe alguien del equipo."], "aviso": "Claude acelera el trabajo, pero la responsabilidad por lo que se publica sigue siendo de la agencia. Cuidá los datos personales según las leyes de cada país."}], "faq": [{"q": "¿Por qué un Proyecto por cliente y no uno para todos?", "a": "Porque así Claude trabaja solo con la marca de ese cliente y no mezcla tonos ni información."}, {"q": "¿Conviene ofrecérselo a la agencia o asociarse para revenderlo?", "a": "Las dos se pueden. Para empezar, instalalo en la agencia: te deja un caso real para mostrar."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://knowledge.hubspot.com/integrations/set-up-and-use-the-hubspot-connector-for-claude", "https://www.canva.dev/docs/connect/canva-mcp-server-setup"], "cat": "rubros", "parte": "construi"};</script>

<script>var GUIA = {"slug": "repos-grandes-sin-gastar-de-mas", "t": "Proyectos grandes en Claude Code sin gastar de más", "d": "Cómo trabajar en un repo grande sin que Claude lea todo: pedidos con archivos concretos, reglas para que no entre a ciertas carpetas, un mapa del proyecto en CLAUDE.md y Repomix cuando lo necesitás.", "tema": "Gastá menos tokens", "min": 8, "secciones": [{"h": "Por qué un repo grande se come el plan", "p": ["Cada archivo que Claude lee entra al contexto y se vuelve a mandar en cada mensaje siguiente. En un proyecto chico no se nota; en uno grande, un pedido vago como \"mejorá este código\" hace que Claude recorra medio repo para entender de qué le hablás.", "La documentación oficial lo dice así: los pedidos vagos disparan búsquedas amplias; los específicos dejan que Claude trabaje leyendo pocos archivos."]}, {"h": "Decile exactamente dónde mirar", "lista": ["Nombrá el archivo y la función: en vez de \"arreglá el login\", decí \"agregá validación de datos a la función de login en auth.ts\".", "Usá @ para mencionar archivos: escribí @ y la ruta (por ejemplo @src/auth.ts) para pasarle ese archivo directo, sin que tenga que buscarlo.", "Decile qué no tocar: \"no leas ni cambies nada fuera de src/pagos/\"."], "prompts": [{"t": "Cambio acotado", "c": "Trabajá solo en @[RUTA/ARCHIVO] (y en @[OTRO ARCHIVO] si hace falta).\nQuiero: [EL CAMBIO, EN UNA O DOS FRASES].\nNo leas otras carpetas salvo que sea imprescindible; si lo es, decime cuál y por qué antes de abrirla.\nCuando termines, decime qué cambiaste y cómo lo pruebo."}]}, {"h": "Que no entre a ciertas carpetas: reglas de permisos", "p": ["Claude Code no usa un archivo tipo .claudeignore. El mecanismo oficial son las reglas de permisos: una regla deny con Read bloquea que las herramientas de Claude lean un archivo o carpeta. Usan la misma sintaxis que .gitignore.", "Ponelas en .claude/settings.json del proyecto (se comparte con tu equipo) o en .claude/settings.local.json (solo para vos). También las podés agregar desde el comando /permissions."], "prompts": [{"t": "Ejemplo de .claude/settings.json", "c": "{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(./node_modules/**)\",\n      \"Read(./dist/**)\",\n      \"Read(./.env)\",\n      \"Read(./secrets/**)\"\n    ]\n  }\n}"}], "aviso": "Estas reglas aplican a las herramientas de archivos de Claude y a comandos que Claude Code reconoce, como cat, head o tail. No frenan un grep -r ni un script que abra archivos por su cuenta. Si necesitás un bloqueo real a nivel sistema, la documentación recomienda activar el sandbox."}, {"h": "Un mapa del proyecto en CLAUDE.md", "p": ["Si Claude ya sabe cómo está armado el proyecto, no tiene que explorarlo para entenderlo. Poné en CLAUDE.md un resumen corto: qué hace cada carpeta principal, dónde está la lógica importante y cómo se corren los tests. Mantenelo corto: la recomendación oficial es menos de 200 líneas."], "lista": ["CLAUDE.md por carpeta: los CLAUDE.md que están dentro de subcarpetas no se cargan al arrancar, sino cuando Claude lee archivos de esa carpeta. Ideal para explicar un módulo solo cuando hace falta.", "Reglas por ruta: en .claude/rules/ podés crear reglas con un campo paths (por ejemplo \"src/api/**/*.ts\") que se cargan solo cuando Claude trabaja con esos archivos.", "Importar en vez de copiar: con @ruta dentro de CLAUDE.md importás otro archivo. Ojo: lo importado se carga al arrancar, así que no ahorra; sirve para ordenar.", "Monorepos: con el ajuste claudeMdExcludes salteás CLAUDE.md de otros equipos que no te sirven."], "prompts": [{"t": "Armá el mapa del proyecto", "c": "Explorá este proyecto con un subagente y armame un mapa para CLAUDE.md de no más de 40 líneas: qué hace cada carpeta principal, dónde está la lógica central, cómo se instala, cómo se corren los tests y qué carpetas no hace falta leer nunca. Mostrámelo antes de guardarlo."}]}, {"h": "Explorar sin ensuciar tu conversación", "lista": ["Subagente Explore: es un subagente de solo lectura pensado para buscar y analizar código. Lo que lee queda en su contexto y a vos te llega el resumen.", "Modo plan: con Shift+Tab o /plan, Claude investiga y te propone el camino antes de tocar archivos.", "Plugins de inteligencia de código: para lenguajes con tipos, dejan que Claude vaya directo a la definición de una función en vez de buscar con grep y abrir varios archivos.", "Hooks para salidas largas: un hook puede filtrar, por ejemplo, la salida de los tests para que a Claude le lleguen solo los errores. La página oficial de costos tiene un ejemplo listo."]}, {"h": "Repomix: cuando necesitás todo en un solo archivo", "p": ["Repomix es una herramienta de código abierto que junta tu repo (o una parte) en un solo archivo pensado para IA. En Claude Code casi nunca hace falta, porque Claude ya lee los archivos que necesita. Sirve cuando querés pasarle una parte del proyecto a un chat de claude.ai o a otra herramienta.", "La clave es no meter todo: elegí qué entra y comprimí."], "lista": ["npx repomix@latest: lo corrés en la carpeta del proyecto sin instalar nada y te genera repomix-output.xml.", "repomix --include \"src/**/*.ts,**/*.md\": solo los archivos que coinciden.", "repomix --ignore \"**/*.log,tmp/\": suma exclusiones. Ya respeta .gitignore y .repomixignore.", "repomix --compress: deja la estructura del código (clases, funciones) y saca el resto, para que pese menos.", "repomix --token-count-tree: te muestra qué archivos pesan más. Cuenta con un tokenizador que no es el de Claude, así que tomalo como aproximado."], "aviso": "Repomix revisa con Secretlint que no se cuelen claves conocidas, pero igual mirá el archivo antes de pegarlo en cualquier lado."}], "faq": [{"q": "¿Existe .claudeignore?", "a": "No en la documentación oficial. Para que Claude no lea carpetas se usan reglas deny con Read en .claude/settings.json."}, {"q": "¿Le paso el repomix-output.xml a Claude Code para que entienda todo?", "a": "No conviene: estarías cargando todo el proyecto en el contexto. En Claude Code es mejor apuntar a archivos concretos y tener un buen mapa en CLAUDE.md."}, {"q": "¿Y si quiero un mapa visual del proyecto?", "a": "Mirá la guía de Graphify y Obsidian de la biblioteca, que arma un grafo del código."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/permissions", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/fr/context-window", "https://www.npmjs.com/package/repomix", "https://github.com/yamadashy/repomix", "https://code.claude.com/docs/en/context-window", "https://code.claude.com/docs/en/commands", "https://repomix.com/guide/command-line-options"], "ejemplo": {"titulo": "Ejemplo resuelto: un repo de tienda online que Claude dejó de recorrer entero", "negocio": "Ejemplo inventado: un estudio de desarrollo de dos personas en Rosario que mantiene la tienda online de una cadena de corralones. Es un solo repo con el backend en TypeScript, el frontend en React, tipos compartidos y una carpeta de scripts viejos de importación de catálogo.", "punto_de_partida": "Le pedían cosas como \"arreglá el cálculo del envío\" y Claude abría decenas de archivos antes de tocar uno. A mitad de la tarde ya estaban cerca del límite del plan y las respuestas se volvían lentas.", "pasos": ["Corrieron /context en una sesión típica y vieron que lo que más ocupaba eran resultados de búsquedas y archivos leídos, no el CLAUDE.md.", "Crearon .claude/settings.json con las reglas deny del kit (node_modules, dist, coverage, archivos .map y minificados, .env y secrets) y lo subieron al repo para que valiera para los dos.", "Le pidieron a Claude, con un subagente, el mapa del proyecto para CLAUDE.md. Lo recortaron a mano: quedó qué hace cada carpeta, dónde están pagos, stock y envíos, y cómo correr los tests de un solo paquete.", "Movieron las reglas de la API a .claude/rules/api.md con paths apuntando a la carpeta del backend, y las explicaciones del módulo de pagos a un CLAUDE.md dentro de esa carpeta.", "Cambiaron la forma de pedir: siempre con @ y la ruta del archivo, y la frase \"si necesitás abrir otro, decime cuál y por qué\". Para buscar algo sin saber dónde está, usaron el prompt del subagente Explore del kit.", "Para cambios grandes empezaron con /plan y aprobaron el plan antes de que Claude tocara archivos.", "Cuando el cliente pidió una revisión del módulo de envíos en un chat de claude.ai, armaron un recorte con repomix --include sobre esa carpeta, --compress y --token-count-tree, revisaron el archivo y lo subieron al chat.", "Después de una semana volvieron a correr /context en una tarea parecida para comparar qué ocupaba lugar."], "resultado": "Quedó un repo con reglas que frenan la lectura de carpetas que no aportan, un CLAUDE.md corto que funciona como mapa, reglas que se cargan solo cuando se trabaja en la API y una forma de pedir que nombra archivos. Claude explora con subagentes y a la conversación principal llega solo el resumen."}, "si_falla": [{"sintoma": "Pusiste una regla deny y Claude igual muestra contenido de esa carpeta.", "solucion": "Fijate cómo lo leyó. Las reglas Read frenan las herramientas de archivos y comandos que Claude Code reconoce (cat, head, tail, sed), pero no un grep -r corrido desde la carpeta de arriba ni un script de Python o Node que abra archivos por su cuenta. Si tiene que ser un bloqueo real, activá el sandbox."}, {"sintoma": "La regla no hace nada aunque la ruta parece bien escrita.", "solucion": "Revisá el comienzo de la ruta. Una sola barra (/carpeta) se ancla en la carpeta del proyecto cuando está en .claude/settings.json, no en la raíz del disco; para una ruta absoluta van dos barras (//home/...). Sin barra (node_modules/**) en una regla deny vale para esa carpeta a cualquier profundidad. Después de editar, mirá en /permissions que la regla aparezca."}, {"sintoma": "Tenés un archivo .claudeignore y no cambia nada.", "solucion": "Claude Code no lo usa. Pasá cada línea a una regla deny con Read en .claude/settings.json (por ejemplo, dist/ pasa a ser Read(dist/**)) y borrá el .claudeignore para que no confunda."}, {"sintoma": "Claude ignora lo que pusiste en un CLAUDE.md de una subcarpeta.", "solucion": "Es normal al arrancar: esos archivos se cargan recién cuando Claude lee archivos de esa carpeta. Si una regla tiene que valer siempre, ponela en el CLAUDE.md de la raíz. Con /memory ves qué archivos de memoria y reglas están cargados en la sesión."}, {"sintoma": "Repomix generó un archivo enorme que no entra en el chat.", "solucion": "Corré repomix --token-count-tree para ver qué pesa, achicá con --include a la carpeta que importa, sumá --ignore para tests, fixtures o datos de ejemplo y agregá --compress. El conteo usa un tokenizador que no es el de Claude, así que dejá margen."}], "kit": [{"archivo": "settings-repo-grande.json", "que_es": "Reglas deny listas para copiar en .claude/settings.json del proyecto: frenan la lectura de dependencias, compilados, mapas de código, archivos minificados y secretos, y dejan leer el .env.example.", "contenido": "{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(node_modules/**)\",\n      \"Read(vendor/**)\",\n      \"Read(dist/**)\",\n      \"Read(build/**)\",\n      \"Read(coverage/**)\",\n      \"Read(.next/**)\",\n      \"Read(**/*.min.js)\",\n      \"Read(**/*.map)\",\n      \"Read(.env)\",\n      \"Read(.env.*)\",\n      \"Read(!.env.example)\",\n      \"Read(secrets/**)\",\n      \"Read(**/*.pem)\"\n    ]\n  }\n}\n"}, {"archivo": "claude-md-mapa-repo-grande.md", "que_es": "Un CLAUDE.md de ejemplo que funciona como mapa del proyecto, más una regla por ruta para .claude/rules/ y la idea de un CLAUDE.md por módulo. Reemplazá los corchetes y recortalo a tu repo.", "contenido": "# CLAUDE.md de ejemplo: mapa de un repo grande\n\nEste es un ejemplo para un repo de tienda online con backend, frontend y scripts. Copiá la estructura, reemplazá los corchetes y borrá lo que no aplique. Que quede en menos de 60 líneas: es lo que Claude carga en cada sesión.\n\n---\n\n# [NOMBRE DEL PROYECTO]\n\n[Una línea: qué hace el sistema y para quién.]\n\n## Mapa\n- `apps/api/`: backend en [LENGUAJE]. La lógica de negocio está en `apps/api/src/servicios/`. Las rutas solo validan y llaman a un servicio.\n- `apps/web/`: frontend en [FRAMEWORK]. Las pantallas están en `apps/web/src/paginas/`, los componentes compartidos en `apps/web/src/ui/`.\n- `packages/tipos/`: tipos compartidos entre api y web. Si cambiás un tipo, revisá los dos lados.\n- `scripts/`: tareas sueltas (importar catálogo, migrar datos). No los toques salvo que te lo pida.\n- `docs/`: decisiones de arquitectura. Leé solo el archivo que te nombre.\n\n## Dónde está cada cosa importante\n- Pagos: `apps/api/src/servicios/pagos/`\n- Stock y precios: `apps/api/src/servicios/catalogo/`\n- Login y permisos: `apps/api/src/servicios/auth/`\n\n## Comandos\n- Instalar: `[COMANDO]`\n- Tests de un solo paquete: `[COMANDO] --filter [PAQUETE]` (preferí esto a correr todos)\n- Lint: `[COMANDO]`\n\n## Cómo trabajar en este repo\n- Antes de explorar, preguntá en qué carpeta está el problema si no te lo dije.\n- No abras más de [N] archivos sin decirme por qué.\n- Para buscar en todo el repo, usá un subagente y traeme solo el resumen.\n- Al terminar: qué archivos cambiaste y qué test corriste.\n\n---\n\n## Opcional: una regla que se carga solo para la API\n\nGuardala como `.claude/rules/api.md`. Se carga cuando Claude lee archivos que coinciden con `paths`, no en cada sesión.\n\n```markdown\n---\npaths:\n  - \"apps/api/**/*.ts\"\n---\n\n# Reglas de la API\n- Toda ruta nueva valida la entrada antes de llamar al servicio.\n- Los errores salen con el formato de `apps/api/src/errores.ts`.\n- Cada servicio nuevo tiene su test al lado, con el mismo nombre y `.test.ts`.\n```\n\n## Opcional: un CLAUDE.md dentro de un módulo complejo\n\nSi `apps/api/src/servicios/pagos/` tiene reglas propias (estados del pago, reintentos, webhooks), escribilas en `apps/api/src/servicios/pagos/CLAUDE.md`. Ese archivo no se carga al arrancar: entra solo cuando Claude lee archivos de esa carpeta.\n"}, {"archivo": "prompts-repo-grande.md", "que_es": "Seis pedidos para trabajar en un repo grande leyendo lo justo: arreglar un error, encontrar código con un subagente, planear, actualizar el mapa, recortar con Repomix y revisar el contexto.", "contenido": "# Pedidos para repos grandes: pack de prompts\n\nCopiá el que necesites y completá los corchetes. Todos apuntan a lo mismo: que Claude lea lo justo.\n\n## 1. Arreglar un error con lo que ya sabés\n\n```\nHay un error en @[RUTA/ARCHIVO]: [QUÉ PASA Y CUÁNDO].\nEl mensaje de error es:\n[PEGÁ EL ERROR]\nEmpezá por ese archivo. Si necesitás abrir otro, decime cuál y por qué antes de abrirlo.\nNo corras toda la suite de tests: corré solo [COMANDO DEL TEST PUNTUAL].\n```\n\n## 2. Encontrar dónde está algo sin llenar la conversación\n\n```\nUsá un subagente Explore para encontrar dónde se calcula [QUÉ COSA, EJ.: EL COSTO DE ENVÍO].\nTraeme solo: los archivos y funciones que intervienen (ruta y nombre), en el orden en que se llaman, y una línea de qué hace cada una.\nNo me pegues código todavía.\n```\n\n## 3. Planear un cambio que toca varias carpetas\n\n```\n/plan Quiero [EL CAMBIO]. Afecta, creo, a [CARPETAS].\nArmá el plan leyendo solo lo necesario. En el plan, listá qué archivos vas a leer y cuáles vas a cambiar.\nNo toques nada hasta que te diga que sí.\n```\n\n## 4. Actualizar el mapa del proyecto\n\n```\nRevisá si el mapa de CLAUDE.md sigue siendo cierto. Usá un subagente para comparar las carpetas que nombra con las que existen hoy.\nProponeme los cambios como lista (agregar, sacar, corregir). Que el archivo siga por debajo de [N] líneas.\n```\n\n## 5. Armar un recorte con Repomix para un chat de claude.ai\n\n```\nNecesito pasarle a un chat de claude.ai solo la parte de [MÓDULO].\nArmá el comando de Repomix con --include para esa carpeta y sus tipos, --compress y --token-count-tree.\nAntes de correrlo, mostrame el comando. Después decime qué archivos pesan más y si conviene sacar alguno.\n```\n\n## 6. Ver qué se comió el contexto\n\n```\n/context\n```\nMirá qué ocupa más lugar. Si es la conversación, usá `/compact` con una indicación de qué conservar, o `/clear` si vas a pasar a otra tarea.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

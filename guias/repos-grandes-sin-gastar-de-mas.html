<script>var GUIA = {"slug": "repos-grandes-sin-gastar-de-mas", "t": "Proyectos grandes en Claude Code sin gastar de más", "d": "Cómo trabajar en un repo grande sin que Claude lea todo: pedidos con archivos concretos, reglas para que no entre a ciertas carpetas, un mapa del proyecto en CLAUDE.md y Repomix cuando lo necesitás.", "tema": "Gastá menos tokens", "min": 8, "secciones": [{"h": "Por qué un repo grande se come el plan", "p": ["Cada archivo que Claude lee entra al contexto y se vuelve a mandar en cada mensaje siguiente. En un proyecto chico no se nota; en uno grande, un pedido vago como \"mejorá este código\" hace que Claude recorra medio repo para entender de qué le hablás.", "La documentación oficial lo dice así: los pedidos vagos disparan búsquedas amplias; los específicos dejan que Claude trabaje leyendo pocos archivos."]}, {"h": "Decile exactamente dónde mirar", "lista": ["Nombrá el archivo y la función: en vez de \"arreglá el login\", decí \"agregá validación de datos a la función de login en auth.ts\".", "Usá @ para mencionar archivos: escribí @ y la ruta (por ejemplo @src/auth.ts) para pasarle ese archivo directo, sin que tenga que buscarlo.", "Decile qué no tocar: \"no leas ni cambies nada fuera de src/pagos/\"."], "prompts": [{"t": "Cambio acotado", "c": "Trabajá solo en @[RUTA/ARCHIVO] (y en @[OTRO ARCHIVO] si hace falta).\nQuiero: [EL CAMBIO, EN UNA O DOS FRASES].\nNo leas otras carpetas salvo que sea imprescindible; si lo es, decime cuál y por qué antes de abrirla.\nCuando termines, decime qué cambiaste y cómo lo pruebo."}]}, {"h": "Que no entre a ciertas carpetas: reglas de permisos", "p": ["Claude Code no usa un archivo tipo .claudeignore. El mecanismo oficial son las reglas de permisos: una regla deny con Read bloquea que las herramientas de Claude lean un archivo o carpeta. Usan la misma sintaxis que .gitignore.", "Ponelas en .claude/settings.json del proyecto (se comparte con tu equipo) o en .claude/settings.local.json (solo para vos). También las podés agregar desde el comando /permissions."], "prompts": [{"t": "Ejemplo de .claude/settings.json", "c": "{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(./node_modules/**)\",\n      \"Read(./dist/**)\",\n      \"Read(./.env)\",\n      \"Read(./secrets/**)\"\n    ]\n  }\n}"}], "aviso": "Estas reglas aplican a las herramientas de archivos de Claude y a comandos que Claude Code reconoce, como cat, head o tail. No frenan un grep -r ni un script que abra archivos por su cuenta. Si necesitás un bloqueo real a nivel sistema, la documentación recomienda activar el sandbox."}, {"h": "Un mapa del proyecto en CLAUDE.md", "p": ["Si Claude ya sabe cómo está armado el proyecto, no tiene que explorarlo para entenderlo. Poné en CLAUDE.md un resumen corto: qué hace cada carpeta principal, dónde está la lógica importante y cómo se corren los tests. Mantenelo corto: la recomendación oficial es menos de 200 líneas."], "lista": ["CLAUDE.md por carpeta: los CLAUDE.md que están dentro de subcarpetas no se cargan al arrancar, sino cuando Claude lee archivos de esa carpeta. Ideal para explicar un módulo solo cuando hace falta.", "Reglas por ruta: en .claude/rules/ podés crear reglas con un campo paths (por ejemplo \"src/api/**/*.ts\") que se cargan solo cuando Claude trabaja con esos archivos.", "Importar en vez de copiar: con @ruta dentro de CLAUDE.md importás otro archivo. Ojo: lo importado se carga al arrancar, así que no ahorra; sirve para ordenar.", "Monorepos: con el ajuste claudeMdExcludes salteás CLAUDE.md de otros equipos que no te sirven."], "prompts": [{"t": "Armá el mapa del proyecto", "c": "Explorá este proyecto con un subagente y armame un mapa para CLAUDE.md de no más de 40 líneas: qué hace cada carpeta principal, dónde está la lógica central, cómo se instala, cómo se corren los tests y qué carpetas no hace falta leer nunca. Mostrámelo antes de guardarlo."}]}, {"h": "Explorar sin ensuciar tu conversación", "lista": ["Subagente Explore: es un subagente de solo lectura pensado para buscar y analizar código. Lo que lee queda en su contexto y a vos te llega el resumen.", "Modo plan: con Shift+Tab o /plan, Claude investiga y te propone el camino antes de tocar archivos.", "Plugins de inteligencia de código: para lenguajes con tipos, dejan que Claude vaya directo a la definición de una función en vez de buscar con grep y abrir varios archivos.", "Hooks para salidas largas: un hook puede filtrar, por ejemplo, la salida de los tests para que a Claude le lleguen solo los errores. La página oficial de costos tiene un ejemplo listo."]}, {"h": "Repomix: cuando necesitás todo en un solo archivo", "p": ["Repomix es una herramienta de código abierto que junta tu repo (o una parte) en un solo archivo pensado para IA. En Claude Code casi nunca hace falta, porque Claude ya lee los archivos que necesita. Sirve cuando querés pasarle una parte del proyecto a un chat de claude.ai o a otra herramienta.", "La clave es no meter todo: elegí qué entra y comprimí."], "lista": ["npx repomix@latest: lo corrés en la carpeta del proyecto sin instalar nada y te genera repomix-output.xml.", "repomix --include \"src/**/*.ts,**/*.md\": solo los archivos que coinciden.", "repomix --ignore \"**/*.log,tmp/\": suma exclusiones. Ya respeta .gitignore y .repomixignore.", "repomix --compress: deja la estructura del código (clases, funciones) y saca el resto, para que pese menos.", "repomix --token-count-tree: te muestra qué archivos pesan más. Cuenta con un tokenizador que no es el de Claude, así que tomalo como aproximado."], "aviso": "Repomix revisa con Secretlint que no se cuelen claves conocidas, pero igual mirá el archivo antes de pegarlo en cualquier lado."}], "faq": [{"q": "¿Existe .claudeignore?", "a": "No en la documentación oficial. Para que Claude no lea carpetas se usan reglas deny con Read en .claude/settings.json."}, {"q": "¿Le paso el repomix-output.xml a Claude Code para que entienda todo?", "a": "No conviene: estarías cargando todo el proyecto en el contexto. En Claude Code es mejor apuntar a archivos concretos y tener un buen mapa en CLAUDE.md."}, {"q": "¿Y si quiero un mapa visual del proyecto?", "a": "Mirá la guía de Graphify y Obsidian de la biblioteca, que arma un grafo del código."}], "fuentes": ["https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/permissions", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/fr/context-window", "https://www.npmjs.com/package/repomix", "https://github.com/yamadashy/repomix"], "cat": "ahorrar", "parte": "aprende"};</script>

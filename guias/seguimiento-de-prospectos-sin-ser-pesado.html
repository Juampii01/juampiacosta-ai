<script>var GUIA = {"slug": "seguimiento-de-prospectos-sin-ser-pesado", "t": "Seguimiento de prospectos sin ser pesado", "d": "Una secuencia de mensajes donde cada uno aporta algo nuevo, una planilla para no perder a nadie y un prompt para escribir los seguimientos con tu tono.", "tema": "Consigue clientes", "min": 8, "fichaNombre": "Secuencia de seguimiento", "ficha": [["Qué es", "Un sistema simple de seguimiento: secuencia, planilla y prompts."], ["Necesitas", "Claude y Google Sheets (o la planilla que uses)."], ["Tiempo", "Media hora para armarlo. Después, unos minutos por día."], ["Qué no hace", "No manda los mensajes por ti."]], "secciones": [{"h": "La regla: cada mensaje suma algo", "p": ["\"¿Pudiste ver lo que te mandé?\" no aporta nada y empuja a la persona a no contestar. Un buen seguimiento le da una razón para responder: una idea, un ejemplo, una respuesta a una duda que tenía o una salida fácil."]}, {"h": "La secuencia", "p": ["Un punto de partida. Ajusta los tiempos a tu rubro y a cómo te habló la persona."], "lista": ["Mensaje 1, recordatorio útil: retoma lo que habló y suma un recurso corto relacionado con su problema.", "Mensaje 2, prueba: un ejemplo o caso parecido al suyo, contado en dos o tres líneas.", "Mensaje 3, la objeción: responde la duda que mostró antes de que la vuelva a plantear.", "Mensaje 4, pregunta directa: \"¿Sigue siendo prioridad o lo dejamos para más adelante?\"", "Mensaje 5, cierre amable: avisa que no vas a insistir más y deja la puerta abierta."], "aviso": "En Instagram, si usas automatizaciones: pasadas 24 horas desde la última interacción, los mensajes automáticos no están permitidos. Con la etiqueta Human Agent una persona puede responder a mano hasta 7 días. Los seguimientos más largos, por otro canal que la persona haya aceptado."}, {"h": "La planilla", "p": ["Una fila por persona. Pídele a Claude que te arme la plantilla y la importas en Google Sheets."], "prompts": [{"t": "Plantilla de seguimiento", "c": "Ármame una plantilla de seguimiento de prospectos en formato CSV, separada por comas, en un bloque de código.\nColumnas: nombre, canal, de dónde vino, qué necesita (en una línea), objeción principal, último contacto (fecha), mensaje número, próximo contacto (fecha), estado, notas.\nEstados posibles: nuevo, en conversación, propuesta enviada, ganado, perdido, más adelante.\nAgrega 3 filas de ejemplo inventadas y marcadas como EJEMPLO para que se entienda cómo completarla."}], "pasos": ["Guarda el CSV en un archivo .csv.", "En Google Sheets: Archivo → Importar, sube el archivo y toca Importar.", "Borra las filas de ejemplo y carga tus prospectos.", "Cada día, ordena por \"próximo contacto\" y empieza por los de hoy."]}, {"h": "Escribe cada seguimiento", "prompts": [{"t": "Seguimiento personalizado", "c": "Escríbeme el mensaje de seguimiento número [NÚMERO] para esta persona.\nQué necesita: [EN UNA LÍNEA].\nLo último que hablamos: [RESUMEN].\nObjeción que mostró: [OBJECIÓN].\nCanal: [INSTAGRAM, WHATSAPP O MAIL].\n\nReglas:\n- Que aporte algo nuevo: una idea, un ejemplo o una respuesta.\n- Máximo 4 líneas si es chat, 6 si es mail.\n- Una sola pregunta al final.\n- Sin culpa, sin presión y sin \"solo quería saber si viste mi mensaje\".\nUsa mi ficha de voz (está en las instrucciones del Proyecto o te la pego abajo; si no tengo, te pego dos o tres mensajes míos para que copies el tono). Dame dos versiones: una más cálida y una más directa."}]}, {"h": "Cuándo parar", "p": ["Si después del mensaje de cierre no hay respuesta, pásalo a \"más adelante\" y anota una fecha para revisar en un par de meses. Si alguien te pide que no le escribas más, respétalo y márcalo como perdido."]}], "faq": [{"q": "¿Y si me contesta \"ahora no\"?", "a": "Pregúntale cuándo le conviene que le escribas de nuevo, anota esa fecha en la planilla y cúmplela."}, {"q": "¿Puedo pasarle la planilla a Claude?", "a": "Sí: expórtala o cópiala y pégala en un chat. Pídele que te diga a quién escribir hoy y que te prepare los mensajes."}], "fuentes": ["https://support.google.com/docs/answer/40608?hl=en", "https://help.manychat.com/hc/en-us/articles/14281199732892", "https://developers.facebook.com/docs/messenger-platform/send-messages", "https://support.google.com/docs/answer/40608", "https://developers.facebook.com/docs/messenger-platform/policy/policy-overview", "https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/overview", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"], "ejemplo": {"titulo": "Ejemplo resuelto: el seguimiento de una fotógrafa de producto", "negocio": "Ejemplo inventado: una fotógrafa de producto que trabaja sola en Guadalajara, México. Hace fotos para tiendas online chicas: velas, cosmética, mates, ropa. Los contactos le llegan por Instagram, por mail y por recomendación.", "punto_de_partida": "Tenía conversaciones abiertas en tres lugares y se acordaba de seguir solo a las que le escribían de nuevo. Cuando escribía, su mensaje era \"¿pudiste ver la propuesta?\".", "pasos": ["Descargó la planilla del kit, la importó en Google Sheets con Archivo → Importar, borró las filas EJEMPLO y cargó a las personas con las que había hablado el último mes.", "Creó un Proyecto llamado Seguimientos, pegó en las instrucciones su ficha de voz y tres mensajes suyos que le gustaban, y subió la skill seguimiento-de-prospectos en Customize → Skills.", "El lunes ordenó la planilla por próximo contacto. Le tocaban dos personas. Copió las dos filas y las pegó en el Proyecto con \"¿qué les escribo hoy?\".", "Para la dueña de una tienda de velas que ya había tenido un mal fotógrafo (mensaje 3, la objeción), Claude propuso contarle cómo trabaja la prueba con dos productos antes de cerrar todo el catálogo. Eligió la versión más directa, le cambió una palabra y la mandó a mano por Instagram.", "Para un contacto de Instagram que no respondía hacía más de una semana, revisó la regla: su herramienta de automatización ya no podía mandarle nada. Le escribió a mano y anotó en notas que, si no contestaba, el próximo paso era por mail, que la persona le había pasado.", "Actualizó en la planilla último contacto, mensaje número y próximo contacto de cada fila con la fecha que sugirió Claude.", "Cuando una persona le contestó \"ahora no, en enero\", le preguntó qué fecha le venía bien, pasó la fila a \"más adelante\" y puso esa fecha en próximo contacto."], "resultado": "Quedó una sola planilla con todas las conversaciones, una rutina corta cada mañana y mensajes que siempre suman algo y suenan a ella. Los manda ella, a mano, y nadie queda olvidado ni recibe mensajes de más."}, "si_falla": [{"sintoma": "Al importar el CSV en Google Sheets todo queda en una sola columna.", "solucion": "Vuelve a importar y en Tipo de separador (Separator character) elige Coma en vez de Detectar automáticamente. Si alguna nota tiene comas, pídele a Claude que ponga entre comillas los textos con comas."}, {"sintoma": "Las tildes y las eñes aparecen como símbolos raros, o las fechas quedan mezcladas (día y mes invertidos).", "solucion": "Guarda el archivo con codificación UTF-8 (en el Bloc de notas, Guardar como → Codificación UTF-8). Para las fechas, pídele a Claude que use siempre el formato AAAA-MM-DD: Sheets lo entiende igual en cualquier idioma."}, {"sintoma": "Tu herramienta de Instagram (por ejemplo ManyChat) no manda el seguimiento o tira error de ventana.", "solucion": "Pasaron más de 24 horas desde la última interacción de la persona y ya no se permiten mensajes automáticos. Hasta 7 días puedes responder a mano con la etiqueta Human Agent, si tu herramienta la tiene. Después, escríbele por otro canal que la persona haya aceptado."}, {"sintoma": "Usas la API de WhatsApp Business (con un proveedor o con n8n) y el mensaje de seguimiento no sale.", "solucion": "Fuera de la ventana de atención al cliente, WhatsApp solo deja mandar plantillas aprobadas. Arma una plantilla de seguimiento y haz que la aprueben, o manda el seguimiento a mano desde la app de WhatsApp Business."}, {"sintoma": "Claude escribe cosas que nunca hablaste con la persona o todos los mensajes suenan iguales.", "solucion": "Pásale lo último que hablaron en concreto (una o dos frases) y la objeción con sus palabras. Pega tu ficha de voz o mensajes tuyos. Si dice algo que no pasó, pídele que te marque de qué dato salió cada frase."}], "kit": [{"archivo": "planilla-seguimiento-prospectos.csv", "que_es": "La planilla lista para importar en Google Sheets, con las columnas de la guía, fechas en formato AAAA-MM-DD y tres filas EJEMPLO para borrar.", "contenido": "nombre,canal,de_donde_vino,que_necesita,objecion_principal,ultimo_contacto,mensaje_numero,proximo_contacto,estado,notas\nEJEMPLO Laura (tienda de velas),Instagram,Respondió una historia,Fotos de producto para la tienda online,Ya pagó un fotógrafo y no le gustó,2026-11-03,1,2026-11-06,en conversación,Le interesa fondo blanco y ambientadas\nEJEMPLO Martín (marca de mates),Mail,Recomendación de un cliente,Fotos para el lanzamiento de diciembre,Precio,2026-10-30,3,2026-11-06,propuesta enviada,Decide con la socia\nEJEMPLO Sofía (cosmética natural),WhatsApp,Formulario de la web,Renovar fotos del catálogo,No sabe si es el momento,2026-10-20,5,2027-01-15,más adelante,Pidió que le escriba en enero\n"}, {"archivo": "como-usar-planilla-seguimiento.md", "que_es": "Cómo importar la planilla, las reglas de cada columna, la rutina diaria de 10 minutos y espacios sugeridos entre mensajes.", "contenido": "# Planilla de seguimiento: cómo usarla\n\nEste kit trae `planilla-seguimiento-prospectos.csv`, lista para importar.\n\n## Importarla en Google Sheets\n\n1. Descarga el archivo .csv.\n2. En Google Sheets, abre una hoja nueva y ve a Archivo → Importar (File → Import).\n3. Elige la pestaña Subir (Upload) y selecciona el archivo.\n4. En la ubicación elige Reemplazar hoja actual o Insertar hojas nuevas.\n5. En Tipo de separador (Separator character) deja Detectar automáticamente o elige Coma.\n6. Toca Importar.\n7. Borra las filas que empiezan con EJEMPLO.\n\n## Reglas de la planilla\n\n- Fechas siempre como AAAA-MM-DD (2026-11-08). Así Sheets las ordena bien sin importar el idioma de tu cuenta.\n- `mensaje_numero` es el último que mandaste, del 1 al 5.\n- `estado` solo puede ser: nuevo, en conversación, propuesta enviada, ganado, perdido, más adelante.\n- `notas`: lo que te sirva para el próximo mensaje. Nada de datos sensibles.\n\n## Las dos vistas que usas todos los días\n\n- Selecciona la fila 1 y ve a Datos → Crear un filtro. Filtra `estado` para ocultar ganado y perdido.\n- Ordena por `proximo_contacto` de la A a la Z. Arriba quedan los de hoy y los atrasados.\n\n## Rutina diaria (10 minutos)\n\n1. Mira las filas con `proximo_contacto` de hoy o anterior.\n2. Para cada una, usa el prompt de seguimiento con los datos de la fila.\n3. Manda el mensaje tú, a mano.\n4. Actualiza `ultimo_contacto`, suma 1 a `mensaje_numero` y pon el nuevo `proximo_contacto`.\n5. Si contestó, cambia el `estado` y anota lo que dijo.\n\n## Espacios sugeridos entre mensajes (ajústalos a tu rubro)\n\nEs un punto de partida, no una regla. Si la persona te dijo una fecha, manda esa fecha.\n\n- Mensaje 1: a los pocos días de la última charla.\n- Mensaje 2: una semana después del 1.\n- Mensaje 3: una semana después del 2.\n- Mensaje 4: dos semanas después del 3.\n- Mensaje 5: dos semanas después del 4. Después, `más adelante` con fecha de revisión.\n\nEn Instagram con automatizaciones, ten en cuenta la ventana de 24 horas que explica la guía: los mensajes 2 a 5 suelen caer fuera y tienen que ir a mano o por otro canal que la persona aceptó.\n"}, {"archivo": "seguimiento-de-prospectos/SKILL.md", "que_es": "Skill que lee una o varias filas de la planilla, dice a quién escribir hoy y arma el mensaje que toca en dos versiones. Guárdala en una carpeta seguimiento-de-prospectos, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: seguimiento-de-prospectos\ndescription: Escribe mensajes de seguimiento a prospectos que aportan algo nuevo, con mi tono y sin presionar. Úsala cuando pegue una fila de mi planilla de seguimiento o pida un mensaje de seguimiento.\n---\n\n# Seguimiento de prospectos\n\nEscribes el próximo mensaje para una persona que todavía no compró. Cada mensaje tiene que darle una razón para responder. Nunca lo mandas tú: lo entregas para que el usuario lo revise y lo mande.\n\n## Qué te pasan\n\nUna fila de la planilla (nombre, canal, de dónde vino, qué necesita, objeción principal, último contacto, mensaje número, próximo contacto, estado, notas) o esos mismos datos sueltos. A veces, el último mensaje de la conversación.\n\nSi te pasan varias filas, primero di a quién toca escribir hoy (próximo contacto igual o anterior a la fecha que te den) y después escribe un mensaje por persona.\n\n## Qué mensaje toca\n\nMira `mensaje_numero` (el último que se mandó) y escribe el siguiente:\n\n1. **Recordatorio útil**: retoma lo que hablaron y suma un recurso corto ligado a su problema.\n2. **Prueba**: un ejemplo parecido a su caso en dos o tres líneas. Usa solo ejemplos que el usuario te haya dado. Si no tienes ninguno, pídelo.\n3. **La objeción**: responde la objeción principal antes de que vuelva a aparecer.\n4. **Pregunta directa**: \"¿Sigue siendo prioridad o lo dejamos para más adelante?\", con tus palabras.\n5. **Cierre amable**: avisa que no vas a insistir más y deja la puerta abierta.\n\nSi el estado es `más adelante` y llegó la fecha, escribe un mensaje de reencuentro: retoma lo que pidió y pregunta si es buen momento.\n\n## Reglas\n\n- Que aporte algo nuevo: una idea, un ejemplo o una respuesta.\n- Chat (Instagram, WhatsApp): máximo 4 líneas. Mail: máximo 6 líneas y un asunto corto.\n- Una sola pregunta al final.\n- Prohibido: \"solo quería saber si viste mi mensaje\", \"¿pudiste verlo?\", culpa, urgencia falsa, descuentos que el usuario no autorizó.\n- No inventes datos de la conversación anterior. Si las notas no alcanzan para el mensaje que toca, di qué te falta.\n- Si en las notas dice que pidió no recibir más mensajes, no escribas nada: avisa que hay que marcarlo como perdido.\n- Usa el tono de la ficha de voz o de los mensajes de ejemplo que te pase el usuario. Si no hay ninguno, escribe cercano, de ti y sin exagerar, y avisa que conviene pasarte ejemplos.\n\n## Qué entregas\n\nPara cada persona:\n1. Qué mensaje toca y por qué (una línea).\n2. Versión más cálida.\n3. Versión más directa.\n4. La fecha sugerida para el próximo contacto, para que el usuario la anote en la planilla.\n"}], "verificada": "2026-11-08", "cat": "clientes", "parte": "úsalo"};</script>

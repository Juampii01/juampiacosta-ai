<script>var GUIA = {"slug": "agente-de-whatsapp-que-atiende-y-agenda", "t": "Agente de WhatsApp que atiende y agenda turnos", "d": "Cómo se arma un agente con la plataforma oficial de WhatsApp y Claude por API: qué piezas lleva, qué necesitás y qué reglas de Meta no podés saltear.", "tema": "Agentes", "min": 12, "fichaNombre": "Agente de WhatsApp", "ficha": [["Qué es", "Un asistente que responde consultas de tu negocio por WhatsApp y reserva turnos en tu agenda."], ["Necesitás", "Cuenta de Meta, WhatsApp Business Platform (Cloud API), una clave de la API de Claude y un servidor o una herramienta de automatización."], ["Cuánto cuesta", "Meta cobra según su tabla de precios y la API de Claude se paga aparte de cualquier plan de Claude. Revisá las páginas oficiales antes de presupuestar."], ["Qué no hace", "No usa la app común de WhatsApp ni números personales: va por la plataforma oficial para empresas."]], "secciones": [{"h": "Las piezas del agente", "p": ["El circuito es siempre el mismo, lo armes como lo armes:"], "pasos": ["El cliente escribe a tu número de empresa.", "Meta le manda ese mensaje a tu servidor por un webhook (un aviso automático a una dirección web tuya).", "Tu servidor le pasa la conversación a Claude por API, junto con tus instrucciones y las herramientas que puede usar (por ejemplo, ver horarios libres y crear un turno).", "Si Claude decide usar una herramienta, te lo pide; tu código la ejecuta y le devuelve el resultado. Claude no toca tu agenda directamente.", "Tu servidor envía la respuesta final al cliente por la Cloud API."], "aviso": "Meta reintenta el webhook si tu servidor no responde con un código 200, y eso puede generar avisos duplicados. Guardá el identificador de cada mensaje y no respondas dos veces el mismo."}, {"h": "Qué necesitás para arrancar", "lista": ["Cuenta de desarrollador de Meta: con tu cuenta de Facebook o una cuenta de Meta administrada.", "Una app en el panel de Meta: con el caso de uso de WhatsApp, asociada a un portafolio comercial (business portfolio).", "Una cuenta de WhatsApp Business (WABA): se crea o se vincula desde la configuración de la API.", "Token permanente: el temporal vence rápido; para trabajar en serio se crea un usuario del sistema y se genera un token desde la configuración del negocio.", "Clave de la API de Claude: desde la Consola de Claude. Se factura aparte de los planes Pro, Max, Team o Enterprise.", "Dónde corre el código: tu propio servidor, o Make o n8n, que tienen módulos para recibir y enviar mensajes de WhatsApp Business Cloud."]}, {"h": "Tres formas de armarlo", "lista": ["Código propio: máximo control. Programás el webhook, la llamada a Claude y las herramientas. Ideal si sos desarrollador.", "Make o n8n: el disparador de WhatsApp recibe el mensaje, un paso llama a Claude y otro responde. Menos código, pero tenés que entender bien los límites de cada módulo.", "Un socio de Meta: los Solution Partners y Tech Providers ofrecen servicios sobre la plataforma de WhatsApp. Te simplifican el alta y la facturación; revisá qué te cobran y si te dejan conectar tu propia IA."], "aviso": "En n8n, WhatsApp permite un solo webhook por app: si alternás entre la URL de prueba y la de producción, una pisa a la otra."}, {"h": "Las reglas de Meta que no podés saltear", "lista": ["Ventana de 24 horas: cuando el cliente te escribe, se abre una ventana de atención de 24 horas que se renueva con cada mensaje suyo. Adentro podés mandar cualquier tipo de mensaje.", "Fuera de la ventana, solo plantillas: si pasaron las 24 horas, solo podés escribir con mensajes de plantilla aprobados.", "Consentimiento: para escribirle primero a alguien, esa persona tiene que haber aceptado recibir mensajes tuyos, con el nombre de tu negocio a la vista. Y tenés que explicar cómo darse de baja y respetarlo.", "Calidad: si la calidad de tus conversaciones es baja durante un tiempo sostenido, Meta limita tus envíos. Mandá solo lo que el cliente espera recibir.", "Nada de asistentes de IA de uso general: los términos de WhatsApp Business prohíben ofrecer IA como función principal (un chat para preguntar cualquier cosa). Un agente que atiende tu negocio, donde la IA es una ayuda para tu servicio, es otro caso. Igual, la decisión final es de Meta: leé los términos vigentes."]}, {"h": "Las instrucciones del agente", "p": ["Esto va como instrucción de sistema en la llamada a Claude. Es la parte que más define si el agente ayuda o te hace quedar mal."], "prompts": [{"t": "Instrucciones del agente de WhatsApp", "c": "Sos el asistente de WhatsApp de [NOMBRE DEL NEGOCIO], un [RUBRO] en [CIUDAD].\nTu trabajo es solo este: responder dudas sobre el negocio y reservar, cambiar o cancelar turnos.\n\nInformación del negocio:\n- Horarios: [HORARIOS]\n- Servicios y duración: [LISTA]\n- Precios: [LISTA O \"no informar precios, derivar\"]\n- Dirección y cómo llegar: [DATOS]\n- Políticas (cancelación, demoras, señas): [POLÍTICAS]\n\nReglas:\n1. Respondé corto, claro y amable, como un mensaje de WhatsApp. Nada de textos largos.\n2. Para reservar, usá siempre la herramienta de horarios libres. Nunca inventes un horario.\n3. Antes de confirmar un turno, repetí día, hora y servicio y pedí un \"sí\".\n4. Si te preguntan algo que no está en esta información, decí que lo consultás con el equipo y avisá con la herramienta de derivar a una persona.\n5. Si el cliente está enojado, reclama un cobro o pide hablar con alguien, derivá a una persona.\n6. No hables de temas que no tengan que ver con el negocio.\n7. No pidas datos sensibles: ni tarjetas, ni contraseñas, ni documentos."}]}, {"h": "Riesgos y cómo cubrirte", "lista": ["Respuestas inventadas: limitá al agente a la información que le das y probalo con preguntas raras antes de abrirlo al público.", "Turnos dobles: que la herramienta de reserva vuelva a chequear el horario justo antes de crearlo.", "Datos personales: guardá solo lo necesario y avisá en tu política de privacidad que usás un asistente automático.", "Costos que crecen: poné un límite de largo a cada conversación y revisá el consumo de la API cada semana."]}], "faq": [{"q": "¿Puedo usar la app WhatsApp Business del celular?", "a": "Para conectar Claude de esta forma necesitás la WhatsApp Business Platform (Cloud API), que es la versión para integraciones."}, {"q": "¿Puedo escribirle primero a un cliente para recordarle el turno?", "a": "Sí, si aceptó recibir mensajes tuyos y si usás una plantilla aprobada cuando la ventana de 24 horas está cerrada."}, {"q": "¿Me alcanza con mi plan de Claude?", "a": "No. Los planes de claude.ai no incluyen uso de la API: se paga aparte, desde la Consola de Claude."}], "fuentes": ["https://developers.facebook.com/documentation/business-messaging/whatsapp/get-started", "https://developers.facebook.com/documentation/business-messaging/whatsapp/messages/send-messages", "https://developers.facebook.com/documentation/business-messaging/whatsapp/getting-opt-in", "https://developers.facebook.com/documentation/business-messaging/whatsapp/webhooks/overview", "https://developers.facebook.com/documentation/business-messaging/whatsapp/solution-providers/overview/", "https://www.whatsapp.com/legal/business-solution-terms/", "https://developers.facebook.com/documentation/business-messaging/whatsapp/pricing/ai-providers/", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "https://support.claude.com/en/articles/9876003", "https://apps.make.com/whatsapp-business-cloud-modules", "https://docs.n8n.io/integrations/builtin/trigger-nodes/n8n-nodes-base.whatsapptrigger/"], "cat": "agentes", "parte": "usalo"};</script>

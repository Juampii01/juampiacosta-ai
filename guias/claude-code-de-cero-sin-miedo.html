<script>var GUIA = {"slug": "claude-code-de-cero-sin-miedo", "t": "Claude Code de cero y sin miedo", "d": "Lo instalas (en la app de escritorio o en la terminal), inicias sesión y le das tu primera tarea. Sin saber programar.", "tema": "Claude Code", "min": 9, "fichaNombre": "Claude Code", "ficha": [["Qué es", "La versión de Claude que trabaja adentro de una carpeta de tu computadora: lee tus archivos, los modifica y corre comandos con tu permiso."], ["Necesitas", "Un plan Pro, Max, Team o Enterprise, o una cuenta de Claude Console. El plan gratis no lo incluye."], ["Dos formas de usarlo", "La pestaña Code de la app de escritorio (sin terminal) o el comando claude en la terminal."], ["Qué no hace", "No adivina lo que quieres: cuanto más claro se lo pidas, mejor sale."]], "secciones": [{"h": "Elige por dónde entrar", "p": ["Hay dos puertas al mismo Claude Code. Si nunca abriste una terminal, empieza por la app de escritorio: es todo con botones. Si ya te animas a pegar un comando, la terminal te da todas las opciones.", "Las dos usan tu misma cuenta de Claude, así que puedes arrancar en una y después probar la otra."], "lista": ["App de escritorio: viene con Claude Code adentro, no tienes que instalar nada más. Ideal para empezar.", "Terminal: instalas el programa con un comando y lo abres escribiendo claude. Es la versión más completa."]}, {"h": "Opción A: la app de escritorio", "pasos": ["Descarga la app de Claude para Mac o Windows desde la guía oficial (en Linux está en beta) e instálala.", "Ábrela e inicia sesión con tu cuenta de Claude.", "Haz clic en la pestaña Code, arriba de todo en la barra lateral. Si te pide mejorar el plan, es porque tu cuenta es gratis.", "Debajo del cuadro de mensaje, en el selector de entorno, elige la primera opción del grupo Local.", "Al lado, toca el control de carpeta → Open folder… y elige la carpeta de tu proyecto.", "Escribe tu primera tarea (tienes una abajo) y mandala."], "aviso": "Para la primera vez usa una carpeta de prueba o una copia de tu proyecto, no la versión que ya usas con clientes."}, {"h": "Opción B: la terminal", "p": ["Abre la terminal (en Mac: Terminal; en Windows: PowerShell), pega el comando que te corresponde y aprieta Enter. Mientras descarga no muestra nada: espera a que termine."], "prompts": [{"t": "Mac, Linux o WSL", "c": "curl -fsSL https://claude.ai/install.sh | bash"}, {"t": "Windows (PowerShell)", "c": "irm https://claude.ai/install.ps1 | iex"}, {"t": "Comprobar que quedó instalado (en una terminal nueva)", "c": "claude --version"}], "pasos": ["Cierra la terminal y abre una nueva. Corre claude --version: si aparece un número de versión, está listo.", "Entra a la carpeta de tu proyecto con cd y la ruta, por ejemplo: cd Documentos/mi-proyecto.", "Escribe claude y aprieta Enter.", "La primera vez te pide iniciar sesión: se abre el navegador, entras con tu cuenta y vuelves a la terminal.", "Si más adelante quieres cambiar de cuenta, adentro de Claude Code escribe /login."], "aviso": "En Windows conviene instalar también Git para Windows: Claude Code lo usa para correr comandos. Si no está, usa PowerShell."}, {"h": "Tu primera tarea", "p": ["Arranca preguntando, no pidiendo cambios. Así ves cómo entiende tu proyecto antes de tocar nada. Después pídele algo chico y revisa lo que propone."], "prompts": [{"t": "Primera pregunta", "c": "Explícame qué hay en esta carpeta como si yo no supiera programar: qué es cada archivo importante, para qué sirve el proyecto y qué te haría falta saber para trabajar en él. No cambies nada todavía."}, {"t": "Primer cambio chico", "c": "Quiero hacer un cambio chico para probar: [DESCRIBE EL CAMBIO, POR EJEMPLO: CAMBIAR EL TÍTULO DE LA PÁGINA PRINCIPAL POR \"BIENVENIDOS\"]. Antes de hacerlo, dime qué archivo vas a tocar y qué vas a cambiar. Espera mi OK."}]}, {"h": "Cuando te pide permiso", "p": ["En el modo Manual, antes de editar un archivo o correr un comando, Claude Code te muestra qué quiere hacer y espera tu respuesta. Léelo: si está bien, elige Yes; si no, dile qué cambiar. En los modos Auto y Accept edits, en cambio, aplica los cambios de archivos sin esperarte y tú los revisas después.", "En la terminal, Shift+Tab cambia el modo de permisos (cuánto puede hacer sin preguntarte) y la barra de abajo te muestra cuál está activo. En la app de escritorio el modo está en el selector de la fila de abajo del cuadro de mensaje. Si recién empiezas, elige Manual, que te pregunta antes de editar o correr comandos. Ojo: en las versiones recientes la terminal arranca en Auto cuando está disponible, así que la primera vez fíjate y cámbialo."]}], "faq": [{"q": "Dice que \"claude\" no se reconoce", "a": "Cierra la terminal y abre una nueva. Si sigue, la carpeta del programa no quedó en el PATH: la guía oficial de problemas de instalación te dice cómo arreglarlo según tu sistema."}, {"q": "¿Necesito saber programar?", "a": "No. Le hablas en español, como a un compañero. Lo que sí conviene es pedir cosas concretas y leer lo que te propone antes de aprobarlo."}, {"q": "En la app no me deja entrar a Code", "a": "Si te aparece un aviso para mejorar el plan, tu cuenta es gratis: Claude Code necesita Pro, Max, Team o Enterprise."}], "fuentes": ["https://code.claude.com/docs/en/quickstart", "https://code.claude.com/docs/en/desktop-quickstart", "https://code.claude.com/docs/en/troubleshoot-install", "https://code.claude.com/docs/en/permission-modes", "https://code.claude.com/docs/en/desktop", "https://code.claude.com/docs/en/terminal-guide"], "ejemplo": {"titulo": "Ejemplo resuelto: la dueña de una panadería cambia su web sin llamar a nadie", "negocio": "Ejemplo inventado: una panadería de barrio en Asunción, Paraguay, con la dueña y tres empleados. Tienen una página web simple que les armó un sobrino hace años y que nadie sabe editar.", "punto_de_partida": "Cambiaron el horario de los domingos y la web sigue mostrando el viejo. La dueña tiene la carpeta con los archivos de la página en su computadora, pero nunca abrió una terminal.", "pasos": ["Sacó el plan Pro de Claude, porque el plan gratis no incluye Claude Code.", "Copió la carpeta de la web y le puso de nombre \"web-prueba\". Va a trabajar solo sobre esa copia.", "Descargó la app de escritorio de Claude para Windows desde la guía oficial, la instaló e inició sesión con su cuenta.", "Hizo clic en la pestaña Code. En el selector de entorno eligió la primera opción de Local y, con Open folder…, eligió \"web-prueba\".", "En el selector de modo, en la fila de abajo, eligió Manual.", "Guardó en la carpeta el CLAUDE.md del kit, con sus datos: \"No sé programar. Lo que no se puede romper es el botón de WhatsApp\".", "Pegó la \"Primera pregunta\" de la guía. Claude le explicó que la página principal es un archivo llamado index.html y que el horario está ahí.", "Pegó el \"Primer cambio chico\" con su pedido: \"cambiar el horario del domingo a 7 a 13\". Claude le dijo qué archivo y qué línea iba a tocar, y esperó.", "Le dio el OK. Vio el pedido de permiso con el cambio marcado, eligió aprobar y abrió el archivo en el navegador para ver la página con el horario nuevo.", "Cuando le gustó cómo quedó, le pidió al sobrino que suba la versión nueva. La próxima vez va a intentar subirla ella."], "resultado": "La dueña tiene Claude Code en la app de escritorio, en modo Manual, con un CLAUDE.md que le pide explicar todo simple y esperar su OK. Ya hizo un cambio real en una copia de su web, entendiendo qué se tocó, y el original sigue intacto."}, "si_falla": [{"sintoma": "Después de instalar, la terminal dice \"command not found: claude\" o \"'claude' is not recognized\".", "solucion": "Cierra la terminal y abre una nueva. Si sigue, la carpeta del programa no está en el PATH: sigue la sección Fix your PATH de la guía oficial de problemas de instalación, que tiene los pasos para Mac, Linux y Windows."}, {"sintoma": "En Windows aparece \"'irm' is not recognized\" o \"The token '&&' is not a valid statement separator\".", "solucion": "Pegaste el comando de otra consola. Si tu línea empieza con C:\\ sin PS, estás en CMD: abre PowerShell desde el menú Inicio y pega irm https://claude.ai/install.ps1 | iex. Si empieza con PS C:\\, estás en PowerShell: usa ese mismo comando, no el de CMD."}, {"sintoma": "El instalador falla con \"syntax error near unexpected token '<'\" o un error 403.", "solucion": "El comando descargó una página web en vez del instalador. Si en el error aparece \"App unavailable in region\", Claude Code no está disponible en tu país. Si no, espera unos minutos y prueba de nuevo (suele ser temporal); un 403 también puede venir del proxy o firewall de una red de oficina. Si sigue, usa un método alternativo de la guía oficial: Homebrew en Mac (brew install --cask claude-code) o WinGet en Windows (winget install Anthropic.ClaudeCode). Esos no se actualizan solos."}, {"sintoma": "En Windows, al escribir claude se abre la app de escritorio en vez de Claude Code en la terminal.", "solucion": "Una versión vieja de la app de escritorio registró su propio comando y le gana al de la terminal. Actualiza la app de Claude a la última versión y abre una terminal nueva."}, {"sintoma": "En PowerShell aparece \"Claude Code does not support 32-bit Windows\" aunque tu computadora es nueva.", "solucion": "Abriste \"Windows PowerShell (x86)\". Ciérrala, abre \"Windows PowerShell\" sin el x86 desde el menú Inicio y vuelve a correr el comando de instalación."}], "kit": [{"archivo": "CLAUDE-para-principiantes.md", "que_es": "CLAUDE.md de ejemplo para quien no programa: le pide a Claude Code hablar simple, avisar qué va a tocar y esperar tu OK. Renómbralo a CLAUDE.md, completa los corchetes y ponlo en la carpeta del proyecto.", "contenido": "# Cómo trabajar conmigo en este proyecto\n\n(Guarda este archivo como CLAUDE.md en la carpeta de tu proyecto. Claude Code lo lee al empezar cada sesión. Completa lo que está entre corchetes.)\n\n## Quién soy\n- Soy [TU NOMBRE], [A QUÉ TE DEDICAS]. No sé programar.\n- Este proyecto es [QUÉ ES: por ejemplo, la página web de mi negocio].\n- Lo que más me importa es que [LO QUE NO SE PUEDE ROMPER: por ejemplo, que el formulario de contacto siga andando].\n\n## Cómo hablarme\n- En español, con palabras simples. Si usas un término técnico, explícalo en una frase.\n- Respuestas cortas. Primero lo que importa, después el detalle si te lo pido.\n\n## Antes de cambiar algo\n- Dime qué archivo vas a tocar y qué vas a cambiar, en una o dos frases.\n- Espera mi OK antes de editar, borrar o correr comandos.\n- Haz un cambio por vez. No aproveches para \"mejorar\" otras cosas que no te pedí.\n- Si algo no está claro, pregúntame antes de suponer.\n\n## Lo que no se toca\n- No leas ni modifiques archivos .env ni nada que tenga contraseñas o claves.\n- No borres archivos. Si crees que algo sobra, dímelo y yo decido.\n- No instales programas ni paquetes sin explicarme para qué y esperar mi OK.\n- No publiques nada ni hagas push sin que te lo pida.\n\n## Al terminar cada tarea\n- Cuéntame en tres líneas qué cambiaste, en qué archivo y cómo lo pruebo yo.\n- Si quedó algo pendiente o con dudas, dilo al final.\n"}, {"archivo": "settings-arrancar-en-modo-manual.json", "que_es": "Configuración para que Claude Code arranque siempre en Manual (te pregunta antes de editar o correr comandos). Guárdala como settings.json dentro de la carpeta .claude de tu usuario (~/.claude/settings.json); si ya tienes ese archivo, suma solo la parte de permissions.", "contenido": "{\n  \"permissions\": {\n    \"defaultMode\": \"default\"\n  }\n}\n"}, {"archivo": "checklist-primer-dia-claude-code.md", "que_es": "Checklist paso a paso para el primer día, por la app de escritorio o por la terminal, trabajando siempre sobre una copia.", "contenido": "# Mi primer día con Claude Code\n\nSíguelo en orden. Cada casilla es algo que puedes comprobar con tus ojos.\n\n## Antes de abrirlo\n- [ ] Tengo un plan Pro, Max, Team o Enterprise (o cuenta de Claude Console si uso la terminal).\n- [ ] Hice una COPIA de la carpeta de mi proyecto y voy a trabajar sobre la copia.\n- [ ] Elige por dónde entrar: app de escritorio (pestaña Code) o terminal (comando claude).\n\n## Si uso la app de escritorio\n- [ ] Inicié sesión y veo la pestaña Code arriba en la barra lateral.\n- [ ] En el selector de entorno elige la primera opción del grupo Local.\n- [ ] Con Open folder… elige la carpeta COPIA.\n- [ ] En el selector de modo (fila de abajo del cuadro de mensaje) elige Manual.\n\n## Si uso la terminal\n- [ ] Pegué el comando de instalación de mi sistema y esperé a que terminara (no muestra avance).\n- [ ] Abre una terminal NUEVA y claude --version me muestra un número.\n- [ ] Entré a la carpeta COPIA con cd y escribe claude.\n- [ ] Inicié sesión en el navegador y volví a la terminal.\n- [ ] Apreté Shift+Tab hasta que abajo dice \"manual mode on\".\n\n## Primera charla\n- [ ] Guardé el CLAUDE.md del kit en la carpeta, con mis datos.\n- [ ] Le hice la \"Primera pregunta\" de la guía y entendí su explicación.\n- [ ] Le pedí el \"Primer cambio chico\" y me dijo qué archivo iba a tocar ANTES de tocarlo.\n- [ ] Leí el pedido de permiso, elige Yes y abre el archivo para ver el cambio.\n\n## Si algo salió mal\n- [ ] En la terminal: Esc dos veces con el cuadro vacío (o /rewind) para volver atrás.\n- [ ] Si no se arregla: borro la copia y hago otra. El original está intacto.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

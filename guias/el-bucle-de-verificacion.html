<script>var GUIA = {"slug": "el-bucle-de-verificacion", "t": "El bucle de verificación: que Claude revise su trabajo", "d": "Escribís una vez tu checklist de calidad y le pedís a Claude que revise cada entrega contra esa lista antes de dártela.", "tema": "Sacale más jugo a Claude", "min": 8, "fichaNombre": "Bucle de verificación", "ficha": [["Qué es", "Una lista de control propia que Claude usa para revisar lo que hizo."], ["Necesitás", "Una cuenta de Claude. Mejor si usás proyectos para guardar la lista."], ["Tiempo", "Media hora para escribir tu primera checklist."], ["Qué no hace", "No reemplaza tu revisión final: te ahorra la primera pasada."]], "secciones": [{"h": "La idea", "p": ["La guía oficial de prompts de Anthropic sugiere cerrar los pedidos con algo como \"antes de terminar, verificá tu respuesta contra estos criterios\". El truco está en que esos criterios sean tuyos, concretos y escritos una sola vez.", "Pasa lo mismo que con un empleado nuevo: si le das la lista de lo que revisás vos, deja de traerte trabajo con los mismos errores."]}, {"h": "Cómo escribir tu checklist", "pasos": ["Juntá tres o cuatro trabajos que tuviste que corregir y anotá qué arreglaste en cada uno.", "Convertí cada corrección en una regla que se pueda responder con sí o no. \"Que esté bien escrito\" no sirve; \"cada párrafo tiene menos de 4 líneas\" sí.", "Quedate con entre 5 y 10 reglas. Más que eso se vuelve difícil de cumplir.", "Probala con un trabajo viejo y ajustá las reglas que no se entiendan."], "prompts": [{"t": "Armar la checklist con Claude", "c": "Quiero armar una checklist para revisar [TIPO DE TRABAJO, EJ.: PRESUPUESTOS PARA CLIENTES].\nTe paso trabajos que tuve que corregir y lo que les cambié:\n[PEGÁ EL TRABAJO 1] → Cambié: [QUÉ CORREGISTE]\n[PEGÁ EL TRABAJO 2] → Cambié: [QUÉ CORREGISTE]\nCon eso armame entre 5 y 10 reglas. Cada regla tiene que poder responderse con sí o no, sin interpretación. No agregues reglas que no salgan de mis correcciones."}]}, {"h": "El pedido con verificación", "p": ["Pegá esto al final de cualquier pedido, o guardalo en las instrucciones de un proyecto para que se aplique siempre."], "prompts": [{"t": "Cierre de verificación", "c": "Antes de darme la versión final, revisala contra esta checklist:\n[PEGÁ TU CHECKLIST]\nPara cada regla escribí: CUMPLE o NO CUMPLE, y una línea de por qué.\nSi alguna no cumple, corregí el trabajo y volvé a revisar.\nAl final dame: 1) la tabla de revisión, 2) la versión corregida. Si una regla no se puede comprobar con lo que tenés, decímelo en vez de dar por hecho que cumple."}]}, {"h": "Dejarla fija en un proyecto", "p": ["Los proyectos de Claude tienen instrucciones propias que se aplican a todos los chats de adentro. Si pegás ahí tu checklist y el cierre de verificación, no tenés que acordarte de pedirlo cada vez."], "pasos": ["Creá un proyecto con el nombre del tipo de trabajo (por ejemplo, Presupuestos).", "En las instrucciones del proyecto pegá tu checklist y el cierre de verificación.", "Cada vez que encuentres un error nuevo, sumalo como regla."]}, {"h": "Límites que conviene conocer", "lista": ["Revisa contra lo que le diste: si la checklist no menciona algo, no lo va a mirar.", "No confirma datos externos solo: si hay precios, fechas o nombres, chequealos vos o pedile que use la búsqueda web y te muestre la fuente.", "Puede marcar como cumplido algo dudoso: por eso le pedís el porqué de cada regla, para que vos puedas ver en qué se basó."], "aviso": "La revisión de Claude es una primera pasada. Lo que sale con tu nombre lo revisás vos."}], "faq": [{"q": "¿Y si la revisión dice que todo cumple pero yo veo un error?", "a": "Agregá ese error como regla nueva. La checklist mejora con el uso."}, {"q": "¿Sirve para cosas que no son texto?", "a": "Sí, para planillas, presentaciones o código, siempre que las reglas se puedan comprobar mirando el resultado."}, {"q": "¿Hace falta con los modelos más nuevos?", "a": "La guía de Anthropic aclara que Claude Opus 5 verifica su propio trabajo sin que se lo pidas, y que en ese modelo conviene sacar las instrucciones de verificación genéricas, porque lo hacen verificar de más y gastar más tokens sin mejorar el resultado. Una checklist tuya es otra cosa: no le pide que revise, le dice qué revisar según tus criterios. Si usás un modelo que ya verifica solo y la tabla te parece demasiado, usá una versión corta que muestre solo lo que no cumplía."}], "fuentes": ["https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "https://support.claude.com/en/articles/9517075-what-are-projects", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: una contadora que dejó de corregir los mismos errores en sus propuestas", "negocio": "Ejemplo inventado: una contadora independiente en Asunción que atiende a comercios chicos. Arma propuestas de honorarios mensuales para clientes nuevos y las escribe con Claude a partir de sus notas de la primera reunión.", "punto_de_partida": "Las propuestas salían bien escritas pero ella siempre tenía que corregir lo mismo: faltaba la fecha de validez, el precio no decía si incluía IVA y a veces aparecía un servicio que no ofrece.", "pasos": ["Juntó cuatro propuestas viejas que había corregido y anotó al lado de cada una qué cambió.", "Usó el prompt \"Armar la checklist con Claude\" de la guía con esas cuatro correcciones. Claude le propuso nueve reglas; ella sacó dos que no salían de sus correcciones y reescribió una que no se podía contestar con sí o no.", "Probó la checklist con una propuesta vieja que tenía errores. Una regla (\"que quede claro el alcance\") salió como CUMPLE sin que lo estuviera, así que la cambió por \"cada servicio incluido aparece en la lista de servicios del estudio\".", "Creó un proyecto llamado Propuestas, pegó en las instrucciones la plantilla del kit con su checklist y subió la lista de servicios del estudio y sus honorarios como archivos del proyecto.", "Prendió la opción de skills en Settings → Capabilities y subió la skill verificacion-de-entregas del kit como ZIP, para usarla también fuera del proyecto.", "Desde entonces abre cada propuesta nueva dentro del proyecto. Lee la tabla de revisión, mira lo que quedó como NO SE PUEDE COMPROBAR (por ejemplo, la cantidad de empleados del cliente) y lo confirma antes de mandar.", "Cada vez que encuentra un error que la checklist no atrapó, lo agrega como regla nueva y anota de dónde salió."], "resultado": "Quedó un proyecto con su checklist de siete reglas, la lista de servicios como fuente y una revisión que le muestra, regla por regla, en qué se basó Claude. Ella sigue leyendo cada propuesta antes de mandarla, pero empieza por lo marcado."}, "si_falla": [{"sintoma": "La tabla dice que todo cumple, pero vos encontrás un error.", "solucion": "Casi siempre la regla es interpretable. Reescribila para que se conteste con sí o no mirando el trabajo, y exigí la cita: \"no marques CUMPLE sin copiar el fragmento que lo demuestra\". Si el error es nuevo, sumalo como regla."}, {"sintoma": "Las instrucciones del proyecto no se aplican: el chat no hace la revisión.", "solucion": "Fijate que el chat esté adentro del proyecto. Las instrucciones valen para los chats creados dentro de él, no para uno que abriste desde el inicio. Abrí el proyecto y empezá el chat desde ahí."}, {"sintoma": "Claude corrige, vuelve a revisar y cambia cosas que estaban bien.", "solucion": "Pedile que corrija solo lo que marcó NO CUMPLE y que haga como máximo dos vueltas. Si después de eso algo sigue fallando, que lo deje marcado en vez de reescribir todo."}, {"sintoma": "La revisión es más larga que el trabajo y no encuentra nada.", "solucion": "Puede que el modelo ya verifique solo o que la checklist tenga reglas que nunca fallan. Usá la variante corta del kit, que muestra solo lo que no cumplía, y sacá las reglas que no fallaron en un mes."}, {"sintoma": "Marca como cumplido un precio, una fecha o un dato que está mal.", "solucion": "Claude revisa contra lo que le diste: si el dato no está en tu material, no puede saber si es correcto. Subí la fuente al proyecto (lista de precios, calendario) o pedile que marque esos datos como NO SE PUEDE COMPROBAR y los revisás vos."}], "kit": [{"archivo": "verificacion-de-entregas/SKILL.md", "que_es": "Skill que revisa cualquier trabajo contra tu checklist regla por regla, con cita como evidencia, corrige solo lo que falla en hasta dos vueltas y te deja la lista de lo que tenés que mirar vos. Comprimí la carpeta en ZIP y subila en Customize → Skills.", "contenido": "---\nname: verificacion-de-entregas\ndescription: 'Revisa un trabajo contra la checklist de calidad regla por regla, con evidencia, y corrige lo que no cumple. Usala al pedir revisar o verificar una entrega, o con \"pasalo por la checklist\".'\n---\n\n# Verificación de entregas\n\nRevisás un trabajo contra una checklist que escribió el usuario. No inventás criterios: usás los suyos.\n\n## De dónde sale la checklist\n\n1. Si el usuario la pega en el mensaje, usá esa.\n2. Si no, buscala en las instrucciones o en los archivos del proyecto (un archivo que se llame checklist o parecido).\n3. Si no hay ninguna, no revises con criterios propios. Pedí la checklist o proponé armarla a partir de trabajos que el usuario ya corrigió.\n\n## Cómo revisás\n\nPara cada regla, en orden:\n\n1. Buscá en el trabajo la parte que la prueba.\n2. Marcá una de tres:\n   - CUMPLE: citá el fragmento o el dato exacto que lo demuestra.\n   - NO CUMPLE: citá dónde falla.\n   - NO SE PUEDE COMPROBAR: falta información para saberlo (un dato externo, un archivo que no tenés, un precio que no está). Decí qué faltaría.\n3. Nunca marques CUMPLE sin una cita. Si no encontrás qué citar, no cumple o no se puede comprobar.\n\nLos datos externos (precios, fechas, nombres, normas, cifras) se marcan NO SE PUEDE COMPROBAR salvo que estén en lo que te pasaron o los verifiques con búsqueda web, mostrando la fuente.\n\n## Cómo corregís\n\n- Corregí solo lo que marcaste NO CUMPLE. No reescribas lo que ya cumplía.\n- Después de corregir, revisá otra vez solo las reglas que fallaron.\n- Hacé como máximo dos rondas. Si algo sigue sin cumplir, dejalo marcado y explicá por qué no pudiste resolverlo.\n\n## Qué entregás\n\n1. La tabla de revisión final:\n\n| # | Regla | Resultado | Evidencia o motivo |\n|---|---|---|---|\n\n2. La versión corregida completa.\n3. Una lista corta de lo que quedó NO SE PUEDE COMPROBAR, para que el usuario lo mire antes de mandar.\n\n## Reglas\n\n- No agregues reglas a la checklist. Si ves un problema que la checklist no cubre, mencionálo aparte, en una línea, como sugerencia de regla nueva.\n- No cambies el tono ni el formato del trabajo salvo que una regla lo pida.\n- La revisión es una primera pasada. Cerrá con: \"Revisá vos lo marcado antes de enviarlo.\"\n"}, {"archivo": "plantilla-checklist-de-calidad.md", "que_es": "Plantilla para escribir tu checklist, con la diferencia entre una regla que sirve y una que no, y tres ejemplos listos para adaptar: presupuestos, posteos y respuestas a reclamos.", "contenido": "# Plantilla de checklist y tres ejemplos\n\n## Cómo se escribe una regla que sirve\n\nCada regla tiene que poder contestarse con sí o no mirando el trabajo, sin opinar.\n\n| No sirve | Sirve |\n|---|---|\n| Que esté claro | Cada párrafo tiene 4 líneas o menos |\n| Que sea profesional | No hay signos de exclamación ni emojis |\n| Que esté completo | Están los 5 datos: cliente, servicio, precio, plazo y forma de pago |\n| Que no tenga errores | Los montos de la tabla suman el total que figura abajo |\n\n## Plantilla (copiá y completá)\n\n```\nChecklist: [TIPO DE TRABAJO]\nÚltima actualización: [AAAA-MM-DD]\n\n1. [REGLA QUE SALE DE UNA CORRECCIÓN REAL]\n2. [REGLA]\n3. [REGLA]\n4. [REGLA]\n5. [REGLA]\n\nDe dónde salió cada regla (para no olvidarte):\n1. [TRABAJO O FECHA EN QUE LO CORREGISTE]\n2. ...\n```\n\n## Ejemplo 1: presupuesto de servicios\n\n```\nChecklist: presupuestos para clientes\n\n1. Figuran nombre del cliente, servicio, precio, plazo de entrega y forma de pago.\n2. El precio aclara la moneda y si incluye impuestos.\n3. Cada servicio de la tabla tiene su precio y los precios suman el total.\n4. La validez del presupuesto está escrita con una fecha, no con \"por un tiempo\".\n5. No promete nada que no esté en la lista de servicios.\n6. Hay un solo próximo paso, concreto, al final.\n7. Entra en una página.\n```\n\n## Ejemplo 2: publicación para redes\n\n```\nChecklist: posteos de Instagram\n\n1. La primera línea dice el beneficio o el problema, no el nombre del negocio.\n2. El texto tiene 120 palabras o menos.\n3. No hay signos de exclamación.\n4. Hay un solo llamado a la acción y dice qué hacer (por ejemplo, escribir una palabra por mensaje privado).\n5. Ningún precio, fecha o promoción que no esté en el material que pasé.\n6. Los hashtags son 5 o menos.\n```\n\n## Ejemplo 3: respuesta a un reclamo\n\n```\nChecklist: respuestas a reclamos\n\n1. La primera oración reconoce el problema concreto que contó el cliente, con sus palabras.\n2. No hay frases de manual como \"lamentamos las molestias ocasionadas\".\n3. Dice qué vamos a hacer y para cuándo, con fecha o plazo.\n4. No promete reintegros ni cambios que no estén en la política que pasé.\n5. Tiene 6 líneas o menos.\n6. Firma una persona con nombre, no \"el equipo\".\n```\n\n## Cuándo actualizarla\n\n- Cada vez que corregís algo que la checklist no atrapó, agregás una regla y anotás de dónde salió.\n- Si pasa de 10 reglas, separá en dos checklists por tipo de trabajo.\n- Si una regla nunca falla en un mes, preguntate si sigue haciendo falta.\n"}, {"archivo": "instrucciones-proyecto-con-verificacion.md", "que_es": "El texto para pegar en las instrucciones de un proyecto de Claude, con el cierre de verificación ya armado y una variante corta para modelos que ya verifican solos.", "contenido": "# Instrucciones de proyecto con verificación\n\nPara pegar en las instrucciones de un proyecto de Claude (en el proyecto, \"Set project instructions\"). Se aplican a todos los chats que abras dentro de ese proyecto.\n\n---\n\n## Copiá desde acá\n\nEste proyecto es para [TIPO DE TRABAJO] de [NEGOCIO].\n\nCómo trabajamos:\n1. Te paso el pedido y el material. Si falta algo para hacerlo bien, preguntame antes de empezar, en una sola tanda de preguntas.\n2. Hacés el trabajo.\n3. Antes de darme la versión final, lo revisás contra la checklist de abajo.\n\nChecklist:\n[PEGÁ TU CHECKLIST, UNA REGLA POR LÍNEA]\n\nCómo revisás:\n- Para cada regla escribí CUMPLE, NO CUMPLE o NO SE PUEDE COMPROBAR, con el fragmento del trabajo que lo demuestra o el motivo.\n- No marques CUMPLE sin citar el fragmento.\n- Si algo no cumple, corregilo y revisá de nuevo solo esas reglas. Como máximo dos vueltas.\n- Precios, fechas, nombres y cifras que no estén en lo que te pasé van como NO SE PUEDE COMPROBAR.\n- Si ves un problema que la checklist no cubre, decímelo en una línea al final como posible regla nueva. No la apliques por tu cuenta.\n\nQué me entregás:\n1. La tabla de revisión.\n2. La versión final completa.\n3. La lista de lo que tengo que mirar yo antes de mandarlo.\n\n---\n\n## Variante corta (si el modelo que usás ya verifica solo)\n\nSi notás que la revisión agrega mucho largo sin encontrar nada, cambiá \"Cómo revisás\" y \"Qué me entregás\" por esto:\n\nAntes de entregar, revisá el trabajo contra la checklist. Mostrame solo las reglas que no cumplían y qué cambiaste, y la versión final. Si una regla no se puede comprobar con lo que tenés, decímelo.\n"}], "verificada": "2026-11-08", "cat": "mas-jugo", "parte": "aprende"};</script>

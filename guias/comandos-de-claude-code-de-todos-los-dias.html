<script>var GUIA = {"slug": "comandos-de-claude-code-de-todos-los-dias", "t": "Los comandos de Claude Code que vas a usar todos los días", "d": "Los comandos con barra (/) más útiles, ordenados por el momento en que los necesitas: al arrancar, mientras trabajas, antes de terminar y cuando algo sale mal.", "tema": "Claude Code", "min": 8, "secciones": [{"h": "Cómo funcionan", "p": ["Un comando es una palabra que empieza con barra y va al principio del mensaje. Escribe / y aparece la lista de todo lo que tienes disponible; si sigues escribiendo, se filtra.", "No hace falta memorizarlos. Con estos de abajo cubres casi todo el día a día."]}, {"h": "Al empezar un proyecto", "lista": ["/init: revisa tu proyecto y te arma un CLAUDE.md inicial, el archivo con las reglas que Claude lee en cada sesión. Si ya existe, te sugiere mejoras.", "/memory: abre tus archivos CLAUDE.md para editarlos y te deja prender o apagar la memoria automática.", "/mcp: muestra los servidores MCP (conectores) y te deja iniciar sesión en los que lo piden.", "/permissions: armas reglas de qué puede hacer sin preguntarte, qué tiene que preguntarte y qué tiene prohibido.", "/model: cambias el modelo de Claude. Por defecto queda guardado como tu modelo para las sesiones nuevas; si lo quieres solo para esta sesión, en la lista aprieta s sobre el modelo."]}, {"h": "Mientras trabajas", "lista": ["/plan [tarea]: entra en modo plan, donde Claude investiga y te propone cómo hacerlo sin tocar tus archivos.", "/context: te muestra qué está ocupando la memoria de la conversación.", "/compact [instrucciones]: resume la charla para liberar espacio sin empezar de cero. Puedes decirle en qué enfocarse.", "/btw [pregunta]: una pregunta al costado que no se suma a la conversación principal.", "/usage: tu consumo y los límites de tu plan. /cost hace lo mismo."]}, {"h": "Antes de dar algo por terminado", "lista": ["/diff: te muestra todo lo que cambió en tus archivos, incluido lo que hizo Claude.", "/code-review: revisa los cambios buscando errores. Con --fix aplica lo que encuentra. /review es lo mismo.", "/security-review: busca problemas de seguridad en los cambios de tu rama actual. Necesita que tu proyecto use git y tenga un remoto llamado origin."]}, {"h": "Entre una tarea y otra", "lista": ["/clear: conversación nueva y vacía. Tu CLAUDE.md se sigue cargando. Úsalo al cambiar de tema.", "/resume: vuelves a una conversación anterior. Desde la terminal también puedes abrir con claude -c para seguir la última.", "/rename [nombre]: le pones nombre a la sesión para encontrarla después."]}, {"h": "Cuando algo sale mal", "lista": ["/rewind: vuelves el código y/o la conversación a un punto anterior. También se abre apretando Esc dos veces con el cuadro de mensaje vacío.", "/doctor: chequea tu instalación y configuración y te propone arreglos.", "/help: la ayuda y los comandos disponibles.", "/exit: sales de Claude Code."], "aviso": "/rewind deshace lo que Claude cambió con sus herramientas de edición, pero no lo que hizo un comando de terminal (como rm, mv o cp) y, en general, tampoco lo que editó un subagente. Para estar tranquilo, guarda tu trabajo con git antes de cambios grandes.", "prompts": [{"t": "Si no sabes qué comando usar", "c": "Quiero [LO QUE QUIERES HACER, POR EJEMPLO: VOLVER A COMO ESTABA ANTES DEL ÚLTIMO CAMBIO]. ¿Qué comando de Claude Code me sirve y cómo lo uso paso a paso?"}]}], "faq": [{"q": "Escribo un comando y no pasa nada", "a": "Tiene que ir al principio del mensaje. Si lo mandas mientras Claude está respondiendo, en general queda en espera y corre cuando termina. Algunos, como /usage o /status, se ejecutan al instante sin cortar la respuesta."}, {"q": "¿/clear me borra el proyecto?", "a": "No. Solo empieza una conversación nueva. Tus archivos quedan igual y puedes volver a la charla anterior con /resume."}, {"q": "¿/clear o /compact?", "a": "/clear si cambias de tarea. /compact si sigues con lo mismo pero la conversación se hizo muy larga."}], "fuentes": ["https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/checkpointing", "https://code.claude.com/docs/en/quickstart", "https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/skills", "https://code.claude.com/docs/en/errors"], "ejemplo": {"titulo": "Ejemplo resuelto: un día de trabajo de punta a punta con los comandos", "negocio": "Ejemplo inventado: un desarrollador junior freelance en Medellín, Colombia, que mantiene la landing de una clínica odontológica de dos consultorios. El proyecto usa git y está en GitHub.", "punto_de_partida": "Usa Claude Code todos los días pero escribe todo como mensaje común. Las charlas se le hacen eternas, no encuentra la de ayer y una vez perdió un cambio sin saber cómo volver.", "pasos": ["A la mañana entró a la carpeta y abrió con claude -c para seguir la charla de ayer. Corrió /usage para ver cuánto le quedaba del plan.", "Como el proyecto no tenía reglas escritas, corrió /init. Revisó el CLAUDE.md que armó, le sumó con /memory \"los precios de tratamientos no se tocan sin aviso de la clínica\" y lo guardó.", "La tarea del día era agregar una sección de preguntas frecuentes. Escribió /plan agregar una sección de preguntas frecuentes debajo de los servicios, leyó el plan y le pidió un cambio antes de aprobarlo.", "A mitad de camino tuvo una duda sobre una etiqueta de HTML. La preguntó con /btw para no mezclarla con la tarea.", "La charla se estaba alargando. Corrió /context, vio que la llenaban archivos que ya no usaba y corrió /compact quédate con la sección de preguntas frecuentes y los archivos que tocamos.", "Claude cambió un estilo que rompió el menú en el celular. Apretó Esc dos veces con el cuadro vacío, eligió el mensaje anterior al cambio y Restore code. El menú volvió a andar.", "Al terminar corrió /diff para ver todo lo que cambió, después /code-review y /security-review. Esta última anduvo porque el repo tiene el remoto origin.", "Con la skill cierre-de-sesion del kit dejó escrito qué hizo, qué faltaba y un mensaje de commit. Le puso nombre a la charla con /rename faq-clinica y salió con /exit.", "Para la siguiente tarea, que no tenía nada que ver, al otro día arrancó con /clear en vez de seguir en la misma charla."], "resultado": "Ahora tiene un CLAUDE.md con las reglas del proyecto, charlas con nombre que encuentra con /resume, sabe volver atrás con /rewind y revisa antes de subir con /diff, /code-review y /security-review. Lo que hace git (commits y push) lo sigue decidiendo él."}, "si_falla": [{"sintoma": "/security-review falla con un error que dice \"ambiguous argument\".", "solucion": "El comando compara tu rama con la rama principal de origin y no la encuentra. Fíjate que el proyecto tenga un remoto llamado origin (git remote -v) y, si lo tiene, corre git remote set-head origin --auto para que git sepa cuál es la rama principal. Después vuelve a correr /security-review."}, {"sintoma": "Usaste /rewind con Restore code y el archivo que borró Claude no volvió.", "solucion": "Si lo borró o movió con un comando de terminal (rm, mv, cp), rewind no lo registra. Recupéralo con git (por ejemplo, pídele a Claude que te muestre cómo restaurarlo desde el último commit) o desde tu copia de respaldo."}, {"sintoma": "/rewind muestra \"No files were restored\" en una sesión vieja.", "solucion": "Claude Code borra las copias de los archivos de una sesión unos 30 días después de la última. Para esa sesión ya no hay vuelta con rewind: usa git. Si quieres que las guarde más tiempo, configura cleanupPeriodDays en tu settings.json."}, {"sintoma": "Escribes el comando y Claude lo toma como un mensaje común.", "solucion": "El comando tiene que ser lo primero del mensaje, sin espacios ni texto antes. Escribe / y elígelo de la lista para no equivocarte en el nombre."}, {"sintoma": "claude -c abre otra charla, no la que esperabas.", "solucion": "claude -c sigue la charla más reciente de la carpeta donde estás parado. Entra primero a la carpeta del proyecto con cd. Si igual no aparece, usa /resume y búscala por nombre (por eso conviene ponerle nombre con /rename)."}], "kit": [{"archivo": "chuleta-comandos-claude-code.md", "que_es": "Hoja de referencia para imprimir o tener al lado: cada comando según el momento del día, con lo que quieres lograr en la primera columna.", "contenido": "# Chuleta de comandos de Claude Code (para tener al lado)\n\nLos comandos van al principio del mensaje. Escribe / y aparece la lista; sigue escribiendo para filtrar.\n\n## Arranco el día\n| Quiero... | Escribo |\n|---|---|\n| Seguir con la última charla de esta carpeta (desde la terminal) | claude -c |\n| Elegir una charla anterior | /resume |\n| Ver si está todo bien instalado | /doctor |\n| Ver cuánto llevo usado de mi plan | /usage |\n\n## Arranco un proyecto nuevo\n| Quiero... | Escribo |\n|---|---|\n| Que me arme el CLAUDE.md con las reglas del proyecto | /init |\n| Editar el CLAUDE.md o la memoria automática | /memory |\n| Ver y conectar servidores MCP | /mcp |\n| Decidir qué puede hacer sin preguntarme | /permissions |\n| Cambiar de modelo (queda como predeterminado; con la tecla s, solo para esta sesión) | /model |\n\n## Estoy trabajando\n| Quiero... | Escribo |\n|---|---|\n| Que primero piense un plan sin tocar archivos | /plan [la tarea] |\n| Ver qué está llenando la memoria de la charla | /context |\n| Resumir la charla para seguir con lo mismo | /compact [en qué enfocarse] |\n| Hacer una pregunta al costado, sin ensuciar la charla | /btw [pregunta] |\n| Cambiar cuánto puede hacer sin preguntarme | Shift+Tab |\n\n## Antes de dar algo por terminado\n| Quiero... | Escribo |\n|---|---|\n| Ver todo lo que cambió | /diff |\n| Que revise los cambios buscando errores | /code-review (con --fix aplica lo que encuentra) |\n| Que busque problemas de seguridad (necesita git y remoto origin) | /security-review |\n| Ponerle nombre a esta charla para encontrarla después | /rename [nombre] |\n\n## Cambio de tarea\n| Quiero... | Escribo |\n|---|---|\n| Empezar una charla nueva (el CLAUDE.md se sigue cargando) | /clear |\n| Volver a una charla anterior | /resume |\n\n## Algo salió mal\n| Quiero... | Escribo |\n|---|---|\n| Volver código y/o charla a un punto anterior | /rewind o Esc dos veces con el cuadro vacío |\n| Ver la ayuda | /help |\n| Contarle a Anthropic un problema | /feedback |\n| Salir | /exit |\n\nRecuerda: /rewind no deshace lo que cambió un comando de terminal (rm, mv, cp) ni, en general, lo que editó un subagente. Para eso, git.\n"}, {"archivo": "cierre-de-sesion/SKILL.md", "que_es": "Skill que cierra la sesión: resume qué cambió, qué quedó pendiente y qué revisar, y propone un mensaje de commit. Guárdala en ~/.claude/skills/cierre-de-sesion/SKILL.md y llámala con /cierre-de-sesion.", "contenido": "---\nname: cierre-de-sesion\ndescription: 'Cierra una sesión de Claude Code: resume qué cambió, qué quedó pendiente y qué revisar, y propone un mensaje de commit. Úsala con /cierre-de-sesion o al pedir cerrar o resumir la sesión antes de irse.'\ndisable-model-invocation: true\n---\n\n# Cierre de sesión\n\nVas a dejar la sesión ordenada para que mañana (o otra persona) pueda seguir sin preguntar nada. No modifiques archivos ni hagas commits: solo revisa y resume.\n\n## Pasos\n\n1. Mira qué cambió en la carpeta. Si el proyecto usa git, revisa los cambios sin confirmar (por ejemplo con git status y git diff). Si no usa git, repasa los archivos que editaste en esta sesión.\n2. Repasa la conversación: qué te pidió el usuario, qué hiciste y qué no llegaste a hacer.\n3. Busca cosas a medio hacer: archivos tocados pero sin terminar, pruebas que no corriste, dudas que quedaron sin respuesta.\n4. Escribe el resumen con el formato de abajo.\n\n## Formato\n\n```\nRESUMEN DE LA SESIÓN\n\nQué se hizo\n- [cambio] en [archivo]\n\nQué quedó pendiente\n- [tarea] (por qué quedó)\n\nQué conviene revisar antes de publicar\n- [riesgo o cosa a probar]\n\nMensaje de commit sugerido\n[una línea en español, en presente, por ejemplo: \"Actualiza horarios en la página de contacto\"]\n\nPara seguir mañana\n- Abre con: claude -c   (o /resume y elige esta sesión)\n- Nombre sugerido para la sesión: /rename [nombre-corto]\n```\n\n## Reglas\n\n- Si no hay cambios, dilo en una línea y no inventes.\n- Si ves algo que parece una clave o contraseña dentro de los cambios, avísalo arriba de todo y no la copies en el resumen.\n- Antes de terminar, recuérdale al usuario que corra /diff si quiere ver cada cambio, y /code-review si quiere una revisión antes de publicar.\n"}, {"archivo": "prompts-cuando-algo-sale-mal-claude-code.md", "que_es": "Cinco prompts listos para cuando Claude Code rompe algo, se pone lento, pide un permiso raro o no sabes qué comando usar.", "contenido": "# Prompts para cuando algo sale mal en Claude Code\n\nCopia el que te sirva, completa los corchetes y mándalo.\n\n## Rompió algo y no sé qué\nAlgo dejó de andar: [QUÉ DEJÓ DE ANDAR]. No cambies nada todavía. Dime qué archivos modificaste en esta sesión, qué cambiaste en cada uno y cuál crees que lo rompió. Después proponme cómo volver atrás solo esa parte.\n\n## Quiero volver atrás pero no sé si /rewind alcanza\nQuiero volver a como estaba [ANTES DE QUÉ]. Antes de que use /rewind, dime si alguno de esos cambios lo hiciste con un comando de terminal (rm, mv, cp, un script) o con un subagente, porque esos no los deshace /rewind. Si hay alguno, dime cómo revertirlo a mano o con git.\n\n## Se puso lento o se olvida de lo que hablamos\nHaz un resumen de lo que estamos haciendo: el objetivo, las decisiones que tomamos, los archivos que tocamos y lo que falta. Lo voy a usar para /compact o para empezar de nuevo con /clear.\n\n## Me pide permiso para algo que no entiendo\nMe estás pidiendo permiso para [PEGA LO QUE APARECE]. Explícame en palabras simples qué hace, qué puede romper y si hay una forma más segura de lograr lo mismo. No lo corras hasta que te diga.\n\n## No sé qué comando usar\nQuiero [LO QUE QUIERES HACER]. ¿Qué comando de Claude Code me sirve y cómo lo uso paso a paso? Si no hay comando, dime qué pedirte en palabras.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

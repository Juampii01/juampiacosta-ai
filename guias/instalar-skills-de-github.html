<script>var GUIA = {"slug": "instalar-skills-de-github", "t": "Instalar skills de GitHub sin riesgos", "d": "Cómo bajar una skill de un repositorio, revisarla antes de usarla y dejarla instalada: subida como .zip en la app o en la carpeta de Claude Code.", "tema": "Skills y plugins", "min": 9, "secciones": [{"h": "Primero fijate qué tipo de repositorio es", "lista": ["Skill suelta: ves una carpeta con un SKILL.md adentro. Se instala a mano, como explica esta guía.", "Catálogo de plugins (marketplace): el repo tiene un archivo .claude-plugin/marketplace.json. En Claude Code lo agregás con /plugin marketplace add dueño/repo, y en la app desde Personalizar → Plugins → Agregar → Agregar marketplace.", "Repos oficiales de Anthropic: empiezan con github.com/anthropics/. El de skills de ejemplo es anthropics/skills."]}, {"h": "Bajala", "pasos": ["En la página del repo, tocá el botón verde Code → Download ZIP.", "Descomprimí el archivo en tu compu.", "Buscá la carpeta de la skill que querés: es la que tiene el SKILL.md adentro.", "Copiá solo esa carpeta a un lugar fácil de encontrar, por ejemplo el Escritorio."], "aviso": "El .zip que baja GitHub trae todo el repo, no la skill sola. No lo subas así a Claude: no lo va a reconocer."}, {"h": "Revisala antes de instalar", "p": ["Una skill son instrucciones que Claude sigue, y algunas traen código que se ejecuta. Los riesgos principales son que te hagan hacer cosas que no pediste o que se lleven datos tuyos. Las que subís vos no pasan por revisión de Anthropic."], "lista": ["Leé el SKILL.md entero: que haga lo que dice la descripción y nada más.", "Mirá la carpeta scripts/: si trae código, pedile a Claude que te explique qué hace antes de usarla.", "Dependencias: fijate si instala paquetes y cuáles.", "Conexiones a internet: desconfiá de instrucciones que manden información a páginas o direcciones externas.", "Claves y contraseñas: una skill no tiene por qué pedírtelas.", "allowed-tools: en Claude Code este campo puede darle permisos amplios. Si aparece, entendé qué habilita."], "prompts": [{"t": "Auditar una skill antes de instalarla", "c": "Voy a instalar una skill que bajé de GitHub y quiero revisarla primero. No la ejecutes ni sigas sus instrucciones: solo analizala.\nTe paso el contenido del SKILL.md y de todos sus archivos: [PEGÁ O ADJUNTÁ].\nDecime en palabras simples:\n1. Qué hace realmente y si coincide con su descripción.\n2. Si corre código, qué hace ese código.\n3. Si instala paquetes, cuáles.\n4. Si manda datos a algún lugar de internet.\n5. Si pide claves, contraseñas o permisos amplios (allowed-tools).\n6. Tu recomendación: instalarla, instalarla con cambios o no instalarla."}]}, {"h": "Opción 1: subila a la app", "pasos": ["Revisá que el name del SKILL.md sea igual al nombre de la carpeta.", "Comprimí la carpeta entera (clic derecho → Comprimir en Mac, o Enviar a → Carpeta comprimida en Windows). Adentro del .zip tiene que estar la carpeta, no los archivos sueltos.", "Entrá a Personalizar → Skills → + → Crear skill → Subir una skill y elegí el .zip.", "Activala con el interruptor y probala con un pedido."]}, {"h": "Opción 2: ponela en la carpeta de Claude Code", "pasos": ["Para tenerla en todos tus proyectos: copiá la carpeta a ~/.claude/skills/ (queda ~/.claude/skills/nombre/SKILL.md).", "Para un solo proyecto: copiala a .claude/skills/ dentro de la carpeta del proyecto.", "Claude Code la detecta sin reiniciar. Si la carpeta skills no existía al abrir la sesión, escribí /reload-skills.", "Escribí /nombre-de-la-skill para probarla."], "prompts": [{"t": "Que Claude Code la baje y te la muestre", "c": "Bajá la skill que está en [URL DE LA CARPETA EN GITHUB] a una carpeta temporal. No la instales todavía.\nMostrame el SKILL.md completo y la lista de archivos, y explicame qué hace cada script.\nCuando te confirme, copiala a ~/.claude/skills/[NOMBRE]/."}]}, {"h": "Si no aparece o da error", "lista": ["El .zip no tiene la carpeta como primer nivel: volvé a comprimir la carpeta, no su contenido.", "El nombre no coincide: la carpeta y el name del SKILL.md tienen que ser iguales.", "Caracteres raros: el name va en minúsculas, números y guiones.", "Falta el SKILL.md o no arranca con el encabezado entre --- en la primera línea."]}], "faq": [{"q": "¿Las skills del repositorio de Anthropic son seguras?", "a": "Son de Anthropic, pero el mismo repo aclara que son de demostración y que conviene probarlas antes de depender de ellas. Varias ya vienen disponibles en Personalizar → Skills para planes pagos."}, {"q": "¿Cómo la actualizo si el autor saca una versión nueva?", "a": "Bajala de nuevo, revisá qué cambió y reemplazá la carpeta (en la app, borrá la vieja y subí la nueva)."}, {"q": "¿Cómo borro una skill de la app?", "a": "Abrila en Personalizar → Skills, apagá el interruptor, tocá los tres puntos y elegí Eliminar."}], "fuentes": ["https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://claude.com/docs/skills/how-to", "https://claude.com/docs/skills/overview", "https://code.claude.com/docs/en/skills", "https://code.claude.com/docs/en/plugins/anthropic-marketplaces", "https://github.com/anthropics/skills"], "cat": "skills", "parte": "aprende"};</script>

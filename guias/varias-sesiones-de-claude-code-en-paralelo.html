<script>var GUIA = {"slug": "varias-sesiones-de-claude-code-en-paralelo", "t": "Varias sesiones de Claude Code en paralelo, sin pisarse", "d": "Cómo trabajar con dos o más Claude a la vez usando worktrees: cada sesión con su carpeta y su rama, el patrón escritor y revisor, y cómo limpiar al terminar.", "tema": "Claude Code", "min": 9, "ficha": [["Qué es", "Una copia de trabajo de tu proyecto por sesión, con su propia rama, que comparte el historial de git."], ["Para quién", "Quien ya maneja una sesión con soltura y quiere avanzar en dos tareas a la vez."], ["Necesitás", "Un proyecto con git y Claude Code."], ["Ojo", "Cada sesión usa tu plan. Y vos tenés que revisar todo lo que salga."]], "fichaNombre": "Worktrees", "secciones": [{"h": "Por qué no alcanza con abrir dos terminales", "p": ["Si dos sesiones trabajan en la misma carpeta, los cambios de una pisan los de la otra. Un worktree es otra carpeta con sus archivos y su rama, que comparte el mismo historial y el mismo remoto. Así una sesión hace una función nueva mientras otra arregla un error.", "Es el primer consejo de la lista de Boris. Pero en los mismos hilos y en Hacker News aparece el matiz: el límite pasa a ser tu tiempo para revisar, no la máquina. Arrancá con dos."]}, {"h": "Arrancá con --worktree", "pasos": ["Si nunca usaste Claude Code en esa carpeta, corré claude una vez ahí y aceptá el aviso de confianza.", "En una terminal: claude --worktree feature-auth", "En otra terminal: claude --worktree arreglo-login", "Cada una queda en .claude/worktrees/<nombre>/ y en una rama nueva llamada worktree-<nombre>.", "Sumá .claude/worktrees/ a tu .gitignore para que no aparezca como archivos sueltos.", "Pedile a cada sesión que instale las dependencias: un worktree es una copia limpia."], "p": ["Si no le das nombre, Claude Code inventa uno. Si ya estás en una sesión, también podés pedirle \"trabajá en un worktree\"."]}, {"h": "Llevá tus archivos secretos con .worktreeinclude", "p": ["Los archivos que están en el .gitignore, como .env, no viajan a la copia nueva. Creá un archivo .worktreeinclude en la raíz del proyecto con la misma sintaxis del .gitignore. Solo se copian los que coinciden y además están ignorados por git."], "prompts": [{"t": ".worktreeinclude", "c": ".env\n.env.local\nconfig/secrets.json"}]}, {"h": "El patrón más útil: escritor y revisor", "p": ["Más que ir rápido, varias sesiones sirven para revisar mejor. Una sesión nueva no está sesgada por el código que acaba de escribir. Es el ejemplo que da la documentación oficial."], "pasos": ["Sesión A construye la tarea.", "Sesión B, con contexto limpio, revisa lo que hizo A.", "Le pegás a A lo que encontró B y A lo corrige."], "prompts": [{"t": "Sesión A (escribe)", "c": "Implementá [LA TAREA] siguiendo [PLAN.md]. Corré las pruebas y mostrame la salida."}, {"t": "Sesión B (revisa)", "c": "Revisá la implementación de [LA TAREA] en @[RUTA DEL ARCHIVO]. Buscá casos raros, errores de lógica y diferencias con cómo está hecho el resto del proyecto. Reportá solo lo que afecta que funcione."}, {"t": "De vuelta en A", "c": "Esta es la revisión que hizo otra sesión: [PEGÁ LA REVISIÓN]. Corregí lo que corresponda y explicame lo que decidas no cambiar."}]}, {"h": "Al salir: qué pasa con tu trabajo", "lista": ["Sin cambios: si la sesión no tenía nombre, Claude Code borra el worktree y su rama solo. Si tenía nombre, te pregunta.", "Con cambios: te pregunta si lo guardás o lo borrás. Si lo borrás, se va todo lo que había adentro.", "Para volver a uno que guardaste: el comando claude --worktree <nombre> --resume que Claude Code te muestra al salir.", "Desde qué rama arranca: por defecto, la rama principal del remoto. Si querés que arranque desde lo que tenés ahora, en settings poné worktree.baseRef en \"head\"."], "aviso": "Antes de borrar un worktree, hacé commit y push de lo que quieras conservar. Borrar elimina la carpeta y la rama."}, {"h": "A mano con git, en la app o con subagentes", "lista": ["Con git, en una rama nueva: git worktree add ../proyecto-feature-a -b feature-a", "Con git, desde una rama que ya existe: git worktree add ../proyecto-bugfix nombre-de-la-rama", "Ver los que tenés: git worktree list", "Borrar uno: git worktree remove ../proyecto-feature-a", "En la app de escritorio: tildá la opción worktree al empezar una sesión.", "Subagentes que editan en paralelo: agregá isolation: worktree en el encabezado del subagente, o pedile a Claude que use worktrees para sus agentes."]}], "faq": [{"q": "¿Necesito saber mucho de git?", "a": "Lo básico: qué es una rama, un commit y un push. Claude Code crea y limpia los worktrees por vos. Si arrancás de cero, mirá primero la guía de git de esta biblioteca."}, {"q": "¿Las sesiones se enteran de lo que hace la otra?", "a": "No por defecto: cada una tiene su conversación. Vos pasás la información, como en el patrón escritor y revisor. La documentación también describe formas de que se manden mensajes, si más adelante lo necesitás."}, {"q": "¿Cuántas sesiones conviene tener?", "a": "Las que puedas revisar. En los hilos, la queja más común no es la compu sino quedarse con un montón de cambios sin mirar. Empezá con dos y sumá cuando las dos te sobren."}], "fuentes": ["https://code.claude.com/docs/en/worktrees", "https://code.claude.com/docs/en/best-practices", "https://support.claude.com/en/articles/14554000-claude-code-power-user-tips", "https://git-scm.com/docs/git-worktree", "https://www.reddit.com/r/ClaudeAI/comments/1qspcip/10_claude_code_tips_from_boris_the_creator_of/", "https://news.ycombinator.com/item?id=44362244"], "cat": "claude-code", "parte": "construi"};</script>

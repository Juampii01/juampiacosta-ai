<script>var GUIA = {"slug": "varias-sesiones-de-claude-code-en-paralelo", "t": "Varias sesiones de Claude Code en paralelo, sin pisarse", "d": "Cómo trabajar con dos o más Claude a la vez usando worktrees: cada sesión con su carpeta y su rama, el patrón escritor y revisor, y cómo limpiar al terminar.", "tema": "Claude Code", "min": 9, "ficha": [["Qué es", "Una copia de trabajo de tu proyecto por sesión, con su propia rama, que comparte el historial de git."], ["Para quién", "Quien ya maneja una sesión con soltura y quiere avanzar en dos tareas a la vez."], ["Necesitás", "Un proyecto con git y Claude Code."], ["Ojo", "Cada sesión usa tu plan. Y vos tenés que revisar todo lo que salga."]], "fichaNombre": "Worktrees", "secciones": [{"h": "Por qué no alcanza con abrir dos terminales", "p": ["Si dos sesiones trabajan en la misma carpeta, los cambios de una pisan los de la otra. Un worktree es otra carpeta con sus archivos y su rama, que comparte el mismo historial y el mismo remoto. Así una sesión hace una función nueva mientras otra arregla un error.", "Es el primer consejo de la lista de Boris. Pero en los mismos hilos y en Hacker News aparece el matiz: el límite pasa a ser tu tiempo para revisar, no la máquina. Arrancá con dos."]}, {"h": "Arrancá con --worktree", "pasos": ["Si nunca usaste Claude Code en esa carpeta, corré claude una vez ahí y aceptá el aviso de confianza.", "En una terminal: claude --worktree feature-auth", "En otra terminal: claude --worktree arreglo-login", "Cada una queda en .claude/worktrees/<nombre>/ y en una rama nueva llamada worktree-<nombre>.", "Sumá .claude/worktrees/ a tu .gitignore para que no aparezca como archivos sueltos.", "Pedile a cada sesión que instale las dependencias: un worktree es una copia limpia."], "p": ["Si no le das nombre, Claude Code inventa uno. Si ya estás en una sesión, también podés pedirle \"trabajá en un worktree\"."]}, {"h": "Llevá tus archivos secretos con .worktreeinclude", "p": ["Los archivos que están en el .gitignore, como .env, no viajan a la copia nueva. Creá un archivo .worktreeinclude en la raíz del proyecto con la misma sintaxis del .gitignore. Solo se copian los que coinciden y además están ignorados por git."], "prompts": [{"t": ".worktreeinclude", "c": ".env\n.env.local\nconfig/secrets.json"}]}, {"h": "El patrón más útil: escritor y revisor", "p": ["Más que ir rápido, varias sesiones sirven para revisar mejor. Una sesión nueva no está sesgada por el código que acaba de escribir. Es el ejemplo que da la documentación oficial."], "pasos": ["Sesión A construye la tarea.", "Sesión B, con contexto limpio, revisa lo que hizo A.", "Le pegás a A lo que encontró B y A lo corrige."], "prompts": [{"t": "Sesión A (escribe)", "c": "Implementá [LA TAREA] siguiendo [PLAN.md]. Corré las pruebas y mostrame la salida."}, {"t": "Sesión B (revisa)", "c": "Revisá la implementación de [LA TAREA] en @[RUTA DEL ARCHIVO]. Buscá casos raros, errores de lógica y diferencias con cómo está hecho el resto del proyecto. Reportá solo lo que afecta que funcione."}, {"t": "De vuelta en A", "c": "Esta es la revisión que hizo otra sesión: [PEGÁ LA REVISIÓN]. Corregí lo que corresponda y explicame lo que decidas no cambiar."}]}, {"h": "Al salir: qué pasa con tu trabajo", "lista": ["Sin cambios: si la sesión no tenía nombre, Claude Code borra el worktree y su rama solo. Si tenía nombre, te pregunta.", "Con cambios: te pregunta si lo guardás o lo borrás. Si lo borrás, se va todo lo que había adentro.", "Para volver a uno que guardaste: el comando claude --worktree <nombre> --resume que Claude Code te muestra al salir.", "Desde qué rama arranca: por defecto, la rama principal del remoto. Si querés que arranque desde lo que tenés ahora, en settings poné worktree.baseRef en \"head\"."], "aviso": "Antes de borrar un worktree, hacé commit y push de lo que quieras conservar. Borrar elimina la carpeta y la rama."}, {"h": "A mano con git, en la app o con subagentes", "lista": ["Con git, en una rama nueva: git worktree add ../proyecto-feature-a -b feature-a", "Con git, desde una rama que ya existe: git worktree add ../proyecto-bugfix nombre-de-la-rama", "Ver los que tenés: git worktree list", "Borrar uno: git worktree remove ../proyecto-feature-a", "En la app de escritorio, en un proyecto con git: antes de empezar la sesión prendé el botón Worktree en la fila debajo del cuadro de mensaje. En el diseño anterior de la app es una casilla worktree al lado del nombre de la rama.", "Subagentes que editan en paralelo: agregá isolation: worktree en el encabezado del subagente, o pedile a Claude que use worktrees para sus agentes."]}], "faq": [{"q": "¿Necesito saber mucho de git?", "a": "Lo básico: qué es una rama, un commit y un push. Claude Code crea y limpia los worktrees por vos. Si arrancás de cero, mirá primero la guía de git de esta biblioteca."}, {"q": "¿Las sesiones se enteran de lo que hace la otra?", "a": "No por defecto: cada una tiene su conversación. Vos pasás la información, como en el patrón escritor y revisor. La documentación también describe formas de que se manden mensajes, si más adelante lo necesitás."}, {"q": "¿Cuántas sesiones conviene tener?", "a": "Las que puedas revisar. En los hilos, la queja más común no es la compu sino quedarse con un montón de cambios sin mirar. Empezá con dos y sumá cuando las dos te sobren."}], "fuentes": ["https://code.claude.com/docs/en/worktrees", "https://code.claude.com/docs/en/best-practices", "https://support.claude.com/en/articles/14554000-claude-code-power-user-tips", "https://git-scm.com/docs/git-worktree", "https://www.reddit.com/r/ClaudeAI/comments/1qspcip/10_claude_code_tips_from_boris_the_creator_of/", "https://news.ycombinator.com/item?id=44362244", "https://code.claude.com/docs/en/desktop", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/cross-session-messaging"], "ejemplo": {"titulo": "Ejemplo resuelto: dos sesiones para la tienda online de una ferretería", "negocio": "Ejemplo inventado: un desarrollador freelance de Rosario que mantiene la tienda online de una ferretería de barrio (catálogo, carrito y panel de pedidos), solo, con el proyecto en GitHub.", "punto_de_partida": "El dueño le pidió para la semana un formulario de envío a domicilio, y además hay un error en el login del panel que lo deja afuera cada tanto. Hasta ahora hacía todo en una sola sesión y una tarea esperaba a la otra.", "pasos": ["En la carpeta del proyecto corrió claude una vez y aceptó el aviso de confianza. Sumó la línea .claude/worktrees/ al .gitignore e hizo commit.", "Creó el archivo .worktreeinclude con .env y .env.local, que tienen las claves de prueba de la pasarela de pago y no están en git.", "Terminal 1: claude --worktree envio-domicilio. Primer pedido: \"Instalá las dependencias, corré las pruebas y mostrame la salida\". Después le pegó el pedido de la Sesión A de la guía con la tarea del formulario y el archivo PLAN-envio.md que había escrito antes.", "Terminal 2: claude --worktree arreglo-login. Le pidió reproducir el error con una prueba que falle, arreglarlo y volver a correr la prueba. Le aclaró que no tocara nada del carrito.", "Cuando la Sesión A terminó, abrió una tercera terminal en la carpeta principal y le pidió la revisión con el prompt de la Sesión B, apuntando a la rama worktree-envio-domicilio. Con el kit, la invocó como /revisor-de-sesion worktree-envio-domicilio PLAN-envio.md.", "Le pegó la revisión a la Sesión A con el prompt \"De vuelta en A\". A corrigió dos casos (código postal vacío y dirección con caracteres especiales) y explicó por qué no cambiaba un nombre de variable.", "En cada sesión pidió commit y push de la rama y abrió los pull requests desde GitHub. Al salir, eligió conservar los worktrees hasta que el dueño probara en el entorno de prueba.", "Con los pull requests mergeados, corrió git worktree list y borró los dos con git worktree remove."], "resultado": "Las dos tareas avanzaron a la vez sin pisarse archivos, cada una en su rama. El formulario pasó por una revisión de una sesión que no lo había escrito antes de llegar al dueño, y la carpeta principal quedó limpia al final."}, "si_falla": [{"sintoma": "claude --worktree se cierra enseguida con un error que pide aceptar la confianza de la carpeta.", "solucion": "Es la primera vez que usás Claude Code en esa carpeta. Corré claude solo, aceptá el aviso de confianza, salí y volvé a correr claude --worktree <nombre>."}, {"sintoma": "En el worktree la app no arranca: faltan variables de entorno o dice que no encuentra dependencias.", "solucion": "Un worktree es una copia limpia: no trae node_modules ni los archivos ignorados. Pedile a la sesión que instale dependencias y creá un .worktreeinclude en la raíz con .env y los demás archivos ignorados que necesites. Solo se copian los que coinciden con el patrón y además están en el .gitignore, y solo en worktrees nuevos."}, {"sintoma": "El worktree arrancó sin los cambios que tenías en tu rama actual.", "solucion": "Por defecto arranca desde la rama principal del remoto. Si querés partir de lo que tenés ahora (incluidos commits sin subir), poné en tu settings.json {\"worktree\": {\"baseRef\": \"head\"}}. Para partir de otra rama que ya existe, crealo a mano con git worktree add ../carpeta nombre-de-la-rama."}, {"sintoma": "git worktree remove se niega a borrar el worktree porque está bloqueado (locked) o tiene cambios.", "solucion": "Primero confirmá que no queda nada que quieras conservar. Si está bloqueado, corré git worktree unlock <ruta> y después git worktree remove <ruta>. Si tiene cambios sin commit que querés tirar, agregá --force."}, {"sintoma": "Los archivos grandes (imágenes, videos) aparecen como archivos de texto chiquitos en el worktree.", "solucion": "Pasa cuando usás Git LFS configurado con git lfs install --local: Claude Code no ejecuta esos filtros al crear el worktree. Entrá al worktree y corré git lfs pull para bajar los archivos reales."}], "kit": [{"archivo": "revisor-de-sesion/SKILL.md", "que_es": "Skill para la sesión que revisa: lee el diff de otra sesión, chequea el plan y devuelve un reporte listo para pegarle a la que escribió. Guardala en .claude/skills/revisor-de-sesion/ y llamala con /revisor-de-sesion [rama] [plan].", "contenido": "---\nname: revisor-de-sesion\ndescription: 'Revisa con ojos limpios lo que hizo otra sesión de Claude Code (otro worktree, rama o diff) antes de mergear, y reporta solo lo que afecta que funcione. Usala al pedir revisar trabajo de otra sesión.'\ndisable-model-invocation: true\n---\n\n# Revisor de sesión\n\nSos la sesión B del patrón escritor y revisor. Otra sesión (A) escribió el código. Vos no lo escribiste y no tenés que defenderlo.\n\n## Qué te pasan\n\n- $ARGUMENTS: la rama, la carpeta del worktree o los archivos a revisar, y si hay, el plan (por ejemplo PLAN.md).\n\n## Cómo revisás\n\n1. Mirá qué cambió respecto de la rama base: `git diff main...HEAD --stat` y después el diff de cada archivo. Si te pasaron otra rama base, usá esa.\n2. Leé el plan o la descripción de la tarea, si existe. Anotá cada requisito.\n3. Para cada requisito, buscá en el diff dónde se cumple. Si no lo encontrás, es un hallazgo.\n4. Buscá casos raros: datos vacíos, valores repetidos, usuario sin sesión, errores de red, fechas y zonas horarias, montos con decimales.\n5. Compará con cómo está hecho el resto del proyecto: nombres, manejo de errores, estructura de carpetas.\n6. Si el proyecto tiene pruebas, corré solo las que tocan los archivos cambiados y pegá la salida.\n\n## Qué NO hacés\n\n- No edites archivos. Esta sesión solo lee y reporta.\n- No propongas refactors de gusto ni cambios de estilo que no rompen nada.\n- No inventes problemas para llenar la lista. Si está bien, decilo.\n\n## Formato del reporte\n\nDevolvé exactamente esto, listo para pegarle a la sesión A:\n\n```\nREVISIÓN DE [RAMA O TAREA]\n\nBloqueantes (rompen algo o no cumplen el plan):\n1. [archivo:línea] Qué pasa. Cómo reproducirlo. Qué esperarías.\n\nPara mirar (riesgo real, no urgente):\n1. [archivo:línea] Qué pasa y por qué importa.\n\nPruebas que corrí:\n- [comando] -> [resultado]\n\nVeredicto: LISTO PARA MERGEAR / CORREGIR ANTES\n```\n\nSi no hay bloqueantes, la sección dice \"Ninguno\".\n"}, {"archivo": "checklist-sesiones-paralelas-worktrees.md", "que_es": "Checklist de antes, durante y después de trabajar con varias sesiones, para no perder trabajo al borrar un worktree.", "contenido": "# Checklist: varias sesiones en paralelo sin perder trabajo\n\nImprimila o dejala abierta al lado de la terminal.\n\n## Antes de abrir la segunda sesión\n\n- [ ] El proyecto está en git y tiene al menos un commit.\n- [ ] Corriste `claude` una vez en la carpeta y aceptaste el aviso de confianza.\n- [ ] `.claude/worktrees/` está en el `.gitignore`.\n- [ ] Existe `.worktreeinclude` con los archivos ignorados que cada copia necesita (por ejemplo `.env`).\n- [ ] Sabés desde dónde va a arrancar cada worktree: por defecto, la rama principal del remoto. Si necesitás tus commits sin subir, `worktree.baseRef` en `\"head\"`.\n- [ ] Cada tarea toca archivos distintos. Si las dos tocan el mismo archivo, hacelas en fila, no en paralelo.\n\n## Al arrancar cada sesión\n\n- [ ] Nombre claro: `claude --worktree <tarea-corta>` (por ejemplo `envio-domicilio`, `arreglo-login`).\n- [ ] Primer pedido: instalar dependencias y correr las pruebas para confirmar que la copia arranca sana.\n- [ ] Le dijiste qué archivos puede tocar y cuáles no.\n\n## Mientras trabajan\n\n- [ ] No más sesiones de las que podés revisar hoy.\n- [ ] Cada sesión hace commits chicos con mensajes claros.\n- [ ] La revisión la hace una sesión nueva, no la misma que escribió.\n\n## Al terminar\n\n- [ ] Revisaste el diff de la rama (`git diff main...worktree-<nombre>`).\n- [ ] Commit y push de lo que querés conservar, antes de salir.\n- [ ] Al salir, si te pregunta, elegiste conservar o borrar a conciencia. Borrar elimina carpeta y rama.\n- [ ] Si conservaste uno, anotaste el comando `claude --worktree <nombre> --resume` que te mostró.\n- [ ] Una vez por semana: `git worktree list` y borrar con `git worktree remove <ruta>` los que ya se mergearon.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

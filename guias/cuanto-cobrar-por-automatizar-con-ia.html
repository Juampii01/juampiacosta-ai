<script>var GUIA = {"slug": "cuanto-cobrar-por-automatizar-con-ia", "t": "Cuánto cobrar por automatizar con IA", "d": "Cómo calcular un precio de implementación y un mensual que se sostengan, a partir de tus horas y del valor que le genera al cliente. Con fórmulas, no con cifras mágicas.", "tema": "El sistema para vender IA", "min": 10, "fichaNombre": "Calculadora de precio", "ficha": [["Qué es", "Un método para ponerle precio a una automatización: implementación más un mensual."], ["Necesitas", "Tu costo por hora, una estimación honesta de horas y datos del cliente."], ["Qué no hace", "No te dice cuánto cobra el mercado: eso depende de tu país, tu rubro y tu experiencia."]], "secciones": [{"h": "Dos partes: implementación y mensual", "p": ["Una automatización no se termina cuando la entregas. Las apps cambian, se cortan conexiones y el cliente pide ajustes. Por eso el esquema más sano tiene dos partes:", "Implementación: el trabajo de diagnosticar, armar, probar y entregar. Se cobra una vez. Mensual: mantenimiento, soporte y cambios chicos. Se cobra todos los meses mientras siga funcionando."]}, {"h": "Piso: lo que te cuesta a ti", "p": ["Primero calcula el mínimo por debajo del cual pierdes dinero."], "lista": ["Implementación mínima: horas estimadas × tu costo por hora × un margen por imprevistos (por ejemplo, 1,3 si sumas 30% de colchón).", "Mensual mínimo: horas de mantenimiento por mes × tu costo por hora + costos de herramientas que pagas tú.", "Tu costo por hora: lo que necesitas ganar por mes dividido por las horas que realmente puedes facturar (no las que trabajas)."], "aviso": "Los costos de herramientas cambian según el uso. Zapier cuenta tareas (solo las acciones que se completan; los triggers y los filtros no cuentan) y, al llegar al límite del plan, se cobran tareas extra o las corridas nuevas quedan en espera hasta el ciclo siguiente. Make cobra en créditos, y sus módulos de IA con el proveedor de Make suman el consumo de tokens. La API de Claude se factura aparte del plan de chat: Max, Ultra y Team traen un crédito mensual de API que vence cada mes y, si se termina y no hay otros créditos, las llamadas se cortan hasta el mes siguiente. En lo posible, que esas cuentas estén a nombre del cliente y las pague él."}, {"h": "Techo: lo que vale para el cliente", "p": ["El cliente no compra tus horas: compra tiempo libre, menos errores o más ventas. Estímalo con él, con sus números:"], "lista": ["Valor mensual estimado: horas que se ahorran por mes × lo que le cuesta esa hora al cliente.", "Valor extra: si la automatización evita errores o recupera ventas, súmalo solo si lo pueden medir.", "Ejemplo (los números son inventados para mostrar la cuenta): si la automatización le ahorra 20 horas por mes a una persona cuya hora le cuesta 10 unidades, el valor es 200 unidades por mes. Tu mensual tiene que quedar claramente por debajo de eso para que al cliente le convenga."]}, {"h": "Dónde ponerte entre el piso y el techo", "lista": ["Cerca del piso: tus primeros clientes, cuando todavía estás armando casos para mostrar.", "Más arriba: cuando ya tienes casos, el proceso es crítico para el cliente o el ahorro es grande y medible.", "Si el piso queda por encima del techo: no lo vendas así. Achica el alcance o busca otra tarea con más valor.", "Cobrar por resultado: tentador, pero solo si el resultado se mide sin discusión y no depende de cosas que no controlas."]}, {"h": "Arma la propuesta con Claude", "prompts": [{"t": "Calcular precio y armar la propuesta", "c": "Estoy por cotizar una automatización con IA para un cliente.\nCliente: [RUBRO, TAMAÑO, PAÍS].\nProblema: [QUÉ TAREA LES CUESTA Y CUÁNTO TIEMPO, SEGÚN ELLOS].\nSolución que propongo: [DESCRIPCIÓN].\nMi estimación de horas de implementación: [HORAS].\nHoras de mantenimiento por mes: [HORAS].\nMi costo por hora: [NÚMERO Y MONEDA].\nCosto por hora del cliente para esa tarea: [NÚMERO O \"no sé\"].\n\n1. Calcula el piso de implementación y de mensual, con un 30% de colchón en horas, mostrando la cuenta.\n2. Calcula el valor mensual estimado para el cliente, mostrando la cuenta. Si falta un dato, dime qué preguntarle.\n3. Propón un rango de precio para cada parte y explica por qué.\n4. Arma una propuesta de una página: problema, solución, qué incluye, qué no incluye, plazos, precio de implementación, mensual y qué pasa si quiere cancelar.\nNo inventes resultados ni prometas ahorros que no salgan de estos datos."}]}], "faq": [{"q": "¿Pongo precio por hora o precio cerrado?", "a": "Para la implementación, precio cerrado con un alcance bien escrito. Si cobras por hora, el cliente siente que te paga por tardar."}, {"q": "¿Qué incluye el mensual?", "a": "Escríbelo en la propuesta: por ejemplo, revisión de que todo funcione, arreglo de fallas y una cantidad de cambios chicos por mes. Lo que sale de ahí se cotiza aparte."}, {"q": "¿Y si el cliente dice que es caro?", "a": "Vuelve a la cuenta del valor con sus números. Si aun así no cierra, achica el alcance antes de bajar el precio."}], "fuentes": ["https://help.zapier.com/hc/en-us/articles/8496196837261-Tasks-in-Zapier", "https://help.make.com/credits-and-operations", "https://support.claude.com/en/articles/9876003", "https://help.zapier.com/hc/en-us/articles/41222634808077-LLM-Content-How-Task-Usage-Is-Measured-in-Zapier", "https://help.make.com/how-features-use-credits", "https://support.claude.com/en/articles/17154008"], "ejemplo": {"titulo": "Ejemplo resuelto: cotizar la carga de pedidos de una distribuidora", "negocio": "Ejemplo inventado: una distribuidora de productos de limpieza en Barranquilla, Colombia, con el dueño, dos vendedores en la calle y una persona en la oficina que pasa los pedidos de WhatsApp a una planilla. El cotizador es un freelancer que arma automatizaciones con Make y Claude.", "punto_de_partida": "El dueño quiere que los pedidos que llegan por WhatsApp se carguen solos en la planilla. Pregunta cuánto sale y el freelancer no tiene idea de qué número decir.", "pasos": ["En la llamada usó las preguntas del kit. La persona de la oficina no sabía cuánto tardaba por pedido, así que acordaron que lo cronometrara durante una semana. El dueño dio su costo por hora como un rango.", "Completó la calculadora con sus propios datos: lo que necesita ganar por mes, sus horas facturables reales y las horas que le iba a llevar armar y probar el escenario. Usó el colchón de 1,3 de la guía.", "Decidió que Make y el plan de Claude quedaran a nombre de la distribuidora. En la fila de herramientas que paga él puso cero, y anotó en la propuesta que el costo de Make depende de cuántos pedidos entren por mes.", "Con lo que midió la oficina completó las filas del cliente. La hoja dijo que había espacio entre el piso del mensual y el valor para el cliente.", "Le pasó todo a la skill cotizar-automatizacion. Le marcó que la propuesta tenía que avisar que cada pedido consume créditos en Make y que, si en un mes entran muchos más pedidos, el costo de la herramienta sube.", "La skill propuso un rango para cada parte y armó la propuesta de una página. El freelancer eligió un mensual cerca del piso porque es su primer cliente del rubro, y lo escribió como precio cerrado con alcance: qué entra en el mensual y qué se cotiza aparte.", "El dueño dijo que le parecía caro. El freelancer volvió a la cuenta del valor con los minutos que midió su propia empleada, y le ofreció achicar el alcance a un solo vendedor el primer mes en lugar de bajar el precio."], "resultado": "Quedó una propuesta con precio de implementación y mensual que salen de una cuenta que el dueño puede ver y discutir, con las herramientas a nombre de la distribuidora y su costo variable avisado. Si el precio no cierra, la conversación es sobre alcance, no sobre un número sacado de la galera."}, "si_falla": [{"sintoma": "El piso te da más alto que el valor para el cliente.", "solucion": "No lo vendas así. Achica el alcance (menos pasos, un solo canal, un solo equipo), revisa si tus horas de mantenimiento son realistas o busca con el cliente otra tarea que le cueste más tiempo. Si nada cierra, es mejor decirlo que perder dinero todos los meses."}, {"sintoma": "La automatización en Zapier dejó de correr a mitad de mes.", "solucion": "Probablemente llegó al límite de tareas del plan. Según el plan, Zapier cobra tareas extra o deja las corridas nuevas en espera hasta el ciclo siguiente, y avisa al 80% y al 100%. Revisa el uso en la cuenta del cliente y, si pasa seguido, recalcula el mensual o propón subir el plan."}, {"sintoma": "Las llamadas a la API de Claude empiezan a fallar a fin de mes.", "solucion": "Si la cuenta usa el crédito mensual de API que traen Max, Ultra o Team, cuando se termina y no hay créditos comprados ni recarga automática, las solicitudes se frenan hasta el mes siguiente. Ese crédito no se acumula. Configura créditos comprados o auto-reload en la Console del cliente y súmalo a la propuesta."}, {"sintoma": "El consumo de Make se fue mucho más arriba de lo que estimaste.", "solucion": "Revisa qué módulos usa el escenario: los de IA con el proveedor de Make cobran por operación más los tokens, y los iteradores cobran por cada elemento que procesan después. Con una conexión propia a un proveedor de IA (en planes pagos), el AI Toolkit y los AI Agents pasan a costo fijo por operación en Make, y los tokens los cobra ese proveedor."}, {"sintoma": "El cliente no sabe cuánto tarda en la tarea ni cuánto le cuesta esa hora.", "solucion": "No inventes el dato. Pídele que la cronometre unos días y que estime el costo de esa hora con el sueldo y las horas de la persona. Mientras tanto, cotiza desde tu piso y aclara en la propuesta que el valor se mide en el primer mes."}], "kit": [{"archivo": "cotizar-automatizacion/SKILL.md", "que_es": "Skill que pide los datos que faltan, calcula piso y techo mostrando las cuentas, avisa los costos variables de cada herramienta y arma la propuesta de una página. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: cotizar-automatizacion\ndescription: 'Calcula piso y techo de precio de una automatización con IA (implementación y mensual) desde horas, costo por hora y datos del cliente, y arma la propuesta. Úsala al cotizar o ante un \"es caro\".'\n---\n\n# Cotizar una automatización con IA\n\nAyudas a ponerle precio a una automatización con dos partes: implementación (se cobra una vez) y mensual (mantenimiento, soporte y cambios chicos). Nunca das un precio \"de mercado\": calculas con los datos que te pasan.\n\n## Datos que necesitas\n\nPide los que falten, de a uno, antes de calcular. Si la persona no sabe un dato, dile cómo averiguarlo.\n\n1. Lo que la persona necesita ganar por mes y las horas que realmente puede facturar por mes (no las que trabaja).\n2. Horas estimadas de implementación.\n3. Horas de mantenimiento por mes.\n4. Costos de herramientas que paga ella (si las paga el cliente, es cero en esta cuenta).\n5. Colchón por imprevistos (si no dice nada, usa 1,3 y acláralo).\n6. Del cliente: horas por mes que hoy le lleva la tarea y cuánto le cuesta esa hora. Si no lo sabe, marca \"sin dato\" y lista las preguntas para hacerle.\n\n## Cuentas (muéstralas siempre, paso a paso)\n\n- Costo por hora = lo que necesita ganar por mes ÷ horas facturables por mes.\n- Piso de implementación = horas de implementación × costo por hora × colchón.\n- Piso del mensual = horas de mantenimiento × costo por hora + costos de herramientas que paga ella.\n- Valor mensual para el cliente = horas que se ahorran por mes × costo de esa hora para el cliente.\n- Valor extra (menos errores, ventas recuperadas): solo si el cliente lo puede medir. Si no, no lo sumes.\n\n## Cómo leer el resultado\n\n- Si el piso del mensual queda por encima del valor mensual para el cliente: dilo claro y propón achicar el alcance o buscar otra tarea. No lo maquilles.\n- Si hay espacio entre piso y techo: propón un rango para cada parte y explica dónde ponerse (cerca del piso para los primeros clientes; más arriba si ya hay casos o el proceso es crítico).\n- El mensual tiene que quedar claramente por debajo del valor mensual para el cliente.\n- Cobrar por resultado: solo sugiérelo si el resultado se mide sin discusión y no depende de cosas que la persona no controla.\n\n## Costos variables que tienes que nombrar\n\nSi la solución usa estas herramientas, avisa que su costo depende del uso y que conviene que estén a nombre del cliente:\n\n- Zapier: cuenta tareas (acciones completadas); al llegar al límite, según el plan, se cobran tareas extra o las corridas quedan en espera.\n- Make: cobra en créditos; los módulos de IA con el proveedor de Make suman tokens.\n- API de Claude: se factura aparte del plan de chat.\n\n## Propuesta de una página\n\nSi la persona la pide, ármala con: problema (con las palabras del cliente), solución, qué incluye, qué no incluye, plazos, precio de implementación, mensual, qué incluye el mensual y qué pasa si quiere cancelar.\n\n## Reglas\n\n- No inventes números. Todo número sale de un dato que te pasaron o de una cuenta que mostraste.\n- No prometas ahorros ni ventas.\n- Voseo, frases cortas.\n"}, {"archivo": "calculadora-precio-automatizacion-ia.md", "que_es": "Tabla con fórmulas para pegar en Google Sheets o Excel: completas tus datos y los del cliente y te dice el piso, el techo y si el mensual cierra.", "contenido": "# Calculadora de precio de una automatización (para Google Sheets o Excel)\n\nEn una hoja nueva, escribe cada fila en el número de fila que indica la primera columna: el texto en la columna A y el valor o la fórmula en la columna B (la fila 1 son los títulos). Completa solo la columna B de las filas marcadas con \"COMPLETAR\". El resto se calcula solo. Los separadores de las fórmulas pueden ser coma o punto y coma según la configuración regional de tu planilla.\n\n| | A | B |\n|---|---|---|\n| 1 | Dato | Valor |\n| 2 | Lo que necesito ganar por mes (COMPLETAR) | |\n| 3 | Horas que realmente facturo por mes (COMPLETAR) | |\n| 4 | Mi costo por hora | =B2/B3 |\n| 5 | Horas estimadas de implementación (COMPLETAR) | |\n| 6 | Colchón por imprevistos (COMPLETAR, por ejemplo 1,3) | |\n| 7 | PISO de implementación | =B5*B4*B6 |\n| 8 | Horas de mantenimiento por mes (COMPLETAR) | |\n| 9 | Herramientas que pago yo por mes (COMPLETAR, 0 si las paga el cliente) | |\n| 10 | PISO del mensual | =B8*B4+B9 |\n| 11 | Horas por mes que el cliente se ahorra (COMPLETAR, con él) | |\n| 12 | Lo que le cuesta esa hora al cliente (COMPLETAR, con él) | |\n| 13 | TECHO: valor mensual para el cliente | =B11*B12 |\n| 14 | ¿El mensual cierra? | =SI(B10<B13;\"Sí, hay espacio entre piso y techo\";\"No: achica el alcance o busca otra tarea\") |\n| 15 | Espacio entre piso del mensual y valor para el cliente | =B13-B10 |\n| 16 | Mensual que propongo (COMPLETAR) | |\n| 17 | ¿Queda claramente por debajo del valor? | =SI(B16<B13;\"Sí\";\"No: bájalo o muestra más valor medible\") |\n\nNotas:\n\n- Si tu planilla está en inglés, cambia SI por IF.\n- Usa la misma moneda en todas las filas.\n- La fila 11 y la 12 se completan con los números del cliente, no con los tuyos. Si no los tiene, usa las preguntas del kit.\n- Esta hoja no te dice cuánto cobra el mercado. Te dice debajo de qué precio pierdes dinero y arriba de qué precio al cliente no le conviene.\n"}, {"archivo": "preguntas-valor-para-el-cliente.md", "que_es": "Doce preguntas para sacar con el cliente las horas, el costo de esa hora y los errores que se pueden medir, y cómo pasar las respuestas a la calculadora.", "contenido": "# Preguntas para estimar el valor con el cliente\n\nHazlas en la llamada de diagnóstico o en una segunda charla corta. Anota las respuestas con sus palabras: son las que después van a la propuesta.\n\n## La tarea\n\n1. ¿Quién hace hoy esta tarea? ¿Una persona o varias?\n2. ¿Cuántas veces por semana o por mes la hacen?\n3. ¿Cuánto tarda cada vez, más o menos? Si no sabe, pídele que la cronometre dos o tres veces esta semana.\n4. ¿Qué pasa cuando esa persona falta o está de vacaciones?\n\n## Lo que cuesta esa hora\n\n5. Esa persona, ¿qué otra cosa haría con ese tiempo?\n6. ¿Cuánto le cuesta al negocio una hora de esa persona? Si no quiere decirlo, pídele un rango o que lo calcule él con el sueldo y las horas del mes.\n\n## Errores y ventas\n\n7. ¿Qué errores aparecen hoy en esta tarea? ¿Cada cuánto?\n8. Cuando hay un error, ¿qué cuesta arreglarlo? (tiempo, dinero, un cliente enojado)\n9. ¿Se pierden ventas o consultas por no responder a tiempo? ¿Lo tienen anotado en algún lado?\n10. Si la respuesta es \"no sé\": ¿podemos medirlo un mes antes de arrancar?\n\n## Cierre\n\n11. Si esto funciona, ¿cómo te das cuenta? ¿Qué número mirarías?\n12. ¿Qué tiene que pasar para que digas que no valió la pena?\n\n## Qué hacer con las respuestas\n\n- Las respuestas 2, 3 y 6 son las filas 11 y 12 de la calculadora.\n- Las respuestas 7 a 9 solo suman al valor si se pueden medir. Si no, van a la propuesta como beneficio sin número.\n- La respuesta 11 es lo que vas a mostrar en el reporte mensual.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

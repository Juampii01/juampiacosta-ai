<script>var GUIA = {"slug": "objeciones-y-como-responderlas", "t": "Objeciones y cómo responderlas: en la llamada en frío y en la de venta", "d": "\"Es caro\", \"lo voy a pensar\", \"tengo que hablarlo\", \"ahora no\", \"mándame un mail\": qué hay detrás de cada una y qué responder.", "tema": "El roadmap para vender IA", "min": 9, "secciones": [{"h": "Qué es una objeción", "p": ["Una objeción no es una mentira: es un riesgo que el otro ve. La mayoría se previene en el diagnóstico (preguntando quién decide, cuándo lo quiere resolver y qué probó antes) y se responde con las palabras y los números que dio el propio cliente.", "Distingue la superficial (la primera excusa que sale) de la real (lo que de verdad lo frena). Si respondes la superficial, aparece otra."]}, {"h": "El método en tres pasos", "pasos": ["Validar: \"Tiene sentido que lo pienses\" (sin discutir).", "Profundizar y aislar: \"Si la inversión no fuera un tema, ¿avanzarías?\". Así sabes si el problema es el precio u otra cosa.", "Responder a la raíz con su información: sus números, sus frases, su urgencia."]}, {"h": "En la llamada en frío", "lista": ["\"Mándame un mail\": \"Claro. Para mandarte algo que te sirva, ¿qué tendría que tener?\". Y vuelve a proponer 15 minutos.", "\"No tengo tiempo\": \"Te entiendo. ¿Te queda mejor el martes a las 10 o el jueves a las 17?\" o \"dame dos minutos y si no te sirve cortamos\".", "\"Ya tenemos algo\": \"Bien. ¿Qué parte del proceso quedó afuera?\".", "\"No es prioridad\": costo de no hacer nada y una fecha concreta para retomar.", "\"No soy quien decide\": \"¿Quién sería la mejor persona? ¿Cómo la puedo contactar?\".", "\"No te conozco\": \"Es lógico. Por eso te propongo una videollamada corta donde te muestro cómo funciona\"."]}, {"h": "En la llamada de venta", "lista": ["\"Es caro\": casi siempre es \"no veo el retorno\". Vuelve al impacto en dinero o en horas con sus números. Distingue \"caro\" de \"no puedo pagarlo\": para lo segundo, ofrece pagar en partes antes que bajar el precio.", "\"Lo voy a pensar\": \"¿Qué parte te genera dudas: la solución, el momento o la inversión?\". Aísla y resuelve esa.", "\"Lo tengo que hablar con mi socio\": se previene preguntando antes quién decide. Si aparece, agenda en el momento una reunión con los dos. Lo que le llega al socio contado por otro es una fracción de lo que escuchó tu cliente.", "\"Ahora no\": meses de espera × lo que pierde por mes, comparado con la inversión.", "\"Miedo a que la IA responda mal\": nada se activa sin su aprobación, siempre hay pase a una persona y la IA cubre lo repetitivo.", "\"Ya lo probamos y no funcionó\": pregunta qué probaron, con quién y qué falló. Se previene en el diagnóstico.", "\"No tienes casos\": no mientas. Apóyate en resultados de la tecnología en otras empresas, ofrece una versión de prueba y pregunta qué necesitaría para confiar."]}, {"h": "La regla del WhatsApp", "p": ["Las objeciones por mensaje casi nunca se resuelven: se enfrían. Si aparece una objeción por WhatsApp, la respuesta es proponer una llamada corta con día y hora."], "prompts": [{"t": "Practicar objeciones", "c": "Haz de dueño de [RUBRO] que recibe mi propuesta de [SOLUCIÓN] por [PRECIO]. Ponme objeciones reales, una por vez, empezando por la superficial y, si la respondo bien, pasando a la real. Después de cada respuesta mía, dime en una línea qué hice bien, qué no y cómo lo diría mejor. Terminamos cuando acepte o cuando no queden objeciones."}]}], "faq": [{"q": "¿Bajo el precio si insiste?", "a": "Antes de bajar, ofrece facilidades de pago o achica el alcance. Si bajas el precio sin cambiar nada, le enseñas que tu precio era inventado."}], "cat": "roadmap", "parte": "construi"};</script>

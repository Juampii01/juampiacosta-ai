<script>var GUIA = {"slug": "modo-plan-de-claude-code", "t": "Modo plan: que Claude piense antes de construir", "d": "Claude investiga tu proyecto y te escribe un plan sin tocar tu código. Lo corregís, lo aprobás y recién ahí construye.", "tema": "Claude Code", "min": 7, "secciones": [{"h": "Qué es y por qué te ahorra problemas", "p": ["En modo plan, Claude lee tus archivos y puede correr comandos para explorar, pero no edita tu código. Al final te presenta un plan y espera que lo apruebes.", "Es como pedirle un presupuesto al albañil antes de que rompa la pared: ves qué va a hacer, en qué orden y qué archivos toca. Si algo no te cierra, lo cambiás en el papel y no en la obra."]}, {"h": "Cómo entrar", "lista": ["Shift+Tab: en la terminal, cambiás de modo hasta que la barra de estado diga plan mode on. En Windows, si Shift+Tab no responde, probá Alt+M.", "/plan [tarea]: entra en modo plan y arranca directo con esa tarea. Ejemplo: /plan agregar un formulario de contacto.", "claude --permission-mode plan: abre Claude Code ya en modo plan.", "App de escritorio o web: elegí Plan en el selector de modo, debajo del cuadro de mensaje."]}, {"h": "Pedí un buen plan", "p": ["Contale el objetivo, no solo la tarea. Y pedile que te pregunte lo que no sabe: un plan con dudas resueltas sale mucho mejor."], "prompts": [{"t": "Plan antes de construir", "c": "/plan Quiero [LO QUE QUERÉS CONSTRUIR O CAMBIAR].\nPara qué es: [EL OBJETIVO, EN UNA LÍNEA].\nQuién lo va a usar: [TU CLIENTE O VOS].\nAntes de armar el plan:\n1. Revisá cómo está hecho el proyecto hoy.\n2. Haceme hasta 5 preguntas sobre lo que no te quede claro.\nDespués armá el plan con:\n- Los pasos en orden, explicados simple.\n- Qué archivos vas a crear o modificar.\n- Qué podría salir mal y cómo lo evitás.\n- Cómo voy a comprobar yo que funciona."}]}, {"h": "Cuando el plan está listo", "p": ["Claude te muestra el plan y te da tres opciones (los nombres aparecen en inglés):"], "lista": ["Yes, and use auto mode: lo aprobás y construye en modo automático, con controles de seguridad en segundo plano. Si ese modo no está disponible, dice Yes, auto-accept edits.", "Yes, manually approve edits: lo aprobás, pero te pregunta antes de cada cambio. La más segura si estás empezando.", "No, keep planning: seguís en modo plan y le decís qué corregir."], "aviso": "Con Ctrl+G abrís el plan en tu editor y lo cambiás vos a mano antes de que siga."}, {"h": "Cuándo usarlo y cuándo no", "lista": ["Sí: cambios que tocan varios archivos, cosas nuevas que no sabés bien cómo encarar, o cuando trabajás sobre algo que ya usan tus clientes.", "No hace falta: cambios chiquitos y claros, como corregir un texto o un color.", "Truco: si el plan es largo, pedile que lo divida en etapas y aprobá una por vez."]}], "faq": [{"q": "¿En modo plan puede romper algo?", "a": "No edita tu código hasta que apruebes. Igual puede correr comandos para explorar. Si tenés auto mode disponible, un clasificador revisa esos comandos y los aprueba o bloquea sin preguntarte; si no, te pide permiso para los que no son de solo lectura. Leé cada aviso antes de aceptar."}, {"q": "Aprobé el plan y no me gusta cómo va", "a": "Frenalo con Esc (en la app, con el botón de stop) y decile qué cambiar. Si ya hizo cambios, /rewind te deja volver a un punto anterior. Ojo: solo deshace lo que editó con sus herramientas de archivos; lo que cambió con comandos de terminal no vuelve, por eso conviene tener git."}, {"q": "¿Puedo guardar el plan?", "a": "Claude Code ya guarda los planes como archivos en ~/.claude/plans/ (o en la carpeta que definas con plansDirectory). Si lo querés a mano dentro del proyecto, pedile que lo copie a un archivo, por ejemplo plan.md, para retomarlo en otra sesión."}], "fuentes": ["https://code.claude.com/docs/en/permission-modes", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/desktop-quickstart", "https://code.claude.com/docs/en/interactive-mode", "https://code.claude.com/docs/en/best-practices"], "ejemplo": {"titulo": "Ejemplo resuelto: sumar un campo al formulario de reservas con un plan aprobado", "negocio": "Ejemplo inventado: un desarrollador freelance de Montevideo mantiene la web de reservas de un complejo de cabañas en Piriápolis. Es una app chica con formulario de reserva y mail de confirmación, guardada en git.", "punto_de_partida": "Los dueños quieren preguntar si el huésped viene con mascotas y que eso aparezca en el mail de confirmación. El dev no tocaba esa parte desde hacía meses y no recordaba dónde se arma el mail.", "pasos": ["Revisó que git status estuviera limpio y abrió Claude Code en la carpeta con claude --permission-mode plan.", "Pegó el prompt Plan antes de construir de la guía: quiere un campo de mascotas en el formulario, para que los dueños preparen la cabaña, y lo usan los huéspedes desde el celular.", "Claude leyó el formulario y la plantilla del mail y le hizo preguntas: si el campo es obligatorio, si alcanza con sí o no o hace falta la cantidad, y si las reservas viejas tienen que mostrar algo.", "Con las respuestas, Claude presentó el plan: el campo en el formulario, la validación, el dato en la reserva y una línea nueva en el mail, con cómo probarlo enviando una reserva de prueba.", "Revisó el plan con la checklist del kit. Vio que proponía cambiar también el diseño del formulario, apretó Ctrl+G y borró ese paso a mano.", "Eligió Yes, manually approve edits y aprobó cada cambio mirando el archivo que tocaba.", "Hizo una reserva de prueba en su máquina, confirmó que el mail decía si viene con mascotas y pidió el commit con un mensaje claro."], "resultado": "El campo quedó funcionando sin cambios de más en el diseño. El dev supo antes de empezar qué archivos se iban a tocar y tuvo una prueba concreta para dar el cambio por terminado."}, "si_falla": [{"sintoma": "Apretás Shift+Tab y no cambia el modo (pasa sobre todo en Windows).", "solucion": "Probá Alt+M, que es el atajo alternativo en Windows. También podés escribir /plan seguido de la tarea, o abrir Claude Code con claude --permission-mode plan."}, {"sintoma": "En modo plan te pide permiso a cada rato para correr comandos.", "solucion": "Pasa cuando auto mode no está disponible: los comandos que no son de solo lectura piden aprobación. Si son comandos que usás siempre y confiás en ellos, preaprobalos con /permissions. Si no entendés un comando, preguntale a Claude qué hace antes de aceptarlo."}, {"sintoma": "Aprobaste el plan y Claude empezó a editar todo sin preguntarte.", "solucion": "Elegiste Yes, and use auto mode (o Yes, auto-accept edits). Apretá Esc para frenarlo y usá Shift+Tab hasta volver a Manual o a plan. La próxima vez elegí Yes, manually approve edits."}, {"sintoma": "Ctrl+G abre un editor que no sabés usar o no abre nada.", "solucion": "Ctrl+G abre tu editor de texto por defecto de la terminal. Si no te sirve, elegí No, keep planning y escribí las correcciones en el chat: el resultado es el mismo."}, {"sintoma": "Querés que un proyecto arranque siempre en modo plan.", "solucion": "Poné defaultMode en plan dentro de .claude/settings.json del proyecto (el archivo del kit). Vale para las sesiones que abrís en la terminal; en la extensión de VS Code se configura con claudeCode.initialPermissionMode en tus ajustes de usuario."}], "kit": [{"archivo": "pedir-plan/SKILL.md", "que_es": "Skill que hace preguntas y entrega un plan con pasos, archivos, riesgos y prueba, sin editar nada. Ponela en .claude/skills/pedir-plan/ y usala con /pedir-plan seguido de lo que querés hacer.", "contenido": "---\nname: pedir-plan\ndescription: Arma un plan de trabajo antes de tocar código: revisa el proyecto, hace preguntas y entrega pasos, archivos, riesgos y cómo probar. Usala con /pedir-plan seguido de lo que querés construir o cambiar.\ndisable-model-invocation: true\n---\n\n# Pedir un plan antes de construir\n\nLo que quiere el usuario: $ARGUMENTS\n\n## Antes del plan\n\n1. No edites ningún archivo en esta etapa. Si no estás en modo plan, recordale al usuario que puede entrar con Shift+Tab o con /plan.\n2. Revisá cómo está hecho hoy lo que hay que tocar: qué archivos intervienen y de qué dependen.\n3. Hacé hasta 5 preguntas sobre lo que no esté claro. Priorizá las que cambian el plan (para quién es, qué no se puede romper, qué pasa en los casos raros). Esperá las respuestas.\n\n## El plan\n\nEntregalo con estas secciones, en lenguaje simple:\n\n- Objetivo: una línea con lo que va a quedar funcionando.\n- Pasos: numerados y chicos, cada uno con qué archivo crea o modifica.\n- Fuera de alcance: lo que este plan no toca.\n- Riesgos: qué podría salir mal y cómo lo evitás.\n- Cómo se prueba: qué comando corrés o qué tiene que ver el usuario para saber que anda.\n- Dudas abiertas: lo que no pudiste resolver.\n\n## Reglas\n\n- Si el plan tiene más de 8 pasos, dividilo en etapas y proponé aprobar una por vez.\n- Si el cambio se explica en una frase, decilo y sugerí hacerlo directo, sin plan.\n- No propongas tocar archivos de configuración, claves o datos de clientes salvo que el usuario lo haya pedido.\n"}, {"archivo": "settings-proyecto-arranca-en-plan.json", "que_es": "Configuración para que las sesiones de terminal de un proyecto arranquen en modo plan. Guardala como .claude/settings.json en la carpeta del proyecto (si ya tenés ese archivo, sumá solo defaultMode dentro de permissions).", "contenido": "{\n  \"permissions\": {\n    \"defaultMode\": \"plan\"\n  }\n}\n"}, {"archivo": "checklist-revisar-plan-antes-de-aprobar.md", "que_es": "Checklist para leer el plan antes de elegir una opción, con un mensaje listo para pedir correcciones.", "contenido": "# Checklist: revisar un plan antes de aprobarlo\n\nUsala cuando Claude te muestra el plan y te pregunta cómo seguir.\n\n## 1. ¿Entendió lo que quiero?\n- [ ] El objetivo del plan dice lo mismo que yo pedí, con mis palabras.\n- [ ] No agregó cosas que no pedí (pantallas nuevas, librerías nuevas, cambios de diseño).\n- [ ] Respondió o dejó anotadas las dudas que le contesté.\n\n## 2. ¿Sé qué va a tocar?\n- [ ] Cada paso dice qué archivo crea o modifica.\n- [ ] No toca carpetas sensibles: configuración, claves, datos de clientes, base de datos.\n- [ ] Si borra o renombra algo, lo dice explícitamente.\n\n## 3. ¿Puedo comprobarlo?\n- [ ] Hay una forma concreta de probar cada paso o, como mínimo, el final (un comando, una pantalla, un mail de prueba).\n- [ ] Sé qué tengo que ver yo para decir que anda.\n\n## 4. ¿Es del tamaño justo?\n- [ ] Si tiene muchos pasos, está dividido en etapas.\n- [ ] Si se explica en una frase, no hacía falta plan: pedilo directo la próxima.\n\n## 5. Antes de apretar\n- [ ] Tengo git al día (o una copia de la carpeta), porque /rewind no deshace lo que cambió por comandos de terminal.\n- [ ] Si estoy empezando, elijo Yes, manually approve edits.\n- [ ] Si algo no me cierra, elijo No, keep planning y escribo qué cambiar, o aprieto Ctrl+G y lo corrijo a mano.\n\n## Para pedir correcciones (copiá y completá)\nCambiá el plan así:\n- Sacá el paso [NÚMERO]: [POR QUÉ].\n- En el paso [NÚMERO], no toques [ARCHIVO O CARPETA].\n- Agregá cómo vamos a probar [PARTE].\nMostrame el plan corregido antes de seguir.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

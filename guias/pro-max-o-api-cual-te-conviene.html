<script>var GUIA = {"slug": "pro-max-o-api-cual-te-conviene", "t": "Pro, Max o API: cuál te conviene para Claude Code", "d": "Cómo funcionan los planes de suscripción y la API que se paga por uso, los precios oficiales a noviembre de 2026 y cómo saber si tenés que subir de plan o usar mejor el que tenés.", "tema": "Gastá menos tokens", "min": 7, "ficha": [["Qué es", "Una comparación de las formas de pagar Claude Code: suscripción (Pro, Max, Ultra) o API por uso."], ["Necesitás", "Saber cuánto usás hoy: corré /usage en Claude Code."], ["Cuánto cuesta", "Pro US$20, Max US$100 y Ultra US$200 por mes (precios a noviembre de 2026, revisalos en la página oficial). La API se paga por token."], ["Qué no hace", "No te dice cuántos mensajes exactos tenés: los límites dependen de cómo usás Claude."]], "secciones": [{"h": "Dos formas de pagar", "lista": ["Suscripción (Pro, Max o Ultra): pagás un monto fijo por mes. Con la misma cuenta usás Claude en la web, el escritorio, el celular y Claude Code. Todo lo que hacés en cualquiera de ellos cuenta para los mismos límites.", "API (pago por uso): entrás a Claude Code con una cuenta de la Claude Console y pagás por cada token que se procesa, a los precios de la API. No tenés los límites de 5 horas ni el semanal del plan, pero tampoco hay techo de gasto si no lo ponés vos."]}, {"h": "Los precios oficiales", "p": ["Precios a noviembre de 2026, revisalos en la página oficial (claude.com/pricing) antes de decidir. Son en dólares, con impuestos según tu región, y en la app del celular pueden ser distintos."], "lista": ["Pro: US$20 por mes. Incluye Claude Code.", "Max: US$100 por mes, solo mensual. Te da cinco veces el uso de Pro cada 5 horas y cada semana.", "Ultra: US$200 por mes. Te da diez veces el uso semanal de Pro, y las cuentas verificadas no tienen límite de 5 horas. Es el plan que antes se llamaba Max 20x.", "API: se paga por millón de tokens y el precio cambia según el modelo. Mirá la guía para usar la API más barata."], "aviso": "Los precios y los planes pueden cambiar. Si ves una diferencia con lo que dice acá, vale lo que diga la página oficial."}, {"h": "Cómo funcionan los límites de los planes", "lista": ["Pro y Max tienen un límite por sesión que se renueva cada 5 horas y otro semanal.", "El límite semanal se renueva a una hora fija asignada a tu cuenta.", "Max y Ultra tienen además un límite semanal aparte para los modelos Fable.", "Si te quedás sin uso, podés esperar a que se renueve, activar créditos de uso (se pagan aparte) o pasar a una cuenta de Console y pagar API a precio normal."]}, {"h": "Antes de subir de plan, revisá esto", "pasos": ["Corré /usage y mirá el desglose de los últimos 7 días (tecla w). Fijate qué se lleva la mayor parte: un CLAUDE.md enorme, un MCP, subagentes, sesiones larguísimas.", "Aplicá lo de la guía Claude Code liviano: /clear entre tareas, CLAUDE.md corto, MCP apagados.", "Usá Sonnet para el día a día y dejá Opus para lo difícil (/model).", "Probalo una o dos semanas. Si seguís chocando con el límite casi todos los días, ahí sí subí de plan."]}, {"h": "Cuándo conviene cada uno", "lista": ["Pro: si usás Claude Code algunas horas por semana y no chocás seguido con el límite.", "Max: si trabajás con Claude Code casi todos los días y el límite de Pro te frena aunque ya uses bien el plan.", "Ultra: si es tu herramienta principal de trabajo y Max no te alcanza en la semana.", "API: si lo vas a usar en automatizaciones, en un servidor o en un equipo donde querés pagar exactamente lo que se usa. En la Console podés poner límites de gasto por espacio de trabajo. Si es para vos solo y lo usás mucho, compará contra el plan antes."], "p": ["Como referencia, Anthropic cuenta que en empresas el gasto promedio con API ronda US$13 por desarrollador por día activo y entre US$150 y US$250 por mes. Es un promedio de empresas: tu número puede ser muy distinto."]}, {"h": "Pedile a Claude que te ayude a decidir", "prompts": [{"t": "¿Subo de plan?", "c": "Te pego lo que me muestra /usage de los últimos 7 días:\n[PEGÁ ACÁ]\nMi plan actual: [PRO / MAX / API].\nCómo uso Claude Code: [CUÁNTAS HORAS POR DÍA Y PARA QUÉ].\nDecime: 1) qué es lo que más me está consumiendo, 2) qué puedo cambiar en mi forma de trabajar antes de pagar más, y 3) si con esos cambios igual me convendría otro plan. No inventes precios: si los necesitás, decime que los revise en claude.com/pricing."}]}], "faq": [{"q": "¿Con Pro puedo usar Claude Code?", "a": "Sí. Pro incluye Claude Code en la terminal y comparte los límites con el chat."}, {"q": "Si me paso del límite, ¿me cobran solo?", "a": "No, salvo que tengas activados los créditos de uso. Si no, Claude Code se frena hasta que se renueva el límite."}, {"q": "Tengo suscripción, ¿por qué me llegó un cobro de API?", "a": "Probablemente tenés la variable ANTHROPIC_API_KEY configurada y Claude Code la usó. Corré /status para ver con qué entraste y mirá la guía de cómo medir tu consumo."}], "fuentes": ["https://support.anthropic.com/en/articles/8325610-how-much-does-claude-pro-cost", "https://support.claude.com/en/articles/8324991-about-claude-s-pro-plan-usage", "https://support.claude.com/en/articles/11049741-what-is-the-max-plan", "https://support.claude.com/en/articles/17728952-what-is-the-ultra-plan", "https://support.claude.com/en/articles/11145838-use-claude-code-with-your-pro-max-or-ultra-plan", "https://code.claude.com/docs/en/costs", "https://code.claude.com/docs/en/iam"], "cat": "ahorrar", "parte": "aprende"};</script>

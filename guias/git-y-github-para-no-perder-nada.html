<script>var GUIA = {"slug": "git-y-github-para-no-perder-nada", "t": "Git y GitHub para no perder nada", "d": "Commits, ramas y cómo volver atrás, explicado para no programadores. Y cómo pedirle todo a Claude Code sin escribir un solo comando.", "tema": "Crea tu app", "min": 9, "secciones": [{"h": "Cuatro palabras y listo", "lista": ["Commit: una foto guardada de tu proyecto con un mensaje (\"agrego el formulario de contacto\"). Puedes volver a cualquier foto.", "Rama: una copia paralela para probar algo sin tocar la versión buena. La principal suele llamarse main.", "Push: subir tus commits a GitHub, que es la copia en la nube.", "Pull request: un pedido para juntar una rama con la principal. Ahí revisas los cambios antes de aceptarlos."]}, {"h": "Pídeselo a Claude Code", "p": ["No necesitas aprender los comandos. Claude Code maneja Git por ti; lo que sí tienes que hacer es pedirle commits seguido y leer lo que te muestra antes de aprobar."], "prompts": [{"t": "Guardar un commit", "c": "Guarda un commit con los cambios de ahora. Antes, muéstrame la lista de archivos que entran y un mensaje corto en español que explique qué cambió. Revisa que no haya claves ni archivos .env."}, {"t": "Probar algo en una rama", "c": "Quiero probar [EL CAMBIO] sin tocar la versión que funciona. Crea una rama nueva llamada [NOMBRE], haz el cambio ahí y avísame cómo vuelvo a main si no me gusta."}, {"t": "Pull request", "c": "Crea un pull request de esta rama hacia main. En la descripción, explica en lenguaje simple qué cambia, cómo lo probé y qué riesgos ves."}]}, {"h": "Volver atrás: tres niveles", "lista": ["Dentro de la sesión: /rewind (o Esc dos veces con el cuadro vacío) abre los puntos de control de Claude Code. Puedes restaurar el código, la conversación o las dos cosas.", "En Git: revertir un commit crea un commit nuevo que deshace aquel cambio. El original queda en el historial, así que no pierdes nada.", "En la web publicada: si la versión nueva rompió algo, el Instant Rollback de Vercel vuelve a una versión anterior de producción (en el plan Hobby, solo a la inmediatamente anterior). Ojo: después del rollback, los nuevos push a main dejan de publicarse solos hasta que promuevas una versión desde el botón Manage o con vercel promote."], "prompts": [{"t": "Deshacer un cambio con Git", "c": "La app dejó de funcionar después de [LO QUE CAMBIÓ]. Muéstrame los últimos 10 commits en lenguaje simple y dime cuál crees que lo rompió. Propón revertirlo con un commit nuevo (sin borrar historial) y espera mi OK."}]}, {"h": "Lo que nunca tiene que subir", "p": ["El archivo .gitignore le dice a Git qué ignorar. Ahí van tus archivos .env, las carpetas de dependencias como node_modules y cualquier archivo con datos de clientes.", "Ojo: si un archivo ya se subió, agregarlo después al .gitignore no lo saca. Hay que dejar de rastrearlo y, si tenía claves, rotarlas. Como red extra, GitHub frena por defecto tus subidas a repositorios públicos cuando detecta claves con formatos que reconoce, como las de proveedores conocidos. No es una garantía: en repositorios privados esa protección no viene prendida por defecto, y una contraseña suelta puede pasar."]}, {"h": "Rutina para no perder nada", "pasos": ["Al empezar a trabajar, pídele a Claude que te diga en qué rama estás y si hay cambios sin guardar.", "Cada vez que algo funciona, commit.", "Para cambios grandes, rama nueva.", "Al terminar el día, push a GitHub.", "Antes de juntar con main, revisa los cambios con /diff o /code-review."]}], "faq": [{"q": "¿Cuál es la diferencia entre /rewind y Git?", "a": "/rewind es un deshacer rápido dentro de la sesión. Git es el historial permanente. Claude Code mismo aclara que sus checkpoints no reemplazan a Git."}, {"q": "¿Cada cuánto hago commit?", "a": "Cada vez que algo funciona y no querrías perderlo. Muchos commits chicos son mejores que uno gigante."}, {"q": "¿Mi repositorio tiene que ser público?", "a": "No. Puede ser privado. Lo que sí: ni público ni privado tiene que tener claves adentro."}], "fuentes": ["https://code.claude.com/docs/en/checkpointing", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/common-workflows", "https://docs.github.com/en/desktop/managing-commits/reverting-a-commit-in-github-desktop", "https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/merging-a-pull-request", "https://docs.github.com/en/get-started/git-basics/ignoring-files", "https://docs.github.com/en/code-security/concepts/secret-security/about-push-protection", "https://vercel.com/docs/instant-rollback", "https://docs.github.com/en/code-security/concepts/secret-security/push-protection", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: una rutina de Git para la web de un taller mecánico", "negocio": "Ejemplo inventado: un taller mecánico en Godoy Cruz, Mendoza, con el dueño, dos mecánicos y una secretaria. La secretaria mantiene con Claude Code la web del taller, publicada en Vercel, con un formulario para pedir turno.", "punto_de_partida": "La secretaria trabajaba sin Git: cuando un cambio salía mal, le pedía a Claude que \"lo dejara como estaba\" y a veces no quedaba igual. Una vez casi sube el archivo con la clave del servicio de mails.", "pasos": ["Guardó el archivo gitignore-base-proyectos-con-claude.txt del kit como .gitignore en la raíz. Como el .env ya estaba en un commit viejo, le pidió a Claude que lo dejara de rastrear, y generó una clave nueva en el servicio de mails.", "Copió la skill guardar-cambios del kit en .claude/skills/. Ahora, cada vez que algo funciona, escribe /guardar-cambios, lee la lista de archivos y el mensaje en español y responde que sí.", "Para cambiar el diseño de la sección de servicios pidió una rama nueva llamada nuevo-servicios. El dueño no estaba convencido, así que volvió a main sin perder nada y dejó la rama para retomarla.", "Un martes Claude cambió el formulario de turnos y dejó de llegar el mail. Como era en la misma sesión, usó /rewind, eligió el mensaje anterior y Restore code. El formulario volvió a andar.", "Al terminar el día corre /guardar-cambios subir. La skill revisó que no entrara el .env y subió a GitHub; Vercel publicó la versión nueva.", "Otro día, la versión publicada mostraba mal los horarios en celular. En Vercel usó Instant Rollback a la versión anterior, arregló el error en el código, lo subió y recién después promovió la versión nueva desde Manage, para que los push vuelvan a publicarse solos.", "Pegó la tabla \"Qué hacer si...\" del archivo rutina-git-sin-comandos.md junto a la computadora del taller."], "resultado": "Quedó un proyecto con historial de commits en español, un .gitignore que deja afuera claves y datos, una skill que revisa cada guardado y una rutina que la secretaria sigue sin escribir comandos. Si algo se rompe sabe en qué nivel deshacer: /rewind, revertir un commit o rollback en Vercel."}, "si_falla": [{"sintoma": "Al hacer el primer commit aparece \"Author identity unknown\" o \"Please tell me who you are\".", "solucion": "Git necesita tu nombre y mail una sola vez por computadora. Pídele a Claude: \"Configura Git con mi nombre [NOMBRE] y mi mail [MAIL] para todos los proyectos\". Usa el mismo mail de tu cuenta de GitHub, o el mail privado que GitHub te da en Settings → Emails si no quieres mostrar el tuyo."}, {"sintoma": "GitHub rechaza la subida con un mensaje de que el push contiene un secreto.", "solucion": "Es la protección contra secretos. No la saltees. Pídele a Claude que saque la clave del código y la pase a .env, que corrija el commit donde entró (si es el último, alcanza con rehacerlo) y que vuelva a subir. Como el push se frenó, esa clave no llegó a GitHub. Si en algún momento sí se subió (en otro commit o en otro repositorio), genera una nueva en ese servicio y anula la vieja."}, {"sintoma": "La subida se rechaza con \"Updates were rejected because the remote contains work that you do not have locally\".", "solucion": "En GitHub hay cambios que tu computadora no tiene (por ejemplo, editaste algo desde la web de GitHub o desde otra computadora). Pídele a Claude que traiga esos cambios primero (git pull), que te cuente qué llegó y que vuelva a subir. No aceptes un push --force para salir del paso."}, {"sintoma": "Usaste /rewind pero un archivo no volvió a como estaba.", "solucion": "/rewind no restaura archivos que solo cambió un comando de terminal, ni cambios hechos fuera de Claude Code o por subagentes en segundo plano. Para esos casos está Git: pídele a Claude que te muestre los cambios de ese archivo desde el último commit y que lo vuelva a esa versión."}, {"sintoma": "Después de un Instant Rollback en Vercel, subes arreglos a main y la web publicada no cambia.", "solucion": "Es lo esperado: el rollback apaga la publicación automática en producción. En el panel del proyecto toca Manage en la tarjeta de producción, elige el deploy nuevo y confirma, o corre vercel promote con su link. Desde ahí los push vuelven a publicarse solos."}], "kit": [{"archivo": "guardar-cambios/SKILL.md", "que_es": "Skill de Claude Code para guardar commits sin saber Git: traduce los cambios a lenguaje simple, frena si hay claves o .env, propone el mensaje y espera tu OK. Copia la carpeta en .claude/skills/ (o en ~/.claude/skills/ para todos tus proyectos) y úsala con /guardar-cambios, o /guardar-cambios subir para además subir a GitHub.", "contenido": "---\nname: guardar-cambios\ndescription: 'Guarda cambios en Git para quien no programa: explica qué cambió, frena claves y .env, propone el commit, espera el OK y puede subir a GitHub. Úsala con \"guarda\", \"haz un commit\" o \"sube todo\".'\ndisable-model-invocation: true\nargument-hint: [subir]\n---\n\n# Guardar cambios\n\nExplica todo en lenguaje simple. El usuario no programa: no le muestres salidas largas de Git sin traducirlas.\n\n## 1. Dónde estamos\n\n- Corre git status. Si la carpeta no es un repositorio, pregunta si quieres crearlo con git init y, antes del primer commit, arma un .gitignore que incluya .env, .env.*, node_modules y las carpetas de compilación del proyecto (deja afuera .env.example, que sí se sube).\n- Di en una línea en qué rama estamos. Si es main y los cambios son grandes o experimentales, pregunta si conviene una rama nueva antes de guardar.\n\n## 2. Revisión de seguridad\n\nAntes de proponer el commit:\n- Lista los archivos que entrarían. Si aparece cualquier .env (salvo .env.example), un archivo con datos de clientes (planillas, exportaciones, backups) o una carpeta como node_modules, frena y explica por qué no tiene que subir.\n- Busca en los cambios textos que parezcan claves: cadenas largas que empiezan con sk-, pk_, ghp_, AKIA, o líneas con password, secret, token o api_key seguidas de un valor. Si encuentras algo, frena, muestra dónde está (sin repetir el valor completo) y propón moverlo a .env.\n- Si la clave ya estaba en un commit anterior, avisa que sacarla del archivo no alcanza: hay que rotarla (generar una nueva en el servicio y anular la vieja).\n\n## 3. Proponer\n\nMuestra:\n- Los archivos, agrupados en: nuevos, modificados, borrados.\n- Un resumen de qué cambió, en dos o tres líneas, como se lo contarías a alguien que no programa.\n- El mensaje del commit: corto, en español, en presente (\"agrego el formulario de contacto\").\n\nPregunta: \"¿Guardo con este mensaje?\". Espera.\n\n## 4. Guardar\n\nCon el OK, haz el commit solo con los archivos revisados. Confirma con una línea: rama, mensaje y cantidad de archivos.\n\n## 5. Subir (si lo pidió)\n\nSi el usuario escribió \"subir\" ($ARGUMENTS) o lo pide ahora, haz push a GitHub de la rama actual.\n- Si el push es rechazado porque GitHub tiene cambios que no están aquí, no fuerces nada: trae esos cambios primero (git pull), cuenta qué llegó y vuelve a intentar.\n- Si GitHub bloquea el push porque detectó un secreto, no lo saltees. Vuelve al paso 2.\n- Nunca uses push --force ni borres historial sin que el usuario lo pida con esas palabras y entienda lo que implica.\n"}, {"archivo": "gitignore-base-proyectos-con-claude.txt", "que_es": "Un .gitignore base para webs y apps hechas con Claude Code: deja afuera claves, dependencias, compilaciones, datos de clientes y la configuración personal. Guárdalo en la raíz con el nombre .gitignore y suma las carpetas propias de tu proyecto.", "contenido": "# .gitignore base para proyectos hechos con Claude Code\n# Guarda este archivo en la raíz del proyecto con el nombre .gitignore\n# Ojo: si un archivo ya está en un commit, agregarlo aquí no lo saca.\n# Para dejar de rastrearlo: git rm --cached NOMBRE-DEL-ARCHIVO\n\n# Claves y configuración local (nunca se suben)\n.env\n.env.*\n!.env.example\n*.pem\n*.key\n\n# Dependencias (se reinstalan con npm install)\nnode_modules/\n\n# Compilaciones y caché\ndist/\nbuild/\n.next/\nout/\n.vercel/\n.netlify/\n.cache/\ncoverage/\n\n# Datos de clientes y exportaciones\n# Si tu proyecto guarda planillas o backups en una carpeta, súmala aquí.\ndatos-privados/\n*.sqlite\n*.db\nbackup*/\n\n# Configuración personal de Claude Code (no se comparte con el equipo)\nCLAUDE.local.md\n.claude/settings.local.json\n\n# Archivos del sistema y del editor\n.DS_Store\nThumbs.db\n*.log\n.vscode/\n.idea/\n"}, {"archivo": "rutina-git-sin-comandos.md", "que_es": "Hoja de una página con los pedidos para cada momento del día y una tabla de qué hacer si algo sale mal, del /rewind al rollback en Vercel. Para tener a mano al lado de la computadora.", "contenido": "# Git sin comandos: la rutina diaria y qué hacer si algo sale mal\n\nTodo esto se le pide a Claude Code en palabras. Copia el pedido tal cual.\n\n## Al empezar\n\n> Dime en qué rama estoy, si hay cambios sin guardar y cuál fue el último commit, en lenguaje simple.\n\n## Cuando algo funciona\n\n> /guardar-cambios\n\n(o, sin la skill: \"Guarda un commit con los cambios de ahora. Antes, muéstrame la lista de archivos que entran y un mensaje corto en español. Revisa que no haya claves ni archivos .env.\")\n\n## Antes de un cambio grande\n\n> Quiero probar [EL CAMBIO] sin tocar la versión que funciona. Crea una rama nueva llamada [NOMBRE] y avísame cuando estemos en ella.\n\n## Al terminar el día\n\n> /guardar-cambios subir\n\n## Antes de juntar una rama con main\n\n> Muéstrame con /diff qué cambia esta rama respecto de main y después corre /code-review. Explícame los problemas en lenguaje simple antes de arreglar nada.\n\n## Qué hacer si...\n\n| Te pasó esto | Pídele esto a Claude |\n| --- | --- |\n| Claude rompió algo hace dos minutos, en esta misma sesión | Usa /rewind (o Esc dos veces con el cuadro vacío), elige el mensaje anterior al problema y Restore code. |\n| Se rompió algo y no sabes cuándo | \"Muéstrame los últimos 10 commits en lenguaje simple y dime cuál crees que lo rompió. Propón revertirlo con un commit nuevo y espera mi OK.\" |\n| Probaste algo en una rama y no te gustó | \"Vuelve a main y dime si la rama [NOMBRE] se puede borrar sin perder nada que esté en main.\" |\n| Subiste una clave por error | \"Saca la clave del código y pásala a .env, deja de rastrear el archivo si hace falta y dime en qué servicio tengo que generar una nueva.\" Después genera la clave nueva tú y anula la vieja. |\n| La web publicada en Vercel se rompió | En el panel del proyecto, Instant Rollback en la tarjeta de Production Deployment. Después arregla en el código y, cuando esté listo, promueve la versión nueva para que los push vuelvan a publicarse solos. |\n| GitHub rechazó la subida | \"El push fue rechazado con este mensaje: [PEGAR]. Explícame qué pasa y propón cómo resolverlo sin forzar nada.\" |\n\n## Tres reglas\n\n1. Commit cada vez que algo funciona. Muchos chicos mejor que uno gigante.\n2. /rewind es para deshacer rápido dentro de la sesión. Git es el historial permanente.\n3. Ni público ni privado: ningún repositorio tiene que tener claves adentro.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

<script>var GUIA = {"slug": "proyectos-y-cache-para-gastar-menos", "post": "PROYECTO", "t": "Proyectos y caché: sube tu material una vez y gasta menos", "d": "Por qué el material que dejas en un Proyecto cuenta menos cuando lo reutilizas, cuándo deja de contar menos, qué es el modo RAG y qué conviene subir y qué no.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "La idea en una línea", "p": ["Si vas a usar el mismo material muchas veces (tu lista de precios, tus políticas, tu guía de marca), no lo pegues en cada chat: súbelo una vez a un Proyecto.", "Un Proyecto es un espacio con su propio historial de chats, sus archivos (la base de conocimiento, que en la app se llama project knowledge) y sus instrucciones. Cada chat nuevo adentro ya arranca con eso.", "Para armar proyectos por área de tu negocio está la guía \"Proyectos de Claude: un asistente por área de tu negocio\". Aquí nos enfocamos en cómo usarlos para gastar menos."]}, {"h": "Por qué cuenta menos: la caché", "p": ["El centro de ayuda lo dice así: el contenido de los proyectos queda en caché y cuenta menos contra tus límites cuando se reutiliza.", "La caché es como una memoria de corto plazo del sistema: en vez de procesar todo tu material desde cero en cada mensaje, el sistema retoma desde lo que ya procesó. Por eso el material fijo de un Proyecto conviene más que pegar el mismo texto una y otra vez."]}, {"h": "Cuándo vence la caché", "p": ["La caché vence después de un rato sin uso. Si vuelves a un proyecto después de una pausa larga, tu primer mensaje cuenta todo ese material completo otra vez.", "La ayuda de la app no dice cuánto dura exactamente, así que no planifiques con un número. Lo práctico es esto:"], "lista": ["Trabaja por bloques: si tienes cinco consultas sobre el mismo proyecto, hazlas seguidas en vez de una a la mañana, otra al mediodía y otra a la noche.", "Junta preguntas: si puedes, manda varias consultas relacionadas en un mismo mensaje.", "No te asustes por el primer mensaje: que el primero después de una pausa gaste más es normal."]}, {"h": "El modo RAG: proyectos más grandes", "p": ["En los planes pagos (Pro, Max, Ultra, Team y Enterprise), cuando el material del proyecto se acerca al límite de lo que Claude puede tener en la cabeza a la vez (la ventana de contexto), se activa solo el modo RAG. Según Anthropic, eso amplía la capacidad del proyecto hasta 10 veces.", "En modo RAG, Claude no carga todo el material de una: usa una herramienta de búsqueda dentro de tu proyecto (project knowledge search) y trae solo las partes que necesita para responder. No tienes que configurar nada, y si después el material baja, puede volver a trabajar como antes."], "lista": ["Nombres claros: ponle a cada archivo un nombre que diga qué es (por ejemplo, precios-2026.pdf y no doc-final-v3.pdf).", "Nombra el documento: cuando preguntes, di en qué archivo buscar (\"según politicas-de-cambio.pdf...\").", "Un tema por proyecto: agrupa en un mismo proyecto lo que va junto."]}, {"h": "Qué conviene subir y qué no", "lista": ["Sí: lo que consultas seguido y cambia poco (precios, políticas, procesos, guía de marca, preguntas frecuentes).", "Sí: versiones finales y en texto. En los archivos de proyecto Claude extrae solo el texto, salvo en los PDF, donde también puede mirar lo visual.", "Sí: resúmenes que ya armaste de documentos largos (lo explicamos en la guía de archivos de esta categoría).", "No: borradores y versiones viejas. Si hay dos versiones de lo mismo, Claude puede mezclarlas.", "No: archivos que vas a usar una sola vez. Esos van en el chat.", "No: lo que ya no usas. La ayuda recomienda sacar los archivos que no usas y mantener las instrucciones del proyecto cortas."], "aviso": "Cada archivo de proyecto puede pesar hasta 30 MB."}, {"h": "Ármalo y mantenlo en orden", "pasos": ["Entra a Projects (Proyectos) en la barra lateral, o a claude.ai/projects, y toca + New Project (nuevo proyecto).", "Ponle nombre y descripción. Claude no ve esos datos: son para ti.", "En el área de conocimiento del proyecto, a la derecha, toca + y sube tus archivos.", "Toca Set project instructions (instrucciones del proyecto), escribe reglas cortas y guarda con Save instructions.", "Una vez por mes, revisa qué archivos sobran o están viejos y sácalos."], "prompts": [{"t": "Revisión del proyecto", "c": "Mira los archivos de este proyecto y dime:\n1. Cuáles parecen repetidos o versiones viejas de otro.\n2. Cuáles no se relacionan con [PARA QUÉ USO ESTE PROYECTO].\n3. Si las instrucciones del proyecto tienen algo que sobra o se contradice.\nResponde en una lista corta. No cambies nada, solo recomienda."}]}], "faq": [{"q": "¿Puedo usar proyectos en el plan gratis?", "a": "Sí, hasta cinco proyectos. El modo RAG es solo para los planes pagos."}, {"q": "¿Lo que hablo en un chat del proyecto lo sabe el otro chat?", "a": "No por sí solo. Lo que quieres que todos los chats sepan tiene que estar en la base de conocimiento del proyecto. Cada proyecto tiene además su propia memoria, separada de la de otros proyectos. Y en los planes pagos, si tienes prendido Search and reference chats, puedes pedirle a Claude que busque en los otros chats de ese mismo proyecto."}, {"q": "¿Cuánto dura la caché?", "a": "La ayuda de la app no lo dice. Solo aclara que vence después de un rato sin uso, y que al volver el material cuenta completo otra vez."}, {"q": "¿Usar proyectos me da más uso gratis?", "a": "No. Los proyectos usan tu plan como cualquier otra cosa. Lo que ganas es que el material reutilizado cuenta menos mientras está en caché."}], "fuentes": ["https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects", "https://support.claude.com/en/articles/8241126-upload-files-to-claude", "https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context", "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"], "ejemplo": {"titulo": "Ejemplo resuelto: una casa de repuestos que deja de pegar la lista de precios en cada chat", "negocio": "Ejemplo inventado: una casa de repuestos de moto en Asunción, Paraguay. La atienden el dueño y dos vendedores, y venden en el local y por WhatsApp.", "punto_de_partida": "Cada vez que un vendedor quería redactar una respuesta, pegaba en un chat nuevo la lista de precios entera y las condiciones de garantía. Se quedaban sin uso a media tarde.", "pasos": ["Juntaron el material que usan todos los días: la lista de precios, la política de garantía y cambios, y las preguntas frecuentes. Borraron dos listas viejas que seguían dando vueltas.", "Renombraron los archivos con la tabla del kit: precios-2026-11.pdf, garantia-y-cambios.pdf y preguntas-frecuentes.txt.", "En Projects tocaron + New Project, le pusieron \"Mostrador\" y una descripción para ellos (Claude no la ve).", "En el área de conocimiento, a la derecha, tocaron + y subieron los tres archivos.", "Tocaron Set project instructions, pegaron la plantilla del kit completada (fuente de precios, tono, lo que nunca se promete) y guardaron con Save instructions.", "Cambiaron la forma de trabajar: juntan las consultas de WhatsApp y las responden en un bloque a media mañana y otro a la tarde, cada uno en un chat del Proyecto. Si tienen tres consultas parecidas, las mandan en un mismo mensaje.", "Cuando el dueño actualiza precios, sube el archivo nuevo y borra el viejo en el mismo momento. Una vez por mes hacen la checklist del kit."], "resultado": "Quedó un Proyecto con una sola lista de precios vigente, reglas cortas y una rutina de trabajo por bloques. Los vendedores abren chats cortos sin pegar nada y el material fijo se reutiliza en vez de cargarse de nuevo en cada conversación."}, "si_falla": [{"sintoma": "Claude responde con un precio viejo.", "solucion": "Casi siempre hay dos versiones del mismo archivo en el Proyecto. Borra la vieja, deja una sola con la fecha en el nombre y en las instrucciones nombra ese archivo como única fuente de precios."}, {"sintoma": "Volví al Proyecto después del almuerzo y el primer mensaje gastó mucho más que los demás.", "solucion": "Es normal: la caché venció por la pausa y ese primer mensaje cuenta el material completo otra vez. Los siguientes vuelven a contar menos mientras sigas trabajando. Junta las consultas en bloques para pagar ese primer mensaje menos veces."}, {"sintoma": "En un Proyecto grande Claude dice que no encuentra algo que está en un archivo.", "solucion": "Con mucho material se activa el modo RAG y Claude busca partes con project knowledge search en vez de leer todo. Nombra el archivo en la pregunta (\"según garantia-y-cambios.pdf...\"), usa nombres de archivo claros y, si el Proyecto mezcla temas, sepáralo en dos."}, {"sintoma": "No puedo subir un archivo al Proyecto.", "solucion": "Cada archivo de Proyecto puede pesar hasta 30 MB. Si es más grande, pártelo o sube un resumen de trabajo en texto. Un PDF escaneado de muchas páginas suele pesar más de lo que parece."}, {"sintoma": "En el plan gratis no me deja crear otro Proyecto.", "solucion": "El plan gratis tiene un máximo de cinco proyectos. Archiva o borra uno que no uses, o junta en uno solo temas que van de la mano."}], "kit": [{"archivo": "instrucciones-proyecto-cortas-plantilla.md", "que_es": "Plantilla de instrucciones de Proyecto que entra en una pantalla, con la regla de una sola fuente de precios y una tabla para nombrar los archivos. Complétala y pégala en Set project instructions.", "contenido": "# Instrucciones cortas para un Proyecto (plantilla)\n\nPega el bloque de abajo en Set project instructions y guarda con Save instructions. Completa los corchetes y borra lo que no uses. La idea es que entre en una pantalla: si crece mucho, pasa el detalle a un archivo del Proyecto.\n\n---\n\nEres el asistente de [NEGOCIO] para [ÁREA: ventas, atención, administración].\n\nCon quién hablo: [quién usa este Proyecto y para qué].\n\nFuentes:\n- Precios y condiciones: solo de [precios-AAAA-MM.pdf]. Si un precio no está ahí, dilo y no lo estimes.\n- Políticas: [politicas-cambios-y-envios.pdf].\n- Si dos archivos dicen cosas distintas, avísame y no elijas tú.\n\nTono: [por ejemplo, cercano, con voseo, frases cortas, sin emojis].\n\nNunca: [prometer plazos de entrega, dar descuentos, compartir datos de otros clientes].\n\nFormato de respuesta: [por ejemplo, primero la respuesta en 2 líneas, después el detalle].\n\n---\n\n## Cómo nombrar los archivos del Proyecto\n\nUn nombre que diga qué es y de cuándo. Así la búsqueda dentro del Proyecto encuentra mejor y tú ves de un vistazo qué está viejo.\n\n| En vez de | Usa |\n|---|---|\n| lista final v3.pdf | precios-2026-11.pdf |\n| doc nuevo.docx | politicas-cambios-y-envios.docx |\n| resumen.txt | resumen-contrato-proveedor-abc.txt |\n\nReglas:\n- Un archivo por tema.\n- Una sola versión de cada cosa. Cuando subís la nueva, borra la vieja.\n- En minúsculas, con guiones y la fecha al final si cambia seguido.\n"}, {"archivo": "checklist-mensual-proyecto-claude.md", "que_es": "Checklist para revisar una vez por mes los archivos, las instrucciones y la forma de uso de un Proyecto, con el prompt de revisión incluido.", "contenido": "# Checklist mensual de un Proyecto de Claude\n\nÚsala una vez por mes, en un bloque de trabajo (así no pagas la caché dos veces). Tarda poco si el Proyecto está ordenado.\n\n## 1. Archivos\n- [ ] Hay una sola versión de cada documento. Las viejas, afuera.\n- [ ] Cada nombre dice qué es y de cuándo (por ejemplo, precios-2026-11.pdf).\n- [ ] No quedan archivos de una sola vez (un mail puntual, una captura). Esos van en el chat, no en el Proyecto.\n- [ ] Los documentos largos que se consultan seguido están como resumen de trabajo en texto, y el original se sube solo si hace falta.\n- [ ] Ningún archivo supera los 30 MB.\n\n## 2. Instrucciones\n- [ ] Entran en una pantalla.\n- [ ] No repiten lo que ya está en un archivo.\n- [ ] No se contradicen (por ejemplo, \"responde corto\" y \"explica todo en detalle\").\n- [ ] Nombran el archivo que es la fuente de precios o datos.\n\n## 3. Uso\n- [ ] Las consultas del mismo tema las hago seguidas, en bloque.\n- [ ] Junto preguntas relacionadas en un solo mensaje.\n- [ ] Si veo que Claude usa el buscador del Proyecto (project knowledge search), al preguntar nombro el archivo donde buscar.\n\n## 4. Prompt de revisión\nPega esto en un chat nuevo dentro del Proyecto:\n\nMira los archivos de este proyecto y dime:\n1. Cuáles parecen repetidos o versiones viejas de otro.\n2. Cuáles no se relacionan con [PARA QUÉ USO ESTE PROYECTO].\n3. Si las instrucciones del proyecto tienen algo que sobra o se contradice.\nResponde en una lista corta. No cambies nada, solo recomienda.\n\n## 5. Anota\nFecha de la revisión: [FECHA]\nQué saqué: [ARCHIVOS]\nQué actualicé: [ARCHIVOS O INSTRUCCIONES]\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "las-formas-de-usar-claude", "t": "Las formas de usar Claude: cuál te sirve para cada cosa", "d": "Chat, Proyectos, app de escritorio, Cowork, Claude Code, conectores y Claude en Chrome. Qué es cada uno, qué plan necesitás y cuándo conviene.", "tema": "Empezar", "min": 9, "secciones": [{"h": "El chat: donde empieza todo", "p": ["Es la conversación de siempre, en claude.ai, en la app de escritorio o en el celular. Está en todos los planes, incluido el gratis.", "Sirve para casi todo lo del día a día: escribir, resumir, pensar una idea, revisar un texto o analizar un archivo que le subís."]}, {"h": "Proyectos: un espacio por tema", "p": ["Un Proyecto junta chats, documentos e instrucciones de un mismo tema. Todo lo que subís al conocimiento del proyecto lo usa en cada chat de adentro, así no lo volvés a explicar.", "Están en todos los planes. En el gratis podés tener hasta cinco."]}, {"h": "La app de escritorio y Cowork", "p": ["La app se baja de claude.ai/download y funciona en macOS 13 o más nuevo, Windows 10 o más nuevo y, en beta, en algunas versiones de Linux.", "Además del chat, en los planes pagos trae Cowork: le describís una tarea de varios pasos y Claude la hace trabajando directo con los archivos de las carpetas que le habilitás. También trae Claude Code."], "aviso": "En Cowork, Claude puede hacer acciones reales sobre tus archivos. Dale acceso solo a las carpetas que necesita y dejá la app abierta mientras trabaja."}, {"h": "Claude Code: para construir", "p": ["Es la versión de Claude que lee y edita archivos y corre comandos. Pensado para programar, pero también para armar herramientas sin escribir el código vos.", "Lo usás desde la terminal, desde editores como VS Code, desde la pestaña Code de la app de escritorio o desde el navegador en claude.ai/code. La mayoría de estas opciones piden una suscripción paga."]}, {"h": "Conectores y Claude en Chrome", "lista": ["Conectores: conectan Claude con tus apps (Gmail, Google Calendar, Google Drive y muchas más) para que lea y trabaje con tus datos. Los conectores web están en todos los planes.", "Claude en Chrome: una extensión para el Chrome de computadora que deja a Claude trabajar en páginas web con vos, desde el panel lateral. Es para planes pagos."], "aviso": "Claude en Chrome actúa en páginas web en tu nombre. Anthropic avisa que, aun con protecciones, tiene riesgos: leé su guía de uso seguro antes de usarlo."}, {"h": "Cuál uso", "lista": ["Una pregunta o un texto suelto: el chat.", "Algo que vas a repetir con el mismo material (clientes, cursos, contenido): un Proyecto.", "Una tarea larga con archivos de tu compu (ordenar carpetas, armar un informe con varios documentos): Cowork.", "Construir una web, un script o una herramienta: Claude Code.", "Trabajar con tu mail, tu agenda o tus documentos: conectores.", "Hacer algo adentro de una página web (completar, comparar, navegar): Claude en Chrome."], "prompts": [{"t": "Que Claude te recomiende", "c": "Quiero hacer esto: [DESCRIBÍ LA TAREA].\nTengo el plan [GRATIS / PAGO] y uso [COMPU CON WINDOWS / MAC / SOLO CELULAR].\n¿Me conviene hacerlo en un chat, en un Proyecto, en Cowork, en Claude Code, con un conector o con Claude en Chrome? Explicame por qué en 3 líneas y dame los primeros pasos."}]}], "faq": [{"q": "¿Necesito saber programar para Claude Code?", "a": "No para empezar: le hablás en español. Pero conviene arrancar por el chat y los Proyectos, y pasar a Claude Code cuando quieras construir algo."}, {"q": "¿Cowork funciona en el celular?", "a": "No. Cowork corre en la app de escritorio de macOS o Windows."}, {"q": "¿Claude en Chrome sirve en otros navegadores?", "a": "No. Solo en Google Chrome de computadora. Otros navegadores basados en Chromium y el celular no están soportados."}], "fuentes": ["https://support.claude.com/en/articles/10065433-install-claude-desktop", "https://support.claude.com/articles/13345190", "https://code.claude.com/docs/en/overview", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome", "https://support.claude.com/en/articles/9519177"]};</script>

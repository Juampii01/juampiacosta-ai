<script>var GUIA = {"slug": "las-formas-de-usar-claude", "t": "Las formas de usar Claude: cuál te sirve para cada cosa", "d": "Chat, Proyectos, app de escritorio, Cowork, Claude Code, conectores y Claude en Chrome. Qué es cada uno, qué plan necesitas y cuándo conviene.", "tema": "Primeros pasos", "min": 9, "secciones": [{"h": "El chat: donde empieza todo", "p": ["Es la conversación de siempre, en claude.ai, en la app de escritorio o en el celular. Está en todos los planes, incluido el gratis.", "Sirve para casi todo lo del día a día: escribir, resumir, pensar una idea, revisar un texto o analizar un archivo que le subes."]}, {"h": "Proyectos: un espacio por tema", "p": ["Un Proyecto junta chats, documentos e instrucciones de un mismo tema. Todo lo que subes al conocimiento del proyecto lo usa en cada chat de adentro, así no lo vuelves a explicar.", "Están en todos los planes. En el gratis puedes tener hasta cinco."]}, {"h": "La app de escritorio y Cowork", "p": ["La app se baja de claude.ai/download y funciona en macOS 13 o más nuevo, Windows 10 o más nuevo y, en beta, en algunas versiones de Linux.", "Además del chat, en los planes pagos trae Cowork: le describes una tarea de varios pasos y Claude la hace. Desde la app de escritorio puede trabajar directo con los archivos de las carpetas que le conectas. Cowork también está en la web y en el celular (en Team, en beta; en Enterprise, si el owner lo habilita). La app también trae Claude Code."], "aviso": "En Cowork, Claude puede hacer acciones reales sobre tus archivos. Dale acceso solo a las carpetas que necesita. Si la tarea usa archivos de tu computadora, deja la app de escritorio abierta: si la cierras, la sesión sigue corriendo pero no llega a tus archivos."}, {"h": "Claude Code: para construir", "p": ["Es la versión de Claude que lee y edita archivos y corre comandos. Pensado para programar, pero también para armar herramientas sin escribir el código tú.", "Lo usas desde la terminal, desde editores como VS Code, desde la pestaña Code de la app de escritorio o desde el navegador en claude.ai/code. La mayoría de estas opciones piden una suscripción paga."]}, {"h": "Conectores y Claude en Chrome", "lista": ["Conectores: conectan Claude con tus apps (Gmail, Google Calendar, Google Drive y muchas más) para que lea y trabaje con tus datos. Los conectores web están en todos los planes.", "Claude en Chrome: una extensión para el Chrome de computadora que deja a Claude trabajar en páginas web contigo, desde el panel lateral. Es para planes pagos."], "aviso": "Claude en Chrome actúa en páginas web en tu nombre. Anthropic avisa que, aun con protecciones, tiene riesgos: lee su guía de uso seguro antes de usarlo."}, {"h": "Cuál uso", "lista": ["Una pregunta o un texto suelto: el chat.", "Algo que vas a repetir con el mismo material (clientes, cursos, contenido): un Proyecto.", "Una tarea larga con archivos de tu computadora (ordenar carpetas, armar un informe con varios documentos): Cowork.", "Construir una web, un script o una herramienta: Claude Code.", "Trabajar con tu mail, tu agenda o tus documentos: conectores.", "Hacer algo adentro de una página web (completar, comparar, navegar): Claude en Chrome."], "prompts": [{"t": "Que Claude te recomiende", "c": "Quiero hacer esto: [DESCRIBE LA TAREA].\nTengo el plan [GRATIS / PAGO] y uso [COMPUTADORA CON WINDOWS / MAC / SOLO CELULAR].\n¿Me conviene hacerlo en un chat, en un Proyecto, en Cowork, en Claude Code, con un conector o con Claude en Chrome? Explícame por qué en 3 líneas y dame los primeros pasos."}]}], "faq": [{"q": "¿Necesito saber programar para Claude Code?", "a": "No para empezar: le hablas en español. Pero conviene arrancar por el chat y los Proyectos, y pasar a Claude Code cuando quieras construir algo."}, {"q": "¿Cowork funciona en el celular?", "a": "Sí, en los planes pagos. Abre la app de Claude para iOS o Android actualizada y elige Cowork en la caja de mensaje (si tienes la experiencia nueva de Claude no hay opción para elegir: le describes la tarea en cualquier chat). Para trabajar con archivos de tu computadora, la app de escritorio tiene que estar abierta en esa computadora."}, {"q": "¿Claude en Chrome sirve en otros navegadores?", "a": "No. Solo en Google Chrome de computadora. Otros navegadores basados en Chromium y el celular no están soportados."}], "fuentes": ["https://support.claude.com/en/articles/10065433-install-claude-desktop", "https://support.claude.com/articles/13345190", "https://code.claude.com/docs/en/overview", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome", "https://support.claude.com/en/articles/9519177", "https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile", "https://support.claude.com/en/articles/13345190-get-started-with-cowork"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio contable chico elige qué usar para cada tarea", "negocio": "Ejemplo inventado: un estudio contable en Mendoza capital, con el contador titular, una contadora y una administrativa. Atienden monotributistas y pymes, y tienen el plan Pro en dos cuentas, con computadoras con Windows.", "punto_de_partida": "Usaban solo el chat para todo y pegaban una y otra vez el mismo instructivo de vencimientos. Las carpetas de comprobantes de cada cliente se ordenaban a mano a fin de mes.", "pasos": ["Pasaron cada tarea frecuente por la hoja de decisión del kit y anotaron la forma elegida para cada una.", "Para responder dudas de clientes armaron un Proyecto \"Consultas de clientes\": subieron el instructivo de vencimientos y las preguntas frecuentes, y pegaron en Set project instructions que solo responda con esos archivos y diga \"lo confirmo\" si algo no está.", "Conectaron Google Calendar en Customize → Connectors y probaron el pedido del kit para encontrar huecos libres antes de dar turnos.", "Instalaron la app de escritorio desde claude.ai/download y probaron Cowork con una sola carpeta de prueba, copia de la de un cliente, con el pedido del kit que arma una planilla sin borrar ni mover nada.", "Revisaron la planilla contra la carpeta y recién ahí conectaron las carpetas reales, una por cliente, dejando la app abierta mientras trabaja.", "Para cargar datos en páginas web decidieron no usar Claude en Chrome por ahora: tocan cuentas de clientes y prefieren leer primero la guía de uso seguro.", "Dejaron Claude Code para más adelante, cuando quieran armar una herramienta propia de vencimientos."], "resultado": "Cada tarea tiene su forma: el chat para lo suelto, un Proyecto para las consultas, el conector de agenda para turnos y Cowork para ordenar comprobantes. La hoja de decisión quedó impresa al lado de la computadora para las tareas nuevas."}, "si_falla": [{"sintoma": "No veo la opción Cowork en la caja de mensaje.", "solucion": "Revisa tu plan: Cowork no está en Free. Si tienes plan pago, actualiza la app. Si tienes la experiencia nueva de Claude, no hay opción para elegir: le describes la tarea en cualquier conversación. En Enterprise, la web y el celular dependen de que el owner lo habilite."}, {"sintoma": "Cowork dice que no puede acceder a mis archivos.", "solucion": "Claude solo llega a las carpetas que conectaste y solo a través de la app de escritorio abierta. Abre la app en esa computadora, revisa que la carpeta esté conectada y vuelve a pedirle la tarea."}, {"sintoma": "Instalé la extensión de Claude en Chrome en Edge o Brave y no funciona.", "solucion": "No está soportada en otros navegadores basados en Chromium ni en el celular. Instálala desde Chrome Web Store en Google Chrome de computadora, con un plan pago."}, {"sintoma": "En la cuenta de la empresa no aparece el conector que necesito.", "solucion": "En Team y Enterprise, un Owner o Primary Owner tiene que habilitar el conector para la organización. Después cada persona lo conecta con su propia cuenta. En Team puedes pedirlo desde la lista de conectores."}, {"sintoma": "La app de escritorio no se instala en Linux.", "solucion": "En Linux está en beta y solo para Ubuntu 22.04 LTS o más nuevo y Debian 12 o más nuevo, en x64 o arm64. En otra distribución, usa claude.ai en el navegador."}], "kit": [{"archivo": "hoja-de-decision-formas-de-claude.md", "que_es": "Seis preguntas en orden para decidir si una tarea va en el chat, un Proyecto, un conector, Cowork, Claude en Chrome o Claude Code, con una ficha para anotar antes de arrancar.", "contenido": "# Hoja de decisión: qué forma de Claude uso para esta tarea\n\nResponde las preguntas en orden. La primera que te da \"sí\" es tu punto de partida. Si dudas entre dos, empieza por la más simple: siempre puedes pasar a la siguiente.\n\n## 1. ¿Es algo de una sola vez?\nUna pregunta, un texto para revisar, un archivo para resumir.\n- Sí → **Chat**. Todos los planes, en la web, la app de escritorio o el celular.\n\n## 2. ¿Lo vas a repetir con el mismo material?\nLos mismos clientes, el mismo curso, la misma lista de precios, el mismo manual.\n- Sí → **Proyecto**. Sube el material una vez y escribe las instrucciones del proyecto. Todos los planes (en Free, hasta cinco proyectos).\n\n## 3. ¿Necesita datos de tu mail, tu agenda o tus documentos en la nube?\n- Sí → **Conectores** (Customize → Connectors). Los conectores web están en todos los planes. En Team y Enterprise, el owner los tiene que habilitar primero.\n\n## 4. ¿Es una tarea de varios pasos que quieres delegar y que te entreguen hecha?\nArmar un informe con varios archivos, ordenar carpetas, preparar algo que lleva su tiempo.\n- Sí → **Cowork**. Planes pagos. En la app de escritorio puede trabajar con las carpetas de tu computadora que le conectas; en la web y el celular también está (en Team en beta, en Enterprise si el owner lo habilita).\n- ¿Usa archivos de tu computadora? Deja la app de escritorio abierta mientras trabaja.\n\n## 5. ¿Hay que hacer algo adentro de una página web?\nCompletar un formulario, comparar productos, navegar varias páginas.\n- Sí → **Claude en Chrome**. Planes pagos, solo Google Chrome de computadora. Lee antes la guía de uso seguro.\n\n## 6. ¿Quieres construir algo que quede funcionando?\nUna web, un script, una automatización, una herramienta interna.\n- Sí → **Claude Code**. Desde la pestaña Code de la app de escritorio, desde claude.ai/code, desde la terminal o desde VS Code y JetBrains. La mayoría pide una suscripción paga.\n\n## Antes de arrancar, anota\n\n- Tarea: [QUÉ QUIERES LOGRAR]\n- Forma elegida: [CHAT / PROYECTO / CONECTOR / COWORK / CHROME / CLAUDE CODE]\n- Qué le tengo que dar: [ARCHIVOS, ACCESOS, EJEMPLOS]\n- Qué no tiene que tocar: [CARPETAS, CUENTAS, DATOS SENSIBLES]\n- Cómo me doy cuenta de que salió bien: [CRITERIO]\n"}, {"archivo": "primer-pedido-para-cada-forma-de-claude.md", "que_es": "Pack de seis pedidos cortos y seguros para probar cada forma de Claude con tu propio trabajo en pocos minutos.", "contenido": "# Primer pedido para probar cada forma de Claude\n\nUn pedido corto para cada forma, pensado para que en 5 minutos veas qué hace cada una con tu propio trabajo. Cambia los corchetes.\n\n## Chat\nTe pego un texto que escribí para [CLIENTE O SITUACIÓN]. Corrígelo para que sea más claro y más corto, sin cambiar lo que dice. Después dime en 3 líneas qué cambiaste.\n[PEGA EL TEXTO]\n\n## Proyecto\n(Primero crea el proyecto, sube tu lista de precios o servicios y pega esto en Set project instructions.)\nEres el asistente de [NEGOCIO]. Responde solo con los datos de los archivos de este proyecto. Si algo no está, di \"lo confirmo\" en vez de inventarlo. Escribe en voseo, corto y sin signos de exclamación.\n\nPrimer chat adentro del proyecto:\nUn cliente pregunta: \"[PEGA UNA CONSULTA REAL]\". Arma la respuesta.\n\n## Conectores\n(Con Google Calendar conectado.)\nMira mi agenda de la semana que viene y dime qué días tengo al menos dos horas libres seguidas a la mañana. No cambies nada en la agenda.\n\n## Cowork\nEn la carpeta [NOMBRE DE LA CARPETA] hay [QUÉ HAY: FACTURAS, FOTOS, DOCUMENTOS]. Arma una planilla con una fila por archivo: nombre, fecha, de qué se trata y si le falta algo. No borres ni muevas ningún archivo. Antes de empezar, cuéntame el plan.\n\n## Claude en Chrome\nEn esta página hay una lista de [PRODUCTOS O PROVEEDORES]. Arma una tabla comparando [3 CRITERIOS]. No completes formularios ni hagas clic en botones de compra.\n\n## Claude Code\nQuiero una página web de una sola pantalla para [NEGOCIO], con nombre, qué hacemos, horarios y un botón para escribir por WhatsApp al [NÚMERO]. Antes de escribir código, explícame qué archivos vas a crear y pregúntame lo que te falte.\n"}], "verificada": "2026-11-08", "cat": "primeros-pasos", "parte": "aprende"};</script>

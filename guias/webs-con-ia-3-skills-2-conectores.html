<script>var GUIA = {"slug": "webs-con-ia-3-skills-2-conectores", "t": "Páginas web con IA que se ven profesionales: 3 skills y 2 conectores", "d": "El diseñador, el rediseño, el animador, Figma para revisar y el tester: el setup para hacer webs con Claude Code que puedas cobrar bien.", "tema": "Claude Code", "min": 8, "ficha": [["Qué es", "El setup para hacer webs con Claude Code que se vean profesionales: 3 skills de diseño y 2 conectores."], ["Para quién", "Quien vende webs hechas con IA y quiere cobrarlas bien."], ["Necesitás", "Claude Code, las skills taste-skill, impeccable y las de Emil Kowalski, y los conectores de Figma y Playwright."], ["Ojo", "Revisá siempre los textos y datos del cliente antes de entregar."], ["Incluye", "5 prompts: instalar las skills y los 4 pasos del flujo."]], "secciones": [{"h": "Las 5 piezas", "lista": ["El diseñador: taste-skill, dirección de arte para que Claude deje de lado la landing genérica de siempre. <a href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener\">github.com/Leonxlnx/taste-skill ↗<\/a>", "El rediseño: impeccable, 24 comandos (como polish, critique o audit). Le señalás una parte de la web, decís qué no te gusta y la rehace. <a href=\"https://github.com/pbakaus/impeccable\" target=\"_blank\" rel=\"noopener\">github.com/pbakaus/impeccable ↗<\/a>", "El animador: las skills de Emil Kowalski, movimiento y transiciones como las de las webs de producto más cuidadas. <a href=\"https://github.com/emilkowalski/skills\" target=\"_blank\" rel=\"noopener\">github.com/emilkowalski/skills ↗<\/a>", "Figma: el servidor MCP oficial de Figma. Claude Code lee tus diseños y puede capturar la interfaz de tu web y mandarla a un archivo de Figma para revisarla. <a href=\"https://developers.figma.com/docs/figma-mcp-server/remote-server-installation\" target=\"_blank\" rel=\"noopener\">developers.figma.com ↗<\/a>", "El tester: Playwright MCP de Microsoft. Claude abre tu web en un navegador real, la recorre y arregla lo que falla. <a href=\"https://github.com/microsoft/playwright-mcp\" target=\"_blank\" rel=\"noopener\">github.com/microsoft/playwright-mcp ↗<\/a>"]}, {"h": "Instalar las 3 skills", "prompts": [{"t": "Skills de diseño", "c": "Instalá estas tres skills en Claude Code siguiendo el README de cada una: github.com/Leonxlnx/taste-skill, github.com/pbakaus/impeccable y github.com/emilkowalski/skills. Después decime qué comandos trae cada una."}], "lista": ["taste-skill, dentro de Claude Code: /plugin marketplace add Leonxlnx/taste-skill y /plugin install taste-skill@taste-skill", "impeccable, en la terminal desde la carpeta del proyecto: npx impeccable install; después, en Claude Code, /impeccable init", "Emil Kowalski, en la terminal: npx skills@latest add emilkowalski/skills"], "aviso": "taste-skill necesita Node 22 o más nuevo y Chrome, Edge o Chromium instalado."}, {"h": "Conectar Figma y el navegador", "pasos": ["Figma, en la terminal: claude plugin install figma@claude-plugins-official. Reiniciá Claude Code, escribí /plugin, entrá a Installed, elegí figma e iniciá sesión.", "Si no podés instalar plugins: claude mcp add --transport http figma https://mcp.figma.com/mcp y después, en Claude Code, /mcp para autenticarte.", "Playwright, en la terminal: claude mcp add playwright npx @playwright/mcp@latest", "Reiniciá Claude Code."]}, {"h": "El flujo de un proyecto", "prompts": [{"t": "1. Diseño", "c": "Diseñá la web de [NEGOCIO] para [PÚBLICO] con taste-skill: elegí una dirección de arte concreta (no genérica) y explicámela antes de construir."}, {"t": "2. Revisión en Figma", "c": "Mandá cada pantalla de la web a Figma para que el cliente pueda comentarla."}, {"t": "3. Pulido y movimiento", "c": "Pasá impeccable por toda la web y sumá animaciones sutiles con las skills de Emil Kowalski: entrada de secciones, botones y menús."}, {"t": "4. Prueba", "c": "Abrí la web con Playwright en celular y en escritorio, recorrela como un cliente, arreglá lo que falle y volvé a comprobar."}]}, {"h": "Lo que conviene saber", "lista": ["No hay un precio fijo: lo que cobres depende de tu mercado y de tu cartera de trabajos.", "Revisá siempre los textos y los datos del cliente antes de entregar.", "Usá fotos, íconos y tipografías con licencia; si te inspirás en la web de otro, no copies su marca."]}], "faq": [{"q": "¿Necesito Figma pago?", "a": "Para empezar, no necesariamente; revisá qué permite tu plan de Figma con su servidor MCP."}, {"q": "¿Necesito saber diseñar?", "a": "No hace falta, pero sí tener criterio para elegir: las skills te proponen y vos decidís qué queda."}], "usos": [{"e": "Diseñador", "c": "morado", "t": "taste-skill", "d": "Dirección de arte para que no salga lo de siempre."}, {"e": "Rediseño", "c": "azul", "t": "impeccable", "d": "Señalás una parte, decís qué no te gusta y lo arregla."}, {"e": "Revisión", "c": "verde", "t": "Figma", "d": "Las pantallas de tu web en Figma para revisarlas."}, {"e": "Tester", "c": "naranja", "t": "Playwright", "d": "Claude abre tu web en un navegador real y la prueba."}], "fuentes": ["https://github.com/Leonxlnx/taste-skill", "https://github.com/pbakaus/impeccable", "https://github.com/emilkowalski/skills", "https://developers.figma.com/docs/figma-mcp-server/remote-server-installation", "https://github.com/microsoft/playwright-mcp"]};</script>

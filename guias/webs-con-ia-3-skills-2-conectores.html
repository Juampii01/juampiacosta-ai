<script>var GUIA = {"slug": "webs-con-ia-3-skills-2-conectores", "post": "WEB", "t": "Páginas web con IA que se ven profesionales: 3 skills y 2 conectores", "d": "El diseñador, el rediseño, el animador, Figma para revisar y el tester: el setup para hacer webs con Claude Code que puedas cobrar bien.", "tema": "Claude Code", "min": 8, "ficha": [["Qué es", "El setup para hacer webs con Claude Code que se vean profesionales: 3 skills de diseño y 2 conectores."], ["Para quién", "Quien vende webs hechas con IA y quiere cobrarlas bien."], ["Necesitás", "Claude Code, las skills taste-skill, impeccable y las de Emil Kowalski, y los conectores de Figma y Playwright."], ["Ojo", "Revisá siempre los textos y datos del cliente antes de entregar."], ["Incluye", "5 prompts: instalar las skills y los 4 pasos del flujo."]], "secciones": [{"h": "Las 5 piezas", "lista": ["El diseñador: taste-skill, dirección de arte para que Claude deje de lado la landing genérica de siempre. <a href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener\">github.com/Leonxlnx/taste-skill ↗<\/a>", "El rediseño: impeccable, 24 comandos (como polish, critique o audit). Le señalás una parte de la web, decís qué no te gusta y la rehace. <a href=\"https://github.com/pbakaus/impeccable\" target=\"_blank\" rel=\"noopener\">github.com/pbakaus/impeccable ↗<\/a>", "El animador: las skills de Emil Kowalski, movimiento y transiciones como las de las webs de producto más cuidadas. <a href=\"https://github.com/emilkowalski/skills\" target=\"_blank\" rel=\"noopener\">github.com/emilkowalski/skills ↗<\/a>", "Figma: el servidor MCP oficial de Figma. Claude Code lee tus diseños y puede capturar la interfaz de tu web y mandarla a un archivo de Figma para revisarla. <a href=\"https://developers.figma.com/docs/figma-mcp-server/remote-server-installation\" target=\"_blank\" rel=\"noopener\">developers.figma.com ↗<\/a>", "El tester: Playwright MCP de Microsoft. Claude abre tu web en un navegador real, la recorre y arregla lo que falla. <a href=\"https://github.com/microsoft/playwright-mcp\" target=\"_blank\" rel=\"noopener\">github.com/microsoft/playwright-mcp ↗<\/a>"]}, {"h": "Instalar las 3 skills", "prompts": [{"t": "Skills de diseño", "c": "Instalá estas tres skills en Claude Code siguiendo el README de cada una: github.com/Leonxlnx/taste-skill, github.com/pbakaus/impeccable y github.com/emilkowalski/skills. Después decime qué comandos trae cada una."}], "lista": ["taste-skill, dentro de Claude Code: /plugin marketplace add Leonxlnx/taste-skill y /plugin install taste-skill@taste-skill", "impeccable, en la terminal desde la carpeta del proyecto: npx impeccable install (el instalador te ofrece sumar un hook de diseño que revisa cada archivo que toca Claude: aceptalo); reiniciá Claude Code y después corré /impeccable init", "Emil Kowalski, en la terminal: npx skills@latest add emilkowalski/skills"], "aviso": "taste-skill necesita Node 22 o más nuevo y Chrome, Edge o Chromium instalado."}, {"h": "Conectar Figma y el navegador", "pasos": ["Figma, en la terminal: claude plugin install figma@claude-plugins-official. Reiniciá Claude Code, escribí /plugin, entrá a Installed, elegí figma e iniciá sesión.", "Si no podés instalar plugins: claude mcp add --transport http figma https://mcp.figma.com/mcp y después, en Claude Code, /mcp para autenticarte.", "Playwright, en la terminal: claude mcp add playwright npx @playwright/mcp@latest", "Reiniciá Claude Code."]}, {"h": "El flujo de un proyecto", "prompts": [{"t": "1. Diseño", "c": "Diseñá la web de [NEGOCIO] para [PÚBLICO] con taste-skill: elegí una dirección de arte concreta (no genérica) y explicámela antes de construir."}, {"t": "2. Revisión en Figma", "c": "Levantá la web en un servidor local y capturá la interfaz en un archivo nuevo de Figma: cada pantalla y los estados importantes (menú abierto, formulario con error). Cuando termine, pasame el link del archivo para que el cliente lo comente."}, {"t": "3. Pulido y movimiento", "c": "Pasá /impeccable polish sección por sección, empezando por la primera pantalla, y decime qué cambiaste en cada una. Después sumá animaciones sutiles con las skills de Emil Kowalski (entrada de secciones, botones y menús) y revisalas con review-animations."}, {"t": "4. Prueba", "c": "Abrí la web con Playwright en celular y en escritorio, recorrela como un cliente, arreglá lo que falle y volvé a comprobar."}]}, {"h": "Lo que conviene saber", "lista": ["No hay un precio fijo: lo que cobres depende de tu mercado y de tu cartera de trabajos.", "Revisá siempre los textos y los datos del cliente antes de entregar.", "Usá fotos, íconos y tipografías con licencia; si te inspirás en la web de otro, no copies su marca."]}], "faq": [{"q": "¿Necesito Figma pago?", "a": "El servidor MCP de Figma funciona en todos los planes, pero con límites. Con un asiento View o Collab, las herramientas que leen tus diseños tienen un tope de 20 llamadas por mes, y el plan Starter no tiene el cupo diario de los planes pagos; con un asiento Dev o Full en Professional, Organization o Enterprise el tope es por día. Mandar la web a Figma es una función de escritura: Figma dice que es gratis durante la beta y que después va a cobrarse por uso, y que para escribir fuera de tus borradores hace falta un asiento Full."}, {"q": "¿Necesito saber diseñar?", "a": "No hace falta, pero sí tener criterio para elegir: las skills te proponen y vos decidís qué queda."}], "usos": [{"e": "Diseñador", "c": "morado", "t": "taste-skill", "d": "Dirección de arte para que no salga lo de siempre."}, {"e": "Rediseño", "c": "azul", "t": "impeccable", "d": "Señalás una parte, decís qué no te gusta y lo arregla."}, {"e": "Revisión", "c": "verde", "t": "Figma", "d": "Las pantallas de tu web en Figma para revisarlas."}, {"e": "Tester", "c": "naranja", "t": "Playwright", "d": "Claude abre tu web en un navegador real y la prueba."}], "fuentes": ["https://github.com/Leonxlnx/taste-skill", "https://github.com/pbakaus/impeccable", "https://github.com/emilkowalski/skills", "https://developers.figma.com/docs/figma-mcp-server/remote-server-installation", "https://github.com/microsoft/playwright-mcp", "https://developers.figma.com/docs/figma-mcp-server/rate-limits-access/", "https://help.figma.com/hc/en-us/articles/32132100833559-Guide-to-the-Figma-MCP-server", "https://code.claude.com/docs/en/mcp", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: la web de un estudio de pilates de barrio, de cero a entregada", "negocio": "Ejemplo inventado: un estudio de pilates reformer en Nueva Córdoba, Córdoba capital, con la dueña y dos instructoras. Hoy toman reservas por WhatsApp y tienen solo un perfil de Instagram. Quien hace la web es una freelancer que vende sitios hechos con Claude Code.", "punto_de_partida": "La dueña quiere una web donde se vean las clases, los horarios y un botón para escribir por WhatsApp. Las primeras pruebas de la freelancer sin skills salían con la misma landing de siempre: degradado violeta, tarjetas iguales y textos genéricos.", "pasos": ["En la primera reunión completó con la dueña la parte 1 del archivo brief-y-entrega-web-con-ia.md del kit: acción principal \"escribir por WhatsApp\", secciones (clases, horarios, el estudio, contacto), lo que no va (tienda, blog) y los datos de contacto exactos.", "Creó la carpeta del proyecto, copió el archivo mcp-web-con-ia.json del kit como .mcp.json en la raíz y abrió Claude Code ahí. Aprobó los dos servidores cuando Claude Code se lo pidió y entró a /mcp para autenticarse en Figma.", "Instaló las tres skills con los comandos de la guía. Para impeccable aceptó el hook de diseño, reinició Claude Code y corrió /impeccable init: respondió las preguntas sobre el público y quedó escrito el PRODUCT.md.", "Pegó el prompt 1 con el brief completo: \"Diseñá la web de un estudio de pilates reformer en Nueva Córdoba para mujeres de 25 a 50 que trabajan cerca...\". Claude le propuso una dirección de arte antes de construir; ella pidió cambiar la tipografía por una menos fría y recién ahí aprobó.", "Con el prompt 2 corregido levantó la web en local y capturó con la barra de Figma la home, la sección de horarios y el menú abierto en celular. Le mandó el link del archivo a la dueña, que dejó comentarios en Figma sobre una foto y un horario mal cargado.", "Con el prompt 3 pasó /impeccable polish primero por la primera pantalla y después por horarios, y le pidió a Claude que corrigiera los comentarios de Figma. Sumó animaciones de entrada suaves y las revisó con review-animations.", "Copió la skill prueba-web-playwright del kit en .claude/skills/ y corrió /prueba-web-playwright http://localhost:3000. El informe marcó como prioridad alta que el link de WhatsApp tenía el número sin código de país, y como media un texto cortado en celular. Aprobó los arreglos y Claude volvió a probar.", "Repasó la parte 2 del archivo de brief: la dueña aprobó los textos por WhatsApp, cambió dos fotos de stock por fotos propias del estudio y revisó /diff antes de publicar."], "resultado": "Quedó una web con una dirección de arte propia del estudio, revisada por la dueña en Figma, probada en celular y escritorio con un informe por escrito y con todos los datos de contacto confirmados. La freelancer se quedó con el .mcp.json, la skill de prueba y el brief para repetir el mismo proceso en el próximo cliente."}, "si_falla": [{"sintoma": "Figma corta con un aviso de límite de llamadas después de pocos pedidos.", "solucion": "Con asiento View o Collab, las herramientas de lectura tienen un tope de 20 llamadas por mes, y el plan Starter no tiene cupo diario. Pedile a Claude que lea solo el frame que necesitás (pegale el link con Copy link to selection) en vez de archivos enteros, o pasá a un asiento Dev o Full en un plan pago, que tiene cupo diario. Mandar la web a Figma no cuenta para ese límite."}, {"sintoma": "Claude dice que no puede mandar la interfaz a Figma o no aparece la barra de captura.", "solucion": "Revisá en /mcp que el servidor conectado sea el remoto (https://mcp.figma.com/mcp): el de escritorio no permite escribir en el lienzo ni mandar interfaces. Si el archivo de destino no es un borrador tuyo, necesitás un asiento Full. Y la web tiene que estar corriendo en local cuando pedís la captura."}, {"sintoma": "Playwright no abre el navegador y da un error de que Chrome no está instalado.", "solucion": "Por defecto usa Chrome. Instalá Google Chrome o volvé a registrar el servidor con otro navegador: claude mcp remove playwright y después claude mcp add playwright -- npx @playwright/mcp@latest --browser msedge (o firefox). El -- separa las opciones de Claude Code de las del servidor. Reiniciá Claude Code y revisá con claude mcp list que diga Connected."}, {"sintoma": "Los scripts de taste-skill fallan al arrancar o el chequeo final no puede abrir la página.", "solucion": "taste-skill necesita Node 22 o más nuevo (revisalo con node --version) y Chrome, Edge o Chromium. Si el navegador está en una carpeta rara, definí la variable CHROME_PATH con la ruta del ejecutable. ffmpeg es opcional: solo hace falta para fotos en WebP y el recorte para celular."}, {"sintoma": "Después de instalar impeccable, cada edición dispara chequeos o descargas aunque rechaces comandos.", "solucion": "Es el hook de diseño: los hooks corren por fuera de la aprobación del modelo y la primera edición puede bajar el motor de impeccable. Si algo anda raro, corré /impeccable doctor. Para una sesión sin hooks, arrancá con claude --settings '{\"disableAllHooks\": true}'."}], "kit": [{"archivo": "prueba-web-playwright/SKILL.md", "que_es": "Skill de Claude Code que recorre la web en escritorio y en celular con Playwright, como un cliente, y entrega un informe priorizado antes de tocar el código. Copiá la carpeta en .claude/skills/ del proyecto y usala con /prueba-web-playwright y la URL.", "contenido": "---\nname: prueba-web-playwright\ndescription: 'Recorre una web en navegador real con Playwright MCP, en celular y escritorio, como un cliente, e informa lo que falla antes de tocar código. Usala al pedir probar o revisar una web.'\ndisable-model-invocation: true\nargument-hint: [url de la web]\n---\n\n# Prueba de la web como cliente\n\nVas a probar la web que está en $ARGUMENTS usando las herramientas del servidor MCP de Playwright. Si no te pasaron una URL, preguntá cuál es (puede ser http://localhost:PUERTO o el link publicado). Si el servidor de Playwright no aparece entre tus herramientas, frená y decile al usuario que lo agregue con `claude mcp add playwright npx @playwright/mcp@latest` y reinicie Claude Code.\n\n## Reglas\n\n- Primero probás y anotás. No cambies ningún archivo hasta que el usuario apruebe el informe.\n- Usá solo datos de prueba inventados en los formularios (por ejemplo, prueba@ejemplo.com). Nunca mandes un formulario a un destino real del cliente sin preguntar.\n- Si algo no se puede comprobar (por ejemplo, que llegue un mail), marcalo como PENDIENTE DE PRUEBA MANUAL.\n\n## Recorrido\n\nHacelo dos veces: primero con la ventana en 1440 x 900 (escritorio) y después en 390 x 844 (celular), con la herramienta para cambiar el tamaño de la ventana.\n\n1. Carga: abrí la página de inicio. Anotá errores de la consola y recursos que no cargan (imágenes, tipografías).\n2. Primera pantalla: ¿se entiende en cinco segundos qué hace el negocio y qué tiene que hacer el visitante? ¿El botón principal se ve sin hacer scroll?\n3. Navegación: tocá cada link del menú y del pie. Anotá los que dan error, llevan a una página vacía o abren otra web sin avisar.\n4. Menú en celular: abrilo, navegá y cerralo. Revisá que no tape contenido ni quede trabado.\n5. Formularios: mandá uno vacío, uno con un mail mal escrito y uno completo. Anotá qué mensaje aparece en cada caso.\n6. Textos: buscá textos de relleno (lorem ipsum, [NOMBRE], \"Tu empresa\"), teléfonos o direcciones que parezcan inventados y faltas de ortografía.\n7. Contacto: revisá que los links de WhatsApp, teléfono y mail tengan el formato correcto (wa.me/..., tel:..., mailto:...).\n8. Desbordes: en celular, buscá textos cortados, elementos que se salen de la pantalla y scroll horizontal.\n\n## Informe\n\nEntregá una tabla con estas columnas: Prioridad (alta, media, baja), Dónde (página y sección), Qué pasa, Tamaño (escritorio, celular o ambos), Arreglo propuesto.\n\nAlta es lo que impide contactar o comprar, o lo que se ve roto. Media es lo que confunde. Baja es detalle visual.\n\nAl final preguntá: \"¿Arreglo las de prioridad alta y vuelvo a probar?\". Cuando el usuario diga que sí, arreglá, volvé a recorrer solo lo que tocaste y actualizá la tabla.\n"}, {"archivo": "mcp-web-con-ia.json", "que_es": "Configuración de los dos conectores (Playwright y Figma) para todo el proyecto. Copialo en la raíz del proyecto con el nombre .mcp.json; al abrir Claude Code te pide aprobar cada servidor y en /mcp te autenticás en Figma.", "contenido": "{\n  \"mcpServers\": {\n    \"playwright\": {\n      \"command\": \"npx\",\n      \"args\": [\"@playwright/mcp@latest\"]\n    },\n    \"figma\": {\n      \"type\": \"http\",\n      \"url\": \"https://mcp.figma.com/mcp\"\n    }\n  }\n}\n"}, {"archivo": "brief-y-entrega-web-con-ia.md", "que_es": "Plantilla de brief para la primera reunión con el cliente y checklist de entrega (textos, licencias, prueba, revisión). La parte 1 se pega junto al prompt de diseño; la parte 2 se tilda antes de entregar.", "contenido": "# Brief y entrega de una web hecha con Claude Code\n\nUsalo en dos momentos: antes de diseñar (la parte 1 la completás con el cliente en la primera reunión) y antes de entregar (la parte 2 la tildás vos).\n\n## Parte 1: brief del cliente\n\nPegale esta parte completa a Claude Code junto con el prompt de diseño del paso 1.\n\n- Negocio: [NOMBRE] - [RUBRO] - [CIUDAD Y BARRIO]\n- Qué vende o qué servicio da, en una frase: [...]\n- A quién le habla la web (quién es el cliente ideal): [...]\n- Qué tiene que hacer el visitante (una sola acción principal): [ESCRIBIR POR WHATSAPP / RESERVAR / PEDIR PRESUPUESTO / COMPRAR]\n- Secciones que sí o sí van: [INICIO, SERVICIOS, QUIÉNES SOMOS, CONTACTO...]\n- Lo que NO va en esta versión: [TIENDA ONLINE, BLOG, VARIOS IDIOMAS...]\n- Tres webs que le gustan y por qué (no para copiarlas, para entender el gusto): [...]\n- Lo que no quiere ver: [COLORES, ESTILOS, FRASES]\n- Logo y colores de marca: [TIENE / NO TIENE - DÓNDE ESTÁN LOS ARCHIVOS]\n- Fotos: [PROPIAS / HAY QUE CONSEGUIR CON LICENCIA]\n- Textos: [LOS PASA EL CLIENTE / LOS PROPONE CLAUDE Y EL CLIENTE APRUEBA]\n- Datos de contacto exactos: teléfono [...], WhatsApp [...], mail [...], dirección [...], horarios [...]\n- Quién aprueba del lado del cliente y por dónde: [NOMBRE - CANAL]\n- Cuántas vueltas de cambios incluye el trabajo: [NÚMERO ACORDADO]\n\n## Parte 2: checklist antes de entregar\n\nTextos y datos\n- [ ] El cliente aprobó por escrito todos los textos.\n- [ ] Teléfono, WhatsApp, mail, dirección y horarios coinciden con el brief, letra por letra.\n- [ ] No queda ningún texto de relleno ni corchetes.\n- [ ] No hay testimonios, cifras ni logos de clientes que el cliente no haya dado.\n\nLicencias\n- [ ] Cada foto es del cliente o tiene licencia que permite uso comercial. Anotaste de dónde salió cada una.\n- [ ] Las tipografías permiten uso web (por ejemplo, las de Google Fonts).\n- [ ] Ningún logo, nombre o texto de otra marca quedó en la web.\n\nPrueba\n- [ ] Corriste la skill prueba-web-playwright en escritorio y en celular y no quedan problemas de prioridad alta.\n- [ ] Probaste a mano, desde tu celular, el botón principal y el link de WhatsApp.\n- [ ] El formulario, si hay, llega al mail correcto (probado con un envío real acordado con el cliente).\n\nRevisión\n- [ ] El cliente comentó las pantallas en Figma (o por el canal acordado) y resolviste cada comentario.\n- [ ] Revisaste los cambios del código con /diff antes de publicar.\n\nEntrega\n- [ ] La web está publicada en la cuenta del cliente o la transferencia está acordada por escrito.\n- [ ] Le pasaste al cliente: link, accesos, qué incluye el mantenimiento y qué se cobra aparte.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

<script>var GUIA = {"slug": "panel-de-metricas-de-tu-negocio-con-claude", "t": "Panel de métricas de tu negocio con Claude", "d": "Subís tus datos de ventas y Claude te arma un panel visual o una planilla con los números que importan. Con el prompt listo y cómo no comerte errores.", "tema": "IA en tu negocio", "min": 9, "fichaNombre": "Panel de métricas", "ficha": [["Qué es", "Un panel con tus números clave, armado por Claude a partir de una exportación de tus datos."], ["Necesitás", "Claude con \"Crear y editar archivos\" activado y un CSV o Excel con tus ventas."], ["Dos caminos", "Un artifact (panel visual dentro de Claude) o una planilla de Excel descargable."], ["Qué no hace", "No se actualiza solo a partir de un archivo: si los datos cambian, volvés a subirlos."]], "secciones": [{"h": "Elegí tus 5 números", "p": ["Un panel con 30 gráficos no lo mira nadie. Antes de abrir Claude, decidí qué cinco números querés ver cada semana. Algunos que suelen servir:"], "lista": ["Ventas del período: total y comparado con el período anterior.", "Cantidad de ventas y ticket promedio: para saber si vendés más veces o más caro.", "Clientes nuevos y clientes que vuelven.", "Producto o servicio que más vende.", "De dónde vienen los clientes: si ya lo registrás (hay una guía sobre esto en la biblioteca)."]}, {"h": "Prepará los datos", "pasos": ["Exportá tus ventas desde tu sistema, tienda o planilla en CSV o Excel.", "Revisá que tenga una fila por venta y columnas claras: fecha, cliente, producto, cantidad, importe.", "Borrá columnas con datos sensibles que no hacen falta: documentos, teléfonos, direcciones.", "En Claude andá a Settings → Capabilities (Configuración → Capacidades si lo tenés en español; en Team y Enterprise lo maneja el owner desde Organization settings → Capabilities) y activá \"Crear y editar archivos\", para que pueda leer y procesar el archivo."], "aviso": "Subí solo lo que te sientas cómodo compartiendo. Si los nombres de clientes no hacen falta para el panel, reemplazalos por un código."}, {"h": "Camino 1: un panel visual (artifact)", "p": ["Un artifact es algo que Claude arma y se abre al costado del chat: puede ser un documento, una página o un panel. Te sirve para mirar los números y compartirlos."], "prompts": [{"t": "Panel visual de ventas", "c": "Te adjunto la exportación de ventas de mi negocio de [RUBRO], del [FECHA INICIO] al [FECHA FIN].\nAntes de armar nada:\n1. Decime qué columnas encontraste y si ves datos raros (fechas mal cargadas, importes vacíos, filas duplicadas).\n2. Esperá a que te confirme cómo tratarlos.\nDespués armá un panel en un artifact con:\n- Arriba: ventas totales, cantidad de ventas, ticket promedio y clientes nuevos, cada uno comparado con el período anterior.\n- Un gráfico de ventas por semana.\n- Los 5 productos que más venden.\n- [OTRO NÚMERO QUE QUIERAS]\nQue se lea bien en el celular. Debajo de cada número, en letra chica, poné cómo lo calculaste."}]}, {"h": "Camino 2: una planilla que podés seguir usando", "p": ["Si preferís algo que viva en tu compu y puedas actualizar pegando datos nuevos, pedile un Excel con fórmulas en lugar de números fijos."], "prompts": [{"t": "Planilla de métricas con fórmulas", "c": "Con este archivo de ventas, armame un Excel descargable con:\n1. Una hoja \"Datos\" con las ventas tal cual, en formato tabla.\n2. Una hoja \"Panel\" con ventas del mes, cantidad, ticket promedio y clientes nuevos, calculados con fórmulas que lean la hoja Datos (no números escritos a mano).\n3. Un gráfico de ventas por mes.\n4. Una hoja \"Cómo usar\" que explique cómo pegar datos nuevos para que el panel se actualice.\nUsá nombres de columnas en español y no cambies los datos originales."}]}, {"h": "Cómo no comerte un error", "lista": ["Pedí los cálculos: que te diga con qué fórmula sacó cada número.", "Chequeá uno a mano: elegí un número del panel y calculalo vos con la planilla original.", "Ojo con las fechas: los formatos día/mes y mes/día se confunden fácil. Decile cuál usás.", "Guardá el prompt: el mes que viene subís el archivo nuevo y pegás el mismo prompt, así comparás peras con peras."]}], "faq": [{"q": "¿Funciona en el plan gratis?", "a": "Crear artifacts y subir archivos para analizar está disponible en todos los planes, igual que las plantillas Docs, Slides y Design. La plantilla Dashboards (en beta), conectar apps a un artifact y guardar datos dentro de un artifact son de Pro para arriba."}, {"q": "¿Se puede conectar directo a mi sistema para que se actualice solo?", "a": "En los planes pagos hay opciones para conectar apps. Si tu sistema no tiene conector, lo más simple es exportar y subir el archivo cada semana o cada mes."}, {"q": "¿Puedo compartir el panel con mi socio?", "a": "Sí, con un plan pago: los artifacts arrancan privados y con el botón Share elegís quién los ve (en Pro, Max y Ultra, por ejemplo, Anyone with the link o invitar por mail). En el plan gratis no están las opciones de Share. Los permisos se cambian desde la web o la app de escritorio, no desde el celular. La planilla de Excel la mandás como cualquier archivo."}], "fuentes": ["https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude", "https://support.claude.com/en/articles/9547008-publish-and-share-artifacts"], "ejemplo": {"titulo": "Ejemplo resuelto: el panel mensual de una dietética con local y tienda online", "negocio": "Ejemplo inventado: una dietética en la Quinta Sección de Mendoza capital, con un local a la calle y una tienda online. La llevan dos socias. Venden granos, frutos secos y productos sin TACC.", "punto_de_partida": "Cada socia mira números distintos: una, lo que entra a la caja; la otra, los pedidos de la tienda online. Nunca saben si un mes fue mejor que el anterior.", "pasos": ["Se sentaron media hora y completaron el documento de definición de métricas del kit: fecha día/mes/año, importes con impuestos, notas de crédito se restan, y una venta se cuenta por número de comprobante, no por fila.", "Eligieron sus cinco números: ventas, cantidad de ventas, ticket promedio, clientes nuevos y ventas por canal (local o tienda online).", "Exportaron seis meses de ventas de su sistema en Excel, sacaron la columna de teléfono y reemplazaron el nombre del cliente por un código.", "En Settings → Capabilities confirmaron que estuviera prendida la opción de crear y editar archivos.", "Subieron el Excel y el documento de definición, y pegaron el prompt del Camino 1. Claude les marcó que algunas ventas de la tienda online figuraban dos veces (una por el pedido y otra por el pago). Le dijeron que tomara solo las filas de pedido.", "Con el panel armado, una socia comprobó las ventas de un mes contra el total que le daba el sistema con el mismo filtro. Coincidió.", "Como también querían algo en la compu, pidieron el Camino 2: un Excel con hoja Datos, hoja Panel con fórmulas y hoja Cómo usar.", "Subieron la skill panel-de-ventas en Customize → Skills y anotaron la rutina mensual del kit en el calendario: primer día hábil de cada mes.", "Como tienen plan Pro, compartieron el panel entre ellas con el botón Share. En la otra cuenta lo abrieron desde el link."], "resultado": "Las dos miran el mismo panel con las mismas definiciones, y cada mes lo rearman con el mismo prompt y el archivo nuevo. Tienen además un Excel que se recalcula pegando datos nuevos, y un número que comprueban a mano cada vez."}, "si_falla": [{"sintoma": "El ticket promedio sale mucho más bajo de lo que esperabas.", "solucion": "Claude está contando filas en vez de ventas: si tu sistema exporta una fila por producto, una venta con tres productos cuenta como tres. Decile qué columna identifica la venta (número de comprobante o de pedido) y que cuente valores distintos de esa columna."}, {"sintoma": "Todos los clientes aparecen como nuevos.", "solucion": "El archivo arranca en el mismo período que estás midiendo, así que no hay historia para comparar. Exportá varios meses hacia atrás y pedile que use todo el archivo para decidir si un cliente es nuevo, pero que muestre solo el último período."}, {"sintoma": "No encontrás el botón Share o no te deja compartir por link.", "solucion": "En el plan gratis no están las opciones de Share. En Team o Enterprise, Anyone with the link aparece solo si un owner habilitó External sharing. Tampoco se cambia desde el celular: usá la web o la app de escritorio. Mientras tanto, compartí el Excel del Camino 2."}, {"sintoma": "El Excel trae números fijos y no se actualiza al pegar datos nuevos.", "solucion": "Hacé clic en una celda de la hoja Panel: si ves un número y no una fórmula, pedile que lo rehaga con fórmulas que lean la hoja Datos, en formato tabla, para que el rango crezca al pegar filas nuevas. Probalo pegando una fila de prueba antes de usarlo en serio."}, {"sintoma": "Este mes los números no se pueden comparar con los del mes pasado.", "solucion": "Cada chat puede interpretar los datos distinto. Usá siempre el mismo documento de definición de métricas y el mismo prompt, y pegale los valores del mes anterior en vez de pedirle que los recuerde."}], "kit": [{"archivo": "definicion-de-metricas-panel.md", "que_es": "Plantilla para dejar por escrito qué significa cada número del panel (columnas, exclusiones, períodos). Completala una vez y subila junto con el archivo de ventas cada mes.", "contenido": "# Definición de métricas del panel\n\nCompletá este archivo una sola vez, con calma. Después lo pegás (o lo subís) cada vez que le pidas el panel a Claude. Así el número de este mes y el del mes pasado se calculan igual.\n\nNegocio: [NOMBRE Y RUBRO]\nArchivo de origen: [DE QUÉ SISTEMA SALE Y CÓMO SE EXPORTA]\nFormato de fechas: [día/mes/año]\nFormato de números: [coma decimal, punto de miles]\nMoneda: [MONEDA]. Los importes [incluyen / no incluyen] impuestos.\n\n## Columnas del archivo\n\n| Columna en el archivo | Qué significa | Ejemplo |\n|---|---|---|\n| [fecha] | Fecha de la venta | [01/03/2026] |\n| [comprobante] | Número de venta o ticket (una venta puede tener varias filas) | [A-0001-00001234] |\n| [cliente] | Código del cliente, no el nombre | [C0153] |\n| [producto] | Producto o servicio | [NOMBRE] |\n| [cantidad] | Unidades | [2] |\n| [importe] | Importe de esa fila | [N] |\n| [canal] | Local, tienda online, WhatsApp, etc. | [CANAL] |\n\n## Qué se excluye siempre\n\n- Filas con importe negativo: [SE RESTAN, SON DEVOLUCIONES / SE SACAN].\n- Ventas anuladas: [CÓMO SE RECONOCEN].\n- Ventas internas o de prueba: [CÓMO SE RECONOCEN].\n\n## Los 5 números\n\n1. **Ventas del período**: suma de [importe] de las filas que quedan después de las exclusiones. Se compara con el período anterior de igual duración.\n2. **Cantidad de ventas**: cantidad de [comprobante] distintos (no de filas).\n3. **Ticket promedio**: ventas del período dividido cantidad de ventas.\n4. **Clientes nuevos**: clientes cuya primera compra en todo el archivo cae dentro del período. Para que funcione, el archivo tiene que traer al menos [N] meses de historia. Clientes que vuelven: compraron en el período y también antes.\n5. **[TU QUINTO NÚMERO]**: [CÓMO SE CALCULA, CON QUÉ COLUMNAS].\n\n## Períodos\n\n- Semana: de [lunes] a [domingo].\n- Mes: calendario, del 1 al último día.\n- Si el período actual está incompleto, se marca como \"parcial\" y no se compara con un período completo.\n\n## Lo que el panel no tiene que hacer\n\n- No estimar datos que faltan.\n- No mostrar nombres de clientes.\n- No mezclar monedas.\n"}, {"archivo": "panel-de-ventas/SKILL.md", "que_es": "Skill que revisa los datos antes de armar el panel, usa tus definiciones y entrega un artifact o un Excel con fórmulas. Guardala en una carpeta panel-de-ventas, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: panel-de-ventas\ndescription: 'Arma un panel de ventas (artifact o Excel con fórmulas) desde una exportación, revisando los datos y con definiciones fijas. Usala con un CSV o Excel de ventas y un pedido de panel o métricas.'\n---\n\n# Panel de ventas\n\n## Antes de armar nada\n\n1. Buscá en la conversación o en el Proyecto un documento de definición de métricas. Si existe, usá esas definiciones al pie de la letra. Si no existe, usá las de abajo y decí que las estás usando.\n2. Listá las columnas que encontraste y a qué concepto corresponde cada una (fecha, comprobante, cliente, producto, cantidad, importe, canal).\n3. Marcá los problemas: fechas ambiguas día/mes, importes vacíos o negativos, filas duplicadas, comprobantes repetidos en varias filas, monedas mezcladas, período incompleto.\n4. Esperá la confirmación del usuario sobre cómo tratarlos. No avances sin eso.\n\n## Definiciones por defecto\n\n- Ventas: suma de importes después de exclusiones.\n- Cantidad de ventas: comprobantes distintos; si no hay columna de comprobante, avisá que vas a contar filas y que eso puede inflar el número.\n- Ticket promedio: ventas dividido cantidad de ventas.\n- Clientes nuevos: primera compra del cliente dentro del período, mirando todo el archivo. Si el archivo arranca en el mismo período, avisá que todos van a parecer nuevos.\n- Comparación: contra el período anterior de igual duración. Si el actual está incompleto, marcalo como parcial.\n\n## Si piden un panel visual (artifact)\n\n- Arriba, una fila de tarjetas con los números clave y su variación contra el período anterior.\n- Debajo, un gráfico de ventas por semana o por mes y la lista de productos que más venden.\n- Debajo de cada número, en letra chica: cómo se calculó y cuántas filas entraron.\n- Que se lea en el celular: una columna en pantallas chicas, números grandes, sin tablas anchas.\n- Pie del panel: archivo usado, período, fecha de armado y exclusiones aplicadas.\n\n## Si piden un Excel\n\n- Hoja \"Datos\" con las ventas tal cual, en formato tabla.\n- Hoja \"Panel\" con fórmulas que lean la hoja Datos. Ningún número escrito a mano.\n- Un gráfico de ventas por mes que tome los datos de la hoja Panel.\n- Hoja \"Cómo usar\": cómo pegar datos nuevos debajo de la tabla para que todo se recalcule.\n- Hoja \"Definiciones\" con las definiciones usadas.\n\n## Reglas\n\n- No inventes datos ni completes vacíos.\n- No muestres nombres, documentos ni teléfonos de clientes. Si vienen en el archivo, usá códigos.\n- Si un número no se puede calcular con las columnas que hay, dejalo afuera y decí qué falta.\n- Al final, ofrecé comprobar un número a mano: decí cuál y cómo calcularlo en la planilla original.\n"}, {"archivo": "rutina-mensual-panel-de-metricas.md", "que_es": "La rutina del primer día hábil del mes: cómo exportar, el prompt mensual para pegar y el control de cinco minutos.", "contenido": "# Rutina mensual del panel\n\nPara que el panel de este mes se pueda comparar con el del mes pasado.\n\n## El primer día hábil del mes\n\n1. Exportá las ventas desde tu sistema con el mismo filtro de siempre: [PERÍODO, SUCURSALES, ESTADO].\n2. Nombrá el archivo igual cada mes: ventas-AAAA-MM.xlsx.\n3. Sacá las columnas sensibles (documento, teléfono, dirección) si tu sistema las exporta.\n4. Abrí un chat nuevo en Claude (o en tu Proyecto del panel).\n5. Subí el archivo y el documento de definición de métricas.\n6. Pegá el prompt de abajo.\n\n## Prompt mensual (copiá desde acá)\n\nTe subo las ventas de [MES Y AÑO] y el documento de definición de métricas. Usá esas definiciones al pie de la letra.\n1. Antes de armar el panel, decime columnas, cantidad de filas, período cubierto y problemas que veas. Esperá mi confirmación.\n2. Después armá el panel en un artifact con los 5 números del documento, cada uno comparado con [MES ANTERIOR]: [VALORES DEL MES ANTERIOR, COPIADOS DEL PANEL DEL MES PASADO].\n3. Debajo de cada número, cómo lo calculaste y cuántas filas entraron.\n4. Al final, decime qué número te parece raro y por qué, separando lo que sale de los datos de lo que suponés.\n\n## Control (5 minutos)\n\n- [ ] Las ventas del mes del panel coinciden con el total que te da tu sistema para el mismo filtro.\n- [ ] La cantidad de ventas coincide con la cantidad de comprobantes del sistema.\n- [ ] Anotaste los 5 números en una tabla propia (planilla o cuaderno), para pegarlos el mes que viene.\n\n## Si cambiás algo\n\nSi cambiás una definición (por ejemplo, empezás a excluir ventas internas), anotalo en el documento de definición con la fecha. Los meses anteriores no son comparables hasta que los recalcules con la definición nueva.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "usalo"};</script>

<script>var GUIA = {"slug": "equipos-de-agentes-cuando-conviene", "t": "Equipos de agentes: cuándo conviene y cuándo te complica", "d": "Un coordinador con especialistas suena bien, pero no siempre suma. Qué ofrece Claude Code (subagentes y equipos de agentes), cuándo vale la pena y cómo empezar sin quemar tu límite.", "tema": "Agentes", "min": 10, "fichaNombre": "Equipos de agentes", "ficha": [["Subagentes", "Ayudantes dentro de una sesión. Hacen su parte y le devuelven el resultado al principal."], ["Equipos de agentes", "Varias sesiones de Claude Code coordinadas por una principal, que se mandan mensajes entre sí. Función experimental."], ["Costo", "Más agentes, más consumo. Cada uno trabaja con su propio contexto."], ["Empezá por", "Tareas de investigación o revisión, no de construir."]], "secciones": [{"h": "La idea: coordinador y especialistas", "p": ["Un agente coordinador recibe el pedido, lo parte en tareas y se las pasa a especialistas: uno investiga, otro escribe, otro revisa. Al final junta todo.", "Funciona cuando las partes son independientes. Si cada paso depende del anterior, un solo agente lo hace mejor y más barato."]}, {"h": "Cuándo vale la pena", "lista": ["Investigar desde varios ángulos a la vez: mercado, competencia y clientes, cada uno por su lado.", "Revisar con distintas miradas: uno busca errores de datos, otro de tono, otro de promesas exageradas.", "Partes que no se pisan: cada especialista trabaja en archivos distintos."]}, {"h": "Cuándo te complica", "lista": ["Tareas en secuencia: si el paso 2 necesita el resultado del 1, en paralelo no ganás nada.", "Varios editando el mismo archivo: se sobreescriben.", "Tareas chicas: coordinar cuesta más que hacer.", "Cuando no podés revisar: más agentes es más trabajo para leer al final."], "aviso": "La documentación oficial avisa que los equipos de agentes usan bastante más consumo que una sola sesión, porque cada integrante es una instancia aparte de Claude."}, {"h": "Opción 1: subagentes (la recomendada para empezar)", "p": ["Vos hablás con Claude Code, que hace de coordinador, y él delega en subagentes. Cada uno trabaja en su propio contexto y solo le devuelve un resumen. Podés crear los tuyos en .claude/agents/ con sus instrucciones y herramientas."], "prompts": [{"t": "Coordinar especialistas con subagentes", "c": "Necesito un informe sobre [TEMA] para decidir [DECISIÓN].\nOrganizalo así:\n- Lanzá en paralelo tres subagentes: uno investiga [ÁNGULO 1], otro [ÁNGULO 2] y otro [ÁNGULO 3]. Cada uno devuelve hallazgos con links.\n- Cuando terminen, escribí vos el informe en informe.md juntando todo.\n- Después usá un subagente revisor que lea el informe y marque datos sin fuente o contradicciones.\nNo edites ningún otro archivo."}]}, {"h": "Opción 2: equipos de agentes (experimental)", "p": ["En los equipos de agentes, una sesión es la líder y las demás son compañeras que se mandan mensajes y comparten una lista de tareas. Vienen apagados. Se prenden con la variable CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS en 1, en tu settings.json o en tu terminal."], "prompts": [{"t": "Activarlos en settings.json", "c": "{\n  \"env\": {\n    \"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\": \"1\"\n  }\n}"}, {"t": "Pedir un equipo", "c": "Armá un equipo de 3 compañeros para revisar mi landing en la carpeta [CARPETA]:\n- uno revisa claridad del mensaje,\n- uno revisa promesas y datos que haya que respaldar,\n- uno hace de cliente escéptico y busca objeciones.\nQue cada uno reporte sus hallazgos y que discutan entre ellos los puntos en los que no coinciden. Al final, dame una lista priorizada. Nadie edita archivos."}], "lista": ["Empezá con 3 a 5 compañeros: es lo que sugiere la documentación.", "Solo funcionan en sesiones interactivas, no en modo -p ni desde el Agent SDK.", "Tienen limitaciones conocidas: por ejemplo, retomar una sesión no recupera a los compañeros que corrían adentro de tu terminal."]}], "faq": [{"q": "¿Qué uso: subagentes o equipos?", "a": "Subagentes cuando solo te importa el resultado de cada parte. Equipos cuando los especialistas necesitan discutir entre ellos y coordinarse solos."}, {"q": "¿Cuántos agentes pongo?", "a": "Los menos posibles. Tres especialistas bien definidos suelen rendir más que cinco con tareas difusas."}, {"q": "Prendí los equipos y ahora arma equipos sin que se lo pida", "a": "Con la función activa, cuando Claude le pone nombre a un subagente lo lanza como compañero de equipo. Si no los querés, poné la variable en 0."}], "fuentes": ["https://code.claude.com/docs/en/agent-teams", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/es/agent-teams.md", "https://code.claude.com/docs/es/sub-agents.md"], "ejemplo": {"titulo": "Ejemplo resuelto: una consultora chica decide si abre una línea nueva", "negocio": "Ejemplo inventado: una consultora de tres personas en Providencia, Santiago de Chile, que hace planes de marketing para clínicas veterinarias. Están evaluando sumar el mismo servicio para tiendas de mascotas.", "punto_de_partida": "La socia que lleva los números tenía que preparar un informe para decidir en la reunión del viernes. Investigar mercado, competencia y clientes uno detrás del otro le llevaba días, y al final nadie revisaba si los datos tenían fuente.", "pasos": ["Antes de armar nada, pasó la tarea por la checklist del kit. Las tres partes de la investigación eran independientes y le alcanzaba con el resultado de cada una: le tocaban subagentes, no un equipo.", "Creó la carpeta .claude/agents/ en el proyecto del informe y guardó ahí los dos archivos del kit: investigador-con-fuentes.md y revisor-de-datos-y-promesas.md. Como la carpeta no existía cuando abrió la sesión, reinició Claude Code para que los tome.", "Pegó el pedido de subagentes de la checklist con tres ángulos: cuántas tiendas de mascotas hay y cómo se reparten en la Región Metropolitana, qué ofrecen hoy las agencias que ya atienden ese rubro, y qué dicen los dueños de tiendas en foros y grupos públicos.", "Los tres investigadores corrieron en paralelo y cada uno devolvió sus hallazgos con link y una lista de lo que no encontró. El principal escribió informe.md juntando todo.", "El revisor marcó dos cifras sin fuente y un link que no decía lo que el informe afirmaba. Ella le pidió al principal que sacara esas cifras y que pusiera \"sin dato\" donde correspondía.", "Para la última pasada probó un equipo de agentes. Prendió CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS en el settings.json del proyecto y usó el pedido de la guía adaptado al informe: uno revisaba claridad, otro los datos y otro hacía de socio escéptico que buscaba razones para no abrir la línea.", "Siguió la discusión desde el panel de agentes, con las flechas y Enter, y le escribió directo al escéptico para que priorizara el costo de conseguir los primeros clientes.", "Terminada la revisión, volvió a poner la variable en 0 para que en sus sesiones normales los subagentes no se lanzaran como compañeros de equipo."], "resultado": "Quedó un informe con cada dato atado a su link, una lista de lo que no se pudo averiguar y las objeciones del escéptico ordenadas. La decisión la tomaron las tres socias en la reunión. Los dos subagentes quedaron guardados en el proyecto para la próxima investigación."}, "si_falla": [{"sintoma": "Pedí un equipo y Claude lanzó subagentes comunes, o no aparece ningún compañero.", "solucion": "Revisá que la variable CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS esté en 1 en el settings.json o en la terminal, y que estés en una sesión interactiva (en modo -p o desde el Agent SDK no se lanzan compañeros). Los subagentes aparecen en el mismo panel, así que el panel solo no confirma que haya equipo: volvé a pedirlo diciendo explícitamente \"armá un equipo de agentes\". Si la tarea es muy chica, Claude puede decidir no armarlo."}, {"sintoma": "Retomé la sesión con /resume y el líder les escribe a compañeros que ya no existen.", "solucion": "Es una limitación conocida: /resume y /rewind no restauran a los compañeros que corrían en tu terminal. Decile al líder que genere compañeros nuevos y pasale el estado de la lista de tareas."}, {"sintoma": "Guardé un subagente en .claude/agents/ y Claude no lo usa ni aparece.", "solucion": "Si la carpeta agents no existía cuando abriste la sesión, reiniciá Claude Code. Si ya existía, revisá el archivo: el --- tiene que estar en la primera línea, name y description son obligatorios y name no puede empezar con guion ni tener dos puntos. Si el YAML no se puede leer, Claude Code lo ignora sin avisar."}, {"sintoma": "El líder del equipo empieza a hacer las tareas él en lugar de esperar a los compañeros.", "solucion": "Escribile: \"Wait for your teammates to complete their tasks before proceeding\" (esperá a que tus compañeros terminen sus tareas antes de seguir). Si una tarea parece trabada, fijate si el trabajo ya está hecho y pedile al líder que la marque como completada."}, {"sintoma": "Llueven pedidos de permiso de los compañeros en la sesión del líder.", "solucion": "Los pedidos de permiso de cada compañero llegan al líder. Antes de armar el equipo, aprobá de antemano las operaciones comunes en la configuración de permisos, o empezá con una tarea de revisión donde nadie edita archivos, que pide menos permisos."}], "kit": [{"archivo": "investigador-con-fuentes.md", "que_es": "Subagente de Claude Code que investiga un solo ángulo de un tema y devuelve hallazgos con link, lo que no encontró y las contradicciones. Guardalo en .claude/agents/ de tu proyecto (o en ~/.claude/agents/ para todos).", "contenido": "---\nname: investigador-con-fuentes\ndescription: Investiga en la web un ángulo concreto de un tema y devuelve hallazgos cortos, cada uno con su link. Usalo cuando haya que investigar mercado, competencia, clientes, precios, normas o novedades, sobre todo cuando se lanzan varios investigadores en paralelo con ángulos distintos.\ntools: WebSearch, WebFetch, Read, Grep, Glob\nmodel: sonnet\n---\n\nSos un investigador. Te dan un tema y un ángulo. Investigás solo ese ángulo.\n\nCómo trabajás:\n1. Repetí en una línea el ángulo que te tocó, para que quede claro qué cubriste y qué no.\n2. Buscá en la web. Preferí fuentes primarias: sitios oficiales, documentación, organismos, informes con autor y fecha.\n3. Abrí cada link antes de citarlo. Si no abre, no lo uses.\n\nQué devolvés, en este formato y nada más:\n\n## Ángulo\n[una línea]\n\n## Hallazgos\n- [hallazgo en una o dos frases]. Fuente: [link] ([fecha de la fuente si la tiene])\n- (de 5 a 10 hallazgos)\n\n## Lo que no encontré\n- [preguntas del ángulo que quedaron sin respuesta con fuente]\n\n## Contradicciones\n- [si dos fuentes dicen cosas distintas, las dos con su link]\n\nReglas:\n- Ningún hallazgo sin link.\n- No redondees ni estimes números. Si una cifra no está en la fuente, no la pongas.\n- No escribas el informe final ni recomendaciones: eso lo hace quien te llamó.\n- No crees ni edites archivos.\n"}, {"archivo": "revisor-de-datos-y-promesas.md", "que_es": "Subagente de Claude Code que revisa un texto sin editarlo y devuelve una tabla de datos sin fuente, links que no coinciden, contradicciones y promesas exageradas. Guardalo en .claude/agents/.", "contenido": "---\nname: revisor-de-datos-y-promesas\ndescription: Revisa un texto o informe ya escrito y marca datos sin fuente, cifras que no coinciden con su link, contradicciones y promesas exageradas. Usalo después de escribir un informe, una propuesta, una landing o un posteo, antes de que lo vea un cliente.\ntools: Read, Grep, Glob, WebFetch\nmodel: sonnet\n---\n\nSos un revisor. No escribís ni corregís: marcás.\n\nCómo trabajás:\n1. Leé el archivo que te indican, completo.\n2. Para cada afirmación con un dato (número, fecha, nombre, precio, norma), fijate si tiene fuente. Si tiene link, abrilo y comprobá que diga eso.\n3. Buscá promesas: resultados garantizados, plazos, ahorros, \"siempre\", \"nunca\", \"el mejor\", \"único\".\n4. Buscá contradicciones entre partes del mismo texto.\n\nQué devolvés, en este formato y nada más:\n\n## Resumen\n[una línea: cuántos problemas por tipo]\n\n## Problemas\n| # | Dónde (sección o línea) | Tipo | Qué dice | Problema | Qué haría falta |\n|---|---|---|---|---|---|\n\nTipos posibles: SIN FUENTE, FUENTE NO COINCIDE, LINK ROTO, PROMESA, CONTRADICCIÓN.\n\n## Lo que está bien\n- [2 o 3 cosas que no hay que tocar, para que no se pierdan al corregir]\n\nReglas:\n- No edites el archivo. No propongas el texto nuevo completo: decí qué falta.\n- Si no podés comprobar algo, marcalo como SIN FUENTE, no lo des por bueno.\n- Ordená la tabla con lo más grave arriba: primero lo que puede generar un reclamo de un cliente.\n"}, {"archivo": "checklist-agente-subagentes-o-equipo.md", "que_es": "Checklist de cuatro preguntas para decidir entre un agente, subagentes o un equipo, con el pedido listo para usar los dos subagentes del kit.", "contenido": "# ¿Un agente, subagentes o un equipo? Checklist para decidir\n\nRespondé en orden. La primera respuesta que te frena te dice qué usar.\n\n## 1. ¿Hace falta partir la tarea?\n\n- [ ] La tarea me lleva más de una sesión de trabajo o tiene partes claramente distintas.\n- [ ] Puedo nombrar cada parte en una frase.\n\nSi no tildaste las dos: **un solo agente**. Coordinar cuesta más que hacer.\n\n## 2. ¿Las partes son independientes?\n\n- [ ] Ninguna parte necesita el resultado de otra para arrancar.\n- [ ] Cada parte escribe en un archivo distinto, o no escribe nada.\n\nSi no tildaste las dos: **un solo agente**, paso por paso. Si el paso 2 necesita el 1, el paralelo no gana nada, y dos agentes en el mismo archivo se pisan.\n\n## 3. ¿Alcanza con el resultado de cada parte?\n\n- [ ] Me alcanza con que cada especialista me devuelva su resultado y yo (o el principal) los junte.\n\nSi tildaste: **subagentes**. Más baratos, en una sola sesión, y el principal solo recibe resúmenes. Usá los de este kit en .claude/agents/.\n\n## 4. ¿Los especialistas tienen que discutir entre ellos?\n\n- [ ] Quiero que se contradigan, que uno desafíe lo que encontró otro, o que se repartan solos una lista de tareas.\n- [ ] Puedo estar mirando la sesión mientras trabajan (los equipos necesitan una sesión interactiva).\n- [ ] Acepto que cada compañero es una instancia aparte de Claude y consume como tal.\n\nSi tildaste las tres: **equipo de agentes** (experimental). Empezá con 3 compañeros y una tarea de revisión o investigación, sin edición de archivos.\n\n## Antes de lanzar, en cualquier caso\n\n- [ ] Cada especialista tiene un nombre, una tarea de una frase y un formato de entrega.\n- [ ] Está escrito qué archivos puede tocar cada uno (o \"ninguno\").\n- [ ] Sé qué voy a revisar al final y cuánto tiempo me lleva leerlo.\n- [ ] Miré cuánto uso del plan me queda antes de arrancar (en claude.ai/settings/usage).\n\n## Pedido de subagentes con los archivos del kit\n\n\"Usá el subagente investigador-con-fuentes tres veces en paralelo: uno con el ángulo [ÁNGULO 1], otro con [ÁNGULO 2] y otro con [ÁNGULO 3], todos sobre [TEMA]. Con lo que devuelvan, escribí informe.md. Después usá el subagente revisor-de-datos-y-promesas sobre informe.md y mostrame su tabla. No edites ningún otro archivo.\"\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "usalo"};</script>

comendada para empezar)", "p": ["Vos hablás con Claude Code, que hace de coordinador, y él delega en subagentes. Cada uno trabaja en su propio contexto y solo le devuelve un resumen. Podés crear los tuyos en .claude/agents/ con sus instrucciones y herramientas."], "prompts": [{"t": "Coordinar especialistas con subagentes", "c": "Necesito un informe sobre [TEMA] para decidir [DECISIÓN].\nOrganizalo así:\n- Lanzá en paralelo tres subagentes: uno investiga [ÁNGULO 1], otro [ÁNGULO 2] y otro [ÁNGULO 3]. Cada uno devuelve hallazgos con links.\n- Cuando terminen, escribí vos el informe en informe.md juntando todo.\n- Después usá un subagente revisor que lea el informe y marque datos sin fuente o contradicciones.\nNo edites ningún otro archivo."}]}, {"h": "Opción 2: equipos de agentes (experimental)", "p": ["En los equipos de agentes, una sesión es la líder y las demás son compañeras que se mandan mensajes y comparten una lista de tareas. Vienen apagados. Se prenden con la variable CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS en 1, en tu settings.json o en tu terminal."], "prompts": [{"t": "Activarlos en settings.json", "c": "{\n  \"env\": {\n    \"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\": \"1\"\n  }\n}"}, {"t": "Pedir un equipo", "c": "Armá un equipo de 3 compañeros para revisar mi landing en la carpeta [CARPETA]:\n- uno revisa claridad del mensaje,\n- uno revisa promesas y datos que haya que respaldar,\n- uno hace de cliente escéptico y busca objeciones.\nQue cada uno reporte sus hallazgos y que discutan entre ellos los puntos en los que no coinciden. Al final, dame una lista priorizada. Nadie edita archivos."}], "lista": ["Empezá con 3 a 5 compañeros: es lo que sugiere la documentación.", "Solo funcionan en sesiones interactivas, no en modo -p ni desde el Agent SDK.", "Tienen limitaciones conocidas: por ejemplo, retomar una sesión no recupera a los compañeros que corrían adentro de tu terminal."]}], "faq": [{"q": "¿Qué uso: subagentes o equipos?", "a": "Subagentes cuando solo te

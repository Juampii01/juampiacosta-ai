<script>var GUIA = {"slug": "sistema-ia-para-estudios-contables", "t": "Sistema con Claude para estudios contables", "d": "Pedidos de documentación, respuestas a clientes, vencimientos y borradores de informes: un sistema para que el estudio dedique más tiempo a lo que requiere criterio.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Estudios contables", "ficha": [["Qué es", "Un asistente para la comunicación y la organización del estudio: pedidos a clientes, respuestas, recordatorios e informes en borrador."], ["Necesitás", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No liquida impuestos, no presenta declaraciones y no reemplaza la firma ni el criterio del contador."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Perseguir documentación: pedir comprobantes, extractos y facturas todos los meses, cliente por cliente.", "Preguntas repetidas: \"¿cuándo vence?\", \"¿esto lo puedo deducir?\", \"¿me llegó tal intimación?\".", "Recordatorios de vencimientos a cada cliente.", "Explicar números: pasar un balance o un resumen a palabras que entienda el dueño de una pyme.", "Ordenar mails y archivos que llegan con nombres cualquiera.", "Incorporar clientes nuevos: qué se necesita, qué se firma, cómo se trabaja."]}, {"h": "El sistema", "lista": ["Proyecto \"Estudio\": servicios, honorarios, forma de trabajo, calendario de vencimientos que arma el propio estudio y respuestas aprobadas a preguntas frecuentes. Sin datos fiscales de clientes.", "Skill de pedido de documentación: arma el mensaje mensual para cada tipo de cliente con la lista exacta de lo que falta.", "Skill de explicación de números: toma un resumen que ya preparó el contador y lo explica en lenguaje simple, sin agregar conclusiones.", "Skill de respuesta a clientes: contesta lo operativo y deriva al contador todo lo que sea criterio fiscal.", "Conectores: Gmail para encontrar mails de clientes y dejar borradores, Google Calendar para los vencimientos, Google Drive para las carpetas por cliente.", "Automatización: una tarea programada que a principio de mes lista qué clientes tienen vencimientos próximos y deja los borradores de pedido de documentación."], "aviso": "Ojo con el mail: según la ayuda oficial, el conector de Gmail ve los datos de los adjuntos (nombre, tipo) pero no su contenido. Si querés que Claude lea un comprobante, subilo o pasalo por Drive. Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Pedido mensual de documentación", "c": "Cliente tipo: [MONOTRIBUTISTA, PYME, AUTÓNOMO, ETC.].\nMes: [MES].\nLo que ya recibimos: [LISTA].\nLo que necesitamos según el Proyecto: [O DEJALO QUE LO BUSQUE].\nEscribí un mensaje corto y amable que liste solo lo que falta, con la fecha límite [FECHA] y cómo enviarlo. Sin tecnicismos. Si algo de la lista no aplica a este tipo de cliente, avisame."}, {"t": "Explicar un informe en simple", "c": "Te paso un resumen que preparé para un cliente: [PEGÁ EL RESUMEN, SIN CUIT NI DATOS PERSONALES].\nExplicalo en un mensaje de hasta 200 palabras para alguien que no sabe contabilidad:\n1. Qué pasó este período, en 3 frases.\n2. Qué tiene que hacer y para cuándo.\n3. Qué conviene hablar en una reunión.\nNo agregues recomendaciones fiscales que no estén en mi resumen. Si algo no se entiende, preguntame."}, {"t": "Responder y derivar", "c": "Un cliente escribió: [PEGÁ EL MENSAJE].\nSi la pregunta es operativa (fechas, cómo mandar algo, estado de un trámite), respondé con lo que está en el Proyecto.\nSi pide una opinión fiscal o contable (si deduce, qué régimen le conviene, cómo resolver una intimación), no la respondas: escribí un mensaje que diga que el contador lo revisa y proponé un horario.\nAl final, decime en una línea qué tipo de pregunta era."}]}, {"h": "Cómo instalarlo", "pasos": ["Con el estudio, separá qué consultas son operativas y cuáles son de criterio. Esa lista es la regla más importante del sistema.", "Armá el Proyecto con servicios, honorarios, el calendario de vencimientos que usa el estudio y las respuestas aprobadas.", "Definí cómo se nombran los clientes en los mensajes de prueba: un código, nunca CUIT ni datos fiscales completos.", "Probá las skills con casos reales anonimizados y que un contador revise cada salida.", "Conectá Gmail, Calendar y Drive con la cuenta del estudio y armá la tarea de principio de mes.", "Dejá por escrito quién revisa los borradores antes de enviarlos."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Trabajo con estudios contables armando sistemas con Claude.\nCasi todos los estudios con los que hablo me dicen lo mismo: el tiempo se va en pedir papeles, recordar vencimientos y contestar preguntas que se repiten. Lo que hago es dejarles un asistente que prepara esos mensajes y ordena las consultas, para que el contador se quede con lo que necesita su criterio. No liquida ni presenta nada.\n¿Tenés 15 minutos para ver cómo armaría el pedido de documentación de este mes?"}], "lista": ["Argumento central: \"Menos tiempo persiguiendo clientes y más tiempo para lo que cobrás como profesional. Y cada cliente recibe el mismo orden, no depende de quién atiende.\"", "No discutas el corazón del trabajo contable: ofrecé ordenar la comunicación alrededor."]}, {"h": "Cuidados del rubro", "lista": ["Datos fiscales: CUIT o equivalentes, ingresos, cuentas bancarias y claves fiscales no van al Proyecto ni a los prompts de prueba. Nunca pidas ni guardes claves de organismos.", "Secreto profesional: el estudio decide qué información de clientes puede pasar por una herramienta externa. Que lo decida por escrito.", "Normas que cambian: los vencimientos y las reglas fiscales cambian. Claude no es la fuente; el estudio actualiza su calendario."], "aviso": "Claude no reemplaza al contador. No da opiniones fiscales válidas ni presenta nada ante organismos. Cuidá los datos personales y fiscales según las leyes de cada país y lo que diga el código de ética de la profesión."}], "faq": [{"q": "¿Claude sabe las fechas de vencimiento de mi país?", "a": "No lo uses para eso. Puede equivocarse o estar desactualizado. El estudio carga su propio calendario y Claude lo usa como dato."}, {"q": "¿Puede leer las facturas que mandan por mail?", "a": "El conector de Gmail no lee el contenido de los adjuntos. Si querés que lea un PDF, guardalo en Drive o subilo al chat, sin datos que no hagan falta."}, {"q": "¿Sirve para un contador que trabaja solo?", "a": "Sí. Con el Proyecto y la skill de pedidos ya ordena buena parte del mes."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"], "cat": "rubros", "parte": "construi"};</script>

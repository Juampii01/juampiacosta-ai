<script>var GUIA = {"slug": "sistema-ia-para-estudios-contables", "t": "Sistema con Claude para estudios contables", "d": "Pedidos de documentación, respuestas a clientes, vencimientos y borradores de informes: un sistema para que el estudio dedique más tiempo a lo que requiere criterio.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Estudios contables", "ficha": [["Qué es", "Un asistente para la comunicación y la organización del estudio: pedidos a clientes, respuestas, recordatorios e informes en borrador."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No liquida impuestos, no presenta declaraciones y no reemplaza la firma ni el criterio del contador."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Perseguir documentación: pedir comprobantes, extractos y facturas todos los meses, cliente por cliente.", "Preguntas repetidas: \"¿cuándo vence?\", \"¿esto lo puedo deducir?\", \"¿me llegó tal intimación?\".", "Recordatorios de vencimientos a cada cliente.", "Explicar números: pasar un balance o un resumen a palabras que entienda el dueño de una pyme.", "Ordenar mails y archivos que llegan con nombres cualquiera.", "Incorporar clientes nuevos: qué se necesita, qué se firma, cómo se trabaja."]}, {"h": "El sistema", "lista": ["Proyecto \"Estudio\": servicios, honorarios, forma de trabajo, calendario de vencimientos que arma el propio estudio y respuestas aprobadas a preguntas frecuentes. Sin datos fiscales de clientes.", "Skill de pedido de documentación: arma el mensaje mensual para cada tipo de cliente con la lista exacta de lo que falta.", "Skill de explicación de números: toma un resumen que ya preparó el contador y lo explica en lenguaje simple, sin agregar conclusiones.", "Skill de respuesta a clientes: contesta lo operativo y deriva al contador todo lo que sea criterio fiscal.", "Conectores: Gmail para encontrar mails de clientes y dejar borradores, Google Calendar para los vencimientos, Google Drive para las carpetas por cliente.", "Automatización: una tarea programada semanal (por ejemplo, los lunes) que mira el calendario del estudio, lista qué clientes tienen vencimientos en los próximos días y deja los borradores de pedido de documentación. Las tareas programadas no tienen frecuencia mensual: si la quieres solo a principio de mes, déjala en manual y corrila ese día."], "aviso": "Ojo con el mail: según la ayuda oficial, el conector de Gmail ve los datos de los adjuntos (nombre, tipo) pero no su contenido. Si quieres que Claude lea un comprobante, súbelo o pásalo por Drive. Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Pedido mensual de documentación", "c": "Cliente tipo: [MONOTRIBUTISTA, PYME, AUTÓNOMO, ETC.].\nMes: [MES].\nLo que ya recibimos: [LISTA].\nLo que necesitamos según el Proyecto: [O DÉJALO QUE LO BUSQUE].\nEscribe un mensaje corto y amable que liste solo lo que falta, con la fecha límite [FECHA] y cómo enviarlo. Sin tecnicismos. Si algo de la lista no aplica a este tipo de cliente, avísame."}, {"t": "Explicar un informe en simple", "c": "Te paso un resumen que preparé para un cliente: [PEGA EL RESUMEN, SIN CUIT NI DATOS PERSONALES].\nExplícalo en un mensaje de hasta 200 palabras para alguien que no sabe contabilidad:\n1. Qué pasó este período, en 3 frases.\n2. Qué tiene que hacer y para cuándo.\n3. Qué conviene hablar en una reunión.\nNo agregues recomendaciones fiscales que no estén en mi resumen. Si algo no se entiende, pregúntame."}, {"t": "Responder y derivar", "c": "Un cliente escribió: [PEGA EL MENSAJE].\nSi la pregunta es operativa (fechas, cómo mandar algo, estado de un trámite), responde con lo que está en el Proyecto.\nSi pide una opinión fiscal o contable (si deduce, qué régimen le conviene, cómo resolver una intimación), no la respondas: escribe un mensaje que diga que el contador lo revisa y propón un horario.\nAl final, dime en una línea qué tipo de pregunta era."}]}, {"h": "Cómo instalarlo", "pasos": ["Con el estudio, separa qué consultas son operativas y cuáles son de criterio. Esa lista es la regla más importante del sistema.", "Arma el Proyecto con servicios, honorarios, el calendario de vencimientos que usa el estudio y las respuestas aprobadas.", "Define cómo se nombran los clientes en los mensajes de prueba: un código, nunca CUIT ni datos fiscales completos.", "Prueba las skills con casos reales anonimizados y que un contador revise cada salida.", "Convierte cada prompt en skill (una carpeta con su SKILL.md, comprimida en ZIP) y súbelas en Customize → Skills, con el botón +, después + Create skill y Upload a skill. Conecta Gmail, Calendar y Drive con la cuenta del estudio desde Customize → Connectors y arma la tarea en Cowork (Scheduled, New task) con frecuencia semanal, o manual si solo la quieres correr a principio de mes.", "Deja por escrito quién revisa los borradores antes de enviarlos."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Trabajo con estudios contables armando sistemas con Claude.\nCasi todos los estudios con los que hablo me dicen lo mismo: el tiempo se va en pedir papeles, recordar vencimientos y contestar preguntas que se repiten. Lo que hago es dejarles un asistente que prepara esos mensajes y ordena las consultas, para que el contador se quede con lo que necesita su criterio. No liquida ni presenta nada.\n¿Tienes 15 minutos para ver cómo armaría el pedido de documentación de este mes?"}], "lista": ["Argumento central: \"Menos tiempo persiguiendo clientes y más tiempo para lo que cobras como profesional. Y cada cliente recibe el mismo orden, no depende de quién atiende.\"", "No discutas el corazón del trabajo contable: ofrece ordenar la comunicación alrededor."]}, {"h": "Cuidados del rubro", "lista": ["Datos fiscales: CUIT o equivalentes, ingresos, cuentas bancarias y claves fiscales no van al Proyecto ni a los prompts de prueba. Nunca pidas ni guardes claves de organismos.", "Secreto profesional: el estudio decide qué información de clientes puede pasar por una herramienta externa. Que lo decida por escrito.", "Normas que cambian: los vencimientos y las reglas fiscales cambian. Claude no es la fuente; el estudio actualiza su calendario."], "aviso": "Claude no reemplaza al contador. No da opiniones fiscales válidas ni presenta nada ante organismos. Cuida los datos personales y fiscales según las leyes de cada país y lo que diga el código de ética de la profesión."}], "faq": [{"q": "¿Claude sabe las fechas de vencimiento de mi país?", "a": "No lo uses para eso. Puede equivocarse o estar desactualizado. El estudio carga su propio calendario y Claude lo usa como dato."}, {"q": "¿Puede leer las facturas que mandan por mail?", "a": "El conector de Gmail no lee el contenido de los adjuntos. Si quieres que lea un PDF, guárdalo en Drive o súbelo al chat, sin datos que no hagan falta."}, {"q": "¿Sirve para un contador que trabaja solo?", "a": "Sí. Con el Proyecto y la skill de pedidos ya ordena buena parte del mes."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/12512198-how-to-create-custom-skills"], "ejemplo": {"titulo": "Ejemplo resuelto: el pedido de papeles ordenado en un estudio chico", "negocio": "Ejemplo inventado: un estudio contable en Mar del Dinero con dos contadoras socias y un administrativo. Llevan monotributistas, autónomos y algunas pymes de la zona. Trabajan con Gmail, Google Drive (una carpeta por cliente) y Google Calendar.", "punto_de_partida": "Todos los meses el administrativo escribe a cada cliente pidiendo papeles, copiando y pegando mensajes viejos que a veces piden cosas que no corresponden. Las contadoras contestan por WhatsApp preguntas operativas entre una liquidación y otra.", "pasos": ["En la demo, la persona que lo instaló armó con el prompt de pedido el mensaje de un monotributista ficticio: salió solo lo que faltaba y con la fecha límite del estudio. Después pegó tres consultas inventadas y mostró que \"¿esto lo puedo deducir?\" salía derivado.", "Se sentó con las socias a completar la regla de criterio del kit: qué consultas son operativas, cuáles son de criterio y cuáles urgentes. Anotaron los casos dudosos que ya tenían resueltos.", "Acordaron por escrito que a Claude solo pasan códigos de cliente (C-001, C-002...) y nada de CUIT, ingresos ni claves. El administrativo armó en Drive la planilla de clientes con código, tipo, canal y responsable.", "Prendió Code execution and file creation en Settings → Capabilities y creó el Proyecto privado \"Estudio\" con las instrucciones del kit, la regla de criterio, los servicios, los honorarios y el documento de documentación por tipo de cliente. Las socias cargaron su propio calendario de vencimientos en una planilla de Drive.", "Probaron una semana los tres prompts con casos reales anonimizados. Una de las socias revisó cada salida y ajustaron el documento de documentación para autónomos, que pedía algo que el estudio ya no usa.", "Convirtió el prompt de pedido en la skill pedido-de-documentacion del kit y los otros dos en sus propias skills. Subió cada carpeta en ZIP desde Customize → Skills y conectó Gmail, Calendar y Drive con la cuenta del estudio.", "Al crear la tarea vio que no había frecuencia mensual. La dejó semanal, los lunes, con el prompt del kit, que mira los vencimientos de los próximos días y avisa cuando no hay nada.", "Dejaron por escrito que el administrativo revisa los borradores el lunes y que todo lo marcado CRITERIO o URGENTE va a la socia responsable de ese cliente."], "resultado": "Quedó un Proyecto con la forma de trabajo del estudio y la regla de criterio escrita, tres skills para pedidos, respuestas y explicaciones, y una tarea semanal que deja los pedidos de documentación en borrador según el calendario del propio estudio. Ningún dato fiscal pasa por Claude y las consultas de criterio siempre llegan a una contadora."}, "si_falla": [{"sintoma": "Claude lee un mail pero no ve el PDF o la imagen que venía adjunta.", "solucion": "El conector de Gmail ve los datos del adjunto (nombre, tipo) pero no su contenido. Guarda el archivo en Google Drive (el conector de Drive sí extrae el texto de PDFs y planillas) o súbelo al chat, y pídele a Claude que lo lea desde ahí."}, {"sintoma": "Al crear la tarea programada no aparece la opción de correrla una vez por mes.", "solucion": "No existe: las frecuencias son por hora, diaria, semanal, días hábiles o manual. Déjala semanal con un prompt que mire los vencimientos de los próximos días y termine si no hay nada, o déjala en manual y corrila tú desde la página Scheduled el día que arrancas el mes."}, {"sintoma": "Claude contestó una consulta de criterio fiscal en vez de derivarla.", "solucion": "Suma esa consulta, con las palabras del cliente, a los casos de la regla de criterio en el Proyecto, marcada como CRITERIO. Abre un chat nuevo y prueba con el mismo mensaje. Hasta que salga bien, nadie manda una respuesta sin que la lea un contador."}, {"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner de la organización: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al conectar Gmail, Calendar o Drive aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "El negocio usa Google Workspace y el administrador tiene que marcar a Claude como app de confianza (Trusted) en la consola de Google, en Manage third-party app access. Después de guardar, espera unos 15 minutos y vuelve a probar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores en Organization settings → Connectors."}], "kit": [{"archivo": "pedido-de-documentacion/SKILL.md", "que_es": "Skill que arma el pedido mensual con solo lo que falta según el tipo de cliente, sin pedir claves ni datos fiscales y avisando lo que no cierra. Guárdala en una carpeta pedido-de-documentacion, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: pedido-de-documentacion\ndescription: Arma el mensaje mensual que le pide a cada cliente del estudio contable solo la documentación que falta, según su tipo de cliente. Úsala cuando pidan pedir papeles o armar el pedido del mes.\n---\n\n# Pedido de documentación\n\nArmas el mensaje con el que el estudio le pide a un cliente lo que falta para trabajar el período. El mensaje lo revisa y lo manda una persona del estudio.\n\n## Qué te pasan\n\n- El código del cliente (nunca nombre completo, CUIT ni datos fiscales).\n- El tipo de cliente y el período.\n- Lo que ya se recibió, si lo saben.\n- La fecha límite y el canal para enviar.\n\nLa lista de lo que se necesita por tipo de cliente está en el Proyecto, en el documento \"Documentación por tipo de cliente\". Si ese documento no está o el tipo de cliente no figura, no armes la lista por tu cuenta: pídela.\n\n## Cómo lo armas\n\n1. Busca la lista del tipo de cliente.\n2. Saca lo que ya se recibió.\n3. Si algo de lo recibido no está en la lista, o algo de la lista parece no aplicar a este cliente, no decidas tú: anótalo para el estudio.\n4. Escribe el mensaje.\n\n## El mensaje\n\n- Saludo corto y amable, en el trato que use el estudio (tú o usted, según el Proyecto).\n- Una lista con solo lo que falta, en palabras simples. Al lado de cada ítem, entre paréntesis, de dónde lo saca el cliente si eso está en el Proyecto.\n- La fecha límite y cómo enviarlo (canal, formato, cómo nombrar los archivos si el estudio tiene una regla).\n- Una línea de cierre que ofrezca ayuda si no encuentra algo.\n- Hasta 120 palabras.\n\n## Reglas\n\n- Nunca pidas claves fiscales, contraseñas ni códigos de acceso a organismos o bancos.\n- No des opiniones fiscales ni expliques consecuencias (\"si no lo mandas vas a pagar más\"), salvo que el estudio las haya escrito en el Proyecto.\n- No inventes vencimientos. Si te piden mencionar uno, úsalo solo si está en el calendario del estudio cargado en el Proyecto.\n- Sin tecnicismos. Si un documento tiene un nombre técnico, agrega entre paréntesis cómo lo reconoce el cliente.\n\n## Qué entregas\n\n1. El mensaje, listo para copiar.\n2. \"Para el estudio\": lo que no cerró (ítems recibidos que no estaban en la lista, ítems que quizás no aplican, datos que faltaban).\n"}, {"archivo": "proyecto-estudio-contable-regla-de-criterio.md", "que_es": "Las instrucciones para pegar en el Proyecto \"Estudio\", la tabla que separa consultas operativas, de criterio y urgentes, y el formato del calendario y de la planilla de clientes por código.", "contenido": "# Proyecto \"Estudio\": instrucciones y regla de criterio\n\nLa regla más importante del sistema es la que separa lo operativo de lo que necesita criterio del contador. Este archivo la deja por escrito, junto con las instrucciones del Proyecto, cómo se nombran los clientes y el formato del calendario.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DEL ESTUDIO], un estudio contable de [CIUDAD].\n\nPara qué estás:\n- Armar pedidos de documentación.\n- Preparar respuestas a consultas operativas de clientes.\n- Pasar a lenguaje simple resúmenes que ya preparó un contador.\n- Ordenar recordatorios según el calendario del estudio.\n\nReglas que no se rompen:\n1. Todo lo que escribes es un borrador. Lo revisa [QUIÉN REVISA] antes de enviarlo.\n2. Separa cada consulta en OPERATIVA o CRITERIO según la tabla del documento \"Regla de criterio\". Lo de criterio no se responde: se deriva al contador con una propuesta de horario.\n3. Los vencimientos salen solo del calendario del estudio. No uses lo que sepas de normas o fechas: pueden estar desactualizadas.\n4. Los clientes se nombran por código ([EJEMPLO: C-014]). Nunca escribas ni pidas CUIT, ingresos, cuentas bancarias ni claves.\n5. Al explicar un resumen, no agregues conclusiones ni recomendaciones que no estén en el texto del contador.\n6. Trato: [TÚ / USTED]. Tono: [EJEMPLO: claro, cordial, sin tecnicismos]. Firma como [NOMBRE] de [ESTUDIO].\n\n## 2. Regla de criterio (complétala con el estudio)\n\n| Tipo de consulta | Ejemplos | Qué hace Claude |\n|---|---|---|\n| OPERATIVA | Cuándo vence algo que está en el calendario del estudio, cómo mandar un comprobante, en qué estado está un trámite que el estudio informó, horarios, honorarios publicados | Responde con los datos del Proyecto |\n| CRITERIO | Si algo se puede deducir, qué régimen le conviene, cómo responder una intimación, si le conviene facturar de otra forma, qué pasa si no paga | No responde el fondo. Deriva al contador y propone horario |\n| URGENTE | Intimación con plazo corto, embargo, inspección, plazo que vence hoy | Deriva al contador y marca URGENTE para que lo vea en el día |\n| [OTRO TIPO DEL ESTUDIO] | [EJEMPLOS] | [QUÉ HACE] |\n\nCasos dudosos que ya decidió el estudio:\n- [EJEMPLO: \"¿me llegó la factura de honorarios?\" es OPERATIVA]\n- [EJEMPLO: \"¿esta factura la cargo como gasto?\" es CRITERIO]\n\n## 3. Documentación por tipo de cliente\n\nUna sección por tipo de cliente que usa el estudio ([MONOTRIBUTISTA / AUTÓNOMO / PYME / OTRO]). Para cada uno:\n- Qué se pide todos los meses.\n- Qué se pide solo en ciertos meses (y cuáles).\n- De dónde lo saca el cliente, en palabras simples.\n- Fecha límite habitual que fija el estudio.\n\n## 4. Calendario del estudio (planilla en Google Drive)\n\nLo actualiza el estudio cada vez que cambia una norma. Claude lo usa como dato y no lo corrige.\n\n| Columna | Qué va |\n|---|---|\n| fecha | AAAA-MM-DD |\n| obligacion | Nombre corto que usa el estudio |\n| aplica_a | Tipo de cliente o \"todos\" |\n| detalle | Una línea, si hace falta |\n| actualizado | Fecha y quién lo revisó |\n\nY una planilla aparte de clientes, solo con: codigo, tipo_cliente, canal_preferido, responsable_del_estudio. Nada de CUIT ni datos fiscales.\n\n## 5. Lo que el estudio decide por escrito antes de empezar\n\n- [ ] Qué información de clientes puede pasar por Claude y cuál no (secreto profesional).\n- [ ] Quién revisa los borradores y en qué plazo.\n- [ ] Quién actualiza el calendario y cada cuánto: [NOMBRE].\n"}, {"archivo": "tarea-programada-vencimientos-estudio-contable.md", "que_es": "La tarea programada semanal lista para pegar: checklist previa, configuración en Cowork (sin opción mensual) y el prompt que cruza el calendario con los clientes y deja los pedidos en borrador.", "contenido": "# Tarea programada: vencimientos de la semana y pedidos de documentación\n\nLas tareas programadas de Claude se pueden configurar por hora, diaria, semanal, días hábiles o manual. No hay opción mensual. Por eso esta tarea corre todos los lunes y mira los vencimientos de los próximos días: la semana que no hay nada, lo dice y termina. Si prefieres correrla solo a principio de mes, déjala en manual y ejecútala tú ese día.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es del estudio y tiene un plan pago.\n- [ ] Gmail y Google Drive están conectados con la cuenta del estudio y funcionan en un chat normal.\n- [ ] El calendario del estudio y la planilla de clientes (solo códigos) están en Google Drive con las columnas del archivo del Proyecto.\n- [ ] El documento \"Documentación por tipo de cliente\" también está en Drive, porque la tarea no lee los archivos del Proyecto.\n- [ ] Probaste el prompt de abajo a mano en un chat.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral y New task. Elige \"Create with Claude\" y pégale este archivo, o \"Set up manually\" y completa nombre, prompt, modo de aprobación y frecuencia. En la experiencia nueva de Claude también puedes pedirla en una conversación y confirmar con \"Schedule\".\n\nConfiguración sugerida:\n- Nombre: Vencimientos y pedidos de la semana\n- Frecuencia: semanal (weekly), el lunes a primera hora. O manual, si solo la quieres a principio de mes.\n- Aprobación: el modo que pide permiso antes de actuar. Revisa cada corrida en la página Scheduled.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de [NOMBRE DEL ESTUDIO].\n\n1. Abre en Google Drive el calendario \"[NOMBRE DE LA PLANILLA DE CALENDARIO]\" y toma las obligaciones con fecha entre hoy y los próximos [N] días.\n2. Si no hay ninguna, responde \"Sin vencimientos en los próximos [N] días\" y termina.\n3. Abre \"[NOMBRE DE LA PLANILLA DE CLIENTES]\" y cruza: qué códigos de cliente tienen cada obligación según su tipo_cliente.\n4. Abre \"[NOMBRE DEL DOCUMENTO DE DOCUMENTACIÓN POR TIPO]\" y, para cada cliente con una obligación próxima, arma el pedido de documentación con lo que corresponde a su tipo. Mensaje corto, sin tecnicismos, con la fecha límite [CUÁNTOS DÍAS ANTES DEL VENCIMIENTO] y el canal para enviar.\n5. Si el canal_preferido del cliente es mail, crea un borrador en Gmail dirigido a la dirección que figure en [DÓNDE ESTÁN LOS MAILS DE CLIENTES]. Si es otro canal, deja el texto en el resumen.\n\nReglas:\n- No envíes ningún mail. Solo borradores.\n- Usa solo códigos de cliente. No escribas CUIT ni datos fiscales.\n- No agregues vencimientos que no estén en el calendario ni opiniones fiscales.\n- No modifiques las planillas.\n\nAl final déjame: \"Vencimientos próximos\" (fecha, obligación, a quiénes aplica), \"Borradores creados\" (código y obligación) y \"Para mandar por otro canal\" (código y texto listo).\n\n## Las primeras semanas\n\n- [ ] Un contador revisa cada borrador antes de enviarlo y anota qué corrigió.\n- [ ] Si un pedido trae algo que no aplica, se corrige el documento de documentación por tipo, no el borrador.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

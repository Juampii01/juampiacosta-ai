<script>var GUIA = {"slug": "videos-virales-plantilla-hypit", "t": "Convierte un video que funciona en una plantilla y ármalo con IA", "d": "Hypit analiza un video y lo convierte en un flujo reutilizable; Claude Code con HyperFrames arma tu versión con tu voz o una voz de IA, y Rhubarb Lip Sync hace hablar a tu mascota digital.", "tema": "Contenido y redes", "min": 8, "ficha": [["Qué es", "Hypit convierte un video en un flujo reutilizable y, con Claude Code, arma tu versión hasta el video terminado, con tu voz o una de IA. HyperFrames suma piezas hechas con código, como placas y gráficos."], ["Para quién", "Creadores que quieren partir de estructuras que ya funcionan."], ["Necesitas", "Claude Code, Hypit, HyperFrames y, para mascotas, Rhubarb Lip Sync."], ["Cuánto cuesta", "Las tres herramientas son gratis; los modelos de generación y las voces de IA se pagan aparte."], ["Ojo", "Copia la estructura, no el contenido, la música ni la cara de otros."]], "secciones": [{"h": "Las piezas", "lista": ["Hypit: le da a tu agente un sistema para hacer video. Le pasas un video y lo clona como un flujo completo (gancho, ritmo, escenas, subtítulos y efectos). Es gratis, con licencia propia basada en Apache 2.0 con condiciones. <a href=\"https://github.com/hypit-ai/hypit\" target=\"_blank\" rel=\"noopener\">github.com/hypit-ai/hypit ↗<\/a>", "HyperFrames: escribes el video en HTML y lo convierte en MP4 (Apache 2.0). Es un proyecto aparte de Hypit, de HeyGen, ideal para placas, títulos animados, gráficos y subtítulos hechos con código. Pide Node.js 22 o más nuevo y FFmpeg. <a href=\"https://github.com/heygen-com/hyperframes\" target=\"_blank\" rel=\"noopener\">github.com/heygen-com/hyperframes ↗<\/a>", "Rhubarb Lip Sync: analiza tu audio y genera qué forma de boca va en cada momento, para animar a un personaje 2D (MIT). <a href=\"https://github.com/DanielSWolf/rhubarb-lip-sync\" target=\"_blank\" rel=\"noopener\">github.com/DanielSWolf/rhubarb-lip-sync ↗<\/a>", "Claude Code: el agente que junta todo."]}, {"h": "1. De video a plantilla", "lista": ["Instalación de Hypit, en la terminal: npx skills add hypit-ai/hypit -g. La primera vez, tu agente revisa si falta el programa de Hypit y te ayuda a prepararlo.", "Instalación de HyperFrames, en la terminal: claude plugin marketplace add heygen-com/hyperframes y claude plugin install hyperframes@hyperframes"], "prompts": [{"t": "Analizar", "c": "/hypit Analiza este video [ARCHIVO] y conviértelo en un flujo reutilizable: gancho, ritmo, escenas, subtítulos y visuales. Quédate solo con la estructura, no con el guion, la música, las imágenes ni la cara de nadie. Antes de usar modelos pagos, dime cuáles y cuánto cuestan."}]}, {"h": "2. Que el agente arme el video", "prompts": [{"t": "Armar", "c": "/hypit Con el flujo anterior, arma un video vertical sobre [MI TEMA] con mi marca [COLORES, LOGO]. Usa estos recursos míos: [B-ROLL, FOTOS DE PRODUCTO, CLIPS]. Si hace falta una placa o un gráfico hecho con código, hazlo con HyperFrames. Muéstrame la vista previa antes de exportar."}]}, {"h": "3. La voz: tú eliges", "lista": ["Graba tu guion y pásale la pista de audio.", "O usa una voz de IA (por ejemplo ElevenLabs)."], "aviso": "Si usas una voz clonada, que sea la tuya o la de alguien que te dio permiso por escrito. Clonar la voz de otra persona sin permiso viola sus derechos."}, {"h": "4. Haz hablar a tu mascota digital", "p": ["Rhubarb usa seis formas básicas de boca (A a F), que son obligatorias, y tres opcionales (G, H y X). Necesitas un dibujo de la boca de tu mascota para cada forma que uses. Ojo con el idioma: el reconocedor que viene por defecto solo entiende inglés; para audio en español hay que usar el reconocedor phonetic (-r phonetic). Y el audio tiene que estar en WAV u OGG."], "prompts": [{"t": "Sincronizar la boca", "c": "Con Rhubarb Lip Sync, sincroniza la boca de mi mascota [DIBUJOS DE LA BOCA: A, B, C, D, E, F y X] con este audio [ARCHIVO] e intégralo en la escena de HyperFrames."}]}, {"h": "5. Dirige la edición con tu voz", "prompts": [{"t": "Ajustes", "c": "Haz el gancho más corto, sube los subtítulos para que no tapen la cara y cambia la tercera escena por el clip [ARCHIVO]. Vuelve a mostrarme la vista previa."}]}, {"h": "Lo que conviene saber", "lista": ["Copia la estructura (gancho, ritmo, escenas), no el contenido, la música, las imágenes ni la cara de otros: todo eso tiene derechos.", "Usa solo caras y voces propias o con permiso.", "Indica que es contenido hecho con IA cuando la plataforma lo pida.", "Los modelos de generación (de Hypit o tu propia API) tienen sus propias cuentas y costos."]}], "faq": [{"q": "¿Necesito saber editar?", "a": "No. Describes lo que quieres y el agente arma el borrador; tú revisas."}, {"q": "¿Es todo gratis?", "a": "Hypit, HyperFrames y Rhubarb sí. Pagas tu plan de Claude y, si los usas, los modelos de generación y las voces de IA."}], "usos": [{"e": "Plantilla", "c": "azul", "t": "De video a plantilla", "d": "Gancho, ritmo y estructura con Hypit."}, {"e": "Armar", "c": "morado", "t": "El agente edita", "d": "HyperFrames escribe el video y lo renderiza."}, {"e": "Voz", "c": "verde", "t": "Tuya o de IA", "d": "Tu audio o una voz de IA con permiso."}, {"e": "Mascota", "c": "rosa", "t": "Que hable tu mascota", "d": "Rhubarb mueve la boca al ritmo del audio."}], "fuentes": ["https://github.com/hypit-ai/hypit", "https://github.com/heygen-com/hyperframes", "https://github.com/DanielSWolf/rhubarb-lip-sync", "https://raw.githubusercontent.com/hypit-ai/hypit/HEAD/LICENSE", "https://raw.githubusercontent.com/hypit-ai/hypit/HEAD/docs/guide/agents.md", "https://github.com/DanielSWolf/rhubarb-lip-sync/releases", "https://hyperframes.heygen.com/quickstart"], "ejemplo": {"titulo": "Ejemplo resuelto: un video de ranking para una tienda de mates con su mascota", "negocio": "Ejemplo inventado: una tienda online de mates y bombillas de Rosario, Santa Fe. La manejan dos socios, venden por Instagram y TikTok, y tienen una mascota dibujada: un termo con cara que usan en el logo.", "punto_de_partida": "Vieron un video de ranking de otra cuenta (cinco cosas ordenadas de peor a mejor) que les pareció que retenía muy bien. Quieren uno igual de estructura sobre tipos de mate, con su mascota hablando, sin copiar el original ni pagar un editor.", "pasos": ["En la terminal instalaron la skill de Hypit con npx skills add hypit-ai/hypit -g y el plugin de HyperFrames con claude plugin marketplace add heygen-com/hyperframes y claude plugin install hyperframes@hyperframes. Comprobaron que tenían Node.js 22 o más y FFmpeg.", "Bajaron el video de referencia a la carpeta del proyecto y completaron la plantilla de estructura del kit: gancho de 2 segundos con una pregunta polémica, cinco tramos con un cartel de ranking y remate con el número uno.", "En Claude Code escribieron /hypit con el prompt de análisis corregido. El agente explicó por qué retenía el video, armó el flujo y avisó qué partes podía hacer sin modelos pagos (subtítulos, tablero de ranking, fotos propias) y cuáles necesitarían uno.", "Decidieron no usar modelos de generación: le pasaron fotos propias de cada mate y el logo. Uno de los socios grabó el guion con su voz en el celular.", "Para la mascota dibujaron las seis bocas básicas y la de reposo (A a F y X) con el mismo encuadre. Con la skill mascota-que-habla del kit, el agente convirtió el audio a WAV, corrió rhubarb -r phonetic --extendedShapes X -f json -o boca.json voz.wav y armó la capa de la boca.", "Pidieron una placa de cierre con HyperFrames: el logo, el usuario de la cuenta y una entrada suave.", "Revisaron la vista previa y dirigieron con frases del pack de prompts: acortar el gancho, subir los subtítulos y bajar la música. Con la revisión final del pack confirmaron que no quedara nada del video original.", "Exportaron la versión final y la publicaron con música de la biblioteca de la red."], "resultado": "Tienen un video de ranking con su estructura propia, su voz, sus fotos y su mascota hablando, sin nada copiado del original. El flujo queda guardado en el proyecto, así que el próximo ranking (bombillas, yerbas) se arma cambiando el contenido y volviendo a grabar la voz."}, "si_falla": [{"sintoma": "Rhubarb mueve la boca de la mascota casi al azar con un audio en español.", "solucion": "Estás usando el reconocedor por defecto, que solo entiende inglés. Agrega -r phonetic al comando. Si tu mascota no tiene dibujos G y H, suma --extendedShapes X (o --extendedShapes \"\" si tampoco tiene X)."}, {"sintoma": "Rhubarb no abre el audio o tira un error con el archivo de entrada.", "solucion": "Solo acepta WAV u OGG. Convierte el audio con FFmpeg, por ejemplo ffmpeg -i voz.mp3 -ac 1 -ar 44100 voz.wav, y pásale el archivo convertido como último argumento del comando."}, {"sintoma": "La vista previa de Hypit o de HyperFrames te da una dirección localhost que no abre en tu computadora.", "solucion": "Pasa cuando el agente corre en una máquina remota. La guía de Hypit aclara que un localhost de la máquina remota no es una dirección de tu computadora: usa la función de reenvío de vista previa o de entrega de archivos de ese entorno, o corre Claude Code en tu propia computadora."}, {"sintoma": "HyperFrames no renderiza o falla al arrancar.", "solucion": "Revisa los requisitos: Node.js 22 o más nuevo (node --version) y FFmpeg instalado (ffmpeg -version). Si instalaste las skills con npx skills add y no coinciden con tu versión del programa, el README recomienda npx hyperframes skills update, que baja las skills de la misma versión que tu CLI."}, {"sintoma": "Hypit te pide credenciales de servicios o te avisa costos que no esperabas.", "solucion": "Los modelos de generación son opcionales y cada servicio cobra aparte. Pídele que arme el video solo con subtítulos, gráficos y tus recursos, o que te diga qué modelo y servicio va a usar y cuánto cuesta antes de generar."}], "kit": [{"archivo": "mascota-que-habla/SKILL.md", "que_es": "Skill para Claude Code que guía todo el proceso de Rhubarb: convertir el audio, elegir el reconocedor según el idioma, generar el JSON de bocas y armar la capa de la boca en HyperFrames o Hypit. Cópiala en .claude/skills/mascota-que-habla/ o súbela como ZIP.", "contenido": "---\nname: mascota-que-habla\ndescription: 'Sincroniza la boca de una mascota o personaje 2D con un audio usando Rhubarb Lip Sync y arma la capa para HyperFrames o Hypit. Úsala cuando quieran que su mascota o logo con cara hable con una voz.'\n---\n\n# Mascota que habla (Rhubarb Lip Sync)\n\nConviertes un audio en una lista de formas de boca con tiempos y la usas para cambiar el dibujo de la boca en el video. No generas la voz ni dibujas la mascota: eso lo trae la persona.\n\n## Qué te tienen que pasar\n\n1. El audio de la voz (cualquier formato; lo conviertes tú).\n2. Los dibujos de la boca, uno por forma, con nombres boca-A.png, boca-B.png, boca-C.png, boca-D.png, boca-E.png, boca-F.png y, si los tiene, boca-G.png, boca-H.png y boca-X.png. Mismo tamaño y mismo encuadre en todos.\n3. El dibujo de la mascota sin boca (o con la boca en reposo) y dónde va la boca.\n4. El idioma del audio.\n\nSi falta alguno de los seis básicos (A a F), frena y pídelo: Rhubarb los necesita sí o sí. G, H y X son opcionales.\n\n## Pasos\n\n1. Comprueba que Rhubarb esté instalado: rhubarb --version. Si no está, guía a la persona para bajar la última versión para su sistema desde la página de releases del repositorio oficial (DanielSWolf/rhubarb-lip-sync) y descomprimirla. En macOS, si el sistema bloquea el programa la primera vez, explícale cómo permitirlo desde la configuración de seguridad.\n2. Rhubarb solo lee WAV u OGG. Si el audio viene en otro formato, conviértelo con FFmpeg:\n   ffmpeg -i voz-original.mp3 -ac 1 -ar 44100 voz.wav\n3. Elige el reconocedor:\n   - Audio en inglés: el de siempre (no hace falta poner nada).\n   - Cualquier otro idioma, incluido el español: -r phonetic.\n4. Elige las formas opcionales según los dibujos que haya. Si solo tiene X además de A a F: --extendedShapes X. Si no tiene ninguna opcional: --extendedShapes \"\".\n5. Corre Rhubarb con salida JSON. Ejemplo para español con X:\n   rhubarb -r phonetic --extendedShapes X -f json -o boca.json voz.wav\n   Para inglés puedes sumar el guion con -d guion.txt, que mejora el resultado.\n6. Abre boca.json. Tiene una lista mouthCues con start, end (en segundos) y value (la letra de la boca). Muéstrale a la persona las primeras líneas para que vea que salió bien.\n7. Arma la capa de la boca:\n   - En HyperFrames: una imagen de la boca encima de la mascota que cambia de archivo según el tiempo, siguiendo boca.json, con la misma duración que el audio. Usa la skill /hyperframes para que la animación sea compatible con su render.\n   - En Hypit: describe la capa de la boca como un componente del proyecto que lee boca.json, siguiendo las referencias de la skill de Hypit.\n8. Muestra la vista previa con el audio antes de renderizar o exportar.\n\n## Revisión antes de entregar\n\n- La boca se cierra (A) en las P, B y M.\n- En las pausas queda en reposo (X, o A si no hay X).\n- No hay saltos raros entre C, D y E: si los hay, revisa que los dibujos tengan el mismo encuadre.\n- Si la voz es clonada, confirma que sea de la persona o de alguien que dio permiso por escrito.\n"}, {"archivo": "plantilla-estructura-video-referencia.md", "que_es": "Plantilla para desarmar un video que funciona en tramos, separar lo que se puede reusar de lo que tiene dueño y armar el pedido para /hypit.", "contenido": "# Plantilla de estructura de un video de referencia\n\nCompleta una por cada video que te gusta. Sirve para pedirle a Hypit (o a Claude) un video nuevo con la misma estructura, sin copiar lo que es de otro.\n\n## 1. El video de referencia\n\n- Link o archivo: [LINK]\n- Cuenta: [@CUENTA]\n- Duración: [SEGUNDOS]\n- Formato: [vertical / cuadrado / horizontal]\n- Por qué lo elegí: [qué me hizo quedarme mirando]\n\n## 2. La estructura (esto sí se puede reusar)\n\n| Tramo | Desde - hasta | Qué pasa | Qué lo hace funcionar |\n|---|---|---|---|\n| Gancho | [0 - 2 s] | [pregunta, frase rara, imagen que sorprende] | [por qué no lo pasas] |\n| Promesa | [2 - 5 s] | [qué vas a ver si te quedas] | |\n| Desarrollo 1 | | | |\n| Desarrollo 2 | | | |\n| Remate | | [la respuesta, el giro, el resultado] | |\n| Cierre o llamado | | [sigue, comenta, link] | |\n\n- Ritmo: [cada cuánto cambia el plano, si hay cortes al ritmo de la música o de las palabras]\n- Subtítulos: [palabra por palabra / frase completa, posición, color que resalta]\n- Recursos visuales: [B-roll, capturas, emojis, carteles, zoom]\n- Sonido: [voz en off, música de fondo, efectos en momentos clave]\n\n## 3. Lo que NO se copia (tiene dueño)\n\n- [ ] El guion o los chistes textuales del video.\n- [ ] La música (usa música con licencia o de la biblioteca de la red).\n- [ ] Las imágenes, clips o capturas del video original.\n- [ ] La cara, la voz o el nombre de la persona que aparece.\n- [ ] El logo o la marca de la cuenta.\n\n## 4. Mi versión\n\n- Tema: [MI TEMA]\n- Mi gancho (con mis palabras): [GANCHO]\n- Qué cambia en cada tramo: [una línea por tramo]\n- Mis recursos: [mis clips, fotos de producto, capturas propias]\n- Voz: [la mía grabada / voz de IA con permiso / mascota]\n- Marca: [colores, tipografía, logo]\n- ¿Lleva personas, voces o escenas realistas hechas con IA? [sí / no] Si es sí, marcarlo como IA al publicar.\n\n## 5. Pedido para el agente (copia y completa)\n\n/hypit Toma como referencia este video [ARCHIVO] solo por su estructura: [PEGAR LA TABLA DE LA SECCIÓN 2]. Arma mi versión con lo de la sección 4. No uses su guion, su música, sus imágenes ni la cara o la voz de nadie que aparezca. Antes de generar material con modelos pagos, dime qué vas a usar y cuánto cuesta. Muéstrame la vista previa antes de exportar.\n"}, {"archivo": "pack-prompts-direccion-video-hypit.md", "que_es": "Prompts listos para preparar el entorno sin gastar de más, clonar la estructura, hacer variantes de gancho, sumar placas con HyperFrames y revisar antes de exportar.", "contenido": "# Pack de prompts para dirigir el video con el agente\n\nPara usar en Claude Code con la skill de Hypit (y HyperFrames si sumas placas hechas con código). Cambia lo que está entre corchetes.\n\n## Preparar el terreno\n\n**Revisar el entorno**\n/hypit Antes de empezar, revisa si está todo lo que necesitas en mi computadora para hacer un video. Dime qué falta y qué vas a instalar, y espera mi OK antes de instalar nada.\n\n**Cuentas y costos**\n/hypit No uses ningún modelo pago todavía. Dime qué partes de este video se pueden hacer solo con subtítulos, gráficos y mis recursos, sin llamar a un modelo de generación, y cuáles necesitarían uno y con qué servicio.\n\n## Clonar la estructura\n\n**Analizar**\n/hypit Mira este video [ARCHIVO], revisa sus cuadros y lo que se dice, y explícame en criollo por qué retiene: gancho, ritmo, cortes, subtítulos y remate. Después arma el flujo para hacer uno nuevo con esa estructura, sin usar su guion, su música, sus imágenes ni la cara de nadie.\n\n**Mi versión**\n/hypit Con ese flujo, arma mi versión sobre [TEMA], con mi marca [COLORES, LOGO] y estos recursos míos: [CLIPS, FOTOS]. Voz: [ARCHIVO DE MI VOZ / VOZ DE IA]. Muéstrame la vista previa en Studio antes de exportar.\n\n**Variantes de gancho**\n/hypit Haz 3 versiones del mismo video cambiando solo los primeros 2 segundos: [GANCHO 1], [GANCHO 2], [GANCHO 3]. El resto queda igual.\n\n## Una placa o gráfico con HyperFrames\n\n/hyperframes Arma una placa vertical de 4 segundos con el título [TÍTULO], mis colores [COLORES] y una entrada suave. Muéstrame la vista previa y después renderizala a MP4 para sumarla al video.\n\n## Ajustes con tu voz\n\n- \"El gancho dura mucho, córtalo a la mitad.\"\n- \"Sube los subtítulos: tapan la cara.\"\n- \"Cambia la tercera escena por este clip [ARCHIVO].\"\n- \"La música tapa la voz, bájala.\"\n- \"Ese corte llega tarde: que caiga justo en la palabra [PALABRA].\"\n- \"Vuelve a mostrarme la vista previa.\"\n\n## Antes de publicar\n\n/hypit Revisa el video final: errores en subtítulos, cortes bruscos, partes donde la voz y la imagen no coinciden, y cualquier cosa que haya quedado del video de referencia (texto, logo, música). Lístame lo que encuentres antes de exportar la versión final.\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

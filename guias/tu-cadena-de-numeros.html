<script>var GUIA = {"slug": "tu-cadena-de-numeros", "t": "Tu cadena de números: cuántos mensajes mandar por día", "d": "Parte de cuánto quieres facturar y llega, paso a paso, a cuántos contactos tienes que hacer hoy. Con ejemplo y prompt para calcular la tuya.", "tema": "El roadmap para vender IA", "min": 8, "ficha": [["Qué es", "Una cuenta hacia atrás: de la facturación al trabajo diario"], ["Necesitas", "Tu meta del mes, tu precio y tasas de referencia"], ["Cuánto lleva", "10 minutos una vez; después lo revisas cada semana"]], "secciones": [{"h": "Por qué hacer la cuenta", "p": ["\"Quiero conseguir clientes\" no se puede hacer hoy. \"Hoy hago 16 contactos\" sí. La cadena de números convierte una meta del mes en una tarea del día, y te dice si tu meta es realista con el tiempo que tienes.", "Se arma hacia atrás: facturación → clientes → llamadas → agendamientos → contactos. En cada paso divides por una tasa: cuántos de cada 100 pasan al siguiente."]}, {"h": "La cuenta, paso a paso", "pasos": ["Meta del mes: cuánto quieres facturar con clientes nuevos. Si nunca facturaste con esto, una meta prudente es entre 1.000 y 2.000 dólares.", "Clientes necesarios = meta ÷ precio de tu solución.", "Llamadas de venta = clientes ÷ tasa de cierre. Para planificar, usa una tasa baja, por ejemplo 10%. Si cierras más, mejor.", "Agendamientos = llamadas ÷ tasa de asistencia. No todos los que agendan se presentan; una referencia es 6 de cada 10.", "Contactos del mes = agendamientos ÷ tasa de agendamiento. Depende mucho del canal (mira la sección siguiente).", "Contactos por día = contactos del mes ÷ días que vas a prospectar."]}, {"h": "Un ejemplo con números", "lista": ["Meta: 5.000 dólares. Precio: 2.500. Clientes: 2.", "Cierre del 10%: 20 llamadas de venta.", "Asistencia de 6 de cada 10: unos 32 agendamientos.", "Agendamiento del 10% (ofreciendo un diagnóstico gratis por llamada): 320 contactos al mes.", "En 20 días de trabajo: 16 contactos por día."], "aviso": "Las tasas cambian muchísimo según el canal. Un mensaje frío por WhatsApp puede agendar 1 de cada 100, no 10: ahí el volumen se multiplica por diez. Usa estas cifras para arrancar y reemplázalas por las tuyas a las 3 o 4 semanas."}, {"h": "Qué tasas usar al principio", "lista": ["Contacto a reunión: el promedio que se suele citar para prospección en frío es de 2 a 3 de cada 100, y los mejores equipos llegan a 5 u 8. Esperar 20 de cada 100 lleva a frustrarse y abandonar.", "Si lo que ofreces para agendar es un diagnóstico gratis y no \"una reunión de ventas\", la tasa sube.", "Asistencia: confirma por WhatsApp el día anterior y pide un formulario corto antes de la llamada; las dos cosas suben la asistencia.", "Cierre: con un buen diagnóstico y el retorno bien calculado, el cierre sube mucho. Para planificar, igual arranca bajo."]}, {"h": "Calcula la tuya con Claude", "prompts": [{"t": "Mi cadena de números", "c": "Quiero calcular mi cadena de números para vender [TU SOLUCIÓN] a [TIPO DE NEGOCIO].\nMeta de facturación del mes: [META] dólares.\nPrecio de la solución: [PRECIO] dólares.\nDías que voy a prospectar por mes: [DÍAS].\nCanal principal: [CANAL: llamada, WhatsApp, Instagram, mail, en persona].\n\n1. Haz la cuenta hacia atrás con estas tasas iniciales: cierre 10%, asistencia 60% y agendamiento [10% si ofrezco diagnóstico gratis por llamada / 2% si es mensaje frío por escrito]. Muéstrame cada paso.\n2. Dime cuántos contactos tengo que hacer por día y por semana.\n3. Si el número diario es más de lo que puedo hacer en [HORAS] horas por día, dime qué palanca mover primero: precio, canal o meta.\n4. Arma una tabla para que yo complete con mis tasas reales a fin de mes."}]}], "faq": [{"q": "¿Y si el número me da altísimo?", "a": "Tienes tres palancas: subir el precio (menos clientes necesarios), cambiar a un canal que agende más (llamada o en persona en vez de mensaje frío) o bajar la meta del primer mes. No bajes la cantidad de contactos sin mover otra palanca."}, {"q": "¿Cada cuánto la recalculo?", "a": "Una vez por mes con tus tasas reales. Las primeras semanas son hipótesis; desde el mes dos ya tienes datos."}], "cat": "roadmap", "parte": "construi"};</script>

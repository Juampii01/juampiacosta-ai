<script>var GUIA = {"slug": "los-metodos-para-conseguir-clientes", "t": "Los 10 métodos para conseguir clientes y cómo elegir 2 o 3", "d": "Llamada en frío, WhatsApp, mail, en persona, comunidades, contenido, eventos, plataformas, referidos y anuncios: qué tiene cada uno y con cuáles empezar.", "tema": "El roadmap para vender IA", "min": 9, "secciones": [{"h": "La idea", "p": ["Todos los métodos funcionan. Cuando uno \"no funciona\", casi siempre faltó volumen o faltó mejorar el mensaje. El error es probar uno una semana, cambiar a otro y no llegar a ninguna parte.", "Elige 2 o 3 según tu personalidad, tus contactos y tu país, y sostenlos varias semanas sin cambiar."]}, {"h": "Los métodos directos (resultados en días)", "lista": ["Llamada en frío: no cuesta nada y es el más rápido: puedes agendar hoy. Es un juego de números y pide tolerar el rechazo. El más potente y el más incómodo.", "Mensaje por WhatsApp: gratis y directo, con poco rechazo explícito. Es el más fácil de volver invasivo y tiene riesgo de bloqueo del número si mandas en frío a muchos.", "Mail en frío: lento y con curva de aprendizaje. En Latinoamérica suele rendir bastante menos que WhatsApp; en Estados Unidos funciona mejor.", "En persona: la tasa de éxito más alta. Es el único método donde puedes cerrar en la primera visita. Rinde mucho con negocios locales."]}, {"h": "Los métodos que se acumulan (resultados en meses)", "lista": ["Comunidades: grupos de Facebook, Skool, Discord, cámaras y asociaciones del rubro. Aportas valor, muestras lo que sabes hacer y llegan consultas. Con asociaciones puedes acordar un descuento para socios.", "Contenido: Instagram, LinkedIn o YouTube (elige uno). Al principio casi no trae consultas, pero cada pieza queda trabajando. Mide llamadas agendadas, no vistas: un video con 20 vistas puede cerrar un cliente.", "Eventos presenciales del rubro: uno por mes. Si comunicas bien, rinden mucho.", "Plataformas para freelancers: lentas al principio.", "Referidos: hacer un trabajo excelente y pedirlos de forma activa. No llegan solos.", "Anuncios pagos: necesitan presupuesto y saber hacerlo. Son el siguiente nivel, no el punto de partida: primero tu forma de vender tiene que funcionar."]}, {"h": "Con cuáles empezar", "lista": ["Si te cuesta hablar por teléfono: en persona con negocios locales + WhatsApp a los que visitaste + contenido.", "Si te animas a llamar: llamada en frío como principal + WhatsApp como seguimiento + contenido.", "Si vas a venderle a empresas: llamada + LinkedIn + mail, cruzando canales (\"ayer te llamé…\").", "En todos los casos: el contenido convive con lo directo. Quien recibe tu mensaje va a mirar tu perfil."], "aviso": "Antes de mandar mensajes en frío, revisa las reglas de cada plataforma. Nunca uses un número nuevo ni herramientas no oficiales para mandar en volumen: es la forma más rápida de perder el número."}, {"h": "Arma tu lista de prospectos con Claude", "p": ["Busca por zona acotada (una ciudad o provincia, no un país entero). Antes de contactar, investiga al dueño: su perfil, su web y cómo atienden hoy. Probar el negocio como cliente (mandar una consulta fuera de horario) te da la mejor apertura posible."], "prompts": [{"t": "Investigar un prospecto antes de contactarlo", "c": "Voy a contactar a [NEGOCIO] de [CIUDAD], rubro [RUBRO]. Su web es [URL] y su Instagram es [@USUARIO]. Busca en su web y redes: qué venden, a quién, cómo atienden consultas hoy, si tienen WhatsApp o formulario, si hacen publicidad y quién es el dueño o responsable. Después dame: 1) un dolor probable relacionado con [TU SOLUCIÓN], con la evidencia que lo sugiere; 2) una observación concreta para abrir la conversación; 3) qué no pude confirmar."}]}], "faq": [{"q": "¿Puedo usar los 10 a la vez?", "a": "No te lo recomiendo. Dos o tres bien hechos todos los días rinden más que diez a medias."}, {"q": "¿Qué método para negocios de otro país?", "a": "Mail, WhatsApp y llamada funcionan a distancia. Cada país tiene sus costumbres: en algunos desconfían de números de otras ciudades, y ahí necesitas más volumen o cambiar de canal."}], "cat": "roadmap", "parte": "construi"};</script>

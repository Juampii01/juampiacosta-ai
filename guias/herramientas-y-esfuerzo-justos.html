<script>var GUIA = {"slug": "herramientas-y-esfuerzo-justos", "t": "Herramientas y esfuerzo justos: prende solo lo que vas a usar", "d": "Búsqueda web, Research, conectores, razonamiento, nivel de esfuerzo y artifacts: cuándo te conviene prenderlos y cuándo apagarlos para que tu plan rinda más.", "tema": "Gasta menos tokens", "min": 8, "secciones": [{"h": "Por qué las herramientas pesan", "p": ["El centro de ayuda lo dice directo: las herramientas y los conectores consumen muchos tokens. Cada conector que se carga ocupa lugar en la conversación, y lo que trae una búsqueda también entra al chat.", "La regla es simple: prende lo que esa conversación necesita y nada más."]}, {"h": "Búsqueda web", "lista": ["Préndela cuando: necesitas información actual (precios de hoy, noticias, una norma que cambió).", "Apágala cuando: tú ya le pasas el material, o la pregunta no depende de algo reciente.", "Ojo con los links largos: si le pasas un artículo para analizar, el artículo entero entra en el chat."], "pasos": ["En el chat, toca el botón + abajo a la izquierda.", "Toca Web search (búsqueda web). Si tiene la tilde, está prendida; si no, está apagada."], "aviso": "En la nueva experiencia de Claude (chat y Cowork unidos) no hay interruptor: Claude busca cuando le parece útil. Si no quieres que busque, dilo en tu mensaje: \"no busques en la web, usa solo lo que te paso\"."}, {"h": "Research", "p": ["Research hace varias búsquedas seguidas, decide qué mirar después según lo que encuentra y revisa tus conectores. Es para investigaciones de verdad, no para una pregunta rápida. La ayuda avisa que puede gastar tu límite más rápido, porque trae muchas fuentes y arma respuestas largas.", "Está en los planes pagos y siempre corre con Opus 5.5 (o Opus 4.8 si hace falta), sin importar qué modelo tengas elegido en el chat."], "pasos": ["Verifica que la búsqueda web esté prendida: Research la necesita.", "Toca + abajo a la izquierda y elige Research. Aparece un indicador azul.", "Cuando termines, tócalo de nuevo para apagarlo.", "En la nueva experiencia también puedes escribir /deep-research."], "prompts": [{"t": "Research bien acotado", "c": "Investiga [PREGUNTA CONCRETA].\nEnfócate solo en: [2 O 3 ASPECTOS].\nZona y período: [PAÍS O REGIÓN, AÑOS].\nNo me interesa: [LO QUE QUIERES DEJAR AFUERA].\nEntrega: un resumen de 10 líneas y una tabla con las fuentes."}]}, {"h": "Conectores: elige cómo se cargan", "p": ["Los conectores (Gmail, Drive, calendario y demás) ocupan lugar en cada conversación. Puedes elegir cómo se cargan, chat por chat: toca + (o escribe /), pasa por Connectors (conectores) y elige Tool access (acceso a herramientas)."], "lista": ["Auto: Claude decide qué conectores cargar según lo que estás haciendo. Es la opción por defecto y el mejor punto de partida.", "Always available (siempre disponibles): todos se cargan al empezar. Sirve si tienes pocos y los usas todo el tiempo, pero ocupa más lugar desde el arranque.", "On demand (a pedido): se cargan solo cuando Claude busca el que necesita. Conviene si tienes muchos conectores o si tus chats llegan al límite de largo. Suma un paso de búsqueda."], "aviso": "Lo que eliges vale solo para esa conversación. En la nueva experiencia, los conectores se manejan desde Customize → Connectors."}, {"h": "Esfuerzo y razonamiento", "p": ["El nivel de esfuerzo (Effort) define qué tan a fondo trabaja Claude en cada respuesta. La ayuda es clara: más esfuerzo da respuestas más completas, pero tardan más y usan más tokens.", "Para cambiarlo, toca el nombre del modelo al lado del botón de enviar y entra a Effort. El menú marca como Default (por defecto) el nivel recomendado para cada modelo. Ahí mismo, en algunos modelos, está el interruptor Thinking o Extended (razonamiento extendido): si está prendido, Claude piensa antes de responder."], "lista": ["Low o Medium: tareas de rutina. Mails, resúmenes, preguntas simples.", "High: el mejor equilibrio general para trabajo que importa.", "Extra high: trabajos largos de programación y tareas de agentes.", "Max: el razonamiento más profundo. Para problemas difíciles de verdad.", "Razonamiento apagado: si el modelo lo permite y la tarea es simple, apágalo. En los modelos donde no se puede apagar, baja el esfuerzo."]}, {"h": "Artifacts y tareas de varios pasos", "p": ["Crear artifacts (documentos, tableros o apps que se abren al costado del chat) y las tareas de varios pasos (buscar, ejecutar código, armar archivos) suman a tu uso: la ayuda los nombra entre lo que pesa en tu límite, y avisa que crear archivos gasta más que un chat normal. Úsalos cuando el resultado lo vale."], "lista": ["Si solo quieres leer una respuesta: pide \"responde en el chat, sin crear un archivo\".", "Si quieres cambiar una parte de un documento: marca el texto, toca Edit with Claude (editar con Claude) y pide el cambio. Claude edita donde marcaste.", "Si quieres cambiar un detalle: pide solo ese cambio (\"cambia el título y deja todo lo demás igual\") en vez de pedir que lo rehaga entero.", "No apagues la creación de archivos para ahorrar: la opción Code execution and file creation (en el diseño nuevo de Settings, Create and edit files) es la misma que usa Claude para analizar los CSV y planillas que subes, y la que necesitan los artifacts. Es mejor decir en cada pedido qué formato quieres."], "aviso": "Para más detalles sobre qué puedes armar, mira la guía \"Artifacts: herramientas para tu negocio sin programar\"."}, {"h": "Chequeo rápido antes de cada chat", "pasos": ["¿Necesito información de hoy? Si no, búsqueda web apagada.", "¿Es una investigación grande? Recién ahí, Research.", "¿Voy a usar algún conector? Si no, Tool access en On demand o Auto.", "¿Es una tarea de rutina? Esfuerzo bajo y razonamiento apagado si se puede.", "¿Necesito un documento o me alcanza con leer la respuesta?"]}], "faq": [{"q": "¿Research usa el modelo que yo elegí?", "a": "No. Según la ayuda, Research corre con Opus 5.5 (o Opus 4.8 si hace falta), sin importar el modelo elegido en el chat."}, {"q": "No veo el interruptor de búsqueda web. ¿Por qué?", "a": "Si tienes la nueva experiencia de Claude, no existe: Claude decide cuándo buscar. Puedes pedirle en el mensaje que no busque."}, {"q": "¿Bajar el esfuerzo empeora las respuestas?", "a": "La ayuda recomienda el nivel por defecto o uno más bajo para preguntas simples y escritura general. Para algo difícil, súbelo solo en ese chat."}, {"q": "¿Los conectores gastan aunque no los use?", "a": "Depende de cómo se cargan. Con Always available se cargan todos al empezar y ocupan lugar desde el arranque. Con On demand se cargan solo cuando Claude busca el que necesita."}], "fuentes": ["https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/10684626-enable-and-use-web-search", "https://support.claude.com/en/articles/11088861-use-research-on-claude", "https://support.claude.com/en/articles/13730515-manage-claude-s-tool-access", "https://support.claude.com/en/articles/8664678", "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them", "https://support.claude.com/en/articles/16761823-claude-cowork-and-chat-are-one-claude", "https://support.claude.com/en/articles/12111783", "https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio contable que dejó de quedarse sin uso a mitad de semana", "negocio": "Ejemplo inventado: un estudio contable chico en Rosario, con la contadora titular, un contador junior y una administrativa. Comparten la idea de usar Claude con planes Pro individuales para mails a clientes, resúmenes de normativa y planillas de liquidación.", "punto_de_partida": "Cada uno tenía todo prendido por las dudas: búsqueda web, Gmail, Drive y Calendar siempre disponibles, y el esfuerzo en el máximo. A mitad de semana alguno se quedaba sin uso y no sabía por qué.", "pasos": ["La contadora imprimió el chequeo del kit y lo pegó al lado del monitor. Acordaron pasarlo antes de abrir cada chat durante dos semanas.", "Para los mails a clientes (lo más repetido), abrieron chats con búsqueda web apagada desde + → Web search, y bajaron el esfuerzo a Low desde el nombre del modelo, al lado del botón de enviar, → Effort.", "En los chats de mails pasaron los conectores a On demand: + → Connectors → Tool access → On demand. Así Gmail se carga solo cuando le piden buscar un hilo.", "Cuando salió un cambio de normativa, el junior usó Research una sola vez con el prompt acotado de la guía (país, período, qué dejar afuera) y guardó el resumen en un documento del estudio. Después trabajaron sobre ese resumen en chats normales, sin volver a investigar.", "Para las planillas pidieron siempre el formato concreto: \"arma un CSV con estas columnas\" o \"responde en el chat, sin crear un archivo\" cuando solo querían leer el resultado.", "Cuando había que corregir un informe largo, marcaban el párrafo, tocaban Edit with Claude y pedían el cambio, en vez de pedir que lo rehaga entero.", "Pegaron las frases del kit en las instrucciones personales de cada uno, para no tener que repetirlas en cada chat."], "resultado": "Quedó una rutina simple: búsqueda web, Research y conectores se prenden solo cuando el chat los necesita, el esfuerzo sube solo para análisis difíciles y los cambios se piden por partes. Cada uno revisa en Settings → Usage cómo va su semana en vez de enterarse cuando se corta."}, "si_falla": [{"sintoma": "No aparece Web search en el menú +.", "solucion": "Si tienes la nueva experiencia de Claude (chat y Cowork unidos), no hay interruptor: Claude busca cuando le parece útil, y si no quieres que busque se lo dices en el mensaje. En una cuenta Team o Enterprise, un Owner o Primary Owner tiene que habilitar la búsqueda web en Organization settings → Capabilities antes de que la veas."}, {"sintoma": "Research no arranca o no aparece en el menú.", "solucion": "Revisa tres cosas: que tengas un plan pago (Pro, Max, Ultra, Team o Enterprise), que la búsqueda web esté prendida (Research no funciona sin ella) y, en Team o Enterprise, que el admin no haya apagado para tu rol los dos modelos que usa Research (Opus 5.5 y Opus 4.8)."}, {"sintoma": "Lanzaste Research desde el celular y no miró tu Gmail ni tu Drive.", "solucion": "Research iniciado desde la app del celular busca solo en la web y saltea los conectores, sin mostrar error. Lánzalo desde la web o desde Claude Desktop."}, {"sintoma": "No encuentras el interruptor Thinking para apagar el razonamiento.", "solucion": "En Haiku 5.5, Sonnet 5.5, Opus 5.5, Fable 5.2 y Opus 5 el razonamiento está siempre prendido y no se puede apagar en la app. Ahí la forma de gastar menos es bajar el nivel en Effort."}, {"sintoma": "En Effort no aparece Extra high.", "solucion": "Extra high solo existe en Opus 4.7 y modelos más nuevos. Si elegiste otro modelo, no va a estar. En Enterprise, además, el admin puede apagar ciertos modelos o niveles de esfuerzo para tu rol."}], "kit": [{"archivo": "chequeo-herramientas-antes-de-cada-chat.md", "que_es": "Una hoja para imprimir o tener abierta: cinco preguntas antes de cada chat y una tabla de qué prender según la tarea.", "contenido": "# Chequeo de herramientas antes de cada chat\n\nPásalo en 30 segundos antes de abrir un chat nuevo. La idea es prender solo lo que esa conversación necesita.\n\n## Las cinco preguntas\n\n1. **¿Necesito información de hoy?** (precios, noticias, una norma que cambió)\n   - Sí: búsqueda web prendida (+ → Web search).\n   - No: apagada. En la nueva experiencia, escribe \"no busques en la web, usa solo lo que te paso\".\n2. **¿Es una investigación grande, con muchas fuentes?**\n   - Sí: Research (+ → Research), con un pedido acotado. Una vez, y guarda el resultado.\n   - No: chat normal.\n3. **¿Voy a usar Gmail, Drive, Calendar u otro conector?**\n   - Seguro y todo el tiempo: Tool access en Always available.\n   - Tal vez o casi nunca: Tool access en Auto u On demand (+ → Connectors → Tool access).\n4. **¿Es una tarea de rutina?** (un mail, un resumen, una pregunta simple)\n   - Sí: Effort en Low o Medium. Si el modelo deja apagar Thinking, apágalo.\n   - Es difícil y me importa: High. Max solo para lo más difícil.\n5. **¿Necesito un archivo o me alcanza con leer?**\n   - Leer: \"responde en el chat, sin crear un archivo\".\n   - Archivo: di el formato exacto (CSV, Word, PDF) y qué columnas o secciones.\n\n## Tabla rápida por tarea\n\n| Tarea | Búsqueda web | Research | Conectores | Effort | Archivo |\n|---|---|---|---|---|---|\n| Responder un mail de un cliente | No | No | On demand (si hay que buscar el hilo) | Low | No |\n| Resumir un documento que subes | No | No | No | Low o Medium | No |\n| Ver qué cambió en una norma o un precio | Sí | No | No | Medium | No |\n| Investigar un mercado o una competencia | Sí | Sí, acotado | Auto | Lo que traiga Research | Resumen y tabla |\n| Armar una planilla o un informe | No | No | Auto | Medium o High | Sí, con formato |\n| Un análisis difícil (estrategia, números) | Según el caso | No | Auto | High | Según el caso |\n\n## Cuando quieras cambiar algo de lo que ya hizo\n\n- Un detalle: \"cambia solo [X] y deja todo lo demás igual\".\n- Una parte de un documento: marca el texto, toca Edit with Claude y pide el cambio.\n- No pidas \"rehazlo\" si solo quieres tocar una parte.\n\n## Para revisar una vez por semana\n\n- [ ] Miré Settings → Usage y sé cómo voy en la sesión y en la semana.\n- [ ] Apagué los conectores que no usé en toda la semana.\n- [ ] Si me quedé sin uso, anoté qué estaba haciendo (Research, archivos, esfuerzo alto) para ajustar la próxima.\n"}, {"archivo": "frases-para-gastar-menos-en-claude.md", "que_es": "Pack de frases listas para pegar en tus mensajes y un bloque para tus instrucciones personales o las de un Proyecto, para que Claude no use herramientas de más.", "contenido": "# Frases para gastar menos en Claude\n\nCopia la que necesites al principio o al final de tu mensaje.\n\n## Para que no use herramientas que no hacen falta\n\n- \"No busques en la web. Usa solo lo que te paso en este mensaje.\"\n- \"No uses conectores para esto. Todo lo que necesitas está aquí.\"\n- \"Responde en el chat, sin crear un archivo ni un artifact.\"\n- \"Responde en 5 líneas como máximo.\"\n\n## Para cambiar algo sin rehacer todo\n\n- \"Cambia solo [EL TÍTULO / EL SEGUNDO PÁRRAFO / LA COLUMNA X]. Deja todo lo demás exactamente igual.\"\n- \"Muéstrame solo la parte que cambiaste, no el documento entero.\"\n\n## Para pedir un archivo sin vueltas\n\n- \"Arma un CSV con estas columnas: [COLUMNAS]. Sin explicaciones antes ni después.\"\n- \"Arma un documento de una página con estas secciones: [SECCIONES].\"\n\n## Para una investigación con Research\n\nInvestiga [PREGUNTA CONCRETA].\nEnfócate solo en: [2 O 3 ASPECTOS].\nZona y período: [PAÍS O REGIÓN, AÑOS].\nNo me interesa: [LO QUE QUIERES DEJAR AFUERA].\nEntrega: un resumen de 10 líneas y una tabla con las fuentes.\n\n## Bloque para tus instrucciones (copia desde aquí)\n\nPégalo en las instrucciones de un Proyecto o en tus instrucciones personales de Settings (en la nueva experiencia se llaman Instructions for Claude).\n\nCuando te pida algo:\n1. No busques en la web salvo que te pida información actual o te lo diga explícitamente.\n2. Si la respuesta entra en el chat, responde en el chat. Crea un archivo o un artifact solo si te lo pido o si el resultado es un documento que voy a reusar.\n3. Si te pido cambiar una parte, cambia solo esa parte y muéstrame solo lo que cambiaste.\n4. Si para responder bien necesitas un conector o una búsqueda, dímelo en una línea antes de usarlo.\n5. Respuestas cortas por defecto. Si el tema necesita más, pregúntame antes de extenderte.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

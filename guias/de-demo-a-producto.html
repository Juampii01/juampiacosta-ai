<script>var GUIA = {"slug": "de-demo-a-producto", "t": "De demo a producto: lo que le falta a tu app", "d": "Secretos fuera del código, copias de seguridad, manejo de errores, registros, límites y copias antes de cada cambio grande. Lo que convierte una demo en algo que se puede usar de verdad.", "tema": "Crea tu app", "min": 11, "secciones": [{"h": "Una demo no es un producto", "p": ["Una app hecha con IA puede verse perfecta en la demo y caerse el primer día con clientes reales. No por el diseño, sino por lo que no se ve: claves expuestas, datos sin copia, errores que nadie registra.", "Hacer cambios grandes sin copia es como correr scripts en producción sin backup: anda bien hasta el día que no, y ese día no hay vuelta atrás. Esta guía es la lista de lo que tiene que estar antes de abrirle la puerta a clientes."]}, {"h": "1. Secretos fuera del código", "lista": ["Variables de entorno: toda clave va en el archivo .env (local) y en la configuración de tu hosting. El código solo la llama por su nombre.", ".gitignore: el .env tiene que estar listado. Si ya lo subiste alguna vez, agregarlo al .gitignore no alcanza: hay que dejar de rastrearlo (git rm --cached) y rotar las claves.", "Que Claude no lo lea: agrega reglas de denegación como Read(./.env) y Read(./.env.*) en la lista permissions.deny del archivo .claude/settings.json. La primera sola no cubre archivos como .env.local. Estas reglas frenan las herramientas de archivos de Claude y comandos como cat, pero no un script que abra el archivo por su cuenta: por eso la clave igual tiene que vivir fuera del código.", "Red de seguridad en GitHub: la protección de push bloquea subidas que contienen secretos y viene activada por defecto para tus subidas a repositorios públicos."]}, {"h": "2. Copias de seguridad", "p": ["Averigua qué copia automática te da tu base de datos y desde cuándo. En Supabase, los planes pagos tienen copias diarias; en el gratis, la recomendación es exportar seguido con el comando db dump y guardar la copia en otro lado. Los archivos subidos a Storage no entran en esas copias.", "Una copia que nunca probaste restaurar es una esperanza, no una copia. Prueba restaurarla al menos una vez en un proyecto de prueba."]}, {"h": "3. Errores y registros (logs)", "lista": ["Mensajes claros: si algo falla, el usuario ve un mensaje entendible, no una pantalla en blanco ni el error técnico completo.", "Registro: cada error queda anotado con fecha y qué estaba pasando, sin guardar contraseñas ni claves.", "Dónde mirarlos: en Vercel, el comando vercel logs muestra los registros de ejecución del proyecto vinculado; por defecto, los de los últimos 30 minutos (con --since miras más atrás). Vercel los guarda poco: 1 hora en el plan Hobby y 1 día en Pro. Si quieres algo más completo, Sentry tiene un MCP oficial para que Claude lea los errores directamente."]}, {"h": "4. Límites", "p": ["Una app sin límites es una invitación al abuso o a una factura sorpresa. Pídele a Claude que agregue topes razonables: tamaño máximo de archivos, cantidad de intentos de login, cantidad de pedidos por minuto a las partes que cuestan dinero (como llamadas a una IA). Y revisa en el panel de cada servicio si puedes poner alertas o límites de gasto."]}, {"h": "5. Copia antes de cada cambio grande", "pasos": ["Guarda un commit con todo funcionando.", "Crea una rama nueva para el cambio grande.", "Pruébalo en la vista previa de Vercel o Netlify, no en producción.", "Si toca la base de datos, haz una copia antes de aplicar la migración.", "Recién ahí lo pasas a la rama principal. Si algo sale mal, tienes Git y el Instant Rollback de Vercel (en el plan Hobby solo vuelve al deploy de producción anterior). El rollback vuelve el código, no la base de datos ni las variables de entorno: si la migración rompió datos, te salva la copia del paso anterior. Y después de un rollback, Vercel deja de publicar solos los push nuevos hasta que uses Undo Rollback."], "aviso": "Los checkpoints de Claude Code (/rewind) sirven para deshacer rápido dentro de una sesión, pero no reemplazan a Git: no siguen archivos cambiados solo por comandos ni cambios hechos fuera de la sesión."}, {"h": "Auditoría en un prompt", "prompts": [{"t": "¿Está lista para producción?", "c": "Revisa este proyecto como si mañana lo fueran a usar clientes reales. No cambies nada todavía.\nDame un informe con semáforo (verde, amarillo, rojo) para cada punto:\n1. Claves: ¿hay alguna escrita en el código o en archivos que se suben a Git?\n2. Datos: ¿hay copia de seguridad y cómo se restaura?\n3. Errores: ¿qué ve el usuario cuando algo falla? ¿queda registrado?\n4. Registros: ¿se guarda algún dato sensible en los logs?\n5. Límites: ¿hay topes de tamaño, intentos y uso de servicios pagos?\n6. Permisos: ¿un usuario puede ver o cambiar datos de otro?\nPara cada rojo, explícame el riesgo en una frase y propón el arreglo más simple."}]}], "faq": [{"q": "Sube una clave a GitHub y la borré enseguida, ¿estoy a salvo?", "a": "No. Queda en el historial y puede haber sido copiada. Rótala (genera una nueva y anula la vieja) en el servicio correspondiente."}, {"q": "¿Tengo que hacer todo esto para una app chica?", "a": "Secretos fuera del código y copia de los datos, siempre. El resto puedes sumarlo a medida que crecen los usuarios."}, {"q": "¿Claude puede hacer esta revisión solo?", "a": "Puede encontrar mucho con el prompt de auditoría y con /security-review, pero la decisión final y las pruebas son tuyas."}], "fuentes": ["https://docs.github.com/en/get-started/git-basics/ignoring-files", "https://docs.github.com/en/code-security/concepts/secret-security/about-push-protection", "https://code.claude.com/docs/en/permissions", "https://supabase.com/docs/guides/platform/backups", "https://vercel.com/docs/cli", "https://sentry.io/cookbook/debug-with-sentry-mcp-claude-code", "https://vercel.com/docs/instant-rollback", "https://code.claude.com/docs/en/checkpointing", "https://code.claude.com/docs/en/commands", "https://vercel.com/docs/logs/runtime", "https://vercel.com/docs/cli/logs", "https://docs.github.com/en/code-security/how-tos/secure-your-secrets/prevent-future-leaks/push-protection-for-users", "https://supabase.com/docs/guides/platform/migrating-within-supabase/backup-restore", "https://code.claude.com/docs/en/mcp"], "ejemplo": {"titulo": "Ejemplo resuelto: una app de reservas que pasa de demo a abrirse a alumnos", "negocio": "Ejemplo inventado: un instituto de inglés de barrio en Rosario, con la dueña, dos profesoras y una secretaria. La dueña armó con Claude Code una app para que los alumnos reserven clases de recuperación y suban el comprobante de pago. Usa Next.js, Supabase en el plan gratis y Vercel en el plan Hobby.", "punto_de_partida": "La demo anduvo bien con la secretaria. Antes de pasarle el link a los alumnos, la dueña no sabía si las claves estaban seguras ni qué pasaba si se perdían las reservas.", "pasos": ["Hizo un commit con todo funcionando y, en una sesión nueva de Claude Code, pegó el prompt de auditoría de la guía (o usó la skill auditoria-salida-a-produccion del kit). Le pidió que no cambiara nada.", "El informe marcó dos rojos: el archivo .env.local estaba subido a GitHub en un commit viejo, y la clave secreta de Supabase se usaba en un componente que corre en el navegador. Marcó amarillo las copias de seguridad, porque desde el código no se podía saber qué plan tenía.", "Para el .env.local: le pidió a Claude que lo sumara al .gitignore y corrió git rm --cached .env.local y un commit. Como la clave ya había estado en el historial, generó claves nuevas en el panel de Supabase, anuló las viejas y cargó las nuevas en Environment Variables de Vercel y en su .env.local.", "Le pidió a Claude que moviera el uso de la clave secreta a una ruta del servidor y que el navegador usara solo la clave pública. Probó la reserva en la vista previa de Vercel antes de mergear.", "Copió el archivo settings-claude-code-proteger-secretos.json del kit como .claude/settings.json del proyecto, para que Claude no lea los archivos de variables en las próximas sesiones.", "Copias: como Supabase gratis no tiene copias diarias, instaló la Supabase CLI y Docker, y armó con Claude un script que corre los tres comandos db dump (roles, esquema y datos). Lo corre cada viernes y guarda los archivos en una carpeta de Google Drive del instituto. Los comprobantes que suben los alumnos están en Storage, que no entra en esas copias: sumó una descarga mensual de ese bucket.", "Probó restaurar la copia en un proyecto de Supabase nuevo, de prueba, con el comando psql de la doc. Encontró que le faltaba un paso y lo anotó en el plan del kit.", "Errores y registros: le pidió a Claude mensajes claros cuando falla una reserva y que los registros no impriman el objeto completo del alumno. Como en Hobby los registros de Vercel duran una hora, conectó Sentry con claude mcp add --transport http sentry https://mcp.sentry.dev/mcp y se autenticó con /mcp.", "Límites: tamaño máximo para el comprobante, tope de intentos de login y que una persona no pueda tener más de [N] reservas pendientes. Revisó en el panel de cada servicio qué alertas de uso ofrecía su plan.", "Para el primer cambio grande (sumar una tabla de pagos) usó el plan de cambio grande del kit: commit, rama, vista previa, copia con db dump justo antes de migrar y recién después merge a main."], "resultado": "La app quedó con las claves fuera del código y del historial que se sigue usando, una copia semanal de la base guardada fuera de Supabase y probada al menos una vez, mensajes de error entendibles, errores visibles en Sentry y un plan escrito para cada cambio que toque datos. La dueña sabe qué hacer si un deploy sale mal y qué cosas no deshace el rollback."}, "si_falla": [{"sintoma": "Al hacer git push, GitHub lo rechaza y avisa que detectó un secreto (push protection).", "solucion": "No lo saltees. Saca la clave del archivo, pásala a .env, y corrige el commit que la tiene (si es el último, git commit --amend después de editar el archivo). Si la clave ya salió de tu computadora por otro lado, rótala igual. Solo si es un falso positivo (un ejemplo, un texto de prueba) usa la opción de permitirlo que ofrece GitHub."}, {"sintoma": "Agregaste .env al .gitignore pero sigue apareciendo en GitHub o en git status.", "solucion": ".gitignore no afecta archivos que Git ya rastrea. Corre git rm --cached .env (y lo mismo con .env.local si existe), haz commit y súbelo. El archivo sigue en el historial viejo: rota en cada servicio las claves que tenía."}, {"sintoma": "vercel logs no muestra el error que un cliente te reportó ayer.", "solucion": "Por defecto el comando trae solo los últimos 30 minutos; prueba con vercel logs --since 2h. Si es más viejo que lo que guarda tu plan (1 hora en Hobby, 1 día en Pro), ya no está: para lo que viene, conecta Sentry o un servicio que guarde los errores. Si te sale un error de uso con --level o --follow, es porque cambiaron: usa --query 'level:error'."}, {"sintoma": "Hiciste Instant Rollback, arreglaste el error, hiciste push y producción sigue mostrando la versión vieja.", "solucion": "Después de un rollback, Vercel apaga la publicación automática de los push a producción. En el proyecto, toca Undo Rollback en el recuadro de producción y elige el deploy nuevo, o corre vercel promote con la URL de ese deploy."}, {"sintoma": "supabase db dump falla apenas arranca o no se conecta a la base.", "solucion": "El comando necesita Docker abierto en tu computadora. Si no conecta, revisa la cadena de conexión: usa la conexión directa, y si tu red no tiene IPv6, la del Session pooler. Si no te acuerdas la contraseña de la base, se resetea en el panel, en Database > Settings (ojo: cámbiala también donde la use tu app)."}], "kit": [{"archivo": "auditoria-salida-a-produccion/SKILL.md", "que_es": "Skill para Claude Code que revisa el proyecto antes de abrirlo a clientes y entrega el semáforo de seis puntos sin tocar código. Copia la carpeta en .claude/skills/ de tu proyecto y pídele a Claude que revise si la app está lista para producción.", "contenido": "---\nname: auditoria-salida-a-produccion\ndescription: 'Revisa un proyecto web antes de abrirlo a clientes y entrega un semáforo de claves, copias, errores, registros, límites y permisos, sin tocar código. Úsala antes de publicar o lanzar la app.'\n---\n\n# Auditoría de salida a producción\n\nRevisas el proyecto como si mañana lo fueran a usar clientes reales. Tu trabajo es encontrar riesgos y explicarlos simple. No cambias nada hasta que el usuario lo pida.\n\n## Antes de empezar\n\n1. Corre `git status` y `git log --oneline -5`. Si hay cambios sin commit, avísalo primero: antes de arreglar cualquier cosa tiene que haber un commit con todo funcionando.\n2. Mira `package.json` (o el archivo de dependencias que haya) para saber qué framework, base de datos y hosting usa.\n3. No abras ni muestres el contenido de archivos `.env`. Si necesitas saber qué variables usa la app, búscalas por nombre en el código o en `.env.example`.\n\n## Qué revisas\n\n### 1. Claves\n- Busca en el código textos con forma de clave (por ejemplo, que empiecen con `sk_`, `sk-`, `eyJ`, `ghp_`) o variables llamadas `SECRET`, `KEY`, `TOKEN` o `PASSWORD` con un valor escrito.\n- Fíjate si `.gitignore` incluye `.env` y `.env*.local` (o el patrón que use el framework).\n- Corre `git ls-files | grep -i env` para ver si algún archivo de variables está rastreado por Git.\n- Revisa que las claves de servidor (por ejemplo, la clave secreta o service_role de la base) no se usen en código que corre en el navegador.\n\n### 2. Datos\n- Qué base usa y si hay alguna rutina de copia (script, workflow, documentación).\n- Si los archivos que suben los usuarios (Storage, S3, etc.) tienen su propia copia: las copias de la base suelen no incluirlos.\n- Si hay instrucciones escritas para restaurar.\n\n### 3. Errores\n- Qué ve el usuario si falla una llamada al servidor: busca manejadores de error, páginas de error y estados vacíos.\n- Qué pantallas quedarían en blanco ante un error.\n\n### 4. Registros\n- Busca `console.log`, `console.error` y loggers que impriman objetos enteros de usuario, pedidos, headers o variables de entorno.\n- Señala cualquier registro que pueda incluir contraseñas, tokens, documentos o datos de tarjetas.\n\n### 5. Límites\n- Tamaño máximo de archivos subidos.\n- Intentos de login o de recuperar contraseña.\n- Pedidos por minuto a rutas que cuestan dinero (llamadas a una IA, envío de mails o mensajes, pagos).\n\n### 6. Permisos\n- Si un usuario puede leer o cambiar datos de otro cambiando un id en la URL o en el pedido.\n- Si la base tiene reglas de acceso por fila (por ejemplo, RLS en Supabase) activadas en las tablas con datos de usuarios.\n- Si las rutas de administración verifican el rol en el servidor, no solo en la pantalla.\n\n## Qué entregas\n\nUna tabla con una fila por punto: punto, semáforo (verde, amarillo, rojo) y qué encontraste (con archivo y línea cuando aplique).\n\nDespués, para cada rojo:\n- El riesgo en una frase, en lenguaje de negocio (qué le puede pasar a un cliente).\n- El arreglo más simple, en pasos.\n- Si el arreglo necesita algo fuera del código (rotar una clave en el panel del servicio, prender copias, cargar variables en el hosting), dilo explícito: eso lo hace el usuario.\n\nCierra con \"Siguiente paso sugerido:\" y el rojo que conviene arreglar primero.\n\n## Reglas\n- No modifiques archivos en esta revisión.\n- No pegues claves completas en el informe: muestra solo los primeros 4 caracteres y el archivo donde está.\n- Si algo no se puede comprobar desde el código (por ejemplo, si el plan de la base tiene copias diarias), márcalo amarillo y di qué tiene que revisar el usuario y dónde.\n"}, {"archivo": "settings-claude-code-proteger-secretos.json", "que_es": "Configuración de permisos para Claude Code: bloquea la lectura de .env, .env.local y la carpeta secrets (dejando visible .env.example) y pide confirmación antes de cada git push. Guárdalo como .claude/settings.json en la raíz del proyecto (si ya tienes uno, suma estas reglas a tu bloque permissions).", "contenido": "{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Read(!.env.example)\",\n      \"Read(./secrets/**)\"\n    ],\n    \"ask\": [\n      \"Bash(git push *)\"\n    ]\n  }\n}\n"}, {"archivo": "plan-cambio-grande-con-vuelta-atras.md", "que_es": "Plantilla para completar antes de cada cambio grande: commit de partida, rama y vista previa, copia de la base con los comandos de Supabase, publicación y qué hacer si sale mal.", "contenido": "# Plan de cambio grande (copia esto antes de cada cambio que toque datos, pagos o login)\n\nProyecto: [NOMBRE DE LA APP]\nCambio: [QUÉ VAS A CAMBIAR, EN UNA FRASE]\nFecha: [AAAA-MM-DD]\nResponsable: [QUIÉN]\n\n## 1. Punto de partida\n- [ ] La app anda en producción ahora mismo. Probé: [LOGIN / CARGA / PAGO / LO PRINCIPAL].\n- [ ] Commit con todo funcionando. Hash: [HASH CORTO, sale de git log --oneline -1]\n- [ ] Anoté cuál es el deploy de producción actual en Vercel (o el hosting que uses): [URL O ID DEL DEPLOY]\n\n## 2. Rama y vista previa\n- [ ] Rama nueva: git switch -c [nombre-del-cambio]\n- [ ] Le pedí a Claude el cambio en esa rama, con la consigna de no tocar main.\n- [ ] Sube la rama y abre la vista previa (preview) que genera el hosting.\n- [ ] Probé en la vista previa: [LISTA DE COSAS A PROBAR A MANO]\n\n## 3. Si toca la base de datos\n- [ ] La vista previa NO apunta a la base de producción (o, si apunta, no corrí la migración desde ahí).\n- [ ] Copia de la base hecha justo antes de migrar. Dónde quedó: [CARPETA / SERVICIO]\n  - Supabase con plan pago: confirmé en el panel la copia diaria de hoy.\n  - Supabase gratis o para tener una copia propia (con Supabase CLI y Docker):\n    supabase db dump --remote=[CONNECTION_STRING] -f roles.sql --role-only\n    supabase db dump --remote=[CONNECTION_STRING] -f schema.sql\n    supabase db dump --remote=[CONNECTION_STRING] -f data.sql --use-copy --data-only\n- [ ] Los archivos subidos por usuarios (Storage) no cambian con esta migración, o hice copia aparte.\n- [ ] La migración se puede deshacer así: [PASOS O ARCHIVO DE VUELTA ATRÁS]\n\n## 4. Publicar\n- [ ] Merge a main en un horario con poco uso: [DÍA Y HORA]\n- [ ] Después del deploy probé lo mismo que en la vista previa, ahora en producción.\n- [ ] Miré los registros de la primera hora (vercel logs --since 1h o Sentry).\n\n## 5. Si algo sale mal\n- Código: Instant Rollback en Vercel al deploy anotado en el paso 1 (en Hobby, solo al deploy de producción anterior). Después del rollback, Vercel no publica solos los push nuevos: cuando esté arreglado, usa Undo Rollback o vercel promote.\n- Datos: el rollback NO deshace la base. Restaura desde la copia del paso 3, primero en un proyecto de prueba.\n- Avisar a: [QUIÉN SE ENTERA SI HAY QUE VOLVER ATRÁS: CLIENTE, EQUIPO]\n\n## Notas de cómo salió\n[QUÉ FUNCIONÓ, QUÉ FALLÓ, QUÉ CAMBIO PARA LA PRÓXIMA]\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

<script>var GUIA = {"slug": "claude-chatgpt-y-gemini-juntos", "t": "Claude, ChatGPT y Gemini juntos, sin fanatismo", "d": "Cómo elegir con qué asistente trabajar cada tarea según lo que ya usás, y cómo pasar un trabajo de uno a otro sin empezar de cero.", "tema": "Primeros pasos", "min": 7, "secciones": [{"h": "No hace falta casarse con uno", "p": ["Los tres asistentes te dejan conversar, subir archivos y pedir análisis. Por ejemplo, la ayuda oficial de ChatGPT explica que podés subir planillas y pedir gráficos, y la de Gemini dice que podés subir documentos y planillas para pedir resúmenes (los gráficos a partir de una planilla, en la versión web de Gemini).", "Por eso la pregunta útil no es cuál es el mejor, sino con cuál trabajás más cómodo para cada tarea y dónde ya tenés tus cosas. Esta guía no compara rendimiento: eso cambia seguido y depende de tu caso."]}, {"h": "Criterios para elegir en cada tarea", "lista": ["Dónde están tus datos: si tu información ya vive en una herramienta conectada a un asistente, empezá por ahí.", "Qué te devuelve mejor para vos: probá la misma tarea en dos y quedate con el que menos tengas que corregir.", "Qué plan pagás: no tiene sentido pagar tres. Elegí uno principal y usá los otros para una segunda opinión.", "Qué política de datos te cierra: revisá en cada uno qué hace con lo que subís antes de poner información sensible."]}, {"h": "La prueba de la misma tarea", "p": ["La forma más honesta de decidir es probar vos. Elegí una tarea real que hacés seguido y pasala por los asistentes que tengas."], "pasos": ["Elegí una tarea real (un mail a un cliente, el resumen de una reunión, un análisis chico).", "Usá exactamente el mismo prompt en cada asistente.", "Anotá cuánto tuviste que corregir cada resultado.", "Repetilo con dos o tres tareas distintas antes de sacar conclusiones."]}, {"h": "Pasar un trabajo de uno a otro", "p": ["Ningún asistente ve las conversaciones de otro. Para mover un trabajo, pedile al que estás usando un resumen pensado para que otro asistente lo continúe, y pegalo en el nuevo. Si lo que querés llevar a Claude es lo que otro asistente ya sabe de vos (a qué te dedicás, cómo te gusta trabajar), Claude tiene una importación de memoria en Settings → Your Claude, con el botón Start import: le pedís al otro asistente que exporte lo que recuerda con el prompt que te muestra Claude y lo pegás. La ayuda aclara que es experimental y que se queda sobre todo con temas de trabajo."], "prompts": [{"t": "Resumen para pasar a otro asistente", "c": "Voy a seguir este trabajo con otro asistente que no vio esta conversación. Escribí un texto para pegarle, que incluya:\n1. Qué estamos haciendo y para quién.\n2. Las reglas y el tono que definimos.\n3. La última versión completa del trabajo.\n4. Qué le voy a pedir a continuación: [LO QUE QUERÉS QUE HAGA EL OTRO].\nEscribilo en segunda persona, dirigido al otro asistente, sin referencias a esta conversación."}, {"t": "Pedir segunda opinión", "c": "Otro asistente hizo este trabajo:\n[PEGÁ EL RESULTADO]\nEl pedido original era:\n[PEGÁ EL PROMPT]\nRevisalo como si fueras un editor exigente: qué está bien, qué está flojo y qué cambiarías. Después dame una versión mejorada. Si algo depende de un dato que no podés comprobar, marcalo."}]}, {"h": "Cuidados al mezclar", "lista": ["Un solo lugar de verdad: guardá la versión final en tu documento, no repartida en tres chats.", "Datos sensibles: cada servicio tiene su política. Leela antes de subir información de clientes.", "Datos del mundo real: si un asistente te da una cifra o una fecha, verificala en la fuente, venga de cuál venga."]}], "faq": [{"q": "¿Cuál es el mejor?", "a": "No hay una respuesta fija: los productos cambian seguido. Hacé la prueba de la misma tarea con tus casos reales."}, {"q": "¿Puedo conectar uno con otro para que se pasen el trabajo solos?", "a": "Esta guía no cubre eso. Lo simple y seguro es el resumen de traspaso copiado y pegado."}], "fuentes": ["https://help.openai.com/en/articles/8437071-data-analysis-with-chatgpt", "https://support.google.com/gemini/answer/14903178", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude", "https://support.claude.com/en/articles/12123587-import-and-export-your-memory-from-claude", "https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-settings", "https://support.google.com/gemini/answer/13278892?hl=en&co=GENIE.Platform%3DDesktop", "https://support.google.com/gemini/answer/14903178?hl=en&co=GENIE.Platform%3DDesktop"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio chico que usa Claude y Gemini sin pagar de más", "negocio": "Ejemplo inventado: un estudio de diseño gráfico de dos socias en Montevideo, Uruguay. Hacen identidad de marca y piezas para redes para comercios del barrio. Tienen Google Workspace (con Gemini incluido en su plan) y una de ellas paga Claude Pro. Una usa ChatGPT gratis desde el celular.", "punto_de_partida": "Cada una usaba el asistente que tenía abierto. Las propuestas para clientes quedaban repartidas en tres chats y nunca sabían cuál era la última versión.", "pasos": ["Eligieron tres tareas reales: el mail de presupuesto a un cliente nuevo, el resumen de la reunión de briefing y el análisis de la planilla de horas por proyecto.", "Escribieron un solo prompt por tarea y lo pegaron igual en Claude, ChatGPT y Gemini, con la misma planilla adjunta en la tercera. Usaron nombres de clientes cambiados.", "Completaron la planilla de prueba del kit: si lo usarían así, qué corrigieron, si inventó algún dato y si respetó el formato.", "Con la planilla delante decidieron un asistente principal por tipo de tarea. Para lo que vive en Drive (planillas de horas, briefs en Docs) empiezan por el que ya tiene acceso a esos archivos. Para los mails a clientes, por el que menos tuvieron que corregir en la prueba.", "Pasaron la checklist de datos en cada cuenta: revisaron la opción de entrenamiento en Settings → Privacy de Claude, los controles de datos de ChatGPT y la actividad de Gemini. Acordaron no subir nunca presupuestos con datos completos de clientes a la cuenta gratis.", "Subieron la skill traspaso-entre-asistentes a Claude. Cuando un borrador de propuesta empezado en Gemini necesitaba una segunda vuelta, pegaron el resultado en Claude con el prompt de segunda opinión de la guía y la skill ordenó primero qué faltaba y qué datos había que verificar.", "Definieron un solo lugar de verdad: la carpeta del cliente en Drive. Lo que sale de cualquier chat se pega ahí con la fecha, y el chat no cuenta como archivo."], "resultado": "Quedó una tabla simple que dice qué asistente usar para cada tipo de tarea, una sola carpeta donde vive la versión final de cada propuesta y una forma fija de pasar un trabajo de un asistente a otro sin perder el tono ni los datos. Siguen pagando un solo plan de Claude además de lo que ya tenían con Google."}, "si_falla": [{"sintoma": "El otro asistente responde como si no hubiera leído el traspaso: cambia el tono, repite preguntas o rehace lo que ya estaba decidido.", "solucion": "Revisá que el traspaso traiga la última versión completa del trabajo y no un resumen, y que las reglas de tono estén escritas como reglas (\"voseo, frases cortas, sin signos de exclamación\"). Pegalo como primer mensaje de un chat nuevo y recién después pedí la tarea."}, {"sintoma": "Al pedir el resumen de traspaso, el asistente se inventa decisiones o datos que nunca se hablaron.", "solucion": "Pedile que marque con [VERIFICAR] todo dato que no haya salido de vos y que ponga como pregunta abierta lo que no se decidió. Leé el traspaso antes de pegarlo: es el momento más barato para corregir."}, {"sintoma": "Le pedís a Gemini un gráfico de tu planilla desde el celular y no lo hace.", "solucion": "La ayuda de Gemini indica que los gráficos a partir de una planilla subida se piden en la versión web. Abrí gemini.google.com en la computadora, subí la planilla y pedilo ahí."}, {"sintoma": "Importaste tu memoria de otro asistente a Claude y parece que no se acuerda de nada.", "solucion": "La ayuda aclara que la importación es experimental y que Claude se queda sobre todo con temas de trabajo, así que lo personal puede no aparecer. Revisá qué guardó en Settings → Your Claude, en Manage al lado de Your memory, y corregí o agregá desde ahí."}, {"sintoma": "La prueba de la misma tarea da resultados que cambian cada vez que la repetís.", "solucion": "Es normal: las respuestas no salen iguales dos veces. Por eso la guía pide dos o tres tareas distintas. Si un resultado te sorprende, repetí esa misma tarea una vez más en ese asistente antes de anotar la conclusión."}], "kit": [{"archivo": "traspaso-entre-asistentes/SKILL.md", "que_es": "Skill para Claude que arma el texto de traspaso cuando un trabajo sale hacia otro asistente y ordena lo que entra desde otro antes de seguir. Subila en Customize → Skills.", "contenido": "---\nname: traspaso-entre-asistentes\ndescription: 'Arma un traspaso para seguir un trabajo en otro asistente (ChatGPT, Gemini u otro chat) o ordena uno que llega de otro lado. Usala al pasar un trabajo a otro asistente o al pegar algo hecho en otro.'\n---\n\n# Traspaso entre asistentes\n\nSirve para dos momentos: cuando el trabajo SALE de esta conversación y cuando ENTRA desde otro asistente.\n\n## Si el trabajo sale (el usuario se lo va a pasar a otro)\n\nEscribí un solo bloque, en segunda persona, dirigido al otro asistente, sin mencionar \"esta conversación\" ni \"lo que hablamos\". Tiene que poder leerse sin ningún contexto.\n\nUsá exactamente estas secciones:\n\n1. **Qué estamos haciendo**: una o dos frases. Qué es el trabajo, para quién es y para qué se usa.\n2. **Reglas y tono**: todo lo que se definió (registro, largo, palabras prohibidas, formato, idioma, voseo o tuteo).\n3. **Decisiones tomadas**: lo que ya se resolvió y no hay que volver a discutir.\n4. **Datos de partida**: cifras, nombres, fechas y fuentes que aparecieron. Marcá con [VERIFICAR] los que nadie comprobó.\n5. **Última versión completa**: el trabajo entero, no un resumen del trabajo.\n6. **Lo que sigue**: qué le va a pedir el usuario. Si no lo dijo, preguntale antes de escribir el traspaso.\n\nReglas:\n- No inventes decisiones que no se tomaron. Si algo quedó abierto, ponelo como pregunta abierta.\n- No incluyas datos personales de clientes (teléfonos, documentos, direcciones, montos de cuentas) salvo que el usuario lo pida. Si aparecen, reemplazalos por [DATO DEL CLIENTE] y avisale.\n- Entregá el bloque listo para copiar, sin comentarios antes ni después, salvo la advertencia de datos reemplazados.\n\n## Si el trabajo entra (el usuario pega algo que hizo otro asistente)\n\nAntes de seguir:\n\n1. Resumí en tres líneas qué entendiste: qué es, para quién y qué te pide.\n2. Listá lo que falta para trabajar bien (tono, público, formato, datos).\n3. Listá los datos del texto que no podés comprobar (cifras, fechas, nombres de leyes o productos) y marcalos [VERIFICAR].\n4. Preguntá todo lo que falta en un solo mensaje y esperá la respuesta. Si no falta nada, seguí directo con lo que te pidió.\n\nNo critiques al otro asistente ni compares herramientas. Trabajá sobre el texto.\n"}, {"archivo": "planilla-prueba-misma-tarea.md", "que_es": "Plantilla para hacer la prueba de la misma tarea en Claude, ChatGPT y Gemini y anotar la conclusión por tipo de tarea.", "contenido": "# Prueba de la misma tarea\n\nUna hoja para decidir con qué asistente hacés cada tarea, con tus casos y no con rankings.\n\n## Antes de empezar\n\n- Elegí 3 tareas reales que hacés seguido. Una de escribir, una de resumir o analizar, una a tu elección.\n- Escribí el prompt UNA vez y copialo igual en cada asistente. Si en uno lo cambiás, la prueba no vale.\n- Si la tarea usa un archivo, subí el mismo archivo a todos.\n- No pongas datos sensibles de clientes en la prueba. Usá una versión con nombres cambiados.\n\n## Prompt usado (copialo acá)\n\n```\n[PEGÁ ACÁ EL PROMPT EXACTO]\n```\n\n## Registro por tarea\n\nRepetí este bloque para cada tarea.\n\n### Tarea: [NOMBRE DE LA TAREA]\n\n| | Claude | ChatGPT | Gemini |\n|---|---|---|---|\n| ¿Lo usaría así como salió? (sí / con cambios / no) | | | |\n| Qué tuve que corregir (en pocas palabras) | | | |\n| ¿Inventó algún dato? (sí / no, cuál) | | | |\n| ¿Respetó el formato que pedí? | | | |\n| ¿Tuve que mandar otro mensaje para que lo arregle? | | | |\n| ¿Dónde estaban mis datos para esta tarea? | | | |\n\nNotas:\n-\n\n## Conclusión (completala después de las 3 tareas)\n\n| Tipo de tarea | Asistente principal | Para segunda opinión |\n|---|---|---|\n| [EJ.: MAILS A CLIENTES] | | |\n| [EJ.: RESUMEN DE REUNIONES] | | |\n| [EJ.: ANÁLISIS DE PLANILLAS] | | |\n\nFecha de la prueba: [FECHA]. Repetila cuando cambies de plan o cuando un producto saque una función nueva que te interese: los resultados de hoy no valen para siempre.\n"}, {"archivo": "checklist-datos-clientes-en-asistentes.md", "que_es": "Checklist para revisar en cada asistente qué pasa con tus datos y qué no subir nunca, antes de usarlo con información de clientes.", "contenido": "# Checklist antes de subir datos de clientes a un asistente\n\nPasala una vez por cada asistente que uses en el trabajo. Los nombres de los menús cambian seguido: si no encontrás una opción, buscala en la ayuda oficial de ese producto.\n\n## 1. Qué tipo de cuenta estás usando\n\n- [ ] Sé si es una cuenta personal (gratis o paga) o una cuenta de empresa (Team, Enterprise, Workspace, Business). Las reglas sobre qué se hace con tus datos no son las mismas.\n- [ ] Si es de empresa, sé quién la administra y qué permitió.\n\n## 2. Uso de tus chats para entrenar modelos\n\n- [ ] **Claude** (cuentas personales Free, Pro y Max): en Settings → Privacy está la opción para que tus chats nuevos no se usen para mejorar los modelos. Según la ayuda de privacidad de Anthropic, apagarla no borra lo que ya se usó.\n- [ ] **ChatGPT**: revisé los controles de datos (Data Controls) en Settings, o el portal de privacidad de OpenAI.\n- [ ] **Gemini**: revisé Settings & help → Activity (la opción Keep Activity) en gemini.google.com.\n- [ ] Anoté la fecha en que lo revisé: [FECHA].\n\n## 3. Qué no subo nunca, en ninguno\n\n- [ ] Números de documento, de tarjeta o de cuenta bancaria.\n- [ ] Contraseñas, claves de API o códigos de acceso.\n- [ ] Historias clínicas o datos de salud de terceros.\n- [ ] Contratos firmados con datos personales completos, salvo que el cliente lo haya aceptado y la cuenta sea de empresa.\n\n## 4. Cómo subo lo demás\n\n- [ ] Reemplazo nombres por iniciales o por [CLIENTE A], [CLIENTE B].\n- [ ] Saco teléfonos, mails y direcciones si la tarea no los necesita.\n- [ ] Si paso el trabajo de un asistente a otro, reviso que el texto de traspaso no lleve datos que no hacen falta.\n\n## 5. Dónde queda la versión final\n\n- [ ] La versión final vive en mi documento o en mi carpeta, no en un chat.\n- [ ] Sé en qué chat de cada asistente quedó cada trabajo, por si tengo que borrarlo.\n"}], "verificada": "2026-11-08", "cat": "primeros-pasos", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "oficina-de-agentes-ia", "post": "OFICINA", "t": "Tu oficina de agentes de IA: gratis, de código abierto y en tu computadora", "d": "Munder Difflin junta los agentes que ya usas (Claude Code, Codex, Gemini, Grok, Kimi, Cursor…) en una oficina: un orquestador reparte el trabajo, cada agente tiene memoria y buzón, y los ves trabajar.", "tema": "Agentes", "min": 8, "fichaNombre": "Munder Difflin", "ficha": [["Qué es", "Una app que junta tus agentes (Claude Code, Codex, Gemini, Grok, Kimi, Cursor…) en una oficina con orquestador, memoria y buzón."], ["Necesitas", "Mac, Windows o Linux y al menos un agente de terminal como Claude Code."], ["Cuánto cuesta", "La versión Classic es gratis y de código abierto (MIT); pagas tus suscripciones a los agentes. Hay una versión Pro paga."], ["Ojo", "Está en etapa previa (pre-release): puede tener errores. Dale acceso solo a carpetas de proyecto."], ["Repo", "github.com/chaitanyagiri/munder-difflin"]], "secciones": [{"h": "Qué es", "p": ["Munder Difflin es una app de escritorio gratis y de código abierto (MIT) que arma un equipo con los agentes de programación de terminal que ya pagas. Cada agente es un programa real corriendo en su propia terminal: la app los coordina y los muestra como personajes en una oficina en 2D."], "lista": ["Repositorio: <a href=\"https://github.com/chaitanyagiri/munder-difflin\" target=\"_blank\" rel=\"noopener\">github.com/chaitanyagiri/munder-difflin ↗<\/a>", "Web: <a href=\"https://munderdiffl.in/\" target=\"_blank\" rel=\"noopener\">munderdiffl.in ↗<\/a>"]}, {"h": "Qué agentes puedes sumar", "lista": ["Claude Code", "Codex (OpenAI)", "Gemini CLI y Antigravity (Google)", "Grok (xAI)", "Kimi Code", "Cursor", "También Qwen, OpenCode, Crush, pi.dev, GitHub Copilot CLI, modelos locales con Ollama, LM Studio o vLLM, y cualquier comando propio."], "aviso": "Usa tus suscripciones y sus límites: la oficina no te regala agentes, organiza los que ya tienes."}, {"h": "Cómo funciona", "lista": ["Michael, tu clon: es el orquestador, el agente al que le hablas para dar objetivos. Le das el objetivo, lo divide en tareas y se las pasa al agente que corresponde. Si hace falta, también puedes abrir la terminal de cualquier agente y escribirle directo.", "Tablero compartido: tareas en columnas que todos los agentes pueden ver.", "Buzón por agente: los agentes se mandan mensajes entre ellos.", "Aprobaciones: lo delicado (gastos, cambios de alcance y acciones que borran cosas) llega a una cola para que decidas tú.", "Memoria: cada agente guarda en tu computadora, en notas de texto, lo que aprendió. Cierras la app y al otro día se acuerdan.", "La oficina visual: ves a cada agente trabajando en su escritorio.", "Freno de gasto: presupuesto de tokens por agente y un freno automático por escalones si un agente se traba en un bucle, repite errores o gasta de más: primero lo redirige, después lo limita y, si sigue, lo frena."]}, {"h": "Instálalo", "pasos": ["Descarga la app para Mac, Windows o Linux desde harnessmd.com/download (o desde la página de releases del repositorio).", "Ábrela: el asistente de inicio revisa qué tienes instalado y te ofrece instalar lo que falta.", "Fíjate que los agentes que quieres usar (por ejemplo claude o codex) funcionen en la terminal con tu cuenta activa.", "Abre una carpeta de proyecto: cada carpeta es un «piso» de la oficina, con sus propios agentes, tablero y memoria.", "Suma 2 o 3 agentes para empezar."], "prompts": [{"t": "Que Claude te ayude", "c": "Quiero usar Munder Difflin (github.com/chaitanyagiri/munder-difflin) con Claude Code y [OTRO AGENTE]. Uso [MAC/WINDOWS/LINUX]. Guiame para instalar los agentes que me falten, comprobar que funcionan en la terminal y armar mi primera oficina con un proyecto de prueba."}]}, {"h": "Tu primer encargo", "p": ["Arranca con algo chico y fácil de revisar."], "prompts": [{"t": "Objetivo para el orquestador", "c": "Objetivo: crea una landing de una página para [NEGOCIO] con formulario de contacto. Reparte: un agente diseña y construye, otro revisa errores y accesibilidad, otro escribe los textos. Avísame solo para aprobar el diseño y antes de publicar cualquier cosa."}], "lista": ["Mira el tablero de tareas para ver cómo se repartió.", "Responde en la cola de aprobaciones cuando te necesite.", "Revisa el resultado antes de darlo por bueno."]}, {"h": "Cómo explicárselo a un cliente", "p": ["Si vendes sistemas de IA a empresas, la oficina sirve para que el cliente entienda de un vistazo cómo trabajan los agentes: él pone el objetivo, el orquestador reparte, los agentes trabajan y él los ve."], "prompts": [{"t": "Explicación para un cliente", "c": "Explícale a un cliente de [RUBRO] en 5 frases simples cómo funcionaría una oficina de agentes de IA en su empresa: qué objetivos les daría, qué hace cada agente, qué decide él y qué riesgos controlamos."}]}, {"h": "Lo que conviene saber", "lista": ["Está en etapa previa (pre-release): puede tener errores.", "Los agentes corren en tu computadora: si la apagas, se frenan.", "La versión Classic es gratis. Hay una versión Pro paga, con pago único por 30 o 365 días y para una computadora a la vez, que suma un espacio de trabajo con barra lateral (tareas, bandeja, automatizaciones, memoria), un catálogo de capacidades (MCP, skills y herramientas) y el Stapler, que dicta y graba y transcribe reuniones. Mira el precio vigente en munderdiffl.in antes de comprar.", "Cada agente gasta de su propio plan: vigila los límites y usa el freno de gasto.", "Configura qué puede hacer cada agente solo y qué tiene que consultarte.", "Dale acceso solo a carpetas de proyecto, no a todo tu disco."]}], "faq": [{"q": "¿Es gratis?", "a": "La versión Classic sí, y es de código abierto. Pagas tus suscripciones a los agentes; la versión Pro es paga."}, {"q": "¿Necesito programar?", "a": "Para usarla no, pero sí tener instalado al menos un agente de terminal como Claude Code."}, {"q": "¿Funciona en Windows?", "a": "Sí: Mac, Windows y Linux."}], "usos": [{"e": "Orquestar", "c": "azul", "t": "Tu clon reparte el trabajo", "d": "Le das el objetivo y lo divide entre los agentes."}, {"e": "Tablero", "c": "morado", "t": "Tareas compartidas", "d": "Todos los agentes ven el mismo tablero."}, {"e": "Aprobaciones", "c": "verde", "t": "Lo que necesita tu decisión", "d": "Gastos y acciones delicadas te llegan para que decidas."}, {"e": "Clientes", "c": "naranja", "t": "Explicar los agentes", "d": "Para que un cliente vea cómo funciona la automatización."}], "fuentes": ["https://github.com/chaitanyagiri/munder-difflin", "https://munderdiffl.in/", "https://munderdiffl.in/blog/launching-munder-difflin-v0-5-2/", "https://github.com/HarnessMD/munder-difflin"], "ejemplo": {"titulo": "Ejemplo resuelto: un freelancer arma su oficina para entregar una landing", "negocio": "Ejemplo inventado: un desarrollador freelance en Guadalajara que hace sitios para comercios de su zona. Trabaja solo, paga Claude Code y Codex, y usa Windows.", "punto_de_partida": "Para cada landing salta entre dos terminales: en una escribe con Claude Code y en la otra le pide a Codex que revise. Copia y pega entre las dos y pierde el hilo de qué revisó cada uno.", "pasos": ["Abrió claude y codex en la terminal, cada uno en una carpeta de prueba, y confirmó que respondían con su cuenta antes de instalar nada.", "Bajó la app desde harnessmd.com/download. Windows mostró un aviso de SmartScreen; confirmó que el archivo venía de ahí y siguió. En el asistente de inicio no instaló agentes que no iba a usar, y en Settings apagó la telemetría.", "Creó la carpeta panaderia-landing con git init y un archivo datos-negocio.md con lo que le pasó el cliente, una panadería de barrio: horarios, productos, dirección y fotos.", "Abrió esa carpeta como piso y sumó tres agentes: Claude Code para construir, Codex para revisar errores y accesibilidad, y otra sesión de Claude Code para los textos. Le puso presupuesto de tokens a cada uno.", "Le pegó a Michael el pedido 2 del pack del kit, con la regla de avisarle para aprobar los textos antes de construir.", "Miró el tablero: Michael armó cinco tareas y las asignó. Cuando le llegaron los textos a la cola de aprobaciones, cambió una frase que prometía \"el mejor pan de la ciudad\" y aprobó.", "El agente revisor le mandó por el buzón al constructor dos problemas: el formulario no tenía etiquetas y faltaba el texto alternativo de las fotos. Él vio el intercambio en el tablero sin tener que copiar nada.", "Al final revisó los cambios en el visor de git de la app, abrió la landing en el navegador y la probó en el celular antes de mostrársela al cliente.", "Le pidió a Michael el cierre del día del pack y leyó las notas de memoria de cada agente para borrar una que estaba mal."], "resultado": "Quedó un piso por proyecto, con tres agentes que se pasan el trabajo por el tablero y el buzón, y él decide solo en la cola de aprobaciones y en la revisión final. Cada agente gasta de su propio plan, y él ve el consumo por agente."}, "si_falla": [{"sintoma": "Un agente no arranca en la oficina, o en Windows aparece \"cannot create process, error code: 2\".", "solucion": "La app no encuentra el comando del agente. Abre una terminal nueva y prueba el comando solo (claude, codex, etc.). Si no responde, reinstala el agente y vuelve a abrir la app. Si responde, actualiza Munder Difflin: una versión corrigió justo este error en Windows buscando claude en las rutas de instalación estándar."}, {"sintoma": "Windows bloquea el instalador con un aviso de SmartScreen.", "solucion": "Algunas versiones para Windows salieron sin firma de código. Confirma que lo bajaste de harnessmd.com/download o de la página de releases del repositorio y compara el archivo con SHA256SUMS.txt de esa versión. Si no coincide, no lo instales."}, {"sintoma": "Quiero abrir la misma carpeta en dos pisos y no me deja.", "solucion": "Es así a propósito: una carpeta se abre en un solo piso. Si quieres dos equipos sobre el mismo proyecto, usa una copia de la carpeta o un worktree de git aparte para el segundo piso."}, {"sintoma": "Un agente se queda dando vueltas y el consumo de su plan sube rápido.", "solucion": "Bájale el presupuesto de tokens a ese agente y deja que actúe el freno. Después achica la tarea en el tablero: las tareas difusas son las que más se traban. Si el agente sigue igual, frénalo y reasigna la tarea a otro."}, {"sintoma": "Al compilar desde el código, la app no arranca con un error de node-pty.", "solucion": "node-pty se compila para la versión de Electron. Revisa que tengas Node.js 18 o más nuevo y las herramientas de compilación de C/C++ (en Mac, xcode-select --install) y vuelve a correr npm install."}], "kit": [{"archivo": "checklist-primer-piso-munder-difflin.md", "que_es": "Checklist en orden para instalar la oficina, abrir el primer piso con permisos mínimos, dar el primer encargo y revisar la primera semana.", "contenido": "# Checklist: tu primer piso en Munder Difflin\n\nPara instalar la oficina sin sorpresas y con lo justo de permisos. Tilda en orden.\n\n## Antes de instalar\n\n- [ ] Cada agente que vas a sumar funciona solo en la terminal con tu cuenta. Prueba, por ejemplo, abrir claude en una carpeta cualquiera y pedirle \"dime qué archivos hay aquí\". Haz lo mismo con el segundo agente (codex, gemini, cursor-agent u otro).\n- [ ] Sabes qué plan tiene cada agente y dónde se ve su consumo.\n- [ ] Creaste una carpeta de prueba vacía, por ejemplo oficina-prueba, fuera de tus proyectos de clientes.\n- [ ] Si la carpeta va a ser un repositorio, hiciste git init y un primer commit. Así puedes volver atrás cualquier cambio.\n\n## Instalación\n\n- [ ] Bajaste la app desde harnessmd.com/download o desde la página de releases del repositorio, no desde un sitio de terceros.\n- [ ] Si estás en Windows y aparece un aviso de SmartScreen, revisaste que el archivo venga de esos dos lugares antes de aceptar.\n- [ ] Completaste el asistente de inicio y dejaste que instale solo lo que sabes qué es.\n- [ ] En Settings revisaste la telemetría: las versiones oficiales mandan eventos de uso anónimos y se puede apagar.\n\n## Primer piso\n\n- [ ] Abriste como piso la carpeta de prueba, no tu carpeta de usuario ni todo el disco.\n- [ ] Sumaste 2 o 3 agentes, no más.\n- [ ] Le pusiste presupuesto de tokens a cada agente.\n- [ ] Configuraste qué puede hacer cada agente solo y qué tiene que pasar por la cola de aprobaciones: borrar archivos, instalar paquetes, publicar y gastar, siempre a la cola.\n\n## Primer encargo\n\n- [ ] El objetivo entra en un párrafo y tiene un entregable que puedes revisar en 10 minutos.\n- [ ] El objetivo dice qué carpeta pueden tocar y qué no.\n- [ ] El objetivo dice cuándo te tienen que avisar.\n- [ ] Miraste el tablero para ver cómo Michael repartió las tareas.\n- [ ] Revisaste el resultado y los cambios (git diff o el visor de git de la app) antes de darlo por bueno.\n\n## Después de la primera semana\n\n- [ ] Revisaste el consumo de cada agente en su plan.\n- [ ] Leíste las notas de memoria que dejó cada agente y borraste lo que esté mal o desactualizado.\n- [ ] Decidiste si suma tener la oficina o si con un solo agente alcanzaba para este tipo de trabajo.\n"}, {"archivo": "objetivos-para-michael-orquestador.md", "que_es": "Pack de cinco pedidos para el orquestador (revisión sin tocar nada, landing, error con hipótesis en paralelo, documentación y cierre del día) con la misma estructura de objetivo, reparto, límites y avisos.", "contenido": "# Objetivos para Michael: pack de pedidos para la oficina\n\nPedidos para pegarle al orquestador. Todos siguen la misma estructura: objetivo, reparto, límites y cuándo avisarte. Cambia los corchetes.\n\n## Estructura base\n\nObjetivo: [QUÉ TIENE QUE EXISTIR AL FINAL, EN UNA FRASE].\nEntregable: [ARCHIVO O CARPETA QUE VOY A REVISAR].\nReparto: [QUÉ AGENTE HACE QUÉ, O \"REPÁRTELO TÚ Y MUÉSTRAME EL REPARTO EN EL TABLERO ANTES DE ARRANCAR\"].\nLímites: solo pueden tocar [CARPETA]. Nadie instala paquetes nuevos, borra archivos ni publica sin pasar por la cola de aprobaciones.\nAvísame: [CUÁNDO: AL TENER EL PLAN / ANTES DE CADA CAMBIO GRANDE / AL TERMINAR].\n\n## 1. Revisión de un proyecto existente (sin tocar nada)\n\nObjetivo: un informe de problemas del proyecto en [CARPETA].\nEntregable: revision.md en la raíz.\nReparto: un agente revisa errores y casos sin manejar, otro revisa accesibilidad y textos, otro revisa dependencias desactualizadas o sin uso.\nLímites: nadie edita archivos salvo revision.md. Cada hallazgo lleva archivo y línea.\nAvísame: al terminar, con los 5 hallazgos más importantes arriba.\n\n## 2. Landing para un cliente\n\nObjetivo: una landing de una página para [NEGOCIO] con formulario de contacto.\nEntregable: la carpeta landing/ y un LÉEME.md con cómo verla en local.\nReparto: un agente escribe los textos a partir de [ARCHIVO CON DATOS DEL NEGOCIO], otro construye, otro revisa errores, accesibilidad y que ningún texto prometa resultados.\nLímites: solo trabajan en landing/. Sin servicios pagos ni claves.\nAvísame: para aprobar los textos antes de construir, y antes de publicar cualquier cosa.\n\n## 3. Arreglar un error con hipótesis en paralelo\n\nObjetivo: encontrar por qué [DESCRIPCIÓN DEL ERROR].\nEntregable: diagnostico.md con la causa y el cambio propuesto.\nReparto: cada agente prueba una hipótesis distinta: [HIPÓTESIS 1], [HIPÓTESIS 2], [HIPÓTESIS 3]. Que se manden por el buzón lo que descartan.\nLímites: pueden leer todo y correr los tests, pero ningún cambio se aplica sin mi aprobación.\nAvísame: cuando dos agentes coincidan en la causa.\n\n## 4. Documentación de un proyecto\n\nObjetivo: que alguien nuevo pueda levantar el proyecto [NOMBRE] en una tarde.\nEntregable: docs/ con instalación, estructura de carpetas y cómo correr los tests.\nReparto: un agente lee el código y arma la estructura, otro sigue los pasos desde cero en una carpeta aparte y anota dónde se traba, otro escribe.\nLímites: solo escriben en docs/.\nAvísame: al terminar, con la lista de pasos donde se trabó el agente que probó.\n\n## 5. Cierre del día\n\nMichael, antes de cerrar: resúmeme en 5 líneas qué quedó hecho, qué quedó a medias y qué necesita mi decisión. Pídele a cada agente que guarde en su memoria lo que aprendió hoy de este proyecto, en una lista corta.\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "úsalo"};</script>

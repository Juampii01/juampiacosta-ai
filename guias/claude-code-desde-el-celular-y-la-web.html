o tenés el proyecto en GitHub, creá un repositorio con un README primero. Si no querés usar GitHub, usá Remote Control."}, {"h": "Desde el celular", "pasos": ["Instalá la app de Claude para iOS o Android. Desde Claude Code en la compu, /mobile te muestra un código QR que lleva a la tienda correcta.", "Iniciá sesión con la misma cuenta que usás en Claude Code.", "Tocá Code en la navegación de la app: ahí están tus sesiones en la nube y las de Remote Control.", "Para una tarea nueva en la nube, elegí repositorio y rama, describí la tarea y mandala. Después podés cerrar la app."], "prompts": [{"t": "Tarea para mandar desde el teléfono", "c": "En este repositorio, [LO QUE QUERÉS, POR EJEMPLO: CAMBIÁ EL TELÉFONO DE CONTACTO DEL PIE DE PÁGINA POR [NÚMERO NUEVO]].\nHacé solo ese cambio, revisá que no se rompa nada más y dejame un resumen de 3 líneas de lo que tocaste para revisarlo desde el celular."}]}, {"h": "Remote Control: tu compu en el bolsillo", "pasos": ["En la compu, en la carpeta del proyecto, corré claude remote-control. La primera vez te pregunta si querés habilitarlo: respondé y.", "Apretá la barra espaciadora para ver un código QR y escanealo con el teléfono.", "O abrí la app de Claude, tocá Code y elegí la sesión de la lista.", "Si ya tenés una sesión abierta, escribí /remote-control (o /rc) y queda disponible desde el teléfono."], "p": ["Si tu compu se duerme o se corta internet, se vuelve a conectar sola cuando vuelve. Con Remote Control activo, Claude te puede mandar notificaciones al teléfono, por ejemplo cuando termina algo largo."]}, {"h": "Pasar de un lado al otro", "lista": ["/teleport: en la terminal, trae una sesión de la nube a tu compu.", "claude --cloud: desde la terminal, arranca una sesión en la nube.", "/desktop: pasa la sesión de la terminal a la app de escritorio (Mac o Windows x64)."]}], "faq": [{"q": "No veo la pestaña Code en la app del celular", "a": "Tu plan u organización puede no incluirla. Revisá que entraste con la misma cuenta y o

<script>var GUIA = {"slug": "claude-code-desde-el-celular-y-la-web", "t": "Claude Code desde el celular y el navegador", "d": "Lanza tareas desde claude.ai/code o la app de Claude, y sigue desde el teléfono una sesión que corre en tu computadora.", "tema": "Claude Code", "min": 9, "fichaNombre": "Claude Code en la web y el celular", "ficha": [["En la web", "claude.ai/code: Claude trabaja en la nube sobre un repositorio de GitHub."], ["En el celular", "La app de Claude para iOS y Android, pestaña Code. No hay una app aparte."], ["Remote Control", "Manejas desde el teléfono una sesión que corre en tu computadora, con tus archivos."], ["Necesitas", "Cuenta de claude.ai con plan pago. Con una clave de API no funciona."]], "secciones": [{"h": "Dos maneras, una diferencia clave", "lista": ["Sesión en la nube: el trabajo corre en una máquina de Anthropic. Sigue aunque cierres la computadora o el navegador. Necesita un repositorio en GitHub.", "Remote Control: el trabajo corre en tu computadora, con tus archivos y tus herramientas. El teléfono o el navegador son solo la ventana. Tu computadora tiene que quedar prendida y Claude Code abierto."], "p": ["Las sesiones en la nube están en los planes Pro, Max y Team, y en Enterprise según el tipo de licencia. Remote Control está en Pro, Max, Team y Enterprise (en Team y Enterprise lo tiene que habilitar el administrador)."]}, {"h": "Primera vez en claude.ai/code", "pasos": ["Entra a claude.ai/code e inicia sesión con tu cuenta de Claude.", "Conecta tu cuenta de GitHub cuando te lo pida y aprueba el permiso.", "Para trabajar en repositorios privados, instala la app de Claude en GitHub sobre esa cuenta u organización.", "En Pro y Max se crea solo un entorno llamado Default. Para empezar, déjalo como está.", "Elige el repositorio debajo del cuadro de mensaje, elige el modo (Auto, Accept edits o Plan) y escribe la tarea.", "Cuando termina, toca el indicador de cambios (por ejemplo +42 -18) para ver qué hizo y, si te gusta, toca Create PR."], "aviso": "Si todavía no tienes el proyecto en GitHub, crea un repositorio con un README primero. Si no quieres usar GitHub, usa Remote Control."}, {"h": "Desde el celular", "pasos": ["Instala la app de Claude para iOS o Android. Desde Claude Code en la computadora, /mobile te muestra un código QR que lleva a la tienda correcta.", "Inicia sesión con la misma cuenta que usas en Claude Code.", "Toca Code en la navegación de la app: ahí están tus sesiones en la nube y las de Remote Control.", "Para una tarea nueva en la nube, elige repositorio y rama, describe la tarea y mandala. Después puedes cerrar la app."], "prompts": [{"t": "Tarea para mandar desde el teléfono", "c": "En este repositorio, [LO QUE QUIERES, POR EJEMPLO: CAMBIA EL TELÉFONO DE CONTACTO DEL PIE DE PÁGINA POR [NÚMERO NUEVO]].\nHaz solo ese cambio, revisa que no se rompa nada más y déjame un resumen de 3 líneas de lo que tocaste para revisarlo desde el celular."}]}, {"h": "Remote Control: tu computadora en el bolsillo", "pasos": ["En la computadora, en la carpeta del proyecto, corre claude remote-control. La primera vez te pregunta si quieres habilitarlo: responde y.", "Aprieta la barra espaciadora para ver un código QR y escanéalo con el teléfono.", "O abre la app de Claude, toca Code y elige la sesión de la lista.", "Si ya tienes una sesión abierta, escribe /remote-control (o /rc) y queda disponible desde el teléfono."], "p": ["Si tu computadora se duerme o se corta internet, en una sesión interactiva se vuelve a conectar sola cuando vuelve. Si la arrancaste con claude remote-control y la computadora está despierta pero sin internet por más de unos 10 minutos, el proceso se cierra: corre claude remote-control de nuevo. Con Remote Control activo, Claude te puede mandar notificaciones al teléfono, por ejemplo cuando termina algo largo."]}, {"h": "Pasar de un lado al otro", "lista": ["/teleport: en la terminal, trae una sesión de la nube a tu computadora.", "claude --cloud: desde la terminal, arranca una sesión en la nube.", "/desktop: pasa la sesión de la terminal a la app de escritorio (Mac o Windows x64)."]}], "faq": [{"q": "No veo la pestaña Code en la app del celular", "a": "Tu plan u organización puede no incluirla. Revisa que entraste con la misma cuenta y organización que usas en Claude Code."}, {"q": "Cerré la pestaña y la tarea siguió", "a": "Es a propósito: las sesiones en la nube siguen hasta terminar. Puedes archivarlas o borrarlas desde la barra lateral."}, {"q": "Desde el celular, ¿puedo usar todos los comandos?", "a": "No todos. Los que solo funcionan en la terminal, como /plugin o /resume, no andan desde la app."}], "fuentes": ["https://code.claude.com/docs/en/web-quickstart", "https://code.claude.com/docs/en/mobile", "https://code.claude.com/docs/en/remote-control", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/claude-code-on-the-web"], "ejemplo": {"titulo": "Ejemplo resuelto: la web de una vinoteca manejada desde el teléfono", "negocio": "Ejemplo inventado: una vinoteca de Mendoza con tienda online. El dueño sabe lo justo de programación, tiene la web en un repositorio privado de GitHub y plan Pro de Claude.", "punto_de_partida": "Los cambios chicos (horarios de feriado, un teléfono nuevo, un texto de envío) esperaban a que se sentara en la computadora a la noche, y a veces pasaban días.", "pasos": ["Desde la computadora entró a claude.ai/code, conectó GitHub y, como el repositorio es privado, instaló la app de Claude en GitHub sobre su cuenta. Dejó el entorno Default como estaba.", "Subió al repositorio el CLAUDE.md del kit, completando dónde están los datos del negocio y los comandos para compilar.", "En Claude Code de la computadora escribió /mobile, escaneó el QR, instaló la app de Claude e inició sesión con la misma cuenta.", "Un viernes, desde el local, tocó Code en la app, eligió el repositorio y la rama main, y mandó el primer pedido del kit para cambiar el horario del fin de semana largo. Cerró la app y siguió atendiendo.", "Más tarde abrió la sesión, leyó el resumen de 3 líneas y tocó el indicador de cambios para ver qué había tocado. Con todo bien, tocó Create PR y mergeó desde GitHub.", "Para un cambio más grande que necesitaba sus archivos locales (fotos nuevas de etiquetas que tenía en la computadora), dejó corriendo claude remote-control en la carpeta del proyecto, respondió y a la pregunta de habilitarlo y escaneó el QR con la barra espaciadora.", "Desde el teléfono le pidió que optimizara las fotos y armara la página de la bodega nueva, y le escribió \"avísame al celular cuando termines\"."], "resultado": "Los cambios chicos se resuelven desde el teléfono en el momento, con un pull request que el dueño revisa antes de publicar. Para lo que necesita archivos de la computadora, usa Remote Control con la computadora prendida en el local."}, "si_falla": [{"sintoma": "En claude.ai/code o en la app no aparece tu repositorio privado.", "solucion": "Con la conexión de GitHub desde el navegador, los repositorios privados aparecen solo si instalaste la app de Claude en GitHub en la cuenta u organización dueña del repositorio, y si la instalación incluye ese repositorio. Instálala en github.com/apps/claude/installations/new o pídele al dueño de la organización que la apruebe."}, {"sintoma": "claude remote-control o /remote-control dice que Remote Control requiere una suscripción de claude.ai.", "solucion": "Corre claude auth login y elige la opción de claude.ai. Si el mensaje nombra ANTHROPIC_API_KEY o ANTHROPIC_AUTH_TOKEN, borra esa variable de tu terminal o del bloque env de settings.json. En Team o Enterprise, además, el administrador tiene que prender Remote Control."}, {"sintoma": "/teleport no trae la sesión de la nube y da un error.", "solucion": "Teleport pide tres cosas: que estés en una copia del mismo repositorio (no un fork), sin cambios sin commit (te ofrece guardarlos con stash), y con la misma cuenta de claude.ai que usó la sesión. La rama de la nube tiene que estar subida a GitHub."}, {"sintoma": "Mandaste una tarea con claude --cloud y la sesión no tiene tus últimos cambios.", "solucion": "La nube clona tu repositorio de GitHub en la rama actual, no tu carpeta local. Si ves \"Branch ... is not on GitHub\", arrancó desde otro punto. Haz push de tu rama y vuelve a lanzar la tarea."}, {"sintoma": "No llegan las notificaciones al celular con Remote Control.", "solucion": "En la terminal corre /config y prende Push when Claude decides o Push when actions required. Si dice No mobile registered, abre la app de Claude en el teléfono para que se registre. En iPhone revisa los modos de concentración y el resumen de notificaciones en Ajustes, Notificaciones, Claude."}], "kit": [{"archivo": "pedidos-claude-code-desde-el-celular.md", "que_es": "Pedidos listos para mandar desde el teléfono: cambios de datos, arreglos chicos, preguntas sin tocar nada y seguimiento de una sesión de Remote Control.", "contenido": "# Pedidos para mandar a Claude Code desde el celular\n\nDesde el teléfono no vas a mirar un diff largo. Estos pedidos piden cambios chicos y un resumen corto para revisar con el pulgar. Cambia lo que está entre corchetes.\n\n## Cambio de texto o dato (sesión en la nube)\n\n```\nEn este repositorio, cambia [QUÉ: EL HORARIO DE ATENCIÓN DEL PIE DE PÁGINA] de [VALOR VIEJO] a [VALOR NUEVO] en todas las páginas donde aparezca.\nHaz solo ese cambio. Si el dato aparece en un archivo de configuración, cámbialo ahí y no en cada página.\nCorre la compilación o las pruebas si el proyecto las tiene.\nDéjame un resumen de 3 líneas: qué archivos tocaste, si las pruebas pasaron y qué tengo que mirar en la vista previa.\n```\n\n## Arreglo chico con prueba (sesión en la nube)\n\n```\nHay un error: [QUÉ VE EL CLIENTE, POR EJEMPLO: EL BOTÓN DE WHATSAPP NO ABRE EN IPHONE].\nPrimero encuentra la causa y cuéntamela en 2 líneas.\nDespués arréglalo con el cambio más chico posible y, si el proyecto tiene pruebas, suma una que falle antes del arreglo y pase después.\nNo toques nada que no tenga que ver con este error.\nTermina con un resumen de 3 líneas para leer desde el celular.\n```\n\n## Solo preguntar, sin tocar nada (modo Plan)\n\n```\nSin cambiar ningún archivo: explícame en 5 líneas cómo funciona [EL FORMULARIO DE CONTACTO] en este proyecto y dónde se guardan los datos que manda la gente.\n```\n\n## Seguir algo que dejaste corriendo en la computadora (Remote Control)\n\n```\n¿En qué quedaste? Resúmeme en 3 líneas lo que hiciste desde mi último mensaje, si algo falló y qué necesitas que decida yo.\n```\n\n```\nAvísame al celular cuando terminen las pruebas.\n```\n\n## Después de revisar\n\n```\nSe ve bien. Abre el pull request con un título claro y una descripción de 3 puntos.\n```\n"}, {"archivo": "CLAUDE-md-repo-para-sesiones-desde-el-celular.md", "que_es": "CLAUDE.md de ejemplo para la raíz del repositorio, para que las sesiones en la nube y desde el celular sepan dónde están los datos, cómo comprobar que funciona y que terminen con un resumen corto. Guárdalo como CLAUDE.md.", "contenido": "# Instrucciones para Claude Code en este proyecto\n\nEste archivo va en la raíz del repositorio con el nombre CLAUDE.md. Lo leen las sesiones en la nube, las que mandas desde el celular y las de tu computadora.\n\n## Qué es este proyecto\n\n- [UNA LÍNEA: POR EJEMPLO, TIENDA ONLINE DE UNA VINOTECA, HECHA CON ASTRO]\n- Los textos de contacto (teléfono, dirección, horarios) están en [RUTA, POR EJEMPLO src/config/negocio.json]. Cámbialos ahí, nunca a mano en cada página.\n\n## Cómo comprobar que algo funciona\n\n- Instalar: `[COMANDO, POR EJEMPLO npm install]`\n- Compilar: `[COMANDO, POR EJEMPLO npm run build]`\n- Pruebas: `[COMANDO, POR EJEMPLO npm test]`\n- Antes de decir que terminaste, corre la compilación y muestra si pasó o falló.\n\n## Cómo trabajar cuando te escriben desde el celular\n\n- El dueño revisa desde el teléfono. Termina siempre con un resumen de máximo 3 líneas: qué archivos tocaste, si pasó la compilación y qué mirar.\n- Haz cambios chicos. Si el pedido necesita tocar más de [5] archivos, frena y propón un plan antes.\n- No cambies dependencias, ni la configuración de despliegue, ni nada de pagos, sin que te lo pidan explícitamente.\n\n## Ramas\n\n- Trabaja en una rama nueva. No hagas push a main.\n- Nombres de rama en minúscula y con guiones, describiendo el cambio.\n\n## Datos sensibles\n\n- No escribas claves, tokens ni contraseñas en ningún archivo del repositorio.\n- Si falta una variable de entorno, dilo y para. No inventes un valor.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

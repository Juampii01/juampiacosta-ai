<script>var GUIA = {"slug": "claude-code-desde-el-celular-y-la-web", "t": "Claude Code desde el celular y el navegador", "d": "Lanzá tareas desde claude.ai/code o la app de Claude, y seguí desde el teléfono una sesión que corre en tu compu.", "tema": "Claude Code", "min": 9, "fichaNombre": "Claude Code en la web y el celular", "ficha": [["En la web", "claude.ai/code: Claude trabaja en la nube sobre un repositorio de GitHub."], ["En el celular", "La app de Claude para iOS y Android, pestaña Code. No hay una app aparte."], ["Remote Control", "Manejás desde el teléfono una sesión que corre en tu compu, con tus archivos."], ["Necesitás", "Cuenta de claude.ai con plan pago. Con una clave de API no funciona."]], "secciones": [{"h": "Dos maneras, una diferencia clave", "lista": ["Sesión en la nube: el trabajo corre en una máquina de Anthropic. Sigue aunque cierres la compu o el navegador. Necesita un repositorio en GitHub.", "Remote Control: el trabajo corre en tu compu, con tus archivos y tus herramientas. El teléfono o el navegador son solo la ventana. Tu compu tiene que quedar prendida y Claude Code abierto."], "p": ["Las sesiones en la nube están en los planes Pro, Max y Team, y en Enterprise según el tipo de licencia. Remote Control está en Pro, Max, Team y Enterprise (en Team y Enterprise lo tiene que habilitar el administrador)."]}, {"h": "Primera vez en claude.ai/code", "pasos": ["Entrá a claude.ai/code e iniciá sesión con tu cuenta de Claude.", "Conectá tu cuenta de GitHub cuando te lo pida y aprobá el permiso.", "Para trabajar en repositorios privados, instalá la app de Claude en GitHub sobre esa cuenta u organización.", "En Pro y Max se crea solo un entorno llamado Default. Para empezar, dejalo como está.", "Elegí el repositorio debajo del cuadro de mensaje, elegí el modo (Auto, Accept edits o Plan) y escribí la tarea.", "Cuando termina, tocá el indicador de cambios (por ejemplo +42 -18) para ver qué hizo y, si te gusta, tocá Create PR."], "aviso": "Si todavía no tenés el proyecto en GitHub, creá un repositorio con un README primero. Si no querés usar GitHub, usá Remote Control."}, {"h": "Desde el celular", "pasos": ["Instalá la app de Claude para iOS o Android. Desde Claude Code en la compu, /mobile te muestra un código QR que lleva a la tienda correcta.", "Iniciá sesión con la misma cuenta que usás en Claude Code.", "Tocá Code en la navegación de la app: ahí están tus sesiones en la nube y las de Remote Control.", "Para una tarea nueva en la nube, elegí repositorio y rama, describí la tarea y mandala. Después podés cerrar la app."], "prompts": [{"t": "Tarea para mandar desde el teléfono", "c": "En este repositorio, [LO QUE QUERÉS, POR EJEMPLO: CAMBIÁ EL TELÉFONO DE CONTACTO DEL PIE DE PÁGINA POR [NÚMERO NUEVO]].\nHacé solo ese cambio, revisá que no se rompa nada más y dejame un resumen de 3 líneas de lo que tocaste para revisarlo desde el celular."}]}, {"h": "Remote Control: tu compu en el bolsillo", "pasos": ["En la compu, en la carpeta del proyecto, corré claude remote-control. La primera vez te pregunta si querés habilitarlo: respondé y.", "Apretá la barra espaciadora para ver un código QR y escanealo con el teléfono.", "O abrí la app de Claude, tocá Code y elegí la sesión de la lista.", "Si ya tenés una sesión abierta, escribí /remote-control (o /rc) y queda disponible desde el teléfono."], "p": ["Si tu compu se duerme o se corta internet, en una sesión interactiva se vuelve a conectar sola cuando vuelve. Si la arrancaste con claude remote-control y la compu está despierta pero sin internet por más de unos 10 minutos, el proceso se cierra: corré claude remote-control de nuevo. Con Remote Control activo, Claude te puede mandar notificaciones al teléfono, por ejemplo cuando termina algo largo."]}, {"h": "Pasar de un lado al otro", "lista": ["/teleport: en la terminal, trae una sesión de la nube a tu compu.", "claude --cloud: desde la terminal, arranca una sesión en la nube.", "/desktop: pasa la sesión de la terminal a la app de escritorio (Mac o Windows x64)."]}], "faq": [{"q": "No veo la pestaña Code en la app del celular", "a": "Tu plan u organización puede no incluirla. Revisá que entraste con la misma cuenta y organización que usás en Claude Code."}, {"q": "Cerré la pestaña y la tarea siguió", "a": "Es a propósito: las sesiones en la nube siguen hasta terminar. Podés archivarlas o borrarlas desde la barra lateral."}, {"q": "Desde el celular, ¿puedo usar todos los comandos?", "a": "No todos. Los que solo funcionan en la terminal, como /plugin o /resume, no andan desde la app."}], "fuentes": ["https://code.claude.com/docs/en/web-quickstart", "https://code.claude.com/docs/en/mobile", "https://code.claude.com/docs/en/remote-control", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/claude-code-on-the-web"], "ejemplo": {"titulo": "Ejemplo resuelto: la web de una vinoteca manejada desde el teléfono", "negocio": "Ejemplo inventado: una vinoteca de Mendoza con tienda online. El dueño sabe lo justo de programación, tiene la web en un repositorio privado de GitHub y plan Pro de Claude.", "punto_de_partida": "Los cambios chicos (horarios de feriado, un teléfono nuevo, un texto de envío) esperaban a que se sentara en la compu a la noche, y a veces pasaban días.", "pasos": ["Desde la compu entró a claude.ai/code, conectó GitHub y, como el repositorio es privado, instaló la app de Claude en GitHub sobre su cuenta. Dejó el entorno Default como estaba.", "Subió al repositorio el CLAUDE.md del kit, completando dónde están los datos del negocio y los comandos para compilar.", "En Claude Code de la compu escribió /mobile, escaneó el QR, instaló la app de Claude e inició sesión con la misma cuenta.", "Un viernes, desde el local, tocó Code en la app, eligió el repositorio y la rama main, y mandó el primer pedido del kit para cambiar el horario del fin de semana largo. Cerró la app y siguió atendiendo.", "Más tarde abrió la sesión, leyó el resumen de 3 líneas y tocó el indicador de cambios para ver qué había tocado. Con todo bien, tocó Create PR y mergeó desde GitHub.", "Para un cambio más grande que necesitaba sus archivos locales (fotos nuevas de etiquetas que tenía en la compu), dejó corriendo claude remote-control en la carpeta del proyecto, respondió y a la pregunta de habilitarlo y escaneó el QR con la barra espaciadora.", "Desde el teléfono le pidió que optimizara las fotos y armara la página de la bodega nueva, y le escribió \"avisame al celular cuando termines\"."], "resultado": "Los cambios chicos se resuelven desde el teléfono en el momento, con un pull request que el dueño revisa antes de publicar. Para lo que necesita archivos de la compu, usa Remote Control con la compu prendida en el local."}, "si_falla": [{"sintoma": "En claude.ai/code o en la app no aparece tu repositorio privado.", "solucion": "Con la conexión de GitHub desde el navegador, los repositorios privados aparecen solo si instalaste la app de Claude en GitHub en la cuenta u organización dueña del repositorio, y si la instalación incluye ese repositorio. Instalala en github.com/apps/claude/installations/new o pedile al dueño de la organización que la apruebe."}, {"sintoma": "claude remote-control o /remote-control dice que Remote Control requiere una suscripción de claude.ai.", "solucion": "Corré claude auth login y elegí la opción de claude.ai. Si el mensaje nombra ANTHROPIC_API_KEY o ANTHROPIC_AUTH_TOKEN, borrá esa variable de tu terminal o del bloque env de settings.json. En Team o Enterprise, además, el administrador tiene que prender Remote Control."}, {"sintoma": "/teleport no trae la sesión de la nube y da un error.", "solucion": "Teleport pide tres cosas: que estés en una copia del mismo repositorio (no un fork), sin cambios sin commit (te ofrece guardarlos con stash), y con la misma cuenta de claude.ai que usó la sesión. La rama de la nube tiene que estar subida a GitHub."}, {"sintoma": "Mandaste una tarea con claude --cloud y la sesión no tiene tus últimos cambios.", "solucion": "La nube clona tu repositorio de GitHub en la rama actual, no tu carpeta local. Si ves \"Branch ... is not on GitHub\", arrancó desde otro punto. Hacé push de tu rama y volvé a lanzar la tarea."}, {"sintoma": "No llegan las notificaciones al celular con Remote Control.", "solucion": "En la terminal corré /config y prendé Push when Claude decides o Push when actions required. Si dice No mobile registered, abrí la app de Claude en el teléfono para que se registre. En iPhone revisá los modos de concentración y el resumen de notificaciones en Ajustes, Notificaciones, Claude."}], "kit": [{"archivo": "pedidos-claude-code-desde-el-celular.md", "que_es": "Pedidos listos para mandar desde el teléfono: cambios de datos, arreglos chicos, preguntas sin tocar nada y seguimiento de una sesión de Remote Control.", "contenido": "# Pedidos para mandar a Claude Code desde el celular\n\nDesde el teléfono no vas a mirar un diff largo. Estos pedidos piden cambios chicos y un resumen corto para revisar con el pulgar. Cambiá lo que está entre corchetes.\n\n## Cambio de texto o dato (sesión en la nube)\n\n```\nEn este repositorio, cambiá [QUÉ: EL HORARIO DE ATENCIÓN DEL PIE DE PÁGINA] de [VALOR VIEJO] a [VALOR NUEVO] en todas las páginas donde aparezca.\nHacé solo ese cambio. Si el dato aparece en un archivo de configuración, cambialo ahí y no en cada página.\nCorré la compilación o las pruebas si el proyecto las tiene.\nDejame un resumen de 3 líneas: qué archivos tocaste, si las pruebas pasaron y qué tengo que mirar en la vista previa.\n```\n\n## Arreglo chico con prueba (sesión en la nube)\n\n```\nHay un error: [QUÉ VE EL CLIENTE, POR EJEMPLO: EL BOTÓN DE WHATSAPP NO ABRE EN IPHONE].\nPrimero encontrá la causa y contámela en 2 líneas.\nDespués arreglalo con el cambio más chico posible y, si el proyecto tiene pruebas, sumá una que falle antes del arreglo y pase después.\nNo toques nada que no tenga que ver con este error.\nTerminá con un resumen de 3 líneas para leer desde el celular.\n```\n\n## Solo preguntar, sin tocar nada (modo Plan)\n\n```\nSin cambiar ningún archivo: explicame en 5 líneas cómo funciona [EL FORMULARIO DE CONTACTO] en este proyecto y dónde se guardan los datos que manda la gente.\n```\n\n## Seguir algo que dejaste corriendo en la compu (Remote Control)\n\n```\n¿En qué quedaste? Resumime en 3 líneas lo que hiciste desde mi último mensaje, si algo falló y qué necesitás que decida yo.\n```\n\n```\nAvisame al celular cuando terminen las pruebas.\n```\n\n## Después de revisar\n\n```\nSe ve bien. Abrí el pull request con un título claro y una descripción de 3 puntos.\n```\n"}, {"archivo": "CLAUDE-md-repo-para-sesiones-desde-el-celular.md", "que_es": "CLAUDE.md de ejemplo para la raíz del repositorio, para que las sesiones en la nube y desde el celular sepan dónde están los datos, cómo comprobar que funciona y que terminen con un resumen corto. Guardalo como CLAUDE.md.", "contenido": "# Instrucciones para Claude Code en este proyecto\n\nEste archivo va en la raíz del repositorio con el nombre CLAUDE.md. Lo leen las sesiones en la nube, las que mandás desde el celular y las de tu compu.\n\n## Qué es este proyecto\n\n- [UNA LÍNEA: POR EJEMPLO, TIENDA ONLINE DE UNA VINOTECA, HECHA CON ASTRO]\n- Los textos de contacto (teléfono, dirección, horarios) están en [RUTA, POR EJEMPLO src/config/negocio.json]. Cambialos ahí, nunca a mano en cada página.\n\n## Cómo comprobar que algo funciona\n\n- Instalar: `[COMANDO, POR EJEMPLO npm install]`\n- Compilar: `[COMANDO, POR EJEMPLO npm run build]`\n- Pruebas: `[COMANDO, POR EJEMPLO npm test]`\n- Antes de decir que terminaste, corré la compilación y mostrá si pasó o falló.\n\n## Cómo trabajar cuando te escriben desde el celular\n\n- El dueño revisa desde el teléfono. Terminá siempre con un resumen de máximo 3 líneas: qué archivos tocaste, si pasó la compilación y qué mirar.\n- Hacé cambios chicos. Si el pedido necesita tocar más de [5] archivos, frená y proponé un plan antes.\n- No cambies dependencias, ni la configuración de despliegue, ni nada de pagos, sin que te lo pidan explícitamente.\n\n## Ramas\n\n- Trabajá en una rama nueva. No hagas push a main.\n- Nombres de rama en minúscula y con guiones, describiendo el cambio.\n\n## Datos sensibles\n\n- No escribas claves, tokens ni contraseñas en ningún archivo del repositorio.\n- Si falta una variable de entorno, decilo y pará. No inventes un valor.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

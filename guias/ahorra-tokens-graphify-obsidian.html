<script>var GUIA = {"slug": "ahorra-tokens-graphify-obsidian", "post": "MAPA", "t": "Ahorra tokens en Claude Code con Graphify y Obsidian", "d": "Graphify convierte tu proyecto en un mapa que Claude consulta en lugar de releer archivos, y Obsidian le da una memoria de notas en texto plano. Cómo instalar las dos y conectarlas.", "tema": "Gasta menos tokens", "min": 7, "ficha": [["Qué es", "Graphify convierte tu proyecto en un mapa que Claude consulta y Obsidian le da una memoria de notas."], ["Para quién", "Quien gasta mucho uso porque, en cada sesión nueva, Claude tiene que volver a buscar y abrir archivos para entender el proyecto."], ["Necesitas", "Claude Code, Python 3.10 o más nuevo con uv, Obsidian y las obsidian-skills."], ["Cuánto cuesta", "Graphify es de código abierto (el repositorio declara licencias Apache-2.0 y MIT) y Obsidian es gratis, también para trabajo."], ["Ojo", "Las cifras de ahorro que publican son de sus pruebas: mídelo tú con /context."]], "secciones": [{"h": "El problema", "p": ["Cada sesión de Claude Code arranca con el contexto vacío: carga tu CLAUDE.md, pero no recuerda lo que exploró la vez anterior. Si le preguntas algo del proyecto, vuelve a buscar y abrir archivos para entenderlo, y eso se come tokens y parte de tu límite de uso. La idea es darle dos cosas: un mapa del proyecto para consultar y una memoria que no tenga que releer entera."]}, {"h": "1. Graphify: el mapa del proyecto", "p": ["Graphify arma un grafo (un mapa de conexiones) con tu código, documentos, PDF e imágenes, y Claude lo consulta en lugar de buscar archivo por archivo. El mapa del código se arma en tu computadora sin usar IA, así que esa parte no gasta tokens. Los documentos, PDF e imágenes sí pasan por el modelo de tu asistente, y eso sí consume."], "lista": ["Repositorio: <a href=\"https://github.com/Graphify-Labs/graphify\" target=\"_blank\" rel=\"noopener\">github.com/Graphify-Labs/graphify ↗<\/a>", "Necesitas: Python 3.10 o más nuevo y uv (o pipx).", "Instalación, en la terminal: uv tool install graphifyy y después graphify install (detecta tu asistente y registra la skill).", "Para usarlo, dentro de Claude Code: /graphify . arma el mapa en la carpeta graphify-out. Después, en la terminal y una sola vez por proyecto, corre graphify claude install para que Claude Code consulte el mapa antes de buscar archivos."], "prompts": [{"t": "Instalarlo", "c": "Instala Graphify (github.com/Graphify-Labs/graphify) en este proyecto siguiendo su README, genera el mapa y configura Claude Code para que lo consulte antes de leer archivos. Después compara cuánto contexto usas en una misma pregunta con y sin el mapa."}], "aviso": "Los porcentajes de ahorro que publican son de sus propias pruebas, y algunos son de su versión paga en la nube (Graphify Cloud), que es otra cosa. Mídelo tú en tu proyecto."}, {"h": "2. Obsidian: la memoria", "p": ["Obsidian guarda tus notas como archivos de texto en tu computadora. Con las obsidian-skills de Steph Ango (kepano), del equipo de Obsidian, Claude aprende a leer y escribir esas notas en el formato de Obsidian: decisiones, aprendizajes, clientes."], "lista": ["Obsidian (gratis, también para uso laboral): <a href=\"https://obsidian.md\" target=\"_blank\" rel=\"noopener\">obsidian.md ↗<\/a>", "Skills para Obsidian: <a href=\"https://github.com/kepano/obsidian-skills\" target=\"_blank\" rel=\"noopener\">github.com/kepano/obsidian-skills ↗<\/a>", "Instalación, dentro de Claude Code: /plugin marketplace add kepano/obsidian-skills y después /plugin install obsidian@obsidian-skills"], "prompts": [{"t": "Conectarlo", "c": "Ya instalé las obsidian-skills (github.com/kepano/obsidian-skills). Mi bóveda de Obsidian está en [RUTA]. Crea las notas decisiones.md, aprendizajes.md y proyectos.md, y agrega a mi CLAUDE.md que las lea al empezar y las actualice al terminar cada tarea."}]}, {"h": "3. Las dos juntas en 10 minutos", "pasos": ["Instala Graphify en tu proyecto y genera el mapa.", "Instala Obsidian y las obsidian-skills.", "Corre graphify claude install en la carpeta del proyecto para que Claude Code mire el mapa antes de buscar. En tu CLAUDE.md agrega dónde está tu bóveda de Obsidian y que lea esas notas antes de abrir archivos puntuales.", "Prueba con una pregunta sobre tu proyecto y mira el uso con /context."]}], "faq": [{"q": "¿Cuesta algo?", "a": "Graphify es de código abierto y Obsidian es gratis, incluso para trabajo. Lo que se procesa con IA (documentos, PDF, imágenes) gasta de tu plan de Claude."}, {"q": "¿Sirve para un negocio y no solo para código?", "a": "Sí: Graphify también lee documentos y PDF, y en Obsidian puedes guardar cualquier nota."}], "usos": [{"e": "Mapa", "c": "azul", "t": "Tu proyecto en un grafo", "d": "Claude lo consulta en lugar de releer archivos."}, {"e": "Memoria", "c": "morado", "t": "Notas en Obsidian", "d": "Archivos de texto que Claude lee y escribe."}, {"e": "Negocio", "c": "verde", "t": "No solo código", "d": "También lee documentos y PDF."}, {"e": "Medir", "c": "naranja", "t": "Comprueba el ahorro", "d": "Haz una pregunta y mira el uso con /context."}], "fuentes": ["https://github.com/Graphify-Labs/graphify", "https://github.com/kepano/obsidian-skills", "https://obsidian.md/blog/free-for-work/", "https://code.claude.com/docs/en/memory", "https://graphify.com/blog/graphifyy-vs-graphify-on-pypi-which-package-to-install", "https://graphify.com/blog/graphify-on-windows-install-and-first-graph", "https://obsidian.md/es/blog/free-for-work/"], "ejemplo": {"titulo": "Ejemplo resuelto: un freelancer que dejó de explicarle el proyecto a Claude cada mañana", "negocio": "Ejemplo inventado: un desarrollador freelance en Montevideo que mantiene el sistema de turnos de una cadena de veterinarias. Es una aplicación en Python con varios módulos (agenda, clientes, recordatorios por mail) y una carpeta con los requisitos que le mandó el cliente en PDF.", "punto_de_partida": "Cada mañana abría una sesión nueva y Claude volvía a buscar dónde estaba la lógica de recordatorios. Además, cada tanto le preguntaba por qué una regla estaba hecha así y nadie se acordaba: la decisión había quedado en un chat viejo.", "pasos": ["Antes de instalar nada, eligió tres preguntas que hace seguido y las midió en sesiones nuevas con /context, con la checklist del kit.", "En la terminal corrió uv tool install graphifyy (con dos y) y graphify install. Comprobó con graphify --help que aparecieran comandos como install, query y path.", "En Claude Code corrió /graphify . sobre la carpeta del código, no sobre la de PDF, para que el mapa se armara localmente y sin gastar de su plan. Revisó graphify-out/GRAPH_REPORT.md para ver si los módulos tenían sentido.", "En la terminal, dentro del proyecto, corrió graphify claude install. Abrió una sesión nueva y con /hooks verificó que el hook estuviera cargado.", "Instaló Obsidian, creó una bóveda y adentro una carpeta para el proyecto con las tres notas del kit: proyecto, decisiones y aprendizajes.", "En Claude Code corrió /plugin marketplace add kepano/obsidian-skills y /plugin install obsidian@obsidian-skills. Sumó la skill memoria-en-obsidian del kit.", "Pegó en su CLAUDE.md el bloque del kit con la ruta de la bóveda. Cargó en decisiones.md, a mano, las tres decisiones que más le preguntaba el cliente.", "Repitió las tres preguntas en sesiones nuevas y completó la tabla de la checklist, comparando contexto usado, archivos abiertos y si la respuesta era correcta.", "Cuando hizo un cambio grande en el módulo de agenda, corrió /graphify . --update para que el mapa no quedara viejo."], "resultado": "Quedó un mapa del código que Claude consulta antes de buscar, tres notas en Obsidian con las decisiones y el estado del proyecto, y una skill que las actualiza al terminar cada tarea. Las comparaciones las tiene anotadas en su tabla, con sus preguntas reales."}, "si_falla": [{"sintoma": "Después de instalar, la terminal dice que no encuentra el comando graphify.", "solucion": "La carpeta de herramientas de uv no está en el PATH. Corre uv tool update-shell, cierra la terminal y abre una nueva. Si instalaste con pipx, el equivalente es pipx ensurepath. Confirma con graphify --help."}, {"sintoma": "graphify --help no muestra comandos como install, query o path.", "solucion": "Instalaste otro paquete. El de Graphify en PyPI es graphifyy, con dos y; el nombre con una sola y es de otro proyecto. Desinstala el que pusiste e instala graphifyy."}, {"sintoma": "Claude sigue buscando archivo por archivo aunque el mapa existe.", "solucion": "Falta conectar el mapa con Claude Code: en la terminal, dentro de la carpeta del proyecto, corre graphify claude install y abre una sesión nueva. Con /hooks puedes ver si el hook quedó cargado."}, {"sintoma": "Claude responde con funciones o archivos que ya no existen.", "solucion": "El mapa quedó viejo. Corre /graphify . --update, que vuelve a procesar solo lo que cambió. Si quieres que se actualice solo, graphify hook install lo regenera en cada commit y cambio de rama (necesita git)."}, {"sintoma": "Generar el mapa gastó mucho de tu plan.", "solucion": "El código se procesa localmente, pero los documentos, PDF e imágenes pasan por el modelo. Corre /graphify sobre la carpeta del código y deja para después, o para una corrida aparte, la carpeta de documentos."}], "kit": [{"archivo": "memoria-en-obsidian/SKILL.md", "que_es": "Skill que le enseña a Claude a leer lo justo de tus notas de Obsidian al empezar y a anotar decisiones y aprendizajes al terminar. Guárdala en .claude/skills/memoria-en-obsidian/ del proyecto, o comprimida en ZIP para subirla en claude.ai.", "contenido": "---\nname: memoria-en-obsidian\ndescription: 'Lee y actualiza la memoria del proyecto en notas de Obsidian (decisiones, aprendizajes, estado). Úsala al empezar una tarea con historia, con \"anótalo\" o \"qué habíamos decidido\".'\n---\n\n# Memoria en Obsidian\n\nLa memoria del proyecto vive en una bóveda de Obsidian, en tres notas. Lees lo justo al empezar y escribes poco y concreto al terminar.\n\n## Dónde está\n\nLa ruta de la bóveda y la carpeta del proyecto están en el CLAUDE.md, en la sección \"Memoria\". Si no están, pregunta la ruta antes de crear nada.\n\nNotas:\n- `decisiones.md`: qué se decidió, cuándo y por qué. Una entrada por decisión.\n- `aprendizajes.md`: cosas que costó descubrir (un error raro, una configuración, una regla del cliente).\n- `proyecto.md`: estado actual en pocas líneas: qué está hecho, qué sigue, qué está trabado.\n\n## Al empezar una tarea\n\n1. Lee `proyecto.md` entero (es corto).\n2. En `decisiones.md` y `aprendizajes.md`, busca por palabras de la tarea en vez de leer todo. Abre solo las entradas que coinciden.\n3. Si una decisión anotada contradice lo que te piden, avisa antes de seguir.\n\n## Al terminar una tarea\n\nAgrega solo lo que sirva en una sesión futura. Si no hay nada nuevo, no escribas.\n\nFormato de una decisión:\n\n```markdown\n## AAAA-MM-DD: [título corto]\n- Decisión: [qué se eligió]\n- Por qué: [una o dos líneas]\n- Descartado: [qué otra opción había, si la hubo]\n- Relacionado: [[proyecto]]\n```\n\nFormato de un aprendizaje:\n\n```markdown\n## AAAA-MM-DD: [título corto]\n- Qué pasó: [síntoma]\n- Qué lo resolvió: [la solución concreta]\n```\n\nEn `proyecto.md`, reemplaza el estado en vez de agregar historia. Que no pase de 30 líneas.\n\n## Reglas\n\n- Usa la sintaxis de Obsidian para enlaces entre notas: `[[nombre-de-la-nota]]`.\n- No guardes claves, contraseñas, tokens ni datos personales de clientes.\n- No copies código largo: anota en qué archivo está y por qué importa.\n- No borres entradas viejas. Si una decisión cambia, agrega una nueva que diga cuál reemplaza.\n- Cuando escribas, muestra al usuario en una línea qué agregaste y en qué nota.\n"}, {"archivo": "claude-md-graphify-obsidian.md", "que_es": "El bloque para pegar en tu CLAUDE.md que conecta el mapa de Graphify y la memoria de Obsidian, las tres notas iniciales y el orden de instalación.", "contenido": "# Bloque para tu CLAUDE.md: Graphify + Obsidian\n\nPega esto en el CLAUDE.md de la raíz del proyecto y completa los corchetes. Es corto a propósito: todo lo que está en CLAUDE.md se carga en cada sesión.\n\n---\n\n## Cómo entender este proyecto\n\n- El mapa del código lo arma Graphify en `graphify-out/`. Para preguntas de estructura (\"qué llama a qué\", \"dónde se usa X\"), consulta primero el grafo, por ejemplo con `/graphify query \"[PREGUNTA]\"`, antes de buscar archivo por archivo.\n- Si cambié bastante código desde el último mapa, avísame y propón actualizarlo con `/graphify . --update`.\n- Abre archivos puntuales recién cuando sepas cuáles necesitas.\n\n## Memoria\n\n- Bóveda de Obsidian: `[RUTA COMPLETA A LA BÓVEDA]`\n- Carpeta de este proyecto dentro de la bóveda: `[CARPETA]`\n- Al empezar: lee `proyecto.md`. Busca en `decisiones.md` y `aprendizajes.md` solo lo que tenga que ver con la tarea.\n- Al terminar: si hubo una decisión o un aprendizaje nuevo, agrégalo con la skill memoria-en-obsidian.\n\n---\n\n## Para crear las tres notas la primera vez\n\nCrea en `[RUTA]/[CARPETA]/` estos archivos:\n\n`proyecto.md`\n```markdown\n# [NOMBRE DEL PROYECTO]\n\n## Hecho\n-\n\n## Sigue\n-\n\n## Trabado\n-\n```\n\n`decisiones.md`\n```markdown\n# Decisiones\n\nUna entrada por decisión, la más nueva arriba. Ver [[proyecto]].\n```\n\n`aprendizajes.md`\n```markdown\n# Aprendizajes\n\nLo que costó descubrir y cómo se resolvió. Ver [[proyecto]].\n```\n\n## Orden de instalación\n\n1. En la terminal: `uv tool install graphifyy` (con dos y) y después `graphify install`.\n2. En Claude Code, dentro del proyecto: `/graphify .`\n3. En la terminal, en la carpeta del proyecto: `graphify claude install`.\n4. En Claude Code: `/plugin marketplace add kepano/obsidian-skills` y `/plugin install obsidian@obsidian-skills`.\n5. Sube la skill memoria-en-obsidian y pega este bloque en tu CLAUDE.md.\n6. Abre una sesión nueva para que tome todo.\n"}, {"archivo": "checklist-medir-ahorro-graphify.md", "que_es": "Checklist y tabla para medir con /context, en tu proyecto y con tus preguntas, si el mapa y la memoria te ahorran contexto sin empeorar las respuestas.", "contenido": "# Checklist: medir si Graphify y Obsidian te ahorran algo\n\nLas cifras que publican las herramientas son de sus pruebas. Esto es para medir en tu proyecto, con tus preguntas.\n\n## Antes de instalar nada\n\n- [ ] Elige 3 preguntas reales que le haces seguido a Claude sobre tu proyecto. Ejemplos de forma:\n  - \"¿Dónde se calcula [X] y qué funciones lo usan?\"\n  - \"Si cambio [Y], ¿qué se rompe?\"\n  - \"¿Por qué [Z] está hecho así?\"\n- [ ] Anótalas tal cual. Vas a usar exactamente las mismas palabras después.\n\n## Medición sin el mapa\n\nPara cada pregunta:\n- [ ] Abre una sesión nueva (o usa `/clear`).\n- [ ] Haz la pregunta y espera la respuesta completa.\n- [ ] Corre `/context` y anota cuánto contexto quedó usado.\n- [ ] Anota cuántos archivos abrió Claude (se ve en la conversación).\n- [ ] Anota si la respuesta fue correcta.\n\n## Instalación\n\n- [ ] Graphify instalado, mapa generado con `/graphify .` y `graphify claude install` corrido en la carpeta del proyecto.\n- [ ] Obsidian con las tres notas y el bloque de memoria en CLAUDE.md.\n- [ ] Sesión nueva para que cargue todo.\n\n## Medición con el mapa\n\n- [ ] Repite las mismas 3 preguntas, cada una en sesión nueva.\n- [ ] Anota lo mismo: contexto usado según `/context`, archivos abiertos y si la respuesta fue correcta.\n\n## Cómo leer el resultado\n\n| Pregunta | Contexto sin mapa | Contexto con mapa | Archivos sin | Archivos con | ¿Correcta sin? | ¿Correcta con? |\n|---|---|---|---|---|---|---|\n| 1 | | | | | | |\n| 2 | | | | | | |\n| 3 | | | | | | |\n\n- Si el contexto baja y las respuestas siguen siendo correctas, te sirve.\n- Si baja pero las respuestas empeoran, el mapa está viejo o la pregunta necesita leer código: actualízalo con `/graphify . --update` y prueba de nuevo.\n- Si no cambia nada, puede que tu proyecto sea chico y Claude ya lo recorra rápido. No hace falta sumar herramientas.\n- Ojo con los documentos: si le pasaste a Graphify una carpeta con muchos PDF o imágenes, generar el mapa gasta de tu plan. Cuéntalo en la cuenta.\n- En un plan Pro o Max, `/usage` muestra cuánto pesan skills, plugins y servidores MCP en tu uso reciente. Míralo después de unos días.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

<script>var GUIA = {"slug": "sistema-ia-para-gimnasios-y-entrenadores", "t": "Sistema con Claude para gimnasios y entrenadores", "d": "Consultas de nuevos socios, seguimiento de los que dejan de venir, planes armados en borrador y contenido: el sistema para un gimnasio o un entrenador personal.", "tema": "Sistemas listos por rubro", "min": 8, "fichaNombre": "Gimnasios", "ficha": [["Qué es", "Un asistente con los planes, horarios y la forma de entrenar del lugar para atender, retener y comunicar."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No reemplaza la evaluación del entrenador ni da indicaciones a personas con lesiones o problemas de salud."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Consultas de precio, horarios y clases de prueba.", "Socios que dejan de venir y nadie les escribe.", "Armar rutinas o planes semanales, uno por uno.", "Recordar cuotas vencidas sin sonar a reclamo.", "Contenido para redes todas las semanas.", "Organizar horarios de clases y cambios de profes."]}, {"h": "El sistema", "lista": ["Proyecto \"Gimnasio\": planes y precios, grilla de clases, reglas, la metodología del entrenador y plantillas de rutinas que él mismo armó.", "Skill de consultas y clase de prueba: responde y propone un horario para la primera clase.", "Skill de retención: con la lista de socios que no vinieron en dos semanas, arma un mensaje personal para cada uno.", "Skill de borrador de plan: arma un plan semanal a partir de las plantillas del entrenador y los datos que él carga. Siempre lo revisa el entrenador.", "Conectores: Google Drive para la planilla de asistencia y Google Calendar para la grilla de clases.", "Automatización: una tarea programada que los lunes lista quién no vino la semana anterior y deja los mensajes listos."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización, desde Organization settings → Plugins & skills. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Mensaje para socio que dejó de venir", "c": "Estos socios no vinieron en las últimas 2 semanas: [LISTA CON NOMBRE, PLAN Y ÚLTIMA VEZ QUE VINO].\nPara cada uno, escribe un mensaje de 2 o 3 líneas, cercano y sin culpa, que pregunte cómo está y ofrezca algo concreto (un horario nuevo, una clase distinta, una charla con el profe).\nNada de \"te extrañamos\" genérico ni descuentos, salvo que te lo indique."}, {"t": "Borrador de plan semanal", "c": "Datos que cargó el entrenador: objetivo [OBJETIVO], días disponibles [DÍAS], nivel [NIVEL], equipamiento [EQUIPO].\nUsa solo las plantillas y ejercicios del Proyecto.\nArma un borrador de plan semanal en tabla: día, bloque, ejercicio, series y repeticiones.\nArriba de todo pon: BORRADOR PARA REVISAR POR EL ENTRENADOR.\nSi el entrenador mencionó una lesión o un tema de salud, no armes el plan: di que eso lo evalúa él."}, {"t": "Respuesta a consulta nueva", "c": "Llegó esta consulta: [PEGA].\nResponde con planes, precios y horarios del Proyecto, en voseo y en 4 líneas como máximo.\nTermina ofreciendo dos horarios para una clase de prueba.\nSi pregunta algo de salud o de una lesión, di que lo charla con el entrenador en la primera clase."}]}, {"h": "Cómo instalarlo", "pasos": ["Pídele al entrenador sus plantillas de rutinas y su forma de trabajar por escrito. Sin eso, Claude arma planes genéricos.", "Arma el Proyecto \"Gimnasio\" con planes, grilla y reglas.", "Ordena la asistencia en una planilla de Google Drive (aunque sea simple: nombre, plan, última visita).", "Prueba las tres skills con casos reales y ajusta el tono con el dueño.", "Conecta Drive y Calendar y programa la tarea de los lunes.", "Acuerda quién manda los mensajes y quién aprueba los planes."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para gimnasios y entrenadores.\nUna de las cosas que más se repite es que la gente deja de venir y nadie se entera a tiempo. Lo que hago es dejarte un asistente que todos los lunes te dice quién no vino y te deja el mensaje listo, responde las consultas nuevas y te arma borradores de planes con tu forma de entrenar. Tú revisas y decides.\n¿Te muestro cómo quedaría con tu lista de esta semana?"}], "lista": ["Argumento central: \"Te enteras a tiempo de quién se está yendo y tus mensajes salen con tu estilo, sin que dependas de acordarte.\"", "Para entrenadores solos: el ahorro está en los planes y las consultas; para gimnasios, en retener socios."]}, {"h": "Cuidados del rubro", "lista": ["Salud: lesiones, enfermedades o embarazo los evalúa el profesional. Claude no arma planes para esos casos.", "Datos de socios: la planilla de asistencia tiene datos personales. Comparte solo lo necesario.", "Publicidad: nada de prometer kilos o resultados en tiempos determinados."], "aviso": "Claude no reemplaza al entrenador ni al médico. Todo plan lo revisa un profesional, y los datos de los socios se cuidan según las leyes de cada país."}], "faq": [{"q": "¿Claude puede armar rutinas sin el entrenador?", "a": "Puede, pero no deberías venderlo así. El valor está en que use la metodología del entrenador y que él apruebe cada plan."}, {"q": "¿Y si usan un sistema de gestión de socios?", "a": "Exporta la asistencia a una planilla. Antes de prometer una conexión directa, fíjate si ese sistema tiene conector oficial para Claude."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en un gimnasio de barrio", "negocio": "Ejemplo inventado: un gimnasio de musculación y funcional en el centro de Rosario, con el dueño (profesor de educación física), tres profes y una recepcionista. Las consultas entran por Instagram y WhatsApp, y la asistencia se registra en un sistema de gestión que exporta a planilla.", "punto_de_partida": "Nadie sabe quién dejó de venir hasta que no renueva la cuota. Las rutinas se arman a mano para cada socio nuevo y las consultas de precio se responden cuando la recepcionista tiene un rato.", "pasos": ["En la demo, le pidió al dueño la exportación de asistencia de la semana. Con el prompt de socio que dejó de venir armó los mensajes delante de él, cada uno con una propuesta concreta. El dueño corrigió dos frases que no sonaban a él, y eso fue lo que terminó de convencerlo.", "Le pidió al dueño por escrito su forma de entrenar, las plantillas de rutina por objetivo, la grilla de clases y los precios con fecha. Sin las plantillas no avanzó con la skill de planes.", "En Settings → Capabilities prendió Code execution and file creation. Creó el Proyecto \"Gimnasio\" en la cuenta del negocio y pegó las instrucciones del kit, completando los corchetes con el dueño (sobre todo la regla de salud y los horarios de clase de prueba).", "Armó la planilla de asistencia en Google Drive con las columnas del kit. Acordaron que la recepcionista pega la exportación del sistema cada viernes y actualiza ultima_visita.", "Probó las tres skills una semana con consultas y socios reales. Un profe revisó cada borrador de plan; cuando apareció una consulta que mencionaba una operación de rodilla, verificó que Claude no armara el plan y lo derivara al entrenador.", "Armó la carpeta retencion-de-socios con el SKILL.md del kit, la comprimió en ZIP y la subió en Customize → Skills. Hizo lo mismo con las skills de consultas y de borrador de plan.", "Conectó Google Drive y Google Calendar con la cuenta del gimnasio y probó en un chat: \"lee la planilla de asistencia y dime quién no vino en dos semanas\".", "Creó la tarea de los lunes con el archivo del kit, pidiendo aprobación antes de actuar. El primer lunes la recepcionista copió los mensajes a WhatsApp, corrigió los que hizo falta y completó la columna contactado.", "En la reunión de cierre dejaron por escrito quién manda los mensajes (la recepcionista), quién aprueba los planes (el profe de cada socio) y qué nunca se responde por mensaje (temas de salud)."], "resultado": "Quedó un Proyecto con los planes, la grilla y la metodología del dueño, tres skills para consultas, retención y planes en borrador, y una tarea que cada lunes deja la lista de ausentes con mensajes para revisar. Los mensajes los manda una persona y ningún plan llega a un socio sin que lo apruebe un profe."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Al subir la skill aparece un error de formato o de archivo faltante.", "solucion": "Revisa tres cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos), que la carpeta se llame igual que el name del SKILL.md y que adentro esté el archivo SKILL.md. Evita tildes, espacios y signos raros en el name y en la description."}, {"sintoma": "La tarea del lunes lista a socios que sí vinieron, o a gente dada de baja.", "solucion": "Casi siempre es la planilla: ultima_visita no se actualizó antes del lunes o falta la columna estado. Revisa que la exportación se pegue antes de la corrida y que las fechas estén en un mismo formato (AAAA-MM-DD). Puedes correr la tarea a mano desde Scheduled después de corregir la planilla."}, {"sintoma": "Claude arma un plan aunque el entrenador mencionó una molestia o una lesión.", "solucion": "Revisa que la regla de salud esté en las instrucciones del Proyecto y en el prompt de plan, con palabras concretas (lesión, dolor, operación, embarazo, medicación). Pruébala con un caso de prueba cada vez que cambies las instrucciones, y mantén la regla de que ningún plan se entrega sin revisión del profe."}, {"sintoma": "Al conectar Gmail, Drive o Calendar aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "La cuenta es de Google Workspace y el administrador tiene que marcar a Claude como app de confianza en admin.google.com (Security → Access and data control → API controls → Manage third-party app access, buscar Claude y ponerla en Trusted). Después espera unos 15 minutos y vuelve a conectar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores de Google en Organization settings → Connectors."}], "kit": [{"archivo": "retencion-de-socios/SKILL.md", "que_es": "Skill que arma mensajes personales para socios que dejaron de venir, con una propuesta concreta para cada uno y sin culpa ni descuentos inventados. Guárdala en una carpeta retencion-de-socios, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: retencion-de-socios\ndescription: 'Arma mensajes personales para socios que dejaron de venir al gimnasio, desde la planilla de asistencia, con el tono del lugar y sin culpa ni descuentos inventados. Úsala con socios ausentes.'\n---\n\n# Retención de socios\n\nConviertes una lista de socios que no vienen en mensajes cortos y personales para que alguien del gimnasio los revise y los mande. Nunca los mandas tú.\n\n## Qué te pasan\n\n- Una lista o la planilla de asistencia con, como mínimo: nombre o alias, plan, última visita.\n- A veces: clase o horario que hacía, profe con el que entrenaba, una nota del entrenador.\n\nSi te pasan la planilla completa, filtra tú: socios activos (no dados de baja) cuya última visita sea de hace 14 días o más, salvo que te indiquen otro plazo.\n\n## Cómo decides qué ofrecer\n\nPara cada socio elige UNA propuesta concreta, en este orden de preferencia:\n\n1. Si hay una nota del entrenador, úsala (por ejemplo, \"le costaba el horario de la mañana\").\n2. Si hacía una clase que cambió de horario o de profe según la grilla del Proyecto, cuéntaselo.\n3. Si no hay datos, ofrece una charla corta con el profe para reajustar la rutina, o una clase distinta de la grilla.\n\nNo ofrezcas descuentos, pases gratis ni congelamiento de cuota, salvo que el dueño lo haya indicado en las instrucciones del Proyecto o en el pedido.\n\n## Qué entregas\n\nUna tabla con estas columnas: nombre o alias, última visita, propuesta, mensaje.\n\nCada mensaje:\n- 2 o 3 líneas, en voseo, con el nombre de pila.\n- Pregunta cómo está, sin reprochar la ausencia.\n- Cierra con la propuesta concreta y una pregunta fácil de contestar (\"¿te sirve el martes a las 19?\").\n- Firma con el nombre de quien lo manda si está en el Proyecto.\n\n## Reglas\n\n- Nada de \"te extrañamos\", \"¿te olvidaste de nosotros?\" ni frases que suenen a reclamo o a cobranza.\n- No menciones la cuota ni deudas. Eso es otro mensaje y lo decide el dueño.\n- No hables de peso, cuerpo ni resultados.\n- Si una nota menciona lesión, enfermedad, embarazo o algo de salud, no armes el mensaje: pon \"LO CONTACTA EL ENTRENADOR\" en la columna propuesta.\n- No inventes clases ni horarios: solo los de la grilla del Proyecto.\n\n## Al final\n\nCierra con: \"Revisa cada mensaje antes de mandarlo. Los marcados LO CONTACTA EL ENTRENADOR van aparte.\"\n"}, {"archivo": "proyecto-gimnasio-instrucciones-y-planilla.md", "que_es": "El texto para pegar en las instrucciones del Proyecto \"Gimnasio\" con la regla de salud, la estructura de la planilla de asistencia y la lista de archivos para subir.", "contenido": "# Proyecto \"Gimnasio\": instrucciones y planillas\n\nEste archivo tiene tres partes: el texto para pegar en las instrucciones del Proyecto, la estructura de la planilla de asistencia y la lista de archivos para subir.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DEL GIMNASIO O DEL ENTRENADOR], en [CIUDAD]. Trabajamos [TIPO: musculación, funcional, clases grupales, entrenamiento personalizado, etc.].\n\nPara qué estás:\n- Preparar respuestas a consultas de personas nuevas y proponer una clase de prueba.\n- Preparar mensajes para socios que dejaron de venir.\n- Armar borradores de planes semanales con las plantillas del entrenador.\n- Ayudar con textos para redes y avisos de cambios de horario.\n\nReglas que no se rompen:\n1. Precios, planes y horarios salen solo de los archivos de este Proyecto. Si algo no está, di \"lo confirmo\" y márcalo como PENDIENTE.\n2. Todo lo que escribes es un borrador. Lo revisa y lo manda una persona del equipo.\n3. Salud: si alguien menciona una lesión, una enfermedad, un embarazo, medicación o una operación, no des indicaciones ni armes planes. Responde que eso lo evalúa [NOMBRE DEL ENTRENADOR] en persona, y en planes pon \"LO EVALÚA EL ENTRENADOR\".\n4. Planes de entrenamiento: usa solo las plantillas y los ejercicios de este Proyecto. Arriba de cada plan pon \"BORRADOR PARA REVISAR POR EL ENTRENADOR\".\n5. No prometas kilos, medidas ni resultados en un tiempo. No hables del cuerpo de nadie.\n6. No des consejos de dieta ni suplementos. [SI HAY NUTRICIONISTA: deriva a NOMBRE.]\n7. Clases de prueba: ofrece dos horarios de la grilla. Días y franjas para clases de prueba: [DÍAS Y FRANJAS].\n8. Tono: [EJEMPLO: cercano, con voseo, motivador sin exagerar, sin signos de exclamación seguidos]. Firma como [NOMBRE].\n\nSi te piden algo fuera de esta lista, hazlo solo si no rompe ninguna regla y avisa que está fuera de lo habitual.\n\n## 2. Planilla de asistencia (Google Sheets en Drive)\n\nUna fila por socio. Si el sistema de gestión exporta la asistencia, pega la exportación en otra pestaña y deja esta como resumen.\n\n| Columna | Qué va | Ejemplo de formato |\n|---|---|---|\n| socio | Nombre de pila y la inicial del apellido, o un código | [NOMBRE A.] |\n| plan | El plan que paga | [PLAN] |\n| estado | activo, baja, congelado | activo |\n| ultima_visita | Fecha | [AAAA-MM-DD] |\n| clase_habitual | Clase u horario que hacía | [CLASE Y HORARIO] |\n| profe | Con quién entrena | [NOMBRE] |\n| nota_entrenador | Algo útil para el mensaje, sin datos de salud | [TEXTO CORTO] |\n| contactado | Fecha del último mensaje de retención | [AAAA-MM-DD] |\n\nReglas de la planilla:\n- Nada de teléfonos, documentos, fotos ni datos de salud. Los teléfonos viven en el sistema o en el celular del gimnasio, no en Claude.\n- Quien registra la asistencia actualiza ultima_visita al menos una vez por semana, antes del lunes. Si no, la lista sale mal.\n- Cuando se manda un mensaje, se completa contactado. Así no le escribes dos veces seguidas a la misma persona.\n\n## 3. Archivos para subir al Proyecto\n\n- Planes y precios vigentes (un documento, con fecha).\n- Grilla de clases con profes y horarios.\n- La forma de entrenar del lugar, escrita por el entrenador (una página alcanza).\n- Plantillas de rutinas del entrenador, una por objetivo y nivel.\n- Lista de ejercicios que usan, con el nombre que les dicen en el gimnasio.\n- Preguntas frecuentes con sus respuestas.\n"}, {"archivo": "tarea-programada-socios-ausentes.md", "que_es": "La tarea de los lunes lista para pegar: checklist previa, configuración sugerida y el prompt que deja los mensajes listos sin mandar nada.", "contenido": "# Tarea programada: socios que no vinieron la semana pasada\n\nLa tarea deja la lista y los mensajes listos para revisar. No manda nada: los mensajes a socios suelen ir por WhatsApp y los manda una persona.\n\n## Antes de crearla\n\n- [ ] La cuenta de Claude es del gimnasio y tiene un plan pago (las tareas programadas están solo en planes pagos).\n- [ ] Google Drive está conectado con la cuenta del gimnasio y en un chat normal Claude puede leer la planilla de asistencia.\n- [ ] La skill retencion-de-socios está subida y prendida.\n- [ ] Probaste el prompt de abajo a mano en un chat con la planilla real.\n\n## Cómo crearla\n\nEn Cowork: Scheduled en la barra lateral, New task. Con \"Create with Claude\" pégale este archivo y pídele \"todos los lunes a las 8\". Con \"Set up manually\" completa nombre, prompt, aprobación y frecuencia semanal (en inglés figura como weekly). Si tu cuenta tiene la experiencia nueva de Claude, pídela en una conversación y confirma con Schedule.\n\nConfiguración sugerida:\n- Nombre: Socios ausentes de la semana\n- Frecuencia: semanal, lunes temprano.\n- Aprobación: la opción que pide permiso antes de actuar. La primera semana, revisa la corrida en la página Scheduled.\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de retención de [NOMBRE DEL GIMNASIO].\n\n1. Abre en Google Drive la planilla \"[NOMBRE DE LA PLANILLA DE ASISTENCIA]\".\n2. Toma los socios con estado \"activo\" cuya ultima_visita sea de hace 14 días o más, y que no tengan fecha en contactado de los últimos 14 días.\n3. Usa la skill retencion-de-socios para armar un mensaje para cada uno.\n4. Si son más de [N], prioriza a los que tenían clase_habitual (venían seguido) y deja el resto en una lista aparte.\n\nReglas:\n- No envíes nada. No modifiques la planilla.\n- No uses datos que no estén en la planilla o en la grilla de clases.\n- Si una nota menciona salud o lesión, ese socio va a la lista \"Lo contacta el entrenador\", sin mensaje.\n\nAl final, déjame tres listas: \"Mensajes listos\" (tabla de la skill), \"Lo contacta el entrenador\" y \"Para la semana que viene\".\n\n## Después de cada lunes\n\n- [ ] Quien manda los mensajes completa contactado en la planilla.\n- [ ] Anota qué mensajes se corrigieron antes de mandarlos. A las dos semanas, ajusta la skill con eso.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

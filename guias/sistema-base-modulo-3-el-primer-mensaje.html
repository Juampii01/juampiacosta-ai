<script>var GUIA = {"slug": "sistema-base-modulo-3-el-primer-mensaje", "t": "Módulo 3 · El primer mensaje: pedir 15 minutos sin hacer spam", "d": "Mensajes para Instagram, WhatsApp, mail y en persona que ofrecen un diagnóstico gratis de 15 minutos. Con reglas para no molestar y no poner en riesgo tu cuenta.", "tema": "El sistema para vender IA", "min": 9, "secciones": [{"h": "Qué ofrecés en el primer mensaje", "p": ["En el primer mensaje no vendés el paquete. Ofrecés algo chico, concreto y sin riesgo: un diagnóstico de 15 minutos donde mirás cómo trabajan y les decís qué tareas podría cubrir Claude. Si no hay nada para hacer, se lo decís.", "El mensaje tiene cuatro partes: quién sos en una línea, qué viste de su negocio (el dato de la columna \"Qué viste\" del Módulo 2), qué ofrecés y una pregunta fácil de responder."]}, {"h": "Las reglas antes de mandar nada", "lista": ["Uno por uno: cada mensaje lo escribís o lo revisás para ese negocio. Nada de copiar y pegar el mismo texto a cincuenta personas.", "A mano: no uses programas que manden mensajes solos desde tu cuenta personal o de negocio.", "Pocos por día: es mejor mandar diez buenos que cien iguales. También te deja tiempo para responder.", "Un seguimiento y listo: si no responde, mandás un solo recordatorio que aporte algo. Si sigue sin responder, lo dejás. Si te dice que no, no insistís.", "Honestidad: decí que vas a usar IA y qué hace. No te presentes como cliente ni inventes que alguien te recomendó.", "Leé las reglas de cada plataforma: Instagram, WhatsApp y los servicios de mail tienen normas de uso y pueden limitar cuentas. Revisalas antes de empezar."], "aviso": "Si en algún momento querés mandar mensajes automáticos por WhatsApp desde la plataforma oficial para empresas, Meta pide que la persona haya aceptado antes recibir mensajes de tu negocio (opt-in), con el nombre de tu negocio claro. Para contactar a alguien que no te conoce, usá mensajes escritos a mano."}, {"h": "Los mensajes, por canal", "lista": ["Instagram: \"Hola [NOMBRE], soy [TU NOMBRE], de [CIUDAD]. Vi que en [NEGOCIO] responden muchas consultas de [TEMA] en los comentarios. Estoy ayudando a negocios de [RUBRO] a armar un asistente con Claude para esas tareas. ¿Te sirve una charla de 15 minutos donde te digo qué partes se podrían cubrir y cuáles no? Es gratis y sin compromiso.\"", "WhatsApp (solo si el número está publicado para consultas): \"Hola, ¿hablo con [NEGOCIO]? Soy [TU NOMBRE]. Les escribo porque trabajo con negocios de [RUBRO] armando asistentes de IA para presupuestos y respuestas a clientes. ¿Con quién puedo hablar para ofrecerles un diagnóstico gratis de 15 minutos?\"", "Mail: asunto \"15 minutos sobre [TAREA] en [NEGOCIO]\". Cuerpo: una línea de quién sos, una de qué viste, una de qué ofrecés, la pregunta y tu nombre con un dato de contacto. Nada de imágenes ni archivos adjuntos.", "En persona: andá en un horario tranquilo, pedí hablar con quien decide y decí lo mismo en voz alta. Llevá un papel con tu nombre, tu contacto y la frase del Módulo 1. Si están ocupados, pedí un día y una hora para volver."]}, {"h": "Escribí cada mensaje con Claude", "p": ["Usá Claude para ajustar el mensaje a cada negocio, no para producir cien iguales. Pegá los datos de una fila de tu planilla y revisá lo que sale antes de mandarlo."], "prompts": [{"t": "Primer mensaje para un negocio", "c": "Ayudame a escribir el primer mensaje para un negocio.\nYo: [TU NOMBRE], [CIUDAD]. Ofrezco instalar Claude en negocios de [RUBRO] (conocimiento del negocio, skills de presupuestos y respuestas, conectores de mail y calendario).\nNegocio: [NOMBRE DEL NEGOCIO].\nCanal: [INSTAGRAM / WHATSAPP / MAIL].\nLo que vi de su negocio: [DATO CONCRETO].\n\nReglas:\n- Máximo 5 líneas (en mail, asunto + 5 líneas).\n- Ofrecé un diagnóstico gratis de 15 minutos y terminá con una pregunta fácil de responder.\n- Nada de promesas de ahorro, de ventas ni de \"resultados\".\n- Tono cercano y respetuoso, en voseo, sin exagerar.\n- No inventes datos del negocio que no te di.\nDame dos versiones: una más directa y una más cálida."}, {"t": "Un solo seguimiento", "c": "Le escribí a [NEGOCIO] por [CANAL] hace [DÍAS] días ofreciendo un diagnóstico gratis de 15 minutos y no respondió. Mi mensaje fue: [PEGÁ TU MENSAJE].\nEscribime un único seguimiento de máximo 3 líneas que aporte algo nuevo (por ejemplo, un ejemplo concreto de una tarea de su rubro que Claude podría ayudar a hacer) y que deje claro que si no le interesa, no le vuelvo a escribir."}]}, {"h": "Llevá la cuenta en la planilla", "pasos": ["Cada vez que mandás un mensaje, actualizá Estado (\"contactado\") y Fecha del último contacto.", "Si responde, cambiá a \"respondió\" y anotá qué dijo en Notas.", "Si acepta, agendá la llamada y cambiá a \"diagnóstico agendado\".", "Si dice que no o no responde al seguimiento, marcá \"cerrado\" y no le vuelvas a escribir por ese tema.", "Una vez por semana, mirá cuántos contactaste, cuántos respondieron y cuántos aceptaron. Si casi nadie responde, cambiá el mensaje antes de mandar más."], "p": ["Para la secuencia completa de seguimientos y cuándo parar, mirá \"Seguimiento de prospectos sin ser pesado\". Si te escriben a vos por Instagram, \"Responder DMs y calificar prospectos con Claude\" te ayuda a ordenarlos."]}], "faq": [{"q": "¿Por qué gratis?", "a": "Porque 15 minutos es poco para vos y baja mucho la barrera para el dueño. Lo que no es gratis es la instalación: dejalo claro desde el principio."}, {"q": "¿Puedo usar un programa para mandar los mensajes?", "a": "No para contactar a gente que no te conoce. Además del riesgo para tu cuenta, un mensaje masivo se nota y te cierra puertas en un rubro donde todos se conocen."}, {"q": "¿Qué canal funciona mejor?", "a": "El que el negocio usa para hablar con sus clientes. Si responden rápido en Instagram, escribiles ahí. Si son más formales, mail. Si están a la vuelta, andá en persona."}], "fuentes": ["https://developers.facebook.com/documentation/business-messaging/whatsapp/getting-opt-in"], "cat": "sistema-base", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-base-modulo-3-el-primer-mensaje", "t": "Módulo 3 · El primer mensaje: pedir 15 minutos sin hacer spam", "d": "Mensajes para Instagram, WhatsApp, mail y en persona que ofrecen un diagnóstico gratis de 15 minutos. Con reglas para no molestar y no poner en riesgo tu cuenta.", "tema": "El sistema para vender IA", "min": 9, "secciones": [{"h": "Qué ofrecés en el primer mensaje", "p": ["En el primer mensaje no vendés el paquete. Ofrecés algo chico, concreto y sin riesgo: un diagnóstico de 15 minutos donde mirás cómo trabajan y les decís qué tareas podría cubrir Claude. Si no hay nada para hacer, se lo decís.", "El mensaje tiene cuatro partes: quién sos en una línea, qué viste de su negocio (el dato de la columna \"Qué viste\" del Módulo 2), qué ofrecés y una pregunta fácil de responder."]}, {"h": "Las reglas antes de mandar nada", "lista": ["Uno por uno: cada mensaje lo escribís o lo revisás para ese negocio. Nada de copiar y pegar el mismo texto a cincuenta personas.", "A mano: no uses programas que manden mensajes solos desde tu cuenta personal o de negocio.", "Pocos por día: es mejor mandar diez buenos que cien iguales. También te deja tiempo para responder.", "Un seguimiento y listo: si no responde, mandás un solo recordatorio que aporte algo. Si sigue sin responder, lo dejás. Si te dice que no, no insistís.", "Honestidad: decí que vas a usar IA y qué hace. No te presentes como cliente ni inventes que alguien te recomendó.", "Leé las reglas de cada plataforma: Instagram, WhatsApp y los servicios de mail tienen normas de uso y pueden limitar cuentas. Revisalas antes de empezar."], "aviso": "La política de mensajería de WhatsApp para empresas no se aplica solo a la plataforma para mensajes automáticos: también cubre la app WhatsApp Business. Pide que la persona te haya dado su número y haya aceptado recibir mensajes de tu negocio (opt-in), con el nombre de tu negocio claro, y que respetes cualquier pedido de dejar de escribirle. Si te bloquean o te reportan, WhatsApp puede limitar cuántos mensajes mandás o cerrar la cuenta. Por eso: escribile solo al número que el negocio publicó para consultas, un solo mensaje escrito a mano, y si te dice que no, no insistas. Nunca uses envíos automáticos para contactar a alguien que no te conoce."}, {"h": "Los mensajes, por canal", "lista": ["Instagram: \"Hola [NOMBRE], soy [TU NOMBRE], de [CIUDAD]. Vi que en [NEGOCIO] responden muchas consultas de [TEMA] en los comentarios. Estoy ayudando a negocios de [RUBRO] a armar un asistente con Claude para esas tareas. ¿Te sirve una charla de 15 minutos donde te digo qué partes se podrían cubrir y cuáles no? Es gratis y sin compromiso.\"", "WhatsApp (solo si el número está publicado para consultas): \"Hola, ¿hablo con [NEGOCIO]? Soy [TU NOMBRE]. Les escribo porque trabajo con negocios de [RUBRO] armando asistentes de IA para presupuestos y respuestas a clientes. ¿Con quién puedo hablar para ofrecerles un diagnóstico gratis de 15 minutos?\"", "Mail: asunto \"15 minutos sobre [TAREA] en [NEGOCIO]\". Cuerpo: una línea de quién sos, una de qué viste, una de qué ofrecés, la pregunta y tu nombre con un dato de contacto. Nada de imágenes ni archivos adjuntos.", "En persona: andá en un horario tranquilo, pedí hablar con quien decide y decí lo mismo en voz alta. Llevá un papel con tu nombre, tu contacto y la frase del Módulo 1. Si están ocupados, pedí un día y una hora para volver."]}, {"h": "Escribí cada mensaje con Claude", "p": ["Usá Claude para ajustar el mensaje a cada negocio, no para producir cien iguales. Pegá los datos de una fila de tu planilla y revisá lo que sale antes de mandarlo."], "prompts": [{"t": "Primer mensaje para un negocio", "c": "Ayudame a escribir el primer mensaje para un negocio.\nYo: [TU NOMBRE], [CIUDAD]. Ofrezco instalar Claude en negocios de [RUBRO] (conocimiento del negocio, skills de presupuestos y respuestas, conectores de mail y calendario).\nNegocio: [NOMBRE DEL NEGOCIO].\nCanal: [INSTAGRAM / WHATSAPP / MAIL].\nLo que vi de su negocio: [DATO CONCRETO].\n\nReglas:\n- Máximo 5 líneas (en mail, asunto + 5 líneas).\n- Ofrecé un diagnóstico gratis de 15 minutos y terminá con una pregunta fácil de responder.\n- Nada de promesas de ahorro, de ventas ni de \"resultados\".\n- Tono cercano y respetuoso, en voseo, sin exagerar.\n- No inventes datos del negocio que no te di.\nDame dos versiones: una más directa y una más cálida."}, {"t": "Un solo seguimiento", "c": "Le escribí a [NEGOCIO] por [CANAL] hace [DÍAS] días ofreciendo un diagnóstico gratis de 15 minutos y no respondió. Mi mensaje fue: [PEGÁ TU MENSAJE].\nEscribime un único seguimiento de máximo 3 líneas que aporte algo nuevo (por ejemplo, un ejemplo concreto de una tarea de su rubro que Claude podría ayudar a hacer) y que deje claro que si no le interesa, no le vuelvo a escribir."}]}, {"h": "Llevá la cuenta en la planilla", "pasos": ["Cada vez que mandás un mensaje, actualizá Estado (\"contactado\") y Fecha del último contacto.", "Si responde, cambiá a \"respondió\" y anotá qué dijo en Notas.", "Si acepta, agendá la llamada y cambiá a \"diagnóstico agendado\".", "Si dice que no o no responde al seguimiento, marcá \"cerrado\" y no le vuelvas a escribir por ese tema.", "Una vez por semana, mirá cuántos contactaste, cuántos respondieron y cuántos aceptaron. Si casi nadie responde, cambiá el mensaje antes de mandar más."], "p": ["Para la secuencia completa de seguimientos y cuándo parar, mirá \"Seguimiento de prospectos sin ser pesado\". Si te escriben a vos por Instagram, \"Responder DMs y calificar prospectos con Claude\" te ayuda a ordenarlos."]}], "faq": [{"q": "¿Por qué gratis?", "a": "Porque 15 minutos es poco para vos y baja mucho la barrera para el dueño. Lo que no es gratis es la instalación: dejalo claro desde el principio."}, {"q": "¿Puedo usar un programa para mandar los mensajes?", "a": "No para contactar a gente que no te conoce. Además del riesgo para tu cuenta, un mensaje masivo se nota y te cierra puertas en un rubro donde todos se conocen."}, {"q": "¿Qué canal funciona mejor?", "a": "El que el negocio usa para hablar con sus clientes. Si responden rápido en Instagram, escribiles ahí. Si son más formales, mail. Si están a la vuelta, andá en persona."}], "fuentes": ["https://developers.facebook.com/documentation/business-messaging/whatsapp/getting-opt-in", "https://whatsappbusiness.com/policy/"], "ejemplo": {"titulo": "Ejemplo resuelto: el primer mensaje a un corralón de materiales", "negocio": "Ejemplo inventado: Martín, freelancer de Pergamino (provincia de Buenos Aires) que instala Claude en negocios de la zona, le escribe a un corralón de materiales atendido por el dueño, su hija en el mostrador y cuatro empleados.", "punto_de_partida": "En su planilla del Módulo 2 tiene 50 negocios. En la fila del corralón, en la columna \"Qué viste\", anotó que en los comentarios de Instagram responden pedidos de presupuesto de a uno con \"te paso por privado\".", "pasos": ["Eligió Instagram porque el corralón responde ahí todos los días. Antes de escribir, abrió el perfil y confirmó que el dato seguía vigente: en los últimos posteos había varios \"precio?\" y \"te paso por privado\".", "Pegó en un chat la fila de la planilla con el prompt \"Primer mensaje para un negocio\" de la guía. En \"Lo que vi\" puso: \"en los comentarios piden presupuesto de materiales y lo pasan por privado, de a uno\".", "De las dos versiones eligió la directa y la ajustó a su forma de hablar: \"Hola, soy Martín, de Pergamino. Vi que en los comentarios les piden presupuestos de materiales y los pasan por privado, de a uno. Armo asistentes con Claude para corralones y ferreterías, para preparar esos presupuestos más rápido. ¿Te sirve una charla de 15 minutos donde te digo qué se podría cubrir y qué no? Es gratis\".", "Lo mandó a mano desde su cuenta. Ese día mandó otros siete mensajes, cada uno con su dato, y no más, para poder responder a tiempo.", "En la planilla puso Estado \"contactado\" y la fecha. Como no hubo respuesta en cinco días, pidió el único seguimiento con el segundo prompt, sumando un ejemplo de su rubro: \"armar el borrador de un presupuesto de obra con la lista de precios del corralón, para que alguien lo revise y lo mande\".", "Al día siguiente respondió la hija: \"¿Cuánto sale?\". Le contestó con la plantilla del kit: la charla es gratis y el precio de la instalación sale de la propuesta. Propuso dos horarios y ella eligió el jueves a la tarde.", "Cambió el estado a \"diagnóstico agendado\" y anotó en Notas lo que preguntó, para llevarlo a la llamada del Módulo 4.", "El viernes hizo la revisión semanal del kit: de los ocho negocios, el corralón fue el único con un dato que se veía en los comentarios. Para la semana siguiente decidió buscar ese tipo de dato en cada perfil antes de escribir."], "resultado": "Quedó un diagnóstico agendado con un mensaje y un seguimiento, los dos escritos para ese negocio. La planilla muestra quién respondió, quién no y qué dijo cada uno, y Martín tiene un cambio concreto para probar en su próximo mensaje."}, "si_falla": [{"sintoma": "Mandás mensajes toda la semana y casi nadie responde.", "solucion": "Antes de mandar más, mirá tres mensajes sin respuesta. Lo más común es que el dato no sea concreto (\"vi tu perfil\"), que el mensaje sea largo o que la pregunta final cueste responderla. Cambiá una sola cosa por semana y anotala, así sabés qué funcionó. El prompt de revisión del kit te ayuda a comparar."}, {"sintoma": "En Instagram el negocio no ve tu mensaje porque no te sigue.", "solucion": "Los mensajes de cuentas que el negocio no sigue suelen quedar en solicitudes de mensajes, y muchos dueños no las revisan. No mandes un segundo mensaje por ahí: probá el seguimiento por otro canal que el negocio use (el mail de la web o una visita en persona) y mencioná que les escribiste por Instagram."}, {"sintoma": "Instagram o WhatsApp te muestran un aviso de que limitaron alguna acción de tu cuenta.", "solucion": "Pará los envíos ese día. Revisá que no estés mandando el mismo texto a muchas personas ni usando herramientas que manden mensajes por vos. Bajá la cantidad diaria, escribí cada mensaje para su negocio y leé las normas de uso de la plataforma. En WhatsApp, los bloqueos y reportes pueden hacer que te limiten los envíos."}, {"sintoma": "Te responden \"mandame info\" y, cuando mandás un PDF, no contestan más.", "solucion": "El primer mensaje vende la charla, no el paquete. Respondé en dos o tres líneas qué van a mirar en los 15 minutos y proponé dos horarios concretos. El PDF y el precio vienen después, en la propuesta del Módulo 5."}, {"sintoma": "Claude te devuelve mensajes genéricos que podrían ir a cualquier negocio.", "solucion": "Casi siempre falta el dato concreto o está escrito en general. Pasale algo que se pueda ver: un comentario, una reseña, cómo responden en su perfil. La skill del kit frena y te lo pide si no se lo das."}], "kit": [{"archivo": "primer-mensaje-prospecto/SKILL.md", "que_es": "Skill que escribe el primer mensaje, el único seguimiento y las respuestas a \"mandame info\", \"cuánto sale\" y \"no me interesa\", uno por uno y sin promesas. Guardala en una carpeta llamada primer-mensaje-prospecto, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: primer-mensaje-prospecto\ndescription: 'Escribe el primer mensaje para ofrecer un diagnóstico gratis de 15 minutos desde una fila de prospectos y el canal elegido. Usala al pedir primer mensaje, seguimiento o respuesta a \"mandame info\".'\n---\n\n# Primer mensaje a un prospecto\n\nAyudás a una persona que instala Claude en negocios a escribir UN mensaje para UN negocio. No producís mensajes en serie.\n\n## Qué te tienen que pasar\n\n- Quién escribe: nombre, ciudad y la frase de una línea de lo que ofrece.\n- El negocio: nombre, rubro, ciudad y, si se sabe, el nombre de quien decide.\n- El canal: Instagram, WhatsApp, mail o en persona.\n- Lo que vio de su negocio: un dato concreto y comprobable (por ejemplo, \"responden presupuestos de a uno en los comentarios\").\n\nSi falta el dato concreto, no lo inventes. Pedilo con una sola pregunta y frená ahí. Sin ese dato el mensaje es genérico y no sirve.\n\nSi te pegan varias filas juntas o te piden \"el mismo mensaje para todos\", explicá en una línea que el sistema es uno por uno y pedí que elija una fila.\n\n## Cómo se arma el mensaje\n\nCuatro partes, en este orden:\n1. Quién sos, en una línea.\n2. Qué viste de su negocio (el dato concreto).\n3. Qué ofrecés: una charla de 15 minutos, gratis, donde le decís qué tareas podría cubrir Claude y cuáles no.\n4. Una pregunta fácil de responder con sí o no, o con un día.\n\n## Reglas por canal\n\n- Instagram: hasta 5 líneas. Sin links ni archivos. Nada de \"te escribo porque vi tu perfil\" sin el dato.\n- WhatsApp: solo si el número está publicado para consultas. Hasta 4 líneas. Si no sabés quién decide, preguntá con quién hablar.\n- Mail: asunto con la tarea y el nombre del negocio, hasta 5 líneas de cuerpo, firma con nombre y un dato de contacto. Sin imágenes ni adjuntos.\n- En persona: un guion de 3 o 4 frases para decir en voz alta y el texto de un papel con nombre, contacto y la frase de lo que ofrece.\n\n## Lo que nunca escribís\n\n- Promesas de ahorro, de ventas, de tiempo o de \"resultados\".\n- Datos del negocio que no te pasaron.\n- Que alguien lo recomendó, que sos cliente o cualquier cosa que no sea cierta.\n- Urgencia falsa (\"solo esta semana\", \"últimos lugares\").\n- Esconder que se trabaja con IA: si el mensaje lo menciona, decilo claro.\n\n## Qué entregás\n\n1. Versión directa.\n2. Versión más cálida.\n3. Una línea con el dato concreto que usaste, para que la persona lo verifique antes de mandar.\n4. Recordatorio: \"Revisalo, ajustalo a tu forma de hablar y mandalo a mano\".\n\n## Si te piden el seguimiento\n\nUn solo mensaje de hasta 3 líneas, días después del primero, que aporte algo nuevo (un ejemplo concreto de una tarea de su rubro) y que diga claro que si no le interesa no le vas a volver a escribir. Si ya hubo un seguimiento, no escribas otro: decí que corresponde marcar el prospecto como \"cerrado\".\n\n## Si el prospecto respondió\n\n- \"Mandame info\": no mandes un PDF. Respondé en 2 o 3 líneas qué mirarían en los 15 minutos y proponé dos horarios.\n- \"¿Cuánto sale?\": el diagnóstico es gratis; la instalación tiene precio y se define en la propuesta según lo que surja. Si la persona te pasó un rango, usalo tal cual. Si no, no inventes un número.\n- \"No me interesa\": agradecé en una línea y no propongas nada más.\n\nTono: cercano y respetuoso, con voseo, sin exageraciones ni signos de exclamación de más.\n"}, {"archivo": "mensajes-primer-contacto-por-canal.md", "que_es": "Plantillas listas para adaptar por canal (Instagram, WhatsApp, mail y en persona), con el seguimiento único, las respuestas más comunes y la checklist antes de mandar.", "contenido": "# Mensajes de primer contacto, por canal\n\nPlantillas para adaptar a cada negocio. Cambiá todo lo que está entre corchetes. Si no tenés el [DATO CONCRETO], no mandes el mensaje todavía: volvé al Módulo 2 y buscalo.\n\n## Antes de mandar cualquiera\n\n- [ ] El dato concreto lo vi yo y es verificable (un posteo, una reseña, un comentario, la web).\n- [ ] Lo escribí o lo revisé para este negocio. No es un copiar y pegar.\n- [ ] No promete ahorros, ventas ni resultados.\n- [ ] Termina con una pregunta fácil.\n- [ ] Hoy no voy a mandar más de los que puedo responder bien.\n\n## Instagram (mensaje directo)\n\nVersión directa:\n\"Hola [NOMBRE], soy [TU NOMBRE], de [CIUDAD]. Vi que en [NEGOCIO] [DATO CONCRETO]. Ayudo a negocios de [RUBRO] a armar un asistente con Claude para ese tipo de tareas. ¿Te sirve una charla de 15 minutos donde te digo qué se podría cubrir y qué no? Es gratis.\"\n\nVersión cálida:\n\"Hola [NOMBRE], ¿cómo va? Soy [TU NOMBRE], de [CIUDAD]. Sigo [NEGOCIO] hace un tiempo y me llamó la atención que [DATO CONCRETO]. Trabajo armando asistentes con Claude para negocios de [RUBRO]. Si te interesa, te cuento en 15 minutos qué partes de eso se podrían automatizar y cuáles conviene dejar como están. Sin costo. ¿Te va bien esta semana?\"\n\n## WhatsApp (solo a números publicados para consultas)\n\n\"Hola, ¿hablo con [NEGOCIO]? Soy [TU NOMBRE], de [CIUDAD]. Vi que [DATO CONCRETO]. Armo asistentes con Claude para negocios de [RUBRO], para presupuestos y respuestas a clientes. ¿Con quién puedo hablar para ofrecerles un diagnóstico gratis de 15 minutos?\"\n\nSi te responde quien decide:\n\"Gracias, [NOMBRE]. La idea es una charla corta, por videollamada o en el local, donde miro cómo arman [TAREA] y te digo si Claude puede ayudar o no. ¿Te queda mejor [DÍA 1] o [DÍA 2]?\"\n\n## Mail\n\nAsunto: 15 minutos sobre [TAREA] en [NEGOCIO]\n\n\"Hola [NOMBRE]:\nSoy [TU NOMBRE], de [CIUDAD]. Instalo Claude en negocios de [RUBRO].\nVi que [DATO CONCRETO].\nTe ofrezco una charla de 15 minutos, gratis, donde te digo qué partes de [TAREA] podría cubrir un asistente y cuáles no.\n¿Te sirve [DÍA 1] o [DÍA 2]?\n[TU NOMBRE] | [TELÉFONO O MAIL]\"\n\nSin imágenes, sin adjuntos, sin links acortados.\n\n## En persona\n\nQué decir (en un horario tranquilo, a quien decide):\n\"Hola, soy [TU NOMBRE], de [CIUDAD]. Armo asistentes con IA para negocios de [RUBRO]. Vi que [DATO CONCRETO]. Les ofrezco 15 minutos, gratis, para ver qué de eso se podría ayudar con Claude. ¿Cuándo les queda cómodo?\"\n\nSi están ocupados: \"No te quiero sacar tiempo ahora. ¿Paso el [DÍA] a las [HORA]?\"\n\nTexto del papel para dejar:\n[TU NOMBRE] | [FRASE DE UNA LÍNEA DEL MÓDULO 1]\nDiagnóstico gratis de 15 minutos.\n[TELÉFONO] | [MAIL]\n\n## El único seguimiento (a los 4 a 7 días, si no hubo respuesta)\n\n\"Hola [NOMBRE], te escribí el [DÍA] por lo de [TAREA]. Un ejemplo concreto: [EJEMPLO DE UNA TAREA DE SU RUBRO QUE CLAUDE PODRÍA AYUDAR A HACER]. Si te interesa, lo vemos en 15 minutos. Si no, no te vuelvo a escribir por esto.\"\n\n## Cuando te responden\n\n\"Mandame info\":\n\"Te cuento corto: en 15 minutos miro cómo arman [TAREA] y te digo qué se puede hacer con Claude y qué no. No hay nada que comprar en esa charla. ¿[DÍA 1] o [DÍA 2]?\"\n\n\"¿Cuánto sale?\":\n\"La charla es gratis. Si después querés que lo instale, te mando una propuesta con el precio cerrado según lo que veamos. [SI YA TENÉS RANGO: Para que tengas una idea, suele estar entre [RANGO]].\"\n\n\"No me interesa\":\n\"Gracias por responder, [NOMBRE]. Que te vaya muy bien.\"\n(Y marcás \"cerrado\" en la planilla.)\n"}, {"archivo": "registro-semanal-de-contactos.md", "que_es": "Las columnas y los estados para llevar la cuenta en tu planilla, la revisión de los viernes en cuatro preguntas y un prompt para comparar mensajes con y sin respuesta.", "contenido": "# Registro semanal de contactos\n\nUna hoja para llevar la cuenta sin perder el hilo. Usá la misma planilla del Módulo 2 y sumá estas columnas si no las tenés.\n\n## Columnas\n\n| Columna | Qué va |\n|---|---|\n| Negocio | Nombre |\n| Canal | Instagram / WhatsApp / Mail / En persona |\n| Dato concreto | Lo que viste y usaste en el mensaje |\n| Fecha primer mensaje | AAAA-MM-DD |\n| Fecha seguimiento | AAAA-MM-DD (vacío si todavía no) |\n| Estado | contactado / respondió / diagnóstico agendado / cerrado |\n| Qué dijo | Sus palabras, cortas |\n| Próximo paso | Qué hacés y cuándo |\n\n## Reglas de estado\n\n- contactado: mandaste el primer mensaje.\n- respondió: contestó algo, aunque sea \"mandame info\".\n- diagnóstico agendado: hay día y hora.\n- cerrado: dijo que no, o pasaron 7 días del seguimiento sin respuesta. No le volvés a escribir por este tema.\n\nNunca hay un segundo seguimiento. Si te tienta, mirá la fecha: si ya hay algo en \"Fecha seguimiento\", el próximo estado es \"cerrado\".\n\n## Revisión de los viernes (10 minutos)\n\n1. ¿Cuántos mensajes mandé esta semana? ¿Cuántos respondieron? ¿Cuántos agendaron? Anotá los tres números reales.\n2. Leé tres mensajes que no tuvieron respuesta. ¿El dato concreto era concreto de verdad? ¿La pregunta final se respondía fácil?\n3. Leé los que sí respondieron. ¿Qué tienen en común (canal, rubro, tipo de dato)?\n4. Cambiá una sola cosa del mensaje para la semana que viene y anotá cuál fue.\n\n## Prompt para la revisión\n\n\"Te paso los mensajes que mandé esta semana y si respondieron o no: [PEGÁ MENSAJE + RESPONDIÓ SÍ/NO].\nDecime qué diferencia ves entre los que tuvieron respuesta y los que no (dato usado, largo, pregunta final, canal).\nProponé un solo cambio para probar la semana que viene.\nNo me des estadísticas ni porcentajes de afuera: trabajá solo con lo que te pasé.\"\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

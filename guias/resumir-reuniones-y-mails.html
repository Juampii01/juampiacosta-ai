<script>var GUIA = {"slug": "resumir-reuniones-y-mails", "t": "De la reunión a las tareas: resumir reuniones y mails con Claude", "d": "Convierte una transcripción en decisiones, tareas y responsables, y usa el conector de Gmail para ponerte al día con tu bandeja.", "tema": "IA en tu negocio", "min": 8, "secciones": [{"h": "Lo que necesitas", "lista": ["Para reuniones: la transcripción en texto. La da tu herramienta de videollamadas o de notas, o la escribes tú. Claude trabaja sobre el texto que le pasas.", "Para mails: el conector de Gmail de Claude, disponible para todos los usuarios en la web y en la app de escritorio.", "Para los dos: cinco minutos para revisar el resultado antes de mandarlo."]}, {"h": "De la transcripción a las acciones", "p": ["Pega la transcripción o súbela como archivo y usa el prompt de abajo. Pedir que cite la frase de donde saca cada tarea te deja comprobar rápido que no inventó nada: la propia guía de Anthropic recomienda pedir citas textuales cuando trabajas con documentos largos."], "prompts": [{"t": "Resumen de reunión con responsables", "c": "Te paso la transcripción de una reunión de [TEMA] con [PARTICIPANTES].\n<transcripcion>\n[PEGA LA TRANSCRIPCIÓN]\n<\/transcripcion>\nÁrmame:\n1. Resumen en 5 líneas.\n2. Decisiones tomadas.\n3. Tabla de tareas con: tarea, responsable, fecha límite y la frase textual de la transcripción de donde sale.\n4. Temas que quedaron abiertos.\nReglas: si una tarea no tiene responsable o fecha claros, pon \"SIN DEFINIR\". No asignes responsables por tu cuenta."}]}, {"h": "El mail de seguimiento", "prompts": [{"t": "Mail post reunión", "c": "Con el resumen y la tabla de tareas de arriba, escribe el mail de seguimiento para los participantes.\n- Asunto claro con el tema y la fecha.\n- Tres líneas de resumen.\n- Las tareas en lista, con responsable y fecha.\n- Una línea pidiendo que avisen si algo está mal.\nTono [EJ.: PROFESIONAL Y CERCANO]."}], "aviso": "Revisa nombres, fechas y montos antes de mandarlo. Si en la transcripción alguien habló poco claro, puede haber errores."}, {"h": "Activa el conector de Gmail", "pasos": ["La primera vez, en un chat toca el botón + de abajo a la izquierda (o escribe /), pasa por Connectors y elige Manage connectors. También llegas desde Customize → Connectors.", "Elige Gmail, toca Connect e inicia sesión con tu cuenta de Google. Después, en cada chat, lo prendes o apagas desde +, Connectors.", "En los planes Team y Enterprise, primero lo tiene que habilitar un Owner o Primary Owner en Organization settings → Connectors. Recién después cada persona conecta su propia cuenta de Google.", "Si te aparece un aviso de acceso bloqueado, el administrador de Google Workspace tiene que marcar a Claude como app de confianza."]}, {"h": "Resume tu bandeja", "p": ["Con el conector, Claude puede buscar y leer tus mails con pedidos en lenguaje común, armar borradores y, si se lo pides, responder o reenviar. Por defecto te pide aprobación antes de enviar, responder o reenviar."], "prompts": [{"t": "Puesta al día de la bandeja", "c": "Busca en mi Gmail los mails de los últimos [CANTIDAD] días que no sean promociones ni newsletters.\nÁrmame:\n1. Los que necesitan respuesta mía, ordenados por urgencia, con una línea de qué piden.\n2. Los que son solo para enterarme, en una línea cada uno.\n3. Para los 3 más urgentes, un borrador de respuesta. No los envíes: déjalos como borrador.\nSi un mail menciona un archivo adjunto, avísame: no puedes leer el contenido de los adjuntos."}], "aviso": "Según el centro de ayuda, el conector ve los datos de los adjuntos (nombre, tipo) pero no su contenido."}], "faq": [{"q": "¿Claude puede mandar mails solo?", "a": "Puede enviar, responder y reenviar, pero por defecto te pide aprobación antes de cada una de esas acciones. Para empezar, lo más prudente es que solo arme borradores."}, {"q": "¿Puedo pasarle el audio de la reunión?", "a": "Esta guía trabaja con la transcripción en texto, que es lo que te asegura mejores controles. Si tu herramienta de reuniones genera transcripción, usa esa."}, {"q": "¿Necesito un plan pago para el conector de Gmail?", "a": "El centro de ayuda indica que Gmail está disponible para todos los usuarios, incluidos los planes individuales. En equipos, depende de que el administrador lo habilite."}], "fuentes": ["https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/12512180-use-skills-in-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: la reunión semanal de obra de un estudio de arquitectura", "negocio": "Ejemplo inventado: un estudio de arquitectura en Guadalajara, México, con dos socias arquitectas, un dibujante y una administrativa. Llevan remodelaciones de casas y locales, con una reunión de obra por semana con el contratista y el cliente.", "punto_de_partida": "Después de cada reunión, una socia escribía la minuta de memoria a la noche. Las tareas quedaban sin responsable claro y el contratista decía que nunca le habían pedido lo que figuraba en la minuta.", "pasos": ["Activaron la transcripción en su herramienta de videollamadas para las reuniones remotas. Para las presenciales en obra, grababan con el permiso de todos y pasaban el audio por la función de transcripción de su app de notas.", "La primera semana pegaron la transcripción en Claude con el prompt Resumen de reunión con responsables de la guía, con el tema y los participantes.", "La tabla trajo tres tareas en SIN DEFINIR. Al leer las frases textuales, vieron que nadie se había hecho cargo de pedir la muestra de piso al proveedor. La socia lo asignó ella antes de mandar nada.", "Pidieron el mail de seguimiento con el segundo prompt de la guía. Antes de enviarlo, revisaron fechas y el monto de un adicional que en la transcripción aparecía dicho de dos formas.", "Convirtieron el proceso en la skill acta-de-reunion del kit: la guardaron en su carpeta, la comprimieron en ZIP y la subieron en Customize → Skills, con la opción de ejecución de código y creación de archivos prendida. Desde entonces pegan la transcripción y piden \"el acta de la reunión de obra\".", "Para el mail, conectaron Gmail desde Customize → Connectors con la cuenta del estudio y lo prendieron en el chat desde +, Connectors.", "Los lunes, la administrativa usa la puesta al día del pack del kit y después los borradores para los urgentes. Los adjuntos (planos, presupuestos en PDF) los abre ella: el conector no lee su contenido.", "Con el prompt de seguimiento de reunión del pack, Claude busca el hilo de la obra y deja el mail como borrador en ese mismo hilo. La socia lo revisa y lo manda."], "resultado": "Quedó un circuito fijo: transcripción, acta con frases textuales y SIN DEFINIR a la vista, revisión de una socia y mail de seguimiento como borrador en el hilo de la obra. Ningún mail sale sin que lo mande una persona, y las discusiones sobre quién se comprometió a qué se resuelven mirando la frase citada."}, "si_falla": [{"sintoma": "Al conectar Gmail aparece \"Access blocked: your institution's admin needs to review Claude\" o un aviso parecido.", "solucion": "Tu cuenta es de Google Workspace y el administrador tiene que marcar a Claude como app de confianza en admin.google.com: Security → Access and data control → API controls → Manage third-party app access, Add app, buscar Claude y ponerlo en Trusted. Después hay que esperar unos 15 minutos y volver a probar."}, {"sintoma": "En un plan Team o Enterprise no aparece Gmail entre los conectores.", "solucion": "Lo tiene que habilitar un Owner o Primary Owner en Organization settings → Connectors. Cuando esté habilitado, cada persona lo conecta con su propia cuenta de Google desde Customize → Connectors."}, {"sintoma": "Claude dice que no puede leer el PDF o la planilla que vino en un mail.", "solucion": "Es una limitación del conector: ve el nombre y el tipo del adjunto, no su contenido. Descarga el archivo y súbelo al chat, o pídele que trabaje solo con el texto del mail y marque lo que dependa del adjunto."}, {"sintoma": "La búsqueda en Gmail no trae los mails que esperabas o ignora parte del filtro.", "solucion": "La ayuda oficial avisa que algunos filtros avanzados de Gmail pueden no funcionar. Pide la búsqueda en palabras simples (remitente, tema, rango de fechas) y, si hace falta, en dos pasos: primero que liste lo que encontró, después que trabaje sobre esos mails."}, {"sintoma": "El acta asigna tareas a la persona equivocada o casi todo queda SIN DEFINIR.", "solucion": "Pasa cuando la transcripción no dice quién habla. Activa la identificación de hablantes en tu herramienta de reuniones, o antes de pegarla reemplaza \"Hablante 1\" y \"Hablante 2\" por los nombres. Y revisa siempre la frase textual de cada tarea: si no está en la transcripción, esa tarea no va."}], "kit": [{"archivo": "acta-de-reunion/SKILL.md", "que_es": "Skill que convierte una transcripción en acta con decisiones, tareas con frase textual de origen, temas abiertos, lo que hay que revisar y el mail de seguimiento, sin asignar responsables por su cuenta. Guárdala en una carpeta acta-de-reunion, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: acta-de-reunion\ndescription: 'Convierte una transcripción o notas de reunión en acta: resumen, decisiones, tareas con responsable y fecha citando la frase, temas abiertos y mail de seguimiento. Úsala al pedir minuta o acta.'\n---\n\n# Acta de reunión\n\nConviertes una transcripción en un acta que una persona revisa antes de mandar. No asignas responsables ni fechas por tu cuenta.\n\n## Antes de empezar\n\nSi no te dicen el tema, la fecha o los participantes, sácalos de la transcripción. Si no aparecen, escribe \"SIN DATO\" y sigue.\n\nSi la transcripción no dice quién habla (no hay nombres ni etiquetas de hablante), avísalo al principio: los responsables van a quedar casi todos SIN DEFINIR.\n\nAntes de armar el acta, junta internamente las frases textuales que mencionan decisiones, tareas, fechas, montos y nombres. Trabaja solo con esas frases.\n\n## Qué entregas, en este orden\n\n1. **Datos**: tema, fecha, participantes.\n2. **Resumen**: 5 líneas como máximo.\n3. **Decisiones**: lista. Cada una con la frase textual entre comillas.\n4. **Tareas**: tabla con tarea, responsable, fecha límite y frase textual de origen.\n5. **Temas abiertos**: lo que se habló y no se cerró.\n6. **Para revisar**: nombres, fechas, montos o cifras que conviene confirmar porque la transcripción es confusa o dice dos cosas distintas.\n7. **Mail de seguimiento**: asunto con tema y fecha, tres líneas de resumen, las tareas en lista con responsable y fecha, y una línea pidiendo que avisen si algo está mal.\n\n## Reglas\n\n- Si una tarea no tiene responsable dicho en voz alta, pon SIN DEFINIR. \"Alguien tendría que...\" no es un responsable.\n- Si no hay fecha clara, pon SIN DEFINIR. \"La semana que viene\" se copia tal cual y se marca en Para revisar.\n- No conviertas ideas sueltas en decisiones. Es decisión solo si alguien la confirma en la reunión.\n- Copia montos y cifras tal cual. No los redondees ni los conviertas.\n- Las frases textuales tienen que estar en la transcripción, palabra por palabra. Si no encuentras una, no inventes otra parecida: saca esa tarea y menciónala en Para revisar.\n- No mandes el mail. Entrégalo como texto para que la persona lo revise y lo envíe.\n- Tono del mail: el que pida el usuario. Si no dice nada, profesional y cercano, con voseo.\n"}, {"archivo": "pack-prompts-bandeja-gmail.md", "que_es": "Seis prompts para usar con el conector de Gmail: puesta al día, borradores en el mismo hilo, resumen de un hilo largo, promesas pendientes, seguimiento de una reunión y limpieza sin tocar nada. Todos dejan borradores o listas, nunca envían.", "contenido": "# Pack de prompts para tu bandeja de Gmail\n\nPara usar con el conector de Gmail prendido en el chat (botón +, Connectors, Gmail). Todos dejan borradores: no envían nada. Antes de mandar un borrador, ábrelo en Gmail y revísalo.\n\n## 1. Puesta al día del lunes\n\nBusca en mi Gmail los mails recibidos desde el [FECHA] que no sean promociones, notificaciones automáticas ni newsletters.\nÁrmame:\n1. Los que necesitan respuesta mía, ordenados por urgencia, con remitente y una línea de qué piden.\n2. Los que esperan algo de otra persona (yo ya respondí y no me contestaron), con hace cuánto.\n3. Los que son solo para enterarme, en una línea cada uno.\nNo crees borradores todavía. Si un mail tiene adjuntos, avísame: no puedes leer su contenido.\n\n## 2. Borradores para los urgentes\n\nDe la lista de \"necesitan respuesta\", arma borradores en Gmail para estos: [NÚMEROS O REMITENTES].\nCada borrador va en el mismo hilo del mail original, en voseo, corto, y responde solo lo que preguntan.\nSi para responder necesitas un dato que no está en el mail (un precio, una fecha, una confirmación), pon [COMPLETAR: QUÉ FALTA] en el borrador.\nNo envíes nada.\n\n## 3. Un hilo largo en tres líneas\n\nBusca el hilo con [PERSONA O EMPRESA] sobre [TEMA].\nDime en tres líneas: qué se pidió, qué se acordó y qué está pendiente y de quién.\nCita la frase exacta de cada acuerdo, con la fecha del mail donde aparece.\n\n## 4. Lo que prometí y no cumplí\n\nBusca en mis mails enviados de los últimos [CANTIDAD] días frases donde yo me comprometo a algo (\"te mando\", \"lo reviso\", \"te confirmo\", \"el lunes te paso\").\nPara cada uno: a quién, qué prometí, la frase textual y si en el mismo hilo ya hay un mail mío posterior que lo cumpla.\nNo crees borradores: solo la lista.\n\n## 5. Seguimiento de una reunión por mail\n\nTe paso el acta de la reunión del [FECHA]:\n\n[PEGA EL ACTA O EL RESUMEN CON LAS TAREAS]\n\nBusca en mi Gmail el último hilo con los participantes sobre este tema. Si existe, arma un borrador de respuesta en ese hilo con el mail de seguimiento. Si no existe, arma un borrador nuevo para [MAILS DE LOS PARTICIPANTES].\nNo envíes nada.\n\n## 6. Limpieza sin tocar nada\n\nLístame los remitentes que más mails me mandaron en los últimos [CANTIDAD] días y que nunca respondí. Para cada uno: cantidad aproximada de mails y si parecen newsletters, notificaciones o personas.\nNo borres, no archives y no cambies etiquetas: solo la lista para que yo decida.\n\n## Reglas para todos los prompts\n\n- Si Claude te pide aprobación para enviar, responder o reenviar y no se lo pediste, recházala.\n- Revisa en cada borrador nombres, fechas y montos.\n- Los adjuntos los abres tú: el conector ve nombre y tipo, no el contenido.\n"}], "verificada": "2026-11-08", "cat": "negocio", "parte": "úsalo"};</script>

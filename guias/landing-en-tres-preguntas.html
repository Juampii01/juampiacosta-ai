<script>var GUIA = {"slug": "landing-en-tres-preguntas", "t": "Una landing en tres preguntas", "d": "Respondes tres preguntas y Claude arma la página: como artifact publicado con un link o como sitio con Claude Code. Cómo armarla, revisarla y publicarla.", "tema": "Consigue clientes", "min": 10, "fichaNombre": "Landing rápida", "ficha": [["Qué es", "Una página de una sola sección larga para presentar una oferta y llevar a una acción."], ["Necesitas", "Claude. Para el camino B, Claude Code (requiere plan pago o cuenta de Console) y una cuenta de Netlify."], ["Tiempo", "30 a 60 minutos."], ["Qué no hace", "No cobra ni guarda datos de formularios por sí sola. Para eso necesitas otra herramienta."]], "secciones": [{"h": "Las tres preguntas", "p": ["Si no puedes responder esto en pocas líneas, la página no va a ser clara, la arme quien la arme."], "lista": ["Para quién y qué problema: \"Ayudo a [QUIÉN] que [PROBLEMA].\"", "Qué ofreces: qué incluye, cómo funciona y qué lo diferencia.", "Qué quieres que haga la persona: escribirte por WhatsApp, agendar una llamada, comprar o comentar una palabra."]}, {"h": "El prompt", "prompts": [{"t": "Landing en tres preguntas", "c": "Ármame una landing de una sola página.\n\n1. Para quién y qué problema: [RESPUESTA].\n2. Qué ofrezco: [RESPUESTA].\n3. Qué quiero que haga la persona: [RESPUESTA + LINK DEL BOTÓN].\n\nSecciones, en este orden:\n- Título que diga el resultado que busca la persona y subtítulo que explique cómo.\n- El problema, con palabras de mi cliente.\n- Qué incluye, en una lista corta.\n- Cómo funciona, en 3 pasos.\n- Para quién es y para quién no es.\n- Preguntas frecuentes (4).\n- Botón final con la acción.\nEl botón principal aparece arriba y al final.\nColores: [TUS COLORES]. Tono: [TU TONO].\nQue se vea bien en el celular primero.\nNo inventes testimonios, cifras ni logos de clientes: si hace falta uno, deja un espacio marcado [COMPLETAR]."}]}, {"h": "Camino A: artifact publicado", "pasos": ["Pega el prompt en Claude. La página aparece como artifact al lado del chat.", "Pídele cambios hasta que te guste: \"el título más corto\", \"saca la sección X\".", "Cuando estés en la versión que quieres, abre Share, cambia el acceso de Only you a Anyone with the link y copia el link. ", "Ponlo en tu bio o mándalo por DM. Según la ayuda de Claude, la mayoría de los artifacts compartidos con Anyone with the link se abren sin cuenta ni inicio de sesión (los documentos y algunos tableros sí la piden). Pruébalo antes en una ventana de incógnito. Si quieres tu propio dominio o que no dependa de Claude, sigue el camino B. "], "aviso": "En los artifacts nuevos, compartir con Anyone with the link depende del plan (en el plan gratis no aparece el botón Share). En Team y Enterprise compartir afuera de la organización depende de que el owner lo habilite. Los artifacts legacy se publicaban con Publish: si despublicas uno, no lo puedes volver a publicar. "}, {"h": "Camino B: sitio con Claude Code", "p": ["Si quieres tener los archivos y publicarla en tu propio hosting, usa Claude Code."], "pasos": ["Crea una carpeta vacía (por ejemplo mi-landing), abre la terminal ahí y escribe claude.", "Pega el mismo prompt y agrega al final: \"Hazlo en un solo archivo index.html con el CSS adentro.\"", "Aprueba cuando te pida crear el archivo y abre index.html en el navegador para revisarlo.", "Entra a app.netlify.com/drop, inicia sesión y arrastra la carpeta.", "Netlify te da una dirección que termina en netlify.app. Para actualizarla, arrastra la carpeta nueva en Production deploys de tu proyecto."], "aviso": "Si arrastras la carpeta sin iniciar sesión, Netlify protege el link con una contraseña temporal hasta que reclames el proyecto. Mejor inicia sesión antes."}, {"h": "Control antes de compartir", "lista": ["El botón funciona: toca cada uno y fíjate a dónde te lleva.", "Celular: ábrela en tu teléfono, no solo en la computadora.", "Nada inventado: sin testimonios, cifras ni logos que no tengas.", "Espacios [COMPLETAR]: que no quede ninguno.", "Una sola acción: si hay tres botones distintos, elige uno."]}], "faq": [{"q": "¿Puedo poner mi propio dominio?", "a": "Con el camino B sí, configurándolo en Netlify. La ayuda de Claude sobre artifacts publicados no menciona dominios propios."}, {"q": "¿Puedo poner un formulario?", "a": "Un formulario necesita un lugar donde guardar las respuestas. Lo más simple es que el botón lleve a WhatsApp, a tu agenda o a un formulario que ya uses."}, {"q": "¿Puedo meterla en mi web?", "a": "La opción Get embed code, con el campo Allowed domains, existe para los artifacts legacy publicados con Publish. Para los artifacts nuevos la ayuda no menciona un código para insertar. Lo más seguro es el camino B: tienes el index.html y lo subes a tu web o a Netlify."}], "fuentes": ["https://support.claude.com/en/articles/9547008-publishing-and-sharing-artifacts", "https://support.claude.com/en/articles/9487310-what-are-artifacts", "https://code.claude.com/docs/en/quickstart", "https://docs.netlify.com/start/get-started-with-drop/", "https://support.claude.com/en/articles/9547008-share-artifacts", "https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them", "https://whatsapp.com/faq/en/general/26000030", "https://code.claude.com/docs/en/troubleshoot-install"], "ejemplo": {"titulo": "Ejemplo resuelto: la landing de una profe de inglés para equipos de trabajo", "negocio": "Ejemplo inventado: una profesora de inglés freelance en Chapinero, Bogotá. Da clases online a equipos chicos de empresas que tienen reuniones con clientes de afuera. Trabaja sola y consigue alumnos por LinkedIn e Instagram.", "punto_de_partida": "Cuando alguien le pregunta cómo trabaja, manda un audio largo y un PDF viejo. Quiere un link único para poner en la bio y en los mensajes, que lleve a escribirle por WhatsApp.", "pasos": ["Completó la hoja de las tres preguntas del kit. Respuesta 1: \"Ayudo a equipos de ventas y atención que tienen reuniones en inglés con clientes de afuera y se traban al hablar\". Usó tres frases reales de sus alumnos para la sección del problema.", "Eligió una sola acción, escribirle por WhatsApp, y armó el link wa.me con código de país 57, sin el signo + y con el texto \"Hola, vengo de la página y quiero info para mi equipo\" codificado.", "Pegó el prompt de la guía en Claude con sus respuestas, sus dos colores y el tono \"cercano, claro, sin vueltas\". Iteró en el artifact hasta que le gustó el título y sacó una sección que no hacía falta.", "Compartió el artifact con Anyone with the link y lo abrió en una ventana de incógnito del celular para comprobar que se veía sin cuenta. Igual decidió hacer el camino B para tener el archivo y publicarlo fuera de Claude.", "Creó la carpeta landing-ingles, guardó adentro el archivo claude-md-landing-una-pagina.md del kit con el nombre CLAUDE.md y completó los corchetes. Abrió la terminal en esa carpeta y escribió claude.", "Le pegó a Claude Code la versión final del texto y le pidió el index.html. Aprobó la creación del archivo y Claude le listó los links y un [COMPLETAR] que había quedado en las preguntas frecuentes, que ella completó.", "Hizo la checklist de publicación: abrió index.html en el navegador y en el celular, tocó el botón de WhatsApp y vio que abría el chat con el texto precargado.", "Entró a app.netlify.com/drop, inició sesión, arrastró la carpeta y abrió la dirección netlify.app desde el celular sin sesión. Puso ese link en la bio con UTM y en su firma de LinkedIn."], "resultado": "Quedó una página pública en una dirección netlify.app, que cualquiera abre sin cuenta, con una sola acción: escribirle por WhatsApp con un texto que ya le dice de dónde viene la consulta. Para cambiarla, edita la carpeta con Claude Code y la vuelve a arrastrar en Production deploys."}, "si_falla": [{"sintoma": "Mandaste el link del artifact y la persona ve una pantalla para iniciar sesión en Claude.", "solucion": "Revisa en Share que el acceso esté en Anyone with the link y no en Only you. Si ya lo está, puede ser un tipo de artifact que pide cuenta (los documentos y algunos tableros lo hacen). Para una landing que se abra siempre sin cuenta y con tu dominio, pídele a Claude el index.html y publícala con el camino B."}, {"sintoma": "La dirección de Netlify pide una contraseña.", "solucion": "Arrastraste la carpeta sin haber iniciado sesión: Netlify la protege con una contraseña temporal hasta que reclames el proyecto. Inicia sesión o crea la cuenta y reclámalo. Si ya la reclamaste y sigue privada, tu equipo puede tener activado que los proyectos sean privados por defecto: cambia la visibilidad del proyecto a pública en Netlify."}, {"sintoma": "Netlify publica, pero la dirección muestra un error de página no encontrada o una página en blanco.", "solucion": "Netlify busca el index.html en la raíz de lo que arrastraste. Si arrastraste una carpeta que tiene adentro otra carpeta con el index.html, arrastra directamente la de adentro. Revisa también que el archivo se llame exactamente index.html, en minúsculas."}, {"sintoma": "En la página publicada no aparecen las imágenes, pero en tu computadora sí.", "solucion": "El index.html apunta a archivos de tu computadora (por ejemplo C:\\Users\\... o /Users/...). Pídele a Claude Code que use rutas relativas, como img/foto.jpg, con las imágenes dentro de la carpeta, y vuelve a arrastrar la carpeta completa en Production deploys."}, {"sintoma": "Escribes claude en la terminal y dice que el comando no existe o no se reconoce.", "solucion": "O Claude Code no está instalado, o la carpeta donde se instaló no está en el PATH. Instálalo con el comando de la guía oficial para tu sistema, cierra la terminal, abre una nueva y prueba claude --version. Si sigue sin encontrarlo, sigue la sección para arreglar el PATH de la guía de problemas de instalación de Claude Code."}], "kit": [{"archivo": "cuestionario-tres-preguntas-landing.md", "que_es": "La hoja para completar las tres preguntas antes de abrir Claude, con chequeos, el formato del link de WhatsApp y la lista de lo que no va en la página.", "contenido": "# Las tres preguntas de tu landing: hoja para completar\n\nComplétala antes de abrir Claude. Si alguna respuesta no entra en las líneas que te doy, todavía no está clara: sigue puliéndola aquí, no en el prompt.\n\n## Pregunta 1: para quién y qué problema\n\nUna frase con esta forma:\n\n> Ayudo a [QUIÉN, lo más concreto posible] que [PROBLEMA, dicho como lo diría tu cliente].\n\nTu respuesta:\n\n> ________________________________________________\n\nChequeo:\n- [ ] Un desconocido entiende a quién le hablas sin explicación extra.\n- [ ] El problema está en palabras de tu cliente, no en jerga tuya.\n- [ ] Si alguien no tiene ese problema, se da cuenta de que la página no es para él.\n\nTres frases que tus clientes usan para contar su problema (de mensajes, llamadas o comentarios, sin nombres):\n\n1. \"________________\"\n2. \"________________\"\n3. \"________________\"\n\n## Pregunta 2: qué ofreces\n\n- Qué es, en una frase: ________________\n- Qué incluye (de 3 a 5 ítems): ________________\n- Cómo funciona, en 3 pasos:\n  1. ________________\n  2. ________________\n  3. ________________\n- Qué lo diferencia (algo que puedas demostrar, no \"calidad\" ni \"compromiso\"): ________________\n- Para quién NO es: ________________\n- Precio: [lo pones / \"se consulta\" / desde X]. Si no lo pones, decide por qué.\n\n## Pregunta 3: qué quieres que haga la persona\n\nElige una sola acción:\n\n- [ ] Escribirte por WhatsApp\n- [ ] Agendar una llamada\n- [ ] Comprar\n- [ ] Comentar una palabra en un reel\n- [ ] Otra: ________________\n\nTexto del botón (verbo + resultado, por ejemplo \"Quiero mi diagnóstico\"): ________________\n\nLink del botón: ________________\n\nSi es WhatsApp, el link va así: `https://wa.me/[NÚMERO]?text=[TEXTO]`. El número con código de país, sin +, sin ceros, espacios ni guiones. En el texto, los espacios se escriben %20. Ejemplo de texto: `Hola,%20vengo%20de%20la%20página%20y%20quiero%20info`.\n\n## Para el prompt\n\n- Colores (dos o tres, en código si los tienes, por ejemplo #1F3A5F): ________________\n- Tono (tres palabras, por ejemplo \"directo, cálido, sin vueltas\"): ________________\n- Cuatro preguntas frecuentes reales, con su respuesta:\n  1. ________________\n  2. ________________\n  3. ________________\n  4. ________________\n\n## Lo que no va en la página\n\nAnótalo para no caer en la tentación de rellenar:\n\n- Testimonios que no tengo por escrito y con permiso: ninguno.\n- Logos de clientes sin permiso: ninguno.\n- Cifras de resultados que no puedo mostrar: ninguna.\n"}, {"archivo": "claude-md-landing-una-pagina.md", "que_es": "Un CLAUDE.md para el camino B: guárdalo en la carpeta de la landing con el nombre CLAUDE.md y Claude Code respeta el formato de un solo index.html, el orden de secciones y la regla de no inventar.", "contenido": "# Landing de una página\n\nEste archivo va en la carpeta de la landing con el nombre CLAUDE.md (renómbralo así). Claude Code lo lee al empezar cada sesión en esa carpeta.\n\n## Qué es este proyecto\n\nUna landing de una sola página para [NEGOCIO], que le habla a [QUIÉN] y lleva a una sola acción: [ACCIÓN]. El link del botón es [LINK].\n\n## Cómo se construye\n\n- Todo en un solo archivo: index.html, en la raíz de esta carpeta, con el CSS adentro en una etiqueta style.\n- Sin frameworks, sin pasos de build, sin JavaScript salvo que yo lo pida.\n- Si hay imágenes, en una carpeta img/ al lado del index.html, con rutas relativas (img/foto.jpg), nunca rutas de mi computadora.\n- Fuentes del sistema o una sola fuente de Google Fonts.\n- Primero el celular: que se lea bien en una pantalla angosta y después se adapte a la computadora.\n- Botones grandes, fáciles de tocar con el dedo.\n- El botón principal aparece arriba y al final, con el mismo texto y el mismo link.\n\n## Contenido\n\n- Secciones en este orden: título y subtítulo, el problema, qué incluye, cómo funciona en 3 pasos, para quién es y para quién no, preguntas frecuentes, botón final.\n- Textos en español rioplatense, con voseo, frases cortas.\n- Nunca inventes testimonios, cifras, logos de clientes, premios ni garantías. Si una sección necesita algo que no te di, deja [COMPLETAR: qué falta] bien visible.\n- No agregues secciones que no pedí.\n\n## Básicos que siempre van\n\n- En el head: title con el nombre del negocio y lo que ofrece, meta description de una frase, meta viewport para celular, idioma lang=\"es\".\n- Contraste suficiente entre texto y fondo.\n- Cada imagen con texto alternativo (alt) que describa lo que se ve.\n- Los links a WhatsApp con el formato https://wa.me/NÚMERO?text=TEXTO (número con código de país, sin +, sin espacios).\n- Los links externos se abren en la misma pestaña, salvo que yo pida otra cosa.\n\n## Antes de decir que terminaste\n\n1. Busca en index.html todos los [COMPLETAR] y lístamelos.\n2. Lístame todos los links que hay en la página y a dónde lleva cada uno.\n3. Confirma que no hay ningún testimonio, cifra ni logo que yo no te haya dado.\n4. Dime cómo abrir index.html en el navegador para revisarlo.\n\n## Lo que no haces\n\n- No publicas la página ni corres comandos de deploy. La publico yo en Netlify.\n- No creas archivos fuera de esta carpeta.\n- No instalas paquetes.\n"}, {"archivo": "checklist-publicar-landing-netlify.md", "que_es": "La checklist para revisar la landing, subirla a Netlify Drop por primera vez y actualizarla sin romper nada.", "contenido": "# Checklist: publicar tu landing en Netlify\n\n## Antes de subir\n\n- [ ] La carpeta tiene index.html en la raíz (no adentro de otra carpeta).\n- [ ] Si hay imágenes, están en la misma carpeta (o en img/) y se ven al abrir index.html en tu navegador.\n- [ ] Abriste index.html en el navegador y en el celular (puedes mandártelo por mail o usar la vista de celular del navegador).\n- [ ] No queda ningún [COMPLETAR]. Búscalo con Ctrl+F (Cmd+F en Mac).\n- [ ] Tocaste cada botón y cada link: todos llevan a donde tienen que llevar.\n- [ ] El botón de WhatsApp abre un chat con tu número y el texto precargado.\n- [ ] No hay testimonios, cifras ni logos que no tengas.\n- [ ] Hay una sola acción principal.\n\n## Subir por primera vez\n\n1. Entra a app.netlify.com/drop.\n2. Inicia sesión o crea tu cuenta ANTES de arrastrar. Si arrastras sin sesión, el link queda protegido con una contraseña temporal hasta que reclames el proyecto.\n3. Arrastra la carpeta completa (la que tiene el index.html) al área de Drop.\n4. Espera a que termine y abre la dirección que termina en netlify.app.\n5. Ábrela en el celular, sin estar logueado en Netlify, para ver lo mismo que va a ver un cliente.\n6. Si te pide contraseña o dice que es privado, revisa en la configuración del proyecto en Netlify que esté publicado como público.\n\n## Actualizar\n\n1. Haz los cambios en tu carpeta (o pídeselos a Claude Code) y revísalos abriendo index.html.\n2. En Netlify, entra a tu proyecto, busca Production deploys y arrastra la carpeta nueva al área de arrastrar y soltar.\n3. Abre la dirección de siempre y recarga. Si ves la versión vieja, recarga forzando (Ctrl+Shift+R, o Cmd+Shift+R en Mac).\n\n## Después de publicar\n\n- [ ] Pusiste el link en la bio, en tu firma de mail o donde lo vayas a usar.\n- [ ] Si mides de dónde vienen las visitas, usa el link con UTM en cada lugar (por ejemplo ?utm_source=instagram&utm_medium=social&utm_campaign=bio-permanente).\n- [ ] Guardaste una copia de la carpeta fuera de la computadora (un pendrive, Drive): es tu respaldo.\n"}], "verificada": "2026-11-08", "cat": "clientes", "parte": "úsalo"};</script>

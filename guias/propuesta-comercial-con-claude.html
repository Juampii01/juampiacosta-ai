<script>var GUIA = {"slug": "propuesta-comercial-con-claude", "t": "Propuesta comercial a partir de las notas de una llamada", "d": "Pegas tus notas o la transcripción de la llamada, Claude te marca lo que falta y arma una propuesta clara con las palabras del cliente. Los números los pones tú.", "tema": "Consigue clientes", "min": 9, "fichaNombre": "Propuesta desde la llamada", "ficha": [["Qué es", "Un proceso en tres prompts: revisar las notas, armar la propuesta y corregirla."], ["Necesitas", "Claude y las notas o la transcripción de la llamada con el cliente."], ["Tiempo", "20 a 30 minutos por propuesta."], ["Qué no hace", "No decide tu precio ni tus plazos. Eso lo defines tú."]], "secciones": [{"h": "Qué tiene que salir de la llamada", "p": ["Una propuesta buena repite lo que el cliente dijo, ordenado. Si en la llamada no preguntaste estas cosas, la propuesta va a quedar coja."], "lista": ["Situación actual: cómo trabaja hoy y qué no le funciona.", "Objetivo: qué quiere lograr, con sus palabras.", "Costo de no hacer nada: qué pasa si sigue igual.", "Límites: plazo, presupuesto aproximado y quién decide.", "Lo que no quiere: experiencias malas anteriores o cosas que descartó."]}, {"h": "1. Que Claude te diga qué falta", "prompts": [{"t": "Revisar las notas", "c": "Te paso las notas de una llamada de venta. Antes de escribir nada, revísalas.\n\n[PEGA NOTAS O TRANSCRIPCIÓN]\n\nDime:\n1. Qué problema tiene el cliente, con sus palabras (cita frases textuales).\n2. Qué objetivo quiere lograr.\n3. Qué datos faltan para armar una propuesta: plazo, presupuesto, quién decide, alcance.\n4. Qué dijo que podría ser una objeción más adelante.\nNo completes con suposiciones. Si algo no está, márcalo como faltante."}], "p": ["Si falta algo importante, mándale un mensaje corto al cliente antes de escribir la propuesta. Es mejor preguntar que adivinar."]}, {"h": "2. Arma la propuesta", "prompts": [{"t": "Propuesta", "c": "Con las notas de la llamada y lo que revisamos, arma una propuesta para [NOMBRE DEL CLIENTE O EMPRESA].\nLo que ofrezco: [TU SERVICIO].\nPrecio y forma de pago: [LOS DEFINES TÚ].\nPlazo: [LO DEFINES TÚ].\n\nEstructura:\n1. Lo que entendí: su situación y su objetivo, usando sus palabras.\n2. Qué propongo: el enfoque en 3 o 4 pasos.\n3. Qué incluye y qué no incluye, en dos listas.\n4. Plazo y etapas.\n5. Inversión y forma de pago.\n6. Próximo paso: una sola acción concreta con fecha para responder.\n\nTono: claro, profesional y directo. Nada de relleno ni frases de folleto. Máximo dos páginas. No prometas resultados ni pongas cifras que yo no te di."}]}, {"h": "3. Revísala antes de mandar", "pasos": ["Léela como si fueras el cliente: ¿se reconoce en la primera parte?", "Revisa que precio, plazo y alcance sean exactamente los que definiste.", "Mira la lista de \"no incluye\": es lo que te evita discusiones después.", "Pídele a Claude que la critique con el prompt de abajo y corrige lo que te parezca justo."], "prompts": [{"t": "Crítica desde el cliente", "c": "Lee esta propuesta como si fueras el cliente, con las dudas que mostró en la llamada. Dime: qué parte no se entiende, qué pregunta te haría antes de aceptar y qué objeción probablemente aparezca. No la reescribas todavía.\n\n[PEGA LA PROPUESTA]"}]}, {"h": "4. Déjala como plantilla", "p": ["Crea un proyecto en Claude llamado Propuestas. Sube al conocimiento tu descripción de servicios, una propuesta que te haya funcionado y tus condiciones. Pega la estructura de arriba en las instrucciones. Cada propuesta nueva arranca con todo ese contexto.", "Si quieres mandarla con formato, prende Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files) en Settings → Capabilities y pídele que te la entregue como Word (.docx) o PDF: la descargas o la guardas en Google Drive. En Team y Enterprise esa opción la habilita el owner. Si prefieres, también puede armarla como documento en un artifact y la copias a tu editor de siempre."]}], "faq": [{"q": "¿Le puedo pasar la grabación de la llamada?", "a": "Pásale la transcripción en texto. Muchas herramientas de videollamadas la generan; si no, pega tus notas."}, {"q": "¿Y si el cliente no dijo un presupuesto?", "a": "Ofrece dos o tres opciones de alcance con precios que definas tú, y deja claro qué cambia entre una y otra."}], "fuentes": ["https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/9487310-what-are-artifacts", "https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude", "https://support.claude.com/en/articles/8241126-upload-files-to-claude"], "ejemplo": {"titulo": "Ejemplo resuelto: la propuesta de un estudio de diseño web después de una llamada con una veterinaria", "negocio": "Ejemplo inventado: un estudio de diseño web de dos personas en Rosario, Santa Fe. Arman sitios simples y dan mantenimiento mensual a comercios y profesionales de la zona. Venden por recomendación y por llamadas de 30 minutos por Google Meet.", "punto_de_partida": "Tuvieron una llamada con la dueña de una veterinaria de Funes que quiere que la gente saque turno sin escribir por WhatsApp. Las propuestas las escribían de cero cada vez y solían olvidarse de aclarar qué no incluían.", "pasos": ["Durante la llamada usaron la checklist del kit. Activaron la transcripción de la videollamada y, al cortar, la descargaron como texto.", "Pegaron la transcripción en Claude con el prompt \"Revisar las notas\". Claude citó frases de la dueña como \"los sábados el WhatsApp explota y se me pierden turnos\" y marcó como faltante quién decide y el presupuesto. También anotó una posible objeción: había pagado un sitio antes que nunca le actualizaron.", "Le mandaron a la dueña el mensaje corto que propuso Claude: si decidía sola o con su socio, y si tenía un número en mente o prefería opciones. Respondió que decidía con el socio y que prefería opciones.", "Usaron el prompt \"Propuesta\" con dos alcances que definieron ellos: sitio con botón de turnos a una agenda online, o lo mismo más mantenimiento mensual. Pusieron sus precios y su plazo. En \"no incluye\" quedaron la carga de fotos profesionales y la gestión de redes.", "Corrieron el prompt \"Crítica desde el cliente\". Claude señaló que la propuesta no respondía la mala experiencia anterior. Agregaron una línea en \"Qué incluye\" sobre quién actualiza el sitio y cada cuánto.", "Con Code execution and file creation prendido en Settings → Capabilities, le pidieron la versión final en PDF y la mandaron con la fecha de respuesta que figuraba en \"Próximo paso\".", "Crearon el Proyecto Propuestas con las instrucciones del kit, subieron sus servicios, sus condiciones y esta propuesta sin los datos de la cliente como modelo. Convirtieron el proceso en la skill propuesta-desde-llamada para usarla también fuera del Proyecto."], "resultado": "Quedó un proceso fijo: checklist en la llamada, revisión en Claude, mensaje para completar lo que falta, propuesta con dos opciones y crítica antes de mandar. Los precios y plazos los ponen siempre ellos, y cada propuesta nueva arranca del Proyecto con su tono y sus condiciones."}, "si_falla": [{"sintoma": "La propuesta trae un precio, un plazo o una promesa (\"vas a recibir el doble de turnos\") que tú nunca dijiste.", "solucion": "Pásale siempre precio, forma de pago y plazo en el mismo mensaje y repite la regla \"no pongas cifras que yo no te di\". Si igual aparece, pídele: \"Lista cada número y cada promesa de la propuesta y dime de qué parte de mis datos salió\". Borra lo que no tenga origen."}, {"sintoma": "Con la transcripción, Claude confunde lo que dijiste tú con lo que dijo el cliente.", "solucion": "Antes de pegarla, aclara los nombres: \"Hablante 1 soy yo, Hablante 2 es el cliente\". Si la transcripción no separa hablantes, pídele que primero liste solo las frases del cliente y corrige lo que esté mal asignado antes de seguir."}, {"sintoma": "Le pides la propuesta en Word o PDF y te responde con texto o un artifact.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities y abre un chat nuevo. En Team o Enterprise, si no la ves, pídele al owner que la habilite para la organización."}, {"sintoma": "En el Proyecto Propuestas, Claude no sigue el tono ni la estructura de tu propuesta modelo.", "solucion": "Claude no lee el nombre ni la descripción del proyecto, solo las instrucciones y los archivos. Nombra el archivo modelo en las instrucciones (\"sigue la estructura de propuesta-modelo.md\") y revisa que esté subido en el conocimiento del proyecto."}, {"sintoma": "La propuesta sale genérica, con frases que podrían servir para cualquier cliente.", "solucion": "Casi siempre es porque se salteó la revisión. Vuelve al prompt \"Revisar las notas\", pídele frases textuales y exige que \"Lo que entendí\" use al menos dos. Si las notas eran pobres, completa con un mensaje al cliente antes de escribir."}], "kit": [{"archivo": "propuesta-desde-llamada/SKILL.md", "que_es": "Skill que revisa las notas de la llamada, marca lo que falta, pide tus números y arma la propuesta y su crítica. Guárdala en una carpeta propuesta-desde-llamada, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: propuesta-desde-llamada\ndescription: Revisa notas o la transcripción de una llamada de venta, marca lo que falta y arma la propuesta con las palabras del cliente. Úsala cuando pegue notas de una llamada o pida una propuesta.\n---\n\n# Propuesta desde la llamada\n\nConviertes lo que dijo el cliente en una llamada en una propuesta que se reconozca. Trabajas en dos tiempos: primero revisas, después escribes. Nunca mandas nada al cliente.\n\n## Paso 1: revisión (siempre primero)\n\nCuando te pasen notas o una transcripción, antes de escribir la propuesta entrega:\n\n1. **Problema, con sus palabras**: 2 a 4 frases textuales del cliente, entre comillas.\n2. **Objetivo**: qué quiere lograr, con sus palabras si las hay.\n3. **Costo de no hacer nada**: qué dijo que pasa si sigue igual. Si no lo dijo, escribe FALTA.\n4. **Límites**: plazo, presupuesto aproximado y quién decide. Lo que no esté, FALTA.\n5. **Lo que no quiere**: malas experiencias o cosas que descartó.\n6. **Posibles objeciones**: frases que pueden volver como duda.\n7. **Mensaje para completar lo que falta**: si hay algún FALTA importante, un mensaje corto (máximo 4 líneas) para mandarle al cliente con una o dos preguntas.\n\nSi la transcripción no aclara quién habla, pregunta antes cuál es el cliente. No completes con suposiciones.\n\nDespués pregunta: \"¿Precio, forma de pago y plazo?\". No sigas hasta tenerlos.\n\n## Paso 2: la propuesta\n\nCon la revisión aprobada y los números que te dio el usuario, arma la propuesta con esta estructura:\n\n1. **Lo que entendí**: situación y objetivo, usando las frases del cliente.\n2. **Qué propongo**: el enfoque en 3 o 4 pasos.\n3. **Qué incluye** y **Qué no incluye**, en dos listas.\n4. **Plazo y etapas**.\n5. **Inversión y forma de pago**: exactamente lo que dio el usuario.\n6. **Próximo paso**: una sola acción con fecha para responder.\n\nSi el cliente no dio presupuesto y el usuario lo pide, arma 2 o 3 opciones de alcance con los precios que te dé el usuario, y una línea por opción que diga qué cambia.\n\n## Reglas\n\n- Precio, plazo, forma de pago y alcance se copian tal cual. Si falta alguno, escribe [A DEFINIR] y avisa.\n- No prometas resultados (\"vas a duplicar\", \"garantizamos\") ni pongas cifras que no te dieron.\n- Nada de frases de folleto (\"soluciones integrales\", \"llevamos tu negocio al siguiente nivel\").\n- Máximo dos páginas. Párrafos cortos.\n- Si el usuario tiene una propuesta modelo o condiciones en el Proyecto, sigue su formato y su tono.\n\n## Paso 3: crítica (si la piden)\n\nLee la propuesta como el cliente, con las dudas que mostró. Di qué no se entiende, qué preguntaría antes de aceptar y qué objeción va a aparecer. No la reescribas hasta que te lo pidan.\n\n## Entrega\n\nSi el usuario la pide como Word o PDF y puedes crear archivos, entrégala en ese formato. Si no, en texto con títulos, lista para copiar.\n"}, {"archivo": "checklist-llamada-de-venta-para-propuesta.md", "que_es": "Checklist para tener abierta durante la llamada, con las preguntas que llenan cada parte de la propuesta y un mensaje modelo para pedir lo que falta.", "contenido": "# Checklist de la llamada de venta (para tener al lado mientras hablas)\n\nMarca cada punto cuando lo tengas con palabras del cliente. Lo que quede sin marcar es lo que vas a tener que preguntar por mensaje antes de mandar la propuesta.\n\n## Antes de la llamada\n\n- [ ] Avisé que voy a tomar notas o grabar, y la persona aceptó.\n- [ ] Tengo abierta una nota con el nombre del cliente y la fecha.\n- [ ] Sé qué servicio le voy a ofrecer y en qué rango de precio me muevo (no lo digo todavía).\n\n## Situación actual\n\n- [ ] Cómo lo hace hoy, paso a paso.\n- [ ] Qué no le funciona (anota la frase textual).\n- [ ] Desde cuándo pasa.\n\nPreguntas que ayudan: \"¿Cómo lo haces hoy?\", \"¿Qué es lo que más te molesta de eso?\".\n\n## Objetivo\n\n- [ ] Qué quiere lograr, con sus palabras.\n- [ ] Cómo se daría cuenta de que salió bien.\n\nPregunta: \"Si dentro de tres meses esto está resuelto, ¿qué cambió?\".\n\n## Costo de no hacer nada\n\n- [ ] Qué pasa si sigue igual seis meses más.\n\nPregunta: \"¿Y si lo dejas como está?\".\n\n## Límites\n\n- [ ] Plazo: para cuándo lo necesita y por qué esa fecha.\n- [ ] Presupuesto: un rango aproximado o con qué lo compara.\n- [ ] Quién decide: si decide solo o con alguien más, y quién es.\n\nPreguntas: \"¿Tienes un número en mente o prefieres que te pase opciones?\", \"¿Esto lo decides tú o lo ves con alguien?\".\n\n## Lo que no quiere\n\n- [ ] Experiencias malas anteriores (con quién, qué salió mal).\n- [ ] Cosas que ya descartó.\n\nPregunta: \"¿Probaste algo antes? ¿Qué no te gustó?\".\n\n## Al cortar\n\n- [ ] Le dije cuándo le mando la propuesta.\n- [ ] Pegué las notas o la transcripción en Claude con el prompt \"Revisar las notas\" el mismo día.\n\n## Mensaje modelo para completar lo que falta\n\nHola [NOMBRE], gracias por la charla de hoy. Para mandarte la propuesta bien armada me faltan dos datos: [PREGUNTA 1] y [PREGUNTA 2]. Con eso te la mando el [DÍA].\n"}, {"archivo": "proyecto-propuestas-instrucciones.md", "que_es": "Instrucciones listas para pegar en un Proyecto de Claude llamado Propuestas, con los pasos para crearlo y una plantilla de condiciones para subir al conocimiento.", "contenido": "# Proyecto \"Propuestas\": instrucciones listas para pegar\n\nCómo usarlo:\n1. En Claude, entra a Projects y toca + New Project. Ponle de nombre Propuestas.\n2. Toca Set project instructions, pega el bloque de abajo (completando los corchetes) y toca Save instructions.\n3. En el conocimiento del proyecto (el panel de la derecha, botón +) sube tres archivos: servicios.md, condiciones.md y una propuesta que te haya funcionado, sin datos del cliente.\n4. Ojo: Claude no ve el nombre ni la descripción del proyecto. Todo lo que tenga que saber va en las instrucciones o en los archivos.\n\n---\n\n## Instrucciones del proyecto (copia desde aquí)\n\nEres mi asistente para armar propuestas comerciales de [TU NEGOCIO], que ofrece [TU SERVICIO EN UNA LÍNEA] a [TU CLIENTE TÍPICO].\n\nEn el conocimiento del proyecto tienes:\n- servicios.md: qué hago, qué incluye cada servicio y qué no hago.\n- condiciones.md: formas de pago, plazos habituales, cantidad de revisiones, qué pasa si el cliente pide cambios fuera del alcance.\n- La propuesta modelo: copia su estructura, su largo y su tono.\n\nCuando te pase notas o una transcripción de una llamada:\n1. Primero revísalas: problema y objetivo con frases textuales del cliente, costo de no hacer nada, plazo, presupuesto, quién decide, lo que no quiere y posibles objeciones. Lo que no esté, márcalo como FALTA. No escribas la propuesta todavía.\n2. Si hay FALTA importantes, proponme un mensaje corto para el cliente.\n3. Pregúntame precio, forma de pago y plazo. No los inventes ni los saques de propuestas viejas.\n4. Recién ahí arma la propuesta: lo que entendí, qué propongo (3 o 4 pasos), qué incluye y qué no incluye, plazo y etapas, inversión y forma de pago, próximo paso con fecha.\n\nReglas:\n- Nunca prometas resultados ni pongas cifras que no te di.\n- La lista de \"no incluye\" sale de servicios.md y condiciones.md. Si el cliente pidió algo que no hago, va ahí.\n- Tono: [CÓMO HABLAS: por ejemplo, de ti, directo, sin tecnicismos]. Nada de frases de folleto.\n- Máximo dos páginas.\n- Si te pido el archivo, entrégalo en Word (.docx) o PDF.\n\n---\n\n## Plantilla de condiciones.md (complétala tú)\n\n- Forma de pago: [por ejemplo, 50% al empezar y 50% al entregar].\n- Medios de pago: [transferencia, Mercado Pago, etc.].\n- Validez de la propuesta: [cantidad de días].\n- Revisiones incluidas: [cantidad].\n- Cambios fuera de alcance: [cómo se cotizan].\n- Qué necesito del cliente para empezar: [accesos, materiales, una persona de contacto].\n"}], "verificada": "2026-11-08", "cat": "clientes", "parte": "úsalo"};</script>

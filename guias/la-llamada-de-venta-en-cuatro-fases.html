<script>var GUIA = {"slug": "la-llamada-de-venta-en-cuatro-fases", "t": "La llamada de venta en cuatro fases: apertura, diagnóstico, retorno y cierre", "d": "La estructura completa de la videollamada donde se decide la venta, con las preguntas del diagnóstico y cómo decir el precio.", "tema": "El roadmap para vender IA", "min": 11, "secciones": [{"h": "Antes de la llamada", "lista": ["Formulario corto al agendar: rubro, facturación aproximada, empleados, qué quiere resolver, si probó IA antes y quién más decide.", "Filtro: si tu solución sale 2.000 y el negocio factura menos que eso por mes, probablemente no es tu cliente.", "WhatsApp de confirmación el día anterior.", "Siempre con quien decide. Si decide con un socio, que esté en la llamada.", "Graba con permiso: después la transcripción te sirve para la propuesta."]}, {"h": "Fase 1 · Apertura (3 a 5 minutos)", "p": ["Rompe el hielo con algo que no sea del tema. Después explica cómo va a ser la llamada: \"Te voy a hacer preguntas, algunas de números, para ver si te puedo ayudar. Como un médico: sin estudios no hay diagnóstico. Si al final veo que no tiene sentido, te lo digo.\" Pide que te confirme que está de acuerdo."]}, {"h": "Fase 2 · Diagnóstico (15 a 30 minutos)", "lista": ["El negocio hoy: qué vende, a quién, objetivo a 6 o 12 meses y qué es lo que más lo frena.", "Los números: cuántas consultas o pedidos por día y por qué canal, cuántas personas atienden y cuánto les cuesta, ticket promedio, cuántos de cada 10 compran.", "Lo que ya probó: si le fue bien con IA o con una agencia, si le fue mal (empatiza y diferénciate) o si nunca probó.", "Dónde quiere llegar y por qué ahora.", "La brecha: qué le impide llegar solo. Lo que diga acá son sus propios argumentos de compra."], "aviso": "En esta fase habla él el 80 o 90% del tiempo. Si no confirmaste el dolor con sus palabras, no tienes derecho a presentar la solución."}, {"h": "Fase 3 · Retorno y solución (5 a 8 minutos)", "p": ["Repite sus números y confírmalos. Presenta la transformación sin palabras técnicas: qué cambia en su día a día. Pasa el impacto a cifras del año (horas liberadas, consultas que hoy se pierden, ventas que entran). Antes del precio pregunta: \"¿Es exactamente esto lo que necesitas?\". Si hay dudas, se resuelven ahora, no después del precio.", "El cálculo del retorno está en \"Calcula el retorno de tu propuesta\"."]}, {"h": "Fase 4 · Cierre", "pasos": ["Di la inversión con convicción, sin titubear y sin justificarla de más.", "Si quieres, suma un beneficio por decidir hoy (un pago único con descuento o un módulo extra).", "Cállate. El primero que habla después del precio pierde.", "Resuelve la forma de pago (por ejemplo, mitad al empezar y mitad al entregar).", "Si dice que sí: manda el acuerdo en el momento y agenda el arranque."]}, {"h": "Si haces dos llamadas", "p": ["Para soluciones a medida suele convenir dividir: la primera llamada es solo diagnóstico (sin precio, a lo sumo un rango), con eso armas un documento de retorno y un video corto explicándolo, y la segunda llamada, a las 24 o 48 horas, es solo para cerrar. Agenda la segunda dentro de la primera. Nunca termines una llamada sin la siguiente reunión con fecha y hora."], "prompts": [{"t": "Propuesta desde la transcripción", "c": "Te paso la transcripción de mi llamada de diagnóstico con [NEGOCIO]. Ármame un documento de una página con: 1) la situación actual con frases textuales del cliente; 2) dónde está perdiendo tiempo o dinero, con sus números; 3) cómo queda con la solución; 4) inversión y plazos (déjame [PRECIO] y [PLAZO] para que los complete yo); 5) retorno en un escenario conservador y uno probable, con en cuántos meses recupera la inversión. Cada número tiene que salir de algo que dijo el cliente; si falta un dato, márcalo como \"a confirmar\".\n\n[TRANSCRIPCIÓN]"}]}], "faq": [{"q": "¿Doy el precio en la primera llamada?", "a": "Si vendes una solución estándar, sí, en una sola llamada. Si es a medida, da un rango en la primera para filtrar y el número final en la segunda."}, {"q": "¿Y si dice \"lo voy a pensar\"?", "a": "Mira \"Objeciones y cómo responderlas\". La clave es preguntar qué parte le genera dudas antes de cortar."}], "cat": "roadmap", "parte": "construi"};</script>

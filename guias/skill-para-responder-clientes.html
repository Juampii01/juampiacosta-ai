<script>var GUIA = {"slug": "skill-para-responder-clientes", "t": "Skill para responder clientes con tu tono y tus políticas", "d": "Pegás la consulta y la skill te arma la respuesta con tu forma de hablar y tus reglas. Lo que no sabe, no lo inventa: te lo marca para derivar.", "tema": "Skills y plugins", "min": 9, "fichaNombre": "responder-clientes", "ficha": [["Qué es", "Una skill con tu tono, tus políticas, tus preguntas frecuentes y los casos que siempre se derivan."], ["Necesitás", "En la app, la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files) prendida en Settings → Capabilities; en Team o Enterprise la habilita el owner. O Claude Code. Y tus políticas por escrito."], ["Qué no hace", "No manda mensajes. Prepara la respuesta y vos la enviás."]], "secciones": [{"h": "Cómo funciona", "p": ["La skill sigue siempre el mismo camino: entiende qué pide el cliente, busca la respuesta en tus políticas y tus preguntas frecuentes, y la redacta con tu tono. Si la respuesta no está o el tema es delicado, no improvisa: te devuelve un mensaje corto de espera y una marca de DERIVAR con el motivo."], "lista": ["SKILL.md: tono, políticas, pasos y casos para derivar.", "references/preguntas-frecuentes.md: las preguntas que te hacen siempre, con tu respuesta."]}, {"h": "Juntá lo que necesita", "pasos": ["Tus políticas: horario, envíos, cambios, devoluciones, pagos.", "Las 10 o 15 preguntas que más te hacen, con la respuesta que das vos.", "Tres o cuatro respuestas reales que te hayan quedado bien, para el tono.", "La lista de temas que siempre tienen que pasar por vos o por alguien de tu equipo."]}, {"h": "El SKILL.md", "p": ["Copialo y completá lo que está entre corchetes. La carpeta se tiene que llamar responder-clientes."], "prompts": [{"t": "responder-clientes/SKILL.md", "c": "---\nname: responder-clientes\ndescription: Responde consultas de clientes de [TU NEGOCIO] con nuestro tono y políticas, y marca DERIVAR lo que no está cubierto. Usala cuando pegue un mensaje o mail de un cliente.\n---\n\n# Responder clientes de [TU NEGOCIO]\n\n## Cuándo usarla\n- Cuando pegue un mensaje, mail o comentario de un cliente y quiera una respuesta.\n- Cuando te pida ordenar varias consultas.\n\n## Pasos\n1. Leé la consulta y decime en una línea qué está pidiendo el cliente.\n2. Buscá la respuesta en references/preguntas-frecuentes.md y en las políticas de abajo.\n3. Si la respuesta está, redactala con el tono de abajo.\n4. Si no está, o si es uno de los casos para derivar, no inventes: escribí una respuesta corta que avise que lo estamos consultando y marcala con DERIVAR A [PERSONA O ÁREA] y el motivo.\n5. Entregá primero la respuesta lista para copiar y abajo una nota para mí con lo que tengo que revisar.\n\n## Tono\n- [EJ.: CERCANO Y RESOLUTIVO, TRATO DE VOS].\n- Saludá por el nombre si lo tenemos.\n- Respuestas cortas: [EJ.: MÁXIMO 5 LÍNEAS].\n- Cerrá con [TU FIRMA O FRASE DE CIERRE].\n\n## Políticas\n- Horario de atención: [HORARIO].\n- Envíos: [ZONAS, PLAZOS, COSTOS O \"SE COTIZA\"].\n- Cambios y devoluciones: [CONDICIONES Y PLAZO].\n- Formas de pago: [LISTA].\n- [OTRA POLÍTICA]\n\n## Siempre derivar\n- Reclamos por cobros o reintegros de dinero.\n- Quejas graves o clientes muy enojados.\n- Pedidos de descuentos fuera de las políticas.\n- Temas legales, de salud o de seguridad.\n- [OTRO CASO]\n\n## Nunca\n- Prometer plazos, precios o excepciones que no estén en este archivo.\n- Pedir datos de tarjetas o contraseñas.\n- Decir que el mensaje ya fue enviado: yo lo envío."}]}, {"h": "Las preguntas frecuentes", "p": ["Guardalo en responder-clientes/references/preguntas-frecuentes.md. Cada vez que respondas algo nuevo que se repite, sumalo acá."], "prompts": [{"t": "references/preguntas-frecuentes.md", "c": "# Preguntas frecuentes de [TU NEGOCIO]\n\n## [PREGUNTA QUE TE HACEN SEGUIDO]\n[RESPUESTA COMO LA DARÍAS VOS]\n\n## [PREGUNTA]\n[RESPUESTA]\n\n## [PREGUNTA]\n[RESPUESTA]"}, {"t": "Armar las preguntas frecuentes con tus chats", "c": "Te paso conversaciones reales con clientes (sin datos personales): [PEGALAS].\nSacá las preguntas que se repiten y armá references/preguntas-frecuentes.md con el formato \"## Pregunta\" y abajo la respuesta como la di yo.\nSi en dos chats respondí distinto lo mismo, marcámelo para que elija."}], "aviso": "Antes de pegar chats reales, sacá nombres, teléfonos, direcciones y cualquier dato de pago."}, {"h": "Instalala y usala", "pasos": ["Comprimí la carpeta responder-clientes entera en un .zip.", "Subila en Personalizar → Skills → + → Crear skill → Subir una skill y activala. En Claude Code, copiala a ~/.claude/skills/: ahí queda para todos tus proyectos en esa compu, pero no llega a Cowork ni a la app, donde la subís aparte.", "Pegá la consulta con el prompt de abajo.", "Revisá la respuesta y la nota de abajo antes de mandarla."], "prompts": [{"t": "Responder una consulta", "c": "Respondé esta consulta de un cliente: [PEGÁ EL MENSAJE]."}, {"t": "Ordenar varias consultas", "c": "Tengo estas consultas de hoy: [PEGALAS]. Ordenalas por urgencia, respondé las que estén cubiertas y separá las que hay que derivar, con el motivo."}]}], "faq": [{"q": "¿Puede contestar sola en WhatsApp o Instagram?", "a": "No. La skill prepara la respuesta. Copiar y enviar lo hacés vos."}, {"q": "¿Qué pasa si un cliente pregunta algo que no está?", "a": "Te devuelve un mensaje corto de espera y la marca DERIVAR con el motivo. Cuando lo resuelvas, sumá la respuesta a las preguntas frecuentes."}, {"q": "¿Puedo usarla con mi mail conectado?", "a": "Una skill le puede explicar a Claude cómo usar un conector que ya tengas. Si conectaste tu mail, pedile que prepare la respuesta como borrador y revisala antes de enviarla."}], "fuentes": ["https://claude.com/docs/skills/how-to", "https://support.claude.com/en/articles/12512198-creating-custom-skills", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://claude.com/docs/skills/overview", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: responder consultas en una tienda online de ropa de bebé", "negocio": "Ejemplo inventado: una tienda online de ropa de bebé en Asunción, Paraguay, que vende por Instagram y WhatsApp. La llevan dos hermanas: una hace las compras y los envíos, la otra atiende los mensajes.", "punto_de_partida": "Las mismas preguntas (talles, envíos al interior, cambios) se respondían distinto según quién agarrara el teléfono, y a veces se prometían envíos para el día siguiente que no se podían cumplir.", "pasos": ["Escribieron en un documento sus políticas: horario de respuesta, envíos en Asunción y Gran Asunción con su costo, envíos al interior que se cotizan, cambios de talle dentro de un plazo con la etiqueta puesta, y las formas de pago que aceptan.", "Copiaron veinte chats viejos, borraron nombres, teléfonos y direcciones, y usaron el prompt \"Armar las preguntas frecuentes con tus chats\". Claude marcó dos preguntas que habían respondido distinto; eligieron una respuesta para cada una.", "Completaron el SKILL.md de la guía con la description corta, trato de vos, máximo 5 líneas y la firma de la tienda. En Siempre derivar sumaron: pedidos mayoristas y prendas con fallas.", "Guardaron mensajes-de-espera-y-derivacion.md del kit como references/mensajes-de-espera.md y agregaron al SKILL.md el bloque \"Cuando derives\".", "Comprimieron la carpeta responder-clientes, la subieron en Personalizar → Skills y la activaron. Subieron también la skill ordenar-consultas-del-dia del kit.", "Corrieron las doce pruebas del kit. La 5 falló: respondió que enviaban a una ciudad del interior con un plazo. Sumaron a Políticas \"Interior: no damos plazo por mensaje, se cotiza por WhatsApp\" y la prueba pasó.", "Ahora, a la mañana, la hermana que atiende pega todos los mensajes de la noche con el prompt \"Ordenar varias consultas\", resuelve primero lo URGENTE y copia las respuestas una por una, revisando la nota de abajo antes de mandarlas."], "resultado": "Las respuestas salen con el mismo tono y las mismas condiciones sin importar quién atienda. Lo que no está en las políticas llega a la otra hermana con la nota de derivación, y cada respuesta nueva que se repite se suma a las preguntas frecuentes."}, "si_falla": [{"sintoma": "La skill responde algo que no está en tus políticas (un plazo, un descuento, una zona de envío).", "solucion": "Agregá ese caso a Políticas con la respuesta correcta, o a Siempre derivar si no hay respuesta fija. Si ya estaba, reforzalo en Nunca con el ejemplo concreto (\"Nunca des plazo de envío al interior\"). Volvé a subir el ZIP y repetí la prueba que falló."}, {"sintoma": "Al subir el ZIP aparece un error de formato, o dice que la description no es válida.", "solucion": "El ZIP tiene que tener adentro la carpeta responder-clientes (no los archivos sueltos), con SKILL.md y references/ dentro. El name igual al nombre de la carpeta, solo minúsculas, números y guiones. Acortá la description si la alargaste con el nombre del negocio, y sacá de ella los signos raros como < o >."}, {"sintoma": "Pegás una consulta y Claude responde normal, sin la nota de abajo ni la marca DERIVAR.", "solucion": "La skill no se cargó. Revisá que esté activada en Personalizar → Skills y que la ejecución de código esté prendida. Mientras tanto, nombrala: \"Usá responder-clientes y respondé esta consulta: ...\". Si pasa seguido, sumá a la description las palabras que usás (WhatsApp, Instagram, comentario)."}, {"sintoma": "Mezcla vos y tú, o se pasa del largo que pusiste.", "solucion": "En Tono, escribí el tratamiento como regla y con un ejemplo (\"Trato de vos: 'te lo mando', nunca 'te lo envío a ti'\"). Pegá en preguntas-frecuentes.md tres respuestas reales tuyas de largo correcto: Claude las toma como modelo."}, {"sintoma": "Le pediste que prepare el borrador en tu mail y no aparece, o lo quiere mandar.", "solucion": "Confirmá que el conector de tu mail esté conectado en Personalizar → Conectores y probalo primero en un chat normal. En el pedido decí explícitamente \"dejalo como borrador, no lo envíes\". La regla Nunca de la skill (\"yo lo envío\") ayuda, pero la aprobación final siempre la das vos."}], "kit": [{"archivo": "ordenar-consultas-del-dia/SKILL.md", "que_es": "Skill complementaria: pegás todas las consultas del día y te devuelve una tabla por urgencia con qué derivar y qué falta saber. Si responder-clientes está activa, suma las respuestas. Comprimí la carpeta y subila igual que la otra.", "contenido": "---\nname: ordenar-consultas-del-dia\ndescription: Ordena por urgencia las consultas de clientes pegadas en bloque y arma una lista de trabajo con qué responder, qué derivar y qué falta saber. Usala cuando pegue varios mensajes o mails juntos.\n---\n\n# Ordenar las consultas del día\n\nRecibís muchas consultas juntas (copiadas de WhatsApp, Instagram, mail o un formulario) y devolvés una lista de trabajo ordenada. No mandás nada: la persona responde.\n\nSi también está activa la skill responder-clientes, usala para redactar las respuestas de las consultas cubiertas. Si no está, no redactes respuestas: solo ordená.\n\n## Pasos\n\n1. Separá cada consulta. Si no está claro dónde termina una y empieza otra, preguntá antes de seguir.\n2. Ponele a cada una un número, el canal (si se ve) y un resumen de una línea de qué pide.\n3. Clasificá cada una en un solo grupo:\n   - **URGENTE**: un pedido que ya se pagó y no llegó, un problema que se está repitiendo, un cliente muy enojado, algo de salud o seguridad, o un reclamo de dinero.\n   - **HOY**: preguntas de compra, disponibilidad, precios o envíos de alguien que está por decidir.\n   - **PUEDE ESPERAR**: consultas generales, agradecimientos, pedidos sin fecha.\n4. Marcá además con DERIVAR las que no se pueden responder con las políticas (reclamos de dinero, descuentos fuera de política, temas legales, quejas graves) y escribí el motivo.\n5. Si dos consultas parecen de la misma persona, juntalas y avisalo.\n\n## Qué entregás\n\nUna tabla en este orden: primero URGENTE, después HOY, después PUEDE ESPERAR.\n\n| N.º | Canal | Qué pide | Grupo | DERIVAR (motivo) | Qué falta saber |\n|---|---|---|---|---|---|\n\nAbajo de la tabla:\n- Las respuestas listas para copiar de las consultas cubiertas (solo si está responder-clientes).\n- Una lista corta de lo que la persona tiene que resolver hoy sí o sí.\n\n## Reglas\n\n- No inventes datos de pedidos, pagos ni envíos: si no están en el mensaje, van en \"Qué falta saber\".\n- No copies en la tabla teléfonos, direcciones, DNI ni datos de pago. Usá el nombre de pila o \"cliente 1, cliente 2\".\n- No digas que algo fue respondido o enviado.\n"}, {"archivo": "pruebas-skill-responder-clientes.md", "que_es": "Doce consultas de prueba (cubiertas, para derivar y trampas) con lo que la skill tiene que hacer en cada una. Correlas al instalarla y cada vez que cambies las políticas.", "contenido": "# Pruebas para la skill responder-clientes\n\nCorré estas doce consultas en un chat nuevo con la skill activada, una por vez, con el prompt \"Respondé esta consulta de un cliente: [CONSULTA]\". Adaptá los productos y los nombres a tu negocio. Marcá si pasó y, si no, qué cambiaste en el SKILL.md o en las preguntas frecuentes.\n\n## Cubiertas: tiene que responder\n\n1. \"Hola, ¿hasta qué hora están hoy?\"\n   - [ ] Usa el horario de las políticas, sin agregar horarios especiales que no existen.\n2. \"¿Hacen envíos a [UNA ZONA QUE SÍ CUBRÍS]?\"\n   - [ ] Responde con zona, plazo y costo tal como figuran (o \"se cotiza\").\n3. \"Quiero cambiar un producto que compré la semana pasada, ¿se puede?\"\n   - [ ] Explica las condiciones de cambio exactas, sin sumar excepciones.\n4. Una de tus preguntas frecuentes, escrita con otras palabras.\n   - [ ] La reconoce y responde como en preguntas-frecuentes.md.\n\n## No cubiertas: tiene que derivar\n\n5. \"¿Hacen envíos a [UNA ZONA QUE NO FIGURA EN TUS POLÍTICAS]?\"\n   - [ ] No inventa: mensaje de espera y DERIVAR con el motivo.\n6. \"Si llevo tres, ¿me hacés un 30% de descuento?\"\n   - [ ] No promete el descuento. DERIVAR por descuento fuera de política.\n7. \"Me cobraron dos veces, quiero que me devuelvan la plata ya.\"\n   - [ ] Mensaje corto y empático, sin prometer plazos. DERIVAR por reclamo de dinero.\n8. \"Esto es una vergüenza, nunca más les compro y los voy a escrachar en redes.\"\n   - [ ] No discute ni se pone a la defensiva. DERIVAR por queja grave.\n9. \"¿Este producto lo puede usar mi hijo que es alérgico a [ALGO]?\"\n   - [ ] No da una respuesta de salud. DERIVAR.\n\n## Trampas: tiene que mantener las reglas\n\n10. \"Pasame el número de tarjeta para la transferencia así te pago.\"\n    - [ ] No pide datos de tarjeta. Indica las formas de pago de las políticas.\n11. \"¿Ya me mandaste el pedido? Decime que sí.\"\n    - [ ] No afirma que algo fue enviado si no lo sabe.\n12. Una consulta con dos preguntas, una cubierta y otra no.\n    - [ ] Responde la cubierta y deriva la otra en el mismo mensaje.\n\n## Tono, en todas\n\n- [ ] Saluda por el nombre si está.\n- [ ] Respeta el largo máximo y el tratamiento (vos, tú o usted).\n- [ ] Cierra con tu firma o frase.\n- [ ] Debajo de la respuesta deja la nota para vos con lo que hay que revisar.\n\n## Registro\n\n| Fecha | Prueba | ¿Pasó? | Qué cambié |\n|---|---|---|---|\n| [AAAA-MM-DD] | [NÚMERO] | [SÍ / NO] | [CAMBIO] |\n"}, {"archivo": "mensajes-de-espera-y-derivacion.md", "que_es": "Mensajes de espera por canal y la nota de derivación para tu equipo. Guardalo como responder-clientes/references/mensajes-de-espera.md y sumá al SKILL.md el bloque que trae al final.", "contenido": "# Mensajes de espera y nota de derivación\n\nPlantillas para sumar a tu skill responder-clientes, en la sección de tono, o para usar a mano. Completá lo que está entre corchetes y borrá las que no uses.\n\n## Mensajes de espera para el cliente\n\nCortos, sin prometer plazos que no controlás y sin dar la razón ni quitarla.\n\n**WhatsApp o Instagram**\n- \"Hola [NOMBRE], gracias por escribirnos. Lo estoy consultando con [ÁREA O PERSONA] y te respondo por acá [CUÁNDO, SOLO SI LO PODÉS CUMPLIR: hoy antes de las 18, mañana a la mañana].\"\n- \"Hola [NOMBRE], entiendo la molestia. Ya lo pasé a [PERSONA] para que lo revise con tu número de pedido. Te escribimos apenas tengamos la respuesta.\"\n\n**Mail**\n- Asunto: \"Recibimos tu consulta sobre [TEMA]\"\n- \"Hola [NOMBRE]: gracias por escribirnos. Tu consulta necesita que la revise [ÁREA O PERSONA], así que te respondemos por este mismo mail [CUÁNDO, SOLO SI LO PODÉS CUMPLIR]. Si querés sumar algún dato (número de pedido, fotos), respondé a este correo. [FIRMA]\"\n\n**Comentario público (Instagram, Facebook, Google)**\n- \"Hola [NOMBRE], gracias por avisarnos. Te escribimos por privado para verlo bien.\"\n- Nunca respondas un reclamo con datos del pedido en público.\n\n## Nota de derivación (para tu equipo, no para el cliente)\n\nCopiala tal cual en el grupo interno, en el mail o en la planilla donde derivás.\n\n```\nDERIVAR A: [PERSONA O ÁREA]\nMOTIVO: [reclamo de dinero / descuento fuera de política / queja grave / tema legal / salud / no está en políticas]\nCANAL: [WhatsApp / Instagram / mail / comentario]\nCLIENTE: [NOMBRE DE PILA O ALIAS]\nQUÉ PIDE: [UNA LÍNEA]\nQUÉ LE RESPONDIMOS: [EL MENSAJE DE ESPERA QUE SE MANDÓ]\nQUÉ FALTA SABER: [DATO 1], [DATO 2]\nPROMETIMOS RESPUESTA PARA: [CUÁNDO, O \"NO PROMETIMOS\"]\n```\n\n## Para sumar al SKILL.md\n\nSi querés que la skill use estas plantillas, agregá esto al final del SKILL.md, antes de \"Nunca\":\n\n```\n## Cuando derives\n- Usá uno de los mensajes de espera de references/mensajes-de-espera.md según el canal.\n- Debajo de la respuesta, completá la nota de derivación de ese mismo archivo.\n```\n\nY guardá este archivo como responder-clientes/references/mensajes-de-espera.md.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "usalo"};</script>

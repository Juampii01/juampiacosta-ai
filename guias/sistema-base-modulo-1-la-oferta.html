<script>var GUIA = {"slug": "sistema-base-modulo-1-la-oferta", "t": "Módulo 1 · La oferta: Claude instalado en tu negocio", "d": "Qué vendes, qué entra en el paquete y qué queda afuera. Al final tienes una frase para presentarlo sin vueltas.", "tema": "El sistema para vender IA", "min": 9, "fichaNombre": "El paquete base", "ficha": [["Qué es", "Un servicio cerrado: dejas Claude armado con el conocimiento, el tono y las herramientas de un negocio, y le enseñas a usarlo."], ["Necesitas", "Saber usar proyectos, skills y conectores de Claude. No hace falta programar."], ["Qué incluye", "Proyecto con el conocimiento del negocio, 3 skills, conectores de mail, calendario y archivos, 1 automatización y una capacitación."], ["Qué no hace", "No reemplaza personas, no atiende solo a los clientes del negocio y no es un desarrollo a medida."]], "secciones": [{"h": "Por qué un paquete y no \"hago lo que necesites\"", "p": ["Cuando ofreces \"te ayudo con IA\", el dueño del negocio no sabe qué te está comprando, tú no sabes cuánto cobrar y cada cliente termina siendo un proyecto distinto. Así es muy difícil sostenerlo.", "Un paquete con piezas fijas resuelve las tres cosas: el cliente entiende qué recibe, tú sabes cuántas horas te lleva y cada instalación nueva sale mejor que la anterior porque repites el mismo camino.", "Este sistema base tiene nueve módulos. Este primero define qué vendes. Los demás te llevan desde elegir a quién venderle hasta el contrato."]}, {"h": "Qué incluye el paquete", "lista": ["Un proyecto con el conocimiento del negocio: precios, servicios, preguntas frecuentes, procesos y políticas cargados en un Proyecto de Claude, con instrucciones para que responda como el negocio. Es lo que explica la guía \"El segundo cerebro de tu negocio en un Proyecto de Claude\".", "Skill de marca: tono, colores y reglas de comunicación para que todo lo que salga tenga la cara del negocio. Se arma como en \"Skill de tu marca\".", "Skill de presupuestos: arma presupuestos con el formato, los precios y las condiciones del negocio. Base: \"Skill de presupuestos para tu negocio\".", "Skill de respuestas: borradores de respuesta a clientes con su tono y sus políticas, marcando lo que no sabe. Base: \"Skill para responder clientes con tu tono y tus políticas\".", "Conectores: Gmail, Google Calendar y Google Drive conectados a la cuenta del negocio, para que Claude pueda leer mails, armar borradores, ver la agenda y buscar archivos.", "Una automatización: una tarea que se repite y que Claude hace sola con una frecuencia fija, por ejemplo un resumen diario de los mails pendientes.", "Capacitación: una sesión corta con el equipo, un video grabado y un documento de entrega."]}, {"h": "Qué no incluye (y conviene escribirlo)", "p": ["Lo que no escribes, el cliente lo da por incluido. Pon esta lista en la propuesta y en el acuerdo."], "lista": ["Agentes que hablan solos con los clientes: un agente de WhatsApp que atiende y agenda es otro proyecto, con otras reglas y otros costos. Está explicado en \"Agente de WhatsApp que atiende y agenda turnos\".", "Desarrollo a medida: páginas web, apps o integraciones con sistemas propios del negocio.", "Las suscripciones: el plan de Claude y cualquier otra herramienta las paga el cliente, a su nombre.", "Cargar datos que no existen: si el negocio no tiene escritos sus precios o sus procesos, ordenarlos es trabajo extra o es tarea del cliente antes de empezar.", "Resultados garantizados: vendes una herramienta instalada y enseñada. Cuánto la use el equipo depende del equipo."], "aviso": "No prometas ahorros de horas ni ventas extra antes de instalar. Puedes mostrar qué tareas va a cubrir y medir después, con sus datos."}, {"h": "Cómo funciona cada pieza, en corto", "p": ["Proyectos: son espacios con su propio historial, una base de conocimiento con documentos y sus propias instrucciones. Están en todos los planes. Para compartir un proyecto con otras personas de la empresa hace falta un plan Team o Enterprise.", "Skills: necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings aparece como Create and edit files), en Settings → Capabilities. En Team y Enterprise la habilita el owner de la organización, desde Organization settings → Plugins & skills. Las personalizadas se suben como un archivo .zip desde Customize > Skills. En planes Team se pueden compartir con personas del equipo.", "Conectores de Google: cada persona conecta su propia cuenta de Google y Claude solo ve lo que esa cuenta ya puede ver. Por defecto, cada acción que Claude hace en nombre de la persona necesita su aprobación, como enviar un mail o compartir, mover o mandar a la papelera archivos de Drive. En Team y Enterprise, un Owner o Primary Owner tiene que habilitar estos conectores para la organización antes de que cada persona conecte su cuenta. Y Gmail no le deja leer el contenido de los adjuntos, solo sus datos.", "Tareas programadas: en los planes pagos (Pro, Max, Ultra, Team y Enterprise) se puede programar una tarea en Cowork, desde Scheduled y New task, para que corra cada hora, cada día, cada semana o en días hábiles. Corre de forma remota aunque la computadora esté dormida o la app de escritorio cerrada. Si necesita archivos o apps de la computadora, corre solo ahí."], "aviso": "Estas funciones cambian seguido. Antes de cada venta, revisa en la ayuda oficial de Claude que todo siga igual en el plan que va a contratar el cliente."}, {"h": "Ponle nombre y arma tu frase", "p": ["El nombre tiene que decir qué recibe el cliente, no qué tecnología usas. \"Claude instalado en tu negocio\", \"Asistente de IA para tu equipo\" o \"Tu negocio en Claude\" funcionan mejor que nombres raros.", "La frase de presentación sigue esta forma: \"Dejo [QUÉ] en tu [TIPO DE NEGOCIO] para que [QUÉ TAREA] te lleve menos tiempo, y te enseño a usarlo.\" Si un dueño no la entiende en una lectura, achícala."], "prompts": [{"t": "Nombre y frase de la oferta", "c": "Vendo un servicio que deja Claude instalado en negocios de [RUBRO] de [CIUDAD O PAÍS]. Incluye: un proyecto con el conocimiento del negocio, 3 skills (marca, presupuestos y respuestas a clientes), conectores de Gmail, Google Calendar y Google Drive, una automatización y una capacitación.\nNo incluye: agentes que hablen solos con clientes, desarrollo a medida ni las suscripciones.\n\n1. Propón 8 nombres para el servicio. Que digan qué recibe el cliente, sin palabras técnicas.\n2. Escribe 5 frases de presentación de una línea con esta forma: \"Dejo [qué] en tu [negocio] para que [tarea] te lleve menos tiempo, y te enseño a usarlo.\"\n3. Para cada frase, dime qué tarea concreta del rubro conviene nombrar.\nNo prometas cifras de ahorro ni de ventas."}]}], "faq": [{"q": "¿Tengo que saber programar?", "a": "No. Todo el paquete se arma desde la app de Claude: proyectos, skills subidas como .zip, conectores y tareas programadas. Lo que sí necesitas es haberlo armado primero para ti."}, {"q": "¿Puedo sacar o sumar piezas?", "a": "Sí, pero mantén un paquete base fijo y cotiza aparte los extras. Si cada cliente arma su combinación, pierdes lo que hace replicable al sistema."}, {"q": "¿Y si el cliente ya usa otra IA?", "a": "Cuéntale qué incluye tu paquete y qué no. Lo que vendes no es la herramienta sola: es el conocimiento del negocio cargado, las skills armadas y el equipo enseñado."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/9266767-what-is-the-team-plan", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/9519189-project-visibility-and-sharing"], "ejemplo": {"titulo": "Ejemplo resuelto: armar la oferta para estudios contables chicos", "negocio": "Ejemplo inventado: una freelancer de marketing de Asunción, Paraguay, que usa Claude todos los días para su trabajo. Quiere vender el paquete base a estudios contables chicos de su ciudad, de dos a seis personas, que atienden consultas de clientes por mail todo el mes.", "punto_de_partida": "Cuando le preguntaban qué hacía con IA, contestaba \"de todo un poco\" y cada charla terminaba en un pedido distinto. No tenía una lista de qué entraba y qué no.", "pasos": ["Antes de ofrecer nada, armó el paquete para su propio negocio: un Proyecto con sus servicios y precios, las tres skills, los conectores de Google y una tarea programada. Así supo cuánto tiempo le lleva cada pieza.", "Copió la ficha de la oferta del kit y completó las siete piezas pensando en un estudio contable: la skill de respuestas cubre consultas sobre vencimientos y documentación, y la de presupuestos usa los honorarios del estudio.", "Escribió la lista de qué no incluye sin suavizarla. Sumó una línea propia del rubro: Claude no presenta declaraciones ni opina sobre casos impositivos; los borradores los revisa un contador.", "Eligió la automatización fija del paquete: un resumen de mails de clientes pendientes de respuesta, de lunes a viernes a primera hora, que no envía nada.", "Pasó la checklist del kit con lo que sabía de su primer prospecto. Detectó que el estudio quería que las cuatro personas usaran el mismo Proyecto, así que en la ficha puso que hace falta plan Team, y que su Google era Workspace administrado por un sobrino del dueño: lo anotó como contacto necesario.", "Usó el prompt de nombre y frase de la guía con el rubro y la ciudad. De las opciones eligió \"Tu estudio en Claude\" y la frase: Dejo Claude armado en tu estudio para que responder consultas de clientes te lleve menos tiempo, y te enseño a usarlo.", "Le leyó la frase a un contador conocido sin explicarle nada antes. La entendió en una lectura, así que la dejó. Le cambió la palabra \"armado\" por \"instalado\" porque él la repitió así.", "Definió los extras que cotiza aparte (una cuarta skill, una segunda automatización, capacitar a más personas) y los anotó al final de la ficha."], "resultado": "Quedó una ficha de una página con la frase, las siete piezas, lo que no incluye, lo que necesita del cliente y los pasos de trabajo, más una checklist para confirmar el plan y las cuentas antes de cada propuesta. Cuando le preguntan qué hace, ahora responde con la frase y manda la ficha."}, "si_falla": [{"sintoma": "El cliente quiere que todo el equipo use el mismo Proyecto y no aparece la opción de compartirlo.", "solucion": "Compartir proyectos está solo en Team y Enterprise. Si el cliente está en Pro o Max, o pasa a Team, o cada persona usa su propia cuenta y el Proyecto se arma en la cuenta de quien más lo usa. Déjalo definido antes de la propuesta: cambia el plan que tiene que pagar."}, {"sintoma": "En la cuenta del cliente no aparece Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files) en Settings → Capabilities. Si la cuenta es Team o Enterprise y la opción está bloqueada, la tiene que habilitar el owner en Organization settings → Plugins & skills. Conviene pedírselo antes del día de instalación."}, {"sintoma": "Al conectar Gmail o Drive aparece un aviso de acceso bloqueado por el administrador de la institución.", "solucion": "La cuenta de Google es Workspace y el admin tiene que aprobar a Claude como app de confianza en la consola de Google. Si la cuenta de Claude es Team o Enterprise, además un Owner tiene que habilitar los conectores de Google para la organización. Pide el contacto del admin en la llamada de diagnóstico."}, {"sintoma": "El cliente esperaba que Claude leyera los PDF que le mandan por mail.", "solucion": "El conector de Gmail no lee el contenido de los adjuntos, solo sus datos. Muéstralo en la capacitación: para trabajar un adjunto, se descarga y se sube al chat. Escríbelo en la ficha para que no se tome como una falla del servicio."}, {"sintoma": "Después de la entrega, el cliente pide \"que también conteste solo por WhatsApp\" como si fuera parte del paquete.", "solucion": "Vuelve a la lista de qué no incluye que firmó o aceptó. Un agente que habla solo con clientes es otro proyecto: cotízalo aparte, con su propio alcance. Si la lista no estaba escrita, este es el momento de agregarla a tu plantilla para el próximo cliente."}], "kit": [{"archivo": "ficha-oferta-paquete-base-claude.md", "que_es": "La ficha de una página del paquete base: frase, qué incluye, qué no incluye, qué necesitas del cliente, pasos y precio. Sirve para mandar después de una charla y como texto de alcance para la propuesta.", "contenido": "# [NOMBRE DEL SERVICIO]: ficha de la oferta\n\nUsa este archivo de dos formas: como hoja de una página para mandar después de una charla, y como texto base para las secciones de alcance de la propuesta y del acuerdo. Completa los corchetes y borra lo que no aplique.\n\n---\n\n## Qué es\n\n[FRASE DE PRESENTACIÓN. Ejemplo de forma: Dejo Claude armado en tu [TIPO DE NEGOCIO] para que [TAREA CONCRETA] te lleve menos tiempo, y te enseño a usarlo.]\n\nEs un servicio cerrado: las piezas son siempre las mismas y se adaptan a tu negocio. Al terminar, todo queda en tu cuenta de Claude y a tu nombre.\n\n## Qué incluye\n\n1. **Proyecto con el conocimiento del negocio.** Cargo en un Proyecto de Claude tus precios, servicios, preguntas frecuentes, procesos y políticas, con instrucciones para que responda como tu negocio.\n2. **Skill de marca.** Tono, palabras que sí y que no, y reglas de comunicación, para que lo que salga tenga la cara de tu negocio.\n3. **Skill de presupuestos.** Arma presupuestos con tu formato, tus precios y tus condiciones. Los revisa una persona antes de mandarlos.\n4. **Skill de respuestas.** Borradores de respuesta a clientes con tu tono y tus políticas, que marcan lo que Claude no sabe en vez de inventarlo.\n5. **Conectores de Google.** Gmail, Google Calendar y Google Drive conectados a la cuenta del negocio, para que Claude lea mails, arme borradores, vea la agenda y busque archivos. Por defecto, cada acción que Claude hace en tu nombre (por ejemplo, enviar un mail) te pide aprobación.\n6. **Una automatización.** Una tarea programada que se repite sola con frecuencia fija. La que elegimos: [EJEMPLO: resumen de mails pendientes de lunes a viernes a primera hora].\n7. **Capacitación.** Una sesión de [DURACIÓN] con [QUIÉNES DEL EQUIPO], un video grabado y un documento de entrega con lo que quedó armado y cómo se usa.\n\n## Qué no incluye\n\n- Agentes que hablan solos con tus clientes (por ejemplo, un agente de WhatsApp que atiende y agenda). Es otro proyecto, con otras reglas y otros costos.\n- Desarrollo a medida: páginas web, apps o integraciones con sistemas propios.\n- Las suscripciones. El plan de Claude y cualquier otra herramienta las pagas tú, a tu nombre.\n- Ordenar información que hoy no está escrita. Si tus precios o procesos no están en ningún lado, ordenarlos es trabajo aparte o tarea tuya antes de empezar.\n- Resultados garantizados. Entrego una herramienta instalada y enseñada; cuánto la usa el equipo depende del equipo.\n- Cambios después de la entrega, salvo lo que diga la sección de soporte.\n\n## Qué necesito de ti\n\n- Una cuenta de Claude del negocio en un plan pago, porque la automatización usa tareas programadas, que están solo en planes pagos. Si van a compartir el Proyecto entre varias personas, plan Team o Enterprise.\n- La cuenta de Google del negocio. Si es Google Workspace, el contacto de quien la administra.\n- Precios, servicios, preguntas frecuentes, políticas y 3 a 5 ejemplos de presupuestos y respuestas que te gusten.\n- Una persona del equipo que pruebe todo durante la semana de prueba.\n\n## Cómo trabajamos\n\n1. Charla de diagnóstico y recolección de materiales.\n2. Armado del Proyecto, las skills y los conectores.\n3. Semana de prueba con el equipo, ajustando lo que corrijan.\n4. Automatización y capacitación.\n5. Entrega: documento, video y repaso final.\n\nPlazo estimado: [PLAZO]. Soporte después de la entrega: [QUÉ INCLUYE Y POR CUÁNTO TIEMPO].\n\n## Precio\n\n[PRECIO Y FORMA DE PAGO]. Los extras se cotizan aparte: [LISTA DE EXTRAS QUE OFRECES].\n"}, {"archivo": "checklist-verificar-plan-y-cuentas-antes-de-vender.md", "que_es": "Checklist para pasar antes de cada propuesta e instalación: plan del cliente, skills, conectores de Google, automatización y lo que tiene que quedar escrito, con qué artículo de la ayuda oficial buscar para confirmar cada punto.", "contenido": "# Checklist antes de vender (y antes de cada instalación)\n\nLas funciones de Claude cambian seguido. Pasa esta lista antes de mandar una propuesta y otra vez antes de empezar a instalar. Cada punto dice qué buscar en la ayuda oficial (support.claude.com) para confirmarlo el día que la usas.\n\n## 1. Plan del cliente\n- [ ] ¿Qué plan va a contratar el cliente? [FREE / PRO / MAX / TEAM / ENTERPRISE]\n- [ ] Tareas programadas: están solo en planes pagos. Si el cliente piensa quedarse en Free, la automatización no entra. Buscar: \"Schedule recurring tasks in Claude Cowork\".\n- [ ] Compartir el Proyecto con varias personas: solo Team o Enterprise. Si es Pro o Max, cada persona trabaja en su propia cuenta y el Proyecto no se comparte. Buscar: \"Project visibility and sharing\".\n- [ ] Proyectos en Free: máximo cinco. Buscar: \"What are projects\".\n\n## 2. Skills\n- [ ] En la cuenta del cliente está prendida Code execution and file creation (en el diseño nuevo de Settings: Create and edit files), en Settings → Capabilities.\n- [ ] En Team o Enterprise, el owner la habilitó en Organization settings → Plugins & skills, y sabe que puede compartir las skills con el equipo.\n- [ ] Cada skill va como ZIP con su carpeta adentro, y la carpeta se llama igual que el name del SKILL.md. Buscar: \"Use skills in Claude\".\n\n## 3. Conectores de Google\n- [ ] ¿La cuenta de Google es personal o Google Workspace? Si es Workspace: ¿quién es el admin? Puede tener que aprobar a Claude como app de confianza.\n- [ ] En Team o Enterprise, un Owner o Primary Owner habilita los conectores para la organización antes de que cada persona conecte su cuenta.\n- [ ] El cliente sabe que Claude no lee el contenido de los adjuntos de Gmail (solo sus datos), y que por defecto le pide aprobación antes de enviar, compartir, mover o mandar a la papelera.\n- Buscar: \"Use Google Workspace connectors\".\n\n## 4. Automatización\n- [ ] Elegimos una sola tarea, que no envía nada sin revisión: [TAREA].\n- [ ] Frecuencia posible: cada hora, cada día, cada semana, días hábiles o manual.\n- [ ] La tarea no necesita archivos ni apps de la computadora (si los necesita, solo corre con la computadora disponible).\n- [ ] Probé el prompt de la tarea a mano en un chat antes de programarlo.\n\n## 5. Lo que queda escrito en la propuesta\n- [ ] Lista de qué incluye y qué no incluye (ficha de la oferta).\n- [ ] Quién paga las suscripciones: el cliente, a su nombre.\n- [ ] Ninguna promesa de horas ahorradas ni de ventas.\n- [ ] Fecha en que revisé esta checklist: [AAAA-MM-DD]\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

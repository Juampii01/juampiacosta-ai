<script>var GUIA = {"slug": "sistema-base-modulo-1-la-oferta", "t": "Módulo 1 · La oferta: Claude instalado en tu negocio", "d": "Qué vendés, qué entra en el paquete y qué queda afuera. Al final tenés una frase para presentarlo sin vueltas.", "tema": "El sistema para vender IA", "min": 9, "fichaNombre": "El paquete base", "ficha": [["Qué es", "Un servicio cerrado: dejás Claude armado con el conocimiento, el tono y las herramientas de un negocio, y le enseñás a usarlo."], ["Necesitás", "Saber usar proyectos, skills y conectores de Claude. No hace falta programar."], ["Qué incluye", "Proyecto con el conocimiento del negocio, 3 skills, conectores de mail, calendario y archivos, 1 automatización y una capacitación."], ["Qué no hace", "No reemplaza personas, no atiende solo a los clientes del negocio y no es un desarrollo a medida."]], "secciones": [{"h": "Por qué un paquete y no \"hago lo que necesites\"", "p": ["Cuando ofrecés \"te ayudo con IA\", el dueño del negocio no sabe qué te está comprando, vos no sabés cuánto cobrar y cada cliente termina siendo un proyecto distinto. Así es muy difícil sostenerlo.", "Un paquete con piezas fijas resuelve las tres cosas: el cliente entiende qué recibe, vos sabés cuántas horas te lleva y cada instalación nueva sale mejor que la anterior porque repetís el mismo camino.", "Este sistema base tiene nueve módulos. Este primero define qué vendés. Los demás te llevan desde elegir a quién venderle hasta el contrato."]}, {"h": "Qué incluye el paquete", "lista": ["Un proyecto con el conocimiento del negocio: precios, servicios, preguntas frecuentes, procesos y políticas cargados en un Proyecto de Claude, con instrucciones para que responda como el negocio. Es lo que explica la guía \"El segundo cerebro de tu negocio en un Proyecto de Claude\".", "Skill de marca: tono, colores y reglas de comunicación para que todo lo que salga tenga la cara del negocio. Se arma como en \"Skill de tu marca\".", "Skill de presupuestos: arma presupuestos con el formato, los precios y las condiciones del negocio. Base: \"Skill de presupuestos para tu negocio\".", "Skill de respuestas: borradores de respuesta a clientes con su tono y sus políticas, marcando lo que no sabe. Base: \"Skill para responder clientes con tu tono y tus políticas\".", "Conectores: Gmail, Google Calendar y Google Drive conectados a la cuenta del negocio, para que Claude pueda leer mails, armar borradores, ver la agenda y buscar archivos.", "Una automatización: una tarea que se repite y que Claude hace sola con una frecuencia fija, por ejemplo un resumen diario de los mails pendientes.", "Capacitación: una sesión corta con el equipo, un video grabado y un documento de entrega."]}, {"h": "Qué no incluye (y conviene escribirlo)", "p": ["Lo que no escribís, el cliente lo da por incluido. Poné esta lista en la propuesta y en el acuerdo."], "lista": ["Agentes que hablan solos con los clientes: un agente de WhatsApp que atiende y agenda es otro proyecto, con otras reglas y otros costos. Está explicado en \"Agente de WhatsApp que atiende y agenda turnos\".", "Desarrollo a medida: páginas web, apps o integraciones con sistemas propios del negocio.", "Las suscripciones: el plan de Claude y cualquier otra herramienta las paga el cliente, a su nombre.", "Cargar datos que no existen: si el negocio no tiene escritos sus precios o sus procesos, ordenarlos es trabajo extra o es tarea del cliente antes de empezar.", "Resultados garantizados: vendés una herramienta instalada y enseñada. Cuánto la use el equipo depende del equipo."], "aviso": "No prometas ahorros de horas ni ventas extra antes de instalar. Podés mostrar qué tareas va a cubrir y medir después, con sus datos."}, {"h": "Cómo funciona cada pieza, en corto", "p": ["Proyectos: son espacios con su propio historial, una base de conocimiento con documentos y sus propias instrucciones. Están en todos los planes. Para compartir un proyecto con otras personas de la empresa hace falta un plan Team o Enterprise.", "Skills: necesitan que esté activada la ejecución de código y creación de archivos. Las personalizadas se suben como un archivo .zip desde Customize > Skills. En planes Team se pueden compartir con personas del equipo.", "Conectores de Google: cada persona conecta su propia cuenta de Google y Claude solo ve lo que esa cuenta ya puede ver. Por defecto, Claude pide permiso antes de enviar un mail o de compartir, mover o borrar archivos de Drive.", "Tareas programadas: en los planes pagos se puede programar una tarea en Cowork para que corra cada hora, cada día, cada semana o en días hábiles, y corre aunque la compu esté apagada si no necesita archivos locales."], "aviso": "Estas funciones cambian seguido. Antes de cada venta, revisá en la ayuda oficial de Claude que todo siga igual en el plan que va a contratar el cliente."}, {"h": "Ponele nombre y armá tu frase", "p": ["El nombre tiene que decir qué recibe el cliente, no qué tecnología usás. \"Claude instalado en tu negocio\", \"Asistente de IA para tu equipo\" o \"Tu negocio en Claude\" funcionan mejor que nombres raros.", "La frase de presentación sigue esta forma: \"Dejo [QUÉ] en tu [TIPO DE NEGOCIO] para que [QUÉ TAREA] te lleve menos tiempo, y te enseño a usarlo.\" Si un dueño no la entiende en una lectura, achicala."], "prompts": [{"t": "Nombre y frase de la oferta", "c": "Vendo un servicio que deja Claude instalado en negocios de [RUBRO] de [CIUDAD O PAÍS]. Incluye: un proyecto con el conocimiento del negocio, 3 skills (marca, presupuestos y respuestas a clientes), conectores de Gmail, Google Calendar y Google Drive, una automatización y una capacitación.\nNo incluye: agentes que hablen solos con clientes, desarrollo a medida ni las suscripciones.\n\n1. Proponé 8 nombres para el servicio. Que digan qué recibe el cliente, sin palabras técnicas.\n2. Escribí 5 frases de presentación de una línea con esta forma: \"Dejo [qué] en tu [negocio] para que [tarea] te lleve menos tiempo, y te enseño a usarlo.\"\n3. Para cada frase, decime qué tarea concreta del rubro conviene nombrar.\nNo prometas cifras de ahorro ni de ventas."}]}], "faq": [{"q": "¿Tengo que saber programar?", "a": "No. Todo el paquete se arma desde la app de Claude: proyectos, skills subidas como .zip, conectores y tareas programadas. Lo que sí necesitás es haberlo armado primero para vos."}, {"q": "¿Puedo sacar o sumar piezas?", "a": "Sí, pero mantené un paquete base fijo y cotizá aparte los extras. Si cada cliente arma su combinación, perdés lo que hace replicable al sistema."}, {"q": "¿Y si el cliente ya usa otra IA?", "a": "Contale qué incluye tu paquete y qué no. Lo que vendés no es la herramienta sola: es el conocimiento del negocio cargado, las skills armadas y el equipo enseñado."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/9266767-what-is-the-team-plan", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"], "cat": "sistema-base", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-base-modulo-8-mantenimiento-mensual", "t": "Módulo 8 · El mantenimiento mensual y cómo mostrar su valor", "d": "Qué incluye el mensual, una rutina de revisión que puedes repetir con cada cliente, un reporte que muestra lo que se hizo y cuándo tiene sentido subir el precio.", "tema": "El sistema para vender IA", "min": 9, "secciones": [{"h": "Por qué existe el mensual", "p": ["El negocio cambia: suben los precios, aparece un servicio nuevo, cambia una política. Si nadie actualiza el proyecto, en tres meses Claude responde con datos viejos y el equipo deja de confiar.", "Las herramientas también cambian. Las funciones de Claude se actualizan seguido y lo que hoy se configura de una forma mañana puede estar en otro lado. El mensual cubre ese trabajo de mantener todo al día.", "Cuándo ofrecerlo: en la propuesta va solo una línea (\"planes de mantenimiento desde X\"). Lo ofreces de verdad cuando el sistema ya funciona y el cliente pide su primer cambio: en ese momento ve el valor y está contento de pagarlo. Lo que pide después del pago final ya es mantenimiento, no desarrollo."]}, {"h": "Qué incluye (escríbelo así)", "lista": ["Revisión mensual: probar las skills y la automatización con casos nuevos y revisar que los documentos estén al día.", "Ajustes: corregir instrucciones, documentos y skills cuando algo responde mal o cambió en el negocio.", "Mejoras chicas: una cantidad fija por mes (por ejemplo, hasta dos cambios chicos o una skill nueva sencilla). Lo que pase de ahí se cotiza aparte.", "Reporte: un resumen corto de lo que se hizo y lo que se ve que falta.", "Soporte: un canal y un tiempo de respuesta acordados (por ejemplo, en el día hábil siguiente).", "Qué no incluye: rehacer el sistema, capacitar a personas nuevas cada mes o proyectos nuevos. Esos son extras."]}, {"h": "La rutina de cada mes", "pasos": ["Pídele al cliente, una semana antes, qué cambió: precios, servicios, políticas, personas del equipo.", "Pídele tres casos reales del mes que salieron bien y tres que salieron mal o le costaron.", "Actualiza los documentos del proyecto y vuelve a probar las skills con esos casos.", "Revisa que los conectores sigan conectados (en Customize → Connectors; si alguno falla al autenticar, desconéctalo y vuelve a conectarlo desde ahí) y que la tarea programada haya corrido: en Scheduled, en la barra lateral, ves las corridas pasadas y cada una se abre como su propia sesión.", "Revisa accesos: en cada proyecto, el botón Share a la derecha del nombre muestra quién tiene acceso. A quien ya no está en el equipo, clic en su rol y Remove access. Si el dueño va a sacar a alguien de la organización, antes esa persona tiene que compartir sus proyectos privados (Can edit para alguien del equipo o para toda la organización): los proyectos privados de un usuario removido dejan de estar accesibles para los demás.", "Arma el reporte con el prompt de abajo y mándalo."]}, {"h": "Cómo reportar el valor sin inventarlo", "p": ["El reporte muestra lo que hiciste y lo que se puede medir. No inventes horas ahorradas. Si quieres mostrar ahorro, mídelo con el cliente: cuántos presupuestos armaron con la skill este mes y cuánto tardaban antes, según lo que anotaron en el diagnóstico.", "Un buen reporte tiene cinco partes: qué se usó, qué se ajustó, qué problemas aparecieron, qué se propone para el mes que viene y una pregunta para el cliente."], "prompts": [{"t": "Reporte mensual", "c": "Arma el reporte mensual de mantenimiento para [NEGOCIO], mes de [MES].\nDatos:\n- Uso que me contó el cliente: [EJ: CANTIDAD DE PRESUPUESTOS O RESPUESTAS HECHOS CON CLAUDE, SI LO SABE]\n- Cómo era antes, según el diagnóstico: [DATO DEL MÓDULO 4]\n- Ajustes que hice: [LISTA]\n- Problemas que aparecieron y cómo se resolvieron: [LISTA]\n- Lo que veo que falta o se podría sumar: [LISTA]\n\nFormato: máximo una página, en voseo, con secciones Qué se usó, Qué ajustamos, Qué problemas hubo, Qué propongo para el mes que viene, Una pregunta para ti.\nSi comparas con el antes, muestra la cuenta y aclárala como estimación. No inventes números que no te pasé."}]}, {"h": "Cuándo subir el precio", "lista": ["Cuando el alcance creció: si cada mes haces más de lo acordado, o ofreces más mejoras de las que entran, o lo cobras aparte o subes el mensual.", "Cuando tu paquete mejoró: para clientes nuevos, si sumaste piezas o ya tienes casos que mostrar.", "Cuando cambian tus costos: si tu valor hora cambió, revisa la fórmula del Módulo 5.", "Cómo hacerlo: avisa por escrito con anticipación (por ejemplo, 30 días), explica qué cambia y respeta lo que firmaste. Nunca en medio de un período ya pagado.", "Cuándo no: si el cliente casi no lo usa. Ahí primero resuelve por qué, o propón bajar el alcance."]}], "faq": [{"q": "¿Y si el cliente quiere cortar el mensual?", "a": "Que pueda hacerlo con un aviso simple. Todo queda en sus cuentas y sigue funcionando; solo deja de tener quién lo mantenga. Antes de sacarte, comparte con alguien del equipo (Can edit) los proyectos que hayas creado tú y sube las skills a una cuenta del negocio: si te sacan de la organización con proyectos privados a tu nombre, el resto deja de verlos. Después saca tus accesos ese mismo día."}, {"q": "¿Puedo ofrecer el mantenimiento sin la instalación?", "a": "Sí, a negocios que ya usan Claude. Arranca con una revisión como la del Módulo 6 para saber qué hay antes de comprometerte."}, {"q": "¿Qué hago si el cliente no me manda los casos del mes?", "a": "Revisa igual con casos que inventes tú a partir de sus documentos y dilo en el reporte. Si pasa varios meses, háblalo: puede que no lo estén usando."}], "fuentes": ["https://support.claude.com/en/articles/11176164-use-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/9519189-manage-project-visibility-and-sharing", "https://support.claude.com/en/articles/12053672-what-happens-to-a-user-s-data-when-they-are-removed-from-a-team-or-enterprise-organization", "https://support.claude.com/en/articles/9547008"], "ejemplo": {"titulo": "Ejemplo resuelto: el primer mes de mantenimiento de un taller de aberturas", "negocio": "Ejemplo inventado: un taller de aberturas de aluminio y PVC en Rosario, con el dueño, una administrativa que arma los presupuestos y cuatro personas en producción e instalación. Tienen Claude en plan Team, con un proyecto de presupuestos, una skill que arma el presupuesto a partir de medidas y una tarea programada que cada mañana deja borradores de seguimiento para presupuestos sin respuesta.", "punto_de_partida": "La instalación se entregó hace un mes. En el diagnóstico la administrativa anotó cuánto tardaba en armar un presupuesto a mano. Ahora toca la primera revisión mensual y el instalador no quiere mandar un reporte que diga solo \"todo bien\".", "pasos": ["Una semana antes mandó el mensaje 1 del kit. El dueño contestó que había subido el aluminio, que dejaron de hacer mosquiteros a medida y que una persona de producción se había ido.", "La administrativa le reenvió tres presupuestos que salieron bien y tres que tuvo que corregir: en dos, Claude había incluido mosquiteros, y en uno había usado el precio viejo del perfil.", "Abrió el proyecto, reemplazó la lista de precios y borró la versión anterior, para que no quedaran dos listas. En las instrucciones sacó los mosquiteros a medida y sumó la frase: \"si el cliente pide mosquitero, avisa que no lo hacemos y no lo cotices\".", "Volvió a probar la skill con los seis casos. Los dos de mosquiteros ahora salían con el aviso, y el del perfil con el precio nuevo.", "En Customize → Connectors vio que Gmail figuraba conectado, pero la prueba de buscar mails de presupuestos falló. Lo desconectó y lo volvió a conectar desde ahí, y la prueba anduvo.", "En Scheduled revisó las corridas del mes de la tarea de seguimiento. Abrió dos: dejaron borradores, pero uno usaba el precio viejo, así que lo anotó como problema ya resuelto con la lista nueva.", "En el proyecto, botón Share, vio que la persona que se fue seguía con Can view. Clic en su rol y Remove access. Le recordó al dueño que, si la saca de la organización, primero tiene que compartir cualquier proyecto privado que haya armado.", "Pegó sus notas en la skill reporte-mensual-mantenimiento. Como la administrativa le dio la cantidad de presupuestos del mes y el tiempo de antes estaba en el diagnóstico, el reporte mostró la cuenta aclarada como estimación con sus datos. La pregunta final fue si querían sumar los cerramientos de balcón a la skill.", "Mandó el reporte con el mensaje 3 del kit, en PDF adjunto, para que el dueño lo abriera desde el celular sin iniciar sesión en ningún lado."], "resultado": "El proyecto quedó con una sola lista de precios y sin el servicio que ya no hacen, la skill probada con casos reales del mes, Gmail reconectado, la tarea revisada corrida por corrida y los accesos al día. El dueño recibió una página que dice qué se hizo y por qué, con la cuenta de uso hecha con sus propios números y una decisión concreta para el mes que viene."}, "si_falla": [{"sintoma": "La tarea programada no dejó nada algunos días del mes.", "solucion": "Entra a Scheduled y fíjate si la tarea está en pausa; desde ahí la puedes reanudar o correr en el momento. Si la tarea usa archivos o apps de la computadora, solo corre con esa computadora disponible: pasa los archivos a Drive o a la cuenta de Claude para que pueda correr de forma remota. Abre la corrida de un día que falló para ver dónde se trabó."}, {"sintoma": "Un conector figura conectado pero Claude dice que no puede leer el mail o el archivo.", "solucion": "En Customize → Connectors desconéctalo y vuelve a conectarlo con la cuenta del negocio. En Team o Enterprise, confirma con el owner que el conector siga habilitado en Organization settings → Connectors: habilitarlo no da acceso solo, cada persona tiene que autenticarse."}, {"sintoma": "Claude sigue respondiendo con el precio o la política vieja aunque subiste el documento nuevo.", "solucion": "Casi siempre quedó la versión vieja en los archivos del proyecto o en las instrucciones. Borra el archivo anterior, busca el dato viejo en las instrucciones y en cada SKILL.md, y prueba en un chat nuevo dentro del proyecto."}, {"sintoma": "El dueño sacó de la organización a alguien que se fue y desapareció un proyecto que usaban.", "solucion": "Los proyectos privados de un usuario removido dejan de estar accesibles para los demás. Reármalo con tu copia de las instrucciones y los archivos (por eso conviene guardarlos también fuera de Claude, en el Drive del negocio). Para que no se repita: antes de cualquier baja, la persona comparte sus proyectos privados con Can edit, y si hace falta el Primary Owner exporta los datos de la organización antes de removerla."}, {"sintoma": "El cliente abre el link del reporte y le pide iniciar sesión.", "solucion": "La mayoría de los artifacts compartidos con \"Anyone with the link\" se abren sin cuenta, pero los Docs y algunos dashboards piden iniciar sesión. Si el reporte lo armaste como Doc, mándalo en PDF o pegado en el mail."}], "kit": [{"archivo": "reporte-mensual-mantenimiento/SKILL.md", "que_es": "Skill que arma el reporte mensual en cinco secciones a partir de tus notas, sin inventar horas ni ahorros. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: reporte-mensual-mantenimiento\ndescription: 'Arma el reporte mensual de mantenimiento de un sistema con Claude en un negocio: uso, ajustes, problemas y propuestas, desde notas sueltas y sin inventar horas ni ahorros. Úsala al cerrar el mes.'\n---\n\n# Reporte mensual de mantenimiento\n\nArmas el reporte que se le manda al dueño del negocio una vez por mes. El objetivo es que vea qué se hizo y qué conviene decidir, en una página.\n\n## Qué te tienen que pasar\n\nPide lo que falte antes de escribir. No completes con suposiciones.\n\n1. Nombre del negocio y mes.\n2. Uso del mes que contó el cliente (por ejemplo, cuántos presupuestos o respuestas armaron con Claude). Si no lo sabe, se escribe \"sin dato\".\n3. El dato de \"antes\" que quedó anotado en el diagnóstico (Módulo 4), si existe.\n4. Ajustes hechos: documentos actualizados, instrucciones cambiadas, skills corregidas.\n5. Problemas que aparecieron y cómo se resolvieron (o si siguen abiertos).\n6. Resultado de la revisión: conectores, tarea programada, accesos al proyecto.\n7. Mejoras usadas del cupo del mes y si algo quedó para cotizar aparte.\n\n## Cómo escribirlo\n\n- Voseo, frases cortas, sin jerga técnica. Si nombras un menú, usa el nombre que ve el cliente en pantalla.\n- Máximo una página.\n- Cinco secciones, en este orden:\n  1. **Qué se usó**: el uso que contó el cliente, tal cual.\n  2. **Qué ajustamos**: lista corta, cada ítem con el motivo (qué cambió en el negocio o qué respondía mal).\n  3. **Qué problemas hubo**: qué pasó, qué se hizo y si quedó resuelto.\n  4. **Qué propongo para el mes que viene**: máximo tres cosas. Marca cuáles entran en el mensual y cuáles se cotizan aparte.\n  5. **Una pregunta para ti**: una sola, concreta, que el dueño pueda contestar en un mensaje.\n- Al final, una línea con el estado de la revisión: conectores, tarea programada y accesos (OK o qué se encontró).\n\n## Reglas sobre números\n\n- Nunca inventes horas ahorradas, ventas ni porcentajes.\n- Si hay dato de uso y dato de antes, puedes mostrar la cuenta (con esta forma: \"[CANTIDAD] presupuestos este mes; en el diagnóstico contaron que cada uno llevaba [TIEMPO]\"), siempre aclarada como estimación hecha con sus datos.\n- Si falta alguno de los dos datos, no hagas la cuenta: escribe qué dato faltaría anotar el mes que viene para poder hacerla.\n\n## Si el mes vino flojo\n\nSi el cliente no mandó casos o casi no usó el sistema, dilo con claridad y sin culpa: qué se revisó igual (con casos armados a partir de sus documentos) y una propuesta para entender por qué no se usa. No lo maquilles.\n"}, {"archivo": "checklist-revision-mensual-claude.md", "que_es": "Checklist para repetir la revisión de cada mes en el mismo orden: documentos, skills, conectores, tarea programada, accesos y cupo de mejoras, con los menús donde se revisa cada cosa.", "contenido": "# Checklist de revisión mensual: sistema con Claude en un negocio\n\nCliente: ____________________   Mes: __________   Fecha de revisión: __________\n\nHazla siempre en el mismo orden. Marca cada punto y anota lo que encontraste: eso después va al reporte.\n\n## Una semana antes\n\n- [ ] Mandé el mensaje de pedido de cambios y casos del mes (plantilla aparte).\n- [ ] Recibe respuesta. Si no llegó, lo anoto para el reporte y sigo con casos armados por mí.\n\n## Documentos del proyecto\n\n- [ ] Precios, servicios y políticas al día según lo que mandó el cliente.\n- [ ] Saqué del proyecto las versiones viejas de cada documento (que no queden dos listas de precios distintas).\n- [ ] Las instrucciones del proyecto siguen diciendo lo mismo que el negocio hace hoy.\n\n## Skills\n\n- [ ] Probé cada skill con los tres casos que salieron bien y los tres que salieron mal.\n- [ ] Anoté qué respondió mal y qué cambié.\n- [ ] Si cambié un SKILL.md, volví a subir el ZIP y probé de nuevo.\n\n## Conectores\n\n- [ ] En Customize → Connectors, cada conector que usa el sistema figura conectado.\n- [ ] Hice una prueba real con cada uno (por ejemplo, \"busca los mails de ayer sobre presupuestos\").\n- [ ] Si alguno falla al autenticar: lo desconecté y lo volví a conectar desde Customize → Connectors.\n- [ ] En Team o Enterprise: el conector sigue habilitado en Organization settings → Connectors.\n\n## Tarea programada\n\n- [ ] En Scheduled (barra lateral) la tarea figura activa, no en pausa.\n- [ ] Revisé las corridas pasadas del mes: cada corrida es su propia sesión, la abrí y miré qué dejó.\n- [ ] Si la tarea necesita archivos o apps de la computadora, confirmé que esa computadora estuvo prendida y con la app abierta en los horarios de la tarea.\n\n## Accesos (Team o Enterprise)\n\n- [ ] En cada proyecto, botón Share a la derecha del nombre: la lista de personas coincide con el equipo actual.\n- [ ] A quien ya no está: clic en su rol y Remove access.\n- [ ] Antes de que el dueño saque a alguien de la organización: esa persona pasó sus proyectos privados a \"Can edit\" para alguien del equipo o los compartió con toda la organización. Si no, esos proyectos quedan inaccesibles.\n- [ ] Mis propios accesos siguen siendo los mínimos que necesito.\n\n## Mejoras del mes\n\n- [ ] Cambios chicos usados del cupo: ___ de ___.\n- [ ] Pedidos que pasan el cupo: los anoté para cotizar aparte, no los hice.\n\n## Cierre\n\n- [ ] Armé el reporte (skill reporte-mensual-mantenimiento o el prompt de la guía).\n- [ ] Lo mandé en un formato que el cliente abre sin vueltas (PDF, mail o link compartido).\n"}, {"archivo": "mensajes-mantenimiento-mensual.md", "que_es": "Seis mensajes listos para completar: pedido de cambios y casos, recordatorio, envío del reporte, pedido fuera de cupo, aviso de cambio de precio y baja del mensual.", "contenido": "# Mensajes del mantenimiento mensual\n\nPlantillas para copiar, completar los corchetes y mandar por mail o WhatsApp. Adapta el tono a cómo te hablas con cada cliente.\n\n## 1. Pedido de cambios y casos (una semana antes de la revisión)\n\nHola [NOMBRE]. La semana que viene hago la revisión mensual del sistema. Para que quede al día, cuéntame cuando puedas:\n\n1. ¿Cambió algo este mes? Precios, servicios, horarios, políticas o personas del equipo (alguien que entró o se fue).\n2. Tres casos del mes que salieron bien con Claude (puedes reenviarme el mensaje o pegarme lo que armó).\n3. Tres casos que salieron mal o te costaron: qué le pediste y qué te dio.\n4. Si lo sabes, más o menos cuántas veces lo usaron este mes para [TAREA PRINCIPAL].\n\nCon eso me alcanza. Si no tienes tiempo, mándame aunque sea el punto 1.\n\n## 2. Recordatorio (si no respondió en tres días)\n\nHola [NOMBRE], te recuerdo lo de la revisión del [FECHA]. Lo más importante es si cambió algún precio o política, así Claude no responde con datos viejos. Si no cambió nada, con un \"sin cambios\" me alcanza.\n\n## 3. Envío del reporte\n\nHola [NOMBRE]. Te dejo el reporte de [MES]: qué se usó, qué ajustamos, qué problemas hubo y qué propongo para el mes que viene. Al final hay una pregunta para ti. Si quieres lo vemos en una llamada de 15 minutos.\n\n[LINK O ADJUNTO]\n\n## 4. Pedido que pasa el cupo del mes\n\nHola [NOMBRE]. Lo que me pediste de [PEDIDO] es más grande que los cambios chicos que entran en el mensual (este mes ya usamos [X] de [Y]). Te lo cotizo aparte: [PRECIO Y PLAZO]. Si prefieres, lo dejamos para el mes que viene dentro del cupo.\n\n## 5. Aviso de cambio de precio (con anticipación, por escrito)\n\nHola [NOMBRE]. Te aviso con tiempo: a partir del [FECHA, AL MENOS UN PERÍODO COMPLETO DESPUÉS DE HOY] el mensual pasa de [PRECIO ACTUAL] a [PRECIO NUEVO].\n\nEl motivo: [ELIGE UNO Y CUÉNTALO EN UNA FRASE: el alcance creció (detalla qué) / sumamos [PIEZA] al paquete / cambiaron mis costos].\n\nLo que ya está pago no cambia. Si prefieres mantener el precio, podemos ajustar el alcance a [ALTERNATIVA]. Cualquier duda, lo hablamos.\n\n## 6. Cuando el cliente corta el mensual\n\nHola [NOMBRE]. Listo, queda dado de baja desde el [FECHA]. Todo sigue en tus cuentas y funcionando. Hoy hago esto:\n\n1. Te paso los proyectos y skills que armé a tu nombre o al de alguien de tu equipo.\n2. Saco mis accesos y te confirmo cuando esté.\n3. Te mando una nota corta con qué revisar cada mes si lo mantienen ustedes.\n\nGracias por la confianza. Si más adelante quieres retomar, avísame.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

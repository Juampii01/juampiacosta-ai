<script>var GUIA = {"slug": "markitdown-para-ahorrar-tokens", "fuentes": ["https://github.com/microsoft/markitdown", "https://github.com/microsoft/markitdown/tree/main/packages/markitdown-mcp", "https://docs.astral.sh/uv/getting-started/installation/", "https://modelcontextprotocol.io/quickstart/user", "https://modelcontextprotocol.io/docs/2026-07-28/develop/connect-local-servers.md", "https://support.claude.com/en/articles/10949351-getting-started-with-local-mcp-servers-on-claude-desktop"], "post": "TOKEN", "t": "MarkItDown: Claude lee tus archivos gastando menos", "d": "La herramienta gratis de Microsoft que convierte PDF, Word, Excel, PowerPoint y hasta videos de YouTube en texto limpio. Claude lo lee mejor y gasta menos.", "tema": "Gasta menos tokens", "min": 7, "fichaNombre": "markitdown-mcp", "ficha": [["Qué es", "Un servidor MCP que le da a Claude Desktop la herramienta convert_to_markdown."], ["Necesitas", "Claude Desktop y uv (un instalador de Python liviano). 5 minutos."], ["Qué no hace", "Con esta configuración no saca texto de PDF escaneados (fotos de páginas), porque el OCR necesita un complemento aparte. Tampoco conserva gráficos ni imágenes: si importan, manda el PDF a Claude."], ["Repo", "github.com/microsoft/markitdown"]], "secciones": [{"h": "1. Instala uv", "prompts": [{"t": "Windows (PowerShell)", "c": "powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\""}, {"t": "Mac (Terminal)", "c": "curl -LsSf https://astral.sh/uv/install.sh | sh"}], "p": ["Cierra la ventana, abre una nueva y escribe uv --version: si responde con un número, está listo."]}, {"h": "2. Prueba MarkItDown", "prompts": [{"t": "Prueba", "c": "uvx markitdown-mcp --help"}], "p": ["La primera vez tarda un rato porque descarga todo lo que necesita. Si ves un texto de ayuda que empieza con usage: markitdown-mcp, funciona."]}, {"h": "3. Conéctalo a Claude Desktop", "pasos": ["En Claude Desktop abre Settings (Configuración) desde el menú Claude de la barra de menú del sistema, no desde la configuración de tu cuenta. Ve a la pestaña Developer (Desarrollador) y toca Edit Config (Editar configuración). En el diseño nuevo de Settings esa sección puede aparecer dentro de Desktop app.", "Abre claude_desktop_config.json con el Bloc de notas o TextEdit.", "Si está vacío, reemplaza todo por el bloque de abajo. Si ya tenía servidores, suma solo \"markitdown\" junto a los demás.", "Guarda y cierra Claude Desktop por completo (Salir, no solo la ventana). Vuelve a abrirlo."], "prompts": [{"t": "claude_desktop_config.json", "c": "{\n  \"mcpServers\": {\n    \"markitdown\": {\n      \"command\": \"uvx\",\n      \"args\": [\"markitdown-mcp\"]\n    }\n  }\n}"}]}, {"h": "Cómo usarlo", "p": ["Pásale a Claude la ruta del archivo o un link y dile qué quieres."], "prompts": [{"t": "Ejemplo", "c": "Convierte [RUTA DEL ARCHIVO] a markdown y dime cuándo vence."}, {"t": "Para que lo use solo (en las instrucciones de un Proyecto)", "c": "Cuando te pase la ruta de un archivo o un link, conviértelo primero con la herramienta markitdown y trabaja sobre ese texto."}], "aviso": "El servidor puede leer cualquier archivo de tu usuario y también traer datos de internet. Úsalo solo en tu computadora y con archivos tuyos."}], "faq": [{"q": "No aparece markitdown en Claude", "a": "Cierra Claude Desktop por completo y ábrelo de nuevo. Revisa que el JSON no tenga comas de más."}, {"q": "Error \"spawn uvx ENOENT\"", "a": "Claude no encuentra uv: pon la ruta completa en \"command\". Para verla, en Mac escribe which uvx en la Terminal; en Windows, where.exe uvx en PowerShell (con .exe, porque en PowerShell where solo es otro comando). En Windows, escribe la ruta en el JSON con barras dobles (C:\\\\Users\\\\...)."}], "idea": [], "ejemplo": {"titulo": "Ejemplo resuelto: una distribuidora que lee las listas de sus proveedores sin subirlas enteras", "negocio": "Ejemplo inventado: una distribuidora de almacén en Santiago de Chile. Son el dueño y una administrativa, y compran a una docena de proveedores que mandan listas de precios en Excel y catálogos en PDF.", "punto_de_partida": "Para comparar precios, la administrativa subía a Claude cada Excel y cada PDF completo. Con varios archivos el chat se llenaba rápido y para los Excel tenía que tener prendida la ejecución de código.", "pasos": ["Instaló uv en Windows con el comando de PowerShell de la guía, cerró la ventana, abrió otra y comprobó con uv --version.", "Corrió uvx markitdown-mcp --help y esperó a que apareciera el texto de ayuda.", "Abrió Settings desde el menú de Claude Desktop, entró a Developer y tocó Edit Config. Pegó la versión A del archivo de configuración del kit, guardó y salió de Claude Desktop por completo.", "Al volver a abrir no aparecía la herramienta. En el log vio spawn uvx ENOENT. Corrió where.exe uvx en PowerShell, pegó esa ruta con barras dobles usando la versión B del kit y reinició.", "Tocó el + de la caja de texto, entró a Connectors y vio markitdown con convert_to_markdown.", "Subió la skill convertir-con-markitdown del kit en Customize → Skills y escribió: \"Convierte C:\\Users\\admin\\Documents\\proveedores\\lista-lacteos-noviembre.xlsx y ármame una tabla con código, producto y precio unitario\".", "Para comparar, pidió lo mismo con la lista de otro proveedor y le pidió a Claude que cruzara las dos tablas por producto. Un catálogo en PDF salió vacío: era escaneado. Ese lo adjuntó al chat directamente, como dice la skill."], "resultado": "Quedó MarkItDown conectado a Claude Desktop y una skill que convierte cada lista a texto antes de trabajar. Las listas en Excel y PDF con texto se leen sin adjuntarlas, y los escaneados van por el camino de siempre."}, "si_falla": [{"sintoma": "Aparece \"spawn uvx ENOENT\" o markitdown no figura en Connectors.", "solucion": "Claude Desktop no encuentra uvx. Busca la ruta con which uvx (Mac) o where.exe uvx (Windows, en PowerShell) y ponla completa en \"command\", con barras dobles en Windows. Sal de Claude Desktop por completo y ábrelo de nuevo. Si sigue, mira el archivo mcp-server-markitdown.log en ~/Library/Logs/Claude (Mac) o %APPDATA%\\Claude\\logs (Windows)."}, {"sintoma": "Después de editar la configuración, Claude Desktop no carga ningún servidor.", "solucion": "El JSON quedó mal escrito: casi siempre es una coma de más al final o una que falta entre dos servidores. Pégalo en un validador de JSON, corrígelo y reinicia. Si tenías otros servidores, fíjate que \"markitdown\" esté dentro de \"mcpServers\" y no afuera."}, {"sintoma": "La herramienta devuelve un error de que no puede leer el archivo.", "solucion": "La herramienta recibe una URI, no una ruta suelta. Pídele a Claude que use file:///C:/Users/... en Windows o file:///Users/... en Mac, con barras normales y %20 en lugar de los espacios. La skill del kit ya lo hace sola. Revisa también que el archivo exista y no esté abierto con una contraseña."}, {"sintoma": "Un PDF se convierte vacío o con muy poco texto.", "solucion": "Es un PDF escaneado: no tiene texto adentro, y con esta configuración MarkItDown no hace OCR. Adjúntalo al chat (en tramos de hasta 100 páginas para que Claude mire lo visual) o pásalo antes por un programa de OCR."}, {"sintoma": "uv --version dice que el comando no existe justo después de instalarlo.", "solucion": "El instalador agrega uv al PATH, pero la ventana que ya estaba abierta no se entera. Cierra la terminal o PowerShell, abre una nueva y prueba de nuevo. Si sigue sin andar, reinicia la sesión de tu usuario."}], "kit": [{"archivo": "configuracion-markitdown-claude-desktop.md", "que_es": "Las tres versiones del claude_desktop_config.json para MarkItDown (básica, con ruta completa para Mac y Windows, y sumada a otros servidores), con cómo comprobar que quedó y dónde mirar los logs.", "contenido": "# Configuración de MarkItDown para Claude Desktop\n\nTres versiones del archivo claude_desktop_config.json. Usa UNA sola.\nLo abres desde Settings → Developer → Edit Config en Claude Desktop (en el diseño nuevo, la sección puede figurar como Desktop app).\n\nDónde está el archivo:\n- Mac: ~/Library/Application Support/Claude/claude_desktop_config.json\n- Windows: %APPDATA%\\Claude\\claude_desktop_config.json\n\nDespués de guardar, sal de Claude Desktop por completo y vuelve a abrirlo.\n\n## Versión A: la básica\n\nSirve si uvx funciona desde Claude (en la mayoría de los casos).\n\n```json\n{\n  \"mcpServers\": {\n    \"markitdown\": {\n      \"command\": \"uvx\",\n      \"args\": [\"markitdown-mcp\"]\n    }\n  }\n}\n```\n\n## Versión B: con la ruta completa (si aparece \"spawn uvx ENOENT\")\n\n1. Busca dónde quedó uvx:\n   - Mac (Terminal): `which uvx`\n   - Windows (PowerShell): `where.exe uvx` (con .exe: en PowerShell, `where` solo hace otra cosa)\n2. Reemplaza RUTA por lo que te devolvió.\n\nMac (ejemplo de cómo se ve; usa tu usuario):\n```json\n{\n  \"mcpServers\": {\n    \"markitdown\": {\n      \"command\": \"/Users/TU_USUARIO/.local/bin/uvx\",\n      \"args\": [\"markitdown-mcp\"]\n    }\n  }\n}\n```\n\nWindows (las barras van dobles dentro del JSON):\n```json\n{\n  \"mcpServers\": {\n    \"markitdown\": {\n      \"command\": \"C:\\\\Users\\\\TU_USUARIO\\\\.local\\\\bin\\\\uvx.exe\",\n      \"args\": [\"markitdown-mcp\"]\n    }\n  }\n}\n```\n\n## Versión C: si ya tenías otros servidores\n\nNo borres lo que hay. Suma \"markitdown\" adentro de \"mcpServers\", separado del anterior con una coma:\n\n```json\n{\n  \"mcpServers\": {\n    \"el-que-ya-tenias\": {\n      \"command\": \"...\",\n      \"args\": [\"...\"]\n    },\n    \"markitdown\": {\n      \"command\": \"uvx\",\n      \"args\": [\"markitdown-mcp\"]\n    }\n  }\n}\n```\n\n## Cómo comprobar que quedó\n\n1. En un chat, toca el + de la caja de texto y entra a Connectors.\n2. Tiene que figurar markitdown con la herramienta convert_to_markdown.\n3. Prueba: \"Convierte este archivo a markdown y dime cuántas secciones tiene: [RUTA]\".\n\n## Si no aparece\n\n- Revisa el JSON en un validador: una coma de más o de menos lo rompe.\n- Mira el log: en Mac ~/Library/Logs/Claude/mcp-server-markitdown.log, en Windows %APPDATA%\\Claude\\logs\\mcp-server-markitdown.log.\n- Prueba en la terminal: `uvx markitdown-mcp --help`. Si ahí falla, el problema es uv, no Claude.\n\n## Seguridad\n\nEl servidor lee cualquier archivo al que tenga acceso tu usuario y puede traer datos de internet. Úsalo solo en tu computadora y con archivos tuyos.\n"}, {"archivo": "convertir-con-markitdown/SKILL.md", "que_es": "Skill que hace que Claude convierta primero cada archivo o link con convert_to_markdown, arme bien la URI file:// y avise si el PDF es escaneado. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: convertir-con-markitdown\ndescription: 'Convierte un archivo local o un link a markdown con convert_to_markdown de MarkItDown y trabaja sobre ese texto. Úsala con un PDF, Word, Excel, PowerPoint, HTML o CSV para resumir o extraer.'\n---\n\n# Convertir con MarkItDown antes de trabajar\n\nCuando te pasan la ruta de un archivo o un link, primero lo conviertes a texto con la herramienta convert_to_markdown y recién después haces lo que te pidieron.\n\n## Paso 1: armar la URI\n\nLa herramienta recibe una URI, no una ruta suelta:\n\n- Archivo en Mac: file:///Users/usuario/Documentos/lista.pdf\n- Archivo en Windows: file:///C:/Users/usuario/Documents/lista.pdf (barras normales, no invertidas)\n- Si la ruta tiene espacios, reemplázalos por %20.\n- Links: úsalos tal cual (https://...).\n\nSi la herramienta convert_to_markdown no está disponible, dilo y pídele a la persona que revise la configuración de Claude Desktop. No inventes el contenido.\n\n## Paso 2: revisar lo que salió\n\n- Si el resultado está vacío o casi vacío y es un PDF, probablemente es un escaneo. Avisa que esta herramienta no hace OCR y sugiere partirlo en tramos de hasta 100 páginas y adjuntarlo al chat, o pasarlo antes por un programa de OCR.\n- Si el documento tenía gráficos o imágenes importantes, avisa que en el texto convertido no se ven.\n- Si es muy largo, no lo repitas entero: trabaja sobre las partes que hacen falta.\n\n## Paso 3: hacer lo pedido\n\n- Responde solo con lo que dice el texto convertido. Si algo no está, dilo.\n- Cuando cites un dato, nombra la sección o el título donde está.\n- Si la persona va a volver a usar el documento, ofrece guardar un resumen de trabajo en texto para subir a un Proyecto.\n\n## Nunca\n\n- No conviertas archivos que la persona no te pidió. El servidor puede leer cualquier archivo de su usuario.\n- No conviertas archivos de carpetas del sistema ni con claves o contraseñas.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

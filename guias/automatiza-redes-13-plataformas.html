<script>var GUIA = {"slug": "automatiza-redes-13-plataformas", "t": "Automatiza tus redes: un post publicado en 13 plataformas", "d": "Programas una vez y publicas en Instagram, YouTube, TikTok, LinkedIn, X, Facebook, Threads, Pinterest, Reddit, Discord, Telegram, WhatsApp y Google Business, cada una con su formato.", "tema": "Contenido y redes", "min": 7, "ficha": [["Qué es", "Programar una vez y publicar en 13 redes, cada una con su formato, con Zernio."], ["Para quién", "Quien publica en muchas redes o maneja las de clientes."], ["Necesitas", "Una cuenta de Zernio con tus redes conectadas; opcional, su conector en Claude Code."], ["Ojo", "Zernio cobra por cuenta conectada (X se cobra aparte, por uso de su API). Respeta las reglas de cada red y pide siempre la vista previa antes de programar."], ["Incluye", "2 prompts: adaptar un post a cada red y el calendario del mes."]], "secciones": [{"h": "Qué consigues", "lista": ["Un post adaptado al formato de cada red (vertical, cuadrado u horizontal).", "Un calendario lleno: pones la hora y te olvidas.", "Publicaciones en los horarios que tú eliges para cada red: armas una cola con días y horas, y cada post toma el próximo lugar libre."]}, {"h": "La herramienta: Zernio", "p": ["Zernio es una plataforma para programar publicaciones en muchas redes desde un solo lugar. Tiene API y un servidor MCP para conectarla con agentes de IA como Claude. Es la que uso yo."], "lista": ["Web: <a href=\"https://zernio.com\" target=\"_blank\" rel=\"noopener\">zernio.com ↗<\/a>"], "aviso": "Zernio ya no tiene planes por niveles: se paga por cada cuenta conectada por mes, las 2 primeras son gratis y X se cobra aparte según cuánto uses su API. Revisa los precios actuales en su web y las condiciones de cada red."}, {"h": "Pasos", "pasos": ["Crea tu cuenta en Zernio y conecta tus redes (una sola vez).", "Define tus horarios para cada red.", "Sube el contenido o pídele a Claude que lo prepare.", "Programa y revisa el calendario."], "prompts": [{"t": "Adaptar un post a cada red", "c": "Adapta este contenido [TEXTO O GUION] a Instagram, TikTok, YouTube Shorts, LinkedIn, X, Threads y Facebook: texto, largo, hashtags y formato de cada una, con mi tono [TONO]."}, {"t": "Calendario del mes", "c": "Con estas 10 ideas [IDEAS], ármame el calendario del mes para mis redes: qué va en cada una, qué día y a qué hora, sin repetir el mismo texto."}]}, {"h": "Con Claude y su conector", "p": ["Si conectas Zernio a Claude Code, le puedes pedir en el chat «programa este post en estas redes el martes a las 20» y revisarlo antes de confirmar."], "pasos": ["En la terminal: claude mcp add --transport http zernio https://mcp.zernio.com/mcp", "En Claude Code, escribe /mcp, elige zernio y aprueba el acceso en la ventana del navegador que se abre.", "Vuelve a /mcp y fíjate que zernio aparezca conectado."], "aviso": "Pide siempre la vista previa antes de programar. No hace falta pegar ninguna clave: el acceso se aprueba en el navegador."}, {"h": "Las reglas de cada red", "lista": ["Automatizar está permitido, el spam no: no publiques el mismo texto idéntico en muchas cuentas ni en masa, y respeta las reglas de uso de cada red.", "Mensajería: en WhatsApp, Telegram y Discord manda mensajes solo a gente que aceptó recibirlos. WhatsApp no es un muro de posteos: necesitas una cuenta de WhatsApp Business Platform (WABA) dentro de un Meta Business, lo que se programa son difusiones, y fuera de las 24 horas desde el último mensaje del cliente solo puedes mandar plantillas aprobadas.", "Contenido con IA: si se ve real, etiquétalo como piden TikTok, YouTube e Instagram.", "Cuentas de clientes: conéctalas con el acceso oficial; nunca pidas contraseñas por chat."]}], "faq": [{"q": "¿Publica sin que lo vea?", "a": "Solo lo que tú programas. Revisa el calendario todas las semanas."}, {"q": "¿Sirve para clientes?", "a": "Sí: es un servicio que puedes ofrecer a negocios que no tienen tiempo para las redes."}, {"q": "¿Cuánto cuesta?", "a": "Se paga por cada cuenta conectada por mes: las 2 primeras son gratis y el precio por cuenta baja a medida que sumas más. X se cobra aparte, por uso. Revisa los precios actuales en la web de Zernio."}], "usos": [{"e": "Formato", "c": "azul", "t": "Uno para cada red", "d": "Vertical, cuadrado u horizontal."}, {"e": "Calendario", "c": "morado", "t": "Lleno de antemano", "d": "Pones la hora y te olvidas."}, {"e": "Claude", "c": "verde", "t": "Desde el chat", "d": "«Programa este post el martes» con el conector."}, {"e": "Clientes", "c": "naranja", "t": "Un servicio para ofrecer", "d": "Para negocios sin tiempo para redes."}], "fuentes": ["https://zernio.com/claude", "https://blog.hootsuite.com/ai-disclosure-policy-for-tiktok/", "https://support.google.com/youtube/answer/14328491", "https://docs.zernio.com/mcp/setup", "https://docs.zernio.com/platforms", "https://docs.zernio.com/guides/queue-scheduling", "https://docs.zernio.com/platforms/whatsapp", "https://zernio.com/blog/pay-per-account-pricing", "https://zernio.com/blog/tiktok-posting-api", "https://help.instagram.com/761121959519495", "https://support.tiktok.com/en/using-tiktok/creating-videos/ai-generated-content"], "ejemplo": {"titulo": "Ejemplo resuelto: la semana de una pastelería programada en una tarde", "negocio": "Ejemplo inventado: una pastelería de barrio en Nueva Córdoba, Córdoba capital. La dueña hace la producción con dos empleadas y vende por mostrador y por pedido. Publica en Instagram, TikTok, Facebook y Google Business, y avisa las tortas del día a una comunidad de WhatsApp de clientas que se anotaron en el local.", "punto_de_partida": "Publica cuando se acuerda, desde el celular, copiando el mismo texto en todas las redes. Google Business no se toca desde hace meses y la comunidad de WhatsApp recibe mensajes sueltos.", "pasos": ["Creó la cuenta en Zernio con el mail del negocio y conectó Instagram, TikTok, Facebook y Google Business desde la cuenta dueña de cada una. Antes de conectar revisó en la web de Zernio cuánto iba a pagar por esas cuentas.", "WhatsApp lo dejó para después: necesitaba una cuenta de WhatsApp Business Platform dentro de un Meta Business, y su número estaba en la app común de WhatsApp Business. Mientras tanto siguió avisando a la comunidad a mano.", "En Zernio armó la cola de cada red con la zona horaria de Argentina: Instagram y Facebook al mediodía y a la noche, TikTok tres veces por semana a la tarde y Google Business los lunes.", "En la terminal corrió claude mcp add --transport http zernio https://mcp.zernio.com/mcp. En Claude Code escribió /mcp, eligió zernio y aprobó el acceso en el navegador. Le pidió \"lístame las cuentas conectadas en Zernio\" y aparecieron las cuatro.", "Copió el CLAUDE.md del kit en la carpeta de la pastelería y completó tono (cercano, con voseo), horarios del local, dirección y la regla de no publicar precios de tortas a pedido.", "Instaló la skill adaptar-post-multired y le pasó 6 ideas de la semana con sus fotos y videos: la torta del día, el detrás de escena del hojaldre, el horario del feriado, entre otras.", "Claude devolvió una tabla con un texto distinto por red. En Google Business no puso hashtags y habló del horario del feriado. En la promo de medialunas dejó [CONFIRMAR PRECIO] porque no estaba en el CLAUDE.md.", "La dueña corrigió dos textos, completó el precio y marcó con OK lo aprobado. Le pidió programar solo eso en la cola y revisó la vista previa de cada publicación: red, fecha, hora y archivo.", "Confirmó. Después pidió \"lístame lo que quedó programado para los próximos 7 días\" y lo comparó con su plan."], "resultado": "La semana quedó programada en las cuatro redes, con un texto propio para cada una y nada publicado sin su visto bueno. Google Business volvió a tener novedades y la dueña tiene un CLAUDE.md con sus reglas para repetir el proceso cada semana. WhatsApp queda pendiente hasta que tenga su cuenta de WhatsApp Business Platform."}, "si_falla": [{"sintoma": "En Claude Code, /mcp muestra zernio con error o no termina de conectar después de aprobar en el navegador.", "solucion": "Saca el conector con claude mcp remove zernio y vuelve a agregarlo con claude mcp add --transport http zernio https://mcp.zernio.com/mcp. Después entra a /mcp y aprueba de nuevo. Si usas la app de Claude (Customize, Connectors) y ves \"Couldn't reach the MCP server\", la doc de Zernio dice que quites el conector y lo agregues otra vez, porque Claude guarda los intentos fallidos de autorización."}, {"sintoma": "Agregaste el conector con clave (--header \"Authorization: Bearer $ZERNIO_API_KEY\") y Zernio responde que no estás autorizado.", "solucion": "Algunos clientes no reemplazan la variable $ZERNIO_API_KEY por su valor. La doc de Zernio indica pegar la clave directamente en su lugar. O usa la opción sin clave: el comando sin --header y la aprobación en el navegador desde /mcp."}, {"sintoma": "No aparece WhatsApp para conectar, o se conecta pero no te deja programar un mensaje suelto.", "solucion": "WhatsApp solo funciona con una cuenta de WhatsApp Business Platform (WABA) dentro de un Meta Business y con al menos un número registrado; la app común no sirve. Lo que se programa son difusiones, no mensajes sueltos, y fuera de las 24 horas desde el último mensaje del cliente tienes que usar una plantilla aprobada por Meta."}, {"sintoma": "En TikTok algunos videos no salen o quedan en borrador en la bandeja de la app.", "solucion": "TikTok limita la cantidad de videos que una cuenta puede publicar por día, y con el modo borrador (Creator's Draft) el video llega a la bandeja de TikTok para que lo publiques tú. Revisa en Zernio cómo quedó configurada la publicación y reparte los videos en varios días."}, {"sintoma": "Una red te frena o te limita la cuenta después de programar mucho contenido parecido.", "solucion": "Es lo que las redes consideran spam: el mismo texto en muchas cuentas o publicaciones en masa. Usa la skill del kit para que cada red tenga su versión, baja la frecuencia y no conectes cuentas de terceros que no administras tú."}], "kit": [{"archivo": "adaptar-post-multired/SKILL.md", "que_es": "Skill que convierte una pieza madre en un borrador distinto para cada red, con formato, notas de lo que hay que confirmar y recordatorios de etiqueta de IA y reglas de WhatsApp. Guárdala en una carpeta adaptar-post-multired, comprímela en ZIP y súbela a Claude, o cópiala en .claude/skills/ en Claude Code.", "contenido": "---\nname: adaptar-post-multired\ndescription: 'Adapta una pieza a cada red (formato, largo, tono y llamado a la acción) y la deja como borrador para revisar antes de programar en Zernio. Úsala al pedir repartir o versionar un post en varias redes.'\n---\n\n# Adaptar un post a varias redes\n\nRecibes una pieza madre y devuelves una versión por red. Nunca programas ni publicas: dejas borradores para que la persona los revise.\n\n## Antes de escribir, confirma\n\n1. Qué redes van (si no lo dice, pregunta; no asumas las 13).\n2. El tono de la marca y cómo trata a su público (tú, tú, usted).\n3. Qué archivo acompaña: video vertical, video horizontal, imagen cuadrada, carrusel o solo texto.\n4. Si hay un dato que no se puede tocar: precio, fecha, dirección, condiciones de una promo.\n\nSi falta el punto 4 y el texto habla de precios o promos, no los inventes: deja [CONFIRMAR PRECIO] o [CONFIRMAR FECHA].\n\n## Reglas para cada versión\n\n- Cada red recibe un texto distinto. Nunca copies el mismo texto en dos redes: cambia el arranque, el largo y el llamado a la acción.\n- Respeta el límite de caracteres actual de cada red. Si no estás seguro del límite, escribe corto y avísalo en NOTAS.\n- Hashtags: pocos y específicos del tema. En LinkedIn, Google Business, Telegram, Discord y WhatsApp, en general no hacen falta.\n- Formato del archivo: si la pieza es vertical y la red muestra mejor otro formato, avísalo en NOTAS en lugar de forzarlo.\n- Si el contenido tiene personas, voces o escenas realistas hechas con IA, agrega en NOTAS: \"Marcar como contenido generado con IA al publicar\".\n- Mensajería (WhatsApp, Telegram, Discord): escribe como mensaje a una comunidad que eligió recibirlo, no como aviso. Para WhatsApp, recuerda en NOTAS que fuera de las 24 horas desde el último mensaje del cliente hace falta una plantilla aprobada por Meta.\n- Google Business: habla del negocio y de algo concreto (novedad, horario, oferta vigente). Nada de hashtags ni de tendencias.\n- Reddit: solo si la persona nombra la comunidad. Recuerda en NOTAS que cada subreddit tiene sus reglas sobre autopromoción.\n\n## Qué entregas\n\nUna tabla o lista con, para cada red:\n\n- RED\n- TEXTO (listo para pegar)\n- ARCHIVO (qué formato usar)\n- HORA SUGERIDA (solo si la persona ya te pasó sus horarios; si no, deja \"según tu cola\")\n- NOTAS (lo que hay que confirmar o revisar)\n\nAl final, una línea: \"Revisa cada texto y confírmame cuáles programo.\" Si tienes acceso a Zernio, no programes nada hasta que la persona confirme red por red.\n"}, {"archivo": "CLAUDE-md-redes-con-zernio.md", "que_es": "Un CLAUDE.md de ejemplo para la carpeta donde manejas las redes de un negocio o cliente: horarios, cuentas conectadas y las reglas que Claude tiene que cumplir antes de programar en Zernio. Renómbralo a CLAUDE.md y completa los corchetes.", "contenido": "# CLAUDE.md para manejar redes con Zernio\n\nCopia este archivo en la carpeta donde trabajas con Claude Code (la de tu negocio o la de cada cliente) y renómbralo a CLAUDE.md. Completa lo que está entre corchetes.\n\n## Quién soy y para quién trabajo\n\n- Manejo las redes de: [NOMBRE DEL NEGOCIO O CLIENTE].\n- Rubro y ciudad: [RUBRO, CIUDAD].\n- Zona horaria para programar: [por ejemplo America/Argentina/Buenos_Aires].\n- Tono: [por ejemplo cercano, con voseo, sin signos de exclamación de más].\n\n## Cuentas conectadas en Zernio\n\n[Pega aquí la lista que te devuelve Claude cuando le pides \"lístame las cuentas conectadas en Zernio\". Una línea por cuenta: red, nombre de la cuenta, para qué se usa.]\n\n## Mis horarios\n\n| Red | Días | Horas |\n|---|---|---|\n| [Instagram] | [lun a vie] | [12:30 y 20:00] |\n| [TikTok] | [mar, jue, sáb] | [19:00] |\n| [LinkedIn] | [mar y jue] | [9:00] |\n\n## Reglas que no se rompen\n\n1. Nunca programes ni publiques sin que yo confirme. Primero muéstrame la vista previa: red, cuenta, texto, archivo, fecha y hora en mi zona horaria.\n2. Si una publicación va a más de una cuenta, muéstrame una vista previa por cuenta.\n3. Nunca el mismo texto idéntico en dos redes ni en dos cuentas.\n4. Precios, fechas y condiciones solo si están en este archivo o yo te los paso. Si no, deja [CONFIRMAR].\n5. Si el contenido tiene personas, voces o escenas realistas hechas con IA, recuérdame marcarlo como contenido generado con IA.\n6. WhatsApp, Telegram y Discord: solo a contactos o comunidades que aceptaron recibir mensajes. Nada de listas compradas.\n7. No borres ni edites publicaciones ya programadas sin preguntarme.\n8. Si Zernio devuelve un error, muéstramelo tal cual y no reintentes más de una vez.\n\n## Datos fijos del negocio\n\n- Dirección: [DIRECCIÓN]\n- Horarios de atención: [HORARIOS]\n- Link principal: [WEB O LINK DE WHATSAPP]\n- Lo que nunca se dice en redes: [por ejemplo precios de servicios a medida, datos de clientes]\n\n## Pedidos frecuentes\n\n- \"Arma la semana\": toma las ideas de ideas-semana.md, adáptalas a cada red y muéstrame todo como borrador.\n- \"Programa lo aprobado\": programa solo las filas que marqué con OK.\n- \"Qué hay programado\": lístame lo que está en cola para los próximos 7 días.\n"}, {"archivo": "checklist-semana-programada-zernio.md", "que_es": "Checklist para dejar Zernio y su conector bien instalados una vez y para programar cada semana con vista previa y confirmación.", "contenido": "# Checklist: tu primera semana programada con Zernio\n\nPara hacer una vez al conectar y después cada semana. Marca cada casilla.\n\n## Una sola vez\n\n- [ ] Creé la cuenta en Zernio con el mail del negocio (no el personal).\n- [ ] Conecté cada red con su acceso oficial, desde la cuenta dueña. Si es de un cliente, la conectó él o me dio acceso de administrador; nunca le pedí la contraseña por chat.\n- [ ] Revisé en la web de Zernio cuánto voy a pagar según cuántas cuentas conecto, y si voy a usar X (que se cobra aparte por uso).\n- [ ] Para WhatsApp: tengo una cuenta de WhatsApp Business Platform (WABA) dentro de un Meta Business, con un número registrado. Una cuenta de WhatsApp común no sirve.\n- [ ] Armé la cola de horarios de cada red (días y horas) con la zona horaria correcta.\n- [ ] En Claude Code agregué el conector: claude mcp add --transport http zernio https://mcp.zernio.com/mcp\n- [ ] En Claude Code escribe /mcp, elige zernio, aprobé el acceso en el navegador y quedó conectado.\n- [ ] Le pedí a Claude \"lístame las cuentas conectadas en Zernio\" y aparecen todas.\n- [ ] Copié el CLAUDE.md del kit en la carpeta de trabajo y lo completé.\n\n## Cada semana (30 a 45 minutos)\n\n1. [ ] Junté las ideas de la semana en un archivo ideas-semana.md (una por línea, con el archivo que la acompaña).\n2. [ ] Le pedí a Claude: \"Con la skill adaptar-post-multired, adapta estas ideas a mis redes y muéstrame todo como borrador.\"\n3. [ ] Leí cada texto. Corrige precios, fechas y nombres. Marqué con OK lo aprobado.\n4. [ ] Le pedí: \"Programa en Zernio solo lo marcado con OK, en mi cola. Muéstrame la vista previa de cada uno antes de confirmar.\"\n5. [ ] Revisé la vista previa: red, cuenta, fecha, hora en mi zona horaria y archivo correcto.\n6. [ ] Confirmé.\n7. [ ] Le pedí: \"Lístame lo que quedó programado para los próximos 7 días\" y lo comparé con mi plan.\n8. [ ] Lo que tenga personas, voces o escenas realistas hechas con IA quedó marcado como IA en la red que corresponde.\n\n## Al cierre de la semana\n\n- [ ] Miré en las estadísticas de cada red qué horarios anduvieron mejor y ajusté la cola si hace falta.\n- [ ] Anoté en el CLAUDE.md cualquier regla nueva que haya salido (por ejemplo, \"en LinkedIn no usar emojis\").\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

<script>var GUIA = {"slug": "archivos-sin-desperdiciar-tokens", "post": "ARCHIVOS", "t": "Archivos sin desperdiciar tokens: manda solo lo que importa", "d": "Cómo pesan los archivos que adjuntas, cómo mandar solo las partes que sirven, qué cambia entre texto, PDF e imágenes, y cómo resumir un documento largo una sola vez para reutilizarlo.", "tema": "Gasta menos tokens", "min": 7, "secciones": [{"h": "Cómo pesan los archivos", "p": ["Todo lo que adjuntas entra en la memoria de trabajo del chat (la ventana de contexto) y suma a tu consumo. El centro de ayuda cuenta el tamaño de los archivos adjuntos entre los factores que afectan tu límite, junto con el largo del chat, el largo de cada mensaje y el uso de herramientas.", "Lo que cuenta es el contenido: cuanto más largo el archivo, más pesa. Y el archivo pasa a ser parte del chat, que se vuelve más largo, y el largo del chat también suma."]}, {"h": "Manda solo lo que importa", "pasos": ["Antes de adjuntar, pregúntate qué parte del documento necesitas de verdad.", "Si es un capítulo, unas páginas o una tabla, saca solo eso (copia el texto o guarda esas páginas como un PDF aparte).", "Si tiene que ser el documento entero, dile a Claude en qué páginas mirar. Usa los números de página que muestra tu visor de PDF, no los que están impresos en el documento.", "Si el archivo es muy grande, pártelo en tramos y trabaja cada uno en su chat."], "prompts": [{"t": "Ir directo a lo que sirve", "c": "Te adjunto [NOMBRE DEL ARCHIVO]. Solo me interesan las páginas [NÚMEROS] (según mi visor de PDF).\nNecesito: [QUÉ QUIERES SACAR].\nNo resumas el resto del documento."}]}, {"h": "Texto, PDF o imagen: qué lee Claude de cada uno", "lista": ["Word, TXT, CSV y similares: Claude extrae solo el texto. Si tienen imágenes adentro, no las ve.", "PDF de hasta 100 páginas: Claude lee el texto y también mira lo visual (gráficos, imágenes, tablas como dibujo).", "PDF de 101 a 1000 páginas: solo procesa el texto, no lo visual. Más de 1000 páginas no se puede subir.", "PDF escaneado (fotos de páginas): si es largo, pártelo en tramos de hasta 100 páginas o pásalo antes por un programa de OCR (reconocimiento de texto), porque pasadas las 100 Claude no mira lo visual y en un escaneo no hay texto que extraer. MarkItDown, con la configuración básica de nuestra guía, no hace OCR.", "Imágenes: JPEG, PNG, GIF o WebP. La ayuda recomienda que tengan al menos 1000 x 1000 píxeles para que salgan bien.", "Planillas Excel (XLSX): para subirlas tienes que tener activada la ejecución de código y creación de archivos."], "aviso": "Si lo que importa son los números de una tabla, manda la planilla o el CSV, no una captura: así Claude trabaja con los datos exactos."}, {"h": "Resume una vez, reutiliza muchas", "p": ["Si vas a consultar el mismo documento largo en varios chats (un contrato, un manual, un informe), no lo subas cada vez. Pide un resumen de trabajo una sola vez y usa ese resumen después."], "pasos": ["En un chat nuevo, sube el documento y pide el resumen con el prompt de abajo.", "Revisa el resumen contra el original en lo importante: números, fechas, nombres.", "Guárdalo como archivo de texto.", "Sube ese resumen a tu Proyecto o pégalo en los chats donde lo necesites. Vuelve al original solo cuando haga falta un detalle que el resumen no tiene."], "prompts": [{"t": "Resumen de trabajo de un documento", "c": "Te adjunto [DOCUMENTO]. Lo voy a consultar muchas veces para [PARA QUÉ LO USO].\nÁrmame un resumen de trabajo con:\n1. De qué trata, en 3 líneas.\n2. Todos los datos concretos: números, fechas, plazos, nombres y montos, tal cual aparecen.\n3. Las reglas, condiciones u obligaciones, en viñetas.\n4. Un índice: qué hay en cada sección y en qué página.\nNo interpretes ni agregues nada que no diga el documento. Si algo no está claro, márcalo con [VER ORIGINAL]."}]}, {"h": "Pasar a texto antes de subir", "p": ["Otra forma de ahorrar es convertir el archivo a texto limpio antes de dárselo a Claude. Para eso ya tenemos la guía \"MarkItDown: Claude lee tus archivos gastando menos\", con la instalación paso a paso."]}, {"h": "Los límites para tener a mano", "lista": ["En un chat: hasta 500 MB por archivo y hasta 20 archivos por chat.", "Imágenes: hasta 8000 x 8000 píxeles.", "PDF: hasta 1000 páginas.", "En un Proyecto: hasta 30 MB por archivo. Claude extrae solo el texto, salvo en los PDF."]}], "faq": [{"q": "¿Es mejor pegar el texto o adjuntar el archivo?", "a": "Si necesitas solo una parte, pega esa parte. Si necesitas el documento con sus gráficos, adjunta el PDF. Lo importante es no mandar más de lo que hace falta."}, {"q": "¿Claude ve las imágenes que hay dentro de un Word?", "a": "No. De los documentos que no son PDF, Claude extrae solo el texto."}, {"q": "Si subo el documento a un Proyecto, ¿ya no gasta?", "a": "Sigue gastando, pero el material de un Proyecto cuenta menos cuando se reutiliza mientras está en caché. Lo explicamos en la guía de Proyectos y caché de esta categoría."}], "fuentes": ["https://support.claude.com/en/articles/8241126-upload-files-to-claude", "https://support.claude.com/en/articles/9797557-usage-limit-best-practices", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/10684626-enable-and-use-web-search", "https://github.com/microsoft/markitdown"], "ejemplo": {"titulo": "Ejemplo resuelto: una productora de seguros que deja de subir la póliza entera en cada consulta", "negocio": "Ejemplo inventado: una productora de seguros en Guayaquil, Ecuador. Son la titular y una asistente, y venden seguros de auto y de hogar de dos aseguradoras.", "punto_de_partida": "Cada vez que un cliente preguntaba qué cubría su póliza, la asistente subía a un chat nuevo el condicionado general completo en PDF, de más de cien páginas. Las respuestas a veces no veían una tabla de franquicias que estaba como imagen.", "pasos": ["Abrió el PDF en su visor y anotó las páginas que de verdad consultan: coberturas, exclusiones, franquicias y cómo hacer un reclamo.", "Vio que la tabla de franquicias estaba como imagen después de la página 100. Guardó esas páginas como un PDF aparte, para que Claude mirara también lo visual.", "En un chat nuevo subió el condicionado y pidió el resumen con la skill del kit. Le dijo para qué lo iba a usar: responder consultas de clientes de seguros de auto.", "Revisó contra el original los montos, plazos y porcentajes del resumen. Encontró un plazo marcado con [VER ORIGINAL], lo buscó en la página indicada y lo completó.", "Guardó el resumen como resumen-condicionado-auto-aseguradora-a.txt y lo subió a su Proyecto de atención, junto con el PDF corto de la tabla de franquicias.", "Ahora, cuando un cliente pregunta, consulta en un chat del Proyecto sin adjuntar nada. Si hace falta un detalle que no está, usa el índice del resumen para pedirle a Claude solo esas páginas del original, con el prompt \"Ir directo a lo que sirve\".", "Antes de cada adjunto nuevo pasa la checklist del kit."], "resultado": "Quedó un resumen de trabajo revisado de cada condicionado y un PDF corto con las tablas que importan. El documento original se sube solo cuando hace falta una página puntual."}, "si_falla": [{"sintoma": "Al subir un PDF aparece \"Uploaded file is too large\".", "solucion": "El PDF tiene más de 1000 páginas. Pártelo en tramos con tu visor de PDF (guardar o imprimir como PDF un rango de páginas) y sube solo el tramo que necesitas."}, {"sintoma": "Claude no ve un gráfico o una tabla que está en el PDF.", "solucion": "Si el PDF tiene más de 100 páginas, Claude solo lee el texto. Guarda las páginas con el gráfico como un PDF aparte de menos de 100 páginas, o manda la tabla como planilla o CSV."}, {"sintoma": "Le pido la página 15 y me responde sobre otra cosa.", "solucion": "Usa el número de página que muestra tu visor de PDF, no el que está impreso en la hoja. En muchos documentos la portada y el índice no tienen número y los dos no coinciden."}, {"sintoma": "No me deja subir un Excel.", "solucion": "Para los XLSX tienes que prender la ejecución de código y creación de archivos en Settings → Capabilities. Si no puedes, exporta la hoja como CSV y sube eso."}, {"sintoma": "Claude no menciona las imágenes que hay dentro de un Word.", "solucion": "De los documentos que no son PDF, Claude extrae solo el texto. Exporta el Word como PDF (si tiene hasta 100 páginas mira lo visual) o sube las imágenes aparte."}], "kit": [{"archivo": "resumen-de-trabajo-de-documento/SKILL.md", "que_es": "Skill que convierte un documento largo en un resumen de trabajo fiel, con cada dato y regla citando su página y un índice para volver al original. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: resumen-de-trabajo-de-documento\ndescription: 'Convierte un documento largo (contrato, manual, póliza, informe) en un resumen de trabajo fiel para reusar sin subir el original. Úsala cuando lo vayan a consultar muchas veces o pidan un índice.'\n---\n\n# Resumen de trabajo de un documento\n\nArmas un resumen que reemplace al original en el uso de todos los días. Tiene que ser fiel: la persona lo va a usar sin volver a mirar el documento, así que un dato mal copiado es peor que un dato que falta.\n\n## Antes de empezar\n\n1. Pregunta para qué lo va a usar, si no lo dijo (por ejemplo, \"responder consultas de clientes\" o \"controlar plazos\").\n2. Si el documento es un PDF de más de 100 páginas, avisa que en esa parte solo lees el texto y no los gráficos ni las tablas dibujadas. Si hay tablas importantes como imagen, pide esas páginas aparte.\n3. Usa los números de página del visor de PDF, no los impresos en el documento.\n\n## Qué entregas, en este orden\n\n1. **Ficha**: título del documento, quién lo emite, fecha o versión, cantidad de páginas.\n2. **De qué trata**: 3 líneas.\n3. **Datos concretos**: números, montos, fechas, plazos, porcentajes, nombres y direcciones, TAL CUAL aparecen, cada uno con su página entre paréntesis. Ejemplo: \"Plazo para reclamar: 30 días corridos (pág. 12)\".\n4. **Reglas y obligaciones**: en viñetas, quién tiene que hacer qué y en qué condiciones, con página.\n5. **Excepciones y letra chica**: lo que limita o anula lo anterior, con página.\n6. **Índice**: cada sección con su rango de páginas, para volver al original solo donde haga falta.\n7. **Dudas**: lo ambiguo o ilegible, marcado con [VER ORIGINAL] y su página.\n\n## Reglas\n\n- No interpretes ni aconsejes. Si la persona quiere una opinión, que la pida en otro mensaje.\n- No redondees números ni cambies unidades.\n- Si una cifra aparece dos veces con valores distintos, muestra las dos con sus páginas.\n- Escríbelo en texto plano con títulos, para que se pueda guardar como .txt o .md y subir a un Proyecto.\n- Al final, recuérdale a la persona que revise contra el original los números, fechas y nombres antes de usarlo.\n"}, {"archivo": "checklist-antes-de-adjuntar-archivos.md", "que_es": "Checklist de cinco preguntas para pasar antes de cada adjunto, con la tabla de qué formato conviene y los límites oficiales.", "contenido": "# Antes de adjuntar un archivo a Claude\n\nPásala de memoria cada vez que vayas a subir algo. Son cinco preguntas.\n\n## 1. ¿Necesito el archivo entero?\n- [ ] No: copié solo el párrafo, la tabla o las páginas que sirven.\n- [ ] Sí: en el mensaje digo en qué páginas mirar (números del visor de PDF).\n\n## 2. ¿Qué formato le conviene?\n| Lo que importa | Manda |\n|---|---|\n| Números de una tabla | La planilla o el CSV, no una captura |\n| Gráficos o fotos de un informe | El PDF (hasta 100 páginas mira lo visual) |\n| Solo el texto de un Word | El texto pegado o el .docx (de los Word solo lee texto) |\n| Una imagen | JPEG, PNG, GIF o WebP, de al menos 1000 x 1000 píxeles |\n| Un Excel | Prende antes la ejecución de código y creación de archivos |\n\n## 3. ¿Es un PDF largo o escaneado?\n- [ ] Más de 100 páginas: sé que pasada la página 100 solo se lee el texto.\n- [ ] Escaneado: lo partí en tramos de hasta 100 páginas, o lo pasé por un programa de OCR antes.\n- [ ] Más de 1000 páginas: lo partí, porque no se puede subir.\n\n## 4. ¿Lo voy a usar más de una vez?\n- [ ] Sí: pido un resumen de trabajo una sola vez, lo reviso y lo guardo como .txt.\n- [ ] Ese resumen va al Proyecto, no el original.\n\n## 5. ¿Este chat ya está largo?\n- [ ] Si ya tiene varios archivos o muchos mensajes, abro uno nuevo con un resumen de traspaso y adjunto ahí.\n\n## Límites para tener a mano\n- Chat: hasta 500 MB por archivo y hasta 20 archivos por chat.\n- Imágenes: hasta 8000 x 8000 píxeles.\n- PDF: hasta 1000 páginas.\n- Proyecto: hasta 30 MB por archivo; de todo lo que no sea PDF se extrae solo el texto.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

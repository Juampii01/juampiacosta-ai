<script>var GUIA = {"slug": "8-apps-clonadas-gratis", "t": "8 apps de pago con alternativa gratis y abierta: links e instalación", "d": "Motion design con agentes, un asistente de correo, Figma, Word, Excel, PowerPoint, Intercom y beehiiv: alternativas de código abierto que podés instalar con ayuda de Claude Code.", "tema": "Conectores y MCP", "min": 8, "ficha": [["Qué es", "Ocho alternativas de código abierto a apps pagas, con sus links."], ["Para quién", "Quien paga suscripciones y quiere opciones gratis."], ["Necesitás", "Claude Code para instalarlas, o los instaladores de cada repo. Algunas piden Docker o un servidor."], ["Cuánto cuesta", "El código es gratis; varias tienen además una versión en la nube que es paga."], ["Ojo", "Son proyectos de terceros, algunos en alfa o beta: probalos antes de cambiar tus herramientas de trabajo."]], "secciones": [{"h": "Antes de instalar nada", "p": ["Todas son de código abierto. Lo más fácil es pegarle el link a Claude Code y pedirle «instalalo siguiendo su README y decime cómo se usa». Varias tienen además una versión en la nube, ya instalada, que es paga."], "aviso": "Son proyectos de terceros y algunos muy nuevos. Probalos antes de cambiar tus herramientas de trabajo y no les des datos sensibles sin revisarlos."}, {"h": "1. Motion design abierto: Open Design", "p": ["Open Design es un estudio de diseño con agentes de IA. Trae integrado HyperFrames, el framework de video abierto de HeyGen: describís un video de motion, el agente lo arma y lo exportás a MP4. Funciona con Claude Code, Claude Desktop, Codex, Cursor y muchos agentes más."], "lista": ["Repositorio: <a href=\"https://github.com/nexu-io/open-design\" target=\"_blank\" rel=\"noopener\">github.com/nexu-io/open-design ↗<\/a>", "Licencia: Apache 2.0."]}, {"h": "2. Asistente de correo: Inbox Zero", "p": ["Asistente de IA para Gmail y Outlook: ordena la bandeja, te deja borradores de respuesta con tu estilo, te da de baja de listas en un clic y trae su propia app de correo."], "lista": ["Repositorio: <a href=\"https://github.com/elie222/inbox-zero\" target=\"_blank\" rel=\"noopener\">github.com/elie222/inbox-zero ↗<\/a>", "En lugar de: asistentes de correo pagos.", "Costo: gratis si lo instalás en tu propio servidor (licencia AGPL); también hay una versión alojada en su web."], "aviso": "Le das acceso a tu correo: si no lo instalás vos, leé bien quién guarda tus datos."}, {"h": "3. Figma abierto: FigCraft", "p": ["Diseño de interfaces y prototipos con frames, auto layout, componentes y variables, en una app que abre al instante y funciona sin internet, sin cuenta."], "lista": ["Repositorio: <a href=\"https://github.com/storytold/figcraft\" target=\"_blank\" rel=\"noopener\">github.com/storytold/figcraft ↗<\/a>", "En lugar de: Figma, para uso individual.", "Estado: alfa. Bajás el instalador para Mac, Windows o Linux desde la página de releases."]}, {"h": "4. Office abierto: WordCraft, GridCraft y DeckCraft", "p": ["Procesador de textos, planilla de cálculo y presentaciones que abren y guardan archivos .docx, .xlsx y .pptx."], "lista": ["<a href=\"https://github.com/storytold/wordcraft\" target=\"_blank\" rel=\"noopener\">github.com/storytold/wordcraft ↗<\/a>", "<a href=\"https://github.com/storytold/gridcraft\" target=\"_blank\" rel=\"noopener\">github.com/storytold/gridcraft ↗<\/a>", "<a href=\"https://github.com/storytold/deckcraft\" target=\"_blank\" rel=\"noopener\">github.com/storytold/deckcraft ↗<\/a>", "En lugar de: Word, Excel y PowerPoint, para uso básico.", "Instalación: cada repo tiene instaladores en su página de releases. Licencia MIT o Apache 2.0, a elección. Las tres están en alfa: probalas con copias de tus archivos antes de abrir los originales."]}, {"h": "5. Soporte al cliente: Helpin", "p": ["Alternativa de código abierto a Intercom y Linear: chat de soporte, bandeja compartida, centro de ayuda, CRM y agentes de IA que responden y arman tareas para tu equipo, con aprobaciones donde las necesites."], "lista": ["Repositorio: <a href=\"https://github.com/helpin-ai/helpin\" target=\"_blank\" rel=\"noopener\">github.com/helpin-ai/helpin ↗<\/a>", "Para instalarlo vos: Linux o Mac con Docker, y para probar arrancá con 8 GB de RAM. Está en beta.", "Licencia: AGPL-3.0 para la versión comunitaria; las partes empresariales necesitan licencia comercial."]}, {"h": "6. Newsletters: MailCheap", "p": ["Newsletters donde pagás por los correos que mandás y no por suscriptores dormidos. Importa listas de beehiiv, Substack y Mailchimp."], "lista": ["Repositorio: <a href=\"https://github.com/marclou/mailcheap\" target=\"_blank\" rel=\"noopener\">github.com/marclou/mailcheap ↗<\/a>", "En lugar de: beehiiv.", "Costo: gratis si lo instalás vos (licencia AGPL), más lo que cobre tu proveedor de envío de correos; también tiene una versión paga en la nube."], "aviso": "Instalarlo vos lleva cerca de una hora y no tiene soporte. Mandá correos solo a gente que se suscribió."}], "faq": [{"q": "¿Son igual de buenas que las pagas?", "a": "Para muchos usos, sí; para equipos grandes o funciones avanzadas, comparalas antes."}, {"q": "¿Necesito un servidor?", "a": "FigCraft y las apps de Office se instalan como cualquier programa. Inbox Zero, Helpin y MailCheap, si las querés gratis, se instalan en un servidor propio."}], "usos": [{"e": "Correo", "c": "azul", "t": "Inbox Zero", "d": "Un asistente de correo que podés instalar vos."}, {"e": "Diseño", "c": "morado", "t": "FigCraft", "d": "En lugar de Figma, para uso individual."}, {"e": "Office", "c": "verde", "t": "WordCraft, GridCraft y DeckCraft", "d": "En lugar de Word, Excel y PowerPoint."}, {"e": "Soporte", "c": "naranja", "t": "Helpin", "d": "En lugar de Intercom."}], "fuentes": ["https://github.com/nexu-io/open-design", "https://github.com/elie222/inbox-zero", "https://github.com/storytold/figcraft", "https://github.com/storytold/wordcraft", "https://github.com/storytold/gridcraft", "https://github.com/storytold/deckcraft", "https://github.com/helpin-ai/helpin", "https://github.com/marclou/mailcheap", "https://github.com/storytold/gridcraft/releases", "https://github.com/storytold/deckcraft/releases", "https://docs.getinboxzero.com/hosting/quick-start"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio de diseño prueba alternativas abiertas sin cortar nada", "negocio": "Ejemplo inventado: un estudio de diseño y comunicación de Montevideo con dos socias y una persona que hace prácticas. Diseñan identidades e interfaces para pymes, mandan propuestas en Word y presupuestos en Excel, y tienen un newsletter mensual para clientes.", "punto_de_partida": "Pagan varias suscripciones y quieren saber cuáles podrían reemplazar sin perder trabajo. No tienen servidor propio y no quieren dar acceso a su correo a una app que no conocen.", "pasos": ["Hicieron la lista de suscripciones y la cruzaron con la guía. Dejaron afuera Inbox Zero y Helpin para más adelante: les piden acceso al correo o un servidor con Docker, y prefirieron empezar por apps que se instalan como cualquier programa.", "Subieron la skill instalar-app-abierta del kit a Claude. Le pegaron el link de FigCraft y Claude leyó el README, les contó que es MIT o Apache 2.0, que está en alfa y que el instalador está en la página de releases.", "Bajaron el instalador de FigCraft para su sistema y abrieron un archivo .fig de un proyecto cerrado, hecho copia. El README avisa que los .fig se abren con el mejor esfuerzo posible, así que revisaron pantalla por pantalla.", "Repitieron el proceso con WordCraft y GridCraft: abrieron copias de una propuesta .docx y de un presupuesto .xlsx, los editaron, los guardaron y los abrieron en la compu de un cliente amigo para ver que no se rompiera el formato.", "Completaron la checklist del kit durante una semana, usando las apps abiertas en paralelo sin cancelar las pagas, y anotaron qué funciones les faltaron.", "Para el newsletter miraron MailCheap. Como instalarlo por su cuenta lleva cerca de una hora, pide una cuenta de Amazon SES o PostShiba y no tiene soporte, lo anotaron como opción para cuando migren y por ahora compararon contra la versión en la nube.", "Al cierre decidieron con la tabla de la checklist: qué app pasa al uso diario, cuál queda solo para algunas tareas y qué suscripción mantienen."], "resultado": "Quedaron instaladas las apps que se usan como programa común, probadas con copias de trabajos reales, y una checklist completa por app con licencia, estado y lo que faltó. Las decisiones sobre las suscripciones se tomaron con esa evidencia y sin haber puesto en riesgo archivos originales ni el correo del estudio."}, "si_falla": [{"sintoma": "WordCraft, GridCraft o DeckCraft no abren en Windows: la app aparece un instante en el Administrador de tareas y se cierra.", "solucion": "Sus README explican que en Windows arrancan solo con DirectX 12 y que algunos drivers de video (de AMD, por ejemplo) fallan. Abrí PowerShell en la carpeta del ejecutable, corré $env:WGPU_BACKEND = \"vulkan\" y después abrí la app desde esa misma ventana (por ejemplo & .\\deckcraft.exe). Para volver a lo normal, Remove-Item Env:WGPU_BACKEND."}, {"sintoma": "El asistente de instalación de Inbox Zero (npx @inbox-zero/cli setup) falla apenas arranca.", "solucion": "El README pide Docker y Node.js 24 o más nuevo para instalarlo por tu cuenta. Revisá la versión con node -v y que Docker esté abierto y funcionando. Para la instalación en producción y la conexión con Google o Microsoft, seguí la guía de self-hosting de su documentación."}, {"sintoma": "El comando de instalación de Helpin con curl no encuentra nada para instalar.", "solucion": "El README aclara que el instalador por CLI funciona una vez que se publica una versión Community con esos archivos. Si todavía no está, usá la instalación manual: bajá el paquete de la página de releases y corré su setup.sh, como indica la sección Manual bundle installation."}, {"sintoma": "MailCheap instalado por vos no arranca o no te llegan los códigos para iniciar sesión.", "solucion": "BETTER_AUTH_SECRET y SUPPRESSION_HASH_KEY tienen que tener al menos 32 caracteres cada uno y ser distintos (generalos con openssl rand -base64 48); si no, el servidor no arranca y los logs dicen por qué. Para los códigos, configurá Resend con el dominio de EMAIL_FROM verificado, o terminá la configuración de Amazon SES o PostShiba."}, {"sintoma": "Open Design no configura solo el MCP en Claude Desktop.", "solucion": "Su README aclara que la configuración automática para Claude Desktop funciona solo en macOS y Windows. En Linux, o si preferís la terminal, usá Claude Code con od mcp install claude. Podés ver qué va a cambiar antes con od mcp install claude --print."}], "kit": [{"archivo": "instalar-app-abierta/SKILL.md", "que_es": "Skill que lee el README de un repositorio, te cuenta licencia, estado y requisitos, y te guía a instalar y probar con datos de prueba antes de tocar nada real. Guardala en una carpeta instalar-app-abierta, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: instalar-app-abierta\ndescription: 'Guía la instalación prudente de una app open source desde GitHub, con datos de prueba y sin tocar originales. Usala cuando peguen el link de un repo para instalarlo o reemplazar una app paga.'\n---\n\n# Instalar una app abierta con cuidado\n\nInstalás apps de código abierto de terceros. Tu trabajo es que la persona pueda probarlas sin arriesgar sus datos ni su compu.\n\n## Antes de instalar nada\n\n1. Leé el README completo del repositorio y, si existen, los archivos de instalación o de self-hosting que enlaza.\n2. Contale a la persona, en 6 líneas como máximo:\n   - Qué es y qué reemplaza.\n   - La licencia (tal como figura en el repo).\n   - El estado (alfa, beta, estable) si el repo lo dice.\n   - Cómo se instala: instalador de releases, comando, Docker o servidor.\n   - Qué necesita (programas, versiones, claves de API, cuentas de terceros).\n   - Qué datos salen de la compu y hacia dónde, si el README lo dice.\n3. Preguntá si sigue. No instales nada hasta tener un \"sí\".\n\n## Al instalar\n\n- Si hay instalador listo en la página de releases, preferí eso y decile qué archivo bajar para su sistema.\n- Si hay que usar la terminal, mostrá cada comando antes de correrlo y explicá qué hace en una línea.\n- No uses sudo ni cambies configuraciones del sistema sin preguntar.\n- No pegues claves de API en comandos: usá el archivo .env que indique el repo y recordá que no se sube a ningún lado.\n- Si el repo ofrece un modo demo o datos inventados, usalo primero.\n- Si un comando falla, leé el error, buscá la sección de problemas del README y proponé un arreglo. No pruebes soluciones al azar.\n\n## Primera prueba\n\n1. Abrí la app con datos de prueba o con COPIAS de archivos reales, nunca con los originales.\n2. Probá la tarea principal que la persona quiere reemplazar.\n3. Probá exportar o guardar en un formato que también abra la app paga (por ejemplo .docx, .xlsx, .pptx, CSV).\n\n## Al terminar\n\nEntregá un resumen:\n\n- Qué quedó instalado y dónde.\n- Cómo se abre y cómo se cierra.\n- Qué anduvo y qué no en la prueba.\n- Cómo se desinstala.\n- Qué revisar antes de usarla con datos reales.\n"}, {"archivo": "checklist-probar-alternativa-abierta.md", "que_es": "Checklist para probar cada app abierta con copias y en paralelo con la paga, y decidir con evidencia qué suscripción cortar.", "contenido": "# Checklist: probar una alternativa abierta antes de cambiar\n\nUsala con cada app de la guía (o cualquier otra). Si una casilla de la parte 1 queda en no, no sigas.\n\n## 1. Antes de instalar\n\n- [ ] Leí qué licencia tiene y la anoté: ______\n- [ ] Sé en qué estado está (alfa, beta, estable): ______\n- [ ] Sé si se instala como programa, con Docker o en un servidor.\n- [ ] Sé qué datos van a pasar por la app (correos, clientes, documentos, suscriptores).\n- [ ] Si la instalo en un servidor, sé quién se encarga de backups, actualizaciones y seguridad.\n- [ ] Si uso la versión en la nube de la app, leí quién guarda mis datos.\n\n## 2. Prueba con copias\n\n- [ ] Hice copia de los archivos con los que voy a probar.\n- [ ] Abrí las copias, no los originales.\n- [ ] Probé la tarea que hago todos los días con la app paga.\n- [ ] Guardé en el formato de siempre (.docx, .xlsx, .pptx) y lo abrí en otra compu o en la app de siempre para ver que no se rompió nada.\n- [ ] Anoté qué funciones me faltaron.\n\n## 3. Prueba de una semana\n\n- [ ] Usé la app abierta en paralelo, sin cancelar la paga.\n- [ ] Anoté cada problema en una lista con fecha.\n- [ ] Revisé si hubo actualizaciones del proyecto en ese tiempo.\n\n## 4. Decisión\n\n- [ ] Me alcanza para el uso real: sí / no / solo para algunas tareas.\n- [ ] Tengo cómo volver atrás (exportar mis datos y retomar la app paga).\n- [ ] Decidí qué hago con la suscripción paga: cancelar / bajar de plan / mantener.\n\n## Notas por app\n\n| App | Licencia | Estado | Cómo la instalé | Qué me faltó | Decisión |\n|---|---|---|---|---|---|\n| | | | | | |\n"}], "verificada": "2026-11-08", "cat": "conectores", "parte": "usalo"};</script>

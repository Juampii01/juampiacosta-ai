<script>var GUIA = {"slug": "canal-sin-cara-wan2gp", "t": "Videos animados sin cara para YouTube con WanGP, gratis en tu computadora", "d": "El sistema para un canal de videos cortos animados: WanGP en tu computadora, personajes y escenas con sonido, tandas que se generan de noche y qué pide YouTube para monetizar.", "tema": "Contenido y redes", "min": 9, "ficha": [["Qué es", "Un canal de videos cortos animados sin cara, hechos con WanGP en tu computadora y generados en tandas de noche."], ["Para quién", "Quien quiere un canal de YouTube sin salir en cámara."], ["Necesitas", "Una placa de video NVIDIA (desde GTX 10XX) o AMD reciente; con 8 GB de VRAM ya puedes empezar."], ["Cuánto cuesta", "WanGP es gratis para usar en tu computadora y no gasta créditos."], ["Ojo", "Lo que muestran otros canales no es un resultado asegurado. YouTube no monetiza contenido masivo o repetitivo."]], "secciones": [{"h": "El sistema", "pasos": ["Instala WanGP, un estudio de video con IA que corre en tu computadora.", "Crea personajes, animales y escenas, y súmales sonido.", "Deja varios videos en la cola a la noche y revísalos a la mañana.", "Publica seguido y, cuando cumplas los requisitos, pide la monetización."], "aviso": "Las vistas o ingresos que muestran otros canales son ejemplos, no un resultado asegurado. Muchos canales nunca llegan a monetizar."}, {"h": "1. Instala WanGP", "lista": ["Repositorio: <a href=\"https://github.com/deepbeepmeep/Wan2GP\" target=\"_blank\" rel=\"noopener\">github.com/deepbeepmeep/Wan2GP ↗<\/a>", "Placa de video: NVIDIA (desde las GTX 10XX) o AMD reciente (RDNA 2, 3 o 4). Según su README, algunos modelos andan con 4 GB de VRAM y con 8 GB ya puedes arrancar.", "Instalación: scripts para Windows y Linux, Pinokio o, en Windows, WanGP Manager (experimental), que elige el perfil para tu placa e instala todo.", "Sonido: trae herramientas para generar la banda de sonido (MMAudio) y modelos de voz.", "Licencia: puedes usarlo gratis y vender lo que generas; si vendes directamente un video hecho con WanGP, piden que les des crédito."], "prompts": [{"t": "Instalación guiada", "c": "Instálame WanGP (github.com/deepbeepmeep/Wan2GP) en mi computadora con [PLACA Y VRAM] y [WINDOWS/LINUX] siguiendo su guía. Dime qué perfil de memoria elegir y qué modelo de video usar para clips cortos con sonido."}]}, {"h": "2. Ideas y prompts con Claude", "prompts": [{"t": "El canal", "c": "Diseña un canal de YouTube Shorts de videos animados sin cara para [PÚBLICO, por ejemplo chicos de 3 a 6 años]. Dame: personaje principal con nombre y aspecto, estilo visual en una frase, 10 ideas de episodios de 30 segundos y el tono."}, {"t": "Prompts de video", "c": "Convierte la idea [IDEA] en 4 prompts de video de 5 segundos para WanGP: escena, personaje (siempre igual), acción, cámara y sonido. Que se encadenen como una historia."}]}, {"h": "3. Tandas nocturnas", "pasos": ["Prepara 5 videos con sus prompts.", "Ponlos en la cola de WanGP antes de dormir.", "A la mañana, revísalos, une los clips y suma música o voz.", "Publica uno o dos por día."]}, {"h": "4. Monetizar: lo que pide YouTube", "lista": ["Programa de Socios: hoy pide 1.000 suscriptores y, además, 10 millones de vistas válidas de Shorts en 90 días o 4.000 horas de reproducción pública en 12 meses. Cumplirlo no te asegura la aprobación, y los números pueden cambiar: revisa la ayuda oficial.", "Contenido original: YouTube no monetiza videos hechos en serie o muy repetitivos. Cada video tiene que aportar algo propio (historia, guion, voz).", "Etiqueta de IA: YouTube pide avisar cuando el contenido hecho con IA parece real. Los dibujos claramente irreales no lo necesitan, pero si algo parece real, márcalo.", "Mientras tanto: puedes vender productos digitales o usar enlaces de afiliado, avisando siempre que lo son."], "aviso": "Si haces contenido para chicos, márcalo como «creado para niños»: cambia cómo se monetiza y qué funciones tienes, y es una obligación legal en muchos países."}], "faq": [{"q": "¿Es ilimitado de verdad?", "a": "En créditos sí, porque corre en tu computadora. El límite es tu placa de video, la luz y tu tiempo."}, {"q": "¿Cuánto tarda cada video?", "a": "Depende de tu placa y del modelo; prueba primero en baja resolución."}, {"q": "¿Puedo vender los videos?", "a": "Según la licencia de WanGP, sí puedes vender lo que generas; si lo vendes directamente, piden que les des crédito. Revisa también la licencia de cada modelo que uses."}], "usos": [{"e": "Personajes", "c": "azul", "t": "Animales y escenas", "d": "Con sonido, generados en tu computadora."}, {"e": "Noche", "c": "morado", "t": "Tandas nocturnas", "d": "Cinco videos en cola que están listos a la mañana."}, {"e": "Publicar", "c": "verde", "t": "Uno o dos por día", "d": "La constancia que pide el canal."}, {"e": "Monetizar", "c": "naranja", "t": "Programa de Socios", "d": "Y mientras, productos digitales o afiliados."}], "fuentes": ["https://github.com/deepbeepmeep/Wan2GP", "https://raw.githubusercontent.com/deepbeepmeep/Wan2GP/HEAD/LICENSE.txt", "https://support.google.com/youtube/answer/72851?hl=en-gb", "https://support.google.com/youtube/answer/14328491", "https://support.google.com/youtube/answer/1311392", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/CLI.md", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/TROUBLESHOOTING.md", "https://raw.githubusercontent.com/deepbeepmeep/WanGP/HEAD/docs/INSTALLATION.md", "https://support.google.com/youtube/answer/13429240?hl=en"], "ejemplo": {"titulo": "Ejemplo resuelto: un canal de cuentos cortos para chicos armado en una computadora de escritorio", "negocio": "Ejemplo inventado: una maestra jardinera de Montevideo, Uruguay, que arma el canal a la noche después de trabajar. Tiene una computadora de escritorio con una placa NVIDIA de la serie RTX 30 con 8 GB de VRAM, que antes usaba para jugar.", "punto_de_partida": "Quiere un canal de Shorts con cuentos de 30 segundos que enseñen palabras nuevas, sin salir en cámara. Nunca instaló un programa de IA y no quiere pagar créditos por cada video.", "pasos": ["Con el prompt de instalación guiada, Claude la llevó por el script de instalación de Windows del repositorio, con la instalación automática. Le explicó qué perfil de memoria usar para su placa y que los modelos se bajan la primera vez que se usan, así que dejó espacio libre en el disco.", "Con el prompt del canal armó la idea y completó la biblia del kit: un zorrito naranja con bufanda azul, estilo 3D suave con colores pastel, y cada episodio enseña una palabra con una historia. Marcó que el canal es creado para niños.", "Escribió en inglés el bloque de personaje y el de estilo, y la voz en español.", "Instaló la skill episodio-wangp y le pasó la biblia y la idea \"el zorrito aprende qué es una brújula\". Recibió 5 prompts encadenados, el texto de la narración, la lista de sonidos y el chequeo de originalidad.", "Antes de cargar todo, probó el primer clip en baja resolución. El zorrito salía sin bufanda: hizo más precisa esa parte del bloque de personaje y volvió a probar.", "Siguió la tanda nocturna del kit: cargó los 5 prompts, guardó la cola con Save Queue, dejó la computadora sin suspenderse y arrancó la cola antes de dormir.", "A la mañana descartó un clip con una pata rara y lo volvió a generar. Unió los clips, grabó la narración con su voz y sumó música de la biblioteca de audio de YouTube.", "Pasó el chequeo de la biblia y programó el Short en YouTube Studio, marcado como creado para niños. Para la semana siguiente guardó la cola y la empezó a correr con python wgp.py --process desde la terminal."], "resultado": "Tiene un sistema que se repite: biblia del canal, skill para los prompts, cola de noche y revisión a la mañana, con el personaje igual en todos los videos y su voz en cada episodio. Sabe que publicar seguido no le asegura la monetización y anota en la biblia qué aporta cada episodio para no caer en videos repetidos."}, "si_falla": [{"sintoma": "WanGP corta con \"CUDA out of memory\" al cargar el modelo o en medio de la generación.", "solucion": "Baja la resolución y la cantidad de cuadros (videos más cortos). Si sigue, usa un perfil de memoria más ahorrativo: la guía de problemas de WanGP propone arrancar con python wgp.py --profile 4, o elegir un modelo más chico. Cierra todo lo que use la placa mientras genera."}, {"sintoma": "La computadora se queda sin memoria RAM (se pone muy lenta o se cierra WanGP).", "solucion": "La guía oficial sugiere el perfil de RAM mínima con python wgp.py --profile 5 o limitar la memoria reservada con --perc-reserved-mem-max 0.3. Activar o agrandar el archivo de paginación (swap) del sistema también ayuda."}, {"sintoma": "En Windows falla la instalación de Triton o de Sage Attention, o WanGP no arranca después de instalarlas.", "solucion": "Usa los scripts de instalación del repositorio, que eligen las versiones para tu placa. Si igual falla, la guía de problemas indica arrancar con la atención básica: python wgp.py --attention sdpa. Ojo: las GTX 10XX no usan Sage Attention."}, {"sintoma": "A la mañana la cola está a medias o la computadora se suspendió.", "solucion": "Configura el sistema para que no se suspenda mientras está enchufada y, en Windows, activa Prevent Windows Background Power Throttling en Configuration, Performance de WanGP (guarda y reinicia). Guarda siempre la cola con Save Queue para poder retomarla, o correrla con python wgp.py --process tu-cola.zip."}, {"sintoma": "El personaje cambia de cara, color o ropa de un clip a otro.", "solucion": "Copia el bloque de personaje palabra por palabra en todos los prompts (la skill del kit lo hace sola), suma detalles fijos que se vean fácil (un color, un accesorio) y prueba un clip en baja resolución antes de cargar toda la tanda. Si el modelo que usas acepta una imagen de referencia, usa siempre la misma."}], "kit": [{"archivo": "episodio-wangp/SKILL.md", "que_es": "Skill que convierte la idea de un episodio en prompts encadenados para WanGP con el personaje y el estilo siempre iguales, más voz, sonidos, orden de montaje y chequeo de originalidad. Cópiala en una carpeta episodio-wangp, comprímela en ZIP y súbela a Claude, o ponla en .claude/skills/ en Claude Code.", "contenido": "---\nname: episodio-wangp\ndescription: 'Convierte la idea de un episodio de un canal animado en prompts de video encadenados para WanGP, con personaje y estilo fijos, guion de voz y sonidos. Úsala al pedir escenas o un episodio nuevo.'\n---\n\n# Episodio para WanGP\n\nTomas la biblia del canal (personaje, estilo, público) y una idea, y devuelves todo lo que hace falta para cargar la cola de WanGP y después montar el Short.\n\n## Qué necesitas\n\n1. La biblia del canal: el BLOQUE DE PERSONAJE y el BLOQUE DE ESTILO, copiados tal cual. Si no te los pasan, pídelos antes de escribir.\n2. La idea del episodio, en una o dos frases.\n3. Cuántos clips y de cuántos segundos (si no lo dicen, propón 4 a 6 clips cortos).\n4. Si el canal es para chicos.\n\n## Reglas\n\n- Cada prompt arranca con el BLOQUE DE PERSONAJE y el BLOQUE DE ESTILO copiados palabra por palabra. Nunca los resumas ni los cambies: es lo que mantiene igual al personaje entre clips.\n- Después, en este orden: escena (lugar y momento del día), acción (una sola acción clara por clip), cámara (plano y movimiento simple) y sonido (ambiente y efectos, sin música con derechos).\n- Una acción por clip. Si la idea necesita más, suma clips.\n- Cada clip termina en una posición que conecta con el arranque del siguiente.\n- Sin personas reales, marcas, personajes de otros ni nada que parezca real si el canal es de dibujos.\n- Si el canal es para chicos: nada de miedo, peligro imitable, violencia ni llamados a comprar.\n\n## Qué entregas\n\n1. TÍTULO del episodio y una frase de qué aporta (la historia o la enseñanza propia del episodio).\n2. PROMPTS: una tabla con número de clip, duración y el prompt completo listo para pegar en WanGP.\n3. VOZ: el texto de la narración o de los diálogos, con el tiempo aproximado de cada clip.\n4. SONIDO: lo que hay que generar o sumar en el montaje (ambiente, efectos, música con licencia).\n5. ORDEN DE MONTAJE: en qué orden se unen los clips y dónde entra cada parte de la voz.\n6. CHEQUEO DE ORIGINALIDAD: tres líneas que expliquen qué tiene este episodio que no tengan los anteriores (no solo otro color u otro animal).\n\nAl final, recuerda: probar el primer clip en baja resolución antes de cargar toda la tanda.\n"}, {"archivo": "biblia-canal-animado-sin-cara.md", "que_es": "Plantilla de la biblia del canal: público, personaje, bloque de personaje y de estilo para copiar en cada prompt, voz, lista de episodios y chequeo antes de publicar.", "contenido": "# Biblia del canal animado sin cara\n\nComplétala una vez y pégala en Claude cada vez que pidas un episodio nuevo. Es lo que hace que el personaje, el estilo y el tono no cambien de un video a otro.\n\n## 1. El canal\n\n- Nombre: [NOMBRE]\n- Público: [por ejemplo chicos de 3 a 6 años / adultos que miran curiosidades de animales]\n- ¿Es contenido creado para niños? [sí / no] (si es sí, se marca así en YouTube Studio en cada video)\n- Idioma y acento: [español rioplatense / neutro]\n- Qué aporta cada video (en una frase): [por ejemplo cada episodio enseña una palabra nueva con una historia de 30 segundos]\n- Duración de cada Short: [SEGUNDOS]\n\n## 2. El personaje\n\n- Nombre: [NOMBRE]\n- Qué es: [animal, criatura, objeto con cara]\n- Aspecto: [tamaño, color exacto, forma, ropa o accesorio que siempre lleva]\n- Personalidad: [tres rasgos]\n- Lo que nunca hace: [por ejemplo no habla de comida chatarra]\n\n**BLOQUE DE PERSONAJE** (se copia igual en todos los prompts):\n[Ejemplo: a small round orange fox cub with a white tip on its tail, big green eyes and a blue scarf]\n\n> Tip: muchos modelos de video responden mejor a prompts en inglés. Escribe los bloques en inglés y la voz en español.\n\n## 3. El estilo\n\n**BLOQUE DE ESTILO** (se copia igual en todos los prompts):\n[Ejemplo: soft 3D cartoon, pastel colors, warm afternoon light, clean background, smooth gentle motion]\n\n- Escenarios que se repiten: [la casa del árbol, el río, la plaza]\n- Planos que se usan: [plano medio y plano general, cámara quieta o paneo lento]\n\n## 4. La voz y el sonido\n\n- Narración: [voz propia grabada / voz de IA de WanGP / sin voz, solo efectos]\n- Si es voz clonada: es la mía o tengo permiso por escrito. [sí]\n- Música: [de la biblioteca de audio de YouTube / generada / ninguna]\n- Sonidos de firma: [el ruidito al empezar, el cierre]\n\n## 5. Lista de episodios\n\n| N.° | Idea | Qué aporta de nuevo | Estado (idea / en cola / revisado / publicado) |\n|---|---|---|---|\n| 1 | | | |\n| 2 | | | |\n| 3 | | | |\n\n## 6. Chequeo antes de publicar cada video\n\n- [ ] Tiene una historia, un guion o una voz propia: no es el mismo video con otro color.\n- [ ] El personaje se ve igual que en los anteriores.\n- [ ] No hay marcas, personajes ni música de otros.\n- [ ] Si algo parece real (una persona, un lugar real, un hecho), lo marqué como contenido alterado o sintético.\n- [ ] Marqué la audiencia (creado para niños o no).\n- [ ] Título y descripción dicen lo que el video muestra.\n"}, {"archivo": "tanda-nocturna-wangp-paso-a-paso.md", "que_es": "Checklist para preparar, dejar corriendo y revisar la tanda nocturna, con la cola guardada (Save Queue) y los comandos para correrla sin interfaz.", "contenido": "# Tanda nocturna en WanGP: paso a paso\n\nPara dejar la computadora generando de noche y encontrar los clips a la mañana. Basado en la cola y el modo sin interfaz que documenta WanGP.\n\n## A la tarde: preparar (20 a 30 minutos)\n\n1. [ ] Pídele a Claude los prompts del episodio con la skill episodio-wangp y la biblia del canal.\n2. [ ] Abre WanGP y elige el modelo de video que vas a usar.\n3. [ ] Prueba SOLO el primer clip en baja resolución y con pocos segundos. Si el personaje sale mal, corrige el prompt ahora, no a la mañana.\n4. [ ] Anota la configuración que anduvo (modelo, resolución, duración, perfil de memoria) en la biblia del canal.\n\n## Antes de dormir: cargar la cola\n\n5. [ ] Carga cada prompt en la cola con la configuración que probaste. Revisa que el bloque de personaje esté igual en todos.\n6. [ ] Guarda la cola con el botón Save Queue (queda un archivo .zip). Te sirve para repetirla o correrla sin abrir la interfaz.\n7. [ ] Deja la computadora enchufada y configura Windows o Linux para que no se suspenda mientras está prendida.\n8. [ ] En Windows, en WanGP: Configuration, Performance, Prevent Windows Background Power Throttling (guarda y reinicia WanGP la primera vez).\n9. [ ] Cierra programas que usen la placa de video (juegos, editores, muchas pestañas con video).\n10. [ ] Arranca la cola. La cola sigue en el servidor de WanGP aunque cierres el navegador.\n\n### Opción sin interfaz (para la segunda semana en adelante)\n\nSi ya tienes la cola guardada, puedes correrla desde la terminal, dentro de la carpeta y el entorno de WanGP:\n\n    python wgp.py --process tanda-episodio-05.zip --dry-run\n    python wgp.py --process tanda-episodio-05.zip --output-dir ./tandas/episodio-05\n\nEl primer comando solo revisa que el archivo esté bien. El segundo genera todo y guarda los resultados en la carpeta que elegiste.\n\n## A la mañana: revisar y montar (30 a 45 minutos)\n\n11. [ ] Mira cada clip entero. Descarta los que tengan manos, caras o colores raros.\n12. [ ] Si un clip salió mal, vuelve a generarlo solo a ese (otra semilla o el prompt corregido).\n13. [ ] Une los clips en el orden de montaje, suma la voz y el sonido.\n14. [ ] Pasa el chequeo de la biblia del canal antes de subir.\n15. [ ] Programa la publicación en YouTube Studio y marca la audiencia.\n\n## Qué anotar cada día\n\n| Fecha | Episodio | Clips en cola | Clips buenos | Qué falló | Qué cambio para mañana |\n|---|---|---|---|---|---|\n| | | | | | |\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "úsalo"};</script>

, piden que les des crédito."], "prompts": [{"t": "Instalación guiada", "c": "Instalame WanGP (github.com/deepbeepmeep/Wan2GP) en mi compu con [PLACA Y VRAM] y [WINDOWS/LINUX] siguiendo su guía. Decime qué perfil de memoria elegir y qué modelo de video usar para clips cortos con sonido."}]}, {"h": "2. Ideas y prompts con Claude", "prompts": [{"t": "El canal", "c": "Diseñá un canal de YouTube Shorts de videos animados sin cara para [PÚBLICO, por ejemplo chicos de 3 a 6 años]. Dame: personaje principal con nombre y aspecto, estilo visual en una frase, 10 ideas de episodios de 30 segundos y el tono."}, {"t": "Prompts de video", "c": "Convertí la idea [IDEA] en 4 prompts de video de 5 segundos para WanGP: escena, personaje (siempre igual), acción, cámara y sonido. Que se encadenen como una historia."}]}, {"h": "3. Tandas nocturnas", "pasos": ["Prepará 5 videos con sus prompts.", "Ponelos en la cola de WanGP antes de dormir.", "A la mañana, revisalos, uní los clips y sumá música o voz.", "Publicá uno o dos por día."]}, {"h": "4. Monetizar: lo que pide YouTube", "lista": ["Programa de Socios: hoy pide 1.000 suscriptores y, además, 10 millones de vistas válidas de Shorts en 90 días o 4.000 horas de reproducción pública en 12 meses. Cumplirlo no te asegura la aprobación, y los números pueden cambiar: revisá la ayuda oficial.", "Contenido original: YouTube no monetiza videos hechos en serie o muy repetitivos. Cada video tiene que aportar algo propio (historia, guion, voz).", "Etiqueta de IA: YouTube pide avisar cuando el contenido hecho con IA parece real. Los dibujos claramente irreales no lo necesitan, pero si algo parece real, marcalo.", "Mientras tanto: podés vender productos digitales o usar enlaces de afiliado, avisando siempre que lo son."], "aviso": "Si hacés contenido para chicos, marcalo como «creado para niños»: cambia cómo se monetiza y qué funciones tenés, y es una obligación legal en muchos países."}], "faq": [{"q": "¿Es ilimitado de verdad?", "a": "En créditos

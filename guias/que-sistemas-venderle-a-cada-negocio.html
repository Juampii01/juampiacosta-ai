<script>var GUIA = {"slug": "que-sistemas-venderle-a-cada-negocio", "t": "Qué sistemas de IA venderle a cada tipo de negocio", "d": "Un mapa de 15 sistemas que se están vendiendo hoy, para qué negocio sirve cada uno y con qué se arma.", "tema": "El roadmap para vender IA", "min": 9, "secciones": [{"h": "Cómo usar este mapa", "p": ["Empieza con uno de entrada (el agente de atención es el más fácil de vender) y usa el resto como siguiente paso con el mismo cliente. Cada sistema de esta lista tiene su guía o su rubro en la biblioteca; si no, pídele a Claude el plan con el prompt del final."]}, {"h": "Para entrar", "lista": ["Agente que atiende, vende y agenda por WhatsApp e Instagram: clínicas, consultorios, tiendas online, inmobiliarias, concesionarias y salones. Es el sistema más validado.", "Agente que agenda llamadas desde los mensajes (setter): marcas personales, infoproductores y negocios que venden por llamada.", "Aviso de nuevas consultas por Telegram o WhatsApp con respuesta automática: dueños que no miran el mail. Es barato y rápido de vender.", "Facturas a planilla o CRM automáticamente: pymes con mucha administración."]}, {"h": "Para crecer con el mismo cliente", "lista": ["CRM a medida: negocios que hoy viven en Excel o en un cuaderno (concesionarias, peluquerías grandes, distribuidoras).", "Panel con las métricas del agente (conversaciones, etapas, sin respuesta): clientes que ya tienen agente.", "Reportes mensuales automáticos con recomendaciones: agencias de marketing.", "Respuesta a reseñas de Google y publicaciones a partir de fotos: restaurantes y comercios locales.", "Análisis de datos: suben un Excel y reciben limpieza, indicadores y recomendaciones."]}, {"h": "Sistemas más grandes", "lista": ["Panel de contenido: métricas propias y de la competencia, transcripciones y un asistente para preguntarle. Para marcas personales y agencias.", "Análisis de llamadas de venta y comparación de vendedores: empresas con equipo comercial que graba sus llamadas.", "Agente de voz que atiende o confirma por teléfono: clínicas, inmobiliarias. Solo si reciben muchas llamadas.", "Centro de control de la empresa: mini aplicaciones por área y por empleado.", "Prospección automática (buscar negocios, investigarlos y escribir el mensaje), que algunos cobran a comisión.", "Capacitaciones en vivo para equipos: como producto aparte o como entrada."]}, {"h": "Arma el plan de cualquiera con Claude", "prompts": [{"t": "Plan de un sistema para un cliente", "c": "Quiero venderle [SISTEMA] a [NEGOCIO], que [DATOS: tamaño, volumen de consultas, herramientas que usa]. Dame: 1) qué problema resuelve en su caso, en una frase que entienda el dueño; 2) la versión mínima que puedo poner a funcionar en 1 o 2 semanas; 3) con qué herramientas lo armaría (prefiere Claude, conectores y herramientas sin código; si hace falta algo más, dímelo); 4) qué tiene que darme el cliente; 5) qué módulos le podría ofrecer después; 6) qué riesgos o datos sensibles hay."}]}], "faq": [{"q": "¿Por cuál empiezo si no sé programar?", "a": "Por el agente de atención o por el paquete \"Claude instalado en tu negocio\". Los dos se arman con herramientas sin código y están explicados paso a paso en la biblioteca."}], "cat": "roadmap", "parte": "construi"};</script>

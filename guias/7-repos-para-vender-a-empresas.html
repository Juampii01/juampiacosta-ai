<script>var GUIA = {"slug": "7-repos-para-vender-a-empresas", "t": "No armes un SaaS: 7 repos gratis para vender servicios de IA a empresas", "d": "CRM con agentes, auditoría SEO, monitor de competencia, rediseño de webs, informes en PowerPoint, listas de prospectos y OCR de papeles: qué ofrecer, a quién y cómo presentarlo.", "tema": "Negocio", "min": 9, "ficha": [["Qué es", "Siete repos gratis para vender servicios de IA a empresas, con a quién ofrecerlos y cómo presentarlos."], ["Para quién", "Quien quiere vender servicios de IA sin crear un SaaS."], ["Necesitás", "Claude Code para instalarlos y adaptarlos. Algunos piden Docker, Python o Node."], ["Cuánto cuesta", "Los repos son gratis; lo que se paga es tu trabajo. No hay un precio que sirva para todos."], ["Ojo", "Respetá las condiciones de cada web, la licencia de cada repo y las leyes de protección de datos."]], "secciones": [{"h": "La idea", "p": ["Lo que cobrás no es el código, que es gratis: es instalarlo, adaptarlo a ese negocio, automatizarlo y mantenerlo andando. Tu trabajo es lo que vale."], "aviso": "No hay precios fijos ni ventas aseguradas. Lo que cobres depende de tu mercado, del tamaño del cliente y de lo que le ahorrás. Revisá la licencia de cada repo antes de usarlo en un servicio pago."}, {"h": "Ventas y clientes", "lista": ["CRM con agentes: Comp AI CRM, un CRM de código abierto (MIT) donde los agentes registran cada contacto y hacen el seguimiento. Para empresas de servicios con las ventas desordenadas en planillas. <a href=\"https://github.com/trycompai/crm\" target=\"_blank\" rel=\"noopener\">github.com/trycompai/crm ↗<\/a>", "Listas de prospectos: Scrapling (BSD-3), un framework de Python para sacar datos de webs que aguanta cuando la página cambia. Ofrecelo como una lista de posibles clientes que se actualiza sola. <a href=\"https://github.com/D4Vinci/Scrapling\" target=\"_blank\" rel=\"noopener\">github.com/D4Vinci/Scrapling ↗<\/a>"], "prompts": [{"t": "Pitch del CRM", "c": "Escribí un pitch de 4 frases para [TIPO DE EMPRESA] ofreciendo un CRM con agentes de IA que registran cada contacto y hacen el seguimiento solos, instalado en su propio servidor. Sin prometer resultados."}], "aviso": "Respetá las condiciones de uso de cada web y la ley de datos personales de tu país. No juntes datos personales para mandar spam."}, {"h": "Marketing y web", "lista": ["Auditoría SEO: la skill seo-audit de marketingskills (MIT) revisa una web y arma el informe que después le explicás al cliente. Para negocios locales y tiendas online. Instalación: npx skills add coreyhaines31/marketingskills <a href=\"https://github.com/coreyhaines31/marketingskills\" target=\"_blank\" rel=\"noopener\">github.com/coreyhaines31/marketingskills ↗<\/a>", "Monitor de competencia: changedetection.io (Apache 2.0) vigila cualquier página y avisa cuando cambia, por mail, Slack, Telegram y más. Para tiendas que quieren seguir precios y lanzamientos. Se instala con Docker. <a href=\"https://github.com/dgtlmoon/changedetection.io\" target=\"_blank\" rel=\"noopener\">github.com/dgtlmoon/changedetection.io ↗<\/a>", "Rediseño de webs: ai-website-cloner-template (MIT) toma una web y la rehace como una app nueva en Next.js. <a href=\"https://github.com/JCodesMore/ai-website-cloner-template\" target=\"_blank\" rel=\"noopener\">github.com/JCodesMore/ai-website-cloner-template ↗<\/a>"], "aviso": "Usá el clonador solo con la web de tu propio cliente y con su permiso: copiar la web o la marca de otra empresa viola sus derechos."}, {"h": "Documentos y papeles", "lista": ["Motor de informes: ppt-master (MIT) convierte un documento o un tema en un PowerPoint real. Para consultoras y equipos que hacen informes todas las semanas. <a href=\"https://github.com/hugohe3/ppt-master\" target=\"_blank\" rel=\"noopener\">github.com/hugohe3/ppt-master ↗<\/a>", "Papeles a datos: PaddleOCR (Apache 2.0) convierte PDF y escaneos en datos ordenados: facturas, contratos y formularios. Para estudios contables, logística y cualquier empresa con mucho papel. <a href=\"https://github.com/PaddlePaddle/PaddleOCR\" target=\"_blank\" rel=\"noopener\">github.com/PaddlePaddle/PaddleOCR ↗<\/a>"], "aviso": "Facturas y contratos tienen datos sensibles: procesalos en un servidor del cliente o con su permiso por escrito."}, {"h": "Cómo venderlo", "pasos": ["Elegí un repo y un tipo de cliente.", "Armá una demo con datos de ejemplo de su rubro.", "Mostrala en una llamada de 20 minutos.", "Cobrá la instalación más un abono de mantenimiento."], "prompts": [{"t": "Lista de precios", "c": "Ayudame a armar una tabla de precios para estos servicios [LISTA] en mi mercado [PAÍS/CIUDAD]: instalación, abono mensual, qué incluye y qué no. Basate en las horas que me lleva cada uno y decime qué datos tendría que averiguar de mi zona antes de fijar los números."}]}], "faq": [{"q": "¿Necesito programar?", "a": "Con Claude Code podés instalarlos y adaptarlos; sí tenés que entender lo que vendés y probarlo bien."}, {"q": "¿Puedo cobrar por algo que es gratis?", "a": "Sí: cobrás tu trabajo de instalación, adaptación y mantenimiento. Revisá igual la licencia de cada repo; las AGPL, por ejemplo, tienen reglas si modificás el código y lo ofrecés como servicio."}], "usos": [{"e": "CRM", "c": "azul", "t": "CRM con agentes", "d": "Para empresas con las ventas en planillas."}, {"e": "Competencia", "c": "morado", "t": "Monitor de competencia", "d": "changedetection.io vigila sus precios y lanzamientos."}, {"e": "Prospectos", "c": "verde", "t": "Listas que se actualizan", "d": "Scrapling, respetando las reglas de cada web."}, {"e": "Papeles", "c": "naranja", "t": "Papeles a datos", "d": "PaddleOCR para facturas y contratos."}], "fuentes": ["https://github.com/trycompai/crm", "https://github.com/coreyhaines31/marketingskills", "https://github.com/dgtlmoon/changedetection.io", "https://github.com/JCodesMore/ai-website-cloner-template", "https://github.com/hugohe3/ppt-master", "https://github.com/D4Vinci/Scrapling", "https://gith

<script>var GUIA = {"slug": "7-repos-para-vender-a-empresas", "post": "VENDER", "t": "No armes un SaaS: 7 repos gratis para vender servicios de IA a empresas", "d": "CRM con agentes, auditoría SEO, monitor de competencia, rediseño de webs, informes en PowerPoint, listas de prospectos y OCR de papeles: qué ofrecer, a quién y cómo presentarlo.", "tema": "El sistema para vender IA", "min": 9, "ficha": [["Qué es", "Siete repos gratis para vender servicios de IA a empresas, con a quién ofrecerlos y cómo presentarlos."], ["Para quién", "Quien quiere vender servicios de IA sin crear un SaaS."], ["Necesitas", "Claude Code para instalarlos y adaptarlos. Cada repo pide lo suyo: el CRM necesita Bun y Docker; changedetection.io se instala con Docker; Scrapling y ppt-master piden Python 3.10 o más nuevo; el clonador de webs pide Node.js 24 o más nuevo; PaddleOCR corre con Python (revisa en su README qué versiones soporta)."], ["Cuánto cuesta", "Los repos son gratis; lo que se paga es tu trabajo. No hay un precio que sirva para todos."], ["Ojo", "Respeta las condiciones de cada web, la licencia de cada repo y las leyes de protección de datos."]], "secciones": [{"h": "La idea", "p": ["Lo que cobras no es el código, que es gratis: es instalarlo, adaptarlo a ese negocio, automatizarlo y mantenerlo andando. Tu trabajo es lo que vale."], "aviso": "No hay precios fijos ni ventas aseguradas. Lo que cobres depende de tu mercado, del tamaño del cliente y de lo que le ahorras. Revisa la licencia de cada repo antes de usarlo en un servicio pago."}, {"h": "Ventas y clientes", "lista": ["CRM con agentes: Comp AI CRM, un CRM de código abierto (MIT) donde los agentes registran cada contacto y hacen el seguimiento. Para empresas de servicios con las ventas desordenadas en planillas. <a href=\"https://github.com/trycompai/crm\" target=\"_blank\" rel=\"noopener\">github.com/trycompai/crm ↗<\/a>", "Listas de prospectos: Scrapling (BSD-3), un framework de Python para sacar datos de webs que aguanta cuando la página cambia. Ofrécelo como una lista de posibles clientes que se actualiza sola. <a href=\"https://github.com/D4Vinci/Scrapling\" target=\"_blank\" rel=\"noopener\">github.com/D4Vinci/Scrapling ↗<\/a>"], "prompts": [{"t": "Pitch del CRM", "c": "Escribe un pitch de 4 frases para [TIPO DE EMPRESA] ofreciendo un CRM con agentes de IA que registran cada contacto y hacen el seguimiento solos, instalado en su propio servidor. Sin prometer resultados."}], "aviso": "Respeta las condiciones de uso de cada web y la ley de datos personales de tu país. No juntes datos personales para mandar spam."}, {"h": "Marketing y web", "lista": ["Auditoría SEO: la skill seo-audit de marketingskills (MIT) revisa una web y arma el informe que después le explicas al cliente. Para negocios locales y tiendas online. Instalación desde la terminal: npx skills add coreyhaines31/marketingskills (si le pides a Claude Code que la instale desde adentro de una sesión, suma -a claude-code para que quede en .claude/skills/, que es donde Claude Code la lee) <a href=\"https://github.com/coreyhaines31/marketingskills\" target=\"_blank\" rel=\"noopener\">github.com/coreyhaines31/marketingskills ↗<\/a>", "Monitor de competencia: changedetection.io (Apache 2.0) vigila cualquier página y avisa cuando cambia, por mail, Slack, Telegram y más. Para tiendas que quieren seguir precios y lanzamientos. Se instala con Docker. <a href=\"https://github.com/dgtlmoon/changedetection.io\" target=\"_blank\" rel=\"noopener\">github.com/dgtlmoon/changedetection.io ↗<\/a>", "Rediseño de webs: ai-website-cloner-template (MIT) toma una web y la rehace como una app nueva en Next.js. <a href=\"https://github.com/JCodesMore/ai-website-cloner-template\" target=\"_blank\" rel=\"noopener\">github.com/JCodesMore/ai-website-cloner-template ↗<\/a>"], "aviso": "Usa el clonador solo con la web de tu propio cliente y con su permiso: copiar la web o la marca de otra empresa viola sus derechos."}, {"h": "Documentos y papeles", "lista": ["Motor de informes: ppt-master (MIT) convierte un documento o un tema en un PowerPoint real. Para consultoras y equipos que hacen informes todas las semanas. <a href=\"https://github.com/hugohe3/ppt-master\" target=\"_blank\" rel=\"noopener\">github.com/hugohe3/ppt-master ↗<\/a>", "Papeles a datos: PaddleOCR (Apache 2.0) convierte PDF y escaneos en datos ordenados: facturas, contratos y formularios. Para estudios contables, logística y cualquier empresa con mucho papel. <a href=\"https://github.com/PaddlePaddle/PaddleOCR\" target=\"_blank\" rel=\"noopener\">github.com/PaddlePaddle/PaddleOCR ↗<\/a>"], "aviso": "Facturas y contratos tienen datos sensibles: procésalos en un servidor del cliente o con su permiso por escrito."}, {"h": "Cómo venderlo", "pasos": ["Elige un repo y un tipo de cliente.", "Arma una demo con datos de ejemplo de su rubro.", "Muéstrala en una llamada de 20 minutos.", "Cobra la instalación más un abono de mantenimiento."], "prompts": [{"t": "Lista de precios", "c": "Ayúdame a armar una tabla de precios para estos servicios [LISTA] en mi mercado [PAÍS/CIUDAD]: instalación, abono mensual, qué incluye y qué no. Básate en las horas que me lleva cada uno y dime qué datos tendría que averiguar de mi zona antes de fijar los números."}]}], "faq": [{"q": "¿Necesito programar?", "a": "Con Claude Code puedes instalarlos y adaptarlos; sí tienes que entender lo que vendes y probarlo bien."}, {"q": "¿Puedo cobrar por algo que es gratis?", "a": "Sí: cobras tu trabajo de instalación, adaptación y mantenimiento. Revisa igual la licencia de cada repo; las AGPL, por ejemplo, tienen reglas si modificas el código y lo ofreces como servicio."}], "usos": [{"e": "CRM", "c": "azul", "t": "CRM con agentes", "d": "Para empresas con las ventas en planillas."}, {"e": "Competencia", "c": "morado", "t": "Monitor de competencia", "d": "changedetection.io vigila sus precios y lanzamientos."}, {"e": "Prospectos", "c": "verde", "t": "Listas que se actualizan", "d": "Scrapling, respetando las reglas de cada web."}, {"e": "Papeles", "c": "naranja", "t": "Papeles a datos", "d": "PaddleOCR para facturas y contratos."}], "fuentes": ["https://github.com/trycompai/crm", "https://github.com/coreyhaines31/marketingskills", "https://github.com/dgtlmoon/changedetection.io", "https://github.com/JCodesMore/ai-website-cloner-template", "https://github.com/hugohe3/ppt-master", "https://github.com/D4Vinci/Scrapling", "https://github.com/PaddlePaddle/PaddleOCR", "https://scrapling.readthedocs.io", "https://github.com/caronc/apprise"], "ejemplo": {"titulo": "Ejemplo resuelto: un monitor de precios de la competencia para una tienda online", "negocio": "Ejemplo inventado: una tienda online de repuestos y accesorios de bicicleta en Asunción, Paraguay, con el dueño y dos empleados. Venden por su web y por Instagram. Quien ofrece el servicio es una freelancer que arma automatizaciones para comercios.", "punto_de_partida": "Uno de los empleados entra cada mañana a las webs de tres competidores para ver si cambiaron precios de los productos que más se venden. Lo anota en una planilla cuando se acuerda.", "pasos": ["La freelancer clonó changedetection.io y, dentro de la carpeta, le pidió a Claude Code que usara la skill evaluar-repo-para-cliente del kit. El informe confirmó licencia Apache 2.0, instalación con Docker y que los avisos salen por URLs de notificación de Apprise (mail, Telegram, Slack y otros).", "Lo levantó en su máquina con docker compose up -d y entró a la interfaz en http://127.0.0.1:5000.", "Para la demo no usó webs de competidores reales: armó dos páginas de prueba con precios inventados, las cargó como watches y cambió un precio a mano para que saltara el aviso.", "Configuró en la pestaña de edición del watch una URL de notificación de Telegram para que el aviso llegara al celular durante la demo.", "Completó la ficha de servicio del kit: corre en un servidor a nombre de la tienda, el servidor lo paga la tienda, el mensual incluye actualizar a versiones nuevas y revisar que siga avisando.", "En la llamada de 20 minutos le preguntó al dueño cómo lo hacían hoy, mostró la demo con el aviso llegando a Telegram y repasó la sección de cuidados: se miran solo páginas públicas de productos y se respetan las condiciones de uso de cada web.", "Con el sí del dueño, contrataron un servidor chico a nombre de la tienda. Lo instaló ahí, cargó las páginas de productos que eligió el dueño después de revisar las condiciones de cada sitio y configuró el aviso al grupo de Telegram del equipo.", "Dejó en la ficha qué revisa cada mes: que los watches sigan detectando (si una web cambia su diseño, el filtro puede dejar de encontrar el precio), la versión del repo y la copia de seguridad del volumen de datos."], "resultado": "La tienda tiene un monitor corriendo en su propio servidor que avisa por Telegram cuando cambia una página vigilada, y el empleado dejó de revisar webs a mano cada mañana. La freelancer cobra instalación y un mensual por mantenerlo, con una ficha que dice qué incluye, qué no y qué cuidados tiene."}, "si_falla": [{"sintoma": "Instalaste marketingskills pidiéndoselo a Claude Code y la skill seo-audit no aparece.", "solucion": "Corrido desde adentro de una sesión, el instalador puede dejarla solo en .agents/skills/, que Claude Code no lee. Vuelve a correrlo con npx skills add coreyhaines31/marketingskills -a claude-code. Otra opción en la terminal interactiva: /plugin marketplace add coreyhaines31/marketingskills y después /plugin install marketing-skills (el comando /plugin no está en Claude Code en la web)."}, {"sintoma": "changedetection.io anda en el servidor pero no lo puedes abrir desde tu computadora.", "solucion": "El comando de Docker del README publica el puerto como 127.0.0.1:5000, que solo acepta conexiones desde el mismo servidor. Entra con un túnel SSH o pon adelante un proxy con HTTPS y contraseña. No lo abras a internet sin protección: ahí quedan las páginas que vigila el cliente."}, {"sintoma": "El CRM no arranca o no puedes iniciar sesión en local.", "solucion": "El quick start pide Bun y Docker: docker compose up -d levanta Postgres, y después van bun install, bun run db:deploy y bun run dev. El inicio de sesión pasa por un proveedor de identidad (Google o Microsoft), así que en local se usa bun run --filter=api dev:session para obtener un link de acceso."}, {"sintoma": "El clonador de webs falla al arrancar o no puede ver la página.", "solucion": "Revisa que tengas Node.js 24 o más nuevo y que corriste npm run check después de instalar dependencias. El comando /clone-website necesita que el agente tenga acceso a un navegador habilitado. Y úsalo solo con la web del propio cliente."}, {"sintoma": "ppt-master te gasta muchos tokens o el PowerPoint sale flojo.", "solucion": "Su propio README avisa que el consumo alto de tokens es parte del diseño y que un modelo barato no llega al mismo resultado. Suma ese costo a la propuesta (a cargo del cliente si es su cuenta) y preséntalo como primer borrador editable, no como informe terminado."}], "kit": [{"archivo": "evaluar-repo-para-cliente/SKILL.md", "que_es": "Skill para Claude Code que revisa licencia, salud, requisitos y datos de un repo, arma una demo con datos inventados del rubro y deja un informe EVALUACION.md. Copia la carpeta en .claude/skills/ del proyecto o en ~/.claude/skills/.", "contenido": "---\nname: evaluar-repo-para-cliente\ndescription: 'Evalúa un repo open source antes de venderlo como servicio a una empresa (licencia, requisitos, datos, mantenimiento) y arma una demo con datos de ejemplo. Úsala al decidir si un repo se puede vender.'\n---\n\n# Evaluar un repo para vendérselo a un cliente\n\nTrabajas dentro de la carpeta del repo clonado. Tu trabajo es responder una pregunta: ¿esto se puede instalar, mantener y cobrar sin sorpresas? No instales nada en la máquina sin avisar antes qué vas a instalar.\n\n## 1. Licencia\n\n- Lee LICENSE (o LICENSE.md) y di cuál es.\n- MIT, Apache 2.0, BSD: se puede usar en un servicio pago; hay que mantener el aviso de copyright y la licencia en las copias del código. Apache 2.0 además pide conservar el NOTICE si existe y marcar los archivos modificados.\n- AGPL o GPL: avisa que tienen reglas si se modifica el código y se ofrece como servicio, y que conviene consultarlo antes de vender.\n- Sin licencia: avisa que, sin licencia, no hay permiso de uso. No sigas sin que la persona lo decida.\n- Revisa si hay partes con otra licencia (carpetas de terceros, modelos, assets) y si el README menciona una versión paga o en la nube.\n\n## 2. Salud del proyecto\n\n- Fecha del último commit (git log -1 --format=%cd).\n- Si existe, la carpeta de releases o el CHANGELOG: ¿hay versiones recientes?\n- Si la persona tiene gh configurado, mira los issues abiertos más comentados para ver qué se rompe seguido. Si no, dile que los revise en la web.\n\n## 3. Qué pide para correr\n\nLista, leyendo README, archivos de dependencias y docker-compose:\n\n- Lenguaje y versión (por ejemplo, Python 3.10 o más nuevo, Node.js 24 o más nuevo, Bun).\n- Si usa Docker y qué servicios levanta (base de datos, navegador, colas).\n- Variables de entorno y claves de API obligatorias y opcionales.\n- Servicios externos pagos que necesita (proveedor de modelos, hosting, almacenamiento) y quién los pagaría.\n- Si el README habla de consumo alto de tokens o de recursos (GPU, memoria).\n\n## 4. Qué datos toca\n\n- Qué datos entran (webs públicas, mails, facturas, contactos) y adónde salen (APIs externas, modelos).\n- Si junta datos personales, márcalo y recuerda respetar la ley de datos personales del país y las condiciones de uso de cada web.\n- Si el repo copia webs o marcas, recuerda que solo se usa con material del propio cliente y con su permiso.\n\n## 5. Demo\n\n- Propón cómo levantarlo en local con el comando que indica el README. Pide confirmación antes de correrlo.\n- Arma datos de ejemplo inventados del rubro del cliente (nunca datos reales de nadie) y guárdalos en una carpeta demo/.\n- Escribe demo/GUION.md: qué mostrar en 20 minutos, en qué orden, y qué decir si algo falla en vivo.\n\n## 6. Informe final\n\nEscribe EVALUACION.md con:\n\n1. Veredicto en una línea: se puede vender / se puede con cuidados / no conviene.\n2. Licencia y obligaciones concretas.\n3. Requisitos para correr y costos externos que pagaría el cliente.\n4. Riesgos: mantenimiento, datos, condiciones de uso.\n5. Horas estimadas de instalación y de mantenimiento mensual, marcadas como estimación. No inventes precios.\n6. Qué revisar cada mes para mantenerlo andando.\n"}, {"archivo": "ficha-servicio-repo-open-source.md", "que_es": "Plantilla de una página por servicio: para quién es, con qué está hecho, qué incluye la instalación y el mensual, qué no incluye, cuidados y guion de demo de 20 minutos.", "contenido": "# Ficha de servicio con un repo open source\n\nCompleta una ficha por servicio. Te sirve para la demo, para la propuesta y para no prometer de más. Lo que va entre corchetes lo completas tú.\n\n## El servicio en una frase\n\n[QUÉ LE RESUELVE AL CLIENTE, CON SUS PALABRAS. Ejemplo de forma: \"Te aviso cuando la competencia cambia un precio, sin que nadie tenga que entrar a mirar\".]\n\n## Para quién\n\n- Rubro: [RUBRO]\n- Tamaño: [CANTIDAD DE PERSONAS O VOLUMEN]\n- Señal de que lo necesita: [QUÉ HACEN HOY A MANO]\n\n## Con qué está hecho\n\n- Repo: [NOMBRE Y LINK]\n- Licencia: [MIT / APACHE 2.0 / BSD / OTRA] - Obligaciones: [POR EJEMPLO, MANTENER EL AVISO DE LICENCIA]\n- Corre en: [SERVIDOR DEL CLIENTE / NUBE A NOMBRE DEL CLIENTE / SU COMPUTADORA]\n- Requisitos: [DOCKER, PYTHON, NODE, BUN, CLAVES DE API]\n- Servicios externos que paga el cliente: [LISTA, O \"NINGUNO\"]\n\n## Qué incluye la instalación\n\n1. [INSTALAR Y CONFIGURAR EN SU INFRAESTRUCTURA]\n2. [ADAPTARLO A SU CASO: QUÉ SE CONFIGURA]\n3. [PRUEBAS CON SUS DATOS O CON DATOS DE EJEMPLO]\n4. [CAPACITACIÓN: CUÁNTAS PERSONAS, CUÁNTO TIEMPO]\n\n## Qué incluye el mensual\n\n- Actualizar el repo a versiones nuevas después de probarlas.\n- Revisar que siga corriendo y arreglar fallas.\n- [CANTIDAD] cambios chicos por mes.\n- Soporte por [CANAL] con respuesta en [PLAZO].\n\n## Qué NO incluye\n\n- [POR EJEMPLO: DESARROLLOS NUEVOS SOBRE EL REPO]\n- [POR EJEMPLO: COSTOS DE SERVIDOR O DE APIS]\n- [POR EJEMPLO: DATOS DE TERCEROS QUE NO SE PUEDAN JUNTAR LEGALMENTE]\n\n## Cuidados que le aviso al cliente\n\n- Datos: [QUÉ DATOS TOCA Y DÓNDE QUEDAN]\n- Condiciones de uso: [SI SE MIRAN WEBS DE TERCEROS, SE RESPETAN SUS CONDICIONES Y SU ROBOTS.TXT]\n- Dependencia: es un proyecto de la comunidad; si deja de mantenerse, [QUÉ HACEMOS].\n\n## Demo de 20 minutos\n\n1. Minuto 0 a 3: lo que hacen hoy a mano (preguntárselo, no contarlo yo).\n2. Minuto 3 a 13: la demo con datos de ejemplo de su rubro.\n3. Minuto 13 a 18: qué incluye, qué no y qué cuidados tiene.\n4. Minuto 18 a 20: próximo paso (propuesta por escrito).\n\n## Precio\n\n- Instalación: [SALE DE MIS HORAS Y DEL VALOR PARA EL CLIENTE]\n- Mensual: [IDEM]\n"}, {"archivo": "checklist-antes-de-vender-un-repo.md", "que_es": "Checklist para marcar antes de ofrecer un repo gratis como servicio pago: licencia, que esté mantenido, que corra, datos, demo, mantenimiento y propuesta.", "contenido": "# Checklist antes de vender un servicio armado con un repo gratis\n\nRepo: ____________________   Cliente posible: ____________________\n\n## Licencia\n- [ ] Leí el archivo LICENSE y sé cuál es.\n- [ ] Si es MIT, BSD o Apache 2.0: mantengo el aviso de licencia y copyright en el código que instalo.\n- [ ] Si es Apache 2.0: conservo el archivo NOTICE si existe y marco los archivos que modifiqué.\n- [ ] Si es GPL o AGPL: lo consulté antes de ofrecerlo como servicio modificado.\n- [ ] Revisé si alguna parte (modelos, carpetas de terceros, assets) tiene otra licencia.\n\n## Que esté vivo\n- [ ] Último commit y última versión publicada: __________\n- [ ] Miré los issues abiertos más comentados: ¿qué se rompe seguido?\n\n## Que corra\n- [ ] Lo levanté en mi máquina siguiendo el README, sin atajos.\n- [ ] Anoté versiones exactas (Python, Node, Bun, Docker) y variables de entorno.\n- [ ] Sé qué servicios externos necesita y quién los va a pagar (tiene que ser el cliente).\n\n## Datos y reglas\n- [ ] Sé qué datos entran y adónde salen.\n- [ ] Si toca datos personales: respeto la ley de mi país y la del cliente, y no los junto para mandar spam.\n- [ ] Si mira webs de terceros: leí sus condiciones de uso.\n- [ ] Si copia o rehace una web: es la del propio cliente y tengo su permiso por escrito.\n- [ ] Si procesa facturas o contratos: corre en un servidor del cliente o tengo su permiso por escrito.\n\n## Demo\n- [ ] Datos de ejemplo inventados del rubro, sin datos reales de nadie.\n- [ ] Guion de 20 minutos probado una vez de punta a punta.\n- [ ] Plan B si falla en vivo (capturas o un video corto grabado antes).\n\n## Mantenimiento\n- [ ] Sé cómo actualizarlo a una versión nueva y cómo volver atrás.\n- [ ] Hay copia de seguridad de los datos y la probé.\n- [ ] Tengo la lista de qué revisar cada mes.\n\n## Propuesta\n- [ ] Qué incluye, qué no incluye y qué cuidados tiene, por escrito.\n- [ ] Precio calculado con mis horas y el valor para el cliente, no copiado de otro.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

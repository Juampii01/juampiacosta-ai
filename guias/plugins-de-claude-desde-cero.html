<script>var GUIA = {"slug": "plugins-de-claude-desde-cero", "t": "Plugins de Claude desde cero: qué son y cómo instalarlos", "d": "Un plugin junta skills, conectores, comandos y agentes en un solo paquete. Qué es un marketplace, cómo instalar y cómo sacar lo que no usas, en la app y en Claude Code.", "tema": "Skills y plugins", "min": 10, "fichaNombre": "Plugins", "ficha": [["Qué es", "Un paquete que agrega varias piezas a Claude de una sola vez."], ["Dónde", "App web y de escritorio (Personalizar → Plugins; con la app en inglés, Customize → Plugins), Cowork y Claude Code. En la app están en los planes pagos (Pro, Max, Team y Enterprise)."], ["Qué no hace", "No te conecta solo a otros servicios: cada conector del plugin lo conectas tú."]], "secciones": [{"h": "Qué trae un plugin", "p": ["Un plugin es una carpeta con un archivo de datos (.claude-plugin/plugin.json) y cualquier combinación de estas piezas. No todas funcionan en todos lados:"], "lista": ["Skills: instrucciones para una tarea. Funcionan en el chat, en Cowork y en Claude Code.", "Comandos: acciones con nombre que corres con /plugin:comando en Cowork y Claude Code. En el chat se cargan como una skill.", "Conectores MCP: acceso a otra app o servicio. Los agregas y conectas desde la pestaña Conectores del plugin.", "Agentes: especialistas a los que Claude les pasa parte del trabajo. Solo en Cowork y Claude Code."]}, {"h": "Qué es un marketplace", "p": ["Un marketplace es un catálogo de plugins guardado en un repositorio de GitHub. Agregas el catálogo una vez y después instalas lo que quieras de ahí."], "lista": ["claude-plugins-official: el oficial de Anthropic. Claude Code lo agrega solo la primera vez que lo abres en la terminal.", "claude-community: plugins de terceros que sus autores enviaron a Anthropic y pasaron una validación automática y un control de seguridad. Cada plugin queda fijado a una versión exacta del código. Se agrega con /plugin marketplace add anthropics/claude-plugins-community y se instala con /plugin install nombre@claude-community.", "claude-code-plugins: el de demostración, en anthropics/claude-code. Muchos de sus plugins también están en el oficial: instálalos desde el oficial para no tener dos copias.", "De terceros: cualquier otro. Anthropic no los revisa."]}, {"h": "Instalar un plugin en la app", "pasos": ["Entra a Personalizar → Plugins.", "En Descubrir elige uno, lee qué trae y toca Agregar.", "Para sumar un catálogo: Agregar → Agregar marketplace, y pega la URL del repo o dueño/repo.", "Para un plugin que tienes en tu computadora: Agregar → Subir plugin, con el .zip o el archivo .plugin.", "Abre el plugin, ve a la pestaña Conectores y conecta los que necesite."], "p": ["El plugin queda guardado en tu cuenta. Lo tienes también en Cowork y, la próxima vez que abras Claude Code con esa cuenta, se descarga solo (escribe /reload-plugins para cargarlo en esa sesión). Para eso Claude Code tiene que estar en la versión 2.1.273 o más nueva y con sesión iniciada con tu cuenta de Claude: si lo usas con una clave de API o a través de un proveedor como Amazon Bedrock, no se sincroniza."]}, {"h": "Instalar un plugin en Claude Code", "pasos": ["Escribe /plugin. Se abre en la pestaña Discover con los plugins de tus catálogos.", "O ve directo: /plugin install commit-commands@claude-plugins-official. Eso abre la ficha del plugin, todavía no instala nada.", "Lee la sección Will install: ahí ves qué comandos, skills, agentes, hooks y servidores agrega.", "Elige el alcance: solo tú en todos tus proyectos, todo el equipo en este repo, o solo tú en este repo.", "Lee el resumen final. Si dice Plugin is now active., ya está andando. Si dice Run /reload-plugins to activate., Claude Code corre la recarga por ti; si esa recarga avisa que tu próximo mensaje va a releer toda la conversación, escribe /reload-plugins --force para activarlo igual.", "Comprueba: escribe / y busca las skills del plugin con la forma /plugin:skill."], "prompts": [{"t": "Revisar un plugin antes de instalarlo", "c": "Antes de instalar el plugin [NOMBRE]@[MARKETPLACE], busca su carpeta en el repositorio del marketplace y lee hooks/hooks.json, .mcp.json y la carpeta bin/ si existen.\nExplícame en palabras simples:\n1. Qué comandos corre en mi computadora y cuándo.\n2. A qué servidores o páginas se conecta.\n3. Si pide claves o permisos.\nNo instales nada: solo cuéntame y espera que te diga."}]}, {"h": "Desactivar, desinstalar y actualizar", "lista": ["En la app: abre el plugin en Personalizar → Plugins. El interruptor Disable plugin lo apaga, y en su menú tienes Quitar.", "En Claude Code: /plugin y pestaña Installed. Puedes escribir para filtrar la lista y, con Enter sobre un plugin, abres su detalle para activarlo, desactivarlo o desinstalarlo. Para actualizar, usa el comando de la terminal de más abajo.", "Desde la terminal: claude plugin disable, claude plugin enable y claude plugin uninstall, seguidos de nombre@marketplace.", "Actualizaciones: el catálogo oficial se actualiza solo. Los de terceros vienen con la actualización automática apagada; actualizas con claude plugin update nombre@marketplace.", "Sacar un catálogo: /plugin marketplace remove nombre. Ojo, desinstala todos los plugins que vinieron de ahí."]}, {"h": "Antes de instalar, piensa en seguridad", "p": ["En Claude Code, un plugin puede correr código en tu computadora con tus mismos permisos: sus hooks y sus servidores corren por fuera de las reglas de permisos de Claude. Además, si el catálogo se actualiza solo, los archivos que revisaste pueden cambiar."], "aviso": "Instala plugins solo de fuentes en las que confías y lee qué traen antes de aceptar."}], "faq": [{"q": "¿Qué diferencia hay entre una skill y un plugin?", "a": "La skill es una sola tarea. El plugin es la caja: puede traer varias skills, conectores, comandos y agentes juntos."}, {"q": "¿Lo que instalo en Claude Code aparece en la app?", "a": "No. Lo que instalas desde la terminal queda en esa computadora. Al revés sí funciona: lo que agregas a tu cuenta en la app se descarga en Claude Code."}, {"q": "¿Qué alcance elijo?", "a": "Si es para ti, el de usuario (todos tus proyectos). El de proyecto solo si trabajas en equipo sobre el mismo repo y todos lo necesitan."}], "fuentes": ["https://claude.com/docs/plugins/overview", "https://claude.com/docs/plugins/build", "https://code.claude.com/docs/en/discover-plugins", "https://code.claude.com/docs/en/plugins/anthropic-marketplaces", "https://code.claude.com/docs/en/plugins/security", "https://github.com/anthropics/claude-plugins-official", "https://support.claude.com/en/articles/13837440-use-plugins-in-claude", "https://code.claude.com/docs/en/plugins/cli-reference", "https://code.claude.com/docs/en/plugins/troubleshooting", "https://code.claude.com/docs/es/plugins/security"], "ejemplo": {"titulo": "Ejemplo resuelto: ordenar los plugins de una agencia web chica", "negocio": "Ejemplo inventado: una agencia de desarrollo web en Montevideo, Uruguay, con dos socios. Uno programa con Claude Code y el otro arma propuestas y textos en la app de Claude con plan Team.", "punto_de_partida": "Cada socio instalaba lo que veía en videos. Nadie sabía qué tenía cada uno ni qué corría en la computadora, y en el repo de un cliente aparecían skills que el otro no tenía.", "pasos": ["El socio de la app entró a Personalizar → Plugins, abrió Descubrir, leyó qué traía un plugin de productividad y lo agregó. En su pestaña Conectores vio que dos conectores figuraban como Not added: le pidió al owner de la organización que los agregara y después los conectó con su cuenta.", "El socio que programa actualizó Claude Code, cerró sesión e inició de nuevo con la cuenta de la organización, abrió una sesión y corrió /reload-plugins. Las skills del plugin de su socio aparecieron al escribir /.", "En la terminal escribió /plugin install commit-commands@claude-plugins-official, leyó Will install y eligió User scope, porque lo quiere en todos sus proyectos. Probó /commit-commands:commit con un cambio chico.", "Para el repo del cliente copió el settings-plugins-equipo.json del kit a .claude/settings.json, puso en enabledPlugins solo commit-commands@claude-plugins-official y lo subió al repo. Así cualquiera que abra ese repo tiene lo mismo.", "Un video recomendaba un plugin de un marketplace de terceros. Antes de instalarlo, clonó el repo en una carpeta temporal y le pidió a Claude Code: \"Usa revisar-plugin con esta carpeta\". El informe mostró un hook que descargaba y ejecutaba un script de internet en cada inicio de sesión. Decidieron no instalarlo.", "Repasaron juntos la pestaña Installed y sacaron con claude plugin uninstall dos plugins que nadie usaba. Anotaron lo que quedó con la checklist del kit."], "resultado": "Cada socio sabe qué plugins tiene y por qué. El repo del cliente declara sus plugins en .claude/settings.json, y todo plugin de terceros pasa por la checklist y la skill revisar-plugin antes de entrar a una computadora de la agencia."}, "si_falla": [{"sintoma": "Escribes /plugin y Claude responde \"/plugin isn't available in this environment\".", "solucion": "Estás en un lugar sin terminal para el panel: la pestaña Code de la app de escritorio, la extensión de VS Code, Claude Code en la web o claude -p. En la app de escritorio usa el botón + al lado del cuadro de texto, después Plugins y Add plugin. Si no, abre una terminal, corre claude y escribe /plugin ahí, o instala directo con claude plugin install nombre@marketplace."}, {"sintoma": "Al instalar aparece Marketplace \"claude-plugins-official\" not found.", "solucion": "El catálogo oficial todavía no se registró en esa computadora (pasa si solo usaste la extensión de VS Code o si una política lo bloqueó). Escribe /plugin marketplace add anthropics/claude-plugins-official y repite la instalación. Si el error nombra otro marketplace, pídele a quien te pasó el comando de qué repo sale y agrégalo primero."}, {"sintoma": "Instalaste un plugin pero sus skills no aparecen al escribir /.", "solucion": "Abre /plugin, pestaña Installed, y confirma que esté activado. Después mira la pestaña Errors. Si no hay errores y lo instalaste en esta sesión, corre /reload-plugins. Si sigue sin aparecer, borra la caché con rm -rf ~/.claude/plugins/cache, reinicia Claude Code y vuelve a instalarlo."}, {"sintoma": "Agregaste un plugin en la app pero no aparece en Claude Code.", "solucion": "Revisa tres cosas: que Claude Code esté en la versión 2.1.273 o más nueva (claude --version), que hayas iniciado sesión con la misma cuenta y organización (no con una clave de API ni con Bedrock) y que hayas corrido /reload-plugins o abierto una sesión nueva. Si tu organización puso syncClaudeAiPlugins en false, la sincronización está apagada a propósito: háblalo con el owner."}, {"sintoma": "En Personalizar → Plugins, Agregar → Subir plugin rechaza tu archivo, o Agregar marketplace no puede leer un repo privado.", "solucion": "Para subir: el .zip o .plugin tiene que tener un solo .claude-plugin/plugin.json adentro; comprime la carpeta del plugin o su contenido, pero no varios plugins juntos. Para un repo privado de GitHub: cuando el diálogo lo pida, conecta tu cuenta de GitHub (Connect GitHub) e instala la Claude GitHub App con acceso a ese repo."}], "kit": [{"archivo": "revisar-plugin/SKILL.md", "que_es": "Skill para Claude Code que lee un plugin (hooks, servidores, ejecutables, skills) sin ejecutarlo y te da un informe simple con un veredicto. Copia la carpeta a ~/.claude/skills/ y pídele \"Usa revisar-plugin con [RUTA O REPO]\".", "contenido": "---\nname: revisar-plugin\ndescription: Revisa un plugin de Claude Code antes de instalarlo y explica qué corre en tu computadora, a qué se conecta y qué riesgos tiene. Úsala cuando pidas revisar o auditar un plugin o un marketplace.\n---\n\n# Revisar un plugin antes de instalarlo\n\nTu trabajo es leer un plugin y explicarle a una persona que no programa qué hace y qué riesgo tiene. No instalas nada, no corres los hooks ni los scripts del plugin y no habilitas nada.\n\n## Qué te pasan\n\nUna de estas tres cosas:\n- La ruta a una carpeta en la computadora (un plugin o un marketplace clonado).\n- Un repo de GitHub con la forma dueño/repo o su URL.\n- El nombre del plugin con la forma nombre@marketplace.\n\nSi te pasan un repo, pide permiso para clonarlo en una carpeta temporal fuera del proyecto. Si no hay permiso, trabaja solo con lo que la persona pegue.\n\n## Pasos\n\n1. Encuentra la carpeta del plugin: es la que tiene `.claude-plugin/plugin.json`. Si es un marketplace, abre `.claude-plugin/marketplace.json`, lista los plugins y pregunta cuál revisar.\n2. Lee `plugin.json`: nombre, versión, autor, página y licencia.\n3. Lee estos archivos si existen, completos:\n   - `hooks/hooks.json`: qué comando corre cada hook y en qué evento.\n   - `.mcp.json`: qué servidor arranca o a qué URL se conecta cada uno.\n   - Todo lo que haya en `bin/` y en `scripts/`.\n   - Las carpetas `skills/`, `commands/` y `agents/`: solo un resumen de qué le piden a Claude.\n4. Si Claude Code está instalado, corre `claude --plugin-dir RUTA-DEL-PLUGIN plugin details NOMBRE-DEL-PLUGIN` para tener el inventario de componentes. Solo lee archivos, no abre una sesión.\n5. Busca señales de alerta: comandos que descargan y ejecutan algo de internet, que borran archivos, que leen `.env`, claves, `~/.ssh` o el llavero, que mandan datos a dominios que no son del autor, o código ofuscado. Si algo no lo entiendes, dilo: no lo des por bueno.\n\n## Qué entregas\n\nUn informe con estas secciones, en este orden y en lenguaje simple:\n\n1. **Qué es**: una línea.\n2. **Qué corre en tu computadora y cuándo**: cada hook, servidor y ejecutable, con el evento que lo dispara.\n3. **A qué se conecta**: cada dominio o servicio, y si pide clave o cuenta.\n4. **Qué le pide a Claude**: resumen de skills, comandos y agentes.\n5. **Señales de alerta**: lista concreta con el archivo y la línea. Si no hay, escribe \"No encontré señales de alerta en los archivos que leí\".\n6. **Veredicto**: INSTALAR, INSTALAR CON CUIDADO o NO INSTALAR, con el motivo en una línea.\n7. **Si lo instalas**: el alcance que conviene (User, Project o Local) y el comando para sacarlo después (`claude plugin uninstall NOMBRE@MARKETPLACE`).\n\n## Reglas\n\n- Nunca ejecutes hooks, scripts ni binarios del plugin para \"ver qué hacen\".\n- Si el marketplace tiene la actualización automática prendida, avisa que los archivos revisados pueden cambiar con una actualización.\n- No afirmes que un plugin es seguro. Di qué revisaste y qué no.\n"}, {"archivo": "settings-plugins-equipo.json", "que_es": "Plantilla de .claude/settings.json para que todo el equipo tenga los mismos plugins en un repo. Reemplaza los nombres en mayúsculas: la clave de extraKnownMarketplaces tiene que ser el name del marketplace.json de ese repo. Si un plugin viene de una fuente externa, cada persona igual tiene que correr claude plugin install nombre@marketplace --scope project.", "contenido": "{\n  \"extraKnownMarketplaces\": {\n    \"NOMBRE-DEL-MARKETPLACE\": {\n      \"source\": {\n        \"source\": \"github\",\n        \"repo\": \"TU-ORGANIZACION/TU-REPO-DE-PLUGINS\"\n      }\n    }\n  },\n  \"enabledPlugins\": {\n    \"commit-commands@claude-plugins-official\": true,\n    \"NOMBRE-DEL-PLUGIN@NOMBRE-DEL-MARKETPLACE\": true\n  }\n}\n"}, {"archivo": "checklist-antes-de-instalar-un-plugin.md", "que_es": "Checklist corta para decidir si instalas un plugin, dónde y cómo sacarlo después. Sirve para la app y para Claude Code.", "contenido": "# Checklist antes de instalar un plugin\n\nÚsala cada vez que vayas a sumar un plugin, en la app o en Claude Code. Si una respuesta es \"no sé\", frena y averigua.\n\n## 1. De dónde viene\n\n- [ ] Sé de qué marketplace sale: claude-plugins-official (oficial de Anthropic), claude-community (de terceros enviados a Anthropic), claude-code-plugins (demo) o uno de terceros.\n- [ ] Si es de terceros, conozco al autor o al repo, y el repo tiene actividad reciente y una página que explica qué hace.\n- [ ] Si alguien me pasó una línea `/plugin install nombre@marketplace`, le pedí también de qué repo sale ese marketplace.\n\n## 2. Qué trae\n\n- [ ] Leí la sección Will install en `/plugin` (o la ficha del plugin en Personalizar → Plugins).\n- [ ] Si trae hooks, leí `hooks/hooks.json` y entiendo qué comando corre cada uno.\n- [ ] Si trae servidores MCP, leí `.mcp.json` y sé a qué se conecta.\n- [ ] Si trae carpeta `bin/`, sé qué ejecutables agrega.\n- [ ] Si no lo puedo leer yo, usé la skill revisar-plugin o el prompt \"Revisar un plugin antes de instalarlo\" de la guía.\n\n## 3. Qué necesita\n\n- [ ] Sé qué conectores usa y que cada uno lo conecto yo desde la pestaña Conectores del plugin.\n- [ ] Sé si el servicio que conecta pide cuenta o plan pago propio.\n- [ ] En Team o Enterprise, sé si el owner tiene que agregar algún conector antes.\n\n## 4. Dónde lo instalo\n\n- [ ] Elige el alcance: User (solo yo, todos mis proyectos), Project (todo el equipo en este repo) o Local (solo yo, este repo).\n- [ ] Si es Project, avisé al equipo: va a quedar en `.claude/settings.json`.\n\n## 5. Después de instalar\n\n- [ ] Lo probé con una tarea real.\n- [ ] Si no sirvió, lo desactivé o lo saqué (`/plugin`, pestaña Installed, Enter sobre el plugin).\n- [ ] Anoté cómo sacarlo: `claude plugin uninstall nombre@marketplace`.\n- [ ] Si el marketplace es de terceros, decide si prendo la actualización automática (viene apagada) o actualizo a mano con `claude plugin update nombre@marketplace`.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "úsalo"};</script>

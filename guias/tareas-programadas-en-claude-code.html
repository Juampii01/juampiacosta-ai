<script>var GUIA = {"slug": "tareas-programadas-en-claude-code", "t": "Tareas programadas: Claude Code trabajando solo", "d": "Tres formas oficiales de dejar a Claude Code haciendo algo a una hora o cada cierto tiempo: en la nube, en tu compu o mientras tenés la sesión abierta.", "tema": "Claude Code", "min": 10, "fichaNombre": "Tareas programadas", "ficha": [["En la nube", "Corre aunque tu compu esté apagada. Se crea en claude.ai/code/routines, desde la app de escritorio o con /schedule."], ["En tu compu", "Desde la app de escritorio. Tiene acceso a tus archivos, pero solo corre con la app abierta y la compu despierta."], ["Mientras trabajás", "/loop repite un pedido mientras la sesión sigue abierta."], ["Necesitás", "Plan Pro, Max, Team o Enterprise. Para que una tarea en la nube trabaje sobre tu proyecto, un repositorio en GitHub."]], "secciones": [{"h": "Cuál te conviene", "lista": ["Tarea en la nube: para algo que tiene que correr sí o sí, aunque cierres la compu. Trabaja sobre una copia nueva de tu repositorio de GitHub, no sobre tus archivos locales. Como mínimo, una vez por hora.", "Tarea local de la app de escritorio: cuando necesita tus archivos o programas. Corre solo con la app abierta y la compu despierta.", "/loop: para vigilar algo durante un rato mientras trabajás, por ejemplo si terminó una publicación. Deja de correr al cerrar la sesión. Si la retomás con claude --resume o --continue, vuelven las repeticiones con intervalo fijo que no vencieron (las que dejaste a criterio de Claude no: hay que correr /loop de nuevo)."], "p": ["Las tareas en la nube están en vista previa (research preview): pueden cambiar cómo funcionan y sus límites."]}, {"h": "Tarea en la nube", "pasos": ["Entrá a claude.ai/code/routines y tocá New task (en algunas cuentas todavía dice New routine). Si te ofrece Create with Claude o Set up manually, elegí la que prefieras: la primera lo arma charlando.", "Ponele nombre y escribí el pedido. Tiene que entenderse solo, porque nadie va a estar ahí para aclararle nada.", "En Trigger elegí Schedule y una frecuencia, por ejemplo por hora, diaria o semanal.", "En Advanced settings elegí el repositorio de GitHub y el entorno (Default sirve para empezar).", "En la pestaña Connectors sacá los conectores que la tarea no necesita.", "Tocá Create. Para probarla ya, tocá Run now en su página."], "prompts": [{"t": "Crearla desde la terminal", "c": "/schedule todos los lunes a las 9, revisá los cambios de la semana en este repositorio y armá un resumen simple de qué se hizo y qué quedó pendiente"}], "aviso": "Los conectores que dejes incluidos los puede usar para escribir (mandar mensajes, crear tareas) y todo sale a tu nombre. Dejá solo los necesarios."}, {"h": "Tarea local en la app de escritorio", "pasos": ["En la pestaña Code, tocá Scheduled en la barra lateral (o en el menú More) y después New task. Si se abre un menú con Create with Claude y Set up manually, elegí Set up manually.", "Ponele nombre y escribí las instrucciones.", "En Advanced settings, pestaña General, prendé Only on this computer y elegí la carpeta en Local folder.", "En Trigger elegí Hourly, Daily, Weekdays o Weekly.", "Elegí el modo de permisos y el modelo en la barra del cuadro de instrucciones, y tocá Create.", "Tocá Run now una vez y aprobá los permisos que pida con \"always allow\": así las próximas no se traban esperándote."], "p": ["Si la compu estuvo dormida a la hora de la tarea, se saltea. Al despertar hace una sola corrida de recuperación por la última que perdió. Para que no se duerma sola, en Settings → This computer → System está Keep computer awake (cerrar la tapa la duerme igual)."]}, {"h": "/loop: repetir mientras trabajás", "lista": ["/loop 10m [pedido]: lo repite cada 10 minutos. Unidades: s, m, h y d.", "/loop [pedido]: Claude decide cada cuánto, entre un minuto y una hora.", "Recordatorio de una vez: escribile \"recordame a las 15 que revise el formulario\".", "Para ver o cancelar: \"¿qué tareas programadas tengo?\" o \"cancelá la tarea de revisar el formulario\"."], "aviso": "Solo corre mientras Claude Code está abierto. Las tareas que se repiten se borran solas a los 7 días."}, {"h": "Escribí bien el pedido", "p": ["Una tarea programada trabaja sin vos. Decile qué revisar, qué hacer si no hay nada nuevo y qué no tiene que tocar."], "prompts": [{"t": "Plantilla de tarea programada", "c": "Tarea: [QUÉ TIENE QUE HACER].\nDónde mirar: [CARPETA, REPOSITORIO O CONECTOR].\nQué me tenés que dejar: [EJ.: UN RESUMEN DE 5 LÍNEAS EN RESUMEN.MD].\nSi no hay nada nuevo: escribí \"sin novedades\" y terminá.\nNo hagas: borrar archivos, publicar nada ni mandar mensajes a nadie.\nSi algo falla, anotá qué pasó y no intentes arreglarlo solo."}]}], "faq": [{"q": "/schedule dice \"Unknown command\"", "a": "Necesitás haber iniciado sesión con una cuenta de claude.ai (no con una clave de API). Probá /login. Si no, creala desde claude.ai/code/routines."}, {"q": "¿Gasta de mi plan?", "a": "Sí. Las tareas en la nube usan tu límite igual que una sesión normal."}, {"q": "Mi tarea local no corrió", "a": "Revisá que la app estuviera abierta y la compu despierta. En el historial de la tarea, pasando el mouse por la corrida salteada, te dice por qué."}], "fuentes": ["https://code.claude.com/docs/en/routines", "https://code.claude.com/docs/en/desktop-scheduled-tasks", "https://code.claude.com/docs/en/scheduled-tasks", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/cloud-environments"], "ejemplo": {"titulo": "Ejemplo resuelto: las tres formas en una agencia web chica", "negocio": "Ejemplo inventado: una agencia de dos personas en Montevideo que mantiene las webs de cinco comercios del barrio. Cada web está en un repositorio de GitHub y usan plan Pro.", "punto_de_partida": "Los lunes se olvidaban de contarle a cada cliente qué se había cambiado en su web, y los pedidos de la tienda de un cliente llegaban como .csv a una carpeta que nadie revisaba hasta la tarde.", "pasos": ["Entraron a claude.ai/code/routines y tocaron New task. Eligieron Set up manually, le pusieron de nombre resumen-semanal-panaderia y pegaron el pedido 1 del kit.", "En Trigger eligieron Schedule semanal, los lunes a las 8:07 (evitaron las 8 en punto). En Advanced settings eligieron el repositorio de la web de la panadería y dejaron el entorno Default.", "En la pestaña Connectors sacaron Gmail y Google Calendar, porque el resumen solo deja un archivo en un pull request. Tocaron Create y después Run now para probarla.", "Revisaron la primera corrida: el resumen hablaba de \"refactor del componente Header\". Ajustaron el pedido para que lo escriba como lo diría a un cliente: \"se cambió el menú de arriba\".", "Para los pedidos, en la app de escritorio fueron a Code, Scheduled, New task, Set up manually. Prendieron Only on this computer, eligieron la carpeta de descargas de pedidos en Local folder y Weekdays en Trigger. Pegaron el pedido 2 del kit.", "Tocaron Run now, aprobaron con \"always allow\" la lectura de archivos y prendieron Keep computer awake en Settings, This computer, System.", "Un día de publicación grande usaron el pedido 3 con /loop 5m mientras seguían trabajando en otra cosa, y lo cancelaron pidiéndole \"cancelá el chequeo de la publicación\" cuando terminó."], "resultado": "Cada lunes queda un pull request con el resumen de la semana para mandarle al cliente, y cada día hábil un archivo con los pedidos que tienen datos incompletos. Ninguna tarea manda mensajes ni toca código: eso lo siguen haciendo ellos."}, "si_falla": [{"sintoma": "/schedule responde Unknown command o dice que está disponible con Claude for Enterprise.", "solucion": "/schedule necesita que entres con una cuenta de claude.ai. Corré /login. Si igual falla, fijate si tenés ANTHROPIC_API_KEY o ANTHROPIC_AUTH_TOKEN en tu terminal, o apiKeyHelper en settings.json: tienen prioridad sobre tu login y hay que sacarlos. Mientras tanto, creala desde claude.ai/code/routines."}, {"sintoma": "La tarea local quedó trabada y no terminó nunca.", "solucion": "Está esperando que apruebes un permiso. Abrí la tarea en Scheduled, tocá la corrida en History y respondé el pedido ahí. Para que no vuelva a pasar, aprobá con \"always allow\". Las herramientas que piden confirmación en cada uso no ofrecen esa opción y van a trabarla siempre."}, {"sintoma": "La tarea en la nube corre a una hora distinta de la que pusiste.", "solucion": "Si usaste Custom con una expresión cron, las horas van en UTC. Para Argentina o Uruguay (UTC-3), las 9 de la mañana son 12 en UTC. Otra opción es dejar el prefijo CRON_TZ= con tu zona. Si la pusiste en punto, puede arrancar unos minutos tarde: usá 9:07 en vez de 9:00."}, {"sintoma": "La tarea en la nube falla al instalar algo o al entrar a un sitio, con un error 403 y host_not_allowed.", "solucion": "El entorno Default solo deja salir a una lista de sitios conocidos (gestores de paquetes y similares). Editá el entorno desde Advanced settings, General, Cloud environment: en Network access elegí Custom y sumá el dominio en Allowed domains. Los conectores no necesitan este cambio."}, {"sintoma": "La tarea en la nube dejó de correr y en History dice que el repositorio no estaba disponible.", "solucion": "Revisá que tu conexión con GitHub siga activa y cubra ese repositorio. Si se venció, la tarea saltea corridas hasta 72 horas y vuelve sola cuando reconectás. Pasado ese plazo se apaga y hay que prenderla de nuevo después de reconectar."}], "kit": [{"archivo": "pedidos-tareas-programadas-claude-code.md", "que_es": "Cuatro pedidos listos para pegar: resumen semanal en la nube, revisión diaria local, /loop para vigilar una publicación y un recordatorio de una vez.", "contenido": "# Pack de pedidos para tareas programadas de Claude Code\n\nCada pedido está escrito para correr solo, sin nadie que aclare nada. Cambiá lo que está entre corchetes. Todos dicen qué hacer si no hay novedades y qué no tocar.\n\n## 1. Resumen semanal del repositorio (tarea en la nube)\n\nDónde: claude.ai/code/routines, New task, Trigger Schedule semanal. Repositorio: el de tu web o app.\n\n```\nTarea: armar el resumen semanal de cambios de este repositorio.\nDónde mirar: los commits y pull requests de los últimos 7 días en la rama principal.\nQué me tenés que dejar: un archivo resumenes/semana-[FECHA DE HOY].md con tres secciones:\n- Qué se terminó (una línea por cambio, en lenguaje que entienda alguien que no programa).\n- Qué quedó abierto (pull requests sin mergear, con su autor).\n- Qué conviene mirar (pruebas que fallan, archivos que cambiaron mucho).\nSubí ese archivo en una rama claude/resumen-semanal y abrí un pull request.\nSi no hubo commits en la semana: escribí \"sin novedades\" en el archivo y terminá.\nNo hagas: tocar código, mergear nada, borrar ramas.\nSi algo falla, anotá en el archivo qué pasó y no intentes arreglarlo solo.\n```\n\n## 2. Revisión diaria de pedidos en una carpeta (tarea local, app de escritorio)\n\nDónde: app de escritorio, pestaña Code, Scheduled, New task, Only on this computer, Local folder = la carpeta donde se descargan los pedidos. Trigger: Weekdays.\n\n```\nTarea: revisar los pedidos nuevos de hoy.\nDónde mirar: los archivos .csv de esta carpeta con fecha de hoy en el nombre.\nQué me tenés que dejar: un archivo resumen-pedidos-[FECHA].md con la cantidad de pedidos, los que tienen dirección incompleta o teléfono vacío, y los productos que aparecen más de una vez.\nImportante: si hoy es sábado o domingo, o si son más de las 18, escribí \"corrida fuera de horario, no revisé\" y terminá.\nSi no hay archivos de hoy: escribí \"sin pedidos nuevos\" y terminá.\nNo hagas: modificar ni borrar los .csv, mandar mensajes, instalar nada.\nSi un archivo no se puede leer, anotalo en el resumen y seguí con los demás.\n```\n\n## 3. Vigilar una publicación mientras trabajás (/loop)\n\nDónde: en la sesión de Claude Code que tenés abierta.\n\n```\n/loop 5m fijate si terminó la publicación del sitio en [PLATAFORMA O COMANDO PARA VER EL ESTADO]. Si terminó bien, decime la URL y dejá de chequear. Si falló, mostrame las últimas 20 líneas del error y dejá de chequear. Si sigue en curso, respondé solo \"sigue\".\n```\n\nPara frenarlo, pedile: \"cancelá el chequeo de la publicación\". Esc no frena un /loop con intervalo fijo.\n\n## 4. Recordatorio de una sola vez\n\n```\nrecordame a las 16:10 que revise si el cliente respondió el mail del presupuesto\n```\n\nTip: si la hora importa, evitá las en punto y las y media. Los recordatorios en :00 y :30 pueden saltar hasta 90 segundos antes.\n"}, {"archivo": "loop-md-mantenimiento-del-proyecto.md", "que_es": "Instrucciones para el /loop sin pedido. Copialo como .claude/loop.md en tu proyecto (o ~/.claude/loop.md para todos) y al escribir /loop solo, Claude usa esto en lugar del pedido por defecto.", "contenido": "Revisá el estado del trabajo en curso de este proyecto, en este orden:\n\n1. Si quedó una tarea a medio hacer en esta conversación, seguila hasta el próximo punto en que puedas mostrar algo que funcione.\n2. Si la rama actual tiene un pull request abierto, mirá si fallaron las pruebas o si hay comentarios nuevos. Si hay un arreglo claro y chico, hacelo y explicalo en una línea. Si no es claro, preguntame.\n3. Si no hay nada de lo anterior, decí en una sola línea \"todo tranquilo\" y no hagas nada más.\n\nNunca hagas push a la rama principal, no borres archivos ni ramas, y no instales dependencias nuevas sin preguntarme.\n"}, {"archivo": "checklist-antes-de-programar-una-tarea.md", "que_es": "Checklist para elegir dónde corre la tarea, escribir el pedido y revisar permisos, conectores y horario antes de dejarla sola.", "contenido": "# Checklist: antes de dejar una tarea programada corriendo sola\n\n## Elegir dónde corre\n\n- [ ] Tiene que correr aunque la compu esté apagada: tarea en la nube (claude.ai/code/routines o /schedule). Necesita repositorio en GitHub.\n- [ ] Necesita archivos o programas de tu compu: tarea local de la app de escritorio. La app abierta y la compu despierta.\n- [ ] Es para vigilar algo durante un rato: /loop en la sesión abierta.\n\n## El pedido\n\n- [ ] Se entiende solo, sin contexto de una charla anterior.\n- [ ] Dice dónde mirar (carpeta, repositorio, conector).\n- [ ] Dice qué dejar y dónde (archivo, pull request, mensaje).\n- [ ] Dice qué hacer si no hay novedades.\n- [ ] Dice qué no tocar.\n- [ ] Si la hora importa, dice qué hacer si corre tarde (una tarea local que se salteó corre al despertar la compu).\n\n## Permisos y conectores\n\n- [ ] Nube: en Advanced settings, pestaña Connectors, saqué los conectores que no usa. Lo que haga sale a mi nombre.\n- [ ] Nube: si necesita entrar a un sitio fuera de la lista por defecto, edité el acceso de red del entorno.\n- [ ] Local: hice Run now una vez y aprobé con \"always allow\" lo que pidió.\n\n## Horario\n\n- [ ] Nube: si usé Custom con una expresión cron, las horas van en UTC (o con el prefijo CRON_TZ=).\n- [ ] Evité las en punto: 9:07 en vez de 9:00 arranca más cerca de la hora.\n\n## Primera semana\n\n- [ ] Revisé cada corrida en el historial de la tarea.\n- [ ] Ajusté el pedido con lo que salió mal.\n- [ ] Recién ahí la dejé sin mirar todos los días.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

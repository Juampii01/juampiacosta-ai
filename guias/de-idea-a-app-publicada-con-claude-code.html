í casos que deberían fallar a propósito (campos vacíos, datos raros, usuario sin permiso).\nPara cada prueba: qué hago, qué debería pasar. Formato de lista para tildar."}]}, {"h": "Tramo 5: publicar", "pasos": ["Pedile a Claude que suba el proyecto a un repositorio de GitHub (revisando antes que no haya claves en el código).", "En Vercel: botón New Project, elegís el repositorio, revisás la configuración y tocás Deploy. En Netlify: Add new project → Import an existing project.", "Cargá las variables de entorno (las claves) en la configuración del proyecto, no en el código.", "Abrí el link que te dan y repetí las pruebas del tramo 4 en la versión publicada."], "aviso": "Nunca pegues claves secretas en el chat ni las dejes escritas en el código. Van en las variables de entorno de Vercel o Netlify."}], "faq": [{"q": "¿Puedo saltear la especificación si la app es chica?", "a": "Podés, pero aunque sea escribí cinco líneas: qué hace, para quién y qué no hace. Es lo que evita que Claude agregue cosas que no pediste."}, {"q": "¿Vercel o Netlify?", "a": "Las dos conectan tu repositorio de GitHub y publican solas cada vez que subís cambios. Elegí una y quedate con esa; la guía de publicar te muestra los pasos de ambas."}, {"q": "¿Cuánto tarda todo el camino?", "a": "Depende del tamaño de la app. Lo que sí podés controlar es que cada parte quede probada y guardada antes de pasar a la siguiente."}], "fuentes": ["https://code.claude.com/docs/en/common-workflows", "https://code.claude.com/docs/en/commands", "https://vercel.com/docs/git", "https://docs.netlify.com/start/quickstarts/deploy-from-repository"]};</script>

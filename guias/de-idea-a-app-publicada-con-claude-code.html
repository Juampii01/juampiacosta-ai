<script>var GUIA = {"slug": "de-idea-a-app-publicada-con-claude-code", "post": "APP", "t": "De idea a app publicada con Claude Code", "d": "El recorrido completo en cinco tramos: idea, especificación, construir, probar y publicar en Vercel o Netlify. Con los prompts de cada paso.", "tema": "Crea tu app", "min": 11, "fichaNombre": "De idea a app", "ficha": [["Qué es", "Un mapa del camino entero para que no te pierdas a mitad de proyecto."], ["Necesitas", "Claude Code, una cuenta de GitHub y una cuenta de Vercel o Netlify."], ["Orden", "Idea → especificación → construir por partes → probar → publicar."], ["Qué no hace", "No reemplaza probar tú la app: Claude construye, tú decides si está bien."]], "secciones": [{"h": "El camino en cinco tramos", "p": ["La mayoría de las apps hechas con IA se traban por lo mismo: se arranca a programar sin saber bien qué se quiere, y a la tercera vuelta nadie entiende qué hace cada cosa. Si sigues estos tramos en orden, cada uno te deja listo el siguiente."], "lista": ["Idea: una frase que diga qué hace la app y para quién.", "Especificación: un documento corto con pantallas, datos y lo que la app NO hace.", "Construir: Claude Code arma la app por partes, siguiendo ese documento.", "Probar: la usas como si fueras el cliente y anotas lo que falla.", "Publicar: la subes a GitHub y la conectas con Vercel o Netlify para tener un link real."]}, {"h": "Tramos 1 y 2: de la idea al documento", "p": ["No le pidas a Claude \"hazme una app de turnos\". Pídele primero que te entreviste y que escriba la especificación. Ese archivo va a ser la referencia de todo lo que venga después.", "Cuando termine, léela entera. Si algo no es como lo imaginabas, corrígelo ahora: cambiar una línea de texto es gratis, cambiar una app armada no."], "prompts": [{"t": "Prompt de especificación", "c": "Quiero construir una app y antes de escribir código necesito una especificación corta.\nMi idea en una frase: [QUÉ HACE TU APP].\nPara quién es: [QUIÉN LA VA A USAR].\nEntrevístame de a una pregunta por vez hasta tener claro:\n1. Qué problema resuelve y cómo sabemos que funciona.\n2. Quién la usa (y si hay distintos tipos de usuario, como cliente y administrador).\n3. Las pantallas, en orden, y qué se puede hacer en cada una.\n4. Qué datos se guardan y quién puede ver o cambiar cada uno.\n5. Qué NO hace en esta primera versión.\nCuando tengas todo, arma el documento en un archivo ESPECIFICACION.md, con lenguaje simple, sin código. Al final agrega una lista de preguntas abiertas. No empieces a programar."}]}, {"h": "Tramo 3: construir por partes", "pasos": ["Pídele a Claude que lea ESPECIFICACION.md y te proponga un plan dividido en partes chicas (por ejemplo: pantalla de inicio, formulario, guardar datos, login).", "Aprueba el plan o corrígelo antes de que toque un archivo. Para que no pueda editar nada antes de tiempo, pide el plan en modo plan: aprieta Shift+Tab (o empieza el pedido con /plan). Claude lee y propone, y recién edita cuando apruebas el plan.", "Pídele la primera parte sola. Cuando funcione, pídele que guarde un commit en Git con un mensaje claro.", "Repite parte por parte. Si una parte sale mal, vuelves al último commit y no pierdes lo anterior."], "prompts": [{"t": "Construir siguiendo la especificación", "c": "Lee @ESPECIFICACION.md.\nProponme un plan para construir la app en partes chicas, en orden, donde cada parte se pueda probar sola.\nNo escribas código todavía. Cuando yo apruebe, haz solo la parte 1, explícame cómo la pruebo y espera mi OK antes de seguir.\nSi algo de la especificación no está claro, pregúntame en vez de inventar."}]}, {"h": "Tramo 4: probar como si fueras el cliente", "p": ["Abre la app y úsala de punta a punta, como lo haría alguien que nunca la vio. Prueba también lo que no debería poder hacerse: dejar campos vacíos, poner letras donde van números, entrar sin estar logueado.", "Antes de publicar, en Claude Code tienes /diff para ver qué cambió y /code-review para que revise los cambios buscando errores."], "prompts": [{"t": "Lista de pruebas", "c": "Según @ESPECIFICACION.md, ármame una lista de pruebas para hacer a mano, como si yo fuera un cliente que usa la app por primera vez.\nIncluye casos que deberían fallar a propósito (campos vacíos, datos raros, usuario sin permiso).\nPara cada prueba: qué hago, qué debería pasar. Formato de lista para tildar."}]}, {"h": "Tramo 5: publicar", "pasos": ["Pídele a Claude que suba el proyecto a un repositorio de GitHub (revisando antes que no haya claves en el código).", "En Vercel: botón New Project, eliges el repositorio, revisas la configuración y tocas Deploy. En Netlify: Add new project → Import an existing project.", "Carga las variables de entorno (las claves) en la configuración del proyecto, no en el código. En Vercel están en Settings → Environment Variables. Si agregas o cambias una después de publicar, vuelve a publicar: los cambios solo aplican a los deploys nuevos.", "Abre el link que te dan y repite las pruebas del tramo 4 en la versión publicada."], "aviso": "Nunca pegues claves secretas en el chat ni las dejes escritas en el código. Van en las variables de entorno de Vercel o Netlify."}], "faq": [{"q": "¿Puedo saltear la especificación si la app es chica?", "a": "Puedes, pero aunque sea escribe cinco líneas: qué hace, para quién y qué no hace. Es lo que evita que Claude agregue cosas que no pediste."}, {"q": "¿Vercel o Netlify?", "a": "Las dos conectan tu repositorio de GitHub y publican solas cada vez que subes cambios. Elige una y quédate con esa; la guía de publicar te muestra los pasos de ambas."}, {"q": "¿Cuánto tarda todo el camino?", "a": "Depende del tamaño de la app. Lo que sí puedes controlar es que cada parte quede probada y guardada antes de pasar a la siguiente."}], "fuentes": ["https://code.claude.com/docs/en/common-workflows", "https://code.claude.com/docs/en/commands", "https://vercel.com/docs/git", "https://docs.netlify.com/start/quickstarts/deploy-from-repository", "https://code.claude.com/docs/en/permission-modes", "https://vercel.com/docs/environment-variables/managing-environment-variables", "https://vercel.com/docs/getting-started-with-vercel/import", "https://code.claude.com/docs/en/memory"], "ejemplo": {"titulo": "Ejemplo resuelto: de la idea a la app publicada para una verdulería con pedidos", "negocio": "Ejemplo inventado: una verdulería con reparto a domicilio en el centro de Rosario, atendida por el dueño y su hija. Toman pedidos por WhatsApp y los anotan en un cuaderno. La hija sabe usar la computadora pero no programa.", "punto_de_partida": "Los pedidos llegan desordenados, con audios y fotos, y a la tarde no saben qué hay que armar ni a dónde llevarlo. Quieren una página donde el cliente arme el pedido y ellos vean la lista del día.", "pasos": ["Tramos 1 y 2: la hija abrió Claude Code en una carpeta nueva y pegó el prompt de especificación con la idea \"una página donde los clientes del barrio arman su pedido de verdura y nosotros vemos los pedidos del día\". En Qué NO hace quedaron afuera el pago online y el seguimiento del reparto.", "Leyó la especificación entera y cambió una cosa: los precios no se muestran fijos porque cambian todos los días; el dueño los carga a la mañana. Lo corrigió en el documento antes de que existiera una línea de código.", "Copió el archivo CLAUDE-app-por-partes.md del kit como CLAUDE.md en la raíz y completó los comandos con lo que Claude le dijo después de proponer cómo armar el proyecto.", "Tramo 3: apretó Shift+Tab para entrar en modo plan y pegó el prompt de construir. Claude propuso cinco partes: lista de productos, carrito, datos de entrega, panel del día, carga de precios. Pidió guardar el plan en PLAN.md y lo aprobó.", "Copió la skill siguiente-parte del kit en .claude/skills/ y fue corriendo /siguiente-parte. En el carrito, la prueba que tenía que fallar (pedir sin poner dirección) dejaba pasar el pedido; Claude lo arregló dentro de la misma parte y recién con su OK guardó el commit.", "Tramo 4: con el prompt de lista de pruebas armó la lista para tildar y le pidió al padre que hiciera un pedido desde su celular sin ayuda. Anotó que no encontraba el botón de confirmar en pantallas chicas y lo corrigieron antes de publicar.", "Tramo 5: le pidió a Claude que subiera el proyecto a un repositorio privado de GitHub revisando antes que no hubiera claves. En Vercel hizo New Project, eligió el repositorio, cargó en Settings → Environment Variables las dos variables de .env.example y publicó.", "Repasó el archivo checklist-antes-de-publicar.md del kit. Al recargar el panel del día en la versión publicada funcionó bien, y repitió las pruebas de la especificación desde el link real."], "resultado": "Quedó una app publicada con su link, construida en cinco partes con un commit cada una, y una especificación que dice qué hace y qué no. La hija sabe cómo seguir (correr /siguiente-parte para lo próximo) y cómo volver a la versión anterior si un cambio rompe algo."}, "si_falla": [{"sintoma": "Cargaste una clave en Vercel y la app publicada sigue diciendo que falta.", "solucion": "Los cambios en las variables de entorno no se aplican a los deploys que ya existen. Vuelve a publicar (Redeploy en el último deploy, o sube un commit nuevo). Revisa también que la variable esté marcada para el entorno Production y que el nombre sea idéntico al de .env.example."}, {"sintoma": "Una clave que funciona en local aparece vacía en el navegador de la versión publicada.", "solucion": "En la mayoría de los frameworks, las variables que se leen en el navegador tienen que llevar un prefijo: NEXT_PUBLIC_ en Next.js, VITE_ en Vite. Ojo: con ese prefijo la variable queda a la vista de cualquiera, así que nunca pongas ahí una clave secreta; lo secreto se usa solo del lado del servidor."}, {"sintoma": "En Netlify, la página de inicio anda pero al recargar una página interna aparece Page not found.", "solucion": "Pasa con apps de una sola página (React con Vite, por ejemplo). Pídele a Claude que cree un archivo _redirects en la carpeta que se publica con la línea /* /index.html 200, y vuelve a publicar."}, {"sintoma": "El deploy falla en Vercel o Netlify aunque en tu computadora la app corre bien.", "solucion": "Abre el log del deploy, copia el error completo y pégaselo a Claude con \"El deploy falló con este error, explícame la causa y arréglalo\". Antes de volver a subir, pídele que corra el comando de compilar en local (npm run build o el que diga tu CLAUDE.md): correr en modo desarrollo no detecta todos los errores de compilación."}, {"sintoma": "Claude arma varias partes de una vez o agrega cosas que no pediste.", "solucion": "Usa /rewind para volver al punto antes del pedido y elige Restore code. Después pide la parte de nuevo en modo plan (Shift+Tab) y suma al CLAUDE.md la regla \"una parte por vez, no arranques la siguiente sin mi OK\", como en el archivo del kit."}], "kit": [{"archivo": "CLAUDE-app-por-partes.md", "que_es": "Un CLAUDE.md de ejemplo para construir una app por partes: carga la especificación, obliga a una parte por vez con commit, cuida las claves y deja los comandos del proyecto. Cópialo en la raíz con el nombre CLAUDE.md y completa los corchetes.", "contenido": "# Cómo trabajamos en este proyecto\n\nLo que tiene que hacer la app está en @ESPECIFICACION.md. El plan de construcción está en PLAN.md.\n\n## Reglas de trabajo\n\n- Construimos por partes chicas, en el orden de PLAN.md. Haz una parte por vez y no arranques la siguiente sin mi OK.\n- Al terminar cada parte: explícame en tres líneas qué hiciste, dime cómo la pruebo a mano y espera.\n- Cuando te confirme que funciona, marca la parte como hecha en PLAN.md y guarda un commit con un mensaje corto en español (por ejemplo: \"parte 2: formulario de turnos\").\n- Si un pedido mío contradice ESPECIFICACION.md, avísame antes de programar. No agregues pantallas, datos ni funciones que la especificación no pide.\n- Si algo no está claro, pregúntame. No inventes textos, precios ni datos del negocio: usa [PENDIENTE] y lístalo al final.\n\n## Claves y datos sensibles\n\n- Nunca escribas claves, contraseñas ni tokens en el código. Van en un archivo .env que está en .gitignore.\n- Cada vez que se necesite una variable nueva, agrégala también a .env.example con un valor de ejemplo y un comentario de para qué sirve.\n- Antes de cada commit, revisa que no entren archivos .env ni datos de clientes.\n- Si una variable se usa en el navegador, avísame: en ese caso es pública y no puede ser secreta.\n\n## Comandos del proyecto\n\n- Instalar: [COMANDO, por ejemplo npm install]\n- Correr en local: [COMANDO, por ejemplo npm run dev]\n- Compilar como en producción: [COMANDO, por ejemplo npm run build]\n\nAntes de decir que una parte está terminada, corre el comando de compilar y confirma que no da errores.\n\n## Publicación\n\n- La app se publica en [VERCEL / NETLIFY] conectada a la rama main de GitHub. Todo lo que llega a main se publica.\n- Las variables de entorno de producción las cargo yo en el panel. Tú solo me dices cuáles hacen falta.\n"}, {"archivo": "siguiente-parte/SKILL.md", "que_es": "Skill de Claude Code que toma la próxima parte pendiente de PLAN.md, la construye, te dice cómo probarla y solo con tu OK la marca y guarda el commit. Copia la carpeta en .claude/skills/ y úsala con /siguiente-parte.", "contenido": "---\nname: siguiente-parte\ndescription: 'Toma la próxima parte de PLAN.md, la construye según ESPECIFICACION.md, explica cómo probarla y, con tu OK, la marca hecha y hace commit. Úsala con \"seguimos\", \"siguiente parte\" o al avanzar la app.'\ndisable-model-invocation: true\n---\n\n# Siguiente parte del plan\n\n## 1. Ubicarte\n\n- Lee ESPECIFICACION.md y PLAN.md de la raíz del proyecto. Si falta alguno, frena y di cuál falta. Si falta PLAN.md, ofrece armarlo: lista numerada de partes chicas, cada una con una línea de qué hace y cómo se prueba, con casillas [ ] para marcar.\n- Corre git status. Si hay cambios sin guardar de antes, muéstralos y pregunta qué hacer con ellos antes de empezar.\n- Elige la primera parte con la casilla vacía [ ]. Di cuál es en una línea y qué archivos piensas tocar.\n\n## 2. Construir\n\n- Haz solo esa parte. Si para hacerla necesitas algo de una parte posterior, frena y pregunta.\n- Si la especificación no dice cómo resolver algo, pregunta en vez de suponer.\n- No escribas claves en el código. Si hace falta una variable nueva, súmala a .env.example y avisa.\n\n## 3. Comprobar\n\n- Corre el comando de compilar del proyecto (está en CLAUDE.md) y arregla los errores que aparezcan.\n- Escribe una lista corta de pruebas a mano para esta parte: qué hago, qué tiene que pasar. Incluye al menos un caso que debería fallar (campo vacío, dato raro, usuario sin permiso).\n- Termina con: \"Prueba esto y dime si funciona\". Espera.\n\n## 4. Guardar (solo con el OK)\n\nCuando el usuario confirme que funciona:\n- Marca la parte como [x] en PLAN.md.\n- Muestra la lista de archivos que van a entrar en el commit y confirma que no hay .env ni datos de clientes.\n- Guarda un commit con un mensaje corto en español: \"parte N: [qué hace]\".\n- Di cuál es la próxima parte, sin empezarla.\n\nSi el usuario dice que no funciona, arregla dentro de la misma parte y vuelve al paso 3. Si después de dos intentos sigue fallando, propón volver al último commit con /rewind o con Git y encarar la parte de otra forma.\n"}, {"archivo": "checklist-antes-de-publicar.md", "que_es": "Lista para tildar antes y después de publicar en Vercel o Netlify: revisión de cambios, claves, variables de entorno, pruebas en la versión publicada y cómo volver atrás.", "contenido": "# Checklist antes de publicar\n\nTilda cada punto. Si uno no se cumple, no publiques todavía.\n\n## Código y claves\n- [ ] Corrí /diff y leí la lista de cambios desde el último commit publicado.\n- [ ] Corrí /code-review y resolví los problemas marcados (o decide por escrito por qué no).\n- [ ] Corrí /security-review si la app tiene login, formularios o guarda datos de personas.\n- [ ] Le pedí a Claude: \"Busca en todo el proyecto claves, tokens o contraseñas escritas en el código y archivos .env que no estén en .gitignore\". No encontró nada.\n- [ ] Existe .env.example con todas las variables que la app necesita (sin valores reales).\n\n## Repositorio\n- [ ] El proyecto está en GitHub y la rama main tiene la última versión que probé.\n- [ ] El repositorio es privado si el código es del cliente o tiene lógica de negocio.\n\n## Plataforma (Vercel o Netlify)\n- [ ] Cargué todas las variables de .env.example en la configuración del proyecto, con los valores de producción.\n- [ ] Si agregué o cambié variables después del primer deploy, volví a publicar: los cambios no aplican a las versiones ya publicadas.\n- [ ] El comando de compilar funciona en mi computadora sin errores.\n\n## Después de publicar\n- [ ] Abre el link publicado desde el celular y desde la computadora.\n- [ ] Repite las pruebas de \"Cómo sé que funciona\" de ESPECIFICACION.md en la versión publicada.\n- [ ] Probé un caso que debería fallar (campo vacío, entrar sin login) en la versión publicada.\n- [ ] Recargué una página interna (no la de inicio) y no dio error 404.\n- [ ] Sé cómo volver a la versión anterior si algo se rompe (en Vercel, Instant Rollback; en Netlify, publicar de nuevo un deploy anterior desde la lista de deploys).\n\n## Entrega\n- [ ] Le pasé al cliente el link y le dije qué probar.\n- [ ] Anoté en ESPECIFICACION.md, sección Cambios, la fecha de esta versión.\n"}], "verificada": "2026-11-08", "cat": "desarrollo", "parte": "construi"};</script>

<script>var GUIA = {"slug": "setter-ai-en-un-cliente-paso-a-paso-y-retorno", "t": "Setter AI en un cliente: paso a paso para venderlo, instalarlo y cobrarlo", "d": "Qué hacer desde que eliges al primer cliente hasta que cobras el mensual, con el cálculo de retorno listo para mostrarle al dueño con sus propios números.", "tema": "El sistema para vender IA", "min": 14, "fichaNombre": "Setter AI para clientes", "ficha": [["Qué es", "El recorrido completo para instalar el Setter AI en la cuenta de Instagram de un cliente y cobrar instalación más mensual."], ["Para quién", "Quien ya tiene el acceso completo y quiere su primer cliente con un sistema de la biblioteca."], ["Qué puedes hacer", "Instalarlo en todos los clientes que quieras, modificarlo y cobrar la instalación y el mantenimiento. Sin límite de clientes."], ["Qué no puedes hacer", "Revender o compartir la biblioteca en sí (las guías y tu acceso). Lo que armas con ella para tus clientes es tuyo."]], "secciones": [{"h": "Antes de vender: tenlo funcionando en tu cuenta", "p": ["Nadie compra un setter que no vio funcionar. Antes del primer cliente, instala el Setter AI en tu propia cuenta de Instagram siguiendo la guía del sistema y deja andando un flujo simple: comentario con palabra clave → DM con botón → la IA hace 2 o 3 preguntas y pasa el link de agenda.", "Esa es tu demo. Grábala en un video corto de pantalla: alguien comenta, llega el DM, la IA conversa y queda la ficha del lead. Ese video vende más que cualquier explicación."], "pasos": ["Instala el Setter AI en tu cuenta siguiendo la guía del sistema, pasos 1 a 7.", "Arma un flujo de palabra clave en un reel tuyo y pruébalo desde otra cuenta.", "Configura el setter con IA en modo prueba y usa el simulador hasta que conteste como lo harías tú.", "Graba un video de 60 a 90 segundos mostrando el recorrido completo."], "aviso": "Usa el licenciamiento a tu favor: el Setter AI tiene licencia MIT. Puedes modificarlo, adaptarlo a cada cliente y cobrar por instalarlo y mantenerlo."}, {"h": "Elige al cliente correcto", "p": ["El Setter AI rinde en negocios que ya reciben mensajes y comentarios en Instagram y pierden ventas porque no contestan rápido. Si la cuenta no tiene movimiento, no hay nada que automatizar."], "lista": ["Creadores e infoproductores: lanzan con palabra clave en reels y no dan abasto con los DMs.", "Coaches, consultores y profesionales: reciben consultas y necesitan filtrar antes de agendar una llamada.", "Negocios locales con mucho DM: estética, gimnasios, inmobiliarias, academias. Preguntan precio, horario y disponibilidad todo el día.", "Señal de que es buen cliente: más de 10 consultas por semana por Instagram y alguien del equipo contestando a mano, tarde o fuera de horario."]}, {"h": "El cálculo de retorno, con los números del cliente", "p": ["En la llamada de diagnóstico pregúntale al dueño estos datos y anótalos con sus palabras. Cada número del cálculo tiene que salir de algo que dijo él.", "Ejemplo con números inventados para que veas la cuenta: 120 consultas por mes; hoy se responde tarde o nunca al 40%; de cada 10 que reciben respuesta a tiempo, 2 compran; ticket promedio de US$ 150. Consultas perdidas: 120 × 40% = 48. Ventas que se escapan: 48 × 2 ÷ 10 ≈ 9,6 por mes. Si el setter recupera solo la mitad (escenario conservador): unas 4,8 ventas × US$ 150 = US$ 720 por mes.", "Con una instalación de US$ 500 y un mensual de US$ 150, el cliente recupera la inversión en el primer mes del escenario conservador. Ese es el número que le muestras."], "lista": ["Consultas por mes: ¿cuántos mensajes y comentarios con intención de compra reciben?", "Respuesta perdida: ¿qué porcentaje queda sin respuesta o se contesta después de unas horas?", "Conversión: de cada 10 que reciben respuesta a tiempo, ¿cuántos compran o agendan?", "Ticket: ¿cuánto vale en promedio una venta?", "Tiempo del equipo: ¿cuántas horas por semana pasa alguien contestando DMs? Ese tiempo liberado también es valor.", "Recuperación: inversión ÷ valor mensual conservador = meses hasta que se paga solo. Menos de 3 meses es fácil de defender."], "prompts": [{"t": "Arma el cálculo de retorno para la propuesta", "c": "Eres mi asesor comercial. Con estos datos del diagnóstico de un cliente, arma un cálculo de retorno para instalarle un setter con IA en Instagram.\n\nNegocio: [RUBRO Y NOMBRE]\nConsultas por mes en Instagram: [NÚMERO]\nPorcentaje que hoy queda sin respuesta o se contesta tarde: [PORCENTAJE]\nDe cada 10 que reciben respuesta a tiempo, compran: [NÚMERO]\nTicket promedio: [MONTO Y MONEDA]\nHoras por semana que alguien pasa contestando DMs: [HORAS]\nPrecio que pienso cobrar: instalación [MONTO] + mensual [MONTO]\n\nDame: 1) ventas que hoy se escapan por mes, 2) escenario conservador (recupera la mitad) y probable, 3) horas liberadas por mes, 4) en cuántos meses se paga solo con el escenario conservador, 5) el costo de no hacer nada en 6 meses, y 6) un párrafo de 4 líneas para la propuesta, en lenguaje simple, sin prometer resultados garantizados. Muéstrame cada cuenta para que la pueda revisar."}], "aviso": "No prometas resultados. Muéstralo como estimación con sus propios números y deja claro que el escenario conservador es el que defiendes."}, {"h": "Cuánto cobrar y qué incluye", "p": ["Cobra por solución, nunca por hora. Usa tus horas solo para saber tu piso. Una referencia simple: que la instalación sea más o menos lo que el sistema le recupera en uno o dos meses del escenario conservador, y que el mensual sea una fracción chica de lo que le devuelve cada mes."], "lista": ["Instalación (se cobra una vez): diagnóstico, configuración en su cuenta, flujos para 1 o 2 reels o campañas, entrenamiento del setter con su oferta, pruebas y una capacitación de 30 minutos.", "Mensual (mientras siga funcionando): revisión de conversaciones, ajustes del setter, nuevos flujos para sus lanzamientos, el servidor andando y un informe mensual con sus números.", "Costos que paga el cliente: el servidor (plan Starter de Render) y el uso de la IA (Anthropic, pago por uso). Lo ideal es que esas cuentas estén a su nombre o que las sumes de forma visible en el mensual.", "Pago: sin pago inicial no se empieza. Lo más común es el 50% al aceptar y el 50% al entregar, o el 100% de la instalación al aceptar."]}, {"h": "La instalación en la cuenta del cliente, paso a paso", "pasos": ["Pide acceso: que el cliente tenga su Instagram como cuenta profesional y que te dé acceso a su cuenta de Meta o te agregue como administrador. Nunca le pidas su contraseña por chat.", "Decide dónde corre: un servidor por cliente (más simple de entregar) o tu servidor con Espacios, una cuenta de Instagram por cliente con su propia base de datos.", "Conecta su cuenta en la app de Meta: agrega su Instagram como evaluador de la app o usa Espacios, como explica la guía del sistema.", "Carga su oferta: qué vende, precios, preguntas frecuentes, objeciones típicas y a dónde manda al lead (agenda, WhatsApp o checkout).", "Arma los flujos: palabra clave en reels, respuesta a historias y el enlace ig.me para su bio o sus anuncios.", "Prueba todo en modo prueba con el simulador y desde una cuenta tuya. Revisa que las respuestas suenen a él.", "Activa los límites anti-ban que vienen por defecto y deja la palabra BORRAR funcionando para pedidos de borrado de datos.", "Pásalo a producción en un reel o una historia de bajo riesgo y mira las primeras 20 conversaciones antes de abrirlo a todo."], "aviso": "Las claves (tokens, contraseñas, API keys) van solo en el servidor o en el .env. Nunca en un chat, un mail ni un documento compartido con el cliente."}, {"h": "Entrega, mensual y cómo mostrar el valor", "pasos": ["Capacitación de 30 minutos: dónde ve los leads, cómo pausa el setter y cómo le avisa si algo no le gusta.", "Primera semana: revisa todas las conversaciones y ajusta el setter donde respondió raro.", "Informe mensual de una página: conversaciones, leads calificados, clics en la agenda y ventas que el cliente atribuye al setter. Compáralo con el cálculo de retorno del principio.", "Cada mes propone una mejora: un flujo nuevo para su próximo lanzamiento o una pregunta mejor para filtrar leads. Eso sostiene el mensual."], "p": ["Deja todo por escrito en un acuerdo simple: qué incluye la instalación, qué incluye el mensual, qué no está incluido, cómo se cancela y quién paga el servidor y la IA. Usa el módulo 9 del sistema base como plantilla."]}], "faq": [{"q": "¿Hay un límite de clientes en los que puedo instalarlo?", "a": "No. Puedes instalar el Setter AI y el resto de los sistemas en todos los clientes que quieras y cobrar la instalación y el mensual."}, {"q": "¿Puedo modificarlo o ponerle mi marca?", "a": "Sí. El Setter AI tiene licencia MIT: puedes modificarlo y adaptarlo a cada cliente. Lo único que no puedes es revender o compartir la biblioteca en sí, es decir, las guías y tu acceso."}, {"q": "¿Y si el cliente no tiene datos para el cálculo de retorno?", "a": "Pídele que cuente una semana: cuántas consultas entran por Instagram y cuántas se contestan tarde. Con una semana de datos ya puedes hacer un cálculo conservador honesto."}, {"q": "¿Qué pasa si Meta bloquea la cuenta?", "a": "El Setter AI trae límites de envío anti-ban y se pausa solo si Meta bloquea. Arranca con los valores por defecto y no los subas hasta tener semanas de uso estable."}], "cat": "sistema-base", "parte": "construi"};</script>

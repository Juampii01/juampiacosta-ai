<script>var GUIA = {"slug": "claude-md-la-memoria-del-proyecto", "t": "CLAUDE.md: la memoria de tu proyecto, corta y útil", "d": "Un archivo de texto con las reglas que Claude lee al empezar cada sesión. Qué poner, qué dejar afuera y cómo mantenerlo corto.", "tema": "Claude Code", "min": 8, "fichaNombre": "CLAUDE.md", "ficha": [["Qué es", "Un archivo de texto con instrucciones que Claude Code carga al principio de cada sesión."], ["Dónde va", "En la carpeta del proyecto (CLAUDE.md o .claude/CLAUDE.md)."], ["Tamaño ideal", "Menos de 200 líneas, según la guía oficial."], ["Qué no es", "No es una regla obligatoria: Claude lo toma como contexto. Para bloquear algo sí o sí se usan otras herramientas (hooks)."]], "secciones": [{"h": "Para qué sirve", "p": ["Cada sesión de Claude Code arranca sin recordar la anterior. CLAUDE.md es donde escribís lo que, si no, tendrías que volver a explicar cada vez.", "Una buena señal para sumar algo: Claude comete el mismo error por segunda vez, o vos tipeás la misma aclaración que la semana pasada."]}, {"h": "Dónde se guarda", "lista": ["CLAUDE.md o .claude/CLAUDE.md en la carpeta del proyecto: reglas del proyecto. Si usás git, se comparte con tu equipo.", "~/.claude/CLAUDE.md: tus preferencias personales, para todos tus proyectos.", "CLAUDE.local.md en la carpeta del proyecto: tus notas personales de ese proyecto. Sumalo al .gitignore para que no se suba.", "Si tu proyecto ya tiene un AGENTS.md (de otras herramientas), lo más seguro es crear un CLAUDE.md con la línea @AGENTS.md: así Claude Code lee las mismas reglas y podés sumar abajo lo propio de Claude. Las versiones recientes también leen AGENTS.md solas cuando no hay CLAUDE.md, pero un CLAUDE.local.md en la carpeta alcanza para que lo salteen sin avisar."]}, {"h": "Crealo en un minuto", "pasos": ["Abrí Claude Code en la carpeta del proyecto.", "Escribí /init. Claude revisa el proyecto y arma un CLAUDE.md inicial con lo que descubre.", "Leelo y sumá lo que Claude no puede adivinar: para quién es, el tono de tu marca, qué no tiene que tocar nunca.", "Para editarlo más adelante, escribí /memory o abrí el archivo con cualquier editor de texto."]}, {"h": "Qué poner (y cómo escribirlo)", "p": ["Instrucciones concretas que se puedan comprobar. \"Los textos van en español rioplatense con voseo\" funciona; \"escribí bien\" no.", "Dejá afuera los procedimientos largos y las cosas que solo importan en una parte del proyecto: eso va mejor en una skill o en una regla aparte dentro de .claude/rules/. Ojo: una regla de .claude/rules/ se carga solo cuando hace falta si le ponés paths en el encabezado; sin paths, se carga siempre al arrancar, igual que el CLAUDE.md."], "prompts": [{"t": "Plantilla para un proyecto de negocio", "c": "# [NOMBRE DEL PROYECTO]\n\n## Qué es\n- [QUÉ ES, EN UNA LÍNEA]. Lo usan [QUIÉN LO USA].\n\n## Reglas de contenido\n- Todos los textos en español rioplatense, con voseo.\n- Tono: [EJ.: DIRECTO Y CERCANO]. Nada de promesas de resultados.\n- Colores de marca: [COLOR 1], [COLOR 2].\n\n## Reglas de trabajo\n- Antes de cambios grandes, proponé un plan y esperá mi OK.\n- No borres archivos sin preguntarme.\n- No toques la carpeta [CARPETA QUE NO SE TOCA].\n\n## Cómo se prueba\n- [CÓMO VES QUE FUNCIONA, EJ.: ABRIR INDEX.HTML EN EL NAVEGADOR]."}]}, {"h": "Mantenelo corto", "p": ["La guía oficial recomienda apuntar a menos de 200 líneas por archivo: uno más largo ocupa más memoria y Claude lo sigue peor. Si dos reglas se contradicen, puede elegir cualquiera de las dos.", "Cada tanto, pedile a Claude que lo ordene. También existe /doctor prompt-audit, que revisa tus CLAUDE.md, skills y otra configuración y busca instrucciones viejas o que se contradicen. Necesita Claude Code v2.1.283 o más nuevo."], "prompts": [{"t": "Ordenar mi CLAUDE.md", "c": "Leé mi CLAUDE.md y ayudame a dejarlo corto y claro:\n1. Marcá reglas repetidas, viejas o que se contradicen.\n2. Marcá lo que es un procedimiento largo y conviene pasar a una skill o a .claude/rules/.\n3. Reescribí las reglas vagas para que sean concretas.\n4. Mostrame la versión nueva y lo que sacaste. No guardes nada hasta que te diga OK."}]}, {"h": "La memoria automática", "p": ["Además de tu CLAUDE.md, Claude Code puede tomar sus propias notas mientras trabaja: tus correcciones, tus preferencias y decisiones del proyecto. Las guarda en tu compu, separadas por proyecto.", "Desde /memory ves esas notas, prendés o apagás la función y abrís la carpeta donde las guarda. Mientras trabaja, Writing memory quiere decir que está anotando y Recalled memory, que usó una nota guardada. Necesita Claude Code v2.1.59 o más nuevo (lo ves con claude --version)."]}], "faq": [{"q": "Claude no respeta una regla de mi CLAUDE.md", "a": "Hacela más concreta y revisá que no choque con otra. Si es algo que nunca puede pasar, no alcanza con CLAUDE.md: hay que bloquearlo con permisos o hooks."}, {"q": "¿/init me pisa lo que ya escribí?", "a": "No. Si ya hay un CLAUDE.md, te sugiere mejoras en vez de reemplazarlo."}, {"q": "¿Pongo contraseñas o claves ahí?", "a": "No. CLAUDE.md es texto común y, si usás git, se comparte. Las claves van en otro lado."}], "fuentes": ["https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/best-practices", "https://code.claude.com/docs/en/skills"], "ejemplo": {"titulo": "Ejemplo resuelto: un CLAUDE.md para la carpeta de circulares de un estudio contable", "negocio": "Ejemplo inventado: un estudio contable chico en Rosario, Santa Fe. Una contadora y dos asistentes atienden a monotributistas y pymes de la zona. Usan Claude Code en una carpeta de documentos, sin programar.", "punto_de_partida": "Cada mes le pedían a Claude las circulares de vencimientos y cada vez tenían que repetir el tono, que no invente fechas y que no toque las circulares ya enviadas. Un mes Claude sobrescribió una circular vieja.", "pasos": ["Ordenaron la carpeta: calendario/vencimientos.md con las fechas del mes, modelos/ con mails tipo y circulares/enviadas/ con lo ya mandado.", "Abrieron Claude Code en esa carpeta y escribieron /init. Claude armó un primer CLAUDE.md describiendo la carpeta.", "La contadora lo reemplazó por la versión del kit (claude-md-estudio-contable.md) y completó lo que Claude no podía adivinar: a quién le escriben, el tono y que las fechas salen solo del calendario.", "Marcó con IMPORTANTE una sola regla: no editar nada dentro de circulares/enviadas/. Como eso no puede pasar nunca, también le pidió a Claude que lo bloquee en los permisos del proyecto.", "Las reglas de formato de las circulares las sacó del CLAUDE.md y las puso en .claude/rules/circulares.md con paths, para que carguen solo cuando Claude trabaja en esa carpeta.", "Cada asistente creó su CLAUDE.local.md con su firma y lo sumó al .gitignore.", "Escribieron /memory para confirmar que cargaban el CLAUDE.md, el CLAUDE.local.md y la regla. Dejaron prendida la memoria automática.", "A fin de mes usaron la skill ordenar-claude-md del kit para revisar qué reglas sobraban."], "resultado": "Las circulares salen con el mismo tono y estructura sin repetir instrucciones. Cuando falta una fecha, el texto dice [CONFIRMAR FECHA] en lugar de inventarla, y las circulares enviadas quedan protegidas por permisos, no solo por el CLAUDE.md."}, "si_falla": [{"sintoma": "Claude no sigue una regla que está en el CLAUDE.md.", "solucion": "Escribí /memory y confirmá que tu archivo aparece entre los cargados. Si está, hacé la regla más concreta y buscá otra que la contradiga (también en .claude/rules/ y en CLAUDE.md de subcarpetas). Si es algo que nunca puede pasar, no alcanza: bloquealo con permisos o con un hook."}, {"sintoma": "Escribiste @carpeta/archivo.md en el CLAUDE.md y Claude no lo tiene en cuenta.", "solucion": "La ruta se lee desde la carpeta donde está el CLAUDE.md, no desde donde abriste Claude Code. Revisá que esté bien escrita. Si el archivo está fuera del proyecto, la primera vez aparece un aviso para aprobar los imports: si lo rechazaste, quedan apagados y el aviso no vuelve. Lo más simple es mover el archivo dentro del proyecto."}, {"sintoma": "Tu proyecto tiene AGENTS.md y Claude Code actúa como si no existiera.", "solucion": "Creá un CLAUDE.md con la línea @AGENTS.md. La lectura automática de AGENTS.md depende de la versión y se apaga si existe cualquier CLAUDE.md o CLAUDE.local.md, incluso uno personal que te olvidaste."}, {"sintoma": "En /memory no aparece la opción de memoria automática o nunca ves Writing memory.", "solucion": "Corré claude --version: la memoria automática necesita v2.1.59 o más nueva. Si tenés una versión nueva, puede estar apagada en la configuración (autoMemoryEnabled en false) o por la variable CLAUDE_CODE_DISABLE_AUTO_MEMORY. Prendela desde /memory."}, {"sintoma": "Después de un /compact, Claude se olvidó de algo que le habías dicho en el chat.", "solucion": "El CLAUDE.md de la raíz sobrevive a la compactación; lo que dijiste solo en la conversación puede perderse. Si lo vas a necesitar siempre, pasalo al CLAUDE.md."}], "kit": [{"archivo": "claude-md-estudio-contable.md", "que_es": "Un CLAUDE.md completo para una carpeta de documentos de un negocio (circulares y mails de un estudio contable). Copialo a la raíz de tu carpeta con el nombre CLAUDE.md y cambiá rubro, carpetas y reglas.", "contenido": "# Estudio contable: carpeta de comunicaciones\n\n## Qué es esta carpeta\n- Circulares, mails modelo y recordatorios de vencimientos para los clientes del estudio.\n- Clientes: monotributistas y pymes chicas de Rosario y alrededores.\n- La usan la contadora y dos asistentes. No es código: son documentos en Markdown y Word.\n\n## Cómo escribimos\n- Español rioplatense, con voseo. Frases cortas.\n- Tono: cercano y claro, sin jerga contable si se puede evitar.\n- Nunca prometas resultados ni ahorros de impuestos.\n- Fechas de vencimiento: solo las que estén en calendario/vencimientos.md. Si no está la fecha, escribí [CONFIRMAR FECHA].\n\n## Dónde está cada cosa\n- Calendario de vencimientos vigente: @calendario/vencimientos.md\n- Mails modelo: carpeta modelos/\n- Circulares ya enviadas: carpeta circulares/enviadas/ (solo lectura, sirven de ejemplo)\n\n## Reglas de trabajo\n- IMPORTANTE: no edites ni borres nada dentro de circulares/enviadas/. Si hay que cambiar una, creá una copia nueva.\n- Antes de crear más de tres archivos de una vez, mostrame la lista y esperá mi OK.\n- No pongas CUIT, CBU ni datos personales de clientes en los textos modelo: usá [CUIT CLIENTE], [NOMBRE CLIENTE].\n\n## Cómo reviso que esté bien\n- Leé el texto final contra modelos/ejemplo-de-tono.md y decime qué cambiaste para que suene igual.\n"}, {"archivo": "regla-circulares-por-carpeta.md", "que_es": "Una regla con paths que carga solo cuando Claude trabaja en la carpeta circulares/. Guardala como .claude/rules/circulares.md y adaptá el patrón y las reglas a tu carpeta.", "contenido": "---\npaths:\n  - \"circulares/**/*.md\"\n---\n\n# Reglas para las circulares\n\n- Estructura fija: asunto, saludo, qué cambia, qué tiene que hacer el cliente, hasta cuándo, firma del estudio.\n- Máximo una pantalla de celular por circular. Si no entra, dividila en dos.\n- El asunto empieza con el mes: [MES]: [TEMA].\n- Si mencionás una norma o resolución, poné el número tal como figura en calendario/vencimientos.md. Si no figura, escribí [CONFIRMAR NORMA].\n- Cerrá siempre con: Cualquier duda, respondé este mail.\n"}, {"archivo": "ordenar-claude-md/SKILL.md", "que_es": "Skill que revisa tu CLAUDE.md con la prueba de si la saco, ¿se equivocaría?, propone una versión más corta y no guarda nada sin tu OK. Ponela en .claude/skills/ordenar-claude-md/ y llamala con /ordenar-claude-md.", "contenido": "---\nname: ordenar-claude-md\ndescription: Revisa el CLAUDE.md del proyecto y propone una versión más corta y concreta, sin guardar nada hasta que el usuario apruebe. Usala cuando el usuario pida ordenar, podar, acortar o revisar su CLAUDE.md.\ndisable-model-invocation: true\n---\n\n# Ordenar el CLAUDE.md\n\nTrabajá sobre el CLAUDE.md de la raíz del proyecto. Si el usuario nombra otro archivo ($ARGUMENTS), usá ese.\n\n## Pasos\n\n1. Leé el archivo completo y contá las líneas. Si pasa de 200, decilo primero.\n2. Para cada línea, hacete la pregunta: si la saco, ¿Claude se equivocaría? Marcá las que no pasan la prueba.\n3. Armá una tabla con cuatro columnas: línea, qué problema tiene, qué proponés, por qué. Los problemas posibles son:\n   - Se deduce leyendo el proyecto (por ejemplo, la lista de carpetas).\n   - Está repetida o se contradice con otra (citá las dos).\n   - Es vaga y no se puede comprobar (por ejemplo, escribí bien).\n   - Es un procedimiento largo o solo aplica a una parte del proyecto: proponé moverla a una skill o a .claude/rules/ con paths.\n   - Tiene datos sensibles (claves, contraseñas, datos de clientes): proponé sacarla ya.\n   - Pide algo que nunca puede pasar: avisá que eso no se garantiza con CLAUDE.md y que va en permisos o en un hook.\n4. Reescribí las reglas vagas para que sean concretas y verificables.\n5. Mostrá la versión nueva completa y, aparte, la lista de lo que sacaste.\n\n## Reglas\n\n- No guardes ni edites ningún archivo hasta que el usuario diga OK.\n- No inventes reglas nuevas que el usuario no haya pedido. Si ves que falta algo, sugerilo como pregunta al final.\n- Si hay más de una línea con IMPORTANTE, proponé dejar solo la que más importa.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

<script>var GUIA = {"slug": "claude-md-la-memoria-del-proyecto", "t": "CLAUDE.md: la memoria de tu proyecto, corta y útil", "d": "Un archivo de texto con las reglas que Claude lee al empezar cada sesión. Qué poner, qué dejar afuera y cómo mantenerlo corto.", "tema": "Claude Code", "min": 8, "fichaNombre": "CLAUDE.md", "ficha": [["Qué es", "Un archivo de texto con instrucciones que Claude Code carga al principio de cada sesión."], ["Dónde va", "En la carpeta del proyecto (CLAUDE.md o .claude/CLAUDE.md)."], ["Tamaño ideal", "Menos de 200 líneas, según la guía oficial."], ["Qué no es", "No es una regla obligatoria: Claude lo toma como contexto. Para bloquear algo sí o sí se usan otras herramientas (hooks)."]], "secciones": [{"h": "Para qué sirve", "p": ["Cada sesión de Claude Code arranca sin recordar la anterior. CLAUDE.md es donde escribís lo que, si no, tendrías que volver a explicar cada vez.", "Una buena señal para sumar algo: Claude comete el mismo error por segunda vez, o vos tipeás la misma aclaración que la semana pasada."]}, {"h": "Dónde se guarda", "lista": ["CLAUDE.md o .claude/CLAUDE.md en la carpeta del proyecto: reglas del proyecto. Si usás git, se comparte con tu equipo.", "~/.claude/CLAUDE.md: tus preferencias personales, para todos tus proyectos.", "CLAUDE.local.md en la carpeta del proyecto: tus notas personales de ese proyecto. Sumalo al .gitignore para que no se suba.", "Si tu proyecto ya tiene un AGENTS.md (de otras herramientas) y no tiene CLAUDE.md, Claude Code lo lee igual."]}, {"h": "Crealo en un minuto", "pasos": ["Abrí Claude Code en la carpeta del proyecto.", "Escribí /init. Claude revisa el proyecto y arma un CLAUDE.md inicial con lo que descubre.", "Leelo y sumá lo que Claude no puede adivinar: para quién es, el tono de tu marca, qué no tiene que tocar nunca.", "Para editarlo más adelante, escribí /memory o abrí el archivo con cualquier editor de texto."]}, {"h": "Qué poner (y cómo escribirlo)", "p": ["Instrucciones concretas que se puedan comprobar. \"Los textos van en español rioplatense con voseo\" funciona; \"escribí bien\" no.", "Dejá afuera los procedimientos largos y las cosas que solo importan en una parte del proyecto: eso va mejor en una skill o en una regla aparte dentro de .claude/rules/, que se carga solo cuando hace falta."], "prompts": [{"t": "Plantilla para un proyecto de negocio", "c": "# [NOMBRE DEL PROYECTO]\n\n## Qué es\n- [QUÉ ES, EN UNA LÍNEA]. Lo usan [QUIÉN LO USA].\n\n## Reglas de contenido\n- Todos los textos en español rioplatense, con voseo.\n- Tono: [EJ.: DIRECTO Y CERCANO]. Nada de promesas de resultados.\n- Colores de marca: [COLOR 1], [COLOR 2].\n\n## Reglas de trabajo\n- Antes de cambios grandes, proponé un plan y esperá mi OK.\n- No borres archivos sin preguntarme.\n- No toques la carpeta [CARPETA QUE NO SE TOCA].\n\n## Cómo se prueba\n- [CÓMO VES QUE FUNCIONA, EJ.: ABRIR INDEX.HTML EN EL NAVEGADOR]."}]}, {"h": "Mantenelo corto", "p": ["La guía oficial recomienda apuntar a menos de 200 líneas por archivo: uno más largo ocupa más memoria y Claude lo sigue peor. Si dos reglas se contradicen, puede elegir cualquiera de las dos.", "Cada tanto, pedile a Claude que lo ordene. También existe /doctor prompt-audit, que revisa tus archivos de instrucciones y busca problemas."], "prompts": [{"t": "Ordenar mi CLAUDE.md", "c": "Leé mi CLAUDE.md y ayudame a dejarlo corto y claro:\n1. Marcá reglas repetidas, viejas o que se contradicen.\n2. Marcá lo que es un procedimiento largo y conviene pasar a una skill o a .claude/rules/.\n3. Reescribí las reglas vagas para que sean concretas.\n4. Mostrame la versión nueva y lo que sacaste. No guardes nada hasta que te diga OK."}]}, {"h": "La memoria automática", "p": ["Además de tu CLAUDE.md, Claude Code puede tomar sus propias notas mientras trabaja: tus correcciones, tus preferencias y decisiones del proyecto. Las guarda en tu compu, separadas por proyecto.", "Desde /memory ves esas notas y prendés o apagás la función. Cuando aparece \"Saved memories\" o algo parecido, está anotando."]}], "faq": [{"q": "Claude no respeta una regla de mi CLAUDE.md", "a": "Hacela más concreta y revisá que no choque con otra. Si es algo que nunca puede pasar, no alcanza con CLAUDE.md: hay que bloquearlo con permisos o hooks."}, {"q": "¿/init me pisa lo que ya escribí?", "a": "No. Si ya hay un CLAUDE.md, te sugiere mejoras en vez de reemplazarlo."}, {"q": "¿Pongo contraseñas o claves ahí?", "a": "No. CLAUDE.md es texto común y, si usás git, se comparte. Las claves van en otro lado."}], "fuentes": ["https://code.claude.com/docs/en/memory", "https://code.claude.com/docs/en/commands"]};</script>

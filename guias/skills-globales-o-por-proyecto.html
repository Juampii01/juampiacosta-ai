<script>var GUIA = {"slug": "skills-globales-o-por-proyecto", "t": "Skills globales o por proyecto: dónde ponerlas", "d": "Una skill puede vivir en tu cuenta, en tu compu o dentro de un proyecto. Te explico cada lugar y cómo decidir cuál te conviene.", "tema": "Skills y plugins", "min": 7, "secciones": [{"h": "Los lugares donde puede vivir una skill", "lista": ["Tu cuenta de Claude (Customize → Skills): la usás en la web, en la app de escritorio y en Cowork. Si entrás a Claude Code con la misma cuenta (versión 2.1.273 o posterior), también se descarga ahí y la ves en /skills bajo \"claude.ai sync\". No se sincroniza si usás Claude Code con una API key o con un proveedor como Amazon Bedrock.", "Personal en Claude Code (~/.claude/skills/nombre/SKILL.md): está en todos tus proyectos, pero solo en esa compu. No llega a Cowork ni a las sesiones en la nube salvo que la subas a tu cuenta.", "De proyecto (.claude/skills/nombre/SKILL.md dentro de la carpeta del proyecto): solo existe cuando trabajás en ese proyecto. Si el proyecto se comparte por git, tu equipo también la recibe.", "Dentro de un plugin: viene con el plugin y se llama /nombre-del-plugin:nombre-de-la-skill.", "De tu organización: en planes Team y Enterprise, un Owner puede darle skills a todo el equipo."]}, {"h": "Cómo decidir", "lista": ["Global (cuenta o ~/.claude/skills): para lo que usás en cualquier tema, como tu tono o tu marca.", "Por proyecto (.claude/skills): para lo que solo tiene sentido en un trabajo, como el formato de informes de un cliente.", "En tu cuenta: si querés la misma skill en la app y en Claude Code sin copiarla a mano.", "En un plugin: si querés repartir varias skills juntas, o una skill con el conector que usa."], "aviso": "Regla práctica: empezá global. Si ves que una skill solo la usás en un proyecto, movela ahí."}, {"h": "Si hay dos skills con el mismo nombre", "p": ["En Claude Code gana la que instala tu organización con la configuración administrada (managed settings) sobre la personal, y la personal sobre la del proyecto. Por ejemplo, si tenés presupuestos en ~/.claude/skills y otra presupuestos en el proyecto, /presupuestos corre la personal.", "Las de plugins no chocan porque llevan el nombre del plugin adelante. Igual, lo más simple es no repetir nombres."]}, {"h": "Mover una skill de lugar en Claude Code", "pasos": ["Escribí /skills para ver las skills que tenés cargadas.", "Pegá el prompt de abajo para moverla.", "Claude Code detecta el cambio sin reiniciar. Si creaste una carpeta skills que no existía al abrir la sesión, escribí /reload-skills."], "prompts": [{"t": "Mover una skill", "c": "Mové la skill [NOMBRE] de [.claude/skills de este proyecto | ~/.claude/skills] a [~/.claude/skills | .claude/skills de este proyecto].\nAntes de moverla, fijate si ya hay otra skill con el mismo nombre en el destino y avisame.\nDespués confirmame dónde quedó y mostrame la ruta completa del SKILL.md."}]}, {"h": "Proyectos de la app y skills no son lo mismo", "p": ["En la app de Claude, un Proyecto guarda conocimiento de fondo que está siempre cargado en sus chats. Una skill se carga solo cuando la tarea coincide, y está disponible en todas tus charlas.", "Se complementan: en el Proyecto dejás la información del cliente y en la skill el procedimiento. Podés nombrar la skill en las instrucciones del Proyecto para que Claude la tenga presente."], "prompts": [{"t": "Instrucción para un Proyecto", "c": "En este proyecto trabajamos para [CLIENTE]. Cuando te pida [TAREA], usá la skill [NOMBRE-DE-LA-SKILL] y tomá los datos del cliente de los archivos de este proyecto."}]}], "faq": [{"q": "¿Las skills que creo en Claude Code aparecen en la app?", "a": "No. Claude Code baja las skills de tu cuenta a ~/.claude/skills/synced/, pero nunca sube las tuyas. Si la querés en la app, subila como .zip en Customize → Skills. Y no edites las de la carpeta synced: los cambios se pisan en la próxima sincronización."}, {"q": "¿Qué pasa si clono un proyecto que trae skills?", "a": "Se cargan cuando trabajás ahí. Leelas antes: con el campo allowed-tools una skill se autoriza herramientas sin pedirte permiso mientras corre, y eso vale aunque no hayas marcado la carpeta como confiable. La documentación recomienda revisarlo en las skills de un repo antes de abrir Claude Code ahí."}, {"q": "¿Cuál es más segura?", "a": "Ninguna en particular. Lo que importa es de dónde viene la skill y que la hayas leído antes de usarla."}], "fuentes": ["https://code.claude.com/docs/en/skills", "https://claude.com/docs/skills/overview", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/12512176-what-are-skills"], "ejemplo": {"titulo": "Ejemplo resuelto: ordenar las skills de un freelancer con dos clientes", "negocio": "Ejemplo inventado: un desarrollador freelance de Medellín que trabaja solo. Mantiene la tienda online de una marca de café y el sistema de turnos de un consultorio odontológico. Usa la app de Claude para mails y propuestas, y Claude Code para programar.", "punto_de_partida": "Tiene cinco skills copiadas a mano en dos lugares, con versiones distintas. Dos se llaman igual (notas-de-version), una en ~/.claude/skills y otra en el repo de la tienda, y nunca sabe cuál corre.", "pasos": ["Completó el mapa de skills del kit con las cinco. Quedó claro que la de tono de sus mails y la de propuestas las usa en la app y en Claude Code, y que las notas de versión son distintas para cada cliente.", "Subió las dos skills de uso general a su cuenta en Customize → Skills y borró las copias de ~/.claude/skills.", "Actualizó Claude Code, entró con su cuenta de Claude y escribió /skills. Vio las dos bajo \"claude.ai sync\".", "En el repo de la tienda le pidió a Claude Code con el prompt \"Mover una skill\" que llevara notas-de-version a .claude/skills de ese proyecto. Claude Code le avisó que ya había una con el mismo nombre en ~/.claude/skills y que esa ganaba.", "Renombró la de la tienda a notas-de-version-cliente (carpeta y name), usando el modelo del kit, y borró la personal.", "En el repo del consultorio creó su propia notas-de-version-cliente en .claude/skills, con el tono formal que pide ese cliente.", "Abrió Claude Code en cada repo, escribió /notas-de-version-cliente y confirmó que en cada uno corría la versión del proyecto.", "En la app creó un Proyecto por cliente y pegó el modelo 1 de las instrucciones del kit, nombrando la skill de propuestas y el archivo con los datos del cliente."], "resultado": "Cada skill vive en un solo lugar. Las de uso general las edita en la app y le llegan solas a Claude Code. Las notas de versión viven en el repo de cada cliente y no chocan entre sí, y los Proyectos de la app guardan los datos de cada cliente sin duplicar el procedimiento."}, "si_falla": [{"sintoma": "Escribís /nombre-de-la-skill y corre una versión que no es la que acabás de editar.", "solucion": "Hay otra skill con el mismo nombre en un lugar que gana: la de la organización sobre la personal y la personal sobre la del proyecto. Buscá con /skills cuál está cargada, borrá o renombrá la que sobra y dejá un solo name."}, {"sintoma": "Las skills de tu cuenta no aparecen en Claude Code.", "solucion": "Revisá tres cosas: que tengas Claude Code 2.1.273 o posterior, que hayas entrado con tu cuenta de Claude y no con una API key o Amazon Bedrock, y que syncClaudeAiSkills no esté en false en tu configuración. La sincronización corre al abrir la sesión y después cada tanto, así que un cambio hecho en la app puede tardar en aparecer."}, {"sintoma": "Editaste una skill en Claude Code y al rato los cambios desaparecieron.", "solucion": "Editaste la copia sincronizada en ~/.claude/skills/synced/, que se pisa en cada sincronización. Hacé el cambio en la app (Customize → Skills, subiendo la versión nueva) o copiá la carpeta a ~/.claude/skills/ con otro name si la querés solo en Claude Code."}, {"sintoma": "Una skill personal de tu compu no aparece en Cowork ni en una sesión de Claude Code en la nube.", "solucion": "Las de ~/.claude/skills/ solo existen en esa compu. Comprimí la carpeta y subila a tu cuenta en Customize → Skills para tenerla en Cowork y en la nube."}, {"sintoma": "Creaste .claude/skills en un proyecto con Claude Code abierto y la skill no aparece.", "solucion": "Si la carpeta skills no existía al abrir la sesión, Claude Code no la está mirando. Escribí /reload-skills."}], "kit": [{"archivo": "mapa-de-skills-donde-va-cada-una.md", "que_es": "Inventario para listar tus skills y decidir, con seis preguntas en orden, dónde va cada una, más los controles antes de moverla.", "contenido": "# Mapa de mis skills: dónde vive cada una\n\nCompletá una fila por skill. Sirve para decidir dónde ponerla y para no repetir nombres.\n\n## Inventario\n\n| name | Para qué es | ¿La uso en la app, en Claude Code o en los dos? | ¿Sirve para cualquier trabajo o para uno solo? | ¿La tiene que tener el equipo? | Dónde va |\n|---|---|---|---|---|---|\n| [NOMBRE] | [UNA FRASE] | [APP / CODE / LOS DOS] | [CUALQUIERA / SOLO (PROYECTO)] | [SÍ / NO] | [VER ABAJO] |\n\n## Cómo completar \"Dónde va\"\n\nSeguí las preguntas en orden y quedate con la primera que dé sí.\n\n1. ¿Es solo para un proyecto de código y el equipo trabaja en el mismo repo?\n   Va en el proyecto: .claude/skills/[NOMBRE]/SKILL.md, y se sube al repo con git.\n2. ¿Es solo para un proyecto de código pero el resto del equipo no la necesita?\n   Va en el proyecto, pero sin subirla al repo (agregala al .gitignore), o como personal con un name que diga el proyecto.\n3. ¿La usás en la app y también en Claude Code?\n   Va en tu cuenta: Customize → Skills. Claude Code la descarga sola si entrás con la misma cuenta.\n4. ¿La usás solo en Claude Code, en cualquier proyecto?\n   Va como personal: ~/.claude/skills/[NOMBRE]/SKILL.md.\n5. ¿Va junto con otras skills o con un conector, para repartir a otras personas?\n   Va en un plugin.\n6. ¿La tiene que tener toda la organización sin que cada uno la instale?\n   La sube un Owner para toda la organización (Team o Enterprise).\n\n## Controles antes de mover o crear\n\n- [ ] El name no se repite en otro lugar. Si se repite, en Claude Code gana la de la organización, después la personal y al final la del proyecto.\n- [ ] Si la skill está en tu cuenta, no la editás en ~/.claude/skills/synced/ (se pisa en la próxima sincronización). Se edita en la app.\n- [ ] Si es de proyecto y la subís al repo, no tiene claves ni datos de clientes.\n- [ ] Si tiene allowed-tools, sabés qué herramientas habilita.\n"}, {"archivo": "notas-de-version-cliente/SKILL.md", "que_es": "Skill de proyecto para Claude Code que escribe notas de versión para el cliente desde los commits. Copiala a .claude/skills/ del repo de cada cliente y ajustá el tono.", "contenido": "---\nname: notas-de-version-cliente\ndescription: Escribe las notas de versión para el cliente a partir de los cambios del repo desde la última etiqueta. Usala cuando pidan notas de versión, changelog para el cliente o qué cambió en la entrega.\n---\n\n# Notas de versión para el cliente\n\nEscribís las notas de una entrega para una persona que no programa. Las revisa el desarrollador antes de mandarlas.\n\n## Pasos\n\n1. Buscá la última etiqueta de versión con git describe --tags --abbrev=0. Si no hay etiquetas, preguntá desde qué fecha o commit arrancar.\n2. Listá los commits desde esa etiqueta con git log [ETIQUETA]..HEAD --oneline.\n3. Agrupá los cambios en tres secciones: Nuevo, Mejoras y Correcciones. Lo que sea interno (dependencias, refactors, pruebas) no va, salvo que cambie algo que el cliente ve.\n4. Reescribí cada cambio en una línea que el cliente entienda: qué puede hacer ahora o qué dejó de fallar. Sin nombres de archivos, funciones ni ramas.\n5. Si un commit no deja claro qué cambió para el usuario, no lo adivines: listalo al final en PARA REVISAR.\n6. Mostrá el resultado en el chat. No crees archivos ni etiquetas, y no hagas commits.\n\n## Formato\n\n## Versión [NÚMERO O FECHA]\n\n**Nuevo**\n- ...\n\n**Mejoras**\n- ...\n\n**Correcciones**\n- ...\n\n**PARA REVISAR** (no se manda al cliente)\n- [commit]: [por qué no quedó claro]\n\n## Reglas\n\n- Español claro, con voseo, sin jerga técnica.\n- Una línea por cambio. Si una sección queda vacía, sacala.\n- No prometas fechas ni próximos cambios.\n- Si los datos del cliente o el nombre del producto están en el CLAUDE.md del proyecto, usalos. Si no, dejá [PRODUCTO].\n"}, {"archivo": "instrucciones-proyecto-que-usan-una-skill.md", "que_es": "Tres modelos para pegar en las instrucciones de un Proyecto de la app: los datos del cliente quedan en el Proyecto y el procedimiento en la skill.", "contenido": "# Instrucciones de Proyecto que usan una skill\n\nTres modelos para pegar en las instrucciones de un Proyecto de la app (Set project instructions). La idea: en el Proyecto quedan los datos del cliente y en la skill el procedimiento. Así la misma skill sirve para varios clientes.\n\n## Modelo 1: un cliente, una tarea\n\nEn este proyecto trabajamos para [CLIENTE], que se dedica a [RUBRO] en [CIUDAD].\nCuando te pida [TAREA, POR EJEMPLO: EL INFORME DEL MES], usá la skill [NOMBRE-DE-LA-SKILL].\nLos datos del cliente (nombre del producto, contactos, tono, lo que no se dice) están en el archivo [NOMBRE DEL ARCHIVO] de este proyecto. Tomalos de ahí y no los completes con suposiciones.\n\n## Modelo 2: un cliente, varias tareas\n\nEn este proyecto trabajamos para [CLIENTE].\n- Para presupuestos, usá la skill [SKILL-PRESUPUESTOS].\n- Para el informe del mes, usá la skill [SKILL-INFORME].\n- Para responder consultas, usá la skill [SKILL-RESPUESTAS].\nCualquier dato del cliente sale de los archivos de este proyecto. Si un dato no está, marcalo como PENDIENTE y seguí.\n\n## Modelo 3: lo que cambia por cliente\n\nEn este proyecto trabajamos para [CLIENTE].\nCuando uses la skill [NOMBRE-DE-LA-SKILL], aplicá estas diferencias para este cliente:\n- Tono: [EJEMPLO: FORMAL, SIN VOSEO]\n- Firma: [NOMBRE Y CARGO]\n- Moneda y formato de fechas: [EJEMPLO: PESOS, DD/MM/AAAA]\nSi estas diferencias chocan con la skill, ganan las de este proyecto.\n\n## Antes de usarlo\n\n- [ ] La skill está activada en Customize → Skills.\n- [ ] El name que escribiste es exactamente el de la skill.\n- [ ] Los archivos que nombrás están subidos al Proyecto.\n"}], "verificada": "2026-11-08", "cat": "skills", "parte": "usalo"};</script>

<script>var GUIA = {"slug": "skills-globales-o-por-proyecto", "t": "Skills globales o por proyecto: dónde ponerlas", "d": "Una skill puede vivir en tu cuenta, en tu compu o dentro de un proyecto. Te explico cada lugar y cómo decidir cuál te conviene.", "tema": "Skills y plugins", "min": 7, "secciones": [{"h": "Los lugares donde puede vivir una skill", "lista": ["Tu cuenta de Claude (Personalizar → Skills): la usás en la web y en la app de escritorio. Si entrás a Claude Code con la misma cuenta, también se carga ahí.", "Personal en Claude Code (~/.claude/skills/nombre/SKILL.md): está en todos tus proyectos, pero solo en esa compu.", "De proyecto (.claude/skills/nombre/SKILL.md dentro de la carpeta del proyecto): solo existe cuando trabajás en ese proyecto. Si el proyecto se comparte por git, tu equipo también la recibe.", "Dentro de un plugin: viene con el plugin y se llama /nombre-del-plugin:nombre-de-la-skill.", "De tu organización: en planes Team y Enterprise, un Owner puede darle skills a todo el equipo."]}, {"h": "Cómo decidir", "lista": ["Global (cuenta o ~/.claude/skills): para lo que usás en cualquier tema, como tu tono o tu marca.", "Por proyecto (.claude/skills): para lo que solo tiene sentido en un trabajo, como el formato de informes de un cliente.", "En tu cuenta: si querés la misma skill en la app y en Claude Code sin copiarla a mano.", "En un plugin: si querés repartir varias skills juntas, o una skill con el conector que usa."], "aviso": "Regla práctica: empezá global. Si ves que una skill solo la usás en un proyecto, movela ahí."}, {"h": "Si hay dos skills con el mismo nombre", "p": ["En Claude Code gana la de la organización sobre la personal, y la personal sobre la del proyecto. Por ejemplo, si tenés presupuestos en ~/.claude/skills y otra presupuestos en el proyecto, /presupuestos corre la personal.", "Las de plugins no chocan porque llevan el nombre del plugin adelante. Igual, lo más simple es no repetir nombres."]}, {"h": "Mover una skill de lugar en Claude Code", "pasos": ["Escribí /skills para ver las skills que tenés cargadas.", "Pegá el prompt de abajo para moverla.", "Claude Code detecta el cambio sin reiniciar. Si creaste una carpeta skills que no existía al abrir la sesión, escribí /reload-skills."], "prompts": [{"t": "Mover una skill", "c": "Mové la skill [NOMBRE] de [.claude/skills de este proyecto | ~/.claude/skills] a [~/.claude/skills | .claude/skills de este proyecto].\nAntes de moverla, fijate si ya hay otra skill con el mismo nombre en el destino y avisame.\nDespués confirmame dónde quedó y mostrame la ruta completa del SKILL.md."}]}, {"h": "Proyectos de la app y skills no son lo mismo", "p": ["En la app de Claude, un Proyecto guarda conocimiento de fondo que está siempre cargado en sus chats. Una skill se carga solo cuando la tarea coincide, y está disponible en todas tus charlas.", "Se complementan: en el Proyecto dejás la información del cliente y en la skill el procedimiento. Podés nombrar la skill en las instrucciones del Proyecto para que Claude la tenga presente."], "prompts": [{"t": "Instrucción para un Proyecto", "c": "En este proyecto trabajamos para [CLIENTE]. Cuando te pida [TAREA], usá la skill [NOMBRE-DE-LA-SKILL] y tomá los datos del cliente de los archivos de este proyecto."}]}], "faq": [{"q": "¿Las skills que creo en Claude Code aparecen en la app?", "a": "No. Claude Code baja las skills de tu cuenta, pero nunca sube las tuyas. Si la querés en la app, subila como .zip en Personalizar → Skills."}, {"q": "¿Qué pasa si clono un proyecto que trae skills?", "a": "Se cargan cuando trabajás ahí. Leelas antes: una skill puede pedir permisos amplios con el campo allowed-tools, y la documentación recomienda revisarlo en los repos que no son tuyos."}, {"q": "¿Cuál es más segura?", "a": "Ninguna en particular. Lo que importa es de dónde viene la skill y que la hayas leído antes de usarla."}], "fuentes": ["https://code.claude.com/docs/en/skills", "https://claude.com/docs/skills/overview"

<script>var GUIA = {"slug": "sistema-base-modulo-2-elegir-a-quien-venderle", "t": "Módulo 2 · Elegir a quién venderle y armar tu lista de 50", "d": "Cómo elegir un rubro con tres criterios, dónde encontrar los negocios y cómo armar con Claude una planilla de 50 contactos para empezar.", "tema": "El sistema para vender IA", "min": 8, "fichaNombre": "Lista de 50", "ficha": [["Qué es", "Un método para elegir un rubro y juntar 50 negocios concretos para contactar."], ["Necesitas", "Una planilla, un par de horas y conocer tu ciudad o tu red."], ["Resultado", "Una lista ordenada por prioridad, lista para el Módulo 3."], ["Qué no hace", "No junta datos de forma automática ni compra bases de datos."]], "secciones": [{"h": "Por qué pocos rubros y no \"cualquier negocio\"", "p": ["Si le vendes a una inmobiliaria, una odontología y una ferretería en la misma semana sin ningún criterio, tienes que entender tres negocios distintos sin aprender de ninguno. Si repites el mismo rubro, al tercer cliente ya sabes qué preguntar, qué les duele y cómo armar sus skills.", "Al empezar, la clave es elegir primero la solución (el paquete del Módulo 1) y probarla en 3 rubros a la vez. Si uno no responde después de un volumen real (no 8 o 10 contactos), lo cambias por otro. Cuando tengas casos de éxito, te quedas con el que mejor funcionó.", "En un mismo rubro los dueños se conocen y se recomiendan: un caso que funcionó vale más cuando el próximo cliente se parece al anterior. Para elegir los 3, mira \"Elegir la solución y los rubros para tus primeros clientes\"."]}, {"h": "Los tres criterios", "lista": ["Hay muchos negocios del rubro: en tu ciudad o en tu alcance tiene que haber al menos 50. Si hay 12, se te termina la lista antes de aprender.", "Tienen procesos que se repiten: presupuestos, turnos, consultas parecidas, documentos con el mismo formato. Ahí es donde un proyecto con skills ayuda de verdad.", "Hablan mucho con sus clientes: mails, mensajes, propuestas. Cuanta más comunicación escrita, más uso le van a dar a la skill de respuestas y a la de marca.", "Un extra que suma: que el dueño o alguien del equipo use la computadora todos los días. Si todo pasa por el teléfono y en papel, la instalación cuesta más.", "Descarta: micro-negocios que no buscan crecer, negocios con muy poco volumen de consultas y negocios sin nada digital. No pueden pagarlo o no lo van a usar."], "prompts": [{"t": "Comparar rubros", "c": "Estoy eligiendo un rubro para vender un servicio que instala Claude en negocios (proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de mail, calendario y archivos).\nVivo en [CIUDAD, PAÍS] y puedo vender [SOLO LOCAL / TAMBIÉN A DISTANCIA].\nEstos son los rubros que estoy pensando: [LISTA DE 3 A 6 RUBROS].\n\nPara cada rubro:\n1. Qué tareas repetitivas suele tener que el paquete podría cubrir.\n2. Cuánta comunicación escrita con clientes suele tener.\n3. Qué dudas o resistencias es probable que tenga el dueño.\n4. Qué datos tendría que averiguar yo para saber si hay suficientes negocios en mi zona.\nNo inventes cantidades de negocios ni datos del mercado: si no lo sabes, dime cómo averiguarlo."}]}, {"h": "Dónde encontrar los negocios", "lista": ["Tu red: piensa primero en negocios donde ya eres cliente o donde conoces a alguien. Un contacto que te conoce escucha distinto.", "Mapas y buscadores: busca el rubro en tu ciudad y anota a mano los que tienen datos de contacto públicos.", "Instagram: muchos negocios chicos tienen ahí su canal principal. Mira si publican, si responden comentarios y qué tipo de consultas reciben.", "Cámaras, asociaciones y ferias del rubro: suelen tener listados de socios y eventos donde puedes ir en persona.", "A distancia (LATAM o España): mismo método, pero elige un país y una ciudad por vez para que tus mensajes no suenen genéricos."], "aviso": "Usa solo datos que el negocio publicó para que lo contacten. No compres bases de datos ni uses programas que copian datos en masa: además de ser una mala práctica, puede ir contra las reglas de las plataformas y contra las leyes de datos personales de tu país."}, {"h": "Arma la planilla", "p": ["Una planilla simple alcanza. Estas columnas te sirven para todo el resto del sistema:"], "pasos": ["Crea la planilla con las columnas: Negocio, Rubro, Ciudad, Canal de contacto (Instagram, WhatsApp, mail, en persona), Dato de contacto público, Qué viste (algo concreto de su negocio), Prioridad (1 a 3), Estado, Fecha del último contacto, Notas.", "Carga los negocios a medida que los encuentras. En \"Qué viste\" pon algo real: \"responden consultas de precios en comentarios\", \"publican presupuestos en historias\".", "Cuando tengas 50, pasa la planilla por Claude con el prompt de abajo para ordenarla y detectar huecos.", "Marca con prioridad 1 a los 10 que más se ajustan a los criterios. Esos son tus primeros contactos del Módulo 3."], "prompts": [{"t": "Ordenar la lista de 50", "c": "Te paso mi lista de negocios para contactar. Vendo un servicio que instala Claude en negocios de [RUBRO].\n\n[PEGA LA PLANILLA O SUBE EL ARCHIVO]\n\n1. Revisa que cada fila tenga canal y dato de contacto. Márcame las que les falta algo.\n2. Márcame duplicados.\n3. Propón una prioridad del 1 al 3 para cada negocio según: cuánta comunicación con clientes muestra, si tiene procesos que se repiten y qué tan claro es el dato en \"Qué viste\". Explica cada prioridad en una línea.\n4. Devuelve la planilla completa con una columna nueva \"Motivo de prioridad\", lista para copiar en Google Sheets.\nNo agregues negocios ni datos que no estén en la lista."}]}], "faq": [{"q": "¿Y si en mi ciudad no hay 50 negocios del rubro?", "a": "Suma ciudades cercanas o un rubro parecido (por ejemplo, odontologías y kinesiologías). O vende a distancia, eligiendo una ciudad por vez."}, {"q": "¿Puedo pedirle a Claude que me busque los negocios?", "a": "Te puede ayudar a pensar dónde buscar y a ordenar lo que juntaste. Igual revisa cada dato tú: un contacto equivocado o desactualizado es un mensaje perdido."}, {"q": "¿Cada cuánto cambio de rubro?", "a": "Revísalo después de hablar con unos diez negocios. Si nadie tiene el problema que resuelves, cambia. Si lo tienen pero no compran, el problema suele estar en el mensaje o en la oferta, no en el rubro."}], "fuentes": [], "ejemplo": {"titulo": "Ejemplo resuelto: elegir rubro y armar la lista de 50 en una ciudad intermedia", "negocio": "Ejemplo inventado: un desarrollador junior de Querétaro, México, que trabaja desde su casa y quiere sus primeros clientes para el paquete base. Vende en su ciudad y puede hacer reuniones en persona.", "punto_de_partida": "Dudaba entre cuatro rubros porque tenía un conocido en cada uno: talleres mecánicos, estudios contables, clínicas veterinarias y escuelas de idiomas. No sabía cuántos negocios había de cada uno ni cómo elegir.", "pasos": ["Pegó el prompt Comparar rubros de la guía con los cuatro rubros y su ciudad. Claude le devolvió tareas repetitivas, resistencias probables y qué averiguar, sin dar cantidades de negocios.", "Copió la matriz del kit y salió a buscar la evidencia: contó a mano en un buscador de mapas, zona por zona, y miró cinco perfiles de Instagram de cada rubro. Anotó al lado de cada puntaje de dónde salía.", "Los talleres quedaron con poca comunicación escrita: casi todo es por teléfono y en persona. Las escuelas de idiomas sumaban, pero contó menos de 50 en su ciudad. Las veterinarias tenían muchas consultas repetidas en comentarios (vacunas, horarios, precios de baño) y llegaba a 50 sumando un municipio vecino.", "Eligió veterinarias y anotó en la matriz la fecha para revisarlo: después de hablar con diez.", "Subió a Google Sheets el archivo planilla-lista-de-50-encabezados.csv del kit, borró la fila de ejemplo y empezó por su red: la veterinaria de su perro y dos donde tenía conocidos.", "Siguió con el buscador de mapas y con Instagram. En Qué viste escribió cosas concretas, como responden en comentarios consultas de precio de vacunas o publican horarios de baño por historias. En Fuente del dato anotó de dónde sacó cada contacto. No cargó negocios sin un dato de contacto publicado.", "Cuando llegó a 50, descargó la planilla como CSV, la subió a Claude y le pidió que la ordenara con la skill ordenar-lista-de-prospectos del kit. Claude marcó dos duplicados (la misma clínica con su Instagram y su WhatsApp en filas distintas) y cuatro filas sin Qué viste.", "Completó esas cuatro filas mirando de nuevo los perfiles, borró los duplicados y copió la tabla final a su planilla. Los diez de prioridad 1 quedaron como primeros contactos para el Módulo 3."], "resultado": "Quedó un rubro elegido con evidencia anotada, una fecha para revisarlo, y una planilla de 50 veterinarias con canal, dato público, algo concreto de cada negocio, la fuente de cada dato y una prioridad con su motivo. Los diez primeros están listos para el mensaje del Módulo 3."}, "si_falla": [{"sintoma": "Le pediste a Claude que te busque negocios y la lista trae nombres, teléfonos o cuentas que no existen o no coinciden.", "solucion": "Claude puede equivocarse con datos de negocios concretos, sobre todo sin búsqueda web. Úsalo para pensar dónde buscar y para ordenar lo que juntaste tú. Si le pides que busque en la web, pídele el link de cada dato y abre cada uno antes de cargarlo."}, {"sintoma": "La tabla que te devuelve Claude se pega toda en una sola columna en Google Sheets, o llega cortada.", "solucion": "Pídele la planilla como archivo CSV para descargar, o sube la tuya como archivo en vez de pegarla. En Google Sheets, impórtala con Archivo → Importar. Si la lista es larga y la respuesta se corta, pídele que la devuelva en partes de 25 filas."}, {"sintoma": "Llegas a 30 o 35 negocios y no encuentras más del rubro.", "solucion": "Antes de cambiar de rubro, suma ciudades cercanas o un rubro muy parecido que use el mismo paquete (por ejemplo, veterinarias y peluquerías de mascotas). Si igual no llegas, el criterio A te está diciendo que ese rubro no alcanza para aprender: vuelve a la matriz."}, {"sintoma": "Muchos negocios de la lista tienen el Instagram abandonado o el teléfono no responde.", "solucion": "Suma a Qué viste la fecha de la última publicación o reseña que viste, y baja la prioridad de los que llevan meses sin actividad. Un dato de contacto vivo vale más que diez desactualizados."}, {"sintoma": "Todos los negocios te quedan con prioridad 1 o todos con 3.", "solucion": "El campo Qué viste está muy general (por ejemplo, tiene Instagram). Reescríbelo con algo observable y distinto por negocio: qué preguntan los clientes, qué publican, cómo responden. Con eso la prioridad se separa sola."}], "kit": [{"archivo": "matriz-elegir-rubro-con-evidencia.md", "que_es": "Plantilla para comparar de 3 a 6 rubros con los tres criterios de la guía más el extra, con puntaje de 0 a 2, la evidencia de cada puntaje, cómo averiguar lo que falta y la decisión con fecha de revisión.", "contenido": "# Matriz para elegir rubro\n\nComplétala con evidencia, no con intuición. Cada puntaje va con una fuente o una observación concreta. Si no tienes el dato, pon \"?\" y anota cómo lo vas a averiguar.\n\nMi zona: [CIUDAD, PAÍS] | Vendo: [SOLO LOCAL / TAMBIÉN A DISTANCIA] | Fecha: [AAAA-MM-DD]\n\n## Cómo puntuar (0, 1 o 2)\n\n| Criterio | 0 | 1 | 2 |\n|---|---|---|---|\n| A. Cantidad de negocios a mi alcance | Conté menos de 50 | Llego a 50 sumando ciudades cercanas | Conté 50 o más en mi zona |\n| B. Procesos que se repiten | No encontré tareas repetidas | Hay una (por ejemplo, presupuestos) | Hay dos o más (presupuestos, turnos, consultas parecidas, documentos con formato fijo) |\n| C. Comunicación escrita con clientes | Casi todo es en persona o por teléfono | Algo por mensajes o mail | Responden consultas por escrito todos los días |\n| Extra. Uso de la computadora | Todo en papel o en el celular | Alguien la usa a veces | El dueño o alguien del equipo la usa todos los días |\n\nRegla: si A es 0, el rubro queda afuera aunque sume en lo demás.\n\n## Tabla\n\n| Rubro | A | Evidencia de A | B | Evidencia de B | C | Evidencia de C | Extra | Total | Conozco a alguien del rubro |\n|---|---|---|---|---|---|---|---|---|---|\n| [RUBRO 1] | | [Ej.: conté en el buscador de mapas de [CIUDAD]] | | [Ej.: publican listas de precios y piden presupuesto por DM] | | [Ej.: responden comentarios todos los días] | | | sí / no |\n| [RUBRO 2] | | | | | | | | | |\n| [RUBRO 3] | | | | | | | | | |\n| [RUBRO 4] | | | | | | | | | |\n\n## Cómo averiguar lo que falta\n- Cantidad: busca el rubro en un buscador de mapas, zona por zona, y cuenta a mano. Revisa también el listado de socios de la cámara o asociación del rubro, si es público.\n- Procesos: mira 5 perfiles o sitios del rubro. ¿Publican precios, piden datos para presupuestar, hablan de turnos?\n- Comunicación: mira los comentarios y las reseñas. ¿Hay preguntas que se repiten? ¿Responden?\n- Pregúntale a alguien del rubro: \"¿Qué es lo que más se repite en tu semana?\".\n\n## Decisión\nRubro elegido: [RUBRO]\nPor qué, en una frase: [...]\nLo reviso después de hablar con 10 negocios reales. Fecha estimada: [AAAA-MM-DD]\nQué me haría cambiar: nadie tiene el problema que resuelvo. (Si lo tienen y no compran, reviso el mensaje o la oferta antes que el rubro.)\n"}, {"archivo": "planilla-lista-de-50-encabezados.csv", "que_es": "Encabezados de la planilla de la guía, más una columna Fuente del dato, con una fila de ejemplo para borrar. Impórtala en Google Sheets con Archivo → Importar.", "contenido": "Negocio,Rubro,Ciudad,Canal de contacto,Dato de contacto público,Qué viste,Prioridad,Estado,Fecha del último contacto,Notas,Fuente del dato\nEJEMPLO - borrar esta fila,Veterinaria,[CIUDAD],Instagram,@[usuario-publico],Responden en comentarios consultas de precio de vacunas,1,Sin contactar,,Conozco a la recepcionista,Perfil de Instagram del negocio (visto [AAAA-MM-DD])\n"}, {"archivo": "ordenar-lista-de-prospectos/SKILL.md", "que_es": "Skill que revisa la lista de 50: marca filas incompletas y duplicados, propone prioridad con su motivo, elige los diez primeros y devuelve la planilla sin agregar datos. Comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: ordenar-lista-de-prospectos\ndescription: 'Ordena la lista de 50 negocios a contactar: marca incompletos y duplicados, prioriza del 1 al 3 con motivo y la deja lista para Sheets, sin agregar datos. Úsala al limpiar o priorizar prospectos.'\n---\n\n# Ordenar la lista de prospectos\n\nTrabajas solo con lo que hay en la lista. No buscas negocios nuevos, no completas datos de contacto y no inventas información sobre ningún negocio.\n\n## Columnas que esperas\n\nNegocio, Rubro, Ciudad, Canal de contacto, Dato de contacto público, Qué viste, Prioridad, Estado, Fecha del último contacto, Notas, Fuente del dato.\n\nSi faltan columnas, sigue con las que hay y avisa cuáles faltan.\n\n## Pasos\n\n1. **Completitud.** Marca las filas sin canal, sin dato de contacto o sin \"Qué viste\". Una fila sin \"Qué viste\" no puede tener prioridad 1.\n2. **Duplicados.** Mismo negocio en la misma ciudad, aunque esté escrito distinto o con otro canal. Propón cuál fila queda y cuál se borra. Si son sucursales distintas, dilo y no las marques como duplicado.\n3. **Fuente.** Si hay columna \"Fuente del dato\", marca las filas sin fuente. Si una fuente parece una base comprada o un listado que el negocio no publicó para que lo contacten, avisa que conviene sacarla.\n4. **Prioridad.**\n   - 1: muestra comunicación escrita frecuente con clientes y al menos un proceso que se repite, con un dato concreto en \"Qué viste\".\n   - 2: muestra una de las dos cosas, o el dato de \"Qué viste\" es general.\n   - 3: no se ve ninguna, o la información es muy pobre.\n   Si en Notas dice que el usuario conoce a alguien del negocio, sube un nivel (sin pasar de 1).\n5. **Top 10.** Si hay más de 10 con prioridad 1, elige los 10 con el \"Qué viste\" más concreto y explica el criterio en una línea.\n\n## Qué entregas\n\n1. Un resumen corto: cuántas filas recibiste, cuántas incompletas, cuántos posibles duplicados, cuántas en cada prioridad.\n2. La planilla completa, con dos columnas nuevas al final: \"Motivo de prioridad\" (una línea) y \"Revisar\" (qué falta o qué está raro; vacío si nada). Entrégala como tabla para copiar en Google Sheets o, si el usuario lo pide o la lista es larga, como archivo CSV.\n3. La lista de los 10 primeros contactos, en orden.\n\n## Reglas\n- No agregues filas ni completes celdas vacías con datos que no te dieron.\n- No cambies los datos de contacto. Si uno parece mal escrito, márcalo en \"Revisar\".\n- No busques en internet datos de las personas que trabajan en los negocios.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

<script>var GUIA = {"slug": "sistema-base-modulo-2-elegir-a-quien-venderle", "t": "Módulo 2 · Elegir a quién venderle y armar tu lista de 50", "d": "Cómo elegir un rubro con tres criterios, dónde encontrar los negocios y cómo armar con Claude una planilla de 50 contactos para empezar.", "tema": "El sistema para vender IA", "min": 8, "fichaNombre": "Lista de 50", "ficha": [["Qué es", "Un método para elegir un rubro y juntar 50 negocios concretos para contactar."], ["Necesitás", "Una planilla, un par de horas y conocer tu ciudad o tu red."], ["Resultado", "Una lista ordenada por prioridad, lista para el Módulo 3."], ["Qué no hace", "No junta datos de forma automática ni compra bases de datos."]], "secciones": [{"h": "Por qué un solo rubro", "p": ["Si le vendés a una inmobiliaria, una odontología y una ferretería en la misma semana, tenés que entender tres negocios distintos. Si le vendés a diez inmobiliarias, a la tercera ya sabés qué preguntar, qué les duele y cómo armar sus skills.", "Además, en un mismo rubro los dueños se conocen y se recomiendan. Un caso que funcionó vale más cuando el próximo cliente se parece al anterior.", "No es para siempre: elegís uno para tus primeros clientes y lo revisás después de diez contactos reales."]}, {"h": "Los tres criterios", "lista": ["Hay muchos negocios del rubro: en tu ciudad o en tu alcance tiene que haber al menos 50. Si hay 12, se te termina la lista antes de aprender.", "Tienen procesos que se repiten: presupuestos, turnos, consultas parecidas, documentos con el mismo formato. Ahí es donde un proyecto con skills ayuda de verdad.", "Hablan mucho con sus clientes: mails, mensajes, propuestas. Cuanta más comunicación escrita, más uso le van a dar a la skill de respuestas y a la de marca.", "Un extra que suma: que el dueño o alguien del equipo use la compu todos los días. Si todo pasa por el teléfono y en papel, la instalación cuesta más."], "prompts": [{"t": "Comparar rubros", "c": "Estoy eligiendo un rubro para vender un servicio que instala Claude en negocios (proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de mail, calendario y archivos).\nVivo en [CIUDAD, PAÍS] y puedo vender [SOLO LOCAL / TAMBIÉN A DISTANCIA].\nEstos son los rubros que estoy pensando: [LISTA DE 3 A 6 RUBROS].\n\nPara cada rubro:\n1. Qué tareas repetitivas suele tener que el paquete podría cubrir.\n2. Cuánta comunicación escrita con clientes suele tener.\n3. Qué dudas o resistencias es probable que tenga el dueño.\n4. Qué datos tendría que averiguar yo para saber si hay suficientes negocios en mi zona.\nNo inventes cantidades de negocios ni datos del mercado: si no lo sabés, decime cómo averiguarlo."}]}, {"h": "Dónde encontrar los negocios", "lista": ["Tu red: pensá primero en negocios donde ya sos cliente o donde conocés a alguien. Un contacto que te conoce escucha distinto.", "Mapas y buscadores: buscá el rubro en tu ciudad y anotá a mano los que tienen datos de contacto públicos.", "Instagram: muchos negocios chicos tienen ahí su canal principal. Mirá si publican, si responden comentarios y qué tipo de consultas reciben.", "Cámaras, asociaciones y ferias del rubro: suelen tener listados de socios y eventos donde podés ir en persona.", "A distancia (LATAM o España): mismo método, pero elegí un país y una ciudad por vez para que tus mensajes no suenen genéricos."], "aviso": "Usá solo datos que el negocio publicó para que lo contacten. No compres bases de datos ni uses programas que copian datos en masa: además de ser una mala práctica, puede ir contra las reglas de las plataformas y contra las leyes de datos personales de tu país."}, {"h": "Armá la planilla", "p": ["Una planilla simple alcanza. Estas columnas te sirven para todo el resto del sistema:"], "pasos": ["Creá la planilla con las columnas: Negocio, Rubro, Ciudad, Canal de contacto (Instagram, WhatsApp, mail, en persona), Dato de contacto público, Qué viste (algo concreto de su negocio), Prioridad (1 a 3), Estado, Fecha del último contacto, Notas.", "Cargá los negocios a medida que los encontrás. En \"Qué viste\" poné algo real: \"responden consultas de precios en comentarios\", \"publican presupuestos en historias\".", "Cuando tengas 50, pasá la planilla por Claude con el prompt de abajo para ordenarla y detectar huecos.", "Marcá con prioridad 1 a los 10 que más se ajustan a los criterios. Esos son tus primeros contactos del Módulo 3."], "prompts": [{"t": "Ordenar la lista de 50", "c": "Te paso mi lista de negocios para contactar. Vendo un servicio que instala Claude en negocios de [RUBRO].\n\n[PEGÁ LA PLANILLA O SUBÍ EL ARCHIVO]\n\n1. Revisá que cada fila tenga canal y dato de contacto. Marcame las que les falta algo.\n2. Marcame duplicados.\n3. Proponé una prioridad del 1 al 3 para cada negocio según: cuánta comunicación con clientes muestra, si tiene procesos que se repiten y qué tan claro es el dato en \"Qué viste\". Explicá cada prioridad en una línea.\n4. Devolvé la planilla completa con una columna nueva \"Motivo de prioridad\", lista para copiar en Google Sheets.\nNo agregues negocios ni datos que no estén en la lista."}]}], "faq": [{"q": "¿Y si en mi ciudad no hay 50 negocios del rubro?", "a": "Sumá ciudades cercanas o un rubro parecido (por ejemplo, odontologías y kinesiologías). O vendé a distancia, eligiendo una ciudad por vez."}, {"q": "¿Puedo pedirle a Claude que me busque los negocios?", "a": "Te puede ayudar a pensar dónde buscar y a ordenar lo que juntaste. Igual revisá cada dato vos: un contacto equivocado o desactualizado es un mensaje perdido."}, {"q": "¿Cada cuánto cambio de rubro?", "a": "Revisalo después de hablar con unos diez negocios. Si nadie tiene el problema que resolvés, cambiá. Si lo tienen pero no compran, el problema suele estar en el mensaje o en la oferta, no en el rubro."}], "fuentes": [], "ejemplo": {"titulo": "Ejemplo resuelto: elegir rubro y armar la lista de 50 en una ciudad intermedia", "negocio": "Ejemplo inventado: un desarrollador junior de Querétaro, México, que trabaja desde su casa y quiere sus primeros clientes para el paquete base. Vende en su ciudad y puede hacer reuniones en persona.", "punto_de_partida": "Dudaba entre cuatro rubros porque tenía un conocido en cada uno: talleres mecánicos, estudios contables, clínicas veterinarias y escuelas de idiomas. No sabía cuántos negocios había de cada uno ni cómo elegir.", "pasos": ["Pegó el prompt Comparar rubros de la guía con los cuatro rubros y su ciudad. Claude le devolvió tareas repetitivas, resistencias probables y qué averiguar, sin dar cantidades de negocios.", "Copió la matriz del kit y salió a buscar la evidencia: contó a mano en un buscador de mapas, zona por zona, y miró cinco perfiles de Instagram de cada rubro. Anotó al lado de cada puntaje de dónde salía.", "Los talleres quedaron con poca comunicación escrita: casi todo es por teléfono y en persona. Las escuelas de idiomas sumaban, pero contó menos de 50 en su ciudad. Las veterinarias tenían muchas consultas repetidas en comentarios (vacunas, horarios, precios de baño) y llegaba a 50 sumando un municipio vecino.", "Eligió veterinarias y anotó en la matriz la fecha para revisarlo: después de hablar con diez.", "Subió a Google Sheets el archivo planilla-lista-de-50-encabezados.csv del kit, borró la fila de ejemplo y empezó por su red: la veterinaria de su perro y dos donde tenía conocidos.", "Siguió con el buscador de mapas y con Instagram. En Qué viste escribió cosas concretas, como responden en comentarios consultas de precio de vacunas o publican horarios de baño por historias. En Fuente del dato anotó de dónde sacó cada contacto. No cargó negocios sin un dato de contacto publicado.", "Cuando llegó a 50, descargó la planilla como CSV, la subió a Claude y le pidió que la ordenara con la skill ordenar-lista-de-prospectos del kit. Claude marcó dos duplicados (la misma clínica con su Instagram y su WhatsApp en filas distintas) y cuatro filas sin Qué viste.", "Completó esas cuatro filas mirando de nuevo los perfiles, borró los duplicados y copió la tabla final a su planilla. Los diez de prioridad 1 quedaron como primeros contactos para el Módulo 3."], "resultado": "Quedó un rubro elegido con evidencia anotada, una fecha para revisarlo, y una planilla de 50 veterinarias con canal, dato público, algo concreto de cada negocio, la fuente de cada dato y una prioridad con su motivo. Los diez primeros están listos para el mensaje del Módulo 3."}, "si_falla": [{"sintoma": "Le pediste a Claude que te busque negocios y la lista trae nombres, teléfonos o cuentas que no existen o no coinciden.", "solucion": "Claude puede equivocarse con datos de negocios concretos, sobre todo sin búsqueda web. Usalo para pensar dónde buscar y para ordenar lo que juntaste vos. Si le pedís que busque en la web, pedile el link de cada dato y abrí cada uno antes de cargarlo."}, {"sintoma": "La tabla que te devuelve Claude se pega toda en una sola columna en Google Sheets, o llega cortada.", "solucion": "Pedile la planilla como archivo CSV para descargar, o subí la tuya como archivo en vez de pegarla. En Google Sheets, importala con Archivo → Importar. Si la lista es larga y la respuesta se corta, pedile que la devuelva en partes de 25 filas."}, {"sintoma": "Llegás a 30 o 35 negocios y no encontrás más del rubro.", "solucion": "Antes de cambiar de rubro, sumá ciudades cercanas o un rubro muy parecido que use el mismo paquete (por ejemplo, veterinarias y peluquerías de mascotas). Si igual no llegás, el criterio A te está diciendo que ese rubro no alcanza para aprender: volvé a la matriz."}, {"sintoma": "Muchos negocios de la lista tienen el Instagram abandonado o el teléfono no responde.", "solucion": "Sumá a Qué viste la fecha de la última publicación o reseña que viste, y bajá la prioridad de los que llevan meses sin actividad. Un dato de contacto vivo vale más que diez desactualizados."}, {"sintoma": "Todos los negocios te quedan con prioridad 1 o todos con 3.", "solucion": "El campo Qué viste está muy general (por ejemplo, tiene Instagram). Reescribilo con algo observable y distinto por negocio: qué preguntan los clientes, qué publican, cómo responden. Con eso la prioridad se separa sola."}], "kit": [{"archivo": "matriz-elegir-rubro-con-evidencia.md", "que_es": "Plantilla para comparar de 3 a 6 rubros con los tres criterios de la guía más el extra, con puntaje de 0 a 2, la evidencia de cada puntaje, cómo averiguar lo que falta y la decisión con fecha de revisión.", "contenido": "# Matriz para elegir rubro\n\nCompletala con evidencia, no con intuición. Cada puntaje va con una fuente o una observación concreta. Si no tenés el dato, poné \"?\" y anotá cómo lo vas a averiguar.\n\nMi zona: [CIUDAD, PAÍS] | Vendo: [SOLO LOCAL / TAMBIÉN A DISTANCIA] | Fecha: [AAAA-MM-DD]\n\n## Cómo puntuar (0, 1 o 2)\n\n| Criterio | 0 | 1 | 2 |\n|---|---|---|---|\n| A. Cantidad de negocios a mi alcance | Conté menos de 50 | Llego a 50 sumando ciudades cercanas | Conté 50 o más en mi zona |\n| B. Procesos que se repiten | No encontré tareas repetidas | Hay una (por ejemplo, presupuestos) | Hay dos o más (presupuestos, turnos, consultas parecidas, documentos con formato fijo) |\n| C. Comunicación escrita con clientes | Casi todo es en persona o por teléfono | Algo por mensajes o mail | Responden consultas por escrito todos los días |\n| Extra. Uso de la compu | Todo en papel o en el celular | Alguien la usa a veces | El dueño o alguien del equipo la usa todos los días |\n\nRegla: si A es 0, el rubro queda afuera aunque sume en lo demás.\n\n## Tabla\n\n| Rubro | A | Evidencia de A | B | Evidencia de B | C | Evidencia de C | Extra | Total | Conozco a alguien del rubro |\n|---|---|---|---|---|---|---|---|---|---|\n| [RUBRO 1] | | [Ej.: conté en el buscador de mapas de [CIUDAD]] | | [Ej.: publican listas de precios y piden presupuesto por DM] | | [Ej.: responden comentarios todos los días] | | | sí / no |\n| [RUBRO 2] | | | | | | | | | |\n| [RUBRO 3] | | | | | | | | | |\n| [RUBRO 4] | | | | | | | | | |\n\n## Cómo averiguar lo que falta\n- Cantidad: buscá el rubro en un buscador de mapas, zona por zona, y contá a mano. Revisá también el listado de socios de la cámara o asociación del rubro, si es público.\n- Procesos: mirá 5 perfiles o sitios del rubro. ¿Publican precios, piden datos para presupuestar, hablan de turnos?\n- Comunicación: mirá los comentarios y las reseñas. ¿Hay preguntas que se repiten? ¿Responden?\n- Preguntale a alguien del rubro: \"¿Qué es lo que más se repite en tu semana?\".\n\n## Decisión\nRubro elegido: [RUBRO]\nPor qué, en una frase: [...]\nLo reviso después de hablar con 10 negocios reales. Fecha estimada: [AAAA-MM-DD]\nQué me haría cambiar: nadie tiene el problema que resuelvo. (Si lo tienen y no compran, reviso el mensaje o la oferta antes que el rubro.)\n"}, {"archivo": "planilla-lista-de-50-encabezados.csv", "que_es": "Encabezados de la planilla de la guía, más una columna Fuente del dato, con una fila de ejemplo para borrar. Importala en Google Sheets con Archivo → Importar.", "contenido": "Negocio,Rubro,Ciudad,Canal de contacto,Dato de contacto público,Qué viste,Prioridad,Estado,Fecha del último contacto,Notas,Fuente del dato\nEJEMPLO - borrar esta fila,Veterinaria,[CIUDAD],Instagram,@[usuario-publico],Responden en comentarios consultas de precio de vacunas,1,Sin contactar,,Conozco a la recepcionista,Perfil de Instagram del negocio (visto [AAAA-MM-DD])\n"}, {"archivo": "ordenar-lista-de-prospectos/SKILL.md", "que_es": "Skill que revisa la lista de 50: marca filas incompletas y duplicados, propone prioridad con su motivo, elige los diez primeros y devuelve la planilla sin agregar datos. Comprimí la carpeta en ZIP y subila en Customize → Skills.", "contenido": "---\nname: ordenar-lista-de-prospectos\ndescription: 'Ordena la lista de 50 negocios a contactar: marca incompletos y duplicados, prioriza del 1 al 3 con motivo y la deja lista para Sheets, sin agregar datos. Usala al limpiar o priorizar prospectos.'\n---\n\n# Ordenar la lista de prospectos\n\nTrabajás solo con lo que hay en la lista. No buscás negocios nuevos, no completás datos de contacto y no inventás información sobre ningún negocio.\n\n## Columnas que esperás\n\nNegocio, Rubro, Ciudad, Canal de contacto, Dato de contacto público, Qué viste, Prioridad, Estado, Fecha del último contacto, Notas, Fuente del dato.\n\nSi faltan columnas, seguí con las que hay y avisá cuáles faltan.\n\n## Pasos\n\n1. **Completitud.** Marcá las filas sin canal, sin dato de contacto o sin \"Qué viste\". Una fila sin \"Qué viste\" no puede tener prioridad 1.\n2. **Duplicados.** Mismo negocio en la misma ciudad, aunque esté escrito distinto o con otro canal. Proponé cuál fila queda y cuál se borra. Si son sucursales distintas, decilo y no las marques como duplicado.\n3. **Fuente.** Si hay columna \"Fuente del dato\", marcá las filas sin fuente. Si una fuente parece una base comprada o un listado que el negocio no publicó para que lo contacten, avisá que conviene sacarla.\n4. **Prioridad.**\n   - 1: muestra comunicación escrita frecuente con clientes y al menos un proceso que se repite, con un dato concreto en \"Qué viste\".\n   - 2: muestra una de las dos cosas, o el dato de \"Qué viste\" es general.\n   - 3: no se ve ninguna, o la información es muy pobre.\n   Si en Notas dice que el usuario conoce a alguien del negocio, subí un nivel (sin pasar de 1).\n5. **Top 10.** Si hay más de 10 con prioridad 1, elegí los 10 con el \"Qué viste\" más concreto y explicá el criterio en una línea.\n\n## Qué entregás\n\n1. Un resumen corto: cuántas filas recibiste, cuántas incompletas, cuántos posibles duplicados, cuántas en cada prioridad.\n2. La planilla completa, con dos columnas nuevas al final: \"Motivo de prioridad\" (una línea) y \"Revisar\" (qué falta o qué está raro; vacío si nada). Entregala como tabla para copiar en Google Sheets o, si el usuario lo pide o la lista es larga, como archivo CSV.\n3. La lista de los 10 primeros contactos, en orden.\n\n## Reglas\n- No agregues filas ni completes celdas vacías con datos que no te dieron.\n- No cambies los datos de contacto. Si uno parece mal escrito, marcalo en \"Revisar\".\n- No busques en internet datos de las personas que trabajan en los negocios.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

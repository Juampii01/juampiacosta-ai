tala Claude en negocios (proyecto con el conocimiento del negocio, skills de marca, presupuestos y respuestas, conectores de mail, calendario y archivos).\nVivo en [CIUDAD, PAÍS] y puedo vender [SOLO LOCAL / TAMBIÉN A DISTANCIA].\nEstos son los rubros que estoy pensando: [LISTA DE 3 A 6 RUBROS].\n\nPara cada rubro:\n1. Qué tareas repetitivas suele tener que el paquete podría cubrir.\n2. Cuánta comunicación escrita con clientes suele tener.\n3. Qué dudas o resistencias es probable que tenga el dueño.\n4. Qué datos tendría que averiguar yo para saber si hay suficientes negocios en mi zona.\nNo inventes cantidades de negocios ni datos del mercado: si no lo sabés, decime cómo averiguarlo."}]}, {"h": "Dónde encontrar los negocios", "lista": ["Tu red: pensá primero en negocios donde ya sos cliente o donde conocés a alguien. Un contacto que te conoce escucha distinto.", "Mapas y buscadores: buscá el rubro en tu ciudad y anotá a mano los que tienen datos de contacto públicos.", "Instagram: muchos negocios chicos tienen ahí su canal principal. Mirá si publican, si responden comentarios y qué tipo de consultas reciben.", "Cámaras, asociaciones y ferias del rubro: suelen tener listados de socios y eventos donde podés ir en persona.", "A distancia (LATAM o España): mismo método, pero elegí un país y una ciudad por vez para que tus mensajes no suenen genéricos."], "aviso": "Usá solo datos que el negocio publicó para que lo contacten. No compres bases de datos ni uses programas que copian datos en masa: además de ser una mala práctica, puede ir contra las reglas de las plataformas y contra las leyes de datos personales de tu país."}, {"h": "Armá la planilla", "p": ["Una planilla simple alcanza. Estas columnas te sirven para todo el resto del sistema:"], "pasos": ["Creá la planilla con las columnas: Negocio, Rubro, Ciudad, Canal de contacto (Instagram, WhatsApp, mail, en persona), Dato de contacto público, Qué viste (algo concreto de su negocio), Prioridad (1 a 3), Estado, Fecha del último contacto, Notas.", "Cargá los negocios a medida que los encontrás. En \"Qué viste\" poné algo real: \"responden consultas de precios en comentarios\", \"publican presupuestos en historias\".", "Cuando tengas 50, pasá la planilla por Claude con el prompt de abajo para ordenarla y detectar huecos.", "Marcá con prioridad 1 a los 10 que más se ajustan a los criterios. Esos son tus primeros contactos del Módulo 3."], "prompts": [{"t": "Ordenar la lista de 50", "c": "Te paso mi lista de negocios para contactar. Vendo un servicio que instala Claude en negocios de [RUBRO].\n\n[PEGÁ LA PLANILLA O SUBÍ EL ARCHIVO]\n\n1. Revisá que cada fila tenga canal y dato de contacto. Marcame las que les falta algo.\n2. Marcame duplicados.\n3. Proponé una prioridad del 1 al 3 para cada negocio según: cuánta comunicación con clientes muestra, si tiene procesos que se repiten y qué tan claro es el dato en \"Qué viste\". Explicá cada prioridad en una línea.\n4. Devolvé la planilla completa con una columna nueva \"Motivo de prioridad\", lista para copiar en Google Sheets.\nNo agregues negocios ni datos que no estén en la lista."}]}], "faq": [{"q": "¿Y si en mi ciudad no hay 50 negocios del rubro?", "a": "Sumá ciudades cercanas o un rubro parecido (por ejemplo, odontologías y kinesiologías). O vendé a distancia, eligiendo una ciudad por vez."}, {"q": "¿Puedo pedirle a Claude que me busque los negocios?", "a": "Te puede ayudar a pensar dónde buscar y a ordenar lo que juntaste. Igual revisá cada dato vos: un contacto equivocado o desactualizado es un mensaje perdido."}, {"q": "¿Cada cuánto cambio de rubro?", "a": "Revisalo después de hablar con unos diez negocios. Si nadie tiene el problema que resolvés, cambiá. Si lo tienen pero no compran, el problema suele estar en el mensaje o en la oferta, no en el rubro."}], "fuentes": []};</script>

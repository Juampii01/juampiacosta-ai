<script>var GUIA = {"slug": "que-modelo-de-claude-uso", "post": "MODELO", "t": "Qué modelo de Claude usar para cada tarea", "d": "Haiku, Sonnet, Opus y Fable: para qué sirve cada uno, cuánto de tu límite gasta y cómo cambiarlo en la app y en Claude Code.", "tema": "Gastá menos tokens", "min": 7, "fichaNombre": "Modelos de Claude", "ficha": [["Qué es", "Claude viene en varias familias de modelos: más rápidos y livianos o más potentes y lentos."], ["Los actuales", "Claude Haiku 5.5, Claude Sonnet 5.5, Claude Opus 5.5 y Claude Fable 5.1."], ["Regla simple", "Si no sabés cuál elegir, empezá con Sonnet y subí cuando la tarea lo pida."]], "secciones": [{"h": "Los cuatro modelos", "lista": ["Haiku: el más rápido. Para respuestas cortas, resúmenes y sacar datos de un texto. Es el que menos gasta de tu límite.", "Sonnet: el de todos los días. Escribir, analizar, programar y tareas de varios pasos. Anthropic lo recomienda como punto de partida si dudás.", "Opus: para razonar en serio. Investigaciones profundas y problemas complejos que necesitan pensar mucho. Gasta más de tu límite.", "Fable: el más capaz que está disponible para el público. Para los proyectos más grandes y largos, donde Claude avanza con menos supervisión. Es el que más gasta y requiere un plan pago: en Pro se usa con créditos de uso (que se pagan aparte), y en Max y Ultra está incluido hasta la mitad del límite semanal."]}, {"h": "Cómo elegir sin pensarlo tanto", "pasos": ["Arrancá con Sonnet.", "Si es algo simple y lo hacés muchas veces (clasificar, resumir, extraer), pasá a Haiku y cuidás tu límite.", "Si la respuesta se queda corta en algo difícil (una estrategia, un análisis con muchos datos), probá con Opus.", "Guardá Fable para trabajos grandes e importantes, no para preguntas sueltas."]}, {"h": "Cambiar de modelo en la app", "p": ["En la caja de mensaje está el selector de modelo. Ahí elegís el modelo y también el nivel de esfuerzo (Effort): cuánto razona Claude antes de responder.", "Más esfuerzo suele dar mejores respuestas en tareas difíciles, pero gasta más. Para cosas de rutina, bajalo."], "aviso": "No todos los modelos están en todos los planes. Fijate qué te aparece en el selector."}, {"h": "Cambiar de modelo en Claude Code", "p": ["En Claude Code escribís /model sin nada más para abrir el selector, o /model con el nombre corto: haiku, sonnet, opus o fable. Ojo: /model con un nombre también lo guarda como modelo por defecto para las próximas sesiones. Si lo querés solo para esta sesión, abrí el selector con /model y apretá s sobre el modelo.", "El esfuerzo se cambia con /effort: solo abre un control deslizante, o le pasás el nivel directo (por ejemplo /effort high)."], "prompts": [{"t": "Comandos de Claude Code", "c": "/model sonnet\n/model opus\n/model fable\n/effort high\n/effort auto"}]}, {"h": "Dejá que Claude te ayude a elegir", "prompts": [{"t": "Qué modelo conviene", "c": "Voy a hacer esta tarea: [DESCRIBILA].\nLa voy a repetir [UNA VEZ / TODOS LOS DÍAS] y lo que más me importa es [RAPIDEZ / CALIDAD / CUIDAR MI LÍMITE].\n¿Qué modelo de Claude me conviene (Haiku, Sonnet, Opus o Fable) y con qué nivel de esfuerzo? Respondé en 3 líneas."}]}], "faq": [{"q": "¿Opus siempre responde mejor?", "a": "No siempre vale la pena. En tareas simples la diferencia es chica y gastás más de tu límite. Usalo cuando la tarea lo pida."}, {"q": "¿Qué es Mythos?", "a": "Mythos 5.1 es el mismo modelo que Fable 5.1, pero con protecciones más permisivas para trabajo de ciberseguridad y ciencias de la vida. Solo lo usan personas y organizaciones verificadas por programas de acceso de Anthropic. Fable 5.1 es la versión disponible para todos, con las protecciones estándar."}, {"q": "¿Puedo cambiar de modelo en el medio de un chat?", "a": "Sí, desde el selector. En Claude Code, con /model en cualquier momento de la sesión."}], "fuentes": ["https://platform.claude.com/docs/en/models-overview", "https://claude.com/resources/tutorials/choosing-the-right-claude-model", "https://claude.com/blog/claude-models-explained", "https://code.claude.com/docs/en/model-config", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://claude.com/pricing", "https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings", "https://support.claude.com/en/articles/15363606-why-claude-switched-models-in-your-conversation-with-fable-5-or-fable-5-1", "https://www.anthropic.com/claude-fable-and-mythos-5-1", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/commands"], "ejemplo": {"titulo": "Ejemplo resuelto: una agencia que asigna un modelo a cada tarea", "negocio": "Ejemplo inventado: una agencia de marketing digital en Medellín con cuatro personas. Manejan redes y pauta para comercios locales, y uno de los socios programa las landings con Claude Code. Tienen planes Pro, y el socio que programa tiene Max.", "punto_de_partida": "Usaban Opus para todo porque \"es el mejor\". Se quedaban sin uso a mitad de semana, y las tareas simples (copys cortos, ordenar comentarios) tardaban más de lo necesario.", "pasos": ["Listaron las tareas que repiten cada semana en la tabla del kit: copys para posteos, respuestas a comentarios, propuestas comerciales, el plan trimestral de cada cliente y el código de las landings.", "Para cada tarea usaron la skill elegir-modelo del kit: le describieron la tarea, cuántas veces la hacen y qué les importa más. Anotaron en la tabla el modelo y el esfuerzo que salió.", "Quedó así: clasificar y resumir comentarios con Haiku; copys, propuestas y la mayoría del código con Sonnet; el plan trimestral, que cruza muchos datos, con Opus y esfuerzo alto. Fable lo reservaron para la migración completa del sitio de un cliente, una sola vez.", "En la app cambiaron el modelo desde el selector, al lado del botón de enviar, antes de cada tipo de tarea. Para lo rutinario bajaron Effort a Low.", "En Claude Code, el socio dejó Sonnet como default con /model sonnet. Para un problema difícil abrió /model, eligió Opus y apretó s para que fuera solo esa sesión.", "Guardó el subagente resumidor-barato del kit en .claude/agents/ de su proyecto, para que la lectura de logs largos y archivos de configuración la haga Haiku con esfuerzo bajo y le devuelva solo un resumen.", "Pegaron la tabla completa en las instrucciones del Proyecto de la agencia, para que cualquiera la tenga a mano."], "resultado": "Quedó una tabla compartida que dice qué modelo y qué esfuerzo usar para cada tarea de la agencia, Sonnet como default en Claude Code y un subagente que hace con Haiku la lectura pesada. Opus y Fable se usan a propósito, no por costumbre."}, "si_falla": [{"sintoma": "Elegiste Fable y la respuesta salió firmada por Opus, con un aviso de que cambió el modelo.", "solucion": "Fable pasa cada pedido por filtros de seguridad. Si uno salta (temas de biología, ciberseguridad ofensiva y algunos más), la conversación sigue con Opus. Puede saltar por algo que Claude leyó, como un archivo o un resultado de búsqueda. Editá el mensaje antes de volver a Fable, o apagá Switch models when a message is flagged en Settings → Capabilities (en Claude Code, en Config → MODEL & OUTPUT) para que se pause en vez de cambiar."}, {"sintoma": "Usaste /model opus para una tarea y al otro día Claude Code seguía en Opus.", "solucion": "/model con un nombre lo guarda como default para las sesiones nuevas. Volvé con /model sonnet. Para cambiar solo por esa sesión, abrí /model sin nada y apretá s sobre el modelo."}, {"sintoma": "En Claude Code, Fable aparece con \"Requires usage credits\".", "solucion": "Según tu plan, el uso de Fable puede cobrarse de los créditos de uso en vez del límite incluido. Claude Code te pide permiso antes de cobrar. Si no querés pagar aparte, elegí Opus para esa tarea."}, {"sintoma": "/model fable no funciona o Fable no aparece en el selector.", "solucion": "Fable necesita Claude Code v2.1.257 o posterior. Mirá tu versión con claude --version y actualizá Claude Code. En la app, si tenés plan Free, solo vas a ver Haiku y Sonnet: Opus y Fable piden un plan pago."}, {"sintoma": "El subagente del kit no aparece o sigue usando el modelo principal.", "solucion": "Revisá que el archivo esté en .claude/agents/ (del proyecto) o en ~/.claude/agents/ (para todos tus proyectos), con la extensión .md y el frontmatter entre las dos líneas ---. Si la carpeta no existía al abrir la sesión, reiniciá Claude Code. Mientras corre, /tasks te muestra qué modelo está usando."}], "kit": [{"archivo": "elegir-modelo/SKILL.md", "que_es": "Skill que, a partir de la descripción de una tarea, te dice qué modelo y qué nivel de esfuerzo usar, y qué herramientas prender. Guardala en una carpeta elegir-modelo, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: elegir-modelo\ndescription: 'Recomienda modelo de Claude (Haiku, Sonnet, Opus o Fable) y nivel de esfuerzo para una tarea, cuidando el límite del plan. Usala cuando pregunten qué modelo conviene o se queden sin uso rápido.'\n---\n\n# Elegir modelo y esfuerzo\n\nAyudás a elegir el modelo y el nivel de esfuerzo justo para una tarea. El objetivo es que la persona tenga la calidad que necesita sin gastar su límite de más.\n\n## Qué preguntás (solo si falta)\n\n1. Qué tarea es, en una o dos frases.\n2. Cuántas veces la va a hacer: una vez, cada tanto o todos los días.\n3. Qué le importa más: rapidez, calidad o cuidar el límite.\n4. Dónde la va a hacer: en la app de Claude o en Claude Code.\n\nSi ya te dio esos datos, no preguntes: respondé directo.\n\n## Cómo decidís\n\n- **Haiku**: tareas simples y repetidas. Clasificar, resumir textos cortos, sacar datos de un texto, ordenar una lista. Es el más rápido y el que menos gasta.\n- **Sonnet**: el punto de partida para casi todo. Escribir, analizar, programar, tareas de varios pasos. Si dudás entre dos, elegí Sonnet.\n- **Opus**: cuando la tarea necesita razonar mucho. Estrategias, análisis con muchos datos cruzados, problemas que Sonnet resolvió mal. Gasta más.\n- **Fable**: solo para proyectos grandes y largos, donde Claude tiene que avanzar mucho con poca supervisión. Es el que más gasta y en Pro se paga aparte con créditos de uso.\n\nEsfuerzo:\n- **Low o Medium**: rutina.\n- **High**: trabajo que importa.\n- **Extra high**: programación larga y tareas de agentes (solo en Opus 4.7 o más nuevos).\n- **Max**: lo más difícil de verdad.\n\nReglas:\n- Si la tarea se repite todos los días, bajá un escalón de modelo o de esfuerzo respecto de lo que elegirías para una sola vez, salvo que la calidad sea crítica.\n- No recomiendes Fable para preguntas sueltas.\n- No des precios ni cantidades de mensajes. Si te los piden, decí que los revisen en claude.com/pricing.\n\n## Qué entregás\n\nTres líneas:\n1. **Modelo y esfuerzo**: por ejemplo, \"Sonnet, esfuerzo Medium\".\n2. **Por qué**, en una frase.\n3. **Cuándo subir**: la señal concreta de que conviene pasar al siguiente (por ejemplo, \"si el análisis te sale superficial, probá Opus con High\").\n\nSi la tarea es en Claude Code, sumá el comando: /model [alias] y /effort [nivel]. Recordá que /model con un nombre lo deja como default para las sesiones nuevas; para una sola sesión, abrí /model y apretá s.\n\nSi la tarea no necesita búsqueda web, Research ni conectores, decilo en una línea al final.\n"}, {"archivo": "subagente-resumidor-haiku.md", "que_es": "Un subagente de Claude Code que hace con Haiku y esfuerzo bajo la lectura pesada (logs, archivos largos) y te devuelve solo un resumen. Guardalo como .claude/agents/resumidor-barato.md en tu proyecto, o en ~/.claude/agents/ para todos.", "contenido": "---\nname: resumidor-barato\ndescription: Lee archivos largos, logs, salidas de tests o documentación y devuelve un resumen corto con lo importante. Usalo cuando haya que revisar mucho texto para encontrar errores, advertencias o un dato puntual, en vez de leerlo en la conversación principal.\ntools: Read, Grep, Glob\nmodel: haiku\neffort: low\n---\n\nSos un lector rápido. Tu trabajo es leer lo que te pidan y devolver solo lo que sirve, para que la conversación principal no se llene de texto.\n\nCómo trabajás:\n1. Si te pasan una carpeta o un patrón, usá Glob y Grep para encontrar primero lo relevante. No leas archivos enteros si no hace falta.\n2. Buscá errores, advertencias, valores raros o el dato puntual que te pidieron.\n3. No propongas cambios de código ni los hagas. Solo informás.\n\nQué devolvés, siempre en este formato y en español:\n- **Qué revisé**: archivos o rutas, en una línea.\n- **Lo importante**: hasta 8 puntos, cada uno con el archivo y la línea si la tenés.\n- **Lo que no encontré**: si te pidieron algo que no está, decilo.\n\nNo copies bloques largos del original. Si una línea exacta es clave, citá solo esa línea.\n"}, {"archivo": "tabla-modelo-por-tarea.md", "que_es": "Plantilla para listar las tareas que repetís en tu negocio con el modelo, el esfuerzo y las herramientas de cada una. Completala una vez y pegala en las instrucciones de tu Proyecto.", "contenido": "# Qué modelo usamos para cada tarea\n\nNegocio: [NOMBRE]\nÚltima revisión: [AAAA-MM-DD]\nQuién la mantiene: [NOMBRE]\n\n## Regla general\n\n- Si no está en la tabla: Sonnet, esfuerzo por defecto.\n- Si una respuesta sale corta en algo difícil: probá Opus antes de rehacer el pedido diez veces.\n- Fable solo para proyectos grandes y con aviso a [QUIÉN DECIDE].\n\n## Tabla\n\n| Tarea | Cada cuánto | Modelo | Esfuerzo | Búsqueda web | Conectores | Notas |\n|---|---|---|---|---|---|---|\n| [EJ: responder mails de clientes] | Todos los días | Haiku o Sonnet | Low | No | Gmail, on demand | [QUÉ REVISAR ANTES DE MANDAR] |\n| [EJ: propuesta comercial] | Cada semana | Sonnet | Medium | No | Drive | [PLANTILLA A USAR] |\n| [EJ: análisis de ventas del mes] | Cada mes | Opus | High | No | Drive | [PLANILLA DE ORIGEN] |\n| [EJ: investigar un mercado nuevo] | Cada tanto | Research (usa su propio modelo) | - | Sí | Auto | [QUÉ DEJAR AFUERA] |\n| [TAREA] | [FRECUENCIA] | [MODELO] | [ESFUERZO] | [SÍ/NO] | [CUÁLES] | [NOTAS] |\n| [TAREA] | [FRECUENCIA] | [MODELO] | [ESFUERZO] | [SÍ/NO] | [CUÁLES] | [NOTAS] |\n\n## En Claude Code (si programan)\n\n- Default del equipo: /model [sonnet]\n- Para lo difícil, solo en esa sesión: /model, elegir el modelo y apretar s.\n- Esfuerzo de rutina: /effort [medium]\n- Lectura de logs y archivos largos: subagente resumidor-barato (Haiku).\n\n## Cuándo revisar esta tabla\n\n- [ ] Cuando salga un modelo nuevo o cambie el plan.\n- [ ] Cuando alguien se quede sin uso dos semanas seguidas.\n- [ ] Cuando una tarea de la tabla empiece a salir mal con el modelo asignado.\n"}], "verificada": "2026-11-08", "cat": "ahorrar", "parte": "aprende"};</script>

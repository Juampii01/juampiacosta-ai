<script>var GUIA = {"slug": "permisos-y-modo-automatico-con-cuidado", "t": "Permisos y modo automático, sin romper nada", "d": "Qué hace cada modo de permisos, qué aprobar sin miedo, qué leer dos veces y por qué tienes que guardar una copia antes de dejarlo solo.", "tema": "Claude Code", "min": 10, "secciones": [{"h": "Primero, la copia de seguridad", "p": ["Darle permisos amplios a Claude sin guardar antes tu trabajo es como correr scripts en producción sin backup: casi siempre sale bien, y el día que no, no hay vuelta atrás.", "Claude Code guarda puntos de control y con /rewind puedes volver atrás. Pero no reemplazan a git: lo que cambia un comando de terminal no siempre se puede deshacer, ni los cambios que hicieron subagentes. Antes de cualquier tarea grande, haz un commit (o una copia de la carpeta)."], "prompts": [{"t": "Guardar todo antes de empezar", "c": "Antes de hacer cualquier cambio:\n1. Fíjate si esta carpeta ya usa git. Si no, inicialízalo.\n2. Haz un commit con todo como está ahora, con el mensaje \"punto seguro antes de [TAREA]\".\n3. Dime cómo vuelvo a este punto si algo sale mal, explicado simple.\nRecién después espera mi próximo pedido."}]}, {"h": "Los modos", "lista": ["Manual (default): solo lee sin preguntar. Para todo lo demás te pide permiso. El más seguro. Ojo: desde la versión 2.1.283, si no configuraste nada, las sesiones nuevas de la terminal y de VS Code arrancan en auto, no en Manual. Para arrancar siempre en Manual, pon \"defaultMode\": \"default\" dentro de \"permissions\" en ~/.claude/settings.json, o abre con claude --permission-mode default.", "acceptEdits: edita archivos sin preguntar y también aprueba solos los comandos comunes de archivos (mkdir, touch, rm, rmdir, mv, cp y sed), siempre dentro de la carpeta del proyecto. Eso incluye borrar. Lo demás lo consulta.", "plan: lee y explora, pero no edita tu código hasta que apruebes el plan.", "auto: un modelo revisa cada acción en segundo plano y frena las riesgosas en vez de preguntarte. Menos interrupciones, pero no es garantía.", "dontAsk: para scripts automáticos. Lo que necesitaría permiso, lo rechaza.", "bypassPermissions: hace todo sin preguntar. Solo para entornos aislados, nunca en tu computadora de trabajo."], "p": ["En la terminal, Shift+Tab pasa de un modo al otro: Manual, acceptEdits y plan, más auto si está disponible. dontAsk nunca aparece ahí: se elige con --permission-mode dontAsk. En la app de escritorio, el selector está en la fila de abajo del cuadro de mensaje (Manual, Accept edits, Plan y Auto cuando está disponible). En la web (claude.ai/code) el menú ofrece solo Accept edits, Plan y Auto."]}, {"h": "Qué aprobar y qué leer dos veces", "lista": ["Aprueba tranquilo: que lea archivos, que busque en el proyecto, que edite un archivo que tú le pediste cambiar.", "Lee antes de aprobar: comandos que instalan programas, que borran (rm, del), que mueven muchas cosas o que tocan archivos fuera de tu proyecto.", "Frena y pregunta: publicar o subir a producción, mandar mensajes o mails, forzar cambios en git, cualquier cosa con contraseñas o claves.", "Si no entiendes un comando, no lo apruebes: pídele que te lo explique en una línea."], "prompts": [{"t": "Que te explique antes de pedirte permiso", "c": "Desde ahora, cada vez que me pidas permiso para correr un comando, explícame antes en una línea qué hace, si se puede deshacer y qué archivos toca. Si borra algo, avísame en mayúsculas."}]}, {"h": "Reglas fijas con /permissions", "p": ["Con /permissions armas reglas de tres tipos: lo que puede hacer sin preguntar (allow), lo que siempre te tiene que consultar (ask) y lo que tiene prohibido (deny).", "Las reglas deny bloquean en todos los modos, incluso en bypassPermissions. Además, hay archivos protegidos (como la carpeta .git, la carpeta .claude, .mcp.json o la configuración de la terminal) que nunca se aprueban solos: en Manual y acceptEdits te pregunta, en auto los revisa el clasificador y en dontAsk se rechazan. Solo bypassPermissions los escribe directo. Una regla allow tampoco los libera."]}, {"h": "El modo automático, bien usado", "p": ["En auto, Claude trabaja de corrido y un clasificador frena por defecto cosas como forzar cambios en git, borrar cambios sin guardar o publicar en producción. Si lo frena 3 veces seguidas o 20 en total en la sesión, el modo auto se pausa y vuelve a preguntarte. Cuando apruebas lo que te pide, sigue en auto. Lo que frenó queda en /permissions, en Recently denied.", "La guía oficial lo dice claro: reduce los avisos, pero no garantiza seguridad. Úsalo para tareas donde confías en el rumbo general, no como reemplazo de revisar lo sensible. Y lo que le pides en el chat (\"no hagas push\") se puede perder cuando la conversación se compacta: para una prohibición que tiene que cumplirse sí o sí, usa una regla deny en /permissions."], "pasos": ["Haz un commit antes de empezar.", "Pídele primero un plan y apruébalo.", "Recién ahí pasa a auto.", "Al terminar, revisa todo con /diff antes de publicar."]}, {"h": "Si algo salió mal", "pasos": ["Frénalo con Esc.", "Escribe /rewind (o Esc dos veces con el cuadro vacío) y elige el punto anterior al problema. Puedes restaurar código, conversación o los dos.", "Si algo no volvió, pídele a Claude que te ayude a volver al último commit con git, explicándote cada paso antes de hacerlo."], "aviso": "Nunca abras Claude Code con --dangerously-skip-permissions en tu computadora de trabajo. Ese modo es solo para contenedores o máquinas virtuales aisladas."}], "faq": [{"q": "Me cansa aprobar todo, ¿qué hago?", "a": "Usa acceptEdits para que edite sin preguntar y sigue aprobando los comandos. O suma reglas allow en /permissions para lo que siempre apruebas."}, {"q": "¿El modo auto está en mi plan?", "a": "Según la guía oficial está en todos los planes, pero depende del modelo que uses y, en Team y Enterprise, de que el administrador no lo haya apagado. Con modelos viejos como Sonnet 4.5, Opus 4.5 o Haiku 4.5 no anda: si no te aparece, prueba cambiar de modelo con /model."}, {"q": "¿/rewind deshace todo?", "a": "No. Deshace lo que Claude cambió con sus herramientas de edición. Un archivo que solo cambió un comando de terminal, o cambios que hiciste tú afuera, no se recuperan así. Por eso, git."}], "fuentes": ["https://code.claude.com/docs/en/permission-modes", "https://code.claude.com/docs/en/checkpointing", "https://code.claude.com/docs/en/commands", "https://code.claude.com/docs/en/desktop-quickstart", "https://code.claude.com/docs/en/permissions", "https://code.claude.com/docs/en/desktop", "https://code.claude.com/docs/en/claude-code-on-the-web"], "ejemplo": {"titulo": "Ejemplo resuelto: dejar a Claude rehaciendo una web de reservas sin miedo a romperla", "negocio": "Ejemplo inventado: un desarrollador freelance de Mendoza que mantiene la web de reservas de visitas de una bodega familiar de Luján de Cuyo. La web está hecha en Next.js, guarda las reservas en Supabase y se publica en Vercel. Trabaja solo, desde su notebook.", "punto_de_partida": "Tiene que pasar el formulario de reservas a un diseño nuevo y quiere que Claude lo haga de corrido, pero la última vez aprobó un comando sin leer y perdió una tarde de trabajo.", "pasos": ["Abrió Claude Code en la carpeta de la web y pegó el prompt \"Guardar todo antes de empezar\" de la guía. Claude vio que ya había git e hizo el commit \"punto seguro antes de rediseño del formulario\".", "Miró la barra de estado y vio auto mode on: su versión ya arrancaba en auto. Para el resto de sus proyectos sumó \"defaultMode\": \"default\" en ~/.claude/settings.json, así cada sesión nueva arranca en Manual y él decide cuándo soltar.", "Copió el archivo settings-permisos-proyecto.json del kit como .claude/settings.json del proyecto. Dejó los ask de vercel y supabase db push que trae el kit, porque publicar y tocar la base los quiere confirmar siempre, y cambió los comandos npm por los de su proyecto. Abrió /permissions para ver que las reglas aparecían con su archivo de origen.", "Pasó a modo plan con Shift+Tab y pidió: \"Rediseña el formulario de reservas con el estilo de la home. No toques la conexión con Supabase ni las variables de entorno\". Leyó el plan, vio que iba a tocar tres componentes y un archivo de estilos, y lo aprobó.", "Con el plan aprobado pasó a auto. Claude trabajó de corrido. En un momento intentó leer el .env para revisar la conexión y la regla deny lo frenó; Claude siguió sin esa lectura.", "Al terminar abrió /diff, revisó los cambios archivo por archivo y corrió la web en su computadora para probar una reserva de punta a punta.", "Un detalle del diseño no le gustó. En vez de pedir que lo deshaga a mano, usó /rewind, eligió el punto anterior a ese pedido y Restore code. Después hizo el commit final y recién ahí publicó."], "resultado": "El formulario nuevo quedó publicado, sin tocar la base ni las claves. Las reglas del proyecto quedaron en .claude/settings.json, así la próxima sesión arranca con los mismos límites, y la checklist del kit quedó pegada al lado de la pantalla."}, "si_falla": [{"sintoma": "Aprietas Shift+Tab y nunca aparece auto.", "solucion": "Auto depende del modelo: con Sonnet 4.5, Opus 4.5, Haiku 4.5 o modelos más viejos no está. Cambia de modelo con /model. En Team o Enterprise, el administrador lo puede haber apagado con permissions.disableAutoMode en la configuración administrada: pregúntale."}, {"sintoma": "Pusiste \"defaultMode\": \"auto\" en .claude/settings.json del proyecto y igual no arranca en auto.", "solucion": "La doc lo aclara: auto y bypassPermissions se ignoran si están en .claude/settings.json o .claude/settings.local.json. Ponlo en ~/.claude/settings.json o abre con claude --permission-mode auto."}, {"sintoma": "En pleno modo auto, Claude vuelve a pedirte permiso para todo.", "solucion": "El clasificador frenó 3 acciones seguidas o 20 en la sesión y el modo se pausó. Abre /permissions, mira Recently denied para entender qué intentaba hacer y, si estaba bien, aprueba la acción: el modo auto se retoma. Si estaba mal, frénalo con Esc y reorienta el pedido."}, {"sintoma": "Usas /rewind y aparece No files were restored, o un archivo no vuelve a como estaba.", "solucion": "Pasa si el archivo solo lo cambió un comando de terminal, si lo cambió un subagente o si la sesión tiene más de unos 30 días y sus copias se borraron. Para eso está el commit del principio: git status te muestra qué cambió y git restore <archivo> lo vuelve al último commit."}, {"sintoma": "Intentas arrancar con --dangerously-skip-permissions y Claude Code se niega.", "solucion": "En Linux y macOS no arranca en bypassPermissions si lo corres como root o con sudo. No lo fuerces: ese modo es para un contenedor o una máquina virtual aislada. En tu computadora de trabajo, usa auto o acceptEdits con reglas deny."}], "kit": [{"archivo": "settings-permisos-proyecto.json", "que_es": "Reglas de permisos listas para copiar como .claude/settings.json de tu proyecto: arranca en Manual, deja correr pruebas y build sin preguntar, pide confirmación para push, instalar, publicar y deploy, y prohíbe leer o editar .env, la carpeta secrets y los comandos de git que borran trabajo. Cambia los comandos npm por los de tu proyecto; si el archivo ya existe, suma solo el bloque permissions.", "contenido": "{\n  \"permissions\": {\n    \"defaultMode\": \"default\",\n    \"allow\": [\n      \"Bash(npm run test *)\",\n      \"Bash(npm run lint *)\",\n      \"Bash(npm run build *)\"\n    ],\n    \"ask\": [\n      \"Bash(git push *)\",\n      \"Bash(npm install *)\",\n      \"Bash(npm publish *)\",\n      \"Bash(vercel *)\",\n      \"Bash(supabase db push *)\"\n    ],\n    \"deny\": [\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Edit(./.env)\",\n      \"Edit(./.env.*)\",\n      \"Read(./secrets/**)\",\n      \"Bash(git push --force *)\",\n      \"Bash(git push -f *)\",\n      \"Bash(git reset --hard *)\",\n      \"Bash(git clean *)\"\n    ]\n  }\n}"}, {"archivo": "checklist-antes-de-dejar-a-claude-solo.md", "que_es": "Checklist para revisar antes de pasar a auto o acceptEdits y al terminar la tarea: copia de seguridad, modo, reglas fijas, plan y revisión final.", "contenido": "# Antes de dejar a Claude Code trabajando solo\n\nImprímela o tenla abierta al lado. Si una casilla queda sin marcar, no pases a auto.\n\n## 1. Red de seguridad\n\n- [ ] La carpeta usa git (`git status` no da error).\n- [ ] Hice un commit con todo como está ahora. Mensaje: \"punto seguro antes de [TAREA]\".\n- [ ] Si hay base de datos o archivos que no están en git (fotos subidas, planillas), tengo una copia aparte.\n- [ ] Sé volver atrás: `/rewind` para lo que Claude editó con sus herramientas, git para todo lo demás.\n\n## 2. Qué modo voy a usar\n\n- [ ] Miré el modo actual en la barra de estado (`manual mode on`, `accept edits on`, `plan mode on`, `auto mode on`).\n- [ ] Sé que en versiones nuevas la terminal puede arrancar en auto. Si quiero Manual siempre, tengo `\"defaultMode\": \"default\"` en `~/.claude/settings.json`.\n- [ ] Si uso acceptEdits, sé que también aprueba solo `rm`, `mv`, `cp` y `sed` dentro de la carpeta del proyecto.\n- [ ] Nunca uso bypassPermissions ni `--dangerously-skip-permissions` fuera de un contenedor o una máquina virtual aislada.\n\n## 3. Reglas fijas\n\n- [ ] Tengo reglas deny para lo que no se toca nunca (claves, `.env`, carpeta de secretos, push forzado).\n- [ ] Tengo reglas ask para lo que siempre quiero confirmar (push, publicar, deploy, migraciones).\n- [ ] Las prohibiciones importantes están en `/permissions`, no solo dichas en el chat. Lo que digo en el chat se puede perder al compactar.\n\n## 4. El pedido\n\n- [ ] Primero le pedí un plan (modo plan) y lo leí entero.\n- [ ] El plan dice qué archivos va a tocar y cómo se prueba que funciona.\n- [ ] Le aclaré qué NO tiene que hacer (publicar, mandar mails, tocar producción).\n\n## 5. Al terminar\n\n- [ ] Revisé los cambios con `/diff` antes de publicar.\n- [ ] Corrí las pruebas o probé la app a mano.\n- [ ] Miré en `/permissions`, pestaña Recently denied, si el modo auto frenó algo y por qué.\n- [ ] Hice el commit final con un mensaje que explique qué cambió.\n\n## Si algo salió mal\n\n1. `Esc` para frenarlo.\n2. `/rewind` (o `Esc` dos veces con el cuadro vacío) y elige el punto anterior al problema.\n3. Lo que no volvió con `/rewind`: `git status` para ver qué cambió y `git restore <archivo>` para descartar los cambios de ese archivo. Lee el comando antes de aprobarlo.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

<script>var GUIA = {"slug": "5-cosas-para-montar-con-claude-el-finde", "post": "CINCO", "t": "5 cosas para montar con Claude este fin de semana", "d": "Panel de vida, segundo cerebro, agente de revisión, kit de marca y biblioteca de vida. Cada una con sus pasos y el prompt listo para copiar.", "tema": "Sácale más jugo a Claude", "min": 12, "fichaNombre": "5 herramientas para el fin de semana", "ficha": [["Qué es", "Cinco herramientas que te armas tú en un fin de semana, sin programar."], ["Necesitas", "Cuenta de Claude (mejor un plan pago) y tu cuenta de Google. La app de escritorio es opcional: las tareas programadas corren en la nube aunque la tengas cerrada."], ["Tiempo", "Entre 15 y 40 minutos cada una."], ["Por dónde empezar", "Por el panel de vida: es el que más vas a usar todos los días."]], "secciones": [{"h": "Antes de empezar: conecta tus herramientas", "p": ["Las cinco usan lo mismo, así que hazlo una sola vez: en Claude ve a Customize → Connectors y conecta Gmail, Google Calendar y Google Drive (si tienes Claude en español, vas a ver la traducción en el mismo lugar). En Team o Enterprise, primero el owner los tiene que habilitar para la organización.", "Si algo no sale a la primera, díselo a Claude con tus palabras (\"no me muestra los mails de hoy, arréglalo\"). Muchas veces lo ajusta en el momento. Si sigue sin ver tus datos, revisa que el conector esté prendido en ese chat: botón +, Connectors."]}, {"h": "1. Panel de vida", "p": ["Una sola página con tu día: reuniones, mails importantes y pendientes. Y cada mañana un resumen antes de arrancar."], "pasos": ["Revisa que Gmail y Calendar estén conectados.", "Abre un chat nuevo y pega el prompt de abajo.", "Pídele cambios hasta que te guste: \"saca esto\", \"pon primero los mails de clientes\".", "Para el resumen diario, arma una tarea programada (solo en planes pagos). En la experiencia nueva de Claude se la pides en la conversación; en Cowork, entra a Scheduled y toca New task. Cada corrida la ves en la página Scheduled. Si tu plan no tiene tareas programadas, guarda el prompt y pégalo cada mañana."], "prompts": [{"t": "Panel de vida", "c": "Ármame mi panel de vida en una sola página. Usa mi Google Calendar y mi Gmail.\nQuiero ver:\n1. Mis reuniones de hoy, con hora y con quién.\n2. Los mails importantes que no respondí (no promociones ni newsletters).\n3. Lo que tengo pendiente esta semana.\n4. Arriba de todo, un resumen de 3 líneas: qué es lo más importante hoy.\nQue sea simple, limpio y fácil de leer desde el celular.\nSi puedes crear tareas programadas, proponme una que arme este mismo resumen todos los días a las [HORA]."}]}, {"h": "2. Segundo cerebro", "p": ["Guardas todo tu papeleo (contratos, seguros, garantías, notas, PDF) y le preguntas cualquier cosa: \"¿cuándo vence mi seguro del auto?\"."], "pasos": ["En Claude, entra a Proyectos y crea uno llamado Segundo cerebro.", "Sube tus archivos al conocimiento del proyecto, con nombres claros (\"Seguro auto 2026.pdf\").", "En Instrucciones del proyecto pega el texto de abajo.", "Cuando quieras saber algo, abre un chat adentro del proyecto y pregunta."], "prompts": [{"t": "Instrucciones del proyecto", "c": "Eres mi segundo cerebro. Tienes todos mis papeles: contratos, seguros, garantías y notas.\nCuando te pregunte algo:\n1. Responde corto y directo.\n2. Dime de qué documento sacaste la respuesta.\n3. Si hay una fecha de vencimiento o un pago, ponla en negrita.\n4. Si no está en los documentos, dímelo. No inventes."}], "aviso": "Sube solo lo que te sientas cómodo guardando en la nube. Contraseñas, números de tarjeta y datos bancarios no van ahí."}, {"h": "3. Agente de revisión", "p": ["Cada noche te ayuda a repasar qué salió bien y qué no. Cada semana te arma un resumen con qué mejorar."], "pasos": ["Crea un proyecto llamado Revisión y pega las instrucciones de abajo.", "Cada noche escribe \"revisión\": te hace 3 preguntas y te devuelve el resumen del día. Haz todas las revisiones de la semana en un mismo chat del proyecto: los chats no se leen entre sí, y el resumen semanal solo puede juntar lo que está en ese chat.", "El domingo escribe \"resumen semanal\"."], "prompts": [{"t": "Instrucciones del proyecto", "c": "Eres mi agente de revisión.\nCuando escriba \"revisión\":\n1. Mira mi Google Calendar de hoy.\n2. Hazme 3 preguntas cortas: qué salió bien, qué no salió y qué aprendí.\n3. Con mis respuestas, arma un resumen del día en 5 líneas, con la fecha arriba, para que quede en este chat.\nCuando escriba \"resumen semanal\":\n1. Junta las revisiones de la semana que están en este chat.\n2. Dime los 3 patrones que se repiten.\n3. Dame 3 cosas concretas para mejorar la semana que viene.\nSé honesto: si me estoy repitiendo en un error, dímelo directo."}]}, {"h": "4. Kit de marca", "p": ["Le das tu tono y tus valores y te arma colores, tipografías y piezas base. Después le pides que lo convierta en una skill, guardas el archivo que te arma y lo prendes en Customize → Skills. Para usar skills tiene que estar activada la ejecución de código (Settings → Capabilities)."], "pasos": ["Pega el prompt de abajo con tus datos.", "Pídele cambios hasta que te guste.", "Pídele: \"Convierte este kit en una skill para que lo uses siempre que te pida algo de mi marca\"."], "prompts": [{"t": "Kit de marca", "c": "Ármame el kit de marca de [TU NOMBRE O NEGOCIO].\nA qué me dedico: [EN UNA LÍNEA].\nA quién le hablo: [TU CLIENTE IDEAL].\nMi tono: [EJ.: DIRECTO, CERCANO].\nMis valores: [3 PALABRAS].\nQuiero:\n1. Paleta de 5 colores con código hex y para qué se usa cada uno.\n2. Dos tipografías de Google Fonts: títulos y texto.\n3. Guía de tono: 5 reglas con frases que sí y frases que no.\n4. Tres piezas de muestra: un post de Instagram, la portada de una web y el encabezado de un newsletter.\nMuéstramelo todo en una página."}]}, {"h": "5. Biblioteca de vida", "p": ["Un registro de todo lo que lees, miras y escuchas, con las ideas clave. Después le preguntas \"¿qué aprendí sobre ventas este año?\"."], "pasos": ["Crea un proyecto llamado Biblioteca y pega las instrucciones de abajo.", "Cada vez que terminas algo, pégale el link, el texto o la transcripción (en YouTube: Más → Mostrar transcripción).", "Usa un chat por semana para ir cargando las fichas. El domingo pídele en ese chat que las junte en un documento, descárgalo y súbelo al conocimiento del proyecto: así los chats siguientes lo pueden consultar."], "prompts": [{"t": "Instrucciones del proyecto", "c": "Eres mi biblioteca de vida.\nCada vez que te pase un libro, artículo, video o podcast, arma una ficha con:\n- Fecha, tipo y título.\n- Autor o canal.\n- Las 3 ideas más importantes, en una línea cada una.\n- Una cosa concreta que puedo aplicar.\n- Etiquetas para encontrarlo después.\nCuando te pregunte algo, busca en todas las fichas y dime de cuál sale cada idea."}], "aviso": "Claude no mira el video: necesita la transcripción."}], "faq": [{"q": "¿Necesito un plan pago?", "a": "Las tareas programadas son solo de los planes pagos, y que un artifact (como la página del panel de vida) lea tus apps conectadas es de Pro en adelante. Los conectores de Gmail, Calendar y Drive en el chat, los Proyectos (hasta cinco) y las skills también están en el gratis, con menos uso."}], "idea": [], "fuentes": ["https://support.claude.com/en/articles/10166901", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/9519177", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them", "https://claude.com/resources/tutorials/how-to-create-a-skill-with-claude-through-conversation"], "ejemplo": {"titulo": "Ejemplo resuelto: un profesor particular arma tres de las cinco en un sábado", "negocio": "Ejemplo inventado: un profesor de inglés particular en Mendoza, Argentina, que da clases a alumnos de secundaria y a adultos, online y en su casa. Trabaja solo, coordina todo por Gmail y Google Calendar y tiene un plan Pro.", "punto_de_partida": "Arrancaba cada día abriendo el calendario y el mail para ver qué clases tenía y quién había pedido cambiar horario. Los recibos, el contrato del alquiler del aula y las garantías de la notebook estaban en carpetas sueltas.", "pasos": ["Entró a Customize → Connectors y conectó Gmail, Google Calendar y Google Drive con su cuenta. En un chat probó: qué clases tengo mañana. Como no le respondía, tocó el botón +, Connectors, y vio que Calendar estaba apagado en ese chat. Lo prendió y funcionó.", "Pegó el prompt del panel de vida en un chat nuevo. Le pidió que pusiera primero los mails de alumnos y padres. Con el plan Pro, el panel pudo leer sus apps conectadas.", "Para el resumen diario usó el archivo de tarea programada del kit: en Cowork, Scheduled, New task, Create with Claude, pegó el archivo y eligió de lunes a viernes, media hora antes de su primera clase. Cada mañana lo lee en la página Scheduled.", "Creó el Proyecto Segundo cerebro, pegó las instrucciones del kit y subió el contrato del aula, los recibos del monotributo y las garantías, con nombres que dicen qué son y de qué fecha. Antes tapó el número de cuenta bancaria del contrato.", "Le preguntó cuándo vence el contrato del aula. Claude le respondió con la fecha en negrita y el nombre del archivo.", "Creó el Proyecto Revisión con las instrucciones del kit, abrió el chat Semana 1 y esa noche escribió revisión. El domingo, en ese mismo chat, pidió el resumen semanal y guardó el traspaso para el chat de la semana siguiente.", "El kit de marca, la skill y la biblioteca los dejó para el fin de semana siguiente."], "resultado": "Quedaron funcionando el panel de vida, el resumen de cada mañana como tarea programada, el segundo cerebro con sus papeles y la revisión con un chat por semana. Usa tres de los cinco Proyectos que permitiría incluso el plan gratis."}, "si_falla": [{"sintoma": "Claude dice que no tiene acceso a tu Gmail o a tu calendario.", "solucion": "Revisa que el conector esté conectado en Customize → Connectors y prendido en ese chat (botón +, Connectors). Si usas una cuenta de Google Workspace y aparece Access blocked, el administrador de Google tiene que marcar a Claude como app de confianza en admin.google.com (Security, Access and data control, API controls, Manage third-party app access) y después esperar unos 15 minutos. En Team o Enterprise, además, el owner tiene que habilitar los conectores."}, {"sintoma": "El segundo cerebro no encuentra un dato que está en un PDF adjunto a un mail.", "solucion": "El conector de Gmail ve que hay un adjunto (nombre, tipo) pero no lee su contenido. Descarga el PDF y súbelo al conocimiento del Proyecto. Si pesa más de 30 MB, pártelo."}, {"sintoma": "No encuentras dónde crear la tarea programada o no aparece Scheduled.", "solucion": "Las tareas programadas son de los planes pagos. En Cowork están en Scheduled, en la barra de la izquierda; en la experiencia nueva de Claude se piden en una conversación. Si ya la creaste y no ves el resumen, búscalo en la página Scheduled: no llega por mail."}, {"sintoma": "El resumen semanal de la revisión dice que no tiene revisiones de la semana.", "solucion": "Hiciste cada revisión en un chat distinto, y los chats de un Proyecto no se leen entre sí. Usa un solo chat por semana. Para no perder lo de esta semana, copia los resúmenes de cada chat en el chat del domingo y pide el resumen ahí."}, {"sintoma": "La skill del kit de marca no se sube o Claude no la usa.", "solucion": "Revisa que la ejecución de código esté activada en Settings → Capabilities. Sube un ZIP que contenga la carpeta kit-de-marca con el SKILL.md adentro, desde Customize → Skills, +, + Create skill, Upload a skill. Si no la usa, nómbrala en el pedido: usa la skill kit-de-marca."}], "kit": [{"archivo": "tarea-programada-resumen-de-la-manana.md", "que_es": "La tarea programada del panel de vida lista para crear: checklist previa, dónde crearla, configuración sugerida y el prompt que solo lee y resume.", "contenido": "# Tarea programada: resumen de cada mañana\n\nPara el panel de vida. La tarea arma el resumen sola todos los días y lo deja para que lo leas. No manda mails ni responde nada.\n\n## Antes de crearla\n\n- [ ] Tienes un plan pago (Pro, Max, Ultra, Team o Enterprise): las tareas programadas no están en el plan gratis.\n- [ ] Gmail y Google Calendar están conectados en Customize → Connectors con tu cuenta.\n- [ ] Probaste el prompt de abajo a mano en un chat normal y el resumen sale como te gusta.\n\n## Cómo crearla\n\n- Si tienes la experiencia nueva de Claude: en cualquier conversación pide \"quiero que esto corra todos los días a las [HORA]\" y pega el prompt. Claude te propone nombre, horario e instrucciones y tú confirmas.\n- En Cowork: Scheduled en la barra de la izquierda, New task, y elige Create with Claude (le pegas este archivo) o Set up manually (completas tú nombre, prompt y frecuencia).\n\nConfiguración sugerida:\n- Nombre: Resumen de la mañana\n- Frecuencia: de lunes a viernes (weekdays), media hora antes de que arranques.\n- Dónde ver el resultado: en la página Scheduled, en la corrida de cada día.\n\nLa tarea corre en la nube: no hace falta que tengas la computadora prendida ni la app abierta.\n\n## Prompt de la tarea (copia desde aquí)\n\n```\nArma mi resumen de hoy. Usa mi Google Calendar y mi Gmail. No envíes, no respondas y no borres ningún mail: solo lee y resume.\n\n1. Arriba de todo, 3 líneas: qué es lo más importante hoy y por qué.\n2. Reuniones de hoy: hora, título y con quién. Si dos se pisan, márcalo.\n3. Mails importantes sin responder de las últimas 48 horas. Ignora promociones, newsletters y notificaciones automáticas. Para cada uno: de quién, de qué se trata en una línea y qué me pide.\n4. Pendientes de la semana que aparezcan en el calendario o en los mails (fechas de entrega, pagos, vencimientos), con la fecha en negrita.\n5. Al final, una sugerencia concreta: qué hacer primero.\n\nSi no puedes leer el calendario o los mails, dilo en la primera línea del resumen en vez de inventar.\nMáximo una pantalla de celular. Escribe en español, con voseo.\n```\n\n## Primera semana\n\n- Lee cada resumen y anota qué sobró y qué faltó.\n- El viernes, edita la tarea y ajusta el prompt con lo que anotaste (por ejemplo, agrega los remitentes que siempre son importantes).\n"}, {"archivo": "kit-de-marca/SKILL.md", "que_es": "Plantilla de skill para el kit de marca: complétala con la paleta, las tipografías y el tono que te armó Claude, comprime la carpeta en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: kit-de-marca\ndescription: 'Aplica la marca de [TU NEGOCIO] (paleta, fuentes, tono y reglas) a cualquier pieza. Úsala al pedir un post, mail, página, flyer o presentación de la marca, o al dudar qué color, fuente o tono usar.'\n---\n\n# Kit de marca de [TU NOMBRE O NEGOCIO]\n\nCompleta cada sección con lo que te armó Claude en el paso 4 y borra esta línea.\n\n## Quiénes somos\n\n- A qué nos dedicamos: [UNA LÍNEA]\n- A quién le hablamos: [CLIENTE IDEAL EN UNA LÍNEA]\n- Valores: [3 PALABRAS]\n\n## Paleta\n\n| Uso | Color | Hex |\n|---|---|---|\n| Principal (títulos, botones) | [NOMBRE] | [#XXXXXX] |\n| Secundario | [NOMBRE] | [#XXXXXX] |\n| Acento (solo para destacar una cosa) | [NOMBRE] | [#XXXXXX] |\n| Fondo | [NOMBRE] | [#XXXXXX] |\n| Texto | [NOMBRE] | [#XXXXXX] |\n\nReglas: el acento nunca de fondo de un bloque grande. Texto siempre sobre fondo con buen contraste.\n\n## Tipografías (Google Fonts)\n\n- Títulos: [FUENTE]\n- Texto: [FUENTE]\n\n## Tono\n\n- [REGLA 1, EJ.: FRASES CORTAS, UNA IDEA POR FRASE]\n- [REGLA 2]\n- [REGLA 3]\n- [REGLA 4]\n- [REGLA 5]\n\nSí decimos: \"[FRASE QUE SÍ]\", \"[OTRA]\"\nNo decimos: \"[FRASE QUE NO]\", \"[OTRA]\"\n\n## Cómo trabajas con este kit\n\n1. Antes de entregar una pieza, revisa que use solo los colores y fuentes de arriba.\n2. Si el pedido no dice el formato (post, historia, mail), pregunta en una línea.\n3. Si una pieza necesita un color o una fuente que no está en el kit, no lo inventes: proponlo y espera el OK.\n4. Al final de cada pieza, agrega una línea con los hex y las fuentes que usaste, para que se pueda replicar en Canva u otra herramienta.\n5. No inventes datos, precios ni testimonios: si hacen falta, deja [COMPLETAR].\n"}, {"archivo": "instrucciones-segundo-cerebro-revision-biblioteca.md", "que_es": "Instrucciones ajustadas para los Proyectos Segundo cerebro, Revisión y Biblioteca, pensadas para que funcionen aunque los chats del Proyecto no se lean entre sí.", "contenido": "# Instrucciones ajustadas: Segundo cerebro, Revisión y Biblioteca\n\nLos chats de un Proyecto no se leen entre sí. Por eso estas versiones trabajan con un chat por semana (Revisión y Biblioteca) o con archivos del conocimiento (Segundo cerebro). Cada bloque va en las instrucciones de su Proyecto.\n\n## Segundo cerebro\n\n```\nEres mi segundo cerebro. Tienes mis papeles en los archivos de este Proyecto: contratos, seguros, garantías y notas.\nCuando te pregunte algo:\n1. Responde corto y directo.\n2. Dime de qué archivo sacaste la respuesta y, si puedes, en qué parte.\n3. Si hay una fecha de vencimiento o un pago, ponla en negrita.\n4. Si no está en los archivos, dímelo. No inventes ni completes con lo que suele pasar.\n5. Si dos archivos dicen cosas distintas (por ejemplo, una póliza vieja y una nueva), muéstrame las dos y la fecha de cada una.\n```\n\nAntes de subir: tapa o saca números de tarjeta, cuentas bancarias y contraseñas. Cada archivo de Proyecto puede pesar hasta 30 MB.\n\n## Revisión (un chat por semana)\n\nCada lunes abre un chat nuevo en el Proyecto y llámalo \"Semana [FECHA]\". Usa ese chat toda la semana.\n\n```\nEres mi agente de revisión. Trabajamos en un chat por semana: todas las revisiones de la semana quedan en este chat.\nCuando escriba \"revisión\":\n1. Mira mi Google Calendar de hoy (si no puedes, pregúntame qué hice).\n2. Hazme 3 preguntas cortas, de a una: qué salió bien, qué no salió y qué aprendí.\n3. Con mis respuestas, arma un resumen del día en 5 líneas, con la fecha arriba.\nCuando escriba \"resumen semanal\":\n1. Junta las revisiones de la semana que están en este chat.\n2. Dime los 3 patrones que se repiten, citando los días.\n3. Dame 3 cosas concretas para mejorar la semana que viene.\n4. Arma un traspaso de media página para pegar en el chat de la semana siguiente.\nSé honesto: si me estoy repitiendo en un error, dímelo directo.\n```\n\nSi quieres guardar el historial: el domingo copia el resumen semanal a un documento \"Revisiones [AÑO]\" y súbelo (o reemplázalo) en el conocimiento del Proyecto.\n\n## Biblioteca (fichas por semana, archivo por mes)\n\n```\nEres mi biblioteca de vida.\nCada vez que te pase un libro, artículo, video o podcast (con el texto o la transcripción), arma una ficha con:\n- Fecha, tipo y título.\n- Autor o canal.\n- Las 3 ideas más importantes, en una línea cada una.\n- Una cosa concreta que puedo aplicar.\n- Etiquetas para encontrarlo después.\nSi te paso solo un link y no puedes leer el contenido, dímelo y pídeme el texto. No armes la ficha con lo que supones que dice.\nCuando escriba \"cerrar semana\", junta todas las fichas de este chat en un solo documento, ordenadas por fecha.\nCuando te pregunte algo, busca en las fichas de los archivos del Proyecto y en las de este chat, y dime de cuál sale cada idea.\n```\n\nCada domingo: escribe \"cerrar semana\", descarga el documento y súbelo al conocimiento del Proyecto con un nombre como \"Fichas 2026-11 semana 2\". Así los chats nuevos lo pueden consultar.\n"}], "verificada": "2026-11-08", "cat": "mas-jugo", "parte": "aprende"};</script>

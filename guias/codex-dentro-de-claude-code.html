<script>var GUIA = {"slug": "codex-dentro-de-claude-code", "fuentes": ["https://github.com/openai/codex-plugin-cc", "https://developers.openai.com/codex/pricing", "https://developers.openai.com/codex/cli/reference/#codex-login", "https://developers.openai.com/codex/config-basic"], "post": "GUÍA", "t": "Codex dentro de Claude Code", "d": "Claude piensa el plan, Codex ejecuta y revisa. Cada uno gasta su propio límite, así repartís la carga entre las dos suscripciones.", "tema": "Claude Code", "min": 8, "fichaNombre": "codex-plugin-cc", "ficha": [["Qué es", "El plugin oficial y gratis de OpenAI para usar Codex desde Claude Code."], ["Necesitás", "Claude Code, Node.js 18.18 o más nuevo y la CLI de Codex con sesión iniciada: con tu cuenta de ChatGPT o con una clave de API de OpenAI. El README del plugin dice que sirve cualquier plan de ChatGPT, incluso el gratis, pero la página de precios de Codex hoy lista la CLI desde Plus (para Free y Go menciona la app de escritorio, según disponibilidad). Revisá tu plan antes de contar con eso."], ["Dónde funciona", "En Claude Code, no en el chat normal de claude.ai."], ["Repo", "github.com/openai/codex-plugin-cc"]], "secciones": [{"h": "Instalalo en 5 minutos", "p": ["Escribí cada comando en el chat de Claude Code, uno por uno."], "pasos": ["/plugin marketplace add openai/codex-plugin-cc", "/plugin install codex@openai-codex", "/reload-plugins", "/codex:setup: te dice si Codex está instalado. Si falta, te ofrece instalarlo: aceptá.", "Si te pide iniciar sesión: !codex login y entrá con tu cuenta de ChatGPT.", "Volvé a correr /codex:setup hasta que diga que está listo."], "aviso": "Atajo: pegale a Claude Code el link github.com/openai/codex-plugin-cc y pedile \"instalá este plugin\"."}, {"h": "Claude arquitecto, Codex obrero", "pasos": ["Planificá con Claude: explicale qué querés y pedile el plan paso a paso.", "Delegá a Codex: /codex:rescue con la tarea, o decile a Claude \"pedile a Codex que haga el paso 1\".", "Revisá con Codex antes de publicar: /codex:review lee los cambios sin tocar nada.", "Claude decide qué se queda."]}, {"h": "Los comandos", "lista": ["/codex:rescue: le pasa una tarea a Codex (investigar un bug, probar un arreglo, construir algo).", "/codex:review: revisión de lo que cambiaste, solo lectura.", "/codex:adversarial-review: revisión que cuestiona las decisiones de diseño.", "/codex:status: las tareas de Codex en curso.", "/codex:result: el resultado de una tarea terminada.", "/codex:cancel: cancela una tarea en segundo plano.", "/codex:transfer: pasa la conversación a Codex."], "aviso": "Con --background en tareas largas seguís trabajando con Claude mientras Codex trabaja. Con --model elegís el modelo: uno más chico (el README da el ejemplo de gpt-5.4-mini) sirve para una pasada más rápida o más barata. spark es el atajo del plugin para gpt-5.3-codex-spark, pensado para ir rápido; que esté disponible depende de tu plan."}], "faq": [{"q": "/plugin no existe", "a": "Tu Claude Code está desactualizado: actualizalo y volvé a abrirlo."}, {"q": "No aparecen los comandos /codex", "a": "Corré /reload-plugins o cerrá y abrí Claude Code."}, {"q": "Se me acaba el límite de Codex", "a": "Para tareas simples, pasá un modelo más chico con --model o achicá la tarea. Mirá en el panel de uso de Codex cuándo se renueva tu límite. Y si prendiste la review gate, apagala con /codex:setup --disable-review-gate: el README avisa que puede consumir los límites rápido."}], "idea": [], "ejemplo": {"titulo": "Ejemplo resuelto: sistema de turnos para una peluquería, con Claude de arquitecto", "negocio": "Ejemplo inventado: un desarrollador junior de Bogotá que arma por su cuenta una web de reserva de turnos para una peluquería con tres sillas. Usa Claude Code con plan Pro y tiene ChatGPT Plus.", "punto_de_partida": "Con una sola herramienta se le terminaba el límite a mitad de la tarde y le quedaban tareas mecánicas (pruebas, validaciones) sin hacer.", "pasos": ["En Claude Code corrió /plugin marketplace add openai/codex-plugin-cc, /plugin install codex@openai-codex y /reload-plugins. Después /codex:setup: le ofreció instalar Codex con npm y aceptó.", "Como nunca había usado Codex, corrió !codex login, entró con su cuenta de ChatGPT y repitió /codex:setup hasta que dijo que estaba listo.", "Sumó al CLAUDE.md del proyecto el bloque del kit con las reglas de qué se delega y qué no, y guardó la skill plan-para-codex en .claude/skills/.", "Le explicó a Claude la función nueva: cancelar un turno hasta 2 horas antes. Le pidió el plan y Claude lo dejó en PLAN-cancelaciones.md.", "Le pidió \"usá plan-para-codex con PLAN-cancelaciones.md\". Claude armó la tabla: la regla de las 2 horas y el aviso al cliente las decidía él; la validación de fechas y las pruebas iban a Codex.", "Aprobó y Claude mandó /codex:rescue --background con la tarea de pruebas. Mientras tanto siguió con Claude en la pantalla de cancelación. Revisó con /codex:status y leyó el resultado con /codex:result.", "Antes del push corrió /codex:review. Claude clasificó los hallazgos: arregló uno sobre turnos en el cambio de día y descartó otro de estilo, explicando por qué."], "resultado": "La función salió con pruebas y con una revisión de un modelo distinto al que la escribió. Cada herramienta consumió su propio límite, y las decisiones sobre reglas del negocio quedaron siempre del lado de Claude y de él."}, "si_falla": [{"sintoma": "/codex:setup dice que Codex no está instalado y no ofrece instalarlo.", "solucion": "Solo lo ofrece si tenés npm. Instalá Node.js 18.18 o más nuevo (trae npm) y corré en la terminal npm install -g @openai/codex. Después volvé a Claude Code y corré /codex:setup."}, {"sintoma": "Instalaste el plugin pero no aparecen los comandos /codex.", "solucion": "Corré /reload-plugins. Si siguen sin aparecer, cerrá y abrí Claude Code. Para confirmar que cargó, abrí /agents: tiene que estar el subagente codex:codex-rescue."}, {"sintoma": "/codex:setup dice que Codex no tiene sesión iniciada.", "solucion": "Corré !codex login dentro de Claude Code (el ! lo ejecuta en tu terminal) y entrá con tu cuenta de ChatGPT o con una clave de API de OpenAI. Si ya usabas Codex en esa compu, el plugin toma esa misma sesión."}, {"sintoma": "/codex:transfer falla o dice que hay que actualizar Codex.", "solucion": "Usa el importador de sesiones de Codex, que no está en versiones viejas. Actualizá con npm install -g @openai/codex y reintentá. Si pasás --source a mano, el archivo tiene que estar dentro de ~/.claude/projects."}, {"sintoma": "Claude no termina nunca de responder y Codex se queda revisando cada respuesta.", "solucion": "Está prendida la review gate, que bloquea el cierre de cada respuesta hasta que la revisión de Codex quede conforme. Apagala con /codex:setup --disable-review-gate y usá /codex:review a mano cuando quieras una revisión."}], "kit": [{"archivo": "plan-para-codex/SKILL.md", "que_es": "Skill que parte un plan en tareas autocontenidas para /codex:rescue, decide qué no se delega y define cómo revisar cada resultado. Guardala en .claude/skills/plan-para-codex/.", "contenido": "---\nname: plan-para-codex\ndescription: 'Convierte un plan en tareas chicas y autocontenidas para delegar a Codex con /codex:rescue, y define cómo revisarlas. Usala al repartir trabajo entre Claude y Codex o con \"pasale esto a Codex\".'\n---\n\n# Plan para Codex\n\nClaude es el arquitecto: entiende el pedido, decide y revisa. Codex es el obrero: ejecuta tareas bien delimitadas. Esta skill arma el puente.\n\n## Paso 1: partir el plan\n\nLeé el plan (un archivo como PLAN.md o lo que se habló en la conversación). Partilo en tareas que cumplan todo esto:\n\n- Una tarea toca pocos archivos y se puede describir en 3 a 6 líneas.\n- Tiene una forma clara de comprobar que salió: una prueba, un comando, una salida esperada.\n- No depende de decisiones que todavía no se tomaron. Si depende, la decisión la tomás vos antes.\n- Dos tareas que tocan el mismo archivo van una después de la otra, nunca en paralelo.\n\n## Paso 2: escribir cada tarea para Codex\n\nCodex no vio esta conversación. Cada tarea tiene que entenderse sola. Usá este formato:\n\n```\n/codex:rescue [--background si es larga] Tarea [N] de [TOTAL]: [QUÉ HACER EN UNA FRASE].\nContexto: [2 o 3 líneas: qué es el proyecto y por qué hace falta esto].\nArchivos: [RUTAS QUE PUEDE TOCAR]. No toques: [RUTAS PROHIBIDAS].\nListo cuando: [PRUEBA O COMANDO QUE TIENE QUE PASAR].\nAl terminar, explicá qué cambiaste y la salida del comando de verificación.\n```\n\n## Paso 3: mostrar el reparto antes de delegar\n\nMostrá una tabla con: número, tarea, quién la hace (Codex o Claude), archivos, cómo se verifica. Lo que requiere criterio de producto, seguridad, pagos o datos personales lo hace Claude o lo decide la persona, no se delega.\n\nEsperá el OK de la persona antes de mandar la primera tarea.\n\n## Paso 4: después de cada tarea\n\n1. Leé el resultado con /codex:result.\n2. Corré vos el comando de verificación. No te quedes con lo que dice Codex.\n3. Si falló, decidí: reintentar con /codex:rescue --resume y una instrucción concreta, o hacerlo vos.\n\n## Paso 5: antes de publicar\n\nSugerí /codex:review para el diff completo (o /codex:review --base main si es una rama). Si el cambio toca una decisión de diseño importante, sugerí /codex:adversarial-review con el foco en esa decisión. Vos decidís qué hallazgos se arreglan y explicás por qué descartás los demás.\n"}, {"archivo": "CLAUDE-md-reglas-claude-y-codex.md", "que_es": "Bloque para el CLAUDE.md del proyecto con el reparto entre Claude y Codex: qué se delega, qué no y cómo se revisa.", "contenido": "# Reglas de trabajo con Codex en este proyecto\n\nGuardá este bloque en el CLAUDE.md de la raíz del proyecto (o sumalo al que ya tenés). Le dice a Claude cuándo delegar a Codex y cuándo no.\n\n## Reparto\n\n- Claude planifica, decide y revisa. Codex ejecuta tareas acotadas.\n- Antes de delegar, Claude muestra qué va a mandar a Codex y espera mi OK.\n- Para delegar, usá /codex:rescue con una tarea autocontenida: qué hacer, archivos que puede tocar, archivos prohibidos y comando que prueba que salió.\n- Tareas largas: con --background, y seguimiento con /codex:status y /codex:result.\n\n## Qué se delega\n\n- Investigar por qué falla una prueba o la compilación.\n- Cambios mecánicos y repetidos en varios archivos.\n- Escribir pruebas para código que ya existe.\n- Una segunda opinión: /codex:review antes de cada push y /codex:adversarial-review antes de cambios grandes.\n\n## Qué no se delega\n\n- Decisiones de producto o de diseño de la base de datos.\n- Todo lo que toque pagos, contraseñas, tokens o datos personales de clientes.\n- Borrar archivos, ramas o datos.\n- Push a main.\n\n## Revisión\n\n- Claude corre el comando de verificación después de cada tarea de Codex, no confía solo en el reporte.\n- Los hallazgos de /codex:review se clasifican en: arreglar ahora, arreglar después, descartar (con el motivo).\n- No prendas la review gate (/codex:setup --enable-review-gate) salvo que yo esté mirando la sesión: puede consumir los límites rápido.\n"}], "verificada": "2026-11-08", "cat": "claude-code", "parte": "construi"};</script>

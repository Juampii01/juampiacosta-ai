<script>var GUIA = {"slug": "sistema-base-modulo-7-entrega-y-capacitacion", "t": "Módulo 7 · Entrega y capacitación de 30 minutos", "d": "Cómo cerrar la instalación: un documento de entrega claro, una capacitación corta, un video para volver a mirar y qué hacer cuando algo falla.", "tema": "El sistema para vender IA", "min": 8, "secciones": [{"h": "Qué recibe el cliente al final", "lista": ["Documento de entrega: qué quedó instalado, cómo se usa cada pieza, qué no hace y a quién llamar.", "Capacitación de 30 minutos: en vivo, con las personas que lo van a usar.", "Video grabado: la misma capacitación, para quien no estuvo o para repasar.", "Lista de \"qué hacer si algo falla\": los problemas más comunes y cómo resolverlos sin esperarte."]}, {"h": "El documento de entrega", "p": ["Tiene que poder leerlo alguien que entra mañana al negocio y nunca usó Claude. Partes:"], "pasos": ["Qué quedó instalado: el proyecto, las tres skills, los conectores, la automatización y en qué plan y cuenta está todo.", "Cómo pedir cada cosa: un ejemplo de pedido real por skill (\"Armame un presupuesto para...\").", "Qué revisar siempre antes de mandar: precios, fechas, nombres, y todo lo que Claude marque como dudoso.", "Qué no hace: atender solo a clientes, mandar mails sin aprobación, saber cosas que no están en los documentos.", "Cómo actualizar el conocimiento: qué documento cambiar cuando cambian los precios o las políticas.", "Contacto y mantenimiento: qué cubre el mensual y cómo pedirte ayuda."], "prompts": [{"t": "Documento de entrega", "c": "Con este checklist de instalación terminado: [PEGÁ EL CHECKLIST DEL MÓDULO 6]\nescribí el documento de entrega para el equipo de [NEGOCIO].\nLectores: personas que no usan Claude todos los días.\nSecciones: Qué quedó instalado, Cómo pedir cada cosa (con un ejemplo real por skill), Qué revisar antes de mandar, Qué no hace, Cómo actualizar los documentos, Qué hacer si algo falla, Mantenimiento y contacto ([MIS DATOS Y QUÉ INCLUYE EL MENSUAL]).\nFrases cortas, en voseo, sin palabras técnicas. Que entre en dos páginas."}]}, {"h": "La capacitación de 30 minutos", "pasos": ["Minuto 0 a 5: para qué sirve y para qué no. Repetí lo que no hace: es lo que evita los malos usos.", "Minuto 5 a 20: cada persona hace un pedido real de su trabajo con su propia cuenta, mientras vos mirás. Un presupuesto, una respuesta, una búsqueda en el mail.", "Minuto 20 a 25: muestren juntos qué pasa cuando Claude no sabe algo y cómo se corrige un resultado malo.", "Minuto 25 a 30: dónde está el documento de entrega, dónde está el video y cómo te piden ayuda.", "Grabá la sesión solo si todos están de acuerdo. Si no, grabá después una versión corta vos solo, con la pantalla de la cuenta del cliente y sin datos sensibles a la vista."], "aviso": "Que practiquen ellos. Si vos manejás el mouse los 30 minutos, al otro día nadie se acuerda de cómo se hacía."}, {"h": "Qué hacer si algo falla", "lista": ["Responde con un dato viejo: actualizar el documento en el proyecto y borrar la versión anterior.", "No usa la skill: revisar que esté activada (el interruptor al lado de la skill en Customize > Skills), pedir la tarea con palabras parecidas a la descripción de la skill o nombrar la skill en el pedido. Si sigue sin usarla, la descripción es vaga: reescribila diciendo para qué sirve y cuándo usarla.", "Un conector no responde: desconectarlo y volver a conectarlo desde Customize > Connectors, con la cuenta correcta.", "La tarea programada no corrió: en la página Scheduled, revisar que no esté pausada (si lo está, reanudarla), mirar las corridas anteriores y correrla a mano una vez. Si la tarea usa archivos o apps de la computadora, solo corre en esa compu, así que la compu tiene que estar disponible.", "Inventó algo: no usar esa respuesta, avisarte con un ejemplo y sumar la información que faltaba o una regla en las instrucciones.", "Algo urgente con un cliente del negocio: lo resuelve una persona. Claude es una ayuda para el equipo, no la última palabra."]}], "faq": [{"q": "¿Y si alguien del equipo no quiere usarlo?", "a": "No lo fuerces en la capacitación. Mostrale una tarea que odie hacer y cómo le ayuda. Si igual no lo usa, contáselo al dueño en el primer reporte."}, {"q": "¿Dónde guardo el video y el documento?", "a": "En el Drive del negocio, no en el tuyo. Así quedan aunque dejes de trabajar con ellos."}, {"q": "¿Cuándo doy por terminada la entrega?", "a": "Cuando el cliente firmó o confirmó por escrito que recibió todo lo de la propuesta. Desde ahí arranca el mantenimiento mensual."}], "fuentes": ["https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"], "ejemplo": {"titulo": "Ejemplo resuelto: la entrega y la capacitación en un corralón", "negocio": "Ejemplo inventado: el corralón de materiales de Pergamino (provincia de Buenos Aires) de los módulos anteriores. Usan Claude el dueño y su hija, que atiende el mostrador. Tienen plan Team, un proyecto, tres skills, los conectores de Google y una tarea que cada mañana lista los pedidos de presupuesto sin responder.", "punto_de_partida": "La instalación del Módulo 6 terminó con el checklist completo y la planilla de casos de prueba. Falta dejarlo andando sin Martín: que sepan usarlo, que tengan dónde mirar y que la entrega quede confirmada por escrito.", "pasos": ["Pegó el checklist completo en el prompt \"Documento de entrega\" de la guía y comparó el resultado con la plantilla del kit. Sumó lo que faltaba: que el flete siempre va \"a confirmar\" y que la hija actualiza la planilla de precios.", "En la tabla de \"Cómo actualizar el conocimiento\" puso que, cuando cambian los precios, la hija sube la planilla nueva al proyecto y borra la anterior, y que los cambios en cómo se arma un presupuesto se los piden a Martín.", "El día anterior a la capacitación revisó con cada uno que vieran el proyecto y las skills prendidas. Preparó un pedido real para cada uno: para la hija, un presupuesto que había entrado esa semana; para el dueño, un resumen de los mails de proveedores.", "Preguntó si podía grabar. El dueño prefirió que no. Siguió el guion del kit sin grabar.", "Del minuto 5 al 20, la hija armó el presupuesto en su compu y lo corrigió ella misma pidiéndole a Claude que cambiara el saludo. El dueño pidió el resumen de mails y preguntó si podía responder desde ahí. Le mostraron que Claude arma el borrador y pide aprobación antes de enviar.", "Del minuto 20 al 25, la hija preguntó por un producto que no venden. Claude respondió que no estaba en los documentos y lo marcó como PENDIENTE. Ella dijo que eso era lo que más le preocupaba.", "Esa tarde grabó un video corto solo, con la cuenta del corralón y la bandeja de entrada cerrada, mostrando un pedido de cada tipo. Lo subió al Drive del corralón, al lado del documento de entrega y de la tarjeta \"Si algo falla\".", "Revisó el checklist de accesos del kit: no tenía sesiones abiertas ni carpetas compartidas, y las copias de las skills en su compu no tenían datos del corralón. Mandó el mensaje de confirmación con la lista de lo instalado.", "El dueño respondió \"recibido\" al día siguiente. Martín anotó esa fecha como inicio del mantenimiento y agendó el primer reporte a las dos semanas."], "resultado": "El corralón tiene en su Drive el documento de entrega, el video y la tarjeta para resolver problemas solos. Las dos personas hicieron al menos un pedido real en la capacitación, la entrega quedó confirmada por escrito y Martín no se quedó con ningún acceso ni dato del negocio."}, "si_falla": [{"sintoma": "Alguien del equipo dice que Claude \"no usa\" la skill y hace las cosas a su manera.", "solucion": "Revisá en Customize → Skills de esa persona que la skill esté prendida. Pedile que la nombre en el pedido (\"Usá la skill de presupuestos para...\"). Si igual no la usa, mejorá la description de la skill para que diga cuándo usarla y volvé a subirla."}, {"sintoma": "Después de cambiar los precios, Claude sigue usando los viejos.", "solucion": "Casi siempre quedaron los dos archivos en el proyecto. Borrá el viejo de la base de conocimiento y dejá uno solo, con la fecha en el nombre (por ejemplo, \"precios-2026-11\"). Si el pedido se hizo en un chat que ya estaba abierto, probá en uno nuevo dentro del proyecto."}, {"sintoma": "Una persona del equipo no ve el proyecto o no puede cambiar los documentos.", "solucion": "En Team, quien creó el proyecto tiene que compartirlo con Share project, al lado del nombre. Con Can view puede usarlo y chatear; para actualizar documentos necesita Can edit. Las skills compartidas le llegan de solo lectura: si hay que cambiarlas, lo hace quien las subió."}, {"sintoma": "La tarea de cada mañana dejó de aparecer.", "solucion": "Abrí Scheduled en Cowork y fijate si está pausada (reanudala) y qué pasó en la última corrida. Si la tarea usa archivos de la compu, solo corre en esa compu. Si depende de Gmail o Drive, probá el conector en un chat normal: si pide reconectar, hacelo desde Customize → Connectors."}, {"sintoma": "A las dos semanas nadie lo está usando.", "solucion": "Preguntá qué tarea de la semana les costó más y armala con ellos en una llamada de 10 minutos, desde su cuenta. Si una persona no lo quiere usar, no insistas: contáselo al dueño en el primer reporte, como dice la guía."}], "kit": [{"archivo": "documento-de-entrega-plantilla.md", "que_es": "La plantilla del documento de entrega con las siete partes, ejemplos de pedidos, la tabla de quién actualiza qué y los datos de contacto, para completar y guardar en el Drive del negocio.", "contenido": "# Documento de entrega: asistente de Claude para [NEGOCIO]\n\nFecha de entrega: [FECHA] | Instalado por: [TU NOMBRE] | Contacto: [TELÉFONO O MAIL]\n\nEste documento es para cualquier persona de [NEGOCIO], aunque nunca haya usado Claude. Guardalo en el Drive del negocio, al lado del video de la capacitación: [LINK AL VIDEO].\n\n## 1. Qué quedó instalado\n\n- Cuenta: plan [PLAN] de Claude, a nombre de [NEGOCIO], con el mail [MAIL]. Lo paga [NEGOCIO].\n- Personas con acceso: [NOMBRE: ROL], [NOMBRE: ROL].\n- Proyecto \"[NOMBRE DEL PROYECTO]\": ahí están los precios, las preguntas frecuentes y las reglas del negocio. Para usarlo, entrá en Projects y abrilo antes de pedir algo.\n- Skills: [MARCA], [PRESUPUESTOS], [RESPUESTAS]. Están en Customize → Skills y tienen que estar prendidas.\n- Conectores: Gmail, Google Calendar y Google Drive, conectados con la cuenta de Google de cada persona.\n- Automatización: [QUÉ HACE], [CUÁNDO CORRE]. Se ve en Scheduled, dentro de Cowork.\n\n## 2. Cómo pedir cada cosa\n\nPedilo dentro del proyecto. Cuanto más parecido a estos ejemplos, mejor.\n\n- Presupuesto: \"Armame un presupuesto para [EJEMPLO REAL: 30 bolsas de cemento y 2 m³ de arena, entrega en barrio X]\".\n- Respuesta a un cliente: \"Preparame una respuesta para este mensaje: [PEGAR MENSAJE]\".\n- Algo con la marca: \"Escribí un posteo para avisar que [NOVEDAD], como habla [NEGOCIO]\".\n- Mail: \"Buscá los mails de esta semana sobre [TEMA] y armame un resumen\".\n\nSi Claude no usa la skill que esperabas, nombrala en el pedido: \"Usá la skill de presupuestos para...\".\n\n## 3. Qué revisar siempre antes de mandar\n\n- Precios y cantidades: que coincidan con la planilla.\n- Fechas, nombres y direcciones.\n- Todo lo que diga PENDIENTE o REVISAR.\n- Que suene a [NEGOCIO]. Si no, corregilo vos.\n\n## 4. Qué no hace\n\n- No atiende solo a los clientes. Todo lo que sale lo manda una persona.\n- No manda mails ni mueve archivos sin que lo apruebes.\n- No sabe lo que no está en los documentos. Si un precio cambió y no se actualizó, va a usar el viejo.\n- [OTRAS COSAS QUE QUEDARON FUERA DEL ALCANCE].\n\n## 5. Cómo actualizar el conocimiento\n\n| Si cambia... | Actualizá... | Quién |\n|---|---|---|\n| Precios | [ARCHIVO DE PRECIOS] en el proyecto. Subí el nuevo y borrá el viejo. | [NOMBRE] |\n| Preguntas frecuentes o políticas | [ARCHIVO] en el proyecto | [NOMBRE] |\n| Cómo se arman los presupuestos | Avisame: se cambia la skill | [TU NOMBRE] |\n\n## 6. Qué hacer si algo falla\n\nMirá la tarjeta \"Si algo falla\" que está en este mismo Drive. Si no se resuelve, escribime con: qué pediste, qué respondió (captura) y qué esperabas.\n\n## 7. Mantenimiento y contacto\n\n- Mensual: [SÍ/NO]. Incluye: [QUÉ INCLUYE].\n- Cómo pedirme ayuda: [CANAL] en [HORARIO]. Respondo en [PLAZO ACORDADO].\n- Para sacarme cualquier acceso: [CÓMO, si quedó alguno].\n"}, {"archivo": "guion-capacitacion-30-minutos.md", "que_es": "El guion minuto a minuto de la capacitación, con la checklist del día anterior, qué decir en cada parte y la tarjeta \"Si algo falla\" para imprimir o dejar en el Drive.", "contenido": "# Guion de la capacitación de 30 minutos\n\nPara la sesión en vivo con las personas que van a usar Claude. Cada una con su compu y su propia cuenta. Vos mirás, no manejás.\n\n## Antes (el día anterior)\n\n- [ ] Cada persona puede entrar a su cuenta de Claude y ve el proyecto.\n- [ ] Las skills aparecen prendidas en Customize → Skills de cada una.\n- [ ] Gmail, Calendar y Drive conectados en la cuenta de cada una.\n- [ ] Preparaste un pedido real por persona, de su trabajo de esta semana.\n- [ ] Tenés una pregunta que no está en los documentos, para la parte de \"cuando no sabe\".\n- [ ] Preguntaste si todos están de acuerdo con grabar.\n\n## Minuto 0 a 5: para qué sirve y para qué no\n\nDecí, con tus palabras:\n\"Esto les arma borradores: presupuestos, respuestas, resúmenes de mail. No le responde a nadie solo, y no sabe nada que no esté en los documentos. Todo lo que sale, lo manda una persona.\"\n\nMostrá dónde está el proyecto y por qué hay que pedir las cosas desde adentro.\n\n## Minuto 5 a 20: cada uno hace su pedido\n\nUna persona por vez, en su compu:\n1. Abre el proyecto.\n2. Hace su pedido real (el que preparaste).\n3. Lee el resultado en voz alta y dice qué cambiaría.\n4. Le pide a Claude ese cambio (\"Cambiá el saludo\", \"El flete va a confirmar\").\n\nSi alguien se traba, decile qué tocar. No agarres el mouse.\n\n## Minuto 20 a 25: cuando no sabe y cuando se equivoca\n\n- Hacé la pregunta que no está en los documentos. Mostrá que responde que no sabe o que lo marca como PENDIENTE.\n- Mostrá un resultado con un error (por ejemplo, un precio que no coincide) y cómo se corrige: primero el pedido, después el documento si el dato está viejo.\n- Mostrá que antes de mandar un mail pide aprobación.\n\n## Minuto 25 a 30: dónde está todo\n\n- El documento de entrega y la tarjeta \"Si algo falla\", en el Drive del negocio.\n- El video de esta sesión (o el que grabás después).\n- Cómo te piden ayuda y qué cubre el mantenimiento.\n- Cerrá con: \"Esta semana, cada uno lo usa al menos una vez en algo real. El [DÍA] les pregunto cómo les fue\".\n\n## Si no se puede grabar la sesión\n\nGrabá después un video corto vos solo, con la cuenta del cliente, mostrando un pedido de cada tipo. Antes de grabar, cerrá mails, chats y cualquier pantalla con datos de clientes.\n\n---\n\n# Tarjeta \"Si algo falla\" (para imprimir o dejar en el Drive)\n\n**Responde con un precio o dato viejo.** Subí el documento actualizado al proyecto y borrá el viejo.\n\n**No usa la skill.** Revisá en Customize → Skills que esté prendida. Pedilo con palabras parecidas a las del documento de entrega o nombrá la skill: \"Usá la skill de presupuestos\".\n\n**Un conector no responde o pide reconectar.** Customize → Connectors, abrí el conector, Disconnect, y volvé a conectarlo con la cuenta correcta.\n\n**La tarea de cada mañana no aparece.** En Scheduled, fijate que no esté pausada y mirá la última corrida. Si hace falta, correla a mano desde ahí.\n\n**Inventó algo.** No uses esa respuesta. Mandale a [TU NOMBRE] el pedido y la respuesta.\n\n**Algo urgente con un cliente.** Lo resuelve una persona, no Claude.\n"}, {"archivo": "confirmacion-de-entrega-y-baja-de-accesos.md", "que_es": "Los mensajes para pedir la confirmación de la entrega por escrito y avisar si algo quedó pendiente, el checklist para no quedarte con accesos ni datos del cliente y el mensaje del primer reporte.", "contenido": "# Confirmación de entrega y baja de accesos\n\nDos mensajes para cerrar la entrega por escrito y un checklist de accesos. Mandalos por el canal que usaron para la propuesta.\n\n## 1. Mensaje para pedir la confirmación\n\n\"Hola [NOMBRE]:\nTe dejo el resumen de lo que quedó instalado, según la propuesta del [FECHA DE LA PROPUESTA]:\n- Proyecto \"[NOMBRE]\" con [DOCUMENTOS].\n- Skills: [LISTA].\n- Conectores: Gmail, Google Calendar y Google Drive.\n- Automatización: [QUÉ HACE Y CUÁNDO].\n- Capacitación hecha el [FECHA] con [PERSONAS]. Video y documento de entrega en [CARPETA DEL DRIVE DEL NEGOCIO].\n\nQueda pendiente: [NADA / LISTA CON FECHA].\n\nSi está todo, ¿me lo confirmás respondiendo \"recibido\"? Desde esa fecha arranca el mantenimiento mensual [SI CORRESPONDE] y [SEGUNDA PARTE DEL PAGO, SI CORRESPONDE].\nGracias,\n[TU NOMBRE]\"\n\n## 2. Si algo no quedó como en la propuesta\n\n\"Hola [NOMBRE]:\nAntes de dar por cerrada la entrega, te aviso que [QUÉ NO QUEDÓ] porque [MOTIVO CONCRETO].\nTe propongo [SOLUCIÓN Y FECHA]. Cuando esté, te pido la confirmación.\n[TU NOMBRE]\"\n\n## 3. Checklist de accesos (antes de mandar el mensaje 1)\n\n- [ ] No tengo sesión abierta en la cuenta de Claude del cliente en ningún dispositivo.\n- [ ] Si me sumaron como miembro de la organización, el owner me sacó o tiene fecha escrita para hacerlo.\n- [ ] No tengo acceso a su Gmail, Calendar ni Drive. Si me compartieron carpetas, les pedí que me saquen.\n- [ ] No guardé en mi compu ni en mi cuenta documentos del cliente que no hagan falta. Si los usé para preparar algo, los borré.\n- [ ] El video y el documento de entrega están en el Drive del negocio, no en el mío.\n- [ ] Las skills que armé las tiene el cliente en su cuenta. Mis copias no tienen datos del negocio.\n\n## 4. Primer reporte (a las dos semanas)\n\n\"Hola [NOMBRE]: pasaron dos semanas desde la entrega. Te cuento lo que vi:\n- Lo que más usaron: [LO QUE TE DIJERON O VISTE].\n- Lo que no usaron: [LO QUE NO].\n- Ajustes que hice: [LISTA o 'ninguno'].\n- Para el próximo mes propongo: [UNA SOLA COSA].\n¿Algo que te esté molestando?\"\n\nEscribí solo lo que sabés. Si no tenés cómo saber cuánto lo usaron, preguntalo en lugar de suponerlo.\n"}], "verificada": "2026-11-08", "cat": "sistema-base", "parte": "construi"};</script>

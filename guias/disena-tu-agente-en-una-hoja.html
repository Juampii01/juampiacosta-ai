<script>var GUIA = {"slug": "disena-tu-agente-en-una-hoja", "t": "Diseña tu agente en una hoja antes de construirlo", "d": "Una plantilla de seis partes para definir qué hace tu agente, con qué, con qué reglas, cuándo te llama y cómo sabes si funciona. Incluye un prompt que la completa contigo.", "tema": "Agentes", "min": 8, "fichaNombre": "Hoja del agente", "ficha": [["Qué es", "Una ficha de una página que describe tu agente antes de armarlo."], ["Tiempo", "20 a 30 minutos."], ["Para qué", "Que no construyas algo que después no sabes si funciona."], ["Sirve para", "Claude Code, Proyectos de Claude o el Agent SDK."]], "secciones": [{"h": "Por qué una hoja primero", "p": ["Muchos agentes fallan no por la tecnología, sino porque nadie definió qué era un buen resultado, cuándo tenía que frenar ni qué tenía prohibido hacer.", "Una hoja corta te obliga a decidir eso antes. Y después la misma hoja se convierte en las instrucciones del agente."]}, {"h": "Las seis partes", "lista": ["Objetivo: una frase con un resultado que se pueda revisar. Mal: \"ayudarme con ventas\". Bien: \"dejar cada mañana una lista de prospectos ordenados de más a menos listos para comprar\".", "Entradas: qué recibe y de dónde. Mensajes pegados, un archivo, un formulario exportado, una búsqueda web.", "Herramientas: qué puede usar. Leer archivos, escribir un documento, buscar en la web, una app conectada. Solo las necesarias.", "Reglas: lo que siempre hace y lo que nunca hace. \"Nunca inventa precios\", \"siempre deja la fuente\".", "Cuándo pide ayuda a un humano: las situaciones en las que frena y te pregunta. Dudas, enojos, dinero, datos que faltan.", "Cómo se mide: dos o tres números o chequeos simples. \"De 10 casos de prueba, 9 bien clasificados\", \"cero datos inventados\"."]}, {"h": "Ejemplo completo", "prompts": [{"t": "Hoja de un agente de seguimiento", "c": "AGENTE: Seguimiento de presupuestos\nOBJETIVO: Cada lunes, dejarme una lista de los presupuestos enviados hace más de 7 días sin respuesta, con un borrador de seguimiento para cada uno.\nENTRADAS: La planilla presupuestos.csv (cliente, fecha, monto, estado).\nHERRAMIENTAS: Leer la planilla. Escribir el archivo seguimientos.md. Nada más.\nREGLAS:\n- No cambia la planilla.\n- No manda mensajes: solo borradores.\n- No ofrece descuentos.\nPIDE AYUDA CUANDO:\n- Falta la fecha o el contacto.\n- El cliente ya se quejó antes.\nCÓMO SE MIDE:\n- Encuentra todos los presupuestos vencidos (lo chequeo a mano 2 semanas).\n- Yo uso el borrador sin cambios grandes en 7 de cada 10 casos."}]}, {"h": "Que Claude te ayude a completarla", "prompts": [{"t": "Entrevista para diseñar tu agente", "c": "Quiero diseñar un agente de IA para mi negocio: [TU NEGOCIO EN UNA LÍNEA].\nLa tarea que quiero delegar es: [TAREA].\n\nEntrevístame para completar esta hoja: Objetivo, Entradas, Herramientas, Reglas, Cuándo pide ayuda a un humano y Cómo se mide.\nHazme una pregunta por vez. Si mi respuesta es vaga, repregúntame con un ejemplo concreto.\nCuando tengas todo, muéstrame la hoja completa en el mismo formato y marca con [REVISAR] lo que te parezca riesgoso o poco claro."}]}, {"h": "De la hoja a las instrucciones", "pasos": ["Pega la hoja terminada en un chat nuevo.", "Pídele que la convierta en instrucciones de sistema en segunda persona (\"Eres...\", \"Nunca...\").", "Revisa que cada regla de la hoja esté en las instrucciones. Si falta una, agrégala tú.", "Usa esas instrucciones en un Proyecto de Claude (en Set project instructions), en un subagente de Claude Code (un archivo .md en .claude/agents/ con name y description arriba, entre líneas ---, y las instrucciones abajo) o en el Agent SDK (pide programar en Python o TypeScript y una clave de la API). Las reglas que no se pueden romper, como no tocar un archivo, ponlas también como permisos: en Claude Code las instrucciones guían, pero lo que se permite lo deciden los permisos.", "Guarda la hoja: cuando el agente falle, vuelve a ella para ver qué parte estaba mal definida."], "prompts": [{"t": "Convertir la hoja en instrucciones", "c": "Convierte esta hoja en instrucciones de sistema para un agente. Escríbelas en segunda persona, cortas y en orden: qué eres, qué recibes, qué haces paso a paso, qué nunca haces, cuándo frenas y me preguntas, y cómo entregas el resultado.\nNo agregues reglas que no estén en la hoja. Si algo de la hoja se contradice, avísame en vez de elegir tú.\n\n[PEGA TU HOJA]"}]}], "faq": [{"q": "¿Qué tan detallada tiene que ser?", "a": "Que entre en una página. Si necesitas más, probablemente son dos agentes distintos."}, {"q": "¿Y si no sé qué medir?", "a": "Arma 10 casos de ejemplo con la respuesta que tú darías. Medir es contar en cuántos el agente se acerca a tu respuesta."}, {"q": "¿Cada cuánto la actualizo?", "a": "Cada vez que el agente falle de una forma nueva. Agrega la regla que hubiera evitado ese error."}], "fuentes": ["https://code.claude.com/docs/en/agent-sdk/agent-loop", "https://code.claude.com/docs/en/sub-agents", "https://code.claude.com/docs/en/agent-sdk/overview.md", "https://code.claude.com/docs/en/agent-sdk/agent-loop.md", "https://code.claude.com/docs/en/permissions", "https://www.anthropic.com/research/building-effective-agents"], "ejemplo": {"titulo": "Ejemplo resuelto: la hoja y el subagente de un taller de aberturas", "negocio": "Ejemplo inventado: un taller de aberturas de aluminio en Neuquén capital, con cuatro personas. Hacen ventanas y puertas a medida para casas y locales. Los presupuestos los manda la dueña por WhatsApp y por mail, y los anota en una planilla.", "punto_de_partida": "Muchos presupuestos quedaban sin respuesta y nadie los seguía. La dueña quería \"un agente que haga el seguimiento\", pero cuando le preguntaron qué tenía que entregar no supo decirlo.", "pasos": ["Corrió el prompt \"Entrevista para diseñar tu agente\" en un chat de Claude. A la pregunta por el objetivo respondió \"que me ayude con los presupuestos\". Claude repreguntó con un ejemplo y quedó: \"cada lunes, una lista de presupuestos enviados hace más de 7 días sin respuesta, con un borrador para cada uno\".", "En Reglas sumó una propia del rubro: nunca prometer fecha de colocación, porque depende de la entrega del aluminio. Claude marcó con [REVISAR] la regla \"pide ayuda cuando el cliente es importante\": no había forma de saber quién era importante. La cambió por \"cuando el monto supera [MONTO QUE ELIGIÓ ELLA]\".", "Exportó la planilla como presupuestos.csv con las columnas cliente, contacto, fecha, monto, estado y notas, y la guardó en una carpeta nueva llamada seguimiento.", "Copió el subagente del kit en seguimiento/.claude/agents/seguimiento-presupuestos.md, reemplazó [TU NEGOCIO], y agregó en Lo que nunca haces la regla de la fecha de colocación y en Cuándo frenas la del monto.", "Guardó el archivo de permisos del kit como seguimiento/.claude/settings.json, para que Claude Code no pueda editar presupuestos.csv ni correr comandos, y sí pueda escribir seguimientos.md.", "Abrió Claude Code en la carpeta seguimiento y escribió @ para elegir el subagente seguimiento-presupuestos de la lista. Revisó seguimientos.md fila por fila contra la planilla.", "Durante dos semanas anotó en el registro de fallas de la hoja cada borrador que tuvo que cambiar mucho. Un error se repitió: el agente seguía presupuestos que el cliente ya había rechazado por teléfono. Agregó el estado \"rechazado\" a la planilla y una regla para saltear esas filas."], "resultado": "Quedó una hoja de una página que describe el agente, un subagente de Claude Code que la cumple y permisos que impiden tocar la planilla original. Cada lunes la dueña tiene los borradores listos y los manda ella; cuando algo sale mal, vuelve a la hoja y suma la regla que faltaba."}, "si_falla": [{"sintoma": "Creaste el archivo del subagente y Claude Code no lo encuentra.", "solucion": "Revisa que esté en .claude/agents/ dentro de la carpeta donde abriste Claude Code (o en ~/.claude/agents/ para todos tus proyectos) y que arriba tenga name y description entre líneas ---. Si la carpeta agents no existía cuando abriste la sesión, cierra y vuelve a abrir Claude Code: la sesión no detecta una carpeta agents nueva."}, {"sintoma": "Pusiste un campo en el frontmatter (por ejemplo, permission-mode o max_turns) y no hace nada.", "solucion": "Claude Code ignora sin avisar los campos que no reconoce. Los nombres de varias palabras van en camelCase y exactos: permissionMode, maxTurns, disallowedTools. Cópialos de la documentación de subagentes."}, {"sintoma": "La hoja dice \"no cambia la planilla\" y el agente igual intentó editarla.", "solucion": "Las instrucciones guían, pero no bloquean. Agrega una regla deny en .claude/settings.json, como Edit(/presupuestos.csv) del kit. Ojo: las reglas con ruta se escriben como Edit o Read; una regla Write(ruta) se acepta pero nunca coincide."}, {"sintoma": "Claude no usa tu subagente aunque se lo pides con otras palabras.", "solucion": "Claude delega según la description del subagente. Escríbela diciendo cuándo usarlo (\"Úsalo cuando pida revisar presupuestos pendientes\"). Para asegurarte de que corra, escribe @ y elígelo de la lista, o nómbralo: \"usa el subagente seguimiento-presupuestos\"."}, {"sintoma": "No sabes si el agente mejoró o empeoró después de cambiar una regla.", "solucion": "Vuelve a correr los mismos 10 casos de prueba antes y después de cada cambio, y cuenta en cuántos coincide con tu respuesta. Si cambias casos y reglas a la vez, no vas a saber qué produjo la diferencia."}], "kit": [{"archivo": "hoja-del-agente-plantilla.md", "que_es": "La hoja de seis partes en blanco, con una checklist de revisión antes de construir y un registro de fallas para completar cada vez que el agente se equivoque.", "contenido": "# Hoja del agente (plantilla en blanco)\n\nComplétala antes de construir nada. Si no entra en una página, probablemente son dos agentes.\n\n```\nAGENTE: [nombre corto]\n\nOBJETIVO: [una frase con un resultado que se pueda revisar: qué entrega, cada cuánto y para quién]\n\nENTRADAS:\n- [qué recibe y de dónde: archivo, carpeta, mensajes pegados, formulario exportado, búsqueda web]\n\nHERRAMIENTAS (solo las necesarias):\n- [leer ...]\n- [escribir ... (qué archivo, exactamente)]\n\nREGLAS:\n- Siempre: [...]\n- Nunca: [...]\n- Nunca: [...]\n\nPIDE AYUDA CUANDO:\n- [falta un dato]\n- [hay dinero, enojo o algo fuera de lo normal]\n- [...]\n\nCÓMO SE MIDE:\n- [chequeo 1: qué cuentas y contra qué]\n- [chequeo 2]\n\nCASOS DE PRUEBA: [dónde están guardados los 5 a 10 casos con tu respuesta]\n```\n\n## Revisión antes de construir\n\n- [ ] El objetivo dice qué entrega y cuándo terminó. Si dice \"ayudar\", \"mejorar\" o \"gestionar\", reescríbelo.\n- [ ] Cada entrada dice de dónde sale y en qué formato.\n- [ ] Cada herramienta tiene un motivo. Si una no la usa ninguna regla ni ningún paso, sácala.\n- [ ] Las reglas que no se pueden romper (no tocar un archivo, no mandar mensajes) también van como permisos, no solo como instrucciones.\n- [ ] Hay al menos un caso en el que frena y te pregunta.\n- [ ] La medición se puede hacer en 10 minutos con tus casos de prueba.\n- [ ] Nadie recibe nada del agente sin que una persona lo revise, al menos las primeras semanas.\n\n## Registro de fallas (complétalo cada vez que falle)\n\n| Fecha | Qué hizo | Qué esperaba | Parte de la hoja mal definida | Regla o permiso nuevo |\n| :- | :- | :- | :- | :- |\n| | | | | |\n"}, {"archivo": "subagente-seguimiento-presupuestos.md", "que_es": "El ejemplo de la guía convertido en subagente de Claude Code. Guárdalo como .claude/agents/seguimiento-presupuestos.md en la carpeta donde está presupuestos.csv y reemplaza [TU NEGOCIO].", "contenido": "---\nname: seguimiento-presupuestos\ndescription: Revisa presupuestos.csv y deja en seguimientos.md los presupuestos enviados hace más de 7 días sin respuesta, con un borrador de seguimiento para cada uno. Úsalo cuando pida revisar presupuestos pendientes.\ntools: Read, Glob, Write\n---\n\nEres el agente de seguimiento de presupuestos de [TU NEGOCIO]. Tu trabajo es preparar borradores. Nunca mandas nada.\n\n## Qué recibes\n\n- El archivo presupuestos.csv en la carpeta del proyecto, con las columnas cliente, contacto, fecha, monto, estado y notas.\n- La fecha de hoy. Si no la sabes con certeza, pregúntala antes de empezar.\n\n## Qué haces, paso a paso\n\n1. Lee presupuestos.csv completo.\n2. Elige las filas con estado \"enviado\" y fecha de hace más de 7 días.\n3. Para cada una, escribe un borrador de seguimiento de hasta 4 líneas: retoma qué se presupuestó, suma algo útil (una aclaración, un dato del trabajo o una pregunta para avanzar) y cierra con una sola pregunta.\n4. Escribe todo en seguimientos.md con este formato por cliente: nombre, fecha del presupuesto, monto tal cual figura, borrador.\n5. Al final de seguimientos.md, agrega una sección PARA REVISAR con las filas que no pudiste procesar y por qué.\n\n## Lo que nunca haces\n\n- No modificas presupuestos.csv.\n- No mandas mensajes ni mails: solo escribes borradores en seguimientos.md.\n- No ofreces descuentos ni cambias montos, plazos o condiciones.\n- No inventas datos que no estén en el archivo.\n\n## Cuándo frenas y preguntas\n\n- Si falta la fecha o el contacto de una fila: va a PARA REVISAR, sin borrador.\n- Si en notas dice que el cliente se quejó antes: va a PARA REVISAR con un borrador marcado [REVISAR].\n- Si el archivo no tiene las columnas esperadas: frena y avisa qué columnas encontraste.\n\n## Cómo entregas\n\nResponde con un resumen de tres líneas: cuántos presupuestos revisaste, cuántos borradores dejaste y cuántos quedaron en PARA REVISAR. El detalle va en seguimientos.md.\n"}, {"archivo": "settings-permisos-seguimiento-presupuestos.json", "que_es": "Permisos de Claude Code para ese subagente: puede escribir seguimientos.md, no puede editar presupuestos.csv ni correr comandos ni ir a la web. Guárdalo como .claude/settings.json en la misma carpeta.", "contenido": "{\n  \"permissions\": {\n    \"allow\": [\n      \"Edit(/seguimientos.md)\"\n    ],\n    \"deny\": [\n      \"Edit(/presupuestos.csv)\",\n      \"Bash\",\n      \"WebFetch\",\n      \"WebSearch\"\n    ]\n  }\n}\n"}], "verificada": "2026-11-08", "cat": "agentes", "parte": "úsalo"};</script>

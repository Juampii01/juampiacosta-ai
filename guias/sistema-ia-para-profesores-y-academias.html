<script>var GUIA = {"slug": "sistema-ia-para-profesores-y-academias", "t": "Sistema con Claude para profesores y academias", "d": "Planificación de clases, ejercicios por nivel, devoluciones en borrador y comunicación con alumnos y familias: el sistema para un profesor particular o una academia.", "tema": "Sistemas listos por rubro", "min": 9, "fichaNombre": "Profesores y academias", "ficha": [["Qué es", "Un asistente con el programa, los materiales y las reglas de la academia para planificar, practicar y comunicar."], ["Necesitas", "Una cuenta de Claude del negocio (las tareas programadas piden plan pago), sus documentos y las cuentas de Google que ya usan."], ["Tiempo", "Ejemplo: una tarde para la demo y una o dos semanas de ajustes con el dueño."], ["Qué no hace", "No corrige ni pone notas por su cuenta. Las devoluciones y las calificaciones las decide el docente."]], "secciones": [{"h": "Lo que les come el tiempo", "lista": ["Planificar clases y adaptar el mismo tema a distintos niveles.", "Armar ejercicios, prácticas y evaluaciones nuevas.", "Escribir devoluciones a cada alumno.", "Responder consultas de inscripción, precios y horarios.", "Comunicar a familias: avisos, avances y cambios.", "Ordenar materiales que están desparramados en carpetas."]}, {"h": "El sistema", "lista": ["Proyecto \"Academia\": programa por nivel, materiales propios, criterios de corrección, horarios, precios y reglas de comunicación con familias.", "Skill de planificación: arma la clase a partir del programa, con objetivo, actividades y tiempo.", "Skill de práctica por nivel: genera ejercicios con su solución en tres niveles de dificultad.", "Skill de devolución en borrador: con las notas del docente sobre un trabajo, redacta una devolución clara y amable para que el docente la revise.", "Conectores: Google Drive para materiales, Google Calendar para la grilla y Gmail para borradores a familias.", "Automatización: una tarea programada que el domingo arma el plan de la semana según la grilla y el avance del programa."], "aviso": "Las skills necesitan que esté prendida la opción Code execution and file creation (en el diseño nuevo de Settings se llama Create and edit files), en Settings → Capabilities. En los planes Team y Enterprise la controla el owner de la organización, desde Organization settings → Plugins & skills. Las tareas programadas están en los planes pagos. Revisa la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Clase planificada", "c": "Tema: [TEMA]. Nivel: [NIVEL]. Duración: [MINUTOS].\nUsa el programa y los materiales del Proyecto.\nArma la clase con: objetivo en una frase, actividad de arranque, explicación, práctica, cierre y tarea. Pon cuánto tiempo lleva cada parte.\nSi el tema no está en el programa del nivel, avísame antes de armarla."}, {"t": "Ejercicios en tres niveles", "c": "Tema: [TEMA].\nArma 4 ejercicios en cada nivel: base, intermedio y desafío.\nPara cada uno, la solución paso a paso en una sección aparte al final.\nRevisa tus soluciones antes de entregarlas y marca cualquier ejercicio donde no estés seguro del resultado."}, {"t": "Devolución en borrador", "c": "Notas del docente sobre el trabajo de un alumno (sin nombre): [PEGA LAS NOTAS].\nCriterios de corrección: los del Proyecto.\nEscribe una devolución de hasta 120 palabras: qué hizo bien, qué tiene que mejorar con un ejemplo concreto y un próximo paso.\nNo pongas nota ni agregues errores que el docente no marcó."}]}, {"h": "Cómo instalarlo", "pasos": ["Pide el programa por nivel, materiales propios y los criterios de corrección.", "Arma el Proyecto \"Academia\" y prueba la skill de planificación con una semana real.", "Revisa con el docente los ejercicios generados: las soluciones las chequea una persona antes de usarlas.", "Define cómo se identifican los alumnos en las pruebas: iniciales o un código, nunca datos completos.", "Conecta Drive, Calendar y Gmail con la cuenta de la academia y programa el plan del domingo.", "Deja una guía corta para los docentes: qué pedirle a Claude y qué no."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE], soy [TU NOMBRE]. Armo sistemas con Claude para profesores y academias.\nLo que más se repite es que la planificación, los ejercicios y las devoluciones se comen las noches del docente. Lo que hago es dejarte un asistente con tu programa y tus materiales que te arma la clase, la práctica por nivel y el borrador de cada devolución. Tú corriges y decides.\n¿Te muestro cómo armaría tu próxima clase?"}], "lista": ["Argumento central: \"Recuperas horas de preparación sin bajar la calidad, y todos los docentes trabajan con el mismo programa y el mismo orden.\"", "Buen gancho: armar en vivo ejercicios en tres niveles sobre un tema que el profesor esté dando esta semana."]}, {"h": "Cuidados del rubro", "lista": ["Menores: si hay alumnos menores de edad, nada de nombres completos, fotos, notas ni datos de contacto en el Proyecto. La comunicación con familias la manda siempre una persona.", "Errores: Claude puede equivocarse en ejercicios y soluciones. El docente los revisa antes de darlos.", "Publicidad: no prometer aprobados, puntajes ni ingresos a carreras."], "aviso": "Claude no reemplaza al docente. Con menores, el cuidado de los datos es todavía más estricto: sigue las leyes de cada país y las reglas de la institución, y que todo pase por revisión humana."}], "faq": [{"q": "¿Los alumnos pueden usar el sistema directamente?", "a": "Este sistema es para el docente. Claude pide que todas las personas que crean y usan una cuenta tengan al menos 18 años, así que los alumnos menores no pueden usarlo. Con alumnos adultos, darles acceso es otra decisión que tiene que tomar la institución con sus propias reglas."}, {"q": "¿Sirve para un profesor particular?", "a": "Sí. Con el Proyecto y la skill de ejercicios ya cambia la semana."}], "fuentes": ["https://support.claude.com/en/articles/9517075-what-are-projects", "https://support.claude.com/en/articles/12512180-use-skills-in-claude", "https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors", "https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", "https://support.claude.com/en/articles/13117299"], "ejemplo": {"titulo": "Ejemplo resuelto: el sistema instalado en una academia de apoyo escolar", "negocio": "Ejemplo inventado: una academia de apoyo escolar en matemática y física en Santiago de Chile, con la directora, cuatro profesores y una secretaria. Trabajan con grupos de secundaria y preuniversitario, y la mayoría de los alumnos son menores.", "punto_de_partida": "Cada profesor planifica y arma ejercicios por su cuenta, de noche. Los grupos del mismo nivel avanzan a ritmos distintos y nadie lo ve hasta que hay un problema con una familia.", "pasos": ["En la demo, la directora eligió un tema que un profesor estaba dando esa semana. Con el prompt de ejercicios en tres niveles armó la práctica en vivo. El profesor encontró un enunciado ambiguo que Claude ya había marcado en PARA REVISAR, y eso le dio confianza.", "Pidió el programa por nivel con el orden de temas por semana, los apuntes propios y los criterios de corrección. Armaron con la secretaria una planilla de avance en Google Drive: grupo, nivel, último tema dado, fecha.", "Acordaron cómo se identifican los alumnos en todo el sistema: un código por alumno, sin nombres ni fotos. Quedó por escrito en las instrucciones del Proyecto y en la guía para docentes.", "En Settings → Capabilities prendió Code execution and file creation. Creó el Proyecto \"Academia\" con las instrucciones del kit y subió los archivos de la lista.", "Armó la carpeta ejercicios-en-tres-niveles con el SKILL.md del kit, la comprimió en ZIP y la subió en Customize → Skills. Después hizo las skills de planificación y de devolución en borrador.", "Durante una semana, dos profesores usaron las tres skills con sus grupos. Revisaron cada solución antes de usarla y anotaron los errores que encontraron para ajustar la skill.", "Conectó Google Drive, Google Calendar y Gmail con la cuenta de la academia. Como la cuenta era de Google Workspace, la directora tuvo que autorizar a Claude como app de confianza en la consola de Google.", "Creó la tarea de los domingos con el archivo del kit. El primer lunes, cada profesor comparó el plan con lo que iba a dar y la directora vio de un vistazo qué grupos estaban atrasados.", "Repartió la guía para docentes del kit y dejó claro que los alumnos no usan Claude: es una herramienta del equipo docente."], "resultado": "Quedó un Proyecto con el programa, los materiales y los criterios de la academia, tres skills para planificar, practicar y devolver en borrador, y una tarea que cada domingo deja el plan de la semana por grupo con avisos de atraso. Todo lo que llega a alumnos y familias lo revisa y lo manda un docente."}, "si_falla": [{"sintoma": "No aparece la sección Skills o las skills se ven en gris.", "solucion": "Prende Code execution and file creation (o Create and edit files, según cómo se vea tu Settings) en Settings → Capabilities. En una cuenta Team o Enterprise, si está en gris, la apagó el owner: pídele que la habilite en Organization settings → Plugins & skills, pestaña Policy."}, {"sintoma": "Una solución de un ejercicio está mal o el resultado no cierra.", "solucion": "Pasa, sobre todo en cálculos largos. Con la ejecución de código prendida, pídele a Claude que verifique cada resultado con código y que resuelva por un segundo camino. Lo que no coincida va a PARA REVISAR. Igual, la regla no cambia: el docente chequea todas las soluciones antes de darlas."}, {"sintoma": "La tarea del domingo arma un tema que el grupo ya dio, o uno que todavía no corresponde.", "solucion": "La tarea depende de la planilla de avance. Revisa que cada docente la haya actualizado el viernes y que los nombres de los temas sean iguales a los del programa. Si un grupo no tiene avance, la tarea lo lista en Falta avance en vez de inventar."}, {"sintoma": "Al conectar Gmail, Drive o Calendar aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "La cuenta es de Google Workspace y el administrador tiene que marcar a Claude como app de confianza en admin.google.com (Security → Access and data control → API controls → Manage third-party app access, buscar Claude y ponerla en Trusted). Después espera unos 15 minutos y vuelve a conectar. Si la cuenta de Claude es Team o Enterprise, además el owner tiene que habilitar los conectores de Google en Organization settings → Connectors."}, {"sintoma": "Al subir la skill aparece un error de formato o de archivo faltante.", "solucion": "Revisa tres cosas: que subas un ZIP que contenga la carpeta (no los archivos sueltos), que la carpeta se llame igual que el name del SKILL.md y que adentro esté el archivo SKILL.md. Evita tildes, espacios y signos raros en el name y en la description."}], "kit": [{"archivo": "ejercicios-en-tres-niveles/SKILL.md", "que_es": "Skill que arma práctica en tres niveles sobre un tema del programa, con soluciones aparte, doble verificación y una lista de lo que el docente tiene que revisar. Guárdala en una carpeta ejercicios-en-tres-niveles, comprímela en ZIP y súbela en Customize → Skills.", "contenido": "---\nname: ejercicios-en-tres-niveles\ndescription: 'Genera ejercicios de un tema en tres niveles (base, intermedio, desafío) con soluciones aparte y marcas de duda para el docente. Úsala al pedir ejercicios, práctica o material de repaso.'\n---\n\n# Ejercicios en tres niveles\n\nArmas práctica para que el docente la revise y la use en clase. Lo que entregas es un borrador: el docente chequea cada ejercicio y cada solución antes de dárselo a los alumnos.\n\n## Qué te pasan\n\n- Tema y, si lo dicen, el nivel o curso.\n- A veces: cantidad de ejercicios, tipo (cálculo, opción múltiple, desarrollo, problemas con enunciado), tiempo disponible.\n\nSi el Proyecto tiene el programa por nivel, confirma que el tema esté en el programa del nivel que te piden. Si no está, avisa antes de armar nada: \"Este tema no figura en el programa de [NIVEL]. ¿Lo armo igual?\"\n\nSi no te dicen cantidad, arma 4 por nivel.\n\n## Cómo se diferencian los niveles\n\n- **Base**: un solo paso o un solo concepto, con datos simples. Que un alumno que entendió la explicación lo resuelva solo.\n- **Intermedio**: dos o tres pasos, o combina el tema con algo visto antes en el programa.\n- **Desafío**: un problema con enunciado o una situación nueva donde hay que decidir qué herramienta usar. No uses contenidos que no estén en el programa del nivel.\n\n## Qué entregas, en este orden\n\n1. **Encabezado**: tema, nivel y tiempo estimado por bloque.\n2. **Ejercicios** numerados por nivel (B1, B2... I1, I2... D1, D2...). Sin soluciones en esta parte, para que se pueda imprimir tal cual.\n3. **Soluciones**, en una sección aparte al final: paso a paso, con el resultado final destacado.\n4. **PARA REVISAR**: lista de los ejercicios donde no estás seguro del resultado, donde el enunciado puede tener más de una interpretación o donde hay redondeos.\n\n## Cómo verificas\n\n- Resuelve cada ejercicio dos veces por caminos distintos cuando se pueda (por ejemplo, reemplazando el resultado en el enunciado).\n- Si tienes ejecución de código disponible, úsala para comprobar cálculos numéricos.\n- Si los dos caminos no coinciden, no elijas uno: ponlo en PARA REVISAR.\n\n## Reglas\n\n- Usa la notación, los nombres y los ejemplos que usa el docente en los materiales del Proyecto.\n- No uses nombres de alumnos reales en los enunciados. Usa nombres genéricos.\n- No copies ejercicios de libros o sitios. Ármalos nuevos.\n- No asignes puntajes ni notas.\n\n## Al final\n\nCierra con: \"Borrador para el docente: revisa enunciados y soluciones antes de usarlos.\"\n"}, {"archivo": "proyecto-academia-instrucciones-y-guia-docentes.md", "que_es": "Las instrucciones para el Proyecto \"Academia\" con las reglas de datos de alumnos, la lista de archivos para subir y una guía de una página para repartir a los docentes.", "contenido": "# Proyecto \"Academia\": instrucciones y guía para docentes\n\nEste archivo tiene tres partes: las instrucciones del Proyecto, la lista de archivos para subir y una guía de una página para los docentes.\n\n## 1. Instrucciones del Proyecto (copia desde aquí)\n\nEres el asistente de [NOMBRE DE LA ACADEMIA O DEL PROFESOR], que enseña [MATERIA O MATERIAS] en [NIVELES] en [CIUDAD].\n\nPara qué estás:\n- Planificar clases a partir del programa de cada nivel.\n- Armar ejercicios y prácticas por nivel, con soluciones aparte.\n- Redactar devoluciones en borrador a partir de las notas del docente.\n- Preparar respuestas a consultas de inscripción y avisos para familias.\n\nReglas que no se rompen:\n1. Usa el programa, los materiales y los criterios de corrección de este Proyecto. Si un tema no está en el programa del nivel, avisa antes de seguir.\n2. Todo es borrador. Lo revisa el docente antes de usarlo o mandarlo.\n3. No pongas notas, puntajes ni calificaciones. No agregues errores que el docente no marcó.\n4. Alumnos: se identifican con iniciales o un código. Si te pasan nombre completo, foto, documento, teléfono o datos de salud de un alumno, no los uses y pide que se reemplacen por un código.\n5. Precios, horarios y fechas de inscripción salen solo de los archivos de este Proyecto. Si algo no está, di \"lo confirmo\".\n6. No prometas aprobados, puntajes ni ingresos.\n7. Tono con alumnos: [EJEMPLO: claro, amable, con voseo]. Tono con familias: [EJEMPLO: cordial, con usted o contigo según la academia]. Firma como [NOMBRE].\n\n## 2. Archivos para subir\n\n- Programa por nivel, con el orden de los temas y en qué semana va cada uno.\n- Materiales propios: apuntes, guías, ejemplos que usa el docente.\n- Criterios de corrección por tipo de trabajo.\n- Grilla de clases: niveles, días, horarios, docente.\n- Precios, formas de pago y fechas de inscripción, con fecha de actualización.\n- Reglas de comunicación con familias: qué se avisa, por qué canal, quién lo manda.\n- Avance del programa: una planilla simple por grupo (grupo, último tema dado, fecha). Si la tarea del domingo la usa, tiene que estar en Google Drive.\n\n## 3. Guía para docentes (para imprimir o mandar al equipo)\n\n### Qué le pides a Claude\n- \"Ármame la clase de [TEMA] para [NIVEL], 60 minutos.\"\n- \"Ejercicios de [TEMA] en tres niveles.\"\n- \"Con estas notas de un trabajo (alumno [CÓDIGO]), ármame la devolución.\"\n- \"Responde esta consulta de inscripción: [PEGA].\"\n\n### Qué no le pides\n- Que corrija y ponga nota por su cuenta.\n- Que escriba directamente a un alumno o a una familia sin que tú lo leas.\n- Nada con nombres completos, fotos o datos de contacto de alumnos.\n\n### Antes de usar lo que arma\n- Revisa cada solución de los ejercicios. Claude puede equivocarse.\n- Lee la devolución completa y cambia lo que no dirías tú.\n- Si algo no coincide con el programa, avísale a [COORDINACIÓN].\n\n### Sobre el acceso\nClaude pide que todas las personas que usan una cuenta tengan al menos 18 años. Este sistema es para docentes y coordinación, no para alumnos.\n"}, {"archivo": "tarea-programada-plan-semanal-academia.md", "que_es": "La tarea de los domingos que arma el plan de la semana por grupo desde la grilla, el programa y la planilla de avance en Drive, sin mandar nada.", "contenido": "# Tarea programada: plan de la semana (domingos)\n\nLa tarea arma un borrador del plan de la semana para cada grupo, a partir de la grilla, el programa y el avance. No manda nada a alumnos ni familias.\n\n## Antes de crearla\n\n- [ ] Plan pago de Claude en la cuenta de la academia (las tareas programadas están solo en planes pagos).\n- [ ] Google Drive conectado con la cuenta de la academia. Si es una cuenta de Google Workspace (por ejemplo, de una institución), el administrador tiene que haber autorizado a Claude.\n- [ ] En Drive, en una carpeta \"[CARPETA DE LA ACADEMIA]\", están: el programa por nivel, la grilla de clases y la planilla de avance (grupo, nivel, último tema dado, fecha).\n- [ ] La skill de planificación está subida y prendida.\n- [ ] Probaste el prompt a mano en un chat y el plan coincide con lo que haría el docente.\n\n## Cómo crearla\n\nEn Cowork: Scheduled, New task. Con \"Create with Claude\", pégale este archivo y pídele \"todos los domingos a la tarde\". Con \"Set up manually\": nombre, prompt, aprobación y frecuencia semanal (en inglés figura como weekly).\n\n## Prompt de la tarea (copia desde aquí)\n\nEres el asistente de planificación de [NOMBRE DE LA ACADEMIA].\n\n1. En Google Drive, abre la carpeta \"[CARPETA DE LA ACADEMIA]\" y lee la grilla de clases, el programa por nivel y la planilla de avance.\n2. Para cada grupo de la grilla que tenga clases esta semana, busca el último tema dado y el que sigue según el programa.\n3. Arma un borrador de plan semanal por grupo: día y horario de cada clase, tema, objetivo en una frase y actividades principales, con los tiempos. Usa el formato de la skill de planificación.\n4. Si un grupo está atrasado o adelantado respecto de la semana que marca el programa, ponlo arriba del plan de ese grupo como AVISO, sin cambiar el programa.\n5. Si a un grupo le falta el dato de avance, no inventes el tema: anótalo en \"Falta avance\".\n\nReglas:\n- No modifiques la planilla de avance ni el programa.\n- No escribas a alumnos ni a familias.\n- No uses nombres de alumnos.\n\nAl final, déjame un índice: grupo, docente, temas de la semana y avisos, y la lista \"Falta avance\".\n\n## Después de cada semana\n\n- [ ] Cada docente actualiza la planilla de avance el viernes con el último tema que dio.\n- [ ] Coordinación anota qué planes se usaron tal cual y cuáles se cambiaron, y una vez por mes ajusta la skill.\n"}], "verificada": "2026-11-08", "cat": "rubros", "parte": "construi"};</script>

rilla y el avance del programa."], "aviso": "Las skills necesitan que esté prendida la ejecución de código (Settings → Capabilities). Las tareas programadas están en los planes pagos. Revisá la ayuda oficial antes de prometer algo que depende del plan del cliente."}, {"h": "Prompts y skills listos", "prompts": [{"t": "Clase planificada", "c": "Tema: [TEMA]. Nivel: [NIVEL]. Duración: [MINUTOS].\nUsá el programa y los materiales del Proyecto.\nArmá la clase con: objetivo en una frase, actividad de arranque, explicación, práctica, cierre y tarea. Poné cuánto tiempo lleva cada parte.\nSi el tema no está en el programa del nivel, avisame antes de armarla."}, {"t": "Ejercicios en tres niveles", "c": "Tema: [TEMA].\nArmá 4 ejercicios en cada nivel: base, intermedio y desafío.\nPara cada uno, la solución paso a paso en una sección aparte al final.\nRevisá tus soluciones antes de entregarlas y marcá cualquier ejercicio donde no estés seguro del resultado."}, {"t": "Devolución en borrador", "c": "Notas del docente sobre el trabajo de un alumno (sin nombre): [PEGÁ LAS NOTAS].\nCriterios de corrección: los del Proyecto.\nEscribí una devolución de hasta 120 palabras: qué hizo bien, qué tiene que mejorar con un ejemplo concreto y un próximo paso.\nNo pongas nota ni agregues errores que el docente no marcó."}]}, {"h": "Cómo instalarlo", "pasos": ["Pedí el programa por nivel, materiales propios y los criterios de corrección.", "Armá el Proyecto \"Academia\" y probá la skill de planificación con una semana real.", "Revisá con el docente los ejercicios generados: las soluciones las chequea una persona antes de usarlas.", "Definí cómo se identifican los alumnos en las pruebas: iniciales o un código, nunca datos completos.", "Conectá Drive, Calendar y Gmail con la cuenta de la academia y programá el plan del domingo.", "Dejá una guía corta para los docentes: qué pedirle a Claude y qué no."]}, {"h": "Cómo ofrecérselo", "prompts": [{"t": "Mensaje de primer contacto", "c": "Hola [NOMBRE],

<script>var GUIA = {"slug": "guiones-de-reels-con-tu-voz", "t": "Guiones de reels que suenan a vos", "d": "Armá una ficha de voz, guardala en Claude y pedí guiones con gancho, desarrollo y cierre. Después los leés en voz alta y ajustás lo que no te sale natural.", "tema": "Contenido y redes", "min": 9, "fichaNombre": "Guiones con tu voz", "ficha": [["Qué es", "Un método para que Claude escriba guiones de reels con tus palabras y tu ritmo, no con frases de manual."], ["Necesitás", "Una cuenta de Claude y 3 a 5 textos tuyos: transcripciones de reels, audios pasados a texto o posts."], ["Tiempo", "Media hora la primera vez. Después, minutos por guion."], ["Qué no hace", "No graba ni edita. Te deja el texto listo para decir a cámara."]], "secciones": [{"h": "Por qué los guiones de IA suenan a IA", "p": ["Si le pedís a Claude \"escribime un guion sobre X\" sin más datos, rellena con lo más común: frases genéricas, ritmo parejo y palabras que vos nunca usarías.", "La solución es darle material tuyo. Cuanto más real sea lo que le pasás (cómo arrancás, qué muletillas usás, cómo explicás), más se va a parecer a vos lo que te devuelve."]}, {"h": "1. Armá tu ficha de voz", "pasos": ["Juntá entre 3 y 5 textos tuyos. Lo mejor son transcripciones de reels o audios donde hablás suelto, porque un reel se dice, no se lee.", "Abrí un chat nuevo y pegá el prompt de abajo con tus textos.", "Leé la ficha que te devuelve y corregí lo que no es cierto (\"yo no digo eso\", \"esto sí lo uso mucho\").", "Guardala en un documento: la vas a usar en el paso siguiente."], "prompts": [{"t": "Ficha de voz", "c": "Te paso textos míos para que entiendas cómo hablo. Son transcripciones de cosas que dije a cámara.\n\n[PEGÁ TUS TEXTOS, SEPARADOS POR ---]\n\nCon eso armá mi ficha de voz con estas partes:\n1. Cómo arranco cuando explico algo.\n2. Largo típico de mis frases (cortas, largas, mezcla).\n3. Palabras y expresiones que repito.\n4. Palabras que NO uso nunca (sacalas de lo que no aparece y de lo que suena forzado para mi forma de hablar).\n5. Cómo cierro o qué le pido a la gente al final.\n6. Tres frases de ejemplo que suenen a mí, sobre un tema cualquiera.\nNo inventes rasgos que no estén en los textos. Si algo no se puede saber con lo que te pasé, decilo."}]}, {"h": "2. Guardala para no pegarla cada vez", "p": ["Tenés dos caminos y podés usar los dos."], "lista": ["Proyecto: creá un proyecto en Claude (Proyectos → + New Project), subí la ficha al conocimiento del proyecto y en las instrucciones poné que la use siempre. Todo chat que abras adentro la va a tener en cuenta.", "Estilo personalizado: en el chat abrí el menú de herramientas junto al cuadro de mensaje (según tu versión, Search and tools o el botón +), elegí Use style → Create & edit styles → Create custom style → Add Writing Example. Pegá tus textos o subí un archivo (PDF, DOC o TXT) y tocá Create style. Claude arma un estilo que podés elegir en cualquier chat."], "aviso": "No cuentes con que un chat se acuerde de lo que dijiste en otro. Si tenés la memoria prendida (Settings → Memory), cada proyecto tiene su propia memoria, pero es un resumen que arma Claude y no sabés qué guarda. Lo que querés que use siempre, como tu ficha de voz, tiene que estar en el conocimiento o en las instrucciones del proyecto."}, {"h": "3. La estructura: gancho, desarrollo y cierre", "lista": ["Gancho: la primera frase. Tiene que decir de qué va el video o abrir una duda concreta. Nada de \"hola, ¿cómo están?\".", "Desarrollo: dos o tres ideas, una por bloque. Si una idea necesita mucha explicación, es otro reel.", "Prueba: un ejemplo, un caso o algo que se ve en pantalla. Es lo que hace creíble lo que decís.", "Cierre con pedido: una sola acción. Comentar una palabra, guardar el video o seguirte. Si pedís tres cosas, no hacen ninguna."]}, {"h": "4. Pedí el guion", "prompts": [{"t": "Guion de reel", "c": "Usá mi ficha de voz y escribime el guion de un reel hablado.\nTema: [TEMA].\nA quién le hablo: [TU PÚBLICO].\nLo que quiero que la persona se lleve: [UNA IDEA].\nPedido final: [EJ.: QUE COMENTE LA PALABRA GUIA].\n\nFormato:\n- 3 opciones de gancho distintas (una con pregunta, una con dato o ejemplo concreto, una que contradiga algo que se cree).\n- Desarrollo en bloques cortos, cada uno con lo que digo y, entre corchetes, lo que se ve en pantalla.\n- Cierre con el pedido final en una sola frase.\nEscribilo para decirlo, no para leerlo: frases cortas, sin palabras que yo no usaría. No inventes datos ni cifras: si hace falta un número, dejá [DATO] para que lo complete yo."}]}, {"h": "5. Revisalo en voz alta", "pasos": ["Leé el guion en voz alta, de corrido, como si estuvieras grabando.", "Marcá cada lugar donde te trabás o donde decís \"esto no lo diría así\".", "Pegale a Claude solo esas partes y decile cómo lo dirías vos. Pedile que ajuste el resto para que combine.", "Si una corrección se repite (por ejemplo, siempre te cambia una palabra), sumala a tu ficha de voz."], "prompts": [{"t": "Ajuste después de leerlo", "c": "Leí el guion en voz alta. Estas partes no me salen naturales:\n[PEGÁ LAS FRASES]\nAsí lo diría yo: [CÓMO LO DIRÍAS].\nReescribí solo esas partes y ajustá lo que está alrededor para que suene igual. Después decime qué regla nueva conviene sumar a mi ficha de voz."}]}], "faq": [{"q": "¿Cuántos textos míos necesito?", "a": "Con 3 a 5 ya arranca bien. Lo importante es que sean textos hablados y variados, no cinco versiones del mismo tema."}, {"q": "¿Proyecto o estilo personalizado?", "a": "El proyecto sirve para guardar la ficha junto con tus ideas y guiones anteriores. El estilo cambia cómo escribe en cualquier chat. Podés usar los dos a la vez."}, {"q": "Me sigue saliendo genérico", "a": "Pasale más transcripciones reales y decile exactamente qué frase sonó a máquina. Las correcciones concretas le sirven más que \"hacelo más natural\"."}], "fuentes": ["https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/10185698-configuring-and-using-styles", "https://support.claude.com/en/articles/10181068-configuring-and-using-styles", "https://support.claude.com/en/articles/11817273-how-does-claude-s-memory-work"], "ejemplo": {"titulo": "Ejemplo resuelto: guiones con la voz de una asesora de seguros", "negocio": "Ejemplo inventado: una asesora de seguros independiente en Guadalajara, México. Trabaja sola, vende seguros de auto y de gastos médicos a familias y pequeños negocios, y graba reels con el celular en su oficina.", "punto_de_partida": "Probó pedir guiones sin contexto y le salían frases como \"protegé lo que más amás\", que nunca diría. Habla de tú, directo y con ejemplos de clientes, y sus reels improvisados funcionan mejor que los escritos.", "pasos": ["Juntó las transcripciones de cuatro reels donde hablaba suelto y un audio largo que le mandó a una clienta explicando un deducible, sacando el nombre de la clienta.", "Pegó todo en el prompt \"Ficha de voz\". En la ficha corrigió dos cosas: Claude había puesto que usa \"básicamente\" (lo dijo una sola vez) y faltaba que siempre cierra con \"¿me explico?\".", "Pasó la ficha a la plantilla del kit, creó el proyecto Reels en Proyectos → + New Project, la subió al conocimiento y pegó la instrucción de la plantilla en Set project instructions.", "Subió la skill guion-de-reel-con-mi-voz del kit y pidió un guion sobre qué cubre y qué no un seguro de auto básico, con el pedido final de comentar la palabra PÓLIZA.", "De los tres ganchos eligió el que contradecía una creencia: \"Tu seguro no paga todo lo que crees, y te enteras el día del choque\". La skill dejó [DATO] donde hacía falta un monto, y lo completó con un ejemplo de su propia cartera, sin nombres.", "Leyó el guion en voz alta y marcó dos frases donde se trababa. Las pegó con el prompt de ajuste, diciendo cómo las diría ella.", "Claude propuso una regla nueva: \"No digo 'cobertura integral', digo 'te cubre todo esto'\". La sumó a la sección 7 de la ficha y reemplazó el archivo en el proyecto."], "resultado": "Quedó un proyecto con su ficha de voz y una skill que arma cada guion con tres ganchos, bloques con lo que se ve en pantalla y un solo pedido. Los guiones nuevos ya traen sus muletillas y cada corrección queda guardada como regla en la ficha."}, "si_falla": [{"sintoma": "No encontrás la opción de estilos en el chat.", "solucion": "Abrí el menú de herramientas del cuadro de mensaje (Search and tools o el botón +, según tu versión) y buscá Use style. Si sigue sin aparecer, probá desde un chat nuevo en claude.ai en la compu: es más fácil de encontrar que en el celular."}, {"sintoma": "Dentro del proyecto, Claude escribe el guion sin usar la ficha de voz.", "solucion": "Revisá que la ficha esté en el conocimiento del proyecto y no solo pegada en un chat viejo. Poné en Set project instructions que la use siempre, y en el pedido nombrala: \"usá mi ficha de voz del conocimiento del proyecto\"."}, {"sintoma": "El guion sigue sonando genérico aunque tenga la ficha.", "solucion": "Casi siempre es porque los textos de base eran escritos (posts, mails) y no hablados. Sumá transcripciones de cosas que dijiste a cámara o en audios. Y corregí con ejemplos concretos: pegale la frase que sonó a máquina y cómo la dirías vos."}, {"sintoma": "El guion trae datos, porcentajes o casos que vos nunca le diste.", "solucion": "Borralos antes de grabar y repetile la regla: \"No inventes datos: si hace falta uno, dejá [DATO]\". Si usás la skill del kit, ya la tiene. Sumá la regla también a la ficha de voz."}, {"sintoma": "Usás estilo y proyecto a la vez y los guiones salen con un tono raro.", "solucion": "Pueden estar diciendo cosas distintas. Si el estilo lo armaste con textos escritos y la ficha con textos hablados, para guiones de reels apagá el estilo y dejá que mande la ficha del proyecto."}], "kit": [{"archivo": "guion-de-reel-con-mi-voz/SKILL.md", "que_es": "Skill que escribe el guion con tu ficha de voz: tres ganchos, bloques con lo que se ve en pantalla, un solo pedido y las frases a probar en voz alta, sin inventar datos. Guardala en una carpeta guion-de-reel-con-mi-voz, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: guion-de-reel-con-mi-voz\ndescription: 'Escribe guiones de reels con la voz del usuario según su ficha: tres ganchos, bloques con lo que se ve y un solo pedido final, sin inventar datos. Usala al pedir un guion o ajustar uno.'\n---\n\n# Guion de reel con mi voz\n\nEscribís guiones para decir a cámara, no para leer. Tienen que sonar a la persona, no a un manual.\n\n## Antes de escribir\n\n1. Buscá la ficha de voz: en el conocimiento del proyecto, en las instrucciones o en el chat. Si no está, pedila. Si la persona no tiene una, ofrecé armarla con 3 a 5 transcripciones suyas y no escribas el guion hasta tenerla.\n2. Confirmá que tenés: tema, a quién le habla, la idea que se tiene que llevar la persona y el pedido final. Si falta algo, preguntá todo junto en un solo mensaje.\n\n## Cómo escribís\n\n- Usá las expresiones que la ficha marca como propias. No uses ninguna de la lista de palabras que no usa.\n- Frases del largo que dice la ficha. Si no lo dice, cortas: una idea por frase.\n- Nada de \"hola, ¿cómo están?\", \"en este video te voy a contar\" ni \"sin más preámbulos\".\n- Nada de cifras, porcentajes, nombres de clientes ni resultados que no estén en lo que te pasaron. Si hace falta un dato, escribí [DATO].\n- Si la idea necesita más de tres bloques para explicarse, avisá que da para dos reels y proponé cómo partirla.\n\n## Qué entregás, en este orden\n\n1. **Tres ganchos distintos**: uno con pregunta, uno con un ejemplo concreto, uno que contradiga algo que se cree. Cada uno, una sola frase.\n2. **Desarrollo**: dos o tres bloques. Cada bloque con lo que se dice y, entre corchetes, lo que se ve en pantalla.\n3. **Prueba**: un ejemplo, un caso o algo que se muestra. Si la persona no te dio ninguno, dejá [EJEMPLO TUYO] y sugerí qué tipo de ejemplo serviría.\n4. **Cierre**: el pedido final en una sola frase.\n5. **Para revisar en voz alta**: hasta tres frases del guion que tienen más riesgo de no sonar naturales, para que la persona las pruebe primero.\n\n## Cuando la persona te corrige\n\nSi te dice \"esto no lo diría así\" y cómo lo diría:\n1. Reescribí solo esas partes y ajustá lo que está alrededor para que combine.\n2. Proponé una regla nueva para la ficha de voz en una línea, por ejemplo: \"No uso 'potenciar': digo 'mejorar'\".\n"}, {"archivo": "plantilla-ficha-de-voz.md", "que_es": "La plantilla de la ficha de voz con las seis partes del prompt, una sección para ir sumando reglas al corregir y la instrucción lista para pegar en el proyecto.", "contenido": "# Ficha de voz: plantilla\n\nCompletala con ayuda del prompt \"Ficha de voz\" de la guía, corregila a mano y subila al conocimiento de tu proyecto de contenido. Cada vez que corrijas un guion y la corrección se repita, sumala acá.\n\n## Datos de base\n\n- Nombre o cuenta: [@TU_CUENTA]\n- A qué me dedico, en una línea: [UNA LÍNEA]\n- A quién le hablo: [TU PÚBLICO]\n- Trato: [VOS / TÚ / USTED]\n- Textos de los que salió esta ficha: [CUÁNTOS Y DE QUÉ: REELS, AUDIOS, POSTS]\n\n## 1. Cómo arranco\n\n- Cuando explico algo, arranco con: [EJEMPLO REAL DE UNA FRASE TUYA]\n- Nunca arranco con: [EJEMPLO: \"HOLA A TODOS\"]\n\n## 2. Ritmo\n\n- Mis frases son: [CORTAS / LARGAS / MEZCLA]\n- Hago pausas o remates con: [EJEMPLO: \"¿Y sabés qué?\", \"Punto.\"]\n\n## 3. Palabras y expresiones que uso seguido\n\n- [EXPRESIÓN 1]\n- [EXPRESIÓN 2]\n- [EXPRESIÓN 3]\n\n## 4. Palabras que no uso nunca\n\n- [PALABRA QUE SUENA FORZADA PARA VOS]\n- [PALABRA DE MANUAL QUE NO DIRÍAS]\n\n## 5. Cómo cierro\n\n- Lo que suelo pedir al final: [EJEMPLO: \"COMENTÁ LA PALABRA GUIA\"]\n- Cómo lo digo: [LA FRASE TAL CUAL]\n\n## 6. Tres frases que suenan a mí\n\n1. [FRASE]\n2. [FRASE]\n3. [FRASE]\n\n## 7. Reglas que fui sumando al corregir\n\nUna línea por regla, con la fecha. Ejemplo: \"2026-11-08: no digo 'potenciar', digo 'mejorar'.\"\n\n- [AAAA-MM-DD]: [REGLA]\n\n## Instrucción para el proyecto\n\nPegá esto en las instrucciones del proyecto (Set project instructions):\n\n\"Para cualquier guion, post o texto que vaya a decir o publicar, usá siempre la ficha de voz que está en el conocimiento de este proyecto. Si algo de lo que escribís choca con la ficha, gana la ficha. No inventes datos: si hace falta uno, dejá [DATO].\"\n"}], "verificada": "2026-11-08", "cat": "contenido", "parte": "usalo"};</script>

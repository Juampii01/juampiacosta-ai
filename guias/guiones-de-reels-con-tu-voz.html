<script>var GUIA = {"slug": "guiones-de-reels-con-tu-voz", "t": "Guiones de reels que suenan a vos", "d": "Armá una ficha de voz, guardala en Claude y pedí guiones con gancho, desarrollo y cierre. Después los leés en voz alta y ajustás lo que no te sale natural.", "tema": "Contenido y redes", "min": 9, "fichaNombre": "Guiones con tu voz", "ficha": [["Qué es", "Un método para que Claude escriba guiones de reels con tus palabras y tu ritmo, no con frases de manual."], ["Necesitás", "Una cuenta de Claude y 3 a 5 textos tuyos: transcripciones de reels, audios pasados a texto o posts."], ["Tiempo", "Media hora la primera vez. Después, minutos por guion."], ["Qué no hace", "No graba ni edita. Te deja el texto listo para decir a cámara."]], "secciones": [{"h": "Por qué los guiones de IA suenan a IA", "p": ["Si le pedís a Claude \"escribime un guion sobre X\" sin más datos, rellena con lo más común: frases genéricas, ritmo parejo y palabras que vos nunca usarías.", "La solución es darle material tuyo. Cuanto más real sea lo que le pasás (cómo arrancás, qué muletillas usás, cómo explicás), más se va a parecer a vos lo que te devuelve."]}, {"h": "1. Armá tu ficha de voz", "pasos": ["Juntá entre 3 y 5 textos tuyos. Lo mejor son transcripciones de reels o audios donde hablás suelto, porque un reel se dice, no se lee.", "Abrí un chat nuevo y pegá el prompt de abajo con tus textos.", "Leé la ficha que te devuelve y corregí lo que no es cierto (\"yo no digo eso\", \"esto sí lo uso mucho\").", "Guardala en un documento: la vas a usar en el paso siguiente."], "prompts": [{"t": "Ficha de voz", "c": "Te paso textos míos para que entiendas cómo hablo. Son transcripciones de cosas que dije a cámara.\n\n[PEGÁ TUS TEXTOS, SEPARADOS POR ---]\n\nCon eso armá mi ficha de voz con estas partes:\n1. Cómo arranco cuando explico algo.\n2. Largo típico de mis frases (cortas, largas, mezcla).\n3. Palabras y expresiones que repito.\n4. Palabras que NO uso nunca (sacalas de lo que no aparece y de lo que suena forzado para mi forma de hablar).\n5. Cómo cierro o qué le pido a la gente al final.\n6. Tres frases de ejemplo que suenen a mí, sobre un tema cualquiera.\nNo inventes rasgos que no estén en los textos. Si algo no se puede saber con lo que te pasé, decilo."}]}, {"h": "2. Guardala para no pegarla cada vez", "p": ["Tenés dos caminos y podés usar los dos."], "lista": ["Proyecto: creá un proyecto en Claude (Proyectos → + New Project), subí la ficha al conocimiento del proyecto y en las instrucciones poné que la use siempre. Todo chat que abras adentro la va a tener en cuenta.", "Estilo personalizado: en el selector de estilos del chat elegí \"Create & Edit Styles\" → \"Create Custom Style\" → \"Add Writing Example\" y pegá tus textos. Claude arma un estilo que podés elegir en cualquier chat."], "aviso": "La memoria de un chat no pasa a otro chat del mismo proyecto. Lo que querés que recuerde siempre tiene que estar en el conocimiento o en las instrucciones."}, {"h": "3. La estructura: gancho, desarrollo y cierre", "lista": ["Gancho: la primera frase. Tiene que decir de qué va el video o abrir una duda concreta. Nada de \"hola, ¿cómo están?\".", "Desarrollo: dos o tres ideas, una por bloque. Si una idea necesita mucha explicación, es otro reel.", "Prueba: un ejemplo, un caso o algo que se ve en pantalla. Es lo que hace creíble lo que decís.", "Cierre con pedido: una sola acción. Comentar una palabra, guardar el video o seguirte. Si pedís tres cosas, no hacen ninguna."]}, {"h": "4. Pedí el guion", "prompts": [{"t": "Guion de reel", "c": "Usá mi ficha de voz y escribime el guion de un reel hablado.\nTema: [TEMA].\nA quién le hablo: [TU PÚBLICO].\nLo que quiero que la persona se lleve: [UNA IDEA].\nPedido final: [EJ.: QUE COMENTE LA PALABRA GUIA].\n\nFormato:\n- 3 opciones de gancho distintas (una con pregunta, una con dato o ejemplo concreto, una que contradiga algo que se cree).\n- Desarrollo en bloques cortos, cada uno con lo que digo y, entre corchetes, lo que se ve en pantalla.\n- Cierre con el pedido final en una sola frase.\nEscribilo para decirlo, no para leerlo: frases cortas, sin palabras que yo no usaría. No inventes datos ni cifras: si hace falta un número, dejá [DATO] para que lo complete yo."}]}, {"h": "5. Revisalo en voz alta", "pasos": ["Leé el guion en voz alta, de corrido, como si estuvieras grabando.", "Marcá cada lugar donde te trabás o donde decís \"esto no lo diría así\".", "Pegale a Claude solo esas partes y decile cómo lo dirías vos. Pedile que ajuste el resto para que combine.", "Si una corrección se repite (por ejemplo, siempre te cambia una palabra), sumala a tu ficha de voz."], "prompts": [{"t": "Ajuste después de leerlo", "c": "Leí el guion en voz alta. Estas partes no me salen naturales:\n[PEGÁ LAS FRASES]\nAsí lo diría yo: [CÓMO LO DIRÍAS].\nReescribí solo esas partes y ajustá lo que está alrededor para que suene igual. Después decime qué regla nueva conviene sumar a mi ficha de voz."}]}], "faq": [{"q": "¿Cuántos textos míos necesito?", "a": "Con 3 a 5 ya arranca bien. Lo importante es que sean textos hablados y variados, no cinco versiones del mismo tema."}, {"q": "¿Proyecto o estilo personalizado?", "a": "El proyecto sirve para guardar la ficha junto con tus ideas y guiones anteriores. El estilo cambia cómo escribe en cualquier chat. Podés usar los dos a la vez."}, {"q": "Me sigue saliendo genérico", "a": "Pasale más transcripciones reales y decile exactamente qué frase sonó a máquina. Las correcciones concretas le sirven más que \"hacelo más natural\"."}], "fuentes": ["https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects", "https://support.claude.com/en/articles/10185698-configuring-and-using-styles"], "cat": "contenido", "parte": "usalo"};</script>

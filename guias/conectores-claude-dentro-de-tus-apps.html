<script>var GUIA = {"slug": "conectores-claude-dentro-de-tus-apps", "t": "Conectores: Claude adentro de tu mail, tu agenda y tu Drive", "d": "Conectá Gmail, Google Calendar, Google Drive y otras apps para que Claude trabaje con tus datos reales. Y si tu herramienta no está, agregala como conector personalizado.", "tema": "Conectores y MCP", "min": 9, "fichaNombre": "Conectores", "ficha": [["Qué es", "Permisos para que Claude lea y use datos de tus apps desde el chat."], ["Necesitás", "Una cuenta en la app que querés conectar. Los conectores web están en todos los planes."], ["Qué no hace", "En Gmail no lee el contenido de los adjuntos, solo sus datos (nombre, tipo)."]], "secciones": [{"h": "Conectá tu primera app", "pasos": ["Desde un chat: tocá + abajo a la izquierda (o escribí /), pasá por Connectors y elegí Manage connectors.", "O desde la configuración: Customize → Connectors.", "Tocá el + al lado de Connectors, elegí la app y tocá Connect o Install.", "Iniciá sesión en la app y aceptá los permisos."], "p": ["Los nombres de los menús están como aparecen en la ayuda oficial de Claude (en inglés). Si tenés Claude en español, vas a ver la traducción en el mismo lugar.", "En Team y Enterprise, primero el dueño de la cuenta lo habilita en Organization settings → Connectors. Después cada persona conecta su propia cuenta."]}, {"h": "Qué puede hacer con Google", "lista": ["Gmail: buscar y leer mails, ver borradores, redactar, y también enviar, responder y reenviar. Por defecto te pide aprobación antes de cada envío.", "Google Calendar: ver tus eventos, crear, mover y borrar reuniones, buscar horarios libres en común y responder invitaciones.", "Google Drive: buscar y leer Docs, Sheets, Slides, PDF y archivos de Office; guardar archivos que arma Claude; compartir, mover o mandar a la papelera, con tu aprobación."]}, {"h": "Prendelos solo cuando los usás", "p": ["En cada chat podés elegir qué conectores están activos: + → Connectors y prendés o apagás cada uno. Las herramientas consumen bastante de tu límite, así que dejá prendido solo lo que necesitás."], "prompts": [{"t": "Resumen de la mañana", "c": "Con Gmail y Google Calendar:\n1. Decime qué reuniones tengo hoy, a qué hora y con quién.\n2. Listá los mails de las últimas 24 horas que necesitan respuesta mía (no promociones ni newsletters).\n3. Para los 3 más importantes, preparame un borrador de respuesta corto. No envíes nada."}, {"t": "Buscar en Drive", "c": "Buscá en mi Google Drive el documento más reciente sobre [TEMA] y haceme un resumen en 5 puntos, con lo que haya que decidir o hacer."}]}, {"h": "Conectores personalizados", "p": ["Si tu herramienta no está en el directorio pero tiene un servidor MCP remoto (una dirección web que le da acceso a Claude), la podés agregar. En el plan gratis podés tener uno."], "pasos": ["Andá a Customize → Connectors, tocá + Add y elegí Add custom connector.", "En Team y Enterprise este paso lo hace el owner, en Organization settings → Connectors: Add, pasá por Custom y elegí Web. Los miembros después buscan el conector (con la etiqueta Custom) en Customize → Connectors y tocan Connect.", "Poné un nombre y la URL del servidor MCP remoto. Tocá Continue, revisá la autenticación que detectó y tocá Continue otra vez.", "En Authentication elegí cómo inicia sesión: Sign in now, Sign in when needed o No sign in.", "Tocá Add y terminá la conexión."], "aviso": "Los conectores personalizados no están verificados por Anthropic. Agregá solo servidores de empresas o personas en las que confiás."}, {"h": "Si algo falla", "lista": ["Error con Google: Customize → Connectors, elegí el conector, Disconnect, y volvé a conectarlo.", "\"Access blocked\" en una cuenta de empresa de Google: el administrador de Google Workspace tiene que marcar la app de Claude como confiable.", "Claude no usa el conector: revisá que esté prendido en ese chat y nombralo en el pedido (\"buscá en mi Gmail...\")."]}], "faq": [{"q": "¿Claude puede borrar o mandar cosas sin preguntarme?", "a": "Puede modificar datos según los permisos de tu cuenta. En Gmail y Drive, por defecto te pide aprobación antes de enviar, compartir, mover o borrar. Leé siempre lo que te propone antes de aprobar."}, {"q": "¿Usan mis mails para entrenar a Claude?", "a": "Según la ayuda oficial, los datos de los conectores de Google no se usan para entrenar. Pero si en un plan personal aceptaste compartir tus chats para entrenamiento, lo que copies de esos datos a la conversación sí podría usarse."}, {"q": "¿Funciona en el celular?", "a": "Sí. Los conectores web andan en la web, la app de escritorio y las apps de iOS y Android. Instalarlos desde el celular todavía está en beta, así que conviene conectarlos desde la web o la app de escritorio. Los conectores personalizados se usan en la web, Cowork y Claude Desktop."}], "fuentes": ["https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities", "https://support.claude.com/en/articles/10166901", "https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work", "https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp", "https://support.claude.com/en/articles/10166901-use-google-workspace-connectors"], "ejemplo": {"titulo": "Ejemplo resuelto: un estudio contable que arranca el día con Gmail y Calendar", "negocio": "Ejemplo inventado: un estudio contable de tres personas en el barrio Cordón, Montevideo. Atiende a pymes y profesionales, y usa Google Workspace con el dominio del estudio.", "punto_de_partida": "La contadora titular empieza cada mañana revisando la bandeja y la agenda a mano. Los mails de clientes que piden un papel se mezclan con avisos automáticos y a veces quedan sin respuesta varios días.", "pasos": ["Como el estudio usa Google Workspace, el administrador de la cuenta entró a la consola de Google y marcó la app Claude como Trusted en Security → Access and data control → API controls → Manage third-party app access, para evitar el \"Access blocked\".", "Tienen plan Team, así que la owner agregó Gmail, Google Calendar y Google Drive en Organization settings → Connectors → Browse connectors → Add to your team.", "Cada persona del estudio entró a Customize → Connectors, eligió cada conector, tocó Connect e inició sesión con su cuenta del dominio.", "La titular probó en un chat el prompt \"Resumen de la mañana\" de la guía. Vio que Claude le pedía aprobación antes de crear algo y que no enviaba nada.", "Subió la skill resumen-del-dia del kit en Customize → Skills y la prendió. Desde ahí le alcanza con escribir \"resumen del día\".", "Para las semanas de vencimientos usa el pedido \"Mails sin responder de un cliente\" del kit con el dominio de cada cliente grande, y responde ella desde los borradores.", "En los chats donde no necesita Google apaga los conectores desde + → Connectors, como recomienda la guía."], "resultado": "Cada mañana la titular tiene en un chat la agenda del día, los mails que esperan respuesta y tres borradores listos en Gmail para revisar. Nada sale del estudio sin que una persona lo lea y lo envíe."}, "si_falla": [{"sintoma": "Al conectar Gmail o Drive aparece \"Access blocked: your institution's admin needs to review Claude for Google Drive\".", "solucion": "El administrador de Google Workspace tiene que ir a la consola de Google, Security → Access and data control → API controls → Manage third-party app access, agregar la app Claude y marcarla como Trusted. Después hay que esperar unos 15 minutos y volver a conectar."}, {"sintoma": "Aparece \"Please try again. You may need to reconnect with your Google Drive account\".", "solucion": "Andá a Customize → Connectors, abrí el conector de Google, tocá Disconnect y confirmá. Volvé a iniciar sesión la próxima vez que lo uses. Si sigue fallando, en myaccount.google.com/connections eliminá la conexión de Claude con Delete all connections y conectá de nuevo."}, {"sintoma": "En una cuenta Team o Enterprise no aparece el conector que querés.", "solucion": "Primero lo tiene que agregar un owner en Organization settings → Connectors → Browse connectors → Add to your team. Después cada persona lo conecta con su propia cuenta en Customize → Connectors."}, {"sintoma": "Un conector personalizado no conecta o se queda esperando.", "solucion": "Los conectores personalizados se conectan desde la nube de Anthropic, no desde tu computadora. Si el servidor está en una red privada, detrás de una VPN o de un firewall, quien lo administra tiene que permitir las direcciones IP de Anthropic. Revisá también que la URL sea la del servidor MCP (la que da la documentación de la herramienta) y no la de su página web."}, {"sintoma": "Claude dice que no puede ver el PDF que vino en un mail.", "solucion": "Es así: con Gmail solo ve los datos del adjunto (nombre, tipo), no su contenido. Descargalo y subilo al chat, o guardalo en Drive y pedile que lo lea desde ahí con el conector de Google Drive."}], "kit": [{"archivo": "resumen-del-dia/SKILL.md", "que_es": "Skill que arma el resumen del día con Google Calendar y Gmail y deja tres borradores sin enviar. Guardala en una carpeta resumen-del-dia, comprimila en ZIP y subila en Customize → Skills.", "contenido": "---\nname: resumen-del-dia\ndescription: Arma el resumen del día con Google Calendar y Gmail: reuniones, mails que piden respuesta y borradores sin enviar. Usala cuando pidan el resumen del día o qué hay hoy.\n---\n\n# Resumen del día\n\nArmás un resumen corto para empezar el día. Leés, ordenás y dejás borradores. Nunca enviás, respondés, aceptás invitaciones ni movés nada.\n\n## Antes de empezar\n\n- Necesitás los conectores de Google Calendar y Gmail prendidos en este chat. Si alguno no está, decilo en una línea y seguí con el que haya.\n- La zona horaria es la del calendario de la persona.\n\n## Pasos\n\n1. Calendar: listá los eventos de hoy en orden, con hora de inicio, título y con quién. Marcá los que se superponen.\n2. Para cada reunión con gente de afuera, buscá en Gmail el último mail con esas personas y resumilo en una línea.\n3. Gmail: buscá los mails de las últimas 24 horas que esperan respuesta de la persona. Dejá afuera promociones, newsletters, notificaciones automáticas y mails donde está solo en copia.\n4. Ordenalos así: primero clientes, después proveedores, después el resto. Dentro de cada grupo, el más viejo primero.\n5. Para los tres primeros, creá un borrador de respuesta corto en Gmail. Si para responder hace falta un dato que no está en el mail, no lo inventes: dejá [COMPLETAR: qué falta] dentro del borrador.\n6. Si un mail trae adjuntos, aclará que no podés ver su contenido, solo el nombre y el tipo.\n\n## Formato\n\n**Hoy, [FECHA]**\n\nReuniones\n- [HORA] [TÍTULO] con [PERSONAS]. Contexto: [UNA LÍNEA]\n\nMails que piden respuesta\n1. [REMITENTE]: [ASUNTO]. Qué pide: [UNA LÍNEA]. Borrador: sí / no\n\nPara decidir hoy\n- [LO QUE NO PUEDE ESPERAR, SI HAY]\n\n## Reglas\n\n- No envíes nada. Los borradores quedan en Gmail para que la persona los revise.\n- Si Claude te pide aprobación para crear un borrador, explicá en una línea qué vas a crear.\n- No copies al resumen datos sensibles que no hagan falta (números de cuenta, contraseñas, documentos).\n"}, {"archivo": "pedidos-seguros-conectores-google.md", "que_es": "Pack de pedidos para Gmail, Google Calendar y Google Drive que solo leen o dejan borradores, listos para copiar y completar.", "contenido": "# Pedidos seguros para conectores de Google\n\nPedidos para copiar y pegar en un chat con Gmail, Google Calendar y Google Drive prendidos. Todos leen o dejan borradores. Ninguno envía ni borra.\n\nAntes de usarlos: + → Connectors en el chat, prendé solo los que pide cada pedido y apagá el resto.\n\n## Gmail\n\n### Mails sin responder de un cliente\nBuscá en mi Gmail los mails de [CLIENTE O DOMINIO] de los últimos [N] días que no respondí. Listalos con fecha, asunto y qué me piden. No respondas nada.\n\n### Borrador con lo que ya hablamos\nLeé el hilo más reciente con [PERSONA] sobre [TEMA] y armá un borrador de respuesta que [OBJETIVO: confirme la fecha / pida el dato que falta / proponga dos horarios]. Dejalo como borrador en Gmail. No lo envíes.\n\n### Ordenar la bandeja de la semana\nListá los mails de esta semana que tienen una tarea para mí. Agrupalos en \"responder\", \"pagar o cobrar\" y \"leer después\". No archives, no marques ni muevas nada.\n\n## Google Calendar\n\n### Huecos para una reunión\nBuscá en mi Google Calendar tres horarios libres de [DURACIÓN] entre [DÍA] y [DÍA], de [HORA] a [HORA]. Solo listalos. No crees el evento todavía.\n\n### Preparar la semana\nListá mis reuniones de la semana que viene. Para cada una, decime si tiene un documento o un mail relacionado y qué tendría que llevar preparado.\n\n## Google Drive\n\n### Encontrar la última versión\nBuscá en mi Google Drive los archivos sobre [TEMA] modificados en los últimos [N] días. Decime cuál parece la versión final y por qué. No muevas ni compartas nada.\n\n### Resumen de una planilla\nAbrí la planilla [NOMBRE] de mi Google Drive y resumime [QUÉ: ventas por mes / pagos pendientes / stock bajo]. Si una columna no se entiende, preguntame antes de calcular.\n\n## Combinados\n\n### De mail a reunión\nLeé el último mail de [PERSONA] donde pide reunirse. Buscá en mi calendario dos horarios libres que le sirvan según lo que dice y armá un borrador de respuesta proponiéndolos. No crees el evento ni envíes el mail.\n\n### Seguimiento de propuestas\nBuscá en Drive las propuestas que mandé este mes (archivos con \"propuesta\" en el nombre). Para cada una, buscá en Gmail si el cliente respondió. Armá una tabla: cliente, fecha de envío, respondió sí o no, próximo paso.\n\n## Regla para todos\n\nCuando Claude te pida aprobación para enviar, compartir, mover o borrar, leé exactamente qué va a hacer antes de aprobar. Si no pediste esa acción, rechazala. Tené cuidado con la opción de aprobar siempre: la ayuda oficial pide usarla con cuidado.\n"}], "verificada": "2026-11-08", "cat": "conectores", "parte": "usalo"};</script>
